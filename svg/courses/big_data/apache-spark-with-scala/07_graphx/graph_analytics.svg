<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="290" height="284.727273" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="82.181818" text-anchor="middle" font-family="Arial" font-size="22.592034" font-weight="bold" fill="var(--primary-text)">PageRank</text>
  <circle cx="100" cy="156" r="14.376749" fill="#fff"/>
  <circle cx="185" cy="134.909091" r="22.592034" fill="#fff"/>
  <circle cx="270" cy="156" r="10.269106" fill="#fff"/>
  <circle cx="140" cy="219.272727" r="12.322928" fill="#fff"/>
  <circle cx="230" cy="219.272727" r="18.484391" fill="#fff"/>
  <line x1="110" y1="158.109091" x2="167" y2="140.181818" stroke="#fff" stroke-width="1.5"/>
  <line x1="207" y1="140.181818" x2="260" y2="156" stroke="#fff" stroke-width="1.5"/>
  <line x1="150" y1="214" x2="175" y2="156" stroke="#fff" stroke-width="1.5"/>
  <line x1="218" y1="206.618182" x2="195" y2="158.109091" stroke="#fff" stroke-width="1.5"/>
  <text x="185" y="277.272727" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--primary-text)">rank by inbound influence</text>
  <text x="185" y="303.636364" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--primary-text)">g.pageRank(0.0001)</text>

  <rect x="350" y="40" width="290" height="284.727273" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="495" y="82.181818" text-anchor="middle" font-family="Arial" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">Triangle Count</text>
  <polygon points="495,134.909091 430,229.818182 560,229.818182" fill="none" stroke="#fff" stroke-width="2.5"/>
  <circle cx="495" cy="134.909091" r="12.322928" fill="#fff"/>
  <circle cx="430" cy="229.818182" r="12.322928" fill="#fff"/>
  <circle cx="560" cy="229.818182" r="12.322928" fill="#fff"/>
  <text x="495" y="277.272727" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--ok-text)">count closed triads per vertex</text>
  <text x="495" y="303.636364" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--ok-text)">g.triangleCount()</text>

  <rect x="660" y="40" width="290" height="284.727273" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="805" y="82.181818" text-anchor="middle" font-family="Arial" font-size="20.538213" font-weight="bold" fill="var(--warn-text)">Connected Components</text>
  <circle cx="720" cy="156" r="12.322928" fill="#fff"/>
  <circle cx="770" cy="187.636364" r="12.322928" fill="#fff"/>
  <circle cx="720" cy="229.818182" r="12.322928" fill="#fff"/>
  <line x1="720" y1="168.654545" x2="720" y2="217.163636" stroke="#fff" stroke-width="2"/>
  <line x1="732" y1="162.327273" x2="760" y2="181.309091" stroke="#fff" stroke-width="2"/>
  <line x1="732" y1="223.490909" x2="760" y2="193.963636" stroke="#fff" stroke-width="2"/>

  <circle cx="870" cy="166.545455" r="12.322928" fill="#fff" opacity="0.7"/>
  <circle cx="900" cy="219.272727" r="12.322928" fill="#fff" opacity="0.7"/>
  <line x1="878" y1="176.036364" x2="895" y2="207.672727" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <text x="805" y="277.272727" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--warn-text)">label propagation to min id</text>
  <text x="805" y="303.636364" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--warn-text)">g.connectedComponents()</text>

  <rect x="970" y="40" width="270" height="284.727273" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="82.181818" text-anchor="middle" font-family="Arial" font-size="22.592034" font-weight="bold" fill="var(--info-text)">SSSP</text>
  <circle cx="1020" cy="187.636364" r="14.376749" fill="#fff"/>
  <text x="1020" y="192.909091" text-anchor="middle" font-family="Arial" font-size="10.269106" font-weight="bold" fill="var(--info-border)">0</text>
  <circle cx="1105" cy="156" r="14.376749" fill="#fff"/>
  <text x="1105" y="161.272727" text-anchor="middle" font-family="Arial" font-size="10.269106" font-weight="bold" fill="var(--info-border)">3</text>
  <circle cx="1190" cy="187.636364" r="14.376749" fill="#fff"/>
  <text x="1190" y="192.909091" text-anchor="middle" font-family="Arial" font-size="10.269106" font-weight="bold" fill="var(--info-border)">7</text>
  <circle cx="1105" cy="240.363636" r="14.376749" fill="#fff"/>
  <text x="1105" y="245.636364" text-anchor="middle" font-family="Arial" font-size="10.269106" font-weight="bold" fill="var(--info-border)">5</text>
  <line x1="1033" y1="182.363636" x2="1091" y2="161.272727" stroke="#fff" stroke-width="2"/>
  <line x1="1119" y1="161.272727" x2="1177" y2="182.363636" stroke="#fff" stroke-width="2"/>
  <line x1="1030" y1="198.181818" x2="1093" y2="234.036364" stroke="#fff" stroke-width="2"/>
  <text x="1105" y="287.818182" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--info-text)">shortest path from source</text>
  <text x="1105" y="308.909091" text-anchor="middle" font-family="monospace" font-size="12.322928" fill="var(--info-text)">via Pregel</text>

  <rect x="40" y="366.909091" width="1200" height="253.090909" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="409.090909" text-anchor="middle" font-family="Arial" font-size="20.538213" font-weight="bold" fill="var(--text)">When to use which</text>
  <text x="180" y="461.818182" text-anchor="middle" font-family="Arial" font-size="14.376749" fill="var(--primary-border)" font-weight="bold">PageRank</text>
  <text x="180" y="488.181818" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">influence, ranking</text>
  <text x="180" y="509.272727" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">recommendations</text>

  <text x="460" y="461.818182" text-anchor="middle" font-family="Arial" font-size="14.376749" fill="var(--ok-border)" font-weight="bold">Triangle Count</text>
  <text x="460" y="488.181818" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">community detection</text>
  <text x="460" y="509.272727" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">clustering coefficient</text>

  <text x="780" y="461.818182" text-anchor="middle" font-family="Arial" font-size="14.376749" fill="var(--warn-border)" font-weight="bold">Connected Components</text>
  <text x="780" y="488.181818" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">fraud rings</text>
  <text x="780" y="509.272727" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">entity resolution</text>

  <text x="1100" y="461.818182" text-anchor="middle" font-family="Arial" font-size="14.376749" fill="var(--info-border)" font-weight="bold">SSSP</text>
  <text x="1100" y="488.181818" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">routing, logistics</text>
  <text x="1100" y="509.272727" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">reachability</text>

  <text x="640" y="577.818182" text-anchor="middle" font-family="Arial" font-size="13.349838" fill="var(--text-muted)">All four ship built-in under org.apache.spark.graphx.lib</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.514591494905" font-weight="bold" fill="var(--text)">PageRank Iteration</text>

  <rect x="40" y="93.703703703704" width="372.413793103448" height="279.259259259259" rx="8.432740427116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206896551724" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--primary-text)">1. Send</text>
  <text x="226.206896551724" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--primary-text)">Each vertex splits rank</text>
  <text x="226.206896551724" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--primary-text)">across outgoing edges</text>
  <text x="226.206896551724" y="270.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--primary-text)">send(v→u) = rank(v)/outDeg(v)</text>
  <text x="226.206896551724" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--primary-text)">Dangling nodes lose rank</text>

  <rect x="453.793103448276" y="93.703703703704" width="372.413793103448" height="279.259259259259" rx="8.432740427116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--ok-text)">2. Aggregate</text>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--ok-text)">Sum incoming fragments</text>
  <text x="640" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" fill="var(--ok-text)">inbox(u) = Σ send(v→u)</text>
  <text x="640" y="287.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--ok-text)">aggregateMessages API</text>
  <text x="640" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--ok-text)">One shuffle per iteration</text>

  <rect x="867.586206896552" y="93.703703703704" width="372.413793103448" height="279.259259259259" rx="8.432740427116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.793103448276" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--warn-text)">3. Update</text>
  <text x="1053.793103448276" y="190.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--warn-text)">rank' = (1-d)/N + d·inbox</text>
  <text x="1053.793103448276" y="244.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--warn-text)">d = damping ≈ 0.85</text>
  <text x="1053.793103448276" y="292.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--warn-text)">Converge when Δ &lt; tol</text>
  <text x="1053.793103448276" y="335.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--warn-text)">~20-40 iterations</text>

  <rect x="40" y="426.666666666667" width="1200" height="193.333333333333" rx="8.432740427116" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="464.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--text)">GraphX API</text>
  <text x="71.034482758621" y="507.222222222222" font-family="Courier New, monospace" font-size="15.811388300842" fill="var(--text)">graph.pageRank(tol = 0.0001).vertices</text>
  <text x="71.034482758621" y="544.814814814815" font-family="Courier New, monospace" font-size="15.811388300842" fill="var(--text)">graph.staticPageRank(numIter = 20).vertices</text>
  <text x="71.034482758621" y="593.148148148148" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--text-muted)">Static variant: fixed iterations, cheaper and deterministic</text>
</svg>

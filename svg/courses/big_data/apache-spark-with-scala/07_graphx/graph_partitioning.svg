    <rect x="0" y="-23.272727" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.9"/>
    <rect x="50" y="-23.272727" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.4"/>
    <rect x="100" y="-23.272727" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.7"/>
    <rect x="150" y="-23.272727" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.2"/>
    <rect x="0" y="29.454545" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.4"/>
    <rect x="50" y="29.454545" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.9"/>
    <rect x="100" y="29.454545" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.2"/>
    <rect x="150" y="29.454545" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.7"/>
    <rect x="0" y="82.181818" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.7"/>
    <rect x="50" y="82.181818" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.2"/>
    <rect x="100" y="82.181818" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.9"/>
    <rect x="150" y="82.181818" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.4"/>
    <rect x="0" y="134.909091" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.2"/>
    <rect x="50" y="134.909091" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.7"/>
    <rect x="100" y="134.909091" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.4"/>
    <rect x="150" y="134.909091" width="50" height="52.727273" fill="var(--bg)" fill-opacity="0.9"/>
  </g>

  <rect x="350" y="40" width="290" height="274.181818" rx="6.161464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="76.909091" text-anchor="middle" font-size="18.484391" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">RandomVertexCut</text>
  <g transform="translate(395 125)">
    <rect x="16.7847" y="0.148351" width="16.4306" height="16.4306" rx="8.21528" fill="var(--bg)"/>
    <rect x="66.7847" y="-5.12438" width="16.4306" height="16.4306" rx="8.21528" fill="var(--bg)"/>
    <rect x="116.785" y="10.6938" width="16.4306" height="16.4306" rx="8.21528" fill="var(--bg)"/>
    <rect x="166.785" y="0.148351" width="16.4306" height="16.4306" rx="8.21528" fill="var(--bg)"/>
    <rect x="21.7847" y="63.4211" width="16.4306" height="16.4306" rx="8.21528" fill="var(--bg)"/>
    <rect x="91.7847" y="73.9665" width="16.4306" height="16.4306" rx="8.21528" fill="var(--bg)"/>
    <rect x="151.785" y="63.4211" width="16.4306" height="16.4306" rx="8.21528" fill="var(--bg)"/>
    <rect x="51.7847" y="126.694" width="16.4306" height="16.4306" rx="8.21528" fill="var(--bg)"/>
    <rect x="121.785" y="126.694" width="16.4306" height="16.4306" rx="8.21528" fill="var(--bg)"/>
    <line x1="25" y1="16.8" x2="75" y2="11.527273" stroke="var(--bg)" stroke-width="1.5"/>
    <line x1="75" y1="11.527273" x2="125" y2="27.345455" stroke="var(--bg)" stroke-width="1.5"/>
    <line x1="25" y1="16.8" x2="30" y2="63.2" stroke="var(--bg)" stroke-width="1.5"/>
    <line x1="100" y1="82.181818" x2="60" y2="126.472727" stroke="var(--bg)" stroke-width="1.5"/>
    <line x1="175" y1="16.8" x2="160" y2="63.2" stroke="var(--bg)" stroke-width="1.5"/>
    <line x1="130" y1="134.909091" x2="160" y2="80.072727" stroke="var(--bg)" stroke-width="1.5"/>
  </g>
  <text x="495" y="298.363636" text-anchor="middle" font-size="12.322928" fill="var(--ok-text)" font-family="Arial, sans-serif">edge hashed by (src, dst)</text>

  <rect x="660" y="40" width="290" height="274.181818" rx="6.161464" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="74.8" text-anchor="middle" font-size="16.43057" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">CanonicalRandomVertexCut</text>
  <g transform="translate(700 125)">
    <rect x="29.7309" y="8.63998" width="20.5382" height="20.5382" rx="10.2691" fill="var(--bg)"/>
    <text x="40" y="23.127273" text-anchor="middle" font-size="10.269106" font-weight="bold" fill="var(--warn-border)" font-family="Arial, sans-serif">A</text>
    <rect x="159.731" y="8.63998" width="20.5382" height="20.5382" rx="10.2691" fill="var(--bg)"/>
    <text x="170" y="23.127273" text-anchor="middle" font-size="10.269106" font-weight="bold" fill="var(--warn-border)" font-family="Arial, sans-serif">B</text>
    <path d="M 50 13.636364 Q 105 -12.727273 160 13.636364" stroke="var(--bg)" stroke-width="2" fill="none"/>
    <path d="M 50 24.181818 Q 105 55.818182 160 24.181818" stroke="var(--bg)" stroke-width="2" fill="none"/>
    <text x="105" y="98" text-anchor="middle" font-size="11.296017" fill="var(--bg)" font-family="Arial, sans-serif">A to B and B to A</text>
    <text x="105" y="119.090909" text-anchor="middle" font-size="11.296017" fill="var(--bg)" font-family="Arial, sans-serif">land on same partition</text>
  </g>
  <text x="805" y="298.363636" text-anchor="middle" font-size="12.322928" fill="var(--warn-text)" font-family="Arial, sans-serif">canonical: min/max of (src,dst)</text>

  <rect x="970" y="40" width="270" height="274.181818" rx="6.161464" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="76.909091" text-anchor="middle" font-size="18.484391" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">EdgePartition1D</text>
  <g transform="translate(1000 125)">
    <rect x="0" y="-23.272727" width="50" height="158.181818" fill="var(--bg)" fill-opacity="0.9"/>
    <rect x="55" y="-23.272727" width="50" height="158.181818" fill="var(--bg)" fill-opacity="0.5"/>
    <rect x="110" y="-23.272727" width="50" height="158.181818" fill="var(--bg)" fill-opacity="0.7"/>
    <rect x="165" y="-23.272727" width="50" height="158.181818" fill="var(--bg)" fill-opacity="0.3"/>
    <text x="25" y="66.363636" text-anchor="middle" font-size="14.376749" font-weight="bold" fill="var(--info-border)" font-family="Arial, sans-serif">P0</text>
    <text x="80" y="66.363636" text-anchor="middle" font-size="14.376749" font-weight="bold" fill="var(--info-border)" font-family="Arial, sans-serif">P1</text>
    <text x="135" y="66.363636" text-anchor="middle" font-size="14.376749" font-weight="bold" fill="var(--info-border)" font-family="Arial, sans-serif">P2</text>
    <text x="190" y="66.363636" text-anchor="middle" font-size="14.376749" font-weight="bold" fill="var(--info-border)" font-family="Arial, sans-serif">P3</text>
  </g>
  <text x="1105" y="298.363636" text-anchor="middle" font-size="12.322928" fill="var(--info-text)" font-family="Arial, sans-serif">partition by src id only</text>

  <rect x="40" y="356.363636" width="1200" height="263.636364" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="393.272727" text-anchor="middle" font-size="18.484391" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Choosing a PartitionStrategy</text>

  <line x1="60" y1="414.363636" x2="1220" y2="414.363636" stroke="var(--border)" stroke-width="1"/>
  <text x="200" y="446" text-anchor="middle" font-size="14.376749" fill="var(--primary-border)" font-weight="bold" font-family="Arial, sans-serif">2D</text>
  <text x="200" y="472.363636" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">bounded vtx replication</text>
  <text x="200" y="493.454545" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">2*sqrt(P) per vertex</text>
  <text x="200" y="514.545455" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">default, best overall</text>

  <text x="475" y="446" text-anchor="middle" font-size="14.376749" fill="var(--ok-border)" font-weight="bold" font-family="Arial, sans-serif">RandomVertexCut</text>
  <text x="475" y="472.363636" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">even edge distribution</text>
  <text x="475" y="493.454545" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">parallel A to B split</text>
  <text x="475" y="514.545455" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">dense random graphs</text>

  <text x="790" y="446" text-anchor="middle" font-size="14.376749" fill="var(--warn-border)" font-weight="bold" font-family="Arial, sans-serif">Canonical</text>
  <text x="790" y="472.363636" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">co-locates both dirs</text>
  <text x="790" y="493.454545" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">undirected workloads</text>
  <text x="790" y="514.545455" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">groupEdges friendly</text>

  <text x="1080" y="446" text-anchor="middle" font-size="14.376749" fill="var(--info-border)" font-weight="bold" font-family="Arial, sans-serif">EdgePartition1D</text>
  <text x="1080" y="472.363636" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">all out-edges together</text>
  <text x="1080" y="493.454545" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">skew risk for hubs</text>
  <text x="1080" y="514.545455" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)" font-family="Arial, sans-serif">rarely optimal</text>

  <text x="640" y="577.818182" text-anchor="middle" font-size="13.349838" fill="var(--text)" font-family="Courier New, monospace">graph.partitionBy(PartitionStrategy.EdgePartition2D)</text>
</svg>

  <text x="1105" y="298.363636" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--info-text)">partition by src id only</text>

  <rect x="40" y="356.363636" width="1200" height="263.636364" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="393.272727" text-anchor="middle" font-family="Arial" font-size="18.484391" font-weight="bold" fill="var(--text)">Choosing a PartitionStrategy</text>

  <line x1="60" y1="414.363636" x2="1220" y2="414.363636" stroke="var(--border)" stroke-width="1"/>
  <text x="200" y="446" text-anchor="middle" font-family="Arial" font-size="14.376749" fill="var(--primary-border)" font-weight="bold">2D</text>
  <text x="200" y="472.363636" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">bounded vtx replication</text>
  <text x="200" y="493.454545" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">2*sqrt(P) per vertex</text>
  <text x="200" y="514.545455" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)" font-weight="bold">default, best overall</text>

  <text x="475" y="446" text-anchor="middle" font-family="Arial" font-size="14.376749" fill="var(--ok-border)" font-weight="bold">RandomVertexCut</text>
  <text x="475" y="472.363636" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">even edge distribution</text>
  <text x="475" y="493.454545" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">parallel A to B split</text>
  <text x="475" y="514.545455" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">dense random graphs</text>

  <text x="790" y="446" text-anchor="middle" font-family="Arial" font-size="14.376749" fill="var(--warn-border)" font-weight="bold">Canonical</text>
  <text x="790" y="472.363636" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">co-locates both dirs</text>
  <text x="790" y="493.454545" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">undirected workloads</text>
  <text x="790" y="514.545455" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">groupEdges friendly</text>

  <text x="1080" y="446" text-anchor="middle" font-family="Arial" font-size="14.376749" fill="var(--info-border)" font-weight="bold">EdgePartition1D</text>
  <text x="1080" y="472.363636" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">all out-edges together</text>
  <text x="1080" y="493.454545" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">skew risk for hubs</text>
  <text x="1080" y="514.545455" text-anchor="middle" font-family="Arial" font-size="12.322928" fill="var(--text-muted)">rarely optimal</text>

  <text x="640" y="577.818182" text-anchor="middle" font-family="monospace" font-size="13.349838" fill="var(--text)">graph.partitionBy(PartitionStrategy.EdgePartition2D)</text>

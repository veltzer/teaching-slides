<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <!-- Left: graph with sendMsg along edges -->
  <rect x="40" y="40" width="560" height="580" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="77.592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--text)">Step 1: sendMsg along edges</text>

  <rect x="98.545" y="148.915" width="82.91" height="82.91" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="196.814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--primary-text)">A=5</text>
  <rect x="98.545" y="385.212" width="82.91" height="82.91" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="433.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--primary-text)">B=3</text>
  <rect x="438.545" y="267.064" width="82.91" height="82.91" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="314.962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--ok-text)">C=?</text>

  <line x1="180" y1="206.481481" x2="440" y2="292.407407" stroke="var(--warn-border)" stroke-width="2.5" marker-end="url(#arrow-warn)"/>
  <line x1="180" y1="410.555556" x2="440" y2="324.62963" stroke="var(--warn-border)" stroke-width="2.5" marker-end="url(#arrow-warn)"/>
  <text x="290" y="233.333333" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-accent)" font-weight="bold">msg=5</text>
  <text x="290" y="399.814815" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-accent)" font-weight="bold">msg=3</text>

  <text x="320" y="555.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">each triplet emits to src and/or dst</text>
  <text x="320" y="582.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-muted)">ctx.sendToDst(srcAttr)</text>

  <!-- Right: merge -->
  <rect x="640" y="40" width="600" height="580" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="77.592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--text)">Step 2: mergeMsg at vertex</text>

  <rect x="700" y="125.925926" width="480" height="85.925926" rx="6.218253" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="163.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--warn-text)">incoming at C: { 5, 3 }</text>
  <text x="940" y="190.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">mergeMsg(a,b) =&gt; a+b</text>

  <rect x="700" y="265.555556" width="480" height="85.925926" rx="6.218253" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="303.148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--ok-text)">reduced message: 8</text>
  <text x="940" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">one value per destination vertex</text>

  <rect x="700" y="405.185185" width="480" height="193.333333" rx="6.218253" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="940" y="442.777778" text-anchor="middle" font-size="16.582007" font-weight="bold" fill="var(--primary-fill)" font-family="Courier New, monospace">graph.aggregateMessages[Int](</text>
  <text x="940" y="475" text-anchor="middle" font-size="14.509256" fill="var(--bg)" font-family="Courier New, monospace">ctx =&gt; ctx.sendToDst(ctx.srcAttr),</text>
  <text x="940" y="507.222222" text-anchor="middle" font-size="14.509256" fill="var(--bg)" font-family="Courier New, monospace">(a, b) =&gt; a + b</text>
  <text x="940" y="539.444444" text-anchor="middle" font-size="16.582007" font-weight="bold" fill="var(--primary-fill)" font-family="Courier New, monospace">)</text>
  <text x="940" y="577.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-faint)">returns VertexRDD of reduced messages</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="290" height="270" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">mapVertices</text>
  <text x="185" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">transform each</text>
  <text x="185" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">attribute</text>
  <text x="185" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">(id,a) =&gt; b</text>

  <rect x="350" y="40" width="290" height="270" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="495" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">joinVertices</text>
  <text x="495" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">merge external</text>
  <text x="495" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">RDD by id</text>
  <text x="495" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">inner join</text>

  <rect x="660" y="40" width="290" height="270" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="805" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">aggregateMessages</text>
  <text x="805" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">collect from</text>
  <text x="805" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">neighbors</text>
  <text x="805" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">sendMsg + mergeMsg</text>

  <rect x="970" y="40" width="270" height="270" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">subgraph</text>
  <text x="1105" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">filter vertices</text>
  <text x="1105" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">and edges</text>
  <text x="1105" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">new Graph</text>

  <rect x="40" y="340" width="1200" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">VertexRDD is the core abstraction</text>
  <text x="640" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Indexed by VertexId for fast join.</text>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">All ops return a new Graph; fully immutable.</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">org.apache.spark.graphx.Graph</text>
</svg>

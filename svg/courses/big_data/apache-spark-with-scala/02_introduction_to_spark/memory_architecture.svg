<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <rect x="40" y="40" width="290" height="450" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Execution</text>
  <text x="185" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Shuffle, join,</text>
  <text x="185" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">sort, aggregation</text>
  <text x="185" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Buffers here</text>
  <text x="185" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Short-lived</text>
  <text x="185" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Spills to disk</text>
  <text x="185" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">when full</text>
  <text x="185" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Shared with storage</text>

  <rect x="340" y="40" width="290" height="450" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Storage</text>
  <text x="485" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Cached RDDs</text>
  <text x="485" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">and DataFrames</text>
  <text x="485" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Broadcast vars</text>
  <text x="485" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">live here too</text>
  <text x="485" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">LRU eviction</text>
  <text x="485" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">under pressure</text>
  <text x="485" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Unified region</text>

  <rect x="640" y="40" width="290" height="450" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">User</text>
  <text x="785" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">UDFs, Python</text>
  <text x="785" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">objects, code</text>
  <text x="785" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Data structures</text>
  <text x="785" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Spark does not</text>
  <text x="785" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">manage or spill</text>
  <text x="785" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">OOM if abused</text>
  <text x="785" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">~40% by default</text>

  <rect x="940" y="40" width="300" height="450" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Reserved</text>
  <text x="1090" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">300 MB for</text>
  <text x="1090" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">internal needs</text>
  <text x="1090" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Safety cushion</text>
  <text x="1090" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">before OOM</text>
  <text x="1090" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Off-heap optional</text>
  <text x="1090" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Tungsten native</text>
  <text x="1090" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Overhead extra</text>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Unified memory model (Spark 1.6+)</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Execution and storage share one pool; execution evicts storage under pressure.</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Tune spark.memory.fraction and storageFraction only when metrics justify it.</text>
</svg>

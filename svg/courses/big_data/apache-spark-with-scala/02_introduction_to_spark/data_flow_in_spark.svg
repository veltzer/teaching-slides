<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="220" height="186.037735849057" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="83.77358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--primary-text)">1. Source</text>
  <text x="150" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">HDFS, S3, Kafka</text>
  <text x="150" y="151.622641509433" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">JDBC, Delta</text>
  <text x="150" y="187.735849056603" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--primary-text)">spark.read</text>

  <rect x="290" y="40" width="220" height="186.037735849057" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="83.77358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--info-text)">2. Partitions</text>
  <text x="400" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Split into chunks</text>
  <text x="400" y="151.622641509433" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Spread to executors</text>
  <text x="400" y="187.735849056603" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Unit of parallelism</text>

  <rect x="540" y="40" width="220" height="186.037735849057" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="83.77358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--warn-text)">3. Transforms</text>
  <text x="650" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">map, filter, join</text>
  <text x="650" y="151.622641509433" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">groupBy, agg</text>
  <text x="650" y="187.735849056603" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Lazy, build DAG</text>

  <rect x="790" y="40" width="220" height="186.037735849057" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="83.77358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--ok-text)">4. Action</text>
  <text x="900" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">count, collect</text>
  <text x="900" y="151.622641509433" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">show, save</text>
  <text x="900" y="187.735849056603" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Triggers execution</text>

  <rect x="1040" y="40" width="200" height="186.037735849057" rx="8.368855109814" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="83.77358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.922137774535" font-weight="bold" fill="var(--danger-text)">5. Sink</text>
  <text x="1140" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--danger-text)">Parquet, Delta</text>
  <text x="1140" y="151.622641509433" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--danger-text)">Kafka, JDBC</text>
  <text x="1140" y="187.735849056603" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--danger-text)">df.write</text>

  <line x1="260" y1="133.018867924528" x2="290" y2="133.018867924528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="510" y1="133.018867924528" x2="540" y2="133.018867924528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="760" y1="133.018867924528" x2="790" y2="133.018867924528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1010" y1="133.018867924528" x2="1040" y2="133.018867924528" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <text x="640" y="280.754716981132" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.106565329441" font-weight="bold" fill="var(--text)">Catalyst Optimizer Pipeline</text>

  <rect x="40" y="308.11320754717" width="220" height="311.88679245283" rx="8.368855109814" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="351.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--primary-accent)">Unresolved</text>
  <text x="150" y="390.188679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Parsed SQL / DSL</text>
  <text x="150" y="420.830188679246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">No types yet</text>
  <text x="150" y="451.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Resolve via Catalog</text>

  <rect x="280" y="308.11320754717" width="220" height="311.88679245283" rx="8.368855109814" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="390" y="351.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--info-accent)">Logical</text>
  <text x="390" y="390.188679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Predicate pushdown</text>
  <text x="390" y="420.830188679246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Constant folding</text>
  <text x="390" y="451.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Column pruning</text>

  <rect x="520" y="308.11320754717" width="220" height="311.88679245283" rx="8.368855109814" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="630" y="351.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--warn-accent)">Physical</text>
  <text x="630" y="390.188679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Cost-based</text>
  <text x="630" y="420.830188679246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Broadcast vs SMJ</text>
  <text x="630" y="451.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">HashAggregate</text>

  <rect x="760" y="308.11320754717" width="220" height="311.88679245283" rx="8.368855109814" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="870" y="351.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--ok-accent)">Codegen</text>
  <text x="870" y="390.188679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Tungsten engine</text>
  <text x="870" y="420.830188679246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Fused operators</text>
  <text x="870" y="451.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Runtime bytecode</text>

  <rect x="1000" y="308.11320754717" width="240" height="311.88679245283" rx="8.368855109814" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1120" y="351.88679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--danger-accent)">AQE</text>
  <text x="1120" y="390.188679245283" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Adaptive Query</text>
  <text x="1120" y="420.830188679246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Re-plans at runtime</text>
  <text x="1120" y="451.471698113207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--text-muted)">Spark 3.0+</text>
</svg>

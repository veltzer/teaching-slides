<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Distributed Processing with Spark</text>

  <rect x="540" y="90" width="200" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Driver</text>
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">SparkContext</text>
  <text x="640" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">DAGScheduler</text>

  <rect x="540" y="210" width="200" height="60" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Cluster Manager</text>
  <text x="640" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">YARN / K8s / Standalone</text>

  <line x1="640" y1="180" x2="640" y2="208" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="330" width="240" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="200" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Executor 1</text>
  <text x="200" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Task</text>
  <text x="200" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Task</text>
  <text x="200" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Cache partitions</text>
  <text x="200" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Block manager</text>
  <text x="200" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">JVM</text>

  <rect x="340" y="330" width="240" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="460" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Executor 2</text>
  <text x="460" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Task</text>
  <text x="460" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Task</text>
  <text x="460" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Cache partitions</text>
  <text x="460" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Block manager</text>
  <text x="460" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">JVM</text>

  <rect x="600" y="330" width="240" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="720" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Executor 3</text>
  <text x="720" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Task</text>
  <text x="720" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Task</text>
  <text x="720" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Cache partitions</text>
  <text x="720" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Block manager</text>
  <text x="720" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">JVM</text>

  <rect x="860" y="330" width="240" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="980" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Executor N</text>
  <text x="980" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Task</text>
  <text x="980" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Task</text>
  <text x="980" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Cache partitions</text>
  <text x="980" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Block manager</text>
  <text x="980" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">JVM</text>

  <line x1="600" y1="250" x2="220" y2="328" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="260" x2="460" y2="328" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="260" x2="720" y2="328" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="250" x2="960" y2="328" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="530" width="1100" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="630" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">Key ideas</text>
  <text x="100" y="585" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Driver holds the SparkContext and plans the job as a DAG. Executors run tasks in parallel on worker nodes.</text>
  <text x="100" y="605" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Data is split into partitions; one task processes one partition. More partitions means more parallelism up to core count.</text>
</svg>

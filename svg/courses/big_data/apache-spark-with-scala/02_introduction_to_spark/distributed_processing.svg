  <rect x="40" y="521.509444197223" width="1200" height="98.490555802777" rx="6.249528258673" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="554.339665628337" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.389387858369" font-weight="bold" fill="var(--text)">Key ideas</text>
  <text x="61.8182" y="581.698165405838" font-family="Arial, sans-serif" font-size="14.20413614392" fill="var(--text-muted)">Driver holds the SparkContext and plans the job as a DAG. Executors run tasks in parallel on worker nodes.</text>
  <text x="61.8182" y="603.584943529725" font-family="Arial, sans-serif" font-size="14.20413614392" fill="var(--text-muted)">Data is split into partitions; one task processes one partition. More partitions means more parallelism up to core count.</text>

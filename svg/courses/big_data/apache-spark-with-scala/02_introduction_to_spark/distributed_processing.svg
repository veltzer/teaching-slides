<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="650.9091" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0779" font-weight="bold" fill="var(--text)">Distributed Processing with Spark</text>

  <rect x="541.8182" y="85.3913" width="218.1818" height="90.7826" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.9091" y="120.6957" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.784" font-weight="bold" fill="var(--primary-text)">Driver</text>
  <text x="650.9091" y="145.913" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.637" fill="var(--primary-text)">SparkContext</text>
  <text x="650.9091" y="164.0696" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.637" fill="var(--primary-text)">DAGScheduler</text>

  <rect x="541.8182" y="206.4348" width="218.1818" height="60.5217" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.9091" y="233.6696" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.686" font-weight="bold" fill="var(--info-text)">Cluster Manager</text>
  <text x="650.9091" y="252.8348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--info-text)">YARN / K8s / Standalone</text>

  <line x1="650.9091" y1="176.1739" x2="650.9091" y2="204.4174" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="327.4783" width="261.8182" height="181.5652" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.9091" y="357.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.735" font-weight="bold" fill="var(--ok-text)">Executor 1</text>
  <text x="170.9091" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Task</text>
  <text x="170.9091" y="413.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Task</text>
  <text x="170.9091" y="438.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Cache partitions</text>
  <text x="170.9091" y="463.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Block manager</text>
  <text x="170.9091" y="488.8696" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">JVM</text>

  <rect x="323.6364" y="327.4783" width="261.8182" height="181.5652" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="454.5455" y="357.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.735" font-weight="bold" fill="var(--ok-text)">Executor 2</text>
  <text x="454.5455" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Task</text>
  <text x="454.5455" y="413.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Task</text>
  <text x="454.5455" y="438.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Cache partitions</text>
  <text x="454.5455" y="463.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Block manager</text>
  <text x="454.5455" y="488.8696" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">JVM</text>

  <rect x="607.2727" y="327.4783" width="261.8182" height="181.5652" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="738.1818" y="357.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.735" font-weight="bold" fill="var(--ok-text)">Executor 3</text>
  <text x="738.1818" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Task</text>
  <text x="738.1818" y="413.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Task</text>
  <text x="738.1818" y="438.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Cache partitions</text>
  <text x="738.1818" y="463.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Block manager</text>
  <text x="738.1818" y="488.8696" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">JVM</text>

  <rect x="890.9091" y="327.4783" width="261.8182" height="181.5652" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1021.8182" y="357.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.735" font-weight="bold" fill="var(--ok-text)">Executor N</text>
  <text x="1021.8182" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Task</text>
  <text x="1021.8182" y="413.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Task</text>
  <text x="1021.8182" y="438.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Cache partitions</text>
  <text x="1021.8182" y="463.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">Block manager</text>
  <text x="1021.8182" y="488.8696" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.588" fill="var(--ok-text)">JVM</text>

  <line x1="607.2727" y1="246.7826" x2="192.7273" y2="325.4609" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="629.0909" y1="256.8696" x2="454.5455" y2="325.4609" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672.7273" y1="256.8696" x2="738.1818" y2="325.4609" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="694.5455" y1="246.7826" x2="1000" y2="325.4609" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="529.2174" width="1200" height="90.7826" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="559.4783" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.735" font-weight="bold" fill="var(--text)">Key ideas</text>
  <text x="61.8182" y="584.6957" font-family="Arial, sans-serif" font-size="13.637" fill="var(--text-muted)">Driver holds the SparkContext and plans the job as a DAG. Executors run tasks in parallel on worker nodes.</text>
  <text x="61.8182" y="604.8696" font-family="Arial, sans-serif" font-size="13.637" fill="var(--text-muted)">Data is split into partitions; one task processes one partition. More partitions means more parallelism up to core count.</text>
</svg>

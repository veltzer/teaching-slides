<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="630.1639" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9136" font-weight="bold" fill="var(--text)">Traditional vs Big-Data Processing</text>

  <!-- Left: Traditional -->
  <rect x="40" y="75.3043" width="590.1639" height="544.6957" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335.082" y="110.6087" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9293" font-weight="bold" fill="var(--text)">Traditional (single machine)</text>

  <rect x="197.377" y="145.913" width="275.4098" height="80.6957" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="335.082" y="181.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9411" font-weight="bold" fill="var(--warn-text)">One Server</text>
  <text x="335.082" y="204.4174" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9489" fill="var(--warn-text)">CPU + RAM + disk</text>

  <rect x="197.377" y="256.8696" width="275.4098" height="70.6087" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="335.082" y="289.1478" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9411" fill="var(--primary-text)">Dataset (~1 GB)</text>
  <text x="335.082" y="310.3304" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--primary-text)">fits in memory</text>

  <rect x="197.377" y="357.7391" width="275.4098" height="70.6087" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="335.082" y="398.087" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9411" fill="var(--info-text)">pandas / SQL</text>

  <text x="335.082" y="468.6957" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9489" font-weight="bold" fill="var(--text)">Scaling hits hardware limit</text>
  <text x="335.082" y="493.913" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--text-muted)">Vertical scaling: buy bigger machine</text>
  <text x="335.082" y="514.087" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--text-muted)">Cost grows non-linearly</text>
  <text x="335.082" y="544.3478" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--danger-accent)">Fails at TB–PB scale</text>
  <text x="335.082" y="574.6087" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--danger-accent)">Single point of failure</text>

  <!-- Right: Big-Data -->
  <rect x="649.8361" y="75.3043" width="590.1639" height="544.6957" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="944.918" y="110.6087" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9293" font-weight="bold" fill="var(--text)">Big Data (distributed cluster)</text>

  <rect x="708.8525" y="145.913" width="108.1967" height="80.6957" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="762.9508" y="191.3043" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9489" fill="var(--ok-text)">Node 1</text>
  <rect x="831.8033" y="145.913" width="108.1967" height="80.6957" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="885.9016" y="191.3043" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9489" fill="var(--ok-text)">Node 2</text>
  <rect x="954.7541" y="145.913" width="108.1967" height="80.6957" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1008.8525" y="191.3043" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9489" fill="var(--ok-text)">Node 3</text>
  <rect x="1077.7049" y="145.913" width="108.1967" height="80.6957" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1131.8033" y="191.3043" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9489" fill="var(--ok-text)">Node N</text>

  <rect x="708.8525" y="256.8696" width="477.0492" height="70.6087" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="946.8852" y="289.1478" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9411" fill="var(--primary-text)">Dataset (TB – PB)</text>
  <text x="946.8852" y="310.3304" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--primary-text)">partitioned across nodes</text>

  <rect x="708.8525" y="357.7391" width="477.0492" height="70.6087" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="946.8852" y="398.087" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9411" fill="var(--info-text)">Spark / Hadoop / Flink</text>

  <text x="946.8852" y="468.6957" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9489" font-weight="bold" fill="var(--text)">Horizontal scaling</text>
  <text x="946.8852" y="493.913" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--text-muted)">Add more commodity machines</text>
  <text x="946.8852" y="514.087" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--text-muted)">Linear cost, near-linear throughput</text>
  <text x="946.8852" y="544.3478" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--ok-accent)">Fault tolerant: node loss is survivable</text>
  <text x="946.8852" y="574.6087" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9529" fill="var(--ok-accent)">Move computation to data, not reverse</text>
</svg>

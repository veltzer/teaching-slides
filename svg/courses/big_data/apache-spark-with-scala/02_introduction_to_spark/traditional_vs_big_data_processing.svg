<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Left: Traditional -->
  <rect x="40" y="40" width="590.1639" height="580" rx="6.191391601857" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335.082" y="77.592644847389" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.501219574528" font-weight="bold" fill="var(--text)">Traditional (single machine)</text>

  <rect x="197.377" y="115.185183213306" width="275.4098" height="85.925969307266" rx="6.191391601857" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.082" y="152.777828060695" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.417700177083" font-weight="bold" fill="var(--warn-text)">One Server</text>
  <text x="335.082" y="177.481529595332" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.361951785547" fill="var(--warn-text)">CPU + RAM + disk</text>

  <rect x="197.377" y="233.333404320981" width="275.4098" height="75.185183213306" rx="6.191391601857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.082" y="267.70370685871" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.417700177083" fill="var(--primary-text)">Dataset (~1 GB)</text>
  <text x="335.082" y="290.259251174555" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--primary-text)">fits in memory</text>

  <rect x="197.377" y="340.740732853224" width="275.4098" height="75.185183213306" rx="6.191391601857" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.082" y="383.703770747594" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.417700177083" fill="var(--info-text)">pandas / SQL</text>

  <text x="335.082" y="458.8889539609" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.361951785547" font-weight="bold" fill="var(--text)">Scaling hits hardware limit</text>
  <text x="335.082" y="485.740706232856" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--text-muted)">Vertical scaling: buy bigger machine</text>
  <text x="335.082" y="507.222278420777" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--text-muted)">Cost grows non-linearly</text>
  <text x="335.082" y="539.444423739714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--danger-accent)">Fails at TB–PB scale</text>
  <text x="335.082" y="571.666675540123" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--danger-accent)">Single point of failure</text>

  <!-- Right: Big-Data -->
  <rect x="649.8361" y="40" width="590.1639" height="580" rx="6.191391601857" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="944.918" y="77.592644847389" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.501219574528" font-weight="bold" fill="var(--text)">Big Data (distributed cluster)</text>

  <rect x="708.8525" y="115.185183213306" width="108.1967" height="85.925969307266" rx="6.191391601857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="762.9508" y="163.518507673183" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.361951785547" fill="var(--ok-text)">Node 1</text>
  <rect x="831.8033" y="115.185183213306" width="108.1967" height="85.925969307266" rx="6.191391601857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="885.9016" y="163.518507673183" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.361951785547" fill="var(--ok-text)">Node 2</text>
  <rect x="954.7541" y="115.185183213306" width="108.1967" height="85.925969307266" rx="6.191391601857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1008.8525" y="163.518507673183" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.361951785547" fill="var(--ok-text)">Node 3</text>
  <rect x="1077.7049" y="115.185183213306" width="108.1967" height="85.925969307266" rx="6.191391601857" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.8033" y="163.518507673183" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.361951785547" fill="var(--ok-text)">Node N</text>

  <rect x="708.8525" y="233.333404320981" width="477.0492" height="75.185183213306" rx="6.191391601857" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="946.8852" y="267.70370685871" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.417700177083" fill="var(--primary-text)">Dataset (TB – PB)</text>
  <text x="946.8852" y="290.259251174555" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--primary-text)">partitioned across nodes</text>

  <rect x="708.8525" y="340.740732853224" width="477.0492" height="75.185183213306" rx="6.191391601857" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="946.8852" y="383.703770747594" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.417700177083" fill="var(--info-text)">Spark / Hadoop / Flink</text>

  <text x="946.8852" y="458.8889539609" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.361951785547" font-weight="bold" fill="var(--text)">Horizontal scaling</text>
  <text x="946.8852" y="485.740706232856" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--text-muted)">Add more commodity machines</text>
  <text x="946.8852" y="507.222278420777" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--text-muted)">Linear cost, near-linear throughput</text>
  <text x="946.8852" y="539.444423739714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--ok-accent)">Fault tolerant: node loss is survivable</text>
  <text x="946.8852" y="571.666675540123" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.334180779639" fill="var(--ok-accent)">Move computation to data, not reverse</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <rect x="40" y="40" width="290" height="450" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">PROCESS_LOCAL</text>
  <text x="185" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Data in the same</text>
  <text x="185" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">executor JVM</text>
  <text x="185" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Best case</text>
  <text x="185" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Zero network</text>
  <text x="185" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Cache hits land</text>
  <text x="185" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">here</text>
  <text x="185" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Fastest tier</text>

  <rect x="340" y="40" width="290" height="450" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">NODE_LOCAL</text>
  <text x="485" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Same host, other</text>
  <text x="485" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">executor or HDFS</text>
  <text x="485" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Short-circuit read</text>
  <text x="485" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">via loopback</text>
  <text x="485" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Disk latency only</text>
  <text x="485" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Still very fast</text>
  <text x="485" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Typical target</text>

  <rect x="640" y="40" width="290" height="450" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">RACK_LOCAL</text>
  <text x="785" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Same rack switch,</text>
  <text x="785" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">different host</text>
  <text x="785" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">One hop of LAN</text>
  <text x="785" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">traffic</text>
  <text x="785" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Moderate cost</text>
  <text x="785" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Acceptable when</text>
  <text x="785" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">node is busy</text>

  <rect x="940" y="40" width="300" height="450" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">ANY</text>
  <text x="1090" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Cross-rack,</text>
  <text x="1090" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">any node fetch</text>
  <text x="1090" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Highest network</text>
  <text x="1090" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">cost</text>
  <text x="1090" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Fallback tier</text>
  <text x="1090" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">locality.wait</text>
  <text x="1090" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">controls fallback</text>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Scheduler waits, then falls back</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Spark delays tasks briefly to keep higher locality, then demotes.</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Tune spark.locality.wait; co-locate executors with data partitions.</text>
</svg>

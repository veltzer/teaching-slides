<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="285" height="315.339805825243" rx="6.367392662652" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="85.048543689321" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.347106429722" font-weight="bold" fill="var(--danger-text)">Traditional</text>
  <text x="182" y="116.582524271844" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--danger-text)">~2000s</text>
  <text x="182" y="163.883495145631" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--danger-text)">RDBMS warehouses</text>
  <text x="182" y="197.669902912622" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--danger-text)">Vertical scaling</text>
  <text x="182" y="231.456310679612" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--danger-text)">Schema-on-write</text>
  <text x="182" y="287.766990291263" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--danger-text)">Latency: hours</text>
  <text x="182" y="321.553398058253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--danger-text)">Costly per TB</text>

  <line x1="325" y1="197.669902912622" x2="347" y2="197.669902912622" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="350" y="40" width="285" height="315.339805825243" rx="6.367392662652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492" y="85.048543689321" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.347106429722" font-weight="bold" fill="var(--warn-text)">Hadoop</text>
  <text x="492" y="116.582524271844" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--warn-text)">~2006</text>
  <text x="492" y="163.883495145631" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--warn-text)">MapReduce + HDFS</text>
  <text x="492" y="197.669902912622" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--warn-text)">Commodity scale-out</text>
  <text x="492" y="231.456310679612" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--warn-text)">Disk-heavy batch</text>
  <text x="492" y="287.766990291263" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--warn-text)">Latency: minutes</text>
  <text x="492" y="321.553398058253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Cheap storage</text>

  <line x1="635" y1="197.669902912622" x2="657" y2="197.669902912622" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="660" y="40" width="285" height="315.339805825243" rx="6.367392662652" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802" y="85.048543689321" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.347106429722" font-weight="bold" fill="var(--ok-text)">Spark</text>
  <text x="802" y="116.582524271844" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--ok-text)">~2014</text>
  <text x="802" y="163.883495145631" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--ok-text)">In-memory DAG</text>
  <text x="802" y="197.669902912622" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--ok-text)">10-100x faster</text>
  <text x="802" y="231.456310679612" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--ok-text)">SQL, stream, ML unified</text>
  <text x="802" y="287.766990291263" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--ok-text)">Latency: seconds</text>
  <text x="802" y="321.553398058253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--ok-text)">Efficient at scale</text>

  <line x1="945" y1="197.669902912622" x2="967" y2="197.669902912622" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="970" y="40" width="270" height="315.339805825243" rx="6.367392662652" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="85.048543689321" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.347106429722" font-weight="bold" fill="var(--info-text)">Lakehouse</text>
  <text x="1105" y="116.582524271844" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--info-text)">~2020+</text>
  <text x="1105" y="163.883495145631" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--info-text)">Delta / Iceberg</text>
  <text x="1105" y="197.669902912622" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--info-text)">Object store + ACID</text>
  <text x="1105" y="231.456310679612" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--info-text)">Open table formats</text>
  <text x="1105" y="287.766990291263" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--info-text)">Latency: ms</text>
  <text x="1105" y="321.553398058253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Pay-per-query</text>

  <rect x="40" y="389.126213592233" width="1200" height="56.310679611651" rx="6.367392662652" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="425.16504854369" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.97971376707" font-weight="bold" fill="var(--text)">Each step cut latency by an order of magnitude</text>

  <rect x="40" y="467.961165048544" width="590" height="152.038834951456" rx="6.367392662652" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="507.378640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--primary-text)">Drivers</text>
  <text x="335" y="544.543689320388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--primary-text)">Cheap commodity hardware</text>
  <text x="335" y="578.330097087378" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--primary-text)">Falling memory prices</text>
  <text x="335" y="608.73786407767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--primary-text)">Cloud object storage</text>

  <rect x="650" y="467.961165048544" width="590" height="152.038834951456" rx="6.367392662652" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="507.378640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--primary-text)">Why Spark Stuck</text>
  <text x="945" y="544.543689320388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--primary-text)">One engine, many workloads</text>
  <text x="945" y="578.330097087378" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--primary-text)">Runs on K8s, YARN, standalone</text>
  <text x="945" y="608.73786407767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--primary-text)">Lakehouse foundation</text>
</svg>

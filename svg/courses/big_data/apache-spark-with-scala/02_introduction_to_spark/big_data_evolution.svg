<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.885093454119" font-weight="bold" fill="var(--text)">Big Data Evolution</text>

  <rect x="40" y="71.926605504587" width="285" height="297.981651376147" rx="6.189662883026" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="114.495412844037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--danger-text)">Traditional</text>
  <text x="182" y="144.293577981651" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--danger-text)">~2000s</text>
  <text x="182" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--danger-text)">RDBMS warehouses</text>
  <text x="182" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--danger-text)">Vertical scaling</text>
  <text x="182" y="252.844036697248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--danger-text)">Schema-on-write</text>
  <text x="182" y="306.05504587156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" font-weight="bold" fill="var(--danger-text)">Latency: hours</text>
  <text x="182" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--danger-text)">Costly per TB</text>

  <line x1="325" y1="220.917431192661" x2="347" y2="220.917431192661" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="71.926605504587" width="285" height="297.981651376147" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492" y="114.495412844037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--warn-text)">Hadoop</text>
  <text x="492" y="144.293577981651" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">~2006</text>
  <text x="492" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">MapReduce + HDFS</text>
  <text x="492" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">Commodity scale-out</text>
  <text x="492" y="252.844036697248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--warn-text)">Disk-heavy batch</text>
  <text x="492" y="306.05504587156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" font-weight="bold" fill="var(--warn-text)">Latency: minutes</text>
  <text x="492" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--warn-text)">Cheap storage</text>

  <line x1="635" y1="220.917431192661" x2="657" y2="220.917431192661" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="71.926605504587" width="285" height="297.981651376147" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802" y="114.495412844037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--ok-text)">Spark</text>
  <text x="802" y="144.293577981651" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">~2014</text>
  <text x="802" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">In-memory DAG</text>
  <text x="802" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">10-100x faster</text>
  <text x="802" y="252.844036697248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--ok-text)">SQL, stream, ML unified</text>
  <text x="802" y="306.05504587156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" font-weight="bold" fill="var(--ok-text)">Latency: seconds</text>
  <text x="802" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--ok-text)">Efficient at scale</text>

  <line x1="945" y1="220.917431192661" x2="967" y2="220.917431192661" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="970" y="71.926605504587" width="270" height="297.981651376147" rx="6.189662883026" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="114.495412844037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--info-text)">Lakehouse</text>
  <text x="1105" y="144.293577981651" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--info-text)">~2020+</text>
  <text x="1105" y="188.990825688073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--info-text)">Delta / Iceberg</text>
  <text x="1105" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--info-text)">Object store + ACID</text>
  <text x="1105" y="252.844036697248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--info-text)">Open table formats</text>
  <text x="1105" y="306.05504587156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" font-weight="bold" fill="var(--info-text)">Latency: ms</text>
  <text x="1105" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--info-text)">Pay-per-query</text>

  <rect x="40" y="401.834862385321" width="1200" height="53.211009174312" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="435.889908256881" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--text)">Each step cut latency by an order of magnitude</text>

  <rect x="40" y="476.330275229358" width="590" height="143.669724770642" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="513.577981651376" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.568988649077" font-weight="bold" fill="var(--primary-text)">Drivers</text>
  <text x="335" y="548.697247706422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">Cheap commodity hardware</text>
  <text x="335" y="580.623853211009" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">Falling memory prices</text>
  <text x="335" y="609.357798165138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">Cloud object storage</text>

  <rect x="650" y="476.330275229358" width="590" height="143.669724770642" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="513.577981651376" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.568988649077" font-weight="bold" fill="var(--primary-text)">Why Spark Stuck</text>
  <text x="945" y="548.697247706422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">One engine, many workloads</text>
  <text x="945" y="580.623853211009" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">Runs on K8s, YARN, standalone</text>
  <text x="945" y="609.357798165138" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--primary-text)">Lakehouse foundation</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="14.2222" markerHeight="16.8" refX="12.8" refY="8.4" orient="auto">
      <polygon points="0,24 4.9778,0" fill="#666" />
    </marker>
  </defs>
  <line x1="71.1111" y1="360" x2="1223.1111" y2="360" stroke="#666" stroke-width="2.8444" marker-end="url(#arrow)" />
  <rect x="85.3333" y="144" width="213.3333" height="168" rx="7.1111" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="192" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Traditional</text>
  <text x="192" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">RDBMS / Data</text>
  <text x="192" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Warehouses</text>
  <line x1="192" y1="312" x2="192" y2="348" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="192" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="#888">~2000s</text>
  <rect x="369.7778" y="144" width="213.3333" height="168" rx="7.1111" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="476.4444" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Hadoop</text>
  <text x="476.4444" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">MapReduce</text>
  <text x="476.4444" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">HDFS / Batch</text>
  <line x1="476.4444" y1="312" x2="476.4444" y2="348" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="476.4444" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="#888">~2006</text>
  <rect x="654.2222" y="144" width="213.3333" height="168" rx="7.1111" fill="#d4edda" stroke="#28a745" stroke-width="2.8444" />
  <text x="760.8889" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Spark</text>
  <text x="760.8889" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">In-Memory</text>
  <text x="760.8889" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">DAG Engine</text>
  <line x1="760.8889" y1="312" x2="760.8889" y2="348" stroke="#28a745" stroke-width="2.8444" />
  <text x="760.8889" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="#888">~2014</text>
  <rect x="938.6667" y="144" width="213.3333" height="168" rx="7.1111" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="1045.3333" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Modern</text>
  <text x="1045.3333" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Lakehouse /</text>
  <text x="1045.3333" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Real-time</text>
  <line x1="1045.3333" y1="312" x2="1045.3333" y2="348" stroke="#4a90e2" stroke-width="2.8444" />
  <text x="1045.3333" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="#888">~2020+</text>
  <text x="192" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="#999">Hours</text>
  <text x="476.4444" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="#999">Minutes-Hours</text>
  <text x="760.8889" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="#999">Seconds-Min</text>
  <text x="1045.3333" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="#999">Milliseconds</text>
</svg>
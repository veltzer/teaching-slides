<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 4.9778,0" fill="#666" />
    </marker>
  </defs>
  <line x1="40" y1="380" x2="1240" y2="380" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="54.8148" y="155" width="222.2222" height="175" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.9259" y="217.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2593" font-weight="bold">Traditional</text>
  <text x="165.9259" y="267.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2963">RDBMS / Data</text>
  <text x="165.9259" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2963">Warehouses</text>
  <line x1="165.9259" y1="330" x2="165.9259" y2="367.5" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.9259" y="442.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8148" fill="var(--text-faint)">~2000s</text>
  <rect x="351.1111" y="155" width="222.2222" height="175" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="462.2222" y="217.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2593" font-weight="bold">Hadoop</text>
  <text x="462.2222" y="267.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2963">MapReduce</text>
  <text x="462.2222" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2963">HDFS / Batch</text>
  <line x1="462.2222" y1="330" x2="462.2222" y2="367.5" stroke="var(--primary-border)" stroke-width="2" />
  <text x="462.2222" y="442.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8148" fill="var(--text-faint)">~2006</text>
  <rect x="647.4074" y="155" width="222.2222" height="175" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="758.5185" y="217.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2593" font-weight="bold">Spark</text>
  <text x="758.5185" y="267.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2963">In-Memory</text>
  <text x="758.5185" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2963">DAG Engine</text>
  <line x1="758.5185" y1="330" x2="758.5185" y2="367.5" stroke="var(--ok-border)" stroke-width="2" />
  <text x="758.5185" y="442.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8148" fill="var(--text-faint)">~2014</text>
  <rect x="943.7038" y="155" width="222.2222" height="175" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1054.8148" y="217.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2593" font-weight="bold">Modern</text>
  <text x="1054.8148" y="267.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2963">Lakehouse /</text>
  <text x="1054.8148" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2963">Real-time</text>
  <line x1="1054.8148" y1="330" x2="1054.8148" y2="367.5" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1054.8148" y="442.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8148" fill="var(--text-faint)">~2020+</text>
  <text x="165.9259" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8148" fill="var(--text-faint)">Hours</text>
  <text x="462.2222" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8148" fill="var(--text-faint)">Minutes-Hours</text>
  <text x="758.5185" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8148" fill="var(--text-faint)">Seconds-Min</text>
  <text x="1054.8148" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8148" fill="var(--text-faint)">Milliseconds</text>
</svg>
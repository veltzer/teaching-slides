<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Big Data Evolution</text>

  <rect x="40" y="105" width="285" height="300" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="182.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Traditional</text>
  <text x="182.5" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">~2000s</text>
  <text x="182.5" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">RDBMS + warehouses</text>
  <text x="182.5" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Vertical scaling only</text>
  <text x="182.5" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Schema-on-write</text>
  <text x="182.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Hours to run jobs</text>
  <text x="182.5" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--danger-text)">Latency: hours</text>
  <text x="182.5" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Cost: high per TB</text>

  <line x1="325" y1="255" x2="347" y2="255" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="105" width="285" height="300" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="492.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Hadoop</text>
  <text x="492.5" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">~2006</text>
  <text x="492.5" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">MapReduce + HDFS</text>
  <text x="492.5" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Scale out on commodity HW</text>
  <text x="492.5" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Disk-heavy batch jobs</text>
  <text x="492.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Java-first, verbose</text>
  <text x="492.5" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">Latency: minutes–hours</text>
  <text x="492.5" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Cost: cheap storage</text>

  <line x1="635" y1="255" x2="657" y2="255" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="105" width="285" height="300" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="802.5" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Spark</text>
  <text x="802.5" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">~2014</text>
  <text x="802.5" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">In-memory DAG engine</text>
  <text x="802.5" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">10-100x faster than MR</text>
  <text x="802.5" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">SQL, streaming, ML unified</text>
  <text x="802.5" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Scala, Python, R, Java</text>
  <text x="802.5" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-text)">Latency: seconds–minutes</text>
  <text x="802.5" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Cost: efficient at scale</text>

  <line x1="945" y1="255" x2="967" y2="255" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="970" y="105" width="270" height="300" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Lakehouse</text>
  <text x="1105" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">~2020+</text>
  <text x="1105" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Delta / Iceberg / Hudi</text>
  <text x="1105" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Object storage + ACID</text>
  <text x="1105" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Streaming + batch unified</text>
  <text x="1105" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Open table formats</text>
  <text x="1105" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-text)">Latency: ms–seconds</text>
  <text x="1105" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Cost: pay-per-query</text>

  <rect x="40" y="425" width="1200" height="50" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Each step cut latency by an order of magnitude</text>

  <rect x="40" y="490" width="590" height="130" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="335" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">What drove the changes</text>
  <text x="335" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Commodity hardware made scale-out cheaper than scale-up</text>
  <text x="335" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Memory prices dropped; in-memory compute became viable</text>
  <text x="335" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Cloud object storage decoupled compute from data</text>

  <rect x="650" y="490" width="590" height="130" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="945" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Why Spark stuck</text>
  <text x="945" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">One engine for SQL, streaming, ML, and graphs</text>
  <text x="945" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Runs on Kubernetes, YARN, and standalone clusters</text>
  <text x="945" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Foundation for modern lakehouse platforms</text>
</svg>

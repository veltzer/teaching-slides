<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 4.9778,0" fill="#666" />
    </marker>
  </defs>
  <line x1="71.1111" y1="360" x2="1223.1111" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="85.3333" y="144" width="213.3333" height="168" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="192" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Traditional</text>
  <text x="192" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">RDBMS / Data</text>
  <text x="192" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Warehouses</text>
  <line x1="192" y1="312" x2="192" y2="348" stroke="var(--primary-border)" stroke-width="2" />
  <text x="192" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">~2000s</text>
  <rect x="369.7778" y="144" width="213.3333" height="168" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="476.4444" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Hadoop</text>
  <text x="476.4444" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">MapReduce</text>
  <text x="476.4444" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">HDFS / Batch</text>
  <line x1="476.4444" y1="312" x2="476.4444" y2="348" stroke="var(--primary-border)" stroke-width="2" />
  <text x="476.4444" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">~2006</text>
  <rect x="654.2222" y="144" width="213.3333" height="168" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="760.8889" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Spark</text>
  <text x="760.8889" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">In-Memory</text>
  <text x="760.8889" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">DAG Engine</text>
  <line x1="760.8889" y1="312" x2="760.8889" y2="348" stroke="var(--ok-border)" stroke-width="2" />
  <text x="760.8889" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">~2014</text>
  <rect x="938.6667" y="144" width="213.3333" height="168" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1045.3333" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4889" font-weight="bold">Modern</text>
  <text x="1045.3333" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Lakehouse /</text>
  <text x="1045.3333" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6444">Real-time</text>
  <line x1="1045.3333" y1="312" x2="1045.3333" y2="348" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1045.3333" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">~2020+</text>
  <text x="192" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">Hours</text>
  <text x="476.4444" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">Minutes-Hours</text>
  <text x="760.8889" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">Seconds-Min</text>
  <text x="1045.3333" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2222" fill="var(--text-faint)">Milliseconds</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.753498" font-weight="bold" fill="var(--text)">Big Data Evolution</text>

  <rect x="40" y="76.909091" width="285" height="316.363636" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.5" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--danger-text)">Traditional</text>
  <text x="182.5" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">~2000s</text>
  <text x="182.5" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">RDBMS + warehouses</text>
  <text x="182.5" y="229.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">Vertical scaling only</text>
  <text x="182.5" y="261.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">Schema-on-write</text>
  <text x="182.5" y="293.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--danger-text)">Hours to run jobs</text>
  <text x="182.5" y="340.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--danger-text)">Latency: hours</text>
  <text x="182.5" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--danger-text)">Cost: high per TB</text>

  <line x1="325" y1="235.090909" x2="347" y2="235.090909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="76.909091" width="285" height="316.363636" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.5" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--warn-text)">Hadoop</text>
  <text x="492.5" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">~2006</text>
  <text x="492.5" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">MapReduce + HDFS</text>
  <text x="492.5" y="229.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">Scale out on commodity HW</text>
  <text x="492.5" y="261.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">Disk-heavy batch jobs</text>
  <text x="492.5" y="293.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--warn-text)">Java-first, verbose</text>
  <text x="492.5" y="340.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--warn-text)">Latency: minutes–hours</text>
  <text x="492.5" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--warn-text)">Cost: cheap storage</text>

  <line x1="635" y1="235.090909" x2="657" y2="235.090909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="76.909091" width="285" height="316.363636" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.5" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--ok-text)">Spark</text>
  <text x="802.5" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">~2014</text>
  <text x="802.5" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">In-memory DAG engine</text>
  <text x="802.5" y="229.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">10-100x faster than MR</text>
  <text x="802.5" y="261.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">SQL, streaming, ML unified</text>
  <text x="802.5" y="293.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--ok-text)">Scala, Python, R, Java</text>
  <text x="802.5" y="340.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--ok-text)">Latency: seconds–minutes</text>
  <text x="802.5" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--ok-text)">Cost: efficient at scale</text>

  <line x1="945" y1="235.090909" x2="967" y2="235.090909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="970" y="76.909091" width="270" height="316.363636" rx="6.161464" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592034" font-weight="bold" fill="var(--info-text)">Lakehouse</text>
  <text x="1105" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">~2020+</text>
  <text x="1105" y="198.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">Delta / Iceberg / Hudi</text>
  <text x="1105" y="229.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">Object storage + ACID</text>
  <text x="1105" y="261.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">Streaming + batch unified</text>
  <text x="1105" y="293.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--info-text)">Open table formats</text>
  <text x="1105" y="340.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--info-text)">Latency: ms–seconds</text>
  <text x="1105" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" fill="var(--info-text)">Cost: pay-per-query</text>

  <rect x="40" y="414.363636" width="1200" height="52.727273" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="449.163636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--text)">Each step cut latency by an order of magnitude</text>

  <rect x="40" y="482.909091" width="590" height="137.090909" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="519.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--primary-text)">What drove the changes</text>
  <text x="335" y="551.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Commodity hardware made scale-out cheaper than scale-up</text>
  <text x="335" y="583.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Memory prices dropped; in-memory compute became viable</text>
  <text x="335" y="609.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Cloud object storage decoupled compute from data</text>

  <rect x="650" y="482.909091" width="590" height="137.090909" rx="6.161464" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="519.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391" font-weight="bold" fill="var(--primary-text)">Why Spark stuck</text>
  <text x="945" y="551.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">One engine for SQL, streaming, ML, and graphs</text>
  <text x="945" y="583.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Runs on Kubernetes, YARN, and standalone clusters</text>
  <text x="945" y="609.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" fill="var(--primary-text)">Foundation for modern lakehouse platforms</text>
</svg>

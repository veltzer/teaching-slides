<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <rect x="40" y="40" width="290" height="450" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Shuffle</text>
  <text x="185" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Usually the</text>
  <text x="185" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">main bottleneck</text>
  <text x="185" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">All-to-all data</text>
  <text x="185" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">move between execs</text>
  <text x="185" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Prefer narrow</text>
  <text x="185" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">transforms</text>
  <text x="185" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Minimize repartitions</text>

  <rect x="340" y="40" width="290" height="450" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Serialization</text>
  <text x="485" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Kryo over Java</text>
  <text x="485" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">serializer</text>
  <text x="485" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Register classes</text>
  <text x="485" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">for tight encoding</text>
  <text x="485" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Dataset encoders</text>
  <text x="485" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">beat case-class</text>
  <text x="485" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">RDD serdes</text>

  <rect x="640" y="40" width="290" height="450" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Catalyst + AQE</text>
  <text x="785" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">DataFrame API</text>
  <text x="785" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">gets optimized</text>
  <text x="785" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Adaptive Query</text>
  <text x="785" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Execution on by</text>
  <text x="785" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">default in 3.2+</text>
  <text x="785" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Broadcast joins</text>
  <text x="785" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">chosen at runtime</text>

  <rect x="940" y="40" width="300" height="450" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Data Layout</text>
  <text x="1090" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Parquet or ORC</text>
  <text x="1090" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">columnar formats</text>
  <text x="1090" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Partition on</text>
  <text x="1090" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">filter columns</text>
  <text x="1090" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Z-order or bucket</text>
  <text x="1090" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">big tables</text>
  <text x="1090" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Avoid small files</text>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Order of attack</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Fix data layout first, then shuffle, then join strategy, then serde.</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Measure with the UI between every change — tuning is empirical.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="35.5556" y="30" width="213.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="142.2222" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8">Performance</text>
  <rect x="320" y="30" width="213.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="426.6667" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8">Mem</text>
  <rect x="604.4444" y="30" width="213.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="711.1111" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8">CPU</text>
  <rect x="888.8889" y="30" width="213.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="995.5556" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8">IO</text>
  <rect x="35.5556" y="150" width="213.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="142.2222" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8">Net</text>
  <rect x="320" y="150" width="213.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="426.6667" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8">Cache</text>
  <rect x="604.4444" y="150" width="213.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="711.1111" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8">Par</text>
  <rect x="888.8889" y="150" width="213.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="995.5556" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8">Ser</text>
  <rect x="35.5556" y="270" width="213.3333" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="142.2222" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8">Shuf</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,12 4.9778,0" fill="#666" />
    </marker>
  </defs>
  <line x1="142.2222" y1="60" x2="426.6667" y2="60" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="142.2222" y1="60" x2="711.1111" y2="60" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="142.2222" y1="60" x2="995.5556" y2="60" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="142.2222" y1="60" x2="142.2222" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="426.6667" y1="60" x2="426.6667" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="711.1111" y1="60" x2="711.1111" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="995.5556" y1="60" x2="995.5556" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="142.2222" y1="180" x2="142.2222" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
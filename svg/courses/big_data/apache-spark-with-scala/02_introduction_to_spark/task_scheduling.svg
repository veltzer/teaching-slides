<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.748354" font-weight="bold" fill="var(--text)">Task Scheduling</text>

  <rect x="40" y="69.635036" width="280" height="190.510949" rx="6.172697" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="109.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.546874" font-weight="bold" fill="var(--primary-text)">Driver / DAGScheduler</text>
  <text x="180" y="145.839416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Build DAG from actions</text>
  <text x="180" y="175.474453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Split into stages</text>
  <text x="180" y="205.109489" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Boundary = shuffle</text>
  <text x="180" y="234.744526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Submit stage as TaskSet</text>

  <line x1="320" y1="164.890511" x2="360" y2="164.890511" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="69.635036" width="280" height="190.510949" rx="6.172697" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="109.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.546874" font-weight="bold" fill="var(--ok-text)">TaskScheduler</text>
  <text x="510" y="145.839416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Accept TaskSets</text>
  <text x="510" y="175.474453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Assign to executors</text>
  <text x="510" y="205.109489" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Locality preference</text>
  <text x="510" y="234.744526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Retry failed tasks</text>

  <line x1="650" y1="164.890511" x2="690" y2="164.890511" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="69.635036" width="280" height="190.510949" rx="6.172697" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="109.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.546874" font-weight="bold" fill="var(--warn-text)">Cluster Manager</text>
  <text x="840" y="145.839416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">YARN, K8s, standalone</text>
  <text x="840" y="175.474453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Allocate executors</text>
  <text x="840" y="205.109489" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">CPU and memory</text>
  <text x="840" y="234.744526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Dynamic allocation</text>

  <line x1="980" y1="164.890511" x2="1020" y2="164.890511" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1030" y="69.635036" width="210" height="190.510949" rx="6.172697" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="109.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.546874" font-weight="bold" fill="var(--info-text)">Executors</text>
  <text x="1135" y="145.839416" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Run tasks</text>
  <text x="1135" y="175.474453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Slot = one core</text>
  <text x="1135" y="205.109489" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Cache RDD blocks</text>
  <text x="1135" y="234.744526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Report status</text>

  <rect x="40" y="291.89781" width="390" height="328.10219" rx="6.172697" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="235" y="328.941606" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--primary-text)">Locality Levels</text>
  <text x="235" y="365.985401" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">PROCESS_LOCAL (same JVM)</text>
  <text x="235" y="397.737226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">NODE_LOCAL (same host)</text>
  <text x="235" y="429.489051" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">RACK_LOCAL (same rack)</text>
  <text x="235" y="461.240876" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">ANY (remote)</text>
  <text x="235" y="498.284672" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Scheduler waits briefly</text>
  <text x="235" y="524.744526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">for better locality</text>
  <text x="235" y="556.49635" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Move code to data</text>
  <text x="235" y="588.248175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">whenever possible</text>

  <rect x="450" y="291.89781" width="390" height="328.10219" rx="6.172697" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="645" y="328.941606" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--ok-text)">Pools and Modes</text>
  <text x="645" y="365.985401" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">FIFO: default, jobs queue</text>
  <text x="645" y="397.737226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">FAIR: share across jobs</text>
  <text x="645" y="429.489051" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Pool weights and minShare</text>
  <text x="645" y="461.240876" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Set via spark.scheduler.mode</text>
  <text x="645" y="498.284672" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Useful in multi-user apps</text>
  <text x="645" y="530.036496" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Speculative execution</text>
  <text x="645" y="561.788321" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">reruns slow tasks</text>
  <text x="645" y="593.540146" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">first result wins</text>

  <rect x="860" y="291.89781" width="380" height="328.10219" rx="6.172697" fill="var(--info-accent)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1050" y="328.941606" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--info-text)">Failure Handling</text>
  <text x="1050" y="365.985401" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Task retried up to N times</text>
  <text x="1050" y="397.737226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Lost executor reassigned</text>
  <text x="1050" y="429.489051" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Stage recomputed from</text>
  <text x="1050" y="455.948905" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">lineage if needed</text>
  <text x="1050" y="487.70073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Shuffle blocks tracked</text>
  <text x="1050" y="514.160584" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">by external shuffle service</text>
  <text x="1050" y="551.20438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Blacklist flaky nodes</text>
  <text x="1050" y="582.956204" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Keep the job alive</text>
</svg>

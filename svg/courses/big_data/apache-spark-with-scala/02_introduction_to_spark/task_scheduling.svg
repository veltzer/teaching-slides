<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="270" height="203.508771929825" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="85.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--primary-text)">DAGScheduler</text>
  <text x="175" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--primary-text)">build DAG</text>
  <text x="175" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--primary-text)">split into stages</text>
  <text x="175" y="187.543859649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--primary-text)">shuffle boundary</text>
  <text x="175" y="218.070175438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--primary-text)">submit TaskSet</text>

  <line x1="310" y1="141.754385964912" x2="350" y2="141.754385964912" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="40" width="270" height="203.508771929825" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="85.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--ok-text)">TaskScheduler</text>
  <text x="495" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--ok-text)">assign to executors</text>
  <text x="495" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--ok-text)">locality preference</text>
  <text x="495" y="187.543859649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--ok-text)">retry failures</text>

  <line x1="630" y1="141.754385964912" x2="670" y2="141.754385964912" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="40" width="270" height="203.508771929825" rx="6.052402741669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="815" y="85.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--warn-text)">Cluster Manager</text>
  <text x="815" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--warn-text)">YARN / K8s</text>
  <text x="815" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--warn-text)">allocate executors</text>
  <text x="815" y="187.543859649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--warn-text)">dynamic allocation</text>

  <line x1="950" y1="141.754385964912" x2="990" y2="141.754385964912" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="40" width="240" height="203.508771929825" rx="6.052402741669" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="85.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--info-text)">Executors</text>
  <text x="1120" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--info-text)">run tasks</text>
  <text x="1120" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--info-text)">slot = one core</text>
  <text x="1120" y="187.543859649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--info-text)">cache blocks</text>

  <rect x="40" y="284.210526315789" width="390" height="335.789473684211" rx="6.052402741669" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="235" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--primary-text)">Locality Levels</text>
  <text x="235" y="380.877192982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--primary-text)">PROCESS_LOCAL</text>
  <text x="235" y="421.578947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--primary-text)">NODE_LOCAL</text>
  <text x="235" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--primary-text)">RACK_LOCAL</text>
  <text x="235" y="502.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--primary-text)">ANY</text>
  <text x="235" y="558.947368421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-style="italic" fill="var(--primary-text)">move code to data</text>

  <rect x="445" y="284.210526315789" width="390" height="335.789473684211" rx="6.052402741669" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--ok-text)">Pools and Modes</text>
  <text x="640" y="380.877192982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--ok-text)">FIFO: default queue</text>
  <text x="640" y="421.578947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--ok-text)">FAIR: share across jobs</text>
  <text x="640" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--ok-text)">pool weights, minShare</text>
  <text x="640" y="502.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--ok-text)">speculation reruns stragglers</text>

  <rect x="850" y="284.210526315789" width="390" height="335.789473684211" rx="6.052402741669" fill="var(--info-accent)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1045" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--info-text)">Failure Handling</text>
  <text x="1045" y="380.877192982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--info-text)">task retry</text>
  <text x="1045" y="421.578947368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--info-text)">executor reassigned</text>
  <text x="1045" y="462.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--info-text)">lineage recomputes</text>
  <text x="1045" y="502.982456140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--info-text)">external shuffle service</text>
  <text x="1045" y="543.684210526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" fill="var(--info-text)">blacklist flaky nodes</text>
</svg>

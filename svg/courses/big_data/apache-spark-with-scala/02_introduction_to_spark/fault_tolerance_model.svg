<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="386.440677966102" height="261.56862745098" rx="8.603368303259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.508420758147" font-weight="bold" fill="var(--primary-text)">RDD Lineage</text>
  <text x="233.220338983051" y="130.980392156863" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--primary-text)">DAG of transforms</text>
  <text x="233.220338983051" y="170.784313725491" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--primary-text)">Recompute from source</text>
  <text x="233.220338983051" y="210.588235294118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--primary-text)">Narrow: local replay</text>
  <text x="233.220338983051" y="250.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--primary-text)">Wide: re-shuffle</text>

  <rect x="446.779661016949" y="40" width="386.440677966102" height="261.56862745098" rx="8.603368303259" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.508420758147" font-weight="bold" fill="var(--ok-text)">Checkpointing</text>
  <text x="640" y="130.980392156863" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--ok-text)">Persist to HDFS/S3</text>
  <text x="640" y="170.784313725491" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--ok-text)">Truncates lineage</text>
  <text x="640" y="210.588235294118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--ok-text)">For iterative jobs</text>
  <text x="640" y="250.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--ok-text)">Required in Streaming</text>

  <rect x="853.559322033898" y="40" width="386.440677966102" height="261.56862745098" rx="8.603368303259" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.508420758147" font-weight="bold" fill="var(--warn-text)">Task Retries</text>
  <text x="1046.779661016949" y="130.980392156863" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--warn-text)">maxFailures=4</text>
  <text x="1046.779661016949" y="170.784313725491" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--warn-text)">Stage re-attempts</text>
  <text x="1046.779661016949" y="210.588235294118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--warn-text)">Speculation + blacklist</text>
  <text x="1046.779661016949" y="250.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--warn-text)">Idempotency assumed</text>

  <rect x="40" y="341.372549019609" width="386.440677966102" height="278.627450980391" rx="8.603368303259" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="386.862745098039" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.508420758147" font-weight="bold" fill="var(--info-text)">Driver Recovery</text>
  <text x="233.220338983051" y="432.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--info-text)">Single point of failure</text>
  <text x="233.220338983051" y="472.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--info-text)">--supervise mode</text>
  <text x="233.220338983051" y="511.960784313725" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--info-text)">Streaming WAL</text>
  <text x="233.220338983051" y="551.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--info-text)">Restart via YARN/K8s</text>

  <rect x="446.779661016949" y="341.372549019609" width="386.440677966102" height="278.627450980391" rx="8.603368303259" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="386.862745098039" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.508420758147" font-weight="bold" fill="var(--danger-text)">Executor Loss</text>
  <text x="640" y="432.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--danger-text)">Blocks recomputed</text>
  <text x="640" y="472.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--danger-text)">Shuffle may vanish</text>
  <text x="640" y="511.960784313725" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--danger-text)">FetchFailed re-stages</text>
  <text x="640" y="551.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--danger-text)">Dynamic allocation</text>

  <rect x="853.559322033898" y="341.372549019609" width="386.440677966102" height="278.627450980391" rx="8.603368303259" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1046.779661016949" y="386.862745098039" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.508420758147" font-weight="bold" fill="var(--text)">Guarantees</text>
  <text x="1046.779661016949" y="432.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--text-muted)">Batch: at-least-once</text>
  <text x="1046.779661016949" y="472.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--text-muted)">Streaming: exactly-once</text>
  <text x="1046.779661016949" y="511.960784313725" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--text-muted)">With replayable source</text>
  <text x="1046.779661016949" y="551.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--text-muted)">Idempotent sinks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e; --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.128853838633" font-weight="bold" fill="var(--text)">Spark Fault Tolerance</text>

  <rect x="40" y="77.247706422018" width="386.440677966102" height="244.770642201835" rx="8.322529668181" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.806324170452" font-weight="bold" fill="var(--primary-text)">RDD Lineage</text>
  <text x="233.220338983051" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--primary-text)">DAG of transforms</text>
  <text x="233.220338983051" y="199.633027522936" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--primary-text)">Recompute from source</text>
  <text x="233.220338983051" y="236.880733944954" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--primary-text)">Narrow: local replay</text>
  <text x="233.220338983051" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--primary-text)">Wide: re-shuffle</text>

  <rect x="446.779661016949" y="77.247706422018" width="386.440677966102" height="244.770642201835" rx="8.322529668181" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.806324170452" font-weight="bold" fill="var(--ok-text)">Checkpointing</text>
  <text x="640" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--ok-text)">Persist to HDFS/S3</text>
  <text x="640" y="199.633027522936" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--ok-text)">Truncates lineage</text>
  <text x="640" y="236.880733944954" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--ok-text)">For iterative jobs</text>
  <text x="640" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--ok-text)">Required in Streaming</text>

  <rect x="853.559322033898" y="77.247706422018" width="386.440677966102" height="244.770642201835" rx="8.322529668181" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.806324170452" font-weight="bold" fill="var(--warn-text)">Task Retries</text>
  <text x="1046.779661016949" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--warn-text)">maxFailures=4</text>
  <text x="1046.779661016949" y="199.633027522936" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--warn-text)">Stage re-attempts</text>
  <text x="1046.779661016949" y="236.880733944954" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--warn-text)">Speculation + blacklist</text>
  <text x="1046.779661016949" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--warn-text)">Idempotency assumed</text>

  <rect x="40" y="359.266055045872" width="386.440677966102" height="260.733944954128" rx="8.322529668181" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="401.834862385321" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.806324170452" font-weight="bold" fill="var(--info-text)">Driver Recovery</text>
  <text x="233.220338983051" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--info-text)">Single point of failure</text>
  <text x="233.220338983051" y="481.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--info-text)">--supervise mode</text>
  <text x="233.220338983051" y="518.899082568807" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--info-text)">Streaming WAL</text>
  <text x="233.220338983051" y="556.146788990826" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--info-text)">Restart via YARN/K8s</text>

  <rect x="446.779661016949" y="359.266055045872" width="386.440677966102" height="260.733944954128" rx="8.322529668181" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="401.834862385321" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.806324170452" font-weight="bold" fill="var(--danger-text)">Executor Loss</text>
  <text x="640" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--danger-text)">Blocks recomputed</text>
  <text x="640" y="481.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--danger-text)">Shuffle may vanish</text>
  <text x="640" y="518.899082568807" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--danger-text)">FetchFailed re-stages</text>
  <text x="640" y="556.146788990826" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--danger-text)">Dynamic allocation</text>

  <rect x="853.559322033898" y="359.266055045872" width="386.440677966102" height="260.733944954128" rx="8.322529668181" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1046.779661016949" y="401.834862385321" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.806324170452" font-weight="bold" fill="var(--text)">Guarantees</text>
  <text x="1046.779661016949" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--text-muted)">Batch: at-least-once</text>
  <text x="1046.779661016949" y="481.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--text-muted)">Streaming: exactly-once</text>
  <text x="1046.779661016949" y="518.899082568807" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--text-muted)">With replayable source</text>
  <text x="1046.779661016949" y="556.146788990826" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--text-muted)">Idempotent sinks</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">DAG Execution in Spark</text>

  <!-- Stage 1 (narrow transformations) -->
  <rect x="40" y="90" width="380" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Stage 1 — narrow</text>

  <rect x="70" y="150" width="130" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="135" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">textFile</text>

  <rect x="260" y="150" width="130" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="325" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">map</text>
  <text x="325" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">filter</text>

  <line x1="200" y1="180" x2="258" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="230" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">No shuffle — same partition</text>
  <text x="230" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">pipelined into one task</text>

  <!-- Shuffle boundary -->
  <line x1="430" y1="200" x2="520" y2="200" stroke="var(--warn-accent)" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)"/>
  <text x="475" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">shuffle</text>

  <!-- Stage 2 (wide transformations) -->
  <rect x="540" y="90" width="380" height="220" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="730" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Stage 2 — wide</text>

  <rect x="570" y="150" width="140" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">groupByKey</text>

  <rect x="750" y="150" width="140" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="820" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">reduceByKey</text>

  <line x1="710" y1="180" x2="748" y2="180" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="730" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Requires data movement</text>
  <text x="730" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">across the network</text>

  <!-- Action triggers -->
  <line x1="930" y1="200" x2="1020" y2="200" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="975" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-accent)">action</text>

  <rect x="1040" y="150" width="200" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1140" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">collect()</text>
  <text x="1140" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">count()</text>
  <text x="1140" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">saveAsTextFile()</text>

  <!-- Explanatory panel -->
  <rect x="40" y="340" width="1200" height="260" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">How the DAG is built</text>

  <text x="80" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">1. Transformations (map/filter/flatMap) are lazy. Spark records them as a graph but does not execute.</text>
  <text x="80" y="438" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">2. When an action is called, the DAGScheduler walks the graph from output back to sources.</text>
  <text x="80" y="466" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">3. Every shuffle boundary (wide transformation) starts a new stage.</text>
  <text x="80" y="494" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">4. Inside a stage, narrow transformations are pipelined into one task per partition.</text>
  <text x="80" y="522" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">5. The TaskScheduler sends tasks to executors; cluster manager allocates cores.</text>
  <text x="80" y="550" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">6. If a partition fails, Spark re-runs only the lost tasks using the DAG (lineage).</text>
  <text x="80" y="578" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">7. Fewer shuffles → fewer stages → faster jobs. Prefer reduceByKey over groupByKey.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="380" height="261.568627450981" rx="8.531372323694" fill="var(--surface)" stroke="var(--border)"/>
  <text x="230" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--text)">Stage 1 — narrow</text>
  <rect x="70" y="108.235294117647" width="130" height="79.607843137255" rx="8.531372323694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--primary-text)">textFile</text>
  <rect x="260" y="108.235294117647" width="130" height="79.607843137255" rx="8.531372323694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325" y="142.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--primary-text)">map</text>
  <text x="325" y="167.372549019608" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--primary-text)">filter</text>
  <line x1="200" y1="148.039215686274" x2="258" y2="148.039215686274" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--text-muted)">no shuffle</text>
  <text x="230" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--text-muted)">pipelined per partition</text>

  <line x1="430" y1="170.78431372549" x2="520" y2="170.78431372549" stroke="var(--warn-accent)" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow-warn)"/>
  <text x="475" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" font-weight="bold" fill="var(--warn-accent)">shuffle</text>

  <rect x="540" y="40" width="380" height="261.568627450981" rx="8.531372323694" fill="var(--surface)" stroke="var(--border)"/>
  <text x="730" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" font-weight="bold" fill="var(--text)">Stage 2 — wide</text>
  <rect x="570" y="108.235294117647" width="140" height="79.607843137255" rx="8.531372323694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--warn-text)">groupByKey</text>
  <rect x="750" y="108.235294117647" width="140" height="79.607843137255" rx="8.531372323694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--warn-text)">reduceByKey</text>
  <line x1="710" y1="148.039215686274" x2="748" y2="148.039215686274" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="730" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--text-muted)">cross-network data move</text>

  <line x1="930" y1="170.78431372549" x2="1020" y2="170.78431372549" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="975" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" font-weight="bold" fill="var(--ok-accent)">action</text>

  <rect x="1040" y="108.235294117647" width="200" height="136.470588235295" rx="8.531372323694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="153.725490196079" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" font-weight="bold" fill="var(--ok-text)">collect</text>
  <text x="1140" y="182.156862745098" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">count</text>
  <text x="1140" y="210.588235294117" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">save</text>

  <rect x="40" y="335.686274509804" width="1200" height="284.313725490196" rx="8.531372323694" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="375.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--text)">How the DAG runs</text>
  <text x="80" y="420.980392156862" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Transformations are lazy</text>
  <text x="80" y="455.098039215686" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Action triggers DAGScheduler</text>
  <text x="80" y="489.21568627451" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Each shuffle starts a new stage</text>
  <text x="80" y="523.333333333333" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Narrow ops pipelined per task</text>
  <text x="680" y="420.980392156862" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">TaskScheduler assigns executors</text>
  <text x="680" y="455.098039215686" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Lineage allows partition retry</text>
  <text x="680" y="489.21568627451" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Fewer shuffles, faster jobs</text>
  <text x="680" y="523.333333333333" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Prefer reduceByKey</text>
</svg>

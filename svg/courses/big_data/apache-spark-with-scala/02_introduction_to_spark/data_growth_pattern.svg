<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.748354" font-weight="bold" fill="var(--text)">Data Growth Pattern</text>

  <rect x="40" y="69.635036" width="760" height="423.357664" rx="6.172697" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <line x1="100" y1="450.656934" x2="760" y2="450.656934" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="100" y1="450.656934" x2="100" y2="111.970803" stroke="var(--text-muted)" stroke-width="2"/>

  <text x="420" y="487.70073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Year</text>
  <text x="60" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" transform="rotate(-90 60 300)">Data Volume</text>

  <text x="140" y="471.824818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--text-muted)">2005</text>
  <text x="250" y="471.824818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--text-muted)">2010</text>
  <text x="360" y="471.824818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--text-muted)">2015</text>
  <text x="470" y="471.824818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--text-muted)">2020</text>
  <text x="580" y="471.824818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--text-muted)">2025</text>
  <text x="690" y="471.824818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--text-muted)">2030</text>

  <rect x="130" y="429.489051" width="30" height="19.051095" rx="3.086349" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="240" y="408.321168" width="30" height="40.218978" rx="3.086349" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="350" y="365.985401" width="30" height="82.554745" rx="3.086349" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="460" y="291.89781" width="30" height="156.642336" rx="3.086349" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="570" y="196.642336" width="30" height="251.89781" rx="3.086349" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="680" y="122.554745" width="30" height="325.985401" rx="3.086349" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>

  <text x="145" y="421.021898" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.345394" fill="var(--text-muted)">130 EB</text>
  <text x="255" y="399.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.345394" fill="var(--text-muted)">1 ZB</text>
  <text x="365" y="357.518248" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.345394" fill="var(--text-muted)">12 ZB</text>
  <text x="475" y="283.430657" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.345394" fill="var(--text-muted)">64 ZB</text>
  <text x="585" y="188.175182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.345394" fill="var(--text-muted)">180 ZB</text>
  <text x="695" y="114.087591" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.345394" fill="var(--text-muted)">400 ZB</text>

  <path d="M 145 439.014599 Q 255 408.321168 365 371.277372 Q 475 302.481752 585 201.934307 Q 635 154.306569 695 127.846715" fill="none" stroke="var(--danger-fill)" stroke-width="3"/>

  <text x="420" y="122.554745" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.460526" font-weight="bold" fill="var(--text)">Exponential Growth Curve</text>

  <rect x="820" y="69.635036" width="420" height="190.510949" rx="6.172697" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--primary-text)">Sources</text>
  <text x="1030" y="138.430657" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Social media feeds</text>
  <text x="1030" y="164.890511" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">IoT sensors</text>
  <text x="1030" y="191.350365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Mobile apps and logs</text>
  <text x="1030" y="217.810219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Video and images</text>
  <text x="1030" y="244.270073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Transaction systems</text>

  <rect x="820" y="281.313869" width="420" height="211.678832" rx="6.172697" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="318.357664" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--warn-text)">Why It Matters</text>
  <text x="1030" y="355.40146" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Storage costs explode</text>
  <text x="1030" y="381.861314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Single machines unfit</text>
  <text x="1030" y="408.321168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Need parallel compute</text>
  <text x="1030" y="434.781022" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Hours, not days, to insight</text>
  <text x="1030" y="461.240876" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Frameworks scale out</text>

  <rect x="40" y="514.160584" width="1200" height="105.839416" rx="6.172697" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="551.20438" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--info-text)">Scale Drives Spark</text>
  <text x="640" y="582.956204" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Data volume doubles roughly every two years; compute must scale horizontally.</text>
  <text x="640" y="609.416058" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Spark partitions work across hundreds of nodes to keep pace with the growth curve.</text>
</svg>

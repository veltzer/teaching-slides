<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="760" height="446.153845505325" rx="6.336706124493" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <line x1="100" y1="441.538461376331" x2="760" y2="441.538461376331" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="100" y1="441.538461376331" x2="100" y2="84.61538518284" stroke="var(--text-muted)" stroke-width="2"/>

  <text x="420" y="480.576923279586" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--text-muted)">Year</text>
  <text x="60" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)" transform="rotate(-90 60 300)">Data Volume</text>

  <text x="140" y="463.846154494675" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530107496" fill="var(--text-muted)">2005</text>
  <text x="250" y="463.846154494675" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530107496" fill="var(--text-muted)">2010</text>
  <text x="360" y="463.846154494675" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530107496" fill="var(--text-muted)">2015</text>
  <text x="470" y="463.846154494675" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530107496" fill="var(--text-muted)">2020</text>
  <text x="580" y="463.846154494675" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530107496" fill="var(--text-muted)">2025</text>
  <text x="690" y="463.846154494675" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530107496" fill="var(--text-muted)">2030</text>

  <rect x="130" y="419.230769311834" width="30" height="20.076923174201" rx="3.168353575531" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="240" y="396.923077247337" width="30" height="42.384615238698" rx="3.168353575531" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="350" y="352.307692064497" width="30" height="87.000000421538" rx="3.168353575531" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="460" y="274.230769311834" width="30" height="165.076923174201" rx="3.168353575531" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="570" y="173.846154494675" width="30" height="265.461537991361" rx="3.168353575531" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="680" y="95.769231742012" width="30" height="343.538460744024" rx="3.168353575531" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>

  <text x="145" y="410.307692696805" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412248986" fill="var(--text-muted)">130 EB</text>
  <text x="255" y="388.000000632308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412248986" fill="var(--text-muted)">1 ZB</text>
  <text x="365" y="343.384615449468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412248986" fill="var(--text-muted)">12 ZB</text>
  <text x="475" y="265.307692696805" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412248986" fill="var(--text-muted)">64 ZB</text>
  <text x="585" y="164.923076825799" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412248986" fill="var(--text-muted)">180 ZB</text>
  <text x="695" y="86.846154073136" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412248986" fill="var(--text-muted)">400 ZB</text>

  <path d="M 145 429.269231425858 Q 255 396.923077247337 365 357.884615344083 Q 475 285.384615871006 585 179.42307777426 Q 635 129.230769311834 695 101.346153967752" fill="none" stroke="var(--danger-fill)" stroke-width="3"/>

  <text x="420" y="95.769231742012" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883683028" font-weight="bold" fill="var(--text)">Exponential Growth Curve</text>

  <rect x="820" y="40" width="420" height="200.769230688166" rx="6.336706124493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="79.038461903254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118373479" font-weight="bold" fill="var(--primary-text)">Sources</text>
  <text x="1030" y="112.500000526923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--primary-text)">Social media feeds</text>
  <text x="1030" y="140.384615871006" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--primary-text)">IoT sensors</text>
  <text x="1030" y="168.269231215089" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--primary-text)">Mobile apps and logs</text>
  <text x="1030" y="196.153846559172" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--primary-text)">Video and images</text>
  <text x="1030" y="224.038461903254" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--primary-text)">Transaction systems</text>

  <rect x="820" y="263.076923806509" width="420" height="223.076922752663" rx="6.336706124493" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="302.115384655917" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118373479" font-weight="bold" fill="var(--warn-text)">Why It Matters</text>
  <text x="1030" y="341.153846559172" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--warn-text)">Storage costs explode</text>
  <text x="1030" y="369.038461903254" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--warn-text)">Single machines unfit</text>
  <text x="1030" y="396.923077247337" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--warn-text)">Need parallel compute</text>
  <text x="1030" y="424.80769259142" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--warn-text)">Hours, not days, to insight</text>
  <text x="1030" y="452.692307935503" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--warn-text)">Frameworks scale out</text>

  <rect x="40" y="508.461538623669" width="1200" height="111.538461376331" rx="6.336706124493" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="547.500000526923" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118373479" font-weight="bold" fill="var(--info-text)">Scale Drives Spark</text>
  <text x="640" y="580.961538096746" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--info-text)">Data volume doubles roughly every two years; compute must scale horizontally.</text>
  <text x="640" y="608.846153440829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647966007" fill="var(--info-text)">Spark partitions work across hundreds of nodes to keep pace with the growth curve.</text>
</svg>

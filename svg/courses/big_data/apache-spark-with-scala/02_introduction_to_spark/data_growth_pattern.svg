  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.748354" font-weight="bold" fill="var(--text)">Data Growth Pattern</text>

  <rect x="40" y="69.635036" width="760" height="423.357664" rx="6.172697" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <line x1="100" y1="450.656934" x2="760" y2="450.656934" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="100" y1="450.656934" x2="100" y2="111.970803" stroke="var(--text-muted)" stroke-width="2"/>

  <text x="420" y="487.70073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Year</text>

  <text x="690" y="471.824818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--text-muted)">2030</text>

  <rect x="130" y="429.489051" width="30" height="19.051095" rx="3.086349" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="240" y="408.321168" width="30" height="40.218978" rx="3.086349" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="350" y="365.985401" width="30" height="82.554745" rx="3.086349" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="460" y="291.89781" width="30" height="156.642336" rx="3.086349" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="570" y="196.642336" width="30" height="251.89781" rx="3.086349" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>
  <rect x="680" y="122.554745" width="30" height="325.985401" rx="3.086349" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1" filter="url(#shadow)"/>


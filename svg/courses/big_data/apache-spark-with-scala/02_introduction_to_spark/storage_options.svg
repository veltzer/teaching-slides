<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Spark Storage Layer</text>

  <line x1="320" y1="130" x2="180" y2="178" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="130" x2="500" y2="178" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="130" x2="780" y2="178" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="130" x2="1100" y2="178" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="180" width="285" height="230" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">HDFS</text>
  <text x="182" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">on-prem clusters</text>
  <text x="182" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">data locality</text>
  <text x="182" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">hdfs://...</text>

  <rect x="345" y="180" width="285" height="230" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">S3 / GCS / ADLS</text>
  <text x="487" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">cloud object store</text>
  <text x="487" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">pay per GB</text>
  <text x="487" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">s3a://bucket/...</text>

  <rect x="650" y="180" width="285" height="230" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">JDBC / Hive</text>
  <text x="792" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">warehouse tables</text>
  <text x="792" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">pushdown filters</text>
  <text x="792" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">catalog-aware</text>

  <rect x="955" y="180" width="285" height="230" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Local / NFS</text>
  <text x="1097" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">dev and test only</text>
  <text x="1097" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">no fault tolerance</text>
  <text x="1097" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">file:///path</text>

  <rect x="40" y="440" width="1200" height="180" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Formats layered on top</text>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Parquet / ORC columnar</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Avro / JSON row</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Delta / Iceberg / Hudi ACID</text>
</svg>

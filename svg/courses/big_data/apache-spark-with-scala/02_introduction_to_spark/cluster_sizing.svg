<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <rect x="40" y="40" width="290" height="450" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Cores</text>
  <text x="185" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">1 core per task</text>
  <text x="185" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">4-5 cores per</text>
  <text x="185" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">executor is ideal</text>
  <text x="185" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">More saturates HDFS</text>
  <text x="185" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Fewer wastes JVM</text>
  <text x="185" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Leave 1 for OS</text>
  <text x="185" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">per worker node</text>

  <rect x="340" y="40" width="290" height="450" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Memory</text>
  <text x="485" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Budget for cache</text>
  <text x="485" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">and shuffle both</text>
  <text x="485" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">8-32 GB executor</text>
  <text x="485" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">sweet spot</text>
  <text x="485" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Reserve YARN</text>
  <text x="485" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">overhead ~10%</text>
  <text x="485" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Avoid 50+ GB heaps</text>

  <rect x="640" y="40" width="290" height="450" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Executors</text>
  <text x="785" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Aim for 2-5 per</text>
  <text x="785" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">node, not one giant</text>
  <text x="785" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Parallelism scales</text>
  <text x="785" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">with count</text>
  <text x="785" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Dynamic alloc</text>
  <text x="785" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">adjusts at runtime</text>
  <text x="785" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Match to workload</text>

  <rect x="940" y="40" width="300" height="450" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Storage</text>
  <text x="1090" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Plan shuffle spill</text>
  <text x="1090" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">disk capacity</text>
  <text x="1090" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">SSDs help shuffle</text>
  <text x="1090" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">heavy jobs</text>
  <text x="1090" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Data locality</text>
  <text x="1090" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">matters for HDFS</text>
  <text x="1090" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Right-size nodes</text>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Sizing rule of thumb</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Start small, measure, then scale. Benchmark representative jobs first.</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Cost follows executors x memory x time — tune all three together.</text>
</svg>

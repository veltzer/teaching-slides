<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="290" height="450" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Standalone</text>
  <text x="185" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Built-in manager</text>
  <text x="185" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Master + workers</text>
  <text x="185" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Simplest setup</text>
  <text x="185" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Dev and small</text>
  <text x="185" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">prod clusters</text>
  <text x="185" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">No extra deps</text>
  <text x="185" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Ships with Spark</text>
  <text x="185" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">FIFO scheduler</text>

  <rect x="340" y="40" width="290" height="450" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">YARN</text>
  <text x="485" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Hadoop resource</text>
  <text x="485" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">manager</text>
  <text x="485" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Client or cluster</text>
  <text x="485" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Shares HDFS</text>
  <text x="485" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Queues + ACLs</text>
  <text x="485" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Kerberos auth</text>
  <text x="485" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Common on-prem</text>
  <text x="485" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Dynamic alloc</text>

  <rect x="640" y="40" width="290" height="450" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Kubernetes</text>
  <text x="785" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Driver + execs</text>
  <text x="785" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">run as pods</text>
  <text x="785" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Container images</text>
  <text x="785" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Cloud-native</text>
  <text x="785" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Namespaces iso</text>
  <text x="785" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">GA since 3.1</text>
  <text x="785" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Shared infra</text>
  <text x="785" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Elastic scaling</text>

  <rect x="940" y="40" width="300" height="450" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Mesos (legacy)</text>
  <text x="1090" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">General-purpose</text>
  <text x="1090" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">cluster manager</text>
  <text x="1090" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Fine-grain offers</text>
  <text x="1090" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Deprecated in</text>
  <text x="1090" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Spark 3.x</text>
  <text x="1090" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Rarely chosen</text>
  <text x="1090" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">for new work</text>
  <text x="1090" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Prefer K8s</text>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Pick by environment</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Dev: standalone. Hadoop shops: YARN. Cloud-native: Kubernetes.</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Spark abstracts the choice — application code stays the same.</text>
</svg>

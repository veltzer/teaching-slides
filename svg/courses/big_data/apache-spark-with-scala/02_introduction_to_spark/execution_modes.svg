<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.945762" font-weight="bold" fill="var(--text)">Spark Execution Modes</text>

  <rect x="40" y="72.222222" width="390" height="268.518519" rx="6.218253" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--primary-text)">Local Mode</text>
  <text x="235" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--primary-text)">Single JVM, multi-thread</text>
  <text x="235" y="177.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--primary-text)">local[*] uses all cores</text>
  <text x="235" y="205.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--primary-text)">No cluster manager needed</text>
  <text x="235" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" font-weight="bold" fill="var(--primary-text)">Use for:</text>
  <text x="235" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">dev, unit tests, IDE debug</text>
  <text x="235" y="299.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">small datasets only</text>

  <rect x="445" y="72.222222" width="390" height="268.518519" rx="6.218253" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--ok-text)">Client Mode</text>
  <text x="640" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--ok-text)">Driver runs on submit host</text>
  <text x="640" y="177.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--ok-text)">Executors on cluster nodes</text>
  <text x="640" y="205.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--ok-text)">Gateway must stay online</text>
  <text x="640" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" font-weight="bold" fill="var(--ok-text)">Use for:</text>
  <text x="640" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">interactive shells</text>
  <text x="640" y="299.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">notebooks, ad-hoc queries</text>

  <rect x="850" y="72.222222" width="390" height="268.518519" rx="6.218253" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--info-text)">Cluster Mode</text>
  <text x="1045" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--info-text)">Driver launched inside cluster</text>
  <text x="1045" y="177.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--info-text)">Submitter can disconnect</text>
  <text x="1045" y="205.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--info-text)">Resilient to gateway loss</text>
  <text x="1045" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" font-weight="bold" fill="var(--info-text)">Use for:</text>
  <text x="1045" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">production batch jobs</text>
  <text x="1045" y="299.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">long-running pipelines</text>

  <rect x="40" y="372.962963" width="1200" height="247.037037" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="413.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758" font-weight="bold" fill="var(--text)">Cluster Managers</text>

  <rect x="80" y="437.407407" width="260" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="210" y="471.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--primary-accent)">Standalone</text>
  <text x="210" y="501.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Spark-native master</text>
  <text x="210" y="525.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Simple setup</text>
  <text x="210" y="549.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Fewer features</text>
  <text x="210" y="579.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Good for dedicated clusters</text>

  <rect x="360" y="437.407407" width="260" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="490" y="471.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--ok-accent)">YARN</text>
  <text x="490" y="501.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Hadoop resource manager</text>
  <text x="490" y="525.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Queues, ACLs, HDFS locality</text>
  <text x="490" y="549.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Shares with MR, Hive</text>
  <text x="490" y="579.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Common in on-prem</text>

  <rect x="640" y="437.407407" width="260" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="770" y="471.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--warn-accent)">Kubernetes</text>
  <text x="770" y="501.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Pods per driver/executor</text>
  <text x="770" y="525.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Elastic scaling</text>
  <text x="770" y="549.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Cloud-native default</text>
  <text x="770" y="579.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Spark 3.1+ GA</text>

  <rect x="920" y="437.407407" width="280" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="471.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618383" font-weight="bold" fill="var(--info-accent)">Mesos (deprecated)</text>
  <text x="1060" y="501.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Removed in Spark 3.5</text>
  <text x="1060" y="525.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Legacy deployments only</text>
  <text x="1060" y="549.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Migrate to K8s or YARN</text>
  <text x="1060" y="579.185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Not recommended</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Row 1: three deploy modes -->
  <rect x="40" y="40" width="383.193277310924" height="263.636363636364" rx="8.2497308797" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.596638655462" y="87.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.686759919174" font-weight="bold" fill="var(--primary-text)">Local Mode</text>
  <text x="231.596638655462" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.499461759399" fill="var(--primary-text)">Single JVM</text>
  <text x="231.596638655462" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.499461759399" fill="var(--primary-text)">local[*] = all cores</text>
  <text x="231.596638655462" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.499461759399" fill="var(--primary-text)">No manager</text>
  <text x="231.596638655462" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.468245399437" font-weight="bold" fill="var(--primary-text)">Use for: dev, tests</text>

  <rect x="443.361344537815" y="40" width="383.193277310924" height="263.636363636364" rx="8.2497308797" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="634.957983193277" y="87.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.686759919174" font-weight="bold" fill="var(--ok-text)">Client Mode</text>
  <text x="634.957983193277" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.499461759399" fill="var(--ok-text)">Driver on submit host</text>
  <text x="634.957983193277" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.499461759399" fill="var(--ok-text)">Executors on cluster</text>
  <text x="634.957983193277" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.499461759399" fill="var(--ok-text)">Gateway stays online</text>
  <text x="634.957983193277" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.468245399437" font-weight="bold" fill="var(--ok-text)">Use for: shells, notebooks</text>

  <rect x="846.72268907563" y="40" width="383.193277310924" height="263.636363636364" rx="8.2497308797" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1038.319327731092" y="87.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.686759919174" font-weight="bold" fill="var(--info-text)">Cluster Mode</text>
  <text x="1038.319327731092" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.499461759399" fill="var(--info-text)">Driver in cluster</text>
  <text x="1038.319327731092" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.499461759399" fill="var(--info-text)">Submitter disconnects</text>
  <text x="1038.319327731092" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.499461759399" fill="var(--info-text)">Gateway-resilient</text>
  <text x="1038.319327731092" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.468245399437" font-weight="bold" fill="var(--info-text)">Use for: production</text>

  <!-- Row 2: cluster managers -->
  <text x="634.957983193277" y="356.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.624327199249" font-weight="bold" fill="var(--text)">Cluster Managers</text>

  <rect x="50.084033613445" y="388" width="282.352941176471" height="232" rx="8.2497308797" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="191.260504201681" y="430.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.561894479324" font-weight="bold" fill="var(--primary-accent)">Standalone</text>
  <text x="191.260504201681" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Spark-native master</text>
  <text x="191.260504201681" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Simple setup</text>
  <text x="191.260504201681" y="535.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Dedicated clusters</text>

  <rect x="352.605042016807" y="388" width="282.352941176471" height="232" rx="8.2497308797" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="493.781512605042" y="430.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.561894479324" font-weight="bold" fill="var(--ok-accent)">YARN</text>
  <text x="493.781512605042" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Hadoop manager</text>
  <text x="493.781512605042" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">HDFS locality</text>
  <text x="493.781512605042" y="535.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">On-prem default</text>

  <rect x="655.126050420168" y="388" width="282.352941176471" height="232" rx="8.2497308797" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="796.302521008403" y="430.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.561894479324" font-weight="bold" fill="var(--warn-accent)">Kubernetes</text>
  <text x="796.302521008403" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Pods per executor</text>
  <text x="796.302521008403" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Elastic scaling</text>
  <text x="796.302521008403" y="535.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Cloud-native</text>

  <rect x="957.647058823529" y="388" width="282.352941176471" height="232" rx="8.2497308797" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1098.823529411765" y="430.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.561894479324" font-weight="bold" fill="var(--info-accent)">Mesos</text>
  <text x="1098.823529411765" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Deprecated</text>
  <text x="1098.823529411765" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Removed in 3.5</text>
  <text x="1098.823529411765" y="535.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.437029039475" fill="var(--text-muted)">Migrate away</text>
</svg>

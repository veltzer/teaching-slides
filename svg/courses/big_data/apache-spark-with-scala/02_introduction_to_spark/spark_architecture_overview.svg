<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="110.956522" rx="6.02603" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="95.478261" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.104122" font-weight="bold" fill="var(--primary-text)">Driver Program</text>
  <text x="640" y="125.73913" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076" fill="var(--primary-text)">SparkContext builds DAG and schedules stages</text>

  <rect x="40" y="191.304348" width="1200" height="100.869565" rx="6.02603" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="231.652174" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.095445" font-weight="bold" fill="var(--info-text)">Cluster Manager</text>
  <text x="640" y="263.930435" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.065076" fill="var(--info-text)">YARN / Kubernetes / Standalone</text>

  <line x1="640" y1="150.956522" x2="640" y2="189.286957" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="332.521739" width="380" height="262.26087" rx="6.02603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="372.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" font-weight="bold" fill="var(--ok-text)">Worker 1</text>
  <rect x="70" y="393.043478" width="320" height="80.695652" rx="6.02603" fill="var(--ok-accent)"/>
  <text x="230" y="428.347826" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--ok-text)">Executor</text>
  <text x="230" y="453.565217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.056399" fill="var(--ok-text)">cache + tasks</text>
  <rect x="70" y="493.913043" width="150" height="70.608696" rx="6.02603" fill="var(--ok-accent)"/>
  <text x="145" y="534.26087" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060738" fill="var(--ok-text)">Task</text>
  <rect x="240" y="493.913043" width="150" height="70.608696" rx="6.02603" fill="var(--ok-accent)"/>
  <text x="315" y="534.26087" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060738" fill="var(--ok-text)">Task</text>

  <rect x="450" y="332.521739" width="380" height="262.26087" rx="6.02603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="372.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" font-weight="bold" fill="var(--ok-text)">Worker 2</text>
  <rect x="480" y="393.043478" width="320" height="80.695652" rx="6.02603" fill="var(--ok-accent)"/>
  <text x="640" y="428.347826" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--ok-text)">Executor</text>
  <rect x="480" y="493.913043" width="150" height="70.608696" rx="6.02603" fill="var(--ok-accent)"/>
  <text x="555" y="534.26087" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060738" fill="var(--ok-text)">Task</text>
  <rect x="650" y="493.913043" width="150" height="70.608696" rx="6.02603" fill="var(--ok-accent)"/>
  <text x="725" y="534.26087" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060738" fill="var(--ok-text)">Task</text>

  <rect x="860" y="332.521739" width="380" height="262.26087" rx="6.02603" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="372.869565" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.086768" font-weight="bold" fill="var(--ok-text)">Worker 3</text>
  <rect x="890" y="393.043478" width="320" height="80.695652" rx="6.02603" fill="var(--ok-accent)"/>
  <text x="1050" y="428.347826" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.069415" font-weight="bold" fill="var(--ok-text)">Executor</text>
  <rect x="890" y="493.913043" width="150" height="70.608696" rx="6.02603" fill="var(--ok-accent)"/>
  <text x="965" y="534.26087" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060738" fill="var(--ok-text)">Task</text>
  <rect x="1060" y="493.913043" width="150" height="70.608696" rx="6.02603" fill="var(--ok-accent)"/>
  <text x="1135" y="534.26087" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060738" fill="var(--ok-text)">Task</text>

  <line x1="230" y1="292.173913" x2="230" y2="330.504348" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="640" y1="292.173913" x2="640" y2="330.504348" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1050" y1="292.173913" x2="1050" y2="330.504348" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060738" fill="var(--text-muted)">Driver ships tasks; results stream back</text>
</svg>

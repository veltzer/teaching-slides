<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318608805568" font-weight="bold" fill="var(--text)">Executor JVM Heap</text>

  <rect x="40" y="60.714285714286" width="1200" height="51.785714285714" rx="4.070801956793" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--danger-text)">Reserved - 300 MB</text>
  <text x="640" y="102.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--danger-text)">hardcoded; Spark internals</text>

  <rect x="40" y="122.857142857143" width="300" height="186.428571428571" rx="4.070801956793" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="153.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--info-text)">User Memory</text>
  <text x="190" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--info-text)">~40% default</text>
  <text x="190" y="221.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--info-text)">UDF locals</text>
  <text x="190" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--info-text)">user structures</text>
  <text x="190" y="273.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--info-text)">lineage metadata</text>

  <rect x="340" y="122.857142857143" width="900" height="186.428571428571" rx="4.070801956793" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="151.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--primary-text)">Unified Memory (fraction 0.6)</text>

  <rect x="360" y="174.642857142857" width="430" height="119.107142857143" rx="4.070801956793" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--ok-text)">Storage</text>
  <text x="575" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--ok-text)">cached DataFrames</text>
  <text x="575" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--ok-text)">broadcast variables</text>
  <text x="575" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--ok-text)">protected to 0.5</text>

  <rect x="795" y="174.642857142857" width="430" height="119.107142857143" rx="4.070801956793" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010" y="200.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--warn-text)">Execution</text>
  <text x="1010" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--warn-text)">shuffles, joins, sorts</text>
  <text x="1010" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--warn-text)">hash tables</text>
  <text x="1010" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.19470538118" fill="var(--warn-text)">can evict storage</text>

  <rect x="40" y="324.821428571429" width="1200" height="62.142857142857" rx="4.070801956793" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="350.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" font-weight="bold" fill="var(--text)">Off-heap (Tungsten)</text>
  <text x="640" y="373.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">Skips GC, relieves heap pressure.</text>

  <rect x="40" y="402.5" width="590" height="217.5" rx="6.106202935189" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="433.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--text)">Sizing Rules</text>
  <text x="60" y="464.642857142857" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">executor.memory 4-16 GB</text>
  <text x="60" y="490.535714285714" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">overhead = max(384 MB, 10%)</text>
  <text x="60" y="516.428571428572" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">raise fraction if user-code lean</text>
  <text x="60" y="542.321428571429" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">lower storageFraction on spills</text>
  <text x="60" y="568.214285714286" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">check UI: Peak Execution Mem</text>

  <rect x="650" y="402.5" width="590" height="217.5" rx="6.106202935189" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945" y="433.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--text)">Symptom to Fix</text>
  <text x="670" y="464.642857142857" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--danger-border)" font-weight="bold">Heap OOM</text>
  <text x="670" y="485.357142857143" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">raise executor.memory</text>
  <text x="670" y="516.428571428572" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--danger-border)" font-weight="bold">Container killed</text>
  <text x="670" y="537.142857142857" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">raise memoryOverhead</text>
  <text x="670" y="568.214285714286" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--danger-border)" font-weight="bold">Heavy spill</text>
  <text x="670" y="588.928571428572" font-family="Arial, sans-serif" font-size="12.212405870379" fill="var(--text-muted)">more partitions + AQE</text>
</svg>

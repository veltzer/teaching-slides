<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--text)">Executor JVM Heap (spark.executor.memory)</text>

  <rect x="40" y="61.090909" width="1200" height="52.727273" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.290909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--danger-text)">Reserved Memory — 300 MB</text>
  <text x="640" y="104.327273" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--danger-text)">hardcoded; Spark internal objects; executor fails if heap &lt; 1.5 * reserved</text>

  <rect x="40" y="124.363636" width="300" height="179.272727" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--info-text)">User Memory</text>
  <text x="190" y="182.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">(1 - memory.fraction)</text>
  <text x="190" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">default = 40%</text>
  <text x="190" y="235.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">UDF local vars,</text>
  <text x="190" y="254.072727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">user data structures,</text>
  <text x="190" y="273.054545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--info-text)">RDD lineage metadata</text>

  <rect x="340" y="124.363636" width="900" height="179.272727" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--primary-text)">Unified Memory (spark.memory.fraction, default 0.6)</text>

  <rect x="360" y="177.090909" width="430" height="110.727273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--ok-text)">Storage</text>
  <text x="575" y="227.709091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--ok-text)">cached RDDs / DataFrames</text>
  <text x="575" y="248.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--ok-text)">broadcast variables</text>
  <text x="575" y="274.109091" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--ok-text)">protected up to storageFraction (0.5)</text>

  <rect x="795" y="177.090909" width="430" height="110.727273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--warn-text)">Execution</text>
  <text x="1010" y="227.709091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--warn-text)">shuffle buffers, joins, sorts</text>
  <text x="1010" y="248.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--warn-text)">aggregation hash tables</text>
  <text x="1010" y="274.109091" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--warn-text)">can evict storage if more is needed</text>

  <text x="790" y="308.909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" font-style="italic" fill="var(--primary-text)">Boundary is elastic — either region grows into the other on demand.</text>

  <rect x="40" y="330" width="1200" height="73.818182" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="356.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--text)">Off-heap (spark.memory.offHeap.enabled, sizeInBytes)</text>
  <text x="640" y="382.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">Native Tungsten buffers. Skips GC. Reduces heap pressure for wide aggregations.</text>

  <rect x="40" y="419.636364" width="590" height="200.363636" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="449.163636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" font-weight="bold" fill="var(--text)">Sizing rules of thumb</text>
  <text x="60" y="477.636364" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">- executor.memory 4-16 GB, 5 cores each</text>
  <text x="60" y="501.890909" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">- memoryOverhead = max(384 MB, 10% heap)</text>
  <text x="60" y="526.145455" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">- cluster manager kills container if breached</text>
  <text x="60" y="550.4" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">- raise memory.fraction only when user code is lean</text>
  <text x="60" y="574.654545" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">- lower storageFraction if shuffles spill heavily</text>
  <text x="60" y="598.909091" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">- inspect UI: Peak Execution Mem per task</text>

  <rect x="650" y="419.636364" width="590" height="200.363636" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945" y="449.163636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.40366" font-weight="bold" fill="var(--text)">Failure symptoms -> fix</text>
  <text x="670" y="477.636364" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--danger-border)" font-weight="bold">OutOfMemoryError: Java heap space</text>
  <text x="670" y="498.727273" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">-> increase executor.memory or reduce partition size</text>
  <text x="670" y="525.090909" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--danger-border)" font-weight="bold">Container killed by YARN (OOM)</text>
  <text x="670" y="546.181818" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">-> raise memoryOverhead; off-heap for native libs</text>
  <text x="670" y="572.545455" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--danger-border)" font-weight="bold">Excessive spilling to disk</text>
  <text x="670" y="593.636364" font-family="Arial, sans-serif" font-size="12.322928" fill="var(--text-muted)">-> more partitions, more executor memory, AQE</text>
</svg>

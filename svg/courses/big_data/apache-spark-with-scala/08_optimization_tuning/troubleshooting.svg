<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="590" height="183.157895" rx="6.052403" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="335" y="80.701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--danger-text)">OutOfMemoryError</text>
  <text x="335" y="116.315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--danger-text)">Driver: too much collect or broadcast</text>
  <text x="335" y="141.754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--danger-text)">Executor: skewed keys, huge shuffle</text>
  <text x="335" y="172.280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--danger-text)">Fix: bump memory, reduce collect,</text>
  <text x="335" y="197.719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--danger-text)">salt skewed joins, raise overhead</text>

  <rect x="650" y="40" width="590" height="183.157895" rx="6.052403" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="945" y="80.701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--warn-text)">Data Skew</text>
  <text x="945" y="116.315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">One task runs for minutes while</text>
  <text x="945" y="141.754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">others finish in seconds</text>
  <text x="945" y="172.280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">Fix: enable AQE skew join,</text>
  <text x="945" y="197.719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">salt hot keys, pre-aggregate</text>

  <rect x="40" y="243.508772" width="590" height="183.157895" rx="6.052403" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="335" y="284.210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--info-text)">Shuffle Bottleneck</text>
  <text x="335" y="319.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">Huge shuffle read or disk spill</text>
  <text x="335" y="345.263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">Network saturated</text>
  <text x="335" y="375.789474" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">Fix: filter early, broadcast small,</text>
  <text x="335" y="401.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">tune shuffle.partitions, enable AQE</text>

  <rect x="650" y="243.508772" width="590" height="183.157895" rx="6.052403" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="945" y="284.210526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--primary-text)">Slow Stage</text>
  <text x="945" y="319.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--primary-text)">Low CPU utilisation</text>
  <text x="945" y="345.263158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--primary-text)">Or GC dominates task time</text>
  <text x="945" y="375.789474" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--primary-text)">Fix: repartition up, cache reused,</text>
  <text x="945" y="401.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--primary-text)">swap UDF for built-in function</text>

  <rect x="40" y="447.017544" width="1200" height="172.982456" rx="6.052403" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="485.684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--text)">Debugging Playbook</text>
  <text x="640" y="521.298246" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">1. Open Spark UI and sort stages by duration</text>
  <text x="640" y="551.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">2. Inspect task summary - median vs max reveals skew</text>
  <text x="640" y="582.350877" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">3. Check stderr for the driver stack, then executor logs</text>
  <text x="640" y="609.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--text-faint)">Reproduce locally with a representative sample before tuning at scale</text>
</svg>

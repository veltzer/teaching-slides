<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="590" height="193.333333333333" rx="6.21825270206" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="335" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--danger-text)">OutOfMemoryError</text>
  <text x="335" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--danger-text)">Driver: large collect / broadcast</text>
  <text x="335" y="142.037037037038" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--danger-text)">Executor: skew, huge shuffle</text>
  <text x="335" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" font-style="italic" fill="var(--danger-text)">Fix: bump memory, salt, raise overhead</text>

  <rect x="650" y="40" width="590" height="193.333333333333" rx="6.21825270206" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="945" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--warn-text)">Data Skew</text>
  <text x="945" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">One task runs minutes</text>
  <text x="945" y="142.037037037038" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">Others finish in seconds</text>
  <text x="945" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" font-style="italic" fill="var(--warn-text)">Fix: AQE skew join, salt hot keys</text>

  <rect x="40" y="254.814814814815" width="590" height="193.333333333333" rx="6.21825270206" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="335" y="292.407407407408" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--info-text)">Shuffle Bottleneck</text>
  <text x="335" y="330.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">Huge read or spill</text>
  <text x="335" y="356.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">Network saturated</text>
  <text x="335" y="399.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" font-style="italic" fill="var(--info-text)">Fix: filter early, broadcast small</text>

  <rect x="650" y="254.814814814815" width="590" height="193.333333333333" rx="6.21825270206" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="945" y="292.407407407408" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--primary-text)">Slow Stage</text>
  <text x="945" y="330.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">Low CPU use</text>
  <text x="945" y="356.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">GC dominates</text>
  <text x="945" y="399.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" font-style="italic" fill="var(--primary-text)">Fix: repartition, cache, built-ins</text>

  <rect x="40" y="469.62962962963" width="1200" height="150.37037037037" rx="6.21825270206" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="507.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.618382655835" font-weight="bold" fill="var(--text)">Playbook</text>
  <text x="640" y="539.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--text-muted)">1. Spark UI → slowest stage</text>
  <text x="640" y="566.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--text-muted)">2. Task summary: median vs max</text>
  <text x="640" y="593.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--text-muted)">3. Driver stack, then executor logs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.945762" font-weight="bold" fill="var(--text)">Spark Executor Configuration</text>

  <rect x="40" y="72.222222" width="290" height="279.259259" rx="6.218253" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--primary-text)">executor.cores</text>
  <text x="185" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Tasks per executor JVM</text>
  <text x="185" y="175.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Sweet spot: 4-5 cores</text>
  <text x="185" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">More: HDFS thread contention</text>
  <text x="185" y="237.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Fewer: wasted overhead</text>
  <text x="185" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Leave 1 core per node for OS</text>
  <text x="185" y="302.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--primary-text)">total tasks = executors x cores</text>
  <text x="185" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--primary-text)">drives parallelism</text>

  <rect x="340" y="72.222222" width="290" height="279.259259" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--ok-text)">executor.memory</text>
  <text x="485" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">JVM heap per executor</text>
  <text x="485" y="175.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Typical 8-32 GB</text>
  <text x="485" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Avoid &gt;64 GB (GC pain)</text>
  <text x="485" y="237.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">memoryOverhead adds ~10%</text>
  <text x="485" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">for JVM non-heap + Python</text>
  <text x="485" y="302.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--ok-text)">split among concurrent tasks</text>
  <text x="485" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--ok-text)">task mem ≈ total / cores</text>

  <rect x="640" y="72.222222" width="290" height="279.259259" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--warn-text)">num.executors</text>
  <text x="785" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">How many JVMs to launch</text>
  <text x="785" y="175.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Sum = cluster allocation</text>
  <text x="785" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Balance vs per-JVM size</text>
  <text x="785" y="237.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Too few big = slow GC</text>
  <text x="785" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Too many small = overhead</text>
  <text x="785" y="302.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--warn-text)">driver counts as 1 slot</text>
  <text x="785" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--warn-text)">reserve cores for AM</text>

  <rect x="940" y="72.222222" width="300" height="279.259259" rx="6.218253" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--info-text)">Dynamic Allocation</text>
  <text x="1090" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Scale executors at runtime</text>
  <text x="1090" y="175.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Add when backlog grows</text>
  <text x="1090" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Remove idle executors</text>
  <text x="1090" y="237.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Requires shuffle service</text>
  <text x="1090" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Set min / max / initial</text>
  <text x="1090" y="302.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--info-text)">great for shared clusters</text>
  <text x="1090" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--info-text)">and variable workloads</text>

  <rect x="40" y="383.703704" width="1200" height="236.296296" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="424.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--text)">Worked Example: 6 nodes x 16 cores x 64 GB</text>
  <text x="640" y="461.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Reserve 1 core + 1 GB per node for OS: usable 15 cores, 63 GB per node.</text>
  <text x="640" y="493.259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Pick 5 cores per executor: 3 executors per node, 18 total (minus 1 for driver = 17).</text>
  <text x="640" y="525.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Memory per executor: 63 / 3 = 21 GB. Subtract 10% overhead = executor.memory ≈ 19 GB.</text>
  <text x="640" y="557.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Total parallelism: 17 x 5 = 85 concurrent tasks — set shuffle.partitions ≈ 170-340.</text>
  <text x="640" y="596.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-faint)">Rule: fat-enough JVMs for efficient joins, thin enough to avoid GC stalls.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Four knob cards -->
  <rect x="40" y="40" width="290" height="290.000000000001" rx="10.561177090573" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.06623647209" font-weight="bold" fill="var(--primary-text)">executor.cores</text>
  <text x="185" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--primary-text)">Tasks per JVM</text>
  <text x="185" y="162.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--primary-text)">Sweet spot: 4-5</text>
  <text x="185" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--primary-text)">More: HDFS contention</text>
  <text x="185" y="229.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--primary-text)">Fewer: wasted JVM</text>
  <text x="185" y="274.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">reserve 1 core for OS</text>

  <rect x="340" y="40" width="290" height="290.000000000001" rx="10.561177090573" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.06623647209" font-weight="bold" fill="var(--ok-text)">executor.memory</text>
  <text x="485" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--ok-text)">JVM heap size</text>
  <text x="485" y="162.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--ok-text)">Typical: 8-32 GB</text>
  <text x="485" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--ok-text)">Avoid &gt;64 GB</text>
  <text x="485" y="229.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--ok-text)">+10% overhead</text>
  <text x="485" y="274.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">split across tasks</text>

  <rect x="640" y="40" width="290" height="290.000000000001" rx="10.561177090573" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.06623647209" font-weight="bold" fill="var(--warn-text)">num.executors</text>
  <text x="785" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--warn-text)">How many JVMs</text>
  <text x="785" y="162.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--warn-text)">Sum: cluster use</text>
  <text x="785" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--warn-text)">Fat: GC stalls</text>
  <text x="785" y="229.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--warn-text)">Thin: overhead</text>
  <text x="785" y="274.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">driver takes one slot</text>

  <rect x="940" y="40" width="300" height="290.000000000001" rx="10.561177090573" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.06623647209" font-weight="bold" fill="var(--info-text)">Dynamic Allocation</text>
  <text x="1090" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--info-text)">Runtime scaling</text>
  <text x="1090" y="162.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--info-text)">Add on backlog</text>
  <text x="1090" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--info-text)">Remove idle</text>
  <text x="1090" y="229.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--info-text)">Needs shuffle svc</text>
  <text x="1090" y="274.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">set min/max/initial</text>

  <!-- Worked example -->
  <rect x="40" y="363.461538461539" width="1200" height="256.538461538461" rx="10.561177090573" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="405.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--text)">Example: 6 x 16c x 64 GB</text>
  <text x="640" y="449.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--text-muted)">Reserve 1c + 1 GB per node</text>
  <text x="640" y="486.586538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--text-muted)">5 cores, 3 execs/node, 17 total</text>
  <text x="640" y="523.942307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--text-muted)">Memory: 19 GB each</text>
  <text x="640" y="561.298076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--text-muted)">Parallelism: 85 tasks</text>
  <text x="640" y="598.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926804" fill="var(--text-faint)">fat enough, thin enough</text>
</svg>

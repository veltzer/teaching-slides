<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="390" height="309.333333333333" rx="6.306459273747" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="84.190476190477" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--danger-text)">Too Few</text>
  <text x="235" y="128.380952380953" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--danger-text)">Idle cores</text>
  <text x="235" y="161.523809523809" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--danger-text)">Giant tasks, OOM</text>
  <text x="235" y="194.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--danger-text)">Heavy spill</text>
  <text x="235" y="227.809523809524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--danger-text)">Slow recovery</text>
  <text x="235" y="283.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" font-style="italic" fill="var(--danger-text)">fix: repartition(N)</text>

  <rect x="445" y="40" width="390" height="309.333333333333" rx="6.306459273747" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.190476190477" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--ok-text)">Goldilocks</text>
  <text x="640" y="128.380952380953" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">128-256 MB each</text>
  <text x="640" y="161.523809523809" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">2-10 sec per task</text>
  <text x="640" y="194.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">2-4x total cores</text>
  <text x="640" y="227.809523809524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Fits in memory</text>
  <text x="640" y="283.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" font-style="italic" fill="var(--ok-text)">AQE targets this</text>

  <rect x="850" y="40" width="390" height="309.333333333333" rx="6.306459273747" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="84.190476190477" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--warn-text)">Too Many</text>
  <text x="1045" y="128.380952380953" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Scheduler overhead</text>
  <text x="1045" y="161.523809523809" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Tiny tasks</text>
  <text x="1045" y="194.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Many small files</text>
  <text x="1045" y="227.809523809524" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Shuffle explosion</text>
  <text x="1045" y="283.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" font-style="italic" fill="var(--warn-text)">fix: coalesce(N)</text>

  <text x="640" y="399.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--text)">Tuning Knobs</text>

  <rect x="80" y="421.142857142857" width="280" height="198.857142857143" rx="6.306459273747" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="220" y="459.809523809524" text-anchor="middle" font-family="Courier New, monospace" font-size="15.766148184367" font-weight="bold" fill="var(--primary-accent)">shuffle.partitions</text>
  <text x="220" y="498.476190476191" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--text-muted)">Default 200</text>
  <text x="220" y="531.619047619048" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--text-muted)">2-4x cores</text>

  <rect x="380" y="421.142857142857" width="280" height="198.857142857143" rx="6.306459273747" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="520" y="459.809523809524" text-anchor="middle" font-family="Courier New, monospace" font-size="15.766148184367" font-weight="bold" fill="var(--info-accent)">maxPartitionBytes</text>
  <text x="520" y="498.476190476191" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--text-muted)">Default 128 MB</text>
  <text x="520" y="531.619047619048" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--text-muted)">Input split size</text>

  <rect x="680" y="421.142857142857" width="280" height="198.857142857143" rx="6.306459273747" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="820" y="459.809523809524" text-anchor="middle" font-family="Courier New, monospace" font-size="15.766148184367" font-weight="bold" fill="var(--ok-accent)">repartition / coalesce</text>
  <text x="820" y="498.476190476191" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--text-muted)">repartition shuffles</text>
  <text x="820" y="531.619047619048" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--text-muted)">coalesce merges</text>

  <rect x="980" y="421.142857142857" width="220" height="198.857142857143" rx="6.306459273747" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1090" y="459.809523809524" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.766148184367" font-weight="bold" fill="var(--warn-accent)">AQE</text>
  <text x="1090" y="498.476190476191" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--text-muted)">Default 3.2+</text>
  <text x="1090" y="531.619047619048" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--text-muted)">Auto coalesces</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="590" height="284.912281" rx="6.052403" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="80.701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--ok-text)">Do</text>
  <text x="335" y="121.403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--ok-text)">Prefer DataFrame / Dataset API</text>
  <text x="335" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--ok-text)">Cache reused datasets once</text>
  <text x="335" y="192.631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--ok-text)">Broadcast small lookup tables</text>
  <text x="335" y="228.245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--ok-text)">Enable AQE and columnar formats</text>
  <text x="335" y="263.859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--ok-text)">Filter and project early</text>
  <text x="335" y="299.473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--ok-text)">Partition output by hot columns</text>

  <rect x="650" y="40" width="590" height="284.912281" rx="6.052403" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="80.701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--danger-text)">Avoid</text>
  <text x="945" y="121.403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--danger-text)">collect() on large datasets</text>
  <text x="945" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--danger-text)">UDFs where built-ins exist</text>
  <text x="945" y="192.631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--danger-text)">Wide shuffles without need</text>
  <text x="945" y="228.245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--danger-text)">Tiny files and tiny partitions</text>
  <text x="945" y="263.859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--danger-text)">Chained caches never unpersisted</text>
  <text x="945" y="299.473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--danger-text)">Driver-side loops over rows</text>

  <rect x="40" y="345.263158" width="1200" height="274.736842" rx="6.052403" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="383.929825" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--text)">Workflow Checklist</text>
  <text x="640" y="421.578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">1. Profile first in the Spark UI, then tune the slowest stage</text>
  <text x="640" y="452.105263" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">2. Right-size partitions near 128 MB and align shuffle partitions conf</text>
  <text x="640" y="482.631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">3. Checkpoint long DAGs to truncate lineage and speed recovery</text>
  <text x="640" y="513.157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">4. Favour Parquet or ORC with snappy or zstd compression</text>
  <text x="640" y="543.684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">5. Test with production-like data volume before shipping</text>
  <text x="640" y="584.385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--text-faint)">Document tuning decisions - future you needs the context</text>
</svg>

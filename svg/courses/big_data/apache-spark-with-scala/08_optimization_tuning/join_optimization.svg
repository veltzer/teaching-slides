<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="590" height="437.54386" rx="6.052403" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="72.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--ok-text)">Broadcast Hash Join</text>

  <rect x="70" y="95.964912" width="150" height="55.964912" rx="4.034935" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="145" y="121.403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" font-weight="bold" fill="var(--text)">Driver</text>
  <text x="145" y="139.719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--text-muted)">small table</text>

  <rect x="260" y="95.964912" width="110" height="55.964912" rx="4.034935" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="315" y="126.491228" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--text)">Executor 1</text>
  <rect x="385" y="95.964912" width="110" height="55.964912" rx="4.034935" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="440" y="126.491228" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--text)">Executor 2</text>
  <rect x="510" y="95.964912" width="110" height="55.964912" rx="4.034935" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="565" y="126.491228" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--text)">Executor 3</text>

  <line x1="220" y1="123.438596" x2="258" y2="123.438596" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="220" y1="123.438596" x2="383" y2="123.438596" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="220" y1="123.438596" x2="508" y2="123.438596" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>

  <text x="335" y="187.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">Small side sent to every executor</text>
  <text x="335" y="210.947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">Large side stays local — no shuffle</text>

  <text x="70" y="253.684211" font-family="Arial, sans-serif" font-size="14.122273" font-weight="bold" fill="var(--ok-text)">When chosen:</text>
  <text x="70" y="279.122807" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">- smaller side &lt; autoBroadcastJoinThreshold</text>
  <text x="70" y="302.526316" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">- default 10 MB (spark.sql.autoBroadcast...)</text>
  <text x="70" y="325.929825" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">- statistics available in catalog</text>
  <text x="70" y="349.333333" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">- force with broadcast(df) hint</text>

  <text x="70" y="391.052632" font-family="Arial, sans-serif" font-size="14.122273" font-weight="bold" fill="var(--ok-text)">Cost:</text>
  <text x="70" y="416.491228" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">- O(N) network: driver to N executors</text>
  <text x="70" y="439.894737" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">- broadcast held in each executor heap</text>
  <text x="70" y="463.298246" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">- too large -> driver OOM</text>

  <rect x="650" y="40" width="590" height="437.54386" rx="6.052403" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="72.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--warn-text)">Shuffle Sort-Merge Join</text>

  <rect x="680" y="95.964912" width="110" height="45.789474" rx="4.034935" fill="var(--bg)" stroke="var(--warn-border)"/>
  <text x="735" y="123.438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--text)">Partition A1</text>
  <rect x="800" y="95.964912" width="110" height="45.789474" rx="4.034935" fill="var(--bg)" stroke="var(--warn-border)"/>
  <text x="855" y="123.438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--text)">Partition A2</text>
  <rect x="920" y="95.964912" width="110" height="45.789474" rx="4.034935" fill="var(--bg)" stroke="var(--warn-border)"/>
  <text x="975" y="123.438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--text)">Partition B1</text>
  <rect x="1040" y="95.964912" width="110" height="45.789474" rx="4.034935" fill="var(--bg)" stroke="var(--warn-border)"/>
  <text x="1095" y="123.438596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--text)">Partition B2</text>

  <line x1="735" y1="141.754386" x2="855" y2="177.368421" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <line x1="855" y1="141.754386" x2="855" y2="177.368421" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <line x1="975" y1="141.754386" x2="855" y2="177.368421" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>
  <line x1="1095" y1="141.754386" x2="855" y2="177.368421" stroke="var(--warn-border)" stroke-width="1.5" marker-end="url(#arrow-warn)"/>

  <rect x="800" y="182.45614" width="290" height="40.701754" rx="4.034935" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="945" y="207.894737" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" font-weight="bold" fill="var(--text)">Shuffle: hash(key) -> partition</text>

  <text x="945" y="253.684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">Both sides re-partitioned on join key</text>

  <text x="680" y="289.298246" font-family="Arial, sans-serif" font-size="14.122273" font-weight="bold" fill="var(--warn-text)">When chosen:</text>
  <text x="680" y="314.736842" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">- both sides too large to broadcast</text>
  <text x="680" y="338.140351" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">- sort-merge default; shuffle-hash rare</text>
  <text x="680" y="361.54386" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">- AQE can coalesce + skew-split at runtime</text>

  <text x="680" y="396.140351" font-family="Arial, sans-serif" font-size="14.122273" font-weight="bold" fill="var(--warn-text)">Cost:</text>
  <text x="680" y="421.578947" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">- O(M+N) network across all executors</text>
  <text x="680" y="444.982456" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">- sort step: spill to disk if &gt; memory</text>
  <text x="680" y="468.385965" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">- skewed keys -> stragglers (enable AQE)</text>

  <rect x="40" y="497.894737" width="1200" height="122.105263" rx="6.052403" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="528.421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" font-weight="bold" fill="var(--text)">Tuning knobs</text>
  <text x="640" y="556.912281" text-anchor="middle" font-family="monospace" font-size="13.113539" fill="var(--text)">spark.sql.autoBroadcastJoinThreshold=10MB   spark.sql.adaptive.enabled=true</text>
  <text x="640" y="584.385965" text-anchor="middle" font-family="monospace" font-size="13.113539" fill="var(--text)">spark.sql.adaptive.skewJoin.enabled=true   ANALYZE TABLE COMPUTE STATISTICS</text>
  <text x="640" y="609.824561" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" font-style="italic" fill="var(--text-muted)">Raise threshold cautiously — driver memory and serialization time rise with it.</text>
</svg>

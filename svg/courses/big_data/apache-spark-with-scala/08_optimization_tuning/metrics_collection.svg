  <text x="1100" y="439.805825242719" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.97971376707" font-weight="bold" fill="var(--info-text)">REST API</text>
  <text x="1100" y="471.339805825243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Custom tooling</text>

  <text x="640" y="563.68932038835" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text-muted)">metrics.properties</text>
  <text x="640" y="591.844660194175" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text-muted)">spark.eventLog.enabled</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" font-style="italic" fill="var(--text-faint)">Enable event log early</text>

  <text x="180" y="96.31067961165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.97971376707" font-weight="bold" fill="var(--primary-text)">Driver</text>
  <text x="180" y="124.466019417475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">DAGScheduler, BlockManager</text>

  <rect x="40" y="163.883495145631" width="280" height="78.834951456311" rx="6.367392662652" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="197.669902912621" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.97971376707" font-weight="bold" fill="var(--primary-text)">Executors</text>
  <text x="180" y="225.825242718446" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">JVM, shuffle, tasks</text>


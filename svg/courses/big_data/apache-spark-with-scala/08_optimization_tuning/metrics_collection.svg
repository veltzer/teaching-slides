  <text x="640" y="180.776699029126" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--ok-text)">JMX</text>

  <rect x="500" y="220.194174757281" width="280" height="67.572815533981" rx="6.367392662652" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="259.611650485437" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--ok-text)">Graphite / Ganglia</text>

  <rect x="500" y="299.029126213592" width="280" height="67.572815533981" rx="6.367392662652" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

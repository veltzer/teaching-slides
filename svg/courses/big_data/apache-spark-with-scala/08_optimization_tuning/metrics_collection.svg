  <rect x="500" y="456.699029126213" width="280" height="67.572815533981" rx="6.367392662652" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="496.116504854369" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--ok-text)">History Server</text>


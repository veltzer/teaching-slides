  <rect x="960" y="287.766990291262" width="280" height="95.728155339806" rx="6.367392662652" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="327.184466019417" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.97971376707" font-weight="bold" fill="var(--info-text)">History Server UI</text>
  <text x="1100" y="358.718446601942" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Post-mortem</text>


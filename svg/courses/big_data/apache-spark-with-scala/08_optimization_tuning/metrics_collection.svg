<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="280" height="548.363636" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="180" y="71.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--text)">Sources</text>

  <rect x="60" y="92.727273" width="240" height="73.818182" rx="4.107643" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="122.254545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--primary-text)">Driver</text>
  <text x="180" y="145.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--primary-text)">DAGScheduler, BlockManager</text>

  <rect x="60" y="182.363636" width="240" height="73.818182" rx="4.107643" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="211.890909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--primary-text)">Executors</text>
  <text x="180" y="235.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--primary-text)">JVM, Shuffle, Task metrics</text>

  <rect x="60" y="272" width="240" height="73.818182" rx="4.107643" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="301.527273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--primary-text)">Event Log</text>
  <text x="180" y="324.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--primary-text)">JSON events on HDFS/S3</text>

  <rect x="60" y="361.636364" width="240" height="73.818182" rx="4.107643" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="391.163636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--primary-text)">Application Code</text>
  <text x="180" y="414.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--primary-text)">Accumulators, SparkListener</text>

  <text x="180" y="472.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" font-weight="bold" fill="var(--text)">Configured via</text>
  <text x="180" y="498.727273" text-anchor="middle" font-family="monospace" font-size="11.296017" fill="var(--text-muted)">metrics.properties</text>
  <text x="180" y="525.090909" text-anchor="middle" font-family="monospace" font-size="11.296017" fill="var(--text-muted)">spark.eventLog.enabled</text>
  <text x="180" y="551.454545" text-anchor="middle" font-family="monospace" font-size="11.296017" fill="var(--text-muted)">spark.metrics.conf.*</text>
  <text x="180" y="577.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--text-muted)">DropWizard metrics library</text>

  <line x1="320" y1="129.636364" x2="500" y2="129.636364" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="219.272727" x2="500" y2="219.272727" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="308.909091" x2="500" y2="308.909091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="398.545455" x2="500" y2="398.545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="510" y="40" width="280" height="548.363636" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650" y="71.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--text)">Sinks</text>

  <rect x="530" y="92.727273" width="240" height="68.545455" rx="4.107643" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650" y="119.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--ok-text)">ConsoleSink / CSVSink</text>
  <text x="650" y="143.345455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--ok-text)">local debugging</text>

  <rect x="530" y="177.090909" width="240" height="68.545455" rx="4.107643" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650" y="203.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--ok-text)">JMX Sink</text>
  <text x="650" y="227.709091" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--ok-text)">JVisualVM, JConsole</text>

  <rect x="530" y="261.454545" width="240" height="68.545455" rx="4.107643" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650" y="287.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--ok-text)">Graphite / Ganglia</text>
  <text x="650" y="312.072727" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--ok-text)">legacy TSDB pipelines</text>

  <rect x="530" y="345.818182" width="240" height="68.545455" rx="4.107643" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650" y="372.181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--ok-text)">Prometheus Servlet</text>
  <text x="650" y="396.436364" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--ok-text)">/metrics/prometheus (3.0+)</text>

  <rect x="530" y="430.181818" width="240" height="68.545455" rx="4.107643" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650" y="456.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--ok-text)">StatsD / Slf4j</text>
  <text x="650" y="480.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--ok-text)">push to Datadog, logs</text>

  <rect x="530" y="514.545455" width="240" height="63.272727" rx="4.107643" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="650" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838" font-weight="bold" fill="var(--ok-text)">History Server</text>
  <text x="650" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--ok-text)">replays event log</text>

  <line x1="790" y1="219.272727" x2="970" y2="219.272727" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="398.545455" x2="970" y2="398.545455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="980" y="40" width="260" height="548.363636" rx="6.161464" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1110" y="71.636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.43057" font-weight="bold" fill="var(--text)">Consumers</text>

  <rect x="1000" y="92.727273" width="220" height="94.909091" rx="4.107643" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1110" y="124.363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--info-text)">Spark UI</text>
  <text x="1110" y="147.563636" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--info-text)">Jobs, Stages, Storage,</text>
  <text x="1110" y="166.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--info-text)">Executors, SQL tabs</text>

  <rect x="1000" y="203.454545" width="220" height="94.909091" rx="4.107643" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1110" y="235.090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--info-text)">Prometheus + Grafana</text>
  <text x="1110" y="258.290909" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--info-text)">fleet dashboards,</text>
  <text x="1110" y="277.272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--info-text)">alerting rules</text>

  <rect x="1000" y="314.181818" width="220" height="94.909091" rx="4.107643" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1110" y="345.818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--info-text)">History Server UI</text>
  <text x="1110" y="369.018182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--info-text)">post-mortem of</text>
  <text x="1110" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--info-text)">completed apps</text>

  <rect x="1000" y="424.909091" width="220" height="94.909091" rx="4.107643" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1110" y="456.545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.376749" font-weight="bold" fill="var(--info-text)">REST API</text>
  <text x="1110" y="479.745455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--info-text)">/api/v1/applications</text>
  <text x="1110" y="498.727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" fill="var(--info-text)">for custom tooling</text>

  <text x="1110" y="551.454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" font-style="italic" fill="var(--text-muted)">Correlate app metrics with</text>
  <text x="1110" y="570.436364" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.296017" font-style="italic" fill="var(--text-muted)">node_exporter host metrics.</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.322928" font-style="italic" fill="var(--text-faint)">Enable event log early — it is the only source for historical analysis once the app ends.</text>
</svg>

  <text x="180" y="299.029126213592" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.97971376707" font-weight="bold" fill="var(--primary-text)">Event Log</text>
  <text x="180" y="327.184466019417" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">JSON on HDFS/S3</text>

  <rect x="40" y="366.601941747573" width="280" height="78.834951456311" rx="6.367392662652" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="400.388349514563" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.97971376707" font-weight="bold" fill="var(--primary-text)">App Code</text>
  <text x="180" y="428.543689320388" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">Accumulators, listeners</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="61.052632" rx="6.052403" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174676" font-weight="bold" fill="var(--primary-text)">Spark UI Tabs - Port 4040</text>

  <rect x="40" y="121.403509" width="290" height="234.035088" rx="6.052403" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.148474" font-weight="bold" fill="var(--ok-text)">Jobs</text>
  <text x="185" y="192.631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">Action to job map</text>
  <text x="185" y="218.070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">Event timeline</text>
  <text x="185" y="243.508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">Succeeded or failed</text>
  <text x="185" y="268.947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">Duration distribution</text>
  <text x="185" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--ok-text)">Click a job to drill into</text>
  <text x="185" y="324.912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--ok-text)">its stages</text>

  <rect x="340" y="121.403509" width="290" height="234.035088" rx="6.052403" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.148474" font-weight="bold" fill="var(--warn-text)">Stages</text>
  <text x="485" y="192.631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">DAG of tasks</text>
  <text x="485" y="218.070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">Task summary metrics</text>
  <text x="485" y="243.508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">Shuffle read/write sizes</text>
  <text x="485" y="268.947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">Spill and GC per task</text>
  <text x="485" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">Best spot for spotting</text>
  <text x="485" y="324.912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">skew and slow tasks</text>

  <rect x="640" y="121.403509" width="290" height="234.035088" rx="6.052403" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.148474" font-weight="bold" fill="var(--info-text)">SQL / DataFrame</text>
  <text x="785" y="192.631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">Logical and physical plan</text>
  <text x="785" y="218.070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">Per-node row counts</text>
  <text x="785" y="243.508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">Scan push-down details</text>
  <text x="785" y="268.947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">AQE rewrites annotated</text>
  <text x="785" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--info-text)">Confirms broadcast joins</text>
  <text x="785" y="324.912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--info-text)">and partition pruning</text>

  <rect x="940" y="121.403509" width="300" height="234.035088" rx="6.052403" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="157.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.148474" font-weight="bold" fill="var(--danger-text)">Executors</text>
  <text x="1090" y="192.631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--danger-text)">One row per executor</text>
  <text x="1090" y="218.070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--danger-text)">Used vs max memory</text>
  <text x="1090" y="243.508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--danger-text)">GC time and task counts</text>
  <text x="1090" y="268.947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--danger-text)">Thread dumps on demand</text>
  <text x="1090" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--danger-text)">Hot link to stdout and</text>
  <text x="1090" y="324.912281" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--danger-text)">stderr log files</text>

  <rect x="40" y="375.789474" width="1200" height="244.210526" rx="6.052403" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="414.45614" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--text)">Other Useful Tabs</text>
  <text x="640" y="450.070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">Storage - cached RDDs and DataFrames, memory vs disk share</text>
  <text x="640" y="480.596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">Environment - every effective conf, classpath and JVM flags</text>
  <text x="640" y="511.122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">Streaming or Structured Streaming - batch duration and backpressure</text>
  <text x="640" y="541.649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">JDBC / ODBC Server - active sessions and submitted queries</text>
  <text x="640" y="579.298246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--text-faint)">After the app ends, History Server serves the same UI from event logs</text>
  <text x="640" y="604.736842" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--text-faint)">Expose port 18080 for History Server in long-lived deployments</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Spark UI Tabs - Port 4040</text>

  <rect x="40" y="120" width="290" height="230" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Jobs</text>
  <text x="185" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Action to job map</text>
  <text x="185" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Event timeline</text>
  <text x="185" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Duration spread</text>
  <text x="185" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Drill into stages</text>

  <rect x="340" y="120" width="290" height="230" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Stages</text>
  <text x="485" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">DAG of tasks</text>
  <text x="485" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Shuffle sizes</text>
  <text x="485" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Spill and GC</text>
  <text x="485" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">Spot skew here</text>

  <rect x="640" y="120" width="290" height="230" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">SQL</text>
  <text x="785" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Logical / physical plan</text>
  <text x="785" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Row counts per node</text>
  <text x="785" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">AQE rewrites</text>
  <text x="785" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">Pruning visible</text>

  <rect x="940" y="120" width="300" height="230" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Executors</text>
  <text x="1090" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Used vs max memory</text>
  <text x="1090" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">GC time, tasks</text>
  <text x="1090" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Thread dumps</text>
  <text x="1090" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--danger-text)">Logs available</text>

  <rect x="40" y="380" width="1200" height="240" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Other Useful Tabs</text>
  <text x="640" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Storage - cached data, memory vs disk</text>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Environment - conf and JVM flags</text>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Streaming - batch duration, backpressure</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">JDBC Server - active sessions</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-faint)">History Server serves event logs on port 18080.</text>
</svg>

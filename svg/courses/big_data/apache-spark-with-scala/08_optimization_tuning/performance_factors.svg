<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.945762" font-weight="bold" fill="var(--text)">Spark Performance Factors</text>

  <rect x="40" y="72.222222" width="290" height="268.518519" rx="6.218253" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="185" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--danger-text)">Shuffle</text>
  <text x="185" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--danger-text)">Largest single cost</text>
  <text x="185" y="175.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--danger-text)">Disk + network + serde</text>
  <text x="185" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--danger-text)">Avoid wide transforms</text>
  <text x="185" y="237.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--danger-text)">Broadcast small tables</text>
  <text x="185" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--danger-text)">Tune shuffle.partitions</text>
  <text x="185" y="302.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--danger-text)">AQE coalesces at runtime</text>

  <rect x="340" y="72.222222" width="290" height="268.518519" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="485" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--warn-text)">Data Skew</text>
  <text x="485" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">One task dominates</text>
  <text x="485" y="175.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Hot keys in joins / groupBy</text>
  <text x="485" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Salt keys to spread load</text>
  <text x="485" y="237.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">AQE skew join handling</text>
  <text x="485" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Pre-aggregate when possible</text>
  <text x="485" y="302.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--warn-text)">check task time distribution</text>

  <rect x="640" y="72.222222" width="290" height="268.518519" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="785" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--ok-text)">Partitioning</text>
  <text x="785" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Too few: no parallelism</text>
  <text x="785" y="175.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Too many: scheduler overhead</text>
  <text x="785" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Target 128-256 MB each</text>
  <text x="785" y="237.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">repartition for shuffles</text>
  <text x="785" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">coalesce to shrink output</text>
  <text x="785" y="302.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--ok-text)">2-4x cores rule of thumb</text>

  <rect x="940" y="72.222222" width="300" height="268.518519" rx="6.218253" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1090" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--primary-text)">I/O and Formats</text>
  <text x="1090" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Parquet / ORC columnar</text>
  <text x="1090" y="175.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Predicate pushdown</text>
  <text x="1090" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Column pruning</text>
  <text x="1090" y="237.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Avoid many small files</text>
  <text x="1090" y="265.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Compact with OPTIMIZE</text>
  <text x="1090" y="302.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--primary-text)">partition by low-card column</text>

  <rect x="40" y="372.962963" width="1200" height="247.037037" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="413.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--text)">Secondary Factors</text>

  <rect x="80" y="437.407407" width="270" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="215" y="471.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--info-accent)">Caching</text>
  <text x="215" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Reuse across actions</text>
  <text x="215" y="527.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">MEMORY_AND_DISK_SER</text>
  <text x="215" y="557.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">unpersist when done</text>
  <text x="215" y="581.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">avoid premature caching</text>

  <rect x="370" y="437.407407" width="270" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="505" y="471.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--warn-accent)">GC Pressure</text>
  <text x="505" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Use G1GC, tune heap</text>
  <text x="505" y="527.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Off-heap Tungsten helps</text>
  <text x="505" y="557.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Watch GC time in UI</text>
  <text x="505" y="581.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">keep under 10% of task</text>

  <rect x="660" y="437.407407" width="270" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="795" y="471.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--ok-accent)">Query Plan</text>
  <text x="795" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">explain(true) everything</text>
  <text x="795" y="527.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Look for Exchange stages</text>
  <text x="795" y="557.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Use DataFrame API</text>
  <text x="795" y="581.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Catalyst optimizes it</text>

  <rect x="950" y="437.407407" width="250" height="161.111111" rx="6.218253" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1075" y="471.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" font-weight="bold" fill="var(--danger-accent)">UDFs</text>
  <text x="1075" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Break Catalyst</text>
  <text x="1075" y="527.62963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Prefer built-ins</text>
  <text x="1075" y="557.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Pandas UDFs vectorize</text>
  <text x="1075" y="581.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--text-muted)">Scala UDFs faster than Py</text>
</svg>

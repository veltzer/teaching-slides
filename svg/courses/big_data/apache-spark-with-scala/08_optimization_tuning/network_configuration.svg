<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="590" height="279.642857" rx="6.106203" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="73.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.300908" font-weight="bold" fill="var(--primary-text)">RPC Timeouts &amp; Heartbeats</text>
  <text x="60" y="107.321429" font-family="monospace" font-size="13.230106" fill="var(--primary-text)">spark.network.timeout = 120s</text>
  <text x="60" y="128.035714" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--primary-text)">umbrella default for all network ops</text>
  <text x="60" y="159.107143" font-family="monospace" font-size="13.230106" fill="var(--primary-text)">spark.rpc.askTimeout = 120s</text>
  <text x="60" y="179.821429" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--primary-text)">per-call RPC ask timeout</text>
  <text x="60" y="210.892857" font-family="monospace" font-size="13.230106" fill="var(--primary-text)">spark.executor.heartbeatInterval = 10s</text>
  <text x="60" y="231.607143" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--primary-text)">executor to driver; must &lt; network.timeout</text>
  <text x="60" y="262.678571" font-family="monospace" font-size="13.230106" fill="var(--primary-text)">spark.rpc.numRetries = 3</text>
  <text x="60" y="283.392857" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--primary-text)">raise in flaky clouds; watch for duplicate work</text>
  <text x="60" y="307.214286" font-family="Arial, sans-serif" font-size="11.194705" font-style="italic" fill="var(--primary-text)">Symptom: ExecutorLost during long GC pauses</text>

  <rect x="650" y="40" width="590" height="279.642857" rx="6.106203" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="73.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.300908" font-weight="bold" fill="var(--ok-text)">External Shuffle Service</text>
  <text x="670" y="107.321429" font-family="monospace" font-size="13.230106" fill="var(--ok-text)">spark.shuffle.service.enabled = true</text>
  <text x="670" y="128.035714" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--ok-text)">shuffle survives executor death / dynamic alloc</text>
  <text x="670" y="159.107143" font-family="monospace" font-size="13.230106" fill="var(--ok-text)">spark.shuffle.service.port = 7337</text>
  <text x="670" y="179.821429" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--ok-text)">NodeManager/K8s aux service port</text>
  <text x="670" y="210.892857" font-family="monospace" font-size="13.230106" fill="var(--ok-text)">spark.shuffle.io.numConnectionsPerPeer = 1</text>
  <text x="670" y="231.607143" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--ok-text)">raise to 3-5 on 10GbE+ fabrics</text>
  <text x="670" y="262.678571" font-family="monospace" font-size="13.230106" fill="var(--ok-text)">spark.shuffle.io.maxRetries = 3</text>
  <text x="670" y="283.392857" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--ok-text)">bump + retryWait on lossy networks</text>
  <text x="670" y="307.214286" font-family="Arial, sans-serif" font-size="11.194705" font-style="italic" fill="var(--ok-text)">FetchFailedException triggers stage retry</text>

  <rect x="40" y="340.357143" width="590" height="279.642857" rx="6.106203" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="373.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.300908" font-weight="bold" fill="var(--warn-text)">Locality Wait</text>
  <text x="60" y="407.678571" font-family="monospace" font-size="13.230106" fill="var(--warn-text)">spark.locality.wait = 3s</text>
  <text x="60" y="428.392857" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--warn-text)">how long to wait for data-local slot before</text>
  <text x="60" y="447.035714" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--warn-text)">falling back to RACK_LOCAL / ANY</text>
  <text x="60" y="480.178571" font-family="monospace" font-size="13.230106" fill="var(--warn-text)">spark.locality.wait.process / .node / .rack</text>
  <text x="60" y="500.892857" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--warn-text)">per-level overrides</text>
  <text x="60" y="531.964286" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--warn-text)">Lower (0-1s) when:</text>
  <text x="60" y="552.678571" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--warn-text)">- reads from S3/cloud storage (no data locality)</text>
  <text x="60" y="571.321429" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--warn-text)">- heterogeneous cluster, many stragglers</text>
  <text x="60" y="594.107143" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--warn-text)">Raise (10s+) on HDFS with tight data affinity</text>

  <rect x="650" y="340.357143" width="590" height="279.642857" rx="6.106203" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="373.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.300908" font-weight="bold" fill="var(--info-text)">Compression &amp; Encryption</text>
  <text x="670" y="407.678571" font-family="monospace" font-size="13.230106" fill="var(--info-text)">spark.io.compression.codec = lz4</text>
  <text x="670" y="428.392857" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--info-text)">shuffle + broadcast blocks; zstd for higher ratio</text>
  <text x="670" y="459.464286" font-family="monospace" font-size="13.230106" fill="var(--info-text)">spark.shuffle.compress = true</text>
  <text x="670" y="480.178571" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--info-text)">compress map outputs before network send</text>
  <text x="670" y="511.25" font-family="monospace" font-size="13.230106" fill="var(--info-text)">spark.network.crypto.enabled = true</text>
  <text x="670" y="531.964286" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--info-text)">AES-GCM over RPC + shuffle; ~10% CPU tax</text>
  <text x="670" y="563.035714" font-family="monospace" font-size="13.230106" fill="var(--info-text)">spark.authenticate = true</text>
  <text x="670" y="583.75" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--info-text)">shared secret required for all inter-process RPC</text>
  <text x="670" y="609.642857" font-family="Arial, sans-serif" font-size="11.194705" font-style="italic" fill="var(--info-text)">Profile before enabling: CPU-bound jobs pay the bill</text>
</svg>

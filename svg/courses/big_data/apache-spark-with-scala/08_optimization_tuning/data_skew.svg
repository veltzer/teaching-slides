<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.342871951533" font-weight="bold" fill="var(--primary-accent)">Data Skew</text>
  <text x="640" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">One partition blocks the stage</text>

  <!-- Symptom panel -->
  <rect x="40" y="96.46017699115" width="580" height="297.699115044248" rx="8.10549906201" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="127.256637168142" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--bg)">Symptom</text>

  <rect x="70" y="152.920353982301" width="60" height="43.115044247788" rx="4.052749531005" fill="var(--bg)"/>
  <text x="100" y="180.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--text)">50MB</text>
  <rect x="140" y="152.920353982301" width="60" height="43.115044247788" rx="4.052749531005" fill="var(--bg)"/>
  <text x="170" y="180.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--text)">45MB</text>
  <rect x="210" y="152.920353982301" width="60" height="43.115044247788" rx="4.052749531005" fill="var(--bg)"/>
  <text x="240" y="180.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--text)">52MB</text>
  <rect x="280" y="152.920353982301" width="60" height="43.115044247788" rx="4.052749531005" fill="var(--bg)"/>
  <text x="310" y="180.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.158248593015" fill="var(--text)">48MB</text>
  <rect x="350" y="152.920353982301" width="240" height="43.115044247788" rx="4.052749531005" fill="var(--bg)" stroke="var(--danger-accent)" stroke-width="2"/>
  <text x="470" y="180.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--text)">12 GB hot partition</text>

  <text x="330" y="235.044247787611" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-weight="bold" fill="var(--bg)">Spark UI signals</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">one task dominates stage</text>
  <text x="60" y="295" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">max/median size 10-100x</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">OOM or spill on one task</text>
  <text x="60" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--bg)">long GC pauses</text>

  <!-- Causes panel -->
  <rect x="660" y="96.46017699115" width="580" height="297.699115044248" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="127.256637168142" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--bg)">Causes</text>
  <text x="680" y="168.318584070796" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">Power-law keys (one user / country)</text>
  <text x="680" y="204.247787610619" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">NULL keys pooling together</text>
  <text x="680" y="240.176991150443" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">Sentinel date "1970-01-01"</text>
  <text x="680" y="276.106194690266" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">Low-cardinality partition key</text>
  <text x="680" y="312.035398230089" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--bg)">groupByKey without combine</text>
  <text x="680" y="353.097345132743" font-family="Courier New, monospace" font-size="12.158248593015" fill="var(--bg)">prefer reduceByKey / aggregateByKey</text>

  <!-- Fixes -->
  <rect x="40" y="414.690265486726" width="1200" height="205.309734513274" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="445.486725663717" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.237372889523" font-weight="bold" fill="var(--bg)">Fixes</text>
  <text x="70" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">AQE skewJoin splits hot partitions</text>
  <text x="70" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">Salt the key, group, strip suffix</text>
  <text x="70" y="545" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">Broadcast small side of join</text>
  <text x="70" y="575" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">Filter nulls, union back later</text>
  <text x="70" y="605" font-family="Arial, sans-serif" font-size="14" fill="var(--bg)">Raise shuffle.partitions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3894" font-weight="bold" fill="var(--text)">Executor Memory Architecture (Unified, Spark 2.0+)</text>

  <rect x="40" y="81.4286" width="600" height="538.5714" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2655" font-weight="bold" fill="var(--text)">JVM Heap (spark.executor.memory)</text>

  <rect x="60" y="138.3929" width="560" height="82.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="169.4643" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2478" font-weight="bold" fill="var(--primary-text)">Reserved Memory</text>
  <text x="340" y="195.3571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--primary-text)">300 MB — system internals</text>

  <rect x="60" y="231.6071" width="560" height="124.2857" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="262.6786" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2478" font-weight="bold" fill="var(--info-text)">User Memory (~40%)</text>
  <text x="340" y="288.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--info-text)">your UDFs, RDD transformation closures</text>
  <text x="340" y="309.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--info-text)">large Scala structures you allocate inside tasks</text>
  <text x="340" y="340.3571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--info-text)">Spark does not manage this — your code does</text>

  <rect x="60" y="366.25" width="560" height="238.2143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="397.3214" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2478" font-weight="bold" fill="var(--ok-text)">Unified Memory (~60% × spark.memory.fraction)</text>

  <rect x="80" y="412.8571" width="260" height="176.0714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2301" font-weight="bold" fill="var(--ok-text)">Storage</text>
  <text x="210" y="464.6429" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">cached RDDs / DataFrames</text>
  <text x="210" y="485.3571" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">broadcast variables</text>
  <text x="210" y="506.0714" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">deserialized partitions</text>
  <text x="210" y="537.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">persists across tasks within</text>
  <text x="210" y="554.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">the executor lifetime</text>

  <rect x="360" y="412.8571" width="260" height="176.0714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2301" font-weight="bold" fill="var(--ok-text)">Execution</text>
  <text x="490" y="464.6429" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">shuffle buffers</text>
  <text x="490" y="485.3571" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">sort / aggregation / join hash tables</text>
  <text x="490" y="506.0714" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">lives only during task execution</text>
  <text x="490" y="537.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">can evict Storage blocks</text>
  <text x="490" y="554.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1947" fill="var(--ok-text)">to reclaim space when needed</text>

  <rect x="660" y="81.4286" width="580" height="538.5714" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2655" font-weight="bold" fill="var(--text)">How unified memory borrows</text>

  <text x="680" y="148.75" font-family="Arial, sans-serif" font-size="13.2301" font-weight="bold" fill="var(--text)">Storage needs more?</text>
  <text x="680" y="174.6429" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">— borrows from free Execution space.</text>
  <text x="680" y="195.3571" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">— but will be evicted if Execution needs it back.</text>

  <text x="680" y="231.6071" font-family="Arial, sans-serif" font-size="13.2301" font-weight="bold" fill="var(--text)">Execution needs more?</text>
  <text x="680" y="257.5" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">— borrows from Storage above the unevictable</text>
  <text x="680" y="278.2143" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">   floor (spark.memory.storageFraction, ~50%).</text>
  <text x="680" y="298.9286" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">— evicts cached blocks (LRU) until it has enough.</text>

  <rect x="680" y="324.8214" width="540" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="353.8214" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2478" font-weight="bold" fill="var(--warn-text)">Off-heap (optional)</text>
  <text x="950" y="378.6786" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--warn-text)">spark.memory.offHeap.enabled + .size — avoids GC</text>

  <text x="680" y="428.3929" font-family="Arial, sans-serif" font-size="13.2301" font-weight="bold" fill="var(--text)">Common symptoms</text>
  <text x="680" y="454.2857" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">• OOM mid-shuffle — Execution starved. Increase</text>
  <text x="680" y="471.8929" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">   memory or shuffle.partitions, reduce cached data.</text>
  <text x="680" y="500.8929" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">• Cached DF disappears — evicted by Execution.</text>
  <text x="680" y="519.5357" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">   Use MEMORY_AND_DISK, or raise storageFraction.</text>
  <text x="680" y="552.6786" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">• Long GC pauses — too much on-heap data. Enable</text>
  <text x="680" y="571.3214" font-family="Arial, sans-serif" font-size="12.2124" fill="var(--text-muted)">   off-heap, or switch to G1 GC, or split executors smaller.</text>
</svg>

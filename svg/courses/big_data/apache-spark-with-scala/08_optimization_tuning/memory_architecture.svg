<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="600" height="580" rx="8.44894167246" fill="var(--surface)" stroke="var(--border)"/>
  <text x="340" y="73.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--text)">JVM Heap</text>

  <rect x="60" y="95.76923076923" width="560" height="78.076923076923" rx="8.44894167246" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--primary-text)">Reserved</text>
  <text x="340" y="157.115384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">300 MB system</text>

  <rect x="60" y="196.153846153846" width="560" height="111.538461538461" rx="8.44894167246" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="229.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--info-text)">User (~40%)</text>
  <text x="340" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">UDFs, closures</text>
  <text x="340" y="285.384615384616" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">unmanaged</text>

  <rect x="60" y="330" width="560" height="267.692307692308" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="363.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-weight="bold" fill="var(--ok-text)">Unified (~60%)</text>

  <rect x="80" y="385.769230769231" width="260" height="189.615384615384" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="419.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--ok-text)">Storage</text>
  <text x="210" y="452.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--ok-text)">cached data</text>
  <text x="210" y="480.576923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--ok-text)">broadcast vars</text>
  <text x="210" y="508.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--ok-text)">persisted blocks</text>

  <rect x="360" y="385.769230769231" width="260" height="189.615384615384" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="419.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--ok-text)">Execution</text>
  <text x="490" y="452.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--ok-text)">shuffle buffers</text>
  <text x="490" y="480.576923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--ok-text)">sort, join hashes</text>
  <text x="490" y="508.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--ok-text)">task-scoped</text>

  <rect x="660" y="40" width="580" height="580" rx="8.44894167246" fill="var(--surface)" stroke="var(--border)"/>
  <text x="950" y="73.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" font-weight="bold" fill="var(--text)">Borrowing</text>

  <text x="680" y="118.076923076922" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--text)">Storage borrows</text>
  <text x="680" y="145.961538461538" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">from idle Execution</text>
  <text x="680" y="168.269230769231" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">evicted when reclaimed</text>

  <text x="680" y="212.884615384615" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--text)">Execution borrows</text>
  <text x="680" y="240.76923076923" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">above storageFraction</text>
  <text x="680" y="263.076923076923" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--text-muted)">evicts cache LRU</text>

  <rect x="680" y="285.384615384616" width="540" height="78.076923076923" rx="8.44894167246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="318.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--warn-text)">Off-heap (optional)</text>
  <text x="950" y="346.73076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--warn-text)">avoids GC overhead</text>

  <text x="680" y="408.076923076923" font-family="Arial, sans-serif" font-size="14.785647926803" font-weight="bold" fill="var(--text)">Symptoms</text>
  <text x="680" y="441.538461538461" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--text-muted)">OOM in shuffle</text>
  <text x="680" y="469.423076923077" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--text-muted)">cache disappearing</text>
  <text x="680" y="497.307692307692" font-family="Arial, sans-serif" font-size="12.673412508688" fill="var(--text-muted)">long GC pauses</text>
</svg>

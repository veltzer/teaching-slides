<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Heap layout (left) -->
  <rect x="40" y="40" width="393.27731092437" height="580" rx="8.175740767346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="236.638655462185" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.395416726528" font-weight="bold" fill="var(--text)">Executor Heap (G1GC)</text>

  <rect x="65.210084033613" y="96.964285714286" width="342.857142857143" height="98.392857142857" rx="4.087870383673" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.638655462185" y="133.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.351481534691" font-weight="bold" fill="var(--primary-text)">Young</text>
  <text x="236.638655462185" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.285578746937" fill="var(--primary-text)">shuffle + task objects</text>
  <text x="236.638655462185" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.285578746937" fill="var(--primary-text)">minor GC</text>

  <rect x="65.210084033613" y="210.892857142857" width="342.857142857143" height="98.392857142857" rx="4.087870383673" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.638655462185" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.351481534691" font-weight="bold" fill="var(--ok-text)">Old</text>
  <text x="236.638655462185" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.285578746937" fill="var(--ok-text)">cached RDDs</text>
  <text x="236.638655462185" y="298.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.285578746937" fill="var(--ok-text)">mixed GC</text>

  <rect x="65.210084033613" y="324.821428571429" width="342.857142857143" height="72.5" rx="4.087870383673" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.638655462185" y="355.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.351481534691" font-weight="bold" fill="var(--warn-text)">Humongous</text>
  <text x="236.638655462185" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.285578746937" fill="var(--warn-text)">&gt; 50% region</text>

  <rect x="65.210084033613" y="412.857142857143" width="342.857142857143" height="72.5" rx="4.087870383673" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.638655462185" y="443.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.351481534691" font-weight="bold" fill="var(--info-text)">Off-heap (Tungsten)</text>
  <text x="236.638655462185" y="469.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.285578746937" fill="var(--info-text)">native buffers</text>

  <text x="236.638655462185" y="531.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.307546342855" font-weight="bold" fill="var(--text)">Target: &lt; 10% GC time</text>
  <text x="236.638655462185" y="563.035714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="12.263611151019" fill="var(--text-muted)">jstat -gc &lt;pid&gt; 1s</text>
  <text x="236.638655462185" y="588.928571428572" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.263611151019" fill="var(--text-muted)">Spark UI: GC Time column</text>

  <!-- Flags (right top) -->
  <rect x="453.445378151261" y="40" width="786.554621848739" height="290" rx="8.175740767346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="846.72268907563" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.395416726528" font-weight="bold" fill="var(--text)">G1GC flags</text>

  <text x="478.655462184874" y="117.678571428571" font-size="14.307546342855" fill="var(--text)" font-family="Courier New, monospace">-XX:+UseG1GC</text>
  <text x="478.655462184874" y="143.571428571429" font-family="Arial, sans-serif" font-size="12.263611151019" fill="var(--text-muted)">default since JDK 9</text>

  <text x="478.655462184874" y="179.821428571429" font-size="14.307546342855" fill="var(--text)" font-family="Courier New, monospace">-XX:MaxGCPauseMillis=200</text>
  <text x="478.655462184874" y="205.714285714286" font-family="Arial, sans-serif" font-size="12.263611151019" fill="var(--text-muted)">soft pause target</text>

  <text x="478.655462184874" y="241.964285714286" font-size="14.307546342855" fill="var(--text)" font-family="Courier New, monospace">-XX:InitiatingHeapOccupancyPercent=35</text>
  <text x="478.655462184874" y="267.857142857143" font-family="Arial, sans-serif" font-size="12.263611151019" fill="var(--text-muted)">early marking</text>

  <text x="478.655462184874" y="304.107142857143" font-size="14.307546342855" fill="var(--text)" font-family="Courier New, monospace">-XX:G1HeapRegionSize=16m</text>

  <!-- Sizing (right bottom) -->
  <rect x="453.445378151261" y="350.714285714286" width="786.554621848739" height="269.285714285714" rx="8.175740767346" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="846.72268907563" y="386.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.395416726528" font-weight="bold" fill="var(--text)">Heap sizing</text>
  <text x="478.655462184874" y="423.214285714286" font-family="Arial, sans-serif" font-size="14.307546342855" fill="var(--text-muted)">Many small executors (5 cores, 8-32 GB)</text>
  <text x="478.655462184874" y="454.285714285714" font-family="Arial, sans-serif" font-size="14.307546342855" fill="var(--text-muted)">&gt; 32 GB loses compressed oops</text>
  <text x="478.655462184874" y="485.357142857143" font-family="Arial, sans-serif" font-size="14.307546342855" fill="var(--text-muted)">Reserve 10-15% off-heap</text>
  <text x="478.655462184874" y="516.428571428572" font-family="Arial, sans-serif" font-size="14.307546342855" fill="var(--text-muted)">Fix full GC: smaller partitions, Kryo</text>
  <text x="478.655462184874" y="557.857142857143" font-family="Arial, sans-serif" font-size="14.307546342855" font-weight="bold" fill="var(--danger-border)">Watch: OOM, ExecutorLost, pauses</text>
</svg>

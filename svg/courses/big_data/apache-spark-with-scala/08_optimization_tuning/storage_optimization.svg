<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="590" height="279.642857" rx="8.141604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="74.178571" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.336309" font-weight="bold" fill="var(--primary-text)">Columnar Formats</text>
  <text x="335" y="102.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)">read only projected columns — skip the rest</text>

  <rect x="70" y="122.857143" width="255" height="176.071429" rx="6.106203" fill="var(--bg)" stroke="var(--primary-border)"/>
  <text x="197" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--text)">Parquet</text>
  <text x="197" y="172.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">default Spark format</text>
  <text x="197" y="195.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">row-group min/max stats</text>
  <text x="197" y="218.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">predicate pushdown</text>
  <text x="197" y="240.928571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">dict + RLE encoding</text>
  <text x="197" y="263.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">schema evolution</text>
  <text x="197" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">nested via Dremel</text>

  <rect x="345" y="122.857143" width="255" height="176.071429" rx="6.106203" fill="var(--bg)" stroke="var(--primary-border)"/>
  <text x="472" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--text)">ORC</text>
  <text x="472" y="172.571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">Hive-native</text>
  <text x="472" y="195.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">stripe + index + bloom</text>
  <text x="472" y="218.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">finer skip granularity</text>
  <text x="472" y="240.928571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">ACID transactions</text>
  <text x="472" y="263.714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">smaller than Parquet often</text>
  <text x="472" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">vectorized reader</text>

  <rect x="650" y="40" width="590" height="279.642857" rx="8.141604" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="74.178571" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.336309" font-weight="bold" fill="var(--ok-text)">Compression Codecs</text>
  <text x="945" y="102.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)">trade CPU for I/O — pick by hot path</text>

  <rect x="680" y="122.857143" width="180" height="176.071429" rx="6.106203" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="770" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--text)">snappy</text>
  <text x="770" y="174.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">Spark default</text>
  <text x="770" y="197.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">splittable, fast</text>
  <text x="770" y="220.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">~2x compression</text>

  <rect x="870" y="122.857143" width="180" height="176.071429" rx="6.106203" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="960" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--text)">zstd</text>
  <text x="960" y="174.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">best ratio + speed</text>
  <text x="960" y="197.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">tunable level 1-22</text>
  <text x="960" y="220.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">use for cold/archive</text>

  <rect x="1060" y="122.857143" width="155" height="176.071429" rx="6.106203" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="1137" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--text)">gzip</text>
  <text x="1137" y="174.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">good ratio</text>
  <text x="1137" y="197.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">slower</text>
  <text x="1137" y="220.214286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">not splittable</text>
  <text x="1137" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">avoid for large files</text>

  <rect x="40" y="340.357143" width="590" height="279.642857" rx="8.141604" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="374.535714" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.336309" font-weight="bold" fill="var(--warn-text)">Partitioning on Disk</text>
  <text x="335" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">df.write.partitionBy("dt", "country")</text>
  <text x="335" y="428.392857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--warn-text)">directory layout: /dt=2024-01-01/country=US/</text>

  <text x="335" y="461.535714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">partition pruning: engine skips unmatched dirs</text>
  <text x="335" y="487.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">pick low-cardinality filter columns</text>
  <text x="335" y="513.321429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">aim for 128MB-1GB files per partition</text>
  <text x="335" y="544.392857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--warn-text)">too many small files → namenode overhead</text>
  <text x="335" y="575.464286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" font-style="italic" fill="var(--warn-text)">coalesce/repartition before write</text>
  <text x="335" y="602.392857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--warn-text)">dynamicPartitionOverwrite for incremental loads</text>

  <rect x="650" y="340.357143" width="590" height="279.642857" rx="8.141604" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="374.535714" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.336309" font-weight="bold" fill="var(--info-text)">Bucketing</text>
  <text x="945" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--info-text)">.bucketBy(N, "user_id").sortBy("ts").saveAsTable</text>
  <text x="945" y="428.392857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--info-text)">hash(col) mod N → fixed file buckets</text>

  <text x="945" y="461.535714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--info-text)">pre-shuffled: join two bucketed tables without exchange</text>
  <text x="945" y="487.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--info-text)">pre-sorted: SortMergeJoin skips the sort stage</text>
  <text x="945" y="513.321429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--info-text)">requires Hive metastore table</text>
  <text x="945" y="544.392857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--info-text)">both tables must use same N and column</text>
  <text x="945" y="575.464286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" font-style="italic" fill="var(--info-text)">great for repeated joins on stable keys</text>
  <text x="945" y="602.392857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--info-text)">partitioning ≠ bucketing: combine both</text>
</svg>

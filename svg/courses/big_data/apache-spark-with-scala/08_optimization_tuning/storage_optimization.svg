<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="590" height="267.692307692308" rx="8.44894167246" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--primary-text)">Columnar Formats</text>
  <text x="335" y="123.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--primary-text)">Read only projected columns</text>
  <rect x="70" y="151.538461538461" width="260" height="133.846153846154" rx="6.336706254345" fill="var(--bg)" stroke="var(--primary-border)"/>
  <text x="200" y="179.423076923076" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--text)">Parquet</text>
  <text x="200" y="212.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Spark default</text>
  <text x="200" y="240.76923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Min/max stats</text>
  <text x="200" y="268.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Pushdown, dict/RLE</text>
  <rect x="340" y="151.538461538461" width="260" height="133.846153846154" rx="6.336706254345" fill="var(--bg)" stroke="var(--primary-border)"/>
  <text x="470" y="179.423076923076" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--text)">ORC</text>
  <text x="470" y="212.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Hive-native</text>
  <text x="470" y="240.76923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Stripes + bloom</text>
  <text x="470" y="268.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">ACID, vectorized</text>

  <rect x="650" y="40" width="590" height="267.692307692308" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--ok-text)">Compression</text>
  <text x="945" y="123.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--ok-text)">Trade CPU for I/O</text>
  <rect x="670" y="151.538461538461" width="175" height="133.846153846154" rx="6.336706254345" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="757" y="179.423076923076" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001053976" font-weight="bold" fill="var(--text)">snappy</text>
  <text x="757" y="212.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Default, fast</text>
  <text x="757" y="240.76923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Splittable</text>
  <rect x="855" y="151.538461538461" width="175" height="133.846153846154" rx="6.336706254345" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="942" y="179.423076923076" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001053976" font-weight="bold" fill="var(--text)">zstd</text>
  <text x="942" y="212.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Best ratio+speed</text>
  <text x="942" y="240.76923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">For cold data</text>
  <rect x="1040" y="151.538461538461" width="180" height="133.846153846154" rx="6.336706254345" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="1130" y="179.423076923076" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001053976" font-weight="bold" fill="var(--text)">gzip</text>
  <text x="1130" y="212.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Slower</text>
  <text x="1130" y="240.76923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Not splittable</text>

  <rect x="40" y="341.153846153846" width="590" height="278.846153846154" rx="8.44894167246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--warn-text)">Partitioning</text>
  <text x="335" y="424.807692307692" text-anchor="middle" font-family="Courier New, monospace" font-size="15.841765635861" fill="var(--warn-text)">partitionBy("dt","country")</text>
  <text x="335" y="463.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--warn-text)">Engine skips dirs</text>
  <text x="335" y="502.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--warn-text)">Low-cardinality keys</text>
  <text x="335" y="541.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--warn-text)">128 MB - 1 GB files</text>
  <text x="335" y="586.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-style="italic" fill="var(--warn-text)">Coalesce before write</text>

  <rect x="650" y="341.153846153846" width="590" height="278.846153846154" rx="8.44894167246" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599263" font-weight="bold" fill="var(--info-text)">Bucketing</text>
  <text x="945" y="424.807692307692" text-anchor="middle" font-family="Courier New, monospace" font-size="15.841765635861" fill="var(--info-text)">bucketBy(N, key).sortBy(ts)</text>
  <text x="945" y="463.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">Joins skip shuffle</text>
  <text x="945" y="502.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">SortMergeJoin: no sort</text>
  <text x="945" y="541.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">Needs Hive metastore</text>
  <text x="945" y="586.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-style="italic" fill="var(--info-text)">Stable repeated joins</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.592" font-weight="bold" fill="var(--text)">What Happens in a Shuffle</text>

  <!-- Map side -->
  <rect x="40" y="82.1818" width="380" height="537.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="119.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4306" font-weight="bold" fill="var(--primary-text)">Map side (source stage)</text>

  <rect x="70" y="150.7273" width="140" height="63.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="187.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" fill="var(--primary-text)">Task 0</text>
  <rect x="250" y="150.7273" width="140" height="63.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="187.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" fill="var(--primary-text)">Task 1</text>
  <rect x="70" y="224.5455" width="140" height="63.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="261.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" fill="var(--primary-text)">Task 2</text>
  <rect x="250" y="224.5455" width="140" height="63.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="261.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" fill="var(--primary-text)">Task 3</text>

  <text x="230" y="335.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" font-weight="bold" fill="var(--primary-text)">for each input row:</text>
  <text x="230" y="361.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">1. compute key</text>
  <text x="230" y="382.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">2. partition = hash(key) % R</text>
  <text x="230" y="403.8182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">3. write to local bucket file</text>

  <text x="230" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">Each map task produces R files</text>
  <text x="230" y="467.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">(one per reduce partition).</text>

  <text x="230" y="509.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">Sorted shuffle (default):</text>
  <text x="230" y="530.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">merge into ONE file + index</text>
  <text x="230" y="551.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">per map task. Reduces file count.</text>

  <text x="230" y="593.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">Serialize + optionally compress</text>
  <text x="230" y="614.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--primary-text)">(spark.shuffle.compress, lz4 default).</text>

  <!-- Network -->
  <rect x="440" y="82.1818" width="200" height="537.8182" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="119.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4306" font-weight="bold" fill="var(--warn-text)">Network fetch</text>
  <text x="540" y="171.8182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">Reduce task R asks each</text>
  <text x="540" y="192.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">map executor for its</text>
  <text x="540" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">"R's piece" of shuffle data.</text>
  <text x="540" y="256.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">Served by the External</text>
  <text x="540" y="277.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">Shuffle Service (long-lived</text>
  <text x="540" y="298.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">per node, survives executor</text>
  <text x="540" y="319.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">failures, enables dynamic</text>
  <text x="540" y="340.5455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">allocation).</text>
  <text x="540" y="382.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">M × R fetch requests.</text>
  <text x="540" y="403.8182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">M × R × avg-size = total bytes.</text>
  <text x="540" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">this is the expensive part —</text>
  <text x="540" y="467.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--warn-text)">disk + network + CPU.</text>

  <!-- Reduce side -->
  <rect x="660" y="82.1818" width="580" height="537.8182" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="119.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4306" font-weight="bold" fill="var(--ok-text)">Reduce side (target stage)</text>

  <rect x="690" y="150.7273" width="160" height="63.2727" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="187.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" fill="var(--ok-text)">Task 0</text>
  <rect x="860" y="150.7273" width="160" height="63.2727" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="187.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" fill="var(--ok-text)">Task 1</text>
  <rect x="1030" y="150.7273" width="160" height="63.2727" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110" y="187.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" fill="var(--ok-text)">Task 2</text>

  <text x="950" y="261.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" font-weight="bold" fill="var(--ok-text)">Number of reduce tasks:</text>
  <text x="950" y="287.8182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">spark.sql.shuffle.partitions (default 200)</text>

  <text x="950" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" font-weight="bold" fill="var(--ok-text)">Each reduce task:</text>
  <text x="690" y="361.6364" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">• fetches ~M fragments from the map side</text>
  <text x="690" y="388" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">• merges on the fly into a sorted iterator</text>
  <text x="690" y="414.3636" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">• spills to disk if it cannot fit in memory</text>
  <text x="690" y="440.7273" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">• runs the post-shuffle aggregate / join</text>

  <text x="950" y="488.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3498" font-weight="bold" fill="var(--ok-text)">Tuning knobs</text>
  <text x="690" y="514.5455" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">• too few partitions = huge tasks, OOM, spill</text>
  <text x="690" y="535.6364" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">• too many = scheduler overhead, small-file problem</text>
  <text x="690" y="562" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">• AQE coalesces partitions at runtime based on size</text>
  <text x="690" y="588.3636" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">• aim for ~100-200 MB per partition after the shuffle</text>
  <text x="690" y="609.4545" font-family="Arial, sans-serif" font-size="12.3229" fill="var(--ok-text)">• best tuning is to remove the shuffle (broadcast join, partitionBy).</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Map side -->
  <rect x="40" y="40" width="372.413793103448" height="580" rx="10.741723110591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.206896551724" y="79.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.483446221183" font-weight="bold" fill="var(--bg)">Map Side</text>

  <rect x="65.862068965517" y="106.923076923077" width="144.827586206897" height="55.769230769231" rx="6.445033866355" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.275862068966" y="142.615384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">Task 0</text>
  <rect x="241.724137931034" y="106.923076923077" width="144.827586206897" height="55.769230769231" rx="6.445033866355" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.137931034483" y="142.615384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">Task 1</text>
  <rect x="65.862068965517" y="173.846153846154" width="144.827586206897" height="55.769230769231" rx="6.445033866355" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.275862068966" y="209.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">Task 2</text>
  <rect x="241.724137931034" y="173.846153846154" width="144.827586206897" height="55.769230769231" rx="6.445033866355" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.137931034483" y="209.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">Task 3</text>

  <text x="226.206896551724" y="274.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.112584665887" font-weight="bold" fill="var(--bg)">per row:</text>
  <text x="226.206896551724" y="307.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">hash(key) % R</text>
  <text x="226.206896551724" y="341.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">write to bucket</text>
  <text x="226.206896551724" y="396.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">R files per task</text>
  <text x="226.206896551724" y="441.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">sorted: 1 file + index</text>
  <text x="226.206896551724" y="497.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">serialize, compress lz4</text>

  <!-- Network -->
  <rect x="433.103448275862" y="40" width="206.896551724138" height="580" rx="10.741723110591" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="536.551724137931" y="79.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.483446221183" font-weight="bold" fill="var(--bg)">Network</text>
  <text x="536.551724137931" y="151.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">reducer fetches</text>
  <text x="536.551724137931" y="179.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">its slice</text>
  <text x="536.551724137931" y="240.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">External Shuffle</text>
  <text x="536.551724137931" y="268.653846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">Service per node</text>
  <text x="536.551724137931" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">M x R fetches</text>
  <text x="536.551724137931" y="391.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">expensive:</text>
  <text x="536.551724137931" y="419.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">disk + net + CPU</text>
  <text x="536.551724137931" y="480.576923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" font-style="italic" fill="var(--bg)">survives executor</text>
  <text x="536.551724137931" y="502.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" font-style="italic" fill="var(--bg)">failures</text>

  <!-- Reduce side -->
  <rect x="660.689655172414" y="40" width="579.310344827586" height="580" rx="10.741723110591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="79.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.483446221183" font-weight="bold" fill="var(--bg)">Reduce Side</text>

  <rect x="691.724137931035" y="106.923076923077" width="165.51724137931" height="55.769230769231" rx="6.445033866355" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="774.48275862069" y="142.615384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">Task 0</text>
  <rect x="867.586206896552" y="106.923076923077" width="165.51724137931" height="55.769230769231" rx="6.445033866355" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="142.615384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">Task 1</text>
  <rect x="1043.448275862069" y="106.923076923077" width="165.51724137931" height="55.769230769231" rx="6.445033866355" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.206896551724" y="142.615384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">Task 2</text>

  <text x="950.344827586207" y="207.307692307692" text-anchor="middle" font-family="Courier New, monospace" font-size="15.038412354828" fill="var(--bg)">shuffle.partitions=200</text>

  <text x="691.724137931035" y="257.5" font-family="Arial, sans-serif" font-size="16.112584665887" font-weight="bold" fill="var(--bg)">each task:</text>
  <text x="691.724137931035" y="290.961538461538" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">fetch M fragments</text>
  <text x="691.724137931035" y="318.846153846154" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">merge-sort iterator</text>
  <text x="691.724137931035" y="346.730769230769" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">spill if OOM</text>
  <text x="691.724137931035" y="374.615384615385" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">run aggregate/join</text>

  <text x="691.724137931035" y="430.384615384615" font-family="Arial, sans-serif" font-size="16.112584665887" font-weight="bold" fill="var(--bg)">tuning:</text>
  <text x="691.724137931035" y="463.846153846154" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">too few: OOM, spill</text>
  <text x="691.724137931035" y="491.730769230769" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">too many: overhead</text>
  <text x="691.724137931035" y="519.615384615385" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">AQE coalesces runtime</text>
  <text x="691.724137931035" y="547.5" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--bg)">aim 100-200MB / part</text>
  <text x="691.724137931035" y="586.538461538462" font-family="Arial, sans-serif" font-size="15.038412354828" font-style="italic" fill="var(--bg)">best: avoid shuffle</text>
</svg>

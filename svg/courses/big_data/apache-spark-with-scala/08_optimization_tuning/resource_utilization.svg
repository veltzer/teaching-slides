<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.945762" font-weight="bold" fill="var(--text)">Spark Resource Utilization</text>

  <rect x="40" y="72.222222" width="290" height="268.518519" rx="6.218253" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--primary-text)">CPU</text>
  <text x="185" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Target 70-85% utilization</text>
  <text x="185" y="177.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Low: skew or I/O wait</text>
  <text x="185" y="205.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">High: healthy or GC storm</text>
  <text x="185" y="241.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">Cores per executor: 4-5</text>
  <text x="185" y="269.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--primary-text)">avoid HDFS thread contention</text>
  <text x="185" y="306.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--primary-text)">check Spark UI stage timeline</text>

  <rect x="340" y="72.222222" width="290" height="268.518519" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="485" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--ok-text)">Memory</text>
  <text x="485" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Unified: storage + exec</text>
  <text x="485" y="177.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">spark.memory.fraction=0.6</text>
  <text x="485" y="205.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Off-heap via Tungsten</text>
  <text x="485" y="241.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">Watch spill-to-disk events</text>
  <text x="485" y="269.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--ok-text)">OOM: raise executor mem</text>
  <text x="485" y="306.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--ok-text)">or repartition to shrink tasks</text>

  <rect x="640" y="72.222222" width="290" height="268.518519" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="785" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--warn-text)">Disk I/O</text>
  <text x="785" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Shuffle writes local SSD</text>
  <text x="785" y="177.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Spill files hurt throughput</text>
  <text x="785" y="205.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">spark.local.dir on fast disk</text>
  <text x="785" y="241.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">Compress shuffles (lz4)</text>
  <text x="785" y="269.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--warn-text)">External shuffle service</text>
  <text x="785" y="306.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--warn-text)">survives executor loss</text>

  <rect x="940" y="72.222222" width="300" height="268.518519" rx="6.218253" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1090" y="113.037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--info-text)">Network</text>
  <text x="1090" y="149.555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Shuffle and broadcast</text>
  <text x="1090" y="177.481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Co-locate with data (HDFS)</text>
  <text x="1090" y="205.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Prefer broadcast joins</text>
  <text x="1090" y="241.925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Rack-aware scheduling</text>
  <text x="1090" y="269.851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--info-text)">Push-based shuffle (3.2+)</text>
  <text x="1090" y="306.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472881" fill="var(--info-text)">reduces cross-rack traffic</text>

  <rect x="40" y="372.962963" width="1200" height="247.037037" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="413.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--text)">Observability Signals</text>
  <text x="640" y="450.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Spark UI: task duration distribution, GC time, input / shuffle sizes, spilled bytes.</text>
  <text x="640" y="482.518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Stage view reveals skew: if one task is 10x slower, partition by a better key.</text>
  <text x="640" y="514.740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Executor tab shows memory, GC, and task counts per node — catches stragglers.</text>
  <text x="640" y="549.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--text-muted)">Metrics sinks (Prometheus, Graphite) track long-running pipelines over time.</text>
  <text x="640" y="587.777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256" fill="var(--text-faint)">Rule: measure before tuning — idle cores and spill are the two most common wastes.</text>
</svg>

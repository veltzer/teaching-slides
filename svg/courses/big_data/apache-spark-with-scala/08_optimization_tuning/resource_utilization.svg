<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="290" height="270" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">CPU</text>
  <text x="185" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">target 70-85%</text>
  <text x="185" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">low: skew or I/O</text>
  <text x="185" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">high: healthy or GC</text>
  <text x="185" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">4-5 cores per executor</text>
  <text x="185" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--primary-text)">check stage timeline</text>

  <rect x="340" y="40" width="290" height="270" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Memory</text>
  <text x="485" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">unified storage + exec</text>
  <text x="485" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">memory.fraction=0.6</text>
  <text x="485" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">off-heap Tungsten</text>
  <text x="485" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">watch spill events</text>
  <text x="485" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--ok-text)">OOM: raise or repartition</text>

  <rect x="640" y="40" width="290" height="270" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Disk I/O</text>
  <text x="785" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">shuffle writes local</text>
  <text x="785" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">spill hurts throughput</text>
  <text x="785" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">spark.local.dir on SSD</text>
  <text x="785" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">compress (lz4)</text>
  <text x="785" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--warn-text)">external shuffle service</text>

  <rect x="940" y="40" width="300" height="270" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Network</text>
  <text x="1090" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">shuffle + broadcast</text>
  <text x="1090" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">co-locate with data</text>
  <text x="1090" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">prefer broadcast joins</text>
  <text x="1090" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">rack-aware scheduling</text>
  <text x="1090" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--info-text)">push-based shuffle</text>

  <rect x="40" y="340" width="1200" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Observability Signals</text>
  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Spark UI: task duration, GC time, shuffle sizes</text>
  <text x="640" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">stage view reveals skew</text>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">executor tab per node</text>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Prometheus or Graphite sinks</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="var(--text-faint)">measure before tuning</text>
</svg>

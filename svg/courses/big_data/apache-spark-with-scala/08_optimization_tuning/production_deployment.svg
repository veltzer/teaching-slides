<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="590" height="325.614035" rx="6.052403" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="72.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.148474" font-weight="bold" fill="var(--primary-text)">YARN Deployment</text>

  <text x="60" y="106.140351" font-family="monospace" font-size="13.113539" fill="var(--primary-text)">--master yarn --deploy-mode cluster</text>
  <text x="60" y="126.491228" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--primary-text)">ApplicationMaster runs the driver inside cluster</text>

  <text x="60" y="157.017544" font-family="monospace" font-size="13.113539" fill="var(--primary-text)">--queue prod --principal / --keytab</text>
  <text x="60" y="177.368421" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--primary-text)">scheduler queue + Kerberos for long-running apps</text>

  <text x="60" y="207.894737" font-family="monospace" font-size="13.113539" fill="var(--primary-text)">spark.yarn.executor.memoryOverhead</text>
  <text x="60" y="228.245614" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--primary-text)">off-heap budget; breach = container kill</text>

  <text x="60" y="258.77193" font-family="monospace" font-size="13.113539" fill="var(--primary-text)">spark.yarn.archive = hdfs://path/spark.zip</text>
  <text x="60" y="279.122807" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--primary-text)">avoid uploading jars per submit</text>

  <text x="60" y="314.736842" font-family="Arial, sans-serif" font-size="12.104805" font-style="italic" fill="var(--primary-text)">AM restart on failure; log aggregation to HDFS</text>
  <text x="60" y="340.175439" font-family="Arial, sans-serif" font-size="12.104805" font-style="italic" fill="var(--primary-text)">yarn logs -applicationId &lt;id&gt; for retrieval</text>

  <rect x="650" y="40" width="590" height="325.614035" rx="6.052403" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="72.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.148474" font-weight="bold" fill="var(--info-text)">Kubernetes Deployment</text>

  <text x="670" y="106.140351" font-family="monospace" font-size="13.113539" fill="var(--info-text)">--master k8s://https://&lt;api-server&gt;</text>
  <text x="670" y="126.491228" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--info-text)">native K8s scheduler since Spark 3.1 GA</text>

  <text x="670" y="157.017544" font-family="monospace" font-size="13.113539" fill="var(--info-text)">spark.kubernetes.container.image</text>
  <text x="670" y="177.368421" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--info-text)">same image for driver + executors</text>

  <text x="670" y="207.894737" font-family="monospace" font-size="13.113539" fill="var(--info-text)">spark.kubernetes.namespace = spark</text>
  <text x="670" y="228.245614" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--info-text)">per-team isolation + ResourceQuotas</text>

  <text x="670" y="258.77193" font-family="monospace" font-size="13.113539" fill="var(--info-text)">Spark Operator CRDs</text>
  <text x="670" y="279.122807" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--info-text)">SparkApplication / ScheduledSparkApplication</text>

  <text x="670" y="314.736842" font-family="Arial, sans-serif" font-size="12.104805" font-style="italic" fill="var(--info-text)">PersistentVolumeClaim for shuffle (3.2+)</text>
  <text x="670" y="340.175439" font-family="Arial, sans-serif" font-size="12.104805" font-style="italic" fill="var(--info-text)">graceful decommissioning migrates shuffle blocks</text>

  <rect x="40" y="385.964912" width="590" height="234.035088" rx="6.052403" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="418.526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.148474" font-weight="bold" fill="var(--ok-text)">Dynamic Allocation</text>

  <text x="60" y="452.105263" font-family="monospace" font-size="12.104805" fill="var(--ok-text)">spark.dynamicAllocation.enabled = true</text>
  <text x="60" y="477.54386" font-family="monospace" font-size="12.104805" fill="var(--ok-text)">spark.dynamicAllocation.minExecutors = 2</text>
  <text x="60" y="502.982456" font-family="monospace" font-size="12.104805" fill="var(--ok-text)">spark.dynamicAllocation.maxExecutors = 200</text>
  <text x="60" y="528.421053" font-family="monospace" font-size="12.104805" fill="var(--ok-text)">spark.dynamicAllocation.executorIdleTimeout = 60s</text>

  <text x="60" y="558.947368" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--ok-text)">Scales with backlog. Needs external shuffle service</text>
  <text x="60" y="577.263158" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--ok-text)">or K8s shuffle tracking so removed executors do</text>
  <text x="60" y="595.578947" font-family="Arial, sans-serif" font-size="11.096072" fill="var(--ok-text)">not lose shuffle data still needed downstream.</text>

  <rect x="650" y="385.964912" width="590" height="234.035088" rx="6.052403" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="418.526316" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.148474" font-weight="bold" fill="var(--warn-text)">Resource Sizing Checklist</text>

  <text x="670" y="452.105263" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">- 5 cores per executor (HDFS throughput sweet spot)</text>
  <text x="670" y="475.508772" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">- executor.memory 4-16 GB + 10% overhead</text>
  <text x="670" y="498.912281" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">- driver: 2-8 GB; more if many broadcasts / collect</text>
  <text x="670" y="522.315789" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">- target 2-3x cores as partitions (parallelism)</text>
  <text x="670" y="545.719298" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">- speculation for straggler mitigation</text>
  <text x="670" y="569.122807" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">- log aggregation, event log, metrics sink enabled</text>
  <text x="670" y="592.526316" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">- spark-submit from CI; no ad-hoc edits in prod</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="180" height="93.214286" rx="6.106203" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="130" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--text)">SQL / DataFrame</text>
  <text x="130" y="100.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">user query</text>
  <text x="130" y="120.785714" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.194705" font-style="italic" fill="var(--text-muted)">unresolved tree</text>

  <line x1="220" y1="86.607143" x2="258" y2="86.607143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="260" y="40" width="200" height="93.214286" rx="6.106203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="71.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--primary-text)">1. Analysis</text>
  <text x="360" y="96.964286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--primary-text)">resolve columns + tables</text>
  <text x="360" y="115.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--primary-text)">via Catalog / type check</text>

  <line x1="460" y1="86.607143" x2="498" y2="86.607143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="500" y="40" width="240" height="93.214286" rx="6.106203" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="71.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--ok-text)">2. Logical Optimization</text>
  <text x="620" y="96.964286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--ok-text)">rule-based rewrites</text>
  <text x="620" y="115.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--ok-text)">pushdown, constant folding</text>

  <line x1="740" y1="86.607143" x2="778" y2="86.607143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="780" y="40" width="230" height="93.214286" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="895" y="71.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--warn-text)">3. Physical Planning</text>
  <text x="895" y="96.964286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--warn-text)">cost-based strategies</text>
  <text x="895" y="115.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--warn-text)">pick join impl, exchanges</text>

  <line x1="1010" y1="86.607143" x2="1048" y2="86.607143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="1050" y="40" width="190" height="93.214286" rx="6.106203" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145" y="71.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--info-text)">4. Code Gen</text>
  <text x="1145" y="96.964286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--info-text)">whole-stage codegen</text>
  <text x="1145" y="115.607143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--info-text)">compile to JVM bytecode</text>

  <rect x="40" y="164.285714" width="295" height="290" rx="6.106203" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="187" y="193.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--primary-border)">Analyzer</text>
  <text x="60" y="221.25" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- resolve relations, columns</text>
  <text x="60" y="245.071429" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- check types, aliases</text>
  <text x="60" y="268.892857" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- expand * in projections</text>
  <text x="60" y="292.714286" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- resolve UDFs and views</text>
  <text x="60" y="316.535714" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- build resolved LogicalPlan</text>
  <text x="60" y="350.714286" font-family="Arial, sans-serif" font-size="12.212406" font-weight="bold" fill="var(--text)">AnalysisException here</text>
  <text x="60" y="373.5" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">= missing column/table/UDF</text>
  <text x="60" y="407.678571" font-family="Arial, sans-serif" font-size="12.212406" font-weight="bold" fill="var(--text)">Inspect:</text>
  <text x="60" y="430.464286" font-size="11.194705" fill="var(--text)" font-family="Courier New, monospace">df.queryExecution.analyzed</text>

  <rect x="345" y="164.285714" width="295" height="290" rx="6.106203" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="492" y="193.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--ok-border)">Catalyst Rules</text>
  <text x="365" y="221.25" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- predicate pushdown</text>
  <text x="365" y="245.071429" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- column pruning</text>
  <text x="365" y="268.892857" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- constant folding</text>
  <text x="365" y="292.714286" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- filter combination</text>
  <text x="365" y="316.535714" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- null propagation</text>
  <text x="365" y="340.357143" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- CTE inlining, limit push</text>
  <text x="365" y="364.178571" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- subquery decorrelation</text>
  <text x="365" y="397.321429" font-family="Arial, sans-serif" font-size="12.212406" font-weight="bold" fill="var(--text)">Extensible:</text>
  <text x="365" y="420.107143" font-size="11.194705" fill="var(--text)" font-family="Courier New, monospace">sparkSession.experimental</text>
  <text x="365" y="440.821429" font-size="11.194705" fill="var(--text)" font-family="Courier New, monospace">  .extraOptimizations</text>

  <rect x="650" y="164.285714" width="295" height="290" rx="6.106203" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="797" y="193.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--warn-border)">Physical Strategies</text>
  <text x="670" y="221.25" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- join selection</text>
  <text x="690" y="241.964286" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">broadcast / sort-merge / shuffle</text>
  <text x="670" y="265.785714" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- aggregation: hash vs sort</text>
  <text x="670" y="289.607143" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- insert Exchange for shuffles</text>
  <text x="670" y="313.428571" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- insert Sort for order</text>
  <text x="670" y="337.25" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- uses CBO if stats available</text>
  <text x="670" y="371.428571" font-family="Arial, sans-serif" font-size="12.212406" font-weight="bold" fill="var(--text)">AQE (3.0+) re-plans at runtime:</text>
  <text x="670" y="394.214286" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">coalesce partitions, skew join,</text>
  <text x="670" y="412.857143" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">convert SMJ to broadcast join</text>
  <text x="670" y="440.821429" font-size="11.194705" fill="var(--text)" font-family="Courier New, monospace">spark.sql.adaptive.enabled</text>

  <rect x="955" y="164.285714" width="285" height="290" rx="6.106203" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1097" y="193.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--info-border)">Whole-stage Codegen</text>
  <text x="975" y="221.25" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- fuses operators into one</text>
  <text x="975" y="245.071429" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">  tight Java loop</text>
  <text x="975" y="268.892857" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- eliminates virtual calls</text>
  <text x="975" y="292.714286" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- CPU-cache friendly</text>
  <text x="975" y="316.535714" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- Janino compiles bytecode</text>
  <text x="975" y="340.357143" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">- vectorization for Parquet</text>
  <text x="975" y="374.535714" font-family="Arial, sans-serif" font-size="12.212406" font-weight="bold" fill="var(--text)">Inspect plan:</text>
  <text x="975" y="397.321429" font-size="11.194705" fill="var(--text)" font-family="Courier New, monospace">df.explain(&quot;formatted&quot;)</text>
  <text x="975" y="418.035714" font-size="11.194705" fill="var(--text)" font-family="Courier New, monospace">EXPLAIN EXTENDED ...</text>
  <text x="975" y="441.857143" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">Stages marked * = codegen</text>

  <rect x="40" y="475" width="1200" height="145" rx="6.106203" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" font-weight="bold" fill="var(--text)">Why Catalyst matters for tuning</text>
  <text x="640" y="531.964286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">DataFrame API hands the plan to Catalyst — you gain optimizations for free that hand-written RDD code misses.</text>
  <text x="640" y="557.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">Supply table statistics (ANALYZE TABLE) so the cost-based optimizer can pick the right join and order.</text>
  <text x="640" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">Read EXPLAIN output bottom-up: look for Exchange (shuffle) and SortMergeJoin vs BroadcastHashJoin.</text>
  <text x="640" y="609.642857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" font-style="italic" fill="var(--text-faint)">Enable AQE — it fixes bad plans automatically when real partition sizes diverge from estimates.</text>
</svg>

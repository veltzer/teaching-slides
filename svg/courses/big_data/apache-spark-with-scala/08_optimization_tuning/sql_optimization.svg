<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Pipeline: SQL -> Analysis -> Logical -> Physical -> Codegen -->
  <rect x="40" y="40" width="165.51724137931" height="96.666666666667" rx="8.432740427116" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="122.758620689655" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--text)">SQL / DF</text>
  <text x="122.758620689655" y="109.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">unresolved tree</text>

  <line x1="210.689655172414" y1="88.333333333333" x2="241.724137931034" y2="88.333333333333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="246.896551724138" y="40" width="206.896551724138" height="96.666666666667" rx="8.432740427116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.344827586207" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--bg)">1. Analysis</text>
  <text x="350.344827586207" y="109.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--bg)">resolve via Catalog</text>

  <line x1="458.965517241379" y1="88.333333333333" x2="490" y2="88.333333333333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="495.172413793103" y="40" width="237.931034482759" height="96.666666666667" rx="8.432740427116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="614.137931034483" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--bg)">2. Logical Opt</text>
  <text x="614.137931034483" y="109.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--bg)">rule-based rewrites</text>

  <line x1="738.275862068966" y1="88.333333333333" x2="769.310344827586" y2="88.333333333333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="774.48275862069" y="40" width="237.931034482759" height="96.666666666667" rx="8.432740427116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="893.448275862069" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--bg)">3. Physical Plan</text>
  <text x="893.448275862069" y="109.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--bg)">cost-based strategies</text>

  <line x1="1017.586206896552" y1="88.333333333333" x2="1048.620689655173" y2="88.333333333333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="1053.793103448276" y="40" width="186.206896551724" height="96.666666666667" rx="8.432740427116" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1146.896551724138" y="77.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--bg)">4. Codegen</text>
  <text x="1146.896551724138" y="109.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--bg)">JVM bytecode</text>

  <!-- Row 2 detail panels -->
  <rect x="40" y="168.888888888889" width="294.827586206897" height="311.481481481482" rx="8.432740427116" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="186.896551724138" y="201.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" font-weight="bold" fill="var(--primary-accent)">Analyzer</text>
  <text x="60.689655172414" y="238.703703703704" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">resolve columns</text>
  <text x="60.689655172414" y="270.925925925926" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">type check</text>
  <text x="60.689655172414" y="303.148148148148" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">expand star</text>
  <text x="60.689655172414" y="335.37037037037" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">resolve UDFs / views</text>
  <text x="60.689655172414" y="383.703703703704" font-family="Courier New, monospace" font-size="13.703203194063" fill="var(--text-muted)">AnalysisException</text>
  <text x="60.689655172414" y="437.407407407407" font-family="Courier New, monospace" font-size="13.703203194063" fill="var(--text)">qe.analyzed</text>

  <rect x="345.172413793103" y="168.888888888889" width="294.827586206897" height="311.481481481482" rx="8.432740427116" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="492.068965517241" y="201.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" font-weight="bold" fill="var(--ok-accent)">Catalyst Rules</text>
  <text x="365.862068965517" y="238.703703703704" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">predicate pushdown</text>
  <text x="365.862068965517" y="270.925925925926" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">column pruning</text>
  <text x="365.862068965517" y="303.148148148148" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">constant folding</text>
  <text x="365.862068965517" y="335.37037037037" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">filter combine</text>
  <text x="365.862068965517" y="367.592592592593" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">CTE inlining</text>
  <text x="365.862068965517" y="399.814814814815" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">subquery decorrelate</text>
  <text x="365.862068965517" y="442.777777777778" font-family="Courier New, monospace" font-size="12.649110640674" fill="var(--text-muted)">extraOptimizations</text>

  <rect x="650.344827586207" y="168.888888888889" width="294.827586206897" height="311.481481481482" rx="8.432740427116" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="797.241379310345" y="201.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" font-weight="bold" fill="var(--warn-accent)">Physical</text>
  <text x="671.034482758621" y="238.703703703704" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">broadcast join</text>
  <text x="671.034482758621" y="270.925925925926" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">sort-merge join</text>
  <text x="671.034482758621" y="303.148148148148" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">hash agg / sort agg</text>
  <text x="671.034482758621" y="335.37037037037" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">insert Exchange</text>
  <text x="671.034482758621" y="378.333333333333" font-family="Arial, sans-serif" font-size="14.757295747452" font-weight="bold" fill="var(--text)">AQE (3.0+)</text>
  <text x="671.034482758621" y="405.185185185185" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">coalesce, skew, re-plan</text>
  <text x="671.034482758621" y="448.148148148148" font-family="Courier New, monospace" font-size="12.649110640674" fill="var(--text-muted)">adaptive.enabled</text>

  <rect x="955.51724137931" y="168.888888888889" width="284.48275862069" height="311.481481481482" rx="8.432740427116" fill="var(--surface)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1097.241379310345" y="201.111111111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" font-weight="bold" fill="var(--info-accent)">Codegen</text>
  <text x="976.206896551724" y="238.703703703704" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">fuse stages</text>
  <text x="976.206896551724" y="270.925925925926" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">no virtual calls</text>
  <text x="976.206896551724" y="303.148148148148" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">cache friendly</text>
  <text x="976.206896551724" y="335.37037037037" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">Janino compile</text>
  <text x="976.206896551724" y="367.592592592593" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text)">vectorized Parquet</text>
  <text x="976.206896551724" y="410.555555555556" font-family="Courier New, monospace" font-size="12.649110640674" fill="var(--text-muted)">df.explain()</text>
  <text x="976.206896551724" y="442.777777777778" font-family="Arial, sans-serif" font-size="13.703203194063" font-style="italic" fill="var(--text-muted)">* = codegen stage</text>

  <!-- Bottom summary -->
  <rect x="40" y="501.851851851852" width="1200" height="118.148148148148" rx="8.432740427116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="539.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.919573407621" font-weight="bold" fill="var(--bg)">Tuning Tips</text>
  <text x="640" y="571.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--bg)">ANALYZE TABLE -> stats for CBO</text>
  <text x="640" y="598.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--bg)">read EXPLAIN bottom-up; enable AQE</text>
</svg>

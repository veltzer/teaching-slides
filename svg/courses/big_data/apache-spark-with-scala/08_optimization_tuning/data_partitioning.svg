<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="81.403509" rx="6.052403" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.614035" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--primary-text)">Partitioning Strategies</text>
  <text x="640" y="103.087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--primary-text)">Right partitioning minimises shuffle and balances work across executors</text>

  <rect x="40" y="141.754386" width="385" height="223.859649" rx="6.052403" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="177.368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--ok-text)">Hash Partitioning</text>
  <text x="232" y="212.982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--ok-text)">Default for joins and groupBy</text>
  <text x="232" y="243.508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--ok-text)">hash(key) mod numPartitions</text>
  <text x="232" y="279.122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">Even distribution if keys</text>
  <text x="232" y="299.473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--ok-text)">are not skewed</text>
  <text x="232" y="335.087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--ok-text)">repartition(n, col)</text>

  <rect x="447" y="141.754386" width="385" height="223.859649" rx="6.052403" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="177.368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--warn-text)">Range Partitioning</text>
  <text x="640" y="212.982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--warn-text)">Ordered keys, used by sort</text>
  <text x="640" y="243.508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--warn-text)">Samples data to pick bounds</text>
  <text x="640" y="279.122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">Good for time-series and</text>
  <text x="640" y="299.473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--warn-text)">range queries</text>
  <text x="640" y="335.087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--warn-text)">repartitionByRange</text>

  <rect x="855" y="141.754386" width="385" height="223.859649" rx="6.052403" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047" y="177.368421" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--info-text)">Custom Partitioner</text>
  <text x="1047" y="212.982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--info-text)">Co-locate related records</text>
  <text x="1047" y="243.508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--info-text)">Avoid shuffles between jobs</text>
  <text x="1047" y="279.122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">Extend Partitioner,</text>
  <text x="1047" y="299.473684" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539" fill="var(--info-text)">override getPartition</text>
  <text x="1047" y="335.087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805" fill="var(--info-text)">partitionBy(custom)</text>

  <rect x="40" y="385.964912" width="1200" height="234.035088" rx="6.052403" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="421.578947" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208" font-weight="bold" fill="var(--text)">Sizing Rules of Thumb</text>
  <text x="640" y="457.192982" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">Target 128 MB per partition; 2-4x cores as a starting count</text>
  <text x="640" y="492.807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">Too few -&gt; idle cores; too many -&gt; scheduling overhead</text>
  <text x="640" y="528.421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">Inspect with df.rdd.getNumPartitions and the Spark UI stage view</text>
  <text x="640" y="564.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--text-muted)">Coalesce to shrink without shuffle; repartition to grow or rebalance</text>
  <text x="640" y="599.649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--text-faint)">Fix skew with salting or AQE skew join handling</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="390" height="290" rx="6.336706254345" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.178471890205" font-weight="bold" fill="var(--danger-text)">Java Serialization</text>
  <text x="235" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--danger-text)">Default fallback</text>
  <text x="235" y="162.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--danger-text)">Reflection-based</text>
  <text x="235" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--danger-text)">Slow, bulky</text>
  <text x="235" y="229.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--danger-text)">Avoid in shuffles</text>
  <text x="235" y="285.384615384616" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--danger-text)">spark.serializer=Java</text>

  <rect x="445" y="40" width="390" height="290" rx="6.336706254345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.178471890205" font-weight="bold" fill="var(--ok-text)">Kryo Serialization</text>
  <text x="640" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--ok-text)">10x faster, 2-5x smaller</text>
  <text x="640" y="162.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--ok-text)">Register classes</text>
  <text x="640" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--ok-text)">Recommended for RDDs</text>
  <text x="640" y="229.615384615384" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--ok-text)">requireRegistration=true</text>
  <text x="640" y="285.384615384616" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--ok-text)">spark.serializer=Kryo</text>

  <rect x="850" y="40" width="390" height="290" rx="6.336706254345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.178471890205" font-weight="bold" fill="var(--primary-text)">Tungsten Encoders</text>
  <text x="1045" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--primary-text)">Dataset / DataFrame</text>
  <text x="1045" y="162.692307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--primary-text)">Binary UnsafeRow</text>
  <text x="1045" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--primary-text)">Off-heap, cache-friendly</text>
  <text x="1045" y="229.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--primary-text)">Prefer Dataset[T]</text>
  <text x="1045" y="285.384615384616" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">automatic</text>

  <rect x="40" y="363.461538461538" width="1200" height="256.538461538462" rx="6.336706254345" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="402.499999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.178471890205" font-weight="bold" fill="var(--text)">When Serialization Happens</text>

  <rect x="80" y="430.384615384615" width="280" height="167.307692307692" rx="6.336706254345" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="220" y="469.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001053976" font-weight="bold" fill="var(--warn-accent)">Shuffle Writes</text>
  <text x="220" y="508.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">groupBy, join</text>
  <text x="220" y="541.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">biggest cost</text>

  <rect x="380" y="430.384615384615" width="280" height="167.307692307692" rx="6.336706254345" fill="var(--bg)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="520" y="469.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001053976" font-weight="bold" fill="var(--info-accent)">Broadcasts</text>
  <text x="520" y="508.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Once per executor</text>
  <text x="520" y="541.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Small lookups</text>

  <rect x="680" y="430.384615384615" width="280" height="167.307692307692" rx="6.336706254345" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="820" y="469.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001053976" font-weight="bold" fill="var(--ok-accent)">Task Closures</text>
  <text x="820" y="508.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Lambdas shipped</text>
  <text x="820" y="541.923076923077" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--text-muted)">NotSerializableException</text>

  <rect x="980" y="430.384615384615" width="220" height="167.307692307692" rx="6.336706254345" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1090" y="469.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.954001053976" font-weight="bold" fill="var(--primary-accent)">Caching</text>
  <text x="1090" y="508.461538461539" text-anchor="middle" font-family="Courier New, monospace" font-size="13.729530217746" fill="var(--text-muted)">MEMORY_ONLY_SER</text>
  <text x="1090" y="541.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">CPU for RAM</text>
</svg>

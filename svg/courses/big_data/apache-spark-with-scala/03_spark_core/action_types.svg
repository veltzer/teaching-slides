<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Row 1: four action groups -->
  <rect x="40" y="40" width="294.915254237288" height="316.363636363636" rx="8.284613618287" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="187.457627118644" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.711534045719" font-weight="bold" fill="var(--primary-text)">Materialize</text>
  <text x="187.457627118644" y="134.909090909091" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--primary-text)">collect()</text>
  <text x="187.457627118644" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--primary-text)">all rows to driver</text>
  <text x="187.457627118644" y="208.727272727273" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--primary-text)">take(n)</text>
  <text x="187.457627118644" y="240.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--primary-text)">safe first n</text>
  <text x="187.457627118644" y="282.545454545455" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--primary-text)">first()</text>
  <text x="187.457627118644" y="324.727272727273" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--primary-text)">takeSample()</text>

  <rect x="355.254237288136" y="40" width="294.915254237288" height="316.363636363636" rx="8.284613618287" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.71186440678" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.711534045719" font-weight="bold" fill="var(--ok-text)">Count / Reduce</text>
  <text x="502.71186440678" y="134.909090909091" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--ok-text)">count()</text>
  <text x="502.71186440678" y="177.090909090909" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--ok-text)">countByKey()</text>
  <text x="502.71186440678" y="219.272727272727" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--ok-text)">reduce(f)</text>
  <text x="502.71186440678" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--ok-text)">f assoc + commutative</text>
  <text x="502.71186440678" y="293.090909090909" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--ok-text)">fold / aggregate</text>

  <rect x="670.508474576271" y="40" width="294.915254237288" height="316.363636363636" rx="8.284613618287" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.966101694915" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.711534045719" font-weight="bold" fill="var(--warn-text)">Iterate</text>
  <text x="817.966101694915" y="134.909090909091" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--warn-text)">foreach(f)</text>
  <text x="817.966101694915" y="166.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--warn-text)">per row on executors</text>
  <text x="817.966101694915" y="208.727272727273" text-anchor="middle" font-family="Courier New, monospace" font-size="14.498073832003" fill="var(--warn-text)">foreachPartition(f)</text>
  <text x="817.966101694915" y="240.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--warn-text)">Iterator per partition</text>
  <text x="817.966101694915" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--warn-text)">side effects only</text>

  <rect x="985.762711864407" y="40" width="254.237288135593" height="316.363636363636" rx="8.284613618287" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.881355932203" y="82.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.711534045719" font-weight="bold" fill="var(--info-text)">Save</text>
  <text x="1112.881355932203" y="140.181818181818" text-anchor="middle" font-family="Courier New, monospace" font-size="13.462497129717" fill="var(--info-text)">saveAsTextFile</text>
  <text x="1112.881355932203" y="182.363636363636" text-anchor="middle" font-family="Courier New, monospace" font-size="13.462497129717" fill="var(--info-text)">saveAsSequenceFile</text>
  <text x="1112.881355932203" y="224.545454545455" text-anchor="middle" font-family="Courier New, monospace" font-size="13.462497129717" fill="var(--info-text)">saveAsObjectFile</text>
  <text x="1112.881355932203" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--info-text)">one file per partition</text>
  <text x="1112.881355932203" y="303.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--info-text)">HDFS / S3 / local</text>

  <!-- Bottom: lazy vs eager note -->
  <rect x="40" y="398.545454545455" width="1200" height="221.454545454545" rx="8.284613618287" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="440.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.640380641147" font-weight="bold" fill="var(--text)">Lazy vs eager</text>
  <text x="640" y="482.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--text-muted)">Transformations are lazy; actions trigger the DAG.</text>
  <text x="640" y="519.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--text-muted)">Each action re-runs the lineage unless cached.</text>
  <text x="640" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--text-muted)">Avoid collect() on large RDDs.</text>
  <text x="640" y="598.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--text-faint)">Use take(n), isEmpty, or save to storage.</text>
</svg>

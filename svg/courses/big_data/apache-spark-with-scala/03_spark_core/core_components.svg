<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="600" height="284.528301886793" rx="8.368855109814" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="83.77358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014351551988" font-weight="bold" fill="var(--primary-text)">SparkContext</text>
  <text x="340" y="122.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--primary-text)">Entry point per application</text>
  <text x="340" y="152.716981132075" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--primary-text)">Owns the DAG and executors</text>
  <text x="340" y="198.679245283019" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--primary-text)">val conf = new SparkConf()</text>
  <text x="340" y="226.037735849056" text-anchor="middle" font-family="Courier New, monospace" font-size="14.645496442174" fill="var(--primary-text)">val sc = new SparkContext(conf)</text>
  <text x="340" y="275.283018867925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-style="italic" fill="var(--primary-text)">SparkSession wraps it in 2.0+</text>
  <text x="340" y="302.641509433962" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-style="italic" fill="var(--primary-text)">Exposes DataFrame / SQL</text>

  <rect x="660" y="40" width="580" height="284.528301886793" rx="8.368855109814" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="83.77358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014351551988" font-weight="bold" fill="var(--ok-text)">Schedulers</text>
  <text x="950" y="127.547169811321" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--ok-text)">DAGScheduler</text>
  <text x="950" y="154.905660377358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Splits jobs at shuffles</text>
  <text x="950" y="193.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--ok-text)">TaskScheduler</text>
  <text x="950" y="220.566037735849" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Locality-aware placement</text>
  <text x="950" y="258.867924528302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737710219627" font-weight="bold" fill="var(--ok-text)">BlockManager</text>
  <text x="950" y="286.22641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Cache and shuffle blocks</text>

  <rect x="40" y="351.88679245283" width="390" height="268.11320754717" rx="8.368855109814" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="395.660377358491" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014351551988" font-weight="bold" fill="var(--warn-text)">RDD Engine</text>
  <text x="235" y="433.962264150944" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--warn-text)">Distributed datasets</text>
  <text x="235" y="466.792452830189" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--warn-text)">Narrow + wide transforms</text>
  <text x="235" y="505.094339622642" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--warn-text)">Lineage, lazy eval</text>
  <text x="235" y="537.924528301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--warn-text)">Fault tolerance</text>
  <text x="235" y="581.698113207547" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-style="italic" fill="var(--warn-text)">Foundation for DF / SQL / MLlib</text>

  <rect x="450" y="351.88679245283" width="390" height="268.11320754717" rx="8.368855109814" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="395.660377358491" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014351551988" font-weight="bold" fill="var(--info-text)">Cluster Manager</text>
  <text x="645" y="433.962264150944" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--info-text)">Standalone / YARN / K8s</text>
  <text x="645" y="466.792452830189" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--info-text)">Allocates executors</text>
  <text x="645" y="499.622641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--info-text)">Enforces quotas</text>
  <text x="645" y="543.396226415094" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--info-text)">--master local | yarn</text>
  <text x="645" y="568.56603773585" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553448" fill="var(--info-text)">--master k8s://...</text>

  <rect x="860" y="351.88679245283" width="380" height="268.11320754717" rx="8.368855109814" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="395.660377358491" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014351551988" font-weight="bold" fill="var(--danger-text)">Shuffle Service</text>
  <text x="1050" y="433.962264150944" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--danger-text)">Helper per worker</text>
  <text x="1050" y="466.792452830189" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--danger-text)">Serves shuffle files</text>
  <text x="1050" y="499.622641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--danger-text)">Survives executor death</text>
  <text x="1050" y="537.924528301887" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.691603330901" fill="var(--danger-text)">Dynamic allocation</text>
</svg>

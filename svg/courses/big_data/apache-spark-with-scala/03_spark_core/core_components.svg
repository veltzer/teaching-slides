<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.369246717036" font-weight="bold" fill="var(--text)">Spark Core Components</text>

  <rect x="40" y="75.929203539823" width="600" height="266.902654867257" rx="8.10549906201" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="116.991150442478" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.290122420528" font-weight="bold" fill="var(--primary-text)">SparkContext</text>
  <text x="340" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--primary-text)">Entry point per application</text>
  <text x="340" y="181.663716814159" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--primary-text)">Owns the DAG and executors</text>
  <text x="340" y="224.778761061947" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--primary-text)">val conf = new SparkConf()</text>
  <text x="340" y="250.442477876106" text-anchor="middle" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--primary-text)">val sc = new SparkContext(conf)</text>
  <text x="340" y="296.637168141593" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--primary-text)">SparkSession wraps it in 2.0+</text>
  <text x="340" y="322.300884955752" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--primary-text)">Exposes DataFrame / SQL</text>

  <rect x="660" y="75.929203539823" width="580" height="266.902654867257" rx="8.10549906201" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="116.991150442478" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.290122420528" font-weight="bold" fill="var(--ok-text)">Schedulers</text>
  <text x="950" y="158.053097345133" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)">DAGScheduler</text>
  <text x="950" y="183.716814159292" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--ok-text)">Splits jobs at shuffles</text>
  <text x="950" y="219.646017699115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)">TaskScheduler</text>
  <text x="950" y="245.309734513274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--ok-text)">Locality-aware placement</text>
  <text x="950" y="281.238938053097" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)">BlockManager</text>
  <text x="950" y="306.902654867257" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" fill="var(--ok-text)">Cache and shuffle blocks</text>

  <rect x="40" y="368.495575221239" width="390" height="251.504424778761" rx="8.10549906201" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="409.557522123894" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.290122420528" font-weight="bold" fill="var(--warn-text)">RDD Engine</text>
  <text x="235" y="445.486725663717" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--warn-text)">Distributed datasets</text>
  <text x="235" y="476.283185840708" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--warn-text)">Narrow + wide transforms</text>
  <text x="235" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--warn-text)">Lineage, lazy eval</text>
  <text x="235" y="543.008849557522" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--warn-text)">Fault tolerance</text>
  <text x="235" y="584.070796460177" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.184623358518" font-style="italic" fill="var(--warn-text)">Foundation for DF / SQL / MLlib</text>

  <rect x="450" y="368.495575221239" width="390" height="251.504424778761" rx="8.10549906201" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="409.557522123894" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.290122420528" font-weight="bold" fill="var(--info-text)">Cluster Manager</text>
  <text x="645" y="445.486725663717" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--info-text)">Standalone / YARN / K8s</text>
  <text x="645" y="476.283185840708" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--info-text)">Allocates executors</text>
  <text x="645" y="507.079646017699" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--info-text)">Enforces quotas</text>
  <text x="645" y="548.141592920354" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--info-text)">--master local | yarn</text>
  <text x="645" y="571.752212389381" text-anchor="middle" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--info-text)">--master k8s://...</text>

  <rect x="860" y="368.495575221239" width="380" height="251.504424778761" rx="8.10549906201" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="409.557522123894" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.290122420528" font-weight="bold" fill="var(--danger-text)">Shuffle Service</text>
  <text x="1050" y="445.486725663717" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--danger-text)">Helper per worker</text>
  <text x="1050" y="476.283185840708" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--danger-text)">Serves shuffle files</text>
  <text x="1050" y="507.079646017699" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--danger-text)">Survives executor death</text>
  <text x="1050" y="543.008849557522" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.197810741269" fill="var(--danger-text)">Dynamic allocation</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="590" height="311.481481481482" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="335" y="82.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--ok-text)">Narrow (no shuffle)</text>
  <text x="335" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">One input -&gt; one output partition</text>
  <text x="335" y="142.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">Pipelined in one stage</text>

  <rect x="70" y="163.518518518519" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="147" y="197.888888888889" text-anchor="middle" font-family="Courier New, monospace" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">map</text>
  <rect x="245" y="163.518518518519" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="322" y="197.888888888889" text-anchor="middle" font-family="Courier New, monospace" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">filter</text>
  <rect x="420" y="163.518518518519" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="497" y="197.888888888889" text-anchor="middle" font-family="Courier New, monospace" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">flatMap</text>
  <rect x="70" y="238.703703703704" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="147" y="273.074074074074" text-anchor="middle" font-family="Courier New, monospace" font-size="15.545631755148" font-weight="bold" fill="var(--ok-text)">mapPartitions</text>
  <rect x="245" y="238.703703703704" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="322" y="273.074074074074" text-anchor="middle" font-family="Courier New, monospace" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">sample</text>
  <rect x="420" y="238.703703703704" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="497" y="273.074074074074" text-anchor="middle" font-family="Courier New, monospace" font-size="16.582007205491" font-weight="bold" fill="var(--ok-text)">union</text>

  <text x="335" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">Cheap: same executor</text>

  <rect x="650" y="40" width="590" height="311.481481481482" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="945" y="82.962962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--warn-text)">Wide (shuffle)</text>
  <text x="945" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Many inputs per output</text>
  <text x="945" y="142.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">New stage, data moves</text>

  <rect x="680" y="163.518518518519" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="757" y="197.888888888889" text-anchor="middle" font-family="Courier New, monospace" font-size="15.545631755148" font-weight="bold" fill="var(--warn-text)">groupByKey</text>
  <rect x="855" y="163.518518518519" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="932" y="197.888888888889" text-anchor="middle" font-family="Courier New, monospace" font-size="15.545631755148" font-weight="bold" fill="var(--warn-text)">reduceByKey</text>
  <rect x="1030" y="163.518518518519" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1107" y="197.888888888889" text-anchor="middle" font-family="Courier New, monospace" font-size="13.472880854462" font-weight="bold" fill="var(--warn-text)">aggregateByKey</text>
  <rect x="680" y="238.703703703704" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="757" y="273.074074074074" text-anchor="middle" font-family="Courier New, monospace" font-size="15.545631755148" font-weight="bold" fill="var(--warn-text)">join</text>
  <rect x="855" y="238.703703703704" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="932" y="273.074074074074" text-anchor="middle" font-family="Courier New, monospace" font-size="15.545631755148" font-weight="bold" fill="var(--warn-text)">distinct</text>
  <rect x="1030" y="238.703703703704" width="155" height="53.703703703703" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1107" y="273.074074074074" text-anchor="middle" font-family="Courier New, monospace" font-size="15.545631755148" font-weight="bold" fill="var(--warn-text)">repartition</text>

  <text x="945" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Expensive: disk + network</text>

  <rect x="40" y="383.703703703703" width="1200" height="236.296296296297" rx="8.291003602746" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--text)">Rules of thumb</text>
  <text x="80" y="469.62962962963" font-family="Arial, sans-serif" font-size="16.582007205491" fill="var(--text-muted)">- reduceByKey beats groupByKey (map-side combine)</text>
  <text x="80" y="501.851851851852" font-family="Arial, sans-serif" font-size="16.582007205491" fill="var(--text-muted)">- mapPartitions: per-partition setup</text>
  <text x="80" y="534.074074074074" font-family="Arial, sans-serif" font-size="16.582007205491" fill="var(--text-muted)">- coalesce shrinks without shuffle</text>
  <text x="80" y="566.296296296297" font-family="Arial, sans-serif" font-size="16.582007205491" fill="var(--text-muted)">- Broadcast small lookup tables</text>
  <text x="80" y="598.518518518518" font-family="Arial, sans-serif" font-size="16.582007205491" fill="var(--text-muted)">- Fewer wide ops = faster</text>
</svg>

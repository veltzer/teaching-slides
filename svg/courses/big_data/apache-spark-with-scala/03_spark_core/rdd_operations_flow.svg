<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="220" height="152.631578947368" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="90.877192982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--primary-text)">Source</text>
  <text x="150" y="126.491228070175" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--primary-text)">textFile, parallelize</text>
  <text x="150" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">HDFS, S3, Kafka</text>

  <rect x="300" y="40" width="280" height="152.631578947368" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="80.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--ok-text)">Narrow Transforms</text>
  <text x="440" y="116.315789473684" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--ok-text)">map, filter, flatMap</text>
  <text x="440" y="141.754385964912" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--ok-text)">mapPartitions</text>
  <text x="440" y="172.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">No shuffle</text>

  <rect x="620" y="40" width="280" height="152.631578947368" rx="6.052402741669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="80.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--warn-text)">Wide Transforms</text>
  <text x="760" y="116.315789473684" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">reduceByKey, join</text>
  <text x="760" y="141.754385964912" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">sortBy, distinct</text>
  <text x="760" y="172.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">Triggers shuffle</text>

  <rect x="940" y="40" width="300" height="152.631578947368" rx="6.052402741669" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="80.701754385965" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--info-text)">Action</text>
  <text x="1090" y="116.315789473684" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--info-text)">count, collect, take</text>
  <text x="1090" y="141.754385964912" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--info-text)">saveAsTextFile</text>
  <text x="1090" y="172.280701754386" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--info-text)">Launches the job</text>

  <line x1="260" y1="116.315789473684" x2="295" y2="116.315789473684" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="116.315789473684" x2="615" y2="116.315789473684" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="116.315789473684" x2="935" y2="116.315789473684" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="223.157894736842" width="1200" height="162.80701754386" rx="6.052402741669" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="263.859649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.165942015287" font-weight="bold" fill="var(--text)">Lazy Evaluation</text>
  <text x="640" y="304.561403508772" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--text-muted)">Transformations build a DAG; actions run it</text>
  <text x="640" y="340.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--text-muted)">Narrow ops pipeline; wide ops cut stages</text>
  <text x="640" y="375.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--text-muted)">Scheduler optimises and submits tasks</text>

  <rect x="40" y="416.491228070175" width="590" height="203.508771929825" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="457.19298245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--ok-text)">Lineage</text>
  <text x="335" y="497.894736842105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--ok-text)">Recomputes lost partitions</text>
  <text x="335" y="528.421052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--ok-text)">Fault tolerant, no replicas</text>
  <text x="335" y="558.947368421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--ok-text)">Checkpoint long chains</text>
  <text x="335" y="594.561403508772" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--ok-text)">toDebugString</text>

  <rect x="650" y="416.491228070175" width="590" height="203.508771929825" rx="6.052402741669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="457.19298245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--warn-text)">Caching</text>
  <text x="945" y="497.894736842105" text-anchor="middle" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--warn-text)">cache() / persist()</text>
  <text x="945" y="528.421052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" fill="var(--warn-text)">Pick storage level</text>
  <text x="945" y="558.947368421053" text-anchor="middle" font-family="Courier New, monospace" font-size="14.122273063895" fill="var(--warn-text)">unpersist()</text>
  <text x="945" y="594.561403508772" text-anchor="middle" font-family="Courier New, monospace" font-size="13.113539273617" fill="var(--warn-text)">MEMORY_AND_DISK default</text>
</svg>

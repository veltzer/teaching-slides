<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="66.923076923077" rx="8.520242022381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="67.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.10551429756" font-weight="bold" fill="var(--primary-text)">One task per partition, executed in parallel</text>
  <text x="640" y="93.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--primary-text)">Default: cluster cores or HDFS block count</text>

  <rect x="40" y="129.230769230769" width="386.440677966102" height="89.230769230769" rx="6.390181516786" fill="var(--surface)" stroke="var(--border)"/>
  <text x="233.220338983051" y="160.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.040484044762" font-weight="bold" fill="var(--text)">Partition 0</text>
  <text x="233.220338983051" y="190.576923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.84539328637" fill="var(--text-muted)">Executor A — data locality</text>

  <rect x="446.779661016949" y="129.230769230769" width="386.440677966102" height="89.230769230769" rx="6.390181516786" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="160.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.040484044762" font-weight="bold" fill="var(--text)">Partition 1</text>
  <text x="640" y="190.576923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.84539328637" fill="var(--text-muted)">Executor B</text>

  <rect x="853.559322033898" y="129.230769230769" width="386.440677966102" height="89.230769230769" rx="6.390181516786" fill="var(--surface)" stroke="var(--border)"/>
  <text x="1046.779661016949" y="160.461538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.040484044762" font-weight="bold" fill="var(--text)">Partition 2</text>
  <text x="1046.779661016949" y="190.576923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.84539328637" fill="var(--text-muted)">Executor C — repartition/coalesce</text>

  <rect x="40" y="240.769230769231" width="589.830508474576" height="379.230769230769" rx="8.520242022381" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.915254237288" y="285.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.430665561548" font-weight="bold" fill="var(--ok-text)">HashPartitioner</text>
  <text x="334.915254237288" y="324.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.975453791965" fill="var(--ok-text)">Default for pair RDDs</text>
  <text x="334.915254237288" y="363.461538461538" text-anchor="middle" font-family="Courier New, monospace" font-size="14.910423539167" fill="var(--ok-text)">key.hashCode mod N</text>

  <rect x="70.508474576271" y="391.346153846154" width="233.898305084746" height="61.346153846154" rx="5.325151263988" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="187.457627118644" y="428.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--text)">Even spread</text>

  <rect x="334.915254237288" y="391.346153846154" width="264.406779661017" height="61.346153846154" rx="5.325151263988" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="467.118644067797" y="428.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--text)">Skew on hot keys</text>

  <text x="334.915254237288" y="497.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--ok-text)">Equal keys → same partition</text>
  <text x="334.915254237288" y="530.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--ok-text)">Does not preserve order</text>
  <text x="334.915254237288" y="575.384615384616" text-anchor="middle" font-family="Courier New, monospace" font-size="13.84539328637" fill="var(--ok-text)">partitionBy(new HashPartitioner(n))</text>

  <rect x="650.169491525424" y="240.769230769231" width="589.830508474576" height="379.230769230769" rx="8.520242022381" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.084745762712" y="285.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.430665561548" font-weight="bold" fill="var(--info-text)">RangePartitioner</text>
  <text x="945.084745762712" y="324.423076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.975453791965" fill="var(--info-text)">Used by sortByKey / orderBy</text>
  <text x="945.084745762712" y="363.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--info-text)">Samples keys, picks splits</text>

  <rect x="680.677966101695" y="391.346153846154" width="233.898305084746" height="61.346153846154" rx="5.325151263988" fill="var(--bg)" stroke="var(--info-border)"/>
  <text x="797.627118644068" y="428.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--text)">p0: &lt;a, p1: a..b, ...</text>

  <rect x="945.084745762712" y="391.346153846154" width="264.406779661017" height="61.346153846154" rx="5.325151263988" fill="var(--bg)" stroke="var(--info-border)"/>
  <text x="1077.28813559322" y="428.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--text)">Preserves order</text>

  <text x="945.084745762712" y="497.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--info-text)">Balanced despite skew</text>
  <text x="945.084745762712" y="530.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" fill="var(--info-text)">Keys must be Ordered</text>
  <text x="945.084745762712" y="575.384615384616" text-anchor="middle" font-family="Courier New, monospace" font-size="13.84539328637" fill="var(--info-text)">partitionBy(new RangePartitioner(...))</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #c4cdd6; --border: #6b7280; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e; --shadow: #00000044; --black: #000000;
        --primary-fill: #5a7a9c; --primary-border: #3d5a7d; --primary-text: #ffffff; --primary-accent: #243b59;
        --ok-fill: #7a9a6a; --ok-border: #5a7a4d; --ok-text: #ffffff; --ok-accent: #385030;
        --warn-fill: #c8924a; --warn-border: #9c6e2e; --warn-text: #ffffff; --warn-accent: #5a3f12;
        --danger-fill: #a86058; --danger-border: #7d3f38; --danger-text: #ffffff; --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e; --info-border: #574a68; --info-text: #ffffff; --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.048221421587" font-weight="bold" fill="var(--text)">Data Partitioning</text>

  <rect x="40" y="66.605504587156" width="1200" height="63.853211009174" rx="8.322529668181" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="93.211009174312" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.685375544884" font-weight="bold" fill="var(--primary-text)">One task per partition, executed in parallel</text>
  <text x="640" y="117.688073394495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--primary-text)">Default: cluster cores or HDFS block count</text>

  <rect x="40" y="151.743119266055" width="386.440677966102" height="85.137614678899" rx="6.241897251136" fill="var(--surface)" stroke="var(--border)"/>
  <text x="233.220338983051" y="181.54128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.645059336361" font-weight="bold" fill="var(--text)">Partition 0</text>
  <text x="233.220338983051" y="210.275229357798" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--text-muted)">Executor A — data locality</text>

  <rect x="446.779661016949" y="151.743119266055" width="386.440677966102" height="85.137614678899" rx="6.241897251136" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="181.54128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.645059336361" font-weight="bold" fill="var(--text)">Partition 1</text>
  <text x="640" y="210.275229357798" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--text-muted)">Executor B</text>

  <rect x="853.559322033898" y="151.743119266055" width="386.440677966102" height="85.137614678899" rx="6.241897251136" fill="var(--surface)" stroke="var(--border)"/>
  <text x="1046.779661016949" y="181.54128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.645059336361" font-weight="bold" fill="var(--text)">Partition 2</text>
  <text x="1046.779661016949" y="210.275229357798" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.524110710794" fill="var(--text-muted)">Executor C — repartition/coalesce</text>

  <rect x="40" y="258.165137614679" width="589.830508474576" height="361.834862385321" rx="8.322529668181" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.915254237288" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.886956587497" font-weight="bold" fill="var(--ok-text)">HashPartitioner</text>
  <text x="334.915254237288" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--ok-text)">Default for pair RDDs</text>
  <text x="334.915254237288" y="375.229357798165" text-anchor="middle" font-family="Courier New, monospace" font-size="14.564426919316" fill="var(--ok-text)">key.hashCode mod N</text>

  <rect x="70.508474576271" y="401.834862385321" width="233.898305084746" height="58.532110091743" rx="5.201581042613" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="187.457627118644" y="436.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--text)">Even spread</text>

  <rect x="334.915254237288" y="401.834862385321" width="264.406779661017" height="58.532110091743" rx="5.201581042613" fill="var(--bg)" stroke="var(--ok-border)"/>
  <text x="467.118644067797" y="436.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--text)">Skew on hot keys</text>

  <text x="334.915254237288" y="502.935779816514" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Equal keys → same partition</text>
  <text x="334.915254237288" y="534.862385321101" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--ok-text)">Does not preserve order</text>
  <text x="334.915254237288" y="577.431192660551" text-anchor="middle" font-family="Courier New, monospace" font-size="13.524110710794" fill="var(--ok-text)">partitionBy(new HashPartitioner(n))</text>

  <rect x="650.169491525424" y="258.165137614679" width="589.830508474576" height="361.834862385321" rx="8.322529668181" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945.084745762712" y="300.733944954128" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.886956587497" font-weight="bold" fill="var(--info-text)">RangePartitioner</text>
  <text x="945.084745762712" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.604743127839" fill="var(--info-text)">Used by sortByKey / orderBy</text>
  <text x="945.084745762712" y="375.229357798165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--info-text)">Samples keys, picks splits</text>

  <rect x="680.677966101695" y="401.834862385321" width="233.898305084746" height="58.532110091743" rx="5.201581042613" fill="var(--bg)" stroke="var(--info-border)"/>
  <text x="797.627118644068" y="436.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--text)">p0: &lt;a, p1: a..b, ...</text>

  <rect x="945.084745762712" y="401.834862385321" width="264.406779661017" height="58.532110091743" rx="5.201581042613" fill="var(--bg)" stroke="var(--info-border)"/>
  <text x="1077.28813559322" y="436.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--text)">Preserves order</text>

  <text x="945.084745762712" y="502.935779816514" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--info-text)">Balanced despite skew</text>
  <text x="945.084745762712" y="534.862385321101" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.564426919316" fill="var(--info-text)">Keys must be Ordered</text>
  <text x="945.084745762712" y="577.431192660551" text-anchor="middle" font-family="Courier New, monospace" font-size="13.524110710794" fill="var(--info-text)">partitionBy(new RangePartitioner(...))</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Spark lightning bolt -->
  <polygon points="400,30 355,180 405,180 360,370 450,150 400,150 440,30" fill="#e8590c" opacity="0.85"/>
  <!-- Distributed nodes -->
  <circle cx="120" cy="100" r="25" fill="#f76707" opacity="0.5"/>
  <circle cx="680" cy="100" r="25" fill="#f76707" opacity="0.5"/>
  <circle cx="120" cy="300" r="25" fill="#f76707" opacity="0.5"/>
  <circle cx="680" cy="300" r="25" fill="#f76707" opacity="0.5"/>
  <!-- Connection lines -->
  <line x1="145" y1="100" x2="355" y2="175" stroke="#f76707" stroke-width="1.5" opacity="0.3"/>
  <line x1="655" y1="100" x2="445" y2="150" stroke="#f76707" stroke-width="1.5" opacity="0.3"/>
  <line x1="145" y1="300" x2="365" y2="275" stroke="#f76707" stroke-width="1.5" opacity="0.3"/>
  <line x1="655" y1="300" x2="445" y2="275" stroke="#f76707" stroke-width="1.5" opacity="0.3"/>
  <!-- Scala spiral/staircase symbol -->
  <path d="M200,140 L280,140 Q290,140 290,150 L290,170 Q290,180 280,180 L220,180 Q210,180 210,190 L210,210 Q210,220 220,220 L280,220 Q290,220 290,230 L290,250 Q290,260 280,260 L200,260" fill="none" stroke="#dc322f" stroke-width="4" opacity="0.7"/>
  <!-- Functional programming lambda -->
  <text x="240" y="210" font-family="Georgia, serif" font-size="40" fill="#dc322f" opacity="0.5" text-anchor="middle">&#955;</text>
  <!-- Data flow arrows -->
  <path d="M530,130 L620,130" stroke="#74c0fc" stroke-width="3" opacity="0.5"/>
  <polygon points="620,125 635,130 620,135" fill="#74c0fc" opacity="0.5"/>
  <path d="M540,170 L630,170" stroke="#74c0fc" stroke-width="3" opacity="0.4"/>
  <polygon points="630,165 645,170 630,175" fill="#74c0fc" opacity="0.4"/>
  <path d="M530,210 L620,210" stroke="#74c0fc" stroke-width="3" opacity="0.5"/>
  <polygon points="620,205 635,210 620,215" fill="#74c0fc" opacity="0.5"/>
  <!-- Title -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">APACHE SPARK WITH SCALA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="878.4244" height="440.5286" fill="var(--code-bg)" rx="6.0038" x="40" y="40"/>
  <polygon points="906.6315,223.5242 857.2203,388.7225 912.1219,388.7225 862.7105,597.9736 961.5334,355.6829 906.6315,355.6829 950.5528,223.5242" fill="var(--warn-accent)" opacity="0.85"/>
  <circle cx="599.1831" cy="300.6168" r="25.9196" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="1214.0804" cy="300.6168" r="25.9196" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="599.1831" cy="520.881" r="25.9196" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="1214.0804" cy="520.881" r="25.9196" fill="var(--warn-accent)" opacity="0.5"/>
  <line x1="626.634" y1="300.6168" x2="857.2203" y2="383.2159" stroke="var(--warn-border)" stroke-width="0.6985" opacity="0.3"/>
  <line x1="1186.6296" y1="300.6168" x2="956.0432" y2="355.6829" stroke="var(--warn-border)" stroke-width="0.6985" opacity="0.3"/>
  <line x1="626.634" y1="520.881" x2="868.2008" y2="493.348" stroke="var(--warn-border)" stroke-width="0.6985" opacity="0.3"/>
  <line x1="1186.6296" y1="520.881" x2="956.0432" y2="493.348" stroke="var(--warn-border)" stroke-width="0.6985" opacity="0.3"/>
  <path d="M 687.0255 344.6696 L 774.8679 344.6696 Q 785.8485 344.6696 785.8485 355.6829 L 785.8485 377.7094 Q 785.8485 388.7225 774.8679 388.7225 L 708.9862 388.7225 Q 698.006 388.7225 698.006 399.7356 L 698.006 421.7622 Q 698.006 432.7754 708.9862 432.7754 L 774.8679 432.7754 Q 785.8485 432.7754 785.8485 443.7885 L 785.8485 465.815 Q 785.8485 476.8282 774.8679 476.8282 L 687.0255 476.8282" fill="none" stroke="var(--danger-border)" stroke-width="1.8626" opacity="0.7"/>
  <text x="730.9468" y="421.7622" font-size="41.4714" fill="var(--danger-accent)" opacity="0.5" text-anchor="middle" font-family="Arial, sans-serif">λ</text>
  <path d="M 1049.3756 333.6565 L 1148.1986 333.6565" stroke="var(--primary-border)" stroke-width="1.3969" opacity="0.5"/>
  <polygon points="1148.1986,328.1497 1164.669,333.6565 1148.1986,339.1631" fill="var(--primary-fill)" opacity="0.5"/>
  <path d="M 1060.3559 377.7094 L 1159.1788 377.7094" stroke="var(--primary-border)" stroke-width="1.3969" opacity="0.4"/>
  <polygon points="1159.1788,372.2026 1175.6494,377.7094 1159.1788,383.2159" fill="var(--primary-fill)" opacity="0.4"/>
  <path d="M 1049.3756 421.7622 L 1148.1986 421.7622" stroke="var(--primary-border)" stroke-width="1.3969" opacity="0.5"/>
  <polygon points="1148.1986,416.2556 1164.669,421.7622 1148.1986,427.2687" fill="var(--primary-fill)" opacity="0.5"/>
  <text x="906.6315" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6621" fill="var(--border)" letter-spacing="3">APACHE SPARK WITH SCALA</text>
</svg>

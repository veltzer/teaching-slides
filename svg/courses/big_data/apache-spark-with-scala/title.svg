  <line x1="923.3333" y1="454.9999" x2="690" y2="423.75" stroke="var(--warn-border)" stroke-width="1.5238" opacity="0.3" />
  <path d="M 417.7778 255 L 506.6666 255 Q 517.7778 255 517.7778 267.5 L 517.7778 292.5 Q 517.7778 305 506.6666 305 L 440.0001 305 Q 428.8889 305 428.8889 317.5 L 428.8889 342.5 Q 428.8889 355 440.0001 355 L 506.6666 355 Q 517.7778 355 517.7778 367.4999 L 517.7778 392.5 Q 517.7778 405 506.6666 405 L 417.7778 405" fill="none" stroke="var(--danger-border)" stroke-width="4.0635" opacity="0.7" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.699676538728" font-weight="bold" fill="var(--primary-accent)">Catalyst Optimizer Pipeline</text>

  <!-- Four stages -->
  <rect x="40" y="82.181818181818" width="280" height="116" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457480813784" font-weight="bold" fill="var(--primary-text)">1. Unresolved</text>
  <text x="180" y="150.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">Parse tree</text>
  <text x="180" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">refs unknown</text>

  <line x1="320" y1="140.181818181818" x2="345" y2="140.181818181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="345" y="82.181818181818" width="280" height="116" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457480813784" font-weight="bold" fill="var(--primary-text)">2. Analyzed</text>
  <text x="485" y="150.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">Catalog resolve</text>
  <text x="485" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">type check</text>

  <line x1="625" y1="140.181818181818" x2="650" y2="140.181818181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="82.181818181818" width="280" height="116" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457480813784" font-weight="bold" fill="var(--primary-text)">3. Optimized</text>
  <text x="790" y="150.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">Rule rewrite</text>
  <text x="790" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">pushdown, prune</text>

  <line x1="930" y1="140.181818181818" x2="955" y2="140.181818181818" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="955" y="82.181818181818" width="285" height="116" rx="10.269106361049" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.457480813784" font-weight="bold" fill="var(--primary-text)">4. Physical</text>
  <text x="1097" y="150.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">Cost model</text>
  <text x="1097" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.349838269364" fill="var(--primary-text)">pick operator</text>

  <!-- Logical rewrite rules -->
  <rect x="40" y="224.545454545455" width="600" height="189.818181818182" rx="10.269106361049" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="259.345454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--ok-text)">Logical Rules</text>
  <text x="60" y="293.090909090909" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--ok-text)">Predicate pushdown</text>
  <text x="60" y="319.454545454545" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--ok-text)">Column pruning</text>
  <text x="60" y="345.818181818182" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--ok-text)">Constant folding</text>
  <text x="60" y="372.181818181818" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--ok-text)">Boolean simplify</text>
  <text x="60" y="398.545454545455" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--ok-text)">Join reordering</text>

  <!-- Physical operators -->
  <rect x="660" y="224.545454545455" width="580" height="189.818181818182" rx="10.269106361049" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="259.345454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--warn-text)">Physical Operators</text>
  <text x="680" y="293.090909090909" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--warn-text)">Join: broadcast / SMJ / shuffle</text>
  <text x="680" y="319.454545454545" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--warn-text)">Aggregate: hash or sort</text>
  <text x="680" y="345.818181818182" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--warn-text)">Exchange: hash / range</text>
  <text x="680" y="372.181818181818" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--warn-text)">Scan: Parquet chunks</text>
  <text x="680" y="398.545454545455" font-family="Arial, sans-serif" font-size="14.376748905469" fill="var(--warn-text)">Codegen: fused loops</text>

  <!-- AQE -->
  <rect x="40" y="440.727272727273" width="1200" height="179.272727272727" rx="10.269106361049" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="477.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.484391449889" font-weight="bold" fill="var(--info-text)">Adaptive Query Execution (AQE)</text>
  <text x="60" y="514.545454545455" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--info-text)">Re-plans using runtime stats after each stage</text>
  <text x="60" y="551.454545454545" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--info-text)">Coalesce small shuffle partitions</text>
  <text x="60" y="583.090909090909" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--info-text)">Switch SMJ to broadcast join</text>
  <text x="60" y="614.727272727273" font-family="Arial, sans-serif" font-size="15.403659541574" fill="var(--info-text)">Split skewed partitions</text>
</svg>

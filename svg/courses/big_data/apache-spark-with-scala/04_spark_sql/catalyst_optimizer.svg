<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1921" font-weight="bold" fill="var(--text)">Catalyst Optimizer Pipeline</text>

  <!-- Four stages -->
  <rect x="40" y="85.7895" width="290" height="111.9298" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="121.4035" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131" font-weight="bold" fill="var(--primary-text)">1. Unresolved</text>
  <text x="185" y="143.7895" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--primary-text)">Logical Plan</text>
  <text x="185" y="172.2807" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--primary-text)">Parser builds a tree of ops;</text>
  <text x="185" y="187.5439" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--primary-text)">columns/tables unknown yet.</text>

  <rect x="355" y="85.7895" width="290" height="111.9298" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="121.4035" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131" font-weight="bold" fill="var(--primary-text)">2. Analyzed</text>
  <text x="500" y="143.7895" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--primary-text)">Logical Plan</text>
  <text x="500" y="172.2807" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--primary-text)">Analyzer resolves references</text>
  <text x="500" y="187.5439" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--primary-text)">via the Catalog; checks types.</text>

  <rect x="670" y="85.7895" width="290" height="111.9298" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="815" y="121.4035" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131" font-weight="bold" fill="var(--primary-text)">3. Optimized</text>
  <text x="815" y="143.7895" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--primary-text)">Logical Plan</text>
  <text x="815" y="172.2807" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--primary-text)">Rule-based rewriting:</text>
  <text x="815" y="187.5439" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--primary-text)">pushdown, pruning, constant fold</text>

  <rect x="985" y="85.7895" width="255" height="111.9298" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115" y="121.4035" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131" font-weight="bold" fill="var(--primary-text)">4. Physical</text>
  <text x="1115" y="143.7895" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--primary-text)">Plan</text>
  <text x="1115" y="172.2807" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--primary-text)">Cost model picks the physical</text>
  <text x="1115" y="187.5439" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--primary-text)">operator (broadcast vs SMJ ...)</text>

  <line x1="330" y1="141.7544" x2="353" y2="141.7544" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="645" y1="141.7544" x2="668" y2="141.7544" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="141.7544" x2="983" y2="141.7544" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rule examples -->
  <rect x="40" y="228.2456" width="600" height="203.5088" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="260.807" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1397" font-weight="bold" fill="var(--ok-text)">Logical rewrite rules (examples)</text>
  <text x="70" y="294.386" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--ok-text)">Predicate pushdown — push WHERE down to the scan</text>
  <text x="70" y="319.8246" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--ok-text)">Column pruning — read only the columns the query uses</text>
  <text x="70" y="345.2632" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--ok-text)">Constant folding — 2 * 3 becomes 6 at plan time</text>
  <text x="70" y="370.7018" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--ok-text)">Boolean simplification — collapse x AND true to x</text>
  <text x="70" y="396.1404" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--ok-text)">Join reordering — place selective joins first</text>
  <text x="70" y="421.5789" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--ok-text)">Subquery elimination — rewrite correlated subqueries as joins</text>

  <!-- Physical operators -->
  <rect x="660" y="228.2456" width="580" height="203.5088" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="260.807" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1397" font-weight="bold" fill="var(--warn-text)">Physical operator choices</text>
  <text x="685" y="294.386" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--warn-text)">Join: broadcast / sort-merge / shuffle-hash</text>
  <text x="685" y="319.8246" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--warn-text)">Aggregate: hash-based or sort-based</text>
  <text x="685" y="345.2632" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--warn-text)">Sort: radix / tim-sort variants</text>
  <text x="685" y="370.7018" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--warn-text)">Exchange (shuffle): hash / range / broadcast partitioning</text>
  <text x="685" y="396.1404" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--warn-text)">Scan: file-format specific (Parquet column chunks ...)</text>
  <text x="685" y="421.5789" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--warn-text)">Codegen: fuse operators into a single compiled loop</text>

  <!-- AQE -->
  <rect x="40" y="457.193" width="1200" height="162.807" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="489.7544" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1397" font-weight="bold" fill="var(--info-text)">Adaptive Query Execution (AQE) — runtime re-planning</text>
  <text x="80" y="523.3333" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--info-text)">After each stage, AQE looks at the real statistics (row count, partition sizes) and may:</text>
  <text x="80" y="551.8246" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--info-text)">• coalesce many small shuffle partitions into fewer tasks (faster scheduling)</text>
  <text x="80" y="577.2632" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--info-text)">• convert a sort-merge join to a broadcast join if one side turned out small</text>
  <text x="80" y="602.7018" font-family="Arial, sans-serif" font-size="13.1135" fill="var(--info-text)">• split skewed partitions so one hot key does not block the whole stage</text>
</svg>

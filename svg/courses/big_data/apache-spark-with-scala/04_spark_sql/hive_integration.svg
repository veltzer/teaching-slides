<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="366.101694915254" height="250.196078431372" rx="8.603368303259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.050847457627" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.508420758147" font-weight="bold" fill="var(--primary-text)">SparkSession</text>
  <text x="223.050847457627" y="130.980392156863" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--primary-text)">.enableHiveSupport()</text>
  <text x="223.050847457627" y="170.784313725491" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--primary-text)">Reads hive-site.xml</text>
  <text x="223.050847457627" y="210.588235294118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--primary-text)">HiveQL dialect</text>
  <text x="223.050847457627" y="250.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--primary-text)">Hive UDFs + SerDes</text>

  <line x1="411.186440677966" y1="165.098039215687" x2="448.813559322034" y2="165.098039215687" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="456.949152542373" y="40" width="366.101694915254" height="250.196078431372" rx="8.603368303259" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.508420758147" font-weight="bold" fill="var(--ok-text)">Hive Metastore</text>
  <text x="640" y="130.980392156863" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--ok-text)">Table catalog</text>
  <text x="640" y="170.784313725491" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--ok-text)">Schemas + partitions</text>
  <text x="640" y="210.588235294118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--ok-text)">Backed by RDBMS</text>
  <text x="640" y="250.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--ok-text)">Thrift service</text>

  <line x1="828.135593220339" y1="165.098039215687" x2="865.762711864407" y2="165.098039215687" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="873.898305084746" y="40" width="366.101694915254" height="250.196078431372" rx="8.603368303259" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.949152542373" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.508420758147" font-weight="bold" fill="var(--warn-text)">Data (HDFS/S3)</text>
  <text x="1056.949152542373" y="130.980392156863" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--warn-text)">Parquet, ORC, Avro</text>
  <text x="1056.949152542373" y="170.784313725491" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--warn-text)">Managed or external</text>
  <text x="1056.949152542373" y="210.588235294118" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--warn-text)">Partitioned folders</text>
  <text x="1056.949152542373" y="250.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--warn-text)">Location in DDL</text>

  <rect x="40" y="324.313725490196" width="589.830508474576" height="295.686274509804" rx="8.603368303259" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="334.915254237288" y="364.117647058823" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.357578682332" font-weight="bold" fill="var(--primary-text)">Enable and Query</text>
  <text x="60.338983050847" y="409.607843137255" font-family="Courier New, monospace" font-size="15.055894530702" fill="var(--primary-text)">SparkSession.builder()</text>
  <text x="60.338983050847" y="443.725490196079" font-family="Courier New, monospace" font-size="15.055894530702" fill="var(--primary-text)">  .enableHiveSupport()</text>
  <text x="60.338983050847" y="477.843137254902" font-family="Courier New, monospace" font-size="15.055894530702" fill="var(--primary-text)">  .getOrCreate()</text>
  <text x="60.338983050847" y="529.019607843137" font-family="Courier New, monospace" font-size="15.055894530702" fill="var(--primary-text)">spark.sql("SELECT * FROM users")</text>
  <text x="60.338983050847" y="568.823529411764" font-family="Courier New, monospace" font-size="15.055894530702" fill="var(--primary-text)">df.write.saveAsTable("sales")</text>

  <rect x="650.169491525424" y="324.313725490196" width="589.830508474576" height="295.686274509804" rx="8.603368303259" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945.084745762712" y="364.117647058823" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.357578682332" font-weight="bold" fill="var(--text)">Why Use It</text>
  <text x="945.084745762712" y="409.607843137255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--text-muted)">Share tables with Presto, Trino</text>
  <text x="945.084745762712" y="449.411764705882" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--text-muted)">Reuse existing ETL</text>
  <text x="945.084745762712" y="489.21568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--text-muted)">Tables persist across sessions</text>
  <text x="945.084745762712" y="529.019607843137" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--text-muted)">Managed drop removes data</text>
  <text x="945.084745762712" y="568.823529411764" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.13131556861" fill="var(--text-muted)">External keeps files</text>
</svg>

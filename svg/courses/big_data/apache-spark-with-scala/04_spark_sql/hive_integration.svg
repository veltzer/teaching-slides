<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.748354" font-weight="bold" fill="var(--text)">Hive Integration</text>

  <rect x="40" y="69.635036" width="360" height="254.014599" rx="6.172697" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="109.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--primary-text)">SparkSession</text>
  <text x="220" y="149.014599" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">.enableHiveSupport()</text>
  <text x="220" y="180.766423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Loads hive-site.xml</text>
  <text x="220" y="212.518248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Binds Hive SerDes</text>
  <text x="220" y="244.270073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Binds Hive UDFs</text>
  <text x="220" y="276.021898" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">HiveQL dialect</text>
  <text x="220" y="307.773723" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">spark-warehouse dir</text>

  <line x1="400" y1="196.642336" x2="440" y2="196.642336" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="450" y="69.635036" width="380" height="254.014599" rx="6.172697" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="109.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--ok-text)">Hive Metastore</text>
  <text x="640" y="149.014599" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Database and table catalog</text>
  <text x="640" y="180.766423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Schema definitions</text>
  <text x="640" y="212.518248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Partition metadata</text>
  <text x="640" y="244.270073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Stored in MySQL/Postgres</text>
  <text x="640" y="276.021898" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Shared across engines</text>
  <text x="640" y="307.773723" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Thrift service</text>

  <line x1="830" y1="196.642336" x2="870" y2="196.642336" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="880" y="69.635036" width="360" height="254.014599" rx="6.172697" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="109.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--warn-text)">Data on HDFS/S3</text>
  <text x="1060" y="149.014599" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Parquet, ORC, Avro</text>
  <text x="1060" y="180.766423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Managed or external</text>
  <text x="1060" y="212.518248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Partitioned folders</text>
  <text x="1060" y="244.270073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Bucketed columns</text>
  <text x="1060" y="276.021898" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Location hint in DDL</text>
  <text x="1060" y="307.773723" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Files persist independently</text>

  <rect x="40" y="344.817518" width="595" height="275.182482" rx="6.172697" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="337" y="376.569343" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.460526" font-weight="bold" fill="var(--primary-text)">Enable and Query</text>
  <text x="60" y="413.613139" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">val spark = SparkSession.builder()</text>
  <text x="60" y="440.072993" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">  .appName("HiveApp")</text>
  <text x="60" y="466.532847" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">  .enableHiveSupport()</text>
  <text x="60" y="492.992701" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">  .getOrCreate()</text>
  <text x="60" y="530.036496" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">spark.sql("CREATE TABLE IF NOT EXISTS")</text>
  <text x="60" y="556.49635" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">spark.sql("SELECT * FROM users")</text>
  <text x="60" y="588.248175" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">df.write.saveAsTable("sales")</text>

  <rect x="645" y="344.817518" width="595" height="275.182482" rx="6.172697" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="942" y="381.861314" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--text)">Why Use It</text>
  <text x="942" y="416.788321" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Share tables with Hive, Presto, Impala, Trino.</text>
  <text x="942" y="448.540146" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Reuse existing ETL and data governance.</text>
  <text x="942" y="480.291971" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Persist table definitions across sessions.</text>
  <text x="942" y="512.043796" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Read Hive UDFs where needed.</text>
  <text x="942" y="543.79562" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Drop managed table removes data; external keeps it.</text>
  <text x="942" y="582.956204" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--text-faint)">Requires Hive jars on classpath and metastore URI.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Spark SQL Performance Optimization</text>

  <rect x="40" y="70" width="290" height="140" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Catalyst Optimizer</text>
  <text x="185" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Rule-based rewriting</text>
  <text x="185" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Predicate pushdown</text>
  <text x="185" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Column pruning</text>

  <rect x="350" y="70" width="290" height="140" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Tungsten Engine</text>
  <text x="495" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Off-heap memory layout</text>
  <text x="495" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Cache-aware compute</text>
  <text x="495" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Whole-stage codegen</text>

  <rect x="660" y="70" width="290" height="140" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Adaptive Query Exec</text>
  <text x="805" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Runtime shuffle tuning</text>
  <text x="805" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Dynamic partition pruning</text>
  <text x="805" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Skew join handling</text>

  <rect x="970" y="70" width="270" height="140" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Caching</text>
  <text x="1105" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">.cache() / .persist()</text>
  <text x="1105" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">MEMORY_AND_DISK</text>
  <text x="1105" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Reuse hot DataFrames</text>

  <rect x="40" y="250" width="290" height="140" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Columnar Formats</text>
  <text x="185" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Parquet / ORC</text>
  <text x="185" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Column-level statistics</text>
  <text x="185" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Compressed + splittable</text>

  <rect x="350" y="250" width="290" height="140" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Partitioning</text>
  <text x="495" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">partitionBy() on write</text>
  <text x="495" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Avoid tiny-file explosion</text>
  <text x="495" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Balanced key cardinality</text>

  <rect x="660" y="250" width="290" height="140" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Bucketing and Z-Order</text>
  <text x="805" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">bucketBy() for joins</text>
  <text x="805" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Co-locate related keys</text>
  <text x="805" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Delta OPTIMIZE ZORDER</text>

  <rect x="970" y="250" width="270" height="140" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Broadcast Joins</text>
  <text x="1105" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">broadcast(smallDF)</text>
  <text x="1105" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Skip the shuffle</text>
  <text x="1105" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Default threshold 10MB</text>

  <rect x="40" y="420" width="1200" height="200" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Watch-outs</text>
  <text x="80" y="490" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Data skew: one partition with most of the rows blocks the whole stage. Salt keys or use AQE skew handling.</text>
  <text x="80" y="518" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Small-file problem: thousands of tiny Parquet files kill scheduling. Coalesce or repartition before write.</text>
  <text x="80" y="546" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">UDFs defeat Catalyst: prefer built-in functions; if you must write a UDF, mark it deterministic.</text>
  <text x="80" y="574" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">collect() pulls all rows to the driver. Use limit() plus take(), or write the result to storage instead.</text>
  <text x="80" y="602" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Read EXPLAIN plans: look for Exchange (shuffle) stages and for broadcast vs sort-merge join decisions.</text>
</svg>

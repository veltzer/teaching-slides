<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2901" font-weight="bold" fill="var(--text)">Join Strategies in Spark SQL</text>

  <!-- Broadcast Hash Join -->
  <rect x="40" y="75.9292" width="390" height="256.6372" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.211" font-weight="bold" fill="var(--ok-text)">Broadcast Hash Join</text>
  <text x="235" y="137.5221" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">small side ships to every executor</text>
  <text x="235" y="163.1858" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">no shuffle on the large side</text>
  <text x="235" y="199.115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" font-weight="bold" fill="var(--ok-text)">When</text>
  <text x="235" y="219.646" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">one side under spark.sql.autoBroadcast</text>
  <text x="235" y="238.1239" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">Threshold (default 10MB)</text>
  <text x="235" y="277.1327" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" font-weight="bold" fill="var(--ok-text)">df.join(broadcast(small), "id")</text>
  <text x="235" y="306.9027" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">Fastest; avoid huge broadcasts (OOM)</text>

  <!-- Shuffle Hash Join -->
  <rect x="445" y="75.9292" width="390" height="256.6372" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.211" font-weight="bold" fill="var(--primary-text)">Shuffle Hash Join</text>
  <text x="640" y="137.5221" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">both sides hash-shuffled by key</text>
  <text x="640" y="163.1858" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">hashtable built on smaller side</text>
  <text x="640" y="199.115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" font-weight="bold" fill="var(--primary-text)">When</text>
  <text x="640" y="219.646" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">neither side tiny, one fits per executor</text>
  <text x="640" y="238.1239" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">spark.sql.join.preferSortMergeJoin=false</text>
  <text x="640" y="277.1327" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" font-weight="bold" fill="var(--primary-text)">No sorting, in-memory hash</text>
  <text x="640" y="306.9027" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">Rarely picked unless forced</text>

  <!-- Sort-Merge Join -->
  <rect x="850" y="75.9292" width="390" height="256.6372" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.211" font-weight="bold" fill="var(--warn-text)">Sort-Merge Join (default)</text>
  <text x="1045" y="137.5221" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--warn-text)">both sides shuffled then sorted</text>
  <text x="1045" y="163.1858" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--warn-text)">merge-scan produces joined rows</text>
  <text x="1045" y="199.115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" font-weight="bold" fill="var(--warn-text)">When</text>
  <text x="1045" y="219.646" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--warn-text)">both sides large, no broadcast candidate</text>
  <text x="1045" y="238.1239" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--warn-text)">Memory-safe: spill-to-disk friendly</text>
  <text x="1045" y="277.1327" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" font-weight="bold" fill="var(--warn-text)">Predictable, scalable</text>
  <text x="1045" y="306.9027" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--warn-text)">Watch for skew on one key</text>

  <!-- Bottom: Join Types -->
  <rect x="40" y="363.3628" width="1200" height="256.6372" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="399.292" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2374" font-weight="bold" fill="var(--text)">Join types</text>

  <rect x="70" y="424.9558" width="180" height="164.2478" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="453.6991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--info-text)">inner</text>
  <text x="160" y="494.7611" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">rows where key</text>
  <text x="160" y="515.292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">matches in both</text>
  <text x="160" y="558.4071" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--info-text)">default</text>

  <rect x="270" y="424.9558" width="180" height="164.2478" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="453.6991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--info-text)">left_outer</text>
  <text x="360" y="494.7611" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">all of left</text>
  <text x="360" y="515.292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">+ matches of right</text>
  <text x="360" y="558.4071" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--info-text)">nulls on misses</text>

  <rect x="470" y="424.9558" width="180" height="164.2478" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="453.6991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--info-text)">right_outer</text>
  <text x="560" y="494.7611" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">mirror of left_outer</text>

  <rect x="670" y="424.9558" width="180" height="164.2478" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="453.6991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--info-text)">full_outer</text>
  <text x="760" y="494.7611" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">everything from</text>
  <text x="760" y="515.292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">both sides</text>

  <rect x="870" y="424.9558" width="180" height="164.2478" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="453.6991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--info-text)">left_semi</text>
  <text x="960" y="494.7611" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">left rows that</text>
  <text x="960" y="515.292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">have a match</text>
  <text x="960" y="558.4071" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--info-text)">no right columns</text>

  <rect x="1070" y="424.9558" width="150" height="164.2478" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145" y="453.6991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--info-text)">left_anti</text>
  <text x="1145" y="494.7611" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">left rows with</text>
  <text x="1145" y="515.292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--info-text)">NO match</text>
</svg>

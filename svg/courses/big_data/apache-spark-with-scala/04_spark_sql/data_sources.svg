<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.758651532102" font-weight="bold" fill="var(--text)">Spark SQL Data Sources</text>

  <rect x="40" y="71.926605504587" width="390" height="276.697247706422" rx="6.189662883026" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="114.495412844037" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.568988649077" font-weight="bold" fill="var(--ok-text)">Columnar (preferred)</text>
  <text x="235" y="157.064220183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--ok-text)">Parquet</text>
  <text x="235" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--ok-text)">predicate pushdown</text>
  <text x="235" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--ok-text)">ORC</text>
  <text x="235" y="247.522935779817" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--ok-text)">Hive native</text>
  <text x="235" y="284.770642201835" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--ok-text)">Delta / Iceberg / Hudi</text>
  <text x="235" y="311.376146788991" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--ok-text)">ACID, time travel</text>

  <rect x="445" y="71.926605504587" width="390" height="276.697247706422" rx="6.189662883026" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="114.495412844037" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.568988649077" font-weight="bold" fill="var(--primary-text)">Text / Semi-structured</text>
  <text x="640" y="157.064220183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--primary-text)">JSON</text>
  <text x="640" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--primary-text)">schema inferred</text>
  <text x="640" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--primary-text)">CSV</text>
  <text x="640" y="247.522935779817" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--primary-text)">slow inference</text>
  <text x="640" y="284.770642201835" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--primary-text)">Avro</text>
  <text x="640" y="311.376146788991" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--primary-text)">row-based, streaming</text>

  <rect x="850" y="71.926605504587" width="390" height="276.697247706422" rx="6.189662883026" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="114.495412844037" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.568988649077" font-weight="bold" fill="var(--warn-text)">External Systems</text>
  <text x="1045" y="157.064220183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--warn-text)">JDBC</text>
  <text x="1045" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--warn-text)">MySQL, Postgres</text>
  <text x="1045" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--warn-text)">Hive Metastore</text>
  <text x="1045" y="247.522935779817" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--warn-text)">spark.sql(...)</text>
  <text x="1045" y="284.770642201835" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" font-weight="bold" fill="var(--warn-text)">Kafka / Cassandra</text>
  <text x="1045" y="311.376146788991" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.410936246555" fill="var(--warn-text)">streaming connectors</text>

  <rect x="40" y="375.229357798165" width="1200" height="244.770642201835" rx="6.189662883026" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="412.477064220183" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.568988649077" font-weight="bold" fill="var(--text)">Key Picks</text>
  <text x="80" y="455.045871559633" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--text-muted)">Prefer Parquet/ORC/Delta. Column pruning cuts reads 10-100x.</text>
  <text x="80" y="492.293577981651" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--text-muted)">Supply a StructType for CSV/JSON to skip slow inference.</text>
  <text x="80" y="529.54128440367" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--text-muted)">JDBC: set partitionColumn and numPartitions to parallelize.</text>
  <text x="80" y="566.788990825688" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--text-muted)">DataSource V2 supports streaming and pushdown uniformly.</text>
  <text x="80" y="604.036697247706" font-family="Arial, sans-serif" font-size="14.44254672706" fill="var(--text-muted)">Default write mode is errorifexists.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Pipeline flow -->
  <rect x="40" y="40" width="274.576271186441" height="210.909090909091" rx="8.284613618287" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.28813559322" y="92.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.711534045719" font-weight="bold" fill="var(--primary-text)">Scala Function</text>
  <text x="177.28813559322" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--primary-text)">(String =&gt; String)</text>
  <text x="177.28813559322" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--primary-text)">Serializable</text>
  <text x="177.28813559322" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--primary-text)">Null-safe</text>

  <line x1="316.610169491525" y1="145.454545454545" x2="353.220338983051" y2="145.454545454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="355.254237288136" y="40" width="274.576271186441" height="210.909090909091" rx="8.284613618287" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="492.542372881356" y="92.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.640380641147" font-weight="bold" fill="var(--ok-text)">spark.udf.register</text>
  <text x="492.542372881356" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--ok-text)">Name + function</text>
  <text x="492.542372881356" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--ok-text)">Usable in SQL</text>
  <text x="492.542372881356" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--ok-text)">Session-scoped</text>

  <line x1="631.864406779661" y1="145.454545454545" x2="668.474576271186" y2="145.454545454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="670.508474576271" y="40" width="274.576271186441" height="210.909090909091" rx="8.284613618287" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="807.796610169491" y="92.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.711534045719" font-weight="bold" fill="var(--warn-text)">udf(...) wrapper</text>
  <text x="807.796610169491" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--warn-text)">val f = udf(func)</text>
  <text x="807.796610169491" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--warn-text)">DataFrame API</text>
  <text x="807.796610169491" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--warn-text)">Typed Column</text>

  <line x1="947.118644067797" y1="145.454545454545" x2="983.728813559322" y2="145.454545454545" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="985.762711864407" y="40" width="254.237288135593" height="210.909090909091" rx="8.284613618287" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.881355932203" y="92.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.711534045719" font-weight="bold" fill="var(--info-text)">Executor</text>
  <text x="1112.881355932203" y="140.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--info-text)">Runs per row</text>
  <text x="1112.881355932203" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--info-text)">Not Catalyst</text>
  <text x="1112.881355932203" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" fill="var(--info-text)">No pushdown</text>

  <!-- Code example -->
  <rect x="40" y="282.545454545455" width="1200" height="337.454545454545" rx="8.284613618287" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="60.338983050847" y="324.727272727273" font-size="16.569227236575" fill="var(--primary-fill)" font-family="Courier New, monospace">spark.udf.register("myUpper",</text>
  <text x="60.338983050847" y="354.254545454545" font-size="16.569227236575" fill="var(--bg)" font-family="Courier New, monospace">  (s: String) =&gt; s.toUpperCase)</text>
  <text x="60.338983050847" y="388" font-size="16.569227236575" fill="var(--primary-fill)" font-family="Courier New, monospace">spark.sql("SELECT myUpper(name) FROM users")</text>
  <text x="60.338983050847" y="440.727272727273" font-size="16.569227236575" fill="var(--ok-fill)" font-family="Courier New, monospace">// DataFrame API form</text>
  <text x="60.338983050847" y="472.363636363636" font-size="16.569227236575" fill="var(--primary-fill)" font-family="Courier New, monospace">import org.apache.spark.sql.functions.udf</text>
  <text x="60.338983050847" y="504" font-size="16.569227236575" fill="var(--bg)" font-family="Courier New, monospace">val upper = udf((s: String) =&gt;</text>
  <text x="60.338983050847" y="533.527272727273" font-size="16.569227236575" fill="var(--bg)" font-family="Courier New, monospace">  Option(s).map(_.toUpperCase).orNull)</text>
  <text x="60.338983050847" y="579.927272727273" font-size="16.569227236575" fill="var(--bg)" font-family="Courier New, monospace">df.select(upper($"name"))</text>
</svg>

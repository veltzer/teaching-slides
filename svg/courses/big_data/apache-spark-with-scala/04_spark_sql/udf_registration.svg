<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.748354" font-weight="bold" fill="var(--text)">UDF Registration</text>

  <rect x="40" y="69.635036" width="280" height="190.510949" rx="6.172697" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="111.970803" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--primary-text)">Scala Function</text>
  <text x="180" y="149.014599" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Plain (String =&gt; String)</text>
  <text x="180" y="180.766423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Serializable closure</text>
  <text x="180" y="212.518248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Pure, no side effects</text>
  <text x="180" y="244.270073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Null-safe inputs</text>

  <line x1="320" y1="164.890511" x2="360" y2="164.890511" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="69.635036" width="280" height="190.510949" rx="6.172697" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="111.970803" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--ok-text)">spark.udf.register</text>
  <text x="510" y="149.014599" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Name + function</text>
  <text x="510" y="180.766423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Available in SQL strings</text>
  <text x="510" y="212.518248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Session-scoped</text>
  <text x="510" y="244.270073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Return type inferred</text>

  <line x1="650" y1="164.890511" x2="690" y2="164.890511" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="69.635036" width="280" height="190.510949" rx="6.172697" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="111.970803" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--warn-text)">udf(...) wrapper</text>
  <text x="840" y="149.014599" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">val f = udf(func)</text>
  <text x="840" y="180.766423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Use in DataFrame API</text>
  <text x="840" y="212.518248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">df.select(f($"col"))</text>
  <text x="840" y="244.270073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Typed Column output</text>

  <line x1="980" y1="164.890511" x2="1020" y2="164.890511" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1030" y="69.635036" width="210" height="190.510949" rx="6.172697" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="111.970803" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--info-text)">Executor</text>
  <text x="1135" y="149.014599" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Runs per row</text>
  <text x="1135" y="180.766423" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">JVM, not Catalyst</text>
  <text x="1135" y="212.518248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Opaque to optimizer</text>
  <text x="1135" y="244.270073" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">No pushdown</text>

  <rect x="40" y="291.89781" width="595" height="328.10219" rx="6.172697" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="337" y="323.649635" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.460526" font-weight="bold" fill="var(--primary-text)">Register for SQL</text>
  <text x="60" y="360.693431" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">spark.udf.register("myUpper",</text>
  <text x="60" y="387.153285" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">  (s: String) =&gt; s.toUpperCase)</text>
  <text x="60" y="418.905109" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">spark.sql(</text>
  <text x="60" y="445.364964" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">  "SELECT myUpper(name) FROM users")</text>
  <text x="60" y="487.70073" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">// DataFrame API form</text>
  <text x="60" y="514.160584" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">import org.apache.spark.sql.functions.udf</text>
  <text x="60" y="540.620438" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">val upper = udf((s: String) =&gt;</text>
  <text x="60" y="567.080292" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">  Option(s).map(_.toUpperCase).orNull)</text>
  <text x="60" y="598.832117" font-family="monospace" font-size="14.40296" fill="var(--primary-text)">df.select(upper($"name"))</text>

  <rect x="645" y="291.89781" width="595" height="328.10219" rx="6.172697" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="942" y="328.941606" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--text)">Caveats</text>
  <text x="942" y="365.985401" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Prefer built-in functions from org.apache.spark.sql.functions.</text>
  <text x="942" y="397.737226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Built-ins are Catalyst-visible and support codegen.</text>
  <text x="942" y="429.489051" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">UDFs break optimizations like predicate pushdown.</text>
  <text x="942" y="461.240876" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Serialization per row costs CPU.</text>
  <text x="942" y="492.992701" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Pandas UDFs for Python give vectorized speed.</text>
  <text x="942" y="524.744526" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">UDAFs aggregate; typed Aggregator is preferred in Scala.</text>
  <text x="942" y="556.49635" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Handle null: wrap in Option or check in function.</text>
  <text x="942" y="588.248175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Deterministic by default; mark nondeterministic if needed.</text>
</svg>

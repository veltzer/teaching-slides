  <text x="645" y="572.372263" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Dynamic partition pruning</text>
  <text x="645" y="598.832117" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Huge wins on big joins</text>


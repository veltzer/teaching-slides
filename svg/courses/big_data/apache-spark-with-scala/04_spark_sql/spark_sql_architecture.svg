<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.4959" font-weight="bold" fill="var(--text)">Spark SQL Architecture</text>

  <!-- Top: user API -->
  <rect x="40" y="81.0619" width="388.8889" height="71.8584" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.4444" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0199" font-weight="bold" fill="var(--primary-text)">DataFrame / Dataset API</text>
  <text x="234.4444" y="135.469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8159" fill="var(--primary-text)">Scala, Java, Python, R</text>

  <rect x="451.1111" y="81.0619" width="388.8889" height="71.8584" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645.5556" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0199" font-weight="bold" fill="var(--primary-text)">SQL Queries</text>
  <text x="645.5556" y="135.469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8159" fill="var(--primary-text)">spark.sql("SELECT ...")</text>

  <rect x="862.2222" y="81.0619" width="377.7778" height="71.8584" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.1111" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0199" font-weight="bold" fill="var(--primary-text)">Hive Tables</text>
  <text x="1051.1111" y="135.469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8159" fill="var(--primary-text)">metastore-backed tables</text>

  <line x1="234.4444" y1="152.9204" x2="373.3333" y2="183.7168" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="645.5556" y1="152.9204" x2="645.5556" y2="183.7168" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1051.1111" y1="152.9204" x2="906.6667" y2="183.7168" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Catalyst Optimizer -->
  <rect x="40" y="188.8496" width="1200" height="225.8407" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="224.7788" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2239" font-weight="bold" fill="var(--info-text)">Catalyst Optimizer</text>

  <rect x="84.4444" y="250.4425" width="222.2222" height="133.4513" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.5556" y="284.3186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9519" font-weight="bold" fill="var(--info-text)">Unresolved</text>
  <text x="195.5556" y="306.9027" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9519" font-weight="bold" fill="var(--info-text)">Logical Plan</text>
  <text x="195.5556" y="344.885" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7479" fill="var(--info-text)">column / table refs</text>
  <text x="195.5556" y="361.3097" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7479" fill="var(--info-text)">not yet resolved</text>

  <rect x="340" y="250.4425" width="222.2222" height="133.4513" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="451.1111" y="284.3186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9519" font-weight="bold" fill="var(--info-text)">Analyzed</text>
  <text x="451.1111" y="306.9027" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9519" font-weight="bold" fill="var(--info-text)">Logical Plan</text>
  <text x="451.1111" y="344.885" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7479" fill="var(--info-text)">resolve via Catalog</text>
  <text x="451.1111" y="361.3097" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7479" fill="var(--info-text)">type-check</text>

  <rect x="595.5556" y="250.4425" width="222.2222" height="133.4513" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="284.3186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9519" font-weight="bold" fill="var(--info-text)">Optimized</text>
  <text x="706.6667" y="306.9027" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9519" font-weight="bold" fill="var(--info-text)">Logical Plan</text>
  <text x="706.6667" y="344.885" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7479" fill="var(--info-text)">predicate pushdown</text>
  <text x="706.6667" y="361.3097" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7479" fill="var(--info-text)">column pruning</text>

  <rect x="851.1111" y="250.4425" width="222.2222" height="133.4513" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="962.2222" y="284.3186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9519" font-weight="bold" fill="var(--info-text)">Physical</text>
  <text x="962.2222" y="306.9027" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9519" font-weight="bold" fill="var(--info-text)">Plan</text>
  <text x="962.2222" y="344.885" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7479" fill="var(--info-text)">cost-based selection</text>
  <text x="962.2222" y="361.3097" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.7479" fill="var(--info-text)">broadcast vs sort-merge</text>

  <line x1="306.6667" y1="317.1681" x2="337.7778" y2="317.1681" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="562.2222" y1="317.1681" x2="593.3333" y2="317.1681" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="817.7778" y1="317.1681" x2="848.8889" y2="317.1681" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tungsten + RDDs -->
  <rect x="40" y="435.2212" width="577.7778" height="92.3894" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="328.8889" y="466.0177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0199" font-weight="bold" fill="var(--ok-text)">Tungsten Execution</text>
  <text x="328.8889" y="491.6814" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8159" fill="var(--ok-text)">Whole-stage codegen, off-heap memory</text>
  <text x="328.8889" y="512.2124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8159" fill="var(--ok-text)">Cache-friendly binary row format</text>

  <rect x="662.2222" y="435.2212" width="577.7778" height="92.3894" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="951.1111" y="466.0177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0199" font-weight="bold" fill="var(--ok-text)">RDDs of InternalRow</text>
  <text x="951.1111" y="491.6814" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8159" fill="var(--ok-text)">Executed on the Spark engine</text>
  <text x="951.1111" y="512.2124" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8159" fill="var(--ok-text)">Same scheduler, shuffle, fault tolerance</text>

  <line x1="967.7778" y1="383.8938" x2="967.7778" y2="430.0885" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data sources -->
  <rect x="40" y="548.1416" width="1200" height="71.8584" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="576.885" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0199" font-weight="bold" fill="var(--warn-text)">Data Source V2</text>
  <text x="640" y="599.469" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.8159" fill="var(--warn-text)">Parquet · ORC · JSON · CSV · JDBC · Delta · Iceberg · Kafka</text>
</svg>

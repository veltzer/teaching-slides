<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Top: user API -->
  <rect x="40" y="40" width="388.8889" height="77.333318984128" rx="6.224375773614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.4444" y="73.142897115643" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618979575952" font-weight="bold" fill="var(--primary-text)">DataFrame / Dataset API</text>
  <text x="234.4444" y="98.55239776145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.295162912842" fill="var(--primary-text)">Scala, Java, Python, R</text>

  <rect x="451.1111" y="40" width="388.8889" height="77.333318984128" rx="6.224375773614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645.5556" y="73.142897115643" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618979575952" font-weight="bold" fill="var(--primary-text)">SQL Queries</text>
  <text x="645.5556" y="98.55239776145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.295162912842" fill="var(--primary-text)">spark.sql("SELECT ...")</text>

  <rect x="862.2222" y="40" width="377.7778" height="77.333318984128" rx="6.224375773614" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.1111" y="73.142897115643" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618979575952" font-weight="bold" fill="var(--primary-text)">Hive Tables</text>
  <text x="1051.1111" y="98.55239776145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.295162912842" fill="var(--primary-text)">metastore-backed tables</text>

  <line x1="234.4444" y1="117.333426603166" x2="373.3333" y2="150.476216099771" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="645.5556" y1="117.333426603166" x2="645.5556" y2="150.476216099771" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1051.1111" y1="117.333426603166" x2="906.6667" y2="150.476216099771" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Catalyst Optimizer -->
  <rect x="40" y="156.000086095231" width="1200" height="243.047589324266" rx="6.224375773614" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="194.666745587295" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.942796239062" font-weight="bold" fill="var(--info-text)">Catalyst Optimizer</text>

  <rect x="84.4444" y="222.285772707478" width="222.2222" height="143.619005596376" rx="6.224375773614" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.5556" y="258.742905725166" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.511040688249" font-weight="bold" fill="var(--info-text)">Unresolved</text>
  <text x="195.5556" y="283.047696943304" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.511040688249" font-weight="bold" fill="var(--info-text)">Logical Plan</text>
  <text x="195.5556" y="323.923882909744" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.187224025139" fill="var(--info-text)">column / table refs</text>
  <text x="195.5556" y="341.599987085715" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.187224025139" fill="var(--info-text)">not yet resolved</text>

  <rect x="340" y="222.285772707478" width="222.2222" height="143.619005596376" rx="6.224375773614" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="451.1111" y="258.742905725166" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.511040688249" font-weight="bold" fill="var(--info-text)">Analyzed</text>
  <text x="451.1111" y="283.047696943304" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.511040688249" font-weight="bold" fill="var(--info-text)">Logical Plan</text>
  <text x="451.1111" y="323.923882909744" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.187224025139" fill="var(--info-text)">resolve via Catalog</text>
  <text x="451.1111" y="341.599987085715" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.187224025139" fill="var(--info-text)">type-check</text>

  <rect x="595.5556" y="222.285772707478" width="222.2222" height="143.619005596376" rx="6.224375773614" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="258.742905725166" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.511040688249" font-weight="bold" fill="var(--info-text)">Optimized</text>
  <text x="706.6667" y="283.047696943304" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.511040688249" font-weight="bold" fill="var(--info-text)">Logical Plan</text>
  <text x="706.6667" y="323.923882909744" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.187224025139" fill="var(--info-text)">predicate pushdown</text>
  <text x="706.6667" y="341.599987085715" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.187224025139" fill="var(--info-text)">column pruning</text>

  <rect x="851.1111" y="222.285772707478" width="222.2222" height="143.619005596376" rx="6.224375773614" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="962.2222" y="258.742905725166" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.511040688249" font-weight="bold" fill="var(--info-text)">Physical</text>
  <text x="962.2222" y="283.047696943304" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.511040688249" font-weight="bold" fill="var(--info-text)">Plan</text>
  <text x="962.2222" y="323.923882909744" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.187224025139" fill="var(--info-text)">cost-based selection</text>
  <text x="962.2222" y="341.599987085715" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.187224025139" fill="var(--info-text)">broadcast vs sort-merge</text>

  <line x1="306.6667" y1="294.095221696146" x2="337.7778" y2="294.095221696146" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="562.2222" y1="294.095221696146" x2="593.3333" y2="294.095221696146" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="817.7778" y1="294.095221696146" x2="848.8889" y2="294.095221696146" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tungsten + RDDs -->
  <rect x="40" y="421.14283254422" width="577.7778" height="99.42858372789" rx="6.224375773614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="328.8889" y="454.285729659863" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618979575952" font-weight="bold" fill="var(--ok-text)">Tungsten Execution</text>
  <text x="328.8889" y="481.904756780046" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.295162912842" fill="var(--ok-text)">Whole-stage codegen, off-heap memory</text>
  <text x="328.8889" y="504.000021523808" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.295162912842" fill="var(--ok-text)">Cache-friendly binary row format</text>

  <rect x="662.2222" y="421.14283254422" width="577.7778" height="99.42858372789" rx="6.224375773614" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="951.1111" y="454.285729659863" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618979575952" font-weight="bold" fill="var(--ok-text)">RDDs of InternalRow</text>
  <text x="951.1111" y="481.904756780046" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.295162912842" fill="var(--ok-text)">Executed on the Spark engine</text>
  <text x="951.1111" y="504.000021523808" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.295162912842" fill="var(--ok-text)">Same scheduler, shuffle, fault tolerance</text>

  <line x1="967.7778" y1="365.904778303854" x2="967.7778" y2="415.619070167799" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data sources -->
  <rect x="40" y="542.666681015872" width="1200" height="77.333318984128" rx="6.224375773614" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="573.600051657138" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.618979575952" font-weight="bold" fill="var(--warn-text)">Data Source V2</text>
  <text x="640" y="597.904735256238" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.295162912842" fill="var(--warn-text)">Parquet · ORC · JSON · CSV · JDBC · Delta · Iceberg · Kafka</text>
</svg>

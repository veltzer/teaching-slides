<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.748354" font-weight="bold" fill="var(--text)">Spark SQL Data Types</text>

  <rect x="40" y="69.635036" width="290" height="254.014599" rx="6.172697" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--primary-text)">Numeric</text>
  <text x="185" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">ByteType, ShortType</text>
  <text x="185" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">IntegerType</text>
  <text x="185" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">LongType</text>
  <text x="185" y="223.10219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">FloatType, DoubleType</text>
  <text x="185" y="249.562044" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">DecimalType(p, s)</text>
  <text x="185" y="281.313869" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--primary-text)">Decimal: fixed precision</text>
  <text x="185" y="304.59854" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--primary-text)">use for money</text>

  <rect x="340" y="69.635036" width="290" height="254.014599" rx="6.172697" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--ok-text)">Text and Binary</text>
  <text x="485" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">StringType</text>
  <text x="485" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">BinaryType (bytes)</text>
  <text x="485" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">BooleanType</text>
  <text x="485" y="228.394161" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">UTF-8 encoded</text>
  <text x="485" y="254.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Nullable by default</text>
  <text x="485" y="286.605839" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--ok-text)">Use lit() to create</text>

  <rect x="640" y="69.635036" width="290" height="254.014599" rx="6.172697" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--warn-text)">Date and Time</text>
  <text x="785" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">DateType (yyyy-MM-dd)</text>
  <text x="785" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">TimestampType (UTC-ms)</text>
  <text x="785" y="201.934307" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">TimestampNTZType</text>
  <text x="785" y="233.686131" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">DayTimeIntervalType</text>
  <text x="785" y="265.437956" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">YearMonthIntervalType</text>
  <text x="785" y="300.364964" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--warn-text)">Built-in fns: date_add, ...</text>

  <rect x="940" y="69.635036" width="300" height="254.014599" rx="6.172697" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--info-text)">Complex</text>
  <text x="1090" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">ArrayType(elemType)</text>
  <text x="1090" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">MapType(key, value)</text>
  <text x="1090" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">StructType(fields)</text>
  <text x="1090" y="223.10219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">StructField(name,type)</text>
  <text x="1090" y="254.854015" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Nested structs allowed</text>
  <text x="1090" y="286.605839" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">explode, array functions</text>

  <rect x="40" y="344.817518" width="595" height="275.182482" rx="6.172697" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="337" y="381.861314" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.460526" font-weight="bold" fill="var(--primary-text)">Define Schema</text>
  <text x="60" y="418.905109" font-size="14.40296" fill="var(--primary-text)" font-family="Courier New, monospace">import org.apache.spark.sql.types._</text>
  <text x="60" y="455.948905" font-size="14.40296" fill="var(--primary-text)" font-family="Courier New, monospace">val schema = StructType(Array(</text>
  <text x="60" y="482.408759" font-size="14.40296" fill="var(--primary-text)" font-family="Courier New, monospace">  StructField("name", StringType, false),</text>
  <text x="60" y="508.868613" font-size="14.40296" fill="var(--primary-text)" font-family="Courier New, monospace">  StructField("age", IntegerType, true),</text>
  <text x="60" y="535.328467" font-size="14.40296" fill="var(--primary-text)" font-family="Courier New, monospace">  StructField("salary", DoubleType, true),</text>
  <text x="60" y="561.788321" font-size="14.40296" fill="var(--primary-text)" font-family="Courier New, monospace">  StructField("tags",</text>
  <text x="60" y="588.248175" font-size="14.40296" fill="var(--primary-text)" font-family="Courier New, monospace">    ArrayType(StringType), true)))</text>

  <rect x="645" y="344.817518" width="595" height="275.182482" rx="6.172697" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="942" y="381.861314" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--text)">Tips</text>
  <text x="942" y="416.788321" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Schema inference samples data; slow for big JSON/CSV.</text>
  <text x="942" y="448.540146" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Provide schema explicitly for stable production jobs.</text>
  <text x="942" y="480.291971" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">StringType is UTF-8 and unbounded.</text>
  <text x="942" y="512.043796" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">DecimalType avoids floating point errors.</text>
  <text x="942" y="543.79562" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Timestamps are stored as micros since epoch.</text>
  <text x="942" y="575.547445" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Cast with .cast("long") or col.cast(LongType).</text>
  <text x="942" y="607.29927" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.374177" fill="var(--text-faint)">printSchema() dumps the tree for any DataFrame.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="290" height="261.56862745098" rx="6.39852924277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.394852349696" font-weight="bold" fill="var(--primary-text)">Numeric</text>
  <text x="185" y="125.294117647059" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">Byte / Short / Integer</text>
  <text x="185" y="153.725490196079" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">LongType</text>
  <text x="185" y="182.156862745098" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">Float / Double</text>
  <text x="185" y="210.588235294117" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--primary-text)">DecimalType(p,s)</text>
  <text x="185" y="256.078431372549" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026003" fill="var(--primary-text)">Decimal for money</text>

  <rect x="340" y="40" width="290" height="261.56862745098" rx="6.39852924277" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.394852349696" font-weight="bold" fill="var(--ok-text)">Text / Binary</text>
  <text x="485" y="130.980392156863" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">StringType (UTF-8)</text>
  <text x="485" y="165.098039215686" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">BinaryType</text>
  <text x="485" y="199.21568627451" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--ok-text)">BooleanType</text>
  <text x="485" y="250.392156862745" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026003" fill="var(--ok-text)">Nullable by default</text>

  <rect x="640" y="40" width="290" height="261.56862745098" rx="6.39852924277" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.394852349696" font-weight="bold" fill="var(--warn-text)">Date / Time</text>
  <text x="785" y="130.980392156863" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">DateType</text>
  <text x="785" y="165.098039215686" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">TimestampType</text>
  <text x="785" y="199.21568627451" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">TimestampNTZType</text>
  <text x="785" y="233.333333333334" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--warn-text)">IntervalType</text>
  <text x="785" y="278.823529411765" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026003" fill="var(--warn-text)">micros since epoch</text>

  <rect x="940" y="40" width="300" height="261.56862745098" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="85.490196078431" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.394852349696" font-weight="bold" fill="var(--info-text)">Complex</text>
  <text x="1090" y="130.980392156863" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">ArrayType(elem)</text>
  <text x="1090" y="165.098039215686" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">MapType(k, v)</text>
  <text x="1090" y="199.21568627451" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">StructType(fields)</text>
  <text x="1090" y="233.333333333334" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--info-text)">StructField(n, t)</text>
  <text x="1090" y="278.823529411765" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026003" fill="var(--info-text)">nesting allowed</text>

  <rect x="40" y="324.313725490196" width="595" height="295.686274509804" rx="6.39852924277" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="337" y="364.117647058823" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.129166187849" font-weight="bold" fill="var(--primary-text)">Define Schema</text>
  <text x="60" y="403.921568627451" font-size="14.929901566464" fill="var(--primary-text)" font-family="Courier New, monospace">import org.apache.spark.sql.types._</text>
  <text x="60" y="443.725490196079" font-size="14.929901566464" fill="var(--primary-text)" font-family="Courier New, monospace">val schema = StructType(Array(</text>
  <text x="60" y="477.843137254902" font-size="14.929901566464" fill="var(--primary-text)" font-family="Courier New, monospace">  StructField("name", StringType, false),</text>
  <text x="60" y="511.960784313726" font-size="14.929901566464" fill="var(--primary-text)" font-family="Courier New, monospace">  StructField("age", IntegerType, true),</text>
  <text x="60" y="546.078431372549" font-size="14.929901566464" fill="var(--primary-text)" font-family="Courier New, monospace">  StructField("tags",</text>
  <text x="60" y="580.196078431372" font-size="14.929901566464" fill="var(--primary-text)" font-family="Courier New, monospace">    ArrayType(StringType))))</text>

  <rect x="645" y="324.313725490196" width="595" height="295.686274509804" rx="6.39852924277" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="942" y="364.117647058823" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.262009268773" font-weight="bold" fill="var(--text)">Tips</text>
  <text x="942" y="409.607843137255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Provide schema explicitly in production</text>
  <text x="942" y="449.411764705883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Inference samples data (slow)</text>
  <text x="942" y="489.21568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">DecimalType avoids float errors</text>
  <text x="942" y="529.019607843137" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Cast with .cast(LongType)</text>
  <text x="942" y="568.823529411765" text-anchor="middle" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text-muted)">df.printSchema()</text>
</svg>

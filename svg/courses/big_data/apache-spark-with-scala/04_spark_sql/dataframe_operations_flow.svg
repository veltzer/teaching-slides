<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="220" height="216.822429906542" rx="8.32965650973" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="83.364485981308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--primary-text)">Source</text>
  <text x="150" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">read.csv / json</text>
  <text x="150" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">read.parquet</text>
  <text x="150" y="185.271028037384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">table / jdbc</text>
  <text x="150" y="214.542056074767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">toDF from RDD</text>

  <line x1="265" y1="148.411214953272" x2="300" y2="148.411214953272" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="40" width="220" height="216.822429906542" rx="8.32965650973" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="83.364485981308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--ok-text)">Transforms</text>
  <text x="420" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">select, filter</text>
  <text x="420" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">withColumn</text>
  <text x="420" y="185.271028037384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">join, union</text>
  <text x="420" y="214.542056074767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Lazy</text>

  <line x1="535" y1="148.411214953272" x2="570" y2="148.411214953272" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="580" y="40" width="220" height="216.822429906542" rx="8.32965650973" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="690" y="83.364485981308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--warn-text)">Aggregations</text>
  <text x="690" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">groupBy + agg</text>
  <text x="690" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">sum, avg, count</text>
  <text x="690" y="185.271028037384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">window functions</text>
  <text x="690" y="214.542056074767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Shuffle</text>

  <line x1="805" y1="148.411214953272" x2="840" y2="148.411214953272" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="850" y="40" width="220" height="216.822429906542" rx="8.32965650973" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="83.364485981308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--info-text)">Catalyst</text>
  <text x="960" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">Logical plan</text>
  <text x="960" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">Optimized</text>
  <text x="960" y="185.271028037384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">Physical</text>
  <text x="960" y="214.542056074767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">Codegen</text>

  <line x1="1075" y1="148.411214953272" x2="1110" y2="148.411214953272" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1120" y="40" width="120" height="216.822429906542" rx="8.32965650973" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1180" y="83.364485981308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--danger-text)">Action</text>
  <text x="1180" y="126.728971962617" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">show</text>
  <text x="1180" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">collect</text>
  <text x="1180" y="185.271028037384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">write</text>
  <text x="1180" y="214.542056074767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--danger-text)">count</text>

  <rect x="40" y="294.766355140187" width="1200" height="119.252336448599" rx="8.32965650973" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="332.710280373831" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--text)">Lazy Evaluation</text>
  <text x="640" y="368.485981308412" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" fill="var(--text-muted)">Actions trigger the plan</text>
  <text x="640" y="396.672897196262" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" fill="var(--text-muted)">Catalyst reorders and prunes</text>

  <rect x="40" y="435.700934579439" width="380" height="184.299065420561" rx="8.32965650973" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="479.065420560748" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--primary-text)">Narrow</text>
  <text x="230" y="517.009345794392" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" fill="var(--primary-text)">select, filter</text>
  <text x="230" y="549.532710280374" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" fill="var(--primary-text)">No shuffle</text>

  <rect x="440" y="435.700934579439" width="380" height="184.299065420561" rx="8.32965650973" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="479.065420560748" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--warn-text)">Wide</text>
  <text x="630" y="517.009345794392" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" fill="var(--warn-text)">groupBy, join</text>
  <text x="630" y="549.532710280374" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" fill="var(--warn-text)">Shuffle across cluster</text>

  <rect x="840" y="435.700934579439" width="400" height="184.299065420561" rx="8.32965650973" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="479.065420560748" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.824141274326" font-weight="bold" fill="var(--info-text)">Actions</text>
  <text x="1040" y="517.009345794392" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" fill="var(--info-text)">Materialize results</text>
  <text x="1040" y="549.532710280374" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" fill="var(--info-text)">Cache to avoid recompute</text>
</svg>

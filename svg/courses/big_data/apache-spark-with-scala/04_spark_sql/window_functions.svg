<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="390" height="318.431372549019" rx="8.531372323694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--primary-text)">Ranking</text>
  <text x="235" y="125.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">row_number — unique</text>
  <text x="235" y="159.411764705883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">rank — ties, gaps</text>
  <text x="235" y="193.529411764707" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">dense_rank — no gaps</text>
  <text x="235" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">percent_rank</text>
  <text x="235" y="261.764705882353" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--primary-text)">ntile(n) — buckets</text>

  <rect x="445" y="40" width="390" height="318.431372549019" rx="8.531372323694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--ok-text)">Aggregate</text>
  <text x="640" y="125.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">sum, avg, min, max, count</text>
  <text x="640" y="159.411764705883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--ok-text)">over a frame, kept per row</text>
  <text x="640" y="210.588235294117" text-anchor="middle" font-family="Courier New, monospace" font-size="12.797058485541" fill="var(--ok-text)">Window.partitionBy("store")</text>
  <text x="640" y="239.019607843138" text-anchor="middle" font-family="Courier New, monospace" font-size="12.797058485541" fill="var(--ok-text)">.orderBy("date")</text>
  <text x="640" y="267.450980392157" text-anchor="middle" font-family="Courier New, monospace" font-size="12.797058485541" fill="var(--ok-text)">.rowsBetween(-6, 0)</text>

  <rect x="850" y="40" width="390" height="318.431372549019" rx="8.531372323694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="79.803921568628" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--warn-text)">Analytic / Offset</text>
  <text x="1045" y="125.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">lag — prior row</text>
  <text x="1045" y="159.411764705883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">lead — next row</text>
  <text x="1045" y="193.529411764707" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">first_value, last_value</text>
  <text x="1045" y="227.647058823529" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026002" fill="var(--warn-text)">nth_value, cume_dist</text>

  <rect x="40" y="392.549019607843" width="1200" height="227.450980392157" rx="8.531372323694" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="432.352941176471" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--text)">Window Spec</text>
  <text x="80" y="477.843137254902" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text-muted)">partitionBy — group rows</text>
  <text x="80" y="511.960784313726" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text-muted)">orderBy — row order</text>
  <text x="80" y="546.078431372549" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text-muted)">rowsBetween — physical frame</text>
  <text x="80" y="580.196078431372" font-family="Courier New, monospace" font-size="14.929901566464" fill="var(--text-muted)">rangeBetween — logical frame</text>
  <text x="700" y="494.901960784314" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Rows keep all columns.</text>
  <text x="700" y="529.019607843138" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">Unlike groupBy, none collapse.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2901" font-weight="bold" fill="var(--text)">Window Functions</text>

  <text x="640" y="75.9292" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" fill="var(--text-muted)">Compute per-row values using a window of related rows, without collapsing the row itself.</text>

  <rect x="40" y="101.5929" width="390" height="287.4336" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="137.5221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.211" font-weight="bold" fill="var(--primary-text)">Ranking</text>
  <text x="235" y="168.3186" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--primary-text)">row_number()</text>
  <text x="235" y="186.7965" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">1, 2, 3, 4 — unique per partition</text>
  <text x="235" y="214.5133" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--primary-text)">rank()</text>
  <text x="235" y="232.9912" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">1, 2, 2, 4 — ties share rank, gaps</text>
  <text x="235" y="260.708" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--primary-text)">dense_rank()</text>
  <text x="235" y="279.1858" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">1, 2, 2, 3 — no gaps</text>
  <text x="235" y="306.9027" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--primary-text)">percent_rank()</text>
  <text x="235" y="325.3805" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">relative rank in [0, 1]</text>
  <text x="235" y="353.0973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--primary-text)">ntile(4)</text>
  <text x="235" y="371.5752" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--primary-text)">bucket into quartiles</text>

  <rect x="445" y="101.5929" width="390" height="287.4336" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="137.5221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.211" font-weight="bold" fill="var(--ok-text)">Aggregate (over window)</text>
  <text x="640" y="168.3186" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--ok-text)">sum, avg, min, max, count</text>
  <text x="640" y="188.8496" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">computed over the frame but kept per row</text>
  <text x="640" y="229.9115" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--ok-text)">Example — running 7-day sum of sales:</text>
  <text x="640" y="258.6549" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">val w = Window.partitionBy("store")</text>
  <text x="640" y="279.1858" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">   .orderBy("date")</text>
  <text x="640" y="299.7168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">   .rowsBetween(-6, 0)</text>
  <text x="640" y="327.4336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--ok-text)">df.withColumn("sales7d", sum("amount").over(w))</text>

  <rect x="850" y="101.5929" width="390" height="287.4336" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="137.5221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.211" font-weight="bold" fill="var(--warn-text)">Analytic / Offset</text>
  <text x="1045" y="168.3186" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--warn-text)">lag(col, n)</text>
  <text x="1045" y="186.7965" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--warn-text)">value n rows before current (history)</text>
  <text x="1045" y="214.5133" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--warn-text)">lead(col, n)</text>
  <text x="1045" y="232.9912" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--warn-text)">value n rows after current (future)</text>
  <text x="1045" y="260.708" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--warn-text)">first_value / last_value</text>
  <text x="1045" y="279.1858" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--warn-text)">first/last row in the frame</text>
  <text x="1045" y="306.9027" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--warn-text)">nth_value(col, k)</text>
  <text x="1045" y="325.3805" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--warn-text)">cume_dist()</text>
  <text x="1045" y="353.0973" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1582" fill="var(--warn-text)">Use lag for diffs: amount - lag(amount)</text>

  <rect x="40" y="414.6903" width="1200" height="205.3097" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="450.6195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.211" font-weight="bold" fill="var(--text)">Anatomy of a window spec</text>
  <text x="80" y="484.4956" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">Window.partitionBy(cols)   — rows with the same values get grouped (a separate window per group)</text>
  <text x="80" y="507.0796" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">      .orderBy(cols)        — defines row order inside the window (required for rank / lag / lead)</text>
  <text x="80" y="529.6637" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">      .rowsBetween(a, b)    — physical frame: a, b are row offsets (Window.unboundedPreceding, Window.currentRow)</text>
  <text x="80" y="552.2478" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">      .rangeBetween(a, b)   — logical frame: a, b are value offsets on the order column (e.g. 7 days)</text>
  <text x="80" y="585.0973" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">Each row keeps all its original columns AND gets the window-computed values. Unlike groupBy, no rows collapse.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">spark.ml — DataFrame-based ML Pipeline API</text>
  <text x="640" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Transformers, Estimators, and Pipelines compose the workflow</text>

  <line x1="640" y1="130" x2="640" y2="178" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="180" width="1200" height="180" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Pipeline Stages</text>
  <rect x="70" y="240" width="270" height="100" rx="6" fill="var(--info-accent)"/>
  <text x="205" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Featurizers</text>
  <text x="205" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Tokenizer, HashingTF</text>
  <text x="205" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">StringIndexer, Scaler</text>
  <rect x="360" y="240" width="270" height="100" rx="6" fill="var(--info-accent)"/>
  <text x="495" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Estimators</text>
  <text x="495" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">LogisticRegression</text>
  <text x="495" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">RandomForest, ALS</text>
  <rect x="650" y="240" width="270" height="100" rx="6" fill="var(--info-accent)"/>
  <text x="785" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Evaluators</text>
  <text x="785" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">AUC, RMSE, F1</text>
  <text x="785" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">CrossValidator</text>
  <rect x="940" y="240" width="270" height="100" rx="6" fill="var(--info-accent)"/>
  <text x="1075" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Persistence</text>
  <text x="1075" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">save / load models</text>
  <text x="1075" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">PMML export</text>

  <line x1="640" y1="360" x2="640" y2="408" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="410" width="1200" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Spark SQL / DataFrame Engine</text>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Catalyst optimizer and Tungsten execution plan the work</text>
  <text x="640" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">columnar in-memory format, code generation, predicate pushdown</text>

  <line x1="640" y1="520" x2="640" y2="568" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="570" width="1200" height="50" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Cluster: driver schedules tasks across executors on workers</text>
</svg>

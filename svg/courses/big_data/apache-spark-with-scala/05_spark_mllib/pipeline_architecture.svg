<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0;
        --text: #212121; --text-muted: #555555; --text-faint: #888888;
        --code-bg: #1a1a2e; --shadow: #00000022; --black: #000000;
        --primary-fill: #2196f3; --primary-border: #1565c0; --primary-text: #ffffff; --primary-accent: #0d47a1;
        --ok-fill: #4caf50; --ok-border: #2e7d32; --ok-text: #ffffff; --ok-accent: #1b5e20;
        --warn-fill: #ff9800; --warn-border: #e65100; --warn-text: #ffffff; --warn-accent: #bf360c;
        --danger-fill: #e74c3c; --danger-border: #c62828; --danger-text: #ffffff; --danger-accent: #b71c1c;
        --info-fill: #9c27b0; --info-border: #6a1b9a; --info-text: #ffffff; --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.945762" font-weight="bold" fill="var(--text)">ML Pipeline Architecture</text>

  <rect x="40" y="82.962963" width="220" height="214.814815" rx="6.218253" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--primary-text)">Raw Data</text>
  <text x="150" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--primary-text)">DataFrame input</text>
  <text x="150" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--primary-text)">Schema typed</text>

  <rect x="300" y="82.962963" width="220" height="214.814815" rx="6.218253" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--ok-text)">Transformer</text>
  <text x="410" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--ok-text)">Tokenize, scale</text>
  <text x="410" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--ok-text)">Add columns</text>

  <rect x="560" y="82.962963" width="220" height="214.814815" rx="6.218253" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--warn-text)">Estimator</text>
  <text x="670" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--warn-text)">fit() learns</text>
  <text x="670" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--warn-text)">Returns Model</text>

  <rect x="820" y="82.962963" width="220" height="214.814815" rx="6.218253" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--info-text)">Model</text>
  <text x="930" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--info-text)">transform()</text>
  <text x="930" y="244.074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--info-text)">Adds prediction</text>

  <rect x="1080" y="82.962963" width="160" height="214.814815" rx="6.218253" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="147.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509" font-weight="bold" fill="var(--danger-text)">Output</text>
  <text x="1160" y="201.111111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545632" fill="var(--danger-text)">Scored DF</text>

  <line x1="260" y1="190.37037" x2="298" y2="190.37037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="190.37037" x2="558" y2="190.37037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="190.37037" x2="818" y2="190.37037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1040" y1="190.37037" x2="1078" y2="190.37037" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="1200" height="290" rx="6.218253" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="383.703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--text)">Pipeline Benefits</text>
  <text x="640" y="437.407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--text-muted)">Stages chained and fit together</text>
  <text x="640" y="480.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--text-muted)">Reproducible train and serve</text>
  <text x="640" y="523.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--text-muted)">Works with CrossValidator</text>
  <text x="640" y="566.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--text-muted)">Save and load whole pipeline</text>
</svg>

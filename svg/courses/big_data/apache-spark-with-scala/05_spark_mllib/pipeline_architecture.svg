<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="220" height="232.000000216" rx="6.462198078413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="109.5999995248" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659222147" font-weight="bold" fill="var(--primary-text)">Raw Data</text>
  <text x="150" y="167.5999998488" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" fill="var(--primary-text)">DataFrame input</text>
  <text x="150" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" fill="var(--primary-text)">Schema typed</text>

  <rect x="300" y="40" width="220" height="232.000000216" rx="6.462198078413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="109.5999995248" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659222147" font-weight="bold" fill="var(--ok-text)">Transformer</text>
  <text x="410" y="167.5999998488" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" fill="var(--ok-text)">Tokenize, scale</text>
  <text x="410" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" fill="var(--ok-text)">Add columns</text>

  <rect x="560" y="40" width="220" height="232.000000216" rx="6.462198078413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="109.5999995248" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659222147" font-weight="bold" fill="var(--warn-text)">Estimator</text>
  <text x="670" y="167.5999998488" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" fill="var(--warn-text)">fit() learns</text>
  <text x="670" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" fill="var(--warn-text)">Returns Model</text>

  <rect x="820" y="40" width="220" height="232.000000216" rx="6.462198078413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="109.5999995248" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659222147" font-weight="bold" fill="var(--info-text)">Model</text>
  <text x="930" y="167.5999998488" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" fill="var(--info-text)">transform()</text>
  <text x="930" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" fill="var(--info-text)">Adds prediction</text>

  <rect x="1080" y="40" width="160" height="232.000000216" rx="6.462198078413" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="109.5999995248" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659222147" font-weight="bold" fill="var(--danger-text)">Output</text>
  <text x="1160" y="167.5999998488" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494676418" fill="var(--danger-text)">Scored DF</text>

  <line x1="260" y1="155.999999568" x2="298" y2="155.999999568" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="520" y1="155.999999568" x2="558" y2="155.999999568" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="780" y1="155.999999568" x2="818" y2="155.999999568" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="1040" y1="155.999999568" x2="1078" y2="155.999999568" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="306.7999999784" width="1200" height="313.2000000216" rx="6.462198078413" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="364.8000003024" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--text)">Pipeline Benefits</text>
  <text x="640" y="422.7999995464" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Stages chained and fit together</text>
  <text x="640" y="469.1999995896" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Reproducible train and serve</text>
  <text x="640" y="515.5999996328" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Works with CrossValidator</text>
  <text x="640" y="561.999999676" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Save and load whole pipeline</text>
</svg>

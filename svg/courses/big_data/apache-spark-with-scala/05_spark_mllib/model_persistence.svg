<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.945762" font-weight="bold" fill="var(--text)">Model Persistence</text>

  <rect x="40" y="82.962963" width="380" height="257.777778" rx="6.218253" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="136.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--primary-text)">save()</text>
  <text x="230" y="190.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--primary-text)">Writes model dir</text>
  <text x="230" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--primary-text)">Parquet metadata</text>
  <text x="230" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--primary-text)">HDFS or S3 path</text>

  <rect x="450" y="82.962963" width="380" height="257.777778" rx="6.218253" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="136.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--ok-text)">load()</text>
  <text x="640" y="190.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">Restore pipeline</text>
  <text x="640" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">Same Spark version</text>
  <text x="640" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--ok-text)">Apply to new data</text>

  <rect x="860" y="82.962963" width="380" height="257.777778" rx="6.218253" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="136.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--warn-text)">Versioning</text>
  <text x="1050" y="190.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--warn-text)">Timestamp paths</text>
  <text x="1050" y="233.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--warn-text)">Immutable releases</text>
  <text x="1050" y="276.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--warn-text)">Keep old for rollback</text>

  <rect x="40" y="372.962963" width="590" height="247.037037" rx="6.218253" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="426.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--info-text)">MLflow</text>
  <text x="335" y="480.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--info-text)">Registry tracking</text>
  <text x="335" y="523.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--info-text)">Stage transitions</text>
  <text x="335" y="566.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--info-text)">Audit lineage</text>

  <rect x="650" y="372.962963" width="590" height="247.037037" rx="6.218253" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="426.666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.80026" font-weight="bold" fill="var(--danger-text)">Export Formats</text>
  <text x="945" y="480.37037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--danger-text)">MLeap bundle</text>
  <text x="945" y="523.333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--danger-text)">ONNX interop</text>
  <text x="945" y="566.296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007" fill="var(--danger-text)">PMML legacy</text>
</svg>

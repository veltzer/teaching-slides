<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2901" font-weight="bold" fill="var(--text)">Feature Engineering Flow</text>

  <rect x="40" y="81.0619" width="180" height="123.1858" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="130" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--primary-text)">Raw DataFrame</text>
  <text x="130" y="142.6549" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--primary-text)">text, numbers,</text>
  <text x="130" y="160.1062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--primary-text)">categoricals, dates</text>
  <text x="130" y="183.7168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--primary-text)">possibly nulls</text>

  <line x1="220" y1="142.6549" x2="258" y2="142.6549" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="81.0619" width="200" height="123.1858" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="360" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--ok-text)">Clean / Impute</text>
  <text x="360" y="142.6549" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--ok-text)">Imputer (mean/median)</text>
  <text x="360" y="160.1062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--ok-text)">drop / replace outliers</text>
  <text x="360" y="183.7168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--ok-text)">typecast with spark.sql</text>

  <line x1="460" y1="142.6549" x2="498" y2="142.6549" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="81.0619" width="220" height="123.1858" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="610" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--warn-text)">Encode categoricals</text>
  <text x="610" y="142.6549" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--warn-text)">StringIndexer</text>
  <text x="610" y="160.1062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--warn-text)">OneHotEncoder</text>
  <text x="610" y="183.7168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--warn-text)">FeatureHasher for high cardinality</text>

  <line x1="720" y1="142.6549" x2="758" y2="142.6549" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="760" y="81.0619" width="200" height="123.1858" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="860" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--info-text)">Transform text</text>
  <text x="860" y="142.6549" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--info-text)">Tokenizer → Stopwords</text>
  <text x="860" y="160.1062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--info-text)">HashingTF → IDF</text>
  <text x="860" y="183.7168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--info-text)">or Word2Vec</text>

  <line x1="960" y1="142.6549" x2="998" y2="142.6549" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1000" y="81.0619" width="240" height="123.1858" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1120" y="111.8584" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--danger-text)">Scale numerics</text>
  <text x="1120" y="142.6549" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--danger-text)">StandardScaler (z-score)</text>
  <text x="1120" y="160.1062" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--danger-text)">MinMaxScaler [0, 1]</text>
  <text x="1120" y="183.7168" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--danger-text)">Normalizer (per-row L2)</text>

  <rect x="150" y="270.9735" width="320" height="102.6549" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="310" y="301.7699" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--info-text)">Derive / interact</text>
  <text x="310" y="327.4336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--info-text)">Bucketizer, QuantileDiscretizer</text>
  <text x="310" y="347.9646" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--info-text)">PolynomialExpansion</text>
  <text x="310" y="365.4159" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--info-text)">Interaction, SQLTransformer</text>

  <rect x="500" y="270.9735" width="320" height="102.6549" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="660" y="301.7699" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--ok-text)">Select / reduce</text>
  <text x="660" y="327.4336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--ok-text)">ChiSqSelector (categorical vs label)</text>
  <text x="660" y="347.9646" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--ok-text)">VectorSlicer (keep columns)</text>
  <text x="660" y="365.4159" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--ok-text)">PCA / SVD (dim reduction)</text>

  <rect x="850" y="270.9735" width="320" height="102.6549" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1010" y="301.7699" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1846" font-weight="bold" fill="var(--primary-text)">Assemble</text>
  <text x="1010" y="327.4336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--primary-text)">VectorAssembler combines</text>
  <text x="1010" y="347.9646" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--primary-text)">all feature columns into one</text>
  <text x="1010" y="365.4159" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.1451" fill="var(--primary-text)">"features" Vector column</text>

  <rect x="40" y="404.4248" width="1200" height="215.5752" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="440.354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.211" font-weight="bold" fill="var(--text)">Put it all in a Pipeline</text>
  <text x="80" y="474.2301" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">Encode every step as a Pipeline stage. The Pipeline fits once (producing a PipelineModel), then transforms both</text>
  <text x="80" y="496.8142" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">train and test data identically — no skew between training and serving.</text>
  <text x="80" y="527.6106" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">val pipeline = new Pipeline().setStages(Array(imputer, indexer, encoder, assembler, scaler, lr))</text>
  <text x="80" y="553.2743" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">val model = pipeline.fit(trainDF)</text>
  <text x="80" y="584.0708" font-family="Arial, sans-serif" font-size="13.1714" fill="var(--text-muted)">model.transform(testDF)   // applies every step plus prediction in one pass</text>
</svg>

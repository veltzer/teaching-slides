<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="280" height="232.000000216" rx="6.462198078413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="109.5999995248" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--primary-text)">Train</text>
  <text x="180" y="167.5999998488" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">Fit pipeline</text>
  <text x="180" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">Cross validate</text>

  <rect x="360" y="40" width="280" height="232.000000216" rx="6.462198078413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="109.5999995248" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--ok-text)">Validate</text>
  <text x="500" y="167.5999998488" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Holdout metrics</text>
  <text x="500" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Drift checks</text>

  <rect x="680" y="40" width="280" height="232.000000216" rx="6.462198078413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="109.5999995248" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--warn-text)">Package</text>
  <text x="820" y="167.5999998488" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">Save model dir</text>
  <text x="820" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">Tag version</text>

  <rect x="1000" y="40" width="240" height="232.000000216" rx="6.462198078413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="109.5999995248" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--info-text)">Deploy</text>
  <text x="1120" y="167.5999998488" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">Batch or API</text>
  <text x="1120" y="213.999999892" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">Canary first</text>

  <line x1="320" y1="155.999999568" x2="358" y2="155.999999568" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="155.999999568" x2="678" y2="155.999999568" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="155.999999568" x2="998" y2="155.999999568" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="306.7999999784" width="590" height="313.2000000216" rx="6.462198078413" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="335" y="364.8000003024" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--text)">Serving Modes</text>
  <text x="335" y="422.7999995464" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Batch scoring on Spark</text>
  <text x="335" y="469.1999995896" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Structured streaming scoring</text>
  <text x="335" y="515.5999996328" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">MLeap export for low latency</text>
  <text x="335" y="561.999999676" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">ONNX for polyglot runtime</text>

  <rect x="650" y="306.7999999784" width="590" height="313.2000000216" rx="6.462198078413" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="364.8000003024" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--danger-text)">Observability</text>
  <text x="945" y="422.7999995464" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Log predictions</text>
  <text x="945" y="469.1999995896" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Monitor drift</text>
  <text x="945" y="515.5999996328" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Track latency</text>
  <text x="945" y="561.999999676" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Roll back fast</text>
</svg>

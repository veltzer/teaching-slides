<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.748354" font-weight="bold" fill="var(--text)">Feature Transformations</text>

  <rect x="40" y="69.635036" width="290" height="254.014599" rx="6.172697" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--primary-text)">Text</text>
  <text x="185" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Tokenizer</text>
  <text x="185" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">StopWordsRemover</text>
  <text x="185" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">NGram</text>
  <text x="185" y="223.10219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">HashingTF</text>
  <text x="185" y="249.562044" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">IDF</text>
  <text x="185" y="276.021898" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Word2Vec</text>
  <text x="185" y="302.481752" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">CountVectorizer</text>

  <rect x="340" y="69.635036" width="290" height="254.014599" rx="6.172697" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--ok-text)">Categorical</text>
  <text x="485" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">StringIndexer</text>
  <text x="485" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">IndexToString</text>
  <text x="485" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">OneHotEncoder</text>
  <text x="485" y="223.10219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">VectorIndexer</text>
  <text x="485" y="249.562044" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Bucketizer</text>
  <text x="485" y="276.021898" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">QuantileDiscretizer</text>
  <text x="485" y="302.481752" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">handle unknown labels</text>

  <rect x="640" y="69.635036" width="290" height="254.014599" rx="6.172697" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--warn-text)">Numeric</text>
  <text x="785" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">StandardScaler</text>
  <text x="785" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">MinMaxScaler</text>
  <text x="785" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">MaxAbsScaler</text>
  <text x="785" y="223.10219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Normalizer</text>
  <text x="785" y="249.562044" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">PolynomialExpansion</text>
  <text x="785" y="276.021898" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Binarizer</text>
  <text x="785" y="302.481752" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">ElementwiseProduct</text>

  <rect x="940" y="69.635036" width="300" height="254.014599" rx="6.172697" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--info-text)">Vectors</text>
  <text x="1090" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">VectorAssembler</text>
  <text x="1090" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">VectorSlicer</text>
  <text x="1090" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">VectorSizeHint</text>
  <text x="1090" y="223.10219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">PCA reduce dims</text>
  <text x="1090" y="249.562044" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">ChiSqSelector</text>
  <text x="1090" y="276.021898" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Imputer fill NaN</text>
  <text x="1090" y="302.481752" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">SQLTransformer</text>

  <rect x="40" y="344.817518" width="1200" height="84.671533" rx="6.172697" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="381.861314" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--text)">Transformer Types</text>
  <text x="640" y="413.613139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--text-muted)">Transformer: stateless, has .transform(df). Estimator: learns, has .fit(df) returning a Model.</text>

  <rect x="40" y="450.656934" width="380" height="169.343066" rx="6.172697" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="230" y="487.70073" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--primary-text)">Pipeline Stages</text>
  <text x="230" y="519.452555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Chain transforms in order</text>
  <text x="230" y="545.912409" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Raw columns, output columns</text>
  <text x="230" y="572.372263" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">fit() once, transform() many</text>
  <text x="230" y="598.832117" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Same pipeline train and serve</text>

  <rect x="440" y="450.656934" width="380" height="169.343066" rx="6.172697" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="630" y="487.70073" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--ok-text)">Always Last</text>
  <text x="630" y="519.452555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">VectorAssembler combines</text>
  <text x="630" y="545.912409" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Into a single features col</text>
  <text x="630" y="572.372263" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">ML estimators expect it</text>
  <text x="630" y="598.832117" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Label column stays separate</text>

  <rect x="840" y="450.656934" width="400" height="169.343066" rx="6.172697" fill="var(--info-accent)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1040" y="487.70073" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--info-text)">Caveats</text>
  <text x="1040" y="519.452555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Fit scalers on training only</text>
  <text x="1040" y="545.912409" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Handle unseen categories</text>
  <text x="1040" y="572.372263" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Sparse vectors save memory</text>
  <text x="1040" y="598.832117" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Leakage kills test accuracy</text>
</svg>

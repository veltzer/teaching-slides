<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0954" font-weight="bold" fill="var(--text)">K-Fold Cross-Validation (k=5)</text>

  <text x="640" y="75.3043" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0607" fill="var(--text-muted)">Split the training set into k folds. Train on k-1, evaluate on the held-out one. Repeat k times, average the scores.</text>

  <!-- Fold 1 -->
  <rect x="40" y="100.5217" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="135.8261" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 1</text>
  <rect x="140" y="110.6087" width="200" height="40.3478" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="135.8261" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>
  <rect x="350" y="110.6087" width="880" height="40.3478" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="135.8261" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>

  <!-- Fold 2 -->
  <rect x="40" y="171.1304" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="206.4348" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 2</text>
  <rect x="140" y="181.2174" width="200" height="40.3478" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="206.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>
  <rect x="350" y="181.2174" width="200" height="40.3478" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="206.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>
  <rect x="560" y="181.2174" width="670" height="40.3478" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="895" y="206.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>

  <!-- Fold 3 -->
  <rect x="40" y="241.7391" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="277.0435" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 3</text>
  <rect x="140" y="251.8261" width="410" height="40.3478" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="345" y="277.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>
  <rect x="560" y="251.8261" width="200" height="40.3478" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="277.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>
  <rect x="770" y="251.8261" width="460" height="40.3478" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="277.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>

  <!-- Fold 4 -->
  <rect x="40" y="312.3478" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="347.6522" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 4</text>
  <rect x="140" y="322.4348" width="620" height="40.3478" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="347.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>
  <rect x="770" y="322.4348" width="200" height="40.3478" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="347.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>
  <rect x="980" y="322.4348" width="250" height="40.3478" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="347.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>

  <!-- Fold 5 -->
  <rect x="40" y="382.9565" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="418.2609" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 5</text>
  <rect x="140" y="393.0435" width="830" height="40.3478" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="418.2609" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>
  <rect x="980" y="393.0435" width="250" height="40.3478" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="418.2609" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>

  <rect x="40" y="463.6522" width="1200" height="156.3478" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="498.9565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0694" font-weight="bold" fill="var(--info-text)">CrossValidator in MLlib</text>
  <text x="80" y="529.2174" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--info-text)">val paramGrid = new ParamGridBuilder().addGrid(lr.regParam, Array(0.01, 0.1, 1.0)).build()</text>
  <text x="80" y="552.4174" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--info-text)">val cv = new CrossValidator().setEstimator(pipeline).setEstimatorParamMaps(paramGrid)</text>
  <text x="80" y="572.5913" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--info-text)">  .setEvaluator(new BinaryClassificationEvaluator()).setNumFolds(5)</text>
  <text x="80" y="602.8522" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--info-text)">val best = cv.fit(trainDF)    // runs 5 × |paramGrid| jobs in parallel; best.bestModel is the winner</text>
</svg>

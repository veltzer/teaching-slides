<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0954" font-weight="bold" fill="var(--text)">K-Fold Cross-Validation (k=5)</text>

  <text x="640" y="75.3043" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0607" fill="var(--text-muted)">Split the training set into k folds. Train on k-1, evaluate on the held-out one. Repeat k times, average the scores.</text>

  <!-- Fold 1 -->
  <rect x="40" y="100.5217" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="135.8261" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 1</text>
  <rect x="140" y="110.6087" width="200" height="40.3478" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="135.8261" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>
  <rect x="350" y="110.6087" width="880" height="40.3478" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="135.8261" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>

  <!-- Fold 2 -->
  <rect x="40" y="171.1304" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="206.4348" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 2</text>
  <rect x="140" y="181.2174" width="200" height="40.3478" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="206.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>
  <rect x="350" y="181.2174" width="200" height="40.3478" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="206.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>
  <rect x="560" y="181.2174" width="670" height="40.3478" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="895" y="206.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>

  <!-- Fold 3 -->
  <rect x="40" y="241.7391" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="277.0435" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 3</text>
  <rect x="140" y="251.8261" width="410" height="40.3478" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="345" y="277.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>
  <rect x="560" y="251.8261" width="200" height="40.3478" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="277.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>
  <rect x="770" y="251.8261" width="460" height="40.3478" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1000" y="277.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>

  <!-- Fold 4 -->
  <rect x="40" y="312.3478" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="347.6522" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 4</text>
  <rect x="140" y="322.4348" width="620" height="40.3478" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="347.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>
  <rect x="770" y="322.4348" width="200" height="40.3478" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="347.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>
  <rect x="980" y="322.4348" width="250" height="40.3478" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="347.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>

  <!-- Fold 5 -->
  <rect x="40" y="382.9565" width="1200" height="60.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="70" y="418.2609" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--text)">Fold 5</text>
  <rect x="140" y="393.0435" width="830" height="40.3478" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="418.2609" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--ok-text)">train</text>
  <rect x="980" y="393.0435" width="250" height="40.3478" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105" y="418.2609" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.0521" font-weight="bold" fill="var(--danger-text)">test</text>

  <rect x="40" y="463.6522" width="1200" height="156.3478" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="498.9565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0694" font-weight="bold" fill="var(--info-text)">CrossValidator in MLlib</text>
  <text x="80" y="529.2174" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--info-text)">val paramGrid = new ParamGridBuilder().addGrid(lr.regParam, Array(0.01, 0.1, 1.0)).build()</text>
  <text x="80" y="552.4174" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--info-text)">val cv = new CrossValidator().setEstimator(pipeline).setEstimatorParamMaps(paramGrid)</text>
  <text x="80" y="572.5913" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--info-text)">  .setEvaluator(new BinaryClassificationEvaluator()).setNumFolds(5)</text>
  <text x="80" y="602.8522" font-family="Arial, sans-serif" font-size="13.0564" fill="var(--info-text)">val best = cv.fit(trainDF)    // runs 5 × |paramGrid| jobs in parallel; best.bestModel is the winner</text>
</svg>

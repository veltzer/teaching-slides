<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Raw DataFrame -->
  <rect x="40" y="40" width="200" height="165.714221224496" rx="6.374054245598" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="98.000101571419" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309559931615" font-weight="bold" fill="var(--primary-text)">Raw DataFrame</text>
  <text x="140" y="139.428600448977" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.447626698444" fill="var(--primary-text)">text, numbers,</text>
  <text x="140" y="172.571467265302" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.447626698444" fill="var(--primary-text)">categoricals</text>

  <line x1="240" y1="122.85722346938" x2="278" y2="122.85722346938" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Transformer -->
  <rect x="280" y="40" width="220" height="165.714221224496" rx="6.374054245598" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="98.000101571419" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309559931615" font-weight="bold" fill="var(--ok-text)">Transformer</text>
  <text x="390" y="139.428600448977" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.447626698444" fill="var(--ok-text)">df → df' (transform)</text>
  <text x="390" y="172.571467265302" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.160280209308" fill="var(--ok-text)">Tokenizer, VectorAssembler</text>

  <line x1="500" y1="122.85722346938" x2="538" y2="122.85722346938" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Estimator -->
  <rect x="540" y="40" width="220" height="165.714221224496" rx="6.374054245598" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="98.000101571419" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309559931615" font-weight="bold" fill="var(--warn-text)">Estimator</text>
  <text x="650" y="139.428600448977" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.447626698444" fill="var(--warn-text)">df → Model (fit)</text>
  <text x="650" y="172.571467265302" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.160280209308" fill="var(--warn-text)">LogisticRegression, ALS</text>

  <line x1="760" y1="122.85722346938" x2="798" y2="122.85722346938" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Model -->
  <rect x="800" y="40" width="220" height="165.714221224496" rx="6.374054245598" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="98.000101571419" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309559931615" font-weight="bold" fill="var(--info-text)">Model (a Transformer)</text>
  <text x="910" y="139.428600448977" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.447626698444" fill="var(--info-text)">df → predictions</text>
  <text x="910" y="172.571467265302" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.160280209308" fill="var(--info-text)">fitted parameters baked in</text>

  <line x1="1020" y1="122.85722346938" x2="1058" y2="122.85722346938" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Evaluator -->
  <rect x="1060" y="40" width="180" height="165.714221224496" rx="6.374054245598" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="98.000101571419" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.309559931615" font-weight="bold" fill="var(--danger-text)">Evaluator</text>
  <text x="1150" y="139.428600448977" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.447626698444" fill="var(--danger-text)">metric(df) → Double</text>
  <text x="1150" y="172.571467265302" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.160280209308" fill="var(--danger-text)">AUC, RMSE, F1</text>

  <!-- Pipeline example -->
  <rect x="40" y="255.42857787755" width="1200" height="364.57142212245" rx="6.374054245598" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="313.428566591837" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.171386930548" font-weight="bold" fill="var(--text)">A pipeline is a sequence of stages</text>

  <rect x="90" y="371.428555306124" width="160" height="115.999977428574" rx="6.374054245598" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="421.142911959178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.734866953343" font-weight="bold" fill="var(--ok-text)">Tokenizer</text>
  <text x="170" y="454.285778775504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.160280209308" fill="var(--ok-text)">text → words</text>

  <line x1="250" y1="429.428544020411" x2="288" y2="429.428544020411" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="290" y="371.428555306124" width="160" height="115.999977428574" rx="6.374054245598" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="421.142911959178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.734866953343" font-weight="bold" fill="var(--ok-text)">HashingTF</text>
  <text x="370" y="454.285778775504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.160280209308" fill="var(--ok-text)">words → features</text>

  <line x1="450" y1="429.428544020411" x2="488" y2="429.428544020411" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="490" y="371.428555306124" width="200" height="115.999977428574" rx="6.374054245598" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="421.142911959178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.734866953343" font-weight="bold" fill="var(--ok-text)">VectorAssembler</text>
  <text x="590" y="454.285778775504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.160280209308" fill="var(--ok-text)">combine columns</text>

  <line x1="690" y1="429.428544020411" x2="728" y2="429.428544020411" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="730" y="371.428555306124" width="220" height="115.999977428574" rx="6.374054245598" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="421.142911959178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.734866953343" font-weight="bold" fill="var(--warn-text)">LogisticRegression</text>
  <text x="840" y="454.285778775504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.160280209308" fill="var(--warn-text)">Estimator: fit</text>

  <line x1="950" y1="429.428544020411" x2="988" y2="429.428544020411" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="990" y="371.428555306124" width="200" height="115.999977428574" rx="6.374054245598" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="421.142911959178" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.734866953343" font-weight="bold" fill="var(--info-text)">LRModel</text>
  <text x="1090" y="454.285778775504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.160280209308" fill="var(--info-text)">transform: predict</text>

  <text x="640" y="545.428634306116" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.734866953343" font-weight="bold" fill="var(--text)">val pipeline = new Pipeline().setStages(Array(tok, htf, assembler, lr))</text>
  <text x="640" y="583.542857787755" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.734866953343" fill="var(--text-muted)">val model = pipeline.fit(trainDF); val preds = model.transform(testDF)</text>
</svg>

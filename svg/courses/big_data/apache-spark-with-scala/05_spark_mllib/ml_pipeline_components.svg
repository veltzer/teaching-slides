<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.6586" font-weight="bold" fill="var(--text)">MLlib Pipeline Components</text>

  <!-- Raw DataFrame -->
  <rect x="40" y="106.0759" width="200" height="146.8354" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="157.4684" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1764" font-weight="bold" fill="var(--primary-text)">Raw DataFrame</text>
  <text x="140" y="194.1772" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5411" fill="var(--primary-text)">text, numbers,</text>
  <text x="140" y="223.5443" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5411" fill="var(--primary-text)">categoricals</text>

  <line x1="240" y1="179.4937" x2="278" y2="179.4937" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Transformer -->
  <rect x="280" y="106.0759" width="220" height="146.8354" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="157.4684" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1764" font-weight="bold" fill="var(--ok-text)">Transformer</text>
  <text x="390" y="194.1772" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5411" fill="var(--ok-text)">df → df' (transform)</text>
  <text x="390" y="223.5443" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3293" fill="var(--ok-text)">Tokenizer, VectorAssembler</text>

  <line x1="500" y1="179.4937" x2="538" y2="179.4937" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Estimator -->
  <rect x="540" y="106.0759" width="220" height="146.8354" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="157.4684" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1764" font-weight="bold" fill="var(--warn-text)">Estimator</text>
  <text x="650" y="194.1772" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5411" fill="var(--warn-text)">df → Model (fit)</text>
  <text x="650" y="223.5443" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3293" fill="var(--warn-text)">LogisticRegression, ALS</text>

  <line x1="760" y1="179.4937" x2="798" y2="179.4937" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Model -->
  <rect x="800" y="106.0759" width="220" height="146.8354" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="157.4684" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1764" font-weight="bold" fill="var(--info-text)">Model (a Transformer)</text>
  <text x="910" y="194.1772" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5411" fill="var(--info-text)">df → predictions</text>
  <text x="910" y="223.5443" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3293" fill="var(--info-text)">fitted parameters baked in</text>

  <line x1="1020" y1="179.4937" x2="1058" y2="179.4937" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Evaluator -->
  <rect x="1060" y="106.0759" width="180" height="146.8354" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150" y="157.4684" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1764" font-weight="bold" fill="var(--danger-text)">Evaluator</text>
  <text x="1150" y="194.1772" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5411" fill="var(--danger-text)">metric(df) → Double</text>
  <text x="1150" y="223.5443" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3293" fill="var(--danger-text)">AUC, RMSE, F1</text>

  <!-- Pipeline example -->
  <rect x="40" y="296.962" width="1200" height="323.038" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="348.3544" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8116" font-weight="bold" fill="var(--text)">A pipeline is a sequence of stages</text>

  <rect x="90" y="399.7468" width="160" height="102.7848" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="443.7975" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7528" font-weight="bold" fill="var(--ok-text)">Tokenizer</text>
  <text x="170" y="473.1646" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3293" fill="var(--ok-text)">text → words</text>

  <line x1="250" y1="451.1392" x2="288" y2="451.1392" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="399.7468" width="160" height="102.7848" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="443.7975" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7528" font-weight="bold" fill="var(--ok-text)">HashingTF</text>
  <text x="370" y="473.1646" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3293" fill="var(--ok-text)">words → features</text>

  <line x1="450" y1="451.1392" x2="488" y2="451.1392" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="490" y="399.7468" width="200" height="102.7848" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="443.7975" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7528" font-weight="bold" fill="var(--ok-text)">VectorAssembler</text>
  <text x="590" y="473.1646" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3293" fill="var(--ok-text)">combine columns</text>

  <line x1="690" y1="451.1392" x2="728" y2="451.1392" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="730" y="399.7468" width="220" height="102.7848" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="443.7975" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7528" font-weight="bold" fill="var(--warn-text)">LogisticRegression</text>
  <text x="840" y="473.1646" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3293" fill="var(--warn-text)">Estimator: fit</text>

  <line x1="950" y1="451.1392" x2="988" y2="451.1392" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="990" y="399.7468" width="200" height="102.7848" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="443.7975" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7528" font-weight="bold" fill="var(--info-text)">LRModel</text>
  <text x="1090" y="473.1646" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3293" fill="var(--info-text)">transform: predict</text>

  <text x="640" y="553.9241" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7528" font-weight="bold" fill="var(--text)">val pipeline = new Pipeline().setStages(Array(tok, htf, assembler, lr))</text>
  <text x="640" y="587.6962" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.7528" fill="var(--text-muted)">val model = pipeline.fit(trainDF); val preds = model.transform(testDF)</text>
</svg>

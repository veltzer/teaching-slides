<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.49" font-weight="bold" fill="var(--text)">Types of Machine Learning</text>

  <!-- Supervised -->
  <rect x="40" y="87.027" width="390" height="532.973" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="123.6036" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4009" font-weight="bold" fill="var(--primary-text)">Supervised</text>
  <text x="235" y="149.7297" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--primary-text)">labeled training data</text>
  <text x="235" y="170.6306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--primary-text)">learn input → output</text>

  <rect x="70" y="201.982" width="330" height="156.7568" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="233.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3118" font-weight="bold" fill="var(--primary-text)">Classification</text>
  <text x="235" y="259.4595" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--primary-text)">output is a category</text>
  <text x="235" y="290.8108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--primary-text)">spam / not-spam, digit 0-9</text>
  <text x="235" y="316.9369" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--primary-text)">LogisticRegression</text>
  <text x="235" y="335.7477" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--primary-text)">DecisionTree, RandomForest</text>

  <rect x="70" y="379.6396" width="330" height="156.7568" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="410.991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3118" font-weight="bold" fill="var(--primary-text)">Regression</text>
  <text x="235" y="437.1171" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--primary-text)">output is a number</text>
  <text x="235" y="468.4685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--primary-text)">house price, temperature</text>
  <text x="235" y="494.5946" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--primary-text)">LinearRegression</text>
  <text x="235" y="513.4054" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--primary-text)">GBTRegressor</text>

  <text x="235" y="583.4234" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--primary-text)">evaluated with AUC, RMSE, R²</text>

  <!-- Unsupervised -->
  <rect x="445" y="87.027" width="390" height="532.973" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="123.6036" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4009" font-weight="bold" fill="var(--ok-text)">Unsupervised</text>
  <text x="640" y="149.7297" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--ok-text)">no labels</text>
  <text x="640" y="170.6306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--ok-text)">find structure in the data</text>

  <rect x="475" y="201.982" width="330" height="156.7568" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="233.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3118" font-weight="bold" fill="var(--ok-text)">Clustering</text>
  <text x="640" y="259.4595" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--ok-text)">group similar rows</text>
  <text x="640" y="290.8108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--ok-text)">customer segments</text>
  <text x="640" y="316.9369" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--ok-text)">KMeans, BisectingKMeans</text>
  <text x="640" y="335.7477" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--ok-text)">GaussianMixture</text>

  <rect x="475" y="379.6396" width="330" height="156.7568" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="410.991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.3118" font-weight="bold" fill="var(--ok-text)">Dimensionality reduction</text>
  <text x="640" y="437.1171" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--ok-text)">compress features</text>
  <text x="640" y="468.4685" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--ok-text)">PCA, SVD</text>
  <text x="640" y="494.5946" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--ok-text)">useful for visualization</text>
  <text x="640" y="513.4054" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--ok-text)">and feature engineering</text>

  <text x="640" y="583.4234" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--ok-text)">evaluated with silhouette, explained variance</text>

  <!-- Recommendation / Others -->
  <rect x="850" y="87.027" width="390" height="261.2613" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="123.6036" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4009" font-weight="bold" fill="var(--warn-text)">Recommendation</text>
  <text x="1045" y="154.955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--warn-text)">predict user preference</text>
  <text x="1045" y="175.8559" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--warn-text)">from (user, item, rating)</text>
  <text x="1045" y="222.8829" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" font-weight="bold" fill="var(--warn-text)">ALS (Alternating Least Squares)</text>
  <text x="1045" y="254.2342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--warn-text)">matrix factorization into user</text>
  <text x="1045" y="273.045" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--warn-text)">and item latent feature vectors</text>
  <text x="1045" y="311.7117" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2673" fill="var(--warn-text)">handles implicit feedback too</text>

  <rect x="850" y="369.1892" width="390" height="250.8108" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="405.7658" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4009" font-weight="bold" fill="var(--info-text)">Pattern / Outlier</text>
  <text x="1045" y="437.1171" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--info-text)">frequent itemsets (FPGrowth)</text>
  <text x="1045" y="463.2432" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--info-text)">association rules</text>
  <text x="1045" y="505.045" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--info-text)">Topic modeling (LDA)</text>
  <text x="1045" y="531.1712" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--info-text)">Word2Vec embeddings</text>
  <text x="1045" y="572.973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--info-text)">Outlier detection: isolation forest,</text>
  <text x="1045" y="593.8739" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2896" fill="var(--info-text)">distance-to-cluster-center</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="600" height="278.4" rx="8.616263691416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="80.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228538" font-weight="bold" fill="var(--primary-text)">Supervised</text>
  <text x="340" y="109.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--primary-text)">labeled data, learn input to output</text>
  <text x="200" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421403" font-weight="bold" fill="var(--primary-text)">Classification</text>
  <text x="200" y="190.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--primary-text)">category output</text>
  <text x="200" y="219.799999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--primary-text)">LogisticRegression</text>
  <text x="200" y="248.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--primary-text)">RandomForest</text>
  <text x="480" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421403" font-weight="bold" fill="var(--primary-text)">Regression</text>
  <text x="480" y="190.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--primary-text)">numeric output</text>
  <text x="480" y="219.799999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--primary-text)">LinearRegression</text>
  <text x="480" y="248.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--primary-text)">GBTRegressor</text>

  <rect x="40" y="341.6" width="600" height="278.4" rx="8.616263691416" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="382.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228538" font-weight="bold" fill="var(--ok-text)">Unsupervised</text>
  <text x="340" y="411.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--ok-text)">no labels, find structure</text>
  <text x="200" y="457.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421403" font-weight="bold" fill="var(--ok-text)">Clustering</text>
  <text x="200" y="492.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--ok-text)">KMeans</text>
  <text x="200" y="521.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--ok-text)">GaussianMixture</text>
  <text x="480" y="457.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421403" font-weight="bold" fill="var(--ok-text)">Dim. Reduction</text>
  <text x="480" y="492.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--ok-text)">PCA, SVD</text>
  <text x="480" y="521.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--ok-text)">compress features</text>

  <rect x="660" y="40" width="580" height="278.4" rx="8.616263691416" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="80.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228538" font-weight="bold" fill="var(--warn-text)">Recommendation</text>
  <text x="950" y="121.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--warn-text)">predict user preference</text>
  <text x="950" y="167.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421403" font-weight="bold" fill="var(--warn-text)">ALS</text>
  <text x="950" y="202.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--warn-text)">matrix factorization</text>
  <text x="950" y="237.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--warn-text)">latent user and item vectors</text>

  <rect x="660" y="341.6" width="580" height="278.4" rx="8.616263691416" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="382.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.540659228538" font-weight="bold" fill="var(--info-text)">Patterns and Outliers</text>
  <text x="950" y="428.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--info-text)">FPGrowth, association rules</text>
  <text x="950" y="463.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--info-text)">LDA topic modeling</text>
  <text x="950" y="498.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--info-text)">Word2Vec embeddings</text>
  <text x="950" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.00142849855" fill="var(--info-text)">isolation forest outliers</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Types of Machine Learning</text>

  <!-- Supervised -->
  <rect x="40" y="90" width="390" height="510" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="235" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Supervised</text>
  <text x="235" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">labeled training data</text>
  <text x="235" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">learn input → output</text>

  <rect x="70" y="200" width="330" height="150" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="235" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Classification</text>
  <text x="235" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">output is a category</text>
  <text x="235" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">spam / not-spam, digit 0-9</text>
  <text x="235" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">LogisticRegression</text>
  <text x="235" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">DecisionTree, RandomForest</text>

  <rect x="70" y="370" width="330" height="150" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="235" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Regression</text>
  <text x="235" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">output is a number</text>
  <text x="235" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">house price, temperature</text>
  <text x="235" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">LinearRegression</text>
  <text x="235" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">GBTRegressor</text>

  <text x="235" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">evaluated with AUC, RMSE, R²</text>

  <!-- Unsupervised -->
  <rect x="445" y="90" width="390" height="510" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Unsupervised</text>
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">no labels</text>
  <text x="640" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">find structure in the data</text>

  <rect x="475" y="200" width="330" height="150" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Clustering</text>
  <text x="640" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">group similar rows</text>
  <text x="640" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">customer segments</text>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">KMeans, BisectingKMeans</text>
  <text x="640" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">GaussianMixture</text>

  <rect x="475" y="370" width="330" height="150" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Dimensionality reduction</text>
  <text x="640" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">compress features</text>
  <text x="640" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">PCA, SVD</text>
  <text x="640" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">useful for visualization</text>
  <text x="640" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">and feature engineering</text>

  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">evaluated with silhouette, explained variance</text>

  <!-- Recommendation / Others -->
  <rect x="850" y="90" width="390" height="250" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1045" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Recommendation</text>
  <text x="1045" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">predict user preference</text>
  <text x="1045" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">from (user, item, rating)</text>
  <text x="1045" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">ALS (Alternating Least Squares)</text>
  <text x="1045" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">matrix factorization into user</text>
  <text x="1045" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">and item latent feature vectors</text>
  <text x="1045" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">handles implicit feedback too</text>

  <rect x="850" y="360" width="390" height="240" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1045" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Pattern / Outlier</text>
  <text x="1045" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">frequent itemsets (FPGrowth)</text>
  <text x="1045" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">association rules</text>
  <text x="1045" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Topic modeling (LDA)</text>
  <text x="1045" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Word2Vec embeddings</text>
  <text x="1045" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Outlier detection: isolation forest,</text>
  <text x="1045" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">distance-to-cluster-center</text>
</svg>

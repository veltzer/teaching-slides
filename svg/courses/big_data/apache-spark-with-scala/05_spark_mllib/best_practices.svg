<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.748354" font-weight="bold" fill="var(--text)">MLlib Best Practices</text>

  <rect x="40" y="69.635036" width="390" height="169.343066" rx="6.172697" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="235" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--primary-text)">Use Pipelines</text>
  <text x="235" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Chain stages together</text>
  <text x="235" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Reproducible workflows</text>
  <text x="235" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Save and reload models</text>
  <text x="235" y="223.10219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Consistent transforms</text>

  <rect x="445" y="69.635036" width="390" height="169.343066" rx="6.172697" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--ok-text)">Cross-Validate</text>
  <text x="640" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">K-fold splits</text>
  <text x="640" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Tune hyperparameters</text>
  <text x="640" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Avoid overfitting</text>
  <text x="640" y="223.10219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--ok-text)">Track metrics per fold</text>

  <rect x="850" y="69.635036" width="390" height="169.343066" rx="6.172697" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1045" y="106.678832" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--warn-text)">Feature Scaling</text>
  <text x="1045" y="143.722628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">StandardScaler</text>
  <text x="1045" y="170.182482" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Handle missing values</text>
  <text x="1045" y="196.642336" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Encode categoricals</text>
  <text x="1045" y="223.10219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--warn-text)">Assemble feature vector</text>

  <rect x="40" y="260.145985" width="390" height="169.343066" rx="6.172697" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="235" y="297.189781" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--info-text)">Cache Smartly</text>
  <text x="235" y="334.233577" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Persist training data</text>
  <text x="235" y="360.693431" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Reuse across iterations</text>
  <text x="235" y="387.153285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Unpersist when done</text>
  <text x="235" y="413.613139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--info-text)">Choose MEMORY_AND_DISK</text>

  <rect x="445" y="260.145985" width="390" height="169.343066" rx="6.172697" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="297.189781" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--danger-text)">Evaluate Honestly</text>
  <text x="640" y="334.233577" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--danger-text)">Hold-out test set</text>
  <text x="640" y="360.693431" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--danger-text)">Pick metric for task</text>
  <text x="640" y="387.153285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--danger-text)">Check class balance</text>
  <text x="640" y="413.613139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--danger-text)">Compare to baseline</text>

  <rect x="850" y="260.145985" width="390" height="169.343066" rx="6.172697" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1045" y="297.189781" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.575657" font-weight="bold" fill="var(--primary-text)">Monitor in Production</text>
  <text x="1045" y="334.233577" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Log predictions</text>
  <text x="1045" y="360.693431" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Track data drift</text>
  <text x="1045" y="387.153285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Retrain on new data</text>
  <text x="1045" y="413.613139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.40296" fill="var(--primary-text)">Version everything</text>

  <rect x="40" y="450.656934" width="1200" height="169.343066" rx="6.172697" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="487.70073" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.518091" font-weight="bold" fill="var(--text)">Workflow</text>
  <text x="640" y="524.744526" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.431743" fill="var(--text-muted)">Explore data, clean it, engineer features, build a Pipeline, then tune.</text>
  <text x="640" y="556.49635" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.431743" fill="var(--text-muted)">Validate on held-out data, save the fitted PipelineModel, deploy.</text>
  <text x="640" y="593.540146" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.431743" fill="var(--text-muted)">Keep the training script deterministic: set seeds, version libraries and data.</text>
</svg>

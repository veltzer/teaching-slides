<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="380" height="278.4000002592" rx="6.462198078413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--primary-text)">Linear</text>
  <text x="230" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">Closed form</text>
  <text x="230" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">Interpretable</text>
  <text x="230" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">Baseline first</text>

  <rect x="450" y="40" width="380" height="278.4000002592" rx="6.462198078413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--ok-text)">Ridge / Lasso</text>
  <text x="640" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">L2 and L1 penalty</text>
  <text x="640" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Reduces overfitting</text>
  <text x="640" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Elastic net blend</text>

  <rect x="860" y="40" width="380" height="278.4000002592" rx="6.462198078413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--warn-text)">Decision Tree</text>
  <text x="1050" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">Non-linear splits</text>
  <text x="1050" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">No scaling</text>
  <text x="1050" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">Easy to explain</text>

  <rect x="40" y="353.2000000216" width="590" height="266.7999999784" rx="6.462198078413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="411.2000003456" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--info-text)">Random Forest</text>
  <text x="335" y="469.1999995896" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">Bagged trees</text>
  <text x="335" y="515.5999996328" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">Handles noise</text>
  <text x="335" y="561.999999676" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">Good default</text>

  <rect x="650" y="353.2000000216" width="590" height="266.7999999784" rx="6.462198078413" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="411.2000003456" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--danger-text)">GBT Regressor</text>
  <text x="945" y="469.1999995896" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Sequential boosting</text>
  <text x="945" y="515.5999996328" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Top accuracy</text>
  <text x="945" y="561.999999676" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--danger-text)">Tune carefully</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9958" font-weight="bold" fill="var(--text)">Hyperparameter Tuning</text>

  <rect x="40" y="70.185874" width="280" height="215.613383" rx="6.2298" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="107.918216" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7277" font-weight="bold" fill="var(--primary-text)">ParamGridBuilder</text>
  <text x="180" y="145.650558" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--primary-text)">Define search space</text>
  <text x="180" y="172.60223" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--primary-text)">regParam values</text>
  <text x="180" y="199.553903" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--primary-text)">maxIter values</text>
  <text x="180" y="226.505576" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--primary-text)">Grid cross product</text>
  <text x="180" y="258.847584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.4979" fill="var(--primary-text)">.build() returns Array[ParamMap]</text>

  <line x1="320" y1="177.992565" x2="360" y2="177.992565" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="70.185874" width="280" height="215.613383" rx="6.2298" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="510" y="107.918216" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7277" font-weight="bold" fill="var(--ok-text)">CrossValidator</text>
  <text x="510" y="145.650558" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--ok-text)">Estimator: pipeline</text>
  <text x="510" y="172.60223" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--ok-text)">Evaluator: metric</text>
  <text x="510" y="199.553903" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--ok-text)">NumFolds: K splits</text>
  <text x="510" y="226.505576" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--ok-text)">Fit every ParamMap</text>
  <text x="510" y="258.847584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.4979" fill="var(--ok-text)">Average metric per fold</text>

  <line x1="650" y1="177.992565" x2="690" y2="177.992565" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="700" y="70.185874" width="280" height="215.613383" rx="6.2298" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="840" y="107.918216" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7277" font-weight="bold" fill="var(--warn-text)">Select Best</text>
  <text x="840" y="145.650558" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--warn-text)">Compare avg scores</text>
  <text x="840" y="172.60223" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--warn-text)">Pick top ParamMap</text>
  <text x="840" y="199.553903" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--warn-text)">Refit on full data</text>
  <text x="840" y="226.505576" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--warn-text)">bestModel returned</text>
  <text x="840" y="258.847584" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.4979" fill="var(--warn-text)">avgMetrics exposed</text>

  <line x1="980" y1="177.992565" x2="1020" y2="177.992565" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1030" y="70.185874" width="210" height="215.613383" rx="6.2298" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1135" y="107.918216" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7277" font-weight="bold" fill="var(--info-text)">Deploy</text>
  <text x="1135" y="145.650558" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--info-text)">Evaluate on test</text>
  <text x="1135" y="172.60223" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--info-text)">Save bestModel</text>
  <text x="1135" y="199.553903" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--info-text)">Ship to production</text>
  <text x="1135" y="231.895911" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--info-text)">Log params used</text>

  <rect x="40" y="307.360595" width="595" height="312.639405" rx="6.2298" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="337" y="345.092937" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6894" font-weight="bold" fill="var(--text)">CrossValidator vs TrainValidationSplit</text>
  <text x="337" y="382.825279" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--text-muted)">CrossValidator: K-fold, more accurate, K times cost.</text>
  <text x="337" y="413.011152" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--text-muted)">TrainValidationSplit: single split, faster, noisier score.</text>
  <text x="337" y="452.899628" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--text-muted)">Use TVS for big data, CV for small or critical models.</text>
  <text x="337" y="488.475836" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--text-muted)">Set seed for reproducible splits.</text>
  <text x="337" y="522.973978" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--text-muted)">parallelism parameter fits maps concurrently.</text>
  <text x="337" y="560.70632" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--text-muted)">Both wrap any Estimator, including full Pipelines.</text>
  <text x="337" y="596.282528" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5362" fill="var(--text-muted)">Returned model behaves like its inner Estimator.</text>

  <rect x="645" y="307.360595" width="595" height="312.639405" rx="6.2298" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="670" y="345.092937" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">val paramGrid = new ParamGridBuilder()</text>
  <text x="670" y="372.04461" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">  .addGrid(lr.regParam, Array(0.1, 0.01))</text>
  <text x="670" y="398.996283" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">  .addGrid(lr.maxIter, Array(10, 20))</text>
  <text x="670" y="425.947955" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">  .build()</text>
  <text x="670" y="463.680297" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">val cv = new CrossValidator()</text>
  <text x="670" y="490.63197" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">  .setEstimator(pipeline)</text>
  <text x="670" y="517.583643" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">  .setEvaluator(evaluator)</text>
  <text x="670" y="544.535316" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">  .setEstimatorParamMaps(paramGrid)</text>
  <text x="670" y="571.486989" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">  .setNumFolds(3)</text>
  <text x="670" y="609.219331" font-family="monospace" font-size="14.5362" fill="var(--primary-text)">val cvModel = cv.fit(training)</text>
</svg>

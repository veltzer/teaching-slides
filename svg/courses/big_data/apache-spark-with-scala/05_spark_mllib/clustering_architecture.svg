<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="280" height="266.7999999784" rx="6.462198078413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--primary-text)">Features</text>
  <text x="180" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">VectorAssembler</text>
  <text x="180" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">StandardScaler</text>
  <text x="180" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">Numeric only</text>

  <rect x="360" y="40" width="280" height="266.7999999784" rx="6.462198078413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--ok-text)">KMeans</text>
  <text x="500" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Pick k</text>
  <text x="500" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Lloyd iterations</text>
  <text x="500" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Fast baseline</text>

  <rect x="680" y="40" width="280" height="266.7999999784" rx="6.462198078413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--warn-text)">Bisecting</text>
  <text x="820" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">Hierarchical splits</text>
  <text x="820" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">Stable shapes</text>
  <text x="820" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">Slower</text>

  <rect x="1000" y="40" width="240" height="266.7999999784" rx="6.462198078413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--info-text)">GMM</text>
  <text x="1120" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">Soft clusters</text>
  <text x="1120" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">Gaussian mix</text>
  <text x="1120" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">EM training</text>

  <rect x="40" y="341.5999997408" width="1200" height="278.4000002592" rx="6.462198078413" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="399.6000000648" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--text)">Evaluation and Tuning</text>
  <text x="640" y="457.6000003888" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Silhouette score measures cluster separation</text>
  <text x="640" y="504.000000432" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Elbow plot helps choose k</text>
  <text x="640" y="550.4000004752" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Scale features before clustering</text>
  <text x="640" y="596.8000005184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Re-seed runs to avoid local minima</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <rect x="40" y="40" width="230" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="155" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Package</text>
  <text x="155" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">sbt / Maven uber jar</text>
  <text x="155" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">pin dependencies</text>
  <text x="155" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">externalize config</text>

  <rect x="290" y="40" width="230" height="580" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="405" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Cluster</text>
  <text x="405" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">YARN / K8s / Mesos</text>
  <text x="405" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">cluster deploy mode</text>
  <text x="405" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">driver HA supervised</text>

  <rect x="540" y="40" width="230" height="580" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="655" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Checkpoint</text>
  <text x="655" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">HDFS / S3 path</text>
  <text x="655" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">WAL enabled</text>
  <text x="655" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">resume on restart</text>

  <rect x="790" y="40" width="230" height="580" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="905" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Monitor</text>
  <text x="905" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Prometheus / Grafana</text>
  <text x="905" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">alert on delay</text>
  <text x="905" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">log aggregation</text>

  <rect x="1040" y="40" width="200" height="580" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1140" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Operate</text>
  <text x="1140" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">runbook</text>
  <text x="1140" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">on-call rotation</text>
  <text x="1140" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">replay plan</text>

  <line x1="270" y1="330" x2="285" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="330" x2="535" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="330" x2="785" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1020" y1="330" x2="1035" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

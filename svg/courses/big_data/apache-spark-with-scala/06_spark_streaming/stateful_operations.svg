<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="390" height="243.047619047619" rx="8.408612364996" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="80.876190476191" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.021530912489" font-weight="bold" fill="var(--primary-text)">Aggregations</text>
  <text x="235" y="122.857142857142" text-anchor="middle" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--primary-text)">groupBy(window, key)</text>
  <text x="235" y="149.371428571428" text-anchor="middle" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--primary-text)">.agg(count, sum)</text>
  <text x="235" y="193.561904761905" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">State per key+window</text>
  <text x="235" y="222.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">Batches merge in</text>
  <text x="235" y="257.638095238095" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">Needs watermark</text>

  <rect x="445" y="40" width="390" height="243.047619047619" rx="8.408612364996" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="80.876190476191" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.021530912489" font-weight="bold" fill="var(--ok-text)">Stream-stream Joins</text>
  <text x="640" y="122.857142857142" text-anchor="middle" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--ok-text)">clicks.join(impressions,</text>
  <text x="640" y="149.371428571428" text-anchor="middle" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--ok-text)">time-bound predicate)</text>
  <text x="640" y="193.561904761905" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Buffers both sides</text>
  <text x="640" y="222.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Evict when out of range</text>
  <text x="640" y="257.638095238095" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Watermark on both</text>

  <rect x="850" y="40" width="390" height="243.047619047619" rx="8.408612364996" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="80.876190476191" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.021530912489" font-weight="bold" fill="var(--warn-text)">Arbitrary State</text>
  <text x="1045" y="122.857142857142" text-anchor="middle" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--warn-text)">mapGroupsWithState</text>
  <text x="1045" y="149.371428571428" text-anchor="middle" font-family="Courier New, monospace" font-size="14.715071638743" fill="var(--warn-text)">flatMapGroupsWithState</text>
  <text x="1045" y="193.561904761905" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Per-key state machine</text>
  <text x="1045" y="222.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Function + current state</text>
  <text x="1045" y="257.638095238095" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Set timeouts</text>

  <rect x="40" y="316.190476190476" width="1200" height="303.809523809524" rx="8.408612364996" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="360.380952380953" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.123684003739" font-weight="bold" fill="var(--text)">Watermarks bound the state</text>
  <text x="80" y="404.571428571428" font-family="Arial, sans-serif" font-size="16.817224729991" fill="var(--text-muted)">Declare max lateness; older events are dropped.</text>
  <text x="80" y="437.714285714286" font-family="Arial, sans-serif" font-size="16.817224729991" fill="var(--text-muted)">Closed windows release their state.</text>
  <text x="80" y="470.857142857144" font-family="Arial, sans-serif" font-size="16.817224729991" fill="var(--text-muted)">No watermark leads to unbounded memory.</text>
  <text x="80" y="520.571428571428" font-family="Courier New, monospace" font-size="16.817224729991" fill="var(--text)">df.withWatermark("eventTime", "10 minutes")</text>
  <text x="80" y="551.504761904761" font-family="Courier New, monospace" font-size="16.817224729991" fill="var(--text)">  .groupBy(window($"eventTime", "5 minutes"))</text>
  <text x="80" y="582.438095238095" font-family="Courier New, monospace" font-size="16.817224729991" fill="var(--text)">  .agg(count("*"))</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.49561369755" font-weight="bold" fill="var(--text)">Stateful Stream Operations</text>

  <rect x="40" y="76.25" width="390" height="227.857142857143" rx="8.141603913586" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="114.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--primary-text)">Aggregations</text>
  <text x="235" y="153.928571428571" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--primary-text)">groupBy(window, key)</text>
  <text x="235" y="178.785714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--primary-text)">.agg(count, sum)</text>
  <text x="235" y="220.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">State per key+window</text>
  <text x="235" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">Batches merge in</text>
  <text x="235" y="280.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">Needs watermark</text>

  <rect x="445" y="76.25" width="390" height="227.857142857143" rx="8.141603913586" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="114.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--ok-text)">Stream-stream Joins</text>
  <text x="640" y="153.928571428571" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--ok-text)">clicks.join(impressions,</text>
  <text x="640" y="178.785714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--ok-text)">time-bound predicate)</text>
  <text x="640" y="220.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">Buffers both sides</text>
  <text x="640" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">Evict when out of range</text>
  <text x="640" y="280.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">Watermark on both</text>

  <rect x="850" y="76.25" width="390" height="227.857142857143" rx="8.141603913586" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="114.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.354009783964" font-weight="bold" fill="var(--warn-text)">Arbitrary State</text>
  <text x="1045" y="153.928571428571" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--warn-text)">mapGroupsWithState</text>
  <text x="1045" y="178.785714285714" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--warn-text)">flatMapGroupsWithState</text>
  <text x="1045" y="220.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Per-key state machine</text>
  <text x="1045" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Function + current state</text>
  <text x="1045" y="280.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Set timeouts</text>

  <rect x="40" y="335.178571428571" width="1200" height="284.821428571429" rx="8.141603913586" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="376.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.389410762361" font-weight="bold" fill="var(--text)">Watermarks bound the state</text>
  <text x="80" y="418.035714285714" font-family="Arial, sans-serif" font-size="16.283207827171" fill="var(--text-muted)">Declare max lateness; older events are dropped.</text>
  <text x="80" y="449.107142857143" font-family="Arial, sans-serif" font-size="16.283207827171" fill="var(--text-muted)">Closed windows release their state.</text>
  <text x="80" y="480.178571428572" font-family="Arial, sans-serif" font-size="16.283207827171" fill="var(--text-muted)">No watermark leads to unbounded memory.</text>
  <text x="80" y="526.785714285714" font-family="Courier New, monospace" font-size="16.283207827171" fill="var(--text)">df.withWatermark("eventTime", "10 minutes")</text>
  <text x="80" y="555.785714285714" font-family="Courier New, monospace" font-size="16.283207827171" fill="var(--text)">  .groupBy(window($"eventTime", "5 minutes"))</text>
  <text x="80" y="584.785714285714" font-family="Courier New, monospace" font-size="16.283207827171" fill="var(--text)">  .agg(count("*"))</text>
</svg>

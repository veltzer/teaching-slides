<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="380" height="266.7999999784" rx="6.462198078413" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--primary-text)">Kafka</text>
  <text x="230" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">Replayable offsets</text>
  <text x="230" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">High throughput</text>
  <text x="230" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--primary-text)">Production default</text>

  <rect x="450" y="40" width="380" height="266.7999999784" rx="6.462198078413" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--ok-text)">File / Directory</text>
  <text x="640" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Watch HDFS, S3</text>
  <text x="640" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">Parquet, JSON, CSV</text>
  <text x="640" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--ok-text)">ETL landing</text>

  <rect x="860" y="40" width="380" height="266.7999999784" rx="6.462198078413" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="98.000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--warn-text)">Socket / Rate</text>
  <text x="1050" y="155.999999568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">TCP text lines</text>
  <text x="1050" y="202.3999996112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">Dev and demos</text>
  <text x="1050" y="248.7999996544" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--warn-text)">Not fault tolerant</text>

  <rect x="40" y="341.5999997408" width="590" height="278.4000002592" rx="6.462198078413" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="399.6000000648" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--info-text)">Kinesis</text>
  <text x="335" y="457.6000003888" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">AWS managed shards</text>
  <text x="335" y="509.8000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">DynamoDB checkpoints</text>
  <text x="335" y="561.999999676" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--info-text)">Serverless ready</text>

  <rect x="650" y="341.5999997408" width="590" height="278.4000002592" rx="6.462198078413" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="945" y="399.6000000648" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725248285" font-weight="bold" fill="var(--text)">Custom Source</text>
  <text x="945" y="457.6000003888" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">DataSource V2 API</text>
  <text x="945" y="509.8000000324" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">MQTT, Pulsar</text>
  <text x="945" y="561.999999676" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.232527169872" fill="var(--text-muted)">Last resort only</text>
</svg>

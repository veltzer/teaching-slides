<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <rect x="40" y="40" width="585" height="280" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">DStream (Micro-batch)</text>
  <text x="332" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Batches every N seconds</text>
  <text x="332" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Each batch is an RDD</text>
  <text x="332" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Latency: seconds</text>
  <text x="332" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Legacy API</text>
  <text x="332" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">at-least-once by default</text>

  <rect x="655" y="40" width="585" height="280" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Structured Streaming</text>
  <text x="947" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Unbounded DataFrame model</text>
  <text x="947" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Continuous or micro-batch</text>
  <text x="947" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Latency: ms to seconds</text>
  <text x="947" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">SQL + event-time support</text>
  <text x="947" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">exactly-once with checkpoints</text>

  <rect x="40" y="340" width="1200" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Pick by latency and API needs</text>
  <text x="640" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">New projects: Structured Streaming. Richer API and event-time windows.</text>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">DStreams remain only for legacy pipelines tightly coupled to RDDs.</text>
  <text x="640" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Continuous mode delivers millisecond latency with map-like operations.</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-muted)">Micro-batch mode trades latency for higher throughput and richer ops.</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Both share Spark's cluster runtime.</text>
</svg>

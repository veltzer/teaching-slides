<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Structured Streaming Architecture</text>

  <!-- Sources -->
  <rect x="40" y="90" width="220" height="450" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Sources</text>
  <text x="150" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Kafka</text>
  <text x="150" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Kinesis</text>
  <text x="150" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">File stream</text>
  <text x="150" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Socket (dev)</text>
  <text x="150" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Rate (testing)</text>

  <text x="150" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">source offsets tracked by</text>
  <text x="150" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">Spark via a WAL (write-ahead</text>
  <text x="150" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">log) for exactly-once replay</text>

  <line x1="260" y1="300" x2="298" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Engine -->
  <rect x="300" y="90" width="680" height="450" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">Structured Streaming Engine</text>

  <rect x="330" y="150" width="280" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="470" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Trigger policy</text>
  <text x="470" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">ProcessingTime(1s)</text>
  <text x="470" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Once() (batch)</text>
  <text x="470" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">AvailableNow</text>
  <text x="470" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">Continuous (low-latency)</text>

  <rect x="670" y="150" width="280" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="810" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Micro-batch loop</text>
  <text x="810" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">each tick:</text>
  <text x="810" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">read new offsets → batch DF</text>
  <text x="810" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">run Catalyst → execute stages</text>
  <text x="810" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">commit state + offsets</text>

  <rect x="330" y="300" width="280" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="470" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Stateful operations</text>
  <text x="470" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">aggregations, joins, windows</text>
  <text x="470" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">state stored per executor</text>
  <text x="470" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">HDFS / S3 checkpoint backing</text>
  <text x="470" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">watermarks cap memory growth</text>

  <rect x="670" y="300" width="280" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="810" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Checkpoint directory</text>
  <text x="810" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">offsets, commits, state</text>
  <text x="810" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">survives restarts</text>
  <text x="810" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">allows exactly-once with</text>
  <text x="810" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">idempotent sinks</text>

  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Output modes: append | update | complete</text>
  <text x="640" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Same DataFrame API as batch — write once, run streaming</text>

  <line x1="980" y1="300" x2="1018" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sinks -->
  <rect x="1020" y="90" width="220" height="450" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1130" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Sinks</text>
  <text x="1130" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Kafka</text>
  <text x="1130" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">File (Parquet/ORC)</text>
  <text x="1130" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Delta / Iceberg</text>
  <text x="1130" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Foreach / ForeachBatch</text>
  <text x="1130" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Console (dev)</text>
  <text x="1130" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Memory (tests)</text>

  <text x="1130" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">idempotent or</text>
  <text x="1130" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">transactional sinks</text>
  <text x="1130" y="401" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">enable end-to-end</text>
  <text x="1130" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">exactly-once semantics</text>
</svg>

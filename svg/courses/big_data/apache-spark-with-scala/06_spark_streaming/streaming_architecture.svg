<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8141" font-weight="bold" fill="var(--text)">Structured Streaming Architecture</text>

  <!-- Sources -->
  <rect x="40" y="92.7273" width="220" height="527.2727" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="133.7374" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3193" font-weight="bold" fill="var(--primary-text)">Sources</text>
  <text x="150" y="180.6061" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--primary-text)">Kafka</text>
  <text x="150" y="215.7576" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--primary-text)">Kinesis</text>
  <text x="150" y="250.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--primary-text)">File stream</text>
  <text x="150" y="286.0606" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--primary-text)">Socket (dev)</text>
  <text x="150" y="321.2121" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--primary-text)">Rate (testing)</text>

  <text x="150" y="373.9394" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--primary-text)">source offsets tracked by</text>
  <text x="150" y="395.0303" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--primary-text)">Spark via a WAL (write-ahead</text>
  <text x="150" y="416.1212" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--primary-text)">log) for exactly-once replay</text>

  <line x1="260" y1="338.7879" x2="298" y2="338.7879" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Engine -->
  <rect x="300" y="92.7273" width="680" height="527.2727" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="133.7374" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3193" font-weight="bold" fill="var(--ok-text)">Structured Streaming Engine</text>

  <rect x="330" y="163.0303" width="280" height="152.3232" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="198.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" font-weight="bold" fill="var(--ok-text)">Trigger policy</text>
  <text x="470" y="227.4747" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">ProcessingTime(1s)</text>
  <text x="470" y="248.5657" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">Once() (batch)</text>
  <text x="470" y="269.6566" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">AvailableNow</text>
  <text x="470" y="294.2626" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">Continuous (low-latency)</text>

  <rect x="670" y="163.0303" width="280" height="152.3232" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="198.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" font-weight="bold" fill="var(--ok-text)">Micro-batch loop</text>
  <text x="810" y="227.4747" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">each tick:</text>
  <text x="810" y="250.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">read new offsets → batch DF</text>
  <text x="810" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">run Catalyst → execute stages</text>
  <text x="810" y="293.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">commit state + offsets</text>

  <rect x="330" y="338.7879" width="280" height="152.3232" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="373.9394" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" font-weight="bold" fill="var(--ok-text)">Stateful operations</text>
  <text x="470" y="406.7475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">aggregations, joins, windows</text>
  <text x="470" y="430.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">state stored per executor</text>
  <text x="470" y="453.6162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">HDFS / S3 checkpoint backing</text>
  <text x="470" y="477.0505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">watermarks cap memory growth</text>

  <rect x="670" y="338.7879" width="280" height="152.3232" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="810" y="373.9394" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" font-weight="bold" fill="var(--ok-text)">Checkpoint directory</text>
  <text x="810" y="406.7475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">offsets, commits, state</text>
  <text x="810" y="430.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">survives restarts</text>
  <text x="810" y="453.6162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">allows exactly-once with</text>
  <text x="810" y="477.0505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--ok-text)">idempotent sinks</text>

  <text x="640" y="543.8384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.072" fill="var(--ok-text)">Output modes: append | update | complete</text>
  <text x="640" y="570.7879" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.072" fill="var(--ok-text)">Same DataFrame API as batch — write once, run streaming</text>

  <line x1="980" y1="338.7879" x2="1018" y2="338.7879" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sinks -->
  <rect x="1020" y="92.7273" width="220" height="527.2727" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="133.7374" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3193" font-weight="bold" fill="var(--warn-text)">Sinks</text>
  <text x="1130" y="180.6061" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--warn-text)">Kafka</text>
  <text x="1130" y="215.7576" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--warn-text)">File (Parquet/ORC)</text>
  <text x="1130" y="250.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--warn-text)">Delta / Iceberg</text>
  <text x="1130" y="286.0606" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--warn-text)">Foreach / ForeachBatch</text>
  <text x="1130" y="321.2121" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--warn-text)">Console (dev)</text>
  <text x="1130" y="356.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1544" fill="var(--warn-text)">Memory (tests)</text>

  <text x="1130" y="414.9495" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--warn-text)">idempotent or</text>
  <text x="1130" y="436.0404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--warn-text)">transactional sinks</text>
  <text x="1130" y="457.1313" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--warn-text)">enable end-to-end</text>
  <text x="1130" y="478.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.9895" fill="var(--warn-text)">exactly-once semantics</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <rect x="40" y="40" width="390" height="280" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Batch Interval</text>
  <text x="235" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">size to processing time</text>
  <text x="235" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">keep delay near zero</text>
  <text x="235" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">too small: overhead</text>
  <text x="235" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">too big: latency spikes</text>

  <rect x="445" y="40" width="390" height="280" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Parallelism</text>
  <text x="640" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">match Kafka partitions</text>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">cores == partitions</text>
  <text x="640" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">repartition skewed keys</text>
  <text x="640" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">tune shuffle partitions</text>

  <rect x="850" y="40" width="390" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Memory and GC</text>
  <text x="1045" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Kryo serializer</text>
  <text x="1045" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">G1GC, size old gen</text>
  <text x="1045" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">cache only hot RDDs</text>
  <text x="1045" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">off-heap for state</text>

  <rect x="40" y="340" width="390" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Backpressure</text>
  <text x="235" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">enable PID rate control</text>
  <text x="235" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">cap maxRatePerPartition</text>
  <text x="235" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">absorb traffic bursts</text>
  <text x="235" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">without OOM</text>

  <rect x="445" y="340" width="390" height="280" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Shuffle Costs</text>
  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">avoid groupByKey</text>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">prefer reduceByKey</text>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">broadcast small sides</text>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">watch disk spill</text>

  <rect x="850" y="340" width="390" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1045" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Measure First</text>
  <text x="1045" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Streaming tab in UI</text>
  <text x="1045" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">processing vs scheduling</text>
  <text x="1045" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">identify the bottleneck</text>
  <text x="1045" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">tune one knob at a time</text>
</svg>

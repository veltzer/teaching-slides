<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="269.285714" rx="8.141604" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="71.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" font-weight="bold" fill="var(--text)">Tumbling Window — window = slide (non-overlapping)</text>
  <text x="640" y="94.892857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">window(Seconds(10), Seconds(10)) — each event counted exactly once</text>

  <line x1="80" y1="159.107143" x2="1220" y2="159.107143" stroke="var(--text-faint)" stroke-width="1"/>
  <rect x="80" y="122.857143" width="220" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" fill-opacity="0.85"/>
  <text x="190" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--primary-text)" font-weight="bold">W0 [0..10)</text>
  <rect x="300" y="122.857143" width="220" height="72.5" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" fill-opacity="0.85"/>
  <text x="410" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--info-text)" font-weight="bold">W1 [10..20)</text>
  <rect x="520" y="122.857143" width="220" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.85"/>
  <text x="630" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--ok-text)" font-weight="bold">W2 [20..30)</text>
  <rect x="740" y="122.857143" width="220" height="72.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" fill-opacity="0.85"/>
  <text x="850" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--warn-text)" font-weight="bold">W3 [30..40)</text>
  <rect x="960" y="122.857143" width="220" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" fill-opacity="0.85"/>
  <text x="1070" y="164.285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247807" fill="var(--primary-text)" font-weight="bold">W4 [40..50)</text>

  <text x="80" y="221.25" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">0s</text>
  <text x="300" y="221.25" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">10s</text>
  <text x="520" y="221.25" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">20s</text>
  <text x="740" y="221.25" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">30s</text>
  <text x="960" y="221.25" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">40s</text>
  <text x="1170" y="221.25" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">50s</text>

  <text x="640" y="267.857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--text)">Use: periodic reports, billing buckets — events belong to one window only</text>
  <text x="640" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">reduceByWindow, countByWindow, reduceByKeyAndWindow</text>

  <rect x="40" y="330" width="1200" height="290" rx="8.141604" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="361.071429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.318609" font-weight="bold" fill="var(--text)">Sliding Window — slide &lt; window (overlapping)</text>
  <text x="640" y="384.892857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">window(Seconds(20), Seconds(5)) — each event appears in window/slide = 4 windows</text>

  <line x1="80" y1="454.285714" x2="1220" y2="454.285714" stroke="var(--text-faint)" stroke-width="1"/>
  <rect x="80" y="428.392857" width="380" height="51.785714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" fill-opacity="0.55"/>
  <text x="270" y="459.464286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--primary-text)" font-weight="bold">W0 [0..20)</text>
  <rect x="175" y="485.357143" width="380" height="51.785714" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" fill-opacity="0.55"/>
  <text x="365" y="516.428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--info-text)" font-weight="bold">W1 [5..25)</text>
  <rect x="270" y="542.321429" width="380" height="51.785714" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.55"/>
  <text x="460" y="573.392857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--ok-text)" font-weight="bold">W2 [10..30)</text>

  <text x="80" y="614.821429" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">0s</text>
  <text x="270" y="614.821429" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">10s</text>
  <text x="460" y="614.821429" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">20s</text>
  <text x="650" y="614.821429" font-family="Arial, sans-serif" font-size="11.194705" fill="var(--text-muted)">30s</text>

  <text x="950" y="459.464286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106" fill="var(--text)" font-weight="bold">Requirements</text>
  <text x="950" y="485.357143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">both must be multiples of batch interval</text>
  <text x="950" y="508.142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">invertible reduce → incremental (fast)</text>
  <text x="950" y="530.928571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">checkpoint required for long windows</text>
  <text x="950" y="563.035714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.212406" fill="var(--text-muted)">Use: moving averages, rolling stats</text>
</svg>

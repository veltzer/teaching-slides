<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="580" height="250.196078431372" rx="10.664215404618" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273890158" font-weight="bold" fill="var(--primary-text)">Metadata Checkpoint</text>
  <text x="330" y="125.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--primary-text)">Driver recovery info</text>
  <text x="330" y="165.098039215687" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--primary-text)">Config + DStream DAG</text>
  <text x="330" y="199.21568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--primary-text)">Queued batches</text>
  <text x="330" y="233.333333333334" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--primary-text)">Kafka offsets</text>
  <text x="330" y="273.137254901961" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566465" font-style="italic" fill="var(--primary-text)">small; every batch</text>

  <rect x="660" y="40" width="580" height="250.196078431372" rx="10.664215404618" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="85.490196078432" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273890158" font-weight="bold" fill="var(--info-text)">Data Checkpoint</text>
  <text x="950" y="125.294117647059" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--info-text)">Truncates RDD lineage</text>
  <text x="950" y="165.098039215687" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--info-text)">Stateful op RDDs</text>
  <text x="950" y="199.21568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--info-text)">updateStateByKey, window</text>
  <text x="950" y="233.333333333334" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--info-text)">Avoids stack overflow</text>
  <text x="950" y="273.137254901961" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566465" font-style="italic" fill="var(--info-text)">larger; every N batches</text>

  <rect x="40" y="324.313725490196" width="1200" height="136.470588235294" rx="10.664215404618" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="364.117647058823" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273890158" font-weight="bold" fill="var(--ok-text)">HDFS-Compatible Storage</text>
  <text x="640" y="403.921568627452" text-anchor="middle" font-family="Courier New, monospace" font-size="17.062744647388" fill="var(--ok-text)">ssc.checkpoint("hdfs://...")</text>
  <text x="640" y="438.039215686275" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--ok-text)">S3, GCS, Azure — replicated, durable</text>

  <rect x="40" y="494.901960784314" width="1200" height="125.098039215686" rx="10.664215404618" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="534.705882352941" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.461273890158" font-weight="bold" fill="var(--danger-text)">Recovery</text>
  <text x="640" y="574.509803921569" text-anchor="middle" font-family="Courier New, monospace" font-size="17.062744647388" fill="var(--danger-text)">StreamingContext.getOrCreate(dir, factory)</text>
  <text x="640" y="606.35294117647" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--danger-text)">Replays last checkpoint; at-least-once default</text>
</svg>

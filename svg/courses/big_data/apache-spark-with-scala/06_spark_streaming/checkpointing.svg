<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.885093454119" font-weight="bold" fill="var(--primary-accent)">Streaming Checkpointing</text>

  <rect x="40" y="77.247706422018" width="580" height="234.128440366972" rx="10.316104805043" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--primary-text)">Metadata Checkpoint</text>
  <text x="330" y="157.064220183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--primary-text)">Driver recovery info</text>
  <text x="330" y="194.311926605505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--primary-text)">Config + DStream DAG</text>
  <text x="330" y="226.238532110092" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--primary-text)">Queued batches</text>
  <text x="330" y="258.165137614679" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--primary-text)">Kafka offsets</text>
  <text x="330" y="295.412844036697" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" font-style="italic" fill="var(--primary-text)">small; every batch</text>

  <rect x="660" y="77.247706422018" width="580" height="234.128440366972" rx="10.316104805043" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="119.816513761468" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--info-text)">Data Checkpoint</text>
  <text x="950" y="157.064220183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--info-text)">Truncates RDD lineage</text>
  <text x="950" y="194.311926605505" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--info-text)">Stateful op RDDs</text>
  <text x="950" y="226.238532110092" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--info-text)">updateStateByKey, window</text>
  <text x="950" y="258.165137614679" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--info-text)">Avoids stack overflow</text>
  <text x="950" y="295.412844036697" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.44254672706" font-style="italic" fill="var(--info-text)">larger; every N batches</text>

  <rect x="40" y="343.302752293578" width="1200" height="127.706422018349" rx="10.316104805043" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="380.550458715596" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--ok-text)">HDFS-Compatible Storage</text>
  <text x="640" y="417.798165137615" text-anchor="middle" font-family="Courier New, monospace" font-size="16.505767688068" fill="var(--ok-text)">ssc.checkpoint("hdfs://...")</text>
  <text x="640" y="449.724770642202" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--ok-text)">S3, GCS, Azure — replicated, durable</text>

  <rect x="40" y="502.935779816514" width="1200" height="117.064220183486" rx="10.316104805043" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="540.183486238532" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.695430571094" font-weight="bold" fill="var(--danger-text)">Recovery</text>
  <text x="640" y="577.431192660551" text-anchor="middle" font-family="Courier New, monospace" font-size="16.505767688068" fill="var(--danger-text)">StreamingContext.getOrCreate(dir, factory)</text>
  <text x="640" y="607.229357798165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.505767688068" fill="var(--danger-text)">Replays last checkpoint; at-least-once default</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="280" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Stream</text>
  <text x="180" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">DStream or</text>
  <text x="180" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">DataFrame</text>
  <text x="180" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">micro-batches</text>
  <text x="180" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">trigger output</text>

  <rect x="360" y="40" width="440" height="260" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Console / print()</text>
  <text x="580" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">first 10 records per batch</text>
  <text x="580" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">development and debugging</text>
  <text x="580" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">no durability guarantees</text>

  <rect x="360" y="320" width="440" height="260" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">saveAsTextFiles()</text>
  <text x="580" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">HDFS or S3 per batch</text>
  <text x="580" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">prefix-time-suffix naming</text>
  <text x="580" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">durable, batch-aligned</text>

  <rect x="840" y="40" width="400" height="540" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">foreachRDD()</text>
  <text x="1040" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">custom sink per partition</text>
  <text x="1040" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">JDBC, Kafka, Redis, HTTP</text>
  <text x="1040" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">control commit semantics</text>
  <text x="1040" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">reuse connections</text>
  <text x="1040" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">pair with idempotent writes</text>
  <text x="1040" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">to approach exactly-once</text>

  <line x1="320" y1="170" x2="355" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="450" x2="355" y2="450" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="310" x2="835" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

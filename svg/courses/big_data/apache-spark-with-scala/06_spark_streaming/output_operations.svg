<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <rect x="40" y="40" width="280" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Stream</text>
  <text x="180" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">DStream or</text>
  <text x="180" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">DataFrame</text>
  <text x="180" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">micro-batches</text>
  <text x="180" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">trigger output</text>

  <rect x="360" y="40" width="440" height="260" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Console / print()</text>
  <text x="580" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">first 10 records per batch</text>
  <text x="580" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">development and debugging</text>
  <text x="580" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">no durability guarantees</text>

  <rect x="360" y="320" width="440" height="260" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">saveAsTextFiles()</text>
  <text x="580" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">HDFS or S3 per batch</text>
  <text x="580" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">prefix-time-suffix naming</text>
  <text x="580" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">durable, batch-aligned</text>

  <rect x="840" y="40" width="400" height="540" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">foreachRDD()</text>
  <text x="1040" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">custom sink per partition</text>
  <text x="1040" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">JDBC, Kafka, Redis, HTTP</text>
  <text x="1040" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">control commit semantics</text>
  <text x="1040" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">reuse connections</text>
  <text x="1040" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">pair with idempotent writes</text>
  <text x="1040" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">to approach exactly-once</text>

  <line x1="320" y1="170" x2="355" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="450" x2="355" y2="450" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="310" x2="835" y2="310" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

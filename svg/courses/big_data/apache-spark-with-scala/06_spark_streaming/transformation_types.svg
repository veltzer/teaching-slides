<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <!-- palette: resources/palette_diagram.yaml -->

  <rect x="40" y="40" width="585" height="280" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="332" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Stateless</text>
  <text x="332" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">map, filter, flatMap</text>
  <text x="332" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">reduceByKey, union</text>
  <text x="332" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">operates on one batch</text>
  <text x="332" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">no memory across batches</text>
  <text x="332" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">cheap, trivially parallel</text>

  <rect x="655" y="40" width="585" height="280" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="947" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Stateful</text>
  <text x="947" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">updateStateByKey</text>
  <text x="947" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">mapWithState, sessions</text>
  <text x="947" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">persists state per key</text>
  <text x="947" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">needs checkpointing</text>
  <text x="947" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">use TTL to cap growth</text>

  <rect x="40" y="340" width="585" height="280" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="332" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Windowed</text>
  <text x="332" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">window, reduceByWindow</text>
  <text x="332" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">countByWindow</text>
  <text x="332" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">tumbling / sliding</text>
  <text x="332" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">window and slide multiples</text>
  <text x="332" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">of the batch interval</text>

  <rect x="655" y="340" width="585" height="280" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="947" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Join / Output</text>
  <text x="947" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">stream-stream, stream-static</text>
  <text x="947" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">transform, foreachRDD</text>
  <text x="947" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">mix with batch datasets</text>
  <text x="947" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">escape-hatch to raw RDD</text>
  <text x="947" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">terminate pipeline</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.8388" font-weight="bold" fill="var(--text)">Spark + Kafka Integration Flow</text>

  <!-- Producers -->
  <rect x="40" y="110.1099" width="200" height="152.967" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="154.7253" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9356" font-weight="bold" fill="var(--primary-text)">Producers</text>
  <text x="140" y="192.967" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--primary-text)">apps, IoT devices,</text>
  <text x="140" y="215.9121" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--primary-text)">CDC, microservices</text>
  <text x="140" y="243.956" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--primary-text)">publish records</text>

  <line x1="240" y1="186.5934" x2="278" y2="186.5934" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kafka cluster -->
  <rect x="280" y="110.1099" width="280" height="509.8901" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420" y="154.7253" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9356" font-weight="bold" fill="var(--warn-text)">Kafka Cluster</text>
  <text x="420" y="180.2198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--warn-text)">topic: events</text>

  <rect x="310" y="205.7143" width="220" height="76.4835" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420" y="237.5824" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6775" font-weight="bold" fill="var(--warn-text)">Partition 0</text>
  <text x="420" y="263.0769" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4194" fill="var(--warn-text)">offsets 0..N   leader: B1</text>

  <rect x="310" y="294.9451" width="220" height="76.4835" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420" y="326.8132" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6775" font-weight="bold" fill="var(--warn-text)">Partition 1</text>
  <text x="420" y="352.3077" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4194" fill="var(--warn-text)">offsets 0..M   leader: B2</text>

  <rect x="310" y="384.1758" width="220" height="76.4835" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420" y="416.044" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6775" font-weight="bold" fill="var(--warn-text)">Partition 2</text>
  <text x="420" y="441.5385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4194" fill="var(--warn-text)">offsets 0..P   leader: B3</text>

  <text x="420" y="505.2747" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--warn-text)">replicated across brokers</text>
  <text x="420" y="533.3187" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--warn-text)">records persisted to disk</text>
  <text x="420" y="561.3626" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--warn-text)">consumers read at own pace</text>
  <text x="420" y="589.4066" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--warn-text)">offsets define position</text>

  <line x1="560" y1="365.0549" x2="598" y2="365.0549" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Spark Structured Streaming -->
  <rect x="600" y="110.1099" width="360" height="509.8901" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="154.7253" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9356" font-weight="bold" fill="var(--ok-text)">Spark Structured Streaming</text>

  <rect x="625" y="180.2198" width="310" height="127.4725" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="212.0879" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6775" font-weight="bold" fill="var(--ok-text)">readStream.format("kafka")</text>
  <text x="780" y="240.1319" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4194" fill="var(--ok-text)">.option("kafka.bootstrap.servers", "...")</text>
  <text x="780" y="263.0769" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4194" fill="var(--ok-text)">.option("subscribe", "events")</text>
  <text x="780" y="286.022" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4194" fill="var(--ok-text)">.option("startingOffsets", "latest")</text>

  <rect x="625" y="333.1868" width="310" height="127.4725" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="365.0549" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6775" font-weight="bold" fill="var(--ok-text)">DataFrame schema</text>
  <text x="780" y="393.0989" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4194" fill="var(--ok-text)">key, value (binary)</text>
  <text x="780" y="416.044" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4194" fill="var(--ok-text)">topic, partition, offset</text>
  <text x="780" y="438.989" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4194" fill="var(--ok-text)">timestamp, timestampType</text>

  <text x="780" y="498.9011" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--ok-text)">.selectExpr("CAST(value AS STRING)")</text>
  <text x="780" y="524.3956" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--ok-text)">then normal DataFrame ops</text>
  <text x="780" y="569.011" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--ok-text)">one Spark task per Kafka partition</text>
  <text x="780" y="597.0549" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--ok-text)">checkpoints track processed offsets</text>

  <line x1="960" y1="365.0549" x2="998" y2="365.0549" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sinks -->
  <rect x="1000" y="110.1099" width="240" height="509.8901" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1120" y="154.7253" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9356" font-weight="bold" fill="var(--info-text)">Sinks</text>
  <text x="1120" y="205.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6775" fill="var(--info-text)">writeStream.format(...)</text>
  <text x="1120" y="250.3297" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">Delta / Parquet</text>
  <text x="1120" y="278.3736" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">Kafka (another topic)</text>
  <text x="1120" y="306.4176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">JDBC / Cassandra</text>
  <text x="1120" y="334.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">foreachBatch { df =&gt; ... }</text>

  <text x="1120" y="390.5495" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">output modes:</text>
  <text x="1120" y="416.044" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">append | update | complete</text>
  <text x="1120" y="467.033" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">trigger policies:</text>
  <text x="1120" y="492.5275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">ProcessingTime</text>
  <text x="1120" y="515.4725" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">Once / AvailableNow</text>
  <text x="1120" y="562.6374" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">.option("checkpointLocation",</text>
  <text x="1120" y="588.1319" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5484" fill="var(--info-text)">"/ckpt/events") is required</text>
</svg>

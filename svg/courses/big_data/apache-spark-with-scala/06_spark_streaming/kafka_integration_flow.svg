<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Spark + Kafka Integration Flow</text>

  <!-- Producers -->
  <rect x="40" y="100" width="200" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="140" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Producers</text>
  <text x="140" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">apps, IoT devices,</text>
  <text x="140" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">CDC, microservices</text>
  <text x="140" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-text)">publish records</text>

  <line x1="240" y1="160" x2="278" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kafka cluster -->
  <rect x="280" y="100" width="280" height="400" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-text)">Kafka Cluster</text>
  <text x="420" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">topic: events</text>

  <rect x="310" y="175" width="220" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">Partition 0</text>
  <text x="420" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-text)">offsets 0..N   leader: B1</text>

  <rect x="310" y="245" width="220" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">Partition 1</text>
  <text x="420" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-text)">offsets 0..M   leader: B2</text>

  <rect x="310" y="315" width="220" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="420" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-text)">Partition 2</text>
  <text x="420" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-text)">offsets 0..P   leader: B3</text>

  <text x="420" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">replicated across brokers</text>
  <text x="420" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">records persisted to disk</text>
  <text x="420" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">consumers read at own pace</text>
  <text x="420" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-text)">offsets define position</text>

  <line x1="560" y1="300" x2="598" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Spark Structured Streaming -->
  <rect x="600" y="100" width="360" height="400" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-text)">Spark Structured Streaming</text>

  <rect x="625" y="155" width="310" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-text)">readStream.format("kafka")</text>
  <text x="780" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)">.option("kafka.bootstrap.servers", "...")</text>
  <text x="780" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)">.option("subscribe", "events")</text>
  <text x="780" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)">.option("startingOffsets", "latest")</text>

  <rect x="625" y="275" width="310" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="780" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-text)">DataFrame schema</text>
  <text x="780" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)">key, value (binary)</text>
  <text x="780" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)">topic, partition, offset</text>
  <text x="780" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-text)">timestamp, timestampType</text>

  <text x="780" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">.selectExpr("CAST(value AS STRING)")</text>
  <text x="780" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">then normal DataFrame ops</text>
  <text x="780" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">one Spark task per Kafka partition</text>
  <text x="780" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-text)">checkpoints track processed offsets</text>

  <line x1="960" y1="300" x2="998" y2="300" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sinks -->
  <rect x="1000" y="100" width="240" height="400" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1120" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Sinks</text>
  <text x="1120" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">writeStream.format(...)</text>
  <text x="1120" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">Delta / Parquet</text>
  <text x="1120" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">Kafka (another topic)</text>
  <text x="1120" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">JDBC / Cassandra</text>
  <text x="1120" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">foreachBatch { df =&gt; ... }</text>

  <text x="1120" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">output modes:</text>
  <text x="1120" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">append | update | complete</text>
  <text x="1120" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">trigger policies:</text>
  <text x="1120" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">ProcessingTime</text>
  <text x="1120" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">Once / AvailableNow</text>
  <text x="1120" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">.option("checkpointLocation",</text>
  <text x="1120" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--info-text)">"/ckpt/events") is required</text>
</svg>

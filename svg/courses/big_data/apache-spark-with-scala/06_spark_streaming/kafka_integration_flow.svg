<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="201.680672268908" height="208.8" rx="8.652390741652" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.840336134454" y="98.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.630976854129" font-weight="bold" fill="var(--primary-text)">Producers</text>
  <text x="140.840336134454" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.223232640596" fill="var(--primary-text)">Apps, IoT, CDC</text>
  <text x="140.840336134454" y="190.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.223232640596" fill="var(--primary-text)">Microservices</text>
  <text x="140.840336134454" y="225.600000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.223232640596" fill="var(--primary-text)">Publish records</text>

  <line x1="243.697478991597" y1="144.400000000001" x2="282.016806722689" y2="144.400000000001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="287.058823529412" y="40" width="282.352941176471" height="580" rx="8.652390741652" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="428.235294117647" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.630976854129" font-weight="bold" fill="var(--warn-text)">Kafka Cluster</text>
  <text x="428.235294117647" y="121.200000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--warn-text)">topic: events</text>

  <rect x="312.268907563025" y="156" width="231.932773109244" height="69.6" rx="6.489293056239" fill="var(--warn-accent)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="428.235294117647" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.223232640596" font-weight="bold" fill="var(--warn-text)">Partition 0</text>
  <text x="428.235294117647" y="208.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060134955184" fill="var(--warn-text)">leader: B1</text>

  <rect x="312.268907563025" y="248.800000000001" width="231.932773109244" height="69.6" rx="6.489293056239" fill="var(--warn-accent)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="428.235294117647" y="277.800000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.223232640596" font-weight="bold" fill="var(--warn-text)">Partition 1</text>
  <text x="428.235294117647" y="301.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060134955184" fill="var(--warn-text)">leader: B2</text>

  <rect x="312.268907563025" y="341.6" width="231.932773109244" height="69.6" rx="6.489293056239" fill="var(--warn-accent)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="428.235294117647" y="370.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.223232640596" font-weight="bold" fill="var(--warn-text)">Partition 2</text>
  <text x="428.235294117647" y="393.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060134955184" fill="var(--warn-text)">leader: B3</text>

  <text x="428.235294117647" y="469.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--warn-text)">Replicated, durable</text>
  <text x="428.235294117647" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--warn-text)">Consumers track offsets</text>
  <text x="428.235294117647" y="567.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--warn-text)">Retained by time/size</text>

  <line x1="571.428571428571" y1="330.000000000001" x2="609.747899159664" y2="330.000000000001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="614.789915966387" y="40" width="363.025210084034" height="580" rx="8.652390741652" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.302521008403" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.630976854129" font-weight="bold" fill="var(--ok-text)">Structured Streaming</text>

  <rect x="634.957983193277" y="121.200000000001" width="322.689075630252" height="139.199999999999" rx="6.489293056239" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="796.302521008403" y="156" text-anchor="middle" font-family="Courier New, monospace" font-size="15.141683797891" fill="var(--ok-text)">readStream.format("kafka")</text>
  <text x="796.302521008403" y="185" text-anchor="middle" font-family="Courier New, monospace" font-size="14.060134955184" fill="var(--ok-text)">.option("subscribe", ...)</text>
  <text x="796.302521008403" y="214" text-anchor="middle" font-family="Courier New, monospace" font-size="14.060134955184" fill="var(--ok-text)">.option("startingOffsets", ...)</text>
  <text x="796.302521008403" y="243" text-anchor="middle" font-family="Courier New, monospace" font-size="14.060134955184" fill="var(--ok-text)">.load()</text>

  <rect x="634.957983193277" y="283.6" width="322.689075630252" height="139.199999999999" rx="6.489293056239" fill="var(--ok-accent)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="796.302521008403" y="318.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.223232640596" font-weight="bold" fill="var(--ok-text)">DataFrame columns</text>
  <text x="796.302521008403" y="353.200000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060134955184" fill="var(--ok-text)">key, value, topic</text>
  <text x="796.302521008403" y="382.200000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.060134955184" fill="var(--ok-text)">partition, offset, timestamp</text>

  <text x="796.302521008403" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--ok-text)">Task per partition</text>
  <text x="796.302521008403" y="515.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--ok-text)">Checkpoint tracks offsets</text>
  <text x="796.302521008403" y="573.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--ok-text)">Exactly-once semantics</text>

  <line x1="979.831932773109" y1="330.000000000001" x2="1018.151260504202" y2="330.000000000001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1023.193277310924" y="40" width="216.806722689076" height="580" rx="8.652390741652" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.09243697479" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.630976854129" font-weight="bold" fill="var(--info-text)">Sinks</text>
  <text x="1131.09243697479" y="144.400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">writeStream</text>
  <text x="1131.09243697479" y="196.600000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">Delta / Parquet</text>
  <text x="1131.09243697479" y="231.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">Kafka topic</text>
  <text x="1131.09243697479" y="266.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">JDBC / Cassandra</text>
  <text x="1131.09243697479" y="301.000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">foreachBatch</text>
  <text x="1131.09243697479" y="376.400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">Modes: append,</text>
  <text x="1131.09243697479" y="405.400000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">update, complete</text>
  <text x="1131.09243697479" y="480.800000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">Triggers: Time,</text>
  <text x="1131.09243697479" y="509.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">Once, AvailableNow</text>
  <text x="1131.09243697479" y="579.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.141683797891" fill="var(--info-text)">checkpointLocation</text>
</svg>

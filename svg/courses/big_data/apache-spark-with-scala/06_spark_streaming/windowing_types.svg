<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Tumbling -->
  <rect x="40" y="40" width="1200" height="175.094335564257" rx="6.22229735763" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="78.301852296188" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737668777157" font-weight="bold" fill="var(--primary-text)">Tumbling</text>
  <text x="140" y="105.660348949802" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--primary-text)">fixed-size,</text>
  <text x="140" y="125.358475144178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--primary-text)">non-overlapping</text>
  <text x="140" y="154.905664435743" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--primary-text)">every event falls</text>
  <text x="140" y="174.60368308294" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--primary-text)">into exactly one</text>

  <rect x="310" y="122.075382413663" width="170" height="43.773637664654" rx="6.22229735763" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="395" y="149.433879067277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--text)">W1 [0..5m)</text>
  <rect x="495" y="122.075382413663" width="170" height="43.773637664654" rx="6.22229735763" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="580" y="149.433879067277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--text)">W2 [5..10m)</text>
  <rect x="680" y="122.075382413663" width="170" height="43.773637664654" rx="6.22229735763" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="765" y="149.433879067277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--text)">W3 [10..15m)</text>
  <rect x="865" y="122.075382413663" width="170" height="43.773637664654" rx="6.22229735763" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="950" y="149.433879067277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--text)">W4 [15..20m)</text>
  <rect x="1050" y="122.075382413663" width="170" height="43.773637664654" rx="6.22229735763" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="1135" y="149.433879067277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--text)">W5 [20..25m)</text>

  <text x="770" y="196.490501915267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.507205618333" fill="var(--primary-text)">window($"ts", "5 minutes")</text>

  <!-- Sliding -->
  <rect x="40" y="231.509369028118" width="1200" height="196.981154396584" rx="6.22229735763" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="269.811328871485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737668777157" font-weight="bold" fill="var(--ok-text)">Sliding</text>
  <text x="140" y="297.169825525099" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--ok-text)">fixed size, slides</text>
  <text x="140" y="316.867951719475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--ok-text)">at a smaller step</text>
  <text x="140" y="346.415033463861" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--ok-text)">windows overlap</text>
  <text x="140" y="366.113159658237" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--ok-text)">an event is in multiple</text>

  <rect x="310" y="313.58485898896" width="350" height="28.452789199" rx="6.22229735763" fill="var(--bg)" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="485" y="333.282985183336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.507205618333" fill="var(--text)">W1 [0..10m)</text>
  <rect x="395" y="346.415033463861" width="350" height="28.452789199" rx="6.22229735763" fill="var(--bg)" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="570" y="366.113159658237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.507205618333" fill="var(--text)">W2 [5..15m)</text>
  <rect x="480" y="379.245315485941" width="350" height="28.452789199" rx="6.22229735763" fill="var(--bg)" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="655" y="398.943334133138" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.507205618333" fill="var(--text)">W3 [10..20m)</text>
  <rect x="565" y="313.58485898896" width="350" height="28.452789199" rx="6.22229735763" fill="var(--bg)" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="740" y="333.282985183336" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.507205618333" fill="var(--text)">W4 [15..25m)</text>

  <text x="770" y="412.075489960842" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.507205618333" fill="var(--ok-text)">window($"ts", "10 minutes", "5 minutes")  — (size, slide)</text>

  <!-- Session -->
  <rect x="40" y="444.905664435743" width="1200" height="175.094335564257" rx="6.22229735763" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="483.207516731931" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.737668777157" font-weight="bold" fill="var(--warn-text)">Session</text>
  <text x="140" y="510.566013385544" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--warn-text)">dynamic, per-key</text>
  <text x="140" y="537.924510039158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--warn-text)">window grows while events</text>
  <text x="140" y="557.622636233535" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--warn-text)">arrive within gap; closes when</text>
  <text x="140" y="577.320762427911" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--warn-text)">quiet for gap duration</text>

  <rect x="310" y="516.037691206831" width="140" height="43.773637664654" rx="6.22229735763" fill="var(--bg)" stroke="var(--warn-text)" stroke-width="1"/>
  <text x="380" y="543.396187860445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--text)">Session A</text>
  <rect x="510" y="516.037691206831" width="230" height="43.773637664654" rx="6.22229735763" fill="var(--bg)" stroke="var(--warn-text)" stroke-width="1"/>
  <text x="625" y="543.396187860445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--text)">Session B (longer)</text>
  <rect x="820" y="516.037691206831" width="120" height="43.773637664654" rx="6.22229735763" fill="var(--bg)" stroke="var(--warn-text)" stroke-width="1"/>
  <text x="880" y="543.396187860445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--text)">Session C</text>
  <rect x="990" y="516.037691206831" width="170" height="43.773637664654" rx="6.22229735763" fill="var(--bg)" stroke="var(--warn-text)" stroke-width="1"/>
  <text x="1075" y="543.396187860445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.553277509107" fill="var(--text)">Session D</text>

  <text x="720" y="605.773551626911" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.507205618333" fill="var(--warn-text)">session_window($"ts", "10 minutes")  — per user, close after 10 min idle</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1921" font-weight="bold" fill="var(--text)">Window Types in Structured Streaming</text>

  <!-- Tumbling -->
  <rect x="40" y="80.7018" width="1200" height="162.807" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="116.3158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1397" font-weight="bold" fill="var(--primary-text)">Tumbling</text>
  <text x="140" y="141.7544" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--primary-text)">fixed-size,</text>
  <text x="140" y="160.0702" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--primary-text)">non-overlapping</text>
  <text x="140" y="187.5439" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--primary-text)">every event falls</text>
  <text x="140" y="205.8596" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--primary-text)">into exactly one</text>

  <rect x="310" y="157.0175" width="170" height="40.7018" rx="6" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="395" y="182.4561" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--text)">W1 [0..5m)</text>
  <rect x="495" y="157.0175" width="170" height="40.7018" rx="6" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="580" y="182.4561" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--text)">W2 [5..10m)</text>
  <rect x="680" y="157.0175" width="170" height="40.7018" rx="6" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="765" y="182.4561" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--text)">W3 [10..15m)</text>
  <rect x="865" y="157.0175" width="170" height="40.7018" rx="6" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="950" y="182.4561" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--text)">W4 [15..20m)</text>
  <rect x="1050" y="157.0175" width="170" height="40.7018" rx="6" fill="var(--bg)" stroke="var(--primary-text)" stroke-width="1"/>
  <text x="1135" y="182.4561" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--text)">W5 [20..25m)</text>

  <text x="770" y="226.2105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--primary-text)">window($"ts", "5 minutes")</text>

  <!-- Sliding -->
  <rect x="40" y="258.7719" width="1200" height="183.1579" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="294.386" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1397" font-weight="bold" fill="var(--ok-text)">Sliding</text>
  <text x="140" y="319.8246" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--ok-text)">fixed size, slides</text>
  <text x="140" y="338.1404" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--ok-text)">at a smaller step</text>
  <text x="140" y="365.614" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--ok-text)">windows overlap</text>
  <text x="140" y="383.9298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--ok-text)">an event is in multiple</text>

  <rect x="310" y="335.0877" width="350" height="26.4561" rx="6" fill="var(--bg)" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="485" y="353.4035" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--text)">W1 [0..10m)</text>
  <rect x="395" y="365.614" width="350" height="26.4561" rx="6" fill="var(--bg)" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="570" y="383.9298" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--text)">W2 [5..15m)</text>
  <rect x="480" y="396.1404" width="350" height="26.4561" rx="6" fill="var(--bg)" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="655" y="414.4561" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--text)">W3 [10..20m)</text>
  <rect x="565" y="335.0877" width="350" height="26.4561" rx="6" fill="var(--bg)" stroke="var(--ok-text)" stroke-width="1"/>
  <text x="740" y="353.4035" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--text)">W4 [15..25m)</text>

  <text x="770" y="426.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--ok-text)">window($"ts", "10 minutes", "5 minutes")  — (size, slide)</text>

  <!-- Session -->
  <rect x="40" y="457.193" width="1200" height="162.807" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="492.807" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1397" font-weight="bold" fill="var(--warn-text)">Session</text>
  <text x="140" y="518.2456" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--warn-text)">dynamic, per-key</text>
  <text x="140" y="543.6842" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--warn-text)">window grows while events</text>
  <text x="140" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--warn-text)">arrive within gap; closes when</text>
  <text x="140" y="580.3158" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--warn-text)">quiet for gap duration</text>

  <rect x="310" y="523.3333" width="140" height="40.7018" rx="6" fill="var(--bg)" stroke="var(--warn-text)" stroke-width="1"/>
  <text x="380" y="548.7719" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--text)">Session A</text>
  <rect x="510" y="523.3333" width="230" height="40.7018" rx="6" fill="var(--bg)" stroke="var(--warn-text)" stroke-width="1"/>
  <text x="625" y="548.7719" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--text)">Session B (longer)</text>
  <rect x="820" y="523.3333" width="120" height="40.7018" rx="6" fill="var(--bg)" stroke="var(--warn-text)" stroke-width="1"/>
  <text x="880" y="548.7719" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--text)">Session C</text>
  <rect x="990" y="523.3333" width="170" height="40.7018" rx="6" fill="var(--bg)" stroke="var(--warn-text)" stroke-width="1"/>
  <text x="1075" y="548.7719" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1048" fill="var(--text)">Session D</text>

  <text x="720" y="606.7719" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.0961" fill="var(--warn-text)">session_window($"ts", "10 minutes")  — per user, close after 10 min idle</text>
</svg>

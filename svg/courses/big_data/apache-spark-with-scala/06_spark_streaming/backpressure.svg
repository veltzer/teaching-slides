<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--text)">Streaming Backpressure</text>
  <text x="640" y="69.261261261261" text-anchor="middle" font-family="Courier New, monospace" font-size="14.311842258383" fill="var(--text-muted)">spark.streaming.backpressure.enabled = true</text>

  <!-- Pipeline: source, receiver, processing -->
  <rect x="40" y="102.702702702703" width="360" height="188.108108108108" rx="8.178195576219" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--primary-text)">Source</text>
  <text x="220" y="175.855855855856" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Kafka / socket</text>
  <text x="220" y="207.207207207207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Variable rate</text>
  <text x="220" y="249.009009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">maxRatePerPartition caps</text>
  <text x="220" y="273.045045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">initialRate on start</text>

  <rect x="460" y="102.702702702703" width="360" height="188.108108108108" rx="8.178195576219" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--warn-text)">Receiver</text>
  <text x="640" y="175.855855855856" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Rate limited</text>
  <text x="640" y="207.207207207207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Blocks producer</text>
  <text x="640" y="249.009009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">RateEstimator sets target</text>
  <text x="640" y="273.045045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">Updated every batch</text>

  <rect x="880" y="102.702702702703" width="360" height="188.108108108108" rx="8.178195576219" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="139.279279279279" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--ok-text)">Processing</text>
  <text x="1060" y="175.855855855856" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Batch interval 2s</text>
  <text x="1060" y="207.207207207207" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Keep within interval</text>
  <text x="1060" y="249.009009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Reports delays</text>
  <text x="1060" y="273.045045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">StreamingListener feedback</text>

  <line x1="400" y1="196.756756756757" x2="455" y2="196.756756756757" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="196.756756756757" x2="875" y2="196.756756756757" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PID controller -->
  <rect x="40" y="327.387387387387" width="1200" height="292.612612612613" rx="10.222744470273" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="363.963963963964" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.490037834601" font-weight="bold" fill="var(--info-text)">PID Rate Estimator</text>

  <rect x="70" y="395.315315315315" width="270" height="182.882882882883" rx="6.133646682164" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="205" y="428.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--text)">Proportional</text>
  <text x="205" y="463.243243243243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Current error</text>
  <text x="205" y="494.594594594595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Fast response</text>
  <text x="205" y="525.945945945946" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Can overshoot</text>

  <rect x="350" y="395.315315315315" width="270" height="182.882882882883" rx="6.133646682164" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="485" y="428.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--text)">Integral</text>
  <text x="485" y="463.243243243243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Past errors</text>
  <text x="485" y="494.594594594595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Removes drift</text>
  <text x="485" y="525.945945945946" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Slow but stable</text>

  <rect x="630" y="395.315315315315" width="270" height="182.882882882883" rx="6.133646682164" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="765" y="428.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--text)">Derivative</text>
  <text x="765" y="463.243243243243" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Error rate</text>
  <text x="765" y="494.594594594595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Damps oscillation</text>
  <text x="765" y="525.945945945946" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Noisy on jitter</text>

  <rect x="910" y="395.315315315315" width="300" height="182.882882882883" rx="6.133646682164" fill="var(--bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="1060" y="428.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378665599465" font-weight="bold" fill="var(--text)">Output</text>
  <text x="1060" y="463.243243243243" text-anchor="middle" font-family="Courier New, monospace" font-size="12.267293364328" fill="var(--text-muted)">newRate = last - ΔP-ΔI-ΔD</text>
  <text x="1060" y="494.594594594595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">Clamped [min, max]</text>
  <text x="1060" y="525.945945945946" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--text-muted)">RateController on driver</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="71.22807" rx="6.052403" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="84.77193" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.209611" font-weight="bold" fill="var(--primary-text)">Scala Refresher: How the Pieces Fit</text>

  <rect x="40" y="131.578947" width="1200" height="111.929825" rx="6.052403" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="172.280702" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--info-text)">Type system: inference, generics, variance, type classes</text>
  <text x="640" y="212.982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--info-text)">foundation every other feature builds on</text>

  <rect x="40" y="263.859649" width="385" height="162.807018" rx="6.052403" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="232" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--ok-text)">Functions</text>
  <text x="232" y="340.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--ok-text)">first-class values</text>
  <text x="232" y="370.701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--ok-text)">higher-order composition</text>
  <text x="232" y="401.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--ok-text)">lambdas, currying</text>

  <rect x="447" y="263.859649" width="385" height="162.807018" rx="6.052403" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--warn-text)">Collections</text>
  <text x="640" y="340.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--warn-text)">immutable by default</text>
  <text x="640" y="370.701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--warn-text)">uniform API (map/filter/fold)</text>
  <text x="640" y="401.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--warn-text)">List, Vector, Map, Set</text>

  <rect x="855" y="263.859649" width="385" height="162.807018" rx="6.052403" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1047" y="304.561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--danger-text)">OO + Traits</text>
  <text x="1047" y="340.175439" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--danger-text)">class / object / case class</text>
  <text x="1047" y="370.701754" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--danger-text)">trait mixins for reuse</text>
  <text x="1047" y="401.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--danger-text)">pattern matching</text>

  <rect x="40" y="447.017544" width="590" height="172.982456" rx="6.052403" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="335" y="487.719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--primary-text)">Concurrency: Future, ExecutionContext</text>
  <text x="335" y="528.421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--primary-text)">non-blocking composition with map/flatMap</text>
  <text x="335" y="564.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--primary-text)">for-comprehensions over Futures</text>
  <text x="335" y="599.649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--primary-text)">foundation for Akka, Spark drivers</text>

  <rect x="650" y="447.017544" width="590" height="172.982456" rx="6.052403" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="945" y="487.719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--info-text)">Why this matters for Spark</text>
  <text x="945" y="528.421053" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--info-text)">RDD/Dataset API mirrors Scala collections</text>
  <text x="945" y="564.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--info-text)">immutability enables safe parallelism</text>
  <text x="945" y="599.649123" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--info-text)">closures serialize across the cluster</text>

  <line x1="640" y1="243.508772" x2="232" y2="263.859649" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="243.508772" x2="640" y2="263.859649" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="243.508772" x2="1047" y2="263.859649" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

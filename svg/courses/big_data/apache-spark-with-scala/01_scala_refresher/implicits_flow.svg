<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="280" height="203.508772" rx="6.052403" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="106.140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--primary-text)">Call site</text>
  <text x="180" y="162.105263" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--primary-text)">missing parameter</text>
  <text x="180" y="212.982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--primary-text)">foo(x)(implicit e)</text>

  <rect x="370" y="40" width="280" height="203.508772" rx="6.052403" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="106.140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--warn-text)">Compiler search</text>
  <text x="510" y="162.105263" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--warn-text)">scans imports,</text>
  <text x="510" y="187.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--warn-text)">companions</text>

  <rect x="700" y="40" width="280" height="203.508772" rx="6.052403" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="106.140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--ok-text)">Injection</text>
  <text x="840" y="162.105263" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--ok-text)">compiler inserts</text>
  <text x="840" y="187.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--ok-text)">resolved value</text>

  <rect x="1000" y="40" width="240" height="203.508772" rx="6.052403" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="106.140351" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143" font-weight="bold" fill="var(--info-text)">Runtime</text>
  <text x="1120" y="162.105263" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--info-text)">executes with</text>
  <text x="1120" y="187.54386" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131007" fill="var(--info-text)">injected arg</text>

  <line x1="320" y1="141.754386" x2="370" y2="141.754386" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="650" y1="141.754386" x2="700" y2="141.754386" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="980" y1="141.754386" x2="1000" y2="141.754386" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="274.035088" width="590" height="345.964912" rx="6.052403" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="335" y="335.087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174676" font-weight="bold" fill="var(--text)">Uses</text>
  <text x="335" y="401.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--text-muted)">Type class instances</text>
  <text x="335" y="447.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--text-muted)">Extension methods</text>
  <text x="335" y="492.807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--text-muted)">Spark Encoders</text>
  <text x="335" y="564.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--text-faint)">Scala 3: given/using.</text>

  <rect x="650" y="274.035088" width="590" height="345.964912" rx="6.052403" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="335.087719" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174676" font-weight="bold" fill="var(--danger-text)">Pitfalls</text>
  <text x="945" y="401.22807" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--danger-text)">Ambiguous instances</text>
  <text x="945" y="447.017544" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--danger-text)">Hidden control flow</text>
  <text x="945" y="492.807018" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139741" fill="var(--danger-text)">Missing imports</text>
  <text x="945" y="564.035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273" fill="var(--danger-text)">Prefer explicit.</text>
</svg>

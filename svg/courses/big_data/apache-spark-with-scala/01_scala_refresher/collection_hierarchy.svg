<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--primary-text)">Traversable (root of Scala collections)</text>

  <rect x="40" y="160" width="590" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">Iterable</text>

  <rect x="650" y="160" width="590" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">(shared via Iterable)</text>

  <line x1="640" y1="120" x2="335" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="120" x2="945" y2="160" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="280" width="380" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Seq (ordered)</text>

  <rect x="450" y="280" width="380" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Set (unique)</text>

  <rect x="860" y="280" width="380" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Map (key to value)</text>

  <rect x="40" y="400" width="185" height="100" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="132" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">IndexedSeq</text>
  <text x="132" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Vector, Array</text>

  <rect x="235" y="400" width="185" height="100" rx="6" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="327" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">LinearSeq</text>
  <text x="327" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">List, Stream</text>

  <rect x="450" y="400" width="380" height="100" rx="6" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">HashSet, TreeSet</text>
  <text x="640" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">BitSet, ListSet</text>

  <rect x="860" y="400" width="380" height="100" rx="6" fill="var(--surface)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1050" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">HashMap, TreeMap</text>
  <text x="1050" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">ListMap, SortedMap</text>

  <rect x="40" y="520" width="1200" height="100" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Immutable by default under scala.collection.immutable</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-faint)">Mutable variants live under scala.collection.mutable</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Control Structures Are Expressions</text>

  <rect x="40" y="130" width="390" height="230" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">if / else</text>
  <text x="235" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">val x = if (c) a else b</text>
  <text x="235" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">returns a value</text>
  <text x="235" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">no ternary operator</text>
  <text x="235" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">type is lub of branches</text>
  <text x="235" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">omitting else gives Unit</text>

  <rect x="445" y="130" width="390" height="230" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">for-comprehension</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">for (x &lt;- xs if p) yield f(x)</text>
  <text x="640" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">desugars to flatMap / map</text>
  <text x="640" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">multiple generators supported</text>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">guards filter results</text>
  <text x="640" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">no yield returns Unit</text>

  <rect x="850" y="130" width="390" height="230" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">match</text>
  <text x="1045" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">x match { case p =&gt; ... }</text>
  <text x="1045" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">exhaustiveness checked</text>
  <text x="1045" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">destructures data</text>
  <text x="1045" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">guards via if</text>
  <text x="1045" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">replaces switch</text>

  <rect x="40" y="380" width="590" height="240" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">while / do-while</text>
  <text x="335" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">returns Unit (side effects)</text>
  <text x="335" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">needs var for counters</text>
  <text x="335" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">prefer recursion or fold</text>
  <text x="335" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">idiomatic Scala avoids them</text>
  <text x="335" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">use when JVM performance demands it</text>

  <rect x="650" y="380" width="590" height="240" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">try / catch / finally</text>
  <text x="945" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">expression: returns a value</text>
  <text x="945" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">catch is a pattern match</text>
  <text x="945" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">finally runs always</text>
  <text x="945" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">Try / Either preferred</text>
  <text x="945" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">exceptions via throw new ...</text>
</svg>

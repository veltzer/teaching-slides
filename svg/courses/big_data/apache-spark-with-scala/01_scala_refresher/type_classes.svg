<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="380" height="260" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">1. Define trait</text>
  <text x="230" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">trait Show[A] {</text>
  <text x="230" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">  def show(a: A): String</text>
  <text x="230" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">}</text>
  <text x="230" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">contract</text>

  <rect x="450" y="40" width="380" height="260" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">2. Instances</text>
  <text x="640" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">implicit val intShow:</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">  Show[Int] =</text>
  <text x="640" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">  _.toString</text>
  <text x="640" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">one per type</text>

  <rect x="860" y="40" width="380" height="260" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">3. Context bound</text>
  <text x="1050" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">def p[A: Show]</text>
  <text x="1050" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">  (a: A) =</text>
  <text x="1050" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">  println(a.show)</text>
  <text x="1050" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">auto lookup</text>

  <line x1="420" y1="170" x2="450" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="170" x2="860" y2="170" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="330" width="590" height="290" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Ad-hoc polymorphism</text>
  <text x="335" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Extend types you</text>
  <text x="335" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">do not own.</text>
  <text x="335" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Foundation of cats, scalaz.</text>

  <rect x="650" y="330" width="590" height="290" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">When to use</text>
  <text x="945" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Ordering, Numeric, Encoder</text>
  <text x="945" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Serialize, compare, print</text>
  <text x="945" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Scala 3: given/using.</text>
</svg>

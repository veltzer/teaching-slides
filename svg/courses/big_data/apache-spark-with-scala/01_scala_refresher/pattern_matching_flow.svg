<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Pattern Matching: Dispatch on Shape</text>

  <rect x="40" y="140" width="260" height="320" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="170" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Input</text>
  <text x="170" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">x match {</text>
  <text x="170" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">any value of type T</text>
  <text x="170" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">scrutinee evaluated once</text>
  <text x="170" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">cases tried top-down</text>
  <text x="170" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">first match wins</text>
  <text x="170" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">MatchError if none</text>

  <rect x="320" y="140" width="280" height="150" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="460" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Literal / wildcard</text>
  <text x="460" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">case 0 =&gt; ...</text>
  <text x="460" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">case _ =&gt; default</text>
  <text x="460" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">constant checks</text>

  <rect x="320" y="310" width="280" height="150" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="460" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Variable binding</text>
  <text x="460" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">case n: Int =&gt; n + 1</text>
  <text x="460" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">lowercase binds</text>
  <text x="460" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">backticks quote constants</text>

  <rect x="620" y="140" width="280" height="150" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="760" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Constructor</text>
  <text x="760" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">case Some(x) =&gt; ...</text>
  <text x="760" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">case Point(x, y) =&gt; ...</text>
  <text x="760" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">uses unapply method</text>

  <rect x="620" y="310" width="280" height="150" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="760" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Sequence</text>
  <text x="760" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">case List(a, b, _*) =&gt;</text>
  <text x="760" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">case x :: rest =&gt; ...</text>
  <text x="760" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">destructures lists</text>

  <rect x="920" y="140" width="320" height="150" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1080" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Type / guard</text>
  <text x="1080" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">case s: String =&gt; ...</text>
  <text x="1080" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">case n if n &gt; 0 =&gt; ...</text>
  <text x="1080" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">refines further</text>

  <rect x="920" y="310" width="320" height="150" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1080" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Alternatives</text>
  <text x="1080" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">case 1 | 2 | 3 =&gt; ...</text>
  <text x="1080" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">no bound names allowed</text>
  <text x="1080" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">merges cases</text>

  <line x1="300" y1="220" x2="318" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="380" x2="318" y2="380" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="220" x2="618" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="380" x2="618" y2="380" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="220" x2="918" y2="220" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="380" x2="918" y2="380" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="480" width="1200" height="140" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">exhaustiveness warning on sealed ADTs</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">compiler lists forgotten cases at compile time</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">pattern matching also works in val, for, and catch</text>
</svg>

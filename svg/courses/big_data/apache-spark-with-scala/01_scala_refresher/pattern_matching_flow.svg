<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Pattern Matching: Dispatch on Shape</text>

  <rect x="40" y="130" width="260" height="300" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Input</text>
  <text x="170" y="215" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--info-text)">x match { ... }</text>
  <text x="170" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">evaluated once</text>
  <text x="170" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">cases top-down</text>
  <text x="170" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">first match wins</text>
  <text x="170" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">MatchError if none</text>

  <rect x="320" y="130" width="280" height="140" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Literal / wildcard</text>
  <text x="460" y="210" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">case 0 =&gt; ...</text>
  <text x="460" y="240" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">case _ =&gt; default</text>

  <rect x="320" y="290" width="280" height="140" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Variable binding</text>
  <text x="460" y="370" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--warn-text)">case n: Int =&gt; n+1</text>
  <text x="460" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">lowercase binds</text>

  <rect x="620" y="130" width="280" height="140" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Constructor</text>
  <text x="760" y="210" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">case Some(x) =&gt; ...</text>
  <text x="760" y="240" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">case Point(x,y) =&gt; ...</text>

  <rect x="620" y="290" width="280" height="140" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Sequence</text>
  <text x="760" y="370" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--primary-text)">case x :: rest =&gt; ...</text>
  <text x="760" y="400" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--primary-text)">case List(a,b,_*) =&gt;</text>

  <rect x="920" y="130" width="320" height="140" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Type / guard</text>
  <text x="1080" y="210" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--info-text)">case s: String =&gt; ...</text>
  <text x="1080" y="240" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--info-text)">case n if n&gt;0 =&gt; ...</text>

  <rect x="920" y="290" width="320" height="140" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Alternatives</text>
  <text x="1080" y="370" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--warn-text)">case 1 | 2 | 3 =&gt; ...</text>
  <text x="1080" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">merges cases</text>

  <line x1="300" y1="200" x2="318" y2="200" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="300" y1="360" x2="318" y2="360" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="600" y1="200" x2="618" y2="200" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="600" y1="360" x2="618" y2="360" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="900" y1="200" x2="918" y2="200" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="900" y1="360" x2="918" y2="360" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="40" y="460" width="1200" height="160" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Sealed ADTs: exhaustiveness checked</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-faint)">compiler lists forgotten cases</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-faint)">also works in val, for, catch</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Scala String Operations</text>

  <rect x="40" y="130" width="390" height="210" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="235" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Interpolators</text>
  <text x="235" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">s"hi $name"</text>
  <text x="235" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">f"$x%.2f" printf-style</text>
  <text x="235" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">raw"..." no escapes</text>
  <text x="235" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">custom StringContext impls</text>
  <text x="235" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">compiled to concat</text>

  <rect x="445" y="130" width="390" height="210" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Core methods</text>
  <text x="640" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">length, charAt, substring</text>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">toUpperCase, trim, replace</text>
  <text x="640" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">split, startsWith, contains</text>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">mkString from collections</text>
  <text x="640" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">java.lang.String under the hood</text>

  <rect x="850" y="130" width="390" height="210" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1045" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">StringOps</text>
  <text x="1045" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">string behaves as Seq[Char]</text>
  <text x="1045" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">map, filter, reverse</text>
  <text x="1045" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">stripMargin for heredocs</text>
  <text x="1045" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">lines, grouped, sliding</text>
  <text x="1045" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">implicit conversion</text>

  <rect x="40" y="360" width="590" height="130" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="335" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Regex: "pat".r</text>
  <text x="335" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">findAllIn, findFirstMatchIn</text>
  <text x="335" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">regex unapply in match blocks</text>

  <rect x="650" y="360" width="590" height="130" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="945" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Multi-line / triple-quoted</text>
  <text x="945" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">""" ... """ spans lines</text>
  <text x="945" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">combine with stripMargin('|')</text>

  <rect x="40" y="510" width="1200" height="110" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-text)">val name = "Alice"; s"hello, $name!" : String</text>
  <text x="640" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">prefer interpolators over concatenation for clarity and performance</text>
  <text x="640" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">strings are immutable; use StringBuilder for heavy concat loops</text>
</svg>

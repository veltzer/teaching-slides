<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="390" height="266.8" rx="8.616263691416" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="92.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.848791074246" font-weight="bold" fill="var(--info-text)">def method</text>
  <text x="235" y="144.4" text-anchor="middle" font-family="Courier New, monospace" font-size="17.23252738283" fill="var(--info-text)">def add(a,b): Int</text>
  <text x="235" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--info-text)">bound to class</text>
  <text x="235" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--info-text)">not a value</text>
  <text x="235" y="266.199999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--info-text)">eta-expanded</text>

  <rect x="445" y="40" width="390" height="266.8" rx="8.616263691416" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="92.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.848791074246" font-weight="bold" fill="var(--ok-text)">Function value</text>
  <text x="640" y="144.4" text-anchor="middle" font-family="Courier New, monospace" font-size="17.23252738283" fill="var(--ok-text)">(a,b) =&gt; a + b</text>
  <text x="640" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--ok-text)">FunctionN instance</text>
  <text x="640" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--ok-text)">first-class value</text>
  <text x="640" y="266.199999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--ok-text)">closes scope</text>

  <rect x="850" y="40" width="390" height="266.8" rx="8.616263691416" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="92.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.848791074246" font-weight="bold" fill="var(--warn-text)">PartialFunction</text>
  <text x="1045" y="144.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--warn-text)">defined on subset</text>
  <text x="1045" y="185" text-anchor="middle" font-family="Courier New, monospace" font-size="17.23252738283" fill="var(--warn-text)">isDefinedAt / apply</text>
  <text x="1045" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--warn-text)">case blocks</text>
  <text x="1045" y="266.199999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--warn-text)">chains via orElse</text>

  <rect x="40" y="341.6" width="590" height="278.4" rx="8.616263691416" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="393.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725151391" font-weight="bold" fill="var(--danger-text)">Curried / higher-order</text>
  <text x="335" y="446" text-anchor="middle" font-family="Courier New, monospace" font-size="17.23252738283" fill="var(--danger-text)">def f(a)(b) = ...</text>
  <text x="335" y="486.600000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--danger-text)">returns function</text>
  <text x="335" y="527.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--danger-text)">partial application</text>
  <text x="335" y="573.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--danger-text)">fluent DSLs</text>

  <rect x="650" y="341.6" width="590" height="278.4" rx="8.616263691416" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="393.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.694725151391" font-weight="bold" fill="var(--primary-text)">By-name / call-by-need</text>
  <text x="945" y="446" text-anchor="middle" font-family="Courier New, monospace" font-size="17.23252738283" fill="var(--primary-text)">def when(p: =&gt; Boolean)</text>
  <text x="945" y="486.600000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--primary-text)">re-evaluated each use</text>
  <text x="945" y="527.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--primary-text)">lazy val caches</text>
  <text x="945" y="573.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--primary-text)">custom control</text>
</svg>

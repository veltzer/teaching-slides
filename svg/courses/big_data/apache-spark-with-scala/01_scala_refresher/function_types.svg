<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Function Types in Scala</text>

  <rect x="40" y="130" width="390" height="230" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">def method</text>
  <text x="235" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">def add(a: Int, b: Int): Int</text>
  <text x="235" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">lives on a class or object</text>
  <text x="235" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">not a value itself</text>
  <text x="235" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">can be generic, curried</text>
  <text x="235" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">eta-expanded to a function</text>

  <rect x="445" y="130" width="390" height="230" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">Function value</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">(a: Int, b: Int) =&gt; a + b</text>
  <text x="640" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">instance of FunctionN</text>
  <text x="640" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">passed, stored, returned</text>
  <text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">SAM-friendly lambda</text>
  <text x="640" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">closes over its lexical scope</text>

  <rect x="850" y="130" width="390" height="230" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">PartialFunction</text>
  <text x="1045" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">defined only for some inputs</text>
  <text x="1045" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">isDefinedAt / apply</text>
  <text x="1045" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">case blocks in collect</text>
  <text x="1045" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">chainable with orElse</text>
  <text x="1045" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">used in Akka receive</text>

  <rect x="40" y="380" width="590" height="240" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Curried / higher-order</text>
  <text x="335" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">def f(a: Int)(b: Int) = ...</text>
  <text x="335" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">returns a function of remaining args</text>
  <text x="335" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">enables partial application</text>
  <text x="335" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">higher-order: Int =&gt; Int =&gt; Int</text>
  <text x="335" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">clean DSLs, fluent APIs</text>

  <rect x="650" y="380" width="590" height="240" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">By-name / call-by-need</text>
  <text x="945" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">def when(p: =&gt; Boolean)(b: =&gt; Unit)</text>
  <text x="945" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">argument evaluated on each use</text>
  <text x="945" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">lazy val caches the first result</text>
  <text x="945" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">builds custom control structures</text>
  <text x="945" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">used by assert, synchronized</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Error Handling: Three Levels of Safety</text>

  <rect x="40" y="130" width="390" height="210" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--danger-text)">throw / try-catch</text>
  <text x="235" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">JVM exceptions</text>
  <text x="235" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">unchecked in Scala</text>
  <text x="235" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">side channel, breaks flow</text>
  <text x="235" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">interop with Java only</text>

  <rect x="445" y="130" width="390" height="210" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">Try[T]</text>
  <text x="640" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Success(value)</text>
  <text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Failure(throwable)</text>
  <text x="640" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">wraps exceptions as values</text>
  <text x="640" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">composes with map/flatMap</text>

  <rect x="850" y="130" width="390" height="210" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">Either[L, R]</text>
  <text x="1045" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Left(error)</text>
  <text x="1045" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">Right(value)</text>
  <text x="1045" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">typed error, no stack trace</text>
  <text x="1045" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">right-biased in 2.12+</text>

  <rect x="40" y="360" width="390" height="120" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Option[T]</text>
  <text x="235" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Some(x) / None</text>
  <text x="235" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">for absence, not errors</text>

  <rect x="445" y="360" width="390" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Future[T]</text>
  <text x="640" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">async Try[T]</text>
  <text x="640" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">onComplete / recover</text>

  <rect x="850" y="360" width="390" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1045" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Validated / IO</text>
  <text x="1045" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">cats, ZIO ecosystems</text>
  <text x="1045" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">accumulate errors</text>

  <rect x="40" y="500" width="1200" height="120" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Prefer Try and Either over exceptions for business logic</text>
  <text x="640" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text-faint)">exceptions are expensive, non-local, and invisible in signatures</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Either encodes the failure type in the signature itself</text>
</svg>

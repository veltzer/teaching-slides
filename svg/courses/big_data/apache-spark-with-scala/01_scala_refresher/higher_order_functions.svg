<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="290" height="270" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="185" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">map</text>
  <text x="185" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">transform 1-to-1</text>
  <text x="185" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">xs.map(_ * 2)</text>
  <text x="185" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">A =&gt; B</text>

  <rect x="350" y="40" width="290" height="270" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="495" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--ok-text)">filter</text>
  <text x="495" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">keep by predicate</text>
  <text x="495" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">xs.filter(_ &gt; 0)</text>
  <text x="495" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">A =&gt; Boolean</text>

  <rect x="660" y="40" width="290" height="270" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="805" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--warn-text)">flatMap</text>
  <text x="805" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">one-to-many</text>
  <text x="805" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">xs.flatMap(...)</text>
  <text x="805" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">A =&gt; Seq[B]</text>

  <rect x="970" y="40" width="270" height="270" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1105" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--info-text)">reduce</text>
  <text x="1105" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">combine pairs</text>
  <text x="1105" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">xs.reduce(_+_)</text>
  <text x="1105" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">(A,A) =&gt; A</text>

  <rect x="40" y="340" width="1200" height="280" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Functions as first-class values</text>
  <text x="640" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Pass, return, store; lambda: x =&gt; x * 2 or _ * 2.</text>
  <text x="640" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Chain on collections and Spark pipelines.</text>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">RDD.map, DataFrame.filter.</text>
</svg>

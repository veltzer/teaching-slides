<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="290" height="230" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--info-text)">class</text>
  <text x="185" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">constructor args</text>
  <text x="185" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">mutable state</text>
  <text x="185" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">inheritance</text>
  <text x="185" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">visibility modifiers</text>

  <rect x="340" y="40" width="290" height="230" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-text)">case class</text>
  <text x="485" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">immutable fields</text>
  <text x="485" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">auto equals, copy</text>
  <text x="485" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">pattern-matchable</text>
  <text x="485" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">data containers</text>

  <rect x="640" y="40" width="290" height="230" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--warn-text)">trait</text>
  <text x="785" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">interface + mixin</text>
  <text x="785" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">concrete + abstract</text>
  <text x="785" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">stackable</text>
  <text x="785" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">multiple inheritance</text>

  <rect x="940" y="40" width="300" height="230" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--danger-text)">object</text>
  <text x="1090" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">singleton instance</text>
  <text x="1090" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">companion factory</text>
  <text x="1090" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">apply, unapply</text>
  <text x="1090" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">replaces Java static</text>

  <rect x="40" y="300" width="590" height="140" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">sealed / abstract</text>
  <text x="335" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">sealed: exhaustive match</text>
  <text x="335" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">abstract class: ctor args</text>

  <rect x="650" y="300" width="590" height="140" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">enum (Scala 3)</text>
  <text x="945" y="385" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--info-text)">enum Color { case Red, Green }</text>
  <text x="945" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">ADT shorthand</text>

  <rect x="40" y="470" width="1200" height="150" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Any splits into AnyVal and AnyRef</text>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">Nothing bottoms the lattice</text>
  <text x="640" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">every value is an object</text>
</svg>

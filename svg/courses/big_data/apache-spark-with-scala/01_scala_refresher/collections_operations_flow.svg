<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--primary-text)">Collections Pipeline: Source to Result</text>

  <rect x="40" y="140" width="220" height="180" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Source</text>
  <text x="150" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">List(1,2,3,4,5)</text>
  <text x="150" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">Vector, Range</text>
  <text x="150" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">any Iterable</text>

  <rect x="290" y="140" width="220" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Transform</text>
  <text x="400" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">map flatMap</text>
  <text x="400" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">filter collect</text>
  <text x="400" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">returns same shape</text>

  <rect x="540" y="140" width="220" height="180" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Aggregate</text>
  <text x="650" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">groupBy partition</text>
  <text x="650" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">sortBy zip</text>
  <text x="650" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">reshapes elements</text>

  <rect x="790" y="140" width="220" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Reduce</text>
  <text x="900" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">foldLeft reduce</text>
  <text x="900" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">sum count min</text>
  <text x="900" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">collapses to scalar</text>

  <rect x="1040" y="140" width="200" height="180" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Result</text>
  <text x="1140" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">new collection</text>
  <text x="1140" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">or value</text>
  <text x="1140" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">immutable by default</text>

  <line x1="260" y1="230" x2="288" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="230" x2="538" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="230" x2="788" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010" y1="230" x2="1038" y2="230" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="360" width="1200" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Lazy view: .view chains without intermediates</text>
  <text x="640" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">LazyList / Iterator also defer until forced by a terminal op</text>

  <rect x="40" y="480" width="1200" height="140" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">xs.map(_ * 2).filter(_ &gt; 4).groupBy(_ % 3).view.force</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">transforms chain left to right, each returning a new collection</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">terminal operations trigger evaluation and return a concrete value</text>
</svg>

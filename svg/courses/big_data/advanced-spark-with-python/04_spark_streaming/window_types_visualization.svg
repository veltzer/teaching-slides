<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6189" font-weight="bold" fill="var(--primary-accent)">Tumbling Window (5 min, no overlap)</text>
  <line x1="40" y1="80.8976" x2="1240" y2="80.8976" stroke="var(--text-faint)" stroke-width="1.8907"/>
  <text x="40" y="108.7822" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text-muted)">0</text>
  <text x="275.7143" y="108.7822" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text-muted)">5</text>
  <text x="511.4285" y="108.7822" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text-muted)">10</text>
  <text x="747.1428" y="108.7822" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text-muted)">15</text>
  <text x="982.8572" y="108.7822" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text-muted)">20</text>
  <rect x="40" y="118.077" width="231.4286" height="40.8974" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.7143" y="145.9616" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Win 1</text>
  <rect x="275.7143" y="118.077" width="231.4286" height="40.8974" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="391.4285" y="145.9616" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Win 2</text>
  <rect x="511.4285" y="118.077" width="231.4286" height="40.8974" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="627.1429" y="145.9616" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Win 3</text>
  <rect x="747.1428" y="118.077" width="231.4286" height="40.8974" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="862.8572" y="145.9616" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Win 4</text>
  <rect x="982.8572" y="118.077" width="231.4286" height="40.8974" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.5715" y="145.9616" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Win 5</text>
  <text x="640" y="220.3206" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6189" font-weight="bold" fill="var(--ok-accent)">Sliding Window (10 min window, 5 min slide)</text>
  <line x1="40" y1="248.2052" x2="1240" y2="248.2052" stroke="var(--text-faint)" stroke-width="1.8907"/>
  <rect x="40" y="266.795" width="467.1428" height="37.1794" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" filter="url(#shadow)"/>
  <text x="273.5714" y="294.6796" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Win 1</text>
  <rect x="275.7143" y="307.6923" width="467.1428" height="37.1794" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" filter="url(#shadow)"/>
  <text x="509.2857" y="335.5769" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Win 2</text>
  <rect x="511.4285" y="348.5898" width="467.1428" height="37.1794" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" filter="url(#shadow)"/>
  <text x="745" y="376.4744" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Win 3</text>
  <rect x="747.1428" y="389.4873" width="467.1428" height="37.1794" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" filter="url(#shadow)"/>
  <text x="980.7143" y="417.3719" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Win 4</text>
  <text x="640" y="452.6924" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text-faint)">(overlap between consecutive windows)</text>
  <text x="640" y="499.1667" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6189" font-weight="bold" fill="var(--info-accent)">Session Window (5 min gap)</text>
  <line x1="40" y1="527.0513" x2="1240" y2="527.0513" stroke="var(--text-faint)" stroke-width="1.8907"/>
  <rect x="74.9743" y="515.451" width="15.7656" height="15.7656" rx="7.8828" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="160.689" y="515.451" width="15.7656" height="15.7656" rx="7.8828" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="224.974" y="515.451" width="15.7656" height="15.7656" rx="7.8828" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="653.546" y="515.451" width="15.7656" height="15.7656" rx="7.8828" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="717.831" y="515.451" width="15.7656" height="15.7656" rx="7.8828" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="910.689" y="515.451" width="15.7656" height="15.7656" rx="7.8828" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="996.403" y="515.451" width="15.7656" height="15.7656" rx="7.8828" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="1060.69" y="515.451" width="15.7656" height="15.7656" rx="7.8828" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="40" y="545.641" width="257.1428" height="37.1794" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.5714" y="571.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Session 1</text>
  <rect x="607.8572" y="545.641" width="171.4285" height="37.1794" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="693.5714" y="571.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Sess 2</text>
  <rect x="875.7143" y="545.641" width="235.7143" height="37.1794" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="993.5714" y="571.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text)">Session 3</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6481" fill="var(--text-faint)">(gap &gt; 5min triggers new session)</text>
</svg>

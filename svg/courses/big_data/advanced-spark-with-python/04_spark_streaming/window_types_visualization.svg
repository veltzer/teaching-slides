  <circle cx="907.5529" cy="539.1516" r="7.563" fill="var(--info-fill)" />
  <circle cx="964.275" cy="539.1516" r="7.563" fill="var(--info-fill)" />
  <rect x="56.7221" y="562.4242" width="226.8882" height="38.7878" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="170.1662" y="589.5758" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Session 1</text>
  <rect x="557.767" y="562.4242" width="151.2588" height="38.7878" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="633.3964" y="589.5758" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Sess 2</text>
  <rect x="794.1089" y="562.4242" width="207.9809" height="38.7878" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="898.0993" y="589.5758" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Session 3</text>
  <text x="586.128" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text-faint)">(gap &gt; 5min triggers new session)</text>
</svg>
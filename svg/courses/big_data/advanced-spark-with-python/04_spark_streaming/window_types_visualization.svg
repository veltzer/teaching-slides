  <line x1="40" y1="219.999955481556" x2="1240" y2="219.999955481556" stroke="var(--text-faint)" stroke-width="1.8907"/>
  <rect x="40" y="240.000022259222" width="467.1428" height="39.999918382853" rx="6.223427212756" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" filter="url(#shadow)"/>
  <text x="273.5714" y="270.000014839481" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Win 1</text>

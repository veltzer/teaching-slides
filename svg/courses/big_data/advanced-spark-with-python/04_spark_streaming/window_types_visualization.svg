  <text x="862.8572" y="109.999910963112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Win 4</text>
  <rect x="982.8572" y="79.999918382853" width="231.4286" height="43.999974772882" rx="6.223427212756" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.5715" y="109.999910963112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Win 5</text>

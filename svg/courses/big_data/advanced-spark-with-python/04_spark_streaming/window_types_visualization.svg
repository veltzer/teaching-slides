  <text x="888.6457" y="106.6667" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text-muted)">20</text>
  <rect x="56.7221" y="116.3636" width="204.1994" height="42.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="158.8218" y="145.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Win 1</text>
  <rect x="264.703" y="116.3636" width="204.1994" height="42.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="366.8026" y="145.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Win 2</text>
  <rect x="472.6838" y="116.3636" width="204.1994" height="42.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="574.7836" y="145.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Win 3</text>
  <rect x="680.6647" y="116.3636" width="204.1994" height="42.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="782.7645" y="145.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Win 4</text>
  <rect x="888.6457" y="116.3636" width="204.1994" height="42.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="990.7454" y="145.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Win 5</text>
  <text x="586.128" y="223.0303" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.5796" font-weight="bold" fill="var(--ok-accent)">Sliding Window (10 min window, 5 min slide)</text>
  <line x1="56.7221" y1="252.1212" x2="1115.5339" y2="252.1212" stroke="var(--text-faint)" stroke-width="1.8907" />
  <rect x="56.7221" y="271.5152" width="412.1803" height="38.7878" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" />
  <text x="262.8122" y="300.6061" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Win 1</text>
  <rect x="264.703" y="314.1818" width="412.1803" height="38.7878" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" />
  <text x="470.7931" y="343.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Win 2</text>
  <rect x="472.6838" y="356.8485" width="412.1803" height="38.7878" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" />
  <text x="678.774" y="385.9394" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Win 3</text>
  <rect x="680.6647" y="399.5152" width="412.1803" height="38.7878" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" />
  <text x="886.7549" y="428.6061" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text)">Win 4</text>
  <text x="586.128" y="465.4546" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6888" fill="var(--text-faint)">(overlap between consecutive windows)</text>
  <text x="586.128" y="513.9394" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.5796" font-weight="bold" fill="var(--info-accent)">Session Window (5 min gap)</text>
  <line x1="56.7221" y1="543.0303" x2="1115.5339" y2="543.0303" stroke="var(--text-faint)" stroke-width="1.8907" />
  <circle cx="94.5368" cy="539.1516" r="7.563" fill="var(--info-fill)" />

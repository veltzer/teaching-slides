  <rect x="40" y="539.999948061815" width="257.1428" height="39.999918382853" rx="6.223427212756" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168.5714" y="568.0000200333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Session 1</text>
  <rect x="607.8572" y="539.999948061815" width="171.4285" height="39.999918382853" rx="6.223427212756" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="693.5714" y="568.0000200333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Sess 2</text>
  <rect x="875.7143" y="539.999948061815" width="235.7143" height="39.999918382853" rx="6.223427212756" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="993.5714" y="568.0000200333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Session 3</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text-faint)">(gap &gt; 5min triggers new session)</text>

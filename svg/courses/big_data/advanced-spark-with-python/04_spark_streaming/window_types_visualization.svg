  <rect x="40" y="79.999918382853" width="231.4286" height="43.999974772882" rx="6.223427212756" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.7143" y="109.999910963112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Win 1</text>

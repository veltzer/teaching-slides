  <text x="509.2857" y="313.999882026123" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Win 2</text>
  <rect x="511.4285" y="327.999971804986" width="467.1428" height="39.999918382853" rx="6.223427212756" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" filter="url(#shadow)"/>
  <text x="745" y="357.999964385245" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Win 3</text>
  <rect x="747.1428" y="372.000054164107" width="467.1428" height="39.999918382853" rx="6.223427212756" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" fill-opacity="0.7" filter="url(#shadow)"/>
  <text x="980.7143" y="402.000046744366" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.528704844995" fill="var(--text)">Win 4</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-ts" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9532" font-weight="bold" fill="var(--text)">Testing Strategies for Streaming</text>
  <rect x="74.8538" y="471.5789" width="449.1228" height="117.8947" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="299.4152" y="522.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="var(--ok-accent)">Unit Tests</text>
  <text x="299.4152" y="555.7895" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Transform functions, UDFs, schema validation</text>
  <text x="299.4152" y="581.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-faint)">Fast, isolated, no Spark context needed</text>
  <rect x="134.7368" y="328.4211" width="329.3567" height="117.8947" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="299.4152" y="378.9474" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="var(--primary-accent)">Integration Tests</text>
  <text x="299.4152" y="412.6316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">MemoryStream, local SparkSession</text>
  <text x="299.4152" y="437.8947" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-faint)">Test full pipeline logic</text>
  <rect x="194.6199" y="193.6842" width="209.5906" height="109.4737" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="299.4152" y="239.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="var(--warn-accent)">E2E Tests</text>
  <text x="299.4152" y="272.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Docker + Kafka</text>
  <text x="299.4152" y="294.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-faint)">Full stack</text>
  <text x="299.4152" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--text-faint)">Test Pyramid</text>
  <rect x="598.8304" y="92.6316" width="553.9181" height="176.8421" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="875.7895" y="131.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">Unit Test Approach</text>
  <text x="628.7719" y="168.4211" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">1. Test transformation logic separately</text>
  <text x="628.7719" y="198.7368" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">2. Use static DataFrames as input</text>
  <text x="628.7719" y="229.0526" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">3. Verify output schema and values</text>
  <text x="628.7719" y="259.3684" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">4. Test edge cases (nulls, empty, malformed)</text>
  <rect x="598.8304" y="294.7368" width="553.9181" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="875.7895" y="333.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="var(--primary-accent)">Integration Test Approach</text>
  <text x="628.7719" y="367.1579" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">1. Use MemoryStream as test source</text>
  <text x="628.7719" y="397.4737" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">2. Add test data with addData()</text>
  <text x="628.7719" y="427.7895" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">3. processAllAvailable() to advance</text>
  <text x="628.7719" y="441.2632" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">4. Assert output with MemorySink</text>
  <rect x="598.8304" y="480" width="553.9181" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="875.7895" y="518.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="var(--warn-accent)">E2E Test Approach</text>
  <text x="628.7719" y="552.4211" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">1. Docker Compose with Kafka + Spark</text>
  <text x="628.7719" y="582.7368" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">2. Produce real messages to topic</text>
  <text x="628.7719" y="613.0526" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">3. Verify end-to-end sink output</text>
  <text x="628.7719" y="626.5263" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">4. Test failure recovery scenarios</text>
</svg>
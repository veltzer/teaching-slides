<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow-ts" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="#333">Testing Strategies for Streaming</text>
  <rect x="80" y="504" width="480" height="126" rx="9.6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="320" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#2e7d32">Unit Tests</text>
  <text x="320" y="594" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Transform functions, UDFs, schema validation</text>
  <text x="320" y="621" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">Fast, isolated, no Spark context needed</text>
  <rect x="144" y="351" width="352" height="126" rx="9.6" fill="#e1f5fe" stroke="#0277bd" stroke-width="3.2" />
  <text x="320" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#0277bd">Integration Tests</text>
  <text x="320" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">MemoryStream, local SparkSession</text>
  <text x="320" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">Test full pipeline logic</text>
  <rect x="208" y="207" width="224" height="117" rx="9.6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.2" />
  <text x="320" y="255.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#ef6c00">E2E Tests</text>
  <text x="320" y="291.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Docker + Kafka</text>
  <text x="320" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">Full stack</text>
  <text x="320" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#888">Test Pyramid</text>
  <rect x="640" y="99" width="592" height="189" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="936" y="140.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#2e7d32">Unit Test Approach</text>
  <text x="672" y="180" font-family="Arial, sans-serif" font-size="17.6" fill="#555">1. Test transformation logic separately</text>
  <text x="672" y="212.4" font-family="Arial, sans-serif" font-size="17.6" fill="#555">2. Use static DataFrames as input</text>
  <text x="672" y="244.8" font-family="Arial, sans-serif" font-size="17.6" fill="#555">3. Verify output schema and values</text>
  <text x="672" y="277.2" font-family="Arial, sans-serif" font-size="17.6" fill="#555">4. Test edge cases (nulls, empty, malformed)</text>
  <rect x="640" y="315" width="592" height="171" rx="12.8" fill="#e1f5fe" stroke="#0277bd" stroke-width="3.2" />
  <text x="936" y="356.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#0277bd">Integration Test Approach</text>
  <text x="672" y="392.4" font-family="Arial, sans-serif" font-size="17.6" fill="#555">1. Use MemoryStream as test source</text>
  <text x="672" y="424.8" font-family="Arial, sans-serif" font-size="17.6" fill="#555">2. Add test data with addData()</text>
  <text x="672" y="457.2" font-family="Arial, sans-serif" font-size="17.6" fill="#555">3. processAllAvailable() to advance</text>
  <text x="672" y="471.6" font-family="Arial, sans-serif" font-size="17.6" fill="#555">4. Assert output with MemorySink</text>
  <rect x="640" y="513" width="592" height="171" rx="12.8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.2" />
  <text x="936" y="554.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#ef6c00">E2E Test Approach</text>
  <text x="672" y="590.4" font-family="Arial, sans-serif" font-size="17.6" fill="#555">1. Docker Compose with Kafka + Spark</text>
  <text x="672" y="622.8" font-family="Arial, sans-serif" font-size="17.6" fill="#555">2. Produce real messages to topic</text>
  <text x="672" y="655.2" font-family="Arial, sans-serif" font-size="17.6" fill="#555">3. Verify end-to-end sink output</text>
  <text x="672" y="669.6" font-family="Arial, sans-serif" font-size="17.6" fill="#555">4. Test failure recovery scenarios</text>
</svg>
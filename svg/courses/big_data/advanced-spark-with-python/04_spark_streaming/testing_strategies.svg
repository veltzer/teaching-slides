<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.873010808237" font-weight="bold" fill="var(--text)">Testing Streaming Pipelines</text>

  <text x="290" y="93.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" fill="var(--text-faint)">Test Pyramid</text>

  <rect x="173" y="115.185185185185" width="233" height="107.407407407407" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="158.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--warn-text)">E2E</text>
  <text x="290" y="195.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Docker, Kafka</text>

  <rect x="107" y="244.074074074074" width="366" height="118.148148148148" rx="8.291003602746" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="287.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--primary-text)">Integration</text>
  <text x="290" y="324.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">MemoryStream, local Spark</text>

  <rect x="40" y="383.703703703704" width="500" height="118.148148148148" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.727509006864" font-weight="bold" fill="var(--ok-text)">Unit</text>
  <text x="290" y="464.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">transform functions, UDFs</text>

  <rect x="620" y="72.222222222222" width="620" height="171.851851851852" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="109.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--ok-text)">Unit</text>
  <text x="650" y="147.407407407407" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">static DataFrame inputs</text>
  <text x="650" y="179.62962962963" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">assert schema and values</text>
  <text x="650" y="211.851851851852" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--ok-text)">cover null, empty, malformed</text>

  <rect x="620" y="260.185185185185" width="620" height="171.851851851852" rx="8.291003602746" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="297.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--primary-text)">Integration</text>
  <text x="650" y="335.37037037037" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">MemoryStream source</text>
  <text x="650" y="367.592592592593" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">addData, processAllAvailable</text>
  <text x="650" y="399.814814814815" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--primary-text)">assert via MemorySink</text>

  <rect x="620" y="448.148148148148" width="620" height="171.851851851852" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="485.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--warn-text)">E2E</text>
  <text x="650" y="523.333333333333" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Docker Compose Kafka + Spark</text>
  <text x="650" y="555.555555555556" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">produce real messages</text>
  <text x="650" y="587.777777777778" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">test failure recovery</text>
</svg>

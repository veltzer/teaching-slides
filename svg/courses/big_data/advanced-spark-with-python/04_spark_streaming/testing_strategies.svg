<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-ts" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="623.3333" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.8924" font-weight="bold" fill="var(--text)">Testing Strategies for Streaming</text>
  <rect x="40" y="456.6197" width="500" height="114.3662" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="290" y="505.6338" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7809" font-weight="bold" fill="var(--ok-accent)">Unit Tests</text>
  <text x="290" y="538.3099" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">Transform functions, UDFs, schema validation</text>
  <text x="290" y="562.8169" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-faint)">Fast, isolated, no Spark context needed</text>
  <rect x="106.6666" y="317.7465" width="366.6667" height="114.3662" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="290" y="366.7606" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7809" font-weight="bold" fill="var(--primary-accent)">Integration Tests</text>
  <text x="290" y="399.4366" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">MemoryStream, local SparkSession</text>
  <text x="290" y="423.9436" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-faint)">Test full pipeline logic</text>
  <rect x="173.3334" y="187.0422" width="233.3333" height="106.1972" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="290" y="231.1549" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7809" font-weight="bold" fill="var(--warn-accent)">E2E Tests</text>
  <text x="290" y="263.831" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">Docker + Kafka</text>
  <text x="290" y="285.0704" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-faint)">Full stack</text>
  <text x="290" y="154.3662" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--text-faint)">Test Pyramid</text>
  <rect x="623.3333" y="89.0141" width="616.6667" height="171.5493" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="931.6667" y="126.5915" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2251" font-weight="bold" fill="var(--ok-accent)">Unit Test Approach</text>
  <text x="656.6667" y="162.5352" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">1. Test transformation logic separately</text>
  <text x="656.6667" y="191.9436" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">2. Use static DataFrames as input</text>
  <text x="656.6667" y="221.3521" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">3. Verify output schema and values</text>
  <text x="656.6667" y="250.7605" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">4. Test edge cases (nulls, empty, malformed)</text>
  <rect x="623.3333" y="285.0704" width="616.6667" height="155.2113" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="931.6667" y="322.6479" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2251" font-weight="bold" fill="var(--primary-accent)">Integration Test Approach</text>
  <text x="656.6667" y="355.3239" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">1. Use MemoryStream as test source</text>
  <text x="656.6667" y="384.7324" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">2. Add test data with addData()</text>
  <text x="656.6667" y="414.1409" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">3. processAllAvailable() to advance</text>
  <text x="656.6667" y="427.2113" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">4. Assert output with MemorySink</text>
  <rect x="623.3333" y="464.7887" width="616.6667" height="155.2113" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="931.6667" y="502.3661" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2251" font-weight="bold" fill="var(--warn-accent)">E2E Test Approach</text>
  <text x="656.6667" y="535.0423" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">1. Docker Compose with Kafka + Spark</text>
  <text x="656.6667" y="564.4507" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">2. Produce real messages to topic</text>
  <text x="656.6667" y="593.8591" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">3. Verify end-to-end sink output</text>
  <text x="656.6667" y="606.9296" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--text-muted)">4. Test failure recovery scenarios</text>
</svg>
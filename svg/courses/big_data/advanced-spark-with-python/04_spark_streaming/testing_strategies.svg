<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrow-ts" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.6,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="42.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9532" font-weight="bold" fill="#333">Testing Strategies for Streaming</ns0:text>
  <ns0:rect x="74.8538" y="471.5789" width="449.1228" height="117.8947" rx="8.9825" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.9942" />
  <ns0:text x="299.4152" y="522.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="#2e7d32">Unit Tests</ns0:text>
  <ns0:text x="299.4152" y="555.7895" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">Transform functions, UDFs, schema validation</ns0:text>
  <ns0:text x="299.4152" y="581.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#888">Fast, isolated, no Spark context needed</ns0:text>
  <ns0:rect x="134.7368" y="328.4211" width="329.3567" height="117.8947" rx="8.9825" fill="#e1f5fe" stroke="#0277bd" stroke-width="2.9942" />
  <ns0:text x="299.4152" y="378.9474" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="#0277bd">Integration Tests</ns0:text>
  <ns0:text x="299.4152" y="412.6316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">MemoryStream, local SparkSession</ns0:text>
  <ns0:text x="299.4152" y="437.8947" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#888">Test full pipeline logic</ns0:text>
  <ns0:rect x="194.6199" y="193.6842" width="209.5906" height="109.4737" rx="8.9825" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.9942" />
  <ns0:text x="299.4152" y="239.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="#ef6c00">E2E Tests</ns0:text>
  <ns0:text x="299.4152" y="272.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">Docker + Kafka</ns0:text>
  <ns0:text x="299.4152" y="294.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#888">Full stack</ns0:text>
  <ns0:text x="299.4152" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9649" fill="#888">Test Pyramid</ns0:text>
  <ns0:rect x="598.8304" y="92.6316" width="553.9181" height="176.8421" rx="11.9766" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.9942" />
  <ns0:text x="875.7895" y="131.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="#2e7d32">Unit Test Approach</ns0:text>
  <ns0:text x="628.7719" y="168.4211" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">1. Test transformation logic separately</ns0:text>
  <ns0:text x="628.7719" y="198.7368" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">2. Use static DataFrames as input</ns0:text>
  <ns0:text x="628.7719" y="229.0526" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">3. Verify output schema and values</ns0:text>
  <ns0:text x="628.7719" y="259.3684" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">4. Test edge cases (nulls, empty, malformed)</ns0:text>
  <ns0:rect x="598.8304" y="294.7368" width="553.9181" height="160" rx="11.9766" fill="#e1f5fe" stroke="#0277bd" stroke-width="2.9942" />
  <ns0:text x="875.7895" y="333.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="#0277bd">Integration Test Approach</ns0:text>
  <ns0:text x="628.7719" y="367.1579" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">1. Use MemoryStream as test source</ns0:text>
  <ns0:text x="628.7719" y="397.4737" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">2. Add test data with addData()</ns0:text>
  <ns0:text x="628.7719" y="427.7895" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">3. processAllAvailable() to advance</ns0:text>
  <ns0:text x="628.7719" y="441.2632" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">4. Assert output with MemorySink</ns0:text>
  <ns0:rect x="598.8304" y="480" width="553.9181" height="160" rx="11.9766" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.9942" />
  <ns0:text x="875.7895" y="518.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="#ef6c00">E2E Test Approach</ns0:text>
  <ns0:text x="628.7719" y="552.4211" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">1. Docker Compose with Kafka + Spark</ns0:text>
  <ns0:text x="628.7719" y="582.7368" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">2. Produce real messages to topic</ns0:text>
  <ns0:text x="628.7719" y="613.0526" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">3. Verify end-to-end sink output</ns0:text>
  <ns0:text x="628.7719" y="626.5263" font-family="Arial, sans-serif" font-size="16.4678" fill="#555">4. Test failure recovery scenarios</ns0:text>
</ns0:svg>
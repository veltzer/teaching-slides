  <text x="864.9999" y="429.2105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--text-faint)">gap</text>
  <rect x="915" y="398.6842" width="100" height="45.7895" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="965" y="429.2105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--warn-accent)">S3</text>

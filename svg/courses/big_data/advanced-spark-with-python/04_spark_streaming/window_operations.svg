<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-wo" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="623.3334" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.6539" font-weight="bold" fill="var(--text)">Window Operation Types</text>
  <line x1="40" y1="93.4211" x2="1206.6667" y2="93.4211" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-wo)" />
  <text x="1240" y="101.0527" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--text)">Time</text>
  <text x="206.6667" y="85.7896" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4087" fill="var(--text-faint)">0m</text>
  <text x="415" y="85.7896" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4087" fill="var(--text-faint)">5m</text>
  <text x="623.3334" y="85.7896" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4087" fill="var(--text-faint)">10m</text>
  <text x="831.6667" y="85.7896" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4087" fill="var(--text-faint)">15m</text>
  <text x="1039.9999" y="85.7896" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4087" fill="var(--text-faint)">20m</text>
  <text x="40" y="154.4737" font-family="Arial, sans-serif" font-size="20.0313" font-weight="bold" fill="var(--primary-accent)">Tumbling Window</text>
  <rect x="206.6667" y="131.579" width="208.3333" height="45.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="310" y="162.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--primary-accent)">W1</text>
  <rect x="415" y="131.579" width="208.3333" height="45.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="518.3333" y="162.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--primary-accent)">W2</text>
  <rect x="623.3334" y="131.579" width="208.3333" height="45.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="726.6667" y="162.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--primary-accent)">W3</text>
  <rect x="831.6667" y="131.579" width="208.3333" height="45.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="935" y="162.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--primary-accent)">W4</text>
  <text x="1123.3333" y="162.1053" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--text-muted)">No overlap</text>
  <text x="40" y="253.6842" font-family="Arial, sans-serif" font-size="20.0313" font-weight="bold" fill="var(--ok-accent)">Sliding Window</text>
  <rect x="206.6667" y="230.7896" width="416.6667" height="38.1578" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" opacity="0.7" />
  <text x="415" y="256.7369" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--ok-accent)">W1 (10m)</text>
  <rect x="311.6666" y="273.5264" width="416.6667" height="38.1578" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" opacity="0.7" />
  <text x="519.9999" y="299.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--ok-accent)">W2 (10m)</text>
  <rect x="415" y="316.2632" width="416.6667" height="38.1578" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" opacity="0.7" />
  <text x="623.3334" y="342.2106" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--ok-accent)">W3 (10m)</text>
  <text x="1123.3333" y="299.4737" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--text-muted)">Overlapping</text>
  <text x="1123.3333" y="322.3685" font-family="Arial, sans-serif" font-size="16.9496" fill="var(--text-muted)">slide=5m</text>
  <text x="40" y="421.579" font-family="Arial, sans-serif" font-size="20.0313" font-weight="bold" fill="var(--warn-accent)">Session Window</text>

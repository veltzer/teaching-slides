  <text x="206.6667" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.055499715998" fill="var(--text-faint)">0m</text>
  <text x="415" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.055499715998" fill="var(--text-faint)">5m</text>

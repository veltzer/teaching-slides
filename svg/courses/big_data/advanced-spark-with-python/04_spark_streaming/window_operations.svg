  <rect x="427.7202" y="489.8766" width="324.4774" height="150.1234" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="589.9589" y="521.4815" text-anchor="middle" font-family="monospace" font-size="16.2239" fill="var(--ok-accent)">Sliding:</text>
  <text x="589.9589" y="549.9259" text-anchor="middle" font-family="monospace" font-size="14.749" fill="var(--text-muted)">window("ts","10m","5m")</text>

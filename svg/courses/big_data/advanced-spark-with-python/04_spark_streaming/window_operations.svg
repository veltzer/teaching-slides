  <rect x="768.711" y="386.43" width="9.2452" height="9.2452" rx="4.6226" fill="var(--warn-accent)"/>
  <rect x="935.377" y="386.43" width="9.2452" height="9.2452" rx="4.6226" fill="var(--warn-accent)"/>
  <rect x="40" y="475.0001" width="366.6667" height="144.9999" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="223.3332" y="505.5263" text-anchor="middle" font-size="16.9496" fill="var(--primary-accent)" font-family="Courier New, monospace">Tumbling:</text>
  <text x="223.3332" y="533" text-anchor="middle" font-size="15.4087" fill="var(--text-muted)" font-family="Courier New, monospace">window("ts", "5 min")</text>
  <text x="223.3332" y="558.9474" text-anchor="middle" font-size="15.4087" fill="var(--text-faint)" font-family="Courier New, monospace">Fixed-size, non-overlapping</text>
  <rect x="440" y="475.0001" width="366.6667" height="144.9999" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="623.3334" y="505.5263" text-anchor="middle" font-size="16.9496" fill="var(--ok-accent)" font-family="Courier New, monospace">Sliding:</text>
  <text x="623.3334" y="533" text-anchor="middle" font-size="15.4087" fill="var(--text-muted)" font-family="Courier New, monospace">window("ts","10m","5m")</text>
  <text x="623.3334" y="558.9474" text-anchor="middle" font-size="15.4087" fill="var(--text-faint)" font-family="Courier New, monospace">Fixed-size, overlapping</text>
  <rect x="840" y="475.0001" width="366.6667" height="144.9999" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-wo" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Window Operation Types</text>

  <!-- Time axis -->
  <line x1="50" y1="60" x2="750" y2="60" stroke="#333" stroke-width="2" marker-end="url(#arrow-wo)"/>
  <text x="770" y="65" font-family="Arial, sans-serif" font-size="11" fill="#333">Time</text>
  <text x="150" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">0m</text>
  <text x="275" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">5m</text>
  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">10m</text>
  <text x="525" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">15m</text>
  <text x="650" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">20m</text>

  <!-- Tumbling Windows -->
  <text x="50" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0277bd">Tumbling Window</text>
  <rect x="150" y="85" width="125" height="30" rx="4" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="212" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">W1</text>
  <rect x="275" y="85" width="125" height="30" rx="4" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="337" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">W2</text>
  <rect x="400" y="85" width="125" height="30" rx="4" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="462" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">W3</text>
  <rect x="525" y="85" width="125" height="30" rx="4" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="587" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">W4</text>
  <text x="700" y="105" font-family="Arial, sans-serif" font-size="11" fill="#555">No overlap</text>

  <!-- Sliding Windows -->
  <text x="50" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Sliding Window</text>
  <rect x="150" y="150" width="250" height="25" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" opacity="0.7"/>
  <text x="275" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">W1 (10m)</text>
  <rect x="213" y="178" width="250" height="25" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" opacity="0.7"/>
  <text x="338" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">W2 (10m)</text>
  <rect x="275" y="206" width="250" height="25" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" opacity="0.7"/>
  <text x="400" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#2e7d32">W3 (10m)</text>
  <text x="700" y="195" font-family="Arial, sans-serif" font-size="11" fill="#555">Overlapping</text>
  <text x="700" y="210" font-family="Arial, sans-serif" font-size="11" fill="#555">slide=5m</text>

  <!-- Session Windows -->
  <text x="50" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ef6c00">Session Window</text>
  <rect x="150" y="260" width="100" height="30" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ef6c00">Session 1</text>
  <!-- gap -->
  <text x="290" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">gap</text>
  <rect x="330" y="260" width="180" height="30" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="420" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ef6c00">Session 2</text>
  <!-- gap -->
  <text x="545" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">gap</text>
  <rect x="575" y="260" width="60" height="30" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="605" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ef6c00">S3</text>
  <text x="700" y="280" font-family="Arial, sans-serif" font-size="11" fill="#555">Gap-based</text>

  <!-- Event dots on session timeline -->
  <circle cx="165" cy="255" r="3" fill="#ef6c00"/>
  <circle cx="195" cy="255" r="3" fill="#ef6c00"/>
  <circle cx="230" cy="255" r="3" fill="#ef6c00"/>
  <circle cx="345" cy="255" r="3" fill="#ef6c00"/>
  <circle cx="400" cy="255" r="3" fill="#ef6c00"/>
  <circle cx="450" cy="255" r="3" fill="#ef6c00"/>
  <circle cx="490" cy="255" r="3" fill="#ef6c00"/>
  <circle cx="590" cy="255" r="3" fill="#ef6c00"/>

  <!-- Code examples -->
  <rect x="50" y="310" width="220" height="95" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="160" y="330" text-anchor="middle" font-family="monospace" font-size="11" fill="#0277bd">Tumbling:</text>
  <text x="160" y="348" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">window("ts", "5 min")</text>
  <text x="160" y="365" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">Fixed-size, non-overlapping</text>

  <rect x="290" y="310" width="220" height="95" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="330" text-anchor="middle" font-family="monospace" font-size="11" fill="#2e7d32">Sliding:</text>
  <text x="400" y="348" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">window("ts","10m","5m")</text>
  <text x="400" y="365" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">Fixed-size, overlapping</text>

  <rect x="530" y="310" width="220" height="95" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="640" y="330" text-anchor="middle" font-family="monospace" font-size="11" fill="#ef6c00">Session:</text>
  <text x="640" y="348" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">session_window("ts","5m")</text>
  <text x="640" y="365" text-anchor="middle" font-family="monospace" font-size="10" fill="#888">Dynamic, gap-based</text>
</svg>

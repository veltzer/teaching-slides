  <text x="185.9459" y="481.492519670304" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Throughput</text>
  <text x="494.0541" y="481.492519670304" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">High</text>
  <text x="802.1621" y="481.492519670304" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Medium</text>

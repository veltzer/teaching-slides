<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-spm" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Stream Processing Models</text>

  <!-- Micro-Batch -->
  <rect x="30" y="50" width="220" height="150" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="140" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277bd">Micro-Batch</text>
  <rect x="50" y="90" width="40" height="25" rx="3" fill="#bbdefb" stroke="#0277bd" stroke-width="1"/>
  <rect x="100" y="90" width="40" height="25" rx="3" fill="#bbdefb" stroke="#0277bd" stroke-width="1"/>
  <rect x="150" y="90" width="40" height="25" rx="3" fill="#bbdefb" stroke="#0277bd" stroke-width="1"/>
  <text x="70" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">B1</text>
  <text x="120" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">B2</text>
  <text x="170" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">B3</text>
  <text x="140" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Collects data into</text>
  <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">small batches</text>
  <text x="140" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Latency: 100ms - minutes</text>

  <!-- Continuous -->
  <rect x="290" y="50" width="220" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">Continuous</text>
  <line x1="310" y1="100" x2="490" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow-spm)"/>
  <circle cx="330" cy="100" r="4" fill="#2e7d32"/>
  <circle cx="360" cy="100" r="4" fill="#2e7d32"/>
  <circle cx="385" cy="100" r="4" fill="#2e7d32"/>
  <circle cx="420" cy="100" r="4" fill="#2e7d32"/>
  <circle cx="450" cy="100" r="4" fill="#2e7d32"/>
  <text x="400" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Record-by-record</text>
  <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">processing</text>
  <text x="400" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Latency: ~1ms</text>

  <!-- Trigger-Based -->
  <rect x="550" y="50" width="220" height="150" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="660" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef6c00">Trigger-Based</text>
  <rect x="575" y="90" width="55" height="25" rx="3" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <rect x="650" y="90" width="55" height="25" rx="3" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <text x="602" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">once</text>
  <text x="677" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">availNow</text>
  <text x="660" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">One-time or</text>
  <text x="660" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">catch-up batch</text>
  <text x="660" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#888">Latency: on-demand</text>

  <!-- Comparison Table -->
  <rect x="30" y="230" width="740" height="155" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Comparison</text>
  <text x="120" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Feature</text>
  <text x="310" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0277bd">Micro-Batch</text>
  <text x="500" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Continuous</text>
  <text x="680" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef6c00">Trigger</text>
  <line x1="50" y1="287" x2="750" y2="287" stroke="#ccc" stroke-width="1"/>
  <text x="120" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Throughput</text>
  <text x="310" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">High</text>
  <text x="500" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Medium</text>
  <text x="680" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Varies</text>
  <text x="120" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Exactly-Once</text>
  <text x="310" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Yes</text>
  <text x="500" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">At-Least-Once</text>
  <text x="680" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Yes</text>
  <text x="120" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Aggregations</text>
  <text x="310" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">All supported</text>
  <text x="500" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Map-only</text>
  <text x="680" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">All supported</text>
  <text x="120" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Status</text>
  <text x="310" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Default / Stable</text>
  <text x="500" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Experimental</text>
  <text x="680" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Stable</text>
</svg>

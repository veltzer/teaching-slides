<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3826" font-weight="bold" fill="var(--text)">Stream Processing Models</text>
  <rect x="40" y="80.2778" width="356.7568" height="241.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3349" font-weight="bold" fill="var(--primary-accent)">Micro-Batch</text>
  <rect x="72.4325" y="144.7223" width="64.8648" height="40.2777" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="153.5135" y="144.7223" width="64.8648" height="40.2777" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="234.5946" y="144.7223" width="64.8648" height="40.2777" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="104.8648" y="172.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">B1</text>
  <text x="185.9459" y="172.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">B2</text>
  <text x="267.027" y="172.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">B3</text>
  <text x="218.3784" y="225.2778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Collects data into</text>
  <text x="218.3784" y="249.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">small batches</text>
  <text x="218.3784" y="292.9445" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-faint)">Latency: 100ms - minutes</text>
  <rect x="461.6216" y="80.2778" width="356.7568" height="241.6666" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3349" font-weight="bold" fill="var(--ok-accent)">Continuous</text>
  <line x1="494.0541" y1="160.8334" x2="785.9459" y2="160.8334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520.391" y="154.738" width="12.1912" height="12.1912" rx="6.0956" fill="var(--ok-accent)"/>
  <rect x="569.04" y="154.738" width="12.1912" height="12.1912" rx="6.0956" fill="var(--ok-accent)"/>
  <rect x="609.58" y="154.738" width="12.1912" height="12.1912" rx="6.0956" fill="var(--ok-accent)"/>
  <rect x="666.337" y="154.738" width="12.1912" height="12.1912" rx="6.0956" fill="var(--ok-accent)"/>
  <rect x="714.986" y="154.738" width="12.1912" height="12.1912" rx="6.0956" fill="var(--ok-accent)"/>
  <text x="640" y="217.2223" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Record-by-record</text>
  <text x="640" y="241.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">processing</text>
  <text x="640" y="292.9445" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-faint)">Latency: ~1ms</text>
  <rect x="883.2432" y="80.2778" width="356.7568" height="241.6666" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6216" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3349" font-weight="bold" fill="var(--warn-accent)">Trigger-Based</text>
  <rect x="923.7837" y="144.7223" width="89.1891" height="40.2777" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1045.4054" y="144.7223" width="89.1891" height="40.2777" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.5676" y="172.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">once</text>
  <text x="1089.1892" y="172.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">availNow</text>
  <text x="1061.6216" y="225.2778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">One-time or</text>
  <text x="1061.6216" y="249.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">catch-up batch</text>
  <text x="1061.6216" y="292.9445" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-faint)">Latency: on-demand</text>
  <rect x="40" y="370.2778" width="1200" height="249.7222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="410.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3349" font-weight="bold" fill="var(--text)">Comparison</text>
  <text x="185.9459" y="450.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--text)">Feature</text>
  <text x="494.0541" y="450.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--primary-accent)">Micro-Batch</text>
  <text x="802.1621" y="450.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--ok-accent)">Continuous</text>
  <text x="1094.0541" y="450.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--warn-accent)">Trigger</text>
  <line x1="72.4325" y1="462.1111" x2="1207.5675" y2="462.1111" stroke="var(--border)" stroke-width="1.4776"/>
  <text x="185.9459" y="491.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Throughput</text>
  <text x="494.0541" y="491.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">High</text>
  <text x="802.1621" y="491.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Medium</text>
  <text x="1094.0541" y="491.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Varies</text>
  <text x="185.9459" y="523.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Exactly-Once</text>
  <text x="494.0541" y="523.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Yes</text>
  <text x="802.1621" y="523.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">At-Least-Once</text>
  <text x="1094.0541" y="523.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Yes</text>
  <text x="185.9459" y="555.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Aggregations</text>
  <text x="494.0541" y="555.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">All supported</text>
  <text x="802.1621" y="555.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Map-only</text>
  <text x="1094.0541" y="555.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">All supported</text>
  <text x="185.9459" y="587.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Status</text>
  <text x="494.0541" y="587.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Default / Stable</text>
  <text x="802.1621" y="587.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Experimental</text>
  <text x="1094.0541" y="587.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Stable</text>
</svg>

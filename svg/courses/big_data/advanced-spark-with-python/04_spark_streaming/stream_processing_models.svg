<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-spm" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="41.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6421" font-weight="bold" fill="var(--text)">Stream Processing Models</text>
  <rect x="44.329" y="83.1169" width="325.0794" height="249.3506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="206.8687" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--primary-accent)">Micro-Batch</text>
  <rect x="73.8817" y="149.6104" width="59.1053" height="41.5584" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="147.7633" y="149.6104" width="59.1053" height="41.5584" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="221.645" y="149.6104" width="59.1053" height="41.5584" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="103.4343" y="177.8701" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">B1</text>
  <text x="177.316" y="177.8701" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">B2</text>
  <text x="251.1977" y="177.8701" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">B3</text>
  <text x="206.8687" y="232.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Collects data into</text>
  <text x="206.8687" y="257.6623" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">small batches</text>
  <text x="206.8687" y="302.5455" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-faint)">Latency: 100ms - minutes</text>
  <rect x="428.5137" y="83.1169" width="325.0794" height="249.3506" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="591.0534" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--ok-accent)">Continuous</text>
  <line x1="458.0664" y1="166.2338" x2="724.0404" y2="166.2338" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-spm)" />
  <circle cx="487.619" cy="166.2338" r="5.9105" fill="var(--ok-accent)" />
  <circle cx="531.9481" cy="166.2338" r="5.9105" fill="var(--ok-accent)" />
  <circle cx="568.8889" cy="166.2338" r="5.9105" fill="var(--ok-accent)" />
  <circle cx="620.6061" cy="166.2338" r="5.9105" fill="var(--ok-accent)" />
  <circle cx="664.9351" cy="166.2338" r="5.9105" fill="var(--ok-accent)" />
  <text x="591.0534" y="224.4156" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Record-by-record</text>
  <text x="591.0534" y="249.3506" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">processing</text>
  <text x="591.0534" y="302.5455" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-faint)">Latency: ~1ms</text>
  <rect x="812.6984" y="83.1169" width="325.0794" height="249.3506" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="975.2381" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--warn-accent)">Trigger-Based</text>
  <rect x="849.6392" y="149.6104" width="81.2698" height="41.5584" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="960.4618" y="149.6104" width="81.2698" height="41.5584" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="889.5354" y="177.8701" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">once</text>
  <text x="1000.3579" y="177.8701" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">availNow</text>
  <text x="975.2381" y="232.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">One-time or</text>
  <text x="975.2381" y="257.6623" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">catch-up batch</text>
  <text x="975.2381" y="302.5455" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-faint)">Latency: on-demand</text>
  <rect x="44.329" y="382.3377" width="1093.4488" height="257.6623" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="591.0534" y="423.8961" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--text)">Comparison</text>
  <text x="177.316" y="465.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--text)">Feature</text>
  <text x="458.0664" y="465.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Micro-Batch</text>
  <text x="738.8167" y="465.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Continuous</text>
  <text x="1004.7908" y="465.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--warn-accent)">Trigger</text>
  <line x1="73.8817" y1="477.0909" x2="1108.2251" y2="477.0909" stroke="var(--border)" stroke-width="1.4776" />
  <text x="177.316" y="507.013" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Throughput</text>
  <text x="458.0664" y="507.013" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">High</text>
  <text x="738.8167" y="507.013" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Medium</text>
  <text x="1004.7908" y="507.013" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Varies</text>
  <text x="177.316" y="540.2597" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Exactly-Once</text>
  <text x="458.0664" y="540.2597" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Yes</text>
  <text x="738.8167" y="540.2597" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">At-Least-Once</text>
  <text x="1004.7908" y="540.2597" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Yes</text>
  <text x="177.316" y="573.5065" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Aggregations</text>
  <text x="458.0664" y="573.5065" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">All supported</text>
  <text x="738.8167" y="573.5065" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Map-only</text>
  <text x="1004.7908" y="573.5065" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">All supported</text>
  <text x="177.316" y="606.7532" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Status</text>
  <text x="458.0664" y="606.7532" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Default / Stable</text>
  <text x="738.8167" y="606.7532" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Experimental</text>
  <text x="1004.7908" y="606.7532" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Stable</text>
</svg>
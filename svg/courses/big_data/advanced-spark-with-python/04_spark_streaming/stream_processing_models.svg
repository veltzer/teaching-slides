  <text x="185.9459" y="516.119362887056" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Exactly-Once</text>
  <text x="494.0541" y="516.119362887056" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Yes</text>
  <text x="802.1621" y="516.119362887056" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">At-Least-Once</text>

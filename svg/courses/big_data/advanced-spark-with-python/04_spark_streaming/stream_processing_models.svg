<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="356.7568" height="259.701431588325" rx="6.219852792232" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.116656222832" font-weight="bold" fill="var(--primary-accent)">Micro-Batch</text>
  <rect x="72.4325" y="109.253793896193" width="64.8648" height="43.283500289593" rx="6.219852792232" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="153.5135" y="109.253793896193" width="64.8648" height="43.283500289593" rx="6.219852792232" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="234.5946" y="109.253793896193" width="64.8648" height="43.283500289593" rx="6.219852792232" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="104.8648" y="138.686535406548" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">B1</text>
  <text x="185.9459" y="138.686535406548" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">B2</text>
  <text x="267.027" y="138.686535406548" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">B3</text>
  <text x="218.3784" y="195.820901938071" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Collects data into</text>
  <text x="218.3784" y="221.790980619289" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">small batches</text>
  <text x="218.3784" y="268.537358663401" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-faint)">Latency: 100ms - minutes</text>
  <rect x="461.6216" y="40" width="356.7568" height="259.701431588325" rx="6.219852792232" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.116656222832" font-weight="bold" fill="var(--ok-accent)">Continuous</text>
  <line x1="494.0541" y1="126.567215504569" x2="785.9459" y2="126.567215504569" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520.391" y="120.016934637856" width="12.1912" height="13.100991584189" rx="6.318955780055" fill="var(--ok-accent)"/>
  <rect x="569.04" y="120.016934637856" width="12.1912" height="13.100991584189" rx="6.318955780055" fill="var(--ok-accent)"/>
  <rect x="609.58" y="120.016934637856" width="12.1912" height="13.100991584189" rx="6.318955780055" fill="var(--ok-accent)"/>
  <rect x="666.337" y="120.016934637856" width="12.1912" height="13.100991584189" rx="6.318955780055" fill="var(--ok-accent)"/>
  <rect x="714.986" y="120.016934637856" width="12.1912" height="13.100991584189" rx="6.318955780055" fill="var(--ok-accent)"/>
  <text x="640" y="187.164244865229" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Record-by-record</text>
  <text x="640" y="213.134323546447" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">processing</text>
  <text x="640" y="268.537358663401" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-faint)">Latency: ~1ms</text>
  <rect x="883.2432" y="40" width="356.7568" height="259.701431588325" rx="6.219852792232" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6216" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.116656222832" font-weight="bold" fill="var(--warn-accent)">Trigger-Based</text>
  <rect x="923.7837" y="109.253793896193" width="89.1891" height="43.283500289593" rx="6.219852792232" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1045.4054" y="109.253793896193" width="89.1891" height="43.283500289593" rx="6.219852792232" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="967.5676" y="138.686535406548" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">once</text>
  <text x="1089.1892" y="138.686535406548" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">availNow</text>
  <text x="1061.6216" y="195.820901938071" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">One-time or</text>
  <text x="1061.6216" y="221.790980619289" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">catch-up batch</text>
  <text x="1061.6216" y="268.537358663401" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-faint)">Latency: on-demand</text>
  <rect x="40" y="351.641803876142" width="1200" height="268.358196123858" rx="6.219852792232" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="394.925411628427" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.116656222832" font-weight="bold" fill="var(--text)">Comparison</text>
  <text x="185.9459" y="438.20891191802" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" font-weight="bold" fill="var(--text)">Feature</text>
  <text x="494.0541" y="438.20891191802" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" font-weight="bold" fill="var(--primary-accent)">Micro-Batch</text>
  <text x="802.1621" y="438.20891191802" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" font-weight="bold" fill="var(--ok-accent)">Continuous</text>
  <text x="1094.0541" y="438.20891191802" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" font-weight="bold" fill="var(--warn-accent)">Trigger</text>

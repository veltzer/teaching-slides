  <text x="477.8378" y="597.492476685228" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-muted)">Make writes idempotent | Use epoch_id for dedup | Handle retries | Batch connections</text>

  <text x="72.4325" y="126.567215504569" font-size="17.377335723578" fill="var(--text-muted)" font-family="Courier New, monospace">def write_batch(df, epoch_id):</text>
  <text x="72.4325" y="157.731288429492" font-size="17.377335723578" fill="var(--text-muted)" font-family="Courier New, monospace">    df.write.format("jdbc")</text>
  <text x="72.4325" y="188.895468817106" font-size="17.377335723578" fill="var(--text-muted)" font-family="Courier New, monospace">      .option("url", jdbc_url)</text>
  <text x="72.4325" y="220.059756667412" font-size="17.377335723578" fill="var(--text-muted)" font-family="Courier New, monospace">      .mode("append").save()</text>

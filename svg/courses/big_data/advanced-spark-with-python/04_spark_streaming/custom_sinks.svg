<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-cs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="41.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6421" font-weight="bold" fill="var(--text)">Custom Sink Implementation</text>
  <rect x="44.329" y="83.1169" width="517.1717" height="265.974" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="302.9149" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--primary-accent)">foreachBatch (Recommended)</text>
  <text x="73.8817" y="166.2338" font-family="monospace" font-size="16.254" fill="var(--text-muted)">def write_batch(df, epoch_id):</text>
  <text x="73.8817" y="196.1558" font-family="monospace" font-size="16.254" fill="var(--text-muted)">    df.write.format("jdbc")</text>
  <text x="73.8817" y="226.0779" font-family="monospace" font-size="16.254" fill="var(--text-muted)">      .option("url", jdbc_url)</text>
  <text x="73.8817" y="256" font-family="monospace" font-size="16.254" fill="var(--text-muted)">      .mode("append").save()</text>
  <text x="302.9149" y="307.5325" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--ok-accent)">Full DataFrame API available</text>
  <text x="302.9149" y="332.4675" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--ok-accent)">Multiple writes per batch</text>
  <rect x="605.8297" y="83.1169" width="531.9481" height="265.974" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="871.8038" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--warn-accent)">foreach (Row-by-Row)</text>
  <text x="635.3824" y="166.2338" font-family="monospace" font-size="16.254" fill="var(--text-muted)">class MySink(ForeachWriter):</text>
  <text x="635.3824" y="196.1558" font-family="monospace" font-size="16.254" fill="var(--text-muted)">    def open(partition, epoch):</text>
  <text x="635.3824" y="226.0779" font-family="monospace" font-size="16.254" fill="var(--text-muted)">    def process(row):</text>
  <text x="635.3824" y="256" font-family="monospace" font-size="16.254" fill="var(--text-muted)">    def close(error):</text>
  <text x="871.8038" y="307.5325" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--warn-accent)">Per-row processing</text>
  <text x="871.8038" y="332.4675" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--warn-accent)">Connection management built-in</text>
  <text x="591.0534" y="398.961" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--text)">Custom Sink Flow</text>
  <rect x="73.8817" y="432.2078" width="192.0924" height="74.8052" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.9278" y="477.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Stream</text>
  <line x1="265.974" y1="468.7792" x2="325.0794" y2="468.7792" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cs)" />
  <rect x="339.8557" y="432.2078" width="192.0924" height="74.8052" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="435.9019" y="465.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Transform</text>
  <text x="435.9019" y="492.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text-muted)">filter / map / agg</text>
  <line x1="531.9481" y1="468.7792" x2="591.0534" y2="468.7792" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cs)" />
  <rect x="605.8297" y="432.2078" width="192.0924" height="74.8052" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="701.8759" y="465.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--warn-accent)">Custom Sink</text>
  <text x="701.8759" y="492.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text-muted)">foreachBatch</text>
  <line x1="797.9221" y1="448.8312" x2="857.0274" y2="432.2078" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cs)" />
  <line x1="797.9221" y1="468.7792" x2="857.0274" y2="468.7792" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cs)" />
  <line x1="797.9221" y1="488.7273" x2="857.0274" y2="505.3506" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cs)" />
  <rect x="871.8038" y="412.2597" width="147.7633" height="41.5584" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="945.6854" y="440.5195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--info-accent)">Database</text>
  <rect x="871.8038" y="462.1299" width="147.7633" height="41.5584" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="945.6854" y="490.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--info-accent)">REST API</text>
  <rect x="871.8038" y="512" width="147.7633" height="41.5584" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="945.6854" y="540.2597" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--info-accent)">Cache / Redis</text>
  <rect x="73.8817" y="548.5714" width="738.8167" height="91.4286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="443.29" y="585.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Best Practices</text>
  <text x="443.29" y="618.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Make writes idempotent | Use epoch_id for dedup | Handle retries | Batch connections</text>
</svg>
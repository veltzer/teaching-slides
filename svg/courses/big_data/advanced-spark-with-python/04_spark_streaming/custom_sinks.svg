  <text x="948.1081" y="299.701431588324" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--warn-accent)">Connection management built-in</text>
  <text x="640" y="368.955225484518" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.116656222832" font-weight="bold" fill="var(--text)">Custom Sink Flow</text>
  <rect x="72.4325" y="403.582068701269" width="210.8109" height="77.910450969036" rx="6.219852792232" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="450.32833928269" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" font-weight="bold" fill="var(--primary-accent)">Stream</text>

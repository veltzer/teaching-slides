  <text x="948.1081" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.116656222832" font-weight="bold" fill="var(--warn-accent)">foreach (Row-by-Row)</text>
  <text x="688.6486" y="126.567215504569" font-size="17.377335723578" fill="var(--text-muted)" font-family="Courier New, monospace">class MySink(ForeachWriter):</text>
  <text x="688.6486" y="157.731288429492" font-size="17.377335723578" fill="var(--text-muted)" font-family="Courier New, monospace">    def open(partition, epoch):</text>

  <text x="469.7298" y="438.20891191802" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" font-weight="bold" fill="var(--ok-accent)">Transform</text>
  <text x="469.7298" y="465.910429476497" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text-muted)">filter / map / agg</text>

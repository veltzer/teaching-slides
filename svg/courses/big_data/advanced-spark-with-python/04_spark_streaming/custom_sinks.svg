  <text x="302.9149" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--primary-strong)">foreachBatch (Recommended)</text>
  <text x="73.8817" y="166.2338" font-family="monospace" font-size="16.254" fill="var(--text-muted)">def write_batch(df, epoch_id):</text>
  <text x="73.8817" y="196.1558" font-family="monospace" font-size="16.254" fill="var(--text-muted)">    df.write.format("jdbc")</text>

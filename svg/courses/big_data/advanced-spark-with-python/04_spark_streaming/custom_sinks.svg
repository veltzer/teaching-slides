  <text x="430" y="118" font-family="monospace" font-size="11" fill="#555">    def open(partition, epoch):</text>
  <text x="430" y="136" font-family="monospace" font-size="11" fill="#555">    def process(row):</text>
  <text x="430" y="154" font-family="monospace" font-size="11" fill="#555">    def close(error):</text>
  <text x="590" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ef6c00">Per-row processing</text>
  <text x="590" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ef6c00">Connection management built-in</text>


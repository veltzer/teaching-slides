<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="62.2223" y="40" width="400" height="73.8182" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.2223" y="88.5091" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" font-weight="bold" fill="var(--text)">Stream 1 (Impressions)</text>
  <line x1="262.2223" y1="113.8181" x2="262.2223" y2="155.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="106.6667" y="166.5454" width="311.1112" height="63.2727" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.2223" y="208.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" fill="var(--text)">Watermark: 2 hours</text>
  <line x1="262.2223" y1="229.8182" x2="262.2223" y2="282.5454" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="817.7778" y="40" width="400" height="73.8182" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.7778" y="88.5091" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" font-weight="bold" fill="var(--text)">Stream 2 (Clicks)</text>
  <line x1="1017.7778" y1="113.8181" x2="1017.7778" y2="155.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="862.2222" y="166.5454" width="311.1112" height="63.2727" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.7778" y="208.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" fill="var(--text)">Watermark: 3 hours</text>
  <line x1="1017.7778" y1="229.8182" x2="1017.7778" y2="282.5454" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="293.0909" width="1200" height="326.9091" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="341.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.5754" font-weight="bold" fill="var(--text)">State Store (RocksDB)</text>
  <rect x="106.6667" y="366.9091" width="444.4445" height="168.7273" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="3.0476"/>
  <text x="328.8889" y="404.8728" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" font-weight="bold" fill="var(--primary-accent)">Impressions State</text>
  <text x="328.8889" y="447.0545" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" fill="var(--text-muted)">imp_1: t=10</text>
  <text x="328.8889" y="478.691" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" fill="var(--text-muted)">imp_2: t=12</text>
  <text x="328.8889" y="510.3273" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" fill="var(--text-muted)">imp_3: t=14</text>
  <rect x="728.8888" y="366.9091" width="444.4445" height="168.7273" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="3.0476"/>
  <text x="951.1112" y="404.8728" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" font-weight="bold" fill="var(--info-accent)">Clicks State</text>
  <text x="951.1112" y="447.0545" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" fill="var(--text-muted)">clk_1: t=11</text>
  <text x="951.1112" y="478.691" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" fill="var(--text-muted)">clk_2: t=15</text>
  <text x="640.0001" y="588.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4933" fill="var(--text-faint)">State cleaned up when watermark passes beyond join time constraint</text>
</svg>

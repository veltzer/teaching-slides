<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-fd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="632" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.2195" font-weight="bold" fill="var(--text)">Future Development Roadmap</text>
  <line x1="72" y1="104.4444" x2="1192" y2="104.4444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-fd)" />
  <text x="1224" y="112.5" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text)">Future</text>
  <circle cx="184" cy="104.4444" r="12.1098" fill="var(--primary-accent)" stroke="var(--bg)" stroke-width="2.9553" />
  <text x="184" y="88.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" font-weight="bold" fill="var(--primary-accent)">Current</text>
  <circle cx="504" cy="104.4444" r="12.1098" fill="var(--ok-accent)" stroke="var(--bg)" stroke-width="2.9553" />
  <text x="504" y="88.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" font-weight="bold" fill="var(--ok-accent)">Near-term</text>
  <circle cx="824" cy="104.4444" r="12.1098" fill="var(--warn-accent)" stroke="var(--bg)" stroke-width="2.9553" />
  <text x="824" y="88.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" font-weight="bold" fill="var(--warn-accent)">Mid-term</text>
  <circle cx="1112" cy="104.4444" r="12.1098" fill="var(--info-fill)" stroke="var(--bg)" stroke-width="2.9553" />
  <text x="1112" y="88.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" font-weight="bold" fill="var(--info-accent)">Long-term</text>
  <rect x="40" y="144.7223" width="288" height="225.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="184" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1647" font-weight="bold" fill="var(--primary-accent)">Spark 3.x Stable</text>
  <text x="184" y="222.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Structured Streaming</text>
  <text x="184" y="249.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Micro-batch default</text>
  <text x="184" y="276.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Kafka integration</text>
  <text x="184" y="304.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Delta Lake support</text>
  <text x="184" y="331.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Session windows</text>
  <text x="184" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">RocksDB state store</text>
  <rect x="352" y="144.7223" width="304" height="225.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="504" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1647" font-weight="bold" fill="var(--ok-accent)">Enhancements</text>
  <text x="504" y="222.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Improved continuous mode</text>
  <text x="504" y="249.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Better state store APIs</text>
  <text x="504" y="276.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Enhanced monitoring</text>
  <text x="504" y="304.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Schema evolution support</text>
  <text x="504" y="331.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Async progress tracking</text>
  <rect x="672" y="144.7223" width="304" height="225.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="824" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1647" font-weight="bold" fill="var(--warn-accent)">New Capabilities</text>
  <text x="824" y="222.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">True low-latency mode</text>
  <text x="824" y="249.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Native ML streaming</text>
  <text x="824" y="276.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Multi-query optimization</text>
  <text x="824" y="304.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Improved backpressure</text>
  <text x="824" y="331.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Cross-stream operations</text>
  <rect x="992" y="144.7223" width="248" height="225.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1115.2" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1647" font-weight="bold" fill="var(--info-accent)">Vision</text>
  <text x="1115.2" y="222.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Unified batch +</text>
  <text x="1115.2" y="246.2223" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">streaming runtime</text>
  <text x="1115.2" y="281.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Sub-millisecond</text>
  <text x="1115.2" y="305.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Auto-scaling</text>
  <text x="1115.2" y="338.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">Serverless</text>
  <text x="1115.2" y="362.2223" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651" fill="var(--text-muted)">streaming</text>
  <rect x="40" y="410.5556" width="1184" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="632" y="447.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)">Ecosystem Growth</text>
  <text x="632" y="479.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1647" fill="var(--text-muted)">Delta Lake | Apache Iceberg | Apache Hudi | Confluent Platform | Databricks | Cloud-native integrations</text>
  <rect x="40" y="523.3333" width="1184" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="632" y="560.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6784" font-weight="bold" fill="var(--text)">Competitive Landscape</text>
  <text x="632" y="595.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1647" fill="var(--text-muted)">Apache Flink (true streaming) | Kafka Streams (lightweight) | Apache Beam (unified) | Materialize (SQL streaming)</text>
</svg>
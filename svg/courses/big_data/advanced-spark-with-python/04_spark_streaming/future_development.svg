<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="72" y1="57.575638567478" x2="1192" y2="57.575638567478" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1224" y="66.36356694214" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text)">Future</text>
  <rect x="171.89" y="44.364946001874" width="24.2196" height="26.421385131208" rx="12.648274381549" fill="var(--primary-accent)" stroke="var(--bg)" stroke-width="2.9553"/>
  <text x="184" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" font-weight="bold" fill="var(--primary-accent)">Current</text>
  <rect x="491.89" y="44.364946001874" width="24.2196" height="26.421385131208" rx="12.648274381549" fill="var(--ok-accent)" stroke="var(--bg)" stroke-width="2.9553"/>
  <text x="504" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" font-weight="bold" fill="var(--ok-accent)">Near-term</text>
  <rect x="811.89" y="44.364946001874" width="24.2196" height="26.421385131208" rx="12.648274381549" fill="var(--warn-accent)" stroke="var(--bg)" stroke-width="2.9553"/>
  <text x="824" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" font-weight="bold" fill="var(--warn-accent)">Mid-term</text>
  <rect x="1099.89" y="44.364946001874" width="24.2196" height="26.421385131208" rx="12.648274381549" fill="url(#grad-info)" stroke="var(--bg)" stroke-width="2.9553" filter="url(#shadow)"/>
  <text x="1112" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" font-weight="bold" fill="var(--info-accent)">Long-term</text>
  <rect x="40" y="101.515171349865" width="288" height="246.060685399459" rx="6.266796007308" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184" y="145.454485950406" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.972411572324" font-weight="bold" fill="var(--primary-accent)">Spark 3.x Stable</text>
  <text x="184" y="185.878781928374" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Structured Streaming</text>
  <text x="184" y="215.75747658401" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Micro-batch default</text>
  <text x="184" y="245.636389421491" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Kafka integration</text>
  <text x="184" y="275.515084077127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Delta Lake support</text>
  <text x="184" y="305.393996914608" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Session windows</text>
  <text x="184" y="335.272691570243" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">RocksDB state store</text>
  <rect x="352" y="101.515171349865" width="304" height="246.060685399459" rx="6.266796007308" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="504" y="145.454485950406" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.972411572324" font-weight="bold" fill="var(--ok-accent)">Enhancements</text>
  <text x="504" y="185.878781928374" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Improved continuous mode</text>
  <text x="504" y="215.75747658401" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Better state store APIs</text>
  <text x="504" y="245.636389421491" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Enhanced monitoring</text>
  <text x="504" y="275.515084077127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Schema evolution support</text>
  <text x="504" y="305.393996914608" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Async progress tracking</text>
  <rect x="672" y="101.515171349865" width="304" height="246.060685399459" rx="6.266796007308" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824" y="145.454485950406" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.972411572324" font-weight="bold" fill="var(--warn-accent)">New Capabilities</text>
  <text x="824" y="185.878781928374" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">True low-latency mode</text>
  <text x="824" y="215.75747658401" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Native ML streaming</text>
  <text x="824" y="245.636389421491" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Multi-query optimization</text>
  <text x="824" y="275.515084077127" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Improved backpressure</text>
  <text x="824" y="305.393996914608" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Cross-stream operations</text>
  <rect x="992" y="101.515171349865" width="248" height="246.060685399459" rx="6.266796007308" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.2" y="145.454485950406" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.972411572324" font-weight="bold" fill="var(--info-accent)">Vision</text>
  <text x="1115.2" y="185.878781928374" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Unified batch +</text>
  <text x="1115.2" y="212.242457961437" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">streaming runtime</text>
  <text x="1115.2" y="250.909080991734" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Sub-millisecond</text>
  <text x="1115.2" y="277.272757024797" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Auto-scaling</text>
  <text x="1115.2" y="312.424252341599" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">Serverless</text>
  <text x="1115.2" y="338.787928374662" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.39140338628" fill="var(--text-muted)">streaming</text>
  <rect x="40" y="391.515171349865" width="1184" height="96.666666666667" rx="6.266796007308" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="431.939467327833" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.553419758367" font-weight="bold" fill="var(--ok-accent)">Ecosystem Growth</text>
  <text x="632" y="467.090853553712" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.972411572324" fill="var(--text-muted)">Delta Lake | Apache Iceberg | Apache Hudi | Confluent Platform | Databricks | Cloud-native integrations</text>
  <rect x="40" y="514.545404958671" width="1184" height="105.454595041329" rx="6.266796007308" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="632" y="554.96970093664" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.553419758367" font-weight="bold" fill="var(--text)">Competitive Landscape</text>
  <text x="632" y="593.636323966937" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.972411572324" fill="var(--text-muted)">Apache Flink (true streaming) | Kafka Streams (lightweight) | Apache Beam (unified) | Materialize (SQL streaming)</text>
</svg>

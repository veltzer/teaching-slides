  <rect x="44.329" y="423.8961" width="1093.4488" height="91.4286" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="591.0534" y="462.1299" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--ok-accent)">Ecosystem Growth</text>
  <text x="591.0534" y="495.3766" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Delta Lake | Apache Iceberg | Apache Hudi | Confluent Platform | Databricks | Cloud-native integrations</text>
  <rect x="44.329" y="540.2597" width="1093.4488" height="99.7403" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="591.0534" y="578.4935" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--text)">Competitive Landscape</text>
  <text x="591.0534" y="615.0649" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Apache Flink (true streaming) | Kafka Streams (lightweight) | Apache Beam (unified) | Materialize (SQL streaming)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-fd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="41.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6421" font-weight="bold" fill="var(--text)">Future Development Roadmap</text>
  <line x1="73.8817" y1="108.0519" x2="1108.2251" y2="108.0519" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-fd)" />
  <text x="1137.7778" y="116.3636" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text)">Future</text>
  <circle cx="177.316" cy="108.0519" r="11.8211" fill="var(--primary-accent)" stroke="var(--bg)" stroke-width="2.9553" />
  <text x="177.316" y="91.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" font-weight="bold" fill="var(--primary-accent)">Current</text>
  <circle cx="472.8427" cy="108.0519" r="11.8211" fill="var(--ok-accent)" stroke="var(--bg)" stroke-width="2.9553" />
  <text x="472.8427" y="91.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" font-weight="bold" fill="var(--ok-accent)">Near-term</text>
  <circle cx="768.3694" cy="108.0519" r="11.8211" fill="var(--warn-accent)" stroke="var(--bg)" stroke-width="2.9553" />
  <text x="768.3694" y="91.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" font-weight="bold" fill="var(--warn-accent)">Mid-term</text>
  <circle cx="1034.3434" cy="108.0519" r="11.8211" fill="var(--info-fill)" stroke="var(--bg)" stroke-width="2.9553" />
  <text x="1034.3434" y="91.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" font-weight="bold" fill="var(--info-accent)">Long-term</text>
  <rect x="44.329" y="149.6104" width="265.974" height="232.7273" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="177.316" y="191.1688" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Spark 3.x Stable</text>
  <text x="177.316" y="229.4026" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Structured Streaming</text>
  <text x="177.316" y="257.6623" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Micro-batch default</text>
  <text x="177.316" y="285.9221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Kafka integration</text>
  <text x="177.316" y="314.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Delta Lake support</text>
  <text x="177.316" y="342.4416" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Session windows</text>
  <text x="177.316" y="370.7013" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">RocksDB state store</text>
  <rect x="332.4675" y="149.6104" width="280.7504" height="232.7273" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="472.8427" y="191.1688" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Enhancements</text>
  <text x="472.8427" y="229.4026" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Improved continuous mode</text>
  <text x="472.8427" y="257.6623" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Better state store APIs</text>
  <text x="472.8427" y="285.9221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Enhanced monitoring</text>
  <text x="472.8427" y="314.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Schema evolution support</text>
  <text x="472.8427" y="342.4416" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Async progress tracking</text>
  <rect x="627.9942" y="149.6104" width="280.7504" height="232.7273" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="768.3694" y="191.1688" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--warn-accent)">New Capabilities</text>
  <text x="768.3694" y="229.4026" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">True low-latency mode</text>

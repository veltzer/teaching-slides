  <text x="768.3694" y="285.9221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Multi-query optimization</text>
  <text x="768.3694" y="314.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Improved backpressure</text>
  <text x="768.3694" y="342.4416" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Cross-stream operations</text>
  <rect x="923.5209" y="149.6104" width="229.0332" height="232.7273" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1037.2987" y="191.1688" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--info-accent)">Vision</text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrow-wc" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.6,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="598.8304" y="42.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9532" font-weight="bold" fill="#333">Watermark Configuration</ns0:text>
  <ns0:line x1="74.8538" y1="134.7368" x2="1122.807" y2="134.7368" stroke="#333" stroke-width="2.9942" marker-end="url(#arrow-wc)" />
  <ns0:text x="1152.7485" y="143.1579" font-family="Arial, sans-serif" font-size="17.9649" fill="#333">Time</ns0:text>
  <ns0:line x1="224.5614" y1="117.8947" x2="224.5614" y2="151.5789" stroke="#0277bd" stroke-width="2.9942" />
  <ns0:text x="224.5614" y="109.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#0277bd">E1</ns0:text>
  <ns0:line x1="374.269" y1="117.8947" x2="374.269" y2="151.5789" stroke="#0277bd" stroke-width="2.9942" />
  <ns0:text x="374.269" y="109.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#0277bd">E2</ns0:text>
  <ns0:line x1="598.8304" y1="117.8947" x2="598.8304" y2="151.5789" stroke="#0277bd" stroke-width="2.9942" />
  <ns0:text x="598.8304" y="109.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#0277bd">E3</ns0:text>
  <ns0:line x1="823.3918" y1="117.8947" x2="823.3918" y2="151.5789" stroke="#0277bd" stroke-width="2.9942" />
  <ns0:text x="823.3918" y="109.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#0277bd">E4</ns0:text>
  <ns0:line x1="479.0643" y1="117.8947" x2="479.0643" y2="151.5789" stroke="#d32f2f" stroke-width="2.9942" />
  <ns0:text x="479.0643" y="92.6316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="#d32f2f">Late!</ns0:text>
  <ns0:line x1="74.8538" y1="218.9474" x2="1122.807" y2="218.9474" stroke="#ef6c00" stroke-width="2.9942" stroke-dasharray="8.9825 4.4912" />
  <ns0:text x="89.8246" y="210.5263" font-family="Arial, sans-serif" font-size="17.9649" font-weight="bold" fill="#ef6c00">Watermark</ns0:text>
  <ns0:line x1="224.5614" y1="218.9474" x2="224.5614" y2="244.2105" stroke="#ef6c00" stroke-width="1.4971" />
  <ns0:line x1="224.5614" y1="244.2105" x2="374.269" y2="244.2105" stroke="#ef6c00" stroke-width="1.4971" />
  <ns0:line x1="374.269" y1="218.9474" x2="374.269" y2="261.0526" stroke="#ef6c00" stroke-width="1.4971" />
  <ns0:line x1="374.269" y1="261.0526" x2="598.8304" y2="261.0526" stroke="#ef6c00" stroke-width="1.4971" />
  <ns0:line x1="598.8304" y1="218.9474" x2="598.8304" y2="277.8947" stroke="#ef6c00" stroke-width="1.4971" />
  <ns0:line x1="598.8304" y1="277.8947" x2="823.3918" y2="277.8947" stroke="#ef6c00" stroke-width="1.4971" />
  <ns0:text x="299.4152" y="240.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9708" fill="#ef6c00">WM = E1 - threshold</ns0:text>
  <ns0:text x="486.5497" y="257.6842" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9708" fill="#ef6c00">WM = E2 - threshold</ns0:text>
  <ns0:rect x="74.8538" y="320" width="509.0058" height="320" rx="11.9766" fill="#e1f5fe" stroke="#0277bd" stroke-width="2.9942" />
  <ns0:text x="329.3567" y="362.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="#0277bd">How Watermarks Work</ns0:text>
  <ns0:text x="104.7953" y="404.2105" font-family="Arial, sans-serif" font-size="17.9649" fill="#555">1. Track max event time seen so far</ns0:text>
  <ns0:text x="104.7953" y="437.8947" font-family="Arial, sans-serif" font-size="17.9649" fill="#555">2. Watermark = max_event_time - threshold</ns0:text>
  <ns0:text x="104.7953" y="471.5789" font-family="Arial, sans-serif" font-size="17.9649" fill="#555">3. Data older than watermark is dropped</ns0:text>
  <ns0:text x="104.7953" y="505.2632" font-family="Arial, sans-serif" font-size="17.9649" fill="#555">4. State for old windows is cleaned up</ns0:text>
  <ns0:text x="104.7953" y="555.7895" font-family="Arial, sans-serif" font-size="17.9649" font-style="italic" fill="#888">withWatermark("eventTime", "10 minutes")</ns0:text>
  <ns0:text x="104.7953" y="589.4737" font-family="Arial, sans-serif" font-size="17.9649" font-style="italic" fill="#888">threshold = allowed lateness</ns0:text>
  <ns0:rect x="628.7719" y="320" width="523.9766" height="320" rx="11.9766" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.9942" />
  <ns0:text x="890.7602" y="362.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="#ef6c00">Configuration Tips</ns0:text>
  <ns0:text x="658.7135" y="404.2105" font-family="Arial, sans-serif" font-size="17.9649" fill="#555">Too small threshold:</ns0:text>
  <ns0:text x="658.7135" y="432.8421" font-family="Arial, sans-serif" font-size="17.9649" fill="#d32f2f">  - Drops legitimate late data</ns0:text>
  <ns0:text x="658.7135" y="471.5789" font-family="Arial, sans-serif" font-size="17.9649" fill="#555">Too large threshold:</ns0:text>
  <ns0:text x="658.7135" y="500.2105" font-family="Arial, sans-serif" font-size="17.9649" fill="#d32f2f">  - Excessive state / memory</ns0:text>
  <ns0:text x="658.7135" y="538.9474" font-family="Arial, sans-serif" font-size="17.9649" fill="#555">Best practice:</ns0:text>
  <ns0:text x="658.7135" y="567.5789" font-family="Arial, sans-serif" font-size="17.9649" fill="#2e7d32">  - Analyze actual data lateness</ns0:text>
  <ns0:text x="658.7135" y="596.2105" font-family="Arial, sans-serif" font-size="17.9649" fill="#2e7d32">  - Start with P99 lateness + buffer</ns0:text>
</ns0:svg>
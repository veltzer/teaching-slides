<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow-wc" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="#333">Watermark Configuration</text>
  <line x1="80" y1="144" x2="1200" y2="144" stroke="#333" stroke-width="3.2" marker-end="url(#arrow-wc)" />
  <text x="1232" y="153" font-family="Arial, sans-serif" font-size="19.2" fill="#333">Time</text>
  <line x1="240" y1="126" x2="240" y2="162" stroke="#0277bd" stroke-width="3.2" />
  <text x="240" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#0277bd">E1</text>
  <line x1="400" y1="126" x2="400" y2="162" stroke="#0277bd" stroke-width="3.2" />
  <text x="400" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#0277bd">E2</text>
  <line x1="640" y1="126" x2="640" y2="162" stroke="#0277bd" stroke-width="3.2" />
  <text x="640" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#0277bd">E3</text>
  <line x1="880" y1="126" x2="880" y2="162" stroke="#0277bd" stroke-width="3.2" />
  <text x="880" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#0277bd">E4</text>
  <line x1="512" y1="126" x2="512" y2="162" stroke="#d32f2f" stroke-width="3.2" />
  <text x="512" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#d32f2f">Late!</text>
  <line x1="80" y1="234" x2="1200" y2="234" stroke="#ef6c00" stroke-width="3.2" stroke-dasharray="9.6 4.8" />
  <text x="96" y="225" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#ef6c00">Watermark</text>
  <line x1="240" y1="234" x2="240" y2="261" stroke="#ef6c00" stroke-width="1.6" />
  <line x1="240" y1="261" x2="400" y2="261" stroke="#ef6c00" stroke-width="1.6" />
  <line x1="400" y1="234" x2="400" y2="279" stroke="#ef6c00" stroke-width="1.6" />
  <line x1="400" y1="279" x2="640" y2="279" stroke="#ef6c00" stroke-width="1.6" />
  <line x1="640" y1="234" x2="640" y2="297" stroke="#ef6c00" stroke-width="1.6" />
  <line x1="640" y1="297" x2="880" y2="297" stroke="#ef6c00" stroke-width="1.6" />
  <text x="320" y="257.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ef6c00">WM = E1 - threshold</text>
  <text x="520" y="275.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ef6c00">WM = E2 - threshold</text>
  <rect x="80" y="342" width="544" height="342" rx="12.8" fill="#e1f5fe" stroke="#0277bd" stroke-width="3.2" />
  <text x="352" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#0277bd">How Watermarks Work</text>
  <text x="112" y="432" font-family="Arial, sans-serif" font-size="19.2" fill="#555">1. Track max event time seen so far</text>
  <text x="112" y="468" font-family="Arial, sans-serif" font-size="19.2" fill="#555">2. Watermark = max_event_time - threshold</text>
  <text x="112" y="504" font-family="Arial, sans-serif" font-size="19.2" fill="#555">3. Data older than watermark is dropped</text>
  <text x="112" y="540" font-family="Arial, sans-serif" font-size="19.2" fill="#555">4. State for old windows is cleaned up</text>
  <text x="112" y="594" font-family="Arial, sans-serif" font-size="19.2" font-style="italic" fill="#888">withWatermark("eventTime", "10 minutes")</text>
  <text x="112" y="630" font-family="Arial, sans-serif" font-size="19.2" font-style="italic" fill="#888">threshold = allowed lateness</text>
  <rect x="672" y="342" width="560" height="342" rx="12.8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.2" />
  <text x="952" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#ef6c00">Configuration Tips</text>
  <text x="704" y="432" font-family="Arial, sans-serif" font-size="19.2" fill="#555">Too small threshold:</text>
  <text x="704" y="462.6" font-family="Arial, sans-serif" font-size="19.2" fill="#d32f2f">  - Drops legitimate late data</text>
  <text x="704" y="504" font-family="Arial, sans-serif" font-size="19.2" fill="#555">Too large threshold:</text>
  <text x="704" y="534.6" font-family="Arial, sans-serif" font-size="19.2" fill="#d32f2f">  - Excessive state / memory</text>
  <text x="704" y="576" font-family="Arial, sans-serif" font-size="19.2" fill="#555">Best practice:</text>
  <text x="704" y="606.6" font-family="Arial, sans-serif" font-size="19.2" fill="#2e7d32">  - Analyze actual data lateness</text>
  <text x="704" y="637.2" font-family="Arial, sans-serif" font-size="19.2" fill="#2e7d32">  - Start with P99 lateness + buffer</text>
</svg>
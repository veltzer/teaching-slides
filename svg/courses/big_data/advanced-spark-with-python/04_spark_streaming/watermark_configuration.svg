<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-wc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9532" font-weight="bold" fill="var(--text)">Watermark Configuration</text>
  <line x1="74.8538" y1="134.7368" x2="1122.807" y2="134.7368" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-wc)" />
  <text x="1152.7485" y="143.1579" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--text)">Time</text>
  <line x1="224.5614" y1="117.8947" x2="224.5614" y2="151.5789" stroke="var(--primary-border)" stroke-width="2" />
  <text x="224.5614" y="109.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--primary-accent)">E1</text>
  <line x1="374.269" y1="117.8947" x2="374.269" y2="151.5789" stroke="var(--primary-border)" stroke-width="2" />
  <text x="374.269" y="109.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--primary-accent)">E2</text>
  <line x1="598.8304" y1="117.8947" x2="598.8304" y2="151.5789" stroke="var(--primary-border)" stroke-width="2" />
  <text x="598.8304" y="109.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--primary-accent)">E3</text>
  <line x1="823.3918" y1="117.8947" x2="823.3918" y2="151.5789" stroke="var(--primary-border)" stroke-width="2" />
  <text x="823.3918" y="109.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--primary-accent)">E4</text>
  <line x1="479.0643" y1="117.8947" x2="479.0643" y2="151.5789" stroke="var(--danger-border)" stroke-width="2" />
  <text x="479.0643" y="92.6316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--danger-accent)">Late!</text>
  <line x1="74.8538" y1="218.9474" x2="1122.807" y2="218.9474" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.9825 4.4912" />
  <text x="89.8246" y="210.5263" font-family="Arial, sans-serif" font-size="17.9649" font-weight="bold" fill="var(--warn-accent)">Watermark</text>
  <line x1="224.5614" y1="218.9474" x2="224.5614" y2="244.2105" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="224.5614" y1="244.2105" x2="374.269" y2="244.2105" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="374.269" y1="218.9474" x2="374.269" y2="261.0526" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="374.269" y1="261.0526" x2="598.8304" y2="261.0526" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="598.8304" y1="218.9474" x2="598.8304" y2="277.8947" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="598.8304" y1="277.8947" x2="823.3918" y2="277.8947" stroke="var(--warn-border)" stroke-width="1.4971" />
  <text x="299.4152" y="240.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9708" fill="var(--warn-accent)">WM = E1 - threshold</text>
  <text x="486.5497" y="257.6842" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9708" fill="var(--warn-accent)">WM = E2 - threshold</text>
  <rect x="74.8538" y="320" width="509.0058" height="320" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="329.3567" y="362.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="var(--primary-accent)">How Watermarks Work</text>
  <text x="104.7953" y="404.2105" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--text-muted)">1. Track max event time seen so far</text>
  <text x="104.7953" y="437.8947" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--text-muted)">2. Watermark = max_event_time - threshold</text>
  <text x="104.7953" y="471.5789" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--text-muted)">3. Data older than watermark is dropped</text>
  <text x="104.7953" y="505.2632" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--text-muted)">4. State for old windows is cleaned up</text>
  <text x="104.7953" y="555.7895" font-family="Arial, sans-serif" font-size="17.9649" font-style="italic" fill="var(--text-faint)">withWatermark("eventTime", "10 minutes")</text>
  <text x="104.7953" y="589.4737" font-family="Arial, sans-serif" font-size="17.9649" font-style="italic" fill="var(--text-faint)">threshold = allowed lateness</text>
  <rect x="628.7719" y="320" width="523.9766" height="320" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="890.7602" y="362.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="var(--warn-accent)">Configuration Tips</text>
  <text x="658.7135" y="404.2105" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--text-muted)">Too small threshold:</text>
  <text x="658.7135" y="432.8421" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--danger-accent)">  - Drops legitimate late data</text>
  <text x="658.7135" y="471.5789" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--text-muted)">Too large threshold:</text>
  <text x="658.7135" y="500.2105" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--danger-accent)">  - Excessive state / memory</text>
  <text x="658.7135" y="538.9474" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--text-muted)">Best practice:</text>
  <text x="658.7135" y="567.5789" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--ok-accent)">  - Analyze actual data lateness</text>
  <text x="658.7135" y="596.2105" font-family="Arial, sans-serif" font-size="17.9649" fill="var(--ok-accent)">  - Start with P99 lateness + buffer</text>
</svg>
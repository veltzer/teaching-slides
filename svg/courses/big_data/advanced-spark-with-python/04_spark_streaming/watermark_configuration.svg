<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="623.3333" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.8924" font-weight="bold" fill="var(--text)">Watermark Configuration</text>
  <line x1="40" y1="129.8591" x2="1206.6667" y2="129.8591" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1240" y="138.0281" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--text)">Time</text>
  <line x1="206.6667" y1="113.5211" x2="206.6667" y2="146.1971" stroke="var(--primary-border)" stroke-width="2" />
  <text x="206.6667" y="105.3521" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--primary-accent)">E1</text>
  <line x1="373.3333" y1="113.5211" x2="373.3333" y2="146.1971" stroke="var(--primary-border)" stroke-width="2" />
  <text x="373.3333" y="105.3521" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--primary-accent)">E2</text>
  <line x1="623.3333" y1="113.5211" x2="623.3333" y2="146.1971" stroke="var(--primary-border)" stroke-width="2" />
  <text x="623.3333" y="105.3521" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--primary-accent)">E3</text>
  <line x1="873.3333" y1="113.5211" x2="873.3333" y2="146.1971" stroke="var(--primary-border)" stroke-width="2" />
  <text x="873.3333" y="105.3521" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--primary-accent)">E4</text>
  <line x1="490" y1="113.5211" x2="490" y2="146.1971" stroke="var(--danger-border)" stroke-width="2" />
  <text x="490" y="89.0141" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1135" fill="var(--danger-accent)">Late!</text>
  <line x1="40" y1="211.5493" x2="1206.6667" y2="211.5493" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.9825 4.4912" />
  <text x="56.6667" y="203.3802" font-family="Arial, sans-serif" font-size="18.6693" font-weight="bold" fill="var(--warn-accent)">Watermark</text>
  <line x1="206.6667" y1="211.5493" x2="206.6667" y2="236.0563" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="206.6667" y1="236.0563" x2="373.3333" y2="236.0563" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="373.3333" y1="211.5493" x2="373.3333" y2="252.3943" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="373.3333" y1="252.3943" x2="623.3333" y2="252.3943" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="623.3333" y1="211.5493" x2="623.3333" y2="268.7323" stroke="var(--warn-border)" stroke-width="1.4971" />
  <line x1="623.3333" y1="268.7323" x2="873.3333" y2="268.7323" stroke="var(--warn-border)" stroke-width="1.4971" />
  <text x="290" y="232.7887" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5578" fill="var(--warn-accent)">WM = E1 - threshold</text>
  <text x="498.3333" y="249.1267" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.5578" fill="var(--warn-accent)">WM = E2 - threshold</text>
  <rect x="40" y="309.5774" width="566.6666" height="310.4226" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="350.4226" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7809" font-weight="bold" fill="var(--primary-accent)">How Watermarks Work</text>
  <text x="73.3333" y="391.2676" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--text-muted)">1. Track max event time seen so far</text>
  <text x="73.3333" y="423.9436" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--text-muted)">2. Watermark = max_event_time - threshold</text>
  <text x="73.3333" y="456.6197" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--text-muted)">3. Data older than watermark is dropped</text>
  <text x="73.3333" y="489.2958" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--text-muted)">4. State for old windows is cleaned up</text>
  <text x="73.3333" y="538.3099" font-family="Arial, sans-serif" font-size="18.6693" font-style="italic" fill="var(--text-faint)">withWatermark("eventTime", "10 minutes")</text>
  <text x="73.3333" y="570.9859" font-family="Arial, sans-serif" font-size="18.6693" font-style="italic" fill="var(--text-faint)">threshold = allowed lateness</text>
  <rect x="656.6667" y="309.5774" width="583.3333" height="310.4226" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.3333" y="350.4226" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7809" font-weight="bold" fill="var(--warn-accent)">Configuration Tips</text>
  <text x="690.0001" y="391.2676" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--text-muted)">Too small threshold:</text>
  <text x="690.0001" y="419.0422" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--danger-accent)">  - Drops legitimate late data</text>
  <text x="690.0001" y="456.6197" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--text-muted)">Too large threshold:</text>
  <text x="690.0001" y="484.3943" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--danger-accent)">  - Excessive state / memory</text>
  <text x="690.0001" y="521.9719" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--text-muted)">Best practice:</text>
  <text x="690.0001" y="549.7464" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--ok-accent)">  - Analyze actual data lateness</text>
  <text x="690.0001" y="577.5211" font-family="Arial, sans-serif" font-size="18.6693" fill="var(--ok-accent)">  - Start with P99 lateness + buffer</text>
</svg>
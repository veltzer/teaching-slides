<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="40" y1="84.615308994081" x2="1206.6667" y2="84.615308994081" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1240" y="93.538370792897" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--text)">Time</text>
  <line x1="206.6667" y1="66.769185396448" x2="206.6667" y2="102.461432591713" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="206.6667" y="57.846123597632" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.885922374215" fill="var(--primary-accent)">E1</text>
  <line x1="373.3333" y1="66.769185396448" x2="373.3333" y2="102.461432591713" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="373.3333" y="57.846123597632" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.885922374215" fill="var(--primary-accent)">E2</text>
  <line x1="623.3333" y1="66.769185396448" x2="623.3333" y2="102.461432591713" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="623.3333" y="57.846123597632" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.885922374215" fill="var(--primary-accent)">E3</text>
  <line x1="873.3333" y1="66.769185396448" x2="873.3333" y2="102.461432591713" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="873.3333" y="57.846123597632" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.885922374215" fill="var(--primary-accent)">E4</text>
  <line x1="490" y1="66.769185396448" x2="490" y2="102.461432591713" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="490" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.885922374215" fill="var(--danger-accent)">Late!</text>
  <line x1="40" y1="173.846145443787" x2="1206.6667" y2="173.846145443787" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8.9825 4.4912"/>
  <text x="56.6667" y="164.922974414198" font-family="Arial, sans-serif" font-size="19.511943821014" font-weight="bold" fill="var(--warn-accent)">Watermark</text>
  <line x1="206.6667" y1="173.846145443787" x2="206.6667" y2="200.615330840235" stroke="var(--warn-border)" stroke-width="1.4971"/>
  <line x1="206.6667" y1="200.615330840235" x2="373.3333" y2="200.615330840235" stroke="var(--warn-border)" stroke-width="1.4971"/>
  <line x1="373.3333" y1="173.846145443787" x2="373.3333" y2="218.461454437867" stroke="var(--warn-border)" stroke-width="1.4971"/>
  <line x1="373.3333" y1="218.461454437867" x2="623.3333" y2="218.461454437867" stroke="var(--warn-border)" stroke-width="1.4971"/>
  <line x1="623.3333" y1="173.846145443787" x2="623.3333" y2="236.3075780355" stroke="var(--warn-border)" stroke-width="1.4971"/>
  <line x1="623.3333" y1="236.3075780355" x2="873.3333" y2="236.3075780355" stroke="var(--warn-border)" stroke-width="1.4971"/>
  <text x="290" y="197.046106120709" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.260005440942" fill="var(--warn-accent)">WM = E1 - threshold</text>
  <text x="498.3333" y="214.892229718341" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.260005440942" fill="var(--warn-accent)">WM = E2 - threshold</text>
  <rect x="40" y="280.922996260353" width="566.6666" height="339.077003739647" rx="6.270811595833" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.3333" y="325.538523715978" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.763986714613" font-weight="bold" fill="var(--primary-accent)">How Watermarks Work</text>
  <text x="73.3333" y="370.153832710059" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--text-muted)">1. Track max event time seen so far</text>
  <text x="73.3333" y="405.846079905323" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--text-muted)">2. Watermark = max_event_time - threshold</text>
  <text x="73.3333" y="441.53843633136" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--text-muted)">3. Data older than watermark is dropped</text>
  <text x="73.3333" y="477.230792757397" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--text-muted)">4. State for old windows is cleaned up</text>
  <text x="73.3333" y="530.769272781066" font-family="Arial, sans-serif" font-size="19.511943821014" font-style="italic" fill="var(--text-faint)">withWatermark("eventTime", "10 minutes")</text>
  <text x="73.3333" y="566.461519976331" font-family="Arial, sans-serif" font-size="19.511943821014" font-style="italic" fill="var(--text-faint)">threshold = allowed lateness</text>
  <rect x="656.6667" y="280.922996260353" width="583.3333" height="339.077003739647" rx="6.270811595833" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.3333" y="325.538523715978" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.763986714613" font-weight="bold" fill="var(--warn-accent)">Configuration Tips</text>
  <text x="690.0001" y="370.153832710059" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--text-muted)">Too small threshold:</text>
  <text x="690.0001" y="400.492242826034" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--danger-accent)">  - Drops legitimate late data</text>
  <text x="690.0001" y="441.53843633136" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--text-muted)">Too large threshold:</text>
  <text x="690.0001" y="471.876846447335" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--danger-accent)">  - Excessive state / memory</text>
  <text x="690.0001" y="512.923149183434" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--text-muted)">Best practice:</text>
  <text x="690.0001" y="543.261450068637" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--ok-accent)">  - Analyze actual data lateness</text>
  <text x="690.0001" y="573.599969415384" font-family="Arial, sans-serif" font-size="19.511943821014" fill="var(--ok-accent)">  - Start with P99 lateness + buffer</text>
</svg>

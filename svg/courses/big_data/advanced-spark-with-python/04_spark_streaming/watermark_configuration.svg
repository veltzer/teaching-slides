<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-wc" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Watermark Configuration</text>

  <!-- Timeline -->
  <line x1="50" y1="80" x2="750" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrow-wc)"/>
  <text x="770" y="85" font-family="Arial, sans-serif" font-size="12" fill="#333">Time</text>

  <!-- Event time markers -->
  <line x1="150" y1="70" x2="150" y2="90" stroke="#0277bd" stroke-width="2"/>
  <text x="150" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">E1</text>
  <line x1="250" y1="70" x2="250" y2="90" stroke="#0277bd" stroke-width="2"/>
  <text x="250" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">E2</text>
  <line x1="400" y1="70" x2="400" y2="90" stroke="#0277bd" stroke-width="2"/>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">E3</text>
  <line x1="550" y1="70" x2="550" y2="90" stroke="#0277bd" stroke-width="2"/>
  <text x="550" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0277bd">E4</text>

  <!-- Late event -->
  <line x1="320" y1="70" x2="320" y2="90" stroke="#d32f2f" stroke-width="2"/>
  <text x="320" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d32f2f">Late!</text>

  <!-- Watermark line -->
  <line x1="50" y1="130" x2="750" y2="130" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="60" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef6c00">Watermark</text>

  <!-- Watermark stepping -->
  <line x1="150" y1="130" x2="150" y2="145" stroke="#ef6c00" stroke-width="1"/>
  <line x1="150" y1="145" x2="250" y2="145" stroke="#ef6c00" stroke-width="1"/>
  <line x1="250" y1="130" x2="250" y2="155" stroke="#ef6c00" stroke-width="1"/>
  <line x1="250" y1="155" x2="400" y2="155" stroke="#ef6c00" stroke-width="1"/>
  <line x1="400" y1="130" x2="400" y2="165" stroke="#ef6c00" stroke-width="1"/>
  <line x1="400" y1="165" x2="550" y2="165" stroke="#ef6c00" stroke-width="1"/>
  <text x="200" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ef6c00">WM = E1 - threshold</text>
  <text x="325" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ef6c00">WM = E2 - threshold</text>

  <!-- Explanation box -->
  <rect x="50" y="190" width="340" height="190" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="220" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0277bd">How Watermarks Work</text>
  <text x="70" y="240" font-family="Arial, sans-serif" font-size="12" fill="#555">1. Track max event time seen so far</text>
  <text x="70" y="260" font-family="Arial, sans-serif" font-size="12" fill="#555">2. Watermark = max_event_time - threshold</text>
  <text x="70" y="280" font-family="Arial, sans-serif" font-size="12" fill="#555">3. Data older than watermark is dropped</text>
  <text x="70" y="300" font-family="Arial, sans-serif" font-size="12" fill="#555">4. State for old windows is cleaned up</text>
  <text x="70" y="330" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#888">withWatermark("eventTime", "10 minutes")</text>
  <text x="70" y="350" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#888">threshold = allowed lateness</text>

  <!-- Config options -->
  <rect x="420" y="190" width="350" height="190" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="595" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef6c00">Configuration Tips</text>
  <text x="440" y="240" font-family="Arial, sans-serif" font-size="12" fill="#555">Too small threshold:</text>
  <text x="440" y="257" font-family="Arial, sans-serif" font-size="12" fill="#d32f2f">  - Drops legitimate late data</text>
  <text x="440" y="280" font-family="Arial, sans-serif" font-size="12" fill="#555">Too large threshold:</text>
  <text x="440" y="297" font-family="Arial, sans-serif" font-size="12" fill="#d32f2f">  - Excessive state / memory</text>
  <text x="440" y="320" font-family="Arial, sans-serif" font-size="12" fill="#555">Best practice:</text>
  <text x="440" y="337" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">  - Analyze actual data lateness</text>
  <text x="440" y="354" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">  - Start with P99 lateness + buffer</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="582.7642" y="39.0243" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3106" font-weight="bold" fill="var(--text)">Common Streaming Pitfalls</text>
  <rect x="43.7073" y="70.2439" width="342.374" height="171.7073" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="214.1658" y="106.1463" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-accent)">No Watermark on Join</text>
  <text x="214.1658" y="137.3658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">State grows unbounded</text>
  <text x="214.1658" y="163.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Eventually causes OOM</text>
  <rect x="72.8455" y="184.1951" width="284.0975" height="39.0243" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="214.1658" y="210.7317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-accent)">Fix: Set watermark on both streams</text>
  <rect x="412.3057" y="70.2439" width="342.374" height="171.7073" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="582.7642" y="106.1463" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-accent)">Complete Mode + Large State</text>
  <text x="582.7642" y="137.3658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Emits entire result table</text>
  <text x="582.7642" y="163.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Driver OOM on large data</text>
  <rect x="441.4439" y="184.1951" width="284.0975" height="39.0243" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.7642" y="210.7317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-accent)">Fix: Use update or append mode</text>
  <rect x="780.904" y="70.2439" width="342.374" height="171.7073" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="951.3625" y="106.1463" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-accent)">foreachBatch Side Effects</text>
  <text x="951.3625" y="137.3658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Non-idempotent writes</text>
  <text x="951.3625" y="163.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Duplicates on retry</text>
  <rect x="810.0422" y="184.1951" width="284.0975" height="39.0243" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="951.3625" y="210.7317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-accent)">Fix: Make writes idempotent</text>
  <rect x="43.7073" y="273.1707" width="342.374" height="171.7073" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="214.1658" y="309.0732" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-accent)">No Checkpoint Location</text>
  <text x="214.1658" y="340.2927" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Progress lost on restart</text>
  <text x="214.1658" y="366.8292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Reprocesses all data</text>
  <rect x="72.8455" y="387.122" width="284.0975" height="39.0243" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="214.1658" y="413.6585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-accent)">Fix: Always set checkpointLocation</text>
  <rect x="412.3057" y="273.1707" width="342.374" height="171.7073" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="582.7642" y="309.0732" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-accent)">Tiny Trigger Intervals</text>
  <text x="582.7642" y="340.2927" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">High scheduling overhead</text>
  <text x="582.7642" y="366.8292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Poor throughput</text>
  <rect x="441.4439" y="387.122" width="284.0975" height="39.0243" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.7642" y="413.6585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-accent)">Fix: processingTime &gt;= 10s</text>
  <rect x="780.904" y="273.1707" width="342.374" height="171.7073" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="951.3625" y="309.0732" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-accent)">collect() in foreachBatch</text>
  <text x="951.3625" y="340.2927" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Pulls all data to driver</text>
  <text x="951.3625" y="366.8292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Driver OOM on large batches</text>
  <rect x="810.0422" y="387.122" width="284.0975" height="39.0243" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="951.3625" y="413.6585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-accent)">Fix: Write directly from DataFrame</text>
  <rect x="72.8455" y="483.9024" width="1019.8373" height="70.2439" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.7642" y="518.2439" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--warn-accent)">General Rule</text>
  <text x="582.7642" y="543.2194" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" fill="var(--text-muted)">Always configure: watermarks + checkpoints + proper output mode + trigger interval &gt;= 10s</text>
  <rect x="72.8455" y="569.7561" width="1019.8373" height="70.2439" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.7642" y="600.9756" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--ok-accent)">Prevention: Monitor state size | Watch processing/input rate ratio | Test with production-scale data | Set alerts</text>
</svg>
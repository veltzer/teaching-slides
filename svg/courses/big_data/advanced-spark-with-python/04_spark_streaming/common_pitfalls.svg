      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:text x="582.7642" y="39.0243" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3106" font-weight="bold" fill="var(--text-dark)">Common Streaming Pitfalls</ns0:text>
  <ns0:rect x="43.7073" y="70.2439" width="342.374" height="171.7073" rx="11.6553" fill="var(--danger-pale)" stroke="var(--danger-mid)" stroke-width="2.9138" />
  <ns0:text x="214.1658" y="106.1463" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-mid)">No Watermark on Join</ns0:text>
  <ns0:text x="214.1658" y="137.3658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">State grows unbounded</ns0:text>
  <ns0:text x="214.1658" y="163.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Eventually causes OOM</ns0:text>
  <ns0:rect x="72.8455" y="184.1951" width="284.0975" height="39.0243" rx="5.8276" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.4569" />
  <ns0:text x="214.1658" y="210.7317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-dk)">Fix: Set watermark on both streams</ns0:text>
  <ns0:rect x="412.3057" y="70.2439" width="342.374" height="171.7073" rx="11.6553" fill="var(--danger-pale)" stroke="var(--danger-mid)" stroke-width="2.9138" />
  <ns0:text x="582.7642" y="106.1463" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-mid)">Complete Mode + Large State</ns0:text>
  <ns0:text x="582.7642" y="137.3658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Emits entire result table</ns0:text>
  <ns0:text x="582.7642" y="163.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Driver OOM on large data</ns0:text>
  <ns0:rect x="441.4439" y="184.1951" width="284.0975" height="39.0243" rx="5.8276" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.4569" />
  <ns0:text x="582.7642" y="210.7317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-dk)">Fix: Use update or append mode</ns0:text>
  <ns0:rect x="780.904" y="70.2439" width="342.374" height="171.7073" rx="11.6553" fill="var(--danger-pale)" stroke="var(--danger-mid)" stroke-width="2.9138" />
  <ns0:text x="951.3625" y="106.1463" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-mid)">foreachBatch Side Effects</ns0:text>
  <ns0:text x="951.3625" y="137.3658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Non-idempotent writes</ns0:text>
  <ns0:text x="951.3625" y="163.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Duplicates on retry</ns0:text>
  <ns0:rect x="810.0422" y="184.1951" width="284.0975" height="39.0243" rx="5.8276" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.4569" />
  <ns0:text x="951.3625" y="210.7317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-dk)">Fix: Make writes idempotent</ns0:text>
  <ns0:rect x="43.7073" y="273.1707" width="342.374" height="171.7073" rx="11.6553" fill="var(--danger-pale)" stroke="var(--danger-mid)" stroke-width="2.9138" />
  <ns0:text x="214.1658" y="309.0732" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-mid)">No Checkpoint Location</ns0:text>

<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Common Streaming Pitfalls</text>

  <!-- Row 1 -->
  <rect x="30" y="45" width="235" height="110" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="147" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">No Watermark on Join</text>
  <text x="147" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">State grows unbounded</text>
  <text x="147" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Eventually causes OOM</text>
  <rect x="50" y="118" width="195" height="25" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="147" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Fix: Set watermark on both streams</text>

  <rect x="283" y="45" width="235" height="110" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="400" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">Complete Mode + Large State</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Emits entire result table</text>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Driver OOM on large data</text>
  <rect x="303" y="118" width="195" height="25" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="400" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Fix: Use update or append mode</text>

  <rect x="536" y="45" width="235" height="110" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="653" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">foreachBatch Side Effects</text>
  <text x="653" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Non-idempotent writes</text>
  <text x="653" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Duplicates on retry</text>
  <rect x="556" y="118" width="195" height="25" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="653" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Fix: Make writes idempotent</text>

  <!-- Row 2 -->
  <rect x="30" y="175" width="235" height="110" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="147" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">No Checkpoint Location</text>
  <text x="147" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Progress lost on restart</text>
  <text x="147" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Reprocesses all data</text>
  <rect x="50" y="248" width="195" height="25" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="147" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Fix: Always set checkpointLocation</text>

  <rect x="283" y="175" width="235" height="110" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="400" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">Tiny Trigger Intervals</text>
  <text x="400" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">High scheduling overhead</text>
  <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Poor throughput</text>
  <rect x="303" y="248" width="195" height="25" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="400" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Fix: processingTime &gt;= 10s</text>

  <rect x="536" y="175" width="235" height="110" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="653" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">collect() in foreachBatch</text>
  <text x="653" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Pulls all data to driver</text>
  <text x="653" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Driver OOM on large batches</text>
  <rect x="556" y="248" width="195" height="25" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="653" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">Fix: Write directly from DataFrame</text>

  <!-- Summary -->
  <rect x="50" y="310" width="700" height="45" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="400" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef6c00">General Rule</text>
  <text x="400" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Always configure: watermarks + checkpoints + proper output mode + trigger interval &gt;= 10s</text>

  <!-- Prevention checklist -->
  <rect x="50" y="365" width="700" height="45" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Prevention: Monitor state size | Watch processing/input rate ratio | Test with production-scale data | Set alerts</text>
</svg>

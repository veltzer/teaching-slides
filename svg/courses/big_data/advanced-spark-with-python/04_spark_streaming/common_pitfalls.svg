  <ns0:text x="951.3625" y="366.8292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Driver OOM on large batches</ns0:text>
  <ns0:rect x="810.0422" y="387.122" width="284.0975" height="39.0243" rx="5.8276" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.4569" />
  <ns0:text x="951.3625" y="413.6585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-dk)">Fix: Write directly from DataFrame</ns0:text>
  <ns0:rect x="72.8455" y="483.9024" width="1019.8373" height="70.2439" rx="11.6553" fill="var(--warn-pale)" stroke="var(--warn-deep)" stroke-width="1.4569" />
  <ns0:text x="582.7642" y="518.2439" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--warn-deep)">General Rule</ns0:text>
  <ns0:text x="582.7642" y="543.2194" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" fill="var(--text-muted)">Always configure: watermarks + checkpoints + proper output mode + trigger interval &gt;= 10s</ns0:text>
  <ns0:rect x="72.8455" y="569.7561" width="1019.8373" height="70.2439" rx="11.6553" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.4569" />
  <ns0:text x="582.7642" y="600.9756" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--ok-dk)">Prevention: Monitor state size | Watch processing/input rate ratio | Test with production-scale data | Set alerts</ns0:text>

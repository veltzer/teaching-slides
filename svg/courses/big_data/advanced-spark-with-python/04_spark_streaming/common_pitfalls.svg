<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="582.7642" y="39.0243" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3106" font-weight="bold" fill="#333">Common Streaming Pitfalls</ns0:text>
  <ns0:rect x="43.7073" y="70.2439" width="342.374" height="171.7073" rx="11.6553" fill="#ffebee" stroke="#d32f2f" stroke-width="2.9138" />
  <ns0:text x="214.1658" y="106.1463" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="#d32f2f">No Watermark on Join</ns0:text>
  <ns0:text x="214.1658" y="137.3658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">State grows unbounded</ns0:text>
  <ns0:text x="214.1658" y="163.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Eventually causes OOM</ns0:text>
  <ns0:rect x="72.8455" y="184.1951" width="284.0975" height="39.0243" rx="5.8276" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4569" />
  <ns0:text x="214.1658" y="210.7317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="#2e7d32">Fix: Set watermark on both streams</ns0:text>
  <ns0:rect x="412.3057" y="70.2439" width="342.374" height="171.7073" rx="11.6553" fill="#ffebee" stroke="#d32f2f" stroke-width="2.9138" />
  <ns0:text x="582.7642" y="106.1463" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="#d32f2f">Complete Mode + Large State</ns0:text>
  <ns0:text x="582.7642" y="137.3658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Emits entire result table</ns0:text>
  <ns0:text x="582.7642" y="163.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Driver OOM on large data</ns0:text>
  <ns0:rect x="441.4439" y="184.1951" width="284.0975" height="39.0243" rx="5.8276" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4569" />
  <ns0:text x="582.7642" y="210.7317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="#2e7d32">Fix: Use update or append mode</ns0:text>
  <ns0:rect x="780.904" y="70.2439" width="342.374" height="171.7073" rx="11.6553" fill="#ffebee" stroke="#d32f2f" stroke-width="2.9138" />
  <ns0:text x="951.3625" y="106.1463" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="#d32f2f">foreachBatch Side Effects</ns0:text>
  <ns0:text x="951.3625" y="137.3658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Non-idempotent writes</ns0:text>
  <ns0:text x="951.3625" y="163.9024" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Duplicates on retry</ns0:text>
  <ns0:rect x="810.0422" y="184.1951" width="284.0975" height="39.0243" rx="5.8276" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4569" />
  <ns0:text x="951.3625" y="210.7317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="#2e7d32">Fix: Make writes idempotent</ns0:text>
  <ns0:rect x="43.7073" y="273.1707" width="342.374" height="171.7073" rx="11.6553" fill="#ffebee" stroke="#d32f2f" stroke-width="2.9138" />
  <ns0:text x="214.1658" y="309.0732" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="#d32f2f">No Checkpoint Location</ns0:text>
  <ns0:text x="214.1658" y="340.2927" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Progress lost on restart</ns0:text>
  <ns0:text x="214.1658" y="366.8292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Reprocesses all data</ns0:text>
  <ns0:rect x="72.8455" y="387.122" width="284.0975" height="39.0243" rx="5.8276" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4569" />
  <ns0:text x="214.1658" y="413.6585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="#2e7d32">Fix: Always set checkpointLocation</ns0:text>
  <ns0:rect x="412.3057" y="273.1707" width="342.374" height="171.7073" rx="11.6553" fill="#ffebee" stroke="#d32f2f" stroke-width="2.9138" />
  <ns0:text x="582.7642" y="309.0732" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="#d32f2f">Tiny Trigger Intervals</ns0:text>
  <ns0:text x="582.7642" y="340.2927" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">High scheduling overhead</ns0:text>
  <ns0:text x="582.7642" y="366.8292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Poor throughput</ns0:text>
  <ns0:rect x="441.4439" y="387.122" width="284.0975" height="39.0243" rx="5.8276" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4569" />
  <ns0:text x="582.7642" y="413.6585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="#2e7d32">Fix: processingTime &gt;= 10s</ns0:text>
  <ns0:rect x="780.904" y="273.1707" width="342.374" height="171.7073" rx="11.6553" fill="#ffebee" stroke="#d32f2f" stroke-width="2.9138" />
  <ns0:text x="951.3625" y="309.0732" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="#d32f2f">collect() in foreachBatch</ns0:text>
  <ns0:text x="951.3625" y="340.2927" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Pulls all data to driver</ns0:text>
  <ns0:text x="951.3625" y="366.8292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="#555">Driver OOM on large batches</ns0:text>
  <ns0:rect x="810.0422" y="387.122" width="284.0975" height="39.0243" rx="5.8276" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4569" />
  <ns0:text x="951.3625" y="413.6585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="#2e7d32">Fix: Write directly from DataFrame</ns0:text>
  <ns0:rect x="72.8455" y="483.9024" width="1019.8373" height="70.2439" rx="11.6553" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4569" />
  <ns0:text x="582.7642" y="518.2439" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="#ef6c00">General Rule</ns0:text>
  <ns0:text x="582.7642" y="543.2194" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" fill="#555">Always configure: watermarks + checkpoints + proper output mode + trigger interval &gt;= 10s</ns0:text>
  <ns0:rect x="72.8455" y="569.7561" width="1019.8373" height="70.2439" rx="11.6553" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4569" />
  <ns0:text x="582.7642" y="600.9756" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="#2e7d32">Prevention: Monitor state size | Watch processing/input rate ratio | Test with production-scale data | Set alerts</ns0:text>
</ns0:svg>
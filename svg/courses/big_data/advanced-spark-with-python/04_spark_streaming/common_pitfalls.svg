<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.945761708923" font-weight="bold" fill="var(--primary-accent)">Streaming Pitfalls</text>

  <rect x="40" y="72.222222222222" width="390" height="257.777777777778" rx="8.291003602746" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--danger-text)">No Watermark on Join</text>
  <text x="235" y="158.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--danger-text)">State grows unbounded</text>
  <text x="235" y="190.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--danger-text)">OOM eventually</text>
  <text x="235" y="265.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--danger-text)">Fix:</text>
  <text x="235" y="297.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--danger-text)">Watermark both streams</text>

  <rect x="445" y="72.222222222222" width="390" height="257.777777777778" rx="8.291003602746" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--danger-text)">Complete Mode + State</text>
  <text x="640" y="158.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--danger-text)">Emits full table</text>
  <text x="640" y="190.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--danger-text)">Driver OOM</text>
  <text x="640" y="265.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--danger-text)">Fix:</text>
  <text x="640" y="297.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--danger-text)">Use update or append</text>

  <rect x="850" y="72.222222222222" width="390" height="257.777777777778" rx="8.291003602746" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--danger-text)">foreachBatch Effects</text>
  <text x="1045" y="158.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--danger-text)">Non-idempotent writes</text>
  <text x="1045" y="190.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--danger-text)">Duplicates on retry</text>
  <text x="1045" y="265.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--danger-text)">Fix:</text>
  <text x="1045" y="297.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--danger-text)">Idempotent writes</text>

  <rect x="40" y="362.222222222222" width="390" height="257.777777777778" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="405.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--warn-text)">No Checkpoint</text>
  <text x="235" y="448.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">Progress lost on restart</text>
  <text x="235" y="480.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">Reprocesses data</text>
  <text x="235" y="550.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--warn-text)">Fix:</text>
  <text x="235" y="582.407407407407" text-anchor="middle" font-family="Courier New, monospace" font-size="14.509256304805" fill="var(--warn-text)">checkpointLocation</text>

  <rect x="445" y="362.222222222222" width="390" height="257.777777777778" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="405.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--warn-text)">Tiny Triggers</text>
  <text x="640" y="448.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">Scheduling overhead</text>
  <text x="640" y="480.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">Poor throughput</text>
  <text x="640" y="550.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--warn-text)">Fix:</text>
  <text x="640" y="582.407407407407" text-anchor="middle" font-family="Courier New, monospace" font-size="14.509256304805" fill="var(--warn-text)">processingTime &gt;= 10s</text>

  <rect x="850" y="362.222222222222" width="390" height="257.777777777778" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="405.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--warn-text)">collect() in batch</text>
  <text x="1045" y="448.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">Pulls to driver</text>
  <text x="1045" y="480.37037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--warn-text)">Driver OOM</text>
  <text x="1045" y="550.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.582007205491" font-weight="bold" fill="var(--warn-text)">Fix:</text>
  <text x="1045" y="582.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.509256304805" fill="var(--warn-text)">Write from DataFrame</text>
</svg>

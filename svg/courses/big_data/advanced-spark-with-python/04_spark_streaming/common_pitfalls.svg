  <ns0:text x="582.7642" y="366.8292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.026" fill="var(--text-muted)">Poor throughput</ns0:text>
  <ns0:rect x="441.4439" y="387.122" width="284.0975" height="39.0243" rx="5.8276" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.4569" />
  <ns0:text x="582.7642" y="413.6585" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.5691" fill="var(--ok-dk)">Fix: processingTime &gt;= 10s</ns0:text>
  <ns0:rect x="780.904" y="273.1707" width="342.374" height="171.7073" rx="11.6553" fill="var(--danger-pale)" stroke="var(--danger-mid)" stroke-width="2.9138" />
  <ns0:text x="951.3625" y="309.0732" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4829" font-weight="bold" fill="var(--danger-mid)">collect() in foreachBatch</ns0:text>

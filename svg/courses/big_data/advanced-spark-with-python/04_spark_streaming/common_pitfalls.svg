<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.1903" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.1437" font-weight="bold" fill="var(--text)">Common Streaming Pitfalls</text>
  <rect x="40" y="70.13" width="380.5668" height="165.7142" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.4736" y="104.7793" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1077" font-weight="bold" fill="var(--danger-accent)">No Watermark on Join</text>
  <text x="229.4736" y="134.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">State grows unbounded</text>
  <text x="229.4736" y="160.5195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Eventually causes OOM</text>
  <rect x="72.3887" y="180.1039" width="315.7894" height="37.6622" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.4736" y="205.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0898" fill="var(--ok-accent)">Fix: Set watermark on both streams</text>
  <rect x="449.7166" y="70.13" width="380.5668" height="165.7142" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.1903" y="104.7793" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1077" font-weight="bold" fill="var(--danger-accent)">Complete Mode + Large State</text>
  <text x="639.1903" y="134.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Emits entire result table</text>
  <text x="639.1903" y="160.5195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Driver OOM on large data</text>
  <rect x="482.1053" y="180.1039" width="315.7894" height="37.6622" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.1903" y="205.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0898" fill="var(--ok-accent)">Fix: Use update or append mode</text>
  <rect x="859.4332" y="70.13" width="380.5668" height="165.7142" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.9068" y="104.7793" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1077" font-weight="bold" fill="var(--danger-accent)">foreachBatch Side Effects</text>
  <text x="1048.9068" y="134.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Non-idempotent writes</text>
  <text x="1048.9068" y="160.5195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Duplicates on retry</text>
  <rect x="891.8218" y="180.1039" width="315.7894" height="37.6622" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.9068" y="205.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0898" fill="var(--ok-accent)">Fix: Make writes idempotent</text>
  <rect x="40" y="265.974" width="380.5668" height="165.7142" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.4736" y="300.6235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1077" font-weight="bold" fill="var(--danger-accent)">No Checkpoint Location</text>
  <text x="229.4736" y="330.7533" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Progress lost on restart</text>
  <text x="229.4736" y="356.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Reprocesses all data</text>
  <rect x="72.3887" y="375.9481" width="315.7894" height="37.6622" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.4736" y="401.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0898" fill="var(--ok-accent)">Fix: Always set checkpointLocation</text>
  <rect x="449.7166" y="265.974" width="380.5668" height="165.7142" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.1903" y="300.6235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1077" font-weight="bold" fill="var(--danger-accent)">Tiny Trigger Intervals</text>
  <text x="639.1903" y="330.7533" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">High scheduling overhead</text>
  <text x="639.1903" y="356.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Poor throughput</text>
  <rect x="482.1053" y="375.9481" width="315.7894" height="37.6622" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.1903" y="401.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0898" fill="var(--ok-accent)">Fix: processingTime &gt;= 10s</text>
  <rect x="859.4332" y="265.974" width="380.5668" height="165.7142" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.9068" y="300.6235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1077" font-weight="bold" fill="var(--danger-accent)">collect() in foreachBatch</text>
  <text x="1048.9068" y="330.7533" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Pulls all data to driver</text>
  <text x="1048.9068" y="356.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5988" fill="var(--text-muted)">Driver OOM on large batches</text>
  <rect x="891.8218" y="375.9481" width="315.7894" height="37.6622" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.9068" y="401.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0898" fill="var(--ok-accent)">Fix: Write directly from DataFrame</text>
  <rect x="72.3887" y="469.3506" width="1133.6032" height="67.7922" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.1903" y="502.4935" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1077" font-weight="bold" fill="var(--warn-accent)">General Rule</text>
  <text x="639.1903" y="526.5973" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1077" fill="var(--text-muted)">Always configure: watermarks + checkpoints + proper output mode + trigger interval &gt;= 10s</text>
  <rect x="72.3887" y="552.2078" width="1133.6032" height="67.7922" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.1903" y="582.3377" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1077" font-weight="bold" fill="var(--ok-accent)">Prevention: Monitor state size | Watch processing/input rate ratio | Test with production-scale data | Set alerts</text>
</svg>
  <rect x="496" y="603" width="240" height="63" rx="8" fill="#fff" stroke="#d32f2f" stroke-width="1.6" />
  <text x="616" y="642.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Log + Alert</text>

  <text x="598.4416" y="161.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text-dark)">Null Check</text>
  <rect x="694.4877" y="132.987" width="147.7633" height="41.5584" rx="5.9105" fill="var(--warn-lt)" stroke="var(--warn-deep)" stroke-width="1.4776" />
  <text x="768.3694" y="161.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text-dark)">Range Check</text>
  <rect x="864.4156" y="132.987" width="147.7633" height="41.5584" rx="5.9105" fill="var(--warn-lt)" stroke="var(--warn-deep)" stroke-width="1.4776" />
  <text x="938.2973" y="161.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text-dark)">Dedup Check</text>
  <rect x="44.329" y="241.039" width="258.5859" height="199.4805" rx="11.8211" fill="var(--primary-pale3)" stroke="var(--primary-strong)" stroke-width="2.9553" />
  <text x="172.8831" y="282.5974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--primary-strong)">Schema Validation</text>
  <text x="172.8831" y="315.8442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Enforce schema on read</text>
  <text x="172.8831" y="344.1039" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Handle schema evolution</text>

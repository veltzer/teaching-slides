      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-dq" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="41.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6421" font-weight="bold" fill="var(--text-dark)">Data Quality in Streaming</text>
  <rect x="44.329" y="91.4286" width="206.8687" height="83.1169" rx="11.8211" fill="var(--primary-pale3)" stroke="var(--primary-strong)" stroke-width="2.9553" />
  <text x="147.7633" y="141.2987" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--primary-strong)">Raw Stream</text>
  <line x1="251.1977" y1="132.987" x2="310.303" y2="132.987" stroke="var(--text-dark)" stroke-width="2.9553" marker-end="url(#arrow-dq)" />
  <rect x="325.0794" y="74.8052" width="797.9221" height="116.3636" rx="11.8211" fill="var(--warn-pale)" stroke="var(--warn-deep)" stroke-width="2.9553" />
  <text x="724.0404" y="113.039" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--warn-deep)">Data Quality Pipeline</text>
  <rect x="354.632" y="132.987" width="147.7633" height="41.5584" rx="5.9105" fill="var(--warn-lt)" stroke="var(--warn-deep)" stroke-width="1.4776" />
  <text x="428.5137" y="161.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text-dark)">Schema Check</text>

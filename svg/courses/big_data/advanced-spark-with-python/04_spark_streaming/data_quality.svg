  <text x="1016" y="174.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">Dedup Check</text>
  <rect x="48" y="261" width="280" height="216" rx="12.8" fill="#e1f5fe" stroke="#0277bd" stroke-width="3.2" />
  <text x="187.2" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#0277bd">Schema Validation</text>
  <text x="187.2" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Enforce schema on read</text>
  <text x="187.2" y="372.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Handle schema evolution</text>
  <text x="187.2" y="403.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Reject malformed records</text>
  <text x="187.2" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">.schema(expected_schema)</text>
  <rect x="352" y="261" width="280" height="216" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="491.2" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#2e7d32">Completeness</text>
  <text x="491.2" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Null value detection</text>
  <text x="491.2" y="372.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Required field checks</text>
  <text x="491.2" y="403.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Default value filling</text>
  <text x="491.2" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">.filter(col.isNotNull())</text>
  <rect x="656" y="261" width="280" height="216" rx="12.8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.2" />
  <text x="795.2" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#ef6c00">Accuracy</text>
  <text x="795.2" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Range validation</text>
  <text x="795.2" y="372.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Format validation</text>
  <text x="795.2" y="403.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Business rule checks</text>
  <text x="795.2" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">.filter(col.between(...))</text>
  <rect x="960" y="261" width="280" height="216" rx="12.8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.2" />
  <text x="1099.2" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#7b1fa2">Uniqueness</text>
  <text x="1099.2" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Deduplication</text>
  <text x="1099.2" y="372.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Watermark-based dedup</text>
  <text x="1099.2" y="403.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">dropDuplicatesWithin</text>
  <text x="1099.2" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">.dropDuplicates(["id"])</text>

  <text x="172.8831" y="415.5844" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">.schema(expected_schema)</text>
  <rect x="325.0794" y="241.039" width="258.5859" height="199.4805" rx="11.8211" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.9553" />
  <text x="453.6335" y="282.5974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--ok-dk)">Completeness</text>
  <text x="453.6335" y="315.8442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Null value detection</text>
  <text x="453.6335" y="344.1039" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Required field checks</text>

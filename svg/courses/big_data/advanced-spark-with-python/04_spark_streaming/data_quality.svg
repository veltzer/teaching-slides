  <rect x="458.0664" y="556.8831" width="221.645" height="58.1818" rx="7.3882" fill="var(--bg)" stroke="var(--danger-mid)" stroke-width="1.4776" />
  <text x="568.8889" y="593.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Log + Alert</text>
  <line x1="679.7114" y1="585.1429" x2="738.8167" y2="585.1429" stroke="var(--text-dark)" stroke-width="2.2165" marker-end="url(#arrow-dq)" />
  <rect x="753.5931" y="556.8831" width="310.303" height="58.1818" rx="7.3882" fill="var(--bg)" stroke="var(--danger-mid)" stroke-width="1.4776" />
  <text x="908.7446" y="593.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Reprocess after fix</text>
</svg>
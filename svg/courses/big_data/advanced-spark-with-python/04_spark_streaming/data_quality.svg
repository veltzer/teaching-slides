<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="57.05881418685" width="225.5034" height="85.294176816617" rx="6.173949503443" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.7516" y="108.2352567474" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.316718530139" font-weight="bold" fill="var(--primary-accent)">Raw Stream</text>
  <line x1="265.5034" y1="99.705796712791" x2="329.9328" y2="99.705796712791" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="346.0403" y="40" width="869.7986" height="119.411699307949" rx="6.173949503443" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780.9396" y="79.235346747412" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.316718530139" font-weight="bold" fill="var(--warn-accent)">Data Quality Pipeline</text>
  <rect x="378.255" y="99.705796712791" width="161.0738" height="42.646982525941" rx="6.173949503443" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.7919" y="128.705918477514" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.628221277224" fill="var(--text)">Schema Check</text>
  <rect x="563.4899" y="99.705796712791" width="161.0738" height="42.646982525941" rx="6.173949503443" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.0269" y="128.705918477514" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.628221277224" fill="var(--text)">Null Check</text>
  <rect x="748.7248" y="99.705796712791" width="161.0738" height="42.646982525941" rx="6.173949503443" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="829.2617" y="128.705918477514" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.628221277224" fill="var(--text)">Range Check</text>
  <rect x="933.9597" y="99.705796712791" width="161.0738" height="42.646982525941" rx="6.173949503443" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1014.4966" y="128.705918477514" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.628221277224" fill="var(--text)">Dedup Check</text>
  <rect x="40" y="210.588247750867" width="281.8792" height="204.705876124567" rx="6.173949503443" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.1342" y="253.235230276808" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" font-weight="bold" fill="var(--primary-accent)">Schema Validation</text>
  <text x="180.1342" y="287.352964532875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Enforce schema on read</text>
  <text x="180.1342" y="316.352874532862" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Handle schema evolution</text>
  <text x="180.1342" y="345.352890415218" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Reject malformed records</text>
  <text x="180.1342" y="389.705849653975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-faint)">.schema(expected_schema)</text>
  <rect x="346.0403" y="210.588247750867" width="281.8792" height="204.705876124567" rx="6.173949503443" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486.1745" y="253.235230276808" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" font-weight="bold" fill="var(--ok-accent)">Completeness</text>
  <text x="486.1745" y="287.352964532875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Null value detection</text>
  <text x="486.1745" y="316.352874532862" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Required field checks</text>
  <text x="486.1745" y="345.352890415218" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Default value filling</text>
  <text x="486.1745" y="389.705849653975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-faint)">.filter(col.isNotNull())</text>
  <rect x="652.0805" y="210.588247750867" width="281.8792" height="204.705876124567" rx="6.173949503443" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.2147" y="253.235230276808" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" font-weight="bold" fill="var(--warn-accent)">Accuracy</text>
  <text x="792.2147" y="287.352964532875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Range validation</text>
  <text x="792.2147" y="316.352874532862" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Format validation</text>
  <text x="792.2147" y="345.352890415218" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Business rule checks</text>
  <text x="792.2147" y="389.705849653975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-faint)">.filter(col.between(...))</text>
  <rect x="958.1208" y="210.588247750867" width="281.8792" height="204.705876124567" rx="6.173949503443" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.255" y="253.235230276808" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" font-weight="bold" fill="var(--info-accent)">Uniqueness</text>
  <text x="1098.255" y="287.352964532875" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Deduplication</text>
  <text x="1098.255" y="316.352874532862" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Watermark-based dedup</text>
  <text x="1098.255" y="345.352890415218" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">dropDuplicatesWithin</text>
  <text x="1098.255" y="389.705849653975" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-faint)">.dropDuplicates(["id"])</text>
  <rect x="72.2148" y="466.470566435983" width="1127.5167" height="153.529433564017" rx="6.173949503443" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.9731" y="509.117654844292" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.316718530139" font-weight="bold" fill="var(--danger-accent)">Bad Record Handling Strategy</text>
  <rect x="120.5369" y="534.705823183383" width="289.9328" height="59.705902595159" rx="6.173949503443" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4776"/>
  <text x="265.5034" y="572.235193217979" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Dead Letter Queue (DLQ)</text>
  <line x1="410.4698" y1="563.705944948106" x2="474.8993" y2="563.705944948106" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="491.0067" y="534.705823183383" width="241.6107" height="59.705902595159" rx="6.173949503443" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4776"/>
  <text x="611.8121" y="572.235193217979" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Log + Alert</text>
  <line x1="732.6174" y1="563.705944948106" x2="797.0469" y2="563.705944948106" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="813.1544" y="534.705823183383" width="338.255" height="59.705902595159" rx="6.173949503443" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4776"/>
  <text x="982.2818" y="572.235193217979" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Reprocess after fix</text>
</svg>

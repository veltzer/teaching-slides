  <rect x="73.8817" y="490.3896" width="1034.3434" height="149.6104" rx="11.8211" fill="var(--danger-pale)" stroke="var(--danger-mid)" stroke-width="1.4776" />
  <text x="591.0534" y="531.9481" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--danger-mid)">Bad Record Handling Strategy</text>

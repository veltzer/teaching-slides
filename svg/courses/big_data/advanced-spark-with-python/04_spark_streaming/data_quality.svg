  <text x="453.6335" y="415.5844" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">.filter(col.isNotNull())</text>
  <rect x="605.8297" y="241.039" width="258.5859" height="199.4805" rx="11.8211" fill="var(--warn-pale)" stroke="var(--warn-deep)" stroke-width="2.9553" />
  <text x="734.3838" y="282.5974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--warn-deep)">Accuracy</text>
  <text x="734.3838" y="315.8442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Range validation</text>
  <text x="734.3838" y="344.1039" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Format validation</text>
  <text x="734.3838" y="372.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Business rule checks</text>
  <text x="734.3838" y="415.5844" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">.filter(col.between(...))</text>
  <rect x="886.5801" y="241.039" width="258.5859" height="199.4805" rx="11.8211" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="2.9553" />
  <text x="1015.1342" y="282.5974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--info-mid)">Uniqueness</text>

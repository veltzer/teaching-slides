<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-dq" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="41.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6421" font-weight="bold" fill="var(--text)">Data Quality in Streaming</text>
  <rect x="44.329" y="91.4286" width="206.8687" height="83.1169" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="147.7633" y="141.2987" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">Raw Stream</text>
  <line x1="251.1977" y1="132.987" x2="310.303" y2="132.987" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-dq)" />
  <rect x="325.0794" y="74.8052" width="797.9221" height="116.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="724.0404" y="113.039" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--warn-accent)">Data Quality Pipeline</text>
  <rect x="354.632" y="132.987" width="147.7633" height="41.5584" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="428.5137" y="161.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Schema Check</text>
  <rect x="524.5599" y="132.987" width="147.7633" height="41.5584" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="598.4416" y="161.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Null Check</text>
  <rect x="694.4877" y="132.987" width="147.7633" height="41.5584" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="768.3694" y="161.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Range Check</text>
  <rect x="864.4156" y="132.987" width="147.7633" height="41.5584" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="938.2973" y="161.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Dedup Check</text>
  <rect x="44.329" y="241.039" width="258.5859" height="199.4805" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="172.8831" y="282.5974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Schema Validation</text>
  <text x="172.8831" y="315.8442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Enforce schema on read</text>
  <text x="172.8831" y="344.1039" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Handle schema evolution</text>
  <text x="172.8831" y="372.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Reject malformed records</text>
  <text x="172.8831" y="415.5844" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">.schema(expected_schema)</text>
  <rect x="325.0794" y="241.039" width="258.5859" height="199.4805" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="453.6335" y="282.5974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Completeness</text>
  <text x="453.6335" y="315.8442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Null value detection</text>
  <text x="453.6335" y="344.1039" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Required field checks</text>
  <text x="453.6335" y="372.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Default value filling</text>
  <text x="453.6335" y="415.5844" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">.filter(col.isNotNull())</text>
  <rect x="605.8297" y="241.039" width="258.5859" height="199.4805" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="734.3838" y="282.5974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--warn-accent)">Accuracy</text>
  <text x="734.3838" y="315.8442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Range validation</text>
  <text x="734.3838" y="344.1039" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Format validation</text>
  <text x="734.3838" y="372.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Business rule checks</text>
  <text x="734.3838" y="415.5844" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">.filter(col.between(...))</text>
  <rect x="886.5801" y="241.039" width="258.5859" height="199.4805" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1015.1342" y="282.5974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--info-accent)">Uniqueness</text>
  <text x="1015.1342" y="315.8442" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Deduplication</text>
  <text x="1015.1342" y="344.1039" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Watermark-based dedup</text>
  <text x="1015.1342" y="372.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">dropDuplicatesWithin</text>
  <text x="1015.1342" y="415.5844" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">.dropDuplicates(["id"])</text>
  <rect x="73.8817" y="490.3896" width="1034.3434" height="149.6104" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="591.0534" y="531.9481" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--danger-accent)">Bad Record Handling Strategy</text>
  <rect x="118.2107" y="556.8831" width="265.974" height="58.1818" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4776" />
  <text x="251.1977" y="593.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Dead Letter Queue (DLQ)</text>
  <line x1="384.1847" y1="585.1429" x2="443.29" y2="585.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-dq)" />
  <rect x="458.0664" y="556.8831" width="221.645" height="58.1818" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4776" />
  <text x="568.8889" y="593.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Log + Alert</text>
  <line x1="679.7114" y1="585.1429" x2="738.8167" y2="585.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-dq)" />
  <rect x="753.5931" y="556.8831" width="310.303" height="58.1818" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4776" />
  <text x="908.7446" y="593.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Reprocess after fix</text>
</svg>
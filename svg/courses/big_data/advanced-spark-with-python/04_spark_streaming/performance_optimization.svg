<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="461.6215" y="40" width="356.7567" height="86.567111984857" rx="6.176507897227" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="91.94030957897" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.116633594793" font-weight="bold" fill="var(--primary-accent)">Optimization Areas</text>
  <rect x="40" y="187.164228135437" width="275.6756" height="190.447837112935" rx="6.176507897227" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="230.447731142797" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536888758279" font-weight="bold" fill="var(--primary-accent)">Partitioning</text>
  <text x="177.8378" y="265.074639518823" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">Match Kafka partitions</text>
  <text x="177.8378" y="294.507421563827" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">Repartition for joins</text>
  <text x="177.8378" y="323.94030957897" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">Avoid data skew</text>
  <text x="177.8378" y="353.373197594113" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-faint)">spark.sql.shuffle.partitions</text>
  <rect x="348.108" y="187.164228135437" width="275.6756" height="190.447837112935" rx="6.176507897227" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.9459" y="230.447731142797" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536888758279" font-weight="bold" fill="var(--ok-accent)">Batch Tuning</text>
  <text x="485.9459" y="265.074639518823" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">Trigger interval</text>
  <text x="485.9459" y="294.507421563827" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">maxOffsetsPerTrigger</text>
  <text x="485.9459" y="323.94030957897" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">Batch size vs latency</text>
  <text x="485.9459" y="353.373197594113" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-faint)">processingTime &gt;= 10s</text>
  <rect x="656.2162" y="187.164228135437" width="275.6756" height="190.447837112935" rx="6.176507897227" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.054" y="230.447731142797" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536888758279" font-weight="bold" fill="var(--warn-accent)">State Management</text>
  <text x="794.054" y="265.074639518823" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">Watermark tuning</text>
  <text x="794.054" y="294.507421563827" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">RocksDB state store</text>
  <text x="794.054" y="323.94030957897" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">State cleanup policies</text>
  <text x="794.054" y="353.373197594113" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-faint)">Compact on commit</text>
  <rect x="964.3243" y="187.164228135437" width="275.6756" height="190.447837112935" rx="6.176507897227" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="230.447731142797" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536888758279" font-weight="bold" fill="var(--info-accent)">Resources</text>
  <text x="1102.1621" y="265.074639518823" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">Executor memory</text>
  <text x="1102.1621" y="294.507421563827" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">Core allocation</text>
  <text x="1102.1621" y="323.94030957897" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">Dynamic allocation</text>
  <text x="1102.1621" y="353.373197594113" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-faint)">Off-heap memory</text>
  <line x1="526.4865" y1="126.567217954996" x2="234.5946" y2="187.164228135437" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="591.3513" y1="126.567217954996" x2="485.9459" y2="187.164228135437" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="688.6486" y1="126.567217954996" x2="794.054" y2="187.164228135437" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="753.5134" y1="126.567217954996" x2="1045.4053" y2="187.164228135437" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="429.552162887065" width="1200" height="190.447837112935" rx="6.176507897227" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="472.835771864563" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536888758279" font-weight="bold" fill="var(--text)">Key Metrics to Monitor</text>
  <rect x="80.5405" y="498.805979639117" width="251.3514" height="95.223918556467" rx="6.176507897227" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="205.4053" y="536.895568255732" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957040979966" font-weight="bold" fill="var(--primary-accent)">Input Rate</text>
  <text x="205.4053" y="568.05969042103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">rows/sec ingested</text>
  <rect x="364.3243" y="498.805979639117" width="251.3514" height="95.223918556467" rx="6.176507897227" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="489.1891" y="536.895568255732" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957040979966" font-weight="bold" fill="var(--ok-accent)">Process Rate</text>
  <text x="489.1891" y="568.05969042103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">rows/sec processed</text>
  <rect x="648.1081" y="498.805979639117" width="251.3514" height="95.223918556467" rx="6.176507897227" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772.9729" y="536.895568255732" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957040979966" font-weight="bold" fill="var(--warn-accent)">Batch Duration</text>
  <text x="772.9729" y="568.05969042103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">ms per micro-batch</text>
  <rect x="931.8918" y="498.805979639117" width="251.3514" height="95.223918556467" rx="6.176507897227" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.7566" y="536.895568255732" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957040979966" font-weight="bold" fill="var(--info-accent)">State Size</text>
  <text x="1056.7566" y="568.05969042103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377296143452" fill="var(--text-muted)">bytes in state store</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-po" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="598.8304" y="42.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9532" font-weight="bold" fill="var(--text)">Streaming Performance Optimization</text>
  <rect x="434.152" y="75.7895" width="329.3567" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="598.8304" y="126.3158" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9591" font-weight="bold" fill="var(--primary-accent)">Optimization Areas</text>
  <rect x="44.9123" y="218.9474" width="254.5029" height="185.2632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="172.1637" y="261.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="var(--primary-accent)">Partitioning</text>
  <text x="172.1637" y="294.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Match Kafka partitions</text>
  <text x="172.1637" y="323.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Repartition for joins</text>
  <text x="172.1637" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Avoid data skew</text>
  <text x="172.1637" y="380.6316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-faint)">spark.sql.shuffle.partitions</text>
  <rect x="329.3567" y="218.9474" width="254.5029" height="185.2632" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="456.6082" y="261.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">Batch Tuning</text>
  <text x="456.6082" y="294.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Trigger interval</text>
  <text x="456.6082" y="323.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">maxOffsetsPerTrigger</text>
  <text x="456.6082" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Batch size vs latency</text>
  <text x="456.6082" y="380.6316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-faint)">processingTime &gt;= 10s</text>
  <rect x="613.8012" y="218.9474" width="254.5029" height="185.2632" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="741.0526" y="261.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="var(--warn-accent)">State Management</text>
  <text x="741.0526" y="294.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Watermark tuning</text>
  <text x="741.0526" y="323.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">RocksDB state store</text>
  <text x="741.0526" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">State cleanup policies</text>
  <text x="741.0526" y="380.6316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-faint)">Compact on commit</text>
  <rect x="898.2456" y="218.9474" width="254.5029" height="185.2632" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1025.4971" y="261.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="var(--info-accent)">Resources</text>
  <text x="1025.4971" y="294.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Executor memory</text>
  <text x="1025.4971" y="323.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Core allocation</text>
  <text x="1025.4971" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">Dynamic allocation</text>
  <text x="1025.4971" y="380.6316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-faint)">Off-heap memory</text>
  <line x1="494.0351" y1="160" x2="224.5614" y2="218.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-po)" />
  <line x1="553.9181" y1="160" x2="456.6082" y2="218.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-po)" />
  <line x1="643.7427" y1="160" x2="741.0526" y2="218.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-po)" />
  <line x1="703.6257" y1="160" x2="973.0994" y2="218.9474" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-po)" />
  <rect x="44.9123" y="454.7368" width="1107.8363" height="185.2632" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="598.8304" y="496.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.462" font-weight="bold" fill="var(--text)">Key Metrics to Monitor</text>
  <rect x="82.3392" y="522.1053" width="232.0468" height="92.6316" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="197.614" y="559.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9649" font-weight="bold" fill="var(--primary-accent)">Input Rate</text>
  <text x="197.614" y="589.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">rows/sec ingested</text>
  <rect x="344.3275" y="522.1053" width="232.0468" height="92.6316" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="459.6023" y="559.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9649" font-weight="bold" fill="var(--ok-accent)">Process Rate</text>
  <text x="459.6023" y="589.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">rows/sec processed</text>
  <rect x="606.3158" y="522.1053" width="232.0468" height="92.6316" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="721.5906" y="559.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9649" font-weight="bold" fill="var(--warn-accent)">Batch Duration</text>
  <text x="721.5906" y="589.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">ms per micro-batch</text>
  <rect x="868.3041" y="522.1053" width="232.0468" height="92.6316" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="983.5789" y="559.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9649" font-weight="bold" fill="var(--info-accent)">State Size</text>
  <text x="983.5789" y="589.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4678" fill="var(--text-muted)">bytes in state store</text>
</svg>
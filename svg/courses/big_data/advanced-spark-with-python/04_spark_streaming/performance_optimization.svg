<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-po" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.5538" font-weight="bold" fill="var(--text)">Streaming Performance Optimization</text>
  <rect x="461.6215" y="72.676" width="356.7567" height="81.6901" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="121.6901" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4846" font-weight="bold" fill="var(--primary-accent)">Optimization Areas</text>
  <rect x="40" y="211.5493" width="275.6756" height="179.7184" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="252.3943" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.95" font-weight="bold" fill="var(--primary-accent)">Partitioning</text>
  <text x="177.8378" y="285.0704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Match Kafka partitions</text>
  <text x="177.8378" y="312.845" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Repartition for joins</text>
  <text x="177.8378" y="340.6197" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Avoid data skew</text>
  <text x="177.8378" y="368.3944" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-faint)">spark.sql.shuffle.partitions</text>
  <rect x="348.108" y="211.5493" width="275.6756" height="179.7184" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.9459" y="252.3943" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.95" font-weight="bold" fill="var(--ok-accent)">Batch Tuning</text>
  <text x="485.9459" y="285.0704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Trigger interval</text>
  <text x="485.9459" y="312.845" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">maxOffsetsPerTrigger</text>
  <text x="485.9459" y="340.6197" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Batch size vs latency</text>
  <text x="485.9459" y="368.3944" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-faint)">processingTime &gt;= 10s</text>
  <rect x="656.2162" y="211.5493" width="275.6756" height="179.7184" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.054" y="252.3943" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.95" font-weight="bold" fill="var(--warn-accent)">State Management</text>
  <text x="794.054" y="285.0704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Watermark tuning</text>
  <text x="794.054" y="312.845" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">RocksDB state store</text>
  <text x="794.054" y="340.6197" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">State cleanup policies</text>
  <text x="794.054" y="368.3944" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-faint)">Compact on commit</text>
  <rect x="964.3243" y="211.5493" width="275.6756" height="179.7184" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="252.3943" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.95" font-weight="bold" fill="var(--info-accent)">Resources</text>
  <text x="1102.1621" y="285.0704" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Executor memory</text>
  <text x="1102.1621" y="312.845" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Core allocation</text>
  <text x="1102.1621" y="340.6197" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Dynamic allocation</text>
  <text x="1102.1621" y="368.3944" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-faint)">Off-heap memory</text>
  <line x1="526.4865" y1="154.3662" x2="234.5946" y2="211.5493" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-po)" />
  <line x1="591.3513" y1="154.3662" x2="485.9459" y2="211.5493" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-po)" />
  <line x1="688.6486" y1="154.3662" x2="794.054" y2="211.5493" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-po)" />
  <line x1="753.5134" y1="154.3662" x2="1045.4053" y2="211.5493" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-po)" />
  <rect x="40" y="440.2816" width="1200" height="179.7184" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="481.1267" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.95" font-weight="bold" fill="var(--text)">Key Metrics to Monitor</text>
  <rect x="80.5405" y="505.6338" width="251.3514" height="89.8592" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="205.4053" y="541.5775" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)">Input Rate</text>
  <text x="205.4053" y="570.9859" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">rows/sec ingested</text>
  <rect x="364.3243" y="505.6338" width="251.3514" height="89.8592" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="489.1891" y="541.5775" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4153" font-weight="bold" fill="var(--ok-accent)">Process Rate</text>
  <text x="489.1891" y="570.9859" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">rows/sec processed</text>
  <rect x="648.1081" y="505.6338" width="251.3514" height="89.8592" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="772.9729" y="541.5775" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4153" font-weight="bold" fill="var(--warn-accent)">Batch Duration</text>
  <text x="772.9729" y="570.9859" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">ms per micro-batch</text>
  <rect x="931.8918" y="505.6338" width="251.3514" height="89.8592" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.7566" y="541.5775" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4153" font-weight="bold" fill="var(--info-accent)">State Size</text>
  <text x="1056.7566" y="570.9859" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">bytes in state store</text>
</svg>
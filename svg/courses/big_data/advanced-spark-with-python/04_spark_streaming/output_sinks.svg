<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="199.710105061971" width="300.0001" height="117.681157886999" rx="6.171462391656" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="250.145053266093" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.516203859409" font-weight="bold" fill="var(--primary-accent)">Streaming Engine</text>
  <text x="190" y="283.768105208992" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">writeStream.format(...)</text>
  <line x1="340" y1="224.927579164032" x2="473.3333" y2="82.029264566206" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="241.73915803402" x2="473.3333" y2="208.116000294043" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="275.362421571076" x2="473.3333" y2="342.608842848108" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="292.174000441064" x2="473.3333" y2="468.695790170102" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="490" y="40" width="333.3334" height="92.463895379094" rx="6.171462391656" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6666" y="78.666821835714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.516203859409" font-weight="bold" fill="var(--primary-accent)">Kafka</text>
  <text x="656.6666" y="110.608652413368" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">format("kafka")</text>
  <rect x="490" y="166.087264713227" width="333.3334" height="92.463895379094" rx="6.171462391656" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6666" y="204.753769157708" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.516203859409" font-weight="bold" fill="var(--ok-accent)">File / Delta Lake</text>
  <text x="656.6666" y="236.695811329517" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">format("delta") / parquet / json</text>
  <rect x="490" y="300.579789876059" width="333.3334" height="92.463895379094" rx="6.171462391656" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6666" y="339.246400117617" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.516203859409" font-weight="bold" fill="var(--warn-accent)">Console</text>
  <text x="656.6666" y="371.188442289427" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">format("console") - debug</text>
  <rect x="490" y="426.666631400974" width="333.3334" height="92.463895379094" rx="6.171462391656" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6666" y="465.333135845455" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.516203859409" font-weight="bold" fill="var(--info-accent)">foreachBatch</text>
  <text x="656.6666" y="497.27538961142" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">Custom batch processing</text>
  <rect x="890.0001" y="40" width="349.9999" height="92.463895379094" rx="6.171462391656" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1064.9999" y="73.623369334133" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">Append mode only</text>
  <text x="1064.9999" y="102.202968775452" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">Exactly-once with idempotent</text>
  <rect x="890.0001" y="166.087264713227" width="349.9999" height="92.463895379094" rx="6.171462391656" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1064.9999" y="199.710105061971" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">Append mode, partitionBy</text>
  <text x="1064.9999" y="228.290021894523" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">ACID with Delta Lake</text>
  <rect x="890.0001" y="300.579789876059" width="349.9999" height="92.463895379094" rx="6.171462391656" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1064.9999" y="334.202947616036" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">All output modes</text>
  <text x="1064.9999" y="362.782652854433" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-faint)">Development/debug only</text>
  <rect x="890.0001" y="426.666631400974" width="349.9999" height="92.463895379094" rx="6.171462391656" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1064.9999" y="460.290000735107" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">Write to any system</text>
  <text x="1064.9999" y="488.869600176426" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.359912276903" fill="var(--text-muted)">Make writes idempotent!</text>
  <rect x="40" y="561.159368157962" width="1200" height="58.840631842038" rx="6.171462391656" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.3334" y="598.14496862843" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.93795521045" fill="var(--text-muted)">Output Modes: <tspan font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Append</tspan> (new rows) | <tspan font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Update</tspan> (changed rows) | <tspan font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Complete</tspan> (full table)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-os" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="623.3334" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.5491" font-weight="bold" fill="var(--text)">Spark Streaming Output Sinks</text>
  <rect x="40" y="222.7396" width="300.0001" height="111.2329" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="270.411" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9462" font-weight="bold" fill="var(--primary-accent)">Streaming Engine</text>
  <text x="190" y="302.1917" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">writeStream.format(...)</text>
  <line x1="340" y1="246.5753" x2="473.3333" y2="111.507" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <line x1="340" y1="262.4657" x2="473.3333" y2="230.6849" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <line x1="340" y1="294.2466" x2="473.3333" y2="357.8083" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <line x1="340" y1="310.137" x2="473.3333" y2="476.9864" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <rect x="490" y="71.7807" width="333.3334" height="87.3974" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6666" y="108.3288" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9462" font-weight="bold" fill="var(--primary-accent)">Kafka</text>
  <text x="656.6666" y="138.5204" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">format("kafka")</text>
  <rect x="490" y="190.9591" width="333.3334" height="87.3974" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6666" y="227.5069" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9462" font-weight="bold" fill="var(--ok-accent)">File / Delta Lake</text>
  <text x="656.6666" y="257.6987" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">format("delta") / parquet / json</text>
  <rect x="490" y="318.0822" width="333.3334" height="87.3974" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6666" y="354.6301" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9462" font-weight="bold" fill="var(--warn-accent)">Console</text>
  <text x="656.6666" y="384.8219" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">format("console") - debug</text>
  <rect x="490" y="437.2602" width="333.3334" height="87.3974" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6666" y="473.808" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9462" font-weight="bold" fill="var(--info-accent)">foreachBatch</text>
  <text x="656.6666" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">Custom batch processing</text>
  <rect x="890.0001" y="71.7807" width="349.9999" height="87.3974" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1064.9999" y="103.5617" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">Append mode only</text>
  <text x="1064.9999" y="130.5753" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">Exactly-once with idempotent</text>
  <rect x="890.0001" y="190.9591" width="349.9999" height="87.3974" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1064.9999" y="222.7396" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">Append mode, partitionBy</text>
  <text x="1064.9999" y="249.7535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">ACID with Delta Lake</text>
  <rect x="890.0001" y="318.0822" width="349.9999" height="87.3974" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1064.9999" y="349.863" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">All output modes</text>
  <text x="1064.9999" y="376.8767" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-faint)">Development/debug only</text>
  <rect x="890.0001" y="437.2602" width="349.9999" height="87.3974" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1064.9999" y="469.0412" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">Write to any system</text>
  <text x="1064.9999" y="496.0548" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8776" fill="var(--text-muted)">Make writes idempotent!</text>
  <rect x="40" y="564.3835" width="1200" height="55.6165" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.3334" y="599.3425" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4118" fill="var(--text-muted)">Output Modes: <tspan font-weight="bold" fill="var(--primary-accent)">Append</tspan> (new rows) | <tspan font-weight="bold" fill="var(--ok-accent)">Update</tspan> (changed rows) | <tspan font-weight="bold" fill="var(--warn-accent)">Complete</tspan> (full table)</text>
</svg>
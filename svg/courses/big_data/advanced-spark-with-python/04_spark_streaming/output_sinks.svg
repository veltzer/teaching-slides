<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-os" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="717.3982" y="175.6091" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7817" font-weight="bold" fill="var(--text)">Spark Streaming Output Sinks</text>
  <rect x="223.0451" y="315.6226" width="254.2388" height="85.2257" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="350.1645" y="352.148" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0727" font-weight="bold" fill="var(--primary-accent)">Streaming Engine</text>
  <text x="350.1645" y="376.4981" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">writeStream.format(...)</text>
  <line x1="477.2838" y1="333.8853" x2="590.2788" y2="230.3971" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <line x1="477.2838" y1="346.0604" x2="590.2788" y2="321.7102" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <line x1="477.2838" y1="370.4106" x2="590.2788" y2="419.111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <line x1="477.2838" y1="382.5857" x2="590.2788" y2="510.4242" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <rect x="604.4032" y="199.9592" width="282.4875" height="66.9631" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="745.6469" y="227.962" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0727" font-weight="bold" fill="var(--primary-accent)">Kafka</text>
  <text x="745.6469" y="251.0946" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">format("kafka")</text>
  <rect x="604.4032" y="291.2726" width="282.4875" height="66.9631" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="745.6469" y="319.2752" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0727" font-weight="bold" fill="var(--ok-accent)">File / Delta Lake</text>
  <text x="745.6469" y="342.4079" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">format("delta") / parquet / json</text>
  <rect x="604.4032" y="388.6732" width="282.4875" height="66.9631" rx="5.7089" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="745.6469" y="416.6759" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0727" font-weight="bold" fill="var(--warn-accent)">Console</text>
  <text x="745.6469" y="439.8086" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">format("console") - debug</text>
  <rect x="604.4032" y="479.9864" width="282.4875" height="66.9631" rx="5.7089" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="745.6469" y="507.989" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0727" font-weight="bold" fill="var(--info-accent)">foreachBatch</text>
  <text x="745.6469" y="531.1218" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">Custom batch processing</text>
  <rect x="943.3882" y="199.9592" width="296.6118" height="66.9631" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1091.694" y="224.3095" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">Append mode only</text>
  <text x="1091.694" y="245.0071" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">Exactly-once with idempotent</text>
  <rect x="943.3882" y="291.2726" width="296.6118" height="66.9631" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1091.694" y="315.6226" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">Append mode, partitionBy</text>
  <text x="1091.694" y="336.3204" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">ACID with Delta Lake</text>
  <rect x="943.3882" y="388.6732" width="296.6118" height="66.9631" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1091.694" y="413.0234" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">All output modes</text>
  <text x="1091.694" y="433.7211" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-faint)">Development/debug only</text>
  <rect x="943.3882" y="479.9864" width="296.6118" height="66.9631" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1091.694" y="504.3367" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">Write to any system</text>
  <text x="1091.694" y="525.0343" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.6" fill="var(--text-muted)">Make writes idempotent!</text>
  <rect x="223.0451" y="577.3871" width="1016.9549" height="42.6129" rx="5.7089" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="717.3982" y="604.1724" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8363" fill="var(--text-muted)">Output Modes: <tspan font-weight="bold" fill="var(--primary-accent)">Append</tspan> (new rows) | <tspan font-weight="bold" fill="var(--ok-accent)">Update</tspan> (changed rows) | <tspan font-weight="bold" fill="var(--warn-accent)">Complete</tspan> (full table)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-os" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="583.4758" y="41.0256" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.339" font-weight="bold" fill="var(--text)">Spark Streaming Output Sinks</text>
  <rect x="72.9345" y="229.7436" width="262.5641" height="114.8718" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="204.2165" y="278.9744" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963" font-weight="bold" fill="var(--primary-accent)">Streaming Engine</text>
  <text x="204.2165" y="311.7949" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">writeStream.format(...)</text>
  <line x1="335.4986" y1="254.359" x2="452.1937" y2="114.8718" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <line x1="335.4986" y1="270.7692" x2="452.1937" y2="237.9487" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <line x1="335.4986" y1="303.5897" x2="452.1937" y2="369.2308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <line x1="335.4986" y1="320" x2="452.1937" y2="492.3077" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-os)" />
  <rect x="466.7806" y="73.8462" width="291.7379" height="90.2564" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="612.6496" y="111.5897" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963" font-weight="bold" fill="var(--primary-accent)">Kafka</text>
  <text x="612.6496" y="142.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">format("kafka")</text>
  <rect x="466.7806" y="196.9231" width="291.7379" height="90.2564" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="612.6496" y="234.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963" font-weight="bold" fill="var(--ok-accent)">File / Delta Lake</text>
  <text x="612.6496" y="265.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">format("delta") / parquet / json</text>
  <rect x="466.7806" y="328.2051" width="291.7379" height="90.2564" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="612.6496" y="365.9487" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963" font-weight="bold" fill="var(--warn-accent)">Console</text>
  <text x="612.6496" y="397.1282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">format("console") - debug</text>
  <rect x="466.7806" y="451.2821" width="291.7379" height="90.2564" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="612.6496" y="489.0256" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963" font-weight="bold" fill="var(--info-accent)">foreachBatch</text>
  <text x="612.6496" y="520.2051" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">Custom batch processing</text>
  <rect x="816.8661" y="73.8462" width="306.3248" height="90.2564" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="970.0285" y="106.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">Append mode only</text>
  <text x="970.0285" y="134.5641" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">Exactly-once with idempotent</text>
  <rect x="816.8661" y="196.9231" width="306.3248" height="90.2564" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="970.0285" y="229.7436" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">Append mode, partitionBy</text>
  <text x="970.0285" y="257.641" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">ACID with Delta Lake</text>
  <rect x="816.8661" y="328.2051" width="306.3248" height="90.2564" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="970.0285" y="361.0256" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">All output modes</text>
  <text x="970.0285" y="388.9231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-faint)">Development/debug only</text>
  <rect x="816.8661" y="451.2821" width="306.3248" height="90.2564" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="970.0285" y="484.1026" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">Write to any system</text>
  <text x="970.0285" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0456" fill="var(--text-muted)">Make writes idempotent!</text>
  <rect x="72.9345" y="582.5641" width="1050.2564" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="583.4758" y="618.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043" fill="var(--text-muted)">Output Modes: <tspan font-weight="bold" fill="var(--primary-accent)">Append</tspan> (new rows) | <tspan font-weight="bold" fill="var(--ok-accent)">Update</tspan> (changed rows) | <tspan font-weight="bold" fill="var(--warn-accent)">Complete</tspan> (full table)</text>
</svg>
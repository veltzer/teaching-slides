<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-ss" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <rect x="61.9355" y="8.5714" width="1156.129" height="102.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="37.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" font-weight="bold" fill="var(--text)">Data Sources</text>
  <rect x="113.5484" y="51.4286" width="165.1613" height="48" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7143" />
  <text x="196.129" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Kafka</text>
  <rect x="320" y="51.4286" width="165.1613" height="48" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7143" />
  <text x="402.5806" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Kinesis</text>
  <rect x="526.4516" y="51.4286" width="165.1613" height="48" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7143" />
  <text x="609.0323" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Files</text>
  <rect x="732.9032" y="51.4286" width="165.1613" height="48" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7143" />
  <text x="815.4839" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Socket</text>
  <line x1="196.129" y1="111.4286" x2="412.9032" y2="171.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ss)" />
  <line x1="402.5806" y1="111.4286" x2="536.7742" y2="171.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ss)" />
  <line x1="609.0323" y1="111.4286" x2="701.9355" y2="171.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ss)" />
  <line x1="815.4839" y1="111.4286" x2="825.8065" y2="171.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ss)" />
  <rect x="61.9355" y="180" width="1156.129" height="291.4286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="214.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2857" font-weight="bold" fill="var(--text)">Structured Streaming Engine</text>
  <rect x="123.871" y="240" width="1032.2581" height="85.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="247.7419" y="270.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Parse</text>
  <line x1="320" y1="282.8571" x2="402.5806" y2="282.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ss)" />
  <text x="536.7742" y="270.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Transform</text>
  <line x1="640" y1="282.8571" x2="722.5806" y2="282.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ss)" />
  <text x="887.7419" y="270.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Aggregate / Join</text>
  <text x="289.0323" y="308.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text-faint)">Micro-batch Processing</text>
  <rect x="113.5484" y="351.4286" width="309.6774" height="51.4286" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="268.3871" y="385.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text-muted)">State Store (RocksDB)</text>
  <rect x="443.871" y="351.4286" width="309.6774" height="51.4286" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="598.7097" y="385.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text-muted)">Checkpoint (HDFS/S3)</text>
  <rect x="774.1935" y="351.4286" width="309.6774" height="51.4286" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="929.0323" y="385.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text-muted)">Watermark (Late data)</text>
  <line x1="371.6129" y1="471.4286" x2="268.3871" y2="531.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ss)" />
  <line x1="640" y1="471.4286" x2="640" y2="531.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ss)" />
  <line x1="908.3871" y1="471.4286" x2="1011.6129" y2="531.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ss)" />
  <rect x="103.2258" y="540" width="330.3226" height="77.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="268.3871" y="574.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" font-weight="bold" fill="var(--text)">Delta Lake</text>
  <text x="268.3871" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text-muted)">(append)</text>
  <rect x="474.8387" y="540" width="330.3226" height="77.1429" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="574.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" font-weight="bold" fill="var(--text)">Kafka</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text-muted)">(publish)</text>
  <rect x="846.4516" y="540" width="330.3226" height="77.1429" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1011.6129" y="574.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" font-weight="bold" fill="var(--text)">Console</text>
  <text x="1011.6129" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text-muted)">(debug)</text>
</svg>
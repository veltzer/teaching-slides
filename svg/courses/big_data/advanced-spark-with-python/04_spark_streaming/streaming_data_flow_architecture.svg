<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="98.0281" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="67.7747" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" font-weight="bold" fill="var(--text)">Data Sources</text>
  <rect x="93.5714" y="80.8451" width="171.4286" height="45.7465" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7143"/>
  <text x="179.2857" y="111.8873" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text)">Kafka</text>
  <rect x="307.8571" y="80.8451" width="171.4286" height="45.7465" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7143"/>
  <text x="393.5714" y="111.8873" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text)">Kinesis</text>
  <rect x="522.1428" y="80.8451" width="171.4286" height="45.7465" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7143"/>
  <text x="607.8572" y="111.8873" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text)">Files</text>
  <rect x="736.4285" y="80.8451" width="171.4286" height="45.7465" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.7143"/>
  <text x="822.1429" y="111.8873" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text)">Socket</text>
  <line x1="179.2857" y1="138.0282" x2="404.2857" y2="195.2113" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="393.5714" y1="138.0282" x2="532.8571" y2="195.2113" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607.8572" y1="138.0282" x2="704.2857" y2="195.2113" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="822.1429" y1="138.0282" x2="832.8572" y2="195.2113" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="203.3803" width="1200" height="277.7465" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="236.0563" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1652" font-weight="bold" fill="var(--text)">Structured Streaming Engine</text>
  <rect x="104.2857" y="260.5634" width="1071.4286" height="81.6901" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.8571" y="289.9718" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text)">Parse</text>
  <line x1="307.8571" y1="301.4084" x2="393.5714" y2="301.4084" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="532.8571" y="289.9718" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text)">Transform</text>
  <line x1="640" y1="301.4084" x2="725.7142" y2="301.4084" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="897.1428" y="289.9718" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text)">Aggregate / Join</text>
  <text x="275.7143" y="325.9155" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text-faint)">Micro-batch Processing</text>
  <rect x="93.5714" y="366.7606" width="321.4286" height="49.0141" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="254.2857" y="399.4366" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text-muted)">State Store (RocksDB)</text>
  <rect x="436.4286" y="366.7606" width="321.4286" height="49.0141" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="597.1429" y="399.4366" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text-muted)">Checkpoint (HDFS/S3)</text>
  <rect x="779.2857" y="366.7606" width="321.4286" height="49.0141" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940.0001" y="399.4366" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text-muted)">Watermark (Late data)</text>
  <line x1="361.4286" y1="481.1268" x2="254.2857" y2="538.3099" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="481.1268" x2="640" y2="538.3099" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="918.5714" y1="481.1268" x2="1025.7143" y2="538.3099" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="82.8571" y="546.4788" width="342.8572" height="73.5212" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2857" y="579.1549" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" font-weight="bold" fill="var(--text)">Delta Lake</text>
  <text x="254.2857" y="603.6619" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text-muted)">(append)</text>
  <rect x="468.5714" y="546.4788" width="342.8572" height="73.5212" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="579.1549" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" font-weight="bold" fill="var(--text)">Kafka</text>
  <text x="640" y="603.6619" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text-muted)">(publish)</text>
  <rect x="854.2857" y="546.4788" width="342.8572" height="73.5212" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1025.7143" y="579.1549" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" font-weight="bold" fill="var(--text)">Console</text>
  <text x="1025.7143" y="603.6619" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4602" fill="var(--text-muted)">(debug)</text>
</svg>

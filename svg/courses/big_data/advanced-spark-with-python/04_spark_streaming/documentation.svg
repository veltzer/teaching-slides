  <text x="640" y="515.2778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Tuning parameters</text>
  <text x="640" y="542.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Resource requirements</text>
  <text x="640" y="570.0555" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Environment specifics</text>

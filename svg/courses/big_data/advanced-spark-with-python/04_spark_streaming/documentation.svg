  <text x="1053.5135" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--warn-accent)">Operational Runbooks</text>
  <text x="1053.5135" y="160.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Alert response procedures</text>
  <text x="1053.5135" y="189.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Failure recovery steps</text>
  <text x="1053.5135" y="218.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Scaling procedures</text>
  <text x="1053.5135" y="247.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Checkpoint management</text>
  <text x="1053.5135" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">How to operate and</text>

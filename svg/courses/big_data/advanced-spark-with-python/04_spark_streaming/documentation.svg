  <text x="226.4865" y="218.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Migration Guide</text>
  <text x="226.4865" y="247.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Configuration Reference</text>
  <text x="226.4865" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">spark.apache.org/docs</text>
  <text x="226.4865" y="310.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">/latest/structured-streaming</text>
  <rect x="453.5135" y="80.2778" width="372.973" height="241.6666" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--ok-accent)">Pipeline Documentation</text>
  <text x="640" y="160.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Data flow architecture</text>
  <text x="640" y="189.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Schema definitions</text>
  <text x="640" y="218.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Source / sink contracts</text>
  <text x="640" y="247.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">SLA / latency requirements</text>
  <text x="640" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">What each pipeline does</text>

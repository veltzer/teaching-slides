  <text x="1029.1891" y="458.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--warn-accent)">Operations</text>
  <text x="1029.1891" y="487.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Monitoring dashboards</text>
  <text x="1029.1891" y="515.2778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Alert definitions</text>
  <text x="1029.1891" y="542.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Runbooks / playbooks</text>
  <text x="1029.1891" y="570.0555" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Deployment procedures</text>
</svg>

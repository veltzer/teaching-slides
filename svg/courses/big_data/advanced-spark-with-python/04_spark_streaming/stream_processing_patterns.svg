  <line x1="202.1622" y1="204.477666473604" x2="250.8109" y2="178.507480329696" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="258.9189" y="143.880529650253" width="121.6216" height="51.940264825127" rx="6.219852792232" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.919" y="178.507480329696" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">Join</text>
  <text x="226.4865" y="256.417931298731" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-muted)">Stream-static join for</text>
  <text x="226.4865" y="278.925454613503" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-muted)">dimension lookups</text>
  <rect x="453.5135" y="40" width="372.973" height="242.38811744264" rx="6.219852792232" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--ok-accent)">Fan-Out Pattern</text>
  <rect x="494.0541" y="126.567215504569" width="113.5135" height="51.940264825127" rx="6.219852792232" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550.8107" y="161.19405872132" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">Stream</text>
  <line x1="607.5675" y1="140.417974283807" x2="672.4325" y2="117.910450969036" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607.5675" y1="152.537294185787" x2="672.4325" y2="152.537294185787" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607.5675" y1="164.656721550457" x2="672.4325" y2="187.164244865229" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680.5405" y="95.403035116955" width="113.5135" height="38.089506045888" rx="6.219852792232" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="737.2973" y="121.373221260863" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">Sink A</text>
  <rect x="680.5405" y="138.686535406548" width="113.5135" height="38.089506045888" rx="6.219852792232" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="737.2973" y="164.656721550457" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">Sink B</text>
  <rect x="680.5405" y="181.970143158832" width="113.5135" height="38.089506045888" rx="6.219852792232" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="737.2973" y="207.94022184005" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">Sink C</text>

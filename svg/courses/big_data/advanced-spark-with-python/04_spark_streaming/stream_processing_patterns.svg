  <text x="226.4865" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--primary-accent)">Enrich Pattern</text>
  <rect x="72.4325" y="109.253793896193" width="129.7298" height="51.940264825127" rx="6.219852792232" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="143.880529650253" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">Stream</text>

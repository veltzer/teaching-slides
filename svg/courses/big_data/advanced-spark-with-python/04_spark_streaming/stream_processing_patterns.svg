<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-spp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="41.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6421" font-weight="bold" fill="var(--text)">Stream Processing Patterns</text>
  <rect x="44.329" y="83.1169" width="339.8557" height="232.7273" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="214.2569" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">Enrich Pattern</text>
  <rect x="73.8817" y="149.6104" width="118.2107" height="49.8701" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="132.987" y="182.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Stream</text>
  <rect x="73.8817" y="216.1039" width="118.2107" height="49.8701" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="132.987" y="249.3506" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Static DF</text>
  <line x1="192.0924" y1="174.5455" x2="236.4214" y2="199.4805" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-spp)" />
  <line x1="192.0924" y1="241.039" x2="236.4214" y2="216.1039" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-spp)" />
  <rect x="243.8095" y="182.8571" width="110.8225" height="49.8701" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="298.482" y="216.1039" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Join</text>
  <text x="214.2569" y="290.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Stream-static join for</text>
  <text x="214.2569" y="312.5195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">dimension lookups</text>
  <rect x="421.1255" y="83.1169" width="339.8557" height="232.7273" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="591.0534" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--ok-accent)">Fan-Out Pattern</text>
  <rect x="458.0664" y="166.2338" width="103.4343" height="49.8701" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="509.7835" y="199.4805" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Stream</text>
  <line x1="561.5007" y1="179.5325" x2="620.6061" y2="157.9221" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-spp)" />
  <line x1="561.5007" y1="191.1688" x2="620.6061" y2="191.1688" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-spp)" />
  <line x1="561.5007" y1="202.8052" x2="620.6061" y2="224.4156" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-spp)" />
  <rect x="627.9942" y="136.3117" width="103.4343" height="36.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="679.7114" y="161.2468" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Sink A</text>
  <rect x="627.9942" y="177.8701" width="103.4343" height="36.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="679.7114" y="202.8052" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Sink B</text>
  <rect x="627.9942" y="219.4286" width="103.4343" height="36.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="679.7114" y="244.3636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Sink C</text>
  <text x="591.0534" y="290.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Write to multiple sinks</text>
  <text x="591.0534" y="312.5195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">via foreachBatch</text>
  <rect x="797.9221" y="83.1169" width="339.8557" height="232.7273" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="967.8499" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--warn-accent)">Aggregate Pattern</text>
  <rect x="827.4747" y="149.6104" width="280.7504" height="58.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="967.8499" y="186.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">window() + groupBy()</text>
  <line x1="967.8499" y1="207.7922" x2="967.8499" y2="232.7273" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-spp)" />
  <rect x="864.4156" y="236.0519" width="206.8687" height="41.5584" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="967.8499" y="264.3117" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text)">Windowed aggregations</text>
  <text x="967.8499" y="304.2078" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Tumbling / sliding / session</text>
  <rect x="44.329" y="365.7143" width="339.8557" height="174.5455" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="214.2569" y="407.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--info-accent)">Deduplication Pattern</text>
  <text x="214.2569" y="445.5065" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">dropDuplicates with watermark</text>
  <text x="214.2569" y="478.7532" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Stateful within time window</text>
  <text x="214.2569" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">dropDuplicatesWithinWatermark</text>
  <rect x="421.1255" y="365.7143" width="339.8557" height="174.5455" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="591.0534" y="407.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--danger-accent)">Filter-Route Pattern</text>
  <text x="591.0534" y="445.5065" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Split stream by condition</text>
  <text x="591.0534" y="478.7532" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Route to different sinks</text>
  <text x="591.0534" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">Good data / bad data paths</text>
  <rect x="797.9221" y="365.7143" width="339.8557" height="174.5455" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="967.8499" y="407.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--ok-accent)">Sessionize Pattern</text>
  <text x="967.8499" y="445.5065" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">flatMapGroupsWithState</text>
  <text x="967.8499" y="478.7532" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Custom stateful logic</text>
  <text x="967.8499" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">User session detection</text>
  <rect x="73.8817" y="581.8182" width="1034.3434" height="58.1818" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="591.0534" y="618.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Choose pattern based on: latency requirements | state size | exactly-once needs | output sink capabilities</text>
</svg>
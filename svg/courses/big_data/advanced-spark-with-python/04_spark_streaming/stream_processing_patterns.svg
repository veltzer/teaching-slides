  <text x="1053.5135" y="486.686621376701" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-faint)">User session detection</text>
  <rect x="72.4325" y="559.40297063934" width="1135.1351" height="60.59702936066" rx="6.219852792232" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="597.492476685228" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Choose pattern based on: latency requirements | state size | exactly-once needs | output sink capabilities</text>
</svg>

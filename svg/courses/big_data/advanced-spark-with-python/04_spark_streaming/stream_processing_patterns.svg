  <text x="1053.5135" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--warn-accent)">Aggregate Pattern</text>
  <rect x="899.4594" y="109.253793896193" width="308.1081" height="60.59702936066" rx="6.219852792232" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="147.343299942081" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">window() + groupBy()</text>
  <line x1="1053.5135" y1="169.850715794162" x2="1053.5135" y2="195.820901938071" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="940" y="199.283564767208" width="227.027" height="43.283500289593" rx="6.219852792232" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="228.716413740254" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.797493114351" fill="var(--text)">Windowed aggregations</text>
  <text x="1053.5135" y="270.26869007797" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-muted)">Tumbling / sliding / session</text>
  <rect x="40" y="334.328382267767" width="372.973" height="181.79108808198" rx="6.219852792232" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="377.61188255736" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--info-accent)">Deduplication Pattern</text>
  <text x="226.4865" y="417.432827480508" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-muted)">dropDuplicates with watermark</text>
  <text x="226.4865" y="452.059670697259" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-muted)">Stateful within time window</text>
  <text x="226.4865" y="486.686621376701" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-faint)">dropDuplicatesWithinWatermark</text>
  <rect x="453.5135" y="334.328382267767" width="372.973" height="181.79108808198" rx="6.219852792232" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="377.61188255736" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--danger-accent)">Filter-Route Pattern</text>
  <text x="640" y="417.432827480508" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-muted)">Split stream by condition</text>

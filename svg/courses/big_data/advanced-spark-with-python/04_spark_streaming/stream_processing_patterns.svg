<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3826" font-weight="bold" fill="var(--text)">Stream Processing Patterns</text>
  <rect x="40" y="80.2778" width="372.973" height="225.5556" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--primary-accent)">Enrich Pattern</text>
  <rect x="72.4325" y="144.7223" width="129.7298" height="48.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="176.9444" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">Stream</text>
  <rect x="72.4325" y="209.1667" width="129.7298" height="48.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2973" y="241.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">Static DF</text>
  <line x1="202.1622" y1="168.889" x2="250.8109" y2="193.0556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="202.1622" y1="233.3334" x2="250.8109" y2="209.1667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="258.9189" y="176.9444" width="121.6216" height="48.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.919" y="209.1667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">Join</text>
  <text x="226.4865" y="281.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Stream-static join for</text>
  <text x="226.4865" y="302.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">dimension lookups</text>
  <rect x="453.5135" y="80.2778" width="372.973" height="225.5556" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--ok-accent)">Fan-Out Pattern</text>
  <rect x="494.0541" y="160.8334" width="113.5135" height="48.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550.8107" y="193.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">Stream</text>
  <line x1="607.5675" y1="173.7223" x2="672.4325" y2="152.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607.5675" y1="185" x2="672.4325" y2="185" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607.5675" y1="196.2778" x2="672.4325" y2="217.2223" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680.5405" y="131.8334" width="113.5135" height="35.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="737.2973" y="156.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">Sink A</text>
  <rect x="680.5405" y="172.1111" width="113.5135" height="35.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="737.2973" y="196.2778" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">Sink B</text>
  <rect x="680.5405" y="212.3889" width="113.5135" height="35.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="737.2973" y="236.5555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">Sink C</text>
  <text x="640" y="281.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Write to multiple sinks</text>
  <text x="640" y="302.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">via foreachBatch</text>
  <rect x="867.027" y="80.2778" width="372.973" height="225.5556" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--warn-accent)">Aggregate Pattern</text>
  <rect x="899.4594" y="144.7223" width="308.1081" height="56.3889" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="180.1667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">window() + groupBy()</text>
  <line x1="1053.5135" y1="201.1111" x2="1053.5135" y2="225.2778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="940" y="228.5" width="227.027" height="40.2777" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="255.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text)">Windowed aggregations</text>
  <text x="1053.5135" y="294.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Tumbling / sliding / session</text>
  <rect x="40" y="354.1667" width="372.973" height="169.1667" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="394.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--info-accent)">Deduplication Pattern</text>
  <text x="226.4865" y="431.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">dropDuplicates with watermark</text>
  <text x="226.4865" y="463.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Stateful within time window</text>
  <text x="226.4865" y="495.9445" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">dropDuplicatesWithinWatermark</text>
  <rect x="453.5135" y="354.1667" width="372.973" height="169.1667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="394.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--danger-accent)">Filter-Route Pattern</text>
  <text x="640" y="431.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Split stream by condition</text>
  <text x="640" y="463.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Route to different sinks</text>
  <text x="640" y="495.9445" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">Good data / bad data paths</text>
  <rect x="867.027" y="354.1667" width="372.973" height="169.1667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="394.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--ok-accent)">Sessionize Pattern</text>
  <text x="1053.5135" y="431.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">flatMapGroupsWithState</text>
  <text x="1053.5135" y="463.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Custom stateful logic</text>
  <text x="1053.5135" y="495.9445" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">User session detection</text>
  <rect x="72.4325" y="563.6111" width="1135.1351" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="599.0555" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Choose pattern based on: latency requirements | state size | exactly-once needs | output sink capabilities</text>
</svg>

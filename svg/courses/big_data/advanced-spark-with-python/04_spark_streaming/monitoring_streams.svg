<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow-ms" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="#333">Stream Monitoring</text>
  <rect x="80" y="90" width="320" height="108" rx="12.8" fill="#e1f5fe" stroke="#0277bd" stroke-width="3.2" />
  <text x="240" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#0277bd">Streaming Query</text>
  <text x="240" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">query.lastProgress</text>
  <line x1="400" y1="144" x2="480" y2="144" stroke="#333" stroke-width="3.2" marker-end="url(#arrow-ms)" />
  <rect x="496" y="81" width="352" height="126" rx="12.8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.2" />
  <text x="672" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#ef6c00">StreamingQueryListener</text>
  <text x="672" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">onQueryProgress(event)</text>
  <text x="672" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">onQueryTerminated(event)</text>
  <line x1="848" y1="144" x2="928" y2="144" stroke="#333" stroke-width="3.2" marker-end="url(#arrow-ms)" />
  <rect x="944" y="90" width="288" height="108" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="1088" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#2e7d32">Metrics System</text>
  <text x="1088" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Prometheus / Grafana</text>
  <rect x="48" y="270" width="280" height="189" rx="12.8" fill="#e1f5fe" stroke="#0277bd" stroke-width="3.2" />
  <text x="187.2" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#0277bd">Throughput Metrics</text>
  <text x="187.2" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">inputRowsPerSecond</text>
  <text x="187.2" y="381.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">processedRowsPerSecond</text>
  <text x="187.2" y="412.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">numInputRows</text>
  <text x="187.2" y="442.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">batchDuration</text>
  <rect x="352" y="270" width="280" height="189" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="491.2" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#2e7d32">State Metrics</text>
  <text x="491.2" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">numRowsTotal</text>
  <text x="491.2" y="381.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">numRowsUpdated</text>
  <text x="491.2" y="412.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">memoryUsedBytes</text>
  <text x="491.2" y="442.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">customMetrics</text>
  <rect x="656" y="270" width="280" height="189" rx="12.8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.2" />
  <text x="795.2" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#ef6c00">Source Metrics</text>
  <text x="795.2" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">startOffset</text>
  <text x="795.2" y="381.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">endOffset</text>
  <text x="795.2" y="412.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">numInputRows</text>
  <text x="795.2" y="442.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">latestOffset</text>
  <rect x="960" y="270" width="280" height="189" rx="12.8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.2" />
  <text x="1099.2" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#7b1fa2">Query Status</text>
  <text x="1099.2" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">isActive</text>
  <text x="1099.2" y="381.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">isTriggerActive</text>
  <text x="1099.2" y="412.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">isDataAvailable</text>
  <text x="1099.2" y="442.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">exception</text>
  <rect x="80" y="513" width="1120" height="180" rx="12.8" fill="#ffebee" stroke="#d32f2f" stroke-width="1.6" />
  <text x="640" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#d32f2f">Alert Conditions</text>
  <text x="240" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#555">processRate &lt; inputRate</text>
  <text x="240" y="639" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">Falling behind</text>
  <text x="640" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#555">stateMemory &gt; threshold</text>
  <text x="640" y="639" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">State growing too large</text>
  <text x="992" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#555">query.exception != null</text>
  <text x="992" y="639" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#888">Query failure</text>
</svg>
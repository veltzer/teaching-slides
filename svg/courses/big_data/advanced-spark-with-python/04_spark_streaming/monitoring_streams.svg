<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="72.2148" y="48.529354152241" width="322.1476" height="102.352991003467" rx="6.173949503443" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.2886" y="91.17644256055" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.316718530139" font-weight="bold" fill="var(--primary-accent)">Streaming Query</text>
  <text x="233.2886" y="125.294070934249" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">query.lastProgress</text>
  <line x1="394.3624" y1="99.705796712791" x2="474.8993" y2="99.705796712791" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="491.0067" y="40" width="354.3624" height="119.411699307949" rx="6.173949503443" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="668.1879" y="82.646982525941" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.316718530139" font-weight="bold" fill="var(--warn-accent)">StreamingQueryListener</text>
  <text x="668.1879" y="116.764716782008" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">onQueryProgress(event)</text>
  <text x="668.1879" y="142.352991003467" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">onQueryTerminated(event)</text>
  <line x1="845.369" y1="99.705796712791" x2="925.906" y2="99.705796712791" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="942.0134" y="48.529354152241" width="289.9328" height="102.352991003467" rx="6.173949503443" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1086.9799" y="91.17644256055" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.316718530139" font-weight="bold" fill="var(--ok-accent)">Metrics System</text>
  <text x="1086.9799" y="125.294070934249" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">Prometheus / Grafana</text>
  <rect x="40" y="219.117601903108" width="281.8792" height="179.117707785476" rx="6.173949503443" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180.1342" y="261.764690311416" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" font-weight="bold" fill="var(--primary-accent)">Throughput Metrics</text>
  <text x="180.1342" y="295.882318685116" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">inputRowsPerSecond</text>
  <text x="180.1342" y="324.882334567471" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">processedRowsPerSecond</text>
  <text x="180.1342" y="353.882350449827" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">numInputRows</text>
  <text x="180.1342" y="382.882366332182" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">batchDuration</text>
  <rect x="346.0403" y="219.117601903108" width="281.8792" height="179.117707785476" rx="6.173949503443" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486.1745" y="261.764690311416" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" font-weight="bold" fill="var(--ok-accent)">State Metrics</text>
  <text x="486.1745" y="295.882318685116" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">numRowsTotal</text>
  <text x="486.1745" y="324.882334567471" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">numRowsUpdated</text>
  <text x="486.1745" y="353.882350449827" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">memoryUsedBytes</text>
  <text x="486.1745" y="382.882366332182" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">customMetrics</text>
  <rect x="652.0805" y="219.117601903108" width="281.8792" height="179.117707785476" rx="6.173949503443" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.2147" y="261.764690311416" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" font-weight="bold" fill="var(--warn-accent)">Source Metrics</text>
  <text x="792.2147" y="295.882318685116" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">startOffset</text>
  <text x="792.2147" y="324.882334567471" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">endOffset</text>
  <text x="792.2147" y="353.882350449827" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">numInputRows</text>
  <text x="792.2147" y="382.882366332182" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">latestOffset</text>
  <rect x="958.1208" y="219.117601903108" width="281.8792" height="179.117707785476" rx="6.173949503443" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.255" y="261.764690311416" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" font-weight="bold" fill="var(--info-accent)">Query Status</text>
  <text x="1098.255" y="295.882318685116" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">isActive</text>
  <text x="1098.255" y="324.882334567471" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">isTriggerActive</text>
  <text x="1098.255" y="353.882350449827" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">isDataAvailable</text>
  <text x="1098.255" y="382.882366332182" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-muted)">exception</text>
  <rect x="72.2148" y="449.411752249133" width="1127.5167" height="170.588247750867" rx="6.173949503443" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.9731" y="492.058840657442" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.316718530139" font-weight="bold" fill="var(--danger-accent)">Alert Conditions</text>
  <text x="233.2886" y="534.705823183383" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" fill="var(--text-muted)">processRate &lt; inputRate</text>
  <text x="233.2886" y="568.82355743945" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-faint)">Falling behind</text>
  <text x="635.9731" y="534.705823183383" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" fill="var(--text-muted)">stateMemory &gt; threshold</text>
  <text x="635.9731" y="568.82355743945" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-faint)">State growing too large</text>
  <text x="990.3356" y="534.705823183383" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.753886112501" fill="var(--text-muted)">query.exception != null</text>
  <text x="990.3356" y="568.82355743945" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.191156594021" fill="var(--text-faint)">Query failure</text>
</svg>

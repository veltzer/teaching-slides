  <polyline points="87.4146,249.7561 145.6911,226.3415 203.9675,234.1464 262.2439,202.9268 320.5203,187.3171 378.7968,210.7317 437.0732,171.7073 495.3496,163.9024 524.4878,179.5122" fill="none" stroke="var(--primary-border)" stroke-width="2.9138" />

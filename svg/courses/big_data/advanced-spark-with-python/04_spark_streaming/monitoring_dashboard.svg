<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-md" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Monitoring Dashboard Layout</text>

  <!-- Dashboard frame -->
  <rect x="20" y="40" width="760" height="370" rx="10" fill="#fafafa" stroke="#ccc" stroke-width="2"/>

  <!-- Panel 1: Throughput chart -->
  <rect x="40" y="60" width="345" height="130" rx="6" fill="#fff" stroke="#0277bd" stroke-width="1.5"/>
  <text x="212" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0277bd">Throughput (rows/sec)</text>
  <!-- Simulated line chart -->
  <polyline points="60,160 100,145 140,150 180,130 220,120 260,135 300,110 340,105 360,115" fill="none" stroke="#0277bd" stroke-width="2"/>
  <polyline points="60,165 100,155 140,160 180,150 220,145 260,140 300,138 340,135 360,140" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="10" fill="#0277bd">-- Input rate</text>
  <text x="240" y="180" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">-- Process rate</text>

  <!-- Panel 2: Batch Duration -->
  <rect x="405" y="60" width="355" height="130" rx="6" fill="#fff" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="582" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef6c00">Batch Duration (ms)</text>
  <!-- Simulated bar chart -->
  <rect x="435" y="120" width="25" height="50" rx="2" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <rect x="470" y="110" width="25" height="60" rx="2" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <rect x="505" y="130" width="25" height="40" rx="2" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <rect x="540" y="105" width="25" height="65" rx="2" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <rect x="575" y="115" width="25" height="55" rx="2" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <rect x="610" y="125" width="25" height="45" rx="2" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <rect x="645" y="100" width="25" height="70" rx="2" fill="#ffab91" stroke="#d32f2f" stroke-width="1"/>
  <rect x="680" y="110" width="25" height="60" rx="2" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <text x="582" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Batch #  (red = exceeded trigger)</text>

  <!-- Panel 3: State Store -->
  <rect x="40" y="200" width="230" height="100" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="155" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">State Store</text>
  <text x="60" y="245" font-family="Arial, sans-serif" font-size="11" fill="#555">Total rows:</text>
  <text x="200" y="245" text-anchor="end" font-family="monospace" font-size="11" fill="#333">1,234,567</text>
  <text x="60" y="263" font-family="Arial, sans-serif" font-size="11" fill="#555">Memory used:</text>
  <text x="200" y="263" text-anchor="end" font-family="monospace" font-size="11" fill="#333">2.4 GB</text>
  <text x="60" y="281" font-family="Arial, sans-serif" font-size="11" fill="#555">Updated rows:</text>
  <text x="200" y="281" text-anchor="end" font-family="monospace" font-size="11" fill="#333">45,678</text>

  <!-- Panel 4: Source Info -->
  <rect x="285" y="200" width="230" height="100" rx="6" fill="#fff" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="400" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7b1fa2">Kafka Source</text>
  <text x="305" y="245" font-family="Arial, sans-serif" font-size="11" fill="#555">Topic:</text>
  <text x="445" y="245" text-anchor="end" font-family="monospace" font-size="11" fill="#333">user_events</text>
  <text x="305" y="263" font-family="Arial, sans-serif" font-size="11" fill="#555">Partitions:</text>
  <text x="445" y="263" text-anchor="end" font-family="monospace" font-size="11" fill="#333">12</text>
  <text x="305" y="281" font-family="Arial, sans-serif" font-size="11" fill="#555">Consumer lag:</text>
  <text x="445" y="281" text-anchor="end" font-family="monospace" font-size="11" fill="#333">5,432</text>

  <!-- Panel 5: Health Status -->
  <rect x="530" y="200" width="230" height="100" rx="6" fill="#fff" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="645" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">Health Status</text>
  <circle cx="560" cy="248" r="6" fill="#2e7d32"/>
  <text x="575" y="253" font-family="Arial, sans-serif" font-size="11" fill="#555">Query active</text>
  <circle cx="560" cy="268" r="6" fill="#2e7d32"/>
  <text x="575" y="273" font-family="Arial, sans-serif" font-size="11" fill="#555">Processing on schedule</text>
  <circle cx="560" cy="288" r="6" fill="#ef6c00"/>
  <text x="575" y="293" font-family="Arial, sans-serif" font-size="11" fill="#555">State size warning</text>

  <!-- Alerts bar -->
  <rect x="40" y="315" width="720" height="40" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="1"/>
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef6c00">Alerts:</text>
  <text x="120" y="340" font-family="Arial, sans-serif" font-size="12" fill="#555">processRate/inputRate ratio = 0.85 (below 0.9 threshold) | State size growing 5%/hour</text>

  <!-- API reference -->
  <rect x="40" y="365" width="720" height="35" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="400" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">API: query.lastProgress | query.status | spark.streams.active | StreamingQueryListener</text>
</svg>

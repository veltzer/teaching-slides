    <ns0:marker id="arrow-ss" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.6,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="591.0534" y="41.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6421" font-weight="bold" fill="var(--text-dark)">Streaming Security Setup</ns0:text>
  <ns0:rect x="44.329" y="83.1169" width="339.8557" height="232.7273" rx="11.8211" fill="var(--primary-pale3)" stroke="var(--primary-strong)" stroke-width="2.9553" />
  <ns0:text x="214.2569" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--primary-strong)">Transport Security</ns0:text>
  <ns0:text x="214.2569" y="166.2338" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">SSL/TLS encryption</ns0:text>
  <ns0:text x="214.2569" y="199.4805" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">kafka.security.protocol</ns0:text>
  <ns0:text x="214.2569" y="232.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">SASL_SSL / SSL</ns0:text>
  <ns0:text x="214.2569" y="265.974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Certificate management</ns0:text>
  <ns0:text x="214.2569" y="295.8961" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">truststore / keystore</ns0:text>
  <ns0:rect x="421.1255" y="83.1169" width="339.8557" height="232.7273" rx="11.8211" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.9553" />
  <ns0:text x="591.0534" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--ok-dk)">Authentication</ns0:text>
  <ns0:text x="591.0534" y="166.2338" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">SASL mechanisms</ns0:text>
  <ns0:text x="591.0534" y="199.4805" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">PLAIN / SCRAM / GSSAPI</ns0:text>
  <ns0:text x="591.0534" y="232.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Kerberos integration</ns0:text>
  <ns0:text x="591.0534" y="265.974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Service accounts</ns0:text>
  <ns0:text x="591.0534" y="295.8961" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">kafka.sasl.mechanism</ns0:text>
  <ns0:rect x="797.9221" y="83.1169" width="339.8557" height="232.7273" rx="11.8211" fill="var(--warn-pale)" stroke="var(--warn-deep)" stroke-width="2.9553" />
  <ns0:text x="967.8499" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--warn-deep)">Authorization</ns0:text>
  <ns0:text x="967.8499" y="166.2338" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Kafka ACLs</ns0:text>
  <ns0:text x="967.8499" y="199.4805" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Topic-level permissions</ns0:text>
  <ns0:text x="967.8499" y="232.7273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Consumer group access</ns0:text>
  <ns0:text x="967.8499" y="265.974" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Read / Write / Describe</ns0:text>
  <ns0:text x="967.8499" y="295.8961" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-faint)">Least privilege principle</ns0:text>
  <ns0:rect x="44.329" y="365.7143" width="517.1717" height="132.987" rx="11.8211" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="2.9553" />
  <ns0:text x="302.9149" y="407.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--info-mid)">Data Protection</ns0:text>
  <ns0:text x="302.9149" y="445.5065" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Encryption at rest (checkpoint data)</ns0:text>
  <ns0:text x="302.9149" y="478.7532" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">PII masking in streaming pipelines</ns0:text>
  <ns0:rect x="605.8297" y="365.7143" width="531.9481" height="132.987" rx="11.8211" fill="var(--danger-pale)" stroke="var(--danger-mid)" stroke-width="2.9553" />
  <ns0:text x="871.8038" y="407.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--danger-mid)">Secrets Management</ns0:text>
  <ns0:text x="871.8038" y="445.5065" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Never hardcode credentials in code</ns0:text>
  <ns0:text x="871.8038" y="478.7532" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Use Vault / KMS / environment variables</ns0:text>
  <ns0:rect x="44.329" y="531.9481" width="1093.4488" height="108.0519" rx="11.8211" fill="var(--surface-light)" stroke="var(--border-faint)" stroke-width="1.4776" />
  <ns0:text x="591.0534" y="568.5195" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--text-dark)">Kafka SSL Configuration Example</ns0:text>
  <ns0:text x="591.0534" y="606.7532" text-anchor="middle" font-family="monospace" font-size="16.254" fill="var(--text-muted)">.option("kafka.security.protocol", "SASL_SSL") .option("kafka.sasl.mechanism", "PLAIN") .option("kafka.ssl.truststore.location", "/path/truststore.jks")</ns0:text>
</ns0:svg>
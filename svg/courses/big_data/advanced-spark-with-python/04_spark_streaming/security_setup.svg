<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="372.973" height="242.38811744264" rx="6.219852792232" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--primary-accent)">Transport Security</text>
  <text x="226.4865" y="126.567215504569" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">SSL/TLS encryption</text>
  <text x="226.4865" y="161.19405872132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">kafka.security.protocol</text>
  <text x="226.4865" y="195.820901938071" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-faint)">SASL_SSL / SSL</text>
  <text x="226.4865" y="230.447745154822" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Certificate management</text>
  <text x="226.4865" y="261.611925542436" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-faint)">truststore / keystore</text>
  <rect x="453.5135" y="40" width="372.973" height="242.38811744264" rx="6.219852792232" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--ok-accent)">Authentication</text>
  <text x="640" y="126.567215504569" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">SASL mechanisms</text>
  <text x="640" y="161.19405872132" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-faint)">PLAIN / SCRAM / GSSAPI</text>
  <text x="640" y="195.820901938071" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Kerberos integration</text>
  <text x="640" y="230.447745154822" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Service accounts</text>
  <text x="640" y="261.611925542436" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-faint)">kafka.sasl.mechanism</text>
  <rect x="867.027" y="40" width="372.973" height="242.38811744264" rx="6.219852792232" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="83.283607752284" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--warn-accent)">Authorization</text>
  <text x="1053.5135" y="126.567215504569" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Kafka ACLs</text>
  <text x="1053.5135" y="161.19405872132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Topic-level permissions</text>
  <text x="1053.5135" y="195.820901938071" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Consumer group access</text>
  <text x="1053.5135" y="230.447745154822" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Read / Write / Describe</text>
  <text x="1053.5135" y="261.611925542436" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.377335723578" fill="var(--text-faint)">Least privilege principle</text>
  <rect x="40" y="334.328382267767" width="567.5675" height="138.507480329696" rx="6.219852792232" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="323.7838" y="377.61188255736" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--info-accent)">Data Protection</text>
  <text x="323.7838" y="417.432827480508" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Encryption at rest (checkpoint data)</text>
  <text x="323.7838" y="452.059670697259" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">PII masking in streaming pipelines</text>
  <rect x="656.2162" y="334.328382267767" width="583.7838" height="138.507480329696" rx="6.219852792232" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="948.1081" y="377.61188255736" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.536813613605" font-weight="bold" fill="var(--danger-accent)">Secrets Management</text>
  <text x="948.1081" y="417.432827480508" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Never hardcode credentials in code</text>
  <text x="948.1081" y="452.059670697259" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" fill="var(--text-muted)">Use Vault / KMS / environment variables</text>
  <rect x="40" y="507.462705814213" width="1200" height="112.537294185787" rx="6.219852792232" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="545.552211860101" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.957074668592" font-weight="bold" fill="var(--text)">Kafka SSL Configuration Example</text>
  <text x="640" y="585.373049320558" text-anchor="middle" font-size="17.377335723578" fill="var(--text-muted)" font-family="Courier New, monospace">.option("kafka.security.protocol", "SASL_SSL") .option("kafka.sasl.mechanism", "PLAIN") .option("kafka.ssl.truststore.location", "/path/truststore.jks")</text>
</svg>

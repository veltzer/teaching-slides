<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-ss" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3826" font-weight="bold" fill="var(--text)">Streaming Security Setup</text>
  <rect x="40" y="80.2778" width="372.973" height="225.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="226.4865" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--primary-accent)">Transport Security</text>
  <text x="226.4865" y="160.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">SSL/TLS encryption</text>
  <text x="226.4865" y="193.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">kafka.security.protocol</text>
  <text x="226.4865" y="225.2778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">SASL_SSL / SSL</text>
  <text x="226.4865" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Certificate management</text>
  <text x="226.4865" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">truststore / keystore</text>
  <rect x="453.5135" y="80.2778" width="372.973" height="225.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--ok-accent)">Authentication</text>
  <text x="640" y="160.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">SASL mechanisms</text>
  <text x="640" y="193.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">PLAIN / SCRAM / GSSAPI</text>
  <text x="640" y="225.2778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Kerberos integration</text>
  <text x="640" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Service accounts</text>
  <text x="640" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">kafka.sasl.mechanism</text>
  <rect x="867.027" y="80.2778" width="372.973" height="225.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1053.5135" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--warn-accent)">Authorization</text>
  <text x="1053.5135" y="160.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Kafka ACLs</text>
  <text x="1053.5135" y="193.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Topic-level permissions</text>
  <text x="1053.5135" y="225.2778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Consumer group access</text>
  <text x="1053.5135" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Read / Write / Describe</text>
  <text x="1053.5135" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-faint)">Least privilege principle</text>
  <rect x="40" y="354.1667" width="567.5675" height="128.8889" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="323.7838" y="394.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--info-accent)">Data Protection</text>
  <text x="323.7838" y="431.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Encryption at rest (checkpoint data)</text>
  <text x="323.7838" y="463.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">PII masking in streaming pipelines</text>
  <rect x="656.2162" y="354.1667" width="583.7838" height="128.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="948.1081" y="394.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--danger-accent)">Secrets Management</text>
  <text x="948.1081" y="431.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Never hardcode credentials in code</text>
  <text x="948.1081" y="463.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Use Vault / KMS / environment variables</text>
  <rect x="40" y="515.2778" width="1200" height="104.7222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="550.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--text)">Kafka SSL Configuration Example</text>
  <text x="640" y="587.7777" text-anchor="middle" font-family="monospace" font-size="16.7631" fill="var(--text-muted)">.option("kafka.security.protocol", "SASL_SSL") .option("kafka.sasl.mechanism", "PLAIN") .option("kafka.ssl.truststore.location", "/path/truststore.jks")</text>
</svg>
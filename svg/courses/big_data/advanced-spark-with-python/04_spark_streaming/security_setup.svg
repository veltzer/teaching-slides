  <ns0:text x="591.0534" y="606.7532" text-anchor="middle" font-family="monospace" font-size="16.254" fill="#555">.option("kafka.security.protocol", "SASL_SSL") .option("kafka.sasl.mechanism", "PLAIN") .option("kafka.ssl.truststore.location", "/path/truststore.jks")</ns0:text>

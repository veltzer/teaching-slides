<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-ids" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.5538" font-weight="bold" fill="var(--text)">Spark Streaming Input Data Sources</text>
  <rect x="40" y="80.845" width="243.2433" height="114.3662" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="161.6216" y="129.8591" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.95" font-weight="bold" fill="var(--primary-accent)">Kafka</text>
  <text x="161.6216" y="162.5352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Topics / Partitions</text>
  <rect x="331.8919" y="80.845" width="243.2433" height="114.3662" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="453.5136" y="129.8591" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.95" font-weight="bold" fill="var(--ok-accent)">File Source</text>
  <text x="453.5136" y="162.5352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">JSON / CSV / Parquet</text>
  <rect x="623.7837" y="80.845" width="243.2433" height="114.3662" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="745.4055" y="129.8591" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.95" font-weight="bold" fill="var(--warn-accent)">Socket</text>
  <text x="745.4055" y="162.5352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">TCP / Text stream</text>
  <rect x="915.6757" y="80.845" width="243.2433" height="114.3662" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1037.2973" y="129.8591" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.95" font-weight="bold" fill="var(--info-accent)">Rate Source</text>
  <text x="1037.2973" y="162.5352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Testing / Benchmark</text>
  <line x1="161.6216" y1="195.2113" x2="510.2702" y2="285.0704" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ids)" />
  <line x1="453.5136" y1="195.2113" x2="575.1352" y2="285.0704" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ids)" />
  <line x1="745.4055" y1="195.2113" x2="704.8649" y2="285.0704" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ids)" />
  <line x1="1037.2973" y1="195.2113" x2="769.7298" y2="285.0704" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ids)" />
  <rect x="315.6757" y="285.0704" width="648.6487" height="114.3662" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="334.0845" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4846" font-weight="bold" fill="var(--primary-accent)">Spark Structured Streaming Engine</text>
  <text x="640" y="366.7606" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4153" fill="var(--text-muted)">readStream.format(...).option(...).load()</text>
  <rect x="40" y="456.6197" width="275.6757" height="163.3803" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="177.8378" y="489.2958" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4153" font-weight="bold" fill="var(--text)">Kafka Features</text>
  <text x="177.8378" y="518.7042" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Subscribe / Assign</text>
  <text x="177.8378" y="546.4788" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Starting offsets</text>
  <text x="177.8378" y="574.2535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Rate limiting</text>
  <text x="177.8378" y="602.0282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">SSL / SASL auth</text>
  <rect x="348.1081" y="456.6197" width="275.6757" height="163.3803" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="485.946" y="489.2958" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4153" font-weight="bold" fill="var(--text)">File Features</text>
  <text x="485.946" y="518.7042" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Schema inference</text>
  <text x="485.946" y="546.4788" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">maxFilesPerTrigger</text>
  <text x="485.946" y="574.2535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Path globbing</text>
  <text x="485.946" y="602.0282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Partition discovery</text>
  <rect x="656.2163" y="456.6197" width="275.6757" height="163.3803" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="794.054" y="489.2958" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4153" font-weight="bold" fill="var(--text)">Socket Features</text>
  <text x="794.054" y="518.7042" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Host / Port config</text>
  <text x="794.054" y="546.4788" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Text delimited</text>
  <text x="794.054" y="574.2535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">Dev / testing only</text>
  <text x="794.054" y="602.0282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-faint)">No fault tolerance</text>
  <rect x="964.3243" y="456.6197" width="275.6757" height="163.3803" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1102.1622" y="489.2958" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4153" font-weight="bold" fill="var(--text)">Rate Features</text>
  <text x="1102.1622" y="518.7042" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">rowsPerSecond</text>
  <text x="1102.1622" y="546.4788" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">rampUpTime</text>
  <text x="1102.1622" y="574.2535" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-muted)">numPartitions</text>
  <text x="1102.1622" y="602.0282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8807" fill="var(--text-faint)">Testing only</text>
</svg>
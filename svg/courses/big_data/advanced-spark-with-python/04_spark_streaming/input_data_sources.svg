<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="243.2433" height="123.030289990819" rx="6.223123626351" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="161.6216" y="92.727282506886" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.691886057618" font-weight="bold" fill="var(--primary-accent)">Kafka</text>
  <text x="161.6216" y="127.878840036724" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Topics / Partitions</text>
  <rect x="331.8919" y="40" width="243.2433" height="123.030289990819" rx="6.223123626351" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="453.5136" y="92.727282506886" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.691886057618" font-weight="bold" fill="var(--ok-accent)">File Source</text>
  <text x="453.5136" y="127.878840036724" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">JSON / CSV / Parquet</text>
  <rect x="623.7837" y="40" width="243.2433" height="123.030289990819" rx="6.223123626351" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="745.4055" y="92.727282506886" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.691886057618" font-weight="bold" fill="var(--warn-accent)">Socket</text>
  <text x="745.4055" y="127.878840036724" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">TCP / Text stream</text>
  <rect x="915.6757" y="40" width="243.2433" height="123.030289990819" rx="6.223123626351" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1037.2973" y="92.727282506886" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.691886057618" font-weight="bold" fill="var(--info-accent)">Rate Source</text>
  <text x="1037.2973" y="127.878840036724" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Testing / Benchmark</text>
  <line x1="161.6216" y1="163.030397566562" x2="510.2702" y2="259.696992516067" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="453.5136" y1="163.030397566562" x2="575.1352" y2="259.696992516067" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745.4055" y1="163.030397566562" x2="704.8649" y2="259.696992516067" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1037.2973" y1="163.030397566562" x2="769.7298" y2="259.696992516067" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="315.6757" y="259.696992516067" width="648.6487" height="123.030289990819" rx="6.223123626351" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="312.424275022953" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.283553643785" font-weight="bold" fill="var(--primary-accent)">Spark Structured Streaming Engine</text>
  <text x="640" y="347.575832552791" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.100114752725" fill="var(--text-muted)">readStream.format(...).option(...).load()</text>
  <rect x="40" y="444.242427502295" width="275.6757" height="175.757572497705" rx="6.223123626351" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="177.8378" y="479.393985032134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.100114752725" font-weight="bold" fill="var(--text)">Kafka Features</text>
  <text x="177.8378" y="511.030289990819" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Subscribe / Assign</text>
  <text x="177.8378" y="540.9090224518" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Starting offsets</text>
  <text x="177.8378" y="570.787862488524" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Rate limiting</text>
  <text x="177.8378" y="600.666702525248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">SSL / SASL auth</text>
  <rect x="348.1081" y="444.242427502295" width="275.6757" height="175.757572497705" rx="6.223123626351" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="485.946" y="479.393985032134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.100114752725" font-weight="bold" fill="var(--text)">File Features</text>
  <text x="485.946" y="511.030289990819" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Schema inference</text>
  <text x="485.946" y="540.9090224518" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">maxFilesPerTrigger</text>
  <text x="485.946" y="570.787862488524" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Path globbing</text>
  <text x="485.946" y="600.666702525248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Partition discovery</text>
  <rect x="656.2163" y="444.242427502295" width="275.6757" height="175.757572497705" rx="6.223123626351" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="794.054" y="479.393985032134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.100114752725" font-weight="bold" fill="var(--text)">Socket Features</text>
  <text x="794.054" y="511.030289990819" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Host / Port config</text>
  <text x="794.054" y="540.9090224518" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Text delimited</text>
  <text x="794.054" y="570.787862488524" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">Dev / testing only</text>
  <text x="794.054" y="600.666702525248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-faint)">No fault tolerance</text>
  <rect x="964.3243" y="444.242427502295" width="275.6757" height="175.757572497705" rx="6.223123626351" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1102.1622" y="479.393985032134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.100114752725" font-weight="bold" fill="var(--text)">Rate Features</text>
  <text x="1102.1622" y="511.030289990819" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">rowsPerSecond</text>
  <text x="1102.1622" y="540.9090224518" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">rampUpTime</text>
  <text x="1102.1622" y="570.787862488524" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-muted)">numPartitions</text>
  <text x="1102.1622" y="600.666702525248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.508447166558" fill="var(--text-faint)">Testing only</text>
</svg>

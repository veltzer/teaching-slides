  <ns0:text x="601.3968" y="396.8" font-family="Arial, sans-serif" font-size="21.9429" fill="#888">(operator state)</ns0:text>
  <ns0:text x="387.9979" y="427.8857" font-family="Arial, sans-serif" font-size="21.9429" fill="#555">metadata</ns0:text>
  <ns0:text x="601.3968" y="427.8857" font-family="Arial, sans-serif" font-size="21.9429" fill="#888">(query metadata)</ns0:text>

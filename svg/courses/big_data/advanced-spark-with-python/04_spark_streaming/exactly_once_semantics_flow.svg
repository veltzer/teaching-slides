  <ns0:text x="261.8986" y="100.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold" fill="#333">Source (Kafka)</ns0:text>
  <ns0:text x="261.8986" y="131.6571" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="#555">Offsets tracked</ns0:text>
  <ns0:text x="261.8986" y="159.0857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="#555">in checkpoint</ns0:text>

  <ns0:line x1="940.895" y1="192" x2="737.1961" y2="246.8571" stroke="#333" stroke-width="3.6572" marker-end="url(#arrow-eo)" />
  <ns0:rect x="193.999" y="256" width="814.7957" height="182.8571" rx="14.6286" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.6572" />
  <ns0:text x="601.3968" y="296.2285" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7714" font-weight="bold" fill="#333">Checkpoint Directory</ns0:text>
  <ns0:text x="387.9979" y="334.6286" font-family="Arial, sans-serif" font-size="21.9429" fill="#555">offsets/</ns0:text>
  <ns0:text x="601.3968" y="334.6286" font-family="Arial, sans-serif" font-size="21.9429" fill="#888">(source offsets)</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-eo" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,19.4595 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <text x="601.3968" y="36.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.4286" font-weight="bold" fill="var(--text)">Exactly-Once Guarantee</text>
  <rect x="96.9995" y="64" width="329.7982" height="128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="261.8986" y="100.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold" fill="var(--text)">Source (Kafka)</text>
  <text x="261.8986" y="131.6571" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">Offsets tracked</text>
  <text x="261.8986" y="159.0857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">in checkpoint</text>
  <rect x="775.9959" y="64" width="329.7982" height="128" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="940.895" y="100.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="940.895" y="131.6571" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">State</text>
  <text x="940.895" y="159.0857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">checkpointed</text>
  <line x1="261.8986" y1="192" x2="465.5976" y2="246.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-eo)" />
  <line x1="940.895" y1="192" x2="737.1961" y2="246.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-eo)" />
  <rect x="193.999" y="256" width="814.7957" height="182.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="601.3968" y="296.2285" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7714" font-weight="bold" fill="var(--text)">Checkpoint Directory</text>
  <text x="387.9979" y="334.6286" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">offsets/</text>
  <text x="601.3968" y="334.6286" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-faint)">(source offsets)</text>
  <text x="387.9979" y="365.7143" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">commits/</text>
  <text x="601.3968" y="365.7143" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-faint)">(batch commits)</text>
  <text x="387.9979" y="396.8" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">state/</text>
  <text x="601.3968" y="396.8" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-faint)">(operator state)</text>
  <text x="387.9979" y="427.8857" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">metadata</text>
  <text x="601.3968" y="427.8857" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-faint)">(query metadata)</text>
  <line x1="601.3968" y1="438.8571" x2="601.3968" y2="493.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-eo)" />
  <rect x="349.1981" y="502.8571" width="504.3973" height="91.4286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="601.3968" y="539.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold" fill="var(--text)">Sink: Delta Lake</text>
  <text x="601.3968" y="572.3429" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">ACID writes ensure no duplicates (idempotent)</text>
  <text x="601.3968" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-faint)">On failure: replay from last committed checkpoint, reprocess the batch</text>
</svg>
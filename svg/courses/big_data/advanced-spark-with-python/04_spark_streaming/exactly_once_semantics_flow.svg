  <ns0:text x="601.3968" y="539.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold" fill="#333">Sink: Delta Lake</ns0:text>
  <ns0:text x="601.3968" y="572.3429" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="#555">ACID writes ensure no duplicates (idempotent)</ns0:text>
  <ns0:text x="601.3968" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="#888">On failure: replay from last committed checkpoint, reprocess the batch</ns0:text>

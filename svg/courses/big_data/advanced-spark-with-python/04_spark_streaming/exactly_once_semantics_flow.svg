<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.3288" font-weight="bold" fill="var(--text)">Exactly-Once Guarantee</text>
  <rect x="40" y="66.3637" width="392.3077" height="123.0303" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.1538" y="101.5151" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.463" font-weight="bold" fill="var(--text)">Source (Kafka)</text>
  <text x="236.1538" y="131.3939" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-muted)">Offsets tracked</text>
  <text x="236.1538" y="157.7576" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-muted)">in checkpoint</text>
  <rect x="847.6923" y="66.3637" width="392.3077" height="123.0303" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.8462" y="101.5151" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.463" font-weight="bold" fill="var(--text)">Processing</text>
  <text x="1043.8462" y="131.3939" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-muted)">State</text>
  <text x="1043.8462" y="157.7576" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-muted)">checkpointed</text>
  <line x1="236.1538" y1="189.394" x2="478.4616" y2="242.1212" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1043.8462" y1="189.394" x2="801.5385" y2="242.1212" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="155.3846" y="250.9091" width="969.2308" height="175.7575" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="289.5757" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.4182" font-weight="bold" fill="var(--text)">Checkpoint Directory</text>
  <text x="386.1538" y="326.4849" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-muted)">offsets/</text>
  <text x="640" y="326.4849" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-faint)">(source offsets)</text>
  <text x="386.1538" y="356.3637" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-muted)">commits/</text>
  <text x="640" y="356.3637" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-faint)">(batch commits)</text>
  <text x="386.1538" y="386.2424" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-muted)">state/</text>
  <text x="640" y="386.2424" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-faint)">(operator state)</text>
  <text x="386.1538" y="416.1212" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-muted)">metadata</text>
  <text x="640" y="416.1212" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-faint)">(query metadata)</text>
  <line x1="640" y1="426.6666" x2="640" y2="479.394" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="339.9999" y="488.1818" width="600" height="87.8788" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="523.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.463" font-weight="bold" fill="var(--text)">Sink: Delta Lake</text>
  <text x="640" y="554.9697" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-muted)">ACID writes ensure no duplicates (idempotent)</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.463" fill="var(--text-faint)">On failure: replay from last committed checkpoint, reprocess the batch</text>
</svg>

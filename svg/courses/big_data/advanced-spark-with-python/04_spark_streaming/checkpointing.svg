  <ns0:text x="591.0534" y="390.6494" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="#333">Recovery Flow on Failure</ns0:text>
  <ns0:rect x="44.329" y="423.8961" width="229.0332" height="91.4286" rx="8.8658" fill="#ffebee" stroke="#d32f2f" stroke-width="2.9553" />

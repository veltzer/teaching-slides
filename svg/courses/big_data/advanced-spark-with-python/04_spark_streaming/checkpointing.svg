<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-cp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="41.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6421" font-weight="bold" fill="var(--text)">Checkpointing Mechanism</text>
  <rect x="73.8817" y="83.1169" width="295.5267" height="99.7403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="221.645" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">Streaming Query</text>
  <text x="221.645" y="157.9221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Processing micro-batches</text>
  <line x1="369.4084" y1="132.987" x2="458.0664" y2="132.987" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cp)" />
  <text x="413.7374" y="119.6883" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text-faint)">write</text>
  <rect x="472.8427" y="66.4935" width="517.1717" height="265.974" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="731.4286" y="108.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--warn-accent)">Checkpoint Directory</text>
  <rect x="502.3954" y="132.987" width="206.8687" height="58.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="605.8297" y="169.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text)">offsets/</text>
  <rect x="502.3954" y="199.4805" width="206.8687" height="58.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="605.8297" y="236.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text)">commits/</text>
  <rect x="753.5931" y="132.987" width="206.8687" height="58.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="857.0274" y="169.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text)">state/</text>
  <rect x="753.5931" y="199.4805" width="206.8687" height="58.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="857.0274" y="236.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text)">metadata</text>
  <text x="605.8297" y="299.2208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text-faint)">Source offsets per batch</text>
  <text x="857.0274" y="299.2208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.7763" fill="var(--text-faint)">Operator state snapshots</text>
  <text x="591.0534" y="390.6494" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6869" font-weight="bold" fill="var(--text)">Recovery Flow on Failure</text>
  <rect x="44.329" y="423.8961" width="229.0332" height="91.4286" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="158.1068" y="462.1299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--danger-accent)">1. Failure</text>
  <text x="158.1068" y="492.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Query crashes</text>
  <line x1="273.3622" y1="468.7792" x2="317.6912" y2="468.7792" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cp)" />
  <rect x="332.4675" y="423.8961" width="229.0332" height="91.4286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="446.2453" y="462.1299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--warn-accent)">2. Read Checkpoint</text>
  <text x="446.2453" y="492.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Load last state</text>
  <line x1="561.5007" y1="468.7792" x2="605.8297" y2="468.7792" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cp)" />
  <rect x="620.6061" y="423.8961" width="229.0332" height="91.4286" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="734.3838" y="462.1299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">3. Replay Batch</text>
  <text x="734.3838" y="492.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">From last offset</text>
  <line x1="849.6392" y1="468.7792" x2="893.9683" y2="468.7792" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cp)" />
  <rect x="908.7446" y="423.8961" width="229.0332" height="91.4286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1022.5224" y="462.1299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">4. Resume</text>
  <text x="1022.5224" y="492.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="var(--text-muted)">Continue processing</text>
  <rect x="73.8817" y="548.5714" width="1034.3434" height="91.4286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="591.0534" y="585.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Key Guarantees</text>
  <text x="591.0534" y="618.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="var(--text-muted)">Exactly-once processing | No data loss | Automatic state recovery | Idempotent sinks recommended</text>
</svg>
  <ns0:text x="734.3838" y="462.1299" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="#0277bd">3. Replay Batch</ns0:text>
  <ns0:text x="734.3838" y="492.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="#555">From last offset</ns0:text>

  <ns0:text x="221.645" y="124.6753" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2092" font-weight="bold" fill="#0277bd">Streaming Query</ns0:text>
  <ns0:text x="221.645" y="157.9221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.254" fill="#555">Processing micro-batches</ns0:text>

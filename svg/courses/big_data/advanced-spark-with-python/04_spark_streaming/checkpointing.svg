<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-cp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Checkpointing Mechanism</text>

  <!-- Streaming Query -->
  <rect x="50" y="50" width="200" height="60" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="150" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0277bd">Streaming Query</text>
  <text x="150" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Processing micro-batches</text>

  <!-- Arrow to checkpoint -->
  <line x1="250" y1="80" x2="310" y2="80" stroke="#333" stroke-width="2" marker-end="url(#arrow-cp)"/>
  <text x="280" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">write</text>

  <!-- Checkpoint Directory -->
  <rect x="320" y="40" width="350" height="160" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="495" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ef6c00">Checkpoint Directory</text>

  <!-- Sub-directories -->
  <rect x="340" y="80" width="140" height="35" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <text x="410" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">offsets/</text>

  <rect x="340" y="120" width="140" height="35" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <text x="410" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">commits/</text>

  <rect x="510" y="80" width="140" height="35" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <text x="580" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">state/</text>

  <rect x="510" y="120" width="140" height="35" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
  <text x="580" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">metadata</text>

  <!-- Descriptions -->
  <text x="410" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Source offsets per batch</text>
  <text x="580" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Operator state snapshots</text>

  <!-- Recovery Flow -->
  <text x="400" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Recovery Flow on Failure</text>

  <!-- Step boxes -->
  <rect x="30" y="255" width="155" height="55" rx="6" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="107" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#d32f2f">1. Failure</text>
  <text x="107" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Query crashes</text>

  <line x1="185" y1="282" x2="215" y2="282" stroke="#333" stroke-width="2" marker-end="url(#arrow-cp)"/>

  <rect x="225" y="255" width="155" height="55" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="302" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ef6c00">2. Read Checkpoint</text>
  <text x="302" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Load last state</text>

  <line x1="380" y1="282" x2="410" y2="282" stroke="#333" stroke-width="2" marker-end="url(#arrow-cp)"/>

  <rect x="420" y="255" width="155" height="55" rx="6" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="497" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0277bd">3. Replay Batch</text>
  <text x="497" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">From last offset</text>

  <line x1="575" y1="282" x2="605" y2="282" stroke="#333" stroke-width="2" marker-end="url(#arrow-cp)"/>

  <rect x="615" y="255" width="155" height="55" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="692" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">4. Resume</text>
  <text x="692" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Continue processing</text>

  <!-- Key guarantees -->
  <rect x="50" y="330" width="700" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="400" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">Key Guarantees</text>
  <text x="400" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Exactly-once processing | No data loss | Automatic state recovery | Idempotent sinks recommended</text>
</svg>

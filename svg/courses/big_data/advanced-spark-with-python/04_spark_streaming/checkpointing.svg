  <ns0:text x="591.0534" y="585.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" font-weight="bold" fill="#2e7d32">Key Guarantees</ns0:text>
  <ns0:text x="591.0534" y="618.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="#555">Exactly-once processing | No data loss | Automatic state recovery | Idempotent sinks recommended</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="72.4325" y="56.811583616887" width="324.3243" height="100.869606049152" rx="6.129047205243" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.5946" y="98.840594833019" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.236990213057" font-weight="bold" fill="var(--primary-accent)">Streaming Query</text>
  <text x="234.5946" y="132.463762066792" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.123638534367" fill="var(--text-muted)">Processing micro-batches</text>
  <line x1="396.7568" y1="107.246334467546" x2="494.0541" y2="107.246334467546" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445.4054" y="93.797046704471" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.566860544235" fill="var(--text-faint)">write</text>
  <rect x="510.2702" y="40" width="567.5675" height="268.985442218018" rx="6.129047205243" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.0541" y="82.0289068683" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.793768203188" font-weight="bold" fill="var(--warn-accent)">Checkpoint Directory</text>
  <rect x="542.7027" y="107.246334467546" width="227.027" height="58.840594833019" rx="6.129047205243" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="144.23179755513" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" fill="var(--text)">offsets/</text>
  <rect x="542.7027" y="174.492773282925" width="227.027" height="58.840594833019" rx="6.129047205243" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="211.478236370509" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" fill="var(--text)">commits/</text>
  <rect x="818.3784" y="107.246334467546" width="227.027" height="58.840594833019" rx="6.129047205243" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.8919" y="144.23179755513" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" fill="var(--text)">state/</text>
  <rect x="818.3784" y="174.492773282925" width="227.027" height="58.840594833019" rx="6.129047205243" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.8919" y="211.478236370509" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" fill="var(--text)">metadata</text>
  <text x="656.2162" y="275.362379332077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.566860544235" fill="var(--text-faint)">Source offsets per batch</text>
  <text x="931.8919" y="275.362379332077" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.566860544235" fill="var(--text-faint)">Operator state snapshots</text>
  <text x="640" y="367.826141398869" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.793768203188" font-weight="bold" fill="var(--text)">Recovery Flow on Failure</text>
  <rect x="40" y="401.449308632642" width="251.3514" height="92.463762066792" rx="6.129047205243" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.8649" y="440.116023994964" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" font-weight="bold" fill="var(--danger-accent)">1. Failure</text>
  <text x="164.8649" y="470.376791027094" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.123638534367" fill="var(--text-muted)">Query crashes</text>
  <line x1="291.3514" y1="446.840511354753" x2="340" y2="446.840511354753" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="356.2162" y="401.449308632642" width="251.3514" height="92.463762066792" rx="6.129047205243" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="481.0811" y="440.116023994964" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" font-weight="bold" fill="var(--warn-accent)">2. Read Checkpoint</text>
  <text x="481.0811" y="470.376791027094" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.123638534367" fill="var(--text-muted)">Load last state</text>
  <line x1="607.5675" y1="446.840511354753" x2="656.2162" y2="446.840511354753" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="672.4325" y="401.449308632642" width="251.3514" height="92.463762066792" rx="6.129047205243" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="797.2972" y="440.116023994964" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" font-weight="bold" fill="var(--primary-accent)">3. Replay Batch</text>
  <text x="797.2972" y="470.376791027094" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.123638534367" fill="var(--text-muted)">From last offset</text>
  <line x1="923.7837" y1="446.840511354753" x2="972.4325" y2="446.840511354753" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="988.6486" y="401.449308632642" width="251.3514" height="92.463762066792" rx="6.129047205243" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.5135" y="440.116023994964" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" font-weight="bold" fill="var(--ok-accent)">4. Resume</text>
  <text x="1113.5135" y="470.376791027094" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.123638534367" fill="var(--text-muted)">Continue processing</text>
  <rect x="72.4325" y="527.536237933208" width="1135.1351" height="92.463762066792" rx="6.129047205243" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="564.521805368624" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" font-weight="bold" fill="var(--ok-accent)">Key Guarantees</text>
  <text x="640" y="598.144868254565" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.680314373712" fill="var(--text-muted)">Exactly-once processing | No data loss | Automatic state recovery | Idempotent sinks recommended</text>
</svg>

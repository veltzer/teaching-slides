<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3826" font-weight="bold" fill="var(--text)">Checkpointing Mechanism</text>
  <rect x="72.4325" y="80.2778" width="324.3243" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.5946" y="120.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8109" font-weight="bold" fill="var(--primary-accent)">Streaming Query</text>
  <text x="234.5946" y="152.7778" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Processing micro-batches</text>
  <line x1="396.7568" y1="128.6111" x2="494.0541" y2="128.6111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445.4054" y="115.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text-faint)">write</text>
  <rect x="510.2702" y="64.1667" width="567.5675" height="257.7777" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.0541" y="104.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3349" font-weight="bold" fill="var(--warn-accent)">Checkpoint Directory</text>
  <rect x="542.7027" y="128.6111" width="227.027" height="56.3889" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="164.0555" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text)">offsets/</text>
  <rect x="542.7027" y="193.0556" width="227.027" height="56.3889" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.2162" y="228.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text)">commits/</text>
  <rect x="818.3784" y="128.6111" width="227.027" height="56.3889" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.8919" y="164.0555" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text)">state/</text>
  <rect x="818.3784" y="193.0556" width="227.027" height="56.3889" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.8919" y="228.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text)">metadata</text>
  <text x="656.2162" y="289.7223" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text-faint)">Source offsets per batch</text>
  <text x="931.8919" y="289.7223" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2391" fill="var(--text-faint)">Operator state snapshots</text>
  <text x="640" y="378.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3349" font-weight="bold" fill="var(--text)">Recovery Flow on Failure</text>
  <rect x="40" y="410.5556" width="251.3514" height="88.6111" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.8649" y="447.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--danger-accent)">1. Failure</text>
  <text x="164.8649" y="476.6111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Query crashes</text>
  <line x1="291.3514" y1="454.0555" x2="340" y2="454.0555" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="356.2162" y="410.5556" width="251.3514" height="88.6111" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="481.0811" y="447.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--warn-accent)">2. Read Checkpoint</text>
  <text x="481.0811" y="476.6111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Load last state</text>
  <line x1="607.5675" y1="454.0555" x2="656.2162" y2="454.0555" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="672.4325" y="410.5556" width="251.3514" height="88.6111" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="797.2972" y="447.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--primary-accent)">3. Replay Batch</text>
  <text x="797.2972" y="476.6111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">From last offset</text>
  <line x1="923.7837" y1="454.0555" x2="972.4325" y2="454.0555" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="988.6486" y="410.5556" width="251.3514" height="88.6111" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.5135" y="447.6112" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--ok-accent)">4. Resume</text>
  <text x="1113.5135" y="476.6111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7631" fill="var(--text-muted)">Continue processing</text>
  <rect x="72.4325" y="531.3889" width="1135.1351" height="88.6111" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="566.8334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" font-weight="bold" fill="var(--ok-accent)">Key Guarantees</text>
  <text x="640" y="599.0555" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.287" fill="var(--text-muted)">Exactly-once processing | No data loss | Automatic state recovery | Idempotent sinks recommended</text>
</svg>

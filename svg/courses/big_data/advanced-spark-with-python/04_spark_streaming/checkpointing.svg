<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow-cp" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="#333">Checkpointing Mechanism</text>
  <rect x="80" y="90" width="320" height="108" rx="12.8" fill="#e1f5fe" stroke="#0277bd" stroke-width="3.2" />
  <text x="240" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold" fill="#0277bd">Streaming Query</text>
  <text x="240" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Processing micro-batches</text>
  <line x1="400" y1="144" x2="496" y2="144" stroke="#333" stroke-width="3.2" marker-end="url(#arrow-cp)" />
  <text x="448" y="129.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888">write</text>
  <rect x="512" y="72" width="560" height="288" rx="12.8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.2" />
  <text x="792" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#ef6c00">Checkpoint Directory</text>
  <rect x="544" y="144" width="224" height="63" rx="8" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.6" />
  <text x="656" y="183.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">offsets/</text>
  <rect x="544" y="216" width="224" height="63" rx="8" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.6" />
  <text x="656" y="255.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">commits/</text>
  <rect x="816" y="144" width="224" height="63" rx="8" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.6" />
  <text x="928" y="183.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">state/</text>
  <rect x="816" y="216" width="224" height="63" rx="8" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.6" />
  <text x="928" y="255.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#333">metadata</text>
  <text x="656" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888">Source offsets per batch</text>
  <text x="928" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#888">Operator state snapshots</text>
  <text x="640" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold" fill="#333">Recovery Flow on Failure</text>
  <rect x="48" y="459" width="248" height="99" rx="9.6" fill="#ffebee" stroke="#d32f2f" stroke-width="3.2" />
  <text x="171.2" y="500.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#d32f2f">1. Failure</text>
  <text x="171.2" y="532.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Query crashes</text>
  <line x1="296" y1="507.6" x2="344" y2="507.6" stroke="#333" stroke-width="3.2" marker-end="url(#arrow-cp)" />
  <rect x="360" y="459" width="248" height="99" rx="9.6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.2" />
  <text x="483.2" y="500.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#ef6c00">2. Read Checkpoint</text>
  <text x="483.2" y="532.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Load last state</text>
  <line x1="608" y1="507.6" x2="656" y2="507.6" stroke="#333" stroke-width="3.2" marker-end="url(#arrow-cp)" />
  <rect x="672" y="459" width="248" height="99" rx="9.6" fill="#e1f5fe" stroke="#0277bd" stroke-width="3.2" />
  <text x="795.2" y="500.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#0277bd">3. Replay Batch</text>
  <text x="795.2" y="532.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">From last offset</text>
  <line x1="920" y1="507.6" x2="968" y2="507.6" stroke="#333" stroke-width="3.2" marker-end="url(#arrow-cp)" />
  <rect x="984" y="459" width="248" height="99" rx="9.6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="1107.2" y="500.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#2e7d32">4. Resume</text>
  <text x="1107.2" y="532.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#555">Continue processing</text>
  <rect x="80" y="594" width="1120" height="99" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="640" y="633.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold" fill="#2e7d32">Key Guarantees</text>
  <text x="640" y="669.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" fill="#555">Exactly-once processing | No data loss | Automatic state recovery | Idempotent sinks recommended</text>
</svg>
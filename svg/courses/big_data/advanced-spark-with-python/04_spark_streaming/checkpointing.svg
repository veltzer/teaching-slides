  <ns0:text x="605.8297" y="236.0519" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="#333">commits/</ns0:text>
  <ns0:rect x="753.5931" y="132.987" width="206.8687" height="58.1818" rx="7.3882" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.4776" />
  <ns0:text x="857.0274" y="169.5584" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7316" fill="#333">state/</ns0:text>
  <ns0:rect x="753.5931" y="199.4805" width="206.8687" height="58.1818" rx="7.3882" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1.4776" />

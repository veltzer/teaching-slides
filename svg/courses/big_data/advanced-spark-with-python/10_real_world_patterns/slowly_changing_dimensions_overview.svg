<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="33.3333" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#333">Slowly Changing Dimensions (SCD Types)</text>
  <rect x="22.8571" y="53.3333" width="1234.2857" height="193.3333" rx="6.6667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6667" />
  <text x="68.5714" y="86.6667" font-size="18.6667" font-weight="bold" fill="#4a90e2">Type 1: Overwrite (no history)</text>
  <text x="91.4286" y="117.3333" font-size="16" font-family="monospace" fill="#333">Before: customer_id=1, city="New York"</text>
  <text x="91.4286" y="144" font-size="16" font-family="monospace" fill="#333">Update: city changed to "Boston"</text>
  <text x="91.4286" y="170.6667" font-size="16" font-family="monospace" fill="#333">After:  customer_id=1, city="Boston"</text>
  <text x="91.4286" y="206.6667" font-size="14.6667" fill="#666">Use when: history not needed</text>
  <rect x="22.8571" y="260" width="1234.2857" height="253.3333" rx="6.6667" fill="#d4edda" stroke="#28a745" stroke-width="2.6667" />
  <text x="68.5714" y="293.3333" font-size="18.6667" font-weight="bold" fill="#28a745">Type 2: Add new row (full history)</text>
  <text x="91.4286" y="326.6667" font-size="16" fill="#333">Before:</text>
  <text x="114.2857" y="353.3333" font-size="16" font-family="monospace" fill="#333">id=1, city="New York", current=true</text>
  <text x="91.4286" y="386.6667" font-size="16" fill="#333">After update:</text>
  <text x="114.2857" y="413.3333" font-size="16" font-family="monospace" fill="#333">id=1, city="New York", current=false, end_date="2024-06-14"</text>
  <text x="114.2857" y="440" font-size="16" font-family="monospace" fill="#333">id=1, city="Boston", current=true, start_date="2024-06-15"</text>
  <text x="91.4286" y="480" font-size="14.6667" fill="#666">Use when: full audit trail needed</text>
  <rect x="22.8571" y="526.6667" width="1234.2857" height="180" rx="6.6667" fill="#fff3cd" stroke="#ffc107" stroke-width="2.6667" />
  <text x="68.5714" y="560" font-size="18.6667" font-weight="bold" fill="#856404">Type 3: Add new column (limited history)</text>
  <text x="91.4286" y="593.3333" font-size="16" fill="#333">Before:</text>
  <text x="114.2857" y="620" font-size="16" font-family="monospace" fill="#333">id=1, city="New York", prev_city=null</text>
  <text x="91.4286" y="650.6667" font-size="16" fill="#333">After:</text>
  <text x="114.2857" y="677.3333" font-size="16" font-family="monospace" fill="#333">id=1, city="Boston", prev_city="NY"</text>
  <text x="91.4286" y="700" font-size="14.6667" fill="#666">Use when: only previous value needed</text>
</svg>
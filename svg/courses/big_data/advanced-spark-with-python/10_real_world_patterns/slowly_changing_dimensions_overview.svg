<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="19.5227" font-weight="bold" fill="var(--text)">Slowly Changing Dimensions (SCD Types)</text>
  <rect x="40" y="57.2278" width="1200" height="166.5346" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.4444" y="85.9407" font-size="17.0824" font-weight="bold" fill="var(--primary-accent)">Type 1: Overwrite (no history)</text>
  <text x="106.6668" y="112.3565" font-size="14.6421" font-family="monospace" fill="var(--text)">Before: customer_id=1, city="New York"</text>
  <text x="106.6668" y="135.3268" font-size="14.6421" font-family="monospace" fill="var(--text)">Update: city changed to "Boston"</text>
  <text x="106.6668" y="158.2971" font-size="14.6421" font-family="monospace" fill="var(--text)">After:  customer_id=1, city="Boston"</text>
  <text x="106.6668" y="189.307" font-size="13.4219" fill="var(--text-muted)">Use when: history not needed</text>
  <rect x="40" y="235.2476" width="1200" height="218.2177" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.4444" y="263.9604" font-size="17.0824" font-weight="bold" fill="var(--ok-accent)">Type 2: Add new row (full history)</text>
  <text x="106.6668" y="292.6734" font-size="14.6421" fill="var(--text)">Before:</text>
  <text x="128.8889" y="315.6436" font-size="14.6421" font-family="monospace" fill="var(--text)">id=1, city="New York", current=true</text>
  <text x="106.6668" y="344.3565" font-size="14.6421" fill="var(--text)">After update:</text>
  <text x="128.8889" y="367.3267" font-size="14.6421" font-family="monospace" fill="var(--text)">id=1, city="New York", current=false, end_date="2024-06-14"</text>
  <text x="128.8889" y="390.297" font-size="14.6421" font-family="monospace" fill="var(--text)">id=1, city="Boston", current=true, start_date="2024-06-15"</text>
  <text x="106.6668" y="424.7525" font-size="13.4219" fill="var(--text-muted)">Use when: full audit trail needed</text>
  <rect x="40" y="464.9505" width="1200" height="155.0495" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.4444" y="493.6634" font-size="17.0824" font-weight="bold" fill="var(--danger-accent)">Type 3: Add new column (limited history)</text>
  <text x="106.6668" y="522.3762" font-size="14.6421" fill="var(--text)">Before:</text>
  <text x="128.8889" y="545.3465" font-size="14.6421" font-family="monospace" fill="var(--text)">id=1, city="New York", prev_city=null</text>
  <text x="106.6668" y="571.7624" font-size="14.6421" fill="var(--text)">After:</text>
  <text x="128.8889" y="594.7326" font-size="14.6421" font-family="monospace" fill="var(--text)">id=1, city="Boston", prev_city="NY"</text>
  <text x="106.6668" y="614.2574" font-size="13.4219" fill="var(--text-muted)">Use when: only previous value needed</text>
</svg>
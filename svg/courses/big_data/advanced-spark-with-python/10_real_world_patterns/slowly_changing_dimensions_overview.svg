<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="19.5227" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Slowly Changing Dimensions (SCD Types)</text>
  <rect x="40" y="57.2278" width="1200" height="166.5346" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.4444" y="85.9407" font-size="17.0824" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Type 1: Overwrite (no history)</text>
  <text x="106.6668" y="112.3565" font-size="14.6421" fill="var(--text)" font-family="Courier New, monospace">Before: customer_id=1, city="New York"</text>
  <text x="106.6668" y="135.3268" font-size="14.6421" fill="var(--text)" font-family="Courier New, monospace">Update: city changed to "Boston"</text>
  <text x="106.6668" y="158.2971" font-size="14.6421" fill="var(--text)" font-family="Courier New, monospace">After:  customer_id=1, city="Boston"</text>
  <text x="106.6668" y="189.307" font-size="13.4219" fill="var(--text-muted)" font-family="Arial, sans-serif">Use when: history not needed</text>
  <rect x="40" y="235.2476" width="1200" height="218.2177" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.4444" y="263.9604" font-size="17.0824" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Type 2: Add new row (full history)</text>
  <text x="106.6668" y="292.6734" font-size="14.6421" fill="var(--text)" font-family="Arial, sans-serif">Before:</text>
  <text x="128.8889" y="315.6436" font-size="14.6421" fill="var(--text)" font-family="Courier New, monospace">id=1, city="New York", current=true</text>
  <text x="106.6668" y="344.3565" font-size="14.6421" fill="var(--text)" font-family="Arial, sans-serif">After update:</text>
  <text x="128.8889" y="367.3267" font-size="14.6421" fill="var(--text)" font-family="Courier New, monospace">id=1, city="New York", current=false, end_date="2024-06-14"</text>
  <text x="128.8889" y="390.297" font-size="14.6421" fill="var(--text)" font-family="Courier New, monospace">id=1, city="Boston", current=true, start_date="2024-06-15"</text>
  <text x="106.6668" y="424.7525" font-size="13.4219" fill="var(--text-muted)" font-family="Arial, sans-serif">Use when: full audit trail needed</text>
  <rect x="40" y="464.9505" width="1200" height="155.0495" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="84.4444" y="493.6634" font-size="17.0824" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Type 3: Add new column (limited history)</text>
  <text x="106.6668" y="522.3762" font-size="14.6421" fill="var(--text)" font-family="Arial, sans-serif">Before:</text>
  <text x="128.8889" y="545.3465" font-size="14.6421" fill="var(--text)" font-family="Courier New, monospace">id=1, city="New York", prev_city=null</text>
  <text x="106.6668" y="571.7624" font-size="14.6421" fill="var(--text)" font-family="Arial, sans-serif">After:</text>
  <text x="128.8889" y="594.7326" font-size="14.6421" fill="var(--text)" font-family="Courier New, monospace">id=1, city="Boston", prev_city="NY"</text>
  <text x="106.6668" y="614.2574" font-size="13.4219" fill="var(--text-muted)" font-family="Arial, sans-serif">Use when: only previous value needed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Slowly Changing Dimensions (SCD Types)</text>
  <rect x="10" y="40" width="540" height="145" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="30" y="65" font-size="14" font-weight="bold" fill="#4a90e2">Type 1: Overwrite (no history)</text>
  <text x="40" y="88" font-size="12" font-family="monospace" fill="#333">Before: customer_id=1, city="New York"</text>
  <text x="40" y="108" font-size="12" font-family="monospace" fill="#333">Update: city changed to "Boston"</text>
  <text x="40" y="128" font-size="12" font-family="monospace" fill="#333">After:  customer_id=1, city="Boston"</text>
  <text x="40" y="155" font-size="11" fill="#666">Use when: history not needed</text>
  <rect x="10" y="195" width="540" height="190" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="30" y="220" font-size="14" font-weight="bold" fill="#28a745">Type 2: Add new row (full history)</text>
  <text x="40" y="245" font-size="12" fill="#333">Before:</text>
  <text x="50" y="265" font-size="12" font-family="monospace" fill="#333">id=1, city="New York", current=true</text>
  <text x="40" y="290" font-size="12" fill="#333">After update:</text>
  <text x="50" y="310" font-size="12" font-family="monospace" fill="#333">id=1, city="New York", current=false, end_date="2024-06-14"</text>
  <text x="50" y="330" font-size="12" font-family="monospace" fill="#333">id=1, city="Boston", current=true, start_date="2024-06-15"</text>
  <text x="40" y="360" font-size="11" fill="#666">Use when: full audit trail needed</text>
  <rect x="10" y="395" width="540" height="135" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="30" y="420" font-size="14" font-weight="bold" fill="#856404">Type 3: Add new column (limited history)</text>
  <text x="40" y="445" font-size="12" fill="#333">Before:</text>
  <text x="50" y="465" font-size="12" font-family="monospace" fill="#333">id=1, city="New York", prev_city=null</text>
  <text x="40" y="488" font-size="12" fill="#333">After:</text>
  <text x="50" y="508" font-size="12" font-family="monospace" fill="#333">id=1, city="Boston", prev_city="NY"</text>
  <text x="40" y="525" font-size="11" fill="#666">Use when: only previous value needed</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="579.6226" y="30.1886" text-anchor="middle" font-size="19.3207" font-weight="bold" fill="#333">Slowly Changing Dimensions (SCD Types)</ns0:text>
  <ns0:rect x="20.7008" y="48.3019" width="1117.8436" height="175.0943" rx="6.0378" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4151" />
  <ns0:text x="62.1024" y="78.4906" font-size="16.9057" font-weight="bold" fill="#4a90e2">Type 1: Overwrite (no history)</ns0:text>
  <ns0:text x="82.8033" y="106.2641" font-size="14.4906" font-family="monospace" fill="#333">Before: customer_id=1, city="New York"</ns0:text>
  <ns0:text x="82.8033" y="130.4151" font-size="14.4906" font-family="monospace" fill="#333">Update: city changed to "Boston"</ns0:text>
  <ns0:text x="82.8033" y="154.5661" font-size="14.4906" font-family="monospace" fill="#333">After:  customer_id=1, city="Boston"</ns0:text>
  <ns0:text x="82.8033" y="187.1698" font-size="13.283" fill="#666">Use when: history not needed</ns0:text>
  <ns0:rect x="20.7008" y="235.4717" width="1117.8436" height="229.4339" rx="6.0378" fill="#d4edda" stroke="#28a745" stroke-width="2.4151" />
  <ns0:text x="62.1024" y="265.6603" font-size="16.9057" font-weight="bold" fill="#28a745">Type 2: Add new row (full history)</ns0:text>
  <ns0:text x="82.8033" y="295.8491" font-size="14.4906" fill="#333">Before:</ns0:text>
  <ns0:text x="103.504" y="320" font-size="14.4906" font-family="monospace" fill="#333">id=1, city="New York", current=true</ns0:text>
  <ns0:text x="82.8033" y="350.1887" font-size="14.4906" fill="#333">After update:</ns0:text>
  <ns0:text x="103.504" y="374.3396" font-size="14.4906" font-family="monospace" fill="#333">id=1, city="New York", current=false, end_date="2024-06-14"</ns0:text>
  <ns0:text x="103.504" y="398.4905" font-size="14.4906" font-family="monospace" fill="#333">id=1, city="Boston", current=true, start_date="2024-06-15"</ns0:text>
  <ns0:text x="82.8033" y="434.717" font-size="13.283" fill="#666">Use when: full audit trail needed</ns0:text>
  <ns0:rect x="20.7008" y="476.9811" width="1117.8436" height="163.0189" rx="6.0378" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4151" />
  <ns0:text x="62.1024" y="507.1698" font-size="16.9057" font-weight="bold" fill="#856404">Type 3: Add new column (limited history)</ns0:text>
  <ns0:text x="82.8033" y="537.3584" font-size="14.4906" fill="#333">Before:</ns0:text>
  <ns0:text x="103.504" y="561.5094" font-size="14.4906" font-family="monospace" fill="#333">id=1, city="New York", prev_city=null</ns0:text>
  <ns0:text x="82.8033" y="589.283" font-size="14.4906" fill="#333">After:</ns0:text>
  <ns0:text x="103.504" y="613.4339" font-size="14.4906" font-family="monospace" fill="#333">id=1, city="Boston", prev_city="NY"</ns0:text>
  <ns0:text x="82.8033" y="633.9622" font-size="13.283" fill="#666">Use when: only previous value needed</ns0:text>
</ns0:svg>
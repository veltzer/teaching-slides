<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="20.7158" y="12.5491" width="1118.6554" height="627.4509" rx="6.2745" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="50.1961" text-anchor="middle" font-size="20.0784" font-weight="bold" fill="#4a90e2">Schema Evolution Decision Tree</ns0:text>
  <ns0:text x="62.1475" y="85.3333" font-size="17.5686" font-weight="bold" fill="#333">Is the change backward-compatible?</ns0:text>
  <ns0:rect x="62.1475" y="100.3921" width="1035.792" height="69.0196" rx="6.2745" fill="#d4edda" stroke="#28a745" stroke-width="1.8823" />
  <ns0:text x="93.2212" y="125.4902" font-size="16.3137" font-weight="bold" fill="#28a745">Adding a new column?</ns0:text>
  <ns0:text x="93.2212" y="150.5882" font-size="15.0588" fill="#333">Yes → Use mergeSchema (safe)</ns0:text>
  <ns0:rect x="62.1475" y="181.9607" width="1035.792" height="81.5686" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="1.8823" />
  <ns0:text x="93.2212" y="207.0588" font-size="16.3137" font-weight="bold" fill="#856404">Renaming a column?</ns0:text>
  <ns0:text x="93.2212" y="232.1568" font-size="15.0588" fill="#333">Yes → Add new column + backfill + drop old</ns0:text>
  <ns0:text x="93.2212" y="250.9804" font-size="13.8039" fill="#333">(never rename in-place)</ns0:text>
  <ns0:rect x="62.1475" y="276.0784" width="1035.792" height="81.5686" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8823" />
  <ns0:text x="93.2212" y="301.1765" font-size="16.3137" font-weight="bold" fill="#4a90e2">Changing column type?</ns0:text>
  <ns0:text x="93.2212" y="326.2745" font-size="15.0588" fill="#333">Widening (int→long): mergeSchema</ns0:text>
  <ns0:text x="93.2212" y="348.8627" font-size="15.0588" fill="#333">Narrowing (long→int): overwrite</ns0:text>
  <ns0:rect x="62.1475" y="370.196" width="1035.792" height="81.5686" rx="6.2745" fill="#f8d7da" stroke="#dc3545" stroke-width="1.8823" />
  <ns0:text x="93.2212" y="395.294" font-size="16.3137" font-weight="bold" fill="#dc3545">Removing a column?</ns0:text>
  <ns0:text x="93.2212" y="420.3922" font-size="15.0588" fill="#333">Yes → Drop column + rewrite</ns0:text>
  <ns0:text x="93.2212" y="439.2157" font-size="13.8039" fill="#333">(consumers may break)</ns0:text>
  <ns0:rect x="62.1475" y="476.8627" width="1035.792" height="62.7451" rx="6.2745" fill="#d4edda" stroke="#28a745" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="508.2352" text-anchor="middle" font-size="16.3137" font-weight="bold" fill="#28a745">Best practice: version your schemas</ns0:text>
  <ns0:text x="580.0435" y="529.5686" text-anchor="middle" font-size="15.0588" fill="#333">and validate before processing.</ns0:text>
</ns0:svg>
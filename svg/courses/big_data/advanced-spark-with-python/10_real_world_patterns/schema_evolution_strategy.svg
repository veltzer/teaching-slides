<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="74.8" text-anchor="middle" font-size="19.9938" font-weight="bold" fill="var(--primary-accent)">Schema Evolution Decision Tree</text>
  <text x="84.4445" y="107.2799" font-size="17.4946" font-weight="bold" fill="var(--text)">Is the change backward-compatible?</text>
  <rect x="84.4445" y="121.1999" width="1111.1111" height="63.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="117.7777" y="144.3999" font-size="16.245" font-weight="bold" fill="var(--ok-accent)">Adding a new column?</text>
  <text x="117.7777" y="167.5999" font-size="14.9954" fill="var(--text)">Yes → Use mergeSchema (safe)</text>
  <rect x="84.4445" y="196.5999" width="1111.1111" height="75.4" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="117.7777" y="219.7999" font-size="16.245" font-weight="bold" fill="var(--danger-accent)">Renaming a column?</text>
  <text x="117.7777" y="242.9999" font-size="14.9954" fill="var(--text)">Yes → Add new column + backfill + drop old</text>
  <text x="117.7777" y="260.4" font-size="13.7457" fill="var(--text)">(never rename in-place)</text>
  <rect x="84.4445" y="283.5999" width="1111.1111" height="75.4" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="117.7777" y="306.8" font-size="16.245" font-weight="bold" fill="var(--primary-accent)">Changing column type?</text>
  <text x="117.7777" y="330" font-size="14.9954" fill="var(--text)">Widening (int→long): mergeSchema</text>
  <text x="117.7777" y="350.8799" font-size="14.9954" fill="var(--text)">Narrowing (long→int): overwrite</text>
  <rect x="84.4445" y="370.5999" width="1111.1111" height="75.4" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="117.7777" y="393.7999" font-size="16.245" font-weight="bold" fill="var(--danger-accent)">Removing a column?</text>
  <text x="117.7777" y="417" font-size="14.9954" fill="var(--text)">Yes → Drop column + rewrite</text>
  <text x="117.7777" y="434.4" font-size="13.7457" fill="var(--text)">(consumers may break)</text>
  <rect x="84.4445" y="469.1999" width="1111.1111" height="58" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="498.1999" text-anchor="middle" font-size="16.245" font-weight="bold" fill="var(--ok-accent)">Best practice: version your schemas</text>
  <text x="640" y="517.92" text-anchor="middle" font-size="14.9954" fill="var(--text)">and validate before processing.</text>
</svg>
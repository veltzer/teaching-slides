<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="540" height="500" rx="5" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2"/>
  <text x="280" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">Schema Evolution Decision Tree</text>
  <text x="30" y="68" font-size="14" font-weight="bold" fill="#333">Is the change backward-compatible?</text>
  <rect x="30" y="80" width="500" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="45" y="100" font-size="13" font-weight="bold" fill="#28a745">Adding a new column?</text>
  <text x="45" y="120" font-size="12" fill="#333">Yes &#x2192; Use mergeSchema (safe)</text>
  <rect x="30" y="145" width="500" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="45" y="165" font-size="13" font-weight="bold" fill="#856404">Renaming a column?</text>
  <text x="45" y="185" font-size="12" fill="#333">Yes &#x2192; Add new column + backfill + drop old</text>
  <text x="45" y="200" font-size="11" fill="#333">(never rename in-place)</text>
  <rect x="30" y="220" width="500" height="65" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="45" y="240" font-size="13" font-weight="bold" fill="#4a90e2">Changing column type?</text>
  <text x="45" y="260" font-size="12" fill="#333">Widening (int&#x2192;long): mergeSchema</text>
  <text x="45" y="278" font-size="12" fill="#333">Narrowing (long&#x2192;int): overwrite</text>
  <rect x="30" y="295" width="500" height="65" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="45" y="315" font-size="13" font-weight="bold" fill="#dc3545">Removing a column?</text>
  <text x="45" y="335" font-size="12" fill="#333">Yes &#x2192; Drop column + rewrite</text>
  <text x="45" y="350" font-size="11" fill="#333">(consumers may break)</text>
  <rect x="30" y="380" width="500" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="280" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Best practice: version your schemas</text>
  <text x="280" y="422" text-anchor="middle" font-size="12" fill="#333">and validate before processing.</text>
</svg>

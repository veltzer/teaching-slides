<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="20.7158" y="12.5491" width="1118.6554" height="627.4509" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="580.0435" y="50.1961" text-anchor="middle" font-size="20.0784" font-weight="bold" fill="var(--primary-accent)">Schema Evolution Decision Tree</text>
  <text x="62.1475" y="85.3333" font-size="17.5686" font-weight="bold" fill="var(--text)">Is the change backward-compatible?</text>
  <rect x="62.1475" y="100.3921" width="1035.792" height="69.0196" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="93.2212" y="125.4902" font-size="16.3137" font-weight="bold" fill="var(--ok-accent)">Adding a new column?</text>
  <text x="93.2212" y="150.5882" font-size="15.0588" fill="var(--text)">Yes → Use mergeSchema (safe)</text>
  <rect x="62.1475" y="181.9607" width="1035.792" height="81.5686" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="93.2212" y="207.0588" font-size="16.3137" font-weight="bold" fill="var(--danger-accent)">Renaming a column?</text>
  <text x="93.2212" y="232.1568" font-size="15.0588" fill="var(--text)">Yes → Add new column + backfill + drop old</text>
  <text x="93.2212" y="250.9804" font-size="13.8039" fill="var(--text)">(never rename in-place)</text>
  <rect x="62.1475" y="276.0784" width="1035.792" height="81.5686" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="93.2212" y="301.1765" font-size="16.3137" font-weight="bold" fill="var(--primary-accent)">Changing column type?</text>
  <text x="93.2212" y="326.2745" font-size="15.0588" fill="var(--text)">Widening (int→long): mergeSchema</text>
  <text x="93.2212" y="348.8627" font-size="15.0588" fill="var(--text)">Narrowing (long→int): overwrite</text>
  <rect x="62.1475" y="370.196" width="1035.792" height="81.5686" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="93.2212" y="395.294" font-size="16.3137" font-weight="bold" fill="var(--danger-accent)">Removing a column?</text>
  <text x="93.2212" y="420.3922" font-size="15.0588" fill="var(--text)">Yes → Drop column + rewrite</text>
  <text x="93.2212" y="439.2157" font-size="13.8039" fill="var(--text)">(consumers may break)</text>
  <rect x="62.1475" y="476.8627" width="1035.792" height="62.7451" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="580.0435" y="508.2352" text-anchor="middle" font-size="16.3137" font-weight="bold" fill="var(--ok-accent)">Best practice: version your schemas</text>
  <text x="580.0435" y="529.5686" text-anchor="middle" font-size="15.0588" fill="var(--text)">and validate before processing.</text>
</svg>
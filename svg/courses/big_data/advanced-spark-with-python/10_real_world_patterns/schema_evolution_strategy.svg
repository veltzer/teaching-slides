<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="22.8571" y="13.8462" width="1234.2857" height="692.3077" rx="6.9231" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="55.3846" text-anchor="middle" font-size="22.1538" font-weight="bold" fill="#4a90e2">Schema Evolution Decision Tree</text>
  <text x="68.5714" y="94.1538" font-size="19.3846" font-weight="bold" fill="#333">Is the change backward-compatible?</text>
  <rect x="68.5714" y="110.7692" width="1142.8571" height="76.1538" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.0769" />
  <text x="102.8571" y="138.4615" font-size="18" font-weight="bold" fill="#28a745">Adding a new column?</text>
  <text x="102.8571" y="166.1538" font-size="16.6154" fill="#333">Yes → Use mergeSchema (safe)</text>
  <rect x="68.5714" y="200.7692" width="1142.8571" height="90" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0769" />
  <text x="102.8571" y="228.4615" font-size="18" font-weight="bold" fill="#856404">Renaming a column?</text>
  <text x="102.8571" y="256.1538" font-size="16.6154" fill="#333">Yes → Add new column + backfill + drop old</text>
  <text x="102.8571" y="276.9231" font-size="15.2308" fill="#333">(never rename in-place)</text>
  <rect x="68.5714" y="304.6154" width="1142.8571" height="90" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.0769" />
  <text x="102.8571" y="332.3077" font-size="18" font-weight="bold" fill="#4a90e2">Changing column type?</text>
  <text x="102.8571" y="360" font-size="16.6154" fill="#333">Widening (int→long): mergeSchema</text>
  <text x="102.8571" y="384.9231" font-size="16.6154" fill="#333">Narrowing (long→int): overwrite</text>
  <rect x="68.5714" y="408.4615" width="1142.8571" height="90" rx="6.9231" fill="#f8d7da" stroke="#dc3545" stroke-width="2.0769" />
  <text x="102.8571" y="436.1538" font-size="18" font-weight="bold" fill="#dc3545">Removing a column?</text>
  <text x="102.8571" y="463.8462" font-size="16.6154" fill="#333">Yes → Drop column + rewrite</text>
  <text x="102.8571" y="484.6154" font-size="15.2308" fill="#333">(consumers may break)</text>
  <rect x="68.5714" y="526.1538" width="1142.8571" height="69.2308" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.7692" />
  <text x="640" y="560.7692" text-anchor="middle" font-size="18" font-weight="bold" fill="#28a745">Best practice: version your schemas</text>
  <text x="640" y="584.3077" text-anchor="middle" font-size="16.6154" fill="#333">and validate before processing.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="21.367150331398" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Is the change backward-compatible?</text>
  <rect x="40" y="59.226518497757" width="1200" height="88.121547154772" rx="7.328141844333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="91.270718148713" font-size="19.840943249498" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Adding a new column?</text>
  <text x="75.999856" y="123.314916722322" font-size="18.314735129643" fill="var(--text)" font-family="Arial, sans-serif">Yes → Use mergeSchema (safe)</text>
  <rect x="40" y="163.370164939334" width="1200" height="104.143646441577" rx="7.328141844333" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="195.41436459029" font-size="19.840943249498" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Renaming a column?</text>
  <text x="75.999856" y="227.458563163899" font-size="18.314735129643" fill="var(--text)" font-family="Arial, sans-serif">Yes → Add new column + backfill + drop old</text>
  <text x="75.999856" y="251.491851071976" font-size="16.788405569209" fill="var(--text)" font-family="Arial, sans-serif">(never rename in-place)</text>
  <rect x="40" y="283.535911745063" width="1200" height="104.143646441577" rx="7.328141844333" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="315.580248219194" font-size="19.840943249498" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Changing column type?</text>
  <text x="75.999856" y="347.62444787015" font-size="18.314735129643" fill="var(--text)" font-family="Arial, sans-serif">Widening (int→long): mergeSchema</text>
  <text x="75.999856" y="376.464088254937" font-size="18.314735129643" fill="var(--text)" font-family="Arial, sans-serif">Narrowing (long→int): overwrite</text>
  <rect x="40" y="403.701657473444" width="1200" height="104.143646441577" rx="7.328141844333" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="435.745856047053" font-size="19.840943249498" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Removing a column?</text>
  <text x="75.999856" y="467.790193598532" font-size="18.314735129643" fill="var(--text)" font-family="Arial, sans-serif">Yes → Drop column + rewrite</text>
  <text x="75.999856" y="491.823342528738" font-size="16.788405569209" fill="var(--text)" font-family="Arial, sans-serif">(consumers may break)</text>
  <rect x="40" y="539.88950248863" width="1200" height="80.11049751137" rx="7.328141844333" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999946" y="579.944751782989" text-anchor="middle" font-size="19.840943249498" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Best practice: version your schemas</text>
  <text x="639.999946" y="607.182458902018" text-anchor="middle" font-size="18.314735129643" fill="var(--text)" font-family="Arial, sans-serif">and validate before processing.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="23.320665416469" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Exactly-Once Guarantee Flow (Micro-batch N)</text>
  <rect x="40" y="66.976666306121" width="1200" height="74.185999783673" rx="6.723785457145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499957812505" y="93.953555868028" font-size="18.947963607506" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 1: Read offsets from checkpoint</text>
  <text x="77.499957812505" y="120.93022217415" font-size="17.490471046579" fill="var(--text)" font-family="Arial, sans-serif">Last committed: topic=events, partition=0, offset=1000</text>
  <line x1="640" y1="141.162777717687" x2="640" y2="168.139555651701" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="168.139555651701" width="1200" height="74.185999783673" rx="6.723785457145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499957812505" y="195.116333585715" font-size="18.947963607506" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 2: Fetch data from source</text>
  <text x="77.499957812505" y="222.092999891836" font-size="17.490471046579" fill="var(--text)" font-family="Arial, sans-serif">Read offsets 1001-1500 from Kafka</text>
  <line x1="640" y1="242.325555435374" x2="640" y2="269.302333369388" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="269.302333369388" width="1200" height="74.185999783673" rx="6.723785457145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499957812505" y="296.279111303402" font-size="18.947963607506" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 3: Process and write to sink</text>
  <text x="77.499957812505" y="323.255777609523" font-size="17.490471046579" fill="var(--text)" font-family="Arial, sans-serif">Write 500 records to Delta Lake</text>
  <line x1="640" y1="343.488333153061" x2="640" y2="370.465111087075" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="370.465111087075" width="1200" height="74.185999783673" rx="6.723785457145" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499957812505" y="397.441777393196" font-size="18.947963607506" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 4: Commit offsets to checkpoint</text>
  <text x="77.499957812505" y="424.41855532721" font-size="17.490471046579" fill="var(--text)" font-family="Arial, sans-serif">Update: offset=1500 (atomic)</text>
  <rect x="40" y="471.627888804762" width="1200" height="148.372111195238" rx="6.723785457145" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="77.499957812505" y="505.34877750136" font-size="17.490471046579" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Failure Recovery:</text>
  <text x="77.499957812505" y="532.325555435374" font-size="17.490471046579" fill="var(--text)" font-family="Arial, sans-serif">• If failure at Step 3: restart replays from 1001</text>
  <text x="77.499957812505" y="559.302221741495" font-size="17.490471046579" fill="var(--text)" font-family="Arial, sans-serif">• If failure at Step 4: restart replays from 1001</text>
  <text x="77.499957812505" y="586.278999675509" font-size="17.490471046579" fill="var(--text)" font-family="Arial, sans-serif">• Idempotent sink prevents duplicates</text>
</svg>

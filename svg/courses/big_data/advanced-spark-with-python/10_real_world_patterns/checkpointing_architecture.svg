<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="76.25" text-anchor="middle" font-size="20.8103" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Exactly-Once Guarantee Flow (Micro-batch N)</text>
  <rect x="106.6667" y="100.4166" width="1066.6668" height="66.4583" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="124.5834" font-size="16.9083" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 1: Read offsets from checkpoint</text>
  <text x="140" y="148.75" font-size="15.6077" fill="var(--text)" font-family="Arial, sans-serif">Last committed: topic=events, partition=0, offset=1000</text>
  <line x1="640.0001" y1="166.875" x2="640.0001" y2="191.0417" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="106.6667" y="191.0417" width="1066.6668" height="66.4583" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="215.2084" font-size="16.9083" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 2: Fetch data from source</text>
  <text x="140" y="239.375" font-size="15.6077" fill="var(--text)" font-family="Arial, sans-serif">Read offsets 1001-1500 from Kafka</text>
  <line x1="640.0001" y1="257.5" x2="640.0001" y2="281.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="106.6667" y="281.6667" width="1066.6668" height="66.4583" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="305.8334" font-size="16.9083" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 3: Process and write to sink</text>
  <text x="140" y="330" font-size="15.6077" fill="var(--text)" font-family="Arial, sans-serif">Write 500 records to Delta Lake</text>
  <line x1="640.0001" y1="348.125" x2="640.0001" y2="372.2917" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="106.6667" y="372.2917" width="1066.6668" height="66.4583" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="396.4583" font-size="16.9083" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Step 4: Commit offsets to checkpoint</text>
  <text x="140" y="420.625" font-size="15.6077" fill="var(--text)" font-family="Arial, sans-serif">Update: offset=1500 (atomic)</text>
  <rect x="106.6667" y="462.9167" width="1066.6668" height="132.9167" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="493.125" font-size="15.6077" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Failure Recovery:</text>
  <text x="140" y="517.2917" font-size="15.6077" fill="var(--text)" font-family="Arial, sans-serif">• If failure at Step 3: restart replays from 1001</text>
  <text x="140" y="541.4583" font-size="15.6077" fill="var(--text)" font-family="Arial, sans-serif">• If failure at Step 4: restart replays from 1001</text>
  <text x="140" y="565.625" font-size="15.6077" fill="var(--text)" font-family="Arial, sans-serif">• Idempotent sink prevents duplicates</text>
</svg>

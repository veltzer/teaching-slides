<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="20.7321" y="13.0612" width="1119.5335" height="626.9388" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.4989" y="52.2449" text-anchor="middle" font-size="20.898" font-weight="bold" fill="var(--primary-accent)">Exactly-Once Guarantee Flow (Micro-batch N)</text>
  <rect x="82.9284" y="78.3673" width="995.141" height="71.8367" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="114.0266" y="104.4898" font-size="16.9796" font-weight="bold" fill="var(--ok-accent)">Step 1: Read offsets from checkpoint</text>
  <text x="114.0266" y="130.6122" font-size="15.6735" fill="var(--text)">Last committed: topic=events, partition=0, offset=1000</text>
  <line x1="580.4989" y1="150.2041" x2="580.4989" y2="176.3265" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="82.9284" y="176.3265" width="995.141" height="71.8367" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="114.0266" y="202.449" font-size="16.9796" font-weight="bold" fill="var(--ok-accent)">Step 2: Fetch data from source</text>
  <text x="114.0266" y="228.5714" font-size="15.6735" fill="var(--text)">Read offsets 1001-1500 from Kafka</text>
  <line x1="580.4989" y1="248.1633" x2="580.4989" y2="274.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="82.9284" y="274.2857" width="995.141" height="71.8367" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="114.0266" y="300.4082" font-size="16.9796" font-weight="bold" fill="var(--ok-accent)">Step 3: Process and write to sink</text>
  <text x="114.0266" y="326.5306" font-size="15.6735" fill="var(--text)">Write 500 records to Delta Lake</text>
  <line x1="580.4989" y1="346.1224" x2="580.4989" y2="372.2449" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="82.9284" y="372.2449" width="995.141" height="71.8367" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="114.0266" y="398.3673" font-size="16.9796" font-weight="bold" fill="var(--ok-accent)">Step 4: Commit offsets to checkpoint</text>
  <text x="114.0266" y="424.4898" font-size="15.6735" fill="var(--text)">Update: offset=1500 (atomic)</text>
  <rect x="82.9284" y="470.2041" width="995.141" height="143.6735" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="114.0266" y="502.8571" font-size="15.6735" font-weight="bold" fill="var(--danger-accent)">Failure Recovery:</text>
  <text x="114.0266" y="528.9796" font-size="15.6735" fill="var(--text)">• If failure at Step 3: restart replays from 1001</text>
  <text x="114.0266" y="555.102" font-size="15.6735" fill="var(--text)">• If failure at Step 4: restart replays from 1001</text>
  <text x="114.0266" y="581.2245" font-size="15.6735" fill="var(--text)">• Idempotent sink prevents duplicates</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999944" y="40" text-anchor="middle" font-size="22.610732" font-weight="bold" fill="var(--text)">CDC Architecture</text>
  <rect x="40" y="79.999984" width="299.999972" height="66.666791" rx="6.725381" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="189.99993" y="119.999969" text-anchor="middle" font-size="18.371164" fill="var(--text)">Postgres</text>
  <text x="189.99993" y="139.999849" text-anchor="middle" font-size="14.131708" fill="var(--text-muted)">(source)</text>
  <line x1="339.999972" y1="113.333267" x2="455.3845" y2="113.333267" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="455.3845" y="79.999984" width="323.076945" height="66.666791" rx="6.725381" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616.923083" y="119.999969" text-anchor="middle" font-size="18.371164" fill="var(--text)">Debezium</text>
  <line x1="778.461444" y1="113.333267" x2="893.846195" y2="113.333267" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="893.846195" y="79.999984" width="323.076945" height="66.666791" rx="6.725381" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055.384667" y="119.999969" text-anchor="middle" font-size="18.371164" fill="var(--text)">Kafka Topic</text>
  <text x="40" y="186.666647" font-size="16.957937" fill="var(--text-muted)">Debezium reads the WAL (Write-Ahead Log)</text>
  <text x="40" y="206.666639" font-size="16.957937" fill="var(--text-muted)">and emits change events:</text>
  <line x1="1055.384667" y1="146.66655" x2="1055.384667" y2="233.333221" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="233.333221" width="1200" height="266.666601" rx="6.725381" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153722" y="266.666616" font-size="18.371164" font-weight="bold" fill="var(--danger-accent)">Change Event Structure:</text>
  <text x="86.153722" y="297.333286" font-size="16.957937" font-family="monospace" fill="var(--text)">{</text>
  <text x="132.307667" y="323.999867" font-size="16.957937" font-family="monospace" fill="var(--text)">"op": "c|u|d|r",</text>
  <text x="132.307667" y="350.666561" font-size="16.957937" font-family="monospace" fill="var(--text)">"before": { old row data },</text>
  <text x="132.307667" y="377.333255" font-size="16.957937" font-family="monospace" fill="var(--text)">"after":  { new row data },</text>
  <text x="132.307667" y="403.999836" font-size="16.957937" font-family="monospace" fill="var(--text)">"source": { table, lsn, ts },</text>
  <text x="132.307667" y="430.66653" font-size="16.957937" font-family="monospace" fill="var(--text)">"ts_ms": 1718460000000</text>
  <text x="86.153722" y="457.333111" font-size="16.957937" font-family="monospace" fill="var(--text)">}</text>
  <text x="86.153722" y="486.666531" font-size="15.544822" fill="var(--text-muted)">op: c=create, u=update, d=delete, r=read (snapshot)</text>
  <line x1="639.999944" y1="499.999821" x2="639.999944" y2="553.333209" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="132.307667" y="553.333209" width="1015.384667" height="66.666791" rx="6.725381" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999944" y="586.666492" text-anchor="middle" font-size="18.371164" fill="var(--text)">Spark Structured Streaming</text>
  <text x="639.999944" y="609.33321" text-anchor="middle" font-size="15.544822" fill="var(--text-muted)">Apply changes to Delta Lake</text>
</svg>
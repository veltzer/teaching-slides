<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="20.172" font-weight="bold" fill="var(--text)">CDC Architecture</text>
  <rect x="40" y="51.8367" width="1200" height="568.1633" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="102.0691" y="75.5102" width="268.9655" height="59.1838" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="236.5518" y="111.0204" text-anchor="middle" font-size="16.3897" fill="var(--text)">Postgres</text>
  <text x="236.5518" y="128.7754" text-anchor="middle" font-size="12.6075" fill="var(--text-muted)">(source)</text>
  <line x1="371.0346" y1="105.102" x2="474.4828" y2="105.102" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="474.4828" y="75.5102" width="289.6552" height="59.1838" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="619.3105" y="111.0204" text-anchor="middle" font-size="16.3897" fill="var(--text)">Debezium</text>
  <line x1="764.138" y1="105.102" x2="867.5864" y2="105.102" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="867.5864" y="75.5102" width="289.6552" height="59.1838" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1012.414" y="111.0204" text-anchor="middle" font-size="16.3897" fill="var(--text)">Kafka Topic</text>
  <text x="102.0691" y="170.2041" font-size="15.1289" fill="var(--text-muted)">Debezium reads the WAL (Write-Ahead Log)</text>
  <text x="102.0691" y="187.9592" font-size="15.1289" fill="var(--text-muted)">and emits change events:</text>
  <line x1="1012.414" y1="134.6938" x2="1012.414" y2="211.6326" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="102.0691" y="211.6326" width="1075.8621" height="236.7347" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="143.4483" y="241.2245" font-size="16.3897" font-weight="bold" fill="var(--danger-accent)">Change Event Structure:</text>
  <text x="143.4483" y="268.449" font-size="15.1289" font-family="monospace" fill="var(--text)">{</text>
  <text x="184.8277" y="292.1224" font-size="15.1289" font-family="monospace" fill="var(--text)">"op": "c|u|d|r",</text>
  <text x="184.8277" y="315.7959" font-size="15.1289" font-family="monospace" fill="var(--text)">"before": { old row data },</text>
  <text x="184.8277" y="339.4694" font-size="15.1289" font-family="monospace" fill="var(--text)">"after":  { new row data },</text>
  <text x="184.8277" y="363.1428" font-size="15.1289" font-family="monospace" fill="var(--text)">"source": { table, lsn, ts },</text>
  <text x="184.8277" y="386.8163" font-size="15.1289" font-family="monospace" fill="var(--text)">"ts_ms": 1718460000000</text>
  <text x="143.4483" y="410.4897" font-size="15.1289" font-family="monospace" fill="var(--text)">}</text>
  <text x="143.4483" y="436.5306" font-size="13.8682" fill="var(--text-muted)">op: c=create, u=update, d=delete, r=read (snapshot)</text>
  <line x1="640.0001" y1="448.3673" x2="640.0001" y2="495.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="184.8277" y="495.7143" width="910.3449" height="59.1838" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="525.3061" text-anchor="middle" font-size="16.3897" fill="var(--text)">Spark Structured Streaming</text>
  <text x="640.0001" y="545.4286" text-anchor="middle" font-size="13.8682" fill="var(--text-muted)">Apply changes to Delta Lake</text>
</svg>
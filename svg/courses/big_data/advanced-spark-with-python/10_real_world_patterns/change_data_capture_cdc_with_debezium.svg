<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999944" y="40" text-anchor="middle" font-size="22.610732" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CDC Architecture</text>
  <rect x="40" y="79.999984" width="299.999972" height="66.666791" rx="6.725381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="189.99993" y="119.999969" text-anchor="middle" font-size="18.371164" fill="var(--text)" font-family="Arial, sans-serif">Postgres</text>
  <text x="189.99993" y="139.999849" text-anchor="middle" font-size="14.131708" fill="var(--text-muted)" font-family="Arial, sans-serif">(source)</text>
  <line x1="339.999972" y1="113.333267" x2="455.3845" y2="113.333267" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="455.3845" y="79.999984" width="323.076945" height="66.666791" rx="6.725381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616.923083" y="119.999969" text-anchor="middle" font-size="18.371164" fill="var(--text)" font-family="Arial, sans-serif">Debezium</text>
  <line x1="778.461444" y1="113.333267" x2="893.846195" y2="113.333267" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="893.846195" y="79.999984" width="323.076945" height="66.666791" rx="6.725381" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055.384667" y="119.999969" text-anchor="middle" font-size="18.371164" fill="var(--text)" font-family="Arial, sans-serif">Kafka Topic</text>
  <text x="40" y="186.666647" font-size="16.957937" fill="var(--text-muted)" font-family="Arial, sans-serif">Debezium reads the WAL (Write-Ahead Log)</text>
  <text x="40" y="206.666639" font-size="16.957937" fill="var(--text-muted)" font-family="Arial, sans-serif">and emits change events:</text>
  <line x1="1055.384667" y1="146.66655" x2="1055.384667" y2="233.333221" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="233.333221" width="1200" height="266.666601" rx="6.725381" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153722" y="266.666616" font-size="18.371164" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Change Event Structure:</text>
  <text x="86.153722" y="297.333286" font-size="16.957937" fill="var(--text)" font-family="Courier New, monospace">{</text>
  <text x="132.307667" y="323.999867" font-size="16.957937" fill="var(--text)" font-family="Courier New, monospace">"op": "c|u|d|r",</text>
  <text x="132.307667" y="350.666561" font-size="16.957937" fill="var(--text)" font-family="Courier New, monospace">"before": { old row data },</text>
  <text x="132.307667" y="377.333255" font-size="16.957937" fill="var(--text)" font-family="Courier New, monospace">"after":  { new row data },</text>
  <text x="132.307667" y="403.999836" font-size="16.957937" fill="var(--text)" font-family="Courier New, monospace">"source": { table, lsn, ts },</text>
  <text x="132.307667" y="430.66653" font-size="16.957937" fill="var(--text)" font-family="Courier New, monospace">"ts_ms": 1718460000000</text>
  <text x="86.153722" y="457.333111" font-size="16.957937" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="86.153722" y="486.666531" font-size="15.544822" fill="var(--text-muted)" font-family="Arial, sans-serif">op: c=create, u=update, d=delete, r=read (snapshot)</text>
  <line x1="639.999944" y1="499.999821" x2="639.999944" y2="553.333209" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="132.307667" y="553.333209" width="1015.384667" height="66.666791" rx="6.725381" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999944" y="586.666492" text-anchor="middle" font-size="18.371164" fill="var(--text)" font-family="Arial, sans-serif">Spark Structured Streaming</text>
  <text x="639.999944" y="609.33321" text-anchor="middle" font-size="15.544822" fill="var(--text-muted)" font-family="Arial, sans-serif">Apply changes to Delta Lake</text>
</svg>

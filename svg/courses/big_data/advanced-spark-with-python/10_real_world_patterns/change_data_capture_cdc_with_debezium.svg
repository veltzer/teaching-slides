<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Arial, sans-serif">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a90e2"/></marker></defs>
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">CDC Architecture</text>
  <rect x="10" y="35" width="580" height="480" rx="5" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2"/>
  <rect x="40" y="55" width="130" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="105" y="85" text-anchor="middle" font-size="13" fill="#333">Postgres</text>
  <text x="105" y="100" text-anchor="middle" font-size="10" fill="#666">(source)</text>
  <line x1="170" y1="80" x2="220" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="220" y="55" width="140" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="290" y="85" text-anchor="middle" font-size="13" fill="#333">Debezium</text>
  <line x1="360" y1="80" x2="410" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="410" y="55" width="140" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="480" y="85" text-anchor="middle" font-size="13" fill="#333">Kafka Topic</text>
  <text x="40" y="135" font-size="12" fill="#555">Debezium reads the WAL (Write-Ahead Log)</text>
  <text x="40" y="150" font-size="12" fill="#555">and emits change events:</text>
  <line x1="480" y1="105" x2="480" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="170" width="520" height="200" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="60" y="195" font-size="13" font-weight="bold" fill="#856404">Change Event Structure:</text>
  <text x="60" y="218" font-size="12" font-family="monospace" fill="#333">{</text>
  <text x="80" y="238" font-size="12" font-family="monospace" fill="#333">"op": "c|u|d|r",</text>
  <text x="80" y="258" font-size="12" font-family="monospace" fill="#333">"before": { old row data },</text>
  <text x="80" y="278" font-size="12" font-family="monospace" fill="#333">"after":  { new row data },</text>
  <text x="80" y="298" font-size="12" font-family="monospace" fill="#333">"source": { table, lsn, ts },</text>
  <text x="80" y="318" font-size="12" font-family="monospace" fill="#333">"ts_ms": 1718460000000</text>
  <text x="60" y="338" font-size="12" font-family="monospace" fill="#333">}</text>
  <text x="60" y="360" font-size="11" fill="#555">op: c=create, u=update, d=delete, r=read (snapshot)</text>
  <line x1="300" y1="370" x2="300" y2="410" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="410" width="440" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="435" text-anchor="middle" font-size="13" fill="#333">Spark Structured Streaming</text>
  <text x="300" y="452" text-anchor="middle" font-size="11" fill="#666">Apply changes to Delta Lake</text>
</svg>

  <ns0:text x="919.0594" y="105.6311" text-anchor="middle" font-size="16.1553" fill="#333">Kafka Topic</ns0:text>
  <ns0:text x="76.5883" y="167.767" font-size="14.9126" fill="#555">Debezium reads the WAL (Write-Ahead Log)</ns0:text>
  <ns0:text x="76.5883" y="186.4078" font-size="14.9126" fill="#555">and emits change events:</ns0:text>
  <ns0:line x1="919.0594" y1="130.4854" x2="919.0594" y2="211.2621" stroke="#4a90e2" stroke-width="2.4854" marker-end="url(#arrow)" />
  <ns0:rect x="76.5883" y="211.2621" width="995.6476" height="248.5437" rx="6.2136" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4854" />
  <ns0:text x="114.8824" y="242.3301" font-size="16.1553" font-weight="bold" fill="#bf360c">Change Event Structure:</ns0:text>
  <ns0:text x="114.8824" y="270.9127" font-size="14.9126" font-family="monospace" fill="#333">{</ns0:text>
  <ns0:text x="153.1766" y="295.767" font-size="14.9126" font-family="monospace" fill="#333">"op": "c|u|d|r",</ns0:text>
  <ns0:text x="153.1766" y="320.6214" font-size="14.9126" font-family="monospace" fill="#333">"before": { old row data },</ns0:text>
  <ns0:text x="153.1766" y="345.4758" font-size="14.9126" font-family="monospace" fill="#333">"after":  { new row data },</ns0:text>
  <ns0:text x="153.1766" y="370.3301" font-size="14.9126" font-family="monospace" fill="#333">"source": { table, lsn, ts },</ns0:text>
  <ns0:text x="153.1766" y="395.1845" font-size="14.9126" font-family="monospace" fill="#333">"ts_ms": 1718460000000</ns0:text>
  <ns0:text x="114.8824" y="420.0388" font-size="14.9126" font-family="monospace" fill="#333">}</ns0:text>
  <ns0:text x="114.8824" y="447.3786" font-size="13.6699" fill="#555">op: c=create, u=update, d=delete, r=read (snapshot)</ns0:text>
  <ns0:line x1="574.4121" y1="459.8058" x2="574.4121" y2="509.5146" stroke="#4a90e2" stroke-width="2.4854" marker-end="url(#arrow)" />

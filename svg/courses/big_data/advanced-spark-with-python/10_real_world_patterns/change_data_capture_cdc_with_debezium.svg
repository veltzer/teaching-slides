<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="574.4121" y="31.068" text-anchor="middle" font-size="19.8835" font-weight="bold" fill="var(--text)">CDC Architecture</text>
  <rect x="19.147" y="43.4951" width="1110.53" height="596.5049" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <rect x="76.5883" y="68.3495" width="248.9119" height="62.136" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="201.0442" y="105.6311" text-anchor="middle" font-size="16.1553" fill="var(--text)">Postgres</text>
  <text x="201.0442" y="124.2718" text-anchor="middle" font-size="12.4272" fill="var(--text-muted)">(source)</text>
  <line x1="325.5002" y1="99.4175" x2="421.2355" y2="99.4175" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="421.2355" y="68.3495" width="268.059" height="62.136" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="555.2651" y="105.6311" text-anchor="middle" font-size="16.1553" fill="var(--text)">Debezium</text>
  <line x1="689.2945" y1="99.4175" x2="785.0299" y2="99.4175" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="785.0299" y="68.3495" width="268.059" height="62.136" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="919.0594" y="105.6311" text-anchor="middle" font-size="16.1553" fill="var(--text)">Kafka Topic</text>
  <text x="76.5883" y="167.767" font-size="14.9126" fill="var(--text-muted)">Debezium reads the WAL (Write-Ahead Log)</text>
  <text x="76.5883" y="186.4078" font-size="14.9126" fill="var(--text-muted)">and emits change events:</text>
  <line x1="919.0594" y1="130.4854" x2="919.0594" y2="211.2621" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="76.5883" y="211.2621" width="995.6476" height="248.5437" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="114.8824" y="242.3301" font-size="16.1553" font-weight="bold" fill="var(--danger-accent)">Change Event Structure:</text>
  <text x="114.8824" y="270.9127" font-size="14.9126" font-family="monospace" fill="var(--text)">{</text>
  <text x="153.1766" y="295.767" font-size="14.9126" font-family="monospace" fill="var(--text)">"op": "c|u|d|r",</text>
  <text x="153.1766" y="320.6214" font-size="14.9126" font-family="monospace" fill="var(--text)">"before": { old row data },</text>
  <text x="153.1766" y="345.4758" font-size="14.9126" font-family="monospace" fill="var(--text)">"after":  { new row data },</text>
  <text x="153.1766" y="370.3301" font-size="14.9126" font-family="monospace" fill="var(--text)">"source": { table, lsn, ts },</text>
  <text x="153.1766" y="395.1845" font-size="14.9126" font-family="monospace" fill="var(--text)">"ts_ms": 1718460000000</text>
  <text x="114.8824" y="420.0388" font-size="14.9126" font-family="monospace" fill="var(--text)">}</text>
  <text x="114.8824" y="447.3786" font-size="13.6699" fill="var(--text-muted)">op: c=create, u=update, d=delete, r=read (snapshot)</text>
  <line x1="574.4121" y1="459.8058" x2="574.4121" y2="509.5146" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="153.1766" y="509.5146" width="842.4711" height="62.136" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="574.4121" y="540.5825" text-anchor="middle" font-size="16.1553" fill="var(--text)">Spark Structured Streaming</text>
  <text x="574.4121" y="561.7088" text-anchor="middle" font-size="13.6699" fill="var(--text-muted)">Apply changes to Delta Lake</text>
</svg>
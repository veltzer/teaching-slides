  <ns0:rect x="76.5883" y="68.3495" width="248.9119" height="62.136" rx="6.2136" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4854" />
  <ns0:text x="201.0442" y="105.6311" text-anchor="middle" font-size="16.1553" fill="#333">Postgres</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="299.999972" height="71.605069693183" rx="6.970019659345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="189.99993" y="82.962945578876" text-anchor="middle" font-size="19.039423081763" fill="var(--text)" font-family="Arial, sans-serif">Postgres</text>
  <text x="189.99993" y="104.444297534984" text-anchor="middle" font-size="14.645755025644" fill="var(--text-muted)" font-family="Arial, sans-serif">(source)</text>
  <line x1="339.999972" y1="75.802414013262" x2="455.3845" y2="75.802414013262" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="455.3845" y="40" width="323.076945" height="71.605069693183" rx="6.970019659345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="616.923083" y="82.962945578876" text-anchor="middle" font-size="19.039423081763" fill="var(--text)" font-family="Arial, sans-serif">Debezium</text>
  <line x1="778.461444" y1="75.802414013262" x2="893.846195" y2="75.802414013262" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="893.846195" y="40" width="323.076945" height="71.605069693183" rx="6.970019659345" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055.384667" y="82.962945578876" text-anchor="middle" font-size="19.039423081763" fill="var(--text)" font-family="Arial, sans-serif">Kafka Topic</text>
  <text x="40" y="154.567893901692" font-size="17.574789334899" fill="var(--text-muted)" font-family="Arial, sans-serif">Debezium reads the WAL (Write-Ahead Log)</text>
  <text x="40" y="176.049366154093" font-size="17.574789334899" fill="var(--text-muted)" font-family="Arial, sans-serif">and emits change events:</text>
  <line x1="1055.384667" y1="111.604828026524" x2="1055.384667" y2="204.691249675815" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="204.691249675815" width="1200" height="286.419674069047" rx="6.970019659345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153722" y="240.493783985369" font-size="19.039423081763" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Change Event Structure:</text>
  <text x="86.153722" y="273.432058194606" font-size="17.574789334899" fill="var(--text)" font-family="Courier New, monospace">{</text>
  <text x="132.307667" y="302.073940642254" font-size="17.574789334899" fill="var(--text)" font-family="Courier New, monospace">"op": "c|u|d|r",</text>
  <text x="132.307667" y="330.715944460268" font-size="17.574789334899" fill="var(--text)" font-family="Courier New, monospace">"before": { old row data },</text>
  <text x="132.307667" y="359.357948278283" font-size="17.574789334899" fill="var(--text)" font-family="Courier New, monospace">"after":  { new row data },</text>
  <text x="132.307667" y="387.999830725931" font-size="17.574789334899" fill="var(--text)" font-family="Courier New, monospace">"source": { table, lsn, ts },</text>
  <text x="132.307667" y="416.641834543946" font-size="17.574789334899" fill="var(--text)" font-family="Courier New, monospace">"ts_ms": 1718460000000</text>
  <text x="86.153722" y="445.283716991594" font-size="17.574789334899" fill="var(--text)" font-family="Courier New, monospace">}</text>
  <text x="86.153722" y="476.789981984001" font-size="16.110271662084" fill="var(--text-muted)" font-family="Arial, sans-serif">op: c=create, u=update, d=delete, r=read (snapshot)</text>
  <line x1="639.999944" y1="491.110922670788" x2="639.999944" y2="548.394930306817" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="132.307667" y="548.394930306817" width="1015.384667" height="71.605069693183" rx="6.970019659345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999944" y="584.197344320079" text-anchor="middle" font-size="19.039423081763" fill="var(--text)" font-family="Arial, sans-serif">Spark Structured Streaming</text>
  <text x="639.999944" y="608.543077746872" text-anchor="middle" font-size="16.110271662084" fill="var(--text-muted)" font-family="Arial, sans-serif">Apply changes to Delta Lake</text>
</svg>

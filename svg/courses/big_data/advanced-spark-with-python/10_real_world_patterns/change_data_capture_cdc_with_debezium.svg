  <ns0:rect x="421.2355" y="68.3495" width="268.059" height="62.136" rx="6.2136" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4854" />
  <ns0:text x="555.2651" y="105.6311" text-anchor="middle" font-size="16.1553" fill="#333">Debezium</ns0:text>
  <ns0:line x1="689.2945" y1="99.4175" x2="785.0299" y2="99.4175" stroke="#4a90e2" stroke-width="2.4854" marker-end="url(#arrow)" />

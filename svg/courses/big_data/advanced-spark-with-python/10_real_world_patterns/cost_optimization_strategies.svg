<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="22.8571" y="12.8571" width="1234.2857" height="694.2857" rx="6.4286" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2.5714" />
  <text x="640" y="51.4286" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="#4a90e2">Cloud Cost Optimization for Spark</text>
  <rect x="68.5714" y="70.7143" width="1142.8571" height="128.5714" rx="6.4286" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.9286" />
  <text x="102.8571" y="100.2857" font-size="18" font-weight="bold" fill="#4a90e2">1. Right-size clusters</text>
  <text x="125.7143" y="126" font-size="15.4286" fill="#333">• Profile actual CPU/memory usage</text>
  <text x="125.7143" y="149.1429" font-size="15.4286" fill="#333">• Use spot/preemptible instances (70% savings)</text>
  <text x="125.7143" y="172.2857" font-size="15.4286" fill="#333">• Scale down during off-peak hours</text>
  <rect x="68.5714" y="212.1429" width="1142.8571" height="147.8571" rx="6.4286" fill="#d4edda" stroke="#28a745" stroke-width="1.9286" />
  <text x="102.8571" y="241.7143" font-size="18" font-weight="bold" fill="#28a745">2. Optimize data storage</text>
  <text x="125.7143" y="267.4286" font-size="15.4286" fill="#333">• Use Parquet/Delta (not CSV/JSON)</text>
  <text x="125.7143" y="290.5714" font-size="15.4286" fill="#333">• Compress with ZSTD (3-4x reduction)</text>
  <text x="125.7143" y="313.7143" font-size="15.4286" fill="#333">• Partition to enable pruning</text>
  <text x="125.7143" y="336.8571" font-size="15.4286" fill="#333">• Move cold data to cheaper storage tier</text>
  <rect x="68.5714" y="372.8571" width="1142.8571" height="147.8571" rx="6.4286" fill="#fff3cd" stroke="#ffc107" stroke-width="1.9286" />
  <text x="102.8571" y="402.4286" font-size="18" font-weight="bold" fill="#856404">3. Optimize compute</text>
  <text x="125.7143" y="428.1429" font-size="15.4286" fill="#333">• Enable AQE (auto-tune at runtime)</text>
  <text x="125.7143" y="451.2857" font-size="15.4286" fill="#333">• Broadcast small tables (skip shuffle)</text>
  <text x="125.7143" y="474.4286" font-size="15.4286" fill="#333">• Avoid UDFs (use built-in functions)</text>
  <text x="125.7143" y="497.5714" font-size="15.4286" fill="#333">• Cache reused DataFrames</text>
  <rect x="68.5714" y="533.5714" width="1142.8571" height="147.8571" rx="6.4286" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.9286" />
  <text x="102.8571" y="563.1429" font-size="18" font-weight="bold" fill="#4a90e2">4. Optimize scheduling</text>
  <text x="125.7143" y="588.8571" font-size="15.4286" fill="#333">• Use dynamic allocation</text>
  <text x="125.7143" y="612" font-size="15.4286" fill="#333">• Batch small jobs together</text>
  <text x="125.7143" y="635.1429" font-size="15.4286" fill="#333">• Schedule heavy jobs during off-peak</text>
  <text x="125.7143" y="658.2857" font-size="15.4286" fill="#333">• Set job timeouts to prevent runaway</text>
</svg>
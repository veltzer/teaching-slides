<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="20.6868" y="11.6363" width="1117.091" height="628.3637" rx="5.8182" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2.3272" />
  <ns0:text x="579.2324" y="46.5455" text-anchor="middle" font-size="18.6182" font-weight="bold" fill="#4a90e2">Cloud Cost Optimization for Spark</ns0:text>
  <ns0:rect x="62.0606" y="64" width="1034.3435" height="116.3636" rx="5.8182" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7455" />
  <ns0:text x="93.0909" y="90.7636" font-size="16.2909" font-weight="bold" fill="#4a90e2">1. Right-size clusters</ns0:text>
  <ns0:text x="113.7778" y="114.0364" font-size="13.9637" fill="#333">• Profile actual CPU/memory usage</ns0:text>
  <ns0:text x="113.7778" y="134.9819" font-size="13.9637" fill="#333">• Use spot/preemptible instances (70% savings)</ns0:text>
  <ns0:text x="113.7778" y="155.9273" font-size="13.9637" fill="#333">• Scale down during off-peak hours</ns0:text>
  <ns0:rect x="62.0606" y="192.0001" width="1034.3435" height="133.8182" rx="5.8182" fill="#d4edda" stroke="#28a745" stroke-width="1.7455" />
  <ns0:text x="93.0909" y="218.7637" font-size="16.2909" font-weight="bold" fill="#28a745">2. Optimize data storage</ns0:text>
  <ns0:text x="113.7778" y="242.0364" font-size="13.9637" fill="#333">• Use Parquet/Delta (not CSV/JSON)</ns0:text>
  <ns0:text x="113.7778" y="262.9818" font-size="13.9637" fill="#333">• Compress with ZSTD (3-4x reduction)</ns0:text>
  <ns0:text x="113.7778" y="283.9273" font-size="13.9637" fill="#333">• Partition to enable pruning</ns0:text>
  <ns0:text x="113.7778" y="304.8727" font-size="13.9637" fill="#333">• Move cold data to cheaper storage tier</ns0:text>
  <ns0:rect x="62.0606" y="337.4545" width="1034.3435" height="133.8182" rx="5.8182" fill="#fff3cd" stroke="#ffc107" stroke-width="1.7455" />
  <ns0:text x="93.0909" y="364.2182" font-size="16.2909" font-weight="bold" fill="#856404">3. Optimize compute</ns0:text>
  <ns0:text x="113.7778" y="387.491" font-size="13.9637" fill="#333">• Enable AQE (auto-tune at runtime)</ns0:text>
  <ns0:text x="113.7778" y="408.4364" font-size="13.9637" fill="#333">• Broadcast small tables (skip shuffle)</ns0:text>
  <ns0:text x="113.7778" y="429.3819" font-size="13.9637" fill="#333">• Avoid UDFs (use built-in functions)</ns0:text>
  <ns0:text x="113.7778" y="450.3273" font-size="13.9637" fill="#333">• Cache reused DataFrames</ns0:text>
  <ns0:rect x="62.0606" y="482.9091" width="1034.3435" height="133.8182" rx="5.8182" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7455" />
  <ns0:text x="93.0909" y="509.6728" font-size="16.2909" font-weight="bold" fill="#4a90e2">4. Optimize scheduling</ns0:text>
  <ns0:text x="113.7778" y="532.9455" font-size="13.9637" fill="#333">• Use dynamic allocation</ns0:text>
  <ns0:text x="113.7778" y="553.891" font-size="13.9637" fill="#333">• Batch small jobs together</ns0:text>
  <ns0:text x="113.7778" y="574.8364" font-size="13.9637" fill="#333">• Schedule heavy jobs during off-peak</ns0:text>
  <ns0:text x="113.7778" y="595.7819" font-size="13.9637" fill="#333">• Set job timeouts to prevent runaway</ns0:text>
</ns0:svg>
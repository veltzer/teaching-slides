<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000054" y="40" text-anchor="middle" font-size="20.225725" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Cloud Cost Optimization for Spark</text>
  <rect x="40" y="57.755093" width="1200" height="118.36736" rx="6.545789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999964" y="84.979584" font-size="17.697414" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Right-size clusters</text>
  <text x="100.000049" y="108.653078" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Profile actual CPU/memory usage</text>
  <text x="100.000049" y="129.959278" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Use spot/preemptible instances (70% savings)</text>
  <text x="100.000049" y="151.265367" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Scale down during off-peak hours</text>
  <rect x="40" y="187.959256" width="1200" height="136.122453" rx="6.545789" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999964" y="215.183746" font-size="17.697414" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Optimize data storage</text>
  <text x="100.000049" y="238.85713" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Use Parquet/Delta (not CSV/JSON)</text>
  <text x="100.000049" y="260.16322" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Compress with ZSTD (3-4x reduction)</text>
  <text x="100.000049" y="281.46942" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Partition to enable pruning</text>
  <text x="100.000049" y="302.775509" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Move cold data to cheaper storage tier</text>
  <rect x="40" y="335.918291" width="1200" height="136.122453" rx="6.545789" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999964" y="363.142892" font-size="17.697414" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Optimize compute</text>
  <text x="100.000049" y="386.816386" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Enable AQE (auto-tune at runtime)</text>
  <text x="100.000049" y="408.122476" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Broadcast small tables (skip shuffle)</text>
  <text x="100.000049" y="429.428675" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Avoid UDFs (use built-in functions)</text>
  <text x="100.000049" y="450.734765" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Cache reused DataFrames</text>
  <rect x="40" y="483.877547" width="1200" height="136.122453" rx="6.545789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999964" y="511.102147" font-size="17.697414" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">4. Optimize scheduling</text>
  <text x="100.000049" y="534.775531" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Use dynamic allocation</text>
  <text x="100.000049" y="556.081731" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Batch small jobs together</text>
  <text x="100.000049" y="577.387821" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Schedule heavy jobs during off-peak</text>
  <text x="100.000049" y="598.694021" font-size="15.169321" fill="var(--text)" font-family="Arial, sans-serif">• Set job timeouts to prevent runaway</text>
</svg>

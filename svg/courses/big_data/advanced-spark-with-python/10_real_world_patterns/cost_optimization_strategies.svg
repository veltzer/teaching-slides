<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.000054" y="40" text-anchor="middle" font-size="20.225725" font-weight="bold" fill="var(--primary-accent)">Cloud Cost Optimization for Spark</text>
  <rect x="40" y="57.755093" width="1200" height="118.36736" rx="6.545789" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="75.999964" y="84.979584" font-size="17.697414" font-weight="bold" fill="var(--primary-accent)">1. Right-size clusters</text>
  <text x="100.000049" y="108.653078" font-size="15.169321" fill="var(--text)">• Profile actual CPU/memory usage</text>
  <text x="100.000049" y="129.959278" font-size="15.169321" fill="var(--text)">• Use spot/preemptible instances (70% savings)</text>
  <text x="100.000049" y="151.265367" font-size="15.169321" fill="var(--text)">• Scale down during off-peak hours</text>
  <rect x="40" y="187.959256" width="1200" height="136.122453" rx="6.545789" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="75.999964" y="215.183746" font-size="17.697414" font-weight="bold" fill="var(--ok-accent)">2. Optimize data storage</text>
  <text x="100.000049" y="238.85713" font-size="15.169321" fill="var(--text)">• Use Parquet/Delta (not CSV/JSON)</text>
  <text x="100.000049" y="260.16322" font-size="15.169321" fill="var(--text)">• Compress with ZSTD (3-4x reduction)</text>
  <text x="100.000049" y="281.46942" font-size="15.169321" fill="var(--text)">• Partition to enable pruning</text>
  <text x="100.000049" y="302.775509" font-size="15.169321" fill="var(--text)">• Move cold data to cheaper storage tier</text>
  <rect x="40" y="335.918291" width="1200" height="136.122453" rx="6.545789" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="75.999964" y="363.142892" font-size="17.697414" font-weight="bold" fill="var(--danger-accent)">3. Optimize compute</text>
  <text x="100.000049" y="386.816386" font-size="15.169321" fill="var(--text)">• Enable AQE (auto-tune at runtime)</text>
  <text x="100.000049" y="408.122476" font-size="15.169321" fill="var(--text)">• Broadcast small tables (skip shuffle)</text>
  <text x="100.000049" y="429.428675" font-size="15.169321" fill="var(--text)">• Avoid UDFs (use built-in functions)</text>
  <text x="100.000049" y="450.734765" font-size="15.169321" fill="var(--text)">• Cache reused DataFrames</text>
  <rect x="40" y="483.877547" width="1200" height="136.122453" rx="6.545789" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="75.999964" y="511.102147" font-size="17.697414" font-weight="bold" fill="var(--primary-accent)">4. Optimize scheduling</text>
  <text x="100.000049" y="534.775531" font-size="15.169321" fill="var(--text)">• Use dynamic allocation</text>
  <text x="100.000049" y="556.081731" font-size="15.169321" fill="var(--text)">• Batch small jobs together</text>
  <text x="100.000049" y="577.387821" font-size="15.169321" fill="var(--text)">• Schedule heavy jobs during off-peak</text>
  <text x="100.000049" y="598.694021" font-size="15.169321" fill="var(--text)">• Set job timeouts to prevent runaway</text>
</svg>
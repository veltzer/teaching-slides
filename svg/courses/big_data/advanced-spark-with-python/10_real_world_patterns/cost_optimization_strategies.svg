<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="540" height="540" rx="5" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2"/>
  <text x="280" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">Cloud Cost Optimization for Spark</text>
  <rect x="30" y="55" width="500" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="45" y="78" font-size="14" font-weight="bold" fill="#4a90e2">1. Right-size clusters</text>
  <text x="55" y="98" font-size="12" fill="#333">&#x2022; Profile actual CPU/memory usage</text>
  <text x="55" y="116" font-size="12" fill="#333">&#x2022; Use spot/preemptible instances (70% savings)</text>
  <text x="55" y="134" font-size="12" fill="#333">&#x2022; Scale down during off-peak hours</text>
  <rect x="30" y="165" width="500" height="115" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="45" y="188" font-size="14" font-weight="bold" fill="#28a745">2. Optimize data storage</text>
  <text x="55" y="208" font-size="12" fill="#333">&#x2022; Use Parquet/Delta (not CSV/JSON)</text>
  <text x="55" y="226" font-size="12" fill="#333">&#x2022; Compress with ZSTD (3-4x reduction)</text>
  <text x="55" y="244" font-size="12" fill="#333">&#x2022; Partition to enable pruning</text>
  <text x="55" y="262" font-size="12" fill="#333">&#x2022; Move cold data to cheaper storage tier</text>
  <rect x="30" y="290" width="500" height="115" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="45" y="313" font-size="14" font-weight="bold" fill="#856404">3. Optimize compute</text>
  <text x="55" y="333" font-size="12" fill="#333">&#x2022; Enable AQE (auto-tune at runtime)</text>
  <text x="55" y="351" font-size="12" fill="#333">&#x2022; Broadcast small tables (skip shuffle)</text>
  <text x="55" y="369" font-size="12" fill="#333">&#x2022; Avoid UDFs (use built-in functions)</text>
  <text x="55" y="387" font-size="12" fill="#333">&#x2022; Cache reused DataFrames</text>
  <rect x="30" y="415" width="500" height="115" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="45" y="438" font-size="14" font-weight="bold" fill="#4a90e2">4. Optimize scheduling</text>
  <text x="55" y="458" font-size="12" fill="#333">&#x2022; Use dynamic allocation</text>
  <text x="55" y="476" font-size="12" fill="#333">&#x2022; Batch small jobs together</text>
  <text x="55" y="494" font-size="12" fill="#333">&#x2022; Schedule heavy jobs during off-peak</text>
  <text x="55" y="512" font-size="12" fill="#333">&#x2022; Set job timeouts to prevent runaway</text>
</svg>

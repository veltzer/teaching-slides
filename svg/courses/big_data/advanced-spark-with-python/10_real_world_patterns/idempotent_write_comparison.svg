<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="161.860465381017" rx="6.72378599923" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="73.720930244592" font-size="19.604991728231" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dynamic Partition Overwrite (Parquet)</text>
  <text x="99.999941" y="100.697674647242" font-size="16.804310886895" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Works with plain Parquet</text>
  <text x="99.999941" y="124.976744713115" font-size="16.804310886895" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Simple configuration</text>
  <text x="99.999941" y="149.255930685943" font-size="16.804310886895" fill="var(--danger-accent)" font-family="Arial, sans-serif">- Not atomic (partial writes possible)</text>
  <text x="99.999941" y="173.534883809978" font-size="16.804310886895" fill="var(--danger-accent)" font-family="Arial, sans-serif">- No concurrent write safety</text>
  <rect x="40" y="215.3488370649" width="1200" height="161.860465381017" rx="6.72378599923" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="249.069767309492" font-size="19.604991728231" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">replaceWhere (Delta Lake)</text>
  <text x="99.999941" y="276.046511712142" font-size="16.804310886895" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Atomic (all or nothing)</text>
  <text x="99.999941" y="300.325581778015" font-size="16.804310886895" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Concurrent-safe (optimistic locking)</text>
  <text x="99.999941" y="324.604650809005" font-size="16.804310886895" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Predicate validated at write time</text>
  <text x="99.999941" y="348.883837816716" font-size="16.804310886895" fill="var(--danger-accent)" font-family="Arial, sans-serif">- Requires Delta Lake</text>
  <rect x="40" y="390.6976741298" width="1200" height="148.37209266225" rx="6.72378599923" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="424.418604374392" font-size="19.604991728231" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">DELETE + INSERT (Delta Lake)</text>
  <text x="99.999941" y="451.395348777042" font-size="16.804310886895" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Explicit, easy to understand</text>
  <text x="99.999941" y="475.674418842915" font-size="16.804310886895" fill="var(--danger-accent)" font-family="Arial, sans-serif">- Two operations (not atomic together)</text>
  <text x="99.999941" y="499.953488908788" font-size="16.804310886895" fill="var(--danger-accent)" font-family="Arial, sans-serif">- Slightly slower (two transactions)</text>
  <rect x="40" y="559.302325352758" width="1200" height="60.697674647242" rx="6.72378599923" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999946" y="597.069884044353" text-anchor="middle" font-size="18.204651307563" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Recommendation: Use replaceWhere with Delta</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="20.7158" y="12.5491" width="1118.6554" height="627.4509" rx="6.2745" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="50.1961" text-anchor="middle" font-size="20.0784" font-weight="bold" fill="#333">Idempotent Write Comparison</ns0:text>
  <ns0:rect x="62.1475" y="69.0196" width="1035.792" height="150.5882" rx="6.2745" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5098" />
  <ns0:text x="93.2212" y="100.3921" font-size="17.5686" font-weight="bold" fill="#856404">Dynamic Partition Overwrite (Parquet)</ns0:text>
  <ns0:text x="113.9371" y="125.4902" font-size="15.0588" fill="#28a745">+ Works with plain Parquet</ns0:text>
  <ns0:text x="113.9371" y="148.0784" font-size="15.0588" fill="#28a745">+ Simple configuration</ns0:text>
  <ns0:text x="113.9371" y="170.6667" font-size="15.0588" fill="#dc3545">- Not atomic (partial writes possible)</ns0:text>
  <ns0:text x="113.9371" y="193.2549" font-size="15.0588" fill="#dc3545">- No concurrent write safety</ns0:text>
  <ns0:rect x="62.1475" y="232.1568" width="1035.792" height="150.5882" rx="6.2745" fill="#d4edda" stroke="#28a745" stroke-width="2.5098" />
  <ns0:text x="93.2212" y="263.5294" font-size="17.5686" font-weight="bold" fill="#28a745">replaceWhere (Delta Lake)</ns0:text>
  <ns0:text x="113.9371" y="288.6274" font-size="15.0588" fill="#28a745">+ Atomic (all or nothing)</ns0:text>
  <ns0:text x="113.9371" y="311.2156" font-size="15.0588" fill="#28a745">+ Concurrent-safe (optimistic locking)</ns0:text>
  <ns0:text x="113.9371" y="333.8039" font-size="15.0588" fill="#28a745">+ Predicate validated at write time</ns0:text>
  <ns0:text x="113.9371" y="356.3922" font-size="15.0588" fill="#dc3545">- Requires Delta Lake</ns0:text>
  <ns0:rect x="62.1475" y="395.294" width="1035.792" height="138.0392" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="93.2212" y="426.6666" font-size="17.5686" font-weight="bold" fill="#4a90e2">DELETE + INSERT (Delta Lake)</ns0:text>
  <ns0:text x="113.9371" y="451.7646" font-size="15.0588" fill="#28a745">+ Explicit, easy to understand</ns0:text>
  <ns0:text x="113.9371" y="474.3529" font-size="15.0588" fill="#dc3545">- Two operations (not atomic together)</ns0:text>
  <ns0:text x="113.9371" y="496.9411" font-size="15.0588" fill="#dc3545">- Slightly slower (two transactions)</ns0:text>
  <ns0:rect x="62.1475" y="552.1568" width="1035.792" height="56.4706" rx="6.2745" fill="#d4edda" stroke="#28a745" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="587.2941" text-anchor="middle" font-size="16.3137" font-weight="bold" fill="#28a745">Recommendation: Use replaceWhere with Delta</ns0:text>
</ns0:svg>
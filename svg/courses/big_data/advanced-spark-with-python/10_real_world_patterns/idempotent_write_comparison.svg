<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="22.8571" y="13.8462" width="1234.2857" height="692.3077" rx="6.9231" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="55.3846" text-anchor="middle" font-size="22.1538" font-weight="bold" fill="#333">Idempotent Write Comparison</text>
  <rect x="68.5714" y="76.1538" width="1142.8571" height="166.1538" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7692" />
  <text x="102.8571" y="110.7692" font-size="19.3846" font-weight="bold" fill="#856404">Dynamic Partition Overwrite (Parquet)</text>
  <text x="125.7143" y="138.4615" font-size="16.6154" fill="#28a745">+ Works with plain Parquet</text>
  <text x="125.7143" y="163.3846" font-size="16.6154" fill="#28a745">+ Simple configuration</text>
  <text x="125.7143" y="188.3077" font-size="16.6154" fill="#dc3545">- Not atomic (partial writes possible)</text>
  <text x="125.7143" y="213.2308" font-size="16.6154" fill="#dc3545">- No concurrent write safety</text>
  <rect x="68.5714" y="256.1538" width="1142.8571" height="166.1538" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.7692" />
  <text x="102.8571" y="290.7692" font-size="19.3846" font-weight="bold" fill="#28a745">replaceWhere (Delta Lake)</text>
  <text x="125.7143" y="318.4615" font-size="16.6154" fill="#28a745">+ Atomic (all or nothing)</text>
  <text x="125.7143" y="343.3846" font-size="16.6154" fill="#28a745">+ Concurrent-safe (optimistic locking)</text>
  <text x="125.7143" y="368.3077" font-size="16.6154" fill="#28a745">+ Predicate validated at write time</text>
  <text x="125.7143" y="393.2308" font-size="16.6154" fill="#dc3545">- Requires Delta Lake</text>
  <rect x="68.5714" y="436.1538" width="1142.8571" height="152.3077" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="102.8571" y="470.7692" font-size="19.3846" font-weight="bold" fill="#4a90e2">DELETE + INSERT (Delta Lake)</text>
  <text x="125.7143" y="498.4615" font-size="16.6154" fill="#28a745">+ Explicit, easy to understand</text>
  <text x="125.7143" y="523.3846" font-size="16.6154" fill="#dc3545">- Two operations (not atomic together)</text>
  <text x="125.7143" y="548.3077" font-size="16.6154" fill="#dc3545">- Slightly slower (two transactions)</text>
  <rect x="68.5714" y="609.2308" width="1142.8571" height="62.3077" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.7692" />
  <text x="640" y="648" text-anchor="middle" font-size="18" font-weight="bold" fill="#28a745">Recommendation: Use replaceWhere with Delta</text>
</svg>
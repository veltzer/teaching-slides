<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999946" y="40" text-anchor="middle" font-size="22.024815" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Idempotent Write Comparison</text>
  <rect x="40" y="59.550453" width="1200" height="156.404525" rx="6.609493" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="92.134729" font-size="19.27174" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dynamic Partition Overwrite (Parquet)</text>
  <text x="99.999941" y="118.20215" font-size="16.518666" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Works with plain Parquet</text>
  <text x="99.999941" y="141.662829" font-size="16.518666" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Simple configuration</text>
  <text x="99.999941" y="165.12362" font-size="16.518666" fill="var(--danger-accent)" font-family="Arial, sans-serif">- Not atomic (partial writes possible)</text>
  <text x="99.999941" y="188.584186" font-size="16.518666" fill="var(--danger-accent)" font-family="Arial, sans-serif">- No concurrent write safety</text>
  <rect x="40" y="228.988688" width="1200" height="156.404525" rx="6.609493" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="261.572964" font-size="19.27174" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">replaceWhere (Delta Lake)</text>
  <text x="99.999941" y="287.640385" font-size="16.518666" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Atomic (all or nothing)</text>
  <text x="99.999941" y="311.101064" font-size="16.518666" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Concurrent-safe (optimistic locking)</text>
  <text x="99.999941" y="334.561742" font-size="16.518666" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Predicate validated at write time</text>
  <text x="99.999941" y="358.022534" font-size="16.518666" fill="var(--danger-accent)" font-family="Arial, sans-serif">- Requires Delta Lake</text>
  <rect x="40" y="398.426923" width="1200" height="143.370814" rx="6.609493" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="431.011199" font-size="19.27174" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">DELETE + INSERT (Delta Lake)</text>
  <text x="99.999941" y="457.07862" font-size="16.518666" fill="var(--ok-accent)" font-family="Arial, sans-serif">+ Explicit, easy to understand</text>
  <text x="99.999941" y="480.539299" font-size="16.518666" fill="var(--danger-accent)" font-family="Arial, sans-serif">- Two operations (not atomic together)</text>
  <text x="99.999941" y="503.999978" font-size="16.518666" fill="var(--danger-accent)" font-family="Arial, sans-serif">- Slightly slower (two transactions)</text>
  <rect x="40" y="561.348303" width="1200" height="58.651697" rx="6.609493" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999946" y="597.842805" text-anchor="middle" font-size="17.895203" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Recommendation: Use replaceWhere with Delta</text>
</svg>

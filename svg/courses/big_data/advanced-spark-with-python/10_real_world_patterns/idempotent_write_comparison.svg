<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999946" y="40" text-anchor="middle" font-size="22.024815" font-weight="bold" fill="var(--text)">Idempotent Write Comparison</text>
  <rect x="40" y="59.550453" width="1200" height="156.404525" rx="6.609493" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="92.134729" font-size="19.27174" font-weight="bold" fill="var(--danger-accent)">Dynamic Partition Overwrite (Parquet)</text>
  <text x="99.999941" y="118.20215" font-size="16.518666" fill="var(--ok-accent)">+ Works with plain Parquet</text>
  <text x="99.999941" y="141.662829" font-size="16.518666" fill="var(--ok-accent)">+ Simple configuration</text>
  <text x="99.999941" y="165.12362" font-size="16.518666" fill="var(--danger-accent)">- Not atomic (partial writes possible)</text>
  <text x="99.999941" y="188.584186" font-size="16.518666" fill="var(--danger-accent)">- No concurrent write safety</text>
  <rect x="40" y="228.988688" width="1200" height="156.404525" rx="6.609493" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="261.572964" font-size="19.27174" font-weight="bold" fill="var(--ok-accent)">replaceWhere (Delta Lake)</text>
  <text x="99.999941" y="287.640385" font-size="16.518666" fill="var(--ok-accent)">+ Atomic (all or nothing)</text>
  <text x="99.999941" y="311.101064" font-size="16.518666" fill="var(--ok-accent)">+ Concurrent-safe (optimistic locking)</text>
  <text x="99.999941" y="334.561742" font-size="16.518666" fill="var(--ok-accent)">+ Predicate validated at write time</text>
  <text x="99.999941" y="358.022534" font-size="16.518666" fill="var(--danger-accent)">- Requires Delta Lake</text>
  <rect x="40" y="398.426923" width="1200" height="143.370814" rx="6.609493" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.999856" y="431.011199" font-size="19.27174" font-weight="bold" fill="var(--primary-accent)">DELETE + INSERT (Delta Lake)</text>
  <text x="99.999941" y="457.07862" font-size="16.518666" fill="var(--ok-accent)">+ Explicit, easy to understand</text>
  <text x="99.999941" y="480.539299" font-size="16.518666" fill="var(--danger-accent)">- Two operations (not atomic together)</text>
  <text x="99.999941" y="503.999978" font-size="16.518666" fill="var(--danger-accent)">- Slightly slower (two transactions)</text>
  <rect x="40" y="561.348303" width="1200" height="58.651697" rx="6.609493" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999946" y="597.842805" text-anchor="middle" font-size="17.895203" font-weight="bold" fill="var(--ok-accent)">Recommendation: Use replaceWhere with Delta</text>
</svg>
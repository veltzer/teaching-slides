  <ns0:text x="578.5311" y="182.2373" text-anchor="middle" font-size="15.1864" font-weight="bold" fill="#4a90e2">Bronze Layer (Raw)</ns0:text>
  <ns0:text x="99.7467" y="209.3559" font-size="13.0169" fill="#333">• Raw data, as-is from source</ns0:text>
  <ns0:text x="99.7467" y="236.4746" font-size="13.0169" fill="#333">• Append-only, no transformations</ns0:text>
  <ns0:text x="99.7467" y="263.5932" font-size="13.0169" fill="#333">• Format: Delta / Parquet | Retention: long</ns0:text>

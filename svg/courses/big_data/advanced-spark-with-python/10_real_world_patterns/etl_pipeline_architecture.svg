<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.000054" y="40" text-anchor="middle" font-size="18.661454" font-weight="bold" fill="var(--text)">Layered Data Architecture</text>
  <text x="40" y="77.943924" font-size="16.328706" font-weight="bold" fill="var(--text)">Source Systems</text>
  <rect x="40" y="88.785061" width="253.846172" height="43.36444" rx="6.398688" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.92314" y="115.887848" text-anchor="middle" font-size="13.996064" fill="var(--text)">RDBMS</text>
  <rect x="328.461604" y="88.785061" width="253.846172" height="43.36444" rx="6.398688" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="455.384744" y="115.887848" text-anchor="middle" font-size="13.996064" fill="var(--text)">API</text>
  <rect x="616.9231" y="88.785061" width="253.846172" height="43.36444" rx="6.398688" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="743.846132" y="115.887848" text-anchor="middle" font-size="13.996064" fill="var(--text)">Kafka</text>
  <rect x="905.384703" y="88.785061" width="253.846172" height="43.36444" rx="6.398688" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1032.307736" y="115.887848" text-anchor="middle" font-size="13.996064" fill="var(--text)">Files</text>
  <line x1="640.000054" y1="132.1495" x2="640.000054" y2="164.672909" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="164.672909" width="1200" height="130.093424" rx="6.398688" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="195.028091" text-anchor="middle" font-size="16.328706" font-weight="bold" fill="var(--primary-accent)">Bronze Layer (Raw)</text>
  <text x="86.153908" y="222.130879" font-size="13.996064" fill="var(--text)">• Raw data, as-is from source</text>
  <text x="86.153908" y="249.233667" font-size="13.996064" fill="var(--text)">• Append-only, no transformations</text>
  <text x="86.153908" y="276.336455" font-size="13.996064" fill="var(--text)">• Format: Delta / Parquet | Retention: long</text>
  <line x1="640.000054" y1="294.766439" x2="640.000054" y2="327.289742" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="327.289742" width="1200" height="130.093424" rx="6.398688" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="357.644924" text-anchor="middle" font-size="16.328706" font-weight="bold" fill="var(--ok-accent)">Silver Layer (Cleansed)</text>
  <text x="86.153908" y="384.747712" font-size="13.996064" fill="var(--text)">• Deduplicated, validated, typed</text>
  <text x="86.153908" y="411.8505" font-size="13.996064" fill="var(--text)">• Business keys resolved</text>
  <text x="86.153908" y="438.953288" font-size="13.996064" fill="var(--text)">• Format: Delta (ACID) | Retention: medium</text>
  <line x1="640.000054" y1="457.383272" x2="640.000054" y2="489.906576" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="489.906576" width="1200" height="130.093424" rx="6.398688" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="520.261757" text-anchor="middle" font-size="16.328706" font-weight="bold" fill="var(--danger-accent)">Gold Layer (Business)</text>
  <text x="86.153908" y="547.364545" font-size="13.996064" fill="var(--text)">• Aggregated, enriched, business-ready</text>
  <text x="86.153908" y="574.467333" font-size="13.996064" fill="var(--text)">• Dimensional model / feature store</text>
  <text x="86.153908" y="601.570121" font-size="13.996064" fill="var(--text)">• Format: Delta (ACID) | Retention: as needed</text>
</svg>
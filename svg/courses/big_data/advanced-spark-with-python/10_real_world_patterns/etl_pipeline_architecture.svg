  <ns0:text x="578.5311" y="344.9492" text-anchor="middle" font-size="15.1864" font-weight="bold" fill="#28a745">Silver Layer (Cleansed)</ns0:text>
  <ns0:text x="99.7467" y="372.0678" font-size="13.0169" fill="#333">• Deduplicated, validated, typed</ns0:text>
  <ns0:text x="99.7467" y="399.1864" font-size="13.0169" fill="#333">• Business keys resolved</ns0:text>
  <ns0:text x="99.7467" y="426.3051" font-size="13.0169" fill="#333">• Format: Delta (ACID) | Retention: medium</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.000054" y="40" text-anchor="middle" font-size="18.661454" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Layered Data Architecture</text>
  <text x="40" y="77.943924" font-size="16.328706" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Source Systems</text>
  <rect x="40" y="88.785061" width="253.846172" height="43.36444" rx="6.398688" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="166.92314" y="115.887848" text-anchor="middle" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">RDBMS</text>
  <rect x="328.461604" y="88.785061" width="253.846172" height="43.36444" rx="6.398688" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="455.384744" y="115.887848" text-anchor="middle" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">API</text>
  <rect x="616.9231" y="88.785061" width="253.846172" height="43.36444" rx="6.398688" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="743.846132" y="115.887848" text-anchor="middle" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">Kafka</text>
  <rect x="905.384703" y="88.785061" width="253.846172" height="43.36444" rx="6.398688" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1032.307736" y="115.887848" text-anchor="middle" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">Files</text>
  <line x1="640.000054" y1="132.1495" x2="640.000054" y2="164.672909" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="164.672909" width="1200" height="130.093424" rx="6.398688" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="195.028091" text-anchor="middle" font-size="16.328706" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Bronze Layer (Raw)</text>
  <text x="86.153908" y="222.130879" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">• Raw data, as-is from source</text>
  <text x="86.153908" y="249.233667" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">• Append-only, no transformations</text>
  <text x="86.153908" y="276.336455" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">• Format: Delta / Parquet | Retention: long</text>
  <line x1="640.000054" y1="294.766439" x2="640.000054" y2="327.289742" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="327.289742" width="1200" height="130.093424" rx="6.398688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="357.644924" text-anchor="middle" font-size="16.328706" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Silver Layer (Cleansed)</text>
  <text x="86.153908" y="384.747712" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">• Deduplicated, validated, typed</text>
  <text x="86.153908" y="411.8505" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">• Business keys resolved</text>
  <text x="86.153908" y="438.953288" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">• Format: Delta (ACID) | Retention: medium</text>
  <line x1="640.000054" y1="457.383272" x2="640.000054" y2="489.906576" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="489.906576" width="1200" height="130.093424" rx="6.398688" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000054" y="520.261757" text-anchor="middle" font-size="16.328706" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Gold Layer (Business)</text>
  <text x="86.153908" y="547.364545" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">• Aggregated, enriched, business-ready</text>
  <text x="86.153908" y="574.467333" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">• Dimensional model / feature store</text>
  <text x="86.153908" y="601.570121" font-size="13.996064" fill="var(--text)" font-family="Arial, sans-serif">• Format: Delta (ACID) | Retention: as needed</text>
</svg>
  <text x="187.5862" y="114" text-anchor="middle" font-size="14.4" fill="#333">RDBMS</text>
  <rect x="342.069" y="84" width="242.7586" height="48" rx="6" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8" />
  <text x="463.4483" y="114" text-anchor="middle" font-size="14.4" fill="#333">API</text>
  <rect x="617.931" y="84" width="242.7586" height="48" rx="6" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8" />
  <text x="739.3103" y="114" text-anchor="middle" font-size="14.4" fill="#333">Kafka</text>
  <rect x="893.7931" y="84" width="242.7586" height="48" rx="6" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.8" />
  <text x="1015.1724" y="114" text-anchor="middle" font-size="14.4" fill="#333">Files</text>
  <line x1="640" y1="132" x2="640" y2="168" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="66.2069" y="168" width="1147.5862" height="144" rx="6" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4" />
  <text x="640" y="201.6" text-anchor="middle" font-size="16.8" font-weight="bold" fill="#4a90e2">Bronze Layer (Raw)</text>
  <text x="110.3448" y="231.6" font-size="14.4" fill="#333">• Raw data, as-is from source</text>
  <text x="110.3448" y="261.6" font-size="14.4" fill="#333">• Append-only, no transformations</text>
  <text x="110.3448" y="291.6" font-size="14.4" fill="#333">• Format: Delta / Parquet | Retention: long</text>
  <line x1="640" y1="312" x2="640" y2="348" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="66.2069" y="348" width="1147.5862" height="144" rx="6" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <text x="640" y="381.6" text-anchor="middle" font-size="16.8" font-weight="bold" fill="#28a745">Silver Layer (Cleansed)</text>
  <text x="110.3448" y="411.6" font-size="14.4" fill="#333">• Deduplicated, validated, typed</text>
  <text x="110.3448" y="441.6" font-size="14.4" fill="#333">• Business keys resolved</text>
  <text x="110.3448" y="471.6" font-size="14.4" fill="#333">• Format: Delta (ACID) | Retention: medium</text>
  <line x1="640" y1="492" x2="640" y2="528" stroke="#4a90e2" stroke-width="2.4" marker-end="url(#arrow)" />
  <rect x="66.2069" y="528" width="1147.5862" height="144" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="640" y="561.6" text-anchor="middle" font-size="16.8" font-weight="bold" fill="#856404">Gold Layer (Business)</text>
  <text x="110.3448" y="591.6" font-size="14.4" fill="#333">• Aggregated, enriched, business-ready</text>
  <text x="110.3448" y="621.6" font-size="14.4" fill="#333">• Dimensional model / feature store</text>
  <text x="110.3448" y="651.6" font-size="14.4" fill="#333">• Format: Delta (ACID) | Retention: as needed</text>

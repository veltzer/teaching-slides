<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="17.4987" font-weight="bold" fill="var(--text)">Layered Data Architecture</text>
  <rect x="40" y="50.2655" width="1200" height="569.7345" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="82.857" y="75.9292" font-size="15.3113" font-weight="bold" fill="var(--text)">Source Systems</text>
  <rect x="82.857" y="86.1947" width="235.7143" height="41.0619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="200.7142" y="111.8584" text-anchor="middle" font-size="13.124" fill="var(--text)">RDBMS</text>
  <rect x="350.7142" y="86.1947" width="235.7143" height="41.0619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="468.5714" y="111.8584" text-anchor="middle" font-size="13.124" fill="var(--text)">API</text>
  <rect x="618.5713" y="86.1947" width="235.7143" height="41.0619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="736.4284" y="111.8584" text-anchor="middle" font-size="13.124" fill="var(--text)">Kafka</text>
  <rect x="886.4285" y="86.1947" width="235.7143" height="41.0619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1004.2856" y="111.8584" text-anchor="middle" font-size="13.124" fill="var(--text)">Files</text>
  <line x1="639.9999" y1="127.2566" x2="639.9999" y2="158.0531" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="82.857" y="158.0531" width="1114.2857" height="123.1858" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="186.7965" text-anchor="middle" font-size="15.3113" font-weight="bold" fill="var(--primary-accent)">Bronze Layer (Raw)</text>
  <text x="125.7142" y="212.4602" font-size="13.124" fill="var(--text)">• Raw data, as-is from source</text>
  <text x="125.7142" y="238.1239" font-size="13.124" fill="var(--text)">• Append-only, no transformations</text>
  <text x="125.7142" y="263.7876" font-size="13.124" fill="var(--text)">• Format: Delta / Parquet | Retention: long</text>
  <line x1="639.9999" y1="281.239" x2="639.9999" y2="312.0354" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="82.857" y="312.0354" width="1114.2857" height="123.1858" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="639.9999" y="340.7788" text-anchor="middle" font-size="15.3113" font-weight="bold" fill="var(--ok-accent)">Silver Layer (Cleansed)</text>
  <text x="125.7142" y="366.4425" font-size="13.124" fill="var(--text)">• Deduplicated, validated, typed</text>
  <text x="125.7142" y="392.1062" font-size="13.124" fill="var(--text)">• Business keys resolved</text>
  <text x="125.7142" y="417.7699" font-size="13.124" fill="var(--text)">• Format: Delta (ACID) | Retention: medium</text>
  <line x1="639.9999" y1="435.2213" x2="639.9999" y2="466.0177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="82.857" y="466.0177" width="1114.2857" height="123.1858" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="494.7611" text-anchor="middle" font-size="15.3113" font-weight="bold" fill="var(--danger-accent)">Gold Layer (Business)</text>
  <text x="125.7142" y="520.4248" font-size="13.124" fill="var(--text)">• Aggregated, enriched, business-ready</text>
  <text x="125.7142" y="546.0885" font-size="13.124" fill="var(--text)">• Dimensional model / feature store</text>
  <text x="125.7142" y="571.7522" font-size="13.124" fill="var(--text)">• Format: Delta (ACID) | Retention: as needed</text>
</svg>
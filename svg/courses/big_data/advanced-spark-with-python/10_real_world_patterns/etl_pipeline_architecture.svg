  <text x="640" y="30" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#333">Layered Data Architecture</text>
  <rect x="22.069" y="42" width="1235.8621" height="666" rx="6" fill="#f9f9f9" stroke="#4a90e2" stroke-width="2.4" />
  <text x="66.2069" y="72" font-size="16.8" font-weight="bold" fill="#333">Source Systems</text>

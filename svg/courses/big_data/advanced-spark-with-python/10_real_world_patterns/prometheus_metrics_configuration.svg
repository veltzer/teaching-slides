<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="21.688959" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Metrics to Prometheus</text>
  <rect x="40" y="55.229653" width="1200" height="291.903775" rx="6.512842" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153912" y="86.958433" font-size="18.977771" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Application</text>
  <text x="86.153912" y="118.686995" font-size="17.622231" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Driver Metrics:</text>
  <text x="109.230761" y="141.531638" font-size="14.911152" fill="var(--text)" font-family="Courier New, monospace">spark_driver_jvm_heap_used</text>
  <text x="109.230761" y="163.107244" font-size="14.911152" fill="var(--text)" font-family="Courier New, monospace">spark_driver_active_tasks</text>
  <text x="109.230761" y="184.682631" font-size="14.911152" fill="var(--text)" font-family="Courier New, monospace">spark_driver_completed_tasks</text>
  <text x="109.230761" y="206.258128" font-size="14.911152" fill="var(--text)" font-family="Courier New, monospace">spark_driver_failed_tasks</text>
  <text x="663.077064" y="118.686995" font-size="17.622231" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Executor Metrics:</text>
  <text x="686.153912" y="141.531638" font-size="14.911152" fill="var(--text)" font-family="Courier New, monospace">spark_executor_jvm_heap_used</text>
  <text x="686.153912" y="163.107244" font-size="14.911152" fill="var(--text)" font-family="Courier New, monospace">spark_executor_gc_time_total</text>
  <text x="686.153912" y="184.682631" font-size="14.911152" fill="var(--text)" font-family="Courier New, monospace">spark_executor_shuffle_read_bytes</text>
  <text x="686.153912" y="206.258128" font-size="14.911152" fill="var(--text)" font-family="Courier New, monospace">spark_executor_shuffle_write_bytes</text>
  <text x="640" y="321.7506" text-anchor="middle" font-size="16.266692" fill="var(--text-muted)" font-family="Arial, sans-serif">/metrics/prometheus endpoint</text>
  <line x1="640" y1="347.133428" x2="640" y2="385.207943" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="109.230761" y="385.207943" width="323.076956" height="57.111608" rx="6.512842" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270.769347" y="420.743945" text-anchor="middle" font-size="17.622231" fill="var(--text)" font-family="Arial, sans-serif">Prometheus</text>
  <line x1="432.307717" y1="413.129064" x2="524.615434" y2="413.129064" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="524.615434" y="385.207943" width="323.076956" height="57.111608" rx="6.512842" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="686.153912" y="420.743945" text-anchor="middle" font-size="17.622231" fill="var(--text)" font-family="Arial, sans-serif">Grafana</text>
  <line x1="847.692391" y1="413.129064" x2="940.000215" y2="413.129064" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="940.000215" y="385.207943" width="276.923044" height="57.111608" rx="6.512842" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1078.46163" y="420.743945" text-anchor="middle" font-size="17.622231" fill="var(--text)" font-family="Arial, sans-serif">Alerts</text>
  <rect x="40" y="467.702378" width="1200" height="152.297622" rx="6.512842" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153912" y="496.892756" font-size="17.622231" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Key alerts to set up:</text>
  <text x="109.230761" y="522.275802" font-size="16.266692" fill="var(--text)" font-family="Arial, sans-serif">• Job duration &gt; 2x historical average</text>
  <text x="109.230761" y="545.120336" font-size="16.266692" fill="var(--text)" font-family="Arial, sans-serif">• Failed tasks &gt; 5% of total</text>
  <text x="109.230761" y="567.965089" font-size="16.266692" fill="var(--text)" font-family="Arial, sans-serif">• Executor memory &gt; 90% usage</text>
  <text x="109.230761" y="590.809732" font-size="16.266692" fill="var(--text)" font-family="Arial, sans-serif">• Row count anomaly (&lt; 50% of expected)</text>
</svg>

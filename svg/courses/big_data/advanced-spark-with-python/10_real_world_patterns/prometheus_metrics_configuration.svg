<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="20.0015" y="12.5491" width="1120.0841" height="627.4509" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="580.0435" y="47.6863" text-anchor="middle" font-size="20.0784" font-weight="bold" fill="var(--primary-accent)">Spark Metrics to Prometheus</text>
  <rect x="60.0045" y="62.7451" width="1040.078" height="288.6274" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="100.0075" y="94.1177" font-size="17.5686" font-weight="bold" fill="var(--primary-accent)">Spark Application</text>
  <text x="100.0075" y="125.4902" font-size="16.3137" font-weight="bold" fill="var(--text)">Driver Metrics:</text>
  <text x="120.009" y="148.0784" font-size="13.8039" font-family="monospace" fill="var(--text)">spark_driver_jvm_heap_used</text>
  <text x="120.009" y="169.4118" font-size="13.8039" font-family="monospace" fill="var(--text)">spark_driver_active_tasks</text>
  <text x="120.009" y="190.745" font-size="13.8039" font-family="monospace" fill="var(--text)">spark_driver_completed_tasks</text>
  <text x="120.009" y="212.0784" font-size="13.8039" font-family="monospace" fill="var(--text)">spark_driver_failed_tasks</text>
  <text x="600.0451" y="125.4902" font-size="16.3137" font-weight="bold" fill="var(--text)">Executor Metrics:</text>
  <text x="620.0465" y="148.0784" font-size="13.8039" font-family="monospace" fill="var(--text)">spark_executor_jvm_heap_used</text>
  <text x="620.0465" y="169.4118" font-size="13.8039" font-family="monospace" fill="var(--text)">spark_executor_gc_time_total</text>
  <text x="620.0465" y="190.745" font-size="13.8039" font-family="monospace" fill="var(--text)">spark_executor_shuffle_read_bytes</text>
  <text x="620.0465" y="212.0784" font-size="13.8039" font-family="monospace" fill="var(--text)">spark_executor_shuffle_write_bytes</text>
  <text x="580.0435" y="326.2745" text-anchor="middle" font-size="15.0588" fill="var(--text-muted)">/metrics/prometheus endpoint</text>
  <line x1="580.0435" y1="351.3725" x2="580.0435" y2="389.0196" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="120.009" y="389.0196" width="280.021" height="56.4706" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="260.0196" y="424.1568" text-anchor="middle" font-size="16.3137" fill="var(--text)">Prometheus</text>
  <line x1="400.03" y1="416.6274" x2="480.036" y2="416.6274" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="480.036" y="389.0196" width="280.021" height="56.4706" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="620.0465" y="424.1568" text-anchor="middle" font-size="16.3137" fill="var(--text)">Grafana</text>
  <line x1="760.057" y1="416.6274" x2="840.0631" y2="416.6274" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="840.0631" y="389.0196" width="240.018" height="56.4706" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="960.072" y="424.1568" text-anchor="middle" font-size="16.3137" fill="var(--text)">Alerts</text>
  <rect x="60.0045" y="470.5882" width="1040.078" height="150.5882" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="100.0075" y="499.4509" font-size="16.3137" font-weight="bold" fill="var(--danger-accent)">Key alerts to set up:</text>
  <text x="120.009" y="524.549" font-size="15.0588" fill="var(--text)">• Job duration &gt; 2x historical average</text>
  <text x="120.009" y="547.1372" font-size="15.0588" fill="var(--text)">• Failed tasks &gt; 5% of total</text>
  <text x="120.009" y="569.7255" font-size="15.0588" fill="var(--text)">• Executor memory &gt; 90% usage</text>
  <text x="120.009" y="592.3137" font-size="15.0588" fill="var(--text)">• Row count anomaly (&lt; 50% of expected)</text>
</svg>
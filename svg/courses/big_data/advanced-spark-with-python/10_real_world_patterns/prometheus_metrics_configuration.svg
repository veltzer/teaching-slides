<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="72.48" text-anchor="middle" font-size="19.9811" font-weight="bold" fill="var(--primary-accent)">Spark Metrics to Prometheus</text>
  <rect x="82.8571" y="86.3999" width="1114.2856" height="266.8" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="125.7143" y="115.4" font-size="17.4834" font-weight="bold" fill="var(--primary-accent)">Spark Application</text>
  <text x="125.7143" y="144.3999" font-size="16.2346" font-weight="bold" fill="var(--text)">Driver Metrics:</text>
  <text x="147.1428" y="165.2799" font-size="13.737" font-family="monospace" fill="var(--text)">spark_driver_jvm_heap_used</text>
  <text x="147.1428" y="185" font-size="13.737" font-family="monospace" fill="var(--text)">spark_driver_active_tasks</text>
  <text x="147.1428" y="204.7199" font-size="13.737" font-family="monospace" fill="var(--text)">spark_driver_completed_tasks</text>
  <text x="147.1428" y="224.4399" font-size="13.737" font-family="monospace" fill="var(--text)">spark_driver_failed_tasks</text>
  <text x="661.4286" y="144.3999" font-size="16.2346" font-weight="bold" fill="var(--text)">Executor Metrics:</text>
  <text x="682.8571" y="165.2799" font-size="13.737" font-family="monospace" fill="var(--text)">spark_executor_jvm_heap_used</text>
  <text x="682.8571" y="185" font-size="13.737" font-family="monospace" fill="var(--text)">spark_executor_gc_time_total</text>
  <text x="682.8571" y="204.7199" font-size="13.737" font-family="monospace" fill="var(--text)">spark_executor_shuffle_read_bytes</text>
  <text x="682.8571" y="224.4399" font-size="13.737" font-family="monospace" fill="var(--text)">spark_executor_shuffle_write_bytes</text>
  <text x="639.9999" y="330" text-anchor="middle" font-size="14.9858" fill="var(--text-muted)">/metrics/prometheus endpoint</text>
  <line x1="639.9999" y1="353.1999" x2="639.9999" y2="388" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="147.1428" y="388" width="300" height="52.2" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="297.1429" y="420.4799" text-anchor="middle" font-size="16.2346" fill="var(--text)">Prometheus</text>
  <line x1="447.1428" y1="413.5199" x2="532.8571" y2="413.5199" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="532.8571" y="388" width="300" height="52.2" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="682.8571" y="420.4799" text-anchor="middle" font-size="16.2346" fill="var(--text)">Grafana</text>
  <line x1="832.8571" y1="413.5199" x2="918.5715" y2="413.5199" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="918.5715" y="388" width="257.1428" height="52.2" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1047.1428" y="420.4799" text-anchor="middle" font-size="16.2346" fill="var(--text)">Alerts</text>
  <rect x="82.8571" y="463.3999" width="1114.2856" height="139.2" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="125.7143" y="490.0799" font-size="16.2346" font-weight="bold" fill="var(--danger-accent)">Key alerts to set up:</text>
  <text x="147.1428" y="513.28" font-size="14.9858" fill="var(--text)">• Job duration &gt; 2x historical average</text>
  <text x="147.1428" y="534.1599" font-size="14.9858" fill="var(--text)">• Failed tasks &gt; 5% of total</text>
  <text x="147.1428" y="555.04" font-size="14.9858" fill="var(--text)">• Executor memory &gt; 90% usage</text>
  <text x="147.1428" y="575.92" font-size="14.9858" fill="var(--text)">• Row count anomaly (&lt; 50% of expected)</text>
</svg>
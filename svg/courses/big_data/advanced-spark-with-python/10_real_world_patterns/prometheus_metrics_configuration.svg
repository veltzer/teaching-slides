<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="21.688959" font-weight="bold" fill="var(--primary-accent)">Spark Metrics to Prometheus</text>
  <rect x="40" y="55.229653" width="1200" height="291.903775" rx="6.512842" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153912" y="86.958433" font-size="18.977771" font-weight="bold" fill="var(--primary-accent)">Spark Application</text>
  <text x="86.153912" y="118.686995" font-size="17.622231" font-weight="bold" fill="var(--text)">Driver Metrics:</text>
  <text x="109.230761" y="141.531638" font-size="14.911152" font-family="monospace" fill="var(--text)">spark_driver_jvm_heap_used</text>
  <text x="109.230761" y="163.107244" font-size="14.911152" font-family="monospace" fill="var(--text)">spark_driver_active_tasks</text>
  <text x="109.230761" y="184.682631" font-size="14.911152" font-family="monospace" fill="var(--text)">spark_driver_completed_tasks</text>
  <text x="109.230761" y="206.258128" font-size="14.911152" font-family="monospace" fill="var(--text)">spark_driver_failed_tasks</text>
  <text x="663.077064" y="118.686995" font-size="17.622231" font-weight="bold" fill="var(--text)">Executor Metrics:</text>
  <text x="686.153912" y="141.531638" font-size="14.911152" font-family="monospace" fill="var(--text)">spark_executor_jvm_heap_used</text>
  <text x="686.153912" y="163.107244" font-size="14.911152" font-family="monospace" fill="var(--text)">spark_executor_gc_time_total</text>
  <text x="686.153912" y="184.682631" font-size="14.911152" font-family="monospace" fill="var(--text)">spark_executor_shuffle_read_bytes</text>
  <text x="686.153912" y="206.258128" font-size="14.911152" font-family="monospace" fill="var(--text)">spark_executor_shuffle_write_bytes</text>
  <text x="640" y="321.7506" text-anchor="middle" font-size="16.266692" fill="var(--text-muted)">/metrics/prometheus endpoint</text>
  <line x1="640" y1="347.133428" x2="640" y2="385.207943" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="109.230761" y="385.207943" width="323.076956" height="57.111608" rx="6.512842" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270.769347" y="420.743945" text-anchor="middle" font-size="17.622231" fill="var(--text)">Prometheus</text>
  <line x1="432.307717" y1="413.129064" x2="524.615434" y2="413.129064" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="524.615434" y="385.207943" width="323.076956" height="57.111608" rx="6.512842" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="686.153912" y="420.743945" text-anchor="middle" font-size="17.622231" fill="var(--text)">Grafana</text>
  <line x1="847.692391" y1="413.129064" x2="940.000215" y2="413.129064" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="940.000215" y="385.207943" width="276.923044" height="57.111608" rx="6.512842" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1078.46163" y="420.743945" text-anchor="middle" font-size="17.622231" fill="var(--text)">Alerts</text>
  <rect x="40" y="467.702378" width="1200" height="152.297622" rx="6.512842" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="86.153912" y="496.892756" font-size="17.622231" font-weight="bold" fill="var(--danger-accent)">Key alerts to set up:</text>
  <text x="109.230761" y="522.275802" font-size="16.266692" fill="var(--text)">• Job duration &gt; 2x historical average</text>
  <text x="109.230761" y="545.120336" font-size="16.266692" fill="var(--text)">• Failed tasks &gt; 5% of total</text>
  <text x="109.230761" y="567.965089" font-size="16.266692" fill="var(--text)">• Executor memory &gt; 90% usage</text>
  <text x="109.230761" y="590.809732" font-size="16.266692" fill="var(--text)">• Row count anomaly (&lt; 50% of expected)</text>
</svg>
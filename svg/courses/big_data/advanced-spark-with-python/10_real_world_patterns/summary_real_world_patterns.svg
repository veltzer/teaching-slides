<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0002" y="74.1176" text-anchor="middle" font-size="19.6092" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Key Takeaways</text>
  <line x1="62.2224" y1="85.4901" x2="1217.7779" y2="85.4901" stroke="var(--primary-border)" stroke-width="1.2308" />
  <text x="84.4445" y="117.3333" font-size="17.1581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pipeline Design:</text>
  <text x="106.6667" y="140.0784" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Use Bronze/Silver/Gold layered architecture</text>
  <text x="106.6667" y="160.549" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Separate extract, transform, load concerns</text>
  <text x="106.6667" y="181.0195" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Make every step idempotent (safe to re-run)</text>
  <text x="84.4445" y="219.6862" font-size="17.1581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Management:</text>
  <text x="106.6667" y="242.4314" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• SCD Type 1 for simple overwrites</text>
  <text x="106.6667" y="262.902" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• SCD Type 2 for full history tracking</text>
  <text x="106.6667" y="283.3725" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Use Delta Lake MERGE for all upsert patterns</text>
  <text x="106.6667" y="303.8431" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Handle schema evolution with mergeSchema</text>
  <text x="84.4445" y="342.5098" font-size="17.1581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Quality:</text>
  <text x="106.6667" y="365.2549" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Validate at each layer boundary</text>
  <text x="106.6667" y="385.7255" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Check nulls, ranges, uniqueness, referential</text>
  <text x="106.6667" y="406.1961" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Fail fast on critical violations</text>
  <text x="106.6667" y="426.6666" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Use Great Expectations for complex rules</text>
  <text x="84.4445" y="465.3333" font-size="17.1581" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Operations:</text>
  <text x="106.6667" y="488.0785" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Checkpoint streams for exactly-once</text>
  <text x="106.6667" y="508.549" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Monitor with Prometheus + Grafana</text>
  <text x="106.6667" y="529.0195" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Alert on data freshness and anomalies</text>
  <text x="106.6667" y="549.4902" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Right-size clusters and use spot instances</text>
  <text x="106.6667" y="569.9607" font-size="14.7069" fill="var(--text)" font-family="Arial, sans-serif">• Use dynamic allocation to scale with demand</text>
</svg>
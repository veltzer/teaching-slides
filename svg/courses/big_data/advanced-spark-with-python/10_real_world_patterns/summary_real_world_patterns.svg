<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="20.7081" y="12.3077" width="1118.2417" height="627.6923" rx="6.1539" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.4616" />
  <ns0:text x="579.8291" y="49.2307" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="#4a90e2">Key Takeaways</ns0:text>
  <ns0:line x1="41.4164" y1="61.5384" x2="1118.2417" y2="61.5384" stroke="#4a90e2" stroke-width="1.2308" />
  <ns0:text x="62.1245" y="96" font-size="17.2308" font-weight="bold" fill="#333">Pipeline Design:</ns0:text>
  <ns0:text x="82.8327" y="120.6154" font-size="14.7692" fill="#333">• Use Bronze/Silver/Gold layered architecture</ns0:text>
  <ns0:text x="82.8327" y="142.7692" font-size="14.7692" fill="#333">• Separate extract, transform, load concerns</ns0:text>
  <ns0:text x="82.8327" y="164.923" font-size="14.7692" fill="#333">• Make every step idempotent (safe to re-run)</ns0:text>
  <ns0:text x="62.1245" y="206.7692" font-size="17.2308" font-weight="bold" fill="#333">Data Management:</ns0:text>
  <ns0:text x="82.8327" y="231.3846" font-size="14.7692" fill="#333">• SCD Type 1 for simple overwrites</ns0:text>
  <ns0:text x="82.8327" y="253.5385" font-size="14.7692" fill="#333">• SCD Type 2 for full history tracking</ns0:text>
  <ns0:text x="82.8327" y="275.6923" font-size="14.7692" fill="#333">• Use Delta Lake MERGE for all upsert patterns</ns0:text>
  <ns0:text x="82.8327" y="297.8461" font-size="14.7692" fill="#333">• Handle schema evolution with mergeSchema</ns0:text>
  <ns0:text x="62.1245" y="339.6923" font-size="17.2308" font-weight="bold" fill="#333">Data Quality:</ns0:text>
  <ns0:text x="82.8327" y="364.3077" font-size="14.7692" fill="#333">• Validate at each layer boundary</ns0:text>
  <ns0:text x="82.8327" y="386.4615" font-size="14.7692" fill="#333">• Check nulls, ranges, uniqueness, referential</ns0:text>
  <ns0:text x="82.8327" y="408.6154" font-size="14.7692" fill="#333">• Fail fast on critical violations</ns0:text>
  <ns0:text x="82.8327" y="430.7692" font-size="14.7692" fill="#333">• Use Great Expectations for complex rules</ns0:text>
  <ns0:text x="62.1245" y="472.6154" font-size="17.2308" font-weight="bold" fill="#333">Operations:</ns0:text>
  <ns0:text x="82.8327" y="497.2308" font-size="14.7692" fill="#333">• Checkpoint streams for exactly-once</ns0:text>
  <ns0:text x="82.8327" y="519.3846" font-size="14.7692" fill="#333">• Monitor with Prometheus + Grafana</ns0:text>
  <ns0:text x="82.8327" y="541.5384" font-size="14.7692" fill="#333">• Alert on data freshness and anomalies</ns0:text>
  <ns0:text x="82.8327" y="563.6923" font-size="14.7692" fill="#333">• Right-size clusters and use spot instances</ns0:text>
  <ns0:text x="82.8327" y="585.8461" font-size="14.7692" fill="#333">• Use dynamic allocation to scale with demand</ns0:text>
</ns0:svg>
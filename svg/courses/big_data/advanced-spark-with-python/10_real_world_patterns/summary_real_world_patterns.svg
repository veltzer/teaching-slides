<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="22.8571" y="13.5849" width="1234.2857" height="692.8302" rx="6.7925" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.717" />
  <text x="640" y="54.3396" text-anchor="middle" font-size="21.7358" font-weight="bold" fill="#4a90e2">Key Takeaways</text>
  <line x1="45.7143" y1="67.9245" x2="1234.2857" y2="67.9245" stroke="#4a90e2" stroke-width="1.3585" />
  <text x="68.5714" y="105.9623" font-size="19.0189" font-weight="bold" fill="#333">Pipeline Design:</text>
  <text x="91.4286" y="133.1321" font-size="16.3019" fill="#333">• Use Bronze/Silver/Gold layered architecture</text>
  <text x="91.4286" y="157.5849" font-size="16.3019" fill="#333">• Separate extract, transform, load concerns</text>
  <text x="91.4286" y="182.0377" font-size="16.3019" fill="#333">• Make every step idempotent (safe to re-run)</text>
  <text x="68.5714" y="228.2264" font-size="19.0189" font-weight="bold" fill="#333">Data Management:</text>
  <text x="91.4286" y="255.3962" font-size="16.3019" fill="#333">• SCD Type 1 for simple overwrites</text>
  <text x="91.4286" y="279.8491" font-size="16.3019" fill="#333">• SCD Type 2 for full history tracking</text>
  <text x="91.4286" y="304.3019" font-size="16.3019" fill="#333">• Use Delta Lake MERGE for all upsert patterns</text>
  <text x="91.4286" y="328.7547" font-size="16.3019" fill="#333">• Handle schema evolution with mergeSchema</text>
  <text x="68.5714" y="374.9434" font-size="19.0189" font-weight="bold" fill="#333">Data Quality:</text>
  <text x="91.4286" y="402.1132" font-size="16.3019" fill="#333">• Validate at each layer boundary</text>
  <text x="91.4286" y="426.566" font-size="16.3019" fill="#333">• Check nulls, ranges, uniqueness, referential</text>
  <text x="91.4286" y="451.0189" font-size="16.3019" fill="#333">• Fail fast on critical violations</text>
  <text x="91.4286" y="475.4717" font-size="16.3019" fill="#333">• Use Great Expectations for complex rules</text>
  <text x="68.5714" y="521.6604" font-size="19.0189" font-weight="bold" fill="#333">Operations:</text>
  <text x="91.4286" y="548.8302" font-size="16.3019" fill="#333">• Checkpoint streams for exactly-once</text>
  <text x="91.4286" y="573.283" font-size="16.3019" fill="#333">• Monitor with Prometheus + Grafana</text>
  <text x="91.4286" y="597.7358" font-size="16.3019" fill="#333">• Alert on data freshness and anomalies</text>
  <text x="91.4286" y="622.1887" font-size="16.3019" fill="#333">• Right-size clusters and use spot instances</text>
  <text x="91.4286" y="646.6415" font-size="16.3019" fill="#333">• Use dynamic allocation to scale with demand</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 530" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="540" height="510" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="280" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">Key Takeaways</text>
  <line x1="20" y1="50" x2="540" y2="50" stroke="#4a90e2" stroke-width="1"/>
  <text x="30" y="78" font-size="14" font-weight="bold" fill="#333">Pipeline Design:</text>
  <text x="40" y="98" font-size="12" fill="#333">&#x2022; Use Bronze/Silver/Gold layered architecture</text>
  <text x="40" y="116" font-size="12" fill="#333">&#x2022; Separate extract, transform, load concerns</text>
  <text x="40" y="134" font-size="12" fill="#333">&#x2022; Make every step idempotent (safe to re-run)</text>
  <text x="30" y="168" font-size="14" font-weight="bold" fill="#333">Data Management:</text>
  <text x="40" y="188" font-size="12" fill="#333">&#x2022; SCD Type 1 for simple overwrites</text>
  <text x="40" y="206" font-size="12" fill="#333">&#x2022; SCD Type 2 for full history tracking</text>
  <text x="40" y="224" font-size="12" fill="#333">&#x2022; Use Delta Lake MERGE for all upsert patterns</text>
  <text x="40" y="242" font-size="12" fill="#333">&#x2022; Handle schema evolution with mergeSchema</text>
  <text x="30" y="276" font-size="14" font-weight="bold" fill="#333">Data Quality:</text>
  <text x="40" y="296" font-size="12" fill="#333">&#x2022; Validate at each layer boundary</text>
  <text x="40" y="314" font-size="12" fill="#333">&#x2022; Check nulls, ranges, uniqueness, referential</text>
  <text x="40" y="332" font-size="12" fill="#333">&#x2022; Fail fast on critical violations</text>
  <text x="40" y="350" font-size="12" fill="#333">&#x2022; Use Great Expectations for complex rules</text>
  <text x="30" y="384" font-size="14" font-weight="bold" fill="#333">Operations:</text>
  <text x="40" y="404" font-size="12" fill="#333">&#x2022; Checkpoint streams for exactly-once</text>
  <text x="40" y="422" font-size="12" fill="#333">&#x2022; Monitor with Prometheus + Grafana</text>
  <text x="40" y="440" font-size="12" fill="#333">&#x2022; Alert on data freshness and anomalies</text>
  <text x="40" y="458" font-size="12" fill="#333">&#x2022; Right-size clusters and use spot instances</text>
  <text x="40" y="476" font-size="12" fill="#333">&#x2022; Use dynamic allocation to scale with demand</text>
</svg>

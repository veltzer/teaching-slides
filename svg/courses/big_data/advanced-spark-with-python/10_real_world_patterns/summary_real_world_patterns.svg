<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="20.7081" y="12.3077" width="1118.2417" height="627.6923" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="579.8291" y="49.2307" text-anchor="middle" font-size="19.6923" font-weight="bold" fill="var(--primary-accent)">Key Takeaways</text>
  <line x1="41.4164" y1="61.5384" x2="1118.2417" y2="61.5384" stroke="var(--primary-border)" stroke-width="1.2308" />
  <text x="62.1245" y="96" font-size="17.2308" font-weight="bold" fill="var(--text)">Pipeline Design:</text>
  <text x="82.8327" y="120.6154" font-size="14.7692" fill="var(--text)">• Use Bronze/Silver/Gold layered architecture</text>
  <text x="82.8327" y="142.7692" font-size="14.7692" fill="var(--text)">• Separate extract, transform, load concerns</text>
  <text x="82.8327" y="164.923" font-size="14.7692" fill="var(--text)">• Make every step idempotent (safe to re-run)</text>
  <text x="62.1245" y="206.7692" font-size="17.2308" font-weight="bold" fill="var(--text)">Data Management:</text>
  <text x="82.8327" y="231.3846" font-size="14.7692" fill="var(--text)">• SCD Type 1 for simple overwrites</text>
  <text x="82.8327" y="253.5385" font-size="14.7692" fill="var(--text)">• SCD Type 2 for full history tracking</text>
  <text x="82.8327" y="275.6923" font-size="14.7692" fill="var(--text)">• Use Delta Lake MERGE for all upsert patterns</text>
  <text x="82.8327" y="297.8461" font-size="14.7692" fill="var(--text)">• Handle schema evolution with mergeSchema</text>
  <text x="62.1245" y="339.6923" font-size="17.2308" font-weight="bold" fill="var(--text)">Data Quality:</text>
  <text x="82.8327" y="364.3077" font-size="14.7692" fill="var(--text)">• Validate at each layer boundary</text>
  <text x="82.8327" y="386.4615" font-size="14.7692" fill="var(--text)">• Check nulls, ranges, uniqueness, referential</text>
  <text x="82.8327" y="408.6154" font-size="14.7692" fill="var(--text)">• Fail fast on critical violations</text>
  <text x="82.8327" y="430.7692" font-size="14.7692" fill="var(--text)">• Use Great Expectations for complex rules</text>
  <text x="62.1245" y="472.6154" font-size="17.2308" font-weight="bold" fill="var(--text)">Operations:</text>
  <text x="82.8327" y="497.2308" font-size="14.7692" fill="var(--text)">• Checkpoint streams for exactly-once</text>
  <text x="82.8327" y="519.3846" font-size="14.7692" fill="var(--text)">• Monitor with Prometheus + Grafana</text>
  <text x="82.8327" y="541.5384" font-size="14.7692" fill="var(--text)">• Alert on data freshness and anomalies</text>
  <text x="82.8327" y="563.6923" font-size="14.7692" fill="var(--text)">• Right-size clusters and use spot instances</text>
  <text x="82.8327" y="585.8461" font-size="14.7692" fill="var(--text)">• Use dynamic allocation to scale with demand</text>
</svg>
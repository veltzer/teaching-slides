<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000051923079" y="40" text-anchor="middle" font-size="21.612099300097" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Key Takeaways</text>
  <line x1="40" y1="53.302695953619" x2="1240" y2="53.302695953619" stroke="var(--primary-border)" stroke-width="1.2308"/>
  <text x="63.076797263308" y="90.550478568725" font-size="18.910641994625" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pipeline Design:</text>
  <text x="86.153698372774" y="117.155987448449" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Use Bronze/Silver/Gold layered architecture</text>
  <text x="86.153698372774" y="141.100957137449" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Separate extract, transform, load concerns</text>
  <text x="86.153698372774" y="165.045809853964" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Make every step idempotent (safe to re-run)</text>
  <text x="63.076797263308" y="210.275210041241" font-size="18.910641994625" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Management:</text>
  <text x="86.153698372774" y="236.880835893451" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• SCD Type 1 for simple overwrites</text>
  <text x="86.153698372774" y="260.825805582451" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• SCD Type 2 for full history tracking</text>
  <text x="86.153698372774" y="284.770658298966" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Use Delta Lake MERGE for all upsert patterns</text>
  <text x="86.153698372774" y="308.715627987966" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Handle schema evolution with mergeSchema</text>
  <text x="63.076797263308" y="353.945028175243" font-size="18.910641994625" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Quality:</text>
  <text x="86.153698372774" y="380.550537054968" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Validate at each layer boundary</text>
  <text x="86.153698372774" y="404.495506743968" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Check nulls, ranges, uniqueness, referential</text>
  <text x="86.153698372774" y="428.440476432968" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Fail fast on critical violations</text>
  <text x="86.153698372774" y="452.385329149483" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Use Great Expectations for complex rules</text>
  <text x="63.076797263308" y="497.61472933676" font-size="18.910641994625" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Operations:</text>
  <text x="86.153698372774" y="524.22035518897" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Checkpoint streams for exactly-once</text>
  <text x="86.153698372774" y="548.165207905485" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Monitor with Prometheus + Grafana</text>
  <text x="86.153698372774" y="572.110060621999" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Alert on data freshness and anomalies</text>
  <text x="86.153698372774" y="596.055147283485" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Right-size clusters and use spot instances</text>
  <text x="86.153698372774" y="620" font-size="16.209074475073" fill="var(--text)" font-family="Arial, sans-serif">• Use dynamic allocation to scale with demand</text>
</svg>

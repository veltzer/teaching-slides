<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1565c0">Partition Distribution Across a Cluster</text>

  <!-- Driver -->
  <rect x="300" y="45" width="200" height="50" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="400" y="67" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e65100">Driver Node</text>
  <text x="400" y="85" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Partition metadata + DAG</text>

  <!-- Arrows from driver to executors -->
  <line x1="320" y1="95" x2="130" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="95" x2="400" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="95" x2="670" y2="135" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Executor 1 -->
  <rect x="20" y="140" width="220" height="170" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="130" y="165" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Executor 1 (4 cores)</text>
  <rect x="35" y="180" width="90" height="35" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="80" y="195" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1565c0">P0</text>
  <text x="80" y="208" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <rect x="135" y="180" width="90" height="35" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="180" y="195" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1565c0">P1</text>
  <text x="180" y="208" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <rect x="35" y="225" width="90" height="35" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="80" y="240" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1565c0">P2</text>
  <text x="80" y="253" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <rect x="135" y="225" width="90" height="35" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="180" y="240" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#1565c0">P3</text>
  <text x="180" y="253" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <text x="130" y="288" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">4 tasks in parallel</text>

  <!-- Executor 2 -->
  <rect x="290" y="140" width="220" height="170" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="165" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Executor 2 (4 cores)</text>
  <rect x="305" y="180" width="90" height="35" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="350" y="195" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2e7d32">P4</text>
  <text x="350" y="208" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <rect x="405" y="180" width="90" height="35" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="450" y="195" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2e7d32">P5</text>
  <text x="450" y="208" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <rect x="305" y="225" width="90" height="35" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="350" y="240" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2e7d32">P6</text>
  <text x="350" y="253" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <rect x="405" y="225" width="90" height="35" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="450" y="240" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2e7d32">P7</text>
  <text x="450" y="253" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <text x="400" y="288" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">4 tasks in parallel</text>

  <!-- Executor 3 -->
  <rect x="560" y="140" width="220" height="170" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="670" y="165" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Executor 3 (4 cores)</text>
  <rect x="575" y="180" width="90" height="35" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1"/>
  <text x="620" y="195" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#6a1b9a">P8</text>
  <text x="620" y="208" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <rect x="675" y="180" width="90" height="35" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1"/>
  <text x="720" y="195" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#6a1b9a">P9</text>
  <text x="720" y="208" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <rect x="575" y="225" width="90" height="35" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1"/>
  <text x="620" y="240" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#6a1b9a">P10</text>
  <text x="620" y="253" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <rect x="675" y="225" width="90" height="35" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1"/>
  <text x="720" y="240" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#6a1b9a">P11</text>
  <text x="720" y="253" text-anchor="middle" font-family="Arial" font-size="9" fill="#333">25K records</text>
  <text x="670" y="288" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">4 tasks in parallel</text>

  <!-- Summary -->
  <rect x="100" y="330" width="600" height="55" rx="8" fill="#f5f5f5" stroke="#757575" stroke-width="1.5"/>
  <text x="400" y="352" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">12 Partitions / 3 Executors / 4 Cores each = 12 parallel tasks</text>
  <text x="400" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Rule of thumb: 2-4 partitions per core for optimal parallelism</text>
</svg>

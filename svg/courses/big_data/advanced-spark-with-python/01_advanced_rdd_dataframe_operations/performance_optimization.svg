<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="27.5716" font-weight="bold" fill="var(--primary-accent)">Spark Performance Optimization Strategies</text>
  <rect x="555.753" y="211.967" width="168.493" height="168.493" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9091"/>
  <text x="640" y="289.1747" text-anchor="middle" font-family="Arial" font-size="19.9128" font-weight="bold" fill="var(--primary-accent)">Performance</text>
  <text x="640" y="313.1068" text-anchor="middle" font-family="Arial" font-size="19.9128" font-weight="bold" fill="var(--primary-accent)">Tuning</text>
  <line x1="564.9999" y1="239.9029" x2="365" y2="120.2427" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="73.3333" y="70.9709" width="300" height="154.8544" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="223.3333" y="103.3495" text-anchor="middle" font-family="Arial" font-size="19.9128" font-weight="bold" fill="var(--primary-accent)">Memory</text>
  <text x="223.3333" y="131.5048" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">memory.fraction = 0.8</text>
  <text x="223.3333" y="154.0291" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">storageFraction = 0.3</text>
  <text x="223.3333" y="176.5534" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Off-heap memory</text>
  <text x="223.3333" y="199.0776" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Serialization tuning</text>
  <line x1="714.9999" y1="239.9029" x2="915" y2="120.2427" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="906.6667" y="70.9709" width="300" height="154.8544" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1056.6666" y="103.3495" text-anchor="middle" font-family="Arial" font-size="19.9128" font-weight="bold" fill="var(--ok-accent)">CPU</text>
  <text x="1056.6666" y="131.5048" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Partition sizing</text>
  <text x="1056.6666" y="154.0291" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Task scheduling</text>
  <text x="1056.6666" y="176.5534" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Resource allocation</text>
  <text x="1056.6666" y="199.0776" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Kryo serialization</text>
  <line x1="731.6667" y1="296.2135" x2="898.3333" y2="338.4466" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="906.6667" y="275.0971" width="333.3333" height="154.8544" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1073.3333" y="307.4757" text-anchor="middle" font-family="Arial" font-size="19.9128" font-weight="bold" fill="var(--warn-accent)">Network / Shuffle</text>
  <text x="1073.3333" y="335.631" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Broadcast joins</text>
  <text x="1073.3333" y="358.1553" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Shuffle compression</text>
  <text x="1073.3333" y="380.6796" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Reduce partitions</text>
  <text x="1073.3333" y="403.2039" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Coalesce vs Repartition</text>
  <line x1="548.3333" y1="296.2135" x2="381.6666" y2="338.4466" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="275.0971" width="333.3333" height="154.8544" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="206.6667" y="307.4757" text-anchor="middle" font-family="Arial" font-size="19.9128" font-weight="bold" fill="var(--info-accent)">Storage / Caching</text>
  <text x="206.6667" y="335.631" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Persist with right level</text>
  <text x="206.6667" y="358.1553" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Unpersist when done</text>
  <text x="206.6667" y="380.6796" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Columnar formats</text>
  <text x="206.6667" y="403.2039" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Predicate pushdown</text>
  <line x1="590" y1="366.6019" x2="390" y2="507.3787" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="73.3333" y="479.2233" width="333.3333" height="140.7767" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="240" y="511.6019" text-anchor="middle" font-family="Arial" font-size="19.9128" font-weight="bold" fill="var(--danger-accent)">Query / Code</text>
  <text x="240" y="539.7573" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Filter early (pushdown)</text>
  <text x="240" y="562.2815" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Column pruning</text>
  <text x="240" y="584.8059" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Avoid Python UDFs</text>
  <text x="240" y="607.3301" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Use built-in functions</text>
  <line x1="689.9999" y1="366.6019" x2="890" y2="507.3787" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="873.3332" y="479.2233" width="366.6666" height="140.7767" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1056.6666" y="511.6019" text-anchor="middle" font-family="Arial" font-size="19.9128" font-weight="bold" fill="var(--ok-accent)">Adaptive Execution</text>
  <text x="1056.6666" y="539.7573" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">AQE coalesce partitions</text>
  <text x="1056.6666" y="562.2815" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Skew join optimization</text>
  <text x="1056.6666" y="584.8059" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Dynamic partition pruning</text>
  <text x="1056.6666" y="607.3301" text-anchor="middle" font-family="Arial" font-size="15.3176" fill="var(--text)">Runtime plan changes</text>
</svg>
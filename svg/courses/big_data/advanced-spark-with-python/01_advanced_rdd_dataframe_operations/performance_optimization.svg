<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="581.8182" y="40.7273" text-anchor="middle" font-family="Arial" font-size="26.1818" font-weight="bold" fill="var(--primary-accent)">Spark Performance Optimization Strategies</text>
  <circle cx="581.8182" cy="305.4545" r="80" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9091" />
  <text x="581.8182" y="298.1818" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--primary-accent)">Performance</text>
  <text x="581.8182" y="322.9091" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--primary-accent)">Tuning</text>
  <line x1="516.3636" y1="247.2727" x2="341.8182" y2="123.6364" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="87.2727" y="72.7273" width="261.8182" height="160" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="218.1818" y="106.1818" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--primary-accent)">Memory</text>
  <text x="218.1818" y="135.2727" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">memory.fraction = 0.8</text>
  <text x="218.1818" y="158.5455" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">storageFraction = 0.3</text>
  <text x="218.1818" y="181.8182" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Off-heap memory</text>
  <text x="218.1818" y="205.0909" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Serialization tuning</text>
  <line x1="647.2727" y1="247.2727" x2="821.8182" y2="123.6364" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="814.5455" y="72.7273" width="261.8182" height="160" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="945.4545" y="106.1818" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--ok-accent)">CPU</text>
  <text x="945.4545" y="135.2727" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Partition sizing</text>
  <text x="945.4545" y="158.5455" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Task scheduling</text>
  <text x="945.4545" y="181.8182" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Resource allocation</text>
  <text x="945.4545" y="205.0909" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Kryo serialization</text>
  <line x1="661.8182" y1="305.4545" x2="807.2727" y2="349.0909" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="814.5455" y="283.6364" width="290.9091" height="160" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="960" y="317.0909" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--warn-accent)">Network / Shuffle</text>
  <text x="960" y="346.1818" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Broadcast joins</text>
  <text x="960" y="369.4545" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Shuffle compression</text>
  <text x="960" y="392.7273" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Reduce partitions</text>
  <text x="960" y="416" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Coalesce vs Repartition</text>
  <line x1="501.8182" y1="305.4545" x2="356.3636" y2="349.0909" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="58.1818" y="283.6364" width="290.9091" height="160" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="203.6364" y="317.0909" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--info-accent)">Storage / Caching</text>
  <text x="203.6364" y="346.1818" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Persist with right level</text>
  <text x="203.6364" y="369.4545" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Unpersist when done</text>
  <text x="203.6364" y="392.7273" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Columnar formats</text>
  <text x="203.6364" y="416" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Predicate pushdown</text>
  <line x1="538.1818" y1="378.1818" x2="363.6364" y2="523.6364" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="87.2727" y="494.5455" width="290.9091" height="145.4545" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="232.7273" y="528" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--danger-accent)">Query / Code</text>
  <text x="232.7273" y="557.0909" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Filter early (pushdown)</text>
  <text x="232.7273" y="580.3636" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Column pruning</text>
  <text x="232.7273" y="603.6364" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Avoid Python UDFs</text>
  <text x="232.7273" y="626.9091" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Use built-in functions</text>
  <line x1="625.4545" y1="378.1818" x2="800" y2="523.6364" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="785.4545" y="494.5455" width="320" height="145.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="945.4545" y="528" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--ok-accent)">Adaptive Execution</text>
  <text x="945.4545" y="557.0909" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">AQE coalesce partitions</text>
  <text x="945.4545" y="580.3636" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Skew join optimization</text>
  <text x="945.4545" y="603.6364" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Dynamic partition pruning</text>
  <text x="945.4545" y="626.9091" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Runtime plan changes</text>
</svg>
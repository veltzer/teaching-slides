<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1565c0">Spark Performance Optimization Strategies</text>

  <!-- Central hub -->
  <circle cx="400" cy="210" r="55" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="205" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Performance</text>
  <text x="400" y="222" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Tuning</text>

  <!-- Memory Optimization (top left) -->
  <line x1="355" y1="170" x2="235" y2="85" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="50" width="180" height="110" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="150" y="73" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Memory</text>
  <text x="150" y="93" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">memory.fraction = 0.8</text>
  <text x="150" y="109" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">storageFraction = 0.3</text>
  <text x="150" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Off-heap memory</text>
  <text x="150" y="141" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Serialization tuning</text>

  <!-- CPU Optimization (top right) -->
  <line x1="445" y1="170" x2="565" y2="85" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="50" width="180" height="110" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="650" y="73" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">CPU</text>
  <text x="650" y="93" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Partition sizing</text>
  <text x="650" y="109" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Task scheduling</text>
  <text x="650" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Resource allocation</text>
  <text x="650" y="141" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Kryo serialization</text>

  <!-- Network Optimization (right) -->
  <line x1="455" y1="210" x2="555" y2="240" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="560" y="195" width="200" height="110" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="660" y="218" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Network / Shuffle</text>
  <text x="660" y="238" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Broadcast joins</text>
  <text x="660" y="254" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Shuffle compression</text>
  <text x="660" y="270" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Reduce partitions</text>
  <text x="660" y="286" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Coalesce vs Repartition</text>

  <!-- Storage Optimization (left) -->
  <line x1="345" y1="210" x2="245" y2="240" stroke="#6a1b9a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="195" width="200" height="110" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="140" y="218" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Storage / Caching</text>
  <text x="140" y="238" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Persist with right level</text>
  <text x="140" y="254" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Unpersist when done</text>
  <text x="140" y="270" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Columnar formats</text>
  <text x="140" y="286" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Predicate pushdown</text>

  <!-- Query Optimization (bottom left) -->
  <line x1="370" y1="260" x2="250" y2="360" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="340" width="200" height="100" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="160" y="363" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c62828">Query / Code</text>
  <text x="160" y="383" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Filter early (pushdown)</text>
  <text x="160" y="399" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Column pruning</text>
  <text x="160" y="415" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Avoid Python UDFs</text>
  <text x="160" y="431" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Use built-in functions</text>

  <!-- Adaptive Execution (bottom right) -->
  <line x1="430" y1="260" x2="550" y2="360" stroke="#00695c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="540" y="340" width="220" height="100" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
  <text x="650" y="363" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#00695c">Adaptive Execution</text>
  <text x="650" y="383" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">AQE coalesce partitions</text>
  <text x="650" y="399" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Skew join optimization</text>
  <text x="650" y="415" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Dynamic partition pruning</text>
  <text x="650" y="431" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Runtime plan changes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.5716" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Performance Optimization Strategies</text>
  <rect x="555.753" y="211.967" width="168.493" height="168.493" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9091" filter="url(#shadow)"/>
  <text x="640" y="289.1747" text-anchor="middle" font-size="19.9128" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Performance</text>
  <text x="640" y="313.1068" text-anchor="middle" font-size="19.9128" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Tuning</text>
  <line x1="564.9999" y1="239.9029" x2="365" y2="120.2427" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="73.3333" y="70.9709" width="300" height="154.8544" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="223.3333" y="103.3495" text-anchor="middle" font-size="19.9128" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Memory</text>
  <text x="223.3333" y="131.5048" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">memory.fraction = 0.8</text>
  <text x="223.3333" y="154.0291" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">storageFraction = 0.3</text>
  <text x="223.3333" y="176.5534" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Off-heap memory</text>
  <text x="223.3333" y="199.0776" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Serialization tuning</text>
  <line x1="714.9999" y1="239.9029" x2="915" y2="120.2427" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="906.6667" y="70.9709" width="300" height="154.8544" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6666" y="103.3495" text-anchor="middle" font-size="19.9128" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">CPU</text>
  <text x="1056.6666" y="131.5048" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Partition sizing</text>
  <text x="1056.6666" y="154.0291" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Task scheduling</text>
  <text x="1056.6666" y="176.5534" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Resource allocation</text>
  <text x="1056.6666" y="199.0776" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Kryo serialization</text>
  <line x1="731.6667" y1="296.2135" x2="898.3333" y2="338.4466" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="906.6667" y="275.0971" width="333.3333" height="154.8544" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1073.3333" y="307.4757" text-anchor="middle" font-size="19.9128" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Network / Shuffle</text>
  <text x="1073.3333" y="335.631" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Broadcast joins</text>
  <text x="1073.3333" y="358.1553" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Shuffle compression</text>
  <text x="1073.3333" y="380.6796" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Reduce partitions</text>
  <text x="1073.3333" y="403.2039" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Coalesce vs Repartition</text>
  <line x1="548.3333" y1="296.2135" x2="381.6666" y2="338.4466" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="275.0971" width="333.3333" height="154.8544" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6667" y="307.4757" text-anchor="middle" font-size="19.9128" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Storage / Caching</text>
  <text x="206.6667" y="335.631" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Persist with right level</text>
  <text x="206.6667" y="358.1553" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Unpersist when done</text>
  <text x="206.6667" y="380.6796" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Columnar formats</text>
  <text x="206.6667" y="403.2039" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Predicate pushdown</text>
  <line x1="590" y1="366.6019" x2="390" y2="507.3787" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="73.3333" y="479.2233" width="333.3333" height="140.7767" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="511.6019" text-anchor="middle" font-size="19.9128" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Query / Code</text>
  <text x="240" y="539.7573" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Filter early (pushdown)</text>
  <text x="240" y="562.2815" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Column pruning</text>
  <text x="240" y="584.8059" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Avoid Python UDFs</text>
  <text x="240" y="607.3301" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Use built-in functions</text>
  <line x1="689.9999" y1="366.6019" x2="890" y2="507.3787" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="873.3332" y="479.2233" width="366.6666" height="140.7767" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1056.6666" y="511.6019" text-anchor="middle" font-size="19.9128" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Adaptive Execution</text>
  <text x="1056.6666" y="539.7573" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">AQE coalesce partitions</text>
  <text x="1056.6666" y="562.2815" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Skew join optimization</text>
  <text x="1056.6666" y="584.8059" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Dynamic partition pruning</text>
  <text x="1056.6666" y="607.3301" text-anchor="middle" font-size="15.3176" fill="var(--text)" font-family="Arial, sans-serif">Runtime plan changes</text>
</svg>

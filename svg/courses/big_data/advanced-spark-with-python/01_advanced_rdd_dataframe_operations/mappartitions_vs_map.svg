  <text x="521.6" y="243" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">DB Conn 1</text>
  <rect x="457.6" y="262.8" width="128" height="39.6" rx="6.4" fill="#ffab91" stroke="#d32f2f" stroke-width="1.6" />
  <text x="521.6" y="289.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">DB Conn 2</text>
  <rect x="457.6" y="309.6" width="128" height="39.6" rx="6.4" fill="#ffab91" stroke="#d32f2f" stroke-width="1.6" />
  <text x="521.6" y="336.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">DB Conn 3</text>

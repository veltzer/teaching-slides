  <text x="996.8" y="313.2" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Process all</text>
  <text x="996.8" y="338.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">records</text>
  <line x1="1068.8" y1="279" x2="1124.8" y2="279" stroke="#2e7d32" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="1129.6" y="243" width="88" height="72" rx="6.4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="1172.8" y="284.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Results</text>
  <text x="952" y="405" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#2e7d32" font-weight="bold">1 function call per partition</text>
  <text x="952" y="441" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#2e7d32" font-weight="bold">1 connection per partition</text>
  <text x="952" y="477" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Low overhead for I/O</text>
  <text x="952" y="513" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Lower GC pressure</text>
  <rect x="160" y="576" width="400" height="54" rx="8" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1.6" />
  <text x="360" y="612" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#d32f2f">1M records = 1M connections</text>
  <rect x="720" y="576" width="400" height="54" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="920" y="612" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#2e7d32">1M records = 100 connections</text>
  <text x="640" y="675" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#333">Use mapPartitions() for DB/network I/O operations</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.0672" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">mapPartitions() vs map()</text>
  <rect x="40" y="72.2222" width="584.2105" height="547.7778" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332.1052" y="112.5" text-anchor="middle" font-size="22.5559" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">map() - Per Element</text>
  <rect x="71.579" y="144.7222" width="157.8947" height="161.1112" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.5264" y="176.9444" text-anchor="middle" font-size="16.5411" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Partition</text>
  <rect x="87.3684" y="193.0555" width="126.3158" height="29" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4587"/>
  <text x="150.5264" y="213.9999" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">Record 1</text>
  <rect x="87.3684" y="230.1111" width="126.3158" height="29" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4587"/>
  <text x="150.5264" y="251.0555" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">Record 2</text>
  <rect x="87.3684" y="267.1667" width="126.3158" height="29" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4587"/>
  <text x="150.5264" y="288.1111" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">Record 3</text>
  <line x1="229.4736" y1="207.5555" x2="284.7369" y2="207.5555" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="229.4736" y1="244.6111" x2="284.7369" y2="244.6111" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="229.4736" y1="281.6666" x2="284.7369" y2="281.6666" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="289.4736" y="188.2222" width="110.5264" height="35.4445" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="344.7369" y="212.3889" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">f(rec1)</text>
  <rect x="289.4736" y="230.1111" width="110.5264" height="35.4445" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="344.7369" y="254.2778" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">f(rec2)</text>
  <rect x="289.4736" y="272" width="110.5264" height="35.4445" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="344.7369" y="296.1666" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">f(rec3)</text>
  <line x1="400" y1="205.9444" x2="455.2631" y2="205.9444" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="247.8333" x2="455.2631" y2="247.8333" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="289.7222" x2="455.2631" y2="289.7222" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460" y="185" width="126.3158" height="35.4445" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="523.1579" y="209.1667" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">DB Conn 1</text>
  <rect x="460" y="226.8888" width="126.3158" height="35.4445" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="523.1579" y="251.0555" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">DB Conn 2</text>
  <rect x="460" y="268.7777" width="126.3158" height="35.4445" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="523.1579" y="292.9444" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">DB Conn 3</text>
  <text x="332.1052" y="354.1667" text-anchor="middle" font-size="18.0448" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">N function calls</text>
  <text x="332.1052" y="386.3889" text-anchor="middle" font-size="18.0448" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">N connections opened</text>
  <text x="332.1052" y="418.6111" text-anchor="middle" font-size="16.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">High overhead for I/O</text>
  <text x="332.1052" y="450.8333" text-anchor="middle" font-size="16.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">Higher GC pressure</text>
  <rect x="655.7895" y="72.2222" width="584.2105" height="547.7778" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947.8947" y="112.5" text-anchor="middle" font-size="22.5559" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">mapPartitions() - Per Partition</text>
  <rect x="687.3684" y="144.7222" width="157.8947" height="161.1112" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="766.3157" y="176.9444" text-anchor="middle" font-size="16.5411" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Partition</text>
  <rect x="703.1579" y="193.0555" width="126.3158" height="29" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4587"/>
  <text x="766.3157" y="213.9999" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">Record 1</text>
  <rect x="703.1579" y="230.1111" width="126.3158" height="29" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4587"/>
  <text x="766.3157" y="251.0555" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">Record 2</text>
  <rect x="703.1579" y="267.1667" width="126.3158" height="29" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4587"/>
  <text x="766.3157" y="288.1111" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">Record 3</text>
  <line x1="845.2631" y1="241.3889" x2="916.3157" y2="241.3889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="921.0526" y="176.9444" width="142.1053" height="128.8889" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="992.1052" y="217.2222" text-anchor="middle" font-size="15.0373" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">f(iterator)</text>
  <text x="992.1052" y="246.2223" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">1 DB Conn</text>
  <text x="992.1052" y="272" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">Process all</text>
  <text x="992.1052" y="294.5555" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">records</text>
  <line x1="1063.1579" y1="241.3889" x2="1118.421" y2="241.3889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1123.1579" y="209.1667" width="86.8421" height="64.4444" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165.7895" y="246.2223" text-anchor="middle" font-size="15.0373" fill="var(--text)" font-family="Arial, sans-serif">Results</text>
  <text x="947.8947" y="354.1667" text-anchor="middle" font-size="18.0448" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">1 function call per partition</text>
  <text x="947.8947" y="386.3889" text-anchor="middle" font-size="18.0448" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">1 connection per partition</text>
  <text x="947.8947" y="418.6111" text-anchor="middle" font-size="16.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">Low overhead for I/O</text>
  <text x="947.8947" y="450.8333" text-anchor="middle" font-size="16.5411" fill="var(--text-muted)" font-family="Arial, sans-serif">Lower GC pressure</text>
  <rect x="166.3157" y="507.2222" width="394.7369" height="48.3334" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="363.6842" y="539.4444" text-anchor="middle" font-size="18.0448" fill="var(--danger-accent)" font-family="Arial, sans-serif">1M records = 1M connections</text>
  <rect x="718.9474" y="507.2222" width="394.7369" height="48.3334" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.3157" y="539.4444" text-anchor="middle" font-size="18.0448" fill="var(--ok-accent)" font-family="Arial, sans-serif">1M records = 100 connections</text>
  <text x="640" y="595.8333" text-anchor="middle" font-size="19.5485" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Use mapPartitions() for DB/network I/O operations</text>
</svg>

  <text x="768" y="248.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Record 1</text>
  <rect x="704" y="266.4" width="128" height="32.4" rx="4.8" fill="#fff" stroke="#2e7d32" stroke-width="1.6" />
  <text x="768" y="289.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Record 2</text>

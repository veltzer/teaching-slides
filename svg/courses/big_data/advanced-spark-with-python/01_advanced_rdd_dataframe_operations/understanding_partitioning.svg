  <text x="184" y="352" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#283593">Hash Partitioning</text>
  <text x="184" y="384" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">hash(key) % N partitions</text>
  <rect x="48" y="424" width="272" height="88" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.4" />
  <text x="184" y="456" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#6a1b9a">Range Partitioning</text>
  <text x="184" y="488" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Keys sorted into ranges</text>
  <rect x="48" y="528" width="272" height="88" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2.4" />
  <text x="184" y="560" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#e65100">Custom Partitioning</text>
  <text x="184" y="592" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">User-defined logic</text>
  <text x="640" y="672" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1565c0">Same keys always land in the same partition - enables efficient joins and aggregations</text>
  <text x="640" y="704" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#555">Co-located data reduces shuffling across the network</text>

  <ns0:text x="167.2727" y="320" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="#283593">Hash Partitioning</ns0:text>
  <ns0:text x="167.2727" y="349.0909" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="#333">hash(key) % N partitions</ns0:text>
  <ns0:rect x="43.6364" y="385.4545" width="247.2727" height="80" rx="7.2727" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.1818" />
  <ns0:text x="167.2727" y="414.5455" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="#6a1b9a">Range Partitioning</ns0:text>
  <ns0:text x="167.2727" y="443.6364" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="#333">Keys sorted into ranges</ns0:text>
  <ns0:rect x="43.6364" y="480" width="247.2727" height="80" rx="7.2727" fill="#fff3e0" stroke="#e65100" stroke-width="2.1818" />
  <ns0:text x="167.2727" y="509.0909" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="#e65100">Custom Partitioning</ns0:text>
  <ns0:text x="167.2727" y="538.1818" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="#333">User-defined logic</ns0:text>
  <ns0:text x="581.8182" y="610.9091" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="#1565c0">Same keys always land in the same partition - enables efficient joins and aggregations</ns0:text>
  <ns0:text x="581.8182" y="640" text-anchor="middle" font-family="Arial" font-size="17.4545" fill="#555">Co-located data reduces shuffling across the network</ns0:text>

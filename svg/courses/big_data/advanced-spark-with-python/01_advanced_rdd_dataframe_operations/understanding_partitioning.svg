<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1565c0">Understanding Spark Partitioning</text>

  <!-- Source Data -->
  <rect x="30" y="55" width="160" height="120" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="110" y="78" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Source Data</text>
  <text x="110" y="98" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">(A,1) (B,2) (C,3)</text>
  <text x="110" y="115" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">(A,4) (D,5) (B,6)</text>
  <text x="110" y="132" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">(C,7) (A,8) (D,9)</text>
  <text x="110" y="149" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">(B,10) (C,11) ...</text>

  <!-- Arrow to hash -->
  <line x1="190" y1="115" x2="240" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hash Function -->
  <rect x="245" y="75" width="130" height="80" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="310" y="100" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Hash Function</text>
  <text x="310" y="120" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">hash(key) %</text>
  <text x="310" y="137" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">numPartitions</text>

  <!-- Arrows to partitions -->
  <line x1="375" y1="95" x2="440" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="110" x2="440" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="125" x2="440" y2="215" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="375" y1="140" x2="440" y2="285" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Partition 0 -->
  <rect x="445" y="50" width="150" height="65" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="520" y="70" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Partition 0</text>
  <text x="520" y="88" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">(A,1) (A,4) (A,8)</text>
  <text x="520" y="105" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">All keys with hash%4=0</text>

  <!-- Partition 1 -->
  <rect x="445" y="125" width="150" height="65" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="520" y="145" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0">Partition 1</text>
  <text x="520" y="163" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">(B,2) (B,6) (B,10)</text>
  <text x="520" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">All keys with hash%4=1</text>

  <!-- Partition 2 -->
  <rect x="445" y="200" width="150" height="65" rx="5" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="520" y="220" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#c62828">Partition 2</text>
  <text x="520" y="238" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">(C,3) (C,7) (C,11)</text>
  <text x="520" y="255" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">All keys with hash%4=2</text>

  <!-- Partition 3 -->
  <rect x="445" y="275" width="150" height="65" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="520" y="295" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Partition 3</text>
  <text x="520" y="313" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">(D,5) (D,9) ...</text>
  <text x="520" y="330" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">All keys with hash%4=3</text>

  <!-- Worker nodes -->
  <line x1="595" y1="82" x2="645" y2="82" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="595" y1="157" x2="645" y2="157" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="595" y1="232" x2="645" y2="232" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="595" y1="307" x2="645" y2="307" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="650" y="62" width="130" height="40" rx="5" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="715" y="87" text-anchor="middle" font-family="Arial" font-size="12" fill="#283593">Worker 1</text>
  <rect x="650" y="137" width="130" height="40" rx="5" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="715" y="162" text-anchor="middle" font-family="Arial" font-size="12" fill="#283593">Worker 2</text>
  <rect x="650" y="212" width="130" height="40" rx="5" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="715" y="237" text-anchor="middle" font-family="Arial" font-size="12" fill="#283593">Worker 3</text>
  <rect x="650" y="287" width="130" height="40" rx="5" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="715" y="312" text-anchor="middle" font-family="Arial" font-size="12" fill="#283593">Worker 4</text>

  <!-- Partitioning types -->
  <rect x="30" y="200" width="170" height="55" rx="5" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="115" y="220" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#283593">Hash Partitioning</text>
  <text x="115" y="240" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">hash(key) % N partitions</text>

  <rect x="30" y="265" width="170" height="55" rx="5" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="115" y="285" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#6a1b9a">Range Partitioning</text>
  <text x="115" y="305" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Keys sorted into ranges</text>

  <rect x="30" y="330" width="170" height="55" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="115" y="350" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Custom Partitioning</text>
  <text x="115" y="370" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">User-defined logic</text>

  <!-- Key benefit -->
  <text x="400" y="420" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Same keys always land in the same partition - enables efficient joins and aggregations</text>
  <text x="400" y="440" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Co-located data reduces shuffling across the network</text>
</svg>

  <text x="1040" y="235.6364" text-anchor="middle" font-family="Arial" font-size="17.4545" fill="var(--primary-accent)">Worker 2</text>
  <rect x="945.4545" y="308.3636" width="189.0909" height="58.1818" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />

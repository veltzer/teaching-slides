  <text x="756.3636" y="320" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--danger-accent)">Partition 2</text>
  <text x="756.3636" y="346.1818" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(C,3) (C,7) (C,11)</text>

  <text x="756.3636" y="210.9091" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--primary-accent)">Partition 1</text>
  <text x="756.3636" y="237.0909" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(B,2) (B,6) (B,10)</text>

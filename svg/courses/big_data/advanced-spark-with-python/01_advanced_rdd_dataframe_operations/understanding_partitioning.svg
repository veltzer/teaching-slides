  <rect x="945.4545" y="417.4545" width="189.0909" height="58.1818" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1040" y="453.8182" text-anchor="middle" font-family="Arial" font-size="17.4545" fill="var(--primary-accent)">Worker 4</text>
  <rect x="43.6364" y="290.9091" width="247.2727" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="167.2727" y="320" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--primary-accent)">Hash Partitioning</text>
  <text x="167.2727" y="349.0909" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">hash(key) % N partitions</text>
  <rect x="43.6364" y="385.4545" width="247.2727" height="80" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="167.2727" y="414.5455" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--info-accent)">Range Partitioning</text>
  <text x="167.2727" y="443.6364" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Keys sorted into ranges</text>
  <rect x="43.6364" y="480" width="247.2727" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="167.2727" y="509.0909" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--warn-accent)">Custom Partitioning</text>
  <text x="167.2727" y="538.1818" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">User-defined logic</text>
  <text x="581.8182" y="610.9091" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--primary-accent)">Same keys always land in the same partition - enables efficient joins and aggregations</text>
  <text x="581.8182" y="640" text-anchor="middle" font-family="Arial" font-size="17.4545" fill="var(--text-muted)">Co-located data reduces shuffling across the network</text>

  <text x="160" y="113.4545" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--primary-accent)">Source Data</text>
  <text x="160" y="142.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(A,1) (B,2) (C,3)</text>
  <text x="160" y="167.2727" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(A,4) (D,5) (B,6)</text>
  <text x="160" y="192" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(C,7) (A,8) (D,9)</text>
  <text x="160" y="216.7273" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(B,10) (C,11) ...</text>
  <line x1="276.3636" y1="167.2727" x2="349.0909" y2="167.2727" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="356.3636" y="109.0909" width="189.0909" height="116.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="450.9091" y="145.4545" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--warn-accent)">Hash Function</text>
  <text x="450.9091" y="174.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">hash(key) %</text>
  <text x="450.9091" y="199.2727" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">numPartitions</text>
  <line x1="545.4545" y1="138.1818" x2="640" y2="109.0909" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="545.4545" y1="160" x2="640" y2="210.9091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="545.4545" y1="181.8182" x2="640" y2="312.7273" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="545.4545" y1="203.6364" x2="640" y2="414.5455" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="647.2727" y="72.7273" width="218.1818" height="94.5455" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="756.3636" y="101.8182" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--ok-accent)">Partition 0</text>
  <text x="756.3636" y="128" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(A,1) (A,4) (A,8)</text>
  <text x="756.3636" y="152.7273" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text-muted)">All keys with hash%4=0</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632" y="40" text-anchor="middle" font-family="Arial" font-size="27.0804" font-weight="bold" fill="var(--primary-accent)">Understanding Spark Partitioning</text>
  <rect x="40" y="75.3658" width="256.0001" height="169.7562" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168" y="107.9024" text-anchor="middle" font-family="Arial" font-size="19.5581" font-weight="bold" fill="var(--primary-accent)">Source Data</text>
  <text x="168" y="136.1951" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">(A,1) (B,2) (C,3)</text>
  <text x="168" y="160.2438" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">(A,4) (D,5) (B,6)</text>
  <text x="168" y="184.2927" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">(C,7) (A,8) (D,9)</text>
  <text x="168" y="208.3415" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">(B,10) (C,11) ...</text>
  <line x1="295.9999" y1="160.2438" x2="376" y2="160.2438" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="383.9999" y="103.6585" width="208" height="113.1707" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="488" y="139.0243" text-anchor="middle" font-family="Arial" font-size="19.5581" font-weight="bold" fill="var(--warn-accent)">Hash Function</text>
  <text x="488" y="167.3171" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">hash(key) %</text>
  <text x="488" y="191.3658" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">numPartitions</text>
  <line x1="592" y1="131.9512" x2="696" y2="103.6585" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="592" y1="153.1707" x2="696" y2="202.6829" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="592" y1="174.3902" x2="696" y2="301.7073" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="592" y1="195.6098" x2="696" y2="400.7317" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="704" y="68.2927" width="240" height="91.9513" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824" y="96.5854" text-anchor="middle" font-family="Arial" font-size="18.0535" font-weight="bold" fill="var(--ok-accent)">Partition 0</text>
  <text x="824" y="122.0488" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">(A,1) (A,4) (A,8)</text>
  <text x="824" y="146.0976" text-anchor="middle" font-family="Arial" font-size="15.0447" fill="var(--text-muted)">All keys with hash%4=0</text>
  <rect x="704" y="174.3902" width="240" height="91.9513" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824" y="202.6829" text-anchor="middle" font-family="Arial" font-size="18.0535" font-weight="bold" fill="var(--primary-accent)">Partition 1</text>
  <text x="824" y="228.1463" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">(B,2) (B,6) (B,10)</text>
  <text x="824" y="252.1951" text-anchor="middle" font-family="Arial" font-size="15.0447" fill="var(--text-muted)">All keys with hash%4=1</text>
  <rect x="704" y="280.4878" width="240" height="91.9513" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824" y="308.7805" text-anchor="middle" font-family="Arial" font-size="18.0535" font-weight="bold" fill="var(--danger-accent)">Partition 2</text>
  <text x="824" y="334.2439" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">(C,3) (C,7) (C,11)</text>
  <text x="824" y="358.2927" text-anchor="middle" font-family="Arial" font-size="15.0447" fill="var(--text-muted)">All keys with hash%4=2</text>
  <rect x="704" y="386.5854" width="240" height="91.9513" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="824" y="414.878" text-anchor="middle" font-family="Arial" font-size="18.0535" font-weight="bold" fill="var(--warn-accent)">Partition 3</text>
  <text x="824" y="440.3414" text-anchor="middle" font-family="Arial" font-size="16.5491" fill="var(--text)">(D,5) (D,9) ...</text>
  <text x="824" y="464.3902" text-anchor="middle" font-family="Arial" font-size="15.0447" fill="var(--text-muted)">All keys with hash%4=3</text>
  <line x1="944" y1="113.5609" x2="1024" y2="113.5609" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="944" y1="219.6585" x2="1024" y2="219.6585" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="944" y1="325.756" x2="1024" y2="325.756" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="944" y1="431.8537" x2="1024" y2="431.8537" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1032" y="85.2682" width="208" height="56.5854" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.0001" y="120.6342" text-anchor="middle" font-family="Arial" font-size="18.0535" fill="var(--primary-accent)">Worker 1</text>
  <rect x="1032" y="191.3658" width="208" height="56.5854" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.0001" y="226.7317" text-anchor="middle" font-family="Arial" font-size="18.0535" fill="var(--primary-accent)">Worker 2</text>
  <rect x="1032" y="297.4634" width="208" height="56.5854" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.0001" y="332.8293" text-anchor="middle" font-family="Arial" font-size="18.0535" fill="var(--primary-accent)">Worker 3</text>
  <rect x="1032" y="403.5609" width="208" height="56.5854" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.0001" y="438.9268" text-anchor="middle" font-family="Arial" font-size="18.0535" fill="var(--primary-accent)">Worker 4</text>
  <rect x="40" y="280.4878" width="272" height="77.8049" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.9999" y="308.7805" text-anchor="middle" font-family="Arial" font-size="18.0535" font-weight="bold" fill="var(--primary-accent)">Hash Partitioning</text>
  <text x="175.9999" y="337.0731" text-anchor="middle" font-family="Arial" font-size="15.0447" fill="var(--text)">hash(key) % N partitions</text>
  <rect x="40" y="372.439" width="272" height="77.8049" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.9999" y="400.7317" text-anchor="middle" font-family="Arial" font-size="18.0535" font-weight="bold" fill="var(--info-accent)">Range Partitioning</text>
  <text x="175.9999" y="429.0244" text-anchor="middle" font-family="Arial" font-size="15.0447" fill="var(--text)">Keys sorted into ranges</text>
  <rect x="40" y="464.3902" width="272" height="77.8049" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.9999" y="492.6829" text-anchor="middle" font-family="Arial" font-size="18.0535" font-weight="bold" fill="var(--warn-accent)">Custom Partitioning</text>
  <text x="175.9999" y="520.9756" text-anchor="middle" font-family="Arial" font-size="15.0447" fill="var(--text)">User-defined logic</text>
  <text x="632" y="591.7073" text-anchor="middle" font-family="Arial" font-size="19.5581" font-weight="bold" fill="var(--primary-accent)">Same keys always land in the same partition - enables efficient joins and aggregations</text>
  <text x="632" y="620" text-anchor="middle" font-family="Arial" font-size="18.0535" fill="var(--text-muted)">Co-located data reduces shuffling across the network</text>
</svg>
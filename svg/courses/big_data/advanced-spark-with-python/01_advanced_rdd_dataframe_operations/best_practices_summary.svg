<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="41.1954" text-anchor="middle" font-family="Arial" font-size="26.4828" font-weight="bold" fill="var(--primary-accent)">RDD and DataFrame Best Practices Summary</text>
  <rect x="29.4253" y="73.5632" width="360.4598" height="169.1954" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="208.9195" y="107.4023" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">Data Loading</text>
  <text x="208.9195" y="136.8276" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Define schema explicitly</text>
  <text x="208.9195" y="160.3678" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Use columnar formats (Parquet)</text>
  <text x="208.9195" y="183.908" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Filter early (predicate pushdown)</text>
  <text x="208.9195" y="207.4483" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Select only needed columns</text>
  <text x="208.9195" y="230.9885" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--ok-accent)">Avoid inferSchema in production</text>
  <rect x="409.0115" y="73.5632" width="360.4598" height="169.1954" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.5057" y="107.4023" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">Transformations</text>
  <text x="588.5057" y="136.8276" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Use built-in functions over UDFs</text>
  <text x="588.5057" y="160.3678" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Prefer DataFrames over RDDs</text>
  <text x="588.5057" y="183.908" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Use mapPartitions for I/O</text>
  <text x="588.5057" y="207.4483" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">reduceByKey over groupByKey</text>
  <text x="588.5057" y="230.9885" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--primary-accent)">Chain narrow transformations</text>
  <rect x="787.1264" y="73.5632" width="360.4598" height="169.1954" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="966.6207" y="107.4023" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--warn-accent)">Joins</text>
  <text x="966.6207" y="136.8276" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Broadcast small tables</text>
  <text x="966.6207" y="160.3678" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Handle skew with salting</text>
  <text x="966.6207" y="183.908" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Filter before joining</text>
  <text x="966.6207" y="207.4483" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Use sort-merge for large-large</text>
  <text x="966.6207" y="230.9885" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--warn-accent)">Avoid cartesian joins</text>
  <rect x="29.4253" y="264.8276" width="360.4598" height="169.1954" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="208.9195" y="298.6667" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--info-accent)">Memory Management</text>
  <text x="208.9195" y="328.092" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Cache reused DataFrames</text>
  <text x="208.9195" y="351.6322" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Unpersist when done</text>
  <text x="208.9195" y="375.1724" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Choose right storage level</text>
  <text x="208.9195" y="398.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Use Kryo serialization</text>
  <text x="208.9195" y="422.2529" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--info-accent)">Monitor memory in Spark UI</text>
  <rect x="409.0115" y="264.8276" width="360.4598" height="169.1954" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="588.5057" y="298.6667" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">Partitioning</text>
  <text x="588.5057" y="328.092" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">2-4 partitions per core</text>
  <text x="588.5057" y="351.6322" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">128MB per partition target</text>
  <text x="588.5057" y="375.1724" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Coalesce to reduce partitions</text>
  <text x="588.5057" y="398.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Custom partitioner for skew</text>
  <text x="588.5057" y="422.2529" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--ok-accent)">Enable AQE for auto-tuning</text>
  <rect x="787.1264" y="264.8276" width="360.4598" height="169.1954" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="966.6207" y="298.6667" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--danger-accent)">Anti-Patterns to Avoid</text>
  <text x="966.6207" y="328.092" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">collect() on large datasets</text>
  <text x="966.6207" y="351.6322" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Python UDFs (use pandas_udf)</text>
  <text x="966.6207" y="375.1724" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">repartition(1) bottleneck</text>
  <text x="966.6207" y="398.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">groupByKey (use reduceByKey)</text>
  <text x="966.6207" y="422.2529" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--danger-accent)">Unnecessary shuffles</text>
  <rect x="29.4253" y="463.4483" width="551.7241" height="80.9195" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="304.5517" y="497.2874" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">Monitoring</text>
  <text x="304.5517" y="526.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Use Spark UI, track GC time, shuffle spill, and execution time</text>
  <rect x="595.8621" y="463.4483" width="551.7241" height="80.9195" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="870.9885" y="497.2874" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">Configuration</text>
  <text x="870.9885" y="526.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Enable AQE, tune shuffle partitions, set memory fractions</text>
  <rect x="147.1264" y="573.7931" width="882.7586" height="66.2069" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.5057" y="603.2184" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">Golden Rule: Prefer DataFrames + built-in functions</text>
  <text x="588.5057" y="629.7011" text-anchor="middle" font-family="Arial" font-size="16.1839" fill="var(--text)">Catalyst optimizer + Tungsten engine = best performance</text>
</svg>
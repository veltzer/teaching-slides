<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="588.5057" y="41.1954" text-anchor="middle" font-family="Arial" font-size="26.4828" font-weight="bold" fill="#1565c0">RDD and DataFrame Best Practices Summary</ns0:text>
  <ns0:rect x="29.4253" y="73.5632" width="360.4598" height="169.1954" rx="8.8276" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2069" />
  <ns0:text x="208.9195" y="107.4023" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#2e7d32">Data Loading</ns0:text>
  <ns0:text x="208.9195" y="136.8276" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Define schema explicitly</ns0:text>
  <ns0:text x="208.9195" y="160.3678" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Use columnar formats (Parquet)</ns0:text>
  <ns0:text x="208.9195" y="183.908" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Filter early (predicate pushdown)</ns0:text>
  <ns0:text x="208.9195" y="207.4483" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Select only needed columns</ns0:text>
  <ns0:text x="208.9195" y="230.9885" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#2e7d32">Avoid inferSchema in production</ns0:text>
  <ns0:rect x="409.0115" y="73.5632" width="360.4598" height="169.1954" rx="8.8276" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2069" />
  <ns0:text x="588.5057" y="107.4023" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#1565c0">Transformations</ns0:text>
  <ns0:text x="588.5057" y="136.8276" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Use built-in functions over UDFs</ns0:text>
  <ns0:text x="588.5057" y="160.3678" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Prefer DataFrames over RDDs</ns0:text>
  <ns0:text x="588.5057" y="183.908" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Use mapPartitions for I/O</ns0:text>
  <ns0:text x="588.5057" y="207.4483" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">reduceByKey over groupByKey</ns0:text>
  <ns0:text x="588.5057" y="230.9885" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#1565c0">Chain narrow transformations</ns0:text>
  <ns0:rect x="787.1264" y="73.5632" width="360.4598" height="169.1954" rx="8.8276" fill="#fff3e0" stroke="#e65100" stroke-width="2.2069" />
  <ns0:text x="966.6207" y="107.4023" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#e65100">Joins</ns0:text>
  <ns0:text x="966.6207" y="136.8276" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Broadcast small tables</ns0:text>
  <ns0:text x="966.6207" y="160.3678" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Handle skew with salting</ns0:text>
  <ns0:text x="966.6207" y="183.908" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Filter before joining</ns0:text>
  <ns0:text x="966.6207" y="207.4483" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Use sort-merge for large-large</ns0:text>
  <ns0:text x="966.6207" y="230.9885" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#e65100">Avoid cartesian joins</ns0:text>
  <ns0:rect x="29.4253" y="264.8276" width="360.4598" height="169.1954" rx="8.8276" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.2069" />
  <ns0:text x="208.9195" y="298.6667" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#6a1b9a">Memory Management</ns0:text>
  <ns0:text x="208.9195" y="328.092" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Cache reused DataFrames</ns0:text>
  <ns0:text x="208.9195" y="351.6322" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Unpersist when done</ns0:text>
  <ns0:text x="208.9195" y="375.1724" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Choose right storage level</ns0:text>
  <ns0:text x="208.9195" y="398.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Use Kryo serialization</ns0:text>
  <ns0:text x="208.9195" y="422.2529" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#6a1b9a">Monitor memory in Spark UI</ns0:text>
  <ns0:rect x="409.0115" y="264.8276" width="360.4598" height="169.1954" rx="8.8276" fill="#e8f4f8" stroke="#2e7d32" stroke-width="2.2069" />
  <ns0:text x="588.5057" y="298.6667" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#2e7d32">Partitioning</ns0:text>
  <ns0:text x="588.5057" y="328.092" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">2-4 partitions per core</ns0:text>
  <ns0:text x="588.5057" y="351.6322" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">128MB per partition target</ns0:text>
  <ns0:text x="588.5057" y="375.1724" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Coalesce to reduce partitions</ns0:text>
  <ns0:text x="588.5057" y="398.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Custom partitioner for skew</ns0:text>
  <ns0:text x="588.5057" y="422.2529" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#2e7d32">Enable AQE for auto-tuning</ns0:text>
  <ns0:rect x="787.1264" y="264.8276" width="360.4598" height="169.1954" rx="8.8276" fill="#ffcdd2" stroke="#c62828" stroke-width="2.2069" />
  <ns0:text x="966.6207" y="298.6667" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#c62828">Anti-Patterns to Avoid</ns0:text>
  <ns0:text x="966.6207" y="328.092" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">collect() on large datasets</ns0:text>
  <ns0:text x="966.6207" y="351.6322" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Python UDFs (use pandas_udf)</ns0:text>
  <ns0:text x="966.6207" y="375.1724" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">repartition(1) bottleneck</ns0:text>
  <ns0:text x="966.6207" y="398.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">groupByKey (use reduceByKey)</ns0:text>
  <ns0:text x="966.6207" y="422.2529" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#c62828">Unnecessary shuffles</ns0:text>
  <ns0:rect x="29.4253" y="463.4483" width="551.7241" height="80.9195" rx="8.8276" fill="#e8eaf6" stroke="#283593" stroke-width="2.2069" />
  <ns0:text x="304.5517" y="497.2874" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#283593">Monitoring</ns0:text>
  <ns0:text x="304.5517" y="526.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Use Spark UI, track GC time, shuffle spill, and execution time</ns0:text>
  <ns0:rect x="595.8621" y="463.4483" width="551.7241" height="80.9195" rx="8.8276" fill="#e8eaf6" stroke="#283593" stroke-width="2.2069" />
  <ns0:text x="870.9885" y="497.2874" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#283593">Configuration</ns0:text>
  <ns0:text x="870.9885" y="526.7126" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="#333">Enable AQE, tune shuffle partitions, set memory fractions</ns0:text>
  <ns0:rect x="147.1264" y="573.7931" width="882.7586" height="66.2069" rx="11.7701" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.9425" />
  <ns0:text x="588.5057" y="603.2184" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#2e7d32">Golden Rule: Prefer DataFrames + built-in functions</ns0:text>
  <ns0:text x="588.5057" y="629.7011" text-anchor="middle" font-family="Arial" font-size="16.1839" fill="#333">Catalyst optimizer + Tungsten engine = best performance</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="44.8" text-anchor="middle" font-family="Arial" font-size="28.8" font-weight="bold" fill="#1565c0">RDD and DataFrame Best Practices Summary</text>
  <rect x="32" y="80" width="392" height="184" rx="9.6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.4" />
  <text x="227.2" y="116.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">Data Loading</text>
  <text x="227.2" y="148.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Define schema explicitly</text>
  <text x="227.2" y="174.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Use columnar formats (Parquet)</text>
  <text x="227.2" y="200" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Filter early (predicate pushdown)</text>
  <text x="227.2" y="225.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Select only needed columns</text>
  <text x="227.2" y="251.2" text-anchor="middle" font-family="Arial" font-size="16" fill="#2e7d32">Avoid inferSchema in production</text>
  <rect x="444.8" y="80" width="392" height="184" rx="9.6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.4" />
  <text x="640" y="116.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1565c0">Transformations</text>
  <text x="640" y="148.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Use built-in functions over UDFs</text>
  <text x="640" y="174.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Prefer DataFrames over RDDs</text>
  <text x="640" y="200" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Use mapPartitions for I/O</text>
  <text x="640" y="225.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">reduceByKey over groupByKey</text>
  <text x="640" y="251.2" text-anchor="middle" font-family="Arial" font-size="16" fill="#1565c0">Chain narrow transformations</text>
  <rect x="856" y="80" width="392" height="184" rx="9.6" fill="#fff3e0" stroke="#e65100" stroke-width="2.4" />
  <text x="1051.2" y="116.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#e65100">Joins</text>
  <text x="1051.2" y="148.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Broadcast small tables</text>
  <text x="1051.2" y="174.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Handle skew with salting</text>
  <text x="1051.2" y="200" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Filter before joining</text>
  <text x="1051.2" y="225.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Use sort-merge for large-large</text>
  <text x="1051.2" y="251.2" text-anchor="middle" font-family="Arial" font-size="16" fill="#e65100">Avoid cartesian joins</text>
  <rect x="32" y="288" width="392" height="184" rx="9.6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.4" />
  <text x="227.2" y="324.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#6a1b9a">Memory Management</text>
  <text x="227.2" y="356.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Cache reused DataFrames</text>
  <text x="227.2" y="382.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Unpersist when done</text>
  <text x="227.2" y="408" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Choose right storage level</text>
  <text x="227.2" y="433.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Use Kryo serialization</text>
  <text x="227.2" y="459.2" text-anchor="middle" font-family="Arial" font-size="16" fill="#6a1b9a">Monitor memory in Spark UI</text>
  <rect x="444.8" y="288" width="392" height="184" rx="9.6" fill="#e0f2f1" stroke="#00695c" stroke-width="2.4" />
  <text x="640" y="324.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#00695c">Partitioning</text>
  <text x="640" y="356.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">2-4 partitions per core</text>
  <text x="640" y="382.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">128MB per partition target</text>
  <text x="640" y="408" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Coalesce to reduce partitions</text>
  <text x="640" y="433.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Custom partitioner for skew</text>
  <text x="640" y="459.2" text-anchor="middle" font-family="Arial" font-size="16" fill="#00695c">Enable AQE for auto-tuning</text>
  <rect x="856" y="288" width="392" height="184" rx="9.6" fill="#ffcdd2" stroke="#c62828" stroke-width="2.4" />
  <text x="1051.2" y="324.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#c62828">Anti-Patterns to Avoid</text>
  <text x="1051.2" y="356.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">collect() on large datasets</text>
  <text x="1051.2" y="382.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Python UDFs (use pandas_udf)</text>
  <text x="1051.2" y="408" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">repartition(1) bottleneck</text>
  <text x="1051.2" y="433.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">groupByKey (use reduceByKey)</text>
  <text x="1051.2" y="459.2" text-anchor="middle" font-family="Arial" font-size="16" fill="#c62828">Unnecessary shuffles</text>
  <rect x="32" y="504" width="600" height="88" rx="9.6" fill="#e8eaf6" stroke="#283593" stroke-width="2.4" />
  <text x="331.2" y="540.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#283593">Monitoring</text>
  <text x="331.2" y="572.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Use Spark UI, track GC time, shuffle spill, and execution time</text>
  <rect x="648" y="504" width="600" height="88" rx="9.6" fill="#e8eaf6" stroke="#283593" stroke-width="2.4" />
  <text x="947.2" y="540.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#283593">Configuration</text>
  <text x="947.2" y="572.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Enable AQE, tune shuffle partitions, set memory fractions</text>
  <rect x="160" y="624" width="960" height="72" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="640" y="656" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">Golden Rule: Prefer DataFrames + built-in functions</text>
  <text x="640" y="684.8" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Catalyst optimizer + Tungsten engine = best performance</text>
</svg>
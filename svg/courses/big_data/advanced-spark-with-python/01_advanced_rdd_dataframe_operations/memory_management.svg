<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.9627" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Executor Memory Management</text>
  <rect x="40" y="63.932" width="1200" height="492.7185" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="96.3107" text-anchor="middle" font-size="21.7487" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Executor JVM Memory (spark.executor.memory = 8g)</text>
  <rect x="74.2857" y="120.2427" width="1131.4286" height="56.3107" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="155.4369" text-anchor="middle" font-size="20.1953" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Reserved Memory (300MB) - Internal Spark overhead</text>
  <rect x="74.2857" y="197.6699" width="891.4285" height="323.7865" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="230.0485" text-anchor="middle" font-size="20.1953" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Unified Spark Memory (spark.memory.fraction = 0.8)</text>
  <rect x="108.5714" y="246.9418" width="411.4286" height="253.3981" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="279.3204" text-anchor="middle" font-size="18.6418" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Storage Memory</text>
  <text x="314.2856" y="304.6602" text-anchor="middle" font-size="17.0883" fill="var(--text)" font-family="Arial, sans-serif">(storageFraction = 0.5)</text>
  <rect x="134.2857" y="324.369" width="360" height="35.1941" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="348.3009" text-anchor="middle" font-size="15.5349" fill="var(--text)" font-family="Arial, sans-serif">Cached RDDs / DataFrames</text>
  <rect x="134.2857" y="369.4175" width="360" height="35.1941" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="393.3495" text-anchor="middle" font-size="15.5349" fill="var(--text)" font-family="Arial, sans-serif">Broadcast variables</text>
  <rect x="134.2857" y="414.466" width="360" height="35.1941" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="438.398" text-anchor="middle" font-size="15.5349" fill="var(--text)" font-family="Arial, sans-serif">Unrolled data</text>
  <text x="314.2856" y="486.2621" text-anchor="middle" font-size="15.5349" fill="var(--primary-accent)" font-family="Arial, sans-serif">Can borrow from Execution</text>
  <rect x="554.2857" y="246.9418" width="377.1429" height="253.3981" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="279.3204" text-anchor="middle" font-size="18.6418" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Execution Memory</text>
  <text x="742.8571" y="304.6602" text-anchor="middle" font-size="17.0883" fill="var(--text)" font-family="Arial, sans-serif">(1 - storageFraction)</text>
  <rect x="580" y="324.369" width="325.7142" height="35.1941" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="348.3009" text-anchor="middle" font-size="15.5349" fill="var(--text)" font-family="Arial, sans-serif">Shuffles / Joins / Sorts</text>
  <rect x="580" y="369.4175" width="325.7142" height="35.1941" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="393.3495" text-anchor="middle" font-size="15.5349" fill="var(--text)" font-family="Arial, sans-serif">Aggregations</text>
  <rect x="580" y="414.466" width="325.7142" height="35.1941" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="438.398" text-anchor="middle" font-size="15.5349" fill="var(--text)" font-family="Arial, sans-serif">Hash maps for joins</text>
  <text x="742.8571" y="486.2621" text-anchor="middle" font-size="15.5349" fill="var(--ok-accent)" font-family="Arial, sans-serif">Can evict storage if needed</text>
  <line x1="494.2857" y1="380.6796" x2="562.8571" y2="380.6796" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="562.8571,373.6407 580,380.6796 562.8571,387.7184" fill="var(--warn-accent)"/>
  <polygon points="494.2857,373.6407 477.1429,380.6796 494.2857,387.7184" fill="var(--warn-accent)"/>
  <text x="537.1429" y="366.6019" text-anchor="middle" font-size="15.5349" fill="var(--warn-accent)" font-family="Arial, sans-serif">Borrow</text>
  <rect x="1000" y="197.6699" width="240" height="323.7865" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="232.8641" text-anchor="middle" font-size="18.6418" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">User Memory</text>
  <text x="1120" y="258.2038" text-anchor="middle" font-size="17.0883" fill="var(--text)" font-family="Arial, sans-serif">(1 - fraction)</text>
  <rect x="1020.5714" y="282.1359" width="198.8572" height="35.1941" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="306.068" text-anchor="middle" font-size="15.5349" fill="var(--text)" font-family="Arial, sans-serif">UDF data</text>
  <rect x="1020.5714" y="327.1844" width="198.8572" height="35.1941" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="351.1165" text-anchor="middle" font-size="15.5349" fill="var(--text)" font-family="Arial, sans-serif">Internal metadata</text>
  <rect x="1020.5714" y="372.233" width="198.8572" height="35.1941" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="396.1651" text-anchor="middle" font-size="15.5349" fill="var(--text)" font-family="Arial, sans-serif">User structures</text>
  <rect x="297.1428" y="570.7281" width="685.7143" height="49.2719" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="601.699" text-anchor="middle" font-size="18.6418" fill="var(--text-muted)" font-family="Arial, sans-serif">Off-Heap: spark.executor.memoryOverhead (default 10% or 384MB)</text>
</svg>

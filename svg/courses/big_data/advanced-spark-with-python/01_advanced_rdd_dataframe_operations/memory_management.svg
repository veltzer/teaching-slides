<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="27.9627" font-weight="bold" fill="var(--primary-accent)">Spark Executor Memory Management</text>
  <rect x="40" y="63.932" width="1200" height="492.7185" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="96.3107" text-anchor="middle" font-family="Arial" font-size="21.7487" font-weight="bold" fill="var(--text)">Executor JVM Memory (spark.executor.memory = 8g)</text>
  <rect x="74.2857" y="120.2427" width="1131.4286" height="56.3107" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="155.4369" text-anchor="middle" font-family="Arial" font-size="20.1953" font-weight="bold" fill="var(--danger-accent)">Reserved Memory (300MB) - Internal Spark overhead</text>
  <rect x="74.2857" y="197.6699" width="891.4285" height="323.7865" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="230.0485" text-anchor="middle" font-family="Arial" font-size="20.1953" font-weight="bold" fill="var(--primary-accent)">Unified Spark Memory (spark.memory.fraction = 0.8)</text>
  <rect x="108.5714" y="246.9418" width="411.4286" height="253.3981" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="279.3204" text-anchor="middle" font-family="Arial" font-size="18.6418" font-weight="bold" fill="var(--primary-accent)">Storage Memory</text>
  <text x="314.2856" y="304.6602" text-anchor="middle" font-family="Arial" font-size="17.0883" fill="var(--text)">(storageFraction = 0.5)</text>
  <rect x="134.2857" y="324.369" width="360" height="35.1941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="348.3009" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--text)">Cached RDDs / DataFrames</text>
  <rect x="134.2857" y="369.4175" width="360" height="35.1941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="393.3495" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--text)">Broadcast variables</text>
  <rect x="134.2857" y="414.466" width="360" height="35.1941" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="438.398" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--text)">Unrolled data</text>
  <text x="314.2856" y="486.2621" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--primary-accent)">Can borrow from Execution</text>
  <rect x="554.2857" y="246.9418" width="377.1429" height="253.3981" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="279.3204" text-anchor="middle" font-family="Arial" font-size="18.6418" font-weight="bold" fill="var(--ok-accent)">Execution Memory</text>
  <text x="742.8571" y="304.6602" text-anchor="middle" font-family="Arial" font-size="17.0883" fill="var(--text)">(1 - storageFraction)</text>
  <rect x="580" y="324.369" width="325.7142" height="35.1941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="348.3009" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--text)">Shuffles / Joins / Sorts</text>
  <rect x="580" y="369.4175" width="325.7142" height="35.1941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="393.3495" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--text)">Aggregations</text>
  <rect x="580" y="414.466" width="325.7142" height="35.1941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="438.398" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--text)">Hash maps for joins</text>
  <text x="742.8571" y="486.2621" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--ok-accent)">Can evict storage if needed</text>
  <line x1="494.2857" y1="380.6796" x2="562.8571" y2="380.6796" stroke="var(--warn-border)" stroke-width="2" />
  <polygon points="562.8571,373.6407 580,380.6796 562.8571,387.7184" fill="var(--warn-accent)" />
  <polygon points="494.2857,373.6407 477.1429,380.6796 494.2857,387.7184" fill="var(--warn-accent)" />
  <text x="537.1429" y="366.6019" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--warn-accent)">Borrow</text>
  <rect x="1000" y="197.6699" width="240" height="323.7865" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="232.8641" text-anchor="middle" font-family="Arial" font-size="18.6418" font-weight="bold" fill="var(--warn-accent)">User Memory</text>
  <text x="1120" y="258.2038" text-anchor="middle" font-family="Arial" font-size="17.0883" fill="var(--text)">(1 - fraction)</text>
  <rect x="1020.5714" y="282.1359" width="198.8572" height="35.1941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="306.068" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--text)">UDF data</text>
  <rect x="1020.5714" y="327.1844" width="198.8572" height="35.1941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="351.1165" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--text)">Internal metadata</text>
  <rect x="1020.5714" y="372.233" width="198.8572" height="35.1941" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="396.1651" text-anchor="middle" font-family="Arial" font-size="15.5349" fill="var(--text)">User structures</text>
  <rect x="297.1428" y="570.7281" width="685.7143" height="49.2719" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="601.699" text-anchor="middle" font-family="Arial" font-size="18.6418" fill="var(--text-muted)">Off-Heap: spark.executor.memoryOverhead (default 10% or 384MB)</text>
</svg>
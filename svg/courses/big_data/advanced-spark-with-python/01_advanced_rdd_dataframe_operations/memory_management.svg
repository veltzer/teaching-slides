<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="581.8182" y="40.7273" text-anchor="middle" font-family="Arial" font-size="26.1818" font-weight="bold" fill="var(--primary-accent)">Spark Executor Memory Management</text>
  <rect x="72.7273" y="65.4545" width="1018.1818" height="509.0909" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="581.8182" y="98.9091" text-anchor="middle" font-family="Arial" font-size="20.3636" font-weight="bold" fill="var(--text)">Executor JVM Memory (spark.executor.memory = 8g)</text>
  <rect x="101.8182" y="123.6364" width="960" height="58.1818" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="581.8182" y="160" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--danger-accent)">Reserved Memory (300MB) - Internal Spark overhead</text>
  <rect x="101.8182" y="203.6364" width="756.3636" height="334.5455" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="480" y="237.0909" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--primary-accent)">Unified Spark Memory (spark.memory.fraction = 0.8)</text>
  <rect x="130.9091" y="254.5455" width="349.0909" height="261.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="305.4545" y="288" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--primary-accent)">Storage Memory</text>
  <text x="305.4545" y="314.1818" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(storageFraction = 0.5)</text>
  <rect x="152.7273" y="334.5455" width="305.4545" height="36.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="305.4545" y="359.2727" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Cached RDDs / DataFrames</text>
  <rect x="152.7273" y="381.0909" width="305.4545" height="36.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="305.4545" y="405.8182" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Broadcast variables</text>
  <rect x="152.7273" y="427.6364" width="305.4545" height="36.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="305.4545" y="452.3636" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Unrolled data</text>
  <text x="305.4545" y="501.8182" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--primary-accent)">Can borrow from Execution</text>
  <rect x="509.0909" y="254.5455" width="320" height="261.8182" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="669.0909" y="288" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--ok-accent)">Execution Memory</text>
  <text x="669.0909" y="314.1818" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(1 - storageFraction)</text>
  <rect x="530.9091" y="334.5455" width="276.3636" height="36.3636" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="669.0909" y="359.2727" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Shuffles / Joins / Sorts</text>
  <rect x="530.9091" y="381.0909" width="276.3636" height="36.3636" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="669.0909" y="405.8182" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Aggregations</text>
  <rect x="530.9091" y="427.6364" width="276.3636" height="36.3636" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="669.0909" y="452.3636" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Hash maps for joins</text>
  <text x="669.0909" y="501.8182" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--ok-accent)">Can evict storage if needed</text>
  <line x1="458.1818" y1="392.7273" x2="516.3636" y2="392.7273" stroke="var(--warn-border)" stroke-width="2" />
  <polygon points="516.3636,385.4545 530.9091,392.7273 516.3636,400" fill="var(--warn-accent)" />
  <polygon points="458.1818,385.4545 443.6364,392.7273 458.1818,400" fill="var(--warn-accent)" />
  <text x="494.5455" y="378.1818" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--warn-accent)">Borrow</text>
  <rect x="887.2727" y="203.6364" width="203.6364" height="334.5455" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="989.0909" y="240" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--warn-accent)">User Memory</text>
  <text x="989.0909" y="266.1818" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">(1 - fraction)</text>
  <rect x="904.7273" y="290.9091" width="168.7273" height="36.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="989.0909" y="315.6364" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">UDF data</text>
  <rect x="904.7273" y="337.4545" width="168.7273" height="36.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="989.0909" y="362.1818" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">Internal metadata</text>
  <rect x="904.7273" y="384" width="168.7273" height="36.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="989.0909" y="408.7273" text-anchor="middle" font-family="Arial" font-size="14.5455" fill="var(--text)">User structures</text>
  <rect x="290.9091" y="589.0909" width="581.8182" height="50.9091" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="581.8182" y="621.0909" text-anchor="middle" font-family="Arial" font-size="17.4545" fill="var(--text-muted)">Off-Heap: spark.executor.memoryOverhead (default 10% or 384MB)</text>
</svg>
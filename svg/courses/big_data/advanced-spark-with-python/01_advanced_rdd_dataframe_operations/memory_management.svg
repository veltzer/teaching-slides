<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="513.924070437429" rx="6.127753623165" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="73.772211312286" text-anchor="middle" font-size="22.211779204023" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Executor JVM Memory (spark.executor.memory = 8g)</text>
  <rect x="74.2857" y="98.734194379105" width="1131.4286" height="58.734194379105" rx="6.127753623165" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="135.443078904019" text-anchor="middle" font-size="20.625303790985" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Reserved Memory (300MB) - Internal Spark overhead</text>
  <rect x="74.2857" y="179.4936986124" width="891.4285" height="337.721591603905" rx="6.127753623165" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="213.265805620895" text-anchor="middle" font-size="20.625303790985" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Unified Spark Memory (spark.memory.fraction = 0.8)</text>
  <rect x="108.5714" y="230.886157808038" width="411.4286" height="264.303822554076" rx="6.127753623165" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="264.658264816533" text-anchor="middle" font-size="19.038726248721" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Storage Memory</text>
  <text x="314.2856" y="291.088636641562" text-anchor="middle" font-size="17.452148706456" fill="var(--text)" font-family="Arial, sans-serif">(storageFraction = 0.5)</text>
  <rect x="134.2857" y="311.645662041333" width="360" height="36.708780221124" rx="6.127753623165" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="336.607540804362" text-anchor="middle" font-size="15.865673293419" fill="var(--text)" font-family="Arial, sans-serif">Cached RDDs / DataFrames</text>
  <rect x="134.2857" y="358.632954962343" width="360" height="36.708780221124" rx="6.127753623165" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="383.594938029162" text-anchor="middle" font-size="15.865673293419" fill="var(--text)" font-family="Arial, sans-serif">Broadcast variables</text>
  <rect x="134.2857" y="405.620247883352" width="360" height="36.708780221124" rx="6.127753623165" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.2856" y="430.582230950172" text-anchor="middle" font-size="15.865673293419" fill="var(--text)" font-family="Arial, sans-serif">Unrolled data</text>
  <text x="314.2856" y="480.5063013876" text-anchor="middle" font-size="15.865673293419" fill="var(--primary-accent)" font-family="Arial, sans-serif">Can borrow from Execution</text>
  <rect x="554.2857" y="230.886157808038" width="377.1429" height="264.303822554076" rx="6.127753623165" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="264.658264816533" text-anchor="middle" font-size="19.038726248721" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Execution Memory</text>
  <text x="742.8571" y="291.088636641562" text-anchor="middle" font-size="17.452148706456" fill="var(--text)" font-family="Arial, sans-serif">(1 - storageFraction)</text>
  <rect x="580" y="311.645662041333" width="325.7142" height="36.708780221124" rx="6.127753623165" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="336.607540804362" text-anchor="middle" font-size="15.865673293419" fill="var(--text)" font-family="Arial, sans-serif">Shuffles / Joins / Sorts</text>
  <rect x="580" y="358.632954962343" width="325.7142" height="36.708780221124" rx="6.127753623165" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="383.594938029162" text-anchor="middle" font-size="15.865673293419" fill="var(--text)" font-family="Arial, sans-serif">Aggregations</text>
  <rect x="580" y="405.620247883352" width="325.7142" height="36.708780221124" rx="6.127753623165" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="742.8571" y="430.582230950172" text-anchor="middle" font-size="15.865673293419" fill="var(--text)" font-family="Arial, sans-serif">Hash maps for joins</text>
  <text x="742.8571" y="480.5063013876" text-anchor="middle" font-size="15.865673293419" fill="var(--ok-accent)" font-family="Arial, sans-serif">Can evict storage if needed</text>
  <line x1="494.2857" y1="370.379752116648" x2="562.8571" y2="370.379752116648" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="562.8571,363.037912629391 580,370.379752116648 562.8571,377.721487300114" fill="var(--warn-accent)"/>
  <polygon points="494.2857,363.037912629391 477.1429,370.379752116648 494.2857,377.721487300114" fill="var(--warn-accent)"/>
  <text x="537.1429" y="355.696177445924" text-anchor="middle" font-size="15.865673293419" fill="var(--warn-accent)" font-family="Arial, sans-serif">Borrow</text>
  <rect x="1000" y="179.4936986124" width="240" height="337.721591603905" rx="6.127753623165" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="216.202583137314" text-anchor="middle" font-size="19.038726248721" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">User Memory</text>
  <text x="1120" y="242.632850658553" text-anchor="middle" font-size="17.452148706456" fill="var(--text)" font-family="Arial, sans-serif">(1 - fraction)</text>
  <rect x="1020.5714" y="267.594938029162" width="198.8572" height="36.708780221124" rx="6.127753623165" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="292.557025399771" text-anchor="middle" font-size="15.865673293419" fill="var(--text)" font-family="Arial, sans-serif">UDF data</text>
  <rect x="1020.5714" y="314.582230950171" width="198.8572" height="36.708780221124" rx="6.127753623165" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="339.544318320781" text-anchor="middle" font-size="15.865673293419" fill="var(--text)" font-family="Arial, sans-serif">Internal metadata</text>
  <rect x="1020.5714" y="361.569628174971" width="198.8572" height="36.708780221124" rx="6.127753623165" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="386.531715545581" text-anchor="middle" font-size="15.865673293419" fill="var(--text)" font-family="Arial, sans-serif">User structures</text>
  <rect x="297.1428" y="568.607540804362" width="685.7143" height="51.392459195638" rx="6.127753623165" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="600.911363358438" text-anchor="middle" font-size="19.038726248721" fill="var(--text-muted)" font-family="Arial, sans-serif">Off-Heap: spark.executor.memoryOverhead (default 10% or 384MB)</text>
</svg>

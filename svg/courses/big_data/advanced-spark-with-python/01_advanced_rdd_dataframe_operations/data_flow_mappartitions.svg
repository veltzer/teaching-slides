<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-mp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 7.4667,0" fill="#333" />
    </marker>
  </defs>
  <rect x="213.3333" y="17.1429" width="853.3333" height="85.7143" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="51.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.2857" font-weight="bold" fill="var(--text)">Driver Program</text>
  <text x="640" y="82.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text-muted)">rdd.mapPartitions(process_partition)</text>
  <line x1="426.6667" y1="102.8571" x2="256" y2="154.2857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <line x1="640" y1="102.8571" x2="640" y2="154.2857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <line x1="853.3333" y1="102.8571" x2="1024" y2="154.2857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <rect x="128" y="162.8571" width="256" height="77.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="256" y="195.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" font-weight="bold" fill="var(--text)">Part 0</text>
  <text x="256" y="222.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8571" fill="var(--text-muted)">[0..999]</text>
  <rect x="512" y="162.8571" width="256" height="77.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="195.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" font-weight="bold" fill="var(--text)">Part 1</text>
  <text x="640" y="222.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8571" fill="var(--text-muted)">[1k..2k]</text>
  <rect x="896" y="162.8571" width="256" height="77.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1024" y="195.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" font-weight="bold" fill="var(--text)">Part 2</text>
  <text x="1024" y="222.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8571" fill="var(--text-muted)">[2k..3k]</text>
  <line x1="256" y1="240" x2="256" y2="325.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="309.3333" y="291.4286" font-family="Arial, sans-serif" font-size="17.1429" fill="var(--text-faint)">open conn</text>
  <line x1="640" y1="240" x2="640" y2="325.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="693.3333" y="291.4286" font-family="Arial, sans-serif" font-size="17.1429" fill="var(--text-faint)">open conn</text>
  <line x1="1024" y1="240" x2="1024" y2="325.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="1077.3333" y="291.4286" font-family="Arial, sans-serif" font-size="17.1429" fill="var(--text-faint)">open conn</text>
  <rect x="128" y="334.2857" width="256" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="256" y="377.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Process batch</text>
  <rect x="512" y="334.2857" width="256" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="377.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Process batch</text>
  <rect x="896" y="334.2857" width="256" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1024" y="377.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Process batch</text>
  <line x1="256" y1="402.8571" x2="256" y2="497.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="309.3333" y="459.4286" font-family="Arial, sans-serif" font-size="17.1429" fill="var(--text-faint)">close conn</text>
  <line x1="640" y1="402.8571" x2="640" y2="497.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="693.3333" y="459.4286" font-family="Arial, sans-serif" font-size="17.1429" fill="var(--text-faint)">close conn</text>
  <line x1="1024" y1="402.8571" x2="1024" y2="497.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="1077.3333" y="459.4286" font-family="Arial, sans-serif" font-size="17.1429" fill="var(--text-faint)">close conn</text>
  <rect x="128" y="505.7143" width="256" height="68.5714" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="256" y="548.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Results</text>
  <rect x="512" y="505.7143" width="256" height="68.5714" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="548.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Results</text>
  <rect x="896" y="505.7143" width="256" height="68.5714" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1024" y="548.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5714" fill="var(--text)">Results</text>
</svg>
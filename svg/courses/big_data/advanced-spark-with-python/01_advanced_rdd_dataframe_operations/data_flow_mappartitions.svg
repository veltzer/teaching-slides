<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-mp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 7.4667,0" fill="#333" />
    </marker>
  </defs>
  <rect x="140" y="40" width="1000" height="89.2308" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.6149" font-weight="bold" fill="var(--text)">Driver Program</text>
  <text x="640" y="107.8153" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text-muted)">rdd.mapPartitions(process_partition)</text>
  <line x1="390" y1="129.2307" x2="190" y2="182.7692" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <line x1="640" y1="129.2307" x2="640" y2="182.7692" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <line x1="890" y1="129.2307" x2="1090" y2="182.7692" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <rect x="40" y="191.6922" width="300" height="80.3077" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" font-weight="bold" fill="var(--text)">Part 0</text>
  <text x="190" y="254.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8279" fill="var(--text-muted)">[0..999]</text>
  <rect x="490" y="191.6922" width="300" height="80.3077" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" font-weight="bold" fill="var(--text)">Part 1</text>
  <text x="640" y="254.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8279" fill="var(--text-muted)">[1k..2k]</text>
  <rect x="940" y="191.6922" width="300" height="80.3077" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" font-weight="bold" fill="var(--text)">Part 2</text>
  <text x="1090" y="254.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8279" fill="var(--text-muted)">[2k..3k]</text>
  <line x1="190" y1="272" x2="190" y2="361.2308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="252.5" y="325.5385" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">open conn</text>
  <line x1="640" y1="272" x2="640" y2="361.2308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="702.5" y="325.5385" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">open conn</text>
  <line x1="1090" y1="272" x2="1090" y2="361.2308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="1152.5" y="325.5385" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">open conn</text>
  <rect x="40" y="370.1538" width="300" height="71.3846" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="414.7693" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Process batch</text>
  <rect x="490" y="370.1538" width="300" height="71.3846" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="414.7693" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Process batch</text>
  <rect x="940" y="370.1538" width="300" height="71.3846" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="414.7693" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Process batch</text>
  <line x1="190" y1="441.5384" x2="190" y2="539.6924" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="252.5" y="500.4308" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">close conn</text>
  <line x1="640" y1="441.5384" x2="640" y2="539.6924" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="702.5" y="500.4308" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">close conn</text>
  <line x1="1090" y1="441.5384" x2="1090" y2="539.6924" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-mp)" />
  <text x="1152.5" y="500.4308" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">close conn</text>
  <rect x="40" y="548.6154" width="300" height="71.3846" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="593.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Results</text>
  <rect x="490" y="548.6154" width="300" height="71.3846" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="593.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Results</text>
  <rect x="940" y="548.6154" width="300" height="71.3846" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="593.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Results</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="140" y="40" width="1000" height="89.2308" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="75.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.6149" font-weight="bold" fill="var(--text)">Driver Program</text>
  <text x="640" y="107.8153" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text-muted)">rdd.mapPartitions(process_partition)</text>
  <line x1="390" y1="129.2307" x2="190" y2="182.7692" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="129.2307" x2="640" y2="182.7692" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="890" y1="129.2307" x2="1090" y2="182.7692" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="191.6922" width="300" height="80.3077" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" font-weight="bold" fill="var(--text)">Part 0</text>
  <text x="190" y="254.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8279" fill="var(--text-muted)">[0..999]</text>
  <rect x="490" y="191.6922" width="300" height="80.3077" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" font-weight="bold" fill="var(--text)">Part 1</text>
  <text x="640" y="254.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8279" fill="var(--text-muted)">[1k..2k]</text>
  <rect x="940" y="191.6922" width="300" height="80.3077" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" font-weight="bold" fill="var(--text)">Part 2</text>
  <text x="1090" y="254.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8279" fill="var(--text-muted)">[2k..3k]</text>
  <line x1="190" y1="272" x2="190" y2="361.2308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252.5" y="325.5385" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">open conn</text>
  <line x1="640" y1="272" x2="640" y2="361.2308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="702.5" y="325.5385" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">open conn</text>
  <line x1="1090" y1="272" x2="1090" y2="361.2308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1152.5" y="325.5385" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">open conn</text>
  <rect x="40" y="370.1538" width="300" height="71.3846" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="414.7693" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Process batch</text>
  <rect x="490" y="370.1538" width="300" height="71.3846" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="414.7693" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Process batch</text>
  <rect x="940" y="370.1538" width="300" height="71.3846" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="414.7693" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Process batch</text>
  <line x1="190" y1="441.5384" x2="190" y2="539.6924" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252.5" y="500.4308" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">close conn</text>
  <line x1="640" y1="441.5384" x2="640" y2="539.6924" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="702.5" y="500.4308" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">close conn</text>
  <line x1="1090" y1="441.5384" x2="1090" y2="539.6924" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1152.5" y="500.4308" font-family="Arial, sans-serif" font-size="18.9346" fill="var(--text-faint)">close conn</text>
  <rect x="40" y="548.6154" width="300" height="71.3846" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="593.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Results</text>
  <rect x="490" y="548.6154" width="300" height="71.3846" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="593.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Results</text>
  <rect x="940" y="548.6154" width="300" height="71.3846" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="593.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7214" fill="var(--text)">Results</text>
</svg>

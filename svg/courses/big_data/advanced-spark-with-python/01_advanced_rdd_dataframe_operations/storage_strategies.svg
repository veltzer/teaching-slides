<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1565c0">Spark Data Storage Strategies</text>

  <!-- File Formats row -->
  <text x="400" y="58" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">File Formats</text>

  <rect x="30" y="70" width="160" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="110" y="93" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Parquet</text>
  <text x="110" y="113" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Columnar format</text>
  <text x="110" y="128" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Best compression</text>
  <text x="110" y="143" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">Recommended</text>

  <rect x="210" y="70" width="160" height="90" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="290" y="93" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">ORC</text>
  <text x="290" y="113" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Columnar format</text>
  <text x="290" y="128" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Hive optimized</text>
  <text x="290" y="143" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">ACID support</text>

  <rect x="390" y="70" width="160" height="90" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="470" y="93" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Avro</text>
  <text x="470" y="113" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Row-based format</text>
  <text x="470" y="128" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Schema evolution</text>
  <text x="470" y="143" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Good for writes</text>

  <rect x="570" y="70" width="200" height="90" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="670" y="93" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c62828">CSV / JSON</text>
  <text x="670" y="113" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Text-based, no schema</text>
  <text x="670" y="128" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Large, slow to parse</text>
  <text x="670" y="143" text-anchor="middle" font-family="Arial" font-size="10" fill="#c62828">Avoid in production</text>

  <!-- Compression -->
  <text x="400" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Compression Strategies</text>

  <rect x="30" y="205" width="230" height="70" rx="6" fill="#e8eaf6" stroke="#283593" stroke-width="1.5"/>
  <text x="145" y="228" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#283593">Snappy (Default)</text>
  <text x="145" y="248" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Fast, moderate compression</text>
  <text x="145" y="263" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Splittable with Parquet</text>

  <rect x="280" y="205" width="230" height="70" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="395" y="228" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#6a1b9a">GZIP</text>
  <text x="395" y="248" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">High compression ratio</text>
  <text x="395" y="263" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Slower, CPU intensive</text>

  <rect x="530" y="205" width="240" height="70" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
  <text x="650" y="228" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00695c">ZSTD</text>
  <text x="650" y="248" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Best of both worlds</text>
  <text x="650" y="263" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Good ratio + speed</text>

  <!-- Partitioning Strategy -->
  <text x="400" y="310" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Data Layout Strategies</text>

  <rect x="30" y="325" width="230" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="145" y="345" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Partition by Date</text>
  <text x="145" y="365" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">data/year=2024/month=01/</text>
  <text x="145" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Enables partition pruning</text>
  <text x="145" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Reduces scan size</text>

  <rect x="280" y="325" width="240" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="400" y="345" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0">Bucketing</text>
  <text x="400" y="365" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Pre-shuffle for joins</text>
  <text x="400" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Fixed number of buckets</text>
  <text x="400" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Avoids runtime shuffles</text>

  <rect x="540" y="325" width="230" height="80" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="655" y="345" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">File Sizing</text>
  <text x="655" y="365" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Target 128MB-1GB per file</text>
  <text x="655" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Avoid small files problem</text>
  <text x="655" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">Use coalesce() to merge</text>
</svg>

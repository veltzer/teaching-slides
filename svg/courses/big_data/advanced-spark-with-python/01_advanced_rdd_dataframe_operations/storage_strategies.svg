<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--text)">File Formats</text>

  <rect x="40" y="60.900900900901" width="284.745762711864" height="135.855855855856" rx="8.24721110845" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.372881355932" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--ok-text)">Parquet</text>
  <text x="182.372881355932" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Columnar</text>
  <text x="182.372881355932" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Best compression</text>
  <text x="182.372881355932" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" font-weight="bold" fill="var(--ok-text)">Recommended</text>

  <rect x="340" y="60.900900900901" width="284.745762711864" height="135.855855855856" rx="8.24721110845" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.372881355932" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--primary-text)">ORC</text>
  <text x="482.372881355932" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Columnar</text>
  <text x="482.372881355932" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Hive-optimized</text>
  <text x="482.372881355932" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">ACID</text>

  <rect x="640" y="60.900900900901" width="284.745762711864" height="135.855855855856" rx="8.24721110845" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782.372881355932" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--warn-text)">Avro</text>
  <text x="782.372881355932" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">Row-based</text>
  <text x="782.372881355932" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">Schema evolution</text>
  <text x="782.372881355932" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">Good for writes</text>

  <rect x="940" y="60.900900900901" width="300" height="135.855855855856" rx="8.24721110845" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.491525423729" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--danger-text)">CSV / JSON</text>
  <text x="1089.491525423729" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--danger-text)">Text, no schema</text>
  <text x="1089.491525423729" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--danger-text)">Slow to parse</text>
  <text x="1089.491525423729" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" font-weight="bold" fill="var(--danger-text)">Avoid</text>

  <text x="640" y="254.234234234234" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--text)">Compression</text>

  <rect x="40" y="275.135135135135" width="386.440677966102" height="114.954954954955" rx="8.24721110845" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="311.711711711712" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.556224994012" font-weight="bold" fill="var(--info-text)">Snappy (default)</text>
  <text x="233.220338983051" y="343.063063063063" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">Fast, splittable</text>
  <text x="233.220338983051" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">Moderate ratio</text>

  <rect x="446.779661016949" y="275.135135135135" width="386.440677966102" height="114.954954954955" rx="8.24721110845" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="311.711711711712" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.556224994012" font-weight="bold" fill="var(--info-text)">GZIP</text>
  <text x="640" y="343.063063063063" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">High ratio</text>
  <text x="640" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--info-text)">CPU-heavy</text>

  <rect x="853.559322033898" y="275.135135135135" width="386.440677966102" height="114.954954954955" rx="8.24721110845" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="311.711711711712" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.556224994012" font-weight="bold" fill="var(--primary-text)">ZSTD</text>
  <text x="1046.779661016949" y="343.063063063063" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Balanced</text>
  <text x="1046.779661016949" y="369.189189189189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Ratio + speed</text>

  <text x="640" y="447.567567567568" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.618027771125" font-weight="bold" fill="var(--text)">Layout</text>

  <rect x="40" y="468.468468468468" width="386.440677966102" height="151.531531531532" rx="8.24721110845" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="505.045045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.556224994012" font-weight="bold" fill="var(--ok-text)">Partition</text>
  <text x="233.220338983051" y="536.396396396396" text-anchor="middle" font-family="Courier New, monospace" font-size="13.401718051231" fill="var(--ok-text)">year=2024/month=01/</text>
  <text x="233.220338983051" y="567.747747747748" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">Prunes scans</text>
  <text x="233.220338983051" y="593.873873873874" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--ok-text)">By date / key</text>

  <rect x="446.779661016949" y="468.468468468468" width="386.440677966102" height="151.531531531532" rx="8.24721110845" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="505.045045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.556224994012" font-weight="bold" fill="var(--primary-text)">Bucket</text>
  <text x="640" y="541.621621621622" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Pre-shuffle joins</text>
  <text x="640" y="567.747747747748" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">Fixed buckets</text>
  <text x="640" y="593.873873873874" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--primary-text)">No runtime shuffle</text>

  <rect x="853.559322033898" y="468.468468468468" width="386.440677966102" height="151.531531531532" rx="8.24721110845" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="505.045045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.556224994012" font-weight="bold" fill="var(--warn-text)">File size</text>
  <text x="1046.779661016949" y="541.621621621622" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">128MB - 1GB</text>
  <text x="1046.779661016949" y="567.747747747748" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.432619439787" fill="var(--warn-text)">Avoid small files</text>
  <text x="1046.779661016949" y="593.873873873874" text-anchor="middle" font-family="Courier New, monospace" font-size="13.401718051231" fill="var(--warn-text)">coalesce()</text>
</svg>

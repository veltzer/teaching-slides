<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="284.745762711864" height="140.934579439253" rx="8.39995021596" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.372881355932" y="77.943925233644" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9998755399" font-weight="bold" fill="var(--ok-text)">Parquet</text>
  <text x="182.372881355932" y="115.88785046729" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--ok-text)">Columnar</text>
  <text x="182.372881355932" y="142.990654205607" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--ok-text)">Best compression</text>
  <text x="182.372881355932" y="170.093457943925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" font-weight="bold" fill="var(--ok-text)">Recommended</text>

  <rect x="340" y="40" width="284.745762711864" height="140.934579439253" rx="8.39995021596" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="482.372881355932" y="77.943925233644" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9998755399" font-weight="bold" fill="var(--primary-text)">ORC</text>
  <text x="482.372881355932" y="115.88785046729" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--primary-text)">Columnar</text>
  <text x="482.372881355932" y="142.990654205607" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--primary-text)">Hive-optimized</text>
  <text x="482.372881355932" y="170.093457943925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--primary-text)">ACID</text>

  <rect x="640" y="40" width="284.745762711864" height="140.934579439253" rx="8.39995021596" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782.372881355932" y="77.943925233644" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9998755399" font-weight="bold" fill="var(--warn-text)">Avro</text>
  <text x="782.372881355932" y="115.88785046729" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--warn-text)">Row-based</text>
  <text x="782.372881355932" y="142.990654205607" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--warn-text)">Schema evolution</text>
  <text x="782.372881355932" y="170.093457943925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--warn-text)">Good for writes</text>

  <rect x="940" y="40" width="300" height="140.934579439253" rx="8.39995021596" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.491525423729" y="77.943925233644" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9998755399" font-weight="bold" fill="var(--danger-text)">CSV / JSON</text>
  <text x="1089.491525423729" y="115.88785046729" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--danger-text)">Text, no schema</text>
  <text x="1089.491525423729" y="142.990654205607" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--danger-text)">Slow to parse</text>
  <text x="1089.491525423729" y="170.093457943925" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" font-weight="bold" fill="var(--danger-text)">Avoid</text>

  <text x="640" y="240.560747663551" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9998755399" font-weight="bold" fill="var(--text)">Compression</text>

  <rect x="40" y="262.242990654205" width="386.440677966102" height="119.252336448598" rx="8.39995021596" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="300.186915887851" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.899887985909" font-weight="bold" fill="var(--info-text)">Snappy (default)</text>
  <text x="233.220338983051" y="332.710280373832" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--info-text)">Fast, splittable</text>
  <text x="233.220338983051" y="359.813084112149" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--info-text)">Moderate ratio</text>

  <rect x="446.779661016949" y="262.242990654205" width="386.440677966102" height="119.252336448598" rx="8.39995021596" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="300.186915887851" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.899887985909" font-weight="bold" fill="var(--info-text)">GZIP</text>
  <text x="640" y="332.710280373832" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--info-text)">High ratio</text>
  <text x="640" y="359.813084112149" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--info-text)">CPU-heavy</text>

  <rect x="853.559322033898" y="262.242990654205" width="386.440677966102" height="119.252336448598" rx="8.39995021596" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="300.186915887851" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.899887985909" font-weight="bold" fill="var(--primary-text)">ZSTD</text>
  <text x="1046.779661016949" y="332.710280373832" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--primary-text)">Balanced</text>
  <text x="1046.779661016949" y="359.813084112149" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--primary-text)">Ratio + speed</text>

  <text x="640" y="441.121495327103" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9998755399" font-weight="bold" fill="var(--text)">Layout</text>

  <rect x="40" y="462.803738317756" width="386.440677966102" height="157.196261682244" rx="8.39995021596" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.220338983051" y="500.747663551402" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.899887985909" font-weight="bold" fill="var(--ok-text)">Partition</text>
  <text x="233.220338983051" y="533.271028037383" text-anchor="middle" font-family="Courier New, monospace" font-size="13.649919100935" fill="var(--ok-text)">year=2024/month=01/</text>
  <text x="233.220338983051" y="565.794392523365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--ok-text)">Prunes scans</text>
  <text x="233.220338983051" y="592.897196261682" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--ok-text)">By date / key</text>

  <rect x="446.779661016949" y="462.803738317756" width="386.440677966102" height="157.196261682244" rx="8.39995021596" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="500.747663551402" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.899887985909" font-weight="bold" fill="var(--primary-text)">Bucket</text>
  <text x="640" y="538.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--primary-text)">Pre-shuffle joins</text>
  <text x="640" y="565.794392523365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--primary-text)">Fixed buckets</text>
  <text x="640" y="592.897196261682" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--primary-text)">No runtime shuffle</text>

  <rect x="853.559322033898" y="462.803738317756" width="386.440677966102" height="157.196261682244" rx="8.39995021596" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.779661016949" y="500.747663551402" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.899887985909" font-weight="bold" fill="var(--warn-text)">File size</text>
  <text x="1046.779661016949" y="538.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--warn-text)">128MB - 1GB</text>
  <text x="1046.779661016949" y="565.794392523365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.699912877929" fill="var(--warn-text)">Avoid small files</text>
  <text x="1046.779661016949" y="592.897196261682" text-anchor="middle" font-family="Courier New, monospace" font-size="13.649919100935" fill="var(--warn-text)">coalesce()</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="27.4668" font-weight="bold" fill="var(--primary-accent)">Spark Data Storage Strategies</text>
  <text x="640" y="86.1538" text-anchor="middle" font-family="Arial" font-size="21.3632" font-weight="bold" fill="var(--text)">File Formats</text>
  <rect x="40" y="104.6154" width="259.4594" height="138.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7298" y="140" text-anchor="middle" font-family="Arial" font-size="19.8372" font-weight="bold" fill="var(--ok-accent)">Parquet</text>
  <text x="169.7298" y="170.7692" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Columnar format</text>
  <text x="169.7298" y="193.8462" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Best compression</text>
  <text x="169.7298" y="216.9231" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--ok-accent)">Recommended</text>
  <rect x="331.8919" y="104.6154" width="259.4594" height="138.4615" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.6216" y="140" text-anchor="middle" font-family="Arial" font-size="19.8372" font-weight="bold" fill="var(--primary-accent)">ORC</text>
  <text x="461.6216" y="170.7692" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Columnar format</text>
  <text x="461.6216" y="193.8462" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Hive optimized</text>
  <text x="461.6216" y="216.9231" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">ACID support</text>
  <rect x="623.7838" y="104.6154" width="259.4594" height="138.4615" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5135" y="140" text-anchor="middle" font-family="Arial" font-size="19.8372" font-weight="bold" fill="var(--warn-accent)">Avro</text>
  <text x="753.5135" y="170.7692" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Row-based format</text>
  <text x="753.5135" y="193.8462" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Schema evolution</text>
  <text x="753.5135" y="216.9231" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Good for writes</text>
  <rect x="915.6757" y="104.6154" width="324.3243" height="138.4615" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8377" y="140" text-anchor="middle" font-family="Arial" font-size="19.8372" font-weight="bold" fill="var(--danger-accent)">CSV / JSON</text>
  <text x="1077.8377" y="170.7692" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Text-based, no schema</text>
  <text x="1077.8377" y="193.8462" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Large, slow to parse</text>
  <text x="1077.8377" y="216.9231" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--danger-accent)">Avoid in production</text>
  <text x="640" y="289.2308" text-anchor="middle" font-family="Arial" font-size="21.3632" font-weight="bold" fill="var(--text)">Compression Strategies</text>
  <rect x="40" y="312.3077" width="372.973" height="107.6923" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="347.6922" text-anchor="middle" font-family="Arial" font-size="18.3113" font-weight="bold" fill="var(--primary-accent)">Snappy (Default)</text>
  <text x="226.4865" y="378.4615" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Fast, moderate compression</text>
  <text x="226.4865" y="401.5383" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Splittable with Parquet</text>
  <rect x="445.4053" y="312.3077" width="372.973" height="107.6923" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.8919" y="347.6922" text-anchor="middle" font-family="Arial" font-size="18.3113" font-weight="bold" fill="var(--info-accent)">GZIP</text>
  <text x="631.8919" y="378.4615" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">High compression ratio</text>
  <text x="631.8919" y="401.5383" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Slower, CPU intensive</text>
  <rect x="850.8108" y="312.3077" width="389.1892" height="107.6923" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045.4053" y="347.6922" text-anchor="middle" font-family="Arial" font-size="18.3113" font-weight="bold" fill="var(--ok-accent)">ZSTD</text>
  <text x="1045.4053" y="378.4615" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Best of both worlds</text>
  <text x="1045.4053" y="401.5383" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Good ratio + speed</text>
  <text x="640" y="473.8461" text-anchor="middle" font-family="Arial" font-size="21.3632" font-weight="bold" fill="var(--text)">Data Layout Strategies</text>
  <rect x="40" y="496.923" width="372.973" height="123.077" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="527.6922" text-anchor="middle" font-family="Arial" font-size="18.3113" font-weight="bold" fill="var(--ok-accent)">Partition by Date</text>
  <text x="226.4865" y="558.4615" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">data/year=2024/month=01/</text>
  <text x="226.4865" y="581.5384" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Enables partition pruning</text>
  <text x="226.4865" y="604.6154" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Reduces scan size</text>
  <rect x="445.4053" y="496.923" width="389.1892" height="123.077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="527.6922" text-anchor="middle" font-family="Arial" font-size="18.3113" font-weight="bold" fill="var(--primary-accent)">Bucketing</text>
  <text x="640" y="558.4615" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Pre-shuffle for joins</text>
  <text x="640" y="581.5384" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Fixed number of buckets</text>
  <text x="640" y="604.6154" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Avoids runtime shuffles</text>
  <rect x="867.0269" y="496.923" width="372.973" height="123.077" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="527.6922" text-anchor="middle" font-family="Arial" font-size="18.3113" font-weight="bold" fill="var(--warn-accent)">File Sizing</text>
  <text x="1053.5135" y="558.4615" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Target 128MB-1GB per file</text>
  <text x="1053.5135" y="581.5384" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Avoid small files problem</text>
  <text x="1053.5135" y="604.6154" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">Use coalesce() to merge</text>
</svg>
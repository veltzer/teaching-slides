<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="589.9588" y="44.2469" text-anchor="middle" font-family="Arial" font-size="26.5481" font-weight="bold" fill="var(--primary-accent)">Spark Data Storage Strategies</text>
  <text x="589.9588" y="91.6543" text-anchor="middle" font-family="Arial" font-size="20.6486" font-weight="bold" fill="var(--text)">File Formats</text>
  <rect x="44.2469" y="110.6173" width="235.9835" height="142.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="162.2387" y="146.963" text-anchor="middle" font-family="Arial" font-size="19.1737" font-weight="bold" fill="var(--ok-accent)">Parquet</text>
  <text x="162.2387" y="178.5679" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Columnar format</text>
  <text x="162.2387" y="202.2716" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Best compression</text>
  <text x="162.2387" y="225.9753" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--ok-accent)">Recommended</text>
  <rect x="309.7284" y="110.6173" width="235.9835" height="142.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="427.7201" y="146.963" text-anchor="middle" font-family="Arial" font-size="19.1737" font-weight="bold" fill="var(--primary-accent)">ORC</text>
  <text x="427.7201" y="178.5679" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Columnar format</text>
  <text x="427.7201" y="202.2716" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Hive optimized</text>
  <text x="427.7201" y="225.9753" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">ACID support</text>
  <rect x="575.2098" y="110.6173" width="235.9835" height="142.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="693.2016" y="146.963" text-anchor="middle" font-family="Arial" font-size="19.1737" font-weight="bold" fill="var(--warn-accent)">Avro</text>
  <text x="693.2016" y="178.5679" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Row-based format</text>
  <text x="693.2016" y="202.2716" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Schema evolution</text>
  <text x="693.2016" y="225.9753" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Good for writes</text>
  <rect x="840.6913" y="110.6173" width="294.9794" height="142.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="988.1809" y="146.963" text-anchor="middle" font-family="Arial" font-size="19.1737" font-weight="bold" fill="var(--danger-accent)">CSV / JSON</text>
  <text x="988.1809" y="178.5679" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Text-based, no schema</text>
  <text x="988.1809" y="202.2716" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Large, slow to parse</text>
  <text x="988.1809" y="225.9753" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--danger-accent)">Avoid in production</text>
  <text x="589.9588" y="300.2469" text-anchor="middle" font-family="Arial" font-size="20.6486" font-weight="bold" fill="var(--text)">Compression Strategies</text>
  <rect x="44.2469" y="323.9506" width="339.2263" height="110.6173" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="213.8601" y="360.2962" text-anchor="middle" font-family="Arial" font-size="17.6988" font-weight="bold" fill="var(--primary-accent)">Snappy (Default)</text>
  <text x="213.8601" y="391.9012" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Fast, moderate compression</text>
  <text x="213.8601" y="415.6048" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Splittable with Parquet</text>
  <rect x="412.9711" y="323.9506" width="339.2263" height="110.6173" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="582.5843" y="360.2962" text-anchor="middle" font-family="Arial" font-size="17.6988" font-weight="bold" fill="var(--info-accent)">GZIP</text>
  <text x="582.5843" y="391.9012" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">High compression ratio</text>
  <text x="582.5843" y="415.6048" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Slower, CPU intensive</text>
  <rect x="781.6954" y="323.9506" width="353.9753" height="110.6173" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="958.683" y="360.2962" text-anchor="middle" font-family="Arial" font-size="17.6988" font-weight="bold" fill="var(--ok-accent)">ZSTD</text>
  <text x="958.683" y="391.9012" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Best of both worlds</text>
  <text x="958.683" y="415.6048" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Good ratio + speed</text>
  <text x="589.9588" y="489.8765" text-anchor="middle" font-family="Arial" font-size="20.6486" font-weight="bold" fill="var(--text)">Data Layout Strategies</text>
  <rect x="44.2469" y="513.5802" width="339.2263" height="126.4198" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.8601" y="545.1851" text-anchor="middle" font-family="Arial" font-size="17.6988" font-weight="bold" fill="var(--ok-accent)">Partition by Date</text>
  <text x="213.8601" y="576.7901" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">data/year=2024/month=01/</text>
  <text x="213.8601" y="600.4938" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Enables partition pruning</text>
  <text x="213.8601" y="624.1975" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Reduces scan size</text>
  <rect x="412.9711" y="513.5802" width="353.9753" height="126.4198" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="589.9588" y="545.1851" text-anchor="middle" font-family="Arial" font-size="17.6988" font-weight="bold" fill="var(--primary-accent)">Bucketing</text>
  <text x="589.9588" y="576.7901" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Pre-shuffle for joins</text>
  <text x="589.9588" y="600.4938" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Fixed number of buckets</text>
  <text x="589.9588" y="624.1975" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Avoids runtime shuffles</text>
  <rect x="796.4443" y="513.5802" width="339.2263" height="126.4198" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="966.0575" y="545.1851" text-anchor="middle" font-family="Arial" font-size="17.6988" font-weight="bold" fill="var(--warn-accent)">File Sizing</text>
  <text x="966.0575" y="576.7901" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Target 128MB-1GB per file</text>
  <text x="966.0575" y="600.4938" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Avoid small files problem</text>
  <text x="966.0575" y="624.1975" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Use coalesce() to merge</text>
</svg>
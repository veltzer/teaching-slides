<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="22.1885" y="9.0141" width="1109.4258" height="630.9859" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="576.9014" y="36.0563" text-anchor="middle" font-size="14.4225" font-weight="bold" fill="var(--text)">Pipeline Optimization Checklist</text>
  <line x1="66.5656" y1="45.0704" x2="1087.2372" y2="45.0704" stroke="var(--primary-border)" stroke-width="1.8028" />
  <rect x="66.5656" y="58.5915" width="1020.6717" height="81.1268" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="110.9426" y="78.4225" font-size="11.7183" font-weight="bold" fill="var(--text)">1. Schema Definition</text>
  <text x="110.9426" y="96.4507" font-size="10" fill="var(--text-muted)">☐ Explicit schema (no inference)</text>
  <text x="110.9426" y="111.7746" font-size="10" fill="var(--text-muted)">☐ Appropriate data types</text>
  <text x="110.9426" y="127.0986" font-size="10" fill="var(--text-muted)">☐ Nullable flags set correctly</text>
  <rect x="66.5656" y="148.7324" width="1020.6717" height="81.1268" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="110.9426" y="168.5634" font-size="11.7183" font-weight="bold" fill="var(--text)">2. Predicate Pushdown</text>
  <text x="110.9426" y="186.5915" font-size="10" fill="var(--text-muted)">☐ Filter as early as possible</text>
  <text x="110.9426" y="201.9155" font-size="10" fill="var(--text-muted)">☐ Use partition columns in filters</text>
  <text x="110.9426" y="217.2394" font-size="10" fill="var(--text-muted)">☐ Avoid UDFs in filter conditions</text>
  <rect x="66.5656" y="238.8732" width="1020.6717" height="81.1268" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="110.9426" y="258.7042" font-size="11.7183" font-weight="bold" fill="var(--text)">3. Column Pruning</text>
  <text x="110.9426" y="276.7324" font-size="10" fill="var(--text-muted)">☐ Select only needed columns</text>
  <text x="110.9426" y="292.0563" font-size="10" fill="var(--text-muted)">☐ Drop columns before joins</text>
  <text x="110.9426" y="307.3803" font-size="10" fill="var(--text-muted)">☐ Avoid SELECT *</text>
  <rect x="66.5656" y="329.0141" width="1020.6717" height="81.1268" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="110.9426" y="348.8451" font-size="11.7183" font-weight="bold" fill="var(--text)">4. Join Optimization</text>
  <text x="110.9426" y="366.8732" font-size="10" fill="var(--text-muted)">☐ Broadcast small tables</text>
  <text x="110.9426" y="382.1972" font-size="10" fill="var(--text-muted)">☐ Filter before joining</text>
  <text x="110.9426" y="397.5211" font-size="10" fill="var(--text-muted)">☐ Avoid cartesian products</text>
  <rect x="66.5656" y="419.1549" width="1020.6717" height="81.1268" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="110.9426" y="438.9859" font-size="11.7183" font-weight="bold" fill="var(--text)">5. Caching</text>
  <text x="110.9426" y="457.0141" font-size="10" fill="var(--text-muted)">☐ Cache reused DataFrames</text>
  <text x="110.9426" y="472.338" font-size="10" fill="var(--text-muted)">☐ Unpersist when done</text>
  <text x="110.9426" y="487.662" font-size="10" fill="var(--text-muted)">☐ Choose appropriate storage level</text>
  <rect x="66.5656" y="509.2958" width="1020.6717" height="81.1268" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="110.9426" y="529.1268" font-size="11.7183" font-weight="bold" fill="var(--text)">6. Shuffle Management</text>
  <text x="110.9426" y="547.1549" font-size="10" fill="var(--text-muted)">☐ Tune shuffle partitions</text>
  <text x="110.9426" y="562.4789" font-size="10" fill="var(--text-muted)">☐ Coalesce before writing</text>
  <text x="110.9426" y="577.8028" font-size="10" fill="var(--text-muted)">☐ Enable AQE</text>
</svg>
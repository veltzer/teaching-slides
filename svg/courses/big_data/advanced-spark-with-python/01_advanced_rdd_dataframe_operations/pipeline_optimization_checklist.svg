<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="64.8571" text-anchor="middle" font-size="14.3809" font-weight="bold" fill="var(--text)">Pipeline Optimization Checklist</text>
  <line x1="88.0001" y1="73.1428" x2="1191.9999" y2="73.1428" stroke="var(--primary-border)" stroke-width="1.8028" />
  <rect x="88.0001" y="85.5714" width="1104" height="74.5715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="103.8" font-size="11.6845" font-weight="bold" fill="var(--text)">1. Schema Definition</text>
  <text x="136" y="120.3714" font-size="10" fill="var(--text-muted)">☐ Explicit schema (no inference)</text>
  <text x="136" y="134.4571" font-size="10" fill="var(--text-muted)">☐ Appropriate data types</text>
  <text x="136" y="148.5429" font-size="10" fill="var(--text-muted)">☐ Nullable flags set correctly</text>
  <rect x="88.0001" y="168.4286" width="1104" height="74.5715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="186.6572" font-size="11.6845" font-weight="bold" fill="var(--text)">2. Predicate Pushdown</text>
  <text x="136" y="203.2285" font-size="10" fill="var(--text-muted)">☐ Filter as early as possible</text>
  <text x="136" y="217.3143" font-size="10" fill="var(--text-muted)">☐ Use partition columns in filters</text>
  <text x="136" y="231.4" font-size="10" fill="var(--text-muted)">☐ Avoid UDFs in filter conditions</text>
  <rect x="88.0001" y="251.2857" width="1104" height="74.5715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="269.5143" font-size="11.6845" font-weight="bold" fill="var(--text)">3. Column Pruning</text>
  <text x="136" y="286.0857" font-size="10" fill="var(--text-muted)">☐ Select only needed columns</text>
  <text x="136" y="300.1714" font-size="10" fill="var(--text-muted)">☐ Drop columns before joins</text>
  <text x="136" y="314.2572" font-size="10" fill="var(--text-muted)">☐ Avoid SELECT *</text>
  <rect x="88.0001" y="334.1429" width="1104" height="74.5715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="352.3714" font-size="11.6845" font-weight="bold" fill="var(--text)">4. Join Optimization</text>
  <text x="136" y="368.9428" font-size="10" fill="var(--text-muted)">☐ Broadcast small tables</text>
  <text x="136" y="383.0286" font-size="10" fill="var(--text-muted)">☐ Filter before joining</text>
  <text x="136" y="397.1143" font-size="10" fill="var(--text-muted)">☐ Avoid cartesian products</text>
  <rect x="88.0001" y="417" width="1104" height="74.5715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="435.2286" font-size="11.6845" font-weight="bold" fill="var(--text)">5. Caching</text>
  <text x="136" y="451.8" font-size="10" fill="var(--text-muted)">☐ Cache reused DataFrames</text>
  <text x="136" y="465.8857" font-size="10" fill="var(--text-muted)">☐ Unpersist when done</text>
  <text x="136" y="479.9715" font-size="10" fill="var(--text-muted)">☐ Choose appropriate storage level</text>
  <rect x="88.0001" y="499.8572" width="1104" height="74.5715" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="518.0857" font-size="11.6845" font-weight="bold" fill="var(--text)">6. Shuffle Management</text>
  <text x="136" y="534.6571" font-size="10" fill="var(--text-muted)">☐ Tune shuffle partitions</text>
  <text x="136" y="548.7429" font-size="10" fill="var(--text-muted)">☐ Coalesce before writing</text>
  <text x="136" y="562.8286" font-size="10" fill="var(--text-muted)">☐ Enable AQE</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="22.1885" y="9.0141" width="1109.4258" height="630.9859" rx="4.507" fill="#f9f9f9" stroke="#4a90e2" stroke-width="1.8028" />
  <ns0:text x="576.9014" y="36.0563" text-anchor="middle" font-size="14.4225" font-weight="bold" fill="#333">Pipeline Optimization Checklist</ns0:text>
  <ns0:line x1="66.5656" y1="45.0704" x2="1087.2372" y2="45.0704" stroke="#4a90e2" stroke-width="1.8028" />
  <ns0:rect x="66.5656" y="58.5915" width="1020.6717" height="81.1268" rx="4.507" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="78.4225" font-size="11.7183" font-weight="bold" fill="#333">1. Schema Definition</ns0:text>
  <ns0:text x="110.9426" y="96.4507" font-size="10" fill="#555">☐ Explicit schema (no inference)</ns0:text>
  <ns0:text x="110.9426" y="111.7746" font-size="10" fill="#555">☐ Appropriate data types</ns0:text>
  <ns0:text x="110.9426" y="127.0986" font-size="10" fill="#555">☐ Nullable flags set correctly</ns0:text>
  <ns0:rect x="66.5656" y="148.7324" width="1020.6717" height="81.1268" rx="4.507" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="168.5634" font-size="11.7183" font-weight="bold" fill="#333">2. Predicate Pushdown</ns0:text>
  <ns0:text x="110.9426" y="186.5915" font-size="10" fill="#555">☐ Filter as early as possible</ns0:text>
  <ns0:text x="110.9426" y="201.9155" font-size="10" fill="#555">☐ Use partition columns in filters</ns0:text>
  <ns0:text x="110.9426" y="217.2394" font-size="10" fill="#555">☐ Avoid UDFs in filter conditions</ns0:text>
  <ns0:rect x="66.5656" y="238.8732" width="1020.6717" height="81.1268" rx="4.507" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="258.7042" font-size="11.7183" font-weight="bold" fill="#333">3. Column Pruning</ns0:text>
  <ns0:text x="110.9426" y="276.7324" font-size="10" fill="#555">☐ Select only needed columns</ns0:text>
  <ns0:text x="110.9426" y="292.0563" font-size="10" fill="#555">☐ Drop columns before joins</ns0:text>
  <ns0:text x="110.9426" y="307.3803" font-size="10" fill="#555">☐ Avoid SELECT *</ns0:text>
  <ns0:rect x="66.5656" y="329.0141" width="1020.6717" height="81.1268" rx="4.507" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="348.8451" font-size="11.7183" font-weight="bold" fill="#333">4. Join Optimization</ns0:text>
  <ns0:text x="110.9426" y="366.8732" font-size="10" fill="#555">☐ Broadcast small tables</ns0:text>
  <ns0:text x="110.9426" y="382.1972" font-size="10" fill="#555">☐ Filter before joining</ns0:text>
  <ns0:text x="110.9426" y="397.5211" font-size="10" fill="#555">☐ Avoid cartesian products</ns0:text>
  <ns0:rect x="66.5656" y="419.1549" width="1020.6717" height="81.1268" rx="4.507" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="438.9859" font-size="11.7183" font-weight="bold" fill="#333">5. Caching</ns0:text>
  <ns0:text x="110.9426" y="457.0141" font-size="10" fill="#555">☐ Cache reused DataFrames</ns0:text>
  <ns0:text x="110.9426" y="472.338" font-size="10" fill="#555">☐ Unpersist when done</ns0:text>
  <ns0:text x="110.9426" y="487.662" font-size="10" fill="#555">☐ Choose appropriate storage level</ns0:text>
  <ns0:rect x="66.5656" y="509.2958" width="1020.6717" height="81.1268" rx="4.507" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="529.1268" font-size="11.7183" font-weight="bold" fill="#333">6. Shuffle Management</ns0:text>
  <ns0:text x="110.9426" y="547.1549" font-size="10" fill="#555">☐ Tune shuffle partitions</ns0:text>
  <ns0:text x="110.9426" y="562.4789" font-size="10" fill="#555">☐ Coalesce before writing</ns0:text>
  <ns0:text x="110.9426" y="577.8028" font-size="10" fill="#555">☐ Enable AQE</ns0:text>
</ns0:svg>
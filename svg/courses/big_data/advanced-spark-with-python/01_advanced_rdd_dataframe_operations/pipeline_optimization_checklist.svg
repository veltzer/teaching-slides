<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999891" y="40" text-anchor="middle" font-size="15.995711" font-weight="bold" fill="var(--text)">Pipeline Optimization Checklist</text>
  <line x1="40" y1="49.430875" x2="1239.999783" y2="49.430875" stroke="var(--primary-border)" stroke-width="1.8028" />
  <rect x="40" y="63.577244" width="1200" height="84.878102" rx="6.673731" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804" y="84.325237" font-size="12.996536" font-weight="bold" fill="var(--text)">1. Schema Definition</text>
  <text x="92.173804" y="103.186987" font-size="11.122886" fill="var(--text-muted)">☐ Explicit schema (no inference)</text>
  <text x="92.173804" y="119.219486" font-size="11.122886" fill="var(--text-muted)">☐ Appropriate data types</text>
  <text x="92.173804" y="135.252098" font-size="11.122886" fill="var(--text-muted)">☐ Nullable flags set correctly</text>
  <rect x="40" y="157.886221" width="1200" height="84.878102" rx="6.673731" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804" y="178.634214" font-size="12.996536" font-weight="bold" fill="var(--text)">2. Predicate Pushdown</text>
  <text x="92.173804" y="197.495849" font-size="11.122886" fill="var(--text-muted)">☐ Filter as early as possible</text>
  <text x="92.173804" y="213.528462" font-size="11.122886" fill="var(--text-muted)">☐ Use partition columns in filters</text>
  <text x="92.173804" y="229.560961" font-size="11.122886" fill="var(--text-muted)">☐ Avoid UDFs in filter conditions</text>
  <rect x="40" y="252.195083" width="1200" height="84.878102" rx="6.673731" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804" y="272.943076" font-size="12.996536" font-weight="bold" fill="var(--text)">3. Column Pruning</text>
  <text x="92.173804" y="291.804826" font-size="11.122886" fill="var(--text-muted)">☐ Select only needed columns</text>
  <text x="92.173804" y="307.837325" font-size="11.122886" fill="var(--text-muted)">☐ Drop columns before joins</text>
  <text x="92.173804" y="323.869937" font-size="11.122886" fill="var(--text-muted)">☐ Avoid SELECT *</text>
  <rect x="40" y="346.504059" width="1200" height="84.878102" rx="6.673731" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804" y="367.251939" font-size="12.996536" font-weight="bold" fill="var(--text)">4. Join Optimization</text>
  <text x="92.173804" y="386.113688" font-size="11.122886" fill="var(--text-muted)">☐ Broadcast small tables</text>
  <text x="92.173804" y="402.146301" font-size="11.122886" fill="var(--text-muted)">☐ Filter before joining</text>
  <text x="92.173804" y="418.1788" font-size="11.122886" fill="var(--text-muted)">☐ Avoid cartesian products</text>
  <rect x="40" y="440.812922" width="1200" height="84.878102" rx="6.673731" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804" y="461.560915" font-size="12.996536" font-weight="bold" fill="var(--text)">5. Caching</text>
  <text x="92.173804" y="480.422665" font-size="11.122886" fill="var(--text-muted)">☐ Cache reused DataFrames</text>
  <text x="92.173804" y="496.455164" font-size="11.122886" fill="var(--text-muted)">☐ Unpersist when done</text>
  <text x="92.173804" y="512.487776" font-size="11.122886" fill="var(--text-muted)">☐ Choose appropriate storage level</text>
  <rect x="40" y="535.121898" width="1200" height="84.878102" rx="6.673731" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804" y="555.869778" font-size="12.996536" font-weight="bold" fill="var(--text)">6. Shuffle Management</text>
  <text x="92.173804" y="574.731527" font-size="11.122886" fill="var(--text-muted)">☐ Tune shuffle partitions</text>
  <text x="92.173804" y="590.76414" font-size="11.122886" fill="var(--text-muted)">☐ Coalesce before writing</text>
  <text x="92.173804" y="606.796639" font-size="11.122886" fill="var(--text-muted)">☐ Enable AQE</text>
</svg>
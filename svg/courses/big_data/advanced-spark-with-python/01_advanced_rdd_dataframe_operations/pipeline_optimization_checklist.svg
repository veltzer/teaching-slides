<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="24.6154" y="10" width="1230.7692" height="700" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2" />
  <text x="640" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Pipeline Optimization Checklist</text>
  <line x1="73.8462" y1="50" x2="1206.1538" y2="50" stroke="#4a90e2" stroke-width="2" />
  <rect x="73.8462" y="65" width="1132.3077" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="123.0769" y="87" font-size="13" font-weight="bold" fill="#333">1. Schema Definition</text>
  <text x="123.0769" y="107" font-size="11" fill="#555">☐ Explicit schema (no inference)</text>
  <text x="123.0769" y="124" font-size="11" fill="#555">☐ Appropriate data types</text>
  <text x="123.0769" y="141" font-size="11" fill="#555">☐ Nullable flags set correctly</text>
  <rect x="73.8462" y="165" width="1132.3077" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="123.0769" y="187" font-size="13" font-weight="bold" fill="#333">2. Predicate Pushdown</text>
  <text x="123.0769" y="207" font-size="11" fill="#555">☐ Filter as early as possible</text>
  <text x="123.0769" y="224" font-size="11" fill="#555">☐ Use partition columns in filters</text>
  <text x="123.0769" y="241" font-size="11" fill="#555">☐ Avoid UDFs in filter conditions</text>
  <rect x="73.8462" y="265" width="1132.3077" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="123.0769" y="287" font-size="13" font-weight="bold" fill="#333">3. Column Pruning</text>
  <text x="123.0769" y="307" font-size="11" fill="#555">☐ Select only needed columns</text>
  <text x="123.0769" y="324" font-size="11" fill="#555">☐ Drop columns before joins</text>
  <text x="123.0769" y="341" font-size="11" fill="#555">☐ Avoid SELECT *</text>
  <rect x="73.8462" y="365" width="1132.3077" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="123.0769" y="387" font-size="13" font-weight="bold" fill="#333">4. Join Optimization</text>
  <text x="123.0769" y="407" font-size="11" fill="#555">☐ Broadcast small tables</text>
  <text x="123.0769" y="424" font-size="11" fill="#555">☐ Filter before joining</text>
  <text x="123.0769" y="441" font-size="11" fill="#555">☐ Avoid cartesian products</text>
  <rect x="73.8462" y="465" width="1132.3077" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="123.0769" y="487" font-size="13" font-weight="bold" fill="#333">5. Caching</text>
  <text x="123.0769" y="507" font-size="11" fill="#555">☐ Cache reused DataFrames</text>
  <text x="123.0769" y="524" font-size="11" fill="#555">☐ Unpersist when done</text>
  <text x="123.0769" y="541" font-size="11" fill="#555">☐ Choose appropriate storage level</text>
  <rect x="73.8462" y="565" width="1132.3077" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5" />
  <text x="123.0769" y="587" font-size="13" font-weight="bold" fill="#333">6. Shuffle Management</text>
  <text x="123.0769" y="607" font-size="11" fill="#555">☐ Tune shuffle partitions</text>
  <text x="123.0769" y="624" font-size="11" fill="#555">☐ Coalesce before writing</text>
  <text x="123.0769" y="641" font-size="11" fill="#555">☐ Enable AQE</text>
</svg>
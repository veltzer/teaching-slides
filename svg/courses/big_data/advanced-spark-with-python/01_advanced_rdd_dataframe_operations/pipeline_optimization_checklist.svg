<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <ns0:rect x="22.1885" y="9.0141" width="1109.4258" height="630.9859" rx="4.507" fill="var(--surface-light)" stroke="var(--primary-bright)" stroke-width="1.8028" />
  <ns0:text x="576.9014" y="36.0563" text-anchor="middle" font-size="14.4225" font-weight="bold" fill="var(--text-dark)">Pipeline Optimization Checklist</ns0:text>
  <ns0:line x1="66.5656" y1="45.0704" x2="1087.2372" y2="45.0704" stroke="var(--primary-bright)" stroke-width="1.8028" />
  <ns0:rect x="66.5656" y="58.5915" width="1020.6717" height="81.1268" rx="4.507" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="78.4225" font-size="11.7183" font-weight="bold" fill="var(--text-dark)">1. Schema Definition</ns0:text>
  <ns0:text x="110.9426" y="96.4507" font-size="10" fill="var(--text-muted)">☐ Explicit schema (no inference)</ns0:text>
  <ns0:text x="110.9426" y="111.7746" font-size="10" fill="var(--text-muted)">☐ Appropriate data types</ns0:text>
  <ns0:text x="110.9426" y="127.0986" font-size="10" fill="var(--text-muted)">☐ Nullable flags set correctly</ns0:text>
  <ns0:rect x="66.5656" y="148.7324" width="1020.6717" height="81.1268" rx="4.507" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="168.5634" font-size="11.7183" font-weight="bold" fill="var(--text-dark)">2. Predicate Pushdown</ns0:text>
  <ns0:text x="110.9426" y="186.5915" font-size="10" fill="var(--text-muted)">☐ Filter as early as possible</ns0:text>
  <ns0:text x="110.9426" y="201.9155" font-size="10" fill="var(--text-muted)">☐ Use partition columns in filters</ns0:text>
  <ns0:text x="110.9426" y="217.2394" font-size="10" fill="var(--text-muted)">☐ Avoid UDFs in filter conditions</ns0:text>
  <ns0:rect x="66.5656" y="238.8732" width="1020.6717" height="81.1268" rx="4.507" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="258.7042" font-size="11.7183" font-weight="bold" fill="var(--text-dark)">3. Column Pruning</ns0:text>
  <ns0:text x="110.9426" y="276.7324" font-size="10" fill="var(--text-muted)">☐ Select only needed columns</ns0:text>
  <ns0:text x="110.9426" y="292.0563" font-size="10" fill="var(--text-muted)">☐ Drop columns before joins</ns0:text>
  <ns0:text x="110.9426" y="307.3803" font-size="10" fill="var(--text-muted)">☐ Avoid SELECT *</ns0:text>
  <ns0:rect x="66.5656" y="329.0141" width="1020.6717" height="81.1268" rx="4.507" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="348.8451" font-size="11.7183" font-weight="bold" fill="var(--text-dark)">4. Join Optimization</ns0:text>
  <ns0:text x="110.9426" y="366.8732" font-size="10" fill="var(--text-muted)">☐ Broadcast small tables</ns0:text>
  <ns0:text x="110.9426" y="382.1972" font-size="10" fill="var(--text-muted)">☐ Filter before joining</ns0:text>
  <ns0:text x="110.9426" y="397.5211" font-size="10" fill="var(--text-muted)">☐ Avoid cartesian products</ns0:text>
  <ns0:rect x="66.5656" y="419.1549" width="1020.6717" height="81.1268" rx="4.507" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="438.9859" font-size="11.7183" font-weight="bold" fill="var(--text-dark)">5. Caching</ns0:text>
  <ns0:text x="110.9426" y="457.0141" font-size="10" fill="var(--text-muted)">☐ Cache reused DataFrames</ns0:text>
  <ns0:text x="110.9426" y="472.338" font-size="10" fill="var(--text-muted)">☐ Unpersist when done</ns0:text>
  <ns0:text x="110.9426" y="487.662" font-size="10" fill="var(--text-muted)">☐ Choose appropriate storage level</ns0:text>
  <ns0:rect x="66.5656" y="509.2958" width="1020.6717" height="81.1268" rx="4.507" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.3521" />
  <ns0:text x="110.9426" y="529.1268" font-size="11.7183" font-weight="bold" fill="var(--text-dark)">6. Shuffle Management</ns0:text>
  <ns0:text x="110.9426" y="547.1549" font-size="10" fill="var(--text-muted)">☐ Tune shuffle partitions</ns0:text>
  <ns0:text x="110.9426" y="562.4789" font-size="10" fill="var(--text-muted)">☐ Coalesce before writing</ns0:text>
  <ns0:text x="110.9426" y="577.8028" font-size="10" fill="var(--text-muted)">☐ Enable AQE</ns0:text>
</ns0:svg>
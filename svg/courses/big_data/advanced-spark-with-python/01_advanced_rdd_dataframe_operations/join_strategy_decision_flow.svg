<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="51.4286" text-anchor="middle" font-size="30.8571" font-weight="bold" fill="var(--text)">Join Strategy Decision Flow</text>
  <rect x="475.4286" y="85.7143" width="329.1429" height="68.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="128.5714" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="var(--text)">Join Request</text>
  <line x1="640" y1="154.2857" x2="640" y2="205.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="aJn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 5.1429 L 0 10.2857" fill="#333" />
    </marker>
  </defs>
  <rect x="475.4286" y="214.2857" width="329.1429" height="68.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="257.1429" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="var(--text)">Table size?</text>
  <line x1="512" y1="282.8571" x2="237.7143" y2="360" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <line x1="640" y1="282.8571" x2="640" y2="360" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <line x1="768" y1="282.8571" x2="1042.2857" y2="360" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <rect x="100.5714" y="368.5714" width="274.2857" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="237.7143" y="408" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="var(--text)">&lt; 10 MB</text>
  <rect x="502.8571" y="368.5714" width="274.2857" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="408" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="var(--text)">10 MB - 1 GB</text>
  <rect x="905.1429" y="368.5714" width="274.2857" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1042.2857" y="408" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="var(--text)">&gt; 1 GB</text>
  <line x1="237.7143" y1="428.5714" x2="237.7143" y2="480" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <line x1="640" y1="428.5714" x2="640" y2="480" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <line x1="1042.2857" y1="428.5714" x2="1042.2857" y2="480" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <rect x="73.1429" y="488.5714" width="329.1429" height="94.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="237.7143" y="531.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="var(--ok-accent)">Broadcast Hash Join</text>
  <text x="237.7143" y="565.7143" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">No shuffle | O(n)</text>
  <rect x="475.4286" y="488.5714" width="329.1429" height="94.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="531.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="var(--danger-accent)">Shuffle Hash Join</text>
  <text x="640" y="565.7143" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">Shuffle | O(n+m)</text>
  <rect x="877.7143" y="488.5714" width="329.1429" height="94.2857" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1042.2857" y="531.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="var(--danger-accent)">Sort-Merge Join</text>
  <text x="1042.2857" y="565.7143" text-anchor="middle" font-size="18.8571" fill="var(--text-muted)">Shuffle+Sort | O(nlogn)</text>
</svg>
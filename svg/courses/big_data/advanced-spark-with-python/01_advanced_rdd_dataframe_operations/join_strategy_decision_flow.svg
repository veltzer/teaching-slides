<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="639.9999" y="40" text-anchor="middle" font-size="33.1654" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Join Strategy Decision Flow</text>
  <rect x="465.8064" y="77.4193" width="348.3871" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="124.1935" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Join Request</text>
  <line x1="639.9999" y1="152.258" x2="639.9999" y2="208.3871" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="465.8064" y="217.7419" width="348.3871" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="264.5162" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Table size?</text>
  <line x1="504.5161" y1="292.5806" x2="214.1935" y2="376.7742" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="292.5806" x2="639.9999" y2="376.7742" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="775.4838" y1="292.5806" x2="1065.8064" y2="376.7742" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="69.0322" y="386.129" width="290.3226" height="65.4839" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1935" y="429.1613" text-anchor="middle" font-size="22.1103" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">&lt; 10 MB</text>
  <rect x="494.8386" y="386.129" width="290.3226" height="65.4839" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="429.1613" text-anchor="middle" font-size="22.1103" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">10 MB - 1 GB</text>
  <rect x="920.6452" y="386.129" width="290.3226" height="65.4839" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065.8064" y="429.1613" text-anchor="middle" font-size="22.1103" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">&gt; 1 GB</text>
  <line x1="214.1935" y1="451.6129" x2="214.1935" y2="507.742" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="451.6129" x2="639.9999" y2="507.742" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1065.8064" y1="451.6129" x2="1065.8064" y2="507.742" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="517.0968" width="348.3871" height="102.9032" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1935" y="563.871" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Broadcast Hash Join</text>
  <text x="214.1935" y="601.2904" text-anchor="middle" font-size="20.2677" fill="var(--text-muted)" font-family="Arial, sans-serif">No shuffle | O(n)</text>
  <rect x="465.8064" y="517.0968" width="348.3871" height="102.9032" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="563.871" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Shuffle Hash Join</text>
  <text x="639.9999" y="601.2904" text-anchor="middle" font-size="20.2677" fill="var(--text-muted)" font-family="Arial, sans-serif">Shuffle | O(n+m)</text>
  <rect x="891.6129" y="517.0968" width="348.3871" height="102.9032" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065.8064" y="563.871" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Sort-Merge Join</text>
  <text x="1065.8064" y="601.2904" text-anchor="middle" font-size="20.2677" fill="var(--text-muted)" font-family="Arial, sans-serif">Shuffle+Sort | O(nlogn)</text>
</svg>

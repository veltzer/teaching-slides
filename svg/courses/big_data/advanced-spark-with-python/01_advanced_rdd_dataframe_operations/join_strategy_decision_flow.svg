<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Join Strategy Decision Flow</text>
  <!-- Join Request -->
  <rect x="260" y="50" width="180" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Join Request</text>
  <line x1="350" y1="90" x2="350" y2="120" stroke="#333" stroke-width="2" marker-end="url(#aJn)"/>
  <defs><marker id="aJn" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#333"/></marker></defs>
  <!-- Table size? -->
  <rect x="260" y="125" width="180" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Table size?</text>
  <!-- Branches -->
  <line x1="280" y1="165" x2="130" y2="210" stroke="#333" stroke-width="2" marker-end="url(#aJn)"/>
  <line x1="350" y1="165" x2="350" y2="210" stroke="#333" stroke-width="2" marker-end="url(#aJn)"/>
  <line x1="420" y1="165" x2="570" y2="210" stroke="#333" stroke-width="2" marker-end="url(#aJn)"/>
  <!-- Size labels -->
  <rect x="55" y="215" width="150" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="130" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">&lt; 10 MB</text>
  <rect x="275" y="215" width="150" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="350" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">10 MB - 1 GB</text>
  <rect x="495" y="215" width="150" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="570" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">&gt; 1 GB</text>
  <!-- Arrows to strategies -->
  <line x1="130" y1="250" x2="130" y2="280" stroke="#333" stroke-width="2" marker-end="url(#aJn)"/>
  <line x1="350" y1="250" x2="350" y2="280" stroke="#333" stroke-width="2" marker-end="url(#aJn)"/>
  <line x1="570" y1="250" x2="570" y2="280" stroke="#333" stroke-width="2" marker-end="url(#aJn)"/>
  <!-- Strategies -->
  <rect x="40" y="285" width="180" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="130" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Broadcast Hash Join</text>
  <text x="130" y="330" text-anchor="middle" font-size="11" fill="#555">No shuffle | O(n)</text>
  <rect x="260" y="285" width="180" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Shuffle Hash Join</text>
  <text x="350" y="330" text-anchor="middle" font-size="11" fill="#555">Shuffle | O(n+m)</text>
  <rect x="480" y="285" width="180" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="570" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Sort-Merge Join</text>
  <text x="570" y="330" text-anchor="middle" font-size="11" fill="#555">Shuffle+Sort | O(nlogn)</text>
</svg>
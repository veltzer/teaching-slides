<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="33.1654" font-weight="bold" fill="var(--text)">Join Strategy Decision Flow</text>
  <rect x="465.8064" y="77.4193" width="348.3871" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="124.1935" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--text)">Join Request</text>
  <line x1="639.9999" y1="152.258" x2="639.9999" y2="208.3871" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="aJn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 14.6286 5.1429 L 0 10.2857" fill="#333" />
    </marker>
  </defs>
  <rect x="465.8064" y="217.7419" width="348.3871" height="74.8387" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="264.5162" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--text)">Table size?</text>
  <line x1="504.5161" y1="292.5806" x2="214.1935" y2="376.7742" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <line x1="639.9999" y1="292.5806" x2="639.9999" y2="376.7742" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <line x1="775.4838" y1="292.5806" x2="1065.8064" y2="376.7742" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <rect x="69.0322" y="386.129" width="290.3226" height="65.4839" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1935" y="429.1613" text-anchor="middle" font-size="22.1103" font-weight="bold" fill="var(--text)">&lt; 10 MB</text>
  <rect x="494.8386" y="386.129" width="290.3226" height="65.4839" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="429.1613" text-anchor="middle" font-size="22.1103" font-weight="bold" fill="var(--text)">10 MB - 1 GB</text>
  <rect x="920.6452" y="386.129" width="290.3226" height="65.4839" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065.8064" y="429.1613" text-anchor="middle" font-size="22.1103" font-weight="bold" fill="var(--text)">&gt; 1 GB</text>
  <line x1="214.1935" y1="451.6129" x2="214.1935" y2="507.742" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <line x1="639.9999" y1="451.6129" x2="639.9999" y2="507.742" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <line x1="1065.8064" y1="451.6129" x2="1065.8064" y2="507.742" stroke="var(--text)" stroke-width="2" marker-end="url(#aJn)" />
  <rect x="40" y="517.0968" width="348.3871" height="102.9032" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.1935" y="563.871" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--ok-accent)">Broadcast Hash Join</text>
  <text x="214.1935" y="601.2904" text-anchor="middle" font-size="20.2677" fill="var(--text-muted)">No shuffle | O(n)</text>
  <rect x="465.8064" y="517.0968" width="348.3871" height="102.9032" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="563.871" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--danger-accent)">Shuffle Hash Join</text>
  <text x="639.9999" y="601.2904" text-anchor="middle" font-size="20.2677" fill="var(--text-muted)">Shuffle | O(n+m)</text>
  <rect x="891.6129" y="517.0968" width="348.3871" height="102.9032" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065.8064" y="563.871" text-anchor="middle" font-size="23.9528" font-weight="bold" fill="var(--danger-accent)">Sort-Merge Join</text>
  <text x="1065.8064" y="601.2904" text-anchor="middle" font-size="20.2677" fill="var(--text-muted)">Shuffle+Sort | O(nlogn)</text>
</svg>
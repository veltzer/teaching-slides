<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="51.4286" text-anchor="middle" font-size="30.8571" font-weight="bold" fill="#333">Join Strategy Decision Flow</text>
  <rect x="475.4286" y="85.7143" width="329.1429" height="68.5714" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4286" />
  <text x="640" y="128.5714" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#333">Join Request</text>
  <line x1="640" y1="154.2857" x2="640" y2="205.7143" stroke="#333" stroke-width="3.4286" marker-end="url(#aJn)" />
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="aJn" markerWidth="14.6286" markerHeight="10.2857" refX="14.6286" refY="5.1429" orient="auto">
      <path d="M 0 0 L 14.6286 5.1429 L 0 10.2857" fill="#333" />
    </marker>
  </defs>
  <rect x="475.4286" y="214.2857" width="329.1429" height="68.5714" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4286" />
  <text x="640" y="257.1429" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#333">Table size?</text>
  <line x1="512" y1="282.8571" x2="237.7143" y2="360" stroke="#333" stroke-width="3.4286" marker-end="url(#aJn)" />
  <line x1="640" y1="282.8571" x2="640" y2="360" stroke="#333" stroke-width="3.4286" marker-end="url(#aJn)" />
  <line x1="768" y1="282.8571" x2="1042.2857" y2="360" stroke="#333" stroke-width="3.4286" marker-end="url(#aJn)" />
  <rect x="100.5714" y="368.5714" width="274.2857" height="60" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="2.5714" />
  <text x="237.7143" y="408" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="#333">&lt; 10 MB</text>
  <rect x="502.8571" y="368.5714" width="274.2857" height="60" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5714" />
  <text x="640" y="408" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="#333">10 MB - 1 GB</text>
  <rect x="905.1429" y="368.5714" width="274.2857" height="60" rx="8.5714" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5714" />
  <text x="1042.2857" y="408" text-anchor="middle" font-size="20.5714" font-weight="bold" fill="#333">&gt; 1 GB</text>
  <line x1="237.7143" y1="428.5714" x2="237.7143" y2="480" stroke="#333" stroke-width="3.4286" marker-end="url(#aJn)" />
  <line x1="640" y1="428.5714" x2="640" y2="480" stroke="#333" stroke-width="3.4286" marker-end="url(#aJn)" />
  <line x1="1042.2857" y1="428.5714" x2="1042.2857" y2="480" stroke="#333" stroke-width="3.4286" marker-end="url(#aJn)" />
  <rect x="73.1429" y="488.5714" width="329.1429" height="94.2857" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="3.4286" />
  <text x="237.7143" y="531.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#28a745">Broadcast Hash Join</text>
  <text x="237.7143" y="565.7143" text-anchor="middle" font-size="18.8571" fill="#555">No shuffle | O(n)</text>
  <rect x="475.4286" y="488.5714" width="329.1429" height="94.2857" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4286" />
  <text x="640" y="531.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#bf360c">Shuffle Hash Join</text>
  <text x="640" y="565.7143" text-anchor="middle" font-size="18.8571" fill="#555">Shuffle | O(n+m)</text>
  <rect x="877.7143" y="488.5714" width="329.1429" height="94.2857" rx="8.5714" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4286" />
  <text x="1042.2857" y="531.4286" text-anchor="middle" font-size="22.2857" font-weight="bold" fill="#dc3545">Sort-Merge Join</text>
  <text x="1042.2857" y="565.7143" text-anchor="middle" font-size="18.8571" fill="#555">Shuffle+Sort | O(nlogn)</text>
</svg>
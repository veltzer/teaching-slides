  <text x="236.0784" y="201.8932" text-anchor="middle" font-size="19.3183" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Cluster Configuration</text>
  <rect x="63.5294" y="218.7863" width="345.098" height="30.9709" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4545" />
  <text x="236.0784" y="239.9029" text-anchor="middle" font-size="14.8603" fill="var(--text)" font-family="Arial, sans-serif">executor.memory = 4-8g</text>

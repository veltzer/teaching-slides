  <rect x="322.353" y="70.9709" width="203.9216" height="70.3884" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="424.3137" y="101.9418" text-anchor="middle" font-family="Arial" font-size="17.8322" font-weight="bold" fill="var(--warn-accent)">Testing</text>
  <text x="424.3137" y="124.466" text-anchor="middle" font-family="Arial" font-size="14.8603" fill="var(--text-muted)">Staging cluster</text>

  <rect x="589.0196" y="70.9709" width="203.9216" height="70.3884" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="690.9804" y="101.9418" text-anchor="middle" font-family="Arial" font-size="17.8322" font-weight="bold" fill="var(--ok-accent)">Production</text>
  <text x="690.9804" y="124.466" text-anchor="middle" font-family="Arial" font-size="14.8603" fill="var(--text-muted)">YARN / K8s cluster</text>
  <line x1="792.9411" y1="106.165" x2="847.8431" y2="106.165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="855.6862" y="70.9709" width="203.9216" height="70.3884" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.647" y="101.9418" text-anchor="middle" font-family="Arial" font-size="17.8322" font-weight="bold" fill="var(--info-accent)">Monitoring</text>
  <text x="957.647" y="124.466" text-anchor="middle" font-family="Arial" font-size="14.8603" fill="var(--text-muted)">Alerts + Dashboards</text>

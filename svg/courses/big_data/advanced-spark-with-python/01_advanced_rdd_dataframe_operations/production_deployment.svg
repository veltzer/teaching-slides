  <line x1="526.2745" y1="106.165" x2="581.1765" y2="106.165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="589.0196" y="70.9709" width="203.9216" height="70.3884" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="690.9804" y="101.9418" text-anchor="middle" font-size="17.8322" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Production</text>
  <text x="690.9804" y="124.466" text-anchor="middle" font-size="14.8603" fill="var(--text-muted)" font-family="Arial, sans-serif">YARN / K8s cluster</text>
  <line x1="792.9411" y1="106.165" x2="847.8431" y2="106.165" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="855.6862" y="70.9709" width="203.9216" height="70.3884" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.647" y="101.9418" text-anchor="middle" font-size="17.8322" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Monitoring</text>
  <text x="957.647" y="124.466" text-anchor="middle" font-size="14.8603" fill="var(--text-muted)" font-family="Arial, sans-serif">Alerts + Dashboards</text>

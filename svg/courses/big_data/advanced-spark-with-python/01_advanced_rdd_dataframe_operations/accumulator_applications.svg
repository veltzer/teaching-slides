  <rect x="907.5676" y="301.5385" width="308.1082" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1061.6216" y="324.6154" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">bytes_processed = acc(0)</text>

  <rect x="445.4054" y="243.0769" width="389.1892" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="281.5385" text-anchor="middle" font-family="Arial" font-size="19.8372" font-weight="bold" fill="var(--ok-accent)">Data Quality Metrics</text>
  <rect x="469.7298" y="301.5385" width="340.5405" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="640.0001" y="324.6154" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">total_records = acc(0)</text>
  <rect x="469.7298" y="344.6154" width="340.5405" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="640.0001" y="367.6924" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">valid_records = acc(0)</text>
  <rect x="469.7298" y="387.6924" width="340.5405" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />

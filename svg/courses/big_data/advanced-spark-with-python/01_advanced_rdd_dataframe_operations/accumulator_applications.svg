  <line x1="802.1622" y1="558.4615" x2="850.8108" y2="558.4615" stroke="var(--primary-border)" stroke-width="1.4749" marker-end="url(#arrow)" />
  <rect x="858.919" y="527.6923" width="267.5675" height="61.5385" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.8919" y="553.8462" text-anchor="middle" font-family="Arial" font-size="15.2594" font-weight="bold" fill="var(--ok-accent)">Driver: acc.value</text>

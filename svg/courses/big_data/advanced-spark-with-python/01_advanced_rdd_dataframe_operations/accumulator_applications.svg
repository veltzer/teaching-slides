  <line x1="640.0001" y1="166.1538" x2="640.0001" y2="235.3847" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="785.946" y1="166.1538" x2="1061.6216" y2="235.3847" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="243.0769" width="356.7568" height="200" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="281.5385" text-anchor="middle" font-family="Arial" font-size="19.8372" font-weight="bold" fill="var(--danger-accent)">Error Tracking</text>
  <rect x="64.3244" y="301.5385" width="308.1082" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4749" />
  <text x="218.3784" y="324.6154" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">error_count = acc(0)</text>
  <rect x="64.3244" y="344.6154" width="308.1082" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4749" />
  <text x="218.3784" y="367.6924" text-anchor="middle" font-family="Arial" font-size="15.2594" fill="var(--text)">null_count = acc(0)</text>

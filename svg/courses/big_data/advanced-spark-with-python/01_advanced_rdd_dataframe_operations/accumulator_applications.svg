<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="27.4668" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Accumulator Applications</text>
  <rect x="461.6217" y="73.8462" width="356.7568" height="92.3077" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="112.3077" text-anchor="middle" font-size="21.3632" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Accumulators</text>
  <text x="640.0001" y="147.6923" text-anchor="middle" font-size="16.7853" fill="var(--text-muted)" font-family="Arial, sans-serif">Write-only shared variables</text>
  <line x1="494.054" y1="166.1538" x2="218.3784" y2="235.3847" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="166.1538" x2="640.0001" y2="235.3847" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="785.946" y1="166.1538" x2="1061.6216" y2="235.3847" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="243.0769" width="356.7568" height="200" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="281.5385" text-anchor="middle" font-size="19.8372" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Error Tracking</text>
  <rect x="64.3244" y="301.5385" width="308.1082" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4749" />
  <text x="218.3784" y="324.6154" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">error_count = acc(0)</text>
  <rect x="64.3244" y="344.6154" width="308.1082" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4749" />
  <text x="218.3784" y="367.6924" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">null_count = acc(0)</text>
  <rect x="64.3244" y="387.6924" width="308.1082" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--danger-border)" stroke-width="1.4749" />
  <text x="218.3784" y="410.7693" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">Parse failures tracking</text>
  <rect x="445.4054" y="243.0769" width="389.1892" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="281.5385" text-anchor="middle" font-size="19.8372" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Quality Metrics</text>
  <rect x="469.7298" y="301.5385" width="340.5405" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="640.0001" y="324.6154" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">total_records = acc(0)</text>
  <rect x="469.7298" y="344.6154" width="340.5405" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="640.0001" y="367.6924" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">valid_records = acc(0)</text>
  <rect x="469.7298" y="387.6924" width="340.5405" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="640.0001" y="410.7693" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">Custom DictAccumulator</text>
  <rect x="883.2432" y="243.0769" width="356.7568" height="200" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6216" y="281.5385" text-anchor="middle" font-size="19.8372" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Performance Counters</text>
  <rect x="907.5676" y="301.5385" width="308.1082" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1061.6216" y="324.6154" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">bytes_processed = acc(0)</text>
  <rect x="907.5676" y="344.6154" width="308.1082" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1061.6216" y="367.6924" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">slow_tasks = acc(0)</text>
  <rect x="907.5676" y="387.6924" width="308.1082" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1061.6216" y="410.7693" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">Custom SetAccumulator</text>
  <rect x="121.0811" y="473.8462" width="1037.8379" height="146.1538" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="507.6923" text-anchor="middle" font-size="19.8372" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">How Accumulators Work</text>
  <rect x="153.5135" y="527.6923" width="194.5946" height="61.5385" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="250.8108" y="553.8462" text-anchor="middle" font-size="15.2594" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Worker 1</text>
  <text x="250.8108" y="576.9231" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">acc.add(1)</text>
  <rect x="380.5405" y="527.6923" width="194.5946" height="61.5385" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.8378" y="553.8462" text-anchor="middle" font-size="15.2594" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Worker 2</text>
  <text x="477.8378" y="576.9231" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">acc.add(3)</text>
  <rect x="607.5676" y="527.6923" width="194.5946" height="61.5385" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="704.8648" y="553.8462" text-anchor="middle" font-size="15.2594" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Worker 3</text>
  <text x="704.8648" y="576.9231" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">acc.add(2)</text>
  <line x1="348.1082" y1="558.4615" x2="380.5405" y2="558.4615" stroke="var(--primary-border)" stroke-width="1.4749" marker-end="url(#arrow)" />
  <line x1="802.1622" y1="558.4615" x2="850.8108" y2="558.4615" stroke="var(--primary-border)" stroke-width="1.4749" marker-end="url(#arrow)" />
  <rect x="858.919" y="527.6923" width="267.5675" height="61.5385" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.8919" y="553.8462" text-anchor="middle" font-size="15.2594" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Driver: acc.value</text>
  <text x="991.8919" y="576.9231" text-anchor="middle" font-size="15.2594" fill="var(--text)" font-family="Arial, sans-serif">= 6 (merged)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Broadcast Variable Data Flow</text>
  <!-- Driver -->
  <rect x="170" y="50" width="360" height="65" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Driver Program</text>
  <text x="350" y="95" text-anchor="middle" font-size="11" fill="#666">bc = sc.broadcast(country_lookup) | Size: 1 KB</text>
  <!-- Broadcast lines -->
  <line x1="250" y1="115" x2="130" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#aBc)"/>
  <line x1="350" y1="115" x2="350" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#aBc)"/>
  <line x1="450" y1="115" x2="570" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#aBc)"/>
  <text x="350" y="150" text-anchor="middle" font-size="11" fill="#4a90e2" font-weight="bold">broadcast (once)</text>
  <defs><marker id="aBc" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4a90e2"/></marker></defs>
  <!-- Executor 0 -->
  <rect x="40" y="180" width="170" height="150" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="125" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Executor 0</text>
  <rect x="60" y="215" width="130" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="125" y="235" text-anchor="middle" font-size="11" fill="#333">lookup (copy)</text>
  <text x="125" y="265" text-anchor="middle" font-size="11" fill="#555">Task 0</text>
  <text x="125" y="285" text-anchor="middle" font-size="11" fill="#555">Task 3</text>
  <!-- Executor 1 -->
  <rect x="260" y="180" width="170" height="150" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="345" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Executor 1</text>
  <rect x="280" y="215" width="130" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="345" y="235" text-anchor="middle" font-size="11" fill="#333">lookup (copy)</text>
  <text x="345" y="265" text-anchor="middle" font-size="11" fill="#555">Task 1</text>
  <text x="345" y="285" text-anchor="middle" font-size="11" fill="#555">Task 4</text>
  <!-- Executor 2 -->
  <rect x="480" y="180" width="170" height="150" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="565" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Executor 2</text>
  <rect x="500" y="215" width="130" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="565" y="235" text-anchor="middle" font-size="11" fill="#333">lookup (copy)</text>
  <text x="565" y="265" text-anchor="middle" font-size="11" fill="#555">Task 2</text>
  <text x="565" y="285" text-anchor="middle" font-size="11" fill="#555">Task 5</text>
  <!-- Comparison -->
  <rect x="60" y="360" width="260" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="190" y="388" text-anchor="middle" font-size="12" fill="#dc3545">Without broadcast: sent with EVERY task</text>
  <rect x="370" y="360" width="260" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="500" y="388" text-anchor="middle" font-size="12" fill="#28a745">With broadcast: sent ONCE per executor</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="649.8361" y="40" text-anchor="middle" font-size="29.0488" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Broadcast Variable Data Flow</text>
  <rect x="295.7376" y="70.9334" width="708.1968" height="100.5333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.8361" y="109.6" text-anchor="middle" font-size="22.5935" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Driver Program</text>
  <text x="649.8361" y="140.5334" text-anchor="middle" font-size="17.752" fill="var(--text-muted)" font-family="Arial, sans-serif">bc = sc.broadcast(country_lookup) | Size: 1 KB</text>
  <line x1="453.1148" y1="171.4667" x2="217.0492" y2="264.2666" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="649.8361" y1="171.4667" x2="649.8361" y2="264.2666" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="846.5573" y1="171.4667" x2="1082.623" y2="264.2666" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="649.8361" y="225.6" text-anchor="middle" font-size="17.752" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">broadcast (once)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="272" width="334.4262" height="232" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="207.213" y="310.6667" text-anchor="middle" font-size="20.9796" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Executor 0</text>
  <rect x="79.3442" y="326.1333" width="255.7377" height="46.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="207.213" y="357.0667" text-anchor="middle" font-size="17.752" fill="var(--text)" font-family="Arial, sans-serif">lookup (copy)</text>
  <text x="207.213" y="403.4666" text-anchor="middle" font-size="17.752" fill="var(--text-muted)" font-family="Arial, sans-serif">Task 0</text>
  <text x="207.213" y="434.4" text-anchor="middle" font-size="17.752" fill="var(--text-muted)" font-family="Arial, sans-serif">Task 3</text>
  <rect x="472.7869" y="272" width="334.4262" height="232" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="310.6667" text-anchor="middle" font-size="20.9796" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Executor 1</text>
  <rect x="512.1311" y="326.1333" width="255.7377" height="46.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="357.0667" text-anchor="middle" font-size="17.752" fill="var(--text)" font-family="Arial, sans-serif">lookup (copy)</text>
  <text x="639.9999" y="403.4666" text-anchor="middle" font-size="17.752" fill="var(--text-muted)" font-family="Arial, sans-serif">Task 1</text>
  <text x="639.9999" y="434.4" text-anchor="middle" font-size="17.752" fill="var(--text-muted)" font-family="Arial, sans-serif">Task 4</text>
  <rect x="905.5738" y="272" width="334.4262" height="232" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072.787" y="310.6667" text-anchor="middle" font-size="20.9796" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Executor 2</text>
  <rect x="944.918" y="326.1333" width="255.7377" height="46.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072.787" y="357.0667" text-anchor="middle" font-size="17.752" fill="var(--text)" font-family="Arial, sans-serif">lookup (copy)</text>
  <text x="1072.787" y="403.4666" text-anchor="middle" font-size="17.752" fill="var(--text-muted)" font-family="Arial, sans-serif">Task 2</text>
  <text x="1072.787" y="434.4" text-anchor="middle" font-size="17.752" fill="var(--text-muted)" font-family="Arial, sans-serif">Task 5</text>
  <rect x="79.3442" y="550.4" width="511.4755" height="69.6" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335.082" y="593.7066" text-anchor="middle" font-size="19.3658" fill="var(--danger-accent)" font-family="Arial, sans-serif">Without broadcast: sent with EVERY task</text>
  <rect x="689.1803" y="550.4" width="511.4755" height="69.6" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.918" y="593.7066" text-anchor="middle" font-size="19.3658" fill="var(--ok-accent)" font-family="Arial, sans-serif">With broadcast: sent ONCE per executor</text>
</svg>

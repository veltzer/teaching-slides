<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="574.412" y="31.068" text-anchor="middle" font-size="19.8835" font-weight="bold" fill="var(--text)">Salting Technique for Skewed Joins</text>
  <text x="61.5441" y="68.3495" font-size="17.398" font-weight="bold" fill="var(--danger-accent)">Before Salting (Skewed)</text>
  <rect x="41.0294" y="80.7767" width="1046.2505" height="55.9223" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="71.8015" y="114.3301" font-size="14.9126" fill="var(--text)">Partition 0: key=1 (5M rows)</text>
  <text x="718.015" y="114.3301" font-size="14.9126" font-weight="bold" fill="var(--danger-accent)">← HOT PARTITION</text>
  <rect x="41.0294" y="142.9126" width="1046.2505" height="43.4951" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="71.8015" y="170.2524" font-size="14.9126" fill="var(--text)">Partition 1: key=2 (100 rows)</text>
  <rect x="41.0294" y="192.6214" width="1046.2505" height="43.4951" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="71.8015" y="219.9611" font-size="14.9126" fill="var(--text)">Partition 2: key=3 (200 rows)</text>
  <text x="574.412" y="267.1844" text-anchor="middle" font-size="29.8253" fill="var(--ok-accent)">▼</text>
  <text x="574.412" y="292.0388" text-anchor="middle" font-size="14.9126" font-weight="bold" fill="var(--ok-accent)">Apply Salting (factor=10)</text>
  <text x="61.5441" y="329.3204" font-size="17.398" font-weight="bold" fill="var(--ok-accent)">After Salting (Balanced)</text>
  <rect x="41.0294" y="341.7475" width="1046.2505" height="37.2816" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="71.8015" y="366.6019" font-size="13.6699" fill="var(--text)">Partition 0: key=1_0 (500K)</text>
  <rect x="41.0294" y="382.7572" width="1046.2505" height="37.2816" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="71.8015" y="407.6116" font-size="13.6699" fill="var(--text)">Partition 1: key=1_1 (500K)</text>
  <rect x="41.0294" y="423.7669" width="1046.2505" height="37.2816" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="71.8015" y="448.6214" font-size="13.6699" fill="var(--text-muted)">...</text>
  <rect x="41.0294" y="464.7767" width="1046.2505" height="37.2816" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="71.8015" y="489.631" font-size="13.6699" fill="var(--text)">Partition 9: key=1_9 (500K)</text>
  <rect x="41.0294" y="505.7864" width="1046.2505" height="37.2816" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="71.8015" y="530.6407" font-size="13.6699" fill="var(--text)">Partition 10: key=2 (100)</text>
  <rect x="41.0294" y="546.7961" width="1046.2505" height="37.2816" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="71.8015" y="571.6504" font-size="13.6699" fill="var(--text)">Partition 11: key=3 (200)</text>
  <rect x="41.0294" y="602.7184" width="1046.2505" height="37.2816" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="574.412" y="627.5728" text-anchor="middle" font-size="13.6699" font-weight="bold" fill="var(--danger-accent)">Result: Hot partition split into 10 even partitions</text>
</svg>
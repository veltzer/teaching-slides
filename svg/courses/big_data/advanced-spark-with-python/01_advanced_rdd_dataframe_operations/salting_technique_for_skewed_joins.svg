<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="651.7647" y="40" text-anchor="middle" font-size="20.7824" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Salting Technique for Skewed Joins</text>
  <text x="63.5294" y="75.5102" font-size="18.1845" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Before Salting (Skewed)</text>
  <rect x="40" y="87.3469" width="1200" height="53.2653" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="119.3061" font-size="15.5868" fill="var(--text)" font-family="Arial, sans-serif">Partition 0: key=1 (5M rows)</text>
  <text x="816.4706" y="119.3061" font-size="15.5868" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">← HOT PARTITION</text>
  <rect x="40" y="146.5306" width="1200" height="41.4285" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="172.5714" font-size="15.5868" fill="var(--text)" font-family="Arial, sans-serif">Partition 1: key=2 (100 rows)</text>
  <rect x="40" y="193.8776" width="1200" height="41.4285" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="219.9183" font-size="15.5868" fill="var(--text)" font-family="Arial, sans-serif">Partition 2: key=3 (200 rows)</text>
  <text x="651.7647" y="264.8979" text-anchor="middle" font-size="31.1736" fill="var(--ok-accent)" font-family="Arial, sans-serif">▼</text>
  <text x="651.7647" y="288.5714" text-anchor="middle" font-size="15.5868" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Apply Salting (factor=10)</text>
  <text x="63.5294" y="324.0816" font-size="18.1845" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">After Salting (Balanced)</text>
  <rect x="40" y="335.9183" width="1200" height="35.5103" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="359.5918" font-size="14.2879" fill="var(--text)" font-family="Arial, sans-serif">Partition 0: key=1_0 (500K)</text>
  <rect x="40" y="374.9795" width="1200" height="35.5103" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="398.653" font-size="14.2879" fill="var(--text)" font-family="Arial, sans-serif">Partition 1: key=1_1 (500K)</text>
  <rect x="40" y="414.0407" width="1200" height="35.5103" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="437.7143" font-size="14.2879" fill="var(--text-muted)" font-family="Arial, sans-serif">...</text>
  <rect x="40" y="453.102" width="1200" height="35.5103" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="476.7754" font-size="14.2879" fill="var(--text)" font-family="Arial, sans-serif">Partition 9: key=1_9 (500K)</text>
  <rect x="40" y="492.1632" width="1200" height="35.5103" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="515.8367" font-size="14.2879" fill="var(--text)" font-family="Arial, sans-serif">Partition 10: key=2 (100)</text>
  <rect x="40" y="531.2245" width="1200" height="35.5103" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="75.2941" y="554.8979" font-size="14.2879" fill="var(--text)" font-family="Arial, sans-serif">Partition 11: key=3 (200)</text>
  <rect x="40" y="584.4897" width="1200" height="35.5103" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="651.7647" y="608.1632" text-anchor="middle" font-size="14.2879" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result: Hot partition split into 10 even partitions</text>
</svg>

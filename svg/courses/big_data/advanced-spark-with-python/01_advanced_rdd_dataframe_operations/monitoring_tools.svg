  <line x1="589.9589" y1="150.1234" x2="589.9589" y2="205.4321" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="766.9465" y1="150.1234" x2="988.1811" y2="205.4321" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="29.4979" y="213.3334" width="324.4774" height="237.0371" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="191.7366" y="252.8395" text-anchor="middle" font-family="Arial" font-size="20.6486" font-weight="bold" fill="var(--ok-accent)">Spark Web UI</text>

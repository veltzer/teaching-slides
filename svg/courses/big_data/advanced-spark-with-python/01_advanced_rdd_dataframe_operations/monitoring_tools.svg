  <rect x="825.9424" y="213.3334" width="324.4774" height="237.0371" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="988.1811" y="252.8395" text-anchor="middle" font-family="Arial" font-size="20.6486" font-weight="bold" fill="var(--warn-accent)">External Tools</text>

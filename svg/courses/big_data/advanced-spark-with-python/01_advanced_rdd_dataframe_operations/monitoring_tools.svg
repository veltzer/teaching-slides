  <rect x="51.6214" y="303.4075" width="280.2305" height="34.7654" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="191.7366" y="327.1111" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Jobs / Stages / Tasks</text>
  <rect x="51.6214" y="344.4938" width="280.2305" height="34.7654" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="191.7366" y="368.1976" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Storage (cached RDDs)</text>
  <rect x="51.6214" y="385.5802" width="280.2305" height="34.7654" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="191.7366" y="409.284" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">SQL Query Plans (DAG)</text>
  <rect x="427.7202" y="213.3334" width="324.4774" height="237.0371" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="589.9589" y="252.8395" text-anchor="middle" font-family="Arial" font-size="20.6486" font-weight="bold" fill="var(--primary-accent)">History Server</text>
  <text x="589.9589" y="284.4444" text-anchor="middle" font-family="Arial" font-size="16.2239" fill="var(--text)">Port 18080 (default)</text>
  <rect x="449.8436" y="303.4075" width="280.2305" height="34.7654" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749" />
  <text x="589.9589" y="327.1111" text-anchor="middle" font-family="Arial" font-size="14.749" fill="var(--text)">Completed applications</text>
  <rect x="449.8436" y="344.4938" width="280.2305" height="34.7654" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749" />

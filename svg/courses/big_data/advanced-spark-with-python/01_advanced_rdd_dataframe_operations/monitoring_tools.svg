<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-family="Arial" font-size="27.103" font-weight="bold" fill="var(--primary-accent)">Spark Monitoring Tools Overview</text>
  <rect x="450.5263" y="66.1539" width="378.9473" height="76.9231" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="100" text-anchor="middle" font-family="Arial" font-size="21.0802" font-weight="bold" fill="var(--primary-accent)">Spark Application</text>
  <text x="640.0001" y="127.6923" text-anchor="middle" font-family="Arial" font-size="16.563" fill="var(--text-muted)">Generates metrics and events</text>
  <line x1="450.5263" y1="143.0769" x2="213.6842" y2="196.9231" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="143.0769" x2="640.0001" y2="196.9231" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="829.4737" y1="143.0769" x2="1066.3158" y2="196.9231" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="204.6155" width="347.3684" height="230.7693" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.6842" y="243.0769" text-anchor="middle" font-family="Arial" font-size="21.0802" font-weight="bold" fill="var(--ok-accent)">Spark Web UI</text>
  <text x="213.6842" y="273.8461" text-anchor="middle" font-family="Arial" font-size="16.563" fill="var(--text)">Port 4040 (default)</text>
  <rect x="63.6843" y="292.3078" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="213.6842" y="315.3846" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Jobs / Stages / Tasks</text>
  <rect x="63.6843" y="332.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="213.6842" y="355.3847" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Storage (cached RDDs)</text>
  <rect x="63.6843" y="372.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="213.6842" y="395.3847" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">SQL Query Plans (DAG)</text>
  <rect x="466.3158" y="204.6155" width="347.3684" height="230.7693" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="243.0769" text-anchor="middle" font-family="Arial" font-size="21.0802" font-weight="bold" fill="var(--primary-accent)">History Server</text>
  <text x="640.0001" y="273.8461" text-anchor="middle" font-family="Arial" font-size="16.563" fill="var(--text)">Port 18080 (default)</text>
  <rect x="490" y="292.3078" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749" />
  <text x="640.0001" y="315.3846" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Completed applications</text>
  <rect x="490" y="332.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749" />
  <text x="640.0001" y="355.3847" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Event log analysis</text>
  <rect x="490" y="372.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749" />
  <text x="640.0001" y="395.3847" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Post-mortem debugging</text>
  <rect x="892.6316" y="204.6155" width="347.3684" height="230.7693" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1066.3158" y="243.0769" text-anchor="middle" font-family="Arial" font-size="21.0802" font-weight="bold" fill="var(--warn-accent)">External Tools</text>
  <text x="1066.3158" y="273.8461" text-anchor="middle" font-family="Arial" font-size="16.563" fill="var(--text)">Third-party integrations</text>
  <rect x="916.3158" y="292.3078" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1066.3158" y="315.3846" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Ganglia / Graphite</text>
  <rect x="916.3158" y="332.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1066.3158" y="355.3847" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Prometheus + Grafana</text>
  <rect x="916.3158" y="372.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1066.3158" y="395.3847" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Datadog / New Relic</text>
  <text x="640.0001" y="481.5385" text-anchor="middle" font-family="Arial" font-size="21.0802" font-weight="bold" fill="var(--text)">Key Metrics to Monitor</text>
  <rect x="55.7895" y="504.6154" width="268.421" height="115.3846" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="190.0001" y="535.3846" text-anchor="middle" font-family="Arial" font-size="18.0687" font-weight="bold" fill="var(--danger-accent)">Execution</text>
  <text x="190.0001" y="566.1539" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Task duration</text>
  <text x="190.0001" y="590.7692" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">GC time / Scheduler delay</text>
  <rect x="355.7895" y="504.6154" width="268.421" height="115.3846" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="490" y="535.3846" text-anchor="middle" font-family="Arial" font-size="18.0687" font-weight="bold" fill="var(--primary-accent)">Memory</text>
  <text x="490" y="566.1539" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Storage / Execution usage</text>
  <text x="490" y="590.7692" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Spill to disk</text>
  <rect x="655.7894" y="504.6154" width="268.421" height="115.3846" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="790" y="535.3846" text-anchor="middle" font-family="Arial" font-size="18.0687" font-weight="bold" fill="var(--info-accent)">Shuffle</text>
  <text x="790" y="566.1539" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Read / Write bytes</text>
  <text x="790" y="590.7692" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Shuffle spill</text>
  <rect x="955.7895" y="504.6154" width="268.421" height="115.3846" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1089.9999" y="535.3846" text-anchor="middle" font-family="Arial" font-size="18.0687" font-weight="bold" fill="var(--ok-accent)">I/O</text>
  <text x="1089.9999" y="566.1539" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Input / Output bytes</text>
  <text x="1089.9999" y="590.7692" text-anchor="middle" font-family="Arial" font-size="15.0573" fill="var(--text)">Records read/written</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="27.103" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Monitoring Tools Overview</text>
  <rect x="450.5263" y="66.1539" width="378.9473" height="76.9231" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="100" text-anchor="middle" font-size="21.0802" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Application</text>
  <text x="640.0001" y="127.6923" text-anchor="middle" font-size="16.563" fill="var(--text-muted)" font-family="Arial, sans-serif">Generates metrics and events</text>
  <line x1="450.5263" y1="143.0769" x2="213.6842" y2="196.9231" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="143.0769" x2="640.0001" y2="196.9231" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="829.4737" y1="143.0769" x2="1066.3158" y2="196.9231" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="204.6155" width="347.3684" height="230.7693" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.6842" y="243.0769" text-anchor="middle" font-size="21.0802" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Spark Web UI</text>
  <text x="213.6842" y="273.8461" text-anchor="middle" font-size="16.563" fill="var(--text)" font-family="Arial, sans-serif">Port 4040 (default)</text>
  <rect x="63.6843" y="292.3078" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="213.6842" y="315.3846" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Jobs / Stages / Tasks</text>
  <rect x="63.6843" y="332.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="213.6842" y="355.3847" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Storage (cached RDDs)</text>
  <rect x="63.6843" y="372.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749" />
  <text x="213.6842" y="395.3847" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">SQL Query Plans (DAG)</text>
  <rect x="466.3158" y="204.6155" width="347.3684" height="230.7693" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="243.0769" text-anchor="middle" font-size="21.0802" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">History Server</text>
  <text x="640.0001" y="273.8461" text-anchor="middle" font-size="16.563" fill="var(--text)" font-family="Arial, sans-serif">Port 18080 (default)</text>
  <rect x="490" y="292.3078" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749" />
  <text x="640.0001" y="315.3846" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Completed applications</text>
  <rect x="490" y="332.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749" />
  <text x="640.0001" y="355.3847" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Event log analysis</text>
  <rect x="490" y="372.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749" />
  <text x="640.0001" y="395.3847" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Post-mortem debugging</text>
  <rect x="892.6316" y="204.6155" width="347.3684" height="230.7693" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1066.3158" y="243.0769" text-anchor="middle" font-size="21.0802" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">External Tools</text>
  <text x="1066.3158" y="273.8461" text-anchor="middle" font-size="16.563" fill="var(--text)" font-family="Arial, sans-serif">Third-party integrations</text>
  <rect x="916.3158" y="292.3078" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1066.3158" y="315.3846" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Ganglia / Graphite</text>
  <rect x="916.3158" y="332.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1066.3158" y="355.3847" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Prometheus + Grafana</text>
  <rect x="916.3158" y="372.3077" width="300" height="33.8461" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749" />
  <text x="1066.3158" y="395.3847" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Datadog / New Relic</text>
  <text x="640.0001" y="481.5385" text-anchor="middle" font-size="21.0802" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Metrics to Monitor</text>
  <rect x="55.7895" y="504.6154" width="268.421" height="115.3846" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0001" y="535.3846" text-anchor="middle" font-size="18.0687" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Execution</text>
  <text x="190.0001" y="566.1539" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Task duration</text>
  <text x="190.0001" y="590.7692" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">GC time / Scheduler delay</text>
  <rect x="355.7895" y="504.6154" width="268.421" height="115.3846" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="535.3846" text-anchor="middle" font-size="18.0687" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Memory</text>
  <text x="490" y="566.1539" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Storage / Execution usage</text>
  <text x="490" y="590.7692" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Spill to disk</text>
  <rect x="655.7894" y="504.6154" width="268.421" height="115.3846" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="535.3846" text-anchor="middle" font-size="18.0687" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Shuffle</text>
  <text x="790" y="566.1539" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Read / Write bytes</text>
  <text x="790" y="590.7692" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Shuffle spill</text>
  <rect x="955.7895" y="504.6154" width="268.421" height="115.3846" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.9999" y="535.3846" text-anchor="middle" font-size="18.0687" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">I/O</text>
  <text x="1089.9999" y="566.1539" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Input / Output bytes</text>
  <text x="1089.9999" y="590.7692" text-anchor="middle" font-size="15.0573" fill="var(--text)" font-family="Arial, sans-serif">Records read/written</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="450.5263" y="40" width="378.9473" height="80.555587554015" rx="6.140032871677" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="75.444391501538" text-anchor="middle" font-size="21.572186823589" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Application</text>
  <text x="640.0001" y="104.444386265426" text-anchor="middle" font-size="16.949560742265" fill="var(--text-muted)" font-family="Arial, sans-serif">Generates metrics and events</text>
  <line x1="450.5263" y1="120.555482831783" x2="213.6842" y2="176.944425536264" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="640.0001" y1="120.555482831783" x2="640.0001" y2="176.944425536264" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="829.4737" y1="120.555482831783" x2="1066.3158" y2="176.944425536264" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="40" y="185.000078541674" width="347.3684" height="241.666762662046" rx="6.140032871677" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="213.6842" y="225.277715235333" text-anchor="middle" font-size="21.572186823589" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Spark Web UI</text>
  <text x="213.6842" y="257.499908368047" text-anchor="middle" font-size="16.949560742265" fill="var(--text)" font-family="Arial, sans-serif">Port 4040 (default)</text>
  <rect x="63.6843" y="276.833412747693" width="300" height="35.444391501538" rx="6.140032871677" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749"/>
  <text x="213.6842" y="300.999952874995" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Jobs / Stages / Tasks</text>
  <rect x="63.6843" y="318.722200986881" width="300" height="35.444391501538" rx="6.140032871677" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749"/>
  <text x="213.6842" y="342.888950558648" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Storage (cached RDDs)</text>
  <rect x="63.6843" y="360.611093948301" width="300" height="35.444391501538" rx="6.140032871677" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.4749"/>
  <text x="213.6842" y="384.777843520068" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">SQL Query Plans (DAG)</text>
  <rect x="466.3158" y="185.000078541674" width="347.3684" height="241.666762662046" rx="6.140032871677" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="225.277715235333" text-anchor="middle" font-size="21.572186823589" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">History Server</text>
  <text x="640.0001" y="257.499908368047" text-anchor="middle" font-size="16.949560742265" fill="var(--text)" font-family="Arial, sans-serif">Port 18080 (default)</text>
  <rect x="490" y="276.833412747693" width="300" height="35.444391501538" rx="6.140032871677" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749"/>
  <text x="640.0001" y="300.999952874995" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Completed applications</text>
  <rect x="490" y="318.722200986881" width="300" height="35.444391501538" rx="6.140032871677" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749"/>
  <text x="640.0001" y="342.888950558648" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Event log analysis</text>
  <rect x="490" y="360.611093948301" width="300" height="35.444391501538" rx="6.140032871677" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.4749"/>
  <text x="640.0001" y="384.777843520068" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Post-mortem debugging</text>
  <rect x="892.6316" y="185.000078541674" width="347.3684" height="241.666762662046" rx="6.140032871677" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1066.3158" y="225.277715235333" text-anchor="middle" font-size="21.572186823589" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">External Tools</text>
  <text x="1066.3158" y="257.499908368047" text-anchor="middle" font-size="16.949560742265" fill="var(--text)" font-family="Arial, sans-serif">Third-party integrations</text>
  <rect x="916.3158" y="276.833412747693" width="300" height="35.444391501538" rx="6.140032871677" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749"/>
  <text x="1066.3158" y="300.999952874995" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Ganglia / Graphite</text>
  <rect x="916.3158" y="318.722200986881" width="300" height="35.444391501538" rx="6.140032871677" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749"/>
  <text x="1066.3158" y="342.888950558648" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Prometheus + Grafana</text>
  <rect x="916.3158" y="360.611093948301" width="300" height="35.444391501538" rx="6.140032871677" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.4749"/>
  <text x="1066.3158" y="384.777843520068" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Datadog / New Relic</text>
  <text x="640.0001" y="475.000026180558" text-anchor="middle" font-size="21.572186823589" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Metrics to Monitor</text>
  <rect x="55.7895" y="499.166671030093" width="268.421" height="120.833328969907" rx="6.140032871677" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0001" y="531.388864162806" text-anchor="middle" font-size="18.490401991413" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Execution</text>
  <text x="190.0001" y="563.611162017752" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Task duration</text>
  <text x="190.0001" y="589.388853690583" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">GC time / Scheduler delay</text>
  <rect x="355.7895" y="499.166671030093" width="268.421" height="120.833328969907" rx="6.140032871677" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="531.388864162806" text-anchor="middle" font-size="18.490401991413" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Memory</text>
  <text x="490" y="563.611162017752" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Storage / Execution usage</text>
  <text x="490" y="589.388853690583" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Spill to disk</text>
  <rect x="655.7894" y="499.166671030093" width="268.421" height="120.833328969907" rx="6.140032871677" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="531.388864162806" text-anchor="middle" font-size="18.490401991413" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Shuffle</text>
  <text x="790" y="563.611162017752" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Read / Write bytes</text>
  <text x="790" y="589.388853690583" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Shuffle spill</text>
  <rect x="955.7895" y="499.166671030093" width="268.421" height="120.833328969907" rx="6.140032871677" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.9999" y="531.388864162806" text-anchor="middle" font-size="18.490401991413" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">I/O</text>
  <text x="1089.9999" y="563.611162017752" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Input / Output bytes</text>
  <text x="1089.9999" y="589.388853690583" text-anchor="middle" font-size="15.408719493118" fill="var(--text)" font-family="Arial, sans-serif">Records read/written</text>
</svg>

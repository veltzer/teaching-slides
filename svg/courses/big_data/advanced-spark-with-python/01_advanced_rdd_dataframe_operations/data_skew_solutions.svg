<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="27.0006" font-weight="bold" fill="var(--primary-accent)">Data Skew: Problem and Solutions</text>
  <text x="324.2105" y="82.7518" text-anchor="middle" font-family="Arial" font-size="21.0005" font-weight="bold" fill="var(--danger-accent)">Problem: Skewed Data</text>
  <rect x="87.3684" y="199.6069" width="63.1579" height="42.7518" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="118.9474" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P0</text>
  <rect x="166.3157" y="99.8526" width="63.1579" height="142.5061" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.8947" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--danger-accent)">P1</text>
  <text x="197.8947" y="92.7273" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--danger-accent)">90%!</text>
  <rect x="245.2632" y="213.8575" width="63.1579" height="28.5012" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="276.8421" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P2</text>
  <rect x="324.2105" y="206.7322" width="63.1579" height="35.6265" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="355.7895" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P3</text>
  <rect x="403.1579" y="220.9828" width="63.1579" height="21.376" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="434.7369" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P4</text>
  <text x="324.2105" y="273.7101" text-anchor="middle" font-family="Arial" font-size="16.5003" fill="var(--danger-accent)">One partition has most data</text>
  <text x="324.2105" y="295.086" text-anchor="middle" font-family="Arial" font-size="16.5003" fill="var(--danger-accent)">Straggler task slows everything</text>
  <line x1="529.4736" y1="185.3563" x2="608.4211" y2="185.3563" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="568.9474" y="171.1056" text-anchor="middle" font-family="Arial" font-size="16.5003" font-weight="bold" fill="var(--text-muted)">Fix</text>
  <text x="955.7895" y="82.7518" text-anchor="middle" font-family="Arial" font-size="21.0005" font-weight="bold" fill="var(--ok-accent)">After Fix: Balanced</text>
  <rect x="687.3684" y="171.1056" width="63.1579" height="71.2531" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="718.9474" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P0</text>
  <rect x="766.3158" y="163.9803" width="63.1579" height="78.3783" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="797.8948" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P1</text>
  <rect x="845.2631" y="178.2309" width="63.1579" height="64.1278" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="876.8421" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P2</text>
  <rect x="924.2105" y="168.2555" width="63.1579" height="74.1031" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.7895" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P3</text>
  <rect x="1003.1579" y="173.9558" width="63.1579" height="68.403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1034.7368" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P4</text>
  <rect x="1082.1053" y="182.5061" width="63.1579" height="59.8526" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.6843" y="242.3587" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">P5</text>
  <text x="955.7895" y="273.7101" text-anchor="middle" font-family="Arial" font-size="16.5003" fill="var(--ok-accent)">Even distribution across partitions</text>
  <text x="955.7895" y="295.086" text-anchor="middle" font-family="Arial" font-size="16.5003" fill="var(--ok-accent)">All tasks finish around same time</text>
  <text x="639.9999" y="342.113" text-anchor="middle" font-family="Arial" font-size="22.5005" font-weight="bold" fill="var(--text)">Solutions</text>
  <rect x="40" y="367.7641" width="378.9473" height="142.5061" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.4737" y="399.1155" text-anchor="middle" font-family="Arial" font-size="19.5004" font-weight="bold" fill="var(--primary-accent)">1. Key Salting</text>
  <text x="229.4737" y="424.7666" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">Add random prefix to hot keys</text>
  <text x="229.4737" y="447.5676" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">key_0, key_1, ... key_N</text>
  <text x="229.4737" y="470.3685" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">Splits hot partition into N parts</text>
  <text x="229.4737" y="493.1696" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--primary-accent)">Best for joins with skewed keys</text>
  <rect x="450.5263" y="367.7641" width="378.9473" height="142.5061" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="399.1155" text-anchor="middle" font-family="Arial" font-size="19.5004" font-weight="bold" fill="var(--ok-accent)">2. Repartition</text>
  <text x="639.9999" y="424.7666" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">repartition(N, "column")</text>
  <text x="639.9999" y="447.5676" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">Redistribute data evenly</text>
  <text x="639.9999" y="470.3685" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">Causes full shuffle</text>
  <text x="639.9999" y="493.1696" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--ok-accent)">Best for aggregations</text>
  <rect x="861.0527" y="367.7641" width="378.9473" height="142.5061" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.5263" y="399.1155" text-anchor="middle" font-family="Arial" font-size="19.5004" font-weight="bold" fill="var(--warn-accent)">3. Adaptive Query (AQE)</text>
  <text x="1050.5263" y="424.7666" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">adaptive.skewJoin.enabled</text>
  <text x="1050.5263" y="447.5676" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">Automatically splits skewed</text>
  <text x="1050.5263" y="470.3685" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--text)">partitions at runtime</text>
  <text x="1050.5263" y="493.1696" text-anchor="middle" font-family="Arial" font-size="15.0003" fill="var(--warn-accent)">Spark 3.0+ recommended</text>
  <rect x="166.3157" y="534.4963" width="947.3684" height="85.5037" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="565.8477" text-anchor="middle" font-family="Arial" font-size="19.5004" font-weight="bold" fill="var(--text)">Detection: skew_ratio = max(partition_size) / avg(partition_size)</text>
  <text x="639.9999" y="594.3489" text-anchor="middle" font-family="Arial" font-size="18.0004" fill="var(--text-muted)">Ratio &gt; 3.0 indicates significant skew -- check with spark_partition_id()</text>
</svg>
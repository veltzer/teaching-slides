<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="11.2" refX="14.4" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="44.8" text-anchor="middle" font-family="Arial" font-size="28.8" font-weight="bold" fill="#1565c0">Data Skew: Problem and Solutions</text>
  <text x="320" y="92.8" text-anchor="middle" font-family="Arial" font-size="22.4" font-weight="bold" fill="#c62828">Problem: Skewed Data</text>
  <rect x="80" y="224" width="64" height="48" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="112" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P0</text>
  <rect x="160" y="112" width="64" height="160" rx="3.2" fill="#ffcdd2" stroke="#c62828" stroke-width="3.2" />
  <text x="192" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#c62828">P1</text>
  <text x="192" y="104" text-anchor="middle" font-family="Arial" font-size="16" fill="#c62828">90%!</text>
  <rect x="240" y="240" width="64" height="32" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="272" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P2</text>
  <rect x="320" y="232" width="64" height="40" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="352" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P3</text>
  <rect x="400" y="248" width="64" height="24" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="432" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P4</text>
  <text x="320" y="307.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#c62828">One partition has most data</text>
  <text x="320" y="331.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#c62828">Straggler task slows everything</text>
  <line x1="528" y1="208" x2="608" y2="208" stroke="#555" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="568" y="192" text-anchor="middle" font-family="Arial" font-size="17.6" font-weight="bold" fill="#555">Fix</text>
  <text x="960" y="92.8" text-anchor="middle" font-family="Arial" font-size="22.4" font-weight="bold" fill="#2e7d32">After Fix: Balanced</text>
  <rect x="688" y="192" width="64" height="80" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="720" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P0</text>
  <rect x="768" y="184" width="64" height="88" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="800" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P1</text>
  <rect x="848" y="200" width="64" height="72" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="880" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P2</text>
  <rect x="928" y="188.8" width="64" height="83.2" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="960" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P3</text>
  <rect x="1008" y="195.2" width="64" height="76.8" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="1040" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P4</text>
  <rect x="1088" y="204.8" width="64" height="67.2" rx="3.2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="1120" y="272" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">P5</text>
  <text x="960" y="307.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#2e7d32">Even distribution across partitions</text>
  <text x="960" y="331.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#2e7d32">All tasks finish around same time</text>
  <text x="640" y="384" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#333">Solutions</text>
  <rect x="32" y="412.8" width="384" height="160" rx="9.6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.4" />
  <text x="224" y="448" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1565c0">1. Key Salting</text>
  <text x="224" y="476.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Add random prefix to hot keys</text>
  <text x="224" y="502.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">key_0, key_1, ... key_N</text>
  <text x="224" y="528" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Splits hot partition into N parts</text>
  <text x="224" y="553.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#1565c0">Best for joins with skewed keys</text>
  <rect x="448" y="412.8" width="384" height="160" rx="9.6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.4" />
  <text x="640" y="448" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">2. Repartition</text>
  <text x="640" y="476.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">repartition(N, "column")</text>
  <text x="640" y="502.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Redistribute data evenly</text>
  <text x="640" y="528" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Causes full shuffle</text>
  <text x="640" y="553.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#2e7d32">Best for aggregations</text>
  <rect x="864" y="412.8" width="384" height="160" rx="9.6" fill="#fff3e0" stroke="#e65100" stroke-width="2.4" />
  <text x="1056" y="448" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#e65100">3. Adaptive Query (AQE)</text>
  <text x="1056" y="476.8" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">adaptive.skewJoin.enabled</text>
  <text x="1056" y="502.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Automatically splits skewed</text>
  <text x="1056" y="528" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">partitions at runtime</text>
  <text x="1056" y="553.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#e65100">Spark 3.0+ recommended</text>
  <rect x="160" y="600" width="960" height="96" rx="9.6" fill="#f5f5f5" stroke="#757575" stroke-width="2.4" />
  <text x="640" y="635.2" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#333">Detection: skew_ratio = max(partition_size) / avg(partition_size)</text>
  <text x="640" y="667.2" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#555">Ratio &gt; 3.0 indicates significant skew -- check with spark_partition_id()</text>
</svg>
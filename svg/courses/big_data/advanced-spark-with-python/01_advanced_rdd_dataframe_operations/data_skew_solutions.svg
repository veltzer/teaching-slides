<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <text x="270.191826522102" y="40" text-anchor="middle" font-size="20.9308607842" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Skewed</text>
  <rect x="90.041701417848" y="160.377358490567" width="60.050041701418" height="49.245283018868" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="170.108423686405" y="50.943396226415" width="60.050041701418" height="158.679245283018" rx="6.279258235261" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200.133444537114" y="42.188679245283" text-anchor="middle" font-size="14.651602548941" fill="var(--danger-accent)" font-family="Arial, sans-serif">90%</text>
  <rect x="250.175145954962" y="176.792452830188" width="60.050041701418" height="32.830188679245" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="330.24186822352" y="165.849056603774" width="60.050041701418" height="43.773584905661" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="410.308590492077" y="182.264150943397" width="60.050041701418" height="27.358490566038" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="270.191826522102" y="242.452830188679" text-anchor="middle" font-size="15.69814558815" fill="var(--danger-accent)" font-family="Arial, sans-serif">One hot partition</text>
  <text x="270.191826522102" y="267.622641509434" text-anchor="middle" font-size="15.69814558815" fill="var(--danger-accent)" font-family="Arial, sans-serif">Straggler slows job</text>

  <line x1="530.408673894912" y1="138.490566037736" x2="610.47539616347" y2="138.490566037736" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="570.442035029191" y="127.547169811321" text-anchor="middle" font-size="16.74468862736" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Fix</text>

  <text x="940.750625521268" y="40" text-anchor="middle" font-size="20.9308607842" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Balanced</text>
  <rect x="690.542118432027" y="127.547169811321" width="60.050041701418" height="82.075471698113" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="770.608840700584" y="122.075471698114" width="60.050041701418" height="87.547169811321" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="850.675562969141" y="138.490566037736" width="60.050041701418" height="71.132075471698" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="930.742285237698" y="127.547169811321" width="60.050041701418" height="82.075471698113" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1010.809007506255" y="133.018867924529" width="60.050041701418" height="76.603773584906" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1090.875729774812" y="143.962264150944" width="60.050041701418" height="65.660377358491" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.750625521268" y="242.452830188679" text-anchor="middle" font-size="15.69814558815" fill="var(--ok-accent)" font-family="Arial, sans-serif">Even distribution</text>
  <text x="940.750625521268" y="267.622641509434" text-anchor="middle" font-size="15.69814558815" fill="var(--ok-accent)" font-family="Arial, sans-serif">Tasks finish together</text>

  <text x="640.500417014178" y="319.056603773585" text-anchor="middle" font-size="23.023946862621" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Solutions</text>

  <rect x="40" y="346.415094339623" width="378.315262718932" height="158.679245283018" rx="6.279258235261" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.157631359466" y="384.716981132076" text-anchor="middle" font-size="19.884317744991" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">1. Key Salting</text>
  <text x="229.157631359466" y="417.547169811321" text-anchor="middle" font-size="15.69814558815" fill="var(--primary-text)" font-family="Arial, sans-serif">Random prefix on hot keys</text>
  <text x="229.157631359466" y="444.905660377359" text-anchor="middle" font-size="15.69814558815" fill="var(--primary-text)" font-family="Courier New, monospace">key_0 ... key_N</text>
  <text x="229.157631359466" y="472.264150943397" text-anchor="middle" font-size="15.69814558815" fill="var(--primary-text)" font-family="Arial, sans-serif">Splits hot partition</text>
  <text x="229.157631359466" y="497.433962264151" text-anchor="middle" font-size="14.651602548941" fill="var(--primary-text)" font-family="Arial, sans-serif">Best for skewed joins</text>

  <rect x="450.341951626355" y="346.415094339623" width="378.315262718932" height="158.679245283018" rx="6.279258235261" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.500417014178" y="384.716981132076" text-anchor="middle" font-size="19.884317744991" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">2. Repartition</text>
  <text x="640.500417014178" y="417.547169811321" text-anchor="middle" font-size="15.69814558815" fill="var(--ok-text)" font-family="Courier New, monospace">repartition(N, col)</text>
  <text x="640.500417014178" y="444.905660377359" text-anchor="middle" font-size="15.69814558815" fill="var(--ok-text)" font-family="Arial, sans-serif">Redistribute evenly</text>
  <text x="640.500417014178" y="472.264150943397" text-anchor="middle" font-size="15.69814558815" fill="var(--ok-text)" font-family="Arial, sans-serif">Full shuffle cost</text>
  <text x="640.500417014178" y="497.433962264151" text-anchor="middle" font-size="14.651602548941" fill="var(--ok-text)" font-family="Arial, sans-serif">Best for aggregations</text>

  <rect x="861.684737281067" y="346.415094339623" width="378.315262718932" height="158.679245283018" rx="6.279258235261" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.842368640534" y="384.716981132076" text-anchor="middle" font-size="19.884317744991" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">3. AQE Skew Join</text>
  <text x="1050.842368640534" y="417.547169811321" text-anchor="middle" font-size="15.69814558815" fill="var(--warn-text)" font-family="Courier New, monospace">adaptive.skewJoin.enabled</text>
  <text x="1050.842368640534" y="444.905660377359" text-anchor="middle" font-size="15.69814558815" fill="var(--warn-text)" font-family="Arial, sans-serif">Auto-splits at runtime</text>
  <text x="1050.842368640534" y="472.264150943397" text-anchor="middle" font-size="15.69814558815" fill="var(--warn-text)" font-family="Arial, sans-serif">Spark 3+</text>
  <text x="1050.842368640534" y="497.433962264151" text-anchor="middle" font-size="14.651602548941" fill="var(--warn-text)" font-family="Arial, sans-serif">Recommended default</text>

  <rect x="170.108423686405" y="526.981132075471" width="940.783986655546" height="93.018867924529" rx="6.279258235261" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.500417014178" y="563.094339622641" text-anchor="middle" font-size="18.837774705781" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Detection</text>
  <text x="640.500417014178" y="595.924528301887" text-anchor="middle" font-size="16.74468862736" fill="var(--text-muted)" font-family="Arial, sans-serif">skew_ratio = max / avg &gt; 3 -- use spark_partition_id()</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="41.1954" text-anchor="middle" font-family="Arial" font-size="26.4828" font-weight="bold" fill="var(--primary-accent)">Data Skew: Problem and Solutions</text>
  <text x="294.2529" y="85.3333" text-anchor="middle" font-family="Arial" font-size="20.5977" font-weight="bold" fill="var(--danger-accent)">Problem: Skewed Data</text>
  <rect x="73.5632" y="205.977" width="58.8506" height="44.1379" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="102.9885" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P0</text>
  <rect x="147.1264" y="102.9885" width="58.8506" height="147.1264" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="176.5517" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--danger-accent)">P1</text>
  <text x="176.5517" y="95.6322" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--danger-accent)">90%!</text>
  <rect x="220.6897" y="220.6897" width="58.8506" height="29.4253" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="250.1149" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P2</text>
  <rect x="294.2529" y="213.3333" width="58.8506" height="36.7816" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="323.6782" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P3</text>
  <rect x="367.8161" y="228.046" width="58.8506" height="22.069" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="397.2414" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P4</text>
  <text x="294.2529" y="282.4828" text-anchor="middle" font-family="Arial" font-size="16.1839" fill="var(--danger-accent)">One partition has most data</text>
  <text x="294.2529" y="304.5517" text-anchor="middle" font-family="Arial" font-size="16.1839" fill="var(--danger-accent)">Straggler task slows everything</text>
  <line x1="485.5172" y1="191.2644" x2="559.0805" y2="191.2644" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="522.2989" y="176.5517" text-anchor="middle" font-family="Arial" font-size="16.1839" font-weight="bold" fill="var(--text-muted)">Fix</text>
  <text x="882.7586" y="85.3333" text-anchor="middle" font-family="Arial" font-size="20.5977" font-weight="bold" fill="var(--ok-accent)">After Fix: Balanced</text>
  <rect x="632.6437" y="176.5517" width="58.8506" height="73.5632" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="662.069" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P0</text>
  <rect x="706.2069" y="169.1954" width="58.8506" height="80.9195" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="735.6322" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P1</text>
  <rect x="779.7701" y="183.908" width="58.8506" height="66.2069" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="809.1954" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P2</text>
  <rect x="853.3333" y="173.6092" width="58.8506" height="76.5057" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="882.7586" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P3</text>
  <rect x="926.8966" y="179.4943" width="58.8506" height="70.6207" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="956.3218" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P4</text>
  <rect x="1000.4598" y="188.3218" width="58.8506" height="61.7931" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1029.8851" y="250.1149" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">P5</text>
  <text x="882.7586" y="282.4828" text-anchor="middle" font-family="Arial" font-size="16.1839" fill="var(--ok-accent)">Even distribution across partitions</text>
  <text x="882.7586" y="304.5517" text-anchor="middle" font-family="Arial" font-size="16.1839" fill="var(--ok-accent)">All tasks finish around same time</text>
  <text x="588.5057" y="353.1034" text-anchor="middle" font-family="Arial" font-size="22.069" font-weight="bold" fill="var(--text)">Solutions</text>
  <rect x="29.4253" y="379.5862" width="353.1034" height="147.1264" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="205.977" y="411.954" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--primary-accent)">1. Key Salting</text>
  <text x="205.977" y="438.4368" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Add random prefix to hot keys</text>
  <text x="205.977" y="461.977" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">key_0, key_1, ... key_N</text>
  <text x="205.977" y="485.5172" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Splits hot partition into N parts</text>
  <text x="205.977" y="509.0575" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--primary-accent)">Best for joins with skewed keys</text>
  <rect x="411.954" y="379.5862" width="353.1034" height="147.1264" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.5057" y="411.954" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">2. Repartition</text>
  <text x="588.5057" y="438.4368" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">repartition(N, "column")</text>
  <text x="588.5057" y="461.977" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Redistribute data evenly</text>
  <text x="588.5057" y="485.5172" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Causes full shuffle</text>
  <text x="588.5057" y="509.0575" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--ok-accent)">Best for aggregations</text>
  <rect x="794.4828" y="379.5862" width="353.1034" height="147.1264" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="971.0345" y="411.954" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--warn-accent)">3. Adaptive Query (AQE)</text>
  <text x="971.0345" y="438.4368" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">adaptive.skewJoin.enabled</text>
  <text x="971.0345" y="461.977" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">Automatically splits skewed</text>
  <text x="971.0345" y="485.5172" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--text)">partitions at runtime</text>
  <text x="971.0345" y="509.0575" text-anchor="middle" font-family="Arial" font-size="14.7126" fill="var(--warn-accent)">Spark 3.0+ recommended</text>
  <rect x="147.1264" y="551.7241" width="882.7586" height="88.2759" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="588.5057" y="584.092" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--text)">Detection: skew_ratio = max(partition_size) / avg(partition_size)</text>
  <text x="588.5057" y="613.5172" text-anchor="middle" font-family="Arial" font-size="17.6552" fill="var(--text-muted)">Ratio &gt; 3.0 indicates significant skew -- check with spark_partition_id()</text>
</svg>
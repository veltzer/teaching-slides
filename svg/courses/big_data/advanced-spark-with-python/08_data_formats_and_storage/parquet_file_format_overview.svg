<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="45.312492016602" rx="6.065269974309" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="70.812494571289" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.592742685843" fill="var(--text)">Magic Number: "PAR1" (4 bytes)</text>
  <rect x="40" y="94.374990419922" width="1200" height="235.624958486328" rx="6.065269974309" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="109.2307" y="130.625086220703" font-family="Arial, sans-serif" font-size="23.511109264913" font-weight="bold" fill="var(--text)">Row Group 0</text>
  <rect x="86.1538" y="148.749980839844" width="1107.6922" height="50.749991058594" rx="6.065269974309" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="181.375077279297" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.592742685843" fill="var(--text)">Column Chunk: user_id [Page 0] [Page 1] [Page 2]</text>
  <rect x="86.1538" y="208.562470301758" width="1107.6922" height="50.749991058594" rx="6.065269974309" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="241.187464553711" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.592742685843" fill="var(--text)">Column Chunk: event_type [Page 0] [Page 1]</text>
  <rect x="86.1538" y="268.375061951172" width="1107.6922" height="50.749991058594" rx="6.065269974309" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="300.999954015625" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.592742685843" fill="var(--text)">Column Chunk: amount [Page 0] [Page 1]</text>
  <rect x="40" y="348.12504790039" width="1200" height="72.499987226563" rx="6.065269974309" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="393.437437729492" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.551925975378" fill="var(--text)">Row Group 1 (same structure)</text>
  <rect x="40" y="438.749929746094" width="1200" height="126.874977646484" rx="6.065269974309" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="475.000025546875" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.511109264913" font-weight="bold" fill="var(--text)">Footer</text>
  <text x="640" y="507.625019798828" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.592742685843" fill="var(--text-muted)">File metadata (schema, row group info)</text>
  <text x="640" y="534.812515008789" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.592742685843" fill="var(--text-muted)">Column metadata (encodings, statistics) | Key-value metadata</text>
  <rect x="40" y="574.687507983398" width="1200" height="45.312492016602" rx="6.065269974309" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="605.500002554687" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.592742685843" fill="var(--text)">Footer Length (4 bytes) | Magic Number: "PAR1" (4 bytes)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="46.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.9032" font-weight="bold" fill="#333">Row Group Sizing and Layout</text>
  <rect x="61.9355" y="72" width="1156.129" height="617.1429" rx="16.5161" fill="#fff3e0" stroke="#ef6c00" stroke-width="4.129" />
  <text x="640" y="128.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="#333">Row Group (default: 128 MB, ~1M rows)</text>
  <text x="640" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#555">Column Chunks stored contiguously:</text>
  <rect x="123.871" y="205.7143" width="474.8387" height="90" rx="12.3871" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.0968" />
  <text x="361.2903" y="262.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#333">col_a data (encoded + compressed)</text>
  <rect x="123.871" y="308.5714" width="474.8387" height="90" rx="12.3871" fill="#e1f5fe" stroke="#0277bd" stroke-width="3.0968" />
  <text x="361.2903" y="365.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#333">col_b data</text>
  <rect x="123.871" y="411.4286" width="474.8387" height="90" rx="12.3871" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.0968" />
  <text x="361.2903" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#333">col_c data</text>
  <rect x="660.6452" y="205.7143" width="516.129" height="295.7143" rx="12.3871" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="2.0645" />
  <text x="918.7097" y="257.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" font-weight="bold" fill="#333">Each column chunk has:</text>
  <text x="918.7097" y="303.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">Encoding: PLAIN, DICT, RLE, DELTA</text>
  <text x="918.7097" y="349.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">Compression: SNAPPY, GZIP, ZSTD</text>
  <text x="918.7097" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">Statistics: min, max, null_count</text>
  <text x="918.7097" y="442.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">Page index: offset, size per page</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="594.3615" y="42.9851" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.8421" font-weight="bold" fill="var(--text)">Row Group Sizing and Layout</text>
  <rect x="57.5189" y="66.8657" width="1073.6852" height="573.1343" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="594.3615" y="119.403" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0075" font-weight="bold" fill="var(--text)">Row Group (default: 128 MB, ~1M rows)</text>
  <text x="594.3615" y="167.1642" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0903" fill="var(--text-muted)">Column Chunks stored contiguously:</text>
  <rect x="115.0377" y="191.0448" width="440.9779" height="83.5821" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="335.5266" y="243.5821" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0903" fill="var(--text)">col_a data (encoded + compressed)</text>
  <rect x="115.0377" y="286.5671" width="440.9779" height="83.5821" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="335.5266" y="339.1045" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0903" fill="var(--text)">col_b data</text>
  <rect x="115.0377" y="382.0896" width="440.9779" height="83.5821" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="335.5266" y="434.6268" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0903" fill="var(--text)">col_c data</text>
  <rect x="613.5345" y="191.0448" width="479.3238" height="274.6269" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="853.1964" y="238.806" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.173" font-weight="bold" fill="var(--text)">Each column chunk has:</text>
  <text x="853.1964" y="281.7911" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.173" fill="var(--text-muted)">Encoding: PLAIN, DICT, RLE, DELTA</text>
  <text x="853.1964" y="324.7761" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.173" fill="var(--text-muted)">Compression: SNAPPY, GZIP, ZSTD</text>
  <text x="853.1964" y="367.7612" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.173" fill="var(--text-muted)">Statistics: min, max, null_count</text>
  <text x="853.1964" y="410.7462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.173" fill="var(--text-muted)">Page index: offset, size per page</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="628.235279046521" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="32.986575363921" font-weight="bold" fill="var(--text)">Row Group (default: 128 MB, ~1M rows)</text>
  <text x="628.235279046521" y="119.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.237889006373" fill="var(--text-muted)">Column Chunks stored contiguously:</text>
  <rect x="40" y="160" width="541.176505036523" height="139.999999999999" rx="8.255552958548" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="310.588142714346" y="247.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.237889006373" fill="var(--text)">col_a data (encoded + compressed)</text>
  <rect x="40" y="319.999827586207" width="541.176505036523" height="139.999999999999" rx="8.255552958548" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="310.588142714346" y="407.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.237889006373" fill="var(--text)">col_b data</text>
  <rect x="40" y="479.999999999999" width="541.176505036523" height="139.999999999999" rx="8.255552958548" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="310.588142714346" y="567.999827586206" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.237889006373" fill="var(--text)">col_c data</text>
  <rect x="651.764720953479" y="160" width="588.235279046521" height="460" rx="8.255552958548" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="945.882415378697" y="239.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.488927463726" font-weight="bold" fill="var(--text)">Each column chunk has:</text>
  <text x="945.882415378697" y="311.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.488927463726" fill="var(--text-muted)">Encoding: PLAIN, DICT, RLE, DELTA</text>
  <text x="945.882415378697" y="383.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.488927463726" fill="var(--text-muted)">Compression: SNAPPY, GZIP, ZSTD</text>
  <text x="945.882415378697" y="455.999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.488927463726" fill="var(--text-muted)">Statistics: min, max, null_count</text>
  <text x="945.882415378697" y="527.999827586205" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.488927463726" fill="var(--text-muted)">Page index: offset, size per page</text>
</svg>

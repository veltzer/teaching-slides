<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.9698" font-weight="bold" fill="var(--text)">Row Group Sizing and Layout</text>
  <rect x="40" y="63.2" width="1200" height="556.8" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="114.24" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.9741" font-weight="bold" fill="var(--text)">Row Group (default: 128 MB, ~1M rows)</text>
  <text x="640" y="160.64" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9764" fill="var(--text-muted)">Column Chunks stored contiguously:</text>
  <rect x="104.2857" y="183.84" width="492.8572" height="81.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.7142" y="234.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9764" fill="var(--text)">col_a data (encoded + compressed)</text>
  <rect x="104.2857" y="276.6399" width="492.8572" height="81.2" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.7142" y="327.68" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9764" fill="var(--text)">col_b data</text>
  <rect x="104.2857" y="369.44" width="492.8572" height="81.2" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.7142" y="420.4799" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9764" fill="var(--text)">col_c data</text>
  <rect x="661.4286" y="183.84" width="535.7143" height="266.8" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="929.2858" y="230.24" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" font-weight="bold" fill="var(--text)">Each column chunk has:</text>
  <text x="929.2858" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--text-muted)">Encoding: PLAIN, DICT, RLE, DELTA</text>
  <text x="929.2858" y="313.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--text-muted)">Compression: SNAPPY, GZIP, ZSTD</text>
  <text x="929.2858" y="355.52" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--text-muted)">Statistics: min, max, null_count</text>
  <text x="929.2858" y="397.2799" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--text-muted)">Page index: offset, size per page</text>
</svg>
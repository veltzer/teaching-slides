<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="26.699515028696" fill="var(--info-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Compaction Scheduling</text>
  <text x="40" y="82.963081481481" font-size="22.88521900451" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Micro-batch writes (every 1 min) → 1440 files/day:</text>
  <rect x="55.238143461831" y="104.444444444444" width="95.238003779286" height="60.148148148148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="70.476182161753" y="145.259259259259" font-size="20.978238134599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">2KB</text>
  <rect x="158.095166591078" y="104.444444444444" width="95.238003779286" height="60.148148148148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="173.333310052909" y="145.259259259259" font-size="20.978238134599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">3KB</text>
  <rect x="260.952399244143" y="104.444444444444" width="95.238003779286" height="60.148148148148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="276.190437944065" y="145.259259259259" font-size="20.978238134599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">1KB</text>
  <rect x="363.809631897208" y="104.444444444444" width="95.238003779286" height="60.148148148148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="379.04767059713" y="145.259259259259" font-size="20.978238134599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">2KB</text>
  <rect x="466.666655026455" y="104.444444444444" width="95.238003779286" height="60.148148148148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="481.904798488286" y="145.259259259259" font-size="20.978238134599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">4KB</text>
  <rect x="569.523887679519" y="104.444444444444" width="114.285814058961" height="60.148148148148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="584.761926379442" y="145.259259259259" font-size="20.978238134599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">...</text>
  <rect x="691.428616326532" y="104.444444444444" width="95.238003779286" height="60.148148148148" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="706.666759788364" y="145.259259259259" font-size="20.978238134599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">3KB</text>
  <line x1="649.523852758883" y1="190.370488888889" x2="649.523852758883" y2="254.814933333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="664.761891458805" y="233.333333333333" font-size="20.978238134599" fill="var(--text-muted)" text-anchor="start" font-family="Arial, sans-serif">Scheduled compaction (daily at 2 AM)</text>
  <rect x="59.047600755857" y="265.555674074074" width="1180.952399244143" height="81.62962962963" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="78.095201511714" y="299.925925925926" font-size="22.88521900451" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Read all files for yesterday's partition, write as fewer larger files</text>
  <line x1="649.523852758883" y1="351.481481481482" x2="649.523852758883" y2="426.666785185185" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="469.62962962963" font-size="22.88521900451" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">After compaction:</text>
  <rect x="55.238143461831" y="491.111111111111" width="342.857127891156" height="85.925925925926" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="150.476147241117" y="544.814933333333" font-size="24.792534158785" fill="var(--ok-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">128 MB</text>
  <rect x="436.19057762661" y="491.111111111111" width="342.857127891156" height="85.925925925926" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="531.428581405896" y="544.814933333333" font-size="24.792534158785" fill="var(--ok-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">128 MB</text>
  <rect x="817.14290702948" y="491.111111111111" width="342.857127891156" height="85.925925925926" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.685687284951" filter="url(#shadow)"/>
  <text x="912.380910808766" y="544.814933333333" font-size="24.792534158785" fill="var(--ok-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">90 MB</text>
  <text x="40" y="620" font-size="22.88521900451" fill="var(--ok-accent)" text-anchor="start" font-family="Arial, sans-serif">3 files per day  (vs 1440)</text>
</svg>

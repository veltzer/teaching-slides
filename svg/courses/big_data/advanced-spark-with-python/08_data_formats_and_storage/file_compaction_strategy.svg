<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12.7059 L 15.0588 6.3529 z" fill="#555" />
    </marker>
  </defs>
  <rect x="17.239" y="19.394" width="1137.7776" height="620.606" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="34.4781" y="58.1818" font-family="sans-serif" font-size="24.1346" fill="var(--info-accent)" text-anchor="start" font-weight="bold">Compaction Scheduling</text>
  <text x="34.4781" y="96.9697" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="start">Micro-batch writes (every 1 min) → 1440 files/day:</text>
  <rect x="48.2694" y="116.3636" width="86.1952" height="54.303" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="62.0606" y="153.2121" font-family="sans-serif" font-size="18.963" fill="var(--text)" text-anchor="start">2KB</text>
  <rect x="141.3602" y="116.3636" width="86.1952" height="54.303" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="155.1515" y="153.2121" font-family="sans-serif" font-size="18.963" fill="var(--text)" text-anchor="start">3KB</text>
  <rect x="234.4512" y="116.3636" width="86.1952" height="54.303" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="248.2424" y="153.2121" font-family="sans-serif" font-size="18.963" fill="var(--text)" text-anchor="start">1KB</text>
  <rect x="327.5421" y="116.3636" width="86.1952" height="54.303" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="341.3333" y="153.2121" font-family="sans-serif" font-size="18.963" fill="var(--text)" text-anchor="start">2KB</text>
  <rect x="420.6329" y="116.3636" width="86.1952" height="54.303" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="434.4242" y="153.2121" font-family="sans-serif" font-size="18.963" fill="var(--text)" text-anchor="start">4KB</text>
  <rect x="513.7239" y="116.3636" width="103.4344" height="54.303" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="527.5151" y="153.2121" font-family="sans-serif" font-size="18.963" fill="var(--text)" text-anchor="start">...</text>
  <rect x="624.0538" y="116.3636" width="86.1952" height="54.303" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="637.8451" y="153.2121" font-family="sans-serif" font-size="18.963" fill="var(--text)" text-anchor="start">3KB</text>
  <line x1="586.1279" y1="193.9394" x2="586.1279" y2="252.1212" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="599.9191" y="232.7272" font-family="sans-serif" font-size="18.963" fill="var(--text-muted)" text-anchor="start">Scheduled compaction (daily at 2 AM)</text>
  <rect x="51.7172" y="261.8182" width="1068.8214" height="73.697" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="68.9562" y="292.8484" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="start">Read all files for yesterday's partition, write as fewer larger files</text>
  <line x1="586.1279" y1="339.3939" x2="586.1279" y2="407.2727" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arr)" />
  <text x="34.4781" y="446.0605" font-family="sans-serif" font-size="20.6868" fill="var(--text)" text-anchor="start" font-weight="bold">After compaction:</text>
  <rect x="48.2694" y="465.4545" width="310.303" height="77.5758" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="134.4646" y="513.9394" font-family="sans-serif" font-size="22.4108" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">128 MB</text>
  <rect x="393.0505" y="465.4545" width="310.303" height="77.5758" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="479.2457" y="513.9394" font-family="sans-serif" font-size="22.4108" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">128 MB</text>
  <rect x="737.8316" y="465.4545" width="310.303" height="77.5758" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="824.0268" y="513.9394" font-family="sans-serif" font-size="22.4108" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">90 MB</text>
  <text x="34.4781" y="581.8181" font-family="sans-serif" font-size="20.6868" fill="var(--ok-accent)" text-anchor="start">3 files per day  (vs 1440)</text>
</svg>
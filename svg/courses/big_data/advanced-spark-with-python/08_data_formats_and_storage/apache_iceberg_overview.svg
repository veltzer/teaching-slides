<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="1200" height="63.5616" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="63.8357" font-size="17.5852" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Iceberg Catalog  (HMS, Glue, REST, Nessie)</text>
  <text x="59.3548" y="85.0228" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Points to current metadata file</text>
  <line x1="639.9999" y1="103.5616" x2="639.9999" y2="124.7488" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arrow)" />
  <rect x="40" y="159.1781" width="1200" height="119.1781" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="183.0136" font-size="17.5852" fill="var(--ok-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Metadata Layer</text>
  <text x="59.3548" y="204.2009" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">metadata/v3.metadata.json</text>
  <text x="59.3548" y="222.7397" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">- Schema (current + history)</text>
  <text x="59.3548" y="241.2785" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">- Partition spec (current + history)</text>
  <text x="59.3548" y="259.8173" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">- Snapshot list → snap-001.avro, snap-002.avro</text>
  <line x1="639.9999" y1="278.3561" x2="639.9999" y2="299.5434" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arrow)" />
  <rect x="40" y="318.0822" width="1200" height="82.1005" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="341.9178" font-size="17.5852" fill="var(--warn-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Manifest List</text>
  <text x="59.3548" y="363.105" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Points to manifest files</text>
  <text x="59.3548" y="381.6438" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Contains partition summary statistics</text>
  <line x1="639.9999" y1="400.1827" x2="639.9999" y2="421.3698" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arrow)" />
  <rect x="40" y="424.0182" width="1200" height="100.6393" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="447.8539" font-size="17.5852" fill="var(--danger-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Manifest Files</text>
  <text x="59.3548" y="469.0411" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">List of data files with:</text>
  <text x="59.3548" y="487.58" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">- File path, format, size   - Partition values</text>
  <text x="59.3548" y="506.1188" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">- Column-level min/max/null stats</text>
  <line x1="639.9999" y1="524.6575" x2="639.9999" y2="545.8448" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arrow)" />
  <rect x="40" y="556.4384" width="1200" height="63.5616" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="580.2741" font-size="17.5852" fill="var(--info-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Data Files  (Parquet / ORC / Avro)</text>
  <text x="59.3548" y="601.4612" font-size="14.8798" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Actual columnar data storage</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 8.3077 L 15.5152 4.1538 z" fill="#555" />
    </marker>
  </defs>
  <rect x="35.2926" y="88.189" width="1094.0693" height="60.4724" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="52.9388" y="110.8662" font-family="sans-serif" font-size="16.378" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Iceberg Catalog  (HMS, Glue, REST, Nessie)</text>
  <text x="52.9388" y="131.0236" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">Points to current metadata file</text>
  <line x1="582.3272" y1="148.6614" x2="582.3272" y2="168.8189" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arr)" />
  <rect x="35.2926" y="201.5748" width="1094.0693" height="113.3858" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="52.9388" y="224.2519" font-family="sans-serif" font-size="16.378" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">Metadata Layer</text>
  <text x="52.9388" y="244.4095" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">metadata/v3.metadata.json</text>
  <text x="52.9388" y="262.0472" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">- Schema (current + history)</text>
  <text x="52.9388" y="279.685" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">- Partition spec (current + history)</text>
  <text x="52.9388" y="297.3228" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">- Snapshot list → snap-001.avro, snap-002.avro</text>
  <line x1="582.3272" y1="314.9606" x2="582.3272" y2="335.1181" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arr)" />
  <rect x="35.2926" y="352.7559" width="1094.0693" height="78.1103" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="52.9388" y="375.4331" font-family="sans-serif" font-size="16.378" fill="var(--warn-accent)" text-anchor="start" font-weight="bold">Manifest List</text>
  <text x="52.9388" y="395.5905" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">Points to manifest files</text>
  <text x="52.9388" y="413.2283" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">Contains partition summary statistics</text>
  <line x1="582.3272" y1="430.8662" x2="582.3272" y2="451.0236" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arr)" />
  <rect x="35.2926" y="453.5433" width="1094.0693" height="95.7481" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="52.9388" y="476.2205" font-family="sans-serif" font-size="16.378" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">Manifest Files</text>
  <text x="52.9388" y="496.378" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">List of data files with:</text>
  <text x="52.9388" y="514.0158" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">- File path, format, size   - Partition values</text>
  <text x="52.9388" y="531.6536" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">- Column-level min/max/null stats</text>
  <line x1="582.3272" y1="549.2913" x2="582.3272" y2="569.4489" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arr)" />
  <rect x="35.2926" y="579.5276" width="1094.0693" height="60.4724" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="52.9388" y="602.2048" font-family="sans-serif" font-size="16.378" fill="var(--info-accent)" text-anchor="start" font-weight="bold">Data Files  (Parquet / ORC / Avro)</text>
  <text x="52.9388" y="622.3622" font-family="sans-serif" font-size="13.8583" fill="var(--text)" text-anchor="start">Actual columnar data storage</text>
</svg>
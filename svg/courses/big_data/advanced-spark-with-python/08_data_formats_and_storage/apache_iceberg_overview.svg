<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 8.3077 L 15.5152 4.1538 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="63.5616" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="63.8357" font-family="sans-serif" font-size="17.5852" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Iceberg Catalog  (HMS, Glue, REST, Nessie)</text>
  <text x="59.3548" y="85.0228" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">Points to current metadata file</text>
  <line x1="639.9999" y1="103.5616" x2="639.9999" y2="124.7488" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arr)" />
  <rect x="40" y="159.1781" width="1200" height="119.1781" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="183.0136" font-family="sans-serif" font-size="17.5852" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">Metadata Layer</text>
  <text x="59.3548" y="204.2009" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">metadata/v3.metadata.json</text>
  <text x="59.3548" y="222.7397" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">- Schema (current + history)</text>
  <text x="59.3548" y="241.2785" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">- Partition spec (current + history)</text>
  <text x="59.3548" y="259.8173" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">- Snapshot list → snap-001.avro, snap-002.avro</text>
  <line x1="639.9999" y1="278.3561" x2="639.9999" y2="299.5434" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arr)" />
  <rect x="40" y="318.0822" width="1200" height="82.1005" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="341.9178" font-family="sans-serif" font-size="17.5852" fill="var(--warn-accent)" text-anchor="start" font-weight="bold">Manifest List</text>
  <text x="59.3548" y="363.105" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">Points to manifest files</text>
  <text x="59.3548" y="381.6438" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">Contains partition summary statistics</text>
  <line x1="639.9999" y1="400.1827" x2="639.9999" y2="421.3698" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arr)" />
  <rect x="40" y="424.0182" width="1200" height="100.6393" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="447.8539" font-family="sans-serif" font-size="17.5852" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">Manifest Files</text>
  <text x="59.3548" y="469.0411" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">List of data files with:</text>
  <text x="59.3548" y="487.58" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">- File path, format, size   - Partition values</text>
  <text x="59.3548" y="506.1188" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">- Column-level min/max/null stats</text>
  <line x1="639.9999" y1="524.6575" x2="639.9999" y2="545.8448" stroke="var(--text-muted)" stroke-width="1.8897" marker-end="url(#arr)" />
  <rect x="40" y="556.4384" width="1200" height="63.5616" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="580.2741" font-family="sans-serif" font-size="17.5852" fill="var(--info-accent)" text-anchor="start" font-weight="bold">Data Files  (Parquet / ORC / Avro)</text>
  <text x="59.3548" y="601.4612" font-family="sans-serif" font-size="14.8798" fill="var(--text)" text-anchor="start">Actual columnar data storage</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="637.1681" height="84.878010053542" rx="6.173112245669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.5841" y="96.585445889347" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.829433373124" fill="var(--text)">Streaming / message use case?</text>
  <line x1="677.1681" y1="82.439057953597" x2="783.3628" y2="82.439057953597" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="719.646" y="62.634157185008" font-family="Arial, sans-serif" font-size="23.481284360076" fill="var(--ok-accent)">Yes</text>
  <rect x="793.9823" y="40" width="424.7787" height="84.878010053542" rx="6.173112245669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.3717" y="96.585445889347" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.829433373124" font-weight="bold" fill="var(--ok-accent)">Use Avro</text>
  <line x1="358.5841" y1="124.878115907194" x2="358.5841" y2="181.463455942889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390.4424" y="167.317068007139" font-family="Arial, sans-serif" font-size="23.481284360076" fill="var(--danger-accent)">No</text>
  <rect x="40" y="195.609738024986" width="637.1681" height="84.878010053542" rx="6.173112245669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.5841" y="252.195183914333" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.829433373124" fill="var(--text)">Analytics / OLAP workload?</text>
  <line x1="677.1681" y1="238.048795978583" x2="783.3628" y2="238.048795978583" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="719.646" y="218.243895209994" font-family="Arial, sans-serif" font-size="23.481284360076" fill="var(--ok-accent)">Yes</text>
  <rect x="793.9823" y="195.609738024986" width="424.7787" height="84.878010053542" rx="6.173112245669" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.3717" y="252.195183914333" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.829433373124" fill="var(--text)">Hive primary engine?</text>
  <line x1="1006.3717" y1="280.48785393218" x2="910.7965" y2="351.219476049972" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="910.7965" y="337.073193967875" font-family="Arial, sans-serif" font-size="23.481284360076" fill="var(--ok-accent)">Yes</text>
  <rect x="793.9823" y="365.365863985722" width="191.1505" height="70.731727971444" rx="6.173112245669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="889.5575" y="413.463434772158" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.481284360076" font-weight="bold" fill="var(--text)">Use ORC</text>
  <line x1="1006.3717" y1="280.48785393218" x2="1101.9468" y2="351.219476049972" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1101.9468" y="337.073193967875" font-family="Arial, sans-serif" font-size="23.481284360076" fill="var(--danger-accent)">No</text>
  <rect x="1016.9911" y="365.365863985722" width="223.0089" height="70.731727971444" rx="6.173112245669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1129.5576" y="413.463434772158" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.481284360076" font-weight="bold" fill="var(--text)">Use Parquet</text>
  <line x1="358.5841" y1="280.48785393218" x2="358.5841" y2="337.073193967875" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390.4424" y="322.926806032125" font-family="Arial, sans-serif" font-size="23.481284360076" fill="var(--danger-accent)">No</text>
  <rect x="40" y="351.219476049972" width="637.1681" height="84.878010053542" rx="6.173112245669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.5841" y="407.804921939319" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.829433373124" fill="var(--text)">Need ACID / time travel / MERGE?</text>
  <line x1="677.1681" y1="393.65853400357" x2="783.3628" y2="520.975602010708" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="709.0266" y="450.243874039264" font-family="Arial, sans-serif" font-size="23.481284360076" fill="var(--ok-accent)">Yes</text>
  <rect x="793.9823" y="492.682931992861" width="424.7787" height="84.878010053542" rx="6.173112245669" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1006.3717" y="549.268272028556" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.829433373124" font-weight="bold" fill="var(--info-accent)">Use Delta Lake / Iceberg</text>
  <line x1="358.5841" y1="436.097591957167" x2="358.5841" y2="520.975602010708" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390.4424" y="492.682931992861" font-family="Arial, sans-serif" font-size="23.481284360076" fill="var(--danger-accent)">No</text>
  <rect x="146.1947" y="535.121989946458" width="424.7787" height="84.878010053542" rx="6.173112245669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="358.5841" y="591.707329982153" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.829433373124" font-weight="bold" fill="var(--ok-accent)">Use Parquet (safe default)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrow-fs" markerWidth="20.6452" markerHeight="15.75" refX="18.5806" refY="7.875" orient="auto">
      <polygon points="0,22.5 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.9032" font-weight="bold" fill="#333">Choosing the Right Format</text>
  <rect x="61.9355" y="67.5" width="619.3548" height="67.5" rx="16.5161" fill="#e1f5fe" stroke="#0277bd" stroke-width="4.129" />
  <text x="371.6129" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#333">Streaming / message use case?</text>
  <line x1="681.2903" y1="101.25" x2="784.5161" y2="101.25" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="722.5806" y="85.5" font-family="Arial, sans-serif" font-size="20.6452" fill="#2e7d32">Yes</text>
  <rect x="794.8387" y="67.5" width="412.9032" height="67.5" rx="16.5161" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.129" />
  <text x="1001.2903" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="#2e7d32">Use Avro</text>
  <line x1="371.6129" y1="135" x2="371.6129" y2="180" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="402.5806" y="168.75" font-family="Arial, sans-serif" font-size="20.6452" fill="#c62828">No</text>
  <rect x="61.9355" y="191.25" width="619.3548" height="67.5" rx="16.5161" fill="#e1f5fe" stroke="#0277bd" stroke-width="4.129" />
  <text x="371.6129" y="236.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#333">Analytics / OLAP workload?</text>
  <line x1="681.2903" y1="225" x2="784.5161" y2="225" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="722.5806" y="209.25" font-family="Arial, sans-serif" font-size="20.6452" fill="#2e7d32">Yes</text>
  <rect x="794.8387" y="191.25" width="412.9032" height="67.5" rx="16.5161" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.0968" />
  <text x="1001.2903" y="236.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#333">Hive primary engine?</text>
  <line x1="1001.2903" y1="258.75" x2="908.3871" y2="315" stroke="#333" stroke-width="3.0968" marker-end="url(#arrow-fs)" />
  <text x="908.3871" y="303.75" font-family="Arial, sans-serif" font-size="20.6452" fill="#2e7d32">Yes</text>
  <rect x="794.8387" y="326.25" width="185.8065" height="56.25" rx="12.3871" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.0968" />
  <text x="887.7419" y="364.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" font-weight="bold" fill="#333">Use ORC</text>
  <line x1="1001.2903" y1="258.75" x2="1094.1935" y2="315" stroke="#333" stroke-width="3.0968" marker-end="url(#arrow-fs)" />
  <text x="1094.1935" y="303.75" font-family="Arial, sans-serif" font-size="20.6452" fill="#c62828">No</text>
  <rect x="1011.6129" y="326.25" width="216.7742" height="56.25" rx="12.3871" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.0968" />
  <text x="1121.0323" y="364.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" font-weight="bold" fill="#333">Use Parquet</text>
  <line x1="371.6129" y1="258.75" x2="371.6129" y2="303.75" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="402.5806" y="292.5" font-family="Arial, sans-serif" font-size="20.6452" fill="#c62828">No</text>
  <rect x="61.9355" y="315" width="619.3548" height="67.5" rx="16.5161" fill="#e1f5fe" stroke="#0277bd" stroke-width="4.129" />
  <text x="371.6129" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#333">Need ACID / time travel / MERGE?</text>
  <line x1="681.2903" y1="348.75" x2="784.5161" y2="450" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="712.2581" y="393.75" font-family="Arial, sans-serif" font-size="20.6452" fill="#2e7d32">Yes</text>
  <rect x="794.8387" y="427.5" width="412.9032" height="67.5" rx="16.5161" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4.129" />
  <text x="1001.2903" y="472.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="#7b1fa2">Use Delta Lake / Iceberg</text>
  <line x1="371.6129" y1="382.5" x2="371.6129" y2="450" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="402.5806" y="427.5" font-family="Arial, sans-serif" font-size="20.6452" fill="#c62828">No</text>
  <rect x="165.1613" y="461.25" width="412.9032" height="67.5" rx="16.5161" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.129" />
  <text x="371.6129" y="506.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="#2e7d32">Use Parquet (safe default)</text>
</svg>
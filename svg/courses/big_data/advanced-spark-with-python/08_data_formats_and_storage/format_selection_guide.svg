<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-fs" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.9032" font-weight="bold" fill="var(--text-dark)">Choosing the Right Format</text>
  <rect x="61.9355" y="67.5" width="619.3548" height="67.5" rx="16.5161" fill="var(--primary-pale3)" stroke="var(--primary-strong)" stroke-width="4.129" />
  <text x="371.6129" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="var(--text-dark)">Streaming / message use case?</text>
  <line x1="681.2903" y1="101.25" x2="784.5161" y2="101.25" stroke="var(--text-dark)" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="722.5806" y="85.5" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--ok-dk)">Yes</text>
  <rect x="794.8387" y="67.5" width="412.9032" height="67.5" rx="16.5161" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="4.129" />
  <text x="1001.2903" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="var(--ok-dk)">Use Avro</text>
  <line x1="371.6129" y1="135" x2="371.6129" y2="180" stroke="var(--text-dark)" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="402.5806" y="168.75" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--danger-dk)">No</text>
  <rect x="61.9355" y="191.25" width="619.3548" height="67.5" rx="16.5161" fill="var(--primary-pale3)" stroke="var(--primary-strong)" stroke-width="4.129" />
  <text x="371.6129" y="236.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="var(--text-dark)">Analytics / OLAP workload?</text>
  <line x1="681.2903" y1="225" x2="784.5161" y2="225" stroke="var(--text-dark)" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="722.5806" y="209.25" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--ok-dk)">Yes</text>
  <rect x="794.8387" y="191.25" width="412.9032" height="67.5" rx="16.5161" fill="var(--warn-pale)" stroke="var(--warn-deep)" stroke-width="3.0968" />
  <text x="1001.2903" y="236.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="var(--text-dark)">Hive primary engine?</text>
  <line x1="1001.2903" y1="258.75" x2="908.3871" y2="315" stroke="var(--text-dark)" stroke-width="3.0968" marker-end="url(#arrow-fs)" />
  <text x="908.3871" y="303.75" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--ok-dk)">Yes</text>
  <rect x="794.8387" y="326.25" width="185.8065" height="56.25" rx="12.3871" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="3.0968" />
  <text x="887.7419" y="364.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" font-weight="bold" fill="var(--text-dark)">Use ORC</text>
  <line x1="1001.2903" y1="258.75" x2="1094.1935" y2="315" stroke="var(--text-dark)" stroke-width="3.0968" marker-end="url(#arrow-fs)" />
  <text x="1094.1935" y="303.75" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--danger-dk)">No</text>
  <rect x="1011.6129" y="326.25" width="216.7742" height="56.25" rx="12.3871" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="3.0968" />
  <text x="1121.0323" y="364.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" font-weight="bold" fill="var(--text-dark)">Use Parquet</text>
  <line x1="371.6129" y1="258.75" x2="371.6129" y2="303.75" stroke="var(--text-dark)" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="402.5806" y="292.5" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--danger-dk)">No</text>
  <rect x="61.9355" y="315" width="619.3548" height="67.5" rx="16.5161" fill="var(--primary-pale3)" stroke="var(--primary-strong)" stroke-width="4.129" />
  <text x="371.6129" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="var(--text-dark)">Need ACID / time travel / MERGE?</text>
  <line x1="681.2903" y1="348.75" x2="784.5161" y2="450" stroke="var(--text-dark)" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="712.2581" y="393.75" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--ok-dk)">Yes</text>
  <rect x="794.8387" y="427.5" width="412.9032" height="67.5" rx="16.5161" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="4.129" />
  <text x="1001.2903" y="472.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="var(--info-mid)">Use Delta Lake / Iceberg</text>
  <line x1="371.6129" y1="382.5" x2="371.6129" y2="450" stroke="var(--text-dark)" stroke-width="4.129" marker-end="url(#arrow-fs)" />
  <text x="402.5806" y="427.5" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--danger-dk)">No</text>
  <rect x="165.1613" y="461.25" width="412.9032" height="67.5" rx="16.5161" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="4.129" />
  <text x="371.6129" y="506.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="var(--ok-dk)">Use Parquet (safe default)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="545.4545" height="175.348844575446" rx="6.165168514588" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.7274" y="88.558151320714" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.751404788326" font-weight="bold" fill="var(--text)">Page 0</text>
  <text x="312.7274" y="134.418592374256" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.501323786119" fill="var(--text-muted)">min=10, max=500</text>
  <text x="312.7274" y="180.279033427798" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.501323786119" fill="var(--text-muted)">null_count=0, num_values=10000</text>
  <rect x="40" y="242.325524921579" width="545.4545" height="175.348844575446" rx="6.165168514588" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.7274" y="290.883676242293" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.751404788326" font-weight="bold" fill="var(--text)">Page 1</text>
  <text x="312.7274" y="336.744222877231" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.501323786119" fill="var(--text-muted)">min=501, max=2000</text>
  <text x="312.7274" y="382.604663930774" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.501323786119" fill="var(--text-muted)">null_count=3, num_values=9997</text>
  <rect x="40" y="444.651155424554" width="545.4545" height="175.348844575446" rx="6.165168514588" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312.7274" y="493.209306745268" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.751404788326" font-weight="bold" fill="var(--text)">Page 2</text>
  <text x="312.7274" y="539.06974779881" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.501323786119" fill="var(--text-muted)">min=2001, max=9999</text>
  <text x="312.7274" y="584.930188852352" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.501323786119" fill="var(--text-muted)">null_count=1, num_values=9999</text>
  <rect x="672.7273" y="40" width="567.2727" height="580" rx="6.165168514588" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.3636" y="107.441806446727" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.001588543342" font-weight="bold" fill="var(--text)">WHERE amount &gt; 5000</text>
  <text x="956.3636" y="188.372058647917" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.751404788326" fill="var(--ok-accent)">SKIP Page 0 (max=500)</text>
  <text x="956.3636" y="309.767436949702" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.751404788326" fill="var(--ok-accent)">SKIP Page 1 (max=2000)</text>
  <text x="956.3636" y="444.651155424554" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.751404788326" fill="var(--danger-accent)" font-weight="bold">READ Page 2 (max=9999)</text>
  <text x="956.3636" y="552.558087971876" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.501323786119" fill="var(--text-muted)">Only 1 of 3 pages read!</text>
</svg>

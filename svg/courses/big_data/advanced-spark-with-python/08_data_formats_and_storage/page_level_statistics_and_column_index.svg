<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="629.0909" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.6578" font-weight="bold" fill="var(--text)">Page-Level Statistics (Column: "amount")</text>
  <rect x="40" y="70.6608" width="545.4545" height="166.0793" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="312.7274" y="116.652" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0883" font-weight="bold" fill="var(--text)">Page 0</text>
  <text x="312.7274" y="160.0881" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8985" fill="var(--text-muted)">min=10, max=500</text>
  <text x="312.7274" y="203.5242" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8985" fill="var(--text-muted)">null_count=0, num_values=10000</text>
  <rect x="40" y="262.2907" width="545.4545" height="166.0793" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="312.7274" y="308.2819" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0883" font-weight="bold" fill="var(--text)">Page 1</text>
  <text x="312.7274" y="351.7181" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8985" fill="var(--text-muted)">min=501, max=2000</text>
  <text x="312.7274" y="395.1542" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8985" fill="var(--text-muted)">null_count=3, num_values=9997</text>
  <rect x="40" y="453.9207" width="545.4545" height="166.0793" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="312.7274" y="499.9119" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0883" font-weight="bold" fill="var(--text)">Page 2</text>
  <text x="312.7274" y="543.348" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8985" fill="var(--text-muted)">min=2001, max=9999</text>
  <text x="312.7274" y="586.7841" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8985" fill="var(--text-muted)">null_count=1, num_values=9999</text>
  <rect x="672.7273" y="70.6608" width="567.2727" height="549.3392" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="956.3636" y="134.5374" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2782" font-weight="bold" fill="var(--text)">WHERE amount &gt; 5000</text>
  <text x="956.3636" y="211.1894" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0883" fill="var(--ok-accent)">SKIP Page 0 (max=500)</text>
  <text x="956.3636" y="326.1674" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0883" fill="var(--ok-accent)">SKIP Page 1 (max=2000)</text>
  <text x="956.3636" y="453.9207" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0883" fill="var(--danger-accent)" font-weight="bold">READ Page 2 (max=9999)</text>
  <text x="956.3636" y="556.1233" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8985" fill="var(--text-muted)">Only 1 of 3 pages read!</text>
</svg>
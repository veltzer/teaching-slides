<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460"><defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
  </marker>
</defs><rect x="10" y="10" width="660" height="120" fill="#e8f5e9" stroke="#333" stroke-width="1.5" rx="4"/><text x="20" y="28" font-family="sans-serif" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="bold">Good partition column:</text><text x="20" y="46" font-family="sans-serif" font-size="12" fill="#1b5e20" text-anchor="start">[✓] Used in WHERE clauses frequently</text><text x="20" y="63" font-family="sans-serif" font-size="12" fill="#1b5e20" text-anchor="start">[✓] Low-to-medium cardinality (10 – 10,000)</text><text x="20" y="80" font-family="sans-serif" font-size="12" fill="#1b5e20" text-anchor="start">[✓] Even data distribution</text><text x="20" y="97" font-family="sans-serif" font-size="12" fill="#1b5e20" text-anchor="start">[✓] Each partition > 128 MB</text><rect x="10" y="140" width="660" height="160" fill="#fce4ec" stroke="#333" stroke-width="1.5" rx="4"/><text x="20" y="158" font-family="sans-serif" font-size="13" fill="#c62828" text-anchor="start" font-weight="bold">Bad partition column:</text><text x="20" y="176" font-family="sans-serif" font-size="12" fill="#b71c1c" text-anchor="start">[✗] High cardinality (user_id with millions) → too many small files</text><text x="20" y="193" font-family="sans-serif" font-size="12" fill="#b71c1c" text-anchor="start">[✗] Never filtered on → no pruning benefit, extra overhead</text><text x="20" y="210" font-family="sans-serif" font-size="12" fill="#b71c1c" text-anchor="start">[✗] Very skewed (99% in one value) → one giant partition, rest tiny</text><text x="20" y="227" font-family="sans-serif" font-size="12" fill="#b71c1c" text-anchor="start">[✗] Too few values (boolean: true/false) → only 2 partitions, minimal benefit</text><text x="10" y="320" font-family="sans-serif" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Partition count guidelines:</text><rect x="10" y="334" width="660" height="22" fill="#bbdefb" stroke="#333" stroke-width="1.5" rx="4"/><text x="20" y="349" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="bold">Total data size</text><text x="245" y="349" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start" font-weight="bold">Target partitions</text><line x1="235" y1="334" x2="235" y2="444" stroke="#333" stroke-width="1"/><rect x="10" y="356" width="660" height="22" fill="#e3f2fd" stroke="#333" stroke-width="1.5" rx="4"/><text x="20" y="371" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start">&lt; 1 GB</text><text x="245" y="371" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start">No partitioning needed</text><rect x="10" y="378" width="660" height="22" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="4"/><text x="20" y="393" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start">1 GB – 100 GB</text><text x="245" y="393" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start">10 – 100 partitions</text><rect x="10" y="400" width="660" height="22" fill="#e3f2fd" stroke="#333" stroke-width="1.5" rx="4"/><text x="20" y="415" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start">100 GB – 10 TB</text><text x="245" y="415" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start">100 – 10,000 partitions</text><rect x="10" y="422" width="660" height="22" fill="#f5f5f5" stroke="#333" stroke-width="1.5" rx="4"/><text x="20" y="437" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start">> 10 TB</text><text x="245" y="437" font-family="sans-serif" font-size="12" fill="#222" text-anchor="start">1,000 – 100,000 partitions</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" markerWidth="15.0588" markerHeight="12.5217" refX="11.2941" refY="4.6957" orient="auto">
      <path d="M 0 0 L 0 9.3913 L 15.0588 4.6957 z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.8235" y="15.6522" width="1242.3529" height="187.8261" fill="#e8f5e9" stroke="#333" stroke-width="2.3478" rx="6.2609" />
  <text x="37.6471" y="43.8261" font-family="sans-serif" font-size="20.3478" fill="#2e7d32" text-anchor="start" font-weight="bold">Good partition column:</text>
  <text x="37.6471" y="72" font-family="sans-serif" font-size="18.7826" fill="#1b5e20" text-anchor="start">[✓] Used in WHERE clauses frequently</text>
  <text x="37.6471" y="98.6087" font-family="sans-serif" font-size="18.7826" fill="#1b5e20" text-anchor="start">[✓] Low-to-medium cardinality (10 – 10,000)</text>
  <text x="37.6471" y="125.2174" font-family="sans-serif" font-size="18.7826" fill="#1b5e20" text-anchor="start">[✓] Even data distribution</text>
  <text x="37.6471" y="151.8261" font-family="sans-serif" font-size="18.7826" fill="#1b5e20" text-anchor="start">[✓] Each partition &gt; 128 MB</text>
  <rect x="18.8235" y="219.1304" width="1242.3529" height="250.4348" fill="#fce4ec" stroke="#333" stroke-width="2.3478" rx="6.2609" />
  <text x="37.6471" y="247.3043" font-family="sans-serif" font-size="20.3478" fill="#c62828" text-anchor="start" font-weight="bold">Bad partition column:</text>
  <text x="37.6471" y="275.4783" font-family="sans-serif" font-size="18.7826" fill="#b71c1c" text-anchor="start">[✗] High cardinality (user_id with millions) → too many small files</text>
  <text x="37.6471" y="302.087" font-family="sans-serif" font-size="18.7826" fill="#b71c1c" text-anchor="start">[✗] Never filtered on → no pruning benefit, extra overhead</text>
  <text x="37.6471" y="328.6957" font-family="sans-serif" font-size="18.7826" fill="#b71c1c" text-anchor="start">[✗] Very skewed (99% in one value) → one giant partition, rest tiny</text>
  <text x="37.6471" y="355.3043" font-family="sans-serif" font-size="18.7826" fill="#b71c1c" text-anchor="start">[✗] Too few values (boolean: true/false) → only 2 partitions, minimal benefit</text>
  <text x="18.8235" y="500.8696" font-family="sans-serif" font-size="20.3478" fill="#222" text-anchor="start" font-weight="bold">Partition count guidelines:</text>
  <rect x="18.8235" y="522.7826" width="1242.3529" height="34.4348" fill="#bbdefb" stroke="#333" stroke-width="2.3478" rx="6.2609" />
  <text x="37.6471" y="546.2609" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start" font-weight="bold">Total data size</text>
  <text x="461.1765" y="546.2609" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start" font-weight="bold">Target partitions</text>
  <line x1="442.3529" y1="522.7826" x2="442.3529" y2="694.9565" stroke="#333" stroke-width="1.5652" />
  <rect x="18.8235" y="557.2174" width="1242.3529" height="34.4348" fill="#e3f2fd" stroke="#333" stroke-width="2.3478" rx="6.2609" />
  <text x="37.6471" y="580.6957" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start">&lt; 1 GB</text>
  <text x="461.1765" y="580.6957" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start">No partitioning needed</text>
  <rect x="18.8235" y="591.6522" width="1242.3529" height="34.4348" fill="#f5f5f5" stroke="#333" stroke-width="2.3478" rx="6.2609" />
  <text x="37.6471" y="615.1304" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start">1 GB – 100 GB</text>
  <text x="461.1765" y="615.1304" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start">10 – 100 partitions</text>
  <rect x="18.8235" y="626.087" width="1242.3529" height="34.4348" fill="#e3f2fd" stroke="#333" stroke-width="2.3478" rx="6.2609" />
  <text x="37.6471" y="649.5652" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start">100 GB – 10 TB</text>
  <text x="461.1765" y="649.5652" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start">100 – 10,000 partitions</text>
  <rect x="18.8235" y="660.5217" width="1242.3529" height="34.4348" fill="#f5f5f5" stroke="#333" stroke-width="2.3478" rx="6.2609" />
  <text x="37.6471" y="684" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start">&gt; 10 TB</text>
  <text x="461.1765" y="684" font-family="sans-serif" font-size="18.7826" fill="#222" text-anchor="start">1,000 – 100,000 partitions</text>
</svg>
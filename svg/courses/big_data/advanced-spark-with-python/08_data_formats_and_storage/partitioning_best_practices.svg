<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 9.3913 L 15.0588 4.6957 z" fill="#555" />
    </marker>
  </defs>
  <rect x="17.335" y="14.4144" width="1144.1088" height="172.973" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="34.67" y="40.3604" font-family="sans-serif" font-size="18.7387" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">Good partition column:</text>
  <text x="34.67" y="66.3063" font-family="sans-serif" font-size="17.2973" fill="var(--ok-accent)" text-anchor="start">[✓] Used in WHERE clauses frequently</text>
  <text x="34.67" y="90.8108" font-family="sans-serif" font-size="17.2973" fill="var(--ok-accent)" text-anchor="start">[✓] Low-to-medium cardinality (10 – 10,000)</text>
  <text x="34.67" y="115.3153" font-family="sans-serif" font-size="17.2973" fill="var(--ok-accent)" text-anchor="start">[✓] Even data distribution</text>
  <text x="34.67" y="139.8198" font-family="sans-serif" font-size="17.2973" fill="var(--ok-accent)" text-anchor="start">[✓] Each partition &gt; 128 MB</text>
  <rect x="17.335" y="201.8018" width="1144.1088" height="230.6307" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="34.67" y="227.7477" font-family="sans-serif" font-size="18.7387" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">Bad partition column:</text>
  <text x="34.67" y="253.6937" font-family="sans-serif" font-size="17.2973" fill="var(--danger-accent)" text-anchor="start">[✗] High cardinality (user_id with millions) → too many small files</text>
  <text x="34.67" y="278.1982" font-family="sans-serif" font-size="17.2973" fill="var(--danger-accent)" text-anchor="start">[✗] Never filtered on → no pruning benefit, extra overhead</text>
  <text x="34.67" y="302.7028" font-family="sans-serif" font-size="17.2973" fill="var(--danger-accent)" text-anchor="start">[✗] Very skewed (99% in one value) → one giant partition, rest tiny</text>
  <text x="34.67" y="327.2072" font-family="sans-serif" font-size="17.2973" fill="var(--danger-accent)" text-anchor="start">[✗] Too few values (boolean: true/false) → only 2 partitions, minimal benefit</text>
  <text x="17.335" y="461.2613" font-family="sans-serif" font-size="18.7387" fill="var(--text)" text-anchor="start" font-weight="bold">Partition count guidelines:</text>
  <rect x="17.335" y="481.4414" width="1144.1088" height="31.7117" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="34.67" y="503.0631" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start" font-weight="bold">Total data size</text>
  <text x="424.7071" y="503.0631" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start" font-weight="bold">Target partitions</text>
  <line x1="407.3721" y1="481.4414" x2="407.3721" y2="640" stroke="var(--text)" stroke-width="1.4414" />
  <rect x="17.335" y="513.1532" width="1144.1088" height="31.7117" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="34.67" y="534.7748" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start">&lt; 1 GB</text>
  <text x="424.7071" y="534.7748" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start">No partitioning needed</text>
  <rect x="17.335" y="544.8649" width="1144.1088" height="31.7117" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="34.67" y="566.4865" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start">1 GB – 100 GB</text>
  <text x="424.7071" y="566.4865" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start">10 – 100 partitions</text>
  <rect x="17.335" y="576.5766" width="1144.1088" height="31.7117" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="34.67" y="598.1982" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start">100 GB – 10 TB</text>
  <text x="424.7071" y="598.1982" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start">100 – 10,000 partitions</text>
  <rect x="17.335" y="608.2883" width="1144.1088" height="31.7117" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="34.67" y="629.9099" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start">&gt; 10 TB</text>
  <text x="424.7071" y="629.9099" font-family="sans-serif" font-size="17.2973" fill="var(--text)" text-anchor="start">1,000 – 100,000 partitions</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="12.4878" markerHeight="16.9412" refX="9.3659" refY="6.3529" orient="auto">
      <ns0:path d="M 0 0 L 0 12.7059 L 12.4878 6.3529 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="14.2958" y="19.394" width="1143.6643" height="290.9091" fill="#e3f2fd" stroke="#333" stroke-width="2.1444" rx="5.7183" />
  <ns0:text x="28.5916" y="54.303" font-family="sans-serif" font-size="20.0142" fill="#1565c0" text-anchor="start" font-weight="bold">Partitioning</ns0:text>
  <ns0:text x="28.5916" y="93.091" font-family="sans-serif" font-size="17.155" fill="#333" text-anchor="start">Physically separates data into folders</ns0:text>
  <ns0:text x="28.5916" y="131.8788" font-family="sans-serif" font-size="17.155" fill="#333" text-anchor="start">/table/date=2024-01-01/   /table/date=2024-01-02/</ns0:text>
  <ns0:text x="28.5916" y="178.4242" font-family="sans-serif" font-size="17.155" fill="#333" text-anchor="start">Pros: partition pruning, human-readable layout on disk</ns0:text>
  <ns0:text x="28.5916" y="224.9697" font-family="sans-serif" font-size="17.155" fill="#333" text-anchor="start">Cons: small files problem, limited to low-cardinality columns</ns0:text>
  <ns0:rect x="14.2958" y="339.3939" width="1143.6643" height="300.6061" fill="#e8f5e9" stroke="#333" stroke-width="2.1444" rx="5.7183" />
  <ns0:text x="28.5916" y="374.3031" font-family="sans-serif" font-size="20.0142" fill="#2e7d32" text-anchor="start" font-weight="bold">Bucketing</ns0:text>
  <ns0:text x="28.5916" y="413.0909" font-family="sans-serif" font-size="17.155" fill="#333" text-anchor="start">Distributes data into fixed-size buckets based on hash of column value</ns0:text>
  <ns0:text x="28.5916" y="459.6364" font-family="sans-serif" font-size="17.155" fill="#333" text-anchor="start">/table/part-00000 (bucket 0)   /table/part-00001 (bucket 1)</ns0:text>
  <ns0:text x="28.5916" y="506.1819" font-family="sans-serif" font-size="17.155" fill="#333" text-anchor="start">/table/part-00002 (bucket 2)   ...   /table/part-00031 (bucket 31)</ns0:text>
  <ns0:text x="28.5916" y="552.7273" font-family="sans-serif" font-size="17.155" fill="#333" text-anchor="start">Pros: eliminates shuffle in joins, works with high cardinality columns</ns0:text>
  <ns0:text x="28.5916" y="599.2727" font-family="sans-serif" font-size="17.155" fill="#333" text-anchor="start">Cons: fixed bucket count, write overhead</ns0:text>
</ns0:svg>
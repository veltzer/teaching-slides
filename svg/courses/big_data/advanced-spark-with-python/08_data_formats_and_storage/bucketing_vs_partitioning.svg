<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12.7059 L 12.4878 6.3529 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="271.875" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="55" y="72.6249" font-family="sans-serif" font-size="19.8192" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Partitioning</text>
  <text x="55" y="108.875" font-family="sans-serif" font-size="16.9878" fill="var(--text)" text-anchor="start">Physically separates data into folders</text>
  <text x="55" y="145.125" font-family="sans-serif" font-size="16.9878" fill="var(--text)" text-anchor="start">/table/date=2024-01-01/   /table/date=2024-01-02/</text>
  <text x="55" y="188.6249" font-family="sans-serif" font-size="16.9878" fill="var(--text)" text-anchor="start">Pros: partition pruning, human-readable layout on disk</text>
  <text x="55" y="232.125" font-family="sans-serif" font-size="16.9878" fill="var(--text)" text-anchor="start">Cons: small files problem, limited to low-cardinality columns</text>
  <rect x="40" y="339.0624" width="1200" height="280.9376" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="55" y="371.6875" font-family="sans-serif" font-size="19.8192" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">Bucketing</text>
  <text x="55" y="407.9375" font-family="sans-serif" font-size="16.9878" fill="var(--text)" text-anchor="start">Distributes data into fixed-size buckets based on hash of column value</text>
  <text x="55" y="451.4375" font-family="sans-serif" font-size="16.9878" fill="var(--text)" text-anchor="start">/table/part-00000 (bucket 0)   /table/part-00001 (bucket 1)</text>
  <text x="55" y="494.9376" font-family="sans-serif" font-size="16.9878" fill="var(--text)" text-anchor="start">/table/part-00002 (bucket 2)   ...   /table/part-00031 (bucket 31)</text>
  <text x="55" y="538.4375" font-family="sans-serif" font-size="16.9878" fill="var(--text)" text-anchor="start">Pros: eliminates shuffle in joins, works with high cardinality columns</text>
  <text x="55" y="581.9375" font-family="sans-serif" font-size="16.9878" fill="var(--text)" text-anchor="start">Cons: fixed bucket count, write overhead</text>
</svg>
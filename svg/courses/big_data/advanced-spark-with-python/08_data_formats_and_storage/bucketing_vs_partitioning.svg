<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340"><defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
  </marker>
</defs><rect x="10" y="10" width="800" height="150" fill="#e3f2fd" stroke="#333" stroke-width="1.5" rx="4"/><text x="20" y="28" font-family="sans-serif" font-size="14" fill="#1565c0" text-anchor="start" font-weight="bold">Partitioning</text><text x="20" y="48" font-family="sans-serif" font-size="12" fill="#333" text-anchor="start">Physically separates data into folders</text><text x="20" y="68" font-family="sans-serif" font-size="12" fill="#333" text-anchor="start">/table/date=2024-01-01/   /table/date=2024-01-02/</text><text x="20" y="92" font-family="sans-serif" font-size="12" fill="#333" text-anchor="start">Pros: partition pruning, human-readable layout on disk</text><text x="20" y="116" font-family="sans-serif" font-size="12" fill="#333" text-anchor="start">Cons: small files problem, limited to low-cardinality columns</text><rect x="10" y="175" width="800" height="155" fill="#e8f5e9" stroke="#333" stroke-width="1.5" rx="4"/><text x="20" y="193" font-family="sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">Bucketing</text><text x="20" y="213" font-family="sans-serif" font-size="12" fill="#333" text-anchor="start">Distributes data into fixed-size buckets based on hash of column value</text><text x="20" y="237" font-family="sans-serif" font-size="12" fill="#333" text-anchor="start">/table/part-00000 (bucket 0)   /table/part-00001 (bucket 1)</text><text x="20" y="261" font-family="sans-serif" font-size="12" fill="#333" text-anchor="start">/table/part-00002 (bucket 2)   ...   /table/part-00031 (bucket 31)</text><text x="20" y="285" font-family="sans-serif" font-size="12" fill="#333" text-anchor="start">Pros: eliminates shuffle in joins, works with high cardinality columns</text><text x="20" y="309" font-family="sans-serif" font-size="12" fill="#333" text-anchor="start">Cons: fixed bucket count, write overhead</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" markerWidth="12.4878" markerHeight="16.9412" refX="9.3659" refY="6.3529" orient="auto">
      <path d="M 0 0 L 0 12.7059 L 12.4878 6.3529 z" fill="#555" />
    </marker>
  </defs>
  <rect x="15.6098" y="21.1765" width="1248.7805" height="317.6471" fill="#e3f2fd" stroke="#333" stroke-width="2.3415" rx="6.2439" />
  <text x="31.2195" y="59.2941" font-family="sans-serif" font-size="21.8537" fill="#1565c0" text-anchor="start" font-weight="bold">Partitioning</text>
  <text x="31.2195" y="101.6471" font-family="sans-serif" font-size="18.7317" fill="#333" text-anchor="start">Physically separates data into folders</text>
  <text x="31.2195" y="144" font-family="sans-serif" font-size="18.7317" fill="#333" text-anchor="start">/table/date=2024-01-01/   /table/date=2024-01-02/</text>
  <text x="31.2195" y="194.8235" font-family="sans-serif" font-size="18.7317" fill="#333" text-anchor="start">Pros: partition pruning, human-readable layout on disk</text>
  <text x="31.2195" y="245.6471" font-family="sans-serif" font-size="18.7317" fill="#333" text-anchor="start">Cons: small files problem, limited to low-cardinality columns</text>
  <rect x="15.6098" y="370.5882" width="1248.7805" height="328.2353" fill="#e8f5e9" stroke="#333" stroke-width="2.3415" rx="6.2439" />
  <text x="31.2195" y="408.7059" font-family="sans-serif" font-size="21.8537" fill="#2e7d32" text-anchor="start" font-weight="bold">Bucketing</text>
  <text x="31.2195" y="451.0588" font-family="sans-serif" font-size="18.7317" fill="#333" text-anchor="start">Distributes data into fixed-size buckets based on hash of column value</text>
  <text x="31.2195" y="501.8824" font-family="sans-serif" font-size="18.7317" fill="#333" text-anchor="start">/table/part-00000 (bucket 0)   /table/part-00001 (bucket 1)</text>
  <text x="31.2195" y="552.7059" font-family="sans-serif" font-size="18.7317" fill="#333" text-anchor="start">/table/part-00002 (bucket 2)   ...   /table/part-00031 (bucket 31)</text>
  <text x="31.2195" y="603.5294" font-family="sans-serif" font-size="18.7317" fill="#333" text-anchor="start">Pros: eliminates shuffle in joins, works with high cardinality columns</text>
  <text x="31.2195" y="654.3529" font-family="sans-serif" font-size="18.7317" fill="#333" text-anchor="start">Cons: fixed bucket count, write overhead</text>
</svg>
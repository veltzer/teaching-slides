<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12 L 12.4878 6 z" fill="#555" />
    </marker>
  </defs>
  <rect x="14.2718" y="18.2857" width="1141.7422" height="621.7143" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="28.5435" y="58.5143" font-family="sans-serif" font-size="19.9805" fill="var(--text)" text-anchor="start" font-weight="bold">ORC File Structure</text>
  <rect x="42.8154" y="91.4286" width="1084.6551" height="210.2857" fill="var(--bg)" stroke="var(--text)" stroke-width="2.1408" rx="6" />
  <text x="57.0871" y="124.3429" font-family="sans-serif" font-size="17.1261" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Stripe 0</text>
  <rect x="57.0871" y="142.6286" width="171.2613" height="36.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="68.5045" y="170.0571" font-family="sans-serif" font-size="15.6989" fill="var(--text)" text-anchor="start">Index</text>
  <text x="249.7561" y="170.0571" font-family="sans-serif" font-size="15.6989" fill="var(--text-muted)" text-anchor="start">← min/max per 10K rows</text>
  <rect x="57.0871" y="190.1714" width="171.2613" height="36.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="68.5045" y="217.6" font-family="sans-serif" font-size="15.6989" fill="var(--text)" text-anchor="start">Data</text>
  <text x="249.7561" y="217.6" font-family="sans-serif" font-size="15.6989" fill="var(--text-muted)" text-anchor="start">← column encoded data</text>
  <rect x="57.0871" y="237.7143" width="171.2613" height="36.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="68.5045" y="265.1429" font-family="sans-serif" font-size="15.6989" fill="var(--text)" text-anchor="start">Footer</text>
  <text x="249.7561" y="265.1429" font-family="sans-serif" font-size="15.6989" fill="var(--text-muted)" text-anchor="start">← column statistics</text>
  <rect x="42.8154" y="338.2857" width="1084.6551" height="210.2857" fill="var(--bg)" stroke="var(--text)" stroke-width="2.1408" rx="6" />
  <text x="57.0871" y="371.2" font-family="sans-serif" font-size="17.1261" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Stripe 1</text>
  <rect x="57.0871" y="389.4857" width="171.2613" height="36.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="68.5045" y="416.9143" font-family="sans-serif" font-size="15.6989" fill="var(--text)" text-anchor="start">Index</text>
  <text x="249.7561" y="416.9143" font-family="sans-serif" font-size="15.6989" fill="var(--text-muted)" text-anchor="start" />
  <rect x="57.0871" y="437.0286" width="171.2613" height="36.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="68.5045" y="464.4571" font-family="sans-serif" font-size="15.6989" fill="var(--text)" text-anchor="start">Data</text>
  <text x="249.7561" y="464.4571" font-family="sans-serif" font-size="15.6989" fill="var(--text-muted)" text-anchor="start" />
  <rect x="57.0871" y="484.5714" width="171.2613" height="36.5714" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="68.5045" y="512" font-family="sans-serif" font-size="15.6989" fill="var(--text)" text-anchor="start">Footer</text>
  <text x="249.7561" y="512" font-family="sans-serif" font-size="15.6989" fill="var(--text-muted)" text-anchor="start" />
  <rect x="42.8154" y="576" width="1084.6551" height="43.8857" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="57.0871" y="607.0857" font-family="sans-serif" font-size="15.6989" fill="var(--text)" text-anchor="start">File Footer (column types, statistics)   |   Postscript (compression, version)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40" y="40" font-size="21.222744225085" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">ORC File Structure</text>
  <rect x="55.584518131211" y="74.006533056053" width="1184.41548186879" height="217.263868900465" fill="var(--bg)" stroke="var(--text)" stroke-width="2.1408" rx="6.436075439252"/>
  <text x="71.168932366326" y="108.013066112106" font-size="18.190923621501" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Stripe 0</text>
  <rect x="71.168932366326" y="126.905547560186" width="187.012970821388" height="37.78496289616" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.436075439252" filter="url(#shadow)"/>
  <text x="83.636359858324" y="155.244269732306" font-size="16.674906051785" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Index</text>
  <text x="281.558524540388" y="155.244269732306" font-size="16.674906051785" fill="var(--text-muted)" text-anchor="start" font-family="Arial, sans-serif">← min/max per 10K rows</text>
  <rect x="71.168932366326" y="176.02602147503" width="187.012970821388" height="37.78496289616" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.436075439252" filter="url(#shadow)"/>
  <text x="83.636359858324" y="204.364854396332" font-size="16.674906051785" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Data</text>
  <text x="281.558524540388" y="204.364854396332" font-size="16.674906051785" fill="var(--text-muted)" text-anchor="start" font-family="Arial, sans-serif">← column encoded data</text>
  <rect x="71.168932366326" y="225.146606139056" width="187.012970821388" height="37.78496289616" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.436075439252" filter="url(#shadow)"/>
  <text x="83.636359858324" y="253.485439060358" font-size="16.674906051785" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Footer</text>
  <text x="281.558524540388" y="253.485439060358" font-size="16.674906051785" fill="var(--text-muted)" text-anchor="start" font-family="Arial, sans-serif">← column statistics</text>
  <rect x="55.584518131211" y="329.055364852678" width="1184.41548186879" height="217.263868900465" fill="var(--bg)" stroke="var(--text)" stroke-width="2.1408" rx="6.436075439252"/>
  <text x="71.168932366326" y="363.061897908731" font-size="18.190923621501" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Stripe 1</text>
  <rect x="71.168932366326" y="381.954379356811" width="187.012970821388" height="37.78496289616" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.436075439252" filter="url(#shadow)"/>
  <text x="83.636359858324" y="410.293212278113" font-size="16.674906051785" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Index</text>
  <text x="281.558524540388" y="410.293212278113" font-size="16.674906051785" fill="var(--text-muted)" text-anchor="start" font-family="Arial, sans-serif"/>
  <rect x="71.168932366326" y="431.074964020837" width="187.012970821388" height="37.78496289616" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.436075439252" filter="url(#shadow)"/>
  <text x="83.636359858324" y="459.413686192957" font-size="16.674906051785" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Data</text>
  <text x="281.558524540388" y="459.413686192957" font-size="16.674906051785" fill="var(--text-muted)" text-anchor="start" font-family="Arial, sans-serif"/>
  <rect x="71.168932366326" y="480.195437935681" width="187.012970821388" height="37.78496289616" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.436075439252" filter="url(#shadow)"/>
  <text x="83.636359858324" y="508.534160107801" font-size="16.674906051785" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Footer</text>
  <text x="281.558524540388" y="508.534160107801" font-size="16.674906051785" fill="var(--text-muted)" text-anchor="start" font-family="Arial, sans-serif"/>
  <rect x="55.584518131211" y="574.657955925263" width="1184.41548186879" height="45.342044074737" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.436075439252" filter="url(#shadow)"/>
  <text x="71.168932366326" y="606.775218686671" font-size="16.674906051785" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">File Footer (column types, statistics)   |   Postscript (compression, version)</text>
</svg>

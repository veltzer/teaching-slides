<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="15.5152" markerHeight="17.4545" refX="11.6364" refY="6.5455" orient="auto">
      <ns0:path d="M 0 0 L 0 13.0909 L 15.5152 6.5455 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="17.2914" y="19.4529" width="1106.6531" height="603.0395" fill="#e8f5e9" stroke="#333" stroke-width="2.5937" rx="6.9166" />
  <ns0:text x="34.5829" y="62.2493" font-family="sans-serif" font-size="22.4789" fill="#222" text-anchor="start" font-weight="bold">Delta Lake adds ACID transactions on top of Parquet</ns0:text>
  <ns0:text x="34.5829" y="101.155" font-family="sans-serif" font-size="22.4789" fill="#2e7d32" text-anchor="start" font-weight="bold">Delta Table Directory Structure</ns0:text>
  <ns0:text x="48.416" y="140.0608" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">/data/delta_table/</ns0:text>
  <ns0:text x="48.416" y="173.1307" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">├── _delta_log/</ns0:text>
  <ns0:text x="48.416" y="206.2006" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">│   ├── 00000000000000000000.json</ns0:text>
  <ns0:text x="48.416" y="239.2705" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">│   ├── 00000000000000000001.json</ns0:text>
  <ns0:text x="48.416" y="272.3404" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">│   ├── 00000000000000000002.json</ns0:text>
  <ns0:text x="48.416" y="305.4104" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">│   ├── ...</ns0:text>
  <ns0:text x="48.416" y="338.4803" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">│   └── 00000000000000000010.checkpoint.parquet</ns0:text>
  <ns0:text x="48.416" y="371.5502" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">├── part-00000-...snappy.parquet</ns0:text>
  <ns0:text x="48.416" y="404.6201" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">├── part-00001-...snappy.parquet</ns0:text>
  <ns0:text x="48.416" y="437.69" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">├── part-00002-...snappy.parquet</ns0:text>
  <ns0:text x="48.416" y="470.7599" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">└── part-00003-...snappy.parquet</ns0:text>
  <ns0:rect x="34.5829" y="515.5015" width="1072.0702" height="124.4985" fill="#c8e6c9" stroke="#333" stroke-width="2.5937" rx="6.9166" />
  <ns0:text x="48.416" y="546.6261" font-family="sans-serif" font-size="20.7497" fill="#222" text-anchor="start" font-weight="bold">Transaction Log (_delta_log):</ns0:text>
  <ns0:text x="48.416" y="577.7507" font-family="sans-serif" font-size="19.0206" fill="#333" text-anchor="start">• Each JSON file = one atomic transaction   • Contains: add/remove file actions</ns0:text>
  <ns0:text x="48.416" y="608.8754" font-family="sans-serif" font-size="19.0206" fill="#333" text-anchor="start">• Checkpoints every 10 transactions         • Enables time travel and ACID</ns0:text>
</ns0:svg>
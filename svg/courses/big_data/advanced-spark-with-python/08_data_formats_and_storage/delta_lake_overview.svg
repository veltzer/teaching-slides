  <rect x="19.3939" y="21.8182" width="1241.2121" height="676.3636" fill="#e8f5e9" stroke="#333" stroke-width="2.9091" rx="7.7576" />
  <text x="38.7879" y="69.8182" font-family="sans-serif" font-size="25.2121" fill="#222" text-anchor="start" font-weight="bold">Delta Lake adds ACID transactions on top of Parquet</text>
  <text x="38.7879" y="113.4545" font-family="sans-serif" font-size="25.2121" fill="#2e7d32" text-anchor="start" font-weight="bold">Delta Table Directory Structure</text>
  <text x="54.303" y="157.0909" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">/data/delta_table/</text>
  <text x="54.303" y="194.1818" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">├── _delta_log/</text>
  <text x="54.303" y="231.2727" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">│   ├── 00000000000000000000.json</text>
  <text x="54.303" y="268.3636" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">│   ├── 00000000000000000001.json</text>
  <text x="54.303" y="305.4545" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">│   ├── 00000000000000000002.json</text>
  <text x="54.303" y="342.5455" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">│   ├── ...</text>
  <text x="54.303" y="379.6364" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">│   └── 00000000000000000010.checkpoint.parquet</text>
  <text x="54.303" y="416.7273" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">├── part-00000-...snappy.parquet</text>
  <text x="54.303" y="453.8182" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">├── part-00001-...snappy.parquet</text>
  <text x="54.303" y="490.9091" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">├── part-00002-...snappy.parquet</text>
  <text x="54.303" y="528" font-family="sans-serif" font-size="23.2727" fill="#333" text-anchor="start">└── part-00003-...snappy.parquet</text>
  <rect x="38.7879" y="578.1818" width="1202.4242" height="139.6364" fill="#c8e6c9" stroke="#333" stroke-width="2.9091" rx="7.7576" />
  <text x="54.303" y="613.0909" font-family="sans-serif" font-size="23.2727" fill="#222" text-anchor="start" font-weight="bold">Transaction Log (_delta_log):</text>
  <text x="54.303" y="648" font-family="sans-serif" font-size="21.3333" fill="#333" text-anchor="start">• Each JSON file = one atomic transaction   • Contains: add/remove file actions</text>
  <text x="54.303" y="682.9091" font-family="sans-serif" font-size="21.3333" fill="#333" text-anchor="start">• Checkpoints every 10 transactions         • Enables time travel and ACID</text>
</svg>
  <ns0:text x="48.416" y="546.6261" font-family="sans-serif" font-size="20.7497" fill="#222" text-anchor="start" font-weight="bold">Transaction Log (_delta_log):</ns0:text>
  <ns0:text x="48.416" y="577.7507" font-family="sans-serif" font-size="19.0206" fill="#333" text-anchor="start">• Each JSON file = one atomic transaction   • Contains: add/remove file actions</ns0:text>
  <ns0:text x="48.416" y="608.8754" font-family="sans-serif" font-size="19.0206" fill="#333" text-anchor="start">• Checkpoints every 10 transactions         • Enables time travel and ACID</ns0:text>

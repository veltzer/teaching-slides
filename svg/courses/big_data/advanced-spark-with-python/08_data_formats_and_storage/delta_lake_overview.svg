  <ns0:text x="34.5829" y="62.2493" font-family="sans-serif" font-size="22.4789" fill="#222" text-anchor="start" font-weight="bold">Delta Lake adds ACID transactions on top of Parquet</ns0:text>
  <ns0:text x="34.5829" y="101.155" font-family="sans-serif" font-size="22.4789" fill="#2e7d32" text-anchor="start" font-weight="bold">Delta Table Directory Structure</ns0:text>
  <ns0:text x="48.416" y="140.0608" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">/data/delta_table/</ns0:text>
  <ns0:text x="48.416" y="173.1307" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">├── _delta_log/</ns0:text>
  <ns0:text x="48.416" y="206.2006" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">│   ├── 00000000000000000000.json</ns0:text>

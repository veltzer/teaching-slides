  <ns0:text x="48.416" y="338.4803" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">│   └── 00000000000000000010.checkpoint.parquet</ns0:text>
  <ns0:text x="48.416" y="371.5502" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">├── part-00000-...snappy.parquet</ns0:text>
  <ns0:text x="48.416" y="404.6201" font-family="sans-serif" font-size="20.7497" fill="#333" text-anchor="start">├── part-00001-...snappy.parquet</ns0:text>

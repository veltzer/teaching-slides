<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="1200" height="563.6364" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="58.75" y="80" font-size="22.6301" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Delta Lake adds ACID transactions on top of Parquet</text>
  <text x="58.75" y="116.3636" font-size="22.6301" fill="var(--ok-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Delta Table Directory Structure</text>
  <text x="73.75" y="152.7273" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/delta_table/</text>
  <text x="73.75" y="183.6364" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── _delta_log/</text>
  <text x="73.75" y="214.5454" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">│   ├── 00000000000000000000.json</text>
  <text x="73.75" y="245.4545" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">│   ├── 00000000000000000001.json</text>
  <text x="73.75" y="276.3636" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">│   ├── 00000000000000000002.json</text>
  <text x="73.75" y="307.2728" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">│   ├── ...</text>
  <text x="73.75" y="338.1819" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">│   └── 00000000000000000010.checkpoint.parquet</text>
  <text x="73.75" y="369.0909" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── part-00000-...snappy.parquet</text>
  <text x="73.75" y="400" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── part-00001-...snappy.parquet</text>
  <text x="73.75" y="430.9091" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── part-00002-...snappy.parquet</text>
  <text x="73.75" y="461.8182" font-size="20.8893" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── part-00003-...snappy.parquet</text>
  <rect x="58.75" y="503.6363" width="1162.5" height="116.3637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="73.75" y="532.7272" font-size="20.8893" fill="var(--text)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Transaction Log (_delta_log):</text>
  <text x="73.75" y="561.8181" font-size="19.1485" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Each JSON file = one atomic transaction   • Contains: add/remove file actions</text>
  <text x="73.75" y="590.9091" font-size="19.1485" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Checkpoints every 10 transactions         • Enables time travel and ACID</text>
</svg>
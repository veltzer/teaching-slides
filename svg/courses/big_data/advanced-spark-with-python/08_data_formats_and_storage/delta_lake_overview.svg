<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 13.0909 L 15.5152 6.5455 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="563.6364" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="58.75" y="80" font-family="sans-serif" font-size="22.6301" fill="var(--text)" text-anchor="start" font-weight="bold">Delta Lake adds ACID transactions on top of Parquet</text>
  <text x="58.75" y="116.3636" font-family="sans-serif" font-size="22.6301" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">Delta Table Directory Structure</text>
  <text x="73.75" y="152.7273" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">/data/delta_table/</text>
  <text x="73.75" y="183.6364" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">├── _delta_log/</text>
  <text x="73.75" y="214.5454" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">│   ├── 00000000000000000000.json</text>
  <text x="73.75" y="245.4545" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">│   ├── 00000000000000000001.json</text>
  <text x="73.75" y="276.3636" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">│   ├── 00000000000000000002.json</text>
  <text x="73.75" y="307.2728" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">│   ├── ...</text>
  <text x="73.75" y="338.1819" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">│   └── 00000000000000000010.checkpoint.parquet</text>
  <text x="73.75" y="369.0909" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">├── part-00000-...snappy.parquet</text>
  <text x="73.75" y="400" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">├── part-00001-...snappy.parquet</text>
  <text x="73.75" y="430.9091" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">├── part-00002-...snappy.parquet</text>
  <text x="73.75" y="461.8182" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start">└── part-00003-...snappy.parquet</text>
  <rect x="58.75" y="503.6363" width="1162.5" height="116.3637" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="73.75" y="532.7272" font-family="sans-serif" font-size="20.8893" fill="var(--text)" text-anchor="start" font-weight="bold">Transaction Log (_delta_log):</text>
  <text x="73.75" y="561.8181" font-family="sans-serif" font-size="19.1485" fill="var(--text)" text-anchor="start">• Each JSON file = one atomic transaction   • Contains: add/remove file actions</text>
  <text x="73.75" y="590.9091" font-family="sans-serif" font-size="19.1485" fill="var(--text)" text-anchor="start">• Checkpoints every 10 transactions         • Enables time travel and ACID</text>
</svg>
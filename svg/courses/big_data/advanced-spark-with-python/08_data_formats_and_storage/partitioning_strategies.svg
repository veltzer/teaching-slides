<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 10.0465 L 15.5152 5.0233 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="171.9598" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="66.2311" font-family="sans-serif" font-size="20.2866" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">1. Range Partitioning (most common)</text>
  <text x="59.3548" y="86.6332" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">PARTITIONED BY (event_date)</text>
  <text x="59.3548" y="107.0351" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">/data/events/event_date=2024-01-01/</text>
  <text x="59.3548" y="127.4371" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">/data/events/event_date=2024-01-02/</text>
  <text x="59.3548" y="147.8392" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">/data/events/event_date=2024-01-03/</text>
  <text x="59.3548" y="168.2412" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">...</text>
  <text x="59.3548" y="188.6432" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">Best for: time-series, date-based queries</text>
  <rect x="40" y="251.3066" width="1200" height="151.5577" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="277.5376" font-family="sans-serif" font-size="20.2866" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">2. List Partitioning</text>
  <text x="59.3548" y="297.9397" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">PARTITIONED BY (region)</text>
  <text x="59.3548" y="318.3417" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">/data/events/region=us-east/</text>
  <text x="59.3548" y="338.7437" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">/data/events/region=us-west/</text>
  <text x="59.3548" y="359.1457" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">/data/events/region=eu-west/</text>
  <text x="59.3548" y="379.5477" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">Best for: categorical, low-cardinality</text>
  <rect x="40" y="448.0402" width="1200" height="171.9598" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="474.2713" font-family="sans-serif" font-size="20.2866" fill="var(--warn-accent)" text-anchor="start" font-weight="bold">3. Hash Partitioning</text>
  <text x="59.3548" y="494.6733" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">PARTITIONED BY (hash(user_id, 32))</text>
  <text x="59.3548" y="515.0754" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">/data/events/user_hash=0/</text>
  <text x="59.3548" y="535.4774" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">/data/events/user_hash=1/</text>
  <text x="59.3548" y="555.8794" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">...</text>
  <text x="59.3548" y="576.2813" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">/data/events/user_hash=31/</text>
  <text x="59.3548" y="596.6835" font-family="sans-serif" font-size="17.1656" fill="var(--text)" text-anchor="start">Best for: even distribution, join keys</text>
</svg>
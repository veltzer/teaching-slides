<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="171.9598" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="66.2311" font-size="20.2866" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">1. Range Partitioning (most common)</text>
  <text x="59.3548" y="86.6332" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">PARTITIONED BY (event_date)</text>
  <text x="59.3548" y="107.0351" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/event_date=2024-01-01/</text>
  <text x="59.3548" y="127.4371" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/event_date=2024-01-02/</text>
  <text x="59.3548" y="147.8392" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/event_date=2024-01-03/</text>
  <text x="59.3548" y="168.2412" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">...</text>
  <text x="59.3548" y="188.6432" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Best for: time-series, date-based queries</text>
  <rect x="40" y="251.3066" width="1200" height="151.5577" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="277.5376" font-size="20.2866" fill="var(--ok-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">2. List Partitioning</text>
  <text x="59.3548" y="297.9397" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">PARTITIONED BY (region)</text>
  <text x="59.3548" y="318.3417" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/region=us-east/</text>
  <text x="59.3548" y="338.7437" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/region=us-west/</text>
  <text x="59.3548" y="359.1457" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/region=eu-west/</text>
  <text x="59.3548" y="379.5477" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Best for: categorical, low-cardinality</text>
  <rect x="40" y="448.0402" width="1200" height="171.9598" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="59.3548" y="474.2713" font-size="20.2866" fill="var(--warn-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">3. Hash Partitioning</text>
  <text x="59.3548" y="494.6733" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">PARTITIONED BY (hash(user_id, 32))</text>
  <text x="59.3548" y="515.0754" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/user_hash=0/</text>
  <text x="59.3548" y="535.4774" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/user_hash=1/</text>
  <text x="59.3548" y="555.8794" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">...</text>
  <text x="59.3548" y="576.2813" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/user_hash=31/</text>
  <text x="59.3548" y="596.6835" font-size="17.1656" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Best for: even distribution, join keys</text>
</svg>

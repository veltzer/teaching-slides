<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="15.5152" markerHeight="13.3953" refX="11.6364" refY="5.0233" orient="auto">
      <ns0:path d="M 0 0 L 0 10.0465 L 15.5152 5.0233 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="36.3372" y="15.6863" width="1126.454" height="185.098" fill="#e3f2fd" stroke="#333" stroke-width="2.3529" rx="6.2745" />
  <ns0:text x="54.5058" y="43.9215" font-family="sans-serif" font-size="20.3921" fill="#1565c0" text-anchor="start" font-weight="bold">1. Range Partitioning (most common)</ns0:text>
  <ns0:text x="54.5058" y="65.8824" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">PARTITIONED BY (event_date)</ns0:text>
  <ns0:text x="54.5058" y="87.8431" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">/data/events/event_date=2024-01-01/</ns0:text>
  <ns0:text x="54.5058" y="109.8039" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">/data/events/event_date=2024-01-02/</ns0:text>
  <ns0:text x="54.5058" y="131.7647" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">/data/events/event_date=2024-01-03/</ns0:text>
  <ns0:text x="54.5058" y="153.7255" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">...</ns0:text>
  <ns0:text x="54.5058" y="175.6863" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">Best for: time-series, date-based queries</ns0:text>
  <ns0:rect x="36.3372" y="243.1373" width="1126.454" height="163.1372" fill="#e8f5e9" stroke="#333" stroke-width="2.3529" rx="6.2745" />
  <ns0:text x="54.5058" y="271.3725" font-family="sans-serif" font-size="20.3921" fill="#2e7d32" text-anchor="start" font-weight="bold">2. List Partitioning</ns0:text>
  <ns0:text x="54.5058" y="293.3333" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">PARTITIONED BY (region)</ns0:text>
  <ns0:text x="54.5058" y="315.2941" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">/data/events/region=us-east/</ns0:text>
  <ns0:text x="54.5058" y="337.2549" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">/data/events/region=us-west/</ns0:text>
  <ns0:text x="54.5058" y="359.2157" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">/data/events/region=eu-west/</ns0:text>
  <ns0:text x="54.5058" y="381.1764" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">Best for: categorical, low-cardinality</ns0:text>
  <ns0:rect x="36.3372" y="454.902" width="1126.454" height="185.098" fill="#fff3e0" stroke="#333" stroke-width="2.3529" rx="6.2745" />
  <ns0:text x="54.5058" y="483.1372" font-family="sans-serif" font-size="20.3921" fill="#e65100" text-anchor="start" font-weight="bold">3. Hash Partitioning</ns0:text>
  <ns0:text x="54.5058" y="505.098" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">PARTITIONED BY (hash(user_id, 32))</ns0:text>
  <ns0:text x="54.5058" y="527.0589" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">/data/events/user_hash=0/</ns0:text>
  <ns0:text x="54.5058" y="549.0196" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">/data/events/user_hash=1/</ns0:text>
  <ns0:text x="54.5058" y="570.9804" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">...</ns0:text>
  <ns0:text x="54.5058" y="592.9411" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">/data/events/user_hash=31/</ns0:text>
  <ns0:text x="54.5058" y="614.902" font-family="sans-serif" font-size="17.2549" fill="#333" text-anchor="start">Best for: even distribution, join keys</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" markerWidth="15.5152" markerHeight="13.3953" refX="11.6364" refY="5.0233" orient="auto">
      <path d="M 0 0 L 0 10.0465 L 15.5152 5.0233 z" fill="#555" />
    </marker>
  </defs>
  <rect x="38.7879" y="16.7442" width="1202.4242" height="197.5814" fill="#e3f2fd" stroke="#333" stroke-width="2.5116" rx="6.6977" />
  <text x="58.1818" y="46.8837" font-family="sans-serif" font-size="21.7674" fill="#1565c0" text-anchor="start" font-weight="bold">1. Range Partitioning (most common)</text>
  <text x="58.1818" y="70.3256" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">PARTITIONED BY (event_date)</text>
  <text x="58.1818" y="93.7674" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">/data/events/event_date=2024-01-01/</text>
  <text x="58.1818" y="117.2093" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">/data/events/event_date=2024-01-02/</text>
  <text x="58.1818" y="140.6512" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">/data/events/event_date=2024-01-03/</text>
  <text x="58.1818" y="164.093" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">...</text>
  <text x="58.1818" y="187.5349" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">Best for: time-series, date-based queries</text>
  <rect x="38.7879" y="259.5349" width="1202.4242" height="174.1395" fill="#e8f5e9" stroke="#333" stroke-width="2.5116" rx="6.6977" />
  <text x="58.1818" y="289.6744" font-family="sans-serif" font-size="21.7674" fill="#2e7d32" text-anchor="start" font-weight="bold">2. List Partitioning</text>
  <text x="58.1818" y="313.1163" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">PARTITIONED BY (region)</text>
  <text x="58.1818" y="336.5581" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">/data/events/region=us-east/</text>
  <text x="58.1818" y="360" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">/data/events/region=us-west/</text>
  <text x="58.1818" y="383.4419" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">/data/events/region=eu-west/</text>
  <text x="58.1818" y="406.8837" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">Best for: categorical, low-cardinality</text>
  <rect x="38.7879" y="485.5814" width="1202.4242" height="197.5814" fill="#fff3e0" stroke="#333" stroke-width="2.5116" rx="6.6977" />
  <text x="58.1818" y="515.7209" font-family="sans-serif" font-size="21.7674" fill="#e65100" text-anchor="start" font-weight="bold">3. Hash Partitioning</text>
  <text x="58.1818" y="539.1628" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">PARTITIONED BY (hash(user_id, 32))</text>
  <text x="58.1818" y="562.6047" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">/data/events/user_hash=0/</text>
  <text x="58.1818" y="586.0465" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">/data/events/user_hash=1/</text>
  <text x="58.1818" y="609.4884" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">...</text>
  <text x="58.1818" y="632.9302" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">/data/events/user_hash=31/</text>
  <text x="58.1818" y="656.3721" font-family="sans-serif" font-size="18.4186" fill="#333" text-anchor="start">Best for: even distribution, join keys</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="15.0588" markerHeight="15.5676" refX="11.2941" refY="5.8378" orient="auto">
      <ns0:path d="M 0 0 L 0 11.6757 L 15.0588 5.8378 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="17.1968" y="17.7778" width="1134.989" height="622.2222" fill="#e3f2fd" stroke="#333" stroke-width="2.5795" rx="6.8787" />
  <ns0:text x="34.3936" y="53.3333" font-family="sans-serif" font-size="25.7952" fill="#0d47a1" text-anchor="start" font-weight="bold">Key Takeaways</ns0:text>
  <ns0:text x="34.3936" y="117.3333" font-family="sans-serif" font-size="22.3559" fill="#1565c0" text-anchor="start" font-weight="bold">Formats:</ns0:text>
  <ns0:text x="48.1511" y="149.3334" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Parquet: default for analytics, columnar</ns0:text>
  <ns0:text x="48.1511" y="179.5555" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• ORC: alternative for Hive-centric stacks</ns0:text>
  <ns0:text x="48.1511" y="209.7777" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Avro: row-based, streaming, schema evolution</ns0:text>
  <ns0:text x="48.1511" y="240" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Delta / Iceberg: ACID on top of Parquet</ns0:text>
  <ns0:text x="34.3936" y="284.4445" font-family="sans-serif" font-size="22.3559" fill="#1565c0" text-anchor="start" font-weight="bold">Optimization:</ns0:text>
  <ns0:text x="48.1511" y="316.4444" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Predicate pushdown: filter at storage layer</ns0:text>
  <ns0:text x="48.1511" y="346.6667" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Projection pushdown: read only needed columns</ns0:text>
  <ns0:text x="48.1511" y="376.8888" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Z-ordering: co-locate data for better pruning</ns0:text>
  <ns0:text x="48.1511" y="407.1111" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Compression: ZSTD best overall balance</ns0:text>
  <ns0:text x="34.3936" y="451.5555" font-family="sans-serif" font-size="22.3559" fill="#1565c0" text-anchor="start" font-weight="bold">Storage Management:</ns0:text>
  <ns0:text x="48.1511" y="483.5555" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Partition by query pattern (low cardinality)</ns0:text>
  <ns0:text x="48.1511" y="513.7778" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Bucket by join key (high cardinality)</ns0:text>
  <ns0:text x="48.1511" y="544" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Compact small files regularly</ns0:text>
  <ns0:text x="48.1511" y="574.2221" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• VACUUM old versions periodically</ns0:text>
  <ns0:text x="48.1511" y="604.4444" font-family="sans-serif" font-size="20.6361" fill="#222" text-anchor="start">• Monitor file sizes (target 128 MB – 1 GB)</ns0:text>
</ns0:svg>
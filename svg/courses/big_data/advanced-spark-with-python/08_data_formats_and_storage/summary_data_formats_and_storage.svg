<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="58.1818" y="73.1428" font-size="25.608" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Key Takeaways</text>
  <text x="58.1818" y="132.8" font-size="22.1936" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Formats:</text>
  <text x="72.7273" y="162.6286" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Parquet: default for analytics, columnar</text>
  <text x="72.7273" y="190.7999" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• ORC: alternative for Hive-centric stacks</text>
  <text x="72.7273" y="218.9713" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Avro: row-based, streaming, schema evolution</text>
  <text x="72.7273" y="247.1428" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Delta / Iceberg: ACID on top of Parquet</text>
  <text x="58.1818" y="288.5715" font-size="22.1936" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Optimization:</text>
  <text x="72.7273" y="318.3999" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Predicate pushdown: filter at storage layer</text>
  <text x="72.7273" y="346.5714" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Projection pushdown: read only needed columns</text>
  <text x="72.7273" y="374.7428" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Z-ordering: co-locate data for better pruning</text>
  <text x="72.7273" y="402.9143" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Compression: ZSTD best overall balance</text>
  <text x="58.1818" y="444.3428" font-size="22.1936" fill="var(--primary-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Storage Management:</text>
  <text x="72.7273" y="474.1714" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Partition by query pattern (low cardinality)</text>
  <text x="72.7273" y="502.3429" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Bucket by join key (high cardinality)</text>
  <text x="72.7273" y="530.5143" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Compact small files regularly</text>
  <text x="72.7273" y="558.6856" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• VACUUM old versions periodically</text>
  <text x="72.7273" y="586.8571" font-size="20.4863" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Monitor file sizes (target 128 MB – 1 GB)</text>
</svg>
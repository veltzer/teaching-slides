<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 11.6757 L 15.0588 5.8378 z" fill="#555" />
    </marker>
  </defs>
  <rect x="17.1968" y="17.7778" width="1134.989" height="622.2222" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="34.3936" y="53.3333" font-family="sans-serif" font-size="25.7952" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Key Takeaways</text>
  <text x="34.3936" y="117.3333" font-family="sans-serif" font-size="22.3559" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Formats:</text>
  <text x="48.1511" y="149.3334" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Parquet: default for analytics, columnar</text>
  <text x="48.1511" y="179.5555" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• ORC: alternative for Hive-centric stacks</text>
  <text x="48.1511" y="209.7777" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Avro: row-based, streaming, schema evolution</text>
  <text x="48.1511" y="240" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Delta / Iceberg: ACID on top of Parquet</text>
  <text x="34.3936" y="284.4445" font-family="sans-serif" font-size="22.3559" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Optimization:</text>
  <text x="48.1511" y="316.4444" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Predicate pushdown: filter at storage layer</text>
  <text x="48.1511" y="346.6667" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Projection pushdown: read only needed columns</text>
  <text x="48.1511" y="376.8888" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Z-ordering: co-locate data for better pruning</text>
  <text x="48.1511" y="407.1111" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Compression: ZSTD best overall balance</text>
  <text x="34.3936" y="451.5555" font-family="sans-serif" font-size="22.3559" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Storage Management:</text>
  <text x="48.1511" y="483.5555" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Partition by query pattern (low cardinality)</text>
  <text x="48.1511" y="513.7778" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Bucket by join key (high cardinality)</text>
  <text x="48.1511" y="544" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Compact small files regularly</text>
  <text x="48.1511" y="574.2221" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• VACUUM old versions periodically</text>
  <text x="48.1511" y="604.4444" font-family="sans-serif" font-size="20.6361" fill="var(--text)" text-anchor="start">• Monitor file sizes (target 128 MB – 1 GB)</text>
</svg>
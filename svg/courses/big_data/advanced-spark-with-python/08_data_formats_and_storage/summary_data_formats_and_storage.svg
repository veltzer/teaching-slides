<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 11.6757 L 15.0588 5.8378 z" fill="#555" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="58.1818" y="73.1428" font-family="sans-serif" font-size="25.608" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Key Takeaways</text>
  <text x="58.1818" y="132.8" font-family="sans-serif" font-size="22.1936" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Formats:</text>
  <text x="72.7273" y="162.6286" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Parquet: default for analytics, columnar</text>
  <text x="72.7273" y="190.7999" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• ORC: alternative for Hive-centric stacks</text>
  <text x="72.7273" y="218.9713" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Avro: row-based, streaming, schema evolution</text>
  <text x="72.7273" y="247.1428" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Delta / Iceberg: ACID on top of Parquet</text>
  <text x="58.1818" y="288.5715" font-family="sans-serif" font-size="22.1936" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Optimization:</text>
  <text x="72.7273" y="318.3999" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Predicate pushdown: filter at storage layer</text>
  <text x="72.7273" y="346.5714" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Projection pushdown: read only needed columns</text>
  <text x="72.7273" y="374.7428" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Z-ordering: co-locate data for better pruning</text>
  <text x="72.7273" y="402.9143" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Compression: ZSTD best overall balance</text>
  <text x="58.1818" y="444.3428" font-family="sans-serif" font-size="22.1936" fill="var(--primary-accent)" text-anchor="start" font-weight="bold">Storage Management:</text>
  <text x="72.7273" y="474.1714" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Partition by query pattern (low cardinality)</text>
  <text x="72.7273" y="502.3429" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Bucket by join key (high cardinality)</text>
  <text x="72.7273" y="530.5143" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Compact small files regularly</text>
  <text x="72.7273" y="558.6856" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• VACUUM old versions periodically</text>
  <text x="72.7273" y="586.8571" font-family="sans-serif" font-size="20.4863" fill="var(--text)" text-anchor="start">• Monitor file sizes (target 128 MB – 1 GB)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 14.8966 L 14.6286 7.4483 z" fill="#555" />
    </marker>
  </defs>
  <text x="34.1569" y="51.0145" font-family="sans-serif" font-size="22.202" fill="var(--text)" text-anchor="start" font-weight="bold">Without Z-ordering (random distribution):</text>
  <rect x="34.1569" y="69.5653" width="264.7159" height="106.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="44.404" y="104.3478" font-family="sans-serif" font-size="20.4942" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">File 1</text>
  <text x="44.404" y="136.8116" font-family="sans-serif" font-size="17.0784" fill="var(--text)" text-anchor="start">user_id=[A,B,C,D,E]</text>
  <text x="44.404" y="166.9565" font-family="sans-serif" font-size="17.0784" fill="var(--text-muted)" text-anchor="start">date=[01,02,03,04,05]</text>
  <rect x="310.8277" y="69.5653" width="264.7159" height="106.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="321.0747" y="104.3478" font-family="sans-serif" font-size="20.4942" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">File 2</text>
  <text x="321.0747" y="136.8116" font-family="sans-serif" font-size="17.0784" fill="var(--text)" text-anchor="start">user_id=[A,C,E,F,G]</text>
  <text x="321.0747" y="166.9565" font-family="sans-serif" font-size="17.0784" fill="var(--text-muted)" text-anchor="start">date=[01,03,05,06,07]</text>
  <rect x="587.4985" y="69.5653" width="264.7159" height="106.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="597.7456" y="104.3478" font-family="sans-serif" font-size="20.4942" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">File 3</text>
  <text x="597.7456" y="136.8116" font-family="sans-serif" font-size="17.0784" fill="var(--text)" text-anchor="start">user_id=[B,D,F,H,I]</text>
  <text x="597.7456" y="166.9565" font-family="sans-serif" font-size="17.0784" fill="var(--text-muted)" text-anchor="start">date=[02,04,06,08,09]</text>
  <rect x="864.1692" y="69.5653" width="264.7159" height="106.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="874.4164" y="104.3478" font-family="sans-serif" font-size="20.4942" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">File 4</text>
  <text x="874.4164" y="136.8116" font-family="sans-serif" font-size="17.0784" fill="var(--text)" text-anchor="start">user_id=[A,G,H,I,J]</text>
  <text x="874.4164" y="166.9565" font-family="sans-serif" font-size="17.0784" fill="var(--text-muted)" text-anchor="start">date=[01,07,08,09,10]</text>
  <text x="34.1569" y="220.2899" font-family="sans-serif" font-size="20.4942" fill="var(--danger-accent)" text-anchor="start">Query: WHERE user_id = 'A'  →  Must scan File 1, 2, 4  (3/4 files = 75%)</text>
  <text x="34.1569" y="278.2608" font-family="sans-serif" font-size="22.202" fill="var(--text)" text-anchor="start" font-weight="bold">With Z-ordering on user_id:</text>
  <rect x="34.1569" y="296.8116" width="264.7159" height="106.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="44.404" y="331.5942" font-family="sans-serif" font-size="20.4942" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">File 1</text>
  <text x="44.404" y="364.058" font-family="sans-serif" font-size="17.0784" fill="var(--text)" text-anchor="start">user_id=[A,A,A,B,B]</text>
  <text x="44.404" y="394.2029" font-family="sans-serif" font-size="17.0784" fill="var(--text-muted)" text-anchor="start">date=[01,03,07,02,04]</text>
  <rect x="310.8277" y="296.8116" width="264.7159" height="106.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="321.0747" y="331.5942" font-family="sans-serif" font-size="20.4942" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">File 2</text>
  <text x="321.0747" y="364.058" font-family="sans-serif" font-size="17.0784" fill="var(--text)" text-anchor="start">user_id=[C,C,D,D,E]</text>
  <text x="321.0747" y="394.2029" font-family="sans-serif" font-size="17.0784" fill="var(--text-muted)" text-anchor="start">date=[03,05,02,04,05]</text>
  <rect x="587.4985" y="296.8116" width="264.7159" height="106.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="597.7456" y="331.5942" font-family="sans-serif" font-size="20.4942" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">File 3</text>
  <text x="597.7456" y="364.058" font-family="sans-serif" font-size="17.0784" fill="var(--text)" text-anchor="start">user_id=[F,F,G,G,H]</text>
  <text x="597.7456" y="394.2029" font-family="sans-serif" font-size="17.0784" fill="var(--text-muted)" text-anchor="start">date=[06,08,06,07,08]</text>
  <rect x="864.1692" y="296.8116" width="264.7159" height="106.6667" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="874.4164" y="331.5942" font-family="sans-serif" font-size="20.4942" fill="var(--ok-accent)" text-anchor="start" font-weight="bold">File 4</text>
  <text x="874.4164" y="364.058" font-family="sans-serif" font-size="17.0784" fill="var(--text)" text-anchor="start">user_id=[H,I,I,J,J]</text>
  <text x="874.4164" y="394.2029" font-family="sans-serif" font-size="17.0784" fill="var(--text-muted)" text-anchor="start">date=[09,08,09,09,10]</text>
  <text x="34.1569" y="447.5362" font-family="sans-serif" font-size="20.4942" fill="var(--ok-accent)" text-anchor="start">Query: WHERE user_id = 'A'  →  Must scan File 1 only  (1/4 files = 25%)</text>
  <rect x="34.1569" y="482.3188" width="1127.1773" height="157.6812" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="51.2353" y="524.0579" font-family="sans-serif" font-size="20.4942" fill="var(--text)" text-anchor="start">Z-order creates locality for the specified columns within data files,</text>
  <text x="51.2353" y="565.7971" font-family="sans-serif" font-size="20.4942" fill="var(--text)" text-anchor="start">making min/max statistics more effective at file skipping.</text>
  <text x="51.2353" y="607.5363" font-family="sans-serif" font-size="20.4942" fill="var(--text)" text-anchor="start">Result: 75% → 25% files scanned in this example.</text>
</svg>
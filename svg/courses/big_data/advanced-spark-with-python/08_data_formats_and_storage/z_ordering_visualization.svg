  <text x="51.2353" y="524.0579" font-family="sans-serif" font-size="20.4942" fill="var(--text-darker)" text-anchor="start">Z-order creates locality for the specified columns within data files,</text>
  <text x="51.2353" y="565.7971" font-family="sans-serif" font-size="20.4942" fill="var(--text-darker)" text-anchor="start">making min/max statistics more effective at file skipping.</text>

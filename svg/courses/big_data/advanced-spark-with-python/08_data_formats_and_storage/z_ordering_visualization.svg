<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#c4cdd6"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#555555"/></marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/></marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/></marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/></marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/></marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/></marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/></marker>
  </defs>

  <text x="40" y="40" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--text)">Without Z-ordering</text>

  <rect x="40" y="55.675675675676" width="280" height="104.504504504504" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="55" y="87.027027027027" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--danger-text)">File 1</text>
  <text x="55" y="118.378378378378" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--danger-text)">ids A,B,C,D,E</text>
  <text x="55" y="144.504504504504" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--danger-text)">01..05</text>

  <rect x="334" y="55.675675675676" width="280" height="104.504504504504" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="349" y="87.027027027027" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--danger-text)">File 2</text>
  <text x="349" y="118.378378378378" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--danger-text)">ids A,C,E,F,G</text>
  <text x="349" y="144.504504504504" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--danger-text)">01..07</text>

  <rect x="628" y="55.675675675676" width="280" height="104.504504504504" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="643" y="87.027027027027" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--danger-text)">File 3</text>
  <text x="643" y="118.378378378378" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--danger-text)">ids B,D,F,H,I</text>
  <text x="643" y="144.504504504504" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--danger-text)">02..09</text>

  <rect x="922" y="55.675675675676" width="280" height="104.504504504504" rx="6.133646682164" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="937" y="87.027027027027" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--danger-text)">File 4</text>
  <text x="937" y="118.378378378378" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--danger-text)">ids A,G,H,I,J</text>
  <text x="937" y="144.504504504504" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--danger-text)">01..10</text>

  <text x="40" y="196.756756756757" font-family="Arial, sans-serif" font-size="18.400940046492" fill="var(--danger-accent)">id='A' scans 3/4 files (75%)</text>

  <text x="40" y="254.234234234234" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--text)">With Z-ordering on id</text>

  <rect x="40" y="269.90990990991" width="280" height="104.504504504504" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="55" y="301.261261261261" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)">File 1</text>
  <text x="55" y="332.612612612613" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--ok-text)">A,A,A,B,B</text>

  <rect x="334" y="269.90990990991" width="280" height="104.504504504504" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="349" y="301.261261261261" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)">File 2</text>
  <text x="349" y="332.612612612613" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--ok-text)">C,C,D,D,E</text>

  <rect x="628" y="269.90990990991" width="280" height="104.504504504504" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="643" y="301.261261261261" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)">File 3</text>
  <text x="643" y="332.612612612613" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--ok-text)">F,F,G,G,H</text>

  <rect x="922" y="269.90990990991" width="280" height="104.504504504504" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="937" y="301.261261261261" font-family="Arial, sans-serif" font-size="18.400940046492" font-weight="bold" fill="var(--ok-text)">File 4</text>
  <text x="937" y="332.612612612613" font-family="Courier New, monospace" font-size="15.33411670541" fill="var(--ok-text)">H,I,I,J,J</text>

  <text x="40" y="410.990990990991" font-family="Arial, sans-serif" font-size="18.400940046492" fill="var(--ok-accent)">id='A' scans 1/4 files (25%)</text>

  <rect x="40" y="442.342342342342" width="1200" height="177.657657657658" rx="6.133646682164" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="489.369369369369" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--ok-text)">Z-order creates locality</text>
  <text x="640" y="531.171171171171" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" fill="var(--ok-text)">min/max stats skip more files</text>
  <text x="640" y="572.972972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.400940046492" fill="var(--ok-text)">scanned: 75% to 25%</text>
</svg>

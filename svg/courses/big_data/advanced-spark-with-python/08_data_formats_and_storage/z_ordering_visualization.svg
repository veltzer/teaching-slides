  <rect x="36.5714" y="516.4138" width="1206.8571" height="168.8276" fill="#e8f5e9" stroke="#333" stroke-width="2.7429" rx="7.3143" />
  <text x="54.8571" y="561.1034" font-family="sans-serif" font-size="21.9429" fill="#222" text-anchor="start">Z-order creates locality for the specified columns within data files,</text>
  <text x="54.8571" y="605.7931" font-family="sans-serif" font-size="21.9429" fill="#222" text-anchor="start">making min/max statistics more effective at file skipping.</text>
  <text x="54.8571" y="650.4828" font-family="sans-serif" font-size="21.9429" fill="#222" text-anchor="start">Result: 75% → 25% files scanned in this example.</text>

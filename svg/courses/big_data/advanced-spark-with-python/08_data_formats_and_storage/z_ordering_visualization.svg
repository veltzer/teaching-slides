  <ns0:text x="51.2353" y="524.0579" font-family="sans-serif" font-size="20.4942" fill="#222" text-anchor="start">Z-order creates locality for the specified columns within data files,</ns0:text>
  <ns0:text x="51.2353" y="565.7971" font-family="sans-serif" font-size="20.4942" fill="#222" text-anchor="start">making min/max statistics more effective at file skipping.</ns0:text>
  <ns0:text x="51.2353" y="607.5363" font-family="sans-serif" font-size="20.4942" fill="#222" text-anchor="start">Result: 75% → 25% files scanned in this example.</ns0:text>

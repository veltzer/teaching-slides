<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 0 12 L 15.0588 6 z" fill="#555" />
    </marker>
  </defs>
  <rect x="17.2101" y="18.2857" width="1135.8655" height="621.7143" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="34.4202" y="54.8571" font-family="sans-serif" font-size="24.0941" fill="var(--warn-accent)" text-anchor="start" font-weight="bold">The small file problem</text>
  <text x="34.4202" y="91.4286" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">Cause: streaming or frequent appends create many tiny files</text>
  <text x="48.1883" y="124.3429" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">/data/events/date=2024-06-15/</text>
  <text x="48.1883" y="155.4286" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">├── part-00000.parquet  (2 KB)</text>
  <text x="48.1883" y="186.5143" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">├── part-00001.parquet  (3 KB)</text>
  <text x="48.1883" y="217.6" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">├── part-00002.parquet  (1 KB)</text>
  <text x="48.1883" y="248.6857" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">├── part-00003.parquet  (4 KB)</text>
  <text x="48.1883" y="279.7714" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">├── ... (10,000 tiny files)</text>
  <text x="48.1883" y="310.8571" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">└── part-09999.parquet  (2 KB)</text>
  <text x="34.4202" y="365.7143" font-family="sans-serif" font-size="20.6521" fill="var(--warn-accent)" text-anchor="start" font-weight="bold">Problems:</text>
  <text x="48.1883" y="398.6286" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">• Slow reads: metadata overhead per file</text>
  <text x="48.1883" y="429.7143" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">• HDFS/S3 listing bottleneck</text>
  <text x="48.1883" y="460.8" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">• NameNode memory pressure (HDFS)</text>
  <text x="48.1883" y="491.8857" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">• High API cost (S3)</text>
  <text x="48.1883" y="522.9714" font-family="sans-serif" font-size="20.6521" fill="var(--text)" text-anchor="start">• Poor predicate pushdown (stats per file)</text>
  <text x="34.4202" y="599.7714" font-family="sans-serif" font-size="20.6521" fill="var(--danger-accent)" text-anchor="start" font-weight="bold">Target: files of 128 MB – 1 GB</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arr" markerWidth="15.0588" markerHeight="16" refX="11.2941" refY="6" orient="auto">
      <path d="M 0 0 L 0 12 L 15.0588 6 z" fill="#555" />
    </marker>
  </defs>
  <rect x="18.8235" y="20" width="1242.3529" height="680" fill="#fff3e0" stroke="#333" stroke-width="2.8235" rx="7.5294" />
  <text x="37.6471" y="60" font-family="sans-serif" font-size="26.3529" fill="#e65100" text-anchor="start" font-weight="bold">The small file problem</text>
  <text x="37.6471" y="100" font-family="sans-serif" font-size="22.5882" fill="#222" text-anchor="start">Cause: streaming or frequent appends create many tiny files</text>
  <text x="52.7059" y="136" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">/data/events/date=2024-06-15/</text>
  <text x="52.7059" y="170" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">├── part-00000.parquet  (2 KB)</text>
  <text x="52.7059" y="204" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">├── part-00001.parquet  (3 KB)</text>
  <text x="52.7059" y="238" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">├── part-00002.parquet  (1 KB)</text>
  <text x="52.7059" y="272" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">├── part-00003.parquet  (4 KB)</text>
  <text x="52.7059" y="306" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">├── ... (10,000 tiny files)</text>
  <text x="52.7059" y="340" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">└── part-09999.parquet  (2 KB)</text>
  <text x="37.6471" y="400" font-family="sans-serif" font-size="22.5882" fill="#e65100" text-anchor="start" font-weight="bold">Problems:</text>
  <text x="52.7059" y="436" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">• Slow reads: metadata overhead per file</text>
  <text x="52.7059" y="470" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">• HDFS/S3 listing bottleneck</text>
  <text x="52.7059" y="504" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">• NameNode memory pressure (HDFS)</text>
  <text x="52.7059" y="538" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">• High API cost (S3)</text>
  <text x="52.7059" y="572" font-family="sans-serif" font-size="22.5882" fill="#333" text-anchor="start">• Poor predicate pushdown (stats per file)</text>
  <text x="37.6471" y="656" font-family="sans-serif" font-size="22.5882" fill="#bf360c" text-anchor="start" font-weight="bold">Target: files of 128 MB – 1 GB</text>
</svg>
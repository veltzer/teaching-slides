<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="15.0588" markerHeight="16" refX="11.2941" refY="6" orient="auto">
      <ns0:path d="M 0 0 L 0 12 L 15.0588 6 z" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="17.2101" y="18.2857" width="1135.8655" height="621.7143" fill="#fff3e0" stroke="#333" stroke-width="2.5815" rx="6.884" />
  <ns0:text x="34.4202" y="54.8571" font-family="sans-serif" font-size="24.0941" fill="#e65100" text-anchor="start" font-weight="bold">The small file problem</ns0:text>
  <ns0:text x="34.4202" y="91.4286" font-family="sans-serif" font-size="20.6521" fill="#222" text-anchor="start">Cause: streaming or frequent appends create many tiny files</ns0:text>
  <ns0:text x="48.1883" y="124.3429" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">/data/events/date=2024-06-15/</ns0:text>
  <ns0:text x="48.1883" y="155.4286" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">├── part-00000.parquet  (2 KB)</ns0:text>
  <ns0:text x="48.1883" y="186.5143" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">├── part-00001.parquet  (3 KB)</ns0:text>
  <ns0:text x="48.1883" y="217.6" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">├── part-00002.parquet  (1 KB)</ns0:text>
  <ns0:text x="48.1883" y="248.6857" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">├── part-00003.parquet  (4 KB)</ns0:text>
  <ns0:text x="48.1883" y="279.7714" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">├── ... (10,000 tiny files)</ns0:text>
  <ns0:text x="48.1883" y="310.8571" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">└── part-09999.parquet  (2 KB)</ns0:text>
  <ns0:text x="34.4202" y="365.7143" font-family="sans-serif" font-size="20.6521" fill="#e65100" text-anchor="start" font-weight="bold">Problems:</ns0:text>
  <ns0:text x="48.1883" y="398.6286" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">• Slow reads: metadata overhead per file</ns0:text>
  <ns0:text x="48.1883" y="429.7143" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">• HDFS/S3 listing bottleneck</ns0:text>
  <ns0:text x="48.1883" y="460.8" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">• NameNode memory pressure (HDFS)</ns0:text>
  <ns0:text x="48.1883" y="491.8857" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">• High API cost (S3)</ns0:text>
  <ns0:text x="48.1883" y="522.9714" font-family="sans-serif" font-size="20.6521" fill="#333" text-anchor="start">• Poor predicate pushdown (stats per file)</ns0:text>
  <ns0:text x="34.4202" y="599.7714" font-family="sans-serif" font-size="20.6521" fill="#bf360c" text-anchor="start" font-weight="bold">Target: files of 128 MB – 1 GB</ns0:text>
</ns0:svg>
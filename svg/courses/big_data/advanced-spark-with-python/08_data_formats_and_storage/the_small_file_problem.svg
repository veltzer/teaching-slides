<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="58.1818" y="74.1176" font-size="23.9197" fill="var(--warn-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">The small file problem</text>
  <text x="58.1818" y="108.2353" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Cause: streaming or frequent appends create many tiny files</text>
  <text x="72.7273" y="138.9412" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">/data/events/date=2024-06-15/</text>
  <text x="72.7273" y="167.9412" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── part-00000.parquet  (2 KB)</text>
  <text x="72.7273" y="196.9412" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── part-00001.parquet  (3 KB)</text>
  <text x="72.7273" y="225.9412" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── part-00002.parquet  (1 KB)</text>
  <text x="72.7273" y="254.9412" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── part-00003.parquet  (4 KB)</text>
  <text x="72.7273" y="283.9412" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── ... (10,000 tiny files)</text>
  <text x="72.7273" y="312.9411" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── part-09999.parquet  (2 KB)</text>
  <text x="58.1818" y="364.1177" font-size="20.5026" fill="var(--warn-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Problems:</text>
  <text x="72.7273" y="394.8236" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Slow reads: metadata overhead per file</text>
  <text x="72.7273" y="423.8235" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• HDFS/S3 listing bottleneck</text>
  <text x="72.7273" y="452.8235" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• NameNode memory pressure (HDFS)</text>
  <text x="72.7273" y="481.8235" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• High API cost (S3)</text>
  <text x="72.7273" y="510.8235" font-size="20.5026" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">• Poor predicate pushdown (stats per file)</text>
  <text x="58.1818" y="582.4706" font-size="20.5026" fill="var(--danger-accent)" text-anchor="start" font-weight="bold" font-family="Arial, sans-serif">Target: files of 128 MB – 1 GB</text>
</svg>

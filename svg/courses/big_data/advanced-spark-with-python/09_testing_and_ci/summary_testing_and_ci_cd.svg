<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="74.8" text-anchor="middle" font-size="19.9938" font-weight="bold" fill="var(--primary-accent)">Key Takeaways</text>
  <line x1="62.2223" y1="86.3999" x2="1217.7778" y2="86.3999" stroke="var(--primary-border)" stroke-width="1.2549" />
  <text x="84.4445" y="115.4" font-size="17.4946" font-weight="bold" fill="var(--text)">Testing Strategy:</text>
  <text x="106.6668" y="138.6" font-size="14.9954" fill="var(--text)">• Separate pure logic from Spark operations</text>
  <text x="106.6668" y="159.4799" font-size="14.9954" fill="var(--text)">• Test pure Python functions without Spark</text>
  <text x="106.6668" y="180.3599" font-size="14.9954" fill="var(--text)">• Use local[2] SparkSession for unit tests</text>
  <text x="106.6668" y="201.24" font-size="14.9954" fill="var(--text)">• Use chispa for DataFrame equality</text>
  <text x="106.6668" y="222.1199" font-size="14.9954" fill="var(--text)">• Test edge cases: empty, nulls, special chars</text>
  <text x="84.4445" y="260.4" font-size="17.4946" font-weight="bold" fill="var(--text)">Fixtures:</text>
  <text x="106.6668" y="283.5999" font-size="14.9954" fill="var(--text)">• session-scoped SparkSession (create once)</text>
  <text x="106.6668" y="304.48" font-size="14.9954" fill="var(--text)">• function-scoped DataFrames (fresh per test)</text>
  <text x="106.6668" y="325.3599" font-size="14.9954" fill="var(--text)">• conftest.py for shared fixtures</text>
  <text x="84.4445" y="363.6399" font-size="17.4946" font-weight="bold" fill="var(--text)">CI/CD:</text>
  <text x="106.6668" y="386.84" font-size="14.9954" fill="var(--text)">• Lint (pylint), format (black), type (mypy)</text>
  <text x="106.6668" y="407.7199" font-size="14.9954" fill="var(--text)">• Unit tests first, integration tests second</text>
  <text x="106.6668" y="428.5999" font-size="14.9954" fill="var(--text)">• Java 11+ required for Spark in CI</text>
  <text x="106.6668" y="449.48" font-size="14.9954" fill="var(--text)">• Cache pip packages for faster builds</text>
  <text x="84.4445" y="487.7599" font-size="17.4946" font-weight="bold" fill="var(--text)">Code Quality:</text>
  <text x="106.6668" y="510.96" font-size="14.9954" fill="var(--text)">• black for consistent formatting</text>
  <text x="106.6668" y="531.8399" font-size="14.9954" fill="var(--text)">• pylint for code standards</text>
  <text x="106.6668" y="552.72" font-size="14.9954" fill="var(--text)">• mypy for type safety</text>
  <text x="106.6668" y="573.5999" font-size="14.9954" fill="var(--text)">• Type-annotate all transformation functions</text>
</svg>
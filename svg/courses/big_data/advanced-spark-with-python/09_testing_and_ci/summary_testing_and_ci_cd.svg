<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="20.7158" y="12.5491" width="1118.6554" height="627.4509" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="580.0435" y="50.1961" text-anchor="middle" font-size="20.0784" font-weight="bold" fill="var(--primary-accent)">Key Takeaways</text>
  <line x1="41.4317" y1="62.7451" x2="1118.6554" y2="62.7451" stroke="var(--primary-border)" stroke-width="1.2549" />
  <text x="62.1475" y="94.1177" font-size="17.5686" font-weight="bold" fill="var(--text)">Testing Strategy:</text>
  <text x="82.8634" y="119.2157" font-size="15.0588" fill="var(--text)">• Separate pure logic from Spark operations</text>
  <text x="82.8634" y="141.8039" font-size="15.0588" fill="var(--text)">• Test pure Python functions without Spark</text>
  <text x="82.8634" y="164.3921" font-size="15.0588" fill="var(--text)">• Use local[2] SparkSession for unit tests</text>
  <text x="82.8634" y="186.9804" font-size="15.0588" fill="var(--text)">• Use chispa for DataFrame equality</text>
  <text x="82.8634" y="209.5686" font-size="15.0588" fill="var(--text)">• Test edge cases: empty, nulls, special chars</text>
  <text x="62.1475" y="250.9804" font-size="17.5686" font-weight="bold" fill="var(--text)">Fixtures:</text>
  <text x="82.8634" y="276.0784" font-size="15.0588" fill="var(--text)">• session-scoped SparkSession (create once)</text>
  <text x="82.8634" y="298.6667" font-size="15.0588" fill="var(--text)">• function-scoped DataFrames (fresh per test)</text>
  <text x="82.8634" y="321.2548" font-size="15.0588" fill="var(--text)">• conftest.py for shared fixtures</text>
  <text x="62.1475" y="362.6666" font-size="17.5686" font-weight="bold" fill="var(--text)">CI/CD:</text>
  <text x="82.8634" y="387.7647" font-size="15.0588" fill="var(--text)">• Lint (pylint), format (black), type (mypy)</text>
  <text x="82.8634" y="410.3529" font-size="15.0588" fill="var(--text)">• Unit tests first, integration tests second</text>
  <text x="82.8634" y="432.9411" font-size="15.0588" fill="var(--text)">• Java 11+ required for Spark in CI</text>
  <text x="82.8634" y="455.5294" font-size="15.0588" fill="var(--text)">• Cache pip packages for faster builds</text>
  <text x="62.1475" y="496.9411" font-size="17.5686" font-weight="bold" fill="var(--text)">Code Quality:</text>
  <text x="82.8634" y="522.0392" font-size="15.0588" fill="var(--text)">• black for consistent formatting</text>
  <text x="82.8634" y="544.6274" font-size="15.0588" fill="var(--text)">• pylint for code standards</text>
  <text x="82.8634" y="567.2157" font-size="15.0588" fill="var(--text)">• mypy for type safety</text>
  <text x="82.8634" y="589.8038" font-size="15.0588" fill="var(--text)">• Type-annotate all transformation functions</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="22.8571" y="13.8462" width="1234.2857" height="692.3077" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="55.3846" text-anchor="middle" font-size="22.1538" font-weight="bold" fill="#4a90e2">Key Takeaways</text>
  <line x1="45.7143" y1="69.2308" x2="1234.2857" y2="69.2308" stroke="#4a90e2" stroke-width="1.3846" />
  <text x="68.5714" y="103.8462" font-size="19.3846" font-weight="bold" fill="#333">Testing Strategy:</text>
  <text x="91.4286" y="131.5385" font-size="16.6154" fill="#333">• Separate pure logic from Spark operations</text>
  <text x="91.4286" y="156.4615" font-size="16.6154" fill="#333">• Test pure Python functions without Spark</text>
  <text x="91.4286" y="181.3846" font-size="16.6154" fill="#333">• Use local[2] SparkSession for unit tests</text>
  <text x="91.4286" y="206.3077" font-size="16.6154" fill="#333">• Use chispa for DataFrame equality</text>
  <text x="91.4286" y="231.2308" font-size="16.6154" fill="#333">• Test edge cases: empty, nulls, special chars</text>
  <text x="68.5714" y="276.9231" font-size="19.3846" font-weight="bold" fill="#333">Fixtures:</text>
  <text x="91.4286" y="304.6154" font-size="16.6154" fill="#333">• session-scoped SparkSession (create once)</text>
  <text x="91.4286" y="329.5385" font-size="16.6154" fill="#333">• function-scoped DataFrames (fresh per test)</text>
  <text x="91.4286" y="354.4615" font-size="16.6154" fill="#333">• conftest.py for shared fixtures</text>
  <text x="68.5714" y="400.1538" font-size="19.3846" font-weight="bold" fill="#333">CI/CD:</text>
  <text x="91.4286" y="427.8462" font-size="16.6154" fill="#333">• Lint (pylint), format (black), type (mypy)</text>
  <text x="91.4286" y="452.7692" font-size="16.6154" fill="#333">• Unit tests first, integration tests second</text>
  <text x="91.4286" y="477.6923" font-size="16.6154" fill="#333">• Java 11+ required for Spark in CI</text>
  <text x="91.4286" y="502.6154" font-size="16.6154" fill="#333">• Cache pip packages for faster builds</text>
  <text x="68.5714" y="548.3077" font-size="19.3846" font-weight="bold" fill="#333">Code Quality:</text>
  <text x="91.4286" y="576" font-size="16.6154" fill="#333">• black for consistent formatting</text>
  <text x="91.4286" y="600.9231" font-size="16.6154" fill="#333">• pylint for code standards</text>
  <text x="91.4286" y="625.8462" font-size="16.6154" fill="#333">• mypy for type safety</text>
  <text x="91.4286" y="650.7692" font-size="16.6154" fill="#333">• Type-annotate all transformation functions</text>
</svg>
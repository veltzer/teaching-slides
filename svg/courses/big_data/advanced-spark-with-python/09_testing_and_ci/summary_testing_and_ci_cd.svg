<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="20.7158" y="12.5491" width="1118.6554" height="627.4509" rx="6.2745" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.5098" />
  <ns0:text x="580.0435" y="50.1961" text-anchor="middle" font-size="20.0784" font-weight="bold" fill="#4a90e2">Key Takeaways</ns0:text>
  <ns0:line x1="41.4317" y1="62.7451" x2="1118.6554" y2="62.7451" stroke="#4a90e2" stroke-width="1.2549" />
  <ns0:text x="62.1475" y="94.1177" font-size="17.5686" font-weight="bold" fill="#333">Testing Strategy:</ns0:text>
  <ns0:text x="82.8634" y="119.2157" font-size="15.0588" fill="#333">• Separate pure logic from Spark operations</ns0:text>
  <ns0:text x="82.8634" y="141.8039" font-size="15.0588" fill="#333">• Test pure Python functions without Spark</ns0:text>
  <ns0:text x="82.8634" y="164.3921" font-size="15.0588" fill="#333">• Use local[2] SparkSession for unit tests</ns0:text>
  <ns0:text x="82.8634" y="186.9804" font-size="15.0588" fill="#333">• Use chispa for DataFrame equality</ns0:text>
  <ns0:text x="82.8634" y="209.5686" font-size="15.0588" fill="#333">• Test edge cases: empty, nulls, special chars</ns0:text>
  <ns0:text x="62.1475" y="250.9804" font-size="17.5686" font-weight="bold" fill="#333">Fixtures:</ns0:text>
  <ns0:text x="82.8634" y="276.0784" font-size="15.0588" fill="#333">• session-scoped SparkSession (create once)</ns0:text>
  <ns0:text x="82.8634" y="298.6667" font-size="15.0588" fill="#333">• function-scoped DataFrames (fresh per test)</ns0:text>
  <ns0:text x="82.8634" y="321.2548" font-size="15.0588" fill="#333">• conftest.py for shared fixtures</ns0:text>
  <ns0:text x="62.1475" y="362.6666" font-size="17.5686" font-weight="bold" fill="#333">CI/CD:</ns0:text>
  <ns0:text x="82.8634" y="387.7647" font-size="15.0588" fill="#333">• Lint (pylint), format (black), type (mypy)</ns0:text>
  <ns0:text x="82.8634" y="410.3529" font-size="15.0588" fill="#333">• Unit tests first, integration tests second</ns0:text>
  <ns0:text x="82.8634" y="432.9411" font-size="15.0588" fill="#333">• Java 11+ required for Spark in CI</ns0:text>
  <ns0:text x="82.8634" y="455.5294" font-size="15.0588" fill="#333">• Cache pip packages for faster builds</ns0:text>
  <ns0:text x="62.1475" y="496.9411" font-size="17.5686" font-weight="bold" fill="#333">Code Quality:</ns0:text>
  <ns0:text x="82.8634" y="522.0392" font-size="15.0588" fill="#333">• black for consistent formatting</ns0:text>
  <ns0:text x="82.8634" y="544.6274" font-size="15.0588" fill="#333">• pylint for code standards</ns0:text>
  <ns0:text x="82.8634" y="567.2157" font-size="15.0588" fill="#333">• mypy for type safety</ns0:text>
  <ns0:text x="82.8634" y="589.8038" font-size="15.0588" fill="#333">• Type-annotate all transformation functions</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999948076921" y="40" text-anchor="middle" font-size="21.970572814477" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Key Takeaways</text>
  <line x1="40" y1="53.488258518095" x2="1240" y2="53.488258518095" stroke="var(--primary-border)" stroke-width="1.2549"/>
  <text x="63.076901109466" y="87.209311790159" font-size="19.2242786844" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Testing Strategy:</text>
  <text x="86.153906065092" y="114.186061384535" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Separate pure logic from Spark operations</text>
  <text x="86.153906065092" y="138.465019740381" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Test pure Python functions without Spark</text>
  <text x="86.153906065092" y="162.74409437532" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Use local[2] SparkSession for unit tests</text>
  <text x="86.153906065092" y="187.023285289352" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Use chispa for DataFrame equality</text>
  <text x="86.153906065092" y="211.302243645197" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Test edge cases: empty, nulls, special chars</text>
  <text x="63.076901109466" y="255.813996755011" font-size="19.2242786844" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Fixtures:</text>
  <text x="86.153906065092" y="282.790630070295" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• session-scoped SparkSession (create once)</text>
  <text x="86.153906065092" y="307.069820984327" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• function-scoped DataFrames (fresh per test)</text>
  <text x="86.153906065092" y="331.348779340172" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• conftest.py for shared fixtures</text>
  <text x="63.076901109466" y="375.860416170893" font-size="19.2242786844" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CI/CD:</text>
  <text x="86.153906065092" y="402.837282044363" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Lint (pylint), format (black), type (mypy)</text>
  <text x="86.153906065092" y="427.116240400209" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Unit tests first, integration tests second</text>
  <text x="86.153906065092" y="451.395315035147" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Java 11+ required for Spark in CI</text>
  <text x="86.153906065092" y="475.674505949179" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Cache pip packages for faster builds</text>
  <text x="63.076901109466" y="520.186026500807" font-size="19.2242786844" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Code Quality:</text>
  <text x="86.153906065092" y="547.162892374277" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• black for consistent formatting</text>
  <text x="86.153906065092" y="571.441850730122" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• pylint for code standards</text>
  <text x="86.153906065092" y="595.721041644154" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• mypy for type safety</text>
  <text x="86.153906065092" y="620" font-size="16.477984554322" fill="var(--text)" font-family="Arial, sans-serif">• Type-annotate all transformation functions</text>
</svg>

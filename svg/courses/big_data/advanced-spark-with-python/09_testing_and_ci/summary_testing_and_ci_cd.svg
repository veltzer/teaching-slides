<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="20.7158" y="12.5491" width="1118.6554" height="627.4509" rx="6.2745" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.5098" />
  <text x="580.0435" y="50.1961" text-anchor="middle" font-size="20.0784" font-weight="bold" fill="var(--primary-bright)">Key Takeaways</text>
  <line x1="41.4317" y1="62.7451" x2="1118.6554" y2="62.7451" stroke="var(--primary-bright)" stroke-width="1.2549" />
  <text x="62.1475" y="94.1177" font-size="17.5686" font-weight="bold" fill="var(--text-dark)">Testing Strategy:</text>
  <text x="82.8634" y="119.2157" font-size="15.0588" fill="var(--text-dark)">• Separate pure logic from Spark operations</text>
  <text x="82.8634" y="141.8039" font-size="15.0588" fill="var(--text-dark)">• Test pure Python functions without Spark</text>
  <text x="82.8634" y="164.3921" font-size="15.0588" fill="var(--text-dark)">• Use local[2] SparkSession for unit tests</text>
  <text x="82.8634" y="186.9804" font-size="15.0588" fill="var(--text-dark)">• Use chispa for DataFrame equality</text>
  <text x="82.8634" y="209.5686" font-size="15.0588" fill="var(--text-dark)">• Test edge cases: empty, nulls, special chars</text>
  <text x="62.1475" y="250.9804" font-size="17.5686" font-weight="bold" fill="var(--text-dark)">Fixtures:</text>
  <text x="82.8634" y="276.0784" font-size="15.0588" fill="var(--text-dark)">• session-scoped SparkSession (create once)</text>
  <text x="82.8634" y="298.6667" font-size="15.0588" fill="var(--text-dark)">• function-scoped DataFrames (fresh per test)</text>
  <text x="82.8634" y="321.2548" font-size="15.0588" fill="var(--text-dark)">• conftest.py for shared fixtures</text>
  <text x="62.1475" y="362.6666" font-size="17.5686" font-weight="bold" fill="var(--text-dark)">CI/CD:</text>
  <text x="82.8634" y="387.7647" font-size="15.0588" fill="var(--text-dark)">• Lint (pylint), format (black), type (mypy)</text>
  <text x="82.8634" y="410.3529" font-size="15.0588" fill="var(--text-dark)">• Unit tests first, integration tests second</text>
  <text x="82.8634" y="432.9411" font-size="15.0588" fill="var(--text-dark)">• Java 11+ required for Spark in CI</text>
  <text x="82.8634" y="455.5294" font-size="15.0588" fill="var(--text-dark)">• Cache pip packages for faster builds</text>
  <text x="62.1475" y="496.9411" font-size="17.5686" font-weight="bold" fill="var(--text-dark)">Code Quality:</text>
  <text x="82.8634" y="522.0392" font-size="15.0588" fill="var(--text-dark)">• black for consistent formatting</text>
  <text x="82.8634" y="544.6274" font-size="15.0588" fill="var(--text-dark)">• pylint for code standards</text>
  <text x="82.8634" y="567.2157" font-size="15.0588" fill="var(--text-dark)">• mypy for type safety</text>
  <text x="82.8634" y="589.8038" font-size="15.0588" fill="var(--text-dark)">• Type-annotate all transformation functions</text>
</svg>
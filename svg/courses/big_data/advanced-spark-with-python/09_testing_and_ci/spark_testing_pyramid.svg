<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <polygon points="490,72.2223 321.25,201.1111 658.75,201.1111" fill="var(--danger-fill)" opacity="0.88" filter="url(#shadow)" />
  <text x="490" y="140.6944" font-family="Arial,sans-serif" font-size="16.5115" font-weight="bold" fill="var(--bg)" text-anchor="middle">End-to-End</text>
  <text x="490" y="159.2223" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--danger-accent)" text-anchor="middle">Full pipeline · Slowest</text>
  <polygon points="321.25,209.1667 190,354.1667 790,354.1667 658.75,209.1667" fill="var(--warn-fill)" opacity="0.88" filter="url(#shadow)" />
  <text x="490" y="277.6389" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integration</text>
  <text x="490" y="297.7777" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--warn-accent)" text-anchor="middle">SparkSession · Small real data</text>
  <polygon points="190,362.2223 58.75,507.2223 921.25,507.2223 790,362.2223" fill="var(--ok-fill)" opacity="0.88" filter="url(#shadow)" />
  <text x="490" y="430.6944" font-family="Arial,sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unit Tests</text>
  <text x="490" y="454.0556" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--ok-accent)" text-anchor="middle">Pure Python/Scala functions · No Spark · Fastest</text>
  <text x="86.875" y="201.1111" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Slow</text>
  <text x="86.875" y="217.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-faint)" text-anchor="middle">Few</text>
  <line x1="86.875" y1="225.2777" x2="86.875" y2="475" stroke="var(--border)" stroke-width="1.7778" />
  <text x="86.875" y="487.0833" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Fast</text>
  <text x="86.875" y="500.7777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-faint)" text-anchor="middle">Many</text>
  <rect x="968.125" y="362.2223" width="253.125" height="136.9444" fill="var(--ok-fill)" rx="6" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="968.125" y="362.2223" width="253.125" height="29" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="968.125" y="378.3333" width="253.125" height="12.8889" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1094.6875" y="381.5556" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unit Test Tools</text>
  <text x="986.875" y="408.9444" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">pytest — test runner</text>
  <text x="986.875" y="425.0556" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">pytest-mock — mock objects</text>
  <text x="986.875" y="441.1667" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Pure functions (no SparkSession)</text>
  <text x="986.875" y="457.2777" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">UDF logic tested in isolation</text>
  <text x="986.875" y="473.3889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Runs in ms — run on every save</text>
  <line x1="921.25" y1="434.7223" x2="968.125" y2="434.7223" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="968.125" y="209.1667" width="253.125" height="136.9444" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="968.125" y="209.1667" width="253.125" height="29" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="968.125" y="225.2777" width="253.125" height="12.8889" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1094.6875" y="228.5" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integration Test Tools</text>
  <text x="986.875" y="255.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">SparkSession (local[*])</text>
  <text x="986.875" y="272" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">chispa — DataFrame equality</text>
  <text x="986.875" y="288.1111" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">pytest fixtures / conftest.py</text>
  <text x="986.875" y="304.2223" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Small synthetic datasets</text>
  <text x="986.875" y="320.3333" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Runs in seconds</text>
  <line x1="790" y1="281.6667" x2="968.125" y2="277.6389" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="968.125" y="64.1667" width="253.125" height="128.8889" fill="var(--danger-fill)" rx="6" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="968.125" y="64.1667" width="253.125" height="29" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="968.125" y="80.2777" width="253.125" height="12.8889" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1094.6875" y="83.5" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--bg)" text-anchor="middle">E2E / CI Tools</text>
  <text x="986.875" y="110.8889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">GitHub Actions / Jenkins</text>
  <text x="986.875" y="127" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Full cluster or Docker Spark</text>
  <text x="986.875" y="143.1111" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Real data sources (S3, HDFS)</text>
  <text x="986.875" y="159.2223" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">pylint · mypy · black (lint)</text>
  <text x="986.875" y="175.3333" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Runs in minutes — CI gated</text>
  <line x1="658.75" y1="136.6667" x2="968.125" y2="128.6111" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="58.75" y="523.3333" width="890.6249" height="40.2777" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="485.3125" y="541.0556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Testing ratio guideline: ~70% unit · ~20% integration · ~10% end-to-end</text>
  <text x="485.3125" y="555.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text-muted)" text-anchor="middle">Design transformations as pure functions to maximize unit-testable code</text>
</svg>
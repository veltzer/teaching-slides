<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <polygon points="485.16129,49.354893 310.967742,199.032252 659.354839,199.032252" fill="var(--danger-fill)" opacity="0.88" filter="url(#shadow)" />
  <text x="485.16129" y="128.870903" font-family="Arial,sans-serif" font-size="18.078031" font-weight="bold" fill="var(--bg)" text-anchor="middle">End-to-End</text>
  <text x="485.16129" y="150.38718" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--danger-accent)" text-anchor="middle">Full pipeline · Slowest</text>
  <polygon points="310.967742,208.387145 175.483871,376.774291 794.83871,376.774291 659.354839,208.387145" fill="var(--warn-fill)" opacity="0.88" filter="url(#shadow)" />
  <text x="485.16129" y="287.903272" font-family="Arial,sans-serif" font-size="19.029587" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integration</text>
  <text x="485.16129" y="311.290272" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--warn-accent)" text-anchor="middle">SparkSession · Small real data</text>
  <polygon points="175.483871,386.129184 40,554.516329 930.322581,554.516329 794.83871,386.129184" fill="var(--ok-fill)" opacity="0.88" filter="url(#shadow)" />
  <text x="485.16129" y="465.645194" font-family="Arial,sans-serif" font-size="20.932481" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unit Tests</text>
  <text x="485.16129" y="492.774337" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--ok-accent)" text-anchor="middle">Pure Python/Scala functions · No Spark · Fastest</text>
  <text x="69.032258" y="199.032252" font-family="Arial,sans-serif" font-size="13.32058" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Slow</text>
  <text x="69.032258" y="217.742039" font-family="Arial,sans-serif" font-size="11.417796" fill="var(--text-faint)" text-anchor="middle">Few</text>
  <line x1="69.032258" y1="227.096699" x2="69.032258" y2="517.096873" stroke="var(--border)" stroke-width="1.7778" />
  <text x="69.032258" y="531.129097" font-family="Arial,sans-serif" font-size="13.32058" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Fast</text>
  <text x="69.032258" y="547.032276" font-family="Arial,sans-serif" font-size="11.417796" fill="var(--text-faint)" text-anchor="middle">Many</text>
  <rect x="978.709677" y="386.129184" width="261.290323" height="159.032252" fill="var(--ok-fill)" rx="6.569251" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="978.709677" y="386.129184" width="261.290323" height="33.677429" fill="var(--ok-fill)" rx="6.569251" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="978.709677" y="404.838738" width="261.290323" height="14.967759" fill="var(--ok-fill)" rx="6.569251" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.354839" y="408.580765" font-family="Arial,sans-serif" font-size="14.272136" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unit Test Tools</text>
  <text x="998.064516" y="440.387122" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">pytest — test runner</text>
  <text x="998.064516" y="459.096908" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">pytest-mock — mock objects</text>
  <text x="998.064516" y="477.806578" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">Pure functions (no SparkSession)</text>
  <text x="998.064516" y="496.516132" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">UDF logic tested in isolation</text>
  <text x="998.064516" y="515.225918" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">Runs in ms — run on every save</text>
  <line x1="930.322581" y1="470.322757" x2="978.709677" y2="470.322757" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="978.709677" y="208.387145" width="261.290323" height="159.032252" fill="var(--warn-fill)" rx="6.569251" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="978.709677" y="208.387145" width="261.290323" height="33.677429" fill="var(--warn-fill)" rx="6.569251" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="978.709677" y="227.096699" width="261.290323" height="14.967759" fill="var(--warn-fill)" rx="6.569251" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.354839" y="230.838726" font-family="Arial,sans-serif" font-size="14.272136" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integration Test Tools</text>
  <text x="998.064516" y="262.6452" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">SparkSession (local[*])</text>
  <text x="998.064516" y="281.35487" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">chispa — DataFrame equality</text>
  <text x="998.064516" y="300.06454" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">pytest fixtures / conftest.py</text>
  <text x="998.064516" y="318.774326" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">Small synthetic datasets</text>
  <text x="998.064516" y="337.48388" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">Runs in seconds</text>
  <line x1="794.83871" y1="292.580718" x2="978.709677" y2="287.903272" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="978.709677" y="40" width="261.290323" height="149.677476" fill="var(--danger-fill)" rx="6.569251" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="978.709677" y="40" width="261.290323" height="33.677429" fill="var(--danger-fill)" rx="6.569251" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="978.709677" y="58.709554" width="261.290323" height="14.967759" fill="var(--danger-fill)" rx="6.569251" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.354839" y="62.451581" font-family="Arial,sans-serif" font-size="14.272136" font-weight="bold" fill="var(--bg)" text-anchor="middle">E2E / CI Tools</text>
  <text x="998.064516" y="94.258054" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">GitHub Actions / Jenkins</text>
  <text x="998.064516" y="112.967724" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">Full cluster or Docker Spark</text>
  <text x="998.064516" y="131.677394" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">Real data sources (S3, HDFS)</text>
  <text x="998.064516" y="150.38718" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">pylint · mypy · black (lint)</text>
  <text x="998.064516" y="169.096734" font-family="Arial,sans-serif" font-size="12.369243" fill="var(--text)">Runs in minutes — CI gated</text>
  <line x1="659.354839" y1="124.193573" x2="978.709677" y2="114.83868" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="40" y="573.225883" width="919.354735" height="46.774117" fill="var(--primary-fill)" rx="6.569251" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="480.322581" y="593.806625" font-family="Arial,sans-serif" font-size="12.369243" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Testing ratio guideline: ~70% unit · ~20% integration · ~10% end-to-end</text>
  <text x="480.322581" y="610.645339" font-family="Arial,sans-serif" font-size="11.417796" fill="var(--text-muted)" text-anchor="middle">Design transformations as pure functions to maximize unit-testable code</text>
</svg>
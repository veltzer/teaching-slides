<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Pyramid: 3 tiers, centered around x=480 -->
  <!-- Tier 3 (top): End-to-End  -->
  <polygon points="480,40 300,200 660,200" fill="#e53935" opacity="0.88" filter="url(#shadow)"/>
  <text x="480" y="125" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">End-to-End</text>
  <text x="480" y="148" font-family="Arial,sans-serif" font-size="13" fill="#ffcccc" text-anchor="middle">Full pipeline · Slowest</text>

  <!-- Tier 2: Integration -->
  <polygon points="300,210 160,390 800,390 660,210" fill="#fb8c00" opacity="0.88" filter="url(#shadow)"/>
  <text x="480" y="295" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Integration</text>
  <text x="480" y="320" font-family="Arial,sans-serif" font-size="13" fill="#ffe0b2" text-anchor="middle">SparkSession · Small real data</text>

  <!-- Tier 1: Unit (base, widest) -->
  <polygon points="160,400 20,580 940,580 800,400" fill="#43a047" opacity="0.88" filter="url(#shadow)"/>
  <text x="480" y="485" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Unit Tests</text>
  <text x="480" y="514" font-family="Arial,sans-serif" font-size="13" fill="#c8e6c9" text-anchor="middle">Pure Python/Scala functions · No Spark · Fastest</text>

  <!-- Speed / Volume labels -->
  <text x="50" y="200" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e53935" text-anchor="middle">Slow</text>
  <text x="50" y="220" font-family="Arial,sans-serif" font-size="12" fill="#888888" text-anchor="middle">Few</text>
  <line x1="50" y1="230" x2="50" y2="540" stroke="#cccccc" stroke-width="2"/>
  <text x="50" y="555" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#43a047" text-anchor="middle">Fast</text>
  <text x="50" y="572" font-family="Arial,sans-serif" font-size="12" fill="#888888" text-anchor="middle">Many</text>

  <!-- Tool panels on right -->
  <!-- Unit tools -->
  <rect x="990" y="400" width="270" height="170" fill="#e8f5e9" rx="10" filter="url(#shadow)"/>
  <rect x="990" y="400" width="270" height="36" fill="#43a047" rx="10"/>
  <rect x="990" y="420" width="270" height="16" fill="#43a047"/>
  <text x="1125" y="424" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Unit Test Tools</text>
  <text x="1010" y="458" font-family="Arial,sans-serif" font-size="13" fill="#333333">pytest — test runner</text>
  <text x="1010" y="478" font-family="Arial,sans-serif" font-size="13" fill="#333333">pytest-mock — mock objects</text>
  <text x="1010" y="498" font-family="Arial,sans-serif" font-size="13" fill="#333333">Pure functions (no SparkSession)</text>
  <text x="1010" y="518" font-family="Arial,sans-serif" font-size="13" fill="#333333">UDF logic tested in isolation</text>
  <text x="1010" y="538" font-family="Arial,sans-serif" font-size="13" fill="#333333">Runs in ms — run on every save</text>
  <!-- line connecting to pyramid -->
  <line x1="940" y1="490" x2="990" y2="490" stroke="#43a047" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Integration tools -->
  <rect x="990" y="210" width="270" height="170" fill="#fff3e0" rx="10" filter="url(#shadow)"/>
  <rect x="990" y="210" width="270" height="36" fill="#fb8c00" rx="10"/>
  <rect x="990" y="230" width="270" height="16" fill="#fb8c00"/>
  <text x="1125" y="234" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Integration Test Tools</text>
  <text x="1010" y="268" font-family="Arial,sans-serif" font-size="13" fill="#333333">SparkSession (local[*])</text>
  <text x="1010" y="288" font-family="Arial,sans-serif" font-size="13" fill="#333333">chispa — DataFrame equality</text>
  <text x="1010" y="308" font-family="Arial,sans-serif" font-size="13" fill="#333333">pytest fixtures / conftest.py</text>
  <text x="1010" y="328" font-family="Arial,sans-serif" font-size="13" fill="#333333">Small synthetic datasets</text>
  <text x="1010" y="348" font-family="Arial,sans-serif" font-size="13" fill="#333333">Runs in seconds</text>
  <!-- line -->
  <line x1="800" y1="300" x2="990" y2="295" stroke="#fb8c00" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- E2E tools -->
  <rect x="990" y="30" width="270" height="160" fill="#ffebee" rx="10" filter="url(#shadow)"/>
  <rect x="990" y="30" width="270" height="36" fill="#e53935" rx="10"/>
  <rect x="990" y="50" width="270" height="16" fill="#e53935"/>
  <text x="1125" y="54" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">E2E / CI Tools</text>
  <text x="1010" y="88" font-family="Arial,sans-serif" font-size="13" fill="#333333">GitHub Actions / Jenkins</text>
  <text x="1010" y="108" font-family="Arial,sans-serif" font-size="13" fill="#333333">Full cluster or Docker Spark</text>
  <text x="1010" y="128" font-family="Arial,sans-serif" font-size="13" fill="#333333">Real data sources (S3, HDFS)</text>
  <text x="1010" y="148" font-family="Arial,sans-serif" font-size="13" fill="#333333">pylint · mypy · black (lint)</text>
  <text x="1010" y="168" font-family="Arial,sans-serif" font-size="13" fill="#333333">Runs in minutes — CI gated</text>
  <!-- line -->
  <line x1="660" y1="120" x2="990" y2="110" stroke="#e53935" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Bottom bar -->
  <rect x="20" y="600" width="950" height="50" fill="#e3f2fd" rx="8" filter="url(#shadow)"/>
  <text x="475" y="622" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle">Testing ratio guideline: ~70% unit · ~20% integration · ~10% end-to-end</text>
  <text x="475" y="640" font-family="Arial,sans-serif" font-size="12" fill="#555555" text-anchor="middle">Design transformations as pure functions to maximize unit-testable code</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <polygon points="426.6667,35.5556 266.6667,177.7778 586.6667,177.7778" fill="var(--danger-fill)" opacity="0.88" filter="url(#shadow)" />
  <text x="426.6667" y="111.1111" font-family="Arial,sans-serif" font-size="16.8889" font-weight="bold" fill="var(--bg)" text-anchor="middle">End-to-End</text>
  <text x="426.6667" y="131.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--danger-accent)" text-anchor="middle">Full pipeline · Slowest</text>
  <polygon points="266.6667,186.6667 142.2222,346.6667 711.1111,346.6667 586.6667,186.6667" fill="var(--warn-fill)" opacity="0.88" filter="url(#shadow)" />
  <text x="426.6667" y="262.2222" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integration</text>
  <text x="426.6667" y="284.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--warn-accent)" text-anchor="middle">SparkSession · Small real data</text>
  <polygon points="142.2222,355.5556 17.7778,515.5556 835.5556,515.5556 711.1111,355.5556" fill="var(--ok-fill)" opacity="0.88" filter="url(#shadow)" />
  <text x="426.6667" y="431.1111" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unit Tests</text>
  <text x="426.6667" y="456.8889" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--ok-accent)" text-anchor="middle">Pure Python/Scala functions · No Spark · Fastest</text>
  <text x="44.4444" y="177.7778" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)" text-anchor="middle">Slow</text>
  <text x="44.4444" y="195.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-faint)" text-anchor="middle">Few</text>
  <line x1="44.4444" y1="204.4444" x2="44.4444" y2="480" stroke="var(--border)" stroke-width="1.7778" />
  <text x="44.4444" y="493.3333" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">Fast</text>
  <text x="44.4444" y="508.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-faint)" text-anchor="middle">Many</text>
  <rect x="880" y="355.5556" width="240" height="151.1111" fill="var(--ok-fill)" rx="6" filter="url(#shadow)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="880" y="355.5556" width="240" height="32" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="880" y="373.3333" width="240" height="14.2222" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1000" y="376.8889" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">Unit Test Tools</text>
  <text x="897.7778" y="407.1111" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">pytest — test runner</text>
  <text x="897.7778" y="424.8889" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">pytest-mock — mock objects</text>
  <text x="897.7778" y="442.6667" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Pure functions (no SparkSession)</text>
  <text x="897.7778" y="460.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">UDF logic tested in isolation</text>
  <text x="897.7778" y="478.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Runs in ms — run on every save</text>
  <line x1="835.5556" y1="435.5556" x2="880" y2="435.5556" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="880" y="186.6667" width="240" height="151.1111" fill="var(--warn-fill)" rx="6" filter="url(#shadow)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="880" y="186.6667" width="240" height="32" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="880" y="204.4444" width="240" height="14.2222" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1000" y="208" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">Integration Test Tools</text>
  <text x="897.7778" y="238.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">SparkSession (local[*])</text>
  <text x="897.7778" y="256" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">chispa — DataFrame equality</text>
  <text x="897.7778" y="273.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">pytest fixtures / conftest.py</text>
  <text x="897.7778" y="291.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Small synthetic datasets</text>
  <text x="897.7778" y="309.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Runs in seconds</text>
  <line x1="711.1111" y1="266.6667" x2="880" y2="262.2222" stroke="var(--warn-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="880" y="26.6667" width="240" height="142.2222" fill="var(--danger-fill)" rx="6" filter="url(#shadow)" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="880" y="26.6667" width="240" height="32" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="880" y="44.4444" width="240" height="14.2222" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1000" y="48" font-family="Arial,sans-serif" font-size="13.3333" font-weight="bold" fill="var(--bg)" text-anchor="middle">E2E / CI Tools</text>
  <text x="897.7778" y="78.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">GitHub Actions / Jenkins</text>
  <text x="897.7778" y="96" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Full cluster or Docker Spark</text>
  <text x="897.7778" y="113.7778" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Real data sources (S3, HDFS)</text>
  <text x="897.7778" y="131.5556" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">pylint · mypy · black (lint)</text>
  <text x="897.7778" y="149.3333" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Runs in minutes — CI gated</text>
  <line x1="586.6667" y1="106.6667" x2="880" y2="97.7778" stroke="var(--danger-border)" stroke-width="1.7778" stroke-dasharray="5.3333 2.6667" marker-end="url(#arrow)" />
  <rect x="17.7778" y="533.3333" width="844.4444" height="44.4444" fill="var(--primary-fill)" rx="6" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="422.2222" y="552.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Testing ratio guideline: ~70% unit · ~20% integration · ~10% end-to-end</text>
  <text x="422.2222" y="568.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)" text-anchor="middle">Design transformations as pure functions to maximize unit-testable code</text>
</svg>
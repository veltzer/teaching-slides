<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="45" text-anchor="middle" font-size="28.8" font-weight="bold" fill="#333">PySpark Testing Pyramid</text>
  <polygon points="640,81 1163.6364,666 116.3636,666" fill="none" stroke="#4a90e2" stroke-width="3.6" />
  <rect x="407.2727" y="108" width="465.4545" height="126" rx="9" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7" />
  <text x="640" y="153" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#dc3545">E2E / Smoke Tests</text>
  <text x="640" y="183.6" text-anchor="middle" font-size="18" fill="#333">Full cluster, real data</text>
  <text x="640" y="212.4" text-anchor="middle" font-size="18" fill="#666">Few tests, slow, high cost</text>
  <rect x="305.4545" y="261" width="669.0909" height="144" rx="9" fill="#fff3cd" stroke="#ffc107" stroke-width="2.7" />
  <text x="640" y="306" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#bf360c">Integration Tests</text>
  <text x="640" y="338.4" text-anchor="middle" font-size="18" fill="#333">Local Spark, real I/O, small datasets</text>
  <text x="640" y="369" text-anchor="middle" font-size="18" fill="#666">Medium count, medium speed</text>
  <rect x="189.0909" y="432" width="901.8182" height="198" rx="9" fill="#d4edda" stroke="#28a745" stroke-width="2.7" />
  <text x="640" y="486" text-anchor="middle" font-size="23.4" font-weight="bold" fill="#28a745">Unit Tests</text>
  <text x="640" y="522" text-anchor="middle" font-size="18" fill="#333">Local Spark, in-memory data, mocked sources</text>
  <text x="640" y="558" text-anchor="middle" font-size="18" fill="#666">Many tests, fast, low cost</text>
</svg>
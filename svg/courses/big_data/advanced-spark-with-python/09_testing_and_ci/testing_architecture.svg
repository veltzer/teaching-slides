<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" font-family="Arial, sans-serif">
  <text x="220" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">PySpark Testing Pyramid</text>
  <polygon points="220,45 400,370 40,370" fill="none" stroke="#4a90e2" stroke-width="2"/>
  <rect x="140" y="60" width="160" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="220" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">E2E / Smoke Tests</text>
  <text x="220" y="102" text-anchor="middle" font-size="10" fill="#333">Full cluster, real data</text>
  <text x="220" y="118" text-anchor="middle" font-size="10" fill="#666">Few tests, slow, high cost</text>
  <rect x="105" y="145" width="230" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="220" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">Integration Tests</text>
  <text x="220" y="188" text-anchor="middle" font-size="10" fill="#333">Local Spark, real I/O, small datasets</text>
  <text x="220" y="205" text-anchor="middle" font-size="10" fill="#666">Medium count, medium speed</text>
  <rect x="65" y="240" width="310" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="220" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Unit Tests</text>
  <text x="220" y="290" text-anchor="middle" font-size="10" fill="#333">Local Spark, in-memory data, mocked sources</text>
  <text x="220" y="310" text-anchor="middle" font-size="10" fill="#666">Many tests, fast, low cost</text>
</svg>

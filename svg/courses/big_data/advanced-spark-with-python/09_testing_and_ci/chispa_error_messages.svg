<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Arial, sans-serif">
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Chispa Error Messages</text>
  <rect x="10" y="45" width="580" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="20" y="65" font-size="13" fill="#333">assert_df_equality(df1, df2) → chispa.DataFramesNotEqualError</text>
  <rect x="10" y="90" width="280" height="200" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="150" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Left DataFrame</text>
  <line x1="30" y1="125" x2="270" y2="125" stroke="#dc3545" stroke-width="1"/>
  <text x="40" y="145" font-size="12" font-family="monospace" fill="#333">id  | value</text>
  <line x1="30" y1="152" x2="270" y2="152" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="170" font-size="12" font-family="monospace" fill="#333"> 1  |  10.0</text>
  <rect x="230" y="158" width="50" height="18" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="235" y="172" font-size="9" fill="#28a745">match</text>
  <text x="40" y="195" font-size="12" font-family="monospace" fill="#333"> 2  |  20.0</text>
  <rect x="210" y="183" width="70" height="18" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="215" y="197" font-size="9" fill="#856404">LEFT ONLY</text>
  <rect x="310" y="90" width="280" height="200" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Right DataFrame</text>
  <line x1="330" y1="125" x2="570" y2="125" stroke="#dc3545" stroke-width="1"/>
  <text x="340" y="145" font-size="12" font-family="monospace" fill="#333">id  | value</text>
  <line x1="330" y1="152" x2="570" y2="152" stroke="#ccc" stroke-width="1"/>
  <text x="340" y="170" font-size="12" font-family="monospace" fill="#333"> 1  |  10.0</text>
  <rect x="530" y="158" width="50" height="18" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="535" y="172" font-size="9" fill="#28a745">match</text>
  <text x="340" y="195" font-size="12" font-family="monospace" fill="#333"> 2  |  25.0</text>
  <rect x="505" y="183" width="75" height="18" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="510" y="197" font-size="9" fill="#856404">RIGHT ONLY</text>
  <rect x="10" y="310" width="580" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="340" text-anchor="middle" font-size="13" fill="#333">This makes debugging test failures much easier</text>
  <text x="300" y="360" text-anchor="middle" font-size="13" fill="#333">than cryptic assertion errors.</text>
</svg>

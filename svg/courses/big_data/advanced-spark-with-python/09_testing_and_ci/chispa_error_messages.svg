<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="Arial, sans-serif">
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Chispa Error Messages</text>
  <rect x="10" y="45" width="620" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="20" y="65" font-size="13" fill="#333">assert_df_equality(df1, df2) → chispa.DataFramesNotEqualError</text>
  <rect x="10" y="90" width="300" height="220" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="160" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Left DataFrame</text>
  <line x1="30" y1="125" x2="290" y2="125" stroke="#dc3545" stroke-width="1"/>
  <text x="40" y="148" font-size="12" font-family="monospace" fill="#333">id  | value</text>
  <line x1="30" y1="157" x2="290" y2="157" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="180" font-size="12" font-family="monospace" fill="#333"> 1  |  10.0</text>
  <rect x="240" y="168" width="50" height="18" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="245" y="182" font-size="9" fill="#28a745">match</text>
  <text x="40" y="210" font-size="12" font-family="monospace" fill="#333"> 2  |  20.0</text>
  <rect x="220" y="198" width="70" height="18" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="225" y="212" font-size="9" fill="#856404">LEFT ONLY</text>
  <rect x="330" y="90" width="300" height="220" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="480" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Right DataFrame</text>
  <line x1="350" y1="125" x2="610" y2="125" stroke="#dc3545" stroke-width="1"/>
  <text x="360" y="148" font-size="12" font-family="monospace" fill="#333">id  | value</text>
  <line x1="350" y1="157" x2="610" y2="157" stroke="#ccc" stroke-width="1"/>
  <text x="360" y="180" font-size="12" font-family="monospace" fill="#333"> 1  |  10.0</text>
  <rect x="560" y="168" width="50" height="18" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="565" y="182" font-size="9" fill="#28a745">match</text>
  <text x="360" y="210" font-size="12" font-family="monospace" fill="#333"> 2  |  25.0</text>
  <rect x="535" y="198" width="75" height="18" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="540" y="212" font-size="9" fill="#856404">RIGHT ONLY</text>
  <rect x="10" y="330" width="620" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="320" y="360" text-anchor="middle" font-size="13" fill="#333">This makes debugging test failures much easier</text>
  <text x="320" y="380" text-anchor="middle" font-size="13" fill="#333">than cryptic assertion errors.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="23.0691" font-weight="bold" fill="var(--text)">Chispa Error Messages</text>
  <rect x="40" y="64.1667" width="1200" height="48.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="59.3548" y="96.3889" font-size="18.7437" fill="var(--text)">assert_df_equality(df1, df2) → chispa.DataFramesNotEqualError</text>
  <rect x="40" y="136.6667" width="580.6452" height="354.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="330.3226" y="176.9444" text-anchor="middle" font-size="20.1856" font-weight="bold" fill="var(--danger-accent)">Left DataFrame</text>
  <line x1="78.7097" y1="193.0556" x2="581.9355" y2="193.0556" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="98.0645" y="230.1111" font-size="17.3019" font-family="monospace" fill="var(--text)">id  | value</text>
  <line x1="78.7097" y1="244.6111" x2="581.9355" y2="244.6111" stroke="var(--border)" stroke-width="1.3333" />
  <text x="98.0645" y="281.6667" font-size="17.3019" font-family="monospace" fill="var(--text)"> 1  |  10.0</text>
  <rect x="485.1613" y="262.3333" width="96.7742" height="29" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="494.8387" y="284.8889" font-size="14.4182" fill="var(--ok-accent)">match</text>
  <text x="98.0645" y="330" font-size="17.3019" font-family="monospace" fill="var(--text)"> 2  |  20.0</text>
  <rect x="446.4516" y="310.6667" width="135.4839" height="29" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="456.129" y="333.2223" font-size="14.4182" fill="var(--danger-accent)">LEFT ONLY</text>
  <rect x="659.3548" y="136.6667" width="580.6452" height="354.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="949.6774" y="176.9444" text-anchor="middle" font-size="20.1856" font-weight="bold" fill="var(--danger-accent)">Right DataFrame</text>
  <line x1="698.0645" y1="193.0556" x2="1201.2903" y2="193.0556" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="717.4194" y="230.1111" font-size="17.3019" font-family="monospace" fill="var(--text)">id  | value</text>
  <line x1="698.0645" y1="244.6111" x2="1201.2903" y2="244.6111" stroke="var(--border)" stroke-width="1.3333" />
  <text x="717.4194" y="281.6667" font-size="17.3019" font-family="monospace" fill="var(--text)"> 1  |  10.0</text>
  <rect x="1104.5161" y="262.3333" width="96.7742" height="29" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1114.1935" y="284.8889" font-size="14.4182" fill="var(--ok-accent)">match</text>
  <text x="717.4194" y="330" font-size="17.3019" font-family="monospace" fill="var(--text)"> 2  |  25.0</text>
  <rect x="1056.129" y="310.6667" width="145.1613" height="29" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1065.8065" y="333.2223" font-size="14.4182" fill="var(--danger-accent)">RIGHT ONLY</text>
  <rect x="40" y="523.3333" width="1200" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="571.6667" text-anchor="middle" font-size="18.7437" fill="var(--text)">This makes debugging test failures much easier</text>
  <text x="640" y="603.8889" text-anchor="middle" font-size="18.7437" fill="var(--text)">than cryptic assertion errors.</text>
</svg>
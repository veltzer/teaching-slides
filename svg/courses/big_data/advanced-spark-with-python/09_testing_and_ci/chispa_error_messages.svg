<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <text x="640" y="40" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#333">Chispa Error Messages</text>
  <rect x="20" y="60" width="1240" height="40" rx="6.6667" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.6667" />
  <text x="40" y="86.6667" font-size="17.3333" fill="#333">assert_df_equality(df1, df2) → chispa.DataFramesNotEqualError</text>
  <rect x="20" y="120" width="600" height="293.3333" rx="6.6667" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6667" />
  <text x="320" y="153.3333" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="#dc3545">Left DataFrame</text>
  <line x1="60" y1="166.6667" x2="580" y2="166.6667" stroke="#dc3545" stroke-width="1.3333" />
  <text x="80" y="197.3333" font-size="16" font-family="monospace" fill="#333">id  | value</text>
  <line x1="60" y1="209.3333" x2="580" y2="209.3333" stroke="#ccc" stroke-width="1.3333" />
  <text x="80" y="240" font-size="16" font-family="monospace" fill="#333"> 1  |  10.0</text>
  <rect x="480" y="224" width="100" height="24" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1.3333" />
  <text x="490" y="242.6667" font-size="13.3333" fill="#28a745">match</text>
  <text x="80" y="280" font-size="16" font-family="monospace" fill="#333"> 2  |  20.0</text>
  <rect x="440" y="264" width="140" height="24" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1.3333" />
  <text x="450" y="282.6667" font-size="13.3333" fill="#bf360c">LEFT ONLY</text>
  <rect x="660" y="120" width="600" height="293.3333" rx="6.6667" fill="#f8d7da" stroke="#dc3545" stroke-width="2.6667" />
  <text x="960" y="153.3333" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="#dc3545">Right DataFrame</text>
  <line x1="700" y1="166.6667" x2="1220" y2="166.6667" stroke="#dc3545" stroke-width="1.3333" />
  <text x="720" y="197.3333" font-size="16" font-family="monospace" fill="#333">id  | value</text>
  <line x1="700" y1="209.3333" x2="1220" y2="209.3333" stroke="#ccc" stroke-width="1.3333" />
  <text x="720" y="240" font-size="16" font-family="monospace" fill="#333"> 1  |  10.0</text>
  <rect x="1120" y="224" width="100" height="24" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1.3333" />
  <text x="1130" y="242.6667" font-size="13.3333" fill="#28a745">match</text>
  <text x="720" y="280" font-size="16" font-family="monospace" fill="#333"> 2  |  25.0</text>
  <rect x="1070" y="264" width="150" height="24" rx="4" fill="#fff3cd" stroke="#ffc107" stroke-width="1.3333" />
  <text x="1080" y="282.6667" font-size="13.3333" fill="#bf360c">RIGHT ONLY</text>
  <rect x="20" y="440" width="1240" height="80" rx="6.6667" fill="#d4edda" stroke="#28a745" stroke-width="2.6667" />
  <text x="640" y="480" text-anchor="middle" font-size="17.3333" fill="#333">This makes debugging test failures much easier</text>
  <text x="640" y="506.6667" text-anchor="middle" font-size="17.3333" fill="#333">than cryptic assertion errors.</text>
</svg>
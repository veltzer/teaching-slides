<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Chispa Error Messages</text>
  <rect x="20" y="60" width="1240" height="40" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="40" y="86.6667" font-size="17.3333" fill="var(--text)">assert_df_equality(df1, df2) → chispa.DataFramesNotEqualError</text>
  <rect x="20" y="120" width="600" height="293.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="320" y="153.3333" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--danger-accent)">Left DataFrame</text>
  <line x1="60" y1="166.6667" x2="580" y2="166.6667" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="80" y="197.3333" font-size="16" font-family="monospace" fill="var(--text)">id  | value</text>
  <line x1="60" y1="209.3333" x2="580" y2="209.3333" stroke="var(--border)" stroke-width="1.3333" />
  <text x="80" y="240" font-size="16" font-family="monospace" fill="var(--text)"> 1  |  10.0</text>
  <rect x="480" y="224" width="100" height="24" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="490" y="242.6667" font-size="13.3333" fill="var(--ok-accent)">match</text>
  <text x="80" y="280" font-size="16" font-family="monospace" fill="var(--text)"> 2  |  20.0</text>
  <rect x="440" y="264" width="140" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="450" y="282.6667" font-size="13.3333" fill="var(--danger-accent)">LEFT ONLY</text>
  <rect x="660" y="120" width="600" height="293.3333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="960" y="153.3333" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--danger-accent)">Right DataFrame</text>
  <line x1="700" y1="166.6667" x2="1220" y2="166.6667" stroke="var(--danger-border)" stroke-width="1.3333" />
  <text x="720" y="197.3333" font-size="16" font-family="monospace" fill="var(--text)">id  | value</text>
  <line x1="700" y1="209.3333" x2="1220" y2="209.3333" stroke="var(--border)" stroke-width="1.3333" />
  <text x="720" y="240" font-size="16" font-family="monospace" fill="var(--text)"> 1  |  10.0</text>
  <rect x="1120" y="224" width="100" height="24" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1130" y="242.6667" font-size="13.3333" fill="var(--ok-accent)">match</text>
  <text x="720" y="280" font-size="16" font-family="monospace" fill="var(--text)"> 2  |  25.0</text>
  <rect x="1070" y="264" width="150" height="24" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1080" y="282.6667" font-size="13.3333" fill="var(--danger-accent)">RIGHT ONLY</text>
  <rect x="20" y="440" width="1240" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="480" text-anchor="middle" font-size="17.3333" fill="var(--text)">This makes debugging test failures much easier</text>
  <text x="640" y="506.6667" text-anchor="middle" font-size="17.3333" fill="var(--text)">than cryptic assertion errors.</text>
</svg>
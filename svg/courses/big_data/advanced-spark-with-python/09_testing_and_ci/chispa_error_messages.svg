<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="23.0691" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Chispa Error Messages</text>
  <rect x="40" y="64.1667" width="1200" height="48.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="59.3548" y="96.3889" font-size="18.7437" fill="var(--text)" font-family="Arial, sans-serif">assert_df_equality(df1, df2) → chispa.DataFramesNotEqualError</text>
  <rect x="40" y="136.6667" width="580.6452" height="354.4444" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.3226" y="176.9444" text-anchor="middle" font-size="20.1856" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Left DataFrame</text>
  <line x1="78.7097" y1="193.0556" x2="581.9355" y2="193.0556" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="98.0645" y="230.1111" font-size="17.3019" fill="var(--text)" font-family="Courier New, monospace">id  | value</text>
  <line x1="78.7097" y1="244.6111" x2="581.9355" y2="244.6111" stroke="var(--border)" stroke-width="1.3333"/>
  <text x="98.0645" y="281.6667" font-size="17.3019" fill="var(--text)" font-family="Courier New, monospace"> 1  |  10.0</text>
  <rect x="485.1613" y="262.3333" width="96.7742" height="29" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="494.8387" y="284.8889" font-size="14.4182" fill="var(--ok-accent)" font-family="Arial, sans-serif">match</text>
  <text x="98.0645" y="330" font-size="17.3019" fill="var(--text)" font-family="Courier New, monospace"> 2  |  20.0</text>
  <rect x="446.4516" y="310.6667" width="135.4839" height="29" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="456.129" y="333.2223" font-size="14.4182" fill="var(--danger-accent)" font-family="Arial, sans-serif">LEFT ONLY</text>
  <rect x="659.3548" y="136.6667" width="580.6452" height="354.4444" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.6774" y="176.9444" text-anchor="middle" font-size="20.1856" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Right DataFrame</text>
  <line x1="698.0645" y1="193.0556" x2="1201.2903" y2="193.0556" stroke="var(--danger-border)" stroke-width="1.3333"/>
  <text x="717.4194" y="230.1111" font-size="17.3019" fill="var(--text)" font-family="Courier New, monospace">id  | value</text>
  <line x1="698.0645" y1="244.6111" x2="1201.2903" y2="244.6111" stroke="var(--border)" stroke-width="1.3333"/>
  <text x="717.4194" y="281.6667" font-size="17.3019" fill="var(--text)" font-family="Courier New, monospace"> 1  |  10.0</text>
  <rect x="1104.5161" y="262.3333" width="96.7742" height="29" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.1935" y="284.8889" font-size="14.4182" fill="var(--ok-accent)" font-family="Arial, sans-serif">match</text>
  <text x="717.4194" y="330" font-size="17.3019" fill="var(--text)" font-family="Courier New, monospace"> 2  |  25.0</text>
  <rect x="1056.129" y="310.6667" width="145.1613" height="29" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1065.8065" y="333.2223" font-size="14.4182" fill="var(--danger-accent)" font-family="Arial, sans-serif">RIGHT ONLY</text>
  <rect x="40" y="523.3333" width="1200" height="96.6667" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="571.6667" text-anchor="middle" font-size="18.7437" fill="var(--text)" font-family="Arial, sans-serif">This makes debugging test failures much easier</text>
  <text x="640" y="603.8889" text-anchor="middle" font-size="18.7437" fill="var(--text)" font-family="Arial, sans-serif">than cryptic assertion errors.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="20.496" font-weight="bold" fill="var(--text)">CI/CD Pipeline for Spark Jobs</text>
  <rect x="457.3912" y="52.4731" width="365.2174" height="49.8925" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="83.6559" text-anchor="middle" font-size="16.6529" fill="var(--text)">Push / PR</text>
  <line x1="639.9999" y1="102.3655" x2="639.9999" y2="127.3118" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="127.3118" width="1200" height="99.7849" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="152.258" text-anchor="middle" font-size="16.6529" font-weight="bold" fill="var(--primary-accent)">Stage 1: Code Quality (parallel)</text>
  <rect x="105.2173" y="164.7312" width="260.8695" height="43.6559" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235.6521" y="192.1721" text-anchor="middle" font-size="15.372" fill="var(--text)">pylint</text>
  <rect x="418.2608" y="164.7312" width="260.8695" height="43.6559" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="548.6956" y="192.1721" text-anchor="middle" font-size="15.372" fill="var(--text)">black</text>
  <rect x="731.3042" y="164.7312" width="260.8695" height="43.6559" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.7391" y="192.1721" text-anchor="middle" font-size="15.372" fill="var(--text)">mypy</text>
  <line x1="639.9999" y1="227.0968" x2="639.9999" y2="258.2796" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="258.2796" width="1200" height="99.7849" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="283.2258" text-anchor="middle" font-size="16.6529" font-weight="bold" fill="var(--primary-accent)">Stage 2: Unit Tests</text>
  <text x="639.9999" y="308.172" text-anchor="middle" font-size="15.372" fill="var(--text)">pytest tests/unit/ --cov=src</text>
  <text x="639.9999" y="330.6237" text-anchor="middle" font-size="14.091" fill="var(--text-muted)">(local Spark, fast, no I/O)</text>
  <line x1="639.9999" y1="358.0645" x2="639.9999" y2="389.2474" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="389.2474" width="1200" height="99.7849" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="414.1936" text-anchor="middle" font-size="16.6529" font-weight="bold" fill="var(--primary-accent)">Stage 3: Integration Tests</text>
  <text x="639.9999" y="439.1399" text-anchor="middle" font-size="15.372" fill="var(--text)">pytest tests/integration/</text>
  <text x="639.9999" y="461.5914" text-anchor="middle" font-size="14.091" fill="var(--text-muted)">(local Spark, file I/O)</text>
  <line x1="639.9999" y1="489.0323" x2="639.9999" y2="520.2151" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="520.2151" width="1200" height="99.7849" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="545.1613" text-anchor="middle" font-size="16.6529" font-weight="bold" fill="var(--ok-accent)">Stage 4: Package &amp; Publish</text>
  <text x="639.9999" y="570.1076" text-anchor="middle" font-size="15.372" fill="var(--text)">Build wheel, push to artifact registry</text>
  <text x="639.9999" y="592.5592" text-anchor="middle" font-size="14.091" fill="var(--text-muted)">(only on main branch)</text>
</svg>
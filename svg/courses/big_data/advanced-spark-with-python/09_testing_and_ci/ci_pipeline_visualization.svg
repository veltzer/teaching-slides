<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="31.0345" text-anchor="middle" font-size="19.8621" font-weight="bold" fill="var(--text)">CI/CD Pipeline for Spark Jobs</text>
  <rect x="467.6923" y="43.4483" width="344.6154" height="49.6552" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="74.4828" text-anchor="middle" font-size="16.1379" fill="var(--text)">Push / PR</text>
  <line x1="640" y1="93.1034" x2="640" y2="117.931" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="73.8462" y="117.931" width="1132.3077" height="99.3103" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="142.7586" text-anchor="middle" font-size="16.1379" font-weight="bold" fill="var(--primary-accent)">Stage 1: Code Quality (parallel)</text>
  <rect x="135.3846" y="155.1724" width="246.1538" height="43.4483" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="258.4615" y="182.4828" text-anchor="middle" font-size="14.8966" fill="var(--text)">pylint</text>
  <rect x="430.7692" y="155.1724" width="246.1538" height="43.4483" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="553.8462" y="182.4828" text-anchor="middle" font-size="14.8966" fill="var(--text)">black</text>
  <rect x="726.1538" y="155.1724" width="246.1538" height="43.4483" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="849.2308" y="182.4828" text-anchor="middle" font-size="14.8966" fill="var(--text)">mypy</text>
  <line x1="640" y1="217.2414" x2="640" y2="248.2759" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="73.8462" y="248.2759" width="1132.3077" height="99.3103" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="273.1034" text-anchor="middle" font-size="16.1379" font-weight="bold" fill="var(--primary-accent)">Stage 2: Unit Tests</text>
  <text x="640" y="297.931" text-anchor="middle" font-size="14.8966" fill="var(--text)">pytest tests/unit/ --cov=src</text>
  <text x="640" y="320.2759" text-anchor="middle" font-size="13.6552" fill="var(--text-muted)">(local Spark, fast, no I/O)</text>
  <line x1="640" y1="347.5862" x2="640" y2="378.6207" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="73.8462" y="378.6207" width="1132.3077" height="99.3103" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="403.4483" text-anchor="middle" font-size="16.1379" font-weight="bold" fill="var(--primary-accent)">Stage 3: Integration Tests</text>
  <text x="640" y="428.2759" text-anchor="middle" font-size="14.8966" fill="var(--text)">pytest tests/integration/</text>
  <text x="640" y="450.6207" text-anchor="middle" font-size="13.6552" fill="var(--text-muted)">(local Spark, file I/O)</text>
  <line x1="640" y1="477.931" x2="640" y2="508.9655" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="73.8462" y="508.9655" width="1132.3077" height="99.3103" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="533.7931" text-anchor="middle" font-size="16.1379" font-weight="bold" fill="var(--ok-accent)">Stage 4: Package &amp; Publish</text>
  <text x="640" y="558.6207" text-anchor="middle" font-size="14.8966" fill="var(--text)">Build wheel, push to artifact registry</text>
  <text x="640" y="580.9655" text-anchor="middle" font-size="13.6552" fill="var(--text-muted)">(only on main branch)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="20.496" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CI/CD Pipeline for Spark Jobs</text>
  <rect x="457.3912" y="52.4731" width="365.2174" height="49.8925" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="83.6559" text-anchor="middle" font-size="16.6529" fill="var(--text)" font-family="Arial, sans-serif">Push / PR</text>
  <line x1="639.9999" y1="102.3655" x2="639.9999" y2="127.3118" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="127.3118" width="1200" height="99.7849" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="152.258" text-anchor="middle" font-size="16.6529" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Stage 1: Code Quality (parallel)</text>
  <rect x="105.2173" y="164.7312" width="260.8695" height="43.6559" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235.6521" y="192.1721" text-anchor="middle" font-size="15.372" fill="var(--text)" font-family="Arial, sans-serif">pylint</text>
  <rect x="418.2608" y="164.7312" width="260.8695" height="43.6559" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="548.6956" y="192.1721" text-anchor="middle" font-size="15.372" fill="var(--text)" font-family="Arial, sans-serif">black</text>
  <rect x="731.3042" y="164.7312" width="260.8695" height="43.6559" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.7391" y="192.1721" text-anchor="middle" font-size="15.372" fill="var(--text)" font-family="Arial, sans-serif">mypy</text>
  <line x1="639.9999" y1="227.0968" x2="639.9999" y2="258.2796" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="258.2796" width="1200" height="99.7849" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="283.2258" text-anchor="middle" font-size="16.6529" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Stage 2: Unit Tests</text>
  <text x="639.9999" y="308.172" text-anchor="middle" font-size="15.372" fill="var(--text)" font-family="Arial, sans-serif">pytest tests/unit/ --cov=src</text>
  <text x="639.9999" y="330.6237" text-anchor="middle" font-size="14.091" fill="var(--text-muted)" font-family="Arial, sans-serif">(local Spark, fast, no I/O)</text>
  <line x1="639.9999" y1="358.0645" x2="639.9999" y2="389.2474" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="389.2474" width="1200" height="99.7849" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="414.1936" text-anchor="middle" font-size="16.6529" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Stage 3: Integration Tests</text>
  <text x="639.9999" y="439.1399" text-anchor="middle" font-size="15.372" fill="var(--text)" font-family="Arial, sans-serif">pytest tests/integration/</text>
  <text x="639.9999" y="461.5914" text-anchor="middle" font-size="14.091" fill="var(--text-muted)" font-family="Arial, sans-serif">(local Spark, file I/O)</text>
  <line x1="639.9999" y1="489.0323" x2="639.9999" y2="520.2151" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="520.2151" width="1200" height="99.7849" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="545.1613" text-anchor="middle" font-size="16.6529" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Stage 4: Package &amp; Publish</text>
  <text x="639.9999" y="570.1076" text-anchor="middle" font-size="15.372" fill="var(--text)" font-family="Arial, sans-serif">Build wheel, push to artifact registry</text>
  <text x="639.9999" y="592.5592" text-anchor="middle" font-size="14.091" fill="var(--text-muted)" font-family="Arial, sans-serif">(only on main branch)</text>
</svg>
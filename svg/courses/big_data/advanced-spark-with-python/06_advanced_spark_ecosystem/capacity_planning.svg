<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="270.1987" height="221.764649048446" rx="6.216675708426" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.0993" y="82.647134602072" text-anchor="middle" font-size="20.181712408574" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Workload Analysis</text>
  <text x="175.0993" y="121.882378200691" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Data volume (TB)</text>
  <text x="175.0993" y="152.588216349482" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Query complexity</text>
  <text x="175.0993" y="183.294161851209" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Concurrency level</text>
  <text x="175.0993" y="214" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">SLA requirements</text>
  <text x="175.0993" y="244.705945501727" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Peak vs average</text>
  <line x1="310.1986" y1="150.882378200691" x2="357.8808" y2="150.882378200691" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="365.8278" y="40" width="270.1987" height="221.764649048446" rx="6.216675708426" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500.9271" y="82.647134602072" text-anchor="middle" font-size="20.181712408574" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Resource Sizing</text>
  <text x="500.9271" y="121.882378200691" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Executor count</text>
  <text x="500.9271" y="152.588216349482" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Cores per executor</text>
  <text x="500.9271" y="183.294161851209" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Memory per executor</text>
  <text x="500.9271" y="214" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Driver resources</text>
  <text x="500.9271" y="244.705945501727" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Overhead (10%)</text>
  <line x1="636.0264" y1="150.882378200691" x2="683.7086" y2="150.882378200691" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="691.6556" y="40" width="270.1987" height="221.764649048446" rx="6.216675708426" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="826.7549" y="82.647134602072" text-anchor="middle" font-size="20.181712408574" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Cost Strategy</text>
  <text x="826.7549" y="121.882378200691" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">On-demand baseline</text>
  <text x="826.7549" y="152.588216349482" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Spot instances (70%)</text>
  <text x="826.7549" y="183.294161851209" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Reserved capacity</text>
  <text x="826.7549" y="214" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Auto-scaling rules</text>
  <text x="826.7549" y="244.705945501727" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Storage tiering</text>
  <line x1="961.8544" y1="150.882378200691" x2="1009.5364" y2="150.882378200691" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1017.4834" y="40" width="222.5166" height="221.764649048446" rx="6.216675708426" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.7418" y="82.647134602072" text-anchor="middle" font-size="20.181712408574" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Monitor</text>
  <text x="1128.7418" y="121.882378200691" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Utilization %</text>
  <text x="1128.7418" y="152.588216349482" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Cost per job</text>
  <text x="1128.7418" y="183.294161851209" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Performance</text>
  <text x="1128.7418" y="214" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Waste detection</text>
  <text x="1128.7418" y="244.705945501727" text-anchor="middle" font-size="17.076897337262" fill="var(--text)" font-family="Arial, sans-serif">Adjust &amp; repeat</text>
  <rect x="71.7881" y="321.470594550173" width="1112.5829" height="119.411783650518" rx="6.216675708426" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="628.0795" y="364.117621799309" text-anchor="middle" font-size="21.734223555492" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Sizing Guidelines</text>
  <text x="628.0795" y="415.294054498273" text-anchor="middle" font-size="18.629304872918" fill="var(--text)" font-family="Arial, sans-serif">Executors = DataSize / (PartitionSize x CoresPerExecutor) | Memory = 3-5x shuffle data | Cores: 4-5 per executor</text>
  <rect x="71.7881" y="475" width="524.5034" height="102.352972750863" rx="6.216675708426" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.0397" y="517.647027249136" text-anchor="middle" font-size="20.181712408574" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Short-term (3-6 months)</text>
  <text x="334.0397" y="556.882270847755" text-anchor="middle" font-size="18.629304872918" fill="var(--text)" font-family="Arial, sans-serif">Current load + 20% buffer</text>
  <rect x="643.9736" y="475" width="540.3974" height="102.352972750863" rx="6.216675708426" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="914.1722" y="517.647027249136" text-anchor="middle" font-size="20.181712408574" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Long-term (1-2 years)</text>
  <text x="914.1722" y="556.882270847755" text-anchor="middle" font-size="18.629304872918" fill="var(--text)" font-family="Arial, sans-serif">Projected growth + auto-scaling strategy</text>
  <text x="628.0795" y="620" text-anchor="middle" font-size="18.629304872918" fill="var(--text-muted)" font-family="Arial, sans-serif">Iterative capacity planning: measure, adjust, optimize</text>
</svg>

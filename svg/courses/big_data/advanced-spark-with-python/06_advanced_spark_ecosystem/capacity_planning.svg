  <text x="640" y="495" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#333">Executors = DataSize / (PartitionSize x CoresPerExecutor) | Memory = 3-5x shuffle data | Cores: 4-5 per executor</text>

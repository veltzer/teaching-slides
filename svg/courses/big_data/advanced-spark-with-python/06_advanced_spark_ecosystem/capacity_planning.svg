<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="576.09" y="48.6076" text-anchor="middle" font-family="Arial" font-size="25.9241" font-weight="bold" fill="var(--primary-accent)">Spark Capacity Planning</text>
  <rect x="43.2068" y="89.1139" width="244.8383" height="210.6329" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.6259" y="129.6203" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--primary-accent)">Workload Analysis</text>
  <text x="165.6259" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Data volume (TB)</text>
  <text x="165.6259" y="196.0506" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Query complexity</text>
  <text x="165.6259" y="225.2152" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Concurrency level</text>
  <text x="165.6259" y="254.3797" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">SLA requirements</text>
  <text x="165.6259" y="283.5443" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Peak vs average</text>
  <line x1="288.045" y1="194.4304" x2="331.2518" y2="194.4304" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="338.4529" y="89.1139" width="244.8383" height="210.6329" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="460.872" y="129.6203" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--ok-accent)">Resource Sizing</text>
  <text x="460.872" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Executor count</text>
  <text x="460.872" y="196.0506" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Cores per executor</text>
  <text x="460.872" y="225.2152" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Memory per executor</text>
  <text x="460.872" y="254.3797" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Driver resources</text>
  <text x="460.872" y="283.5443" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Overhead (10%)</text>
  <line x1="583.2911" y1="194.4304" x2="626.4979" y2="194.4304" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="633.699" y="89.1139" width="244.8383" height="210.6329" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="756.1181" y="129.6203" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--danger-accent)">Cost Strategy</text>
  <text x="756.1181" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">On-demand baseline</text>
  <text x="756.1181" y="196.0506" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Spot instances (70%)</text>
  <text x="756.1181" y="225.2152" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Reserved capacity</text>
  <text x="756.1181" y="254.3797" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Auto-scaling rules</text>
  <text x="756.1181" y="283.5443" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Storage tiering</text>
  <line x1="878.5373" y1="194.4304" x2="921.744" y2="194.4304" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="928.9451" y="89.1139" width="201.6315" height="210.6329" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1029.7609" y="129.6203" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--info-accent)">Monitor</text>
  <text x="1029.7609" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Utilization %</text>
  <text x="1029.7609" y="196.0506" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Cost per job</text>
  <text x="1029.7609" y="225.2152" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Performance</text>
  <text x="1029.7609" y="254.3797" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Waste detection</text>
  <text x="1029.7609" y="283.5443" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Adjust &amp; repeat</text>
  <rect x="72.0113" y="356.4557" width="1008.1575" height="113.4177" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="576.09" y="396.962" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--text)">Sizing Guidelines</text>
  <text x="576.09" y="445.5696" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">Executors = DataSize / (PartitionSize x CoresPerExecutor) | Memory = 3-5x shuffle data | Cores: 4-5 per executor</text>
  <rect x="72.0113" y="502.2785" width="475.2743" height="97.2152" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="309.6484" y="542.7848" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--primary-accent)">Short-term (3-6 months)</text>
  <text x="309.6484" y="580.0506" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">Current load + 20% buffer</text>
  <rect x="590.4923" y="502.2785" width="489.6765" height="97.2152" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="835.3305" y="542.7848" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--danger-accent)">Long-term (1-2 years)</text>
  <text x="835.3305" y="580.0506" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">Projected growth + auto-scaling strategy</text>
  <text x="576.09" y="640" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text-muted)">Iterative capacity planning: measure, adjust, optimize</text>
</svg>
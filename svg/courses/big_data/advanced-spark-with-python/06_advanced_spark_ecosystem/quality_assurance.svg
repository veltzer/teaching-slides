<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="205.2631" height="145" rx="6.36396075637" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="85.312521093748" text-anchor="middle" font-size="20.734314474317" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Code Quality</text>
  <text x="142.6316" y="121.562492968751" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">Linting (flake8)</text>
  <text x="142.6316" y="154.187490156251" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">Type checks (mypy)</text>
  <line x1="245.2631" y1="112.499943750005" x2="284.7369" y2="112.499943750005" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="292.6316" y="40" width="205.2631" height="145" rx="6.36396075637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395.2632" y="85.312521093748" text-anchor="middle" font-size="20.734314474317" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Unit Tests</text>
  <text x="395.2632" y="121.562492968751" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">pytest + pyspark</text>
  <text x="395.2632" y="154.187490156251" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">Transform logic</text>
  <line x1="497.8947" y1="112.499943750005" x2="537.3685" y2="112.499943750005" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="545.2632" y="40" width="221.0526" height="145" rx="6.36396075637" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655.7895" y="85.312521093748" text-anchor="middle" font-size="20.734314474317" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Integration Tests</text>
  <text x="655.7895" y="121.562492968751" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">End-to-end pipeline</text>
  <text x="655.7895" y="154.187490156251" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">Schema validation</text>
  <line x1="766.3158" y1="112.499943750005" x2="805.7895" y2="112.499943750005" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="813.6842" y="40" width="205.2631" height="145" rx="6.36396075637" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.3158" y="85.312521093748" text-anchor="middle" font-size="20.734314474317" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Performance</text>
  <text x="916.3158" y="121.562492968751" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">Benchmark tests</text>
  <text x="916.3158" y="154.187490156251" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">Resource profiling</text>
  <line x1="1018.9475" y1="112.499943750005" x2="1058.4211" y2="112.499943750005" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1066.3158" y="40" width="173.6842" height="145" rx="6.36396075637" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1153.158" y="85.312521093748" text-anchor="middle" font-size="20.734314474317" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Deploy</text>
  <text x="1153.158" y="121.562492968751" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">Staging</text>
  <text x="1153.158" y="154.187490156251" text-anchor="middle" font-size="17.544485211199" fill="var(--text)" font-family="Arial, sans-serif">Production</text>
  <rect x="87.3684" y="257.500056249995" width="1105.2632" height="163.124985937501" rx="6.36396075637" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0001" y="302.812464843753" text-anchor="middle" font-size="22.329335171889" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Quality Checks</text>
  <rect x="118.9474" y="330" width="205.2631" height="63.437507031249" rx="6.36396075637" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.579" y="371.687546406246" text-anchor="middle" font-size="17.544485211199" fill="var(--primary-accent)" font-family="Arial, sans-serif">Schema Validation</text>
  <rect x="355.7895" y="330" width="205.2631" height="63.437507031249" rx="6.36396075637" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.4211" y="371.687546406246" text-anchor="middle" font-size="17.544485211199" fill="var(--ok-accent)" font-family="Arial, sans-serif">Null Checks</text>
  <rect x="592.6316" y="330" width="205.2631" height="63.437507031249" rx="6.36396075637" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="695.2632" y="371.687546406246" text-anchor="middle" font-size="17.544485211199" fill="var(--danger-accent)" font-family="Arial, sans-serif">Row Count Checks</text>
  <rect x="829.4737" y="330" width="205.2631" height="63.437507031249" rx="6.36396075637" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="932.1053" y="371.687546406246" text-anchor="middle" font-size="17.544485211199" fill="var(--info-accent)" font-family="Arial, sans-serif">Value Range</text>
  <rect x="87.3684" y="475" width="1105.2632" height="99.687478906252" rx="6.36396075637" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="520.312521093748" text-anchor="middle" font-size="22.329335171889" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">CI/CD Pipeline</text>
  <text x="640.0001" y="556.562492968751" text-anchor="middle" font-size="19.139399842758" fill="var(--text)" font-family="Arial, sans-serif">GitHub Actions / Jenkins / GitLab CI | Build | Test | Package | Deploy</text>
  <text x="640.0001" y="620" text-anchor="middle" font-size="19.139399842758" fill="var(--text-muted)" font-family="Arial, sans-serif">Automated testing at every stage ensures production reliability</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="583.4758" y="49.2308" text-anchor="middle" font-family="Arial" font-size="26.2564" font-weight="bold" fill="var(--primary-accent)">Spark Quality Assurance Pipeline</text>
  <rect x="29.1738" y="114.8718" width="189.6296" height="131.2821" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="123.9886" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--primary-accent)">Code Quality</text>
  <text x="123.9886" y="188.7179" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Linting (flake8)</text>
  <text x="123.9886" y="218.2564" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Type checks (mypy)</text>
  <line x1="218.8034" y1="180.5128" x2="255.2707" y2="180.5128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="262.5641" y="114.8718" width="189.6296" height="131.2821" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="357.3789" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--ok-accent)">Unit Tests</text>
  <text x="357.3789" y="188.7179" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">pytest + pyspark</text>
  <text x="357.3789" y="218.2564" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Transform logic</text>
  <line x1="452.1937" y1="180.5128" x2="488.661" y2="180.5128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="495.9544" y="114.8718" width="204.2165" height="131.2821" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="598.0627" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">Integration Tests</text>
  <text x="598.0627" y="188.7179" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">End-to-end pipeline</text>
  <text x="598.0627" y="218.2564" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Schema validation</text>
  <line x1="700.1709" y1="180.5128" x2="736.6382" y2="180.5128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="743.9316" y="114.8718" width="189.6296" height="131.2821" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="838.7464" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--info-accent)">Performance</text>
  <text x="838.7464" y="188.7179" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Benchmark tests</text>
  <text x="838.7464" y="218.2564" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Resource profiling</text>
  <line x1="933.5613" y1="180.5128" x2="970.0285" y2="180.5128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="977.3219" y="114.8718" width="160.4558" height="131.2821" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1057.5499" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">Deploy</text>
  <text x="1057.5499" y="188.7179" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Staging</text>
  <text x="1057.5499" y="218.2564" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Production</text>
  <rect x="72.9345" y="311.7949" width="1021.0826" height="147.6923" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="583.4758" y="352.8205" text-anchor="middle" font-family="Arial" font-size="20.4217" font-weight="bold" fill="var(--text)">Data Quality Checks</text>
  <rect x="102.1083" y="377.4359" width="189.6296" height="57.4359" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="196.9231" y="415.1795" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--primary-accent)">Schema Validation</text>
  <rect x="320.9117" y="377.4359" width="189.6296" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="415.7265" y="415.1795" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--ok-accent)">Null Checks</text>
  <rect x="539.7151" y="377.4359" width="189.6296" height="57.4359" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="634.5299" y="415.1795" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--danger-accent)">Row Count Checks</text>
  <rect x="758.5185" y="377.4359" width="189.6296" height="57.4359" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="853.3333" y="415.1795" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--info-accent)">Value Range</text>
  <rect x="72.9345" y="508.7179" width="1021.0826" height="90.2564" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="583.4758" y="549.7436" text-anchor="middle" font-family="Arial" font-size="20.4217" font-weight="bold" fill="var(--primary-accent)">CI/CD Pipeline</text>
  <text x="583.4758" y="582.5641" text-anchor="middle" font-family="Arial" font-size="17.5043" fill="var(--text)">GitHub Actions / Jenkins / GitLab CI | Build | Test | Package | Deploy</text>
  <text x="583.4758" y="640" text-anchor="middle" font-family="Arial" font-size="17.5043" fill="var(--text-muted)">Automated testing at every stage ensures production reliability</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-family="Arial" font-size="27.0672" font-weight="bold" fill="var(--primary-accent)">Spark Quality Assurance Pipeline</text>
  <rect x="40" y="104.4444" width="205.2631" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.6316" y="144.7222" text-anchor="middle" font-family="Arial" font-size="19.5485" font-weight="bold" fill="var(--primary-accent)">Code Quality</text>
  <text x="142.6316" y="176.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">Linting (flake8)</text>
  <text x="142.6316" y="205.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">Type checks (mypy)</text>
  <line x1="245.2631" y1="168.8888" x2="284.7369" y2="168.8888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="292.6316" y="104.4444" width="205.2631" height="128.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395.2632" y="144.7222" text-anchor="middle" font-family="Arial" font-size="19.5485" font-weight="bold" fill="var(--ok-accent)">Unit Tests</text>
  <text x="395.2632" y="176.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">pytest + pyspark</text>
  <text x="395.2632" y="205.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">Transform logic</text>
  <line x1="497.8947" y1="168.8888" x2="537.3685" y2="168.8888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="545.2632" y="104.4444" width="221.0526" height="128.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="655.7895" y="144.7222" text-anchor="middle" font-family="Arial" font-size="19.5485" font-weight="bold" fill="var(--danger-accent)">Integration Tests</text>
  <text x="655.7895" y="176.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">End-to-end pipeline</text>
  <text x="655.7895" y="205.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">Schema validation</text>
  <line x1="766.3158" y1="168.8888" x2="805.7895" y2="168.8888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="813.6842" y="104.4444" width="205.2631" height="128.8889" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="916.3158" y="144.7222" text-anchor="middle" font-family="Arial" font-size="19.5485" font-weight="bold" fill="var(--info-accent)">Performance</text>
  <text x="916.3158" y="176.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">Benchmark tests</text>
  <text x="916.3158" y="205.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">Resource profiling</text>
  <line x1="1018.9475" y1="168.8888" x2="1058.4211" y2="168.8888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1066.3158" y="104.4444" width="173.6842" height="128.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1153.158" y="144.7222" text-anchor="middle" font-family="Arial" font-size="19.5485" font-weight="bold" fill="var(--danger-accent)">Deploy</text>
  <text x="1153.158" y="176.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">Staging</text>
  <text x="1153.158" y="205.9444" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--text)">Production</text>
  <rect x="87.3684" y="297.7778" width="1105.2632" height="145" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="338.0555" text-anchor="middle" font-family="Arial" font-size="21.0523" font-weight="bold" fill="var(--text)">Data Quality Checks</text>
  <rect x="118.9474" y="362.2222" width="205.2631" height="56.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="221.579" y="399.2778" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--primary-accent)">Schema Validation</text>
  <rect x="355.7895" y="362.2222" width="205.2631" height="56.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="458.4211" y="399.2778" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--ok-accent)">Null Checks</text>
  <rect x="592.6316" y="362.2222" width="205.2631" height="56.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="695.2632" y="399.2778" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--danger-accent)">Row Count Checks</text>
  <rect x="829.4737" y="362.2222" width="205.2631" height="56.3889" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="932.1053" y="399.2778" text-anchor="middle" font-family="Arial" font-size="16.5411" fill="var(--info-accent)">Value Range</text>
  <rect x="87.3684" y="491.1111" width="1105.2632" height="88.6111" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="531.3889" text-anchor="middle" font-family="Arial" font-size="21.0523" font-weight="bold" fill="var(--primary-accent)">CI/CD Pipeline</text>
  <text x="640.0001" y="563.6111" text-anchor="middle" font-family="Arial" font-size="18.0448" fill="var(--text)">GitHub Actions / Jenkins / GitLab CI | Build | Test | Package | Deploy</text>
  <text x="640.0001" y="620" text-anchor="middle" font-family="Arial" font-size="18.0448" fill="var(--text-muted)">Automated testing at every stage ensures production reliability</text>
</svg>
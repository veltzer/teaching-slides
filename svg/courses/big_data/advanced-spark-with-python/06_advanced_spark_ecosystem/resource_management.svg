  <text x="616" y="109.2778" text-anchor="middle" font-size="21.1922" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Driver</text>
  <text x="616" y="141.5" text-anchor="middle" font-size="18.1647" fill="var(--text)" font-family="Arial, sans-serif">SparkContext / Session</text>

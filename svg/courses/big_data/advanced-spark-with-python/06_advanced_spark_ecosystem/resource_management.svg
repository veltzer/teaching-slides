  <text x="432" y="518.5" text-anchor="middle" font-size="15.1372" fill="var(--ok-accent)" font-family="Arial, sans-serif">Task</text>
  <rect x="487.9999" y="491.1111" width="80" height="40.2777" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="528" y="518.5" text-anchor="middle" font-size="15.1372" fill="var(--ok-accent)" font-family="Arial, sans-serif">Task</text>
  <rect x="680" y="362.2222" width="256" height="193.3334" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="402.5" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Executor 3</text>
  <text x="808" y="442.7778" text-anchor="middle" font-size="18.1647" fill="var(--text)" font-family="Arial, sans-serif">CPU: 4 cores</text>
  <text x="808" y="475" text-anchor="middle" font-size="18.1647" fill="var(--text)" font-family="Arial, sans-serif">Memory: 8 GB</text>
  <rect x="712" y="491.1111" width="80" height="40.2777" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="752" y="518.5" text-anchor="middle" font-size="15.1372" fill="var(--ok-accent)" font-family="Arial, sans-serif">Task</text>
  <rect x="808" y="491.1111" width="80" height="40.2777" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

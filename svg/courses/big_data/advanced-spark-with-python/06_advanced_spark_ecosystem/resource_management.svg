  <line x1="696" y1="289.7222" x2="808" y2="362.2222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1000" y="217.2222" width="240" height="354.4444" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="257.5" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Memory Layout</text>
  <rect x="1024" y="281.6666" width="192" height="48.3334" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>

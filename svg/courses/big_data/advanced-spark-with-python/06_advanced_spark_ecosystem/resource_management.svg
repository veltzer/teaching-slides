  <text x="487.9999" y="442.7778" text-anchor="middle" font-size="18.1647" fill="var(--text)" font-family="Arial, sans-serif">CPU: 4 cores</text>
  <text x="487.9999" y="475" text-anchor="middle" font-size="18.1647" fill="var(--text)" font-family="Arial, sans-serif">Memory: 8 GB</text>

  <text x="616" y="273.6111" text-anchor="middle" font-size="18.1647" fill="var(--text)" font-family="Arial, sans-serif">K8s / YARN / Standalone</text>
  <line x1="616" y1="160.8333" x2="616" y2="209.1667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="586.3932" y="388.9231" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--warn-accent)">Replication</text>
  <line x1="481.3675" y1="495.5897" x2="692.8775" y2="495.5897" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="586.3932" y="487.3846" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--info-accent)">Sync</text>
  <rect x="145.8689" y="582.5641" width="364.6724" height="57.4359" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />

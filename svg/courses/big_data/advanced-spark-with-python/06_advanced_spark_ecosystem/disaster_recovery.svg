  <rect x="721.0811" y="40" width="518.9189" height="494.705838754327" rx="6.173948939898" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.2934 4.3761" filter="url(#shadow)"/>
  <text x="980.5406" y="82.647080622836" text-anchor="middle" font-size="23.521407772075" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">DR Region (Standby)</text>
  <rect x="761.6216" y="108.235244290659" width="210.8108" height="76.764702768166" rx="6.173948939898" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="867.027" y="155.999936470591" text-anchor="middle" font-size="18.817167377319" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Spark Cluster</text>

  <text x="386.5527" y="193.641" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--ok-accent)">Delta Lake</text>
  <rect x="80.2279" y="254.359" width="189.6296" height="73.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="175.0427" y="300.3077" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--primary-accent)">Checkpoints</text>
  <rect x="291.7379" y="254.359" width="189.6296" height="73.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="386.5527" y="300.3077" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--primary-accent)">Snapshots</text>
  <rect x="80.2279" y="361.0256" width="401.1396" height="73.8462" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="280.0684" y="406.9744" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--danger-accent)">Primary Storage (S3 / HDFS)</text>
  <rect x="80.2279" y="459.4872" width="401.1396" height="73.8462" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="280.0684" y="505.4359" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--info-accent)">Metadata Store (Hive Metastore)</text>
  <rect x="656.4103" y="82.0513" width="466.7806" height="475.8974" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.2934 4.3761" />
  <text x="889.8006" y="123.0769" text-anchor="middle" font-family="Arial" font-size="21.8803" font-weight="bold" fill="var(--danger-accent)">DR Region (Standby)</text>
  <rect x="692.8775" y="147.6923" width="189.6296" height="73.8462" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="787.6923" y="193.641" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--danger-accent)">Spark Cluster</text>
  <rect x="904.3875" y="147.6923" width="189.6296" height="73.8462" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="999.2023" y="193.641" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--danger-accent)">Delta Lake</text>
  <rect x="692.8775" y="254.359" width="189.6296" height="73.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />

  <text x="299.4594" y="82.647080622836" text-anchor="middle" font-size="23.521407772075" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Primary Region</text>
  <rect x="80.5405" y="108.235244290659" width="210.8108" height="76.764702768166" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

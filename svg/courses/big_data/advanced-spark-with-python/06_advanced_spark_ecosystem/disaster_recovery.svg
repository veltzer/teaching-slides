  <rect x="904.3875" y="254.359" width="189.6296" height="73.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="999.2023" y="300.3077" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--primary-accent)">Snapshots</text>
  <rect x="692.8775" y="361.0256" width="401.1396" height="73.8462" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="892.7179" y="406.9744" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--danger-accent)">Replica Storage (S3 cross-region)</text>
  <rect x="692.8775" y="459.4872" width="401.1396" height="73.8462" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.4305" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Disaster Recovery Architecture</text>
  <rect x="40" y="72.2222" width="518.9189" height="467.2222" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2934 4.3761" filter="url(#shadow)"/>
  <text x="299.4594" y="112.5" text-anchor="middle" font-size="22.8587" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Primary Region</text>
  <rect x="80.5405" y="136.6666" width="210.8108" height="72.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="181.7777" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Spark Cluster</text>
  <rect x="315.6757" y="136.6666" width="210.8108" height="72.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="421.0811" y="181.7777" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Delta Lake</text>
  <rect x="80.5405" y="241.3889" width="210.8108" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="286.5" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Checkpoints</text>
  <rect x="315.6757" y="241.3889" width="210.8108" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="421.0811" y="286.5" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Snapshots</text>
  <rect x="80.5405" y="346.1111" width="445.9459" height="72.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.7027" y="391.2223" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Primary Storage (S3 / HDFS)</text>
  <rect x="80.5405" y="442.7778" width="445.9459" height="72.5" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.7027" y="487.8889" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Metadata Store (Hive Metastore)</text>
  <rect x="721.0811" y="72.2222" width="518.9189" height="467.2222" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.2934 4.3761" filter="url(#shadow)"/>
  <text x="980.5406" y="112.5" text-anchor="middle" font-size="22.8587" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">DR Region (Standby)</text>
  <rect x="761.6216" y="136.6666" width="210.8108" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="867.027" y="181.7777" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Spark Cluster</text>
  <rect x="996.7568" y="136.6666" width="210.8108" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="181.7777" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Delta Lake</text>
  <rect x="761.6216" y="241.3889" width="210.8108" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="867.027" y="286.5" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Checkpoints</text>
  <rect x="996.7568" y="241.3889" width="210.8108" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="286.5" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Snapshots</text>
  <rect x="761.6216" y="346.1111" width="445.9459" height="72.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="983.7837" y="391.2223" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Replica Storage (S3 cross-region)</text>
  <rect x="761.6216" y="442.7778" width="445.9459" height="72.5" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="983.7837" y="487.8889" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Metadata Replica</text>
  <line x1="526.4864" y1="381.5555" x2="761.6216" y2="381.5555" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="643.2433" y="373.5" text-anchor="middle" font-size="16.7631" fill="var(--warn-accent)" font-family="Arial, sans-serif">Replication</text>
  <line x1="526.4864" y1="478.2222" x2="761.6216" y2="478.2222" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="643.2433" y="470.1666" text-anchor="middle" font-size="16.7631" fill="var(--info-accent)" font-family="Arial, sans-serif">Sync</text>
  <rect x="153.5134" y="563.6111" width="405.4054" height="56.3889" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="356.2162" y="600.6667" text-anchor="middle" font-size="18.287" fill="var(--primary-accent)" font-family="Arial, sans-serif">RPO: Minutes (near real-time)</text>
  <rect x="640" y="563.6111" width="405.4054" height="56.3889" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="842.7027" y="600.6667" text-anchor="middle" font-size="18.287" fill="var(--primary-accent)" font-family="Arial, sans-serif">RTO: Hours (warm standby)</text>
</svg>
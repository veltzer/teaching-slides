  <text x="421.0811" y="155.999936470591" text-anchor="middle" font-size="18.817167377319" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Delta Lake</text>
  <rect x="80.5405" y="219.117675086504" width="210.8108" height="76.764702768166" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185.9459" y="266.882367266435" text-anchor="middle" font-size="18.817167377319" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Checkpoints</text>
  <rect x="315.6757" y="219.117675086504" width="210.8108" height="76.764702768166" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="421.0811" y="266.882367266435" text-anchor="middle" font-size="18.817167377319" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Snapshots</text>
  <rect x="80.5405" y="330" width="445.9459" height="76.764702768166" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="302.7027" y="377.76479806228" text-anchor="middle" font-size="18.817167377319" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Primary Storage (S3 / HDFS)</text>
  <rect x="80.5405" y="432.352972318338" width="445.9459" height="76.764702768166" rx="6.173948939898" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632.0001" y="40" text-anchor="middle" font-family="Arial" font-size="27.247" font-weight="bold" fill="var(--primary-accent)">Spark Metrics Collection Pipeline</text>
  <rect x="40" y="104.4444" width="256" height="161.1112" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.9999" y="144.7222" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--primary-accent)">Spark App</text>
  <text x="167.9999" y="176.9444" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Driver Metrics</text>
  <text x="167.9999" y="205.9444" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Executor Metrics</text>
  <text x="167.9999" y="234.9445" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Task Metrics</text>
  <rect x="392.0001" y="80.2777" width="256" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="125.3888" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)">Graphite Sink</text>
  <rect x="392.0001" y="176.9444" width="256" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="222.0556" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)">Prometheus Sink</text>
  <rect x="392.0001" y="273.6111" width="256" height="72.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="318.7222" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)">JMX Sink</text>
  <line x1="296" y1="152.7778" x2="392.0001" y2="117.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="296" y1="185" x2="392.0001" y2="213.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="296" y1="225.2777" x2="392.0001" y2="310.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="760" y="80.2777" width="224" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="872.0001" y="125.3888" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)">Grafana</text>
  <rect x="760" y="176.9444" width="224" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="872.0001" y="222.0556" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)">Prometheus UI</text>
  <rect x="760" y="273.6111" width="224" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="872.0001" y="318.7222" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)">Spark UI</text>
  <line x1="648.0001" y1="117.3333" x2="760" y2="117.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="648.0001" y1="213.9999" x2="760" y2="213.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="648.0001" y1="310.6667" x2="760" y2="310.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1064" y="152.7778" width="176" height="112.7778" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1152.0001" y="197.8889" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)">Alerts</text>
  <text x="1152.0001" y="230.1111" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">PagerDuty</text>
  <text x="1152.0001" y="254.2778" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Slack / Email</text>
  <line x1="984.0001" y1="117.3333" x2="1064" y2="176.9444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="984.0001" y1="213.9999" x2="1064" y2="209.1667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="72" y="394.4444" width="1120.0001" height="177.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="632.0001" y="434.7223" text-anchor="middle" font-family="Arial" font-size="21.1922" font-weight="bold" fill="var(--text)">Key Metrics to Monitor</text>
  <rect x="104" y="458.8888" width="224" height="80.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="216" y="491.1111" text-anchor="middle" font-family="Arial" font-size="16.651" font-weight="bold" fill="var(--primary-accent)">Executor</text>
  <text x="216" y="520.1111" text-anchor="middle" font-family="Arial" font-size="15.1372" fill="var(--text)">CPU, Memory, GC</text>
  <rect x="360" y="458.8888" width="224" height="80.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="472" y="491.1111" text-anchor="middle" font-family="Arial" font-size="16.651" font-weight="bold" fill="var(--ok-accent)">Shuffle</text>
  <text x="472" y="520.1111" text-anchor="middle" font-family="Arial" font-size="15.1372" fill="var(--text)">Read/Write bytes</text>
  <rect x="616" y="458.8888" width="224" height="80.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="728.0001" y="491.1111" text-anchor="middle" font-family="Arial" font-size="16.651" font-weight="bold" fill="var(--danger-accent)">Storage</text>
  <text x="728.0001" y="520.1111" text-anchor="middle" font-family="Arial" font-size="15.1372" fill="var(--text)">Disk, Cache hit rate</text>
  <rect x="872.0001" y="458.8888" width="288" height="80.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.0001" y="491.1111" text-anchor="middle" font-family="Arial" font-size="16.651" font-weight="bold" fill="var(--info-accent)">Task</text>
  <text x="1016.0001" y="520.1111" text-anchor="middle" font-family="Arial" font-size="15.1372" fill="var(--text)">Duration, Failures, Skew</text>
  <text x="632.0001" y="620" text-anchor="middle" font-family="Arial" font-size="18.1647" fill="var(--text-muted)">Real-time monitoring enables proactive performance management</text>
</svg>
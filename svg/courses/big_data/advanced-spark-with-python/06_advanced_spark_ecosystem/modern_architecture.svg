  <text x="931.892" y="494.1972" text-anchor="middle" font-size="19.9499" fill="var(--info-accent)" font-family="Arial, sans-serif">Kafka</text>
  <line x1="194.0541" y1="391.2676" x2="153.5135" y2="448.4507" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="534.5946" y1="391.2676" x2="412.973" y2="448.4507" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="534.5946" y1="391.2676" x2="672.4324" y2="448.4507" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="883.2432" y1="391.2676" x2="931.892" y2="448.4507" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1094.054" y="72.6761" width="145.946" height="449.2958" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1167.0271" y="219.7184" text-anchor="middle" font-size="18.4153" fill="var(--primary-accent)" font-family="Arial, sans-serif">MLflow</text>
  <text x="1167.0271" y="268.7324" text-anchor="middle" font-size="18.4153" fill="var(--primary-accent)" font-family="Arial, sans-serif">Airflow</text>
  <text x="1167.0271" y="317.7465" text-anchor="middle" font-size="18.4153" fill="var(--primary-accent)" font-family="Arial, sans-serif">Prometheus</text>
  <text x="1167.0271" y="366.7606" text-anchor="middle" font-size="18.4153" fill="var(--primary-accent)" font-family="Arial, sans-serif">Grafana</text>
  <text x="1167.0271" y="154.3663" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Ecosystem</text>
  <text x="40" y="118.4225" text-anchor="end" font-size="16.6572" fill="var(--text-muted)" transform="rotate(-90, 30, 78)" font-family="Arial, sans-serif">APIs</text>
  <text x="40" y="363.493" text-anchor="end" font-size="16.6572" fill="var(--text-muted)" transform="rotate(-90, 30, 228)" font-family="Arial, sans-serif">Cluster</text>
  <text x="40" y="494.1972" text-anchor="end" font-size="16.6572" fill="var(--text-muted)" transform="rotate(-90, 30, 308)" font-family="Arial, sans-serif">Storage</text>
  <text x="607.5676" y="620" text-anchor="middle" font-size="18.4153" fill="var(--text-muted)" font-family="Arial, sans-serif">Spark 3.x ecosystem with cloud-native deployment options</text>
</svg>

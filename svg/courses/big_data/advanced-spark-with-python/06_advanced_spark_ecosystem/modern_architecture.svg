<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="607.5676" y="40" text-anchor="middle" font-size="27.623" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Modern Spark Architecture</text>
  <rect x="40" y="72.6761" width="227.0271" height="73.5211" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.5135" y="118.4225" text-anchor="middle" font-size="19.9499" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark SQL</text>
  <rect x="299.4594" y="72.6761" width="227.0271" height="73.5211" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="412.973" y="118.4225" text-anchor="middle" font-size="19.9499" fill="var(--primary-accent)" font-family="Arial, sans-serif">Streaming</text>
  <rect x="558.9189" y="72.6761" width="227.0271" height="73.5211" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="672.4324" y="118.4225" text-anchor="middle" font-size="19.9499" fill="var(--primary-accent)" font-family="Arial, sans-serif">MLlib</text>
  <rect x="818.3784" y="72.6761" width="227.0271" height="73.5211" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.892" y="118.4225" text-anchor="middle" font-size="19.9499" fill="var(--primary-accent)" font-family="Arial, sans-serif">GraphX</text>
  <rect x="40" y="187.0423" width="1005.4056" height="81.6902" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="542.7027" y="236.0563" text-anchor="middle" font-size="23.0192" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Spark Core Engine (RDD, DataFrame, Dataset)</text>
  <line x1="153.5135" y1="146.1972" x2="153.5135" y2="187.0423" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="412.973" y1="146.1972" x2="412.973" y2="187.0423" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672.4324" y1="146.1972" x2="672.4324" y2="187.0423" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="931.892" y1="146.1972" x2="931.892" y2="187.0423" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="317.7465" width="308.1082" height="73.5211" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="194.0541" y="363.493" text-anchor="middle" font-size="19.9499" fill="var(--danger-accent)" font-family="Arial, sans-serif">Kubernetes</text>
  <rect x="380.5405" y="317.7465" width="308.1082" height="73.5211" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="534.5946" y="363.493" text-anchor="middle" font-size="19.9499" fill="var(--danger-accent)" font-family="Arial, sans-serif">YARN</text>
  <rect x="721.081" y="317.7465" width="324.3244" height="73.5211" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="883.2432" y="363.493" text-anchor="middle" font-size="19.9499" fill="var(--danger-accent)" font-family="Arial, sans-serif">Standalone / Mesos</text>
  <line x1="283.2432" y1="268.7324" x2="194.0541" y2="317.7465" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="542.7027" y1="268.7324" x2="534.5946" y2="317.7465" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="769.7297" y1="268.7324" x2="883.2432" y2="317.7465" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="448.4507" width="227.0271" height="73.5211" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.5135" y="494.1972" text-anchor="middle" font-size="19.9499" fill="var(--info-accent)" font-family="Arial, sans-serif">HDFS</text>
  <rect x="299.4594" y="448.4507" width="227.0271" height="73.5211" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="412.973" y="494.1972" text-anchor="middle" font-size="19.9499" fill="var(--info-accent)" font-family="Arial, sans-serif">S3 / GCS / ADLS</text>
  <rect x="558.9189" y="448.4507" width="227.0271" height="73.5211" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>

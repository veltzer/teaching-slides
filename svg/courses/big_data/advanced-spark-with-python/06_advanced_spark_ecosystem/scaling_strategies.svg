  <ns0:text x="576.09" y="456.9114" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--text-dark)">Cost vs Performance Trade-offs</ns0:text>
  <ns0:text x="576.09" y="492.557" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text-dark)">Vertical: Higher cost/node, simpler | Horizontal: Lower cost/node, complex | Auto: Optimal cost, requires tuning</ns0:text>

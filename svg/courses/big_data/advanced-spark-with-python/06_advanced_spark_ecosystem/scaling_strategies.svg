  <ns0:text x="576.09" y="456.9114" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="#333">Cost vs Performance Trade-offs</ns0:text>
  <ns0:text x="576.09" y="492.557" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="#333">Vertical: Higher cost/node, simpler | Horizontal: Lower cost/node, complex | Auto: Optimal cost, requires tuning</ns0:text>
  <ns0:rect x="72.0113" y="542.7848" width="302.4473" height="64.8101" rx="7.2011" fill="#e8eaf6" stroke="#283593" stroke-width="2.1603" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="576.09" y="48.6076" text-anchor="middle" font-family="Arial" font-size="25.9241" font-weight="bold" fill="var(--primary-accent)">Spark Scaling Strategies</text>
  <rect x="43.2068" y="89.1139" width="331.2518" height="275.443" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208.8326" y="129.6203" text-anchor="middle" font-family="Arial" font-size="21.6034" font-weight="bold" fill="var(--primary-accent)">Vertical Scaling</text>
  <text x="208.8326" y="162.0253" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">(Scale Up)</text>
  <rect x="72.0113" y="186.3291" width="273.6428" height="48.6076" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208.8326" y="218.7342" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--primary-accent)">More memory per executor</text>
  <rect x="72.0113" y="243.038" width="273.6428" height="48.6076" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208.8326" y="275.443" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--primary-accent)">More cores per node</text>
  <rect x="72.0113" y="299.7468" width="273.6428" height="48.6076" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="208.8326" y="332.1519" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--primary-accent)">Faster storage (NVMe)</text>
  <rect x="410.4641" y="89.1139" width="331.2518" height="275.443" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="576.09" y="129.6203" text-anchor="middle" font-family="Arial" font-size="21.6034" font-weight="bold" fill="var(--ok-accent)">Horizontal Scaling</text>
  <text x="576.09" y="162.0253" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">(Scale Out)</text>
  <rect x="439.2686" y="186.3291" width="273.6428" height="48.6076" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="576.09" y="218.7342" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--ok-accent)">More executor instances</text>
  <rect x="439.2686" y="243.038" width="273.6428" height="48.6076" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="576.09" y="275.443" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--ok-accent)">Add worker nodes</text>
  <rect x="439.2686" y="299.7468" width="273.6428" height="48.6076" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="576.09" y="332.1519" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--ok-accent)">Partition across cluster</text>
  <rect x="777.7215" y="89.1139" width="331.2518" height="275.443" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="943.3474" y="129.6203" text-anchor="middle" font-family="Arial" font-size="21.6034" font-weight="bold" fill="var(--danger-accent)">Auto Scaling</text>
  <text x="943.3474" y="162.0253" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">(Dynamic)</text>
  <rect x="806.526" y="186.3291" width="273.6428" height="48.6076" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="943.3474" y="218.7342" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--danger-accent)">Dynamic allocation</text>
  <rect x="806.526" y="243.038" width="273.6428" height="48.6076" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="943.3474" y="275.443" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--danger-accent)">K8s autoscaler (HPA)</text>
  <rect x="806.526" y="299.7468" width="273.6428" height="48.6076" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="943.3474" y="332.1519" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--danger-accent)">Spot/preemptible nodes</text>
  <rect x="72.0113" y="421.2658" width="1008.1575" height="89.1139" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="576.09" y="456.9114" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--text)">Cost vs Performance Trade-offs</text>
  <text x="576.09" y="492.557" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">Vertical: Higher cost/node, simpler | Horizontal: Lower cost/node, complex | Auto: Optimal cost, requires tuning</text>
  <rect x="72.0113" y="542.7848" width="302.4473" height="64.8101" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="223.2349" y="583.2911" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--primary-accent)">Start small, measure</text>
  <rect x="403.263" y="542.7848" width="345.654" height="64.8101" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="576.09" y="583.2911" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--primary-accent)">Prefer horizontal for big data</text>
  <rect x="777.7215" y="542.7848" width="302.4473" height="64.8101" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="928.9451" y="583.2911" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--primary-accent)">Use auto-scaling in cloud</text>
  <text x="576.09" y="640" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text-muted)">Combine strategies based on workload patterns and budget constraints</text>
</svg>
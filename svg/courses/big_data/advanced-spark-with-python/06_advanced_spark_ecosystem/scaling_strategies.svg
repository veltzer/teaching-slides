<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="372.973" height="290" rx="6.216675708426" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="82.647134602072" text-anchor="middle" font-size="23.521517821664" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Vertical Scaling</text>
  <text x="226.4864" y="116.764756401382" text-anchor="middle" font-size="18.817152090574" fill="var(--text)" font-family="Arial, sans-serif">(Scale Up)</text>
  <rect x="72.4324" y="142.352972750863" width="308.1082" height="51.176432698964" rx="6.216675708426" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="176.470594550173" text-anchor="middle" font-size="17.249099254385" fill="var(--primary-accent)" font-family="Arial, sans-serif">More memory per executor</text>
  <rect x="72.4324" y="202.05891825259" width="308.1082" height="51.176432698964" rx="6.216675708426" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="236.176432698964" text-anchor="middle" font-size="17.249099254385" fill="var(--primary-accent)" font-family="Arial, sans-serif">More cores per node</text>
  <rect x="72.4324" y="261.764649048446" width="308.1082" height="51.176432698964" rx="6.216675708426" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="295.882378200691" text-anchor="middle" font-size="17.249099254385" fill="var(--primary-accent)" font-family="Arial, sans-serif">Faster storage (NVMe)</text>
  <rect x="453.5134" y="40" width="372.973" height="290" rx="6.216675708426" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="82.647134602072" text-anchor="middle" font-size="23.521517821664" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Horizontal Scaling</text>
  <text x="639.9999" y="116.764756401382" text-anchor="middle" font-size="18.817152090574" fill="var(--text)" font-family="Arial, sans-serif">(Scale Out)</text>
  <rect x="485.9459" y="142.352972750863" width="308.1082" height="51.176432698964" rx="6.216675708426" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="176.470594550173" text-anchor="middle" font-size="17.249099254385" fill="var(--ok-accent)" font-family="Arial, sans-serif">More executor instances</text>
  <rect x="485.9459" y="202.05891825259" width="308.1082" height="51.176432698964" rx="6.216675708426" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="236.176432698964" text-anchor="middle" font-size="17.249099254385" fill="var(--ok-accent)" font-family="Arial, sans-serif">Add worker nodes</text>
  <rect x="485.9459" y="261.764649048446" width="308.1082" height="51.176432698964" rx="6.216675708426" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="295.882378200691" text-anchor="middle" font-size="17.249099254385" fill="var(--ok-accent)" font-family="Arial, sans-serif">Partition across cluster</text>
  <rect x="867.027" y="40" width="372.973" height="290" rx="6.216675708426" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="82.647134602072" text-anchor="middle" font-size="23.521517821664" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Auto Scaling</text>
  <text x="1053.5135" y="116.764756401382" text-anchor="middle" font-size="18.817152090574" fill="var(--text)" font-family="Arial, sans-serif">(Dynamic)</text>
  <rect x="899.4594" y="142.352972750863" width="308.1082" height="51.176432698964" rx="6.216675708426" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="176.470594550173" text-anchor="middle" font-size="17.249099254385" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dynamic allocation</text>
  <rect x="899.4594" y="202.05891825259" width="308.1082" height="51.176432698964" rx="6.216675708426" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="236.176432698964" text-anchor="middle" font-size="17.249099254385" fill="var(--danger-accent)" font-family="Arial, sans-serif">K8s autoscaler (HPA)</text>
  <rect x="899.4594" y="261.764649048446" width="308.1082" height="51.176432698964" rx="6.216675708426" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="295.882378200691" text-anchor="middle" font-size="17.249099254385" fill="var(--danger-accent)" font-family="Arial, sans-serif">Spot/preemptible nodes</text>
  <rect x="72.4324" y="389.705838148791" width="1135.1351" height="93.8234599481" rx="6.216675708426" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="427.235350951554" text-anchor="middle" font-size="21.953464985475" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Cost vs Performance Trade-offs</text>
  <text x="639.9999" y="464.764756401382" text-anchor="middle" font-size="18.817152090574" fill="var(--text)" font-family="Arial, sans-serif">Vertical: Higher cost/node, simpler | Horizontal: Lower cost/node, complex | Auto: Optimal cost, requires tuning</text>
  <rect x="72.4324" y="517.647027249136" width="340.5406" height="68.235243598618" rx="6.216675708426" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="242.7027" y="560.294054498273" text-anchor="middle" font-size="17.249099254385" fill="var(--primary-accent)" font-family="Arial, sans-serif">Start small, measure</text>
  <rect x="445.4053" y="517.647027249136" width="389.1892" height="68.235243598618" rx="6.216675708426" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="560.294054498273" text-anchor="middle" font-size="17.249099254385" fill="var(--primary-accent)" font-family="Arial, sans-serif">Prefer horizontal for big data</text>
  <rect x="867.027" y="517.647027249136" width="340.5406" height="68.235243598618" rx="6.216675708426" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1037.2972" y="560.294054498273" text-anchor="middle" font-size="17.249099254385" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use auto-scaling in cloud</text>
  <text x="639.9999" y="620" text-anchor="middle" font-size="18.817152090574" fill="var(--text-muted)" font-family="Arial, sans-serif">Combine strategies based on workload patterns and budget constraints</text>
</svg>

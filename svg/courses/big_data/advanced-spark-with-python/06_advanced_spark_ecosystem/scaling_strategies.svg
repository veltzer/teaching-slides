<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="27.242" font-weight="bold" fill="var(--primary-accent)">Spark Scaling Strategies</text>
  <rect x="40" y="79.726" width="372.973" height="270.137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="119.4521" text-anchor="middle" font-family="Arial" font-size="22.7017" font-weight="bold" fill="var(--primary-accent)">Vertical Scaling</text>
  <text x="226.4864" y="151.2329" text-anchor="middle" font-family="Arial" font-size="18.1613" fill="var(--text)">(Scale Up)</text>
  <rect x="72.4324" y="175.0685" width="308.1082" height="47.6712" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="206.8493" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--primary-accent)">More memory per executor</text>
  <rect x="72.4324" y="230.685" width="308.1082" height="47.6712" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="262.4657" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--primary-accent)">More cores per node</text>
  <rect x="72.4324" y="286.3013" width="308.1082" height="47.6712" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4864" y="318.0822" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--primary-accent)">Faster storage (NVMe)</text>
  <rect x="453.5134" y="79.726" width="372.973" height="270.137" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="119.4521" text-anchor="middle" font-family="Arial" font-size="22.7017" font-weight="bold" fill="var(--ok-accent)">Horizontal Scaling</text>
  <text x="639.9999" y="151.2329" text-anchor="middle" font-family="Arial" font-size="18.1613" fill="var(--text)">(Scale Out)</text>
  <rect x="485.9459" y="175.0685" width="308.1082" height="47.6712" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="206.8493" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--ok-accent)">More executor instances</text>
  <rect x="485.9459" y="230.685" width="308.1082" height="47.6712" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="262.4657" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--ok-accent)">Add worker nodes</text>
  <rect x="485.9459" y="286.3013" width="308.1082" height="47.6712" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="318.0822" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--ok-accent)">Partition across cluster</text>
  <rect x="867.027" y="79.726" width="372.973" height="270.137" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="119.4521" text-anchor="middle" font-family="Arial" font-size="22.7017" font-weight="bold" fill="var(--danger-accent)">Auto Scaling</text>
  <text x="1053.5135" y="151.2329" text-anchor="middle" font-family="Arial" font-size="18.1613" fill="var(--text)">(Dynamic)</text>
  <rect x="899.4594" y="175.0685" width="308.1082" height="47.6712" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="206.8493" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--danger-accent)">Dynamic allocation</text>
  <rect x="899.4594" y="230.685" width="308.1082" height="47.6712" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="262.4657" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--danger-accent)">K8s autoscaler (HPA)</text>
  <rect x="899.4594" y="286.3013" width="308.1082" height="47.6712" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="318.0822" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--danger-accent)">Spot/preemptible nodes</text>
  <rect x="72.4324" y="405.4794" width="1135.1351" height="87.3972" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="639.9999" y="440.4384" text-anchor="middle" font-family="Arial" font-size="21.1883" font-weight="bold" fill="var(--text)">Cost vs Performance Trade-offs</text>
  <text x="639.9999" y="475.3973" text-anchor="middle" font-family="Arial" font-size="18.1613" fill="var(--text)">Vertical: Higher cost/node, simpler | Horizontal: Lower cost/node, complex | Auto: Optimal cost, requires tuning</text>
  <rect x="72.4324" y="524.6575" width="340.5406" height="63.5616" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="242.7027" y="564.3835" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--primary-accent)">Start small, measure</text>
  <rect x="445.4053" y="524.6575" width="389.1892" height="63.5616" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="564.3835" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--primary-accent)">Prefer horizontal for big data</text>
  <rect x="867.027" y="524.6575" width="340.5406" height="63.5616" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1037.2972" y="564.3835" text-anchor="middle" font-family="Arial" font-size="16.6479" fill="var(--primary-accent)">Use auto-scaling in cloud</text>
  <text x="639.9999" y="620" text-anchor="middle" font-family="Arial" font-size="18.1613" fill="var(--text-muted)">Combine strategies based on workload patterns and budget constraints</text>
</svg>
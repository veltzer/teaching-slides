  <line x1="284.4444" y1="505.2632" x2="464.0936" y2="353.6842" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="913.2164" y="84.2105" width="239.5322" height="117.8947" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />

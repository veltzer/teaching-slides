  <rect x="40" y="233.333404040397" width="259.4595" height="123.030290174473" rx="6.179143483694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="277.272717630855" text-anchor="middle" font-size="20.691788826672" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">API Reference</text>
  <text x="169.7297" y="312.424274563817" text-anchor="middle" font-size="17.508397089597" fill="var(--text)" font-family="Arial, sans-serif">Sphinx / MkDocs</text>

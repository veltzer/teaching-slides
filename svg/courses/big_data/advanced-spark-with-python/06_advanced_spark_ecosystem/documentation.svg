  <rect x="980.5405" y="40" width="259.4595" height="123.030290174473" rx="6.179143483694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="83.939525711648" text-anchor="middle" font-size="20.691788826672" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Runbooks</text>

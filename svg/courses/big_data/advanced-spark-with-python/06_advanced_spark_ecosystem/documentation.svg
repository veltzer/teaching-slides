<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="27.8196" font-weight="bold" fill="var(--primary-accent)">Spark Project Documentation Best Practices</text>
  <ellipse cx="639.9999" cy="288.5714" rx="162.1622" ry="66.2857" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="639.9999" y="276.9714" text-anchor="middle" font-family="Arial" font-size="23.183" font-weight="bold" fill="var(--primary-accent)">Documentation</text>
  <text x="639.9999" y="313.4286" text-anchor="middle" font-family="Arial" font-size="18.5464" fill="var(--text)">Hub</text>
  <rect x="40" y="73.1428" width="259.4595" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="114.5715" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)">Code Docs</text>
  <text x="169.7297" y="147.7143" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Docstrings</text>
  <text x="169.7297" y="174.2286" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Type annotations</text>
  <line x1="299.4594" y1="139.4285" x2="485.9459" y2="255.4286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="255.4286" width="259.4595" height="116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="296.8571" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)">API Reference</text>
  <text x="169.7297" y="330" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Sphinx / MkDocs</text>
  <text x="169.7297" y="356.5143" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Auto-generated</text>
  <line x1="299.4594" y1="313.4286" x2="477.8378" y2="296.8571" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="437.7142" width="259.4595" height="116" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="479.1429" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--info-accent)">Architecture</text>
  <text x="169.7297" y="512.2857" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">System diagrams</text>
  <text x="169.7297" y="538.8" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Data flow maps</text>
  <line x1="299.4594" y1="487.4286" x2="494.0541" y2="338.2857" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="980.5405" y="73.1428" width="259.4595" height="116" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="114.5715" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)">Runbooks</text>
  <text x="1110.2703" y="147.7143" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Deployment steps</text>
  <text x="1110.2703" y="174.2286" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Troubleshooting</text>
  <line x1="980.5405" y1="139.4285" x2="795.6756" y2="255.4286" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="980.5405" y="255.4286" width="259.4595" height="116" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="296.8571" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--primary-accent)">Config Guide</text>
  <text x="1110.2703" y="330" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Spark configs</text>
  <text x="1110.2703" y="356.5143" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Environment setup</text>
  <line x1="980.5405" y1="313.4286" x2="802.1621" y2="296.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="980.5405" y="437.7142" width="259.4595" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="479.1429" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)">Data Catalog</text>
  <text x="1110.2703" y="512.2857" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Schema definitions</text>
  <text x="1110.2703" y="538.8" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Lineage tracking</text>
  <line x1="980.5405" y1="487.4286" x2="785.9459" y2="338.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="639.9999" y="620" text-anchor="middle" font-family="Arial" font-size="18.5464" fill="var(--text-muted)">Comprehensive documentation reduces onboarding time and operational risk</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="27.8196" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Project Documentation Best Practices</text>
  <ellipse cx="639.9999" cy="288.5714" rx="162.1622" ry="66.2857" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942"/>
  <text x="639.9999" y="276.9714" text-anchor="middle" font-size="23.183" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Documentation</text>
  <text x="639.9999" y="313.4286" text-anchor="middle" font-size="18.5464" fill="var(--text)" font-family="Arial, sans-serif">Hub</text>
  <rect x="40" y="73.1428" width="259.4595" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="114.5715" text-anchor="middle" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Code Docs</text>
  <text x="169.7297" y="147.7143" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Docstrings</text>
  <text x="169.7297" y="174.2286" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Type annotations</text>
  <line x1="299.4594" y1="139.4285" x2="485.9459" y2="255.4286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="255.4286" width="259.4595" height="116" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="296.8571" text-anchor="middle" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">API Reference</text>
  <text x="169.7297" y="330" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Sphinx / MkDocs</text>
  <text x="169.7297" y="356.5143" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Auto-generated</text>
  <line x1="299.4594" y1="313.4286" x2="477.8378" y2="296.8571" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="437.7142" width="259.4595" height="116" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="479.1429" text-anchor="middle" font-size="20.0919" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Architecture</text>
  <text x="169.7297" y="512.2857" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">System diagrams</text>
  <text x="169.7297" y="538.8" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Data flow maps</text>
  <line x1="299.4594" y1="487.4286" x2="494.0541" y2="338.2857" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980.5405" y="73.1428" width="259.4595" height="116" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="114.5715" text-anchor="middle" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Runbooks</text>
  <text x="1110.2703" y="147.7143" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Deployment steps</text>
  <text x="1110.2703" y="174.2286" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Troubleshooting</text>
  <line x1="980.5405" y1="139.4285" x2="795.6756" y2="255.4286" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980.5405" y="255.4286" width="259.4595" height="116" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="296.8571" text-anchor="middle" font-size="20.0919" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Config Guide</text>
  <text x="1110.2703" y="330" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Spark configs</text>
  <text x="1110.2703" y="356.5143" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Environment setup</text>
  <line x1="980.5405" y1="313.4286" x2="802.1621" y2="296.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980.5405" y="437.7142" width="259.4595" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="479.1429" text-anchor="middle" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Catalog</text>
  <text x="1110.2703" y="512.2857" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Schema definitions</text>
  <text x="1110.2703" y="538.8" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">Lineage tracking</text>
  <line x1="980.5405" y1="487.4286" x2="785.9459" y2="338.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="639.9999" y="620" text-anchor="middle" font-size="18.5464" fill="var(--text-muted)" font-family="Arial, sans-serif">Comprehensive documentation reduces onboarding time and operational risk</text>
</svg>

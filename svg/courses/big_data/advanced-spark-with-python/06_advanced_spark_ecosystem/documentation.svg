  <line x1="284.4444" y1="328.4211" x2="449.1228" y2="311.5789" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="44.9123" y="454.7368" width="239.5322" height="117.8947" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="164.6784" y="496.8421" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--info-accent)">Architecture</text>

  <text x="1110.2703" y="470.606121671252" text-anchor="middle" font-size="20.691788826672" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Catalog</text>
  <text x="1110.2703" y="505.757572543618" text-anchor="middle" font-size="17.508397089597" fill="var(--text)" font-family="Arial, sans-serif">Schema definitions</text>

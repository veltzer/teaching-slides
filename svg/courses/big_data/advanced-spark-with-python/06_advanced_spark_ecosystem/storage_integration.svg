<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="27.8196" font-weight="bold" fill="var(--primary-accent)">Spark Storage Integration</text>
  <rect x="477.8378" y="222.2858" width="324.3243" height="99.4285" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="263.7143" text-anchor="middle" font-family="Arial" font-size="23.183" font-weight="bold" fill="var(--primary-accent)">Spark Engine</text>
  <text x="639.9999" y="296.8571" text-anchor="middle" font-family="Arial" font-size="18.5464" fill="var(--text)">DataFrame / Dataset API</text>
  <rect x="40" y="73.1428" width="210.8108" height="82.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.4054" y="109.6001" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)">AWS S3</text>
  <text x="145.4054" y="139.4285" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">s3a://</text>
  <rect x="283.2432" y="73.1428" width="210.8108" height="82.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="388.6486" y="109.6001" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)">Azure ADLS</text>
  <text x="388.6486" y="139.4285" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">abfss://</text>
  <rect x="785.9459" y="73.1428" width="210.8108" height="82.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="891.3513" y="109.6001" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)">Google GCS</text>
  <text x="891.3513" y="139.4285" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">gs://</text>
  <rect x="1029.1892" y="73.1428" width="210.8108" height="82.8571" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1134.5945" y="109.6001" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)">HDFS</text>
  <text x="1134.5945" y="139.4285" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">hdfs://</text>
  <line x1="145.4054" y1="156.0001" x2="510.2702" y2="230.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="388.6486" y1="156.0001" x2="558.9189" y2="222.2858" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="891.3513" y1="156.0001" x2="721.081" y2="222.2858" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1134.5945" y1="156.0001" x2="769.7297" y2="230.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="88.6487" y="437.7142" width="243.2432" height="91.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.2703" y="475.8286" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)">Delta Lake</text>
  <text x="210.2703" y="508.9714" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">ACID transactions</text>
  <rect x="380.5405" y="437.7142" width="243.2432" height="91.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.1621" y="475.8286" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)">Apache Iceberg</text>
  <text x="502.1621" y="508.9714" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Schema evolution</text>
  <rect x="672.4324" y="437.7142" width="243.2432" height="91.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.054" y="475.8286" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)">Apache Hudi</text>
  <text x="794.054" y="508.9714" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Incremental processing</text>
  <rect x="964.3243" y="437.7142" width="243.2432" height="91.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1085.9459" y="475.8286" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)">Parquet / ORC</text>
  <text x="1085.9459" y="508.9714" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">Columnar formats</text>

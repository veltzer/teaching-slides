  <text x="891.3513" y="78.666829292912" text-anchor="middle" font-size="20.691788826672" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Google GCS</text>
  <text x="891.3513" y="110.303007805328" text-anchor="middle" font-size="17.508397089597" fill="var(--text)" font-family="Arial, sans-serif">gs://</text>

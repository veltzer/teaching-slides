  <line x1="607.5675" y1="321.7143" x2="502.1621" y2="437.7142" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="672.4324" y1="321.7143" x2="794.054" y2="437.7142" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="737.2973" y1="321.7143" x2="1085.9459" y2="437.7142" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="526.4865" y="73.1428" width="243.2432" height="82.8571" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.1081" y="109.6001" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--info-accent)">Databases</text>
  <text x="648.1081" y="139.4285" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text)">JDBC / Hive</text>
  <line x1="648.1081" y1="156.0001" x2="639.9999" y2="222.2858" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="639.9999" y="620" text-anchor="middle" font-family="Arial" font-size="18.5464" fill="var(--text-muted)">Unified read/write API across all storage backends</text>
</svg>
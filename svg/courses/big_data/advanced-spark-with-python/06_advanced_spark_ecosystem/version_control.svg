<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="58.4615" y1="79.322008733121" x2="1240" y2="79.322008733121" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="126.547" y="49.351547922198" width="48.4448" height="59.940179248928" rx="15.57268398908" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.8805" filter="url(#shadow)"/>
  <text x="150.7692" y="89.152510916402" text-anchor="middle" font-size="21.554708076571" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">v0</text>
  <text x="150.7692" y="40" text-anchor="middle" font-size="19.758510211887" fill="var(--text)" font-family="Arial, sans-serif">Initial</text>
  <rect x="40" y="148.135524016084" width="221.5385" height="78.644017466243" rx="6.674007423891" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.7692" y="181.559256185001" text-anchor="middle" font-size="19.758510211887" fill="var(--ok-accent)" font-family="Arial, sans-serif">CREATE TABLE</text>
  <text x="150.7692" y="213.01693740879" text-anchor="middle" font-size="17.962312347204" fill="var(--text-muted)" font-family="Arial, sans-serif">3 rows</text>
  <rect x="421.932" y="49.351547922198" width="48.4448" height="59.940179248928" rx="15.57268398908" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.8805" filter="url(#shadow)"/>
  <text x="446.1539" y="89.152510916402" text-anchor="middle" font-size="21.554708076571" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">v1</text>
  <text x="446.1539" y="40" text-anchor="middle" font-size="19.758510211887" fill="var(--text)" font-family="Arial, sans-serif">Insert</text>
  <rect x="335.3846" y="148.135524016084" width="221.5385" height="78.644017466243" rx="6.674007423891" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.1539" y="181.559256185001" text-anchor="middle" font-size="19.758510211887" fill="var(--danger-accent)" font-family="Arial, sans-serif">INSERT 100 rows</text>
  <text x="446.1539" y="213.01693740879" text-anchor="middle" font-size="17.962312347204" fill="var(--text-muted)" font-family="Arial, sans-serif">103 rows total</text>
  <rect x="717.316" y="49.351547922198" width="48.4448" height="59.940179248928" rx="15.57268398908" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.8805" filter="url(#shadow)"/>
  <text x="741.5385" y="89.152510916402" text-anchor="middle" font-size="21.554708076571" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">v2</text>
  <text x="741.5385" y="40" text-anchor="middle" font-size="19.758510211887" fill="var(--text)" font-family="Arial, sans-serif">Update</text>
  <rect x="630.7693" y="148.135524016084" width="221.5385" height="78.644017466243" rx="6.674007423891" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="741.5385" y="181.559256185001" text-anchor="middle" font-size="19.758510211887" fill="var(--info-accent)" font-family="Arial, sans-serif">MERGE/UPDATE</text>
  <text x="741.5385" y="213.01693740879" text-anchor="middle" font-size="17.962312347204" fill="var(--text-muted)" font-family="Arial, sans-serif">103 rows total</text>
  <rect x="1012.7" y="49.351547922198" width="48.4448" height="59.940179248928" rx="15.57268398908" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.8805" filter="url(#shadow)"/>
  <text x="1036.9231" y="89.152510916402" text-anchor="middle" font-size="21.554708076571" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">v3</text>
  <text x="1036.9231" y="40" text-anchor="middle" font-size="19.758510211887" fill="var(--text)" font-family="Arial, sans-serif">Delete</text>
  <rect x="926.1539" y="148.135524016084" width="221.5385" height="78.644017466243" rx="6.674007423891" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.9231" y="181.559256185001" text-anchor="middle" font-size="19.758510211887" fill="var(--danger-accent)" font-family="Arial, sans-serif">DELETE 10 rows</text>
  <text x="1036.9231" y="213.01693740879" text-anchor="middle" font-size="17.962312347204" fill="var(--text-muted)" font-family="Arial, sans-serif">93 rows total</text>
  <rect x="58.4615" y="295.593180494109" width="1181.5385" height="108.135524016084" rx="6.674007423891" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.2307" y="340.813589520254" text-anchor="middle" font-size="25.147215039394" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Delta Transaction Log (_delta_log/)</text>
  <text x="649.2307" y="384.067700143632" text-anchor="middle" font-size="21.554708076571" fill="var(--text)" font-family="Arial, sans-serif">00000.json | 00001.json | 00002.json | 00003.json</text>
  <rect x="58.4615" y="452.881339155414" width="516.9231" height="117.966149928184" rx="6.674007423891" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.923" y="498.10162445274" text-anchor="middle" font-size="21.554708076571" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Read by Version</text>
  <text x="316.923" y="541.355982533757" text-anchor="middle" font-size="21.554708076571" fill="var(--text)" font-family="Arial, sans-serif">.option("versionAsOf", "1")</text>
  <rect x="649.2307" y="452.881339155414" width="590.7693" height="117.966149928184" rx="6.674007423891" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.6154" y="498.10162445274" text-anchor="middle" font-size="21.554708076571" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Read by Timestamp</text>
  <text x="944.6154" y="541.355982533757" text-anchor="middle" font-size="21.554708076571" fill="var(--text)" font-family="Arial, sans-serif">.option("timestampAsOf", "2024-01-01")</text>
  <text x="649.2307" y="620" text-anchor="middle" font-size="21.554708076571" fill="var(--text-muted)" font-family="Arial, sans-serif">Every write creates a new version with full audit trail</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="576.09" y="48.6076" text-anchor="middle" font-family="Arial" font-size="25.9241" font-weight="bold" fill="var(--primary-accent)">Delta Lake Version Control (Time Travel)</text>
  <line x1="115.218" y1="194.4304" x2="1036.962" y2="194.4304" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="187.2293" cy="194.4304" r="21.6034" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.8805" />
  <text x="187.2293" y="202.5316" text-anchor="middle" font-family="Arial" font-size="17.2827" font-weight="bold" fill="var(--primary-accent)">v0</text>
  <text x="187.2293" y="162.0253" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Initial</text>
  <rect x="100.8158" y="251.1392" width="172.827" height="64.8101" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="187.2293" y="278.6835" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--ok-accent)">CREATE TABLE</text>
  <text x="187.2293" y="304.6076" text-anchor="middle" font-family="Arial" font-size="14.4023" fill="var(--text-muted)">3 rows</text>
  <circle cx="417.6653" cy="194.4304" r="21.6034" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.8805" />
  <text x="417.6653" y="202.5316" text-anchor="middle" font-family="Arial" font-size="17.2827" font-weight="bold" fill="var(--primary-accent)">v1</text>
  <text x="417.6653" y="162.0253" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Insert</text>
  <rect x="331.2518" y="251.1392" width="172.827" height="64.8101" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="417.6653" y="278.6835" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--danger-accent)">INSERT 100 rows</text>
  <text x="417.6653" y="304.6076" text-anchor="middle" font-family="Arial" font-size="14.4023" fill="var(--text-muted)">103 rows total</text>
  <circle cx="648.1013" cy="194.4304" r="21.6034" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.8805" />
  <text x="648.1013" y="202.5316" text-anchor="middle" font-family="Arial" font-size="17.2827" font-weight="bold" fill="var(--primary-accent)">v2</text>
  <text x="648.1013" y="162.0253" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Update</text>
  <rect x="561.6878" y="251.1392" width="172.827" height="64.8101" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="648.1013" y="278.6835" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--info-accent)">MERGE/UPDATE</text>
  <text x="648.1013" y="304.6076" text-anchor="middle" font-family="Arial" font-size="14.4023" fill="var(--text-muted)">103 rows total</text>
  <circle cx="878.5373" cy="194.4304" r="21.6034" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.8805" />
  <text x="878.5373" y="202.5316" text-anchor="middle" font-family="Arial" font-size="17.2827" font-weight="bold" fill="var(--primary-accent)">v3</text>
  <text x="878.5373" y="162.0253" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Delete</text>
  <rect x="792.1238" y="251.1392" width="172.827" height="64.8101" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="878.5373" y="278.6835" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--danger-accent)">DELETE 10 rows</text>
  <text x="878.5373" y="304.6076" text-anchor="middle" font-family="Arial" font-size="14.4023" fill="var(--text-muted)">93 rows total</text>
  <rect x="115.218" y="372.6582" width="921.744" height="89.1139" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="576.09" y="409.9241" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--primary-accent)">Delta Transaction Log (_delta_log/)</text>
  <text x="576.09" y="445.5696" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">00000.json | 00001.json | 00002.json | 00003.json</text>
  <rect x="115.218" y="502.2785" width="403.263" height="97.2152" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="316.8495" y="539.5443" text-anchor="middle" font-family="Arial" font-size="17.2827" font-weight="bold" fill="var(--ok-accent)">Read by Version</text>
  <text x="316.8495" y="575.1899" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">.option("versionAsOf", "1")</text>
  <rect x="576.09" y="502.2785" width="460.872" height="97.2152" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="806.526" y="539.5443" text-anchor="middle" font-family="Arial" font-size="17.2827" font-weight="bold" fill="var(--danger-accent)">Read by Timestamp</text>
  <text x="806.526" y="575.1899" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">.option("timestampAsOf", "2024-01-01")</text>
  <text x="576.09" y="640" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text-muted)">Every write creates a new version with full audit trail</text>
</svg>
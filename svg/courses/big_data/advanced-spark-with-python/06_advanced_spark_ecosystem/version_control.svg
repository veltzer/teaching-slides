<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="649.2307" y="40" text-anchor="middle" font-size="29.0669" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Delta Lake Version Control (Time Travel)</text>
  <line x1="58.4615" y1="183.0137" x2="1240" y2="183.0137" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="126.547" y="158.791" width="48.4448" height="48.4448" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.8805" filter="url(#shadow)"/>
  <text x="150.7692" y="190.9589" text-anchor="middle" font-size="19.3779" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">v0</text>
  <text x="150.7692" y="151.2329" text-anchor="middle" font-size="17.7631" fill="var(--text)" font-family="Arial, sans-serif">Initial</text>
  <rect x="40" y="238.6301" width="221.5385" height="63.5616" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.7692" y="265.6438" text-anchor="middle" font-size="17.7631" fill="var(--ok-accent)" font-family="Arial, sans-serif">CREATE TABLE</text>
  <text x="150.7692" y="291.0685" text-anchor="middle" font-size="16.1483" fill="var(--text-muted)" font-family="Arial, sans-serif">3 rows</text>
  <rect x="421.932" y="158.791" width="48.4448" height="48.4448" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.8805" filter="url(#shadow)"/>
  <text x="446.1539" y="190.9589" text-anchor="middle" font-size="19.3779" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">v1</text>
  <text x="446.1539" y="151.2329" text-anchor="middle" font-size="17.7631" fill="var(--text)" font-family="Arial, sans-serif">Insert</text>
  <rect x="335.3846" y="238.6301" width="221.5385" height="63.5616" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.1539" y="265.6438" text-anchor="middle" font-size="17.7631" fill="var(--danger-accent)" font-family="Arial, sans-serif">INSERT 100 rows</text>
  <text x="446.1539" y="291.0685" text-anchor="middle" font-size="16.1483" fill="var(--text-muted)" font-family="Arial, sans-serif">103 rows total</text>
  <rect x="717.316" y="158.791" width="48.4448" height="48.4448" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.8805" filter="url(#shadow)"/>
  <text x="741.5385" y="190.9589" text-anchor="middle" font-size="19.3779" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">v2</text>
  <text x="741.5385" y="151.2329" text-anchor="middle" font-size="17.7631" fill="var(--text)" font-family="Arial, sans-serif">Update</text>
  <rect x="630.7693" y="238.6301" width="221.5385" height="63.5616" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="741.5385" y="265.6438" text-anchor="middle" font-size="17.7631" fill="var(--info-accent)" font-family="Arial, sans-serif">MERGE/UPDATE</text>
  <text x="741.5385" y="291.0685" text-anchor="middle" font-size="16.1483" fill="var(--text-muted)" font-family="Arial, sans-serif">103 rows total</text>
  <rect x="1012.7" y="158.791" width="48.4448" height="48.4448" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.8805" filter="url(#shadow)"/>
  <text x="1036.9231" y="190.9589" text-anchor="middle" font-size="19.3779" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">v3</text>
  <text x="1036.9231" y="151.2329" text-anchor="middle" font-size="17.7631" fill="var(--text)" font-family="Arial, sans-serif">Delete</text>
  <rect x="926.1539" y="238.6301" width="221.5385" height="63.5616" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1036.9231" y="265.6438" text-anchor="middle" font-size="17.7631" fill="var(--danger-accent)" font-family="Arial, sans-serif">DELETE 10 rows</text>
  <text x="1036.9231" y="291.0685" text-anchor="middle" font-size="16.1483" fill="var(--text-muted)" font-family="Arial, sans-serif">93 rows total</text>
  <rect x="58.4615" y="357.8082" width="1181.5385" height="87.3972" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="649.2307" y="394.3562" text-anchor="middle" font-size="22.6076" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Delta Transaction Log (_delta_log/)</text>
  <text x="649.2307" y="429.315" text-anchor="middle" font-size="19.3779" fill="var(--text)" font-family="Arial, sans-serif">00000.json | 00001.json | 00002.json | 00003.json</text>
  <rect x="58.4615" y="484.9315" width="516.9231" height="95.3425" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="316.923" y="521.4794" text-anchor="middle" font-size="19.3779" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Read by Version</text>
  <text x="316.923" y="556.4384" text-anchor="middle" font-size="19.3779" fill="var(--text)" font-family="Arial, sans-serif">.option("versionAsOf", "1")</text>
  <rect x="649.2307" y="484.9315" width="590.7693" height="95.3425" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="944.6154" y="521.4794" text-anchor="middle" font-size="19.3779" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Read by Timestamp</text>
  <text x="944.6154" y="556.4384" text-anchor="middle" font-size="19.3779" fill="var(--text)" font-family="Arial, sans-serif">.option("timestampAsOf", "2024-01-01")</text>
  <text x="649.2307" y="620" text-anchor="middle" font-size="19.3779" fill="var(--text-muted)" font-family="Arial, sans-serif">Every write creates a new version with full audit trail</text>
</svg>
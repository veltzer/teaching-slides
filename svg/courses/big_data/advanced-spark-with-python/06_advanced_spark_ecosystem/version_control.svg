<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="649.2307" y="40" text-anchor="middle" font-family="Arial" font-size="29.0669" font-weight="bold" fill="var(--primary-accent)">Delta Lake Version Control (Time Travel)</text>
  <line x1="58.4615" y1="183.0137" x2="1240" y2="183.0137" stroke="var(--primary-border)" stroke-width="2" />
  <circle cx="150.7692" cy="183.0137" r="24.2224" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.8805" />
  <text x="150.7692" y="190.9589" text-anchor="middle" font-family="Arial" font-size="19.3779" font-weight="bold" fill="var(--primary-accent)">v0</text>
  <text x="150.7692" y="151.2329" text-anchor="middle" font-family="Arial" font-size="17.7631" fill="var(--text)">Initial</text>
  <rect x="40" y="238.6301" width="221.5385" height="63.5616" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="150.7692" y="265.6438" text-anchor="middle" font-family="Arial" font-size="17.7631" fill="var(--ok-accent)">CREATE TABLE</text>
  <text x="150.7692" y="291.0685" text-anchor="middle" font-family="Arial" font-size="16.1483" fill="var(--text-muted)">3 rows</text>
  <circle cx="446.1539" cy="183.0137" r="24.2224" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.8805" />
  <text x="446.1539" y="190.9589" text-anchor="middle" font-family="Arial" font-size="19.3779" font-weight="bold" fill="var(--primary-accent)">v1</text>
  <text x="446.1539" y="151.2329" text-anchor="middle" font-family="Arial" font-size="17.7631" fill="var(--text)">Insert</text>
  <rect x="335.3846" y="238.6301" width="221.5385" height="63.5616" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="446.1539" y="265.6438" text-anchor="middle" font-family="Arial" font-size="17.7631" fill="var(--danger-accent)">INSERT 100 rows</text>
  <text x="446.1539" y="291.0685" text-anchor="middle" font-family="Arial" font-size="16.1483" fill="var(--text-muted)">103 rows total</text>
  <circle cx="741.5385" cy="183.0137" r="24.2224" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.8805" />
  <text x="741.5385" y="190.9589" text-anchor="middle" font-family="Arial" font-size="19.3779" font-weight="bold" fill="var(--primary-accent)">v2</text>
  <text x="741.5385" y="151.2329" text-anchor="middle" font-family="Arial" font-size="17.7631" fill="var(--text)">Update</text>
  <rect x="630.7693" y="238.6301" width="221.5385" height="63.5616" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="741.5385" y="265.6438" text-anchor="middle" font-family="Arial" font-size="17.7631" fill="var(--info-accent)">MERGE/UPDATE</text>
  <text x="741.5385" y="291.0685" text-anchor="middle" font-family="Arial" font-size="16.1483" fill="var(--text-muted)">103 rows total</text>
  <circle cx="1036.9231" cy="183.0137" r="24.2224" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.8805" />
  <text x="1036.9231" y="190.9589" text-anchor="middle" font-family="Arial" font-size="19.3779" font-weight="bold" fill="var(--primary-accent)">v3</text>
  <text x="1036.9231" y="151.2329" text-anchor="middle" font-family="Arial" font-size="17.7631" fill="var(--text)">Delete</text>
  <rect x="926.1539" y="238.6301" width="221.5385" height="63.5616" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1036.9231" y="265.6438" text-anchor="middle" font-family="Arial" font-size="17.7631" fill="var(--danger-accent)">DELETE 10 rows</text>
  <text x="1036.9231" y="291.0685" text-anchor="middle" font-family="Arial" font-size="16.1483" fill="var(--text-muted)">93 rows total</text>
  <rect x="58.4615" y="357.8082" width="1181.5385" height="87.3972" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="649.2307" y="394.3562" text-anchor="middle" font-family="Arial" font-size="22.6076" font-weight="bold" fill="var(--primary-accent)">Delta Transaction Log (_delta_log/)</text>
  <text x="649.2307" y="429.315" text-anchor="middle" font-family="Arial" font-size="19.3779" fill="var(--text)">00000.json | 00001.json | 00002.json | 00003.json</text>
  <rect x="58.4615" y="484.9315" width="516.9231" height="95.3425" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="316.923" y="521.4794" text-anchor="middle" font-family="Arial" font-size="19.3779" font-weight="bold" fill="var(--ok-accent)">Read by Version</text>
  <text x="316.923" y="556.4384" text-anchor="middle" font-family="Arial" font-size="19.3779" fill="var(--text)">.option("versionAsOf", "1")</text>
  <rect x="649.2307" y="484.9315" width="590.7693" height="95.3425" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="944.6154" y="521.4794" text-anchor="middle" font-family="Arial" font-size="19.3779" font-weight="bold" fill="var(--danger-accent)">Read by Timestamp</text>
  <text x="944.6154" y="556.4384" text-anchor="middle" font-family="Arial" font-size="19.3779" fill="var(--text)">.option("timestampAsOf", "2024-01-01")</text>
  <text x="649.2307" y="620" text-anchor="middle" font-family="Arial" font-size="19.3779" fill="var(--text-muted)">Every write creates a new version with full audit trail</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="624.2105" y="40" text-anchor="middle" font-family="Arial" font-size="26.8812" font-weight="bold" fill="var(--primary-accent)">Spark Workflow Management</text>
  <rect x="434.7368" y="71.7809" width="378.9474" height="87.3972" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="624.2105" y="108.3288" text-anchor="middle" font-family="Arial" font-size="22.401" font-weight="bold" fill="var(--primary-accent)">Apache Airflow / Orchestrator</text>
  <text x="624.2105" y="140.1095" text-anchor="middle" font-family="Arial" font-size="17.9208" fill="var(--text)">DAG scheduling &amp; monitoring</text>
  <rect x="40" y="222.7397" width="221.0526" height="103.2877" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.5263" y="262.4657" text-anchor="middle" font-family="Arial" font-size="19.4141" font-weight="bold" fill="var(--ok-accent)">Ingest</text>
  <text x="150.5263" y="294.2466" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">Raw data load</text>
  <text x="150.5263" y="314.9041" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">S3 / Kafka / DB</text>
  <rect x="308.421" y="222.7397" width="221.0526" height="103.2877" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="418.9474" y="262.4657" text-anchor="middle" font-family="Arial" font-size="19.4141" font-weight="bold" fill="var(--danger-accent)">Transform</text>
  <text x="418.9474" y="294.2466" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">Spark ETL jobs</text>
  <text x="418.9474" y="314.9041" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">Clean &amp; enrich</text>
  <rect x="576.8421" y="222.7397" width="221.0526" height="103.2877" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="687.3684" y="262.4657" text-anchor="middle" font-family="Arial" font-size="19.4141" font-weight="bold" fill="var(--info-accent)">Validate</text>
  <text x="687.3684" y="294.2466" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">Quality checks</text>
  <text x="687.3684" y="314.9041" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">Schema enforce</text>
  <rect x="845.2631" y="222.7397" width="221.0526" height="103.2877" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.7895" y="262.4657" text-anchor="middle" font-family="Arial" font-size="19.4141" font-weight="bold" fill="var(--danger-accent)">ML Pipeline</text>
  <text x="955.7895" y="294.2466" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">MLflow + Spark ML</text>
  <text x="955.7895" y="314.9041" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">Train &amp; evaluate</text>
  <line x1="261.0526" y1="275.1781" x2="308.421" y2="275.1781" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="529.4736" y1="275.1781" x2="576.8421" y2="275.1781" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="797.8947" y1="275.1781" x2="845.2631" y2="275.1781" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="529.4736" y1="159.1781" x2="150.5263" y2="222.7397" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="576.8421" y1="159.1781" x2="418.9474" y2="222.7397" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="671.5789" y1="159.1781" x2="687.3684" y2="222.7397" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="718.9473" y1="159.1781" x2="955.7895" y2="222.7397" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1097.8947" y="222.7397" width="142.1053" height="103.2877" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1168.9474" y="262.4657" text-anchor="middle" font-family="Arial" font-size="19.4141" font-weight="bold" fill="var(--primary-accent)">Serve</text>
  <text x="1168.9474" y="294.2466" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">Delta Lake</text>
  <text x="1168.9474" y="314.9041" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--text)">Dashboard</text>
  <line x1="1066.3157" y1="275.1781" x2="1097.8947" y2="275.1781" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="71.5789" y="397.5343" width="1105.2632" height="87.3972" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="624.2105" y="434.0822" text-anchor="middle" font-family="Arial" font-size="20.9076" font-weight="bold" fill="var(--text)">Orchestration Tools</text>
  <text x="624.2105" y="465.863" text-anchor="middle" font-family="Arial" font-size="17.9208" fill="var(--text)">Apache Airflow | Prefect | Dagster | AWS Step Functions | Azure Data Factory</text>
  <rect x="71.5789" y="516.7123" width="252.6316" height="63.5616" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="197.8947" y="556.4384" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--ok-accent)">Dependency Mgmt</text>
  <rect x="355.7895" y="516.7123" width="221.0526" height="63.5616" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.3157" y="556.4384" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--danger-accent)">Retry &amp; Backfill</text>
  <rect x="608.4211" y="516.7123" width="221.0526" height="63.5616" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="718.9473" y="556.4384" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--info-accent)">Alerting</text>
  <rect x="861.0526" y="516.7123" width="315.7895" height="63.5616" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1018.9474" y="556.4384" text-anchor="middle" font-family="Arial" font-size="16.4274" fill="var(--primary-accent)">SLA Monitoring</text>
  <text x="624.2105" y="620" text-anchor="middle" font-family="Arial" font-size="17.9208" fill="var(--text-muted)">End-to-end pipeline orchestration with dependency management</text>
</svg>
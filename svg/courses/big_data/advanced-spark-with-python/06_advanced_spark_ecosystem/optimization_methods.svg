<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632" y="40" text-anchor="middle" font-family="Arial" font-size="27.247" font-weight="bold" fill="var(--primary-accent)">Delta Lake / Spark Optimization Methods</text>
  <ellipse cx="632" cy="313.8888" rx="144.0001" ry="57.284" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9174" />
  <text x="632" y="305.8333" text-anchor="middle" font-family="Arial" font-size="21.1922" font-weight="bold" fill="var(--primary-accent)">Optimization</text>
  <text x="632" y="334.8334" text-anchor="middle" font-family="Arial" font-size="18.1647" fill="var(--text)">Strategies</text>
  <rect x="40" y="80.2777" width="256" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.9999" y="117.3333" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)">File Compaction</text>
  <text x="167.9999" y="149.5555" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">OPTIMIZE command</text>
  <text x="167.9999" y="173.7222" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Merge small files</text>
  <line x1="296" y1="144.7222" x2="496" y2="281.6666" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="360" y="80.2777" width="256" height="104.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.9999" y="117.3333" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)">Z-Ordering</text>
  <text x="487.9999" y="149.5555" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Data skipping</text>
  <text x="487.9999" y="173.7222" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Co-locate columns</text>
  <line x1="552" y1="185" x2="600" y2="257.5" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="680" y="80.2777" width="256" height="104.7223" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="117.3333" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--info-accent)">Partitioning</text>
  <text x="808" y="149.5555" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Partition pruning</text>
  <text x="808" y="173.7222" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">By date/key columns</text>
  <line x1="752" y1="185" x2="680" y2="257.5" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="984" y="80.2777" width="256" height="104.7223" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="117.3333" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)">Caching</text>
  <text x="1112" y="149.5555" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">df.cache() / persist()</text>
  <text x="1112" y="173.7222" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Memory + Disk</text>
  <line x1="1000" y1="152.7778" x2="772.8" y2="289.7222" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="442.7778" width="256" height="104.7223" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.9999" y="479.8334" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--primary-accent)">Vacuum</text>
  <text x="167.9999" y="512.0556" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Remove old files</text>
  <text x="167.9999" y="536.2223" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Retention period</text>
  <line x1="296" y1="483.0555" x2="496" y2="354.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="360" y="442.7778" width="256" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.9999" y="479.8334" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)">AQE</text>
  <text x="487.9999" y="512.0556" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Adaptive Query</text>
  <text x="487.9999" y="536.2223" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Runtime optimization</text>
  <line x1="552" y1="442.7778" x2="607.9999" y2="378.3334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="680" y="442.7778" width="256" height="104.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="479.8334" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)">Broadcast Joins</text>
  <text x="808" y="512.0556" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Small table broadcast</text>
  <text x="808" y="536.2223" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Avoid shuffles</text>
  <line x1="743.9999" y1="442.7778" x2="664" y2="378.3334" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="984" y="442.7778" width="256" height="104.7223" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="479.8334" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--info-accent)">Pushdown</text>
  <text x="1112" y="512.0556" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Predicate pushdown</text>
  <text x="1112" y="536.2223" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Column pruning</text>
  <line x1="1000" y1="475" x2="772.8" y2="346.1111" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="632" y="620" text-anchor="middle" font-family="Arial" font-size="18.1647" fill="var(--text-muted)">Combine multiple strategies for maximum performance gains</text>
</svg>
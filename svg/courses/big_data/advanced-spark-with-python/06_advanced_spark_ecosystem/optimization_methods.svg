  <line x1="510.5413" y1="196.9231" x2="554.302" y2="270.7692" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="627.2365" y="90.2564" width="233.3903" height="106.6667" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="743.9316" y="128" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--info-accent)">Partitioning</text>
  <text x="743.9316" y="160.8205" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Partition pruning</text>

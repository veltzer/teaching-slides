  <line x1="692.8775" y1="196.9231" x2="627.2365" y2="270.7692" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="904.3875" y="90.2564" width="233.3903" height="106.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1021.0826" y="128" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">Caching</text>
  <text x="1021.0826" y="160.8205" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">df.cache() / persist()</text>

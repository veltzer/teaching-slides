<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632" y="40" text-anchor="middle" font-size="27.247" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Delta Lake / Spark Optimization Methods</text>
  <ellipse cx="632" cy="313.8888" rx="144.0001" ry="57.284" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9174" />
  <text x="632" y="305.8333" text-anchor="middle" font-size="21.1922" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Optimization</text>
  <text x="632" y="334.8334" text-anchor="middle" font-size="18.1647" fill="var(--text)" font-family="Arial, sans-serif">Strategies</text>
  <rect x="40" y="80.2777" width="256" height="104.7223" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.9999" y="117.3333" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">File Compaction</text>
  <text x="167.9999" y="149.5555" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">OPTIMIZE command</text>
  <text x="167.9999" y="173.7222" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Merge small files</text>
  <line x1="296" y1="144.7222" x2="496" y2="281.6666" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="360" y="80.2777" width="256" height="104.7223" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.9999" y="117.3333" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Z-Ordering</text>
  <text x="487.9999" y="149.5555" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Data skipping</text>
  <text x="487.9999" y="173.7222" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Co-locate columns</text>
  <line x1="552" y1="185" x2="600" y2="257.5" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="680" y="80.2777" width="256" height="104.7223" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="117.3333" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Partitioning</text>
  <text x="808" y="149.5555" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Partition pruning</text>
  <text x="808" y="173.7222" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">By date/key columns</text>
  <line x1="752" y1="185" x2="680" y2="257.5" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="984" y="80.2777" width="256" height="104.7223" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="117.3333" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Caching</text>
  <text x="1112" y="149.5555" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">df.cache() / persist()</text>
  <text x="1112" y="173.7222" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Memory + Disk</text>
  <line x1="1000" y1="152.7778" x2="772.8" y2="289.7222" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="442.7778" width="256" height="104.7223" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.9999" y="479.8334" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Vacuum</text>
  <text x="167.9999" y="512.0556" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Remove old files</text>
  <text x="167.9999" y="536.2223" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Retention period</text>
  <line x1="296" y1="483.0555" x2="496" y2="354.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="360" y="442.7778" width="256" height="104.7223" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.9999" y="479.8334" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">AQE</text>
  <text x="487.9999" y="512.0556" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Adaptive Query</text>
  <text x="487.9999" y="536.2223" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Runtime optimization</text>
  <line x1="552" y1="442.7778" x2="607.9999" y2="378.3334" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="680" y="442.7778" width="256" height="104.7223" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808" y="479.8334" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Broadcast Joins</text>
  <text x="808" y="512.0556" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Small table broadcast</text>
  <text x="808" y="536.2223" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Avoid shuffles</text>
  <line x1="743.9999" y1="442.7778" x2="664" y2="378.3334" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="984" y="442.7778" width="256" height="104.7223" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="479.8334" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Pushdown</text>
  <text x="1112" y="512.0556" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Predicate pushdown</text>
  <text x="1112" y="536.2223" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Column pruning</text>
  <line x1="1000" y1="475" x2="772.8" y2="346.1111" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="632" y="620" text-anchor="middle" font-size="18.1647" fill="var(--text-muted)" font-family="Arial, sans-serif">Combine multiple strategies for maximum performance gains</text>
</svg>
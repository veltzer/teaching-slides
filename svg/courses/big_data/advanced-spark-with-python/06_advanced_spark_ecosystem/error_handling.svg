<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.2627" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Error Handling Patterns</text>
  <rect x="40" y="75.3658" width="259.4595" height="77.8049" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="107.9024" text-anchor="middle" font-size="19.6898" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">OOM Errors</text>
  <text x="169.7297" y="136.1951" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">Memory overflow</text>
  <rect x="331.8918" y="75.3658" width="259.4595" height="77.8049" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.6216" y="107.9024" text-anchor="middle" font-size="19.6898" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data Skew</text>
  <text x="461.6216" y="136.1951" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">Uneven partitions</text>
  <rect x="623.7837" y="75.3658" width="259.4595" height="77.8049" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5135" y="107.9024" text-anchor="middle" font-size="19.6898" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Serialization</text>
  <text x="753.5135" y="136.1951" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">Pickle / Kryo errors</text>
  <rect x="915.6757" y="75.3658" width="324.3243" height="77.8049" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8379" y="107.9024" text-anchor="middle" font-size="19.6898" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Task Failures</text>
  <text x="1077.8379" y="136.1951" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">Network / disk / timeout</text>
  <line x1="169.7297" y1="153.1707" x2="169.7297" y2="202.6829" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="461.6216" y1="153.1707" x2="461.6216" y2="202.6829" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="753.5135" y1="153.1707" x2="753.5135" y2="202.6829" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1077.8379" y1="153.1707" x2="1077.8379" y2="202.6829" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="202.6829" width="259.4595" height="91.9513" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="235.2195" text-anchor="middle" font-size="18.1751" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Increase memory</text>
  <text x="169.7297" y="260.6829" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">offHeap.enabled</text>
  <text x="169.7297" y="283.3171" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">Repartition data</text>
  <rect x="331.8918" y="202.6829" width="259.4595" height="91.9513" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.6216" y="235.2195" text-anchor="middle" font-size="18.1751" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Salting keys</text>
  <text x="461.6216" y="260.6829" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">AQE skew join</text>
  <text x="461.6216" y="283.3171" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">Broadcast join</text>
  <rect x="623.7837" y="202.6829" width="259.4595" height="91.9513" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5135" y="235.2195" text-anchor="middle" font-size="18.1751" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Use Kryo serializer</text>
  <text x="753.5135" y="260.6829" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">Register classes</text>
  <text x="753.5135" y="283.3171" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">Avoid closures</text>
  <rect x="915.6757" y="202.6829" width="324.3243" height="91.9513" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8379" y="235.2195" text-anchor="middle" font-size="18.1751" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Retry config</text>
  <text x="1077.8379" y="260.6829" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">maxRetries = 4</text>
  <text x="1077.8379" y="283.3171" text-anchor="middle" font-size="16.6606" fill="var(--text)" font-family="Arial, sans-serif">Speculation mode</text>
  <rect x="72.4324" y="351.2195" width="1135.1352" height="113.1707" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="386.5854" text-anchor="middle" font-size="21.2043" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Application-Level Error Handling</text>
  <rect x="104.8648" y="407.8049" width="243.2432" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="436.0976" text-anchor="middle" font-size="16.6606" fill="var(--danger-accent)" font-family="Arial, sans-serif">try/except blocks</text>
  <rect x="380.5405" y="407.8049" width="243.2432" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.1621" y="436.0976" text-anchor="middle" font-size="16.6606" fill="var(--danger-accent)" font-family="Arial, sans-serif">Accumulator errors</text>
  <rect x="656.2162" y="407.8049" width="243.2432" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="777.8378" y="436.0976" text-anchor="middle" font-size="16.6606" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dead letter queue</text>
  <rect x="931.8919" y="407.8049" width="243.2432" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="436.0976" text-anchor="middle" font-size="16.6606" fill="var(--danger-accent)" font-family="Arial, sans-serif">Checkpointing</text>
  <rect x="72.4324" y="506.8293" width="1135.1352" height="56.5854" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="542.1951" text-anchor="middle" font-size="19.6898" fill="var(--primary-accent)" font-family="Arial, sans-serif">Log Analysis (Spark UI) | Metrics Alerts | Error Rate Dashboards | Auto-restart policies</text>
  <text x="640" y="620" text-anchor="middle" font-size="18.1751" fill="var(--text-muted)" font-family="Arial, sans-serif">Resilient Spark applications handle failures gracefully at every level</text>
</svg>

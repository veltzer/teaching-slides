<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="259.4595" height="82.857158070499" rx="6.191741157425" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="74.649362820036" text-anchor="middle" font-size="20.319024173578" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">OOM Errors</text>
  <text x="169.7297" y="104.779248163263" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">Memory overflow</text>
  <rect x="331.8918" y="40" width="259.4595" height="82.857158070499" rx="6.191741157425" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.6216" y="74.649362820036" text-anchor="middle" font-size="20.319024173578" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data Skew</text>
  <text x="461.6216" y="104.779248163263" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">Uneven partitions</text>
  <rect x="623.7837" y="40" width="259.4595" height="82.857158070499" rx="6.191741157425" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5135" y="74.649362820036" text-anchor="middle" font-size="20.319024173578" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Serialization</text>
  <text x="753.5135" y="104.779248163263" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">Pickle / Kryo errors</text>
  <rect x="915.6757" y="40" width="324.3243" height="82.857158070499" rx="6.191741157425" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8379" y="74.649362820036" text-anchor="middle" font-size="20.319024173578" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Task Failures</text>
  <text x="1077.8379" y="104.779248163263" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">Network / disk / timeout</text>
  <line x1="169.7297" y1="122.857158070499" x2="169.7297" y2="175.584430797772" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="461.6216" y1="122.857158070499" x2="461.6216" y2="175.584430797772" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="753.5135" y1="122.857158070499" x2="753.5135" y2="175.584430797772" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1077.8379" y1="122.857158070499" x2="1077.8379" y2="175.584430797772" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="175.584430797772" width="259.4595" height="97.922153988861" rx="6.191741157425" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="210.233793617808" text-anchor="middle" font-size="18.755919118386" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Increase memory</text>
  <text x="169.7297" y="237.350658478663" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">offHeap.enabled</text>
  <text x="169.7297" y="261.454609350643" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">Repartition data</text>
  <rect x="331.8918" y="175.584430797772" width="259.4595" height="97.922153988861" rx="6.191741157425" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.6216" y="210.233793617808" text-anchor="middle" font-size="18.755919118386" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Salting keys</text>
  <text x="461.6216" y="237.350658478663" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">AQE skew join</text>
  <text x="461.6216" y="261.454609350643" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">Broadcast join</text>
  <rect x="623.7837" y="175.584430797772" width="259.4595" height="97.922153988861" rx="6.191741157425" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5135" y="210.233793617808" text-anchor="middle" font-size="18.755919118386" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Use Kryo serializer</text>
  <text x="753.5135" y="237.350658478663" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">Register classes</text>
  <text x="753.5135" y="261.454609350643" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">Avoid closures</text>
  <rect x="915.6757" y="175.584430797772" width="324.3243" height="97.922153988861" rx="6.191741157425" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8379" y="210.233793617808" text-anchor="middle" font-size="18.755919118386" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Retry config</text>
  <text x="1077.8379" y="237.350658478663" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">maxRetries = 4</text>
  <text x="1077.8379" y="261.454609350643" text-anchor="middle" font-size="17.193020454566" fill="var(--text)" font-family="Arial, sans-serif">Speculation mode</text>

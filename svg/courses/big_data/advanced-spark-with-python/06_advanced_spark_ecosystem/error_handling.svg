<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="27.2627" font-weight="bold" fill="var(--primary-accent)">Spark Error Handling Patterns</text>
  <rect x="40" y="75.3658" width="259.4595" height="77.8049" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="107.9024" text-anchor="middle" font-family="Arial" font-size="19.6898" font-weight="bold" fill="var(--danger-accent)">OOM Errors</text>
  <text x="169.7297" y="136.1951" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">Memory overflow</text>
  <rect x="331.8918" y="75.3658" width="259.4595" height="77.8049" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.6216" y="107.9024" text-anchor="middle" font-family="Arial" font-size="19.6898" font-weight="bold" fill="var(--danger-accent)">Data Skew</text>
  <text x="461.6216" y="136.1951" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">Uneven partitions</text>
  <rect x="623.7837" y="75.3658" width="259.4595" height="77.8049" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5135" y="107.9024" text-anchor="middle" font-family="Arial" font-size="19.6898" font-weight="bold" fill="var(--danger-accent)">Serialization</text>
  <text x="753.5135" y="136.1951" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">Pickle / Kryo errors</text>
  <rect x="915.6757" y="75.3658" width="324.3243" height="77.8049" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8379" y="107.9024" text-anchor="middle" font-family="Arial" font-size="19.6898" font-weight="bold" fill="var(--danger-accent)">Task Failures</text>
  <text x="1077.8379" y="136.1951" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">Network / disk / timeout</text>
  <line x1="169.7297" y1="153.1707" x2="169.7297" y2="202.6829" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="461.6216" y1="153.1707" x2="461.6216" y2="202.6829" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="753.5135" y1="153.1707" x2="753.5135" y2="202.6829" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1077.8379" y1="153.1707" x2="1077.8379" y2="202.6829" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="202.6829" width="259.4595" height="91.9513" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="235.2195" text-anchor="middle" font-family="Arial" font-size="18.1751" font-weight="bold" fill="var(--ok-accent)">Increase memory</text>
  <text x="169.7297" y="260.6829" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">offHeap.enabled</text>
  <text x="169.7297" y="283.3171" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">Repartition data</text>
  <rect x="331.8918" y="202.6829" width="259.4595" height="91.9513" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.6216" y="235.2195" text-anchor="middle" font-family="Arial" font-size="18.1751" font-weight="bold" fill="var(--ok-accent)">Salting keys</text>
  <text x="461.6216" y="260.6829" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">AQE skew join</text>
  <text x="461.6216" y="283.3171" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">Broadcast join</text>
  <rect x="623.7837" y="202.6829" width="259.4595" height="91.9513" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="753.5135" y="235.2195" text-anchor="middle" font-family="Arial" font-size="18.1751" font-weight="bold" fill="var(--ok-accent)">Use Kryo serializer</text>
  <text x="753.5135" y="260.6829" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">Register classes</text>
  <text x="753.5135" y="283.3171" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">Avoid closures</text>
  <rect x="915.6757" y="202.6829" width="324.3243" height="91.9513" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8379" y="235.2195" text-anchor="middle" font-family="Arial" font-size="18.1751" font-weight="bold" fill="var(--ok-accent)">Retry config</text>
  <text x="1077.8379" y="260.6829" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">maxRetries = 4</text>
  <text x="1077.8379" y="283.3171" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--text)">Speculation mode</text>
  <rect x="72.4324" y="351.2195" width="1135.1352" height="113.1707" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="386.5854" text-anchor="middle" font-family="Arial" font-size="21.2043" font-weight="bold" fill="var(--primary-accent)">Application-Level Error Handling</text>
  <rect x="104.8648" y="407.8049" width="243.2432" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="436.0976" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--danger-accent)">try/except blocks</text>
  <rect x="380.5405" y="407.8049" width="243.2432" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.1621" y="436.0976" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--danger-accent)">Accumulator errors</text>
  <rect x="656.2162" y="407.8049" width="243.2432" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="777.8378" y="436.0976" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--danger-accent)">Dead letter queue</text>
  <rect x="931.8919" y="407.8049" width="243.2432" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="436.0976" text-anchor="middle" font-family="Arial" font-size="16.6606" fill="var(--danger-accent)">Checkpointing</text>
  <rect x="72.4324" y="506.8293" width="1135.1352" height="56.5854" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="542.1951" text-anchor="middle" font-family="Arial" font-size="19.6898" fill="var(--primary-accent)">Log Analysis (Spark UI) | Metrics Alerts | Error Rate Dashboards | Auto-restart policies</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial" font-size="18.1751" fill="var(--text-muted)">Resilient Spark applications handle failures gracefully at every level</text>
</svg>
  <text x="640" y="371.428632281998" text-anchor="middle" font-size="21.881922837399" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Application-Level Error Handling</text>
  <rect x="104.8648" y="394.026019666044" width="243.2432" height="45.194881261588" rx="6.191741157425" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="424.15590500927" text-anchor="middle" font-size="17.193020454566" fill="var(--danger-accent)" font-family="Arial, sans-serif">try/except blocks</text>
  <rect x="380.5405" y="394.026019666044" width="243.2432" height="45.194881261588" rx="6.191741157425" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.1621" y="424.15590500927" text-anchor="middle" font-size="17.193020454566" fill="var(--danger-accent)" font-family="Arial, sans-serif">Accumulator errors</text>
  <rect x="656.2162" y="394.026019666044" width="243.2432" height="45.194881261588" rx="6.191741157425" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="777.8378" y="424.15590500927" text-anchor="middle" font-size="17.193020454566" fill="var(--danger-accent)" font-family="Arial, sans-serif">Dead letter queue</text>
  <rect x="931.8919" y="394.026019666044" width="243.2432" height="45.194881261588" rx="6.191741157425" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="424.15590500927" text-anchor="middle" font-size="17.193020454566" fill="var(--danger-accent)" font-family="Arial, sans-serif">Checkpointing</text>
  <rect x="72.4324" y="499.480565120589" width="1135.1352" height="60.259770686453" rx="6.191741157425" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="537.142841929501" text-anchor="middle" font-size="20.319024173578" fill="var(--primary-accent)" font-family="Arial, sans-serif">Log Analysis (Spark UI) | Metrics Alerts | Error Rate Dashboards | Auto-restart policies</text>
  <text x="640" y="620" text-anchor="middle" font-size="18.755919118386" fill="var(--text-muted)" font-family="Arial, sans-serif">Resilient Spark applications handle failures gracefully at every level</text>
</svg>

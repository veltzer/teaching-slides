<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="581.8182" y="43.6364" text-anchor="middle" font-family="Arial" font-size="26.1818" font-weight="bold" fill="var(--primary-accent)">Spark Error Handling Patterns</text>
  <rect x="43.6364" y="80" width="232.7273" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="160" y="113.4545" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--danger-accent)">OOM Errors</text>
  <text x="160" y="142.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Memory overflow</text>
  <rect x="305.4545" y="80" width="232.7273" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="421.8182" y="113.4545" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--danger-accent)">Data Skew</text>
  <text x="421.8182" y="142.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Uneven partitions</text>
  <rect x="567.2727" y="80" width="232.7273" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="683.6364" y="113.4545" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--danger-accent)">Serialization</text>
  <text x="683.6364" y="142.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Pickle / Kryo errors</text>
  <rect x="829.0909" y="80" width="290.9091" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="974.5455" y="113.4545" text-anchor="middle" font-family="Arial" font-size="18.9091" font-weight="bold" fill="var(--danger-accent)">Task Failures</text>
  <text x="974.5455" y="142.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Network / disk / timeout</text>
  <line x1="160" y1="160" x2="160" y2="210.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="421.8182" y1="160" x2="421.8182" y2="210.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="683.6364" y1="160" x2="683.6364" y2="210.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="974.5455" y1="160" x2="974.5455" y2="210.9091" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="43.6364" y="210.9091" width="232.7273" height="94.5455" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="160" y="244.3636" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--ok-accent)">Increase memory</text>
  <text x="160" y="270.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">offHeap.enabled</text>
  <text x="160" y="293.8182" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Repartition data</text>
  <rect x="305.4545" y="210.9091" width="232.7273" height="94.5455" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="421.8182" y="244.3636" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--ok-accent)">Salting keys</text>
  <text x="421.8182" y="270.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">AQE skew join</text>
  <text x="421.8182" y="293.8182" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Broadcast join</text>
  <rect x="567.2727" y="210.9091" width="232.7273" height="94.5455" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="683.6364" y="244.3636" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--ok-accent)">Use Kryo serializer</text>
  <text x="683.6364" y="270.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Register classes</text>
  <text x="683.6364" y="293.8182" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Avoid closures</text>
  <rect x="829.0909" y="210.9091" width="290.9091" height="94.5455" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="974.5455" y="244.3636" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--ok-accent)">Retry config</text>
  <text x="974.5455" y="270.5455" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">maxRetries = 4</text>
  <text x="974.5455" y="293.8182" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Speculation mode</text>
  <rect x="72.7273" y="363.6364" width="1018.1818" height="116.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="581.8182" y="400" text-anchor="middle" font-family="Arial" font-size="20.3636" font-weight="bold" fill="var(--primary-accent)">Application-Level Error Handling</text>
  <rect x="101.8182" y="421.8182" width="218.1818" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="210.9091" y="450.9091" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--danger-accent)">try/except blocks</text>
  <rect x="349.0909" y="421.8182" width="218.1818" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="458.1818" y="450.9091" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--danger-accent)">Accumulator errors</text>
  <rect x="596.3636" y="421.8182" width="218.1818" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="705.4545" y="450.9091" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--danger-accent)">Dead letter queue</text>
  <rect x="843.6364" y="421.8182" width="218.1818" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="952.7273" y="450.9091" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--danger-accent)">Checkpointing</text>
  <rect x="72.7273" y="523.6364" width="1018.1818" height="58.1818" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="581.8182" y="560" text-anchor="middle" font-family="Arial" font-size="18.9091" fill="var(--primary-accent)">Log Analysis (Spark UI) | Metrics Alerts | Error Rate Dashboards | Auto-restart policies</text>
  <text x="581.8182" y="640" text-anchor="middle" font-family="Arial" font-size="17.4545" fill="var(--text-muted)">Resilient Spark applications handle failures gracefully at every level</text>
</svg>
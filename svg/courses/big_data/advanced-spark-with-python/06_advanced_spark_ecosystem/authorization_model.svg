<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="583.4758" y="49.2308" text-anchor="middle" font-family="Arial" font-size="26.2564" font-weight="bold" fill="var(--primary-accent)">Spark Security / Authorization Model</text>
  <rect x="43.7607" y="98.4615" width="175.0427" height="180.5128" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="131.2821" y="139.4872" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--primary-accent)">Users</text>
  <text x="131.2821" y="177.2308" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Admin</text>
  <text x="131.2821" y="210.0513" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Data Engineer</text>
  <text x="131.2821" y="242.8718" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Analyst</text>
  <text x="131.2821" y="267.4872" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Service Account</text>
  <rect x="291.7379" y="98.4615" width="233.3903" height="180.5128" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="408.433" y="139.4872" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">Authentication</text>
  <text x="408.433" y="177.2308" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Kerberos</text>
  <text x="408.433" y="210.0513" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">LDAP / AD</text>
  <text x="408.433" y="242.8718" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">OAuth 2.0 / OIDC</text>
  <text x="408.433" y="267.4872" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">IAM Roles (Cloud)</text>
  <line x1="218.8034" y1="188.7179" x2="291.7379" y2="188.7179" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="598.0627" y="98.4615" width="247.9772" height="180.5128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="722.0513" y="139.4872" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--ok-accent)">Authorization</text>
  <text x="722.0513" y="177.2308" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Apache Ranger</text>
  <text x="722.0513" y="210.0513" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Table-level ACLs</text>
  <text x="722.0513" y="242.8718" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Column masking</text>
  <text x="722.0513" y="267.4872" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Row-level filters</text>
  <line x1="525.1282" y1="188.7179" x2="598.0627" y2="188.7179" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="918.9744" y="98.4615" width="218.8034" height="180.5128" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1028.3761" y="139.4872" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--info-accent)">Data Access</text>
  <text x="1028.3761" y="177.2308" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Tables</text>
  <text x="1028.3761" y="210.0513" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Databases</text>
  <text x="1028.3761" y="242.8718" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Files (S3/HDFS)</text>
  <text x="1028.3761" y="267.4872" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Catalogs</text>
  <line x1="846.0399" y1="188.7179" x2="918.9744" y2="188.7179" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="145.8689" y="361.0256" width="875.2137" height="82.0513" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="583.4758" y="393.8462" text-anchor="middle" font-family="Arial" font-size="20.4217" font-weight="bold" fill="var(--danger-accent)">Encryption Layer</text>
  <text x="583.4758" y="426.6667" text-anchor="middle" font-family="Arial" font-size="17.5043" fill="var(--text)">SSL/TLS (in-transit) | AES-256 (at-rest) | Shuffle encryption | RPC encryption</text>
  <rect x="145.8689" y="475.8974" width="875.2137" height="82.0513" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="583.4758" y="508.7179" text-anchor="middle" font-family="Arial" font-size="20.4217" font-weight="bold" fill="var(--primary-accent)">Audit &amp; Compliance</text>
  <text x="583.4758" y="541.5385" text-anchor="middle" font-family="Arial" font-size="17.5043" fill="var(--text)">Access logs | Query audit | Data lineage | Policy enforcement</text>
  <rect x="145.8689" y="582.5641" width="875.2137" height="57.4359" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="583.4758" y="620.3077" text-anchor="middle" font-family="Arial" font-size="17.5043" fill="var(--text-muted)">GDPR | HIPAA | SOC2 | PCI-DSS Compliance</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632" y="40" text-anchor="middle" font-size="27.247" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Security / Authorization Model</text>
  <rect x="40" y="88.3333" width="192" height="177.2222" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="128.6111" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Users</text>
  <text x="136" y="165.6667" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Admin</text>
  <text x="136" y="197.8889" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Data Engineer</text>
  <text x="136" y="230.1111" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Analyst</text>
  <text x="136" y="254.2778" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Service Account</text>
  <rect x="312" y="88.3333" width="256" height="177.2222" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="439.9999" y="128.6111" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Authentication</text>
  <text x="439.9999" y="165.6667" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Kerberos</text>
  <text x="439.9999" y="197.8889" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">LDAP / AD</text>
  <text x="439.9999" y="230.1111" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">OAuth 2.0 / OIDC</text>
  <text x="439.9999" y="254.2778" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">IAM Roles (Cloud)</text>
  <line x1="232" y1="176.9444" x2="312" y2="176.9444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="648" y="88.3333" width="272" height="177.2222" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784" y="128.6111" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Authorization</text>
  <text x="784" y="165.6667" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Apache Ranger</text>
  <text x="784" y="197.8889" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Table-level ACLs</text>
  <text x="784" y="230.1111" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Column masking</text>
  <text x="784" y="254.2778" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Row-level filters</text>
  <line x1="568" y1="176.9444" x2="648" y2="176.9444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1000" y="88.3333" width="240" height="177.2222" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="128.6111" text-anchor="middle" font-size="19.6784" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Data Access</text>
  <text x="1120" y="165.6667" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Tables</text>
  <text x="1120" y="197.8889" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Databases</text>
  <text x="1120" y="230.1111" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Files (S3/HDFS)</text>
  <text x="1120" y="254.2778" text-anchor="middle" font-size="16.651" fill="var(--text)" font-family="Arial, sans-serif">Catalogs</text>
  <line x1="920" y1="176.9444" x2="1000" y2="176.9444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="151.9999" y="346.1111" width="960" height="80.5556" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="378.3334" text-anchor="middle" font-size="21.1922" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Encryption Layer</text>
  <text x="632" y="410.5556" text-anchor="middle" font-size="18.1647" fill="var(--text)" font-family="Arial, sans-serif">SSL/TLS (in-transit) | AES-256 (at-rest) | Shuffle encryption | RPC encryption</text>
  <rect x="151.9999" y="458.8888" width="960" height="80.5556" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="491.1111" text-anchor="middle" font-size="21.1922" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Audit &amp; Compliance</text>
  <text x="632" y="523.3334" text-anchor="middle" font-size="18.1647" fill="var(--text)" font-family="Arial, sans-serif">Access logs | Query audit | Data lineage | Policy enforcement</text>
  <rect x="151.9999" y="563.6111" width="960" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="632" y="600.6667" text-anchor="middle" font-size="18.1647" fill="var(--text-muted)" font-family="Arial, sans-serif">GDPR | HIPAA | SOC2 | PCI-DSS Compliance</text>
</svg>
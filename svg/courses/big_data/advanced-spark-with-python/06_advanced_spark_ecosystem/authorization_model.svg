<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632" y="40" text-anchor="middle" font-family="Arial" font-size="27.247" font-weight="bold" fill="var(--primary-accent)">Spark Security / Authorization Model</text>
  <rect x="40" y="88.3333" width="192" height="177.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="128.6111" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--primary-accent)">Users</text>
  <text x="136" y="165.6667" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Admin</text>
  <text x="136" y="197.8889" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Data Engineer</text>
  <text x="136" y="230.1111" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Analyst</text>
  <text x="136" y="254.2778" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Service Account</text>
  <rect x="312" y="88.3333" width="256" height="177.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="439.9999" y="128.6111" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--danger-accent)">Authentication</text>
  <text x="439.9999" y="165.6667" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Kerberos</text>
  <text x="439.9999" y="197.8889" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">LDAP / AD</text>
  <text x="439.9999" y="230.1111" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">OAuth 2.0 / OIDC</text>
  <text x="439.9999" y="254.2778" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">IAM Roles (Cloud)</text>
  <line x1="232" y1="176.9444" x2="312" y2="176.9444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="648" y="88.3333" width="272" height="177.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784" y="128.6111" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--ok-accent)">Authorization</text>
  <text x="784" y="165.6667" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Apache Ranger</text>
  <text x="784" y="197.8889" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Table-level ACLs</text>
  <text x="784" y="230.1111" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Column masking</text>
  <text x="784" y="254.2778" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Row-level filters</text>
  <line x1="568" y1="176.9444" x2="648" y2="176.9444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1000" y="88.3333" width="240" height="177.2222" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="128.6111" text-anchor="middle" font-family="Arial" font-size="19.6784" font-weight="bold" fill="var(--info-accent)">Data Access</text>
  <text x="1120" y="165.6667" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Tables</text>
  <text x="1120" y="197.8889" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Databases</text>
  <text x="1120" y="230.1111" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Files (S3/HDFS)</text>
  <text x="1120" y="254.2778" text-anchor="middle" font-family="Arial" font-size="16.651" fill="var(--text)">Catalogs</text>
  <line x1="920" y1="176.9444" x2="1000" y2="176.9444" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="151.9999" y="346.1111" width="960" height="80.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="378.3334" text-anchor="middle" font-family="Arial" font-size="21.1922" font-weight="bold" fill="var(--danger-accent)">Encryption Layer</text>
  <text x="632" y="410.5556" text-anchor="middle" font-family="Arial" font-size="18.1647" fill="var(--text)">SSL/TLS (in-transit) | AES-256 (at-rest) | Shuffle encryption | RPC encryption</text>
  <rect x="151.9999" y="458.8888" width="960" height="80.5556" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="491.1111" text-anchor="middle" font-family="Arial" font-size="21.1922" font-weight="bold" fill="var(--primary-accent)">Audit &amp; Compliance</text>
  <text x="632" y="523.3334" text-anchor="middle" font-family="Arial" font-size="18.1647" fill="var(--text)">Access logs | Query audit | Data lineage | Policy enforcement</text>
  <rect x="151.9999" y="563.6111" width="960" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="632" y="600.6667" text-anchor="middle" font-family="Arial" font-size="18.1647" fill="var(--text-muted)">GDPR | HIPAA | SOC2 | PCI-DSS Compliance</text>
</svg>
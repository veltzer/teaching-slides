<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="619.3103" y="40" text-anchor="middle" font-size="27.5224" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Future Planning Roadmap</text>
  <line x1="56.5517" y1="119.4521" x2="1198.6207" y2="119.4521" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1231.7242" y="127.3972" font-size="18.3482" fill="var(--primary-accent)" font-family="Arial, sans-serif">Time</text>
  <rect x="56.5517" y="143.2877" width="264.8276" height="214.5206" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="176.733" y="107.22" width="24.4644" height="24.4644" rx="12.2322" fill="var(--ok-accent)"/>
  <text x="188.9655" y="175.0685" text-anchor="middle" font-size="19.8772" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Current State</text>
  <text x="188.9655" y="211.6164" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Spark 3.x</text>
  <text x="188.9655" y="240.2192" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Batch + Streaming</text>
  <text x="188.9655" y="268.822" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Delta Lake</text>
  <text x="188.9655" y="297.4246" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">K8s deployment</text>
  <text x="188.9655" y="326.0274" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">MLflow integration</text>
  <rect x="362.7585" y="143.2877" width="264.8276" height="214.5206" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="482.94" y="107.22" width="24.4644" height="24.4644" rx="12.2322" fill="var(--warn-accent)"/>
  <text x="495.1723" y="175.0685" text-anchor="middle" font-size="19.8772" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Short-term</text>
  <text x="495.1723" y="211.6164" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Spark Connect</text>
  <text x="495.1723" y="240.2192" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Photon engine</text>
  <text x="495.1723" y="268.822" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Serverless Spark</text>
  <text x="495.1723" y="297.4246" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Unity Catalog</text>
  <text x="495.1723" y="326.0274" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Enhanced AQE</text>
  <rect x="668.9655" y="143.2877" width="264.8276" height="214.5206" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="789.147" y="107.22" width="24.4644" height="24.4644" rx="12.2322" fill="var(--info-accent)"/>
  <text x="801.3793" y="175.0685" text-anchor="middle" font-size="19.8772" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Mid-term</text>
  <text x="801.3793" y="211.6164" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">GPU acceleration</text>
  <text x="801.3793" y="240.2192" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Lakehouse native</text>
  <text x="801.3793" y="268.822" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">AI-driven tuning</text>
  <text x="801.3793" y="297.4246" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Real-time ML</text>
  <text x="801.3793" y="326.0274" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Data mesh support</text>
  <rect x="975.1724" y="143.2877" width="264.8276" height="214.5206" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1095.35" y="107.22" width="24.4644" height="24.4644" rx="12.2322" fill="var(--primary-accent)"/>
  <text x="1107.5862" y="175.0685" text-anchor="middle" font-size="19.8772" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Long-term</text>
  <text x="1107.5862" y="211.6164" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Autonomous tuning</text>
  <text x="1107.5862" y="240.2192" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Edge computing</text>
  <text x="1107.5862" y="268.822" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Quantum-ready</text>
  <text x="1107.5862" y="297.4246" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Zero-config deploy</text>
  <text x="1107.5862" y="326.0274" text-anchor="middle" font-size="16.8192" fill="var(--text)" font-family="Arial, sans-serif">Multi-cloud native</text>
  <rect x="40" y="413.4247" width="1158.6207" height="79.4521" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="619.3103" y="445.2055" text-anchor="middle" font-size="21.4063" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Migration Strategy</text>
  <text x="619.3103" y="476.9863" text-anchor="middle" font-size="18.3482" fill="var(--text)" font-family="Arial, sans-serif">Version upgrade | Platform migration | Data migration | Service migration</text>
  <rect x="40" y="524.6575" width="364.1379" height="63.5616" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.0689" y="564.3835" text-anchor="middle" font-size="18.3482" fill="var(--ok-accent)" font-family="Arial, sans-serif">Backward compatibility</text>
  <rect x="437.2414" y="524.6575" width="364.1379" height="63.5616" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.3103" y="564.3835" text-anchor="middle" font-size="18.3482" fill="var(--danger-accent)" font-family="Arial, sans-serif">Incremental adoption</text>
  <rect x="834.4828" y="524.6575" width="364.1379" height="63.5616" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.5517" y="564.3835" text-anchor="middle" font-size="18.3482" fill="var(--info-accent)" font-family="Arial, sans-serif">Testing at each phase</text>
  <text x="619.3103" y="620" text-anchor="middle" font-size="18.3482" fill="var(--text-muted)" font-family="Arial, sans-serif">Plan upgrades incrementally to minimize disruption</text>
</svg>

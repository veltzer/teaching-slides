  <text x="1231.7242" y="127.3972" font-family="Arial" font-size="18.3482" fill="var(--primary-accent)">Time</text>
  <rect x="56.5517" y="143.2877" width="264.8276" height="214.5206" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="176.733" y="107.22" width="24.4644" height="24.4644" rx="12.2322" fill="var(--ok-accent)"/>

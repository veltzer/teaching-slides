  <text x="801.3793" y="326.0274" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Data mesh support</text>
  <rect x="975.1724" y="143.2877" width="264.8276" height="214.5206" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1095.35" y="107.22" width="24.4644" height="24.4644" rx="12.2322" fill="var(--primary-accent)"/>
  <text x="1107.5862" y="175.0685" text-anchor="middle" font-family="Arial" font-size="19.8772" font-weight="bold" fill="var(--primary-accent)">Long-term</text>

  <text x="188.9655" y="211.6164" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Spark 3.x</text>
  <text x="188.9655" y="240.2192" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Batch + Streaming</text>
  <text x="188.9655" y="268.822" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Delta Lake</text>
  <text x="188.9655" y="297.4246" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">K8s deployment</text>
  <text x="188.9655" y="326.0274" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">MLflow integration</text>
  <rect x="362.7585" y="143.2877" width="264.8276" height="214.5206" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="482.94" y="107.22" width="24.4644" height="24.4644" rx="12.2322" fill="var(--warn-accent)"/>
  <text x="495.1723" y="175.0685" text-anchor="middle" font-family="Arial" font-size="19.8772" font-weight="bold" fill="var(--danger-accent)">Short-term</text>
  <text x="495.1723" y="211.6164" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Spark Connect</text>
  <text x="495.1723" y="240.2192" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Photon engine</text>
  <text x="495.1723" y="268.822" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Serverless Spark</text>
  <text x="495.1723" y="297.4246" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Unity Catalog</text>
  <text x="495.1723" y="326.0274" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Enhanced AQE</text>
  <rect x="668.9655" y="143.2877" width="264.8276" height="214.5206" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="789.147" y="107.22" width="24.4644" height="24.4644" rx="12.2322" fill="var(--info-accent)"/>
  <text x="801.3793" y="175.0685" text-anchor="middle" font-family="Arial" font-size="19.8772" font-weight="bold" fill="var(--info-accent)">Mid-term</text>
  <text x="801.3793" y="211.6164" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">GPU acceleration</text>
  <text x="801.3793" y="240.2192" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Lakehouse native</text>
  <text x="801.3793" y="268.822" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">AI-driven tuning</text>

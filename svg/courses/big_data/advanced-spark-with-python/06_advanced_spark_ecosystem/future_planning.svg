  <text x="1107.5862" y="326.0274" text-anchor="middle" font-family="Arial" font-size="16.8192" fill="var(--text)">Multi-cloud native</text>
  <rect x="40" y="413.4247" width="1158.6207" height="79.4521" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="619.3103" y="445.2055" text-anchor="middle" font-family="Arial" font-size="21.4063" font-weight="bold" fill="var(--text)">Migration Strategy</text>
  <text x="619.3103" y="476.9863" text-anchor="middle" font-family="Arial" font-size="18.3482" fill="var(--text)">Version upgrade | Platform migration | Data migration | Service migration</text>
  <rect x="40" y="524.6575" width="364.1379" height="63.5616" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.0689" y="564.3835" text-anchor="middle" font-family="Arial" font-size="18.3482" fill="var(--ok-accent)">Backward compatibility</text>
  <rect x="437.2414" y="524.6575" width="364.1379" height="63.5616" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.3103" y="564.3835" text-anchor="middle" font-family="Arial" font-size="18.3482" fill="var(--danger-accent)">Incremental adoption</text>
  <rect x="834.4828" y="524.6575" width="364.1379" height="63.5616" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.5517" y="564.3835" text-anchor="middle" font-family="Arial" font-size="18.3482" fill="var(--info-accent)">Testing at each phase</text>
  <text x="619.3103" y="620" text-anchor="middle" font-family="Arial" font-size="18.3482" fill="var(--text-muted)">Plan upgrades incrementally to minimize disruption</text>
</svg>
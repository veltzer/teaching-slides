<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="644.137828" y="40" font-size="26.079862" font-weight="bold" fill="var(--text)" text-anchor="middle">Delta Lake Operations</text>
  <rect x="40" y="62.307672" width="587.586207" height="241.666535" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.99564" />
  <text x="56.551724" y="93.910251" font-size="22.602562" font-weight="bold" fill="var(--text)" text-anchor="start">WRITE Operations</text>
  <text x="69.793" y="129.230688" font-size="20.863913" fill="var(--text)" text-anchor="start">├── INSERT (append)</text>
  <text x="69.793" y="164.551257" font-size="20.863913" fill="var(--text)" text-anchor="start">├── UPDATE (in-place modify)</text>
  <text x="69.793" y="199.871825" font-size="20.863913" fill="var(--text)" text-anchor="start">├── DELETE (remove rows)</text>
  <text x="69.793" y="235.192394" font-size="20.863913" fill="var(--text)" text-anchor="start">├── MERGE (upsert: insert + update)</text>
  <text x="69.793" y="270.512699" font-size="20.863913" fill="var(--text)" text-anchor="start">├── OVERWRITE (replace data)</text>
  <rect x="652.413793" y="62.307672" width="587.586207" height="185.897355" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.99564" />
  <text x="668.965621" y="93.910251" font-size="22.602562" font-weight="bold" fill="var(--text)" text-anchor="start">READ Operations</text>
  <text x="682.206793" y="129.230688" font-size="20.863913" fill="var(--text)" text-anchor="start">├── Current version (default)</text>
  <text x="682.206793" y="164.551257" font-size="20.863913" fill="var(--text)" text-anchor="start">├── Time travel (versionAsOf, timestampAsOf)</text>
  <text x="682.206793" y="199.871825" font-size="20.863913" fill="var(--text)" text-anchor="start">├── Change Data Feed (readChangeFeed)</text>
  <rect x="40" y="406.217923" width="587.586207" height="213.782077" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.99564" />
  <text x="56.551724" y="437.820371" font-size="22.602562" font-weight="bold" fill="var(--text)" text-anchor="start">MAINTENANCE Operations</text>
  <text x="69.793" y="473.14094" font-size="20.863913" fill="var(--text)" text-anchor="start">├── OPTIMIZE (compact small files)</text>
  <text x="69.793" y="508.461508" font-size="20.863913" fill="var(--text)" text-anchor="start">├── VACUUM (delete old versions)</text>
  <text x="69.793" y="543.781945" font-size="20.863913" fill="var(--text)" text-anchor="start">├── Z-ORDER (co-locate data for queries)</text>
  <text x="69.793" y="579.102514" font-size="20.863913" fill="var(--text)" text-anchor="start">├── DESCRIBE HISTORY (audit log)</text>
  <rect x="652.413793" y="406.217923" width="587.586207" height="185.897355" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.99564" />
  <text x="668.965621" y="437.820371" font-size="22.602562" font-weight="bold" fill="var(--text)" text-anchor="start">SCHEMA Operations</text>
  <text x="682.206793" y="473.14094" font-size="20.863913" fill="var(--text)" text-anchor="start">├── Schema enforcement (reject bad data)</text>
  <text x="682.206793" y="508.461508" font-size="20.863913" fill="var(--text)" text-anchor="start">├── Schema evolution (mergeSchema)</text>
  <text x="682.206793" y="543.781945" font-size="20.863913" fill="var(--text)" text-anchor="start">├── Column mapping</text>
</svg>
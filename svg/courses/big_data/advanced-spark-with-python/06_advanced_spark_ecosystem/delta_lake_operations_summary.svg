<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <rect x="8.4211" y="8.5714" width="1263.1579" height="702.8571" fill="#fafafa" stroke="#333" stroke-width="2.5263" rx="6.7368" />
  <text x="640" y="48" font-size="25.2632" font-weight="bold" fill="#222" text-anchor="middle">Delta Lake Operations</text>
  <rect x="25.2632" y="68.5714" width="597.8947" height="222.8571" fill="#e3f2fd" stroke="#999" stroke-width="1.6842" rx="6.7368" />
  <text x="42.1053" y="97.7143" font-size="21.8947" font-weight="bold" fill="#222" text-anchor="start">WRITE Operations</text>
  <text x="55.5789" y="130.2857" font-size="20.2105" fill="#333" text-anchor="start">├── INSERT (append)</text>
  <text x="55.5789" y="162.8571" font-size="20.2105" fill="#333" text-anchor="start">├── UPDATE (in-place modify)</text>
  <text x="55.5789" y="195.4286" font-size="20.2105" fill="#333" text-anchor="start">├── DELETE (remove rows)</text>
  <text x="55.5789" y="228" font-size="20.2105" fill="#333" text-anchor="start">├── MERGE (upsert: insert + update)</text>
  <text x="55.5789" y="260.5714" font-size="20.2105" fill="#333" text-anchor="start">├── OVERWRITE (replace data)</text>
  <rect x="648.4211" y="68.5714" width="597.8947" height="171.4286" fill="#e8f5e9" stroke="#999" stroke-width="1.6842" rx="6.7368" />
  <text x="665.2632" y="97.7143" font-size="21.8947" font-weight="bold" fill="#222" text-anchor="start">READ Operations</text>
  <text x="678.7368" y="130.2857" font-size="20.2105" fill="#333" text-anchor="start">├── Current version (default)</text>
  <text x="678.7368" y="162.8571" font-size="20.2105" fill="#333" text-anchor="start">├── Time travel (versionAsOf, timestampAsOf)</text>
  <text x="678.7368" y="195.4286" font-size="20.2105" fill="#333" text-anchor="start">├── Change Data Feed (readChangeFeed)</text>
  <rect x="25.2632" y="385.7143" width="597.8947" height="197.1429" fill="#fff3e0" stroke="#999" stroke-width="1.6842" rx="6.7368" />
  <text x="42.1053" y="414.8571" font-size="21.8947" font-weight="bold" fill="#222" text-anchor="start">MAINTENANCE Operations</text>
  <text x="55.5789" y="447.4286" font-size="20.2105" fill="#333" text-anchor="start">├── OPTIMIZE (compact small files)</text>
  <text x="55.5789" y="480" font-size="20.2105" fill="#333" text-anchor="start">├── VACUUM (delete old versions)</text>
  <text x="55.5789" y="512.5714" font-size="20.2105" fill="#333" text-anchor="start">├── Z-ORDER (co-locate data for queries)</text>
  <text x="55.5789" y="545.1429" font-size="20.2105" fill="#333" text-anchor="start">├── DESCRIBE HISTORY (audit log)</text>
  <rect x="648.4211" y="385.7143" width="597.8947" height="171.4286" fill="#fce4ec" stroke="#999" stroke-width="1.6842" rx="6.7368" />
  <text x="665.2632" y="414.8571" font-size="21.8947" font-weight="bold" fill="#222" text-anchor="start">SCHEMA Operations</text>
  <text x="678.7368" y="447.4286" font-size="20.2105" fill="#333" text-anchor="start">├── Schema enforcement (reject bad data)</text>
  <text x="678.7368" y="480" font-size="20.2105" fill="#333" text-anchor="start">├── Schema evolution (mergeSchema)</text>
  <text x="678.7368" y="512.5714" font-size="20.2105" fill="#333" text-anchor="start">├── Column mapping</text>
</svg>
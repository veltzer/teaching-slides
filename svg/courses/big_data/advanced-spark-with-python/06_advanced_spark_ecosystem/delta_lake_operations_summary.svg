<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="sans-serif">
<rect x="5" y="5" width="750" height="410" fill="#fafafa" stroke="#333" stroke-width="1.5" rx="4"/>
<text x="380" y="28" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Delta Lake Operations</text>
<rect x="15" y="40" width="355" height="130" fill="#e3f2fd" stroke="#999" stroke-width="1" rx="4"/>
<text x="25" y="57" font-size="13" font-weight="bold" fill="#222" text-anchor="start">WRITE Operations</text>
<text x="33" y="76" font-size="12" fill="#333" text-anchor="start">├── INSERT (append)</text>
<text x="33" y="95" font-size="12" fill="#333" text-anchor="start">├── UPDATE (in-place modify)</text>
<text x="33" y="114" font-size="12" fill="#333" text-anchor="start">├── DELETE (remove rows)</text>
<text x="33" y="133" font-size="12" fill="#333" text-anchor="start">├── MERGE (upsert: insert + update)</text>
<text x="33" y="152" font-size="12" fill="#333" text-anchor="start">├── OVERWRITE (replace data)</text>
<rect x="385" y="40" width="355" height="100" fill="#e8f5e9" stroke="#999" stroke-width="1" rx="4"/>
<text x="395" y="57" font-size="13" font-weight="bold" fill="#222" text-anchor="start">READ Operations</text>
<text x="403" y="76" font-size="12" fill="#333" text-anchor="start">├── Current version (default)</text>
<text x="403" y="95" font-size="12" fill="#333" text-anchor="start">├── Time travel (versionAsOf, timestampAsOf)</text>
<text x="403" y="114" font-size="12" fill="#333" text-anchor="start">├── Change Data Feed (readChangeFeed)</text>
<rect x="15" y="225" width="355" height="115" fill="#fff3e0" stroke="#999" stroke-width="1" rx="4"/>
<text x="25" y="242" font-size="13" font-weight="bold" fill="#222" text-anchor="start">MAINTENANCE Operations</text>
<text x="33" y="261" font-size="12" fill="#333" text-anchor="start">├── OPTIMIZE (compact small files)</text>
<text x="33" y="280" font-size="12" fill="#333" text-anchor="start">├── VACUUM (delete old versions)</text>
<text x="33" y="299" font-size="12" fill="#333" text-anchor="start">├── Z-ORDER (co-locate data for queries)</text>
<text x="33" y="318" font-size="12" fill="#333" text-anchor="start">├── DESCRIBE HISTORY (audit log)</text>
<rect x="385" y="225" width="355" height="100" fill="#fce4ec" stroke="#999" stroke-width="1" rx="4"/>
<text x="395" y="242" font-size="13" font-weight="bold" fill="#222" text-anchor="start">SCHEMA Operations</text>
<text x="403" y="261" font-size="12" fill="#333" text-anchor="start">├── Schema enforcement (reject bad data)</text>
<text x="403" y="280" font-size="12" fill="#333" text-anchor="start">├── Schema evolution (mergeSchema)</text>
<text x="403" y="299" font-size="12" fill="#333" text-anchor="start">├── Column mapping</text>
</svg>

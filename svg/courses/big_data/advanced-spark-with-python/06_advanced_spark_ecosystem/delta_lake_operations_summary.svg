<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="639.9999" y="72.5366" font-size="22.3681" font-weight="bold" fill="var(--text)" text-anchor="middle">Delta Lake Operations</text>
  <rect x="56" y="89.5122" width="568" height="183.9024" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="72" y="113.561" font-size="19.3857" font-weight="bold" fill="var(--text)" text-anchor="start">WRITE Operations</text>
  <text x="84.7999" y="140.439" font-size="17.8945" fill="var(--text)" text-anchor="start">├── INSERT (append)</text>
  <text x="84.7999" y="167.3171" font-size="17.8945" fill="var(--text)" text-anchor="start">├── UPDATE (in-place modify)</text>
  <text x="84.7999" y="194.1952" font-size="17.8945" fill="var(--text)" text-anchor="start">├── DELETE (remove rows)</text>
  <text x="84.7999" y="221.0733" font-size="17.8945" fill="var(--text)" text-anchor="start">├── MERGE (upsert: insert + update)</text>
  <text x="84.7999" y="247.9512" font-size="17.8945" fill="var(--text)" text-anchor="start">├── OVERWRITE (replace data)</text>
  <rect x="648" y="89.5122" width="568" height="141.4634" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="664.0001" y="113.561" font-size="19.3857" font-weight="bold" fill="var(--text)" text-anchor="start">READ Operations</text>
  <text x="676.7999" y="140.439" font-size="17.8945" fill="var(--text)" text-anchor="start">├── Current version (default)</text>
  <text x="676.7999" y="167.3171" font-size="17.8945" fill="var(--text)" text-anchor="start">├── Time travel (versionAsOf, timestampAsOf)</text>
  <text x="676.7999" y="194.1952" font-size="17.8945" fill="var(--text)" text-anchor="start">├── Change Data Feed (readChangeFeed)</text>
  <rect x="56" y="351.2196" width="568" height="162.683" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="72" y="375.2683" font-size="19.3857" font-weight="bold" fill="var(--text)" text-anchor="start">MAINTENANCE Operations</text>
  <text x="84.7999" y="402.1464" font-size="17.8945" fill="var(--text)" text-anchor="start">├── OPTIMIZE (compact small files)</text>
  <text x="84.7999" y="429.0245" font-size="17.8945" fill="var(--text)" text-anchor="start">├── VACUUM (delete old versions)</text>
  <text x="84.7999" y="455.9025" font-size="17.8945" fill="var(--text)" text-anchor="start">├── Z-ORDER (co-locate data for queries)</text>
  <text x="84.7999" y="482.7806" font-size="17.8945" fill="var(--text)" text-anchor="start">├── DESCRIBE HISTORY (audit log)</text>
  <rect x="648" y="351.2196" width="568" height="141.4634" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="664.0001" y="375.2683" font-size="19.3857" font-weight="bold" fill="var(--text)" text-anchor="start">SCHEMA Operations</text>
  <text x="676.7999" y="402.1464" font-size="17.8945" fill="var(--text)" text-anchor="start">├── Schema enforcement (reject bad data)</text>
  <text x="676.7999" y="429.0245" font-size="17.8945" fill="var(--text)" text-anchor="start">├── Schema evolution (mergeSchema)</text>
  <text x="676.7999" y="455.9025" font-size="17.8945" fill="var(--text)" text-anchor="start">├── Column mapping</text>
</svg>
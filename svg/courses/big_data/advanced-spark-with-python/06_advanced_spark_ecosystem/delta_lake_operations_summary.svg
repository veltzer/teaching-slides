<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="587.586207" height="251.333187248005" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.134180844123" filter="url(#shadow)"/>
  <text x="56.551724" y="72.866680963199" font-size="23.050180519366" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">WRITE Operations</text>
  <text x="69.793" y="109.599934105602" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── INSERT (append)</text>
  <text x="69.793" y="146.333324528" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── UPDATE (in-place modify)</text>
  <text x="69.793" y="183.066713910398" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── DELETE (remove rows)</text>
  <text x="69.793" y="219.800104332796" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── MERGE (upsert: insert + update)</text>
  <text x="69.793" y="256.533220195204" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── OVERWRITE (replace data)</text>
  <rect x="652.413793" y="40" width="587.586207" height="193.333242160003" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.134180844123" filter="url(#shadow)"/>
  <text x="668.965621" y="72.866680963199" font-size="23.050180519366" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">READ Operations</text>
  <text x="682.206793" y="109.599934105602" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Current version (default)</text>
  <text x="682.206793" y="146.333324528" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Time travel (versionAsOf, timestampAsOf)</text>
  <text x="682.206793" y="183.066713910398" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Change Data Feed (readChangeFeed)</text>
  <rect x="40" y="397.666648016001" width="587.586207" height="222.333351983999" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.134180844123" filter="url(#shadow)"/>
  <text x="56.551724" y="430.533192739205" font-size="23.050180519366" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">MAINTENANCE Operations</text>
  <text x="69.793" y="467.266583161603" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── OPTIMIZE (compact small files)</text>
  <text x="69.793" y="503.999972544001" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── VACUUM (delete old versions)</text>
  <text x="69.793" y="540.733225686404" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Z-ORDER (co-locate data for queries)</text>
  <text x="69.793" y="577.466616108802" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── DESCRIBE HISTORY (audit log)</text>
  <rect x="652.413793" y="397.666648016001" width="587.586207" height="193.333242160003" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.134180844123" filter="url(#shadow)"/>
  <text x="668.965621" y="430.533192739205" font-size="23.050180519366" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">SCHEMA Operations</text>
  <text x="682.206793" y="467.266583161603" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Schema enforcement (reject bad data)</text>
  <text x="682.206793" y="503.999972544001" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Schema evolution (mergeSchema)</text>
  <text x="682.206793" y="540.733225686404" font-size="21.27709951599" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Column mapping</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="7.5756" y="7.7108" width="1136.3349" height="632.2892" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="575.743" y="43.1807" font-size="22.7267" font-weight="bold" fill="var(--text)" text-anchor="middle">Delta Lake Operations</text>
  <rect x="22.7267" y="61.6867" width="537.8652" height="200.4819" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="37.8779" y="87.9036" font-size="19.6964" font-weight="bold" fill="var(--text)" text-anchor="start">WRITE Operations</text>
  <text x="49.9987" y="117.2048" font-size="18.1813" fill="var(--text)" text-anchor="start">├── INSERT (append)</text>
  <text x="49.9987" y="146.506" font-size="18.1813" fill="var(--text)" text-anchor="start">├── UPDATE (in-place modify)</text>
  <text x="49.9987" y="175.8073" font-size="18.1813" fill="var(--text)" text-anchor="start">├── DELETE (remove rows)</text>
  <text x="49.9987" y="205.1085" font-size="18.1813" fill="var(--text)" text-anchor="start">├── MERGE (upsert: insert + update)</text>
  <text x="49.9987" y="234.4096" font-size="18.1813" fill="var(--text)" text-anchor="start">├── OVERWRITE (replace data)</text>
  <rect x="583.3186" y="61.6867" width="537.8652" height="154.2169" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="598.4698" y="87.9036" font-size="19.6964" font-weight="bold" fill="var(--text)" text-anchor="start">READ Operations</text>
  <text x="610.5906" y="117.2048" font-size="18.1813" fill="var(--text)" text-anchor="start">├── Current version (default)</text>
  <text x="610.5906" y="146.506" font-size="18.1813" fill="var(--text)" text-anchor="start">├── Time travel (versionAsOf, timestampAsOf)</text>
  <text x="610.5906" y="175.8073" font-size="18.1813" fill="var(--text)" text-anchor="start">├── Change Data Feed (readChangeFeed)</text>
  <rect x="22.7267" y="346.988" width="537.8652" height="177.3495" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="37.8779" y="373.2048" font-size="19.6964" font-weight="bold" fill="var(--text)" text-anchor="start">MAINTENANCE Operations</text>
  <text x="49.9987" y="402.5061" font-size="18.1813" fill="var(--text)" text-anchor="start">├── OPTIMIZE (compact small files)</text>
  <text x="49.9987" y="431.8073" font-size="18.1813" fill="var(--text)" text-anchor="start">├── VACUUM (delete old versions)</text>
  <text x="49.9987" y="461.1085" font-size="18.1813" fill="var(--text)" text-anchor="start">├── Z-ORDER (co-locate data for queries)</text>
  <text x="49.9987" y="490.4097" font-size="18.1813" fill="var(--text)" text-anchor="start">├── DESCRIBE HISTORY (audit log)</text>
  <rect x="583.3186" y="346.988" width="537.8652" height="154.2169" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="598.4698" y="373.2048" font-size="19.6964" font-weight="bold" fill="var(--text)" text-anchor="start">SCHEMA Operations</text>
  <text x="610.5906" y="402.5061" font-size="18.1813" fill="var(--text)" text-anchor="start">├── Schema enforcement (reject bad data)</text>
  <text x="610.5906" y="431.8073" font-size="18.1813" fill="var(--text)" text-anchor="start">├── Schema evolution (mergeSchema)</text>
  <text x="610.5906" y="461.1085" font-size="18.1813" fill="var(--text)" text-anchor="start">├── Column mapping</text>
</svg>
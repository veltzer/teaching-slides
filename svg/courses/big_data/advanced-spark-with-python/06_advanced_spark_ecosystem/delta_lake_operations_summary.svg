<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:rect x="7.5756" y="7.7108" width="1136.3349" height="632.2892" fill="#fafafa" stroke="#333" stroke-width="2.2727" rx="6.0604" />
  <ns0:text x="575.743" y="43.1807" font-size="22.7267" font-weight="bold" fill="#222" text-anchor="middle">Delta Lake Operations</ns0:text>
  <ns0:rect x="22.7267" y="61.6867" width="537.8652" height="200.4819" fill="#e3f2fd" stroke="#999" stroke-width="1.5151" rx="6.0604" />
  <ns0:text x="37.8779" y="87.9036" font-size="19.6964" font-weight="bold" fill="#222" text-anchor="start">WRITE Operations</ns0:text>
  <ns0:text x="49.9987" y="117.2048" font-size="18.1813" fill="#333" text-anchor="start">├── INSERT (append)</ns0:text>
  <ns0:text x="49.9987" y="146.506" font-size="18.1813" fill="#333" text-anchor="start">├── UPDATE (in-place modify)</ns0:text>
  <ns0:text x="49.9987" y="175.8073" font-size="18.1813" fill="#333" text-anchor="start">├── DELETE (remove rows)</ns0:text>
  <ns0:text x="49.9987" y="205.1085" font-size="18.1813" fill="#333" text-anchor="start">├── MERGE (upsert: insert + update)</ns0:text>
  <ns0:text x="49.9987" y="234.4096" font-size="18.1813" fill="#333" text-anchor="start">├── OVERWRITE (replace data)</ns0:text>
  <ns0:rect x="583.3186" y="61.6867" width="537.8652" height="154.2169" fill="#e8f5e9" stroke="#999" stroke-width="1.5151" rx="6.0604" />
  <ns0:text x="598.4698" y="87.9036" font-size="19.6964" font-weight="bold" fill="#222" text-anchor="start">READ Operations</ns0:text>
  <ns0:text x="610.5906" y="117.2048" font-size="18.1813" fill="#333" text-anchor="start">├── Current version (default)</ns0:text>
  <ns0:text x="610.5906" y="146.506" font-size="18.1813" fill="#333" text-anchor="start">├── Time travel (versionAsOf, timestampAsOf)</ns0:text>
  <ns0:text x="610.5906" y="175.8073" font-size="18.1813" fill="#333" text-anchor="start">├── Change Data Feed (readChangeFeed)</ns0:text>
  <ns0:rect x="22.7267" y="346.988" width="537.8652" height="177.3495" fill="#fff3e0" stroke="#999" stroke-width="1.5151" rx="6.0604" />
  <ns0:text x="37.8779" y="373.2048" font-size="19.6964" font-weight="bold" fill="#222" text-anchor="start">MAINTENANCE Operations</ns0:text>
  <ns0:text x="49.9987" y="402.5061" font-size="18.1813" fill="#333" text-anchor="start">├── OPTIMIZE (compact small files)</ns0:text>
  <ns0:text x="49.9987" y="431.8073" font-size="18.1813" fill="#333" text-anchor="start">├── VACUUM (delete old versions)</ns0:text>
  <ns0:text x="49.9987" y="461.1085" font-size="18.1813" fill="#333" text-anchor="start">├── Z-ORDER (co-locate data for queries)</ns0:text>
  <ns0:text x="49.9987" y="490.4097" font-size="18.1813" fill="#333" text-anchor="start">├── DESCRIBE HISTORY (audit log)</ns0:text>
  <ns0:rect x="583.3186" y="346.988" width="537.8652" height="154.2169" fill="#fce4ec" stroke="#999" stroke-width="1.5151" rx="6.0604" />
  <ns0:text x="598.4698" y="373.2048" font-size="19.6964" font-weight="bold" fill="#222" text-anchor="start">SCHEMA Operations</ns0:text>
  <ns0:text x="610.5906" y="402.5061" font-size="18.1813" fill="#333" text-anchor="start">├── Schema enforcement (reject bad data)</ns0:text>
  <ns0:text x="610.5906" y="431.8073" font-size="18.1813" fill="#333" text-anchor="start">├── Schema evolution (mergeSchema)</ns0:text>
  <ns0:text x="610.5906" y="461.1085" font-size="18.1813" fill="#333" text-anchor="start">├── Column mapping</ns0:text>
</ns0:svg>
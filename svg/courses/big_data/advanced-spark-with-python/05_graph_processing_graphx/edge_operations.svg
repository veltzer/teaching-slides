<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="162.874" y="108.083161212414" width="116.842" height="121.725566777618" rx="14.289579443058" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.2837" filter="url(#shadow)"/>
  <text x="221.2949" y="177.456691359036" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.851757732654" font-weight="bold" fill="var(--text)">V1</text>
  <rect x="577.263" y="40" width="116.842" height="121.725566777618" rx="14.289579443058" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.2837" filter="url(#shadow)"/>
  <text x="635.6834" y="109.37311342809" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.851757732654" font-weight="bold" fill="var(--text)">V2</text>
  <rect x="577.263" y="244.251150511369" width="116.842" height="121.725566777618" rx="14.289579443058" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.2837" filter="url(#shadow)"/>
  <text x="635.6834" y="313.623847220927" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.851757732654" font-weight="bold" fill="var(--text)">V3</text>
  <rect x="991.651" y="108.083161212414" width="116.842" height="121.725566777618" rx="14.289579443058" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.2837" filter="url(#shadow)"/>
  <text x="1050.0719" y="177.456691359036" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.851757732654" font-weight="bold" fill="var(--text)">V4</text>
  <line x1="281.7266" y1="148.521215014728" x2="575.2518" y2="114.479373959439" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="419.856" y="114.479373959439" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">w=5</text>
  <line x1="264.4604" y1="211.498532414325" x2="575.2518" y2="288.092544564185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="402.5899" y="271.071676126357" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">w=3</text>
  <line x1="696.115" y1="100.862679209176" x2="989.6402" y2="155.329458210226" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="842.8776" y="114.479373959439" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">w=8</text>
  <line x1="696.115" y1="291.496614072118" x2="989.6402" y2="194.477559796864" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="851.5107" y="267.667398259158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">w=2</text>
  <rect x="40" y="424.259700426077" width="293.5251" height="195.740299573923" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.124105475596" filter="url(#shadow)"/>
  <text x="186.7625" y="466.811871520647" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.148031589343" font-weight="bold" fill="var(--text)">edges.filter</text>
  <text x="186.7625" y="500.853712575937" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">Filter edges by property</text>
  <text x="186.7625" y="529.789293099878" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">or triplet condition</text>
  <text x="186.7625" y="597.872871030823" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.036955227835" fill="var(--primary-accent)">e.attr &gt; 3</text>
  <rect x="350.7914" y="424.259700426077" width="293.5251" height="195.740299573923" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.124105475596" filter="url(#shadow)"/>
  <text x="497.5539" y="466.811871520647" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.148031589343" font-weight="bold" fill="var(--text)">edges.map</text>
  <text x="497.5539" y="500.853712575937" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">Transform edge attributes</text>
  <text x="497.5539" y="529.789293099878" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">using a function</text>
  <text x="497.5539" y="597.872871030823" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.036955227835" fill="var(--warn-accent)">e =&gt; e.attr * 2</text>
  <rect x="661.5826" y="424.259700426077" width="293.5251" height="195.740299573923" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.124105475596" filter="url(#shadow)"/>
  <text x="808.3453" y="466.811871520647" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.148031589343" font-weight="bold" fill="var(--text)">groupEdges</text>
  <text x="808.3453" y="500.853712575937" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">Merge parallel edges</text>
  <text x="808.3453" y="529.789293099878" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">between same vertices</text>
  <text x="808.3453" y="597.872871030823" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.036955227835" fill="var(--ok-accent)">(a, b) =&gt; a + b</text>
  <rect x="972.374" y="424.259700426077" width="267.626" height="195.740299573923" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.124105475596" filter="url(#shadow)"/>
  <text x="1105.3237" y="466.811871520647" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.148031589343" font-weight="bold" fill="var(--text)">reverse</text>
  <text x="1105.3237" y="500.853712575937" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">Reverse all edge</text>
  <text x="1105.3237" y="529.789293099878" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.740681371146" fill="var(--text-muted)">directions in graph</text>
  <text x="1105.3237" y="597.872871030823" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.036955227835" fill="var(--danger-accent)">src ↔ dst</text>
</svg>

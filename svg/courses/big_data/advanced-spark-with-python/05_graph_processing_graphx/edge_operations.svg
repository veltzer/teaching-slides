  <text x="817.7778" y="567" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="#555">Merge parallel edges</text>
  <text x="817.7778" y="597.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="#555">between same vertices</text>
  <text x="817.7778" y="669.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" fill="#4caf50">(a, b) =&gt; a + b</text>

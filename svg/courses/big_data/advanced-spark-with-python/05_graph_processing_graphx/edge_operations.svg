<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.5527" font-weight="bold" fill="var(--text)">GraphX Edge Operations</text>
  <circle cx="197.0178" cy="199.4805" r="57.4635" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.2837" />
  <text x="197.0178" y="207.7922" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9854" font-weight="bold" fill="var(--text)">V1</text>
  <circle cx="591.0534" cy="132.987" r="57.4635" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.2837" />
  <text x="591.0534" y="141.2987" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9854" font-weight="bold" fill="var(--text)">V2</text>
  <circle cx="591.0534" cy="332.4675" r="57.4635" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.2837" />
  <text x="591.0534" y="340.7792" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9854" font-weight="bold" fill="var(--text)">V3</text>
  <circle cx="985.089" cy="199.4805" r="57.4635" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.2837" />
  <text x="985.089" y="207.7922" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9854" font-weight="bold" fill="var(--text)">V4</text>
  <line x1="254.4814" y1="179.5325" x2="533.5899" y2="146.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="385.8265" y="146.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">w=5</text>
  <line x1="238.0632" y1="241.039" x2="533.5899" y2="315.8442" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="369.4084" y="299.2208" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">w=3</text>
  <line x1="648.5169" y1="132.987" x2="927.6254" y2="186.1818" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="788.0712" y="146.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">w=8</text>
  <line x1="648.5169" y1="319.1688" x2="927.6254" y2="224.4156" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="796.2802" y="295.8961" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">w=2</text>
  <rect x="24.6273" y="448.8312" width="279.1085" height="191.1688" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="164.1815" y="490.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3436" font-weight="bold" fill="var(--text)">edges.filter</text>
  <text x="164.1815" y="523.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">Filter edges by property</text>
  <text x="164.1815" y="551.8961" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">or triplet condition</text>
  <text x="164.1815" y="618.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4182" fill="var(--primary-accent)">e.attr &gt; 3</text>
  <rect x="320.154" y="448.8312" width="279.1085" height="191.1688" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="459.7082" y="490.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3436" font-weight="bold" fill="var(--text)">edges.map</text>
  <text x="459.7082" y="523.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">Transform edge attributes</text>
  <text x="459.7082" y="551.8961" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">using a function</text>
  <text x="459.7082" y="618.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4182" fill="var(--warn-accent)">e =&gt; e.attr * 2</text>
  <rect x="615.6806" y="448.8312" width="279.1085" height="191.1688" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="755.2349" y="490.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3436" font-weight="bold" fill="var(--text)">groupEdges</text>
  <text x="755.2349" y="523.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">Merge parallel edges</text>
  <text x="755.2349" y="551.8961" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">between same vertices</text>
  <text x="755.2349" y="618.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4182" fill="var(--ok-accent)">(a, b) =&gt; a + b</text>
  <rect x="911.2073" y="448.8312" width="254.4814" height="191.1688" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="1037.6271" y="490.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3436" font-weight="bold" fill="var(--text)">reverse</text>
  <text x="1037.6271" y="523.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">Reverse all edge</text>
  <text x="1037.6271" y="551.8961" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.06" fill="var(--text-muted)">directions in graph</text>
  <text x="1037.6271" y="618.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4182" fill="var(--danger-accent)">src ↔ dst</text>
</svg>
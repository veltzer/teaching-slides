<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">GraphX Edge Operations</text>
  <!-- Vertex V1 -->
  <circle cx="120" cy="120" r="35" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">V1</text>
  <!-- Vertex V2 -->
  <circle cx="360" cy="80" r="35" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">V2</text>
  <!-- Vertex V3 -->
  <circle cx="360" cy="200" r="35" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="360" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">V3</text>
  <!-- Vertex V4 -->
  <circle cx="600" cy="120" r="35" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="600" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">V4</text>
  <!-- Edge V1 to V2 -->
  <line x1="155" y1="108" x2="325" y2="88" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">w=5</text>
  <!-- Edge V1 to V3 -->
  <line x1="145" y1="145" x2="325" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">w=3</text>
  <!-- Edge V2 to V4 -->
  <line x1="395" y1="80" x2="565" y2="112" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">w=8</text>
  <!-- Edge V3 to V4 -->
  <line x1="395" y1="192" x2="565" y2="135" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">w=2</text>
  <!-- Operations panel -->
  <rect x="15" y="270" width="170" height="115" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2" rx="5"/>
  <text x="100" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">edges.filter</text>
  <text x="100" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Filter edges by property</text>
  <text x="100" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">or triplet condition</text>
  <text x="100" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4a90e2">e.attr > 3</text>

  <rect x="195" y="270" width="170" height="115" fill="#fff3e0" stroke="#f5a623" stroke-width="2" rx="5"/>
  <text x="280" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">edges.map</text>
  <text x="280" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Transform edge attributes</text>
  <text x="280" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">using a function</text>
  <text x="280" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f5a623">e => e.attr * 2</text>

  <rect x="375" y="270" width="170" height="115" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="460" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">groupEdges</text>
  <text x="460" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Merge parallel edges</text>
  <text x="460" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">between same vertices</text>
  <text x="460" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">(a, b) => a + b</text>

  <rect x="555" y="270" width="155" height="115" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="5"/>
  <text x="632" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">reverse</text>
  <text x="632" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Reverse all edge</text>
  <text x="632" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">directions in graph</text>
  <text x="632" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e91e63">src &#x2194; dst</text>
</svg>

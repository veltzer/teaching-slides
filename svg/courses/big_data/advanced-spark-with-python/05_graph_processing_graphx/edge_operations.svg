  <text x="497.7778" y="567" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="#555">Transform edge attributes</text>
  <text x="497.7778" y="597.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="#555">using a function</text>

<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">GraphX Edge Operations</text>
  <!-- Vertex V1 -->
  <circle cx="120" cy="120" r="35" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">V1</text>
  <!-- Vertex V2 -->
  <circle cx="350" cy="80" r="35" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">V2</text>
  <!-- Vertex V3 -->
  <circle cx="350" cy="200" r="35" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">V3</text>
  <!-- Vertex V4 -->
  <circle cx="580" cy="120" r="35" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="580" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">V4</text>
  <!-- Edge V1 to V2 -->
  <line x1="155" y1="108" x2="315" y2="88" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">w=5</text>
  <!-- Edge V1 to V3 -->
  <line x1="145" y1="145" x2="315" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">w=3</text>
  <!-- Edge V2 to V4 -->
  <line x1="385" y1="80" x2="545" y2="112" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">w=8</text>
  <!-- Edge V3 to V4 -->
  <line x1="385" y1="192" x2="545" y2="135" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">w=2</text>
  <!-- Operations panel -->
  <rect x="30" y="270" width="150" height="110" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2" rx="5"/>
  <text x="105" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">edges.filter</text>
  <text x="105" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Filter edges by</text>
  <text x="105" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">property or</text>
  <text x="105" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">triplet condition</text>
  <text x="105" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4a90e2">e.attr > 3</text>
  <rect x="200" y="270" width="150" height="110" fill="#fff3e0" stroke="#f5a623" stroke-width="2" rx="5"/>
  <text x="275" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">edges.map</text>
  <text x="275" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Transform edge</text>
  <text x="275" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">attributes using</text>
  <text x="275" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">a function</text>
  <text x="275" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f5a623">e => e.attr * 2</text>
  <rect x="370" y="270" width="150" height="110" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="5"/>
  <text x="445" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">groupEdges</text>
  <text x="445" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Merge parallel</text>
  <text x="445" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">edges between</text>
  <text x="445" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">same vertices</text>
  <text x="445" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">(a, b) => a + b</text>
  <rect x="540" y="270" width="150" height="110" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="5"/>
  <text x="615" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">reverse</text>
  <text x="615" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">Reverse all</text>
  <text x="615" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">edge directions</text>
  <text x="615" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">in graph</text>
  <text x="615" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e91e63">src ↔ dst</text>
</svg>

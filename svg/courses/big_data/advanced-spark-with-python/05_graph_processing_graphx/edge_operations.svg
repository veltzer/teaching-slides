  <text x="177.7778" y="531" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1111" font-weight="bold" fill="#333">edges.filter</text>
  <text x="177.7778" y="567" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="#555">Filter edges by property</text>
  <text x="177.7778" y="597.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="#555">or triplet condition</text>

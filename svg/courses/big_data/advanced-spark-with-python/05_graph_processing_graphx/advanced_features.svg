<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial" font-size="26.5974" font-weight="bold" fill="var(--primary-accent)">Advanced GraphX Features</text>
  <rect x="44.329" y="91.4286" width="339.8557" height="216.1039" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="214.2569" y="132.987" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">ML Pipeline Integration</text>
  <text x="66.4935" y="169.5584" font-family="Arial" font-size="16.254" fill="var(--text)">- Graph features as ML inputs</text>
  <text x="66.4935" y="199.4805" font-family="Arial" font-size="16.254" fill="var(--text)">- PageRank as feature</text>
  <text x="66.4935" y="229.4026" font-family="Arial" font-size="16.254" fill="var(--text)">- Community labels</text>
  <text x="66.4935" y="259.3247" font-family="Arial" font-size="16.254" fill="var(--text)">- Node embeddings</text>
  <text x="66.4935" y="289.2468" font-family="Arial" font-size="16.254" fill="var(--text)">- Graph neural networks</text>
  <rect x="421.1255" y="91.4286" width="339.8557" height="216.1039" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="591.0534" y="132.987" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--ok-accent)">Streaming Graphs</text>
  <text x="443.29" y="169.5584" font-family="Arial" font-size="16.254" fill="var(--text)">- Incremental updates</text>
  <text x="443.29" y="199.4805" font-family="Arial" font-size="16.254" fill="var(--text)">- Windowed computation</text>
  <text x="443.29" y="229.4026" font-family="Arial" font-size="16.254" fill="var(--text)">- Real-time analytics</text>
  <text x="443.29" y="259.3247" font-family="Arial" font-size="16.254" fill="var(--text)">- Dynamic graphs</text>
  <text x="443.29" y="289.2468" font-family="Arial" font-size="16.254" fill="var(--text)">- Event-driven updates</text>
  <rect x="797.9221" y="91.4286" width="339.8557" height="216.1039" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="967.8499" y="132.987" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--warn-accent)">Storage Integration</text>
  <text x="820.0866" y="169.5584" font-family="Arial" font-size="16.254" fill="var(--text)">- Graph databases (Neo4j)</text>
  <text x="820.0866" y="199.4805" font-family="Arial" font-size="16.254" fill="var(--text)">- HDFS persistence</text>
  <text x="820.0866" y="229.4026" font-family="Arial" font-size="16.254" fill="var(--text)">- Delta Lake tables</text>
  <text x="820.0866" y="259.3247" font-family="Arial" font-size="16.254" fill="var(--text)">- Cloud object storage</text>
  <text x="820.0866" y="289.2468" font-family="Arial" font-size="16.254" fill="var(--text)">- Catalog integration</text>
  <rect x="118.2107" y="365.7143" width="413.7374" height="216.1039" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="325.0794" y="407.2727" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--info-accent)">Motif Finding (Pattern Matching)</text>
  <text x="140.3752" y="445.5065" font-family="Arial" font-size="16.254" fill="var(--text)">- Structural pattern queries</text>
  <text x="140.3752" y="475.4286" font-family="Arial" font-size="16.254" fill="var(--text)">- (a)-[e1]-&gt;(b); (b)-[e2]-&gt;(c)</text>
  <text x="140.3752" y="505.3506" font-family="Arial" font-size="16.254" fill="var(--text)">- Friend-of-friend discovery</text>
  <text x="140.3752" y="535.2727" font-family="Arial" font-size="16.254" fill="var(--text)">- Cycle detection</text>
  <text x="140.3752" y="565.1948" font-family="Arial" font-size="16.254" fill="var(--text)">- Fraud pattern matching</text>
  <rect x="635.3824" y="365.7143" width="413.7374" height="216.1039" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="842.2511" y="407.2727" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--ok-accent)">Custom Algorithms</text>
  <text x="657.5469" y="445.5065" font-family="Arial" font-size="16.254" fill="var(--text)">- User-defined Pregel programs</text>
  <text x="657.5469" y="475.4286" font-family="Arial" font-size="16.254" fill="var(--text)">- Aggregated messaging</text>
  <text x="657.5469" y="505.3506" font-family="Arial" font-size="16.254" fill="var(--text)">- Graph-parallel abstractions</text>
  <text x="657.5469" y="535.2727" font-family="Arial" font-size="16.254" fill="var(--text)">- Compose built-in algorithms</text>
  <text x="657.5469" y="565.1948" font-family="Arial" font-size="16.254" fill="var(--text)">- Domain-specific operators</text>
  <line x1="214.2569" y1="307.5325" x2="325.0794" y2="362.3896" stroke="var(--text-faint)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <line x1="591.0534" y1="307.5325" x2="591.0534" y2="362.3896" stroke="var(--text-faint)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <line x1="967.8499" y1="307.5325" x2="842.2511" y2="362.3896" stroke="var(--text-faint)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <text x="591.0534" y="640" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text-faint)">GraphFrames extends GraphX with DataFrame APIs and additional algorithms</text>
</svg>
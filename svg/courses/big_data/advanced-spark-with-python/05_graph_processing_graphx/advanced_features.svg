<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="373" height="235.283018867925" rx="6.27664133236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226" y="83.773584905661" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)">ML Integration</text>
  <text x="226" y="127.547169811321" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">PageRank features</text>
  <text x="226" y="160.377358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Community labels</text>
  <text x="226" y="193.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Node embeddings</text>
  <text x="226" y="226.037735849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Graph neural nets</text>

  <rect x="453" y="40" width="373" height="235.283018867925" rx="6.27664133236" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.773584905661" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--ok-text)">Streaming</text>
  <text x="640" y="127.547169811321" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Incremental updates</text>
  <text x="640" y="160.377358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Windowed compute</text>
  <text x="640" y="193.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Real-time analytics</text>
  <text x="640" y="226.037735849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">Dynamic graphs</text>

  <rect x="867" y="40" width="373" height="235.283018867925" rx="6.27664133236" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053" y="83.773584905661" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--warn-text)">Storage</text>
  <text x="1053" y="127.547169811321" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Neo4j, Neptune</text>
  <text x="1053" y="160.377358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">HDFS persistence</text>
  <text x="1053" y="193.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Delta Lake tables</text>
  <text x="1053" y="226.037735849057" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">Cloud object store</text>

  <rect x="121" y="335.471698113207" width="454" height="235.283018867925" rx="6.27664133236" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348" y="379.245283018868" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--info-text)">Motif Finding</text>
  <text x="348" y="423.018867924528" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Pattern queries</text>
  <text x="348" y="455.849056603773" text-anchor="middle" font-family="Courier New, monospace" font-size="13.599389553447" fill="var(--info-text)">(a)-[e]-&gt;(b)-[f]-&gt;(c)</text>
  <text x="348" y="494.150943396227" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Cycle detection</text>
  <text x="348" y="526.981132075471" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">Fraud patterns</text>

  <rect x="705" y="335.471698113207" width="454" height="235.283018867925" rx="6.27664133236" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="932" y="379.245283018868" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.829923997081" font-weight="bold" fill="var(--primary-text)">Custom Algorithms</text>
  <text x="932" y="423.018867924528" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Pregel programs</text>
  <text x="932" y="455.849056603773" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Aggregated messaging</text>
  <text x="932" y="494.150943396227" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Graph-parallel ops</text>
  <text x="932" y="526.981132075471" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">Domain operators</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-style="italic" fill="var(--text-muted)">GraphFrames adds DataFrame APIs</text>
</svg>

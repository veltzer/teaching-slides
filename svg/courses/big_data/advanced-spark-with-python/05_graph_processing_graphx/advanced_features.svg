  <text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial" font-size="26.5974" font-weight="bold" fill="var(--primary-deeper)">Advanced GraphX Features</text>
  <rect x="44.329" y="91.4286" width="339.8557" height="216.1039" rx="11.8211" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.9553" />
  <text x="214.2569" y="132.987" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-dk)">ML Pipeline Integration</text>
  <text x="66.4935" y="169.5584" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Graph features as ML inputs</text>
  <text x="66.4935" y="199.4805" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- PageRank as feature</text>
  <text x="66.4935" y="229.4026" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Community labels</text>
  <text x="66.4935" y="259.3247" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Node embeddings</text>
  <text x="66.4935" y="289.2468" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Graph neural networks</text>
  <rect x="421.1255" y="91.4286" width="339.8557" height="216.1039" rx="11.8211" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.9553" />
  <text x="591.0534" y="132.987" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--ok-dk)">Streaming Graphs</text>
  <text x="443.29" y="169.5584" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Incremental updates</text>
  <text x="443.29" y="199.4805" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Windowed computation</text>
  <text x="443.29" y="229.4026" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Real-time analytics</text>
  <text x="443.29" y="259.3247" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Dynamic graphs</text>
  <text x="443.29" y="289.2468" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Event-driven updates</text>
  <rect x="797.9221" y="91.4286" width="339.8557" height="216.1039" rx="11.8211" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.9553" />
  <text x="967.8499" y="132.987" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--warn-dk)">Storage Integration</text>
  <text x="820.0866" y="169.5584" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Graph databases (Neo4j)</text>
  <text x="820.0866" y="199.4805" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- HDFS persistence</text>
  <text x="820.0866" y="229.4026" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Delta Lake tables</text>
  <text x="820.0866" y="259.3247" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Cloud object storage</text>
  <text x="820.0866" y="289.2468" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Catalog integration</text>
  <rect x="118.2107" y="365.7143" width="413.7374" height="216.1039" rx="11.8211" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="2.9553" />
  <text x="325.0794" y="407.2727" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--info-mid)">Motif Finding (Pattern Matching)</text>
  <text x="140.3752" y="445.5065" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Structural pattern queries</text>
  <text x="140.3752" y="475.4286" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- (a)-[e1]-&gt;(b); (b)-[e2]-&gt;(c)</text>
  <text x="140.3752" y="505.3506" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Friend-of-friend discovery</text>
  <text x="140.3752" y="535.2727" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Cycle detection</text>
  <text x="140.3752" y="565.1948" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Fraud pattern matching</text>
  <rect x="635.3824" y="365.7143" width="413.7374" height="216.1039" rx="11.8211" fill="var(--primary-pale2)" stroke="var(--ok-dk)" stroke-width="2.9553" />
  <text x="842.2511" y="407.2727" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--ok-dk)">Custom Algorithms</text>
  <text x="657.5469" y="445.5065" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- User-defined Pregel programs</text>
  <text x="657.5469" y="475.4286" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Aggregated messaging</text>
  <text x="657.5469" y="505.3506" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Graph-parallel abstractions</text>
  <text x="657.5469" y="535.2727" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Compose built-in algorithms</text>
  <text x="657.5469" y="565.1948" font-family="Arial" font-size="16.254" fill="var(--text-dark)">- Domain-specific operators</text>
  <line x1="214.2569" y1="307.5325" x2="325.0794" y2="362.3896" stroke="var(--text-faintest)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <line x1="591.0534" y1="307.5325" x2="591.0534" y2="362.3896" stroke="var(--text-faintest)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <line x1="967.8499" y1="307.5325" x2="842.2511" y2="362.3896" stroke="var(--text-faintest)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <text x="591.0534" y="640" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text-faint)">GraphFrames extends GraphX with DataFrame APIs and additional algorithms</text>

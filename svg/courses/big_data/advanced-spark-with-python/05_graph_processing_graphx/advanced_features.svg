<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.623" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Advanced GraphX Features</text>
  <rect x="40" y="80.8451" width="372.973" height="212.3944" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="121.6902" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ML Pipeline Integration</text>
  <text x="64.3243" y="157.6338" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Graph features as ML inputs</text>
  <text x="64.3243" y="187.0423" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- PageRank as feature</text>
  <text x="64.3243" y="216.4507" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Community labels</text>
  <text x="64.3243" y="245.8592" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Node embeddings</text>
  <text x="64.3243" y="275.2677" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Graph neural networks</text>
  <rect x="453.5135" y="80.8451" width="372.973" height="212.3944" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="121.6902" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Streaming Graphs</text>
  <text x="477.8378" y="157.6338" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Incremental updates</text>
  <text x="477.8378" y="187.0423" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Windowed computation</text>
  <text x="477.8378" y="216.4507" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Real-time analytics</text>
  <text x="477.8378" y="245.8592" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Dynamic graphs</text>
  <text x="477.8378" y="275.2677" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Event-driven updates</text>
  <rect x="867.027" y="80.8451" width="372.973" height="212.3944" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="121.6902" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Storage Integration</text>
  <text x="891.3514" y="157.6338" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Graph databases (Neo4j)</text>
  <text x="891.3514" y="187.0423" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- HDFS persistence</text>
  <text x="891.3514" y="216.4507" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Delta Lake tables</text>
  <text x="891.3514" y="245.8592" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Cloud object storage</text>
  <text x="891.3514" y="275.2677" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Catalog integration</text>
  <rect x="121.0811" y="350.4226" width="454.0541" height="212.3944" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348.1081" y="391.2676" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Motif Finding (Pattern Matching)</text>
  <text x="145.4054" y="428.8451" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Structural pattern queries</text>
  <text x="145.4054" y="458.2536" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- (a)-[e1]-&gt;(b); (b)-[e2]-&gt;(c)</text>
  <text x="145.4054" y="487.6619" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Friend-of-friend discovery</text>
  <text x="145.4054" y="517.0704" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Cycle detection</text>
  <text x="145.4054" y="546.4789" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Fraud pattern matching</text>
  <rect x="688.6486" y="350.4226" width="454.0541" height="212.3944" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.6757" y="391.2676" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Custom Algorithms</text>
  <text x="712.973" y="428.8451" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- User-defined Pregel programs</text>
  <text x="712.973" y="458.2536" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Aggregated messaging</text>
  <text x="712.973" y="487.6619" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Graph-parallel abstractions</text>
  <text x="712.973" y="517.0704" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Compose built-in algorithms</text>
  <text x="712.973" y="546.4789" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">- Domain-specific operators</text>
  <line x1="226.4865" y1="293.2395" x2="348.1081" y2="347.1549" stroke="var(--text-faint)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <line x1="640" y1="293.2395" x2="640" y2="347.1549" stroke="var(--text-faint)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <line x1="1053.5135" y1="293.2395" x2="915.6757" y2="347.1549" stroke="var(--text-faint)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <text x="640" y="620" text-anchor="middle" font-size="16.8808" fill="var(--text-faint)" font-family="Arial, sans-serif">GraphFrames extends GraphX with DataFrame APIs and additional algorithms</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="27.623" font-weight="bold" fill="var(--primary-accent)">Advanced GraphX Features</text>
  <rect x="40" y="80.8451" width="372.973" height="212.3944" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="121.6902" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)">ML Pipeline Integration</text>
  <text x="64.3243" y="157.6338" font-family="Arial" font-size="16.8808" fill="var(--text)">- Graph features as ML inputs</text>
  <text x="64.3243" y="187.0423" font-family="Arial" font-size="16.8808" fill="var(--text)">- PageRank as feature</text>
  <text x="64.3243" y="216.4507" font-family="Arial" font-size="16.8808" fill="var(--text)">- Community labels</text>
  <text x="64.3243" y="245.8592" font-family="Arial" font-size="16.8808" fill="var(--text)">- Node embeddings</text>
  <text x="64.3243" y="275.2677" font-family="Arial" font-size="16.8808" fill="var(--text)">- Graph neural networks</text>
  <rect x="453.5135" y="80.8451" width="372.973" height="212.3944" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="121.6902" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)">Streaming Graphs</text>
  <text x="477.8378" y="157.6338" font-family="Arial" font-size="16.8808" fill="var(--text)">- Incremental updates</text>
  <text x="477.8378" y="187.0423" font-family="Arial" font-size="16.8808" fill="var(--text)">- Windowed computation</text>
  <text x="477.8378" y="216.4507" font-family="Arial" font-size="16.8808" fill="var(--text)">- Real-time analytics</text>
  <text x="477.8378" y="245.8592" font-family="Arial" font-size="16.8808" fill="var(--text)">- Dynamic graphs</text>
  <text x="477.8378" y="275.2677" font-family="Arial" font-size="16.8808" fill="var(--text)">- Event-driven updates</text>
  <rect x="867.027" y="80.8451" width="372.973" height="212.3944" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="121.6902" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--warn-accent)">Storage Integration</text>
  <text x="891.3514" y="157.6338" font-family="Arial" font-size="16.8808" fill="var(--text)">- Graph databases (Neo4j)</text>
  <text x="891.3514" y="187.0423" font-family="Arial" font-size="16.8808" fill="var(--text)">- HDFS persistence</text>
  <text x="891.3514" y="216.4507" font-family="Arial" font-size="16.8808" fill="var(--text)">- Delta Lake tables</text>
  <text x="891.3514" y="245.8592" font-family="Arial" font-size="16.8808" fill="var(--text)">- Cloud object storage</text>
  <text x="891.3514" y="275.2677" font-family="Arial" font-size="16.8808" fill="var(--text)">- Catalog integration</text>
  <rect x="121.0811" y="350.4226" width="454.0541" height="212.3944" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="348.1081" y="391.2676" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--info-accent)">Motif Finding (Pattern Matching)</text>
  <text x="145.4054" y="428.8451" font-family="Arial" font-size="16.8808" fill="var(--text)">- Structural pattern queries</text>
  <text x="145.4054" y="458.2536" font-family="Arial" font-size="16.8808" fill="var(--text)">- (a)-[e1]-&gt;(b); (b)-[e2]-&gt;(c)</text>
  <text x="145.4054" y="487.6619" font-family="Arial" font-size="16.8808" fill="var(--text)">- Friend-of-friend discovery</text>
  <text x="145.4054" y="517.0704" font-family="Arial" font-size="16.8808" fill="var(--text)">- Cycle detection</text>
  <text x="145.4054" y="546.4789" font-family="Arial" font-size="16.8808" fill="var(--text)">- Fraud pattern matching</text>
  <rect x="688.6486" y="350.4226" width="454.0541" height="212.3944" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.6757" y="391.2676" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)">Custom Algorithms</text>
  <text x="712.973" y="428.8451" font-family="Arial" font-size="16.8808" fill="var(--text)">- User-defined Pregel programs</text>
  <text x="712.973" y="458.2536" font-family="Arial" font-size="16.8808" fill="var(--text)">- Aggregated messaging</text>
  <text x="712.973" y="487.6619" font-family="Arial" font-size="16.8808" fill="var(--text)">- Graph-parallel abstractions</text>
  <text x="712.973" y="517.0704" font-family="Arial" font-size="16.8808" fill="var(--text)">- Compose built-in algorithms</text>
  <text x="712.973" y="546.4789" font-family="Arial" font-size="16.8808" fill="var(--text)">- Domain-specific operators</text>
  <line x1="226.4865" y1="293.2395" x2="348.1081" y2="347.1549" stroke="var(--text-faint)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <line x1="640" y1="293.2395" x2="640" y2="347.1549" stroke="var(--text-faint)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <line x1="1053.5135" y1="293.2395" x2="915.6757" y2="347.1549" stroke="var(--text-faint)" stroke-width="1.4776" stroke-dasharray="5.9105 4.4329" />
  <text x="640" y="620" text-anchor="middle" font-family="Arial" font-size="16.8808" fill="var(--text-faint)">GraphFrames extends GraphX with DataFrame APIs and additional algorithms</text>
</svg>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-family="Arial" font-size="28.8" font-weight="bold" fill="#1a237e">Advanced GraphX Features</text>
  <rect x="48" y="99" width="368" height="234" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="232" y="144" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1565c0">ML Pipeline Integration</text>
  <text x="72" y="183.6" font-family="Arial" font-size="17.6" fill="#333">- Graph features as ML inputs</text>
  <text x="72" y="216" font-family="Arial" font-size="17.6" fill="#333">- PageRank as feature</text>
  <text x="72" y="248.4" font-family="Arial" font-size="17.6" fill="#333">- Community labels</text>
  <text x="72" y="280.8" font-family="Arial" font-size="17.6" fill="#333">- Node embeddings</text>
  <text x="72" y="313.2" font-family="Arial" font-size="17.6" fill="#333">- Graph neural networks</text>
  <rect x="456" y="99" width="368" height="234" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="640" y="144" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">Streaming Graphs</text>
  <text x="480" y="183.6" font-family="Arial" font-size="17.6" fill="#333">- Incremental updates</text>
  <text x="480" y="216" font-family="Arial" font-size="17.6" fill="#333">- Windowed computation</text>
  <text x="480" y="248.4" font-family="Arial" font-size="17.6" fill="#333">- Real-time analytics</text>
  <text x="480" y="280.8" font-family="Arial" font-size="17.6" fill="#333">- Dynamic graphs</text>
  <text x="480" y="313.2" font-family="Arial" font-size="17.6" fill="#333">- Event-driven updates</text>
  <rect x="864" y="99" width="368" height="234" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="1048" y="144" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#e65100">Storage Integration</text>
  <text x="888" y="183.6" font-family="Arial" font-size="17.6" fill="#333">- Graph databases (Neo4j)</text>
  <text x="888" y="216" font-family="Arial" font-size="17.6" fill="#333">- HDFS persistence</text>
  <text x="888" y="248.4" font-family="Arial" font-size="17.6" fill="#333">- Delta Lake tables</text>
  <text x="888" y="280.8" font-family="Arial" font-size="17.6" fill="#333">- Cloud object storage</text>
  <text x="888" y="313.2" font-family="Arial" font-size="17.6" fill="#333">- Catalog integration</text>
  <rect x="128" y="396" width="448" height="234" rx="12.8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.2" />
  <text x="352" y="441" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#7b1fa2">Motif Finding (Pattern Matching)</text>
  <text x="152" y="482.4" font-family="Arial" font-size="17.6" fill="#333">- Structural pattern queries</text>
  <text x="152" y="514.8" font-family="Arial" font-size="17.6" fill="#333">- (a)-[e1]-&gt;(b); (b)-[e2]-&gt;(c)</text>
  <text x="152" y="547.2" font-family="Arial" font-size="17.6" fill="#333">- Friend-of-friend discovery</text>
  <text x="152" y="579.6" font-family="Arial" font-size="17.6" fill="#333">- Cycle detection</text>
  <text x="152" y="612" font-family="Arial" font-size="17.6" fill="#333">- Fraud pattern matching</text>
  <rect x="688" y="396" width="448" height="234" rx="12.8" fill="#e0f2f1" stroke="#00695c" stroke-width="3.2" />
  <text x="912" y="441" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#00695c">Custom Algorithms</text>
  <text x="712" y="482.4" font-family="Arial" font-size="17.6" fill="#333">- User-defined Pregel programs</text>
  <text x="712" y="514.8" font-family="Arial" font-size="17.6" fill="#333">- Aggregated messaging</text>
  <text x="712" y="547.2" font-family="Arial" font-size="17.6" fill="#333">- Graph-parallel abstractions</text>
  <text x="712" y="579.6" font-family="Arial" font-size="17.6" fill="#333">- Compose built-in algorithms</text>
  <text x="712" y="612" font-family="Arial" font-size="17.6" fill="#333">- Domain-specific operators</text>

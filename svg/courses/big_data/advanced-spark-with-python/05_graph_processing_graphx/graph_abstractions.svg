<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="415" y="40" width="450" height="89.230695739643" rx="6.181859382607" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="93.538374982247" text-anchor="middle" font-size="24.144797283616" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Property Graph</text>
  <line x1="527.5" y1="129.230801893492" x2="264.9999" y2="218.461497633135" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="752.4999" y1="129.230801893492" x2="1014.9999" y2="218.461497633135" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="218.461497633135" width="450" height="89.230695739643" rx="6.181859382607" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="264.9999" y="271.99997876923" text-anchor="middle" font-size="24.144797283616" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">VertexRDD</text>
  <rect x="790" y="218.461497633135" width="450" height="89.230695739643" rx="6.181859382607" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1014.9999" y="271.99997876923" text-anchor="middle" font-size="24.144797283616" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">EdgeRDD</text>
  <line x1="264.9999" y1="307.692299526627" x2="264.9999" y2="379.07694104142" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1014.9999" y1="307.692299526627" x2="1014.9999" y2="379.07694104142" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="387.999915076921" width="450" height="71.384641514793" rx="6.181859382607" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="264.9999" y="432.615422177516" text-anchor="middle" font-size="20.695525810101" fill="var(--text)" font-family="Arial, sans-serif">(VertexId, Properties)</text>
  <rect x="790" y="387.999915076921" width="450" height="71.384641514793" rx="6.181859382607" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1014.9999" y="432.615422177516" text-anchor="middle" font-size="20.695525810101" fill="var(--text)" font-family="Arial, sans-serif">(SrcId, DstId, Properties)</text>
  <line x1="264.9999" y1="459.384662745563" x2="639.9999" y2="539.692278295857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1014.9999" y1="459.384662745563" x2="639.9999" y2="539.692278295857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="415" y="530.769304260357" width="450" height="89.230695739643" rx="6.181859382607" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="570.030729708875" text-anchor="middle" font-size="24.144797283616" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Triplet View</text>
  <text x="639.9999" y="602.153839621302" text-anchor="middle" font-size="18.970993104333" fill="var(--text-muted)" font-family="Arial, sans-serif">(SrcVertex, Edge, DstVertex)</text>
</svg>

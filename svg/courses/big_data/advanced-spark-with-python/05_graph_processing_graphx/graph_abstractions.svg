<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="30.1302" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Graph Abstraction Types</text>
  <rect x="415" y="73.6232" width="450" height="84.0579" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="124.0579" text-anchor="middle" font-size="23.4345" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Property Graph</text>
  <line x1="527.5" y1="157.6812" x2="264.9999" y2="241.7391" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="752.4999" y1="157.6812" x2="1014.9999" y2="241.7391" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="241.7391" width="450" height="84.0579" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="264.9999" y="292.1739" text-anchor="middle" font-size="23.4345" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">VertexRDD</text>
  <rect x="790" y="241.7391" width="450" height="84.0579" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1014.9999" y="292.1739" text-anchor="middle" font-size="23.4345" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">EdgeRDD</text>
  <line x1="264.9999" y1="325.7971" x2="264.9999" y2="393.0435" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1014.9999" y1="325.7971" x2="1014.9999" y2="393.0435" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="401.4492" width="450" height="67.2464" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="264.9999" y="443.4783" text-anchor="middle" font-size="20.0867" fill="var(--text)" font-family="Arial, sans-serif">(VertexId, Properties)</text>
  <rect x="790" y="401.4492" width="450" height="67.2464" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1014.9999" y="443.4783" text-anchor="middle" font-size="20.0867" fill="var(--text)" font-family="Arial, sans-serif">(SrcId, DstId, Properties)</text>
  <line x1="264.9999" y1="468.6957" x2="639.9999" y2="544.3478" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1014.9999" y1="468.6957" x2="639.9999" y2="544.3478" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="415" y="535.9421" width="450" height="84.0579" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="572.9275" text-anchor="middle" font-size="23.4345" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Triplet View</text>
  <text x="639.9999" y="603.1884" text-anchor="middle" font-size="18.4129" fill="var(--text-muted)" font-family="Arial, sans-serif">(SrcVertex, Edge, DstVertex)</text>
</svg>
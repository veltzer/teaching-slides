<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="606.8148" y="51.2" text-anchor="middle" font-family="Arial" font-size="27.3067" font-weight="bold" fill="var(--primary-accent)">Graph Abstraction Types</text>
  <rect x="424.7704" y="85.3333" width="364.0889" height="85.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="606.8148" y="136.5333" text-anchor="middle" font-family="Arial" font-size="21.2385" font-weight="bold" fill="var(--primary-accent)">Property Graph</text>
  <line x1="515.7926" y1="170.6667" x2="303.4074" y2="256" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="697.837" y1="170.6667" x2="910.2222" y2="256" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="121.363" y="256" width="364.0889" height="85.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="303.4074" y="307.2" text-anchor="middle" font-family="Arial" font-size="21.2385" font-weight="bold" fill="var(--ok-accent)">VertexRDD</text>
  <rect x="728.1778" y="256" width="364.0889" height="85.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="910.2222" y="307.2" text-anchor="middle" font-family="Arial" font-size="21.2385" font-weight="bold" fill="var(--warn-accent)">EdgeRDD</text>
  <line x1="303.4074" y1="341.3333" x2="303.4074" y2="409.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="910.2222" y1="341.3333" x2="910.2222" y2="409.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="121.363" y="418.1333" width="364.0889" height="68.2667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="303.4074" y="460.8" text-anchor="middle" font-family="Arial" font-size="18.2044" fill="var(--text)">(VertexId, Properties)</text>
  <rect x="728.1778" y="418.1333" width="364.0889" height="68.2667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="910.2222" y="460.8" text-anchor="middle" font-family="Arial" font-size="18.2044" fill="var(--text)">(SrcId, DstId, Properties)</text>
  <line x1="303.4074" y1="486.4" x2="606.8148" y2="563.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="910.2222" y1="486.4" x2="606.8148" y2="563.2" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="424.7704" y="554.6667" width="364.0889" height="85.3333" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="606.8148" y="592.2133" text-anchor="middle" font-family="Arial" font-size="21.2385" font-weight="bold" fill="var(--info-accent)">Triplet View</text>
  <text x="606.8148" y="622.9333" text-anchor="middle" font-family="Arial" font-size="16.6874" fill="var(--text-muted)">(SrcVertex, Edge, DstVertex)</text>
</svg>
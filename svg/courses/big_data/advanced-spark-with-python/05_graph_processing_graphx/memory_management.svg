<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="551.3513" height="580" rx="6.229967981105" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="315.6757" y="85.312409033201" text-anchor="middle" font-size="22.629008864969" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Executor Memory</text>
  <rect x="72.4325" y="112.499919140623" width="486.4864" height="144.999946093749" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="154.187564013674" text-anchor="middle" font-size="21.012643672271" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Storage Memory (60%)</text>
  <rect x="96.7568" y="175.937550537111" width="137.8378" height="54.375020214844" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.8649" y="212.187456201171" text-anchor="middle" font-size="16.163651926977" fill="var(--text)" font-family="Arial, sans-serif">Cached Vertices</text>
  <rect x="250.8108" y="175.937550537111" width="137.8378" height="54.375020214844" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.9189" y="212.187456201171" text-anchor="middle" font-size="16.163651926977" fill="var(--text)" font-family="Arial, sans-serif">Cached Edges</text>
  <rect x="404.8648" y="175.937550537111" width="129.7298" height="54.375020214844" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="469.7297" y="212.187456201171" text-anchor="middle" font-size="16.163651926977" fill="var(--text)" font-family="Arial, sans-serif">Broadcasts</text>
  <rect x="72.4325" y="284.687483154296" width="486.4864" height="108.750040429689" rx="6.229967981105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="326.375020214844" text-anchor="middle" font-size="21.012643672271" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Execution Memory (40%)</text>
  <text x="315.6757" y="366.250013476563" text-anchor="middle" font-size="17.779913286875" fill="var(--text-muted)" font-family="Arial, sans-serif">Shuffles, Joins, Aggregations</text>
  <rect x="72.4325" y="420.625033691407" width="486.4864" height="81.562530322266" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="315.6757" y="462.312462939452" text-anchor="middle" font-size="21.012643672271" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Overhead Memory</text>
  <text x="315.6757" y="489.499973046874" text-anchor="middle" font-size="17.779913286875" fill="var(--text-muted)" font-family="Arial, sans-serif">JVM internals, class metadata</text>
  <rect x="672.4324" y="40" width="567.5676" height="580" rx="6.229967981105" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="956.2161" y="85.312409033201" text-anchor="middle" font-size="22.629008864969" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Caching Strategies</text>
  <rect x="704.8648" y="112.499919140623" width="502.7027" height="81.562530322266" rx="6.229967981105" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="721.0811" y="148.750040429689" font-size="19.396278479573" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">MEMORY_ONLY</text>
  <text x="721.0811" y="179.562530322266" font-size="17.779913286875" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast, but may OOM on large graphs</text>
  <rect x="704.8648" y="212.187456201171" width="502.7027" height="81.562530322266" rx="6.229967981105" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="721.0811" y="248.437469677734" font-size="19.396278479573" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">MEMORY_AND_DISK</text>
  <text x="721.0811" y="279.250067382814" font-size="17.779913286875" fill="var(--text-muted)" font-family="Arial, sans-serif">Spills to disk; recommended for graphs</text>
  <rect x="704.8648" y="311.874993261719" width="502.7027" height="81.562530322266" rx="6.229967981105" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="721.0811" y="348.125006738281" font-size="19.396278479573" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">MEMORY_ONLY_SER</text>
  <text x="721.0811" y="378.937496630859" font-size="17.779913286875" fill="var(--text-muted)" font-family="Arial, sans-serif">Serialized; saves space, costs CPU</text>
  <rect x="704.8648" y="429.687537060548" width="502.7027" height="163.12495283203" rx="6.229967981105" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="956.2161" y="469.562530322266" text-anchor="middle" font-size="19.396278479573" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Best Practices</text>
  <text x="721.0811" y="505.812543798829" font-size="17.779913286875" fill="var(--text)" font-family="Arial, sans-serif">- Cache graph before iterative algos</text>
  <text x="721.0811" y="534.812489892578" font-size="17.779913286875" fill="var(--text)" font-family="Arial, sans-serif">- Unpersist when no longer needed</text>
  <text x="721.0811" y="563.812435986326" font-size="17.779913286875" fill="var(--text)" font-family="Arial, sans-serif">- Use checkpointing for long lineages</text>
</svg>

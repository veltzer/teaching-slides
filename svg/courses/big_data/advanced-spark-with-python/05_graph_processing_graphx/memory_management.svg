  <ns0:text x="162.323" y="256" text-anchor="middle" font-family="Arial" font-size="15.1704" fill="#333">Cached Vertices</ns0:text>
  <ns0:rect x="242.7259" y="221.8667" width="128.9481" height="51.2" rx="6.0681" fill="#bbdefb" stroke="#1565c0" stroke-width="1.517" />
  <ns0:text x="306.4415" y="256" text-anchor="middle" font-family="Arial" font-size="15.1704" fill="#333">Cached Edges</ns0:text>
  <ns0:rect x="386.8444" y="221.8667" width="121.363" height="51.2" rx="6.0681" fill="#bbdefb" stroke="#1565c0" stroke-width="1.517" />
  <ns0:text x="447.5259" y="256" text-anchor="middle" font-family="Arial" font-size="15.1704" fill="#333">Broadcasts</ns0:text>
  <ns0:rect x="75.8519" y="324.2667" width="455.1111" height="102.4" rx="9.1022" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.0341" />
  <ns0:text x="303.4074" y="363.52" text-anchor="middle" font-family="Arial" font-size="19.7215" font-weight="bold" fill="#2e7d32">Execution Memory (40%)</ns0:text>
  <ns0:text x="303.4074" y="401.0667" text-anchor="middle" font-family="Arial" font-size="16.6874" fill="#555">Shuffles, Joins, Aggregations</ns0:text>

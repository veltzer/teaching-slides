<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="606.8148" y="51.2" text-anchor="middle" font-family="Arial" font-size="27.3067" font-weight="bold" fill="var(--primary-accent)">Graph Memory Management</text>
  <rect x="45.5111" y="93.8667" width="515.7926" height="546.1333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="303.4074" y="136.5333" text-anchor="middle" font-family="Arial" font-size="21.2385" font-weight="bold" fill="var(--text)">Executor Memory</text>
  <rect x="75.8519" y="162.1333" width="455.1111" height="136.5333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="303.4074" y="201.3867" text-anchor="middle" font-family="Arial" font-size="19.7215" font-weight="bold" fill="var(--primary-accent)">Storage Memory (60%)</text>
  <rect x="98.6074" y="221.8667" width="128.9481" height="51.2" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="162.323" y="256" text-anchor="middle" font-family="Arial" font-size="15.1704" fill="var(--text)">Cached Vertices</text>
  <rect x="242.7259" y="221.8667" width="128.9481" height="51.2" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="306.4415" y="256" text-anchor="middle" font-family="Arial" font-size="15.1704" fill="var(--text)">Cached Edges</text>
  <rect x="386.8444" y="221.8667" width="121.363" height="51.2" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="447.5259" y="256" text-anchor="middle" font-family="Arial" font-size="15.1704" fill="var(--text)">Broadcasts</text>
  <rect x="75.8519" y="324.2667" width="455.1111" height="102.4" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="303.4074" y="363.52" text-anchor="middle" font-family="Arial" font-size="19.7215" font-weight="bold" fill="var(--ok-accent)">Execution Memory (40%)</text>
  <text x="303.4074" y="401.0667" text-anchor="middle" font-family="Arial" font-size="16.6874" fill="var(--text-muted)">Shuffles, Joins, Aggregations</text>
  <rect x="75.8519" y="452.2667" width="455.1111" height="76.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="303.4074" y="491.52" text-anchor="middle" font-family="Arial" font-size="19.7215" font-weight="bold" fill="var(--warn-accent)">Overhead Memory</text>
  <text x="303.4074" y="517.12" text-anchor="middle" font-family="Arial" font-size="16.6874" fill="var(--text-muted)">JVM internals, class metadata</text>
  <rect x="637.1556" y="93.8667" width="530.963" height="546.1333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="902.637" y="136.5333" text-anchor="middle" font-family="Arial" font-size="21.2385" font-weight="bold" fill="var(--text)">Caching Strategies</text>
  <rect x="667.4963" y="162.1333" width="470.2815" height="76.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="682.6667" y="196.2667" font-family="Arial" font-size="18.2044" font-weight="bold" fill="var(--ok-accent)">MEMORY_ONLY</text>
  <text x="682.6667" y="225.28" font-family="Arial" font-size="16.6874" fill="var(--text-muted)">Fast, but may OOM on large graphs</text>
  <rect x="667.4963" y="256" width="470.2815" height="76.8" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="682.6667" y="290.1333" font-family="Arial" font-size="18.2044" font-weight="bold" fill="var(--primary-accent)">MEMORY_AND_DISK</text>
  <text x="682.6667" y="319.1467" font-family="Arial" font-size="16.6874" fill="var(--text-muted)">Spills to disk; recommended for graphs</text>
  <rect x="667.4963" y="349.8667" width="470.2815" height="76.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="682.6667" y="384" font-family="Arial" font-size="18.2044" font-weight="bold" fill="var(--warn-accent)">MEMORY_ONLY_SER</text>
  <text x="682.6667" y="413.0133" font-family="Arial" font-size="16.6874" fill="var(--text-muted)">Serialized; saves space, costs CPU</text>
  <rect x="667.4963" y="460.8" width="470.2815" height="153.6" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="902.637" y="498.3467" text-anchor="middle" font-family="Arial" font-size="18.2044" font-weight="bold" fill="var(--info-accent)">Best Practices</text>
  <text x="682.6667" y="532.48" font-family="Arial" font-size="16.6874" fill="var(--text)">- Cache graph before iterative algos</text>
  <text x="682.6667" y="559.7867" font-family="Arial" font-size="16.6874" fill="var(--text)">- Unpersist when no longer needed</text>
  <text x="682.6667" y="587.0933" font-family="Arial" font-size="16.6874" fill="var(--text)">- Use checkpointing for long lineages</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="28.0205" font-weight="bold" fill="var(--primary-accent)">Graph Memory Management</text>
  <rect x="40" y="82.029" width="551.3513" height="537.971" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="315.6757" y="124.0579" text-anchor="middle" font-family="Arial" font-size="21.7937" font-weight="bold" fill="var(--text)">Executor Memory</text>
  <rect x="72.4325" y="149.2753" width="486.4864" height="134.4927" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="315.6757" y="187.9421" text-anchor="middle" font-family="Arial" font-size="20.237" font-weight="bold" fill="var(--primary-accent)">Storage Memory (60%)</text>
  <rect x="96.7568" y="208.116" width="137.8378" height="50.4348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="164.8649" y="241.7391" text-anchor="middle" font-family="Arial" font-size="15.567" fill="var(--text)">Cached Vertices</text>
  <rect x="250.8108" y="208.116" width="137.8378" height="50.4348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="318.9189" y="241.7391" text-anchor="middle" font-family="Arial" font-size="15.567" fill="var(--text)">Cached Edges</text>
  <rect x="404.8648" y="208.116" width="129.7298" height="50.4348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="469.7297" y="241.7391" text-anchor="middle" font-family="Arial" font-size="15.567" fill="var(--text)">Broadcasts</text>
  <rect x="72.4325" y="308.9855" width="486.4864" height="100.8696" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="315.6757" y="347.6522" text-anchor="middle" font-family="Arial" font-size="20.237" font-weight="bold" fill="var(--ok-accent)">Execution Memory (40%)</text>
  <text x="315.6757" y="384.6377" text-anchor="middle" font-family="Arial" font-size="17.1236" fill="var(--text-muted)">Shuffles, Joins, Aggregations</text>
  <rect x="72.4325" y="435.0725" width="486.4864" height="75.6522" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="315.6757" y="473.7391" text-anchor="middle" font-family="Arial" font-size="20.237" font-weight="bold" fill="var(--warn-accent)">Overhead Memory</text>
  <text x="315.6757" y="498.9565" text-anchor="middle" font-family="Arial" font-size="17.1236" fill="var(--text-muted)">JVM internals, class metadata</text>
  <rect x="672.4324" y="82.029" width="567.5676" height="537.971" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="956.2161" y="124.0579" text-anchor="middle" font-family="Arial" font-size="21.7937" font-weight="bold" fill="var(--text)">Caching Strategies</text>
  <rect x="704.8648" y="149.2753" width="502.7027" height="75.6522" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="721.0811" y="182.8986" font-family="Arial" font-size="18.6803" font-weight="bold" fill="var(--ok-accent)">MEMORY_ONLY</text>
  <text x="721.0811" y="211.4783" font-family="Arial" font-size="17.1236" fill="var(--text-muted)">Fast, but may OOM on large graphs</text>
  <rect x="704.8648" y="241.7391" width="502.7027" height="75.6522" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="721.0811" y="275.3623" font-family="Arial" font-size="18.6803" font-weight="bold" fill="var(--primary-accent)">MEMORY_AND_DISK</text>
  <text x="721.0811" y="303.9421" font-family="Arial" font-size="17.1236" fill="var(--text-muted)">Spills to disk; recommended for graphs</text>
  <rect x="704.8648" y="334.2029" width="502.7027" height="75.6522" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="721.0811" y="367.8261" font-family="Arial" font-size="18.6803" font-weight="bold" fill="var(--warn-accent)">MEMORY_ONLY_SER</text>
  <text x="721.0811" y="396.4058" font-family="Arial" font-size="17.1236" fill="var(--text-muted)">Serialized; saves space, costs CPU</text>
  <rect x="704.8648" y="443.4783" width="502.7027" height="151.3043" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="956.2161" y="480.4638" text-anchor="middle" font-family="Arial" font-size="18.6803" font-weight="bold" fill="var(--info-accent)">Best Practices</text>
  <text x="721.0811" y="514.087" font-family="Arial" font-size="17.1236" fill="var(--text)">- Cache graph before iterative algos</text>
  <text x="721.0811" y="540.9855" font-family="Arial" font-size="17.1236" fill="var(--text)">- Unpersist when no longer needed</text>
  <text x="721.0811" y="567.884" font-family="Arial" font-size="17.1236" fill="var(--text)">- Use checkpointing for long lineages</text>
</svg>
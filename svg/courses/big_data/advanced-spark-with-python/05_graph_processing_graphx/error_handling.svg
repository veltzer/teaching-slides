<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-family="Arial" font-size="26.9474" font-weight="bold" fill="var(--primary-accent)">Graph Error Handling</text>
  <rect x="44.9123" y="101.0526" width="269.4737" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="179.6491" y="151.5789" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--primary-accent)">Graph Operation</text>
  <line x1="314.386" y1="143.1579" x2="389.2398" y2="143.1579" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="404.2105" y="84.2105" width="359.2982" height="117.8947" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="583.8596" y="126.3158" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--danger-accent)">Possible Errors</text>
  <text x="583.8596" y="168.4211" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">OOM / Invalid Data / Convergence</text>
  <line x1="763.5088" y1="143.1579" x2="838.3626" y2="143.1579" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="853.3333" y="101.0526" width="299.4152" height="84.2105" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1003.0409" y="151.5789" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">Error Handler</text>
  <rect x="44.9123" y="261.0526" width="344.3275" height="185.2632" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="217.076" y="299.7895" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--danger-accent)">Out of Memory</text>
  <text x="67.3684" y="333.4737" font-family="Arial" font-size="16.4678" fill="var(--text)">- Increase executor memory</text>
  <text x="67.3684" y="363.7895" font-family="Arial" font-size="16.4678" fill="var(--text)">- Repartition the graph</text>
  <text x="67.3684" y="394.1053" font-family="Arial" font-size="16.4678" fill="var(--text)">- Use MEMORY_AND_DISK</text>
  <text x="67.3684" y="424.4211" font-family="Arial" font-size="16.4678" fill="var(--text)">- Enable checkpointing</text>
  <rect x="426.6667" y="261.0526" width="344.3275" height="185.2632" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="598.8304" y="299.7895" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--warn-accent)">Invalid Data</text>
  <text x="449.1228" y="333.4737" font-family="Arial" font-size="16.4678" fill="var(--text)">- Missing vertex references</text>
  <text x="449.1228" y="363.7895" font-family="Arial" font-size="16.4678" fill="var(--text)">- Null properties</text>
  <text x="449.1228" y="394.1053" font-family="Arial" font-size="16.4678" fill="var(--text)">- Validate before creating</text>
  <text x="449.1228" y="424.4211" font-family="Arial" font-size="16.4678" fill="var(--text)">- Use try/except blocks</text>
  <rect x="808.4211" y="261.0526" width="344.3275" height="185.2632" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="980.5848" y="299.7895" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--info-accent)">Non-Convergence</text>
  <text x="830.8772" y="333.4737" font-family="Arial" font-size="16.4678" fill="var(--text)">- Set maxIterations limit</text>
  <text x="830.8772" y="363.7895" font-family="Arial" font-size="16.4678" fill="var(--text)">- Monitor convergence</text>
  <text x="830.8772" y="394.1053" font-family="Arial" font-size="16.4678" fill="var(--text)">- Adjust tolerance (tol)</text>
  <text x="830.8772" y="424.4211" font-family="Arial" font-size="16.4678" fill="var(--text)">- Check for graph cycles</text>
  <rect x="149.7076" y="505.2632" width="898.2456" height="134.7368" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="598.8304" y="547.3684" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">Recommended Pattern</text>
  <text x="179.6491" y="586.1053" font-family="Courier New" font-size="16.4678" fill="var(--text)">try:</text>
  <text x="209.5906" y="611.3684" font-family="Courier New" font-size="16.4678" fill="var(--text)">result = g.pageRank(maxIter=20, tol=0.01)</text>
  <text x="179.6491" y="636.6316" font-family="Courier New" font-size="16.4678" fill="var(--text)">except Exception as e: log_error(e); fallback()</text>
</svg>
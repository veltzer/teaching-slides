  <ns0:text x="1003.0409" y="151.5789" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="#2e7d32">Error Handler</ns0:text>
  <ns0:rect x="44.9123" y="261.0526" width="344.3275" height="185.2632" rx="11.9766" fill="#fce4ec" stroke="#c62828" stroke-width="2.9942" />
  <ns0:text x="217.076" y="299.7895" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="#c62828">Out of Memory</ns0:text>
  <ns0:text x="67.3684" y="333.4737" font-family="Arial" font-size="16.4678" fill="#333">- Increase executor memory</ns0:text>
  <ns0:text x="67.3684" y="363.7895" font-family="Arial" font-size="16.4678" fill="#333">- Repartition the graph</ns0:text>
  <ns0:text x="67.3684" y="394.1053" font-family="Arial" font-size="16.4678" fill="#333">- Use MEMORY_AND_DISK</ns0:text>
  <ns0:text x="67.3684" y="424.4211" font-family="Arial" font-size="16.4678" fill="#333">- Enable checkpointing</ns0:text>
  <ns0:rect x="426.6667" y="261.0526" width="344.3275" height="185.2632" rx="11.9766" fill="#fff3e0" stroke="#e65100" stroke-width="2.9942" />
  <ns0:text x="598.8304" y="299.7895" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="#e65100">Invalid Data</ns0:text>
  <ns0:text x="449.1228" y="333.4737" font-family="Arial" font-size="16.4678" fill="#333">- Missing vertex references</ns0:text>
  <ns0:text x="449.1228" y="363.7895" font-family="Arial" font-size="16.4678" fill="#333">- Null properties</ns0:text>
  <ns0:text x="449.1228" y="394.1053" font-family="Arial" font-size="16.4678" fill="#333">- Validate before creating</ns0:text>
  <ns0:text x="449.1228" y="424.4211" font-family="Arial" font-size="16.4678" fill="#333">- Use try/except blocks</ns0:text>

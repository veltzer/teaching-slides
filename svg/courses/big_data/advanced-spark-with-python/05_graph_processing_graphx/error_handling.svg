<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-family="Arial" font-size="28.8" font-weight="bold" fill="#1a237e">Graph Error Handling</text>
  <rect x="48" y="108" width="288" height="90" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="192" y="162" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1565c0">Graph Operation</text>
  <line x1="336" y1="153" x2="416" y2="153" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="432" y="90" width="384" height="126" rx="12.8" fill="#fce4ec" stroke="#c62828" stroke-width="3.2" />
  <text x="624" y="135" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#c62828">Possible Errors</text>
  <text x="624" y="180" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">OOM / Invalid Data / Convergence</text>
  <line x1="816" y1="153" x2="896" y2="153" stroke="#333" stroke-width="3.2" marker-end="url(#arrow)" />
  <rect x="912" y="108" width="320" height="90" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="1072" y="162" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">Error Handler</text>
  <rect x="48" y="279" width="368" height="198" rx="12.8" fill="#fce4ec" stroke="#c62828" stroke-width="3.2" />
  <text x="232" y="320.4" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#c62828">Out of Memory</text>
  <text x="72" y="356.4" font-family="Arial" font-size="17.6" fill="#333">- Increase executor memory</text>
  <text x="72" y="388.8" font-family="Arial" font-size="17.6" fill="#333">- Repartition the graph</text>
  <text x="72" y="421.2" font-family="Arial" font-size="17.6" fill="#333">- Use MEMORY_AND_DISK</text>
  <text x="72" y="453.6" font-family="Arial" font-size="17.6" fill="#333">- Enable checkpointing</text>
  <rect x="456" y="279" width="368" height="198" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="640" y="320.4" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#e65100">Invalid Data</text>
  <text x="480" y="356.4" font-family="Arial" font-size="17.6" fill="#333">- Missing vertex references</text>
  <text x="480" y="388.8" font-family="Arial" font-size="17.6" fill="#333">- Null properties</text>
  <text x="480" y="421.2" font-family="Arial" font-size="17.6" fill="#333">- Validate before creating</text>
  <text x="480" y="453.6" font-family="Arial" font-size="17.6" fill="#333">- Use try/except blocks</text>
  <rect x="864" y="279" width="368" height="198" rx="12.8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.2" />
  <text x="1048" y="320.4" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#7b1fa2">Non-Convergence</text>
  <text x="888" y="356.4" font-family="Arial" font-size="17.6" fill="#333">- Set maxIterations limit</text>
  <text x="888" y="388.8" font-family="Arial" font-size="17.6" fill="#333">- Monitor convergence</text>
  <text x="888" y="421.2" font-family="Arial" font-size="17.6" fill="#333">- Adjust tolerance (tol)</text>
  <text x="888" y="453.6" font-family="Arial" font-size="17.6" fill="#333">- Check for graph cycles</text>
  <rect x="160" y="540" width="960" height="144" rx="12.8" fill="#e0f2f1" stroke="#00695c" stroke-width="3.2" />
  <text x="640" y="585" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#00695c">Recommended Pattern</text>
  <text x="192" y="626.4" font-family="Courier New" font-size="17.6" fill="#333">try:</text>
  <text x="224" y="653.4" font-family="Courier New" font-size="17.6" fill="#333">result = g.pageRank(maxIter=20, tol=0.01)</text>
  <text x="192" y="680.4" font-family="Courier New" font-size="17.6" fill="#333">except Exception as e: log_error(e); fallback()</text>
</svg>
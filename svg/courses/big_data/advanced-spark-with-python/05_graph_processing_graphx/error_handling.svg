<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="27.8196" font-weight="bold" fill="var(--primary-accent)">Graph Error Handling</text>
  <rect x="40" y="89.7143" width="291.8919" height="82.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="185.9459" y="139.4285" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--primary-accent)">Graph Operation</text>
  <line x1="331.8919" y1="131.1429" x2="412.973" y2="131.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="429.1891" y="73.1428" width="389.1891" height="116" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="623.7837" y="114.5715" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)">Possible Errors</text>
  <text x="623.7837" y="156.0001" text-anchor="middle" font-family="Arial" font-size="17.0008" fill="var(--text-muted)">OOM / Invalid Data / Convergence</text>
  <line x1="818.3784" y1="131.1429" x2="899.4594" y2="131.1429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="915.6756" y="89.7143" width="324.3243" height="82.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1077.8377" y="139.4285" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)">Error Handler</text>
  <rect x="40" y="247.1428" width="372.973" height="182.2858" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="226.4864" y="285.2572" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--danger-accent)">Out of Memory</text>
  <text x="64.3243" y="318.4" font-family="Arial" font-size="17.0008" fill="var(--text)">- Increase executor memory</text>
  <text x="64.3243" y="348.2286" font-family="Arial" font-size="17.0008" fill="var(--text)">- Repartition the graph</text>
  <text x="64.3243" y="378.0572" font-family="Arial" font-size="17.0008" fill="var(--text)">- Use MEMORY_AND_DISK</text>
  <text x="64.3243" y="407.8858" font-family="Arial" font-size="17.0008" fill="var(--text)">- Enable checkpointing</text>
  <rect x="453.5135" y="247.1428" width="372.973" height="182.2858" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="285.2572" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--warn-accent)">Invalid Data</text>
  <text x="477.8378" y="318.4" font-family="Arial" font-size="17.0008" fill="var(--text)">- Missing vertex references</text>
  <text x="477.8378" y="348.2286" font-family="Arial" font-size="17.0008" fill="var(--text)">- Null properties</text>
  <text x="477.8378" y="378.0572" font-family="Arial" font-size="17.0008" fill="var(--text)">- Validate before creating</text>
  <text x="477.8378" y="407.8858" font-family="Arial" font-size="17.0008" fill="var(--text)">- Use try/except blocks</text>
  <rect x="867.027" y="247.1428" width="372.973" height="182.2858" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1053.5135" y="285.2572" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--info-accent)">Non-Convergence</text>
  <text x="891.3513" y="318.4" font-family="Arial" font-size="17.0008" fill="var(--text)">- Set maxIterations limit</text>
  <text x="891.3513" y="348.2286" font-family="Arial" font-size="17.0008" fill="var(--text)">- Monitor convergence</text>
  <text x="891.3513" y="378.0572" font-family="Arial" font-size="17.0008" fill="var(--text)">- Adjust tolerance (tol)</text>
  <text x="891.3513" y="407.8858" font-family="Arial" font-size="17.0008" fill="var(--text)">- Check for graph cycles</text>
  <rect x="153.5135" y="487.4286" width="972.9729" height="132.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="639.9999" y="528.8571" text-anchor="middle" font-family="Arial" font-size="20.0919" font-weight="bold" fill="var(--ok-accent)">Recommended Pattern</text>
  <text x="185.9459" y="566.9715" font-family="Courier New" font-size="17.0008" fill="var(--text)">try:</text>
  <text x="218.3783" y="591.8286" font-family="Courier New" font-size="17.0008" fill="var(--text)">result = g.pageRank(maxIter=20, tol=0.01)</text>
  <text x="185.9459" y="616.6857" font-family="Courier New" font-size="17.0008" fill="var(--text)">except Exception as e: log_error(e); fallback()</text>
</svg>
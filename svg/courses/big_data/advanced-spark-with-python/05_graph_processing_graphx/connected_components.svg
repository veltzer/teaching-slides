  <text x="818.2648" y="508.4932" text-anchor="middle" font-family="Arial" font-size="20.2618" font-weight="bold" fill="var(--warn-accent)">Component 3</text>
  <circle cx="818.2648" cy="587.3973" r="38.965" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.1172" />

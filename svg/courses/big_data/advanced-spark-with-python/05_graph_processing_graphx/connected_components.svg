  <text x="818.2648" y="608.4384" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">id=8</text>
  <text x="1091.0198" y="543.5616" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">Each component</text>
  <text x="1091.0198" y="571.6164" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">gets the lowest</text>
  <text x="1091.0198" y="599.6712" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">vertex ID as label</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="28.4356" font-weight="bold" fill="var(--primary-accent)">Connected Components Algorithm</text>
  <rect x="40" y="83.2837" width="518.9189" height="484.7761" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.3516 4.6758" />
  <text x="299.4594" y="126.5672" text-anchor="middle" font-family="Arial" font-size="20.5368" font-weight="bold" fill="var(--primary-accent)">Component 1</text>
  <circle cx="153.5135" cy="230.4478" r="47.3927" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1172" />
  <text x="153.5135" y="223.5225" text-anchor="middle" font-family="Arial" font-size="18.9571" font-weight="bold" fill="var(--text)">A</text>
  <text x="153.5135" y="251.2239" text-anchor="middle" font-family="Arial" font-size="15.7976" fill="var(--text-muted)">id=1</text>
  <circle cx="396.7567" cy="195.821" r="47.3927" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1172" />
  <text x="396.7567" y="188.8956" text-anchor="middle" font-family="Arial" font-size="18.9571" font-weight="bold" fill="var(--text)">B</text>
  <text x="396.7567" y="216.5971" text-anchor="middle" font-family="Arial" font-size="15.7976" fill="var(--text-muted)">id=2</text>
  <circle cx="267.027" cy="386.2687" r="47.3927" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1172" />
  <text x="267.027" y="379.3433" text-anchor="middle" font-family="Arial" font-size="18.9571" font-weight="bold" fill="var(--text)">C</text>
  <text x="267.027" y="407.0448" text-anchor="middle" font-family="Arial" font-size="15.7976" fill="var(--text-muted)">id=3</text>
  <circle cx="445.4054" cy="455.5224" r="47.3927" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1172" />
  <text x="445.4054" y="448.5971" text-anchor="middle" font-family="Arial" font-size="18.9571" font-weight="bold" fill="var(--text)">D</text>
  <text x="445.4054" y="476.2986" text-anchor="middle" font-family="Arial" font-size="15.7976" fill="var(--text-muted)">id=4</text>
  <line x1="202.1622" y1="221.791" x2="348.1081" y2="204.4777" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="177.8379" y1="277.194" x2="226.4865" y2="342.9851" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="377.2973" y1="242.5672" x2="307.5675" y2="346.4478" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="315.6756" y1="394.9254" x2="396.7567" y2="441.6717" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="672.4324" y="83.2837" width="567.5676" height="294.3283" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.3516 4.6758" />
  <text x="956.2162" y="126.5672" text-anchor="middle" font-family="Arial" font-size="20.5368" font-weight="bold" fill="var(--ok-accent)">Component 2</text>
  <circle cx="802.1621" cy="247.7612" r="47.3927" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.1172" />
  <text x="802.1621" y="240.8358" text-anchor="middle" font-family="Arial" font-size="18.9571" font-weight="bold" fill="var(--text)">E</text>
  <text x="802.1621" y="268.5373" text-anchor="middle" font-family="Arial" font-size="15.7976" fill="var(--text-muted)">id=5</text>
  <circle cx="1029.1892" cy="195.821" r="47.3927" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.1172" />
  <text x="1029.1892" y="188.8956" text-anchor="middle" font-family="Arial" font-size="18.9571" font-weight="bold" fill="var(--text)">F</text>
  <text x="1029.1892" y="216.5971" text-anchor="middle" font-family="Arial" font-size="15.7976" fill="var(--text-muted)">id=6</text>
  <circle cx="1094.054" cy="317.015" r="47.3927" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.1172" />
  <text x="1094.054" y="310.0896" text-anchor="middle" font-family="Arial" font-size="18.9571" font-weight="bold" fill="var(--text)">G</text>
  <text x="1094.054" y="337.7911" text-anchor="middle" font-family="Arial" font-size="15.7976" fill="var(--text-muted)">id=7</text>
  <line x1="850.8107" y1="239.1045" x2="980.5405" y2="204.4777" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="1045.4054" y1="244.2985" x2="1077.8378" y2="270.2687" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="721.0811" y="446.8656" width="243.2433" height="173.1344" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="9.3516 4.6758" />
  <text x="842.7026" y="490.1493" text-anchor="middle" font-family="Arial" font-size="20.5368" font-weight="bold" fill="var(--warn-accent)">Component 3</text>
  <circle cx="842.7026" cy="568.0597" r="39.4939" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.1172" />
  <text x="842.7026" y="561.1344" text-anchor="middle" font-family="Arial" font-size="18.9571" font-weight="bold" fill="var(--text)">H</text>
  <text x="842.7026" y="588.8359" text-anchor="middle" font-family="Arial" font-size="15.7976" fill="var(--text-muted)">id=8</text>
  <text x="1126.4865" y="524.7761" text-anchor="middle" font-family="Arial" font-size="17.3773" fill="var(--text-muted)">Each component</text>
  <text x="1126.4865" y="552.4776" text-anchor="middle" font-family="Arial" font-size="17.3773" fill="var(--text-muted)">gets the lowest</text>
  <text x="1126.4865" y="580.1791" text-anchor="middle" font-family="Arial" font-size="17.3773" fill="var(--text-muted)">vertex ID as label</text>
</svg>
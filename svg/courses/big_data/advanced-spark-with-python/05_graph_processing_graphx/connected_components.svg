  <circle cx="436.4079" cy="473.4247" r="46.758" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1172" />
  <text x="436.4079" y="466.411" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--text)">D</text>
  <text x="436.4079" y="494.4658" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">id=4</text>
  <line x1="202.618" y1="236.7123" x2="342.8919" y2="219.1781" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="179.239" y1="292.8219" x2="225.997" y2="359.4521" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="370.9467" y1="257.7534" x2="303.9269" y2="362.9589" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="311.7199" y1="412.0548" x2="389.6499" y2="459.3973" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="654.6119" y="96.4384" width="545.5099" height="298.0822" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.3516 4.6758" />
  <text x="927.3668" y="140.274" text-anchor="middle" font-family="Arial" font-size="20.2618" font-weight="bold" fill="var(--ok-accent)">Component 2</text>
  <circle cx="779.2998" cy="263.0137" r="46.758" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.1172" />

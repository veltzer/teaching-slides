  <text x="640" y="40" text-anchor="middle" font-size="28.4356" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Connected Components Algorithm</text>
  <rect x="40" y="83.2837" width="518.9189" height="484.7761" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.3516 4.6758" filter="url(#shadow)"/>
  <text x="299.4594" y="126.5672" text-anchor="middle" font-size="20.5368" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Component 1</text>
  <rect x="106.121" y="183.055" width="94.7854" height="94.7854" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.1172" filter="url(#shadow)"/>
  <text x="153.5135" y="223.5225" text-anchor="middle" font-size="18.9571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <text x="153.5135" y="251.2239" text-anchor="middle" font-size="15.7976" fill="var(--text-muted)" font-family="Arial, sans-serif">id=1</text>
  <rect x="349.364" y="148.428" width="94.7854" height="94.7854" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.1172" filter="url(#shadow)"/>
  <text x="396.7567" y="188.8956" text-anchor="middle" font-size="18.9571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B</text>
  <text x="396.7567" y="216.5971" text-anchor="middle" font-size="15.7976" fill="var(--text-muted)" font-family="Arial, sans-serif">id=2</text>
  <rect x="219.634" y="338.876" width="94.7854" height="94.7854" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.1172" filter="url(#shadow)"/>
  <text x="267.027" y="379.3433" text-anchor="middle" font-size="18.9571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">C</text>
  <text x="267.027" y="407.0448" text-anchor="middle" font-size="15.7976" fill="var(--text-muted)" font-family="Arial, sans-serif">id=3</text>
  <rect x="398.013" y="408.13" width="94.7854" height="94.7854" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3.1172" filter="url(#shadow)"/>
  <text x="445.4054" y="448.5971" text-anchor="middle" font-size="18.9571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">D</text>
  <text x="445.4054" y="476.2986" text-anchor="middle" font-size="15.7976" fill="var(--text-muted)" font-family="Arial, sans-serif">id=4</text>
  <line x1="202.1622" y1="221.791" x2="348.1081" y2="204.4777" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="177.8379" y1="277.194" x2="226.4865" y2="342.9851" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="377.2973" y1="242.5672" x2="307.5675" y2="346.4478" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="315.6756" y1="394.9254" x2="396.7567" y2="441.6717" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="672.4324" y="83.2837" width="567.5676" height="294.3283" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="9.3516 4.6758" filter="url(#shadow)"/>
  <text x="956.2162" y="126.5672" text-anchor="middle" font-size="20.5368" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Component 2</text>
  <rect x="754.769" y="200.369" width="94.7854" height="94.7854" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.1172" filter="url(#shadow)"/>
  <text x="802.1621" y="240.8358" text-anchor="middle" font-size="18.9571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">E</text>
  <text x="802.1621" y="268.5373" text-anchor="middle" font-size="15.7976" fill="var(--text-muted)" font-family="Arial, sans-serif">id=5</text>
  <rect x="981.797" y="148.428" width="94.7854" height="94.7854" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.1172" filter="url(#shadow)"/>
  <text x="1029.1892" y="188.8956" text-anchor="middle" font-size="18.9571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">F</text>
  <text x="1029.1892" y="216.5971" text-anchor="middle" font-size="15.7976" fill="var(--text-muted)" font-family="Arial, sans-serif">id=6</text>
  <rect x="1046.66" y="269.622" width="94.7854" height="94.7854" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="3.1172" filter="url(#shadow)"/>
  <text x="1094.054" y="310.0896" text-anchor="middle" font-size="18.9571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">G</text>
  <text x="1094.054" y="337.7911" text-anchor="middle" font-size="15.7976" fill="var(--text-muted)" font-family="Arial, sans-serif">id=7</text>
  <line x1="850.8107" y1="239.1045" x2="980.5405" y2="204.4777" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="1045.4054" y1="244.2985" x2="1077.8378" y2="270.2687" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="721.0811" y="446.8656" width="243.2433" height="173.1344" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="9.3516 4.6758" filter="url(#shadow)"/>
  <text x="842.7026" y="490.1493" text-anchor="middle" font-size="20.5368" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Component 3</text>
  <rect x="803.209" y="528.566" width="78.9878" height="78.9878" rx="14" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="3.1172" filter="url(#shadow)"/>
  <text x="842.7026" y="561.1344" text-anchor="middle" font-size="18.9571" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">H</text>
  <text x="842.7026" y="588.8359" text-anchor="middle" font-size="15.7976" fill="var(--text-muted)" font-family="Arial, sans-serif">id=8</text>
  <text x="1126.4865" y="524.7761" text-anchor="middle" font-size="17.3773" fill="var(--text-muted)" font-family="Arial, sans-serif">Each component</text>
  <text x="1126.4865" y="552.4776" text-anchor="middle" font-size="17.3773" fill="var(--text-muted)" font-family="Arial, sans-serif">gets the lowest</text>
  <text x="1126.4865" y="580.1791" text-anchor="middle" font-size="17.3773" fill="var(--text-muted)" font-family="Arial, sans-serif">vertex ID as label</text>
</svg>

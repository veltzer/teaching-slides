  <text x="997.5038" y="231.4521" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">id=6</text>
  <circle cx="1059.8478" cy="333.1507" r="46.758" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="3.1172" />
  <text x="1059.8478" y="326.137" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--text)">G</text>

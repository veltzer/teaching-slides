  <text x="155.86" y="266.5205" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">id=1</text>
  <circle cx="389.6499" cy="210.411" r="46.758" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3.1172" />

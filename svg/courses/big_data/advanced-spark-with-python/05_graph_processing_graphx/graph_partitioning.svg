<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-family="Arial" font-size="26.9474" font-weight="bold" fill="var(--primary-accent)">Graph Partitioning Strategies</text>
  <text x="194.6199" y="101.0526" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--text)">Original Graph</text>
  <circle cx="119.7661" cy="185.2632" r="26.9474" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="119.7661" y="193.6842" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text)">1</text>
  <circle cx="269.4737" cy="151.5789" r="26.9474" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="269.4737" y="160" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text)">2</text>
  <circle cx="194.6199" cy="286.3158" r="26.9474" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="194.6199" y="294.7368" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text)">3</text>
  <circle cx="299.4152" cy="269.4737" r="26.9474" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="299.4152" y="277.8947" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text)">4</text>
  <line x1="145.2164" y1="178.5263" x2="242.5263" y2="158.3158" stroke="var(--text)" stroke-width="2" />
  <line x1="131.7427" y1="213.8947" x2="172.1637" y2="262.7368" stroke="var(--text)" stroke-width="2" />
  <line x1="221.5673" y1="282.9474" x2="272.4678" y2="272.8421" stroke="var(--text)" stroke-width="2" />
  <line x1="276.9591" y1="180.2105" x2="291.9298" y2="240.8421" stroke="var(--text)" stroke-width="2" />
  <rect x="44.9123" y="370.5263" width="329.3567" height="269.4737" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="209.5906" y="412.6316" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">EdgePartition1D</text>
  <text x="209.5906" y="446.3158" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Partition by source vertex</text>
  <rect x="67.3684" y="468.2105" width="134.7368" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="134.7368" y="493.4737" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text)">Partition 0</text>
  <text x="134.7368" y="518.7368" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">src=1,2</text>
  <rect x="217.076" y="468.2105" width="134.7368" height="67.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="284.4444" y="493.4737" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text)">Partition 1</text>
  <text x="284.4444" y="518.7368" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">src=3,4</text>
  <text x="209.5906" y="586.1053" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">Good for high out-degree</text>
  <text x="209.5906" y="611.3684" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">graphs</text>
  <rect x="434.152" y="370.5263" width="329.3567" height="269.4737" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="598.8304" y="412.6316" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--warn-accent)">EdgePartition2D</text>
  <text x="598.8304" y="446.3158" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">2D grid on (src, dst)</text>
  <rect x="479.0643" y="468.2105" width="59.883" height="50.5263" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="509.0058" y="500.2105" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text)">P0</text>
  <rect x="546.4327" y="468.2105" width="59.883" height="50.5263" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="576.3743" y="500.2105" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text)">P1</text>
  <rect x="479.0643" y="527.1579" width="59.883" height="50.5263" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="509.0058" y="559.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text)">P2</text>
  <rect x="546.4327" y="527.1579" width="59.883" height="50.5263" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="576.3743" y="559.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text)">P3</text>
  <text x="696.1404" y="505.2632" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">Balanced edge</text>
  <text x="696.1404" y="530.5263" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">distribution</text>
  <text x="696.1404" y="564.2105" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">across workers</text>
  <rect x="823.3918" y="370.5263" width="329.3567" height="269.4737" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="988.0702" y="412.6316" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--info-accent)">Random</text>
  <text x="988.0702" y="446.3158" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Hash vertex IDs</text>
  <rect x="853.3333" y="471.5789" width="89.8246" height="58.9474" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="898.2456" y="508.6316" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text)">P0</text>
  <rect x="958.1287" y="471.5789" width="89.8246" height="58.9474" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1003.0409" y="508.6316" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text)">P1</text>
  <rect x="1062.924" y="471.5789" width="74.8538" height="58.9474" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1100.3509" y="508.6316" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text)">P2</text>
  <text x="988.0702" y="572.6316" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">General purpose</text>
  <text x="988.0702" y="597.8947" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">simple but may cause</text>
  <text x="988.0702" y="623.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">communication overhead</text>
</svg>
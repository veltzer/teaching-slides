  <text x="121.0811" y="139.687440185545" text-anchor="middle" font-size="17.779862463367" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <rect x="255.424" y="63.947328770133" width="55.6392" height="60.855376639423" rx="14.641550661565" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="283.2433" y="103.437501708984" text-anchor="middle" font-size="17.779862463367" fill="var(--text)" font-family="Arial, sans-serif">2</text>
  <rect x="174.343" y="208.94686392637" width="55.6392" height="60.855376639423" rx="14.641550661565" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="202.1622" y="248.437474365234" text-anchor="middle" font-size="17.779862463367" fill="var(--text)" font-family="Arial, sans-serif">3</text>
  <rect x="287.856" y="190.822332188102" width="55.6392" height="60.855376639423" rx="14.641550661565" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="315.6757" y="230.312505126953" text-anchor="middle" font-size="17.779862463367" fill="var(--text)" font-family="Arial, sans-serif">4</text>
  <line x1="148.6487" y1="123.375033496095" x2="254.054" y2="101.625048535158" stroke="var(--text)" stroke-width="2"/>
  <line x1="134.054" y1="161.437425146482" x2="177.8378" y2="213.9999890625" stroke="var(--text)" stroke-width="2"/>
  <line x1="231.3514" y1="235.75008339844" x2="286.4864" y2="224.87503623047" stroke="var(--text)" stroke-width="2"/>
  <line x1="291.3514" y1="125.187486669922" x2="307.5675" y2="190.437441552733" stroke="var(--text)" stroke-width="2"/>
  <rect x="40" y="329.999945312499" width="356.7567" height="290.000054687501" rx="6.274950283528" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3783" y="375.312477783203" text-anchor="middle" font-size="21.012716849441" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">EdgePartition1D</text>
  <text x="218.3783" y="411.562525634766" text-anchor="middle" font-size="17.779862463367" fill="var(--text-muted)" font-family="Arial, sans-serif">Partition by source vertex</text>
  <rect x="64.3243" y="435.12496376953" width="145.9459" height="72.499986328125" rx="6.274950283528" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2972" y="462.312527001954" text-anchor="middle" font-size="16.16364443534" fill="var(--text)" font-family="Arial, sans-serif">Partition 0</text>
  <text x="137.2972" y="489.499980859375" text-anchor="middle" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">src=1,2</text>
  <rect x="226.4864" y="435.12496376953" width="145.9459" height="72.499986328125" rx="6.274950283528" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="299.4594" y="462.312527001954" text-anchor="middle" font-size="16.16364443534" fill="var(--text)" font-family="Arial, sans-serif">Partition 1</text>
  <text x="299.4594" y="489.499980859375" text-anchor="middle" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">src=3,4</text>
  <text x="218.3783" y="562.000076562502" text-anchor="middle" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">Good for high out-degree</text>
  <text x="218.3783" y="589.187530419923" text-anchor="middle" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">graphs</text>
  <rect x="461.6216" y="329.999945312499" width="356.7567" height="290.000054687501" rx="6.274950283528" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="375.312477783203" text-anchor="middle" font-size="21.012716849441" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">EdgePartition2D</text>
  <text x="640" y="411.562525634766" text-anchor="middle" font-size="17.779862463367" fill="var(--text-muted)" font-family="Arial, sans-serif">2D grid on (src, dst)</text>

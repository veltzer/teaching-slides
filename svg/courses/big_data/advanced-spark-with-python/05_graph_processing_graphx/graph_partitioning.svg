  <text x="542.7027" y="533.000060156252" text-anchor="middle" font-size="16.16364443534" fill="var(--text)" font-family="Arial, sans-serif">P2</text>
  <rect x="583.2432" y="498.562465478515" width="64.8648" height="54.375017089844" rx="6.274950283528" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.6757" y="533.000060156252" text-anchor="middle" font-size="16.16364443534" fill="var(--text)" font-family="Arial, sans-serif">P3</text>
  <text x="745.4055" y="475.000027343751" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">Balanced edge</text>
  <text x="745.4055" y="502.187481201171" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">distribution</text>
  <text x="745.4055" y="538.437419677732" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">across workers</text>
  <rect x="883.2433" y="329.999945312499" width="356.7567" height="290.000054687501" rx="6.274950283528" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6217" y="375.312477783203" text-anchor="middle" font-size="21.012716849441" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Random</text>
  <text x="1061.6217" y="411.562525634766" text-anchor="middle" font-size="17.779862463367" fill="var(--text-muted)" font-family="Arial, sans-serif">Hash vertex IDs</text>
  <rect x="915.6757" y="438.749979492187" width="97.2973" height="63.437501708984" rx="6.274950283528" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964.3243" y="478.625043066407" text-anchor="middle" font-size="16.16364443534" fill="var(--text)" font-family="Arial, sans-serif">P0</text>
  <rect x="1029.1893" y="438.749979492187" width="97.2973" height="63.437501708984" rx="6.274950283528" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="478.625043066407" text-anchor="middle" font-size="16.16364443534" fill="var(--text)" font-family="Arial, sans-serif">P1</text>
  <rect x="1142.7028" y="438.749979492187" width="81.0811" height="63.437501708984" rx="6.274950283528" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1183.2433" y="478.625043066407" text-anchor="middle" font-size="16.16364443534" fill="var(--text)" font-family="Arial, sans-serif">P2</text>
  <text x="1061.6217" y="547.500013671875" text-anchor="middle" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">General purpose</text>
  <text x="1061.6217" y="574.687467529296" text-anchor="middle" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">simple but may cause</text>
  <text x="1061.6217" y="601.87503076172" text-anchor="middle" font-size="16.16364443534" fill="var(--text-muted)" font-family="Arial, sans-serif">communication overhead</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.8196" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Graph Partitioning Strategies</text>
  <text x="202.1622" y="89.7143" text-anchor="middle" font-size="20.092" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Original Graph</text>
  <rect x="93.2615" y="144.752" width="55.6392" height="55.6392" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="121.0811" y="180.8571" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <rect x="255.424" y="111.609" width="55.6392" height="55.6392" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="283.2433" y="147.7143" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">2</text>
  <rect x="174.343" y="244.18" width="55.6392" height="55.6392" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="202.1622" y="280.2857" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">3</text>
  <rect x="287.856" y="227.609" width="55.6392" height="55.6392" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="315.6757" y="263.7143" text-anchor="middle" font-size="17.0008" fill="var(--text)" font-family="Arial, sans-serif">4</text>
  <line x1="148.6487" y1="165.9429" x2="254.054" y2="146.0572" stroke="var(--text)" stroke-width="2"/>
  <line x1="134.054" y1="200.7428" x2="177.8378" y2="248.8" stroke="var(--text)" stroke-width="2"/>
  <line x1="231.3514" y1="268.6858" x2="286.4864" y2="258.7429" stroke="var(--text)" stroke-width="2"/>
  <line x1="291.3514" y1="167.6" x2="307.5675" y2="227.2571" stroke="var(--text)" stroke-width="2"/>
  <rect x="40" y="354.8571" width="356.7567" height="265.1429" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3783" y="396.2857" text-anchor="middle" font-size="20.092" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">EdgePartition1D</text>
  <text x="218.3783" y="429.4286" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Partition by source vertex</text>
  <rect x="64.3243" y="450.9714" width="145.9459" height="66.2857" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="137.2972" y="475.8286" text-anchor="middle" font-size="15.4554" fill="var(--text)" font-family="Arial, sans-serif">Partition 0</text>
  <text x="137.2972" y="500.6857" text-anchor="middle" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">src=1,2</text>
  <rect x="226.4864" y="450.9714" width="145.9459" height="66.2857" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="299.4594" y="475.8286" text-anchor="middle" font-size="15.4554" fill="var(--text)" font-family="Arial, sans-serif">Partition 1</text>
  <text x="299.4594" y="500.6857" text-anchor="middle" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">src=3,4</text>
  <text x="218.3783" y="566.9715" text-anchor="middle" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">Good for high out-degree</text>
  <text x="218.3783" y="591.8286" text-anchor="middle" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">graphs</text>
  <rect x="461.6216" y="354.8571" width="356.7567" height="265.1429" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="396.2857" text-anchor="middle" font-size="20.092" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">EdgePartition2D</text>
  <text x="640" y="429.4286" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">2D grid on (src, dst)</text>
  <rect x="510.2702" y="450.9714" width="64.8648" height="49.7143" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="542.7027" y="482.4571" text-anchor="middle" font-size="15.4554" fill="var(--text)" font-family="Arial, sans-serif">P0</text>
  <rect x="583.2432" y="450.9714" width="64.8648" height="49.7143" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.6757" y="482.4571" text-anchor="middle" font-size="15.4554" fill="var(--text)" font-family="Arial, sans-serif">P1</text>
  <rect x="510.2702" y="508.9714" width="64.8648" height="49.7143" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="542.7027" y="540.4572" text-anchor="middle" font-size="15.4554" fill="var(--text)" font-family="Arial, sans-serif">P2</text>
  <rect x="583.2432" y="508.9714" width="64.8648" height="49.7143" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.6757" y="540.4572" text-anchor="middle" font-size="15.4554" fill="var(--text)" font-family="Arial, sans-serif">P3</text>
  <text x="745.4055" y="487.4286" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">Balanced edge</text>
  <text x="745.4055" y="512.2857" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">distribution</text>
  <text x="745.4055" y="545.4285" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">across workers</text>
  <rect x="883.2433" y="354.8571" width="356.7567" height="265.1429" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6217" y="396.2857" text-anchor="middle" font-size="20.092" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Random</text>
  <text x="1061.6217" y="429.4286" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Hash vertex IDs</text>
  <rect x="915.6757" y="454.2857" width="97.2973" height="58" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="964.3243" y="490.7429" text-anchor="middle" font-size="15.4554" fill="var(--text)" font-family="Arial, sans-serif">P0</text>
  <rect x="1029.1893" y="454.2857" width="97.2973" height="58" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1077.8378" y="490.7429" text-anchor="middle" font-size="15.4554" fill="var(--text)" font-family="Arial, sans-serif">P1</text>
  <rect x="1142.7028" y="454.2857" width="81.0811" height="58" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1183.2433" y="490.7429" text-anchor="middle" font-size="15.4554" fill="var(--text)" font-family="Arial, sans-serif">P2</text>
  <text x="1061.6217" y="553.7143" text-anchor="middle" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">General purpose</text>
  <text x="1061.6217" y="578.5714" text-anchor="middle" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">simple but may cause</text>
  <text x="1061.6217" y="603.4286" text-anchor="middle" font-size="15.4554" fill="var(--text-muted)" font-family="Arial, sans-serif">communication overhead</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-family="Arial" font-size="26.9474" font-weight="bold" fill="var(--primary-accent)">Graph Metrics Overview</text>
  <rect x="449.1228" y="84.2105" width="299.4152" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="598.8304" y="134.7368" text-anchor="middle" font-family="Arial" font-size="20.9591" font-weight="bold" fill="var(--primary-accent)">Graph Metrics</text>
  <line x1="509.0058" y1="168.4211" x2="209.5906" y2="252.6316" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="44.9123" y="244.2105" width="329.3567" height="168.4211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="209.5906" y="286.3158" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">Degree Distribution</text>
  <text x="209.5906" y="320" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">In-degree / Out-degree</text>
  <text x="209.5906" y="350.3158" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Average degree</text>
  <text x="209.5906" y="380.6316" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Degree histogram</text>
  <line x1="688.655" y1="168.4211" x2="988.0702" y2="252.6316" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="823.3918" y="244.2105" width="329.3567" height="168.4211" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="988.0702" y="286.3158" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--warn-accent)">Centrality Measures</text>
  <text x="988.0702" y="320" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">PageRank</text>
  <text x="988.0702" y="350.3158" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Betweenness centrality</text>
  <text x="988.0702" y="380.6316" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Closeness centrality</text>
  <line x1="509.0058" y1="168.4211" x2="209.5906" y2="488.4211" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="44.9123" y="471.5789" width="329.3567" height="168.4211" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="209.5906" y="513.6842" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--info-accent)">Clustering</text>
  <text x="209.5906" y="547.3684" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Clustering coefficient</text>
  <text x="209.5906" y="577.6842" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Triangle count</text>
  <text x="209.5906" y="608" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Connected components</text>
  <line x1="688.655" y1="168.4211" x2="988.0702" y2="488.4211" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="823.3918" y="471.5789" width="329.3567" height="168.4211" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="988.0702" y="513.6842" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">Path Analysis</text>
  <text x="988.0702" y="547.3684" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Shortest paths</text>
  <text x="988.0702" y="577.6842" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Diameter</text>
  <text x="988.0702" y="608" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Average path length</text>
</svg>
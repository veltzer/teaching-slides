<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.8196" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Graph Metrics Overview</text>
  <rect x="477.8378" y="73.1428" width="324.3243" height="82.8571" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="122.8571" text-anchor="middle" font-size="21.6375" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Graph Metrics</text>
  <line x1="542.7027" y1="156.0001" x2="218.3783" y2="238.8572" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="230.5714" width="356.7567" height="165.7143" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3783" y="272" text-anchor="middle" font-size="20.092" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Degree Distribution</text>
  <text x="218.3783" y="305.1429" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">In-degree / Out-degree</text>
  <text x="218.3783" y="334.9714" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Average degree</text>
  <text x="218.3783" y="364.8" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Degree histogram</text>
  <line x1="737.2973" y1="156.0001" x2="1061.6217" y2="238.8572" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="883.2433" y="230.5714" width="356.7567" height="165.7143" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6217" y="272" text-anchor="middle" font-size="20.092" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Centrality Measures</text>
  <text x="1061.6217" y="305.1429" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">PageRank</text>
  <text x="1061.6217" y="334.9714" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Betweenness centrality</text>
  <text x="1061.6217" y="364.8" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Closeness centrality</text>
  <line x1="542.7027" y1="156.0001" x2="218.3783" y2="470.8572" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="454.2857" width="356.7567" height="165.7143" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3783" y="495.7143" text-anchor="middle" font-size="20.092" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Clustering</text>
  <text x="218.3783" y="528.8571" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Clustering coefficient</text>
  <text x="218.3783" y="558.6857" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Triangle count</text>
  <text x="218.3783" y="588.5143" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Connected components</text>
  <line x1="737.2973" y1="156.0001" x2="1061.6217" y2="470.8572" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="883.2433" y="454.2857" width="356.7567" height="165.7143" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6217" y="495.7143" text-anchor="middle" font-size="20.092" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Path Analysis</text>
  <text x="1061.6217" y="528.8571" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Shortest paths</text>
  <text x="1061.6217" y="558.6857" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Diameter</text>
  <text x="1061.6217" y="588.5143" text-anchor="middle" font-size="17.0008" fill="var(--text-muted)" font-family="Arial, sans-serif">Average path length</text>
</svg>
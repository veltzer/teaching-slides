  <text x="758.5185" y="98.4615" font-family="Arial, sans-serif" font-size="19.6923" fill="var(--text-faint)">reports_to</text>
  <rect x="194.4919" y="139.4872" width="213.9412" height="65.641" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="301.4625" y="180.5128" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" font-weight="bold" fill="var(--text)">Charlie (3)</text>

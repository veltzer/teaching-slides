  <text x="826.5907" y="180.5128" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" font-weight="bold" fill="var(--text)">Grace (7)</text>
  <line x1="233.3903" y1="205.1282" x2="155.5936" y2="278.9744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <line x1="301.4625" y1="205.1282" x2="388.9839" y2="278.9744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <line x1="359.8101" y1="205.1282" x2="602.9249" y2="278.9744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <line x1="826.5907" y1="205.1282" x2="855.7645" y2="278.9744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <rect x="58.3476" y="287.1795" width="194.4919" height="65.641" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="155.5936" y="328.2051" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" font-weight="bold" fill="var(--text)">Alice (1)</text>
  <rect x="291.7379" y="287.1795" width="194.4919" height="65.641" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="388.9839" y="328.2051" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" font-weight="bold" fill="var(--text)">Eve (5)</text>
  <rect x="515.4036" y="287.1795" width="194.4919" height="65.641" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="612.6496" y="328.2051" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" font-weight="bold" fill="var(--text)">Ivy (9)</text>
  <rect x="758.5185" y="287.1795" width="194.4919" height="65.641" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="855.7645" y="328.2051" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" font-weight="bold" fill="var(--text)">Diana (4)</text>
  <line x1="155.5936" y1="352.8205" x2="155.5936" y2="426.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <line x1="855.7645" y1="352.8205" x2="855.7645" y2="426.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <rect x="58.3476" y="434.8718" width="194.4919" height="65.641" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="155.5936" y="475.8974" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" font-weight="bold" fill="var(--text)">Bob (2)</text>

  <text x="1070.4348" y="198.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Grace (7)</text>
  <line x1="274.7826" y1="220.7792" x2="170.4348" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <line x1="366.087" y1="220.7792" x2="483.4783" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <line x1="444.3479" y1="220.7792" x2="770.4347" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <line x1="1070.4348" y1="220.7792" x2="1109.5653" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <rect x="40" y="296.1039" width="260.8695" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4348" y="333.7662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Alice (1)</text>
  <rect x="353.0435" y="296.1039" width="260.8695" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.4783" y="333.7662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Eve (5)</text>
  <rect x="653.0435" y="296.1039" width="260.8695" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="783.4783" y="333.7662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Ivy (9)</text>
  <rect x="979.1305" y="296.1039" width="260.8695" height="60.2597" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5653" y="333.7662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Diana (4)</text>
  <line x1="170.4348" y1="356.3636" x2="170.4348" y2="424.1559" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <line x1="1109.5653" y1="356.3636" x2="1109.5653" y2="424.1559" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sn)" />
  <rect x="40" y="431.6883" width="260.8695" height="60.2597" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>

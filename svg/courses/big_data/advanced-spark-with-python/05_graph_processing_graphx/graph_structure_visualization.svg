<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="587.8261" y="40" width="260.8695" height="60.2597" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="718.2609" y="77.6624" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Hank (8)</text>
  <line x1="640" y1="100.2598" x2="379.1305" y2="152.9871" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="457.3912" y="122.8571" font-family="Arial, sans-serif" font-size="21.8516" fill="var(--text-faint)">manages</text>
  <line x1="796.5218" y1="100.2598" x2="1057.3914" y2="152.9871" stroke="var(--text)" stroke-width="2"/>
  <text x="979.1305" y="122.8571" font-family="Arial, sans-serif" font-size="21.8516" fill="var(--text-faint)">reports_to</text>
  <rect x="222.6086" y="160.5195" width="286.9567" height="60.2597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="366.087" y="198.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Charlie (3)</text>
  <rect x="926.9565" y="160.5195" width="286.9567" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.4348" y="198.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Grace (7)</text>
  <line x1="274.7826" y1="220.7792" x2="170.4348" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="366.087" y1="220.7792" x2="483.4783" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="444.3479" y1="220.7792" x2="770.4347" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1070.4348" y1="220.7792" x2="1109.5653" y2="288.5715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="296.1039" width="260.8695" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4348" y="333.7662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Alice (1)</text>
  <rect x="353.0435" y="296.1039" width="260.8695" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.4783" y="333.7662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Eve (5)</text>
  <rect x="653.0435" y="296.1039" width="260.8695" height="60.2597" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="783.4783" y="333.7662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Ivy (9)</text>
  <rect x="979.1305" y="296.1039" width="260.8695" height="60.2597" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5653" y="333.7662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Diana (4)</text>
  <line x1="170.4348" y1="356.3636" x2="170.4348" y2="424.1559" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1109.5653" y1="356.3636" x2="1109.5653" y2="424.1559" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="431.6883" width="260.8695" height="60.2597" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4348" y="469.3506" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Bob (2)</text>
  <rect x="979.1305" y="431.6883" width="260.8695" height="60.2597" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5653" y="469.3506" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Frank (6)</text>
  <line x1="300.8695" y1="461.8182" x2="979.1305" y2="461.8182" stroke="var(--text)" stroke-width="2" stroke-dasharray="8.2051 4.9231"/>
  <line x1="1109.5653" y1="491.948" x2="1109.5653" y2="552.2078" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="979.1305" y="559.7403" width="260.8695" height="60.2597" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5653" y="597.4026" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Jack (10)</text>
</svg>

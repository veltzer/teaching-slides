  <rect x="979.1305" y="559.7403" width="260.8695" height="60.2597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5653" y="597.4026" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8516" font-weight="bold" fill="var(--text)">Jack (10)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="585.124033" height="267.692222670122" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.68863090874" filter="url(#shadow)"/>
  <text x="59.834588" y="84.615396005917" font-size="25.316868707328" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Social Networks</text>
  <text x="75.702362" y="129.230793069525" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Community detection</text>
  <text x="75.702362" y="173.846032536988" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Influence analysis</text>
  <text x="75.702362" y="218.461428542905" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Friend recommendations</text>
  <text x="75.702362" y="263.076825606514" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── Spam/bot detection</text>
  <rect x="654.875967" y="40" width="585.124033" height="267.692222670122" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.68863090874" filter="url(#shadow)"/>
  <text x="674.710659" y="84.615396005917" font-size="25.316868707328" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Financial Services</text>
  <text x="690.578433" y="129.230793069525" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Fraud ring detection</text>
  <text x="690.578433" y="173.846032536988" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Money laundering patterns</text>
  <text x="690.578433" y="218.461428542905" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Credit risk networks</text>
  <text x="690.578433" y="263.076825606514" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── Transaction monitoring</text>
  <rect x="40" y="352.307777329878" width="585.124033" height="267.692222670122" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.68863090874" filter="url(#shadow)"/>
  <text x="59.834588" y="396.923015739648" font-size="25.316868707328" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Supply Chain</text>
  <text x="75.702362" y="441.538412803257" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Critical path analysis</text>
  <text x="75.702362" y="486.153809866866" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Supplier risk assessment</text>
  <text x="75.702362" y="530.769048276636" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Logistics optimization</text>
  <text x="75.702362" y="575.384445340245" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── Dependency mapping</text>
  <rect x="654.875967" y="352.307777329878" width="585.124033" height="267.692222670122" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.68863090874" filter="url(#shadow)"/>
  <text x="674.710659" y="396.923015739648" font-size="25.316868707328" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Knowledge Graphs</text>
  <text x="690.578433" y="441.538412803257" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Entity resolution</text>
  <text x="690.578433" y="486.153809866866" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Semantic search</text>
  <text x="690.578433" y="530.769048276636" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Recommendation engines</text>
  <text x="690.578433" y="575.384445340245" font-size="23.36933855296" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── Drug discovery</text>
</svg>

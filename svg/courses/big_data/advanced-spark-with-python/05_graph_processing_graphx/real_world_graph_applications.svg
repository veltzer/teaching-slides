<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="644.958517" y="40" font-size="28.403946" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Graph Processing Use Cases</text>
  <rect x="40" y="71.636337" width="585.124033" height="253.090841" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.476001" filter="url(#shadow)"/>
  <text x="59.834588" y="113.818168" font-size="24.616728" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Social Networks</text>
  <text x="75.702362" y="156" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Community detection</text>
  <text x="75.702362" y="198.181683" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Influence analysis</text>
  <text x="75.702362" y="240.363514" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Friend recommendations</text>
  <text x="75.702362" y="282.545346" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── Spam/bot detection</text>
  <rect x="654.875967" y="71.636337" width="585.124033" height="253.090841" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.476001" filter="url(#shadow)"/>
  <text x="674.710659" y="113.818168" font-size="24.616728" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Financial Services</text>
  <text x="690.578433" y="156" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Fraud ring detection</text>
  <text x="690.578433" y="198.181683" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Money laundering patterns</text>
  <text x="690.578433" y="240.363514" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Credit risk networks</text>
  <text x="690.578433" y="282.545346" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── Transaction monitoring</text>
  <rect x="40" y="366.909159" width="585.124033" height="253.090841" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.476001" filter="url(#shadow)"/>
  <text x="59.834588" y="409.090841" font-size="24.616728" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Supply Chain</text>
  <text x="75.702362" y="451.272673" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Critical path analysis</text>
  <text x="75.702362" y="493.454505" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Supplier risk assessment</text>
  <text x="75.702362" y="535.636187" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Logistics optimization</text>
  <text x="75.702362" y="577.818019" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── Dependency mapping</text>
  <rect x="654.875967" y="366.909159" width="585.124033" height="253.090841" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.476001" filter="url(#shadow)"/>
  <text x="674.710659" y="409.090841" font-size="24.616728" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Knowledge Graphs</text>
  <text x="690.578433" y="451.272673" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Entity resolution</text>
  <text x="690.578433" y="493.454505" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Semantic search</text>
  <text x="690.578433" y="535.636187" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">├── Recommendation engines</text>
  <text x="690.578433" y="577.818019" font-size="22.723057" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">└── Drug discovery</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="644.958517" y="40" font-size="28.403946" font-weight="bold" fill="var(--text)" text-anchor="middle">Graph Processing Use Cases</text>
  <rect x="40" y="71.636337" width="585.124033" height="253.090841" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.476001" filter="url(#shadow)"/>
  <text x="59.834588" y="113.818168" font-size="24.616728" font-weight="bold" fill="var(--text)" text-anchor="start">Social Networks</text>
  <text x="75.702362" y="156" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Community detection</text>
  <text x="75.702362" y="198.181683" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Influence analysis</text>
  <text x="75.702362" y="240.363514" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Friend recommendations</text>
  <text x="75.702362" y="282.545346" font-size="22.723057" fill="var(--text)" text-anchor="start">└── Spam/bot detection</text>
  <rect x="654.875967" y="71.636337" width="585.124033" height="253.090841" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.476001" filter="url(#shadow)"/>
  <text x="674.710659" y="113.818168" font-size="24.616728" font-weight="bold" fill="var(--text)" text-anchor="start">Financial Services</text>
  <text x="690.578433" y="156" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Fraud ring detection</text>
  <text x="690.578433" y="198.181683" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Money laundering patterns</text>
  <text x="690.578433" y="240.363514" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Credit risk networks</text>
  <text x="690.578433" y="282.545346" font-size="22.723057" fill="var(--text)" text-anchor="start">└── Transaction monitoring</text>
  <rect x="40" y="366.909159" width="585.124033" height="253.090841" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.476001" filter="url(#shadow)"/>
  <text x="59.834588" y="409.090841" font-size="24.616728" font-weight="bold" fill="var(--text)" text-anchor="start">Supply Chain</text>
  <text x="75.702362" y="451.272673" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Critical path analysis</text>
  <text x="75.702362" y="493.454505" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Supplier risk assessment</text>
  <text x="75.702362" y="535.636187" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Logistics optimization</text>
  <text x="75.702362" y="577.818019" font-size="22.723057" fill="var(--text)" text-anchor="start">└── Dependency mapping</text>
  <rect x="654.875967" y="366.909159" width="585.124033" height="253.090841" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.476001" filter="url(#shadow)"/>
  <text x="674.710659" y="409.090841" font-size="24.616728" font-weight="bold" fill="var(--text)" text-anchor="start">Knowledge Graphs</text>
  <text x="690.578433" y="451.272673" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Entity resolution</text>
  <text x="690.578433" y="493.454505" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Semantic search</text>
  <text x="690.578433" y="535.636187" font-size="22.723057" fill="var(--text)" text-anchor="start">├── Recommendation engines</text>
  <text x="690.578433" y="577.818019" font-size="22.723057" fill="var(--text)" text-anchor="start">└── Drug discovery</text>
</svg>
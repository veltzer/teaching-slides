<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="8.996" y="7.7108" width="1133.4941" height="632.2892" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="575.743" y="46.2651" font-size="23.1325" font-weight="bold" fill="var(--text)" text-anchor="middle">Graph Processing Use Cases</text>
  <rect x="26.988" y="69.3976" width="530.7631" height="185.0603" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="44.9799" y="100.241" font-size="20.0482" font-weight="bold" fill="var(--text)" text-anchor="start">Social Networks</text>
  <text x="59.3735" y="131.0844" font-size="18.506" fill="var(--text)" text-anchor="start">├── Community detection</text>
  <text x="59.3735" y="161.9277" font-size="18.506" fill="var(--text)" text-anchor="start">├── Influence analysis</text>
  <text x="59.3735" y="192.7711" font-size="18.506" fill="var(--text)" text-anchor="start">├── Friend recommendations</text>
  <text x="59.3735" y="223.6145" font-size="18.506" fill="var(--text)" text-anchor="start">└── Spam/bot detection</text>
  <rect x="584.739" y="69.3976" width="530.7631" height="185.0603" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="602.731" y="100.241" font-size="20.0482" font-weight="bold" fill="var(--text)" text-anchor="start">Financial Services</text>
  <text x="617.1246" y="131.0844" font-size="18.506" fill="var(--text)" text-anchor="start">├── Fraud ring detection</text>
  <text x="617.1246" y="161.9277" font-size="18.506" fill="var(--text)" text-anchor="start">├── Money laundering patterns</text>
  <text x="617.1246" y="192.7711" font-size="18.506" fill="var(--text)" text-anchor="start">├── Credit risk networks</text>
  <text x="617.1246" y="223.6145" font-size="18.506" fill="var(--text)" text-anchor="start">└── Transaction monitoring</text>
  <rect x="26.988" y="285.3013" width="530.7631" height="185.0603" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="44.9799" y="316.1446" font-size="20.0482" font-weight="bold" fill="var(--text)" text-anchor="start">Supply Chain</text>
  <text x="59.3735" y="346.988" font-size="18.506" fill="var(--text)" text-anchor="start">├── Critical path analysis</text>
  <text x="59.3735" y="377.8314" font-size="18.506" fill="var(--text)" text-anchor="start">├── Supplier risk assessment</text>
  <text x="59.3735" y="408.6747" font-size="18.506" fill="var(--text)" text-anchor="start">├── Logistics optimization</text>
  <text x="59.3735" y="439.5181" font-size="18.506" fill="var(--text)" text-anchor="start">└── Dependency mapping</text>
  <rect x="584.739" y="285.3013" width="530.7631" height="185.0603" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="602.731" y="316.1446" font-size="20.0482" font-weight="bold" fill="var(--text)" text-anchor="start">Knowledge Graphs</text>
  <text x="617.1246" y="346.988" font-size="18.506" fill="var(--text)" text-anchor="start">├── Entity resolution</text>
  <text x="617.1246" y="377.8314" font-size="18.506" fill="var(--text)" text-anchor="start">├── Semantic search</text>
  <text x="617.1246" y="408.6747" font-size="18.506" fill="var(--text)" text-anchor="start">├── Recommendation engines</text>
  <text x="617.1246" y="439.5181" font-size="18.506" fill="var(--text)" text-anchor="start">└── Drug discovery</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="376.4706" y="28.2353" text-anchor="middle" font-family="Arial" font-size="16.9412" font-weight="bold" fill="var(--primary-accent)">Pregel API - Iterative Message Passing</text>
  <rect x="47.0588" y="65.8824" width="188.2353" height="65.8824" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="141.1765" y="91.2941" text-anchor="middle" font-family="Arial" font-size="13.1765" font-weight="bold" fill="var(--primary-accent)">Vertex Program</text>
  <text x="141.1765" y="111.0588" text-anchor="middle" font-family="Arial" font-size="10.3529" fill="var(--text-muted)">vprog(id, attr, msg)</text>
  <line x1="235.2941" y1="98.8235" x2="291.7647" y2="98.8235" stroke="var(--text)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="301.1765" y="65.8824" width="188.2353" height="65.8824" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="395.2941" y="91.2941" text-anchor="middle" font-family="Arial" font-size="13.1765" font-weight="bold" fill="var(--ok-accent)">Send Messages</text>
  <text x="395.2941" y="111.0588" text-anchor="middle" font-family="Arial" font-size="10.3529" fill="var(--text-muted)">sendMsg(triplet)</text>
  <line x1="489.4118" y1="98.8235" x2="545.8824" y2="98.8235" stroke="var(--text)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="555.2941" y="65.8824" width="169.4118" height="65.8824" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="91.2941" text-anchor="middle" font-family="Arial" font-size="13.1765" font-weight="bold" fill="var(--warn-accent)">Merge Messages</text>
  <text x="640" y="111.0588" text-anchor="middle" font-family="Arial" font-size="10.3529" fill="var(--text-muted)">mergeMsg(m1, m2)</text>
  <path d="M 640 131.7647 L 640 160 L 141.1765 160 L 141.1765 131.7647" stroke="var(--info-border)" stroke-width="1.8824" fill="none" marker-end="url(#arrow)" />
  <text x="376.4706" y="178.8235" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--info-accent)">Repeat until convergence (no messages)</text>
  <text x="376.4706" y="216.4706" text-anchor="middle" font-family="Arial" font-size="13.1765" font-weight="bold" fill="var(--text)">Example: SSSP (Single Source Shortest Path)</text>
  <text x="122.3529" y="244.7059" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text-muted)">Superstep 0</text>
  <circle cx="75.2941" cy="291.7647" r="20.7059" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="75.2941" y="296.4706" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text)">0</text>
  <circle cx="150.5882" cy="272.9412" r="20.7059" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="1.8824" />
  <text x="150.5882" y="277.6471" text-anchor="middle" font-family="Arial" font-size="10.3529" fill="var(--text)">inf</text>
  <circle cx="150.5882" cy="329.4118" r="20.7059" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="1.8824" />
  <text x="150.5882" y="334.1176" text-anchor="middle" font-family="Arial" font-size="10.3529" fill="var(--text)">inf</text>
  <line x1="94.1176" y1="282.3529" x2="129.8824" y2="274.8235" stroke="var(--text)" stroke-width="1.4118" />
  <line x1="94.1176" y1="301.1765" x2="129.8824" y2="321.8824" stroke="var(--text)" stroke-width="1.4118" />
  <text x="112.9412" y="268.2353" font-family="Arial" font-size="10" fill="var(--warn-accent)">1</text>
  <text x="112.9412" y="327.5294" font-family="Arial" font-size="10" fill="var(--warn-accent)">3</text>
  <line x1="188.2353" y1="301.1765" x2="244.7059" y2="301.1765" stroke="var(--info-border)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <text x="348.2353" y="244.7059" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text-muted)">Superstep 1</text>
  <circle cx="301.1765" cy="291.7647" r="20.7059" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="301.1765" y="296.4706" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text)">0</text>
  <circle cx="376.4706" cy="272.9412" r="20.7059" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8824" />
  <text x="376.4706" y="277.6471" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text)">1</text>
  <circle cx="376.4706" cy="329.4118" r="20.7059" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8824" />
  <text x="376.4706" y="334.1176" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text)">3</text>
  <line x1="320" y1="282.3529" x2="355.7647" y2="274.8235" stroke="var(--text)" stroke-width="1.4118" />
  <line x1="320" y1="301.1765" x2="355.7647" y2="321.8824" stroke="var(--text)" stroke-width="1.4118" />
  <text x="338.8235" y="268.2353" font-family="Arial" font-size="10" fill="var(--warn-accent)">1</text>
  <text x="338.8235" y="327.5294" font-family="Arial" font-size="10" fill="var(--warn-accent)">3</text>
  <line x1="414.1176" y1="301.1765" x2="470.5882" y2="301.1765" stroke="var(--info-border)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <text x="583.5294" y="244.7059" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text-muted)">Converged</text>
  <circle cx="536.4706" cy="291.7647" r="20.7059" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="536.4706" y="296.4706" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text)">0</text>
  <circle cx="611.7647" cy="272.9412" r="20.7059" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8824" />
  <text x="611.7647" y="277.6471" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text)">1</text>
  <circle cx="611.7647" cy="329.4118" r="20.7059" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8824" />
  <text x="611.7647" y="334.1176" text-anchor="middle" font-family="Arial" font-size="11.2941" font-weight="bold" fill="var(--text)">3</text>
  <line x1="555.2941" y1="282.3529" x2="591.0588" y2="274.8235" stroke="var(--text)" stroke-width="1.4118" />
  <line x1="555.2941" y1="301.1765" x2="591.0588" y2="321.8824" stroke="var(--text)" stroke-width="1.4118" />
  <text x="574.1176" y="268.2353" font-family="Arial" font-size="10" fill="var(--warn-accent)">1</text>
  <text x="574.1176" y="327.5294" font-family="Arial" font-size="10" fill="var(--warn-accent)">3</text>
  <text x="677.6471" y="305.8824" font-family="Arial" font-size="26.3529" fill="var(--ok-accent)">✓</text>
  <text x="376.4706" y="404.7059" text-anchor="middle" font-family="Arial" font-size="10.3529" fill="var(--text-faint)">Values show shortest distance from source vertex (0)</text>
</svg>
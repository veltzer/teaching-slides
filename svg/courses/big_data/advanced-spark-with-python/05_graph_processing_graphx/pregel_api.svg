  <text x="623.3333" y="511.2501" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--text)">3</text>
  <line x1="523.3332" y1="431.4999" x2="586.6667" y2="419.8999" stroke="var(--text)" stroke-width="0.6052" />
  <line x1="523.3332" y1="460.5001" x2="586.6667" y2="492.4003" stroke="var(--text)" stroke-width="0.6052" />
  <text x="556.6666" y="409.7501" font-family="Arial" font-size="18.9948" fill="var(--warn-accent)">1</text>
  <text x="556.6666" y="501.1001" font-family="Arial" font-size="18.9948" fill="var(--warn-accent)">3</text>
  <line x1="689.9998" y1="460.5001" x2="789.9999" y2="460.5001" stroke="var(--info-border)" stroke-width="0.807" marker-end="url(#arrow)" />
  <text x="989.9999" y="373.5" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--text-muted)">Converged</text>
  <rect x="872.466" y="411.8" width="68.4008" height="68.4008" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="906.6666" y="453.2502" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--text)">0</text>
  <rect x="1005.8" y="382.8" width="68.4008" height="68.4008" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="1040" y="424.25" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--text)">1</text>
  <rect x="1005.8" y="469.8" width="68.4008" height="68.4008" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="1040" y="511.2501" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--text)">3</text>
  <line x1="939.9999" y1="431.4999" x2="1003.3334" y2="419.8999" stroke="var(--text)" stroke-width="0.6052" />
  <line x1="939.9999" y1="460.5001" x2="1003.3334" y2="492.4003" stroke="var(--text)" stroke-width="0.6052" />
  <text x="973.3331" y="409.7501" font-family="Arial" font-size="18.9948" fill="var(--warn-accent)">1</text>
  <text x="973.3331" y="501.1001" font-family="Arial" font-size="18.9948" fill="var(--warn-accent)">3</text>
  <text x="1156.6667" y="467.75" font-family="Arial" font-size="43.5276" fill="var(--ok-accent)">✓</text>
  <text x="623.3333" y="620" text-anchor="middle" font-family="Arial" font-size="18.9948" fill="var(--text-faint)">Values show shortest distance from source vertex (0)</text>
</svg>
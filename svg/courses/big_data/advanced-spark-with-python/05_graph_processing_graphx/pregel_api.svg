  <text x="623.3333" y="40" text-anchor="middle" font-family="Arial" font-size="27.9822" font-weight="bold" fill="var(--primary-accent)">Pregel API - Iterative Message Passing</text>
  <rect x="40" y="98.0002" width="333.3334" height="101.5002" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6668" y="137.1501" text-anchor="middle" font-family="Arial" font-size="21.7639" font-weight="bold" fill="var(--primary-accent)">Vertex Program</text>
  <text x="206.6668" y="167.6001" text-anchor="middle" font-family="Arial" font-size="18.9948" fill="var(--text-muted)">vprog(id, attr, msg)</text>
  <line x1="373.3332" y1="148.7501" x2="473.3333" y2="148.7501" stroke="var(--text)" stroke-width="0.807" marker-end="url(#arrow)" />
  <rect x="489.9999" y="98.0002" width="333.3334" height="101.5002" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6667" y="137.1501" text-anchor="middle" font-family="Arial" font-size="21.7639" font-weight="bold" fill="var(--ok-accent)">Send Messages</text>
  <text x="656.6667" y="167.6001" text-anchor="middle" font-family="Arial" font-size="18.9948" fill="var(--text-muted)">sendMsg(triplet)</text>
  <line x1="823.3333" y1="148.7501" x2="923.3334" y2="148.7501" stroke="var(--text)" stroke-width="0.807" marker-end="url(#arrow)" />
  <rect x="939.9999" y="98.0002" width="300.0001" height="101.5002" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="137.1501" text-anchor="middle" font-family="Arial" font-size="21.7639" font-weight="bold" fill="var(--warn-accent)">Merge Messages</text>
  <text x="1090" y="167.6001" text-anchor="middle" font-family="Arial" font-size="18.9948" fill="var(--text-muted)">mergeMsg(m1, m2)</text>
  <path d="M 1090 199.5001 L 1090 243 L 206.6668 243 L 206.6668 199.5001" stroke="var(--info-border)" stroke-width="0.807" fill="none" marker-end="url(#arrow)" />
  <text x="623.3333" y="271.9999" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--info-accent)">Repeat until convergence (no messages)</text>
  <text x="623.3333" y="330.0001" text-anchor="middle" font-family="Arial" font-size="21.7639" font-weight="bold" fill="var(--text)">Example: SSSP (Single Source Shortest Path)</text>

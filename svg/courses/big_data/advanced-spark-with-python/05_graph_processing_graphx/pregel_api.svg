  <text x="410.844" y="52.3785" text-anchor="middle" font-family="Arial" font-size="14.7315" font-weight="bold" fill="var(--primary-accent)">Pregel API - Iterative Message Passing</text>
  <rect x="124.399" y="85.1152" width="163.6829" height="57.2891" rx="5.2174" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.3095" />
  <text x="206.2405" y="107.2123" text-anchor="middle" font-family="Arial" font-size="11.4578" font-weight="bold" fill="var(--primary-accent)">Vertex Program</text>
  <text x="206.2405" y="124.399" text-anchor="middle" font-family="Arial" font-size="10" fill="var(--text-muted)">vprog(id, attr, msg)</text>

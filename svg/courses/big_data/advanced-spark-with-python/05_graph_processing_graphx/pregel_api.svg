  <text x="427.2123" y="107.2123" text-anchor="middle" font-family="Arial" font-size="11.4578" font-weight="bold" fill="var(--ok-accent)">Send Messages</text>
  <text x="427.2123" y="124.399" text-anchor="middle" font-family="Arial" font-size="10" fill="var(--text-muted)">sendMsg(triplet)</text>
  <line x1="509.0537" y1="113.7596" x2="558.1586" y2="113.7596" stroke="var(--text)" stroke-width="1.2325" marker-end="url(#arrow)" />
  <rect x="566.3427" y="85.1152" width="147.3146" height="57.2891" rx="5.2174" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.3095" />
  <text x="640" y="107.2123" text-anchor="middle" font-family="Arial" font-size="11.4578" font-weight="bold" fill="var(--warn-accent)">Merge Messages</text>
  <text x="640" y="124.399" text-anchor="middle" font-family="Arial" font-size="10" fill="var(--text-muted)">mergeMsg(m1, m2)</text>
  <path d="M 640 142.4041 L 640 166.9565 L 206.2405 166.9565 L 206.2405 142.4041" stroke="var(--info-border)" stroke-width="1.2325" fill="none" marker-end="url(#arrow)" />
  <text x="410.844" y="183.3247" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="var(--info-accent)">Repeat until convergence (no messages)</text>
  <text x="410.844" y="216.0614" text-anchor="middle" font-family="Arial" font-size="11.4578" font-weight="bold" fill="var(--text)">Example: SSSP (Single Source Shortest Path)</text>

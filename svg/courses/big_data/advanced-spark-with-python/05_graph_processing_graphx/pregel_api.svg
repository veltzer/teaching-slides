  <text x="89.9997" y="453.2502" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--text)">0</text>
  <rect x="189.133" y="382.8" width="68.4008" height="68.4008" rx="14" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="0.807"/>
  <text x="223.3334" y="424.25" text-anchor="middle" font-family="Arial" font-size="18.9948" fill="var(--text)">inf</text>
  <rect x="189.133" y="469.8" width="68.4008" height="68.4008" rx="14" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="0.807"/>
  <text x="223.3334" y="511.2501" text-anchor="middle" font-family="Arial" font-size="18.9948" fill="var(--text)">inf</text>
  <line x1="123.3333" y1="431.4999" x2="186.6665" y2="419.8999" stroke="var(--text)" stroke-width="0.6052" />
  <line x1="123.3333" y1="460.5001" x2="186.6665" y2="492.4003" stroke="var(--text)" stroke-width="0.6052" />

  <text x="156.6667" y="501.1001" font-family="Arial" font-size="18.9948" fill="var(--warn-accent)">3</text>
  <line x1="289.9999" y1="460.5001" x2="390" y2="460.5001" stroke="var(--info-border)" stroke-width="0.807" marker-end="url(#arrow)" />
  <text x="573.3334" y="373.5" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--text-muted)">Superstep 1</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="627.5" y="80" text-anchor="middle" font-family="Arial" font-size="22.5" font-weight="bold" fill="var(--primary-accent)">Pregel API - Iterative Message Passing</text>
  <rect x="190" y="130.0001" width="250" height="87.5001" rx="7.9687" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="315.0001" y="163.75" text-anchor="middle" font-family="Arial" font-size="17.5" font-weight="bold" fill="var(--primary-accent)">Vertex Program</text>
  <text x="315.0001" y="190" text-anchor="middle" font-family="Arial" font-size="13.7499" fill="var(--text-muted)">vprog(id, attr, msg)</text>
  <line x1="440" y1="173.75" x2="515" y2="173.75" stroke="var(--text)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="527.5" y="130.0001" width="250" height="87.5001" rx="7.9687" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="652.5" y="163.75" text-anchor="middle" font-family="Arial" font-size="17.5" font-weight="bold" fill="var(--ok-accent)">Send Messages</text>
  <text x="652.5" y="190" text-anchor="middle" font-family="Arial" font-size="13.7499" fill="var(--text-muted)">sendMsg(triplet)</text>
  <line x1="777.5" y1="173.75" x2="852.5001" y2="173.75" stroke="var(--text)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <rect x="865" y="130.0001" width="225" height="87.5001" rx="7.9687" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="977.5" y="163.75" text-anchor="middle" font-family="Arial" font-size="17.5" font-weight="bold" fill="var(--warn-accent)">Merge Messages</text>
  <text x="977.5" y="190" text-anchor="middle" font-family="Arial" font-size="13.7499" fill="var(--text-muted)">mergeMsg(m1, m2)</text>
  <path d="M 977.5 217.5 L 977.5 255 L 315.0001 255 L 315.0001 217.5" stroke="var(--info-border)" stroke-width="1.8824" fill="none" marker-end="url(#arrow)" />
  <text x="627.5" y="279.9999" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--info-accent)">Repeat until convergence (no messages)</text>
  <text x="627.5" y="330" text-anchor="middle" font-family="Arial" font-size="17.5" font-weight="bold" fill="var(--text)">Example: SSSP (Single Source Shortest Path)</text>
  <text x="290" y="367.5" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text-muted)">Superstep 0</text>
  <circle cx="227.5" cy="430" r="27.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="227.5" y="436.25" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text)">0</text>
  <circle cx="327.5" cy="405" r="27.5" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="1.8824" />
  <text x="327.5" y="411.25" text-anchor="middle" font-family="Arial" font-size="13.7499" fill="var(--text)">inf</text>
  <circle cx="327.5" cy="480" r="27.5" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="1.8824" />
  <text x="327.5" y="486.2499" text-anchor="middle" font-family="Arial" font-size="13.7499" fill="var(--text)">inf</text>
  <line x1="252.5" y1="417.4999" x2="300.0001" y2="407.4999" stroke="var(--text)" stroke-width="1.4118" />
  <line x1="252.5" y1="442.5" x2="300.0001" y2="470" stroke="var(--text)" stroke-width="1.4118" />
  <text x="277.5" y="398.75" font-family="Arial" font-size="13.2812" fill="var(--warn-accent)">1</text>
  <text x="277.5" y="477.5" font-family="Arial" font-size="13.2812" fill="var(--warn-accent)">3</text>
  <line x1="377.5" y1="442.5" x2="452.5" y2="442.5" stroke="var(--info-border)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <text x="590" y="367.5" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text-muted)">Superstep 1</text>
  <circle cx="527.5" cy="430" r="27.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="527.5" y="436.25" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text)">0</text>
  <circle cx="627.5" cy="405" r="27.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8824" />
  <text x="627.5" y="411.25" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text)">1</text>
  <circle cx="627.5" cy="480" r="27.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8824" />
  <text x="627.5" y="486.2499" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text)">3</text>
  <line x1="552.5" y1="417.4999" x2="600" y2="407.4999" stroke="var(--text)" stroke-width="1.4118" />
  <line x1="552.5" y1="442.5" x2="600" y2="470" stroke="var(--text)" stroke-width="1.4118" />
  <text x="577.5" y="398.75" font-family="Arial" font-size="13.2812" fill="var(--warn-accent)">1</text>
  <text x="577.5" y="477.5" font-family="Arial" font-size="13.2812" fill="var(--warn-accent)">3</text>
  <line x1="677.4999" y1="442.5" x2="752.5" y2="442.5" stroke="var(--info-border)" stroke-width="1.8824" marker-end="url(#arrow)" />
  <text x="902.5" y="367.5" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text-muted)">Converged</text>
  <circle cx="840" cy="430" r="27.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.8824" />
  <text x="840" y="436.25" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text)">0</text>
  <circle cx="940" cy="405" r="27.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8824" />
  <text x="940" y="411.25" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text)">1</text>
  <circle cx="940" cy="480" r="27.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.8824" />
  <text x="940" y="486.2499" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="var(--text)">3</text>
  <line x1="865" y1="417.4999" x2="912.5" y2="407.4999" stroke="var(--text)" stroke-width="1.4118" />
  <line x1="865" y1="442.5" x2="912.5" y2="470" stroke="var(--text)" stroke-width="1.4118" />
  <text x="889.9999" y="398.75" font-family="Arial" font-size="13.2812" fill="var(--warn-accent)">1</text>
  <text x="889.9999" y="477.5" font-family="Arial" font-size="13.2812" fill="var(--warn-accent)">3</text>
  <text x="1027.5" y="448.75" font-family="Arial" font-size="34.9999" fill="var(--ok-accent)">✓</text>
  <text x="627.5" y="580" text-anchor="middle" font-family="Arial" font-size="13.7499" fill="var(--text-faint)">Values show shortest distance from source vertex (0)</text>
</svg>
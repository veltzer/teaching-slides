  <text x="489.9999" y="453.2502" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--text)">0</text>
  <rect x="589.133" y="382.8" width="68.4008" height="68.4008" rx="14" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="623.3333" y="424.25" text-anchor="middle" font-family="Arial" font-size="18.9948" font-weight="bold" fill="var(--text)">1</text>

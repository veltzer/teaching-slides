<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="623.3333" y="40" text-anchor="middle" font-size="27.9822" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pregel API - Iterative Message Passing</text>
  <rect x="40" y="98.0002" width="333.3334" height="101.5002" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="206.6668" y="137.1501" text-anchor="middle" font-size="21.7639" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Vertex Program</text>
  <text x="206.6668" y="167.6001" text-anchor="middle" font-size="18.9948" fill="var(--text-muted)" font-family="Arial, sans-serif">vprog(id, attr, msg)</text>
  <line x1="373.3332" y1="148.7501" x2="473.3333" y2="148.7501" stroke="var(--text)" stroke-width="0.807" marker-end="url(#arrow)"/>
  <rect x="489.9999" y="98.0002" width="333.3334" height="101.5002" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.6667" y="137.1501" text-anchor="middle" font-size="21.7639" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Send Messages</text>
  <text x="656.6667" y="167.6001" text-anchor="middle" font-size="18.9948" fill="var(--text-muted)" font-family="Arial, sans-serif">sendMsg(triplet)</text>
  <line x1="823.3333" y1="148.7501" x2="923.3334" y2="148.7501" stroke="var(--text)" stroke-width="0.807" marker-end="url(#arrow)"/>
  <rect x="939.9999" y="98.0002" width="300.0001" height="101.5002" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="137.1501" text-anchor="middle" font-size="21.7639" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Merge Messages</text>
  <text x="1090" y="167.6001" text-anchor="middle" font-size="18.9948" fill="var(--text-muted)" font-family="Arial, sans-serif">mergeMsg(m1, m2)</text>
  <path d="M 1090 199.5001 L 1090 243 L 206.6668 243 L 206.6668 199.5001" stroke="var(--info-border)" stroke-width="0.807" fill="none" marker-end="url(#arrow)"/>
  <text x="623.3333" y="271.9999" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Repeat until convergence (no messages)</text>
  <text x="623.3333" y="330.0001" text-anchor="middle" font-size="21.7639" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Example: SSSP (Single Source Shortest Path)</text>
  <text x="173.3332" y="373.5" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Superstep 0</text>
  <rect x="55.7993" y="411.8" width="68.4008" height="68.4008" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="89.9997" y="453.2502" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">0</text>
  <rect x="189.133" y="382.8" width="68.4008" height="68.4008" rx="14" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="0.807"/>
  <text x="223.3334" y="424.25" text-anchor="middle" font-size="18.9948" fill="var(--text)" font-family="Arial, sans-serif">inf</text>
  <rect x="189.133" y="469.8" width="68.4008" height="68.4008" rx="14" fill="var(--surface)" stroke="var(--text-faint)" stroke-width="0.807"/>
  <text x="223.3334" y="511.2501" text-anchor="middle" font-size="18.9948" fill="var(--text)" font-family="Arial, sans-serif">inf</text>
  <line x1="123.3333" y1="431.4999" x2="186.6665" y2="419.8999" stroke="var(--text)" stroke-width="0.6052"/>
  <line x1="123.3333" y1="460.5001" x2="186.6665" y2="492.4003" stroke="var(--text)" stroke-width="0.6052"/>
  <text x="156.6667" y="409.7501" font-size="18.9948" fill="var(--warn-accent)" font-family="Arial, sans-serif">1</text>
  <text x="156.6667" y="501.1001" font-size="18.9948" fill="var(--warn-accent)" font-family="Arial, sans-serif">3</text>
  <line x1="289.9999" y1="460.5001" x2="390" y2="460.5001" stroke="var(--info-border)" stroke-width="0.807" marker-end="url(#arrow)"/>
  <text x="573.3334" y="373.5" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Superstep 1</text>
  <rect x="455.8" y="411.8" width="68.4008" height="68.4008" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="489.9999" y="453.2502" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">0</text>
  <rect x="589.133" y="382.8" width="68.4008" height="68.4008" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="623.3333" y="424.25" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <rect x="589.133" y="469.8" width="68.4008" height="68.4008" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="623.3333" y="511.2501" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3</text>
  <line x1="523.3332" y1="431.4999" x2="586.6667" y2="419.8999" stroke="var(--text)" stroke-width="0.6052"/>
  <line x1="523.3332" y1="460.5001" x2="586.6667" y2="492.4003" stroke="var(--text)" stroke-width="0.6052"/>
  <text x="556.6666" y="409.7501" font-size="18.9948" fill="var(--warn-accent)" font-family="Arial, sans-serif">1</text>
  <text x="556.6666" y="501.1001" font-size="18.9948" fill="var(--warn-accent)" font-family="Arial, sans-serif">3</text>
  <line x1="689.9998" y1="460.5001" x2="789.9999" y2="460.5001" stroke="var(--info-border)" stroke-width="0.807" marker-end="url(#arrow)"/>
  <text x="989.9999" y="373.5" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text-muted)" font-family="Arial, sans-serif">Converged</text>
  <rect x="872.466" y="411.8" width="68.4008" height="68.4008" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="906.6666" y="453.2502" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">0</text>
  <rect x="1005.8" y="382.8" width="68.4008" height="68.4008" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="1040" y="424.25" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <rect x="1005.8" y="469.8" width="68.4008" height="68.4008" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="0.807" filter="url(#shadow)"/>
  <text x="1040" y="511.2501" text-anchor="middle" font-size="18.9948" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">3</text>
  <line x1="939.9999" y1="431.4999" x2="1003.3334" y2="419.8999" stroke="var(--text)" stroke-width="0.6052"/>
  <line x1="939.9999" y1="460.5001" x2="1003.3334" y2="492.4003" stroke="var(--text)" stroke-width="0.6052"/>
  <text x="973.3331" y="409.7501" font-size="18.9948" fill="var(--warn-accent)" font-family="Arial, sans-serif">1</text>
  <text x="973.3331" y="501.1001" font-size="18.9948" fill="var(--warn-accent)" font-family="Arial, sans-serif">3</text>
  <text x="1156.6667" y="467.75" font-size="43.5276" fill="var(--ok-accent)" font-family="Arial, sans-serif">✓</text>
  <text x="623.3333" y="620" text-anchor="middle" font-size="18.9948" fill="var(--text-faint)" font-family="Arial, sans-serif">Values show shortest distance from source vertex (0)</text>
</svg>

  <ns0:text x="215.2553" y="138.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="#1565c0">Edge List</ns0:text>
  <ns0:rect x="76.8769" y="155.6757" width="276.7568" height="172.973" rx="6.1502" fill="#fff" stroke="#ccc" stroke-width="1.5375" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="356.7568" height="276.190496749809" rx="6.233549438601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="86.031785437133" text-anchor="middle" font-size="22.807830148408" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Edge List</text>
  <rect x="72.4325" y="104.444564373885" width="291.8919" height="184.127033812038" rx="6.233549438601" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375"/>
  <text x="96.7567" y="144.952375812548" font-size="17.920519603563" fill="var(--text)" font-family="Courier New, monospace">1  2</text>
  <text x="96.7567" y="174.412778936751" font-size="17.920519603563" fill="var(--text)" font-family="Courier New, monospace">1  3</text>
  <text x="96.7567" y="203.873074124458" font-size="17.920519603563" fill="var(--text)" font-family="Courier New, monospace">2  4</text>
  <text x="96.7567" y="233.333369312165" font-size="17.920519603563" fill="var(--text)" font-family="Courier New, monospace">3  5</text>
  <text x="96.7567" y="262.793664499873" font-size="17.920519603563" fill="var(--text-faint)" font-family="Courier New, monospace">src  dst</text>
  <rect x="461.6217" y="40" width="356.7568" height="276.190496749809" rx="6.233549438601" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="86.031785437133" text-anchor="middle" font-size="22.807830148408" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Adjacency List</text>
  <rect x="494.054" y="104.444564373885" width="291.8919" height="184.127033812038" rx="6.233549438601" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375"/>
  <text x="518.3784" y="144.952375812548" font-size="17.920519603563" fill="var(--text)" font-family="Courier New, monospace">1: [2, 3]</text>
  <text x="518.3784" y="174.412778936751" font-size="17.920519603563" fill="var(--text)" font-family="Courier New, monospace">2: [4]</text>
  <text x="518.3784" y="203.873074124458" font-size="17.920519603563" fill="var(--text)" font-family="Courier New, monospace">3: [5]</text>
  <text x="518.3784" y="233.333369312165" font-size="17.920519603563" fill="var(--text)" font-family="Courier New, monospace">4: []</text>
  <text x="518.3784" y="262.793664499873" font-size="17.920519603563" fill="var(--text-faint)" font-family="Courier New, monospace">node: [neighbors]</text>
  <rect x="883.2432" y="40" width="356.7568" height="276.190496749809" rx="6.233549438601" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6217" y="86.031785437133" text-anchor="middle" font-size="22.807830148408" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">GraphML (XML)</text>
  <rect x="915.6757" y="104.444564373885" width="291.8919" height="184.127033812038" rx="6.233549438601" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375"/>
  <text x="931.8919" y="141.269906374394" font-size="16.291381457785" fill="var(--text)" font-family="Courier New, monospace">&lt;graph&gt;</text>
  <text x="948.1081" y="170.730201562102" font-size="16.291381457785" fill="var(--text)" font-family="Courier New, monospace">&lt;node id="1"/&gt;</text>
  <text x="948.1081" y="200.190496749809" font-size="16.291381457785" fill="var(--text)" font-family="Courier New, monospace">&lt;node id="2"/&gt;</text>
  <text x="948.1081" y="229.650791937516" font-size="16.291381457785" fill="var(--text)" font-family="Courier New, monospace">&lt;edge src="1"</text>
  <text x="972.4324" y="259.111195061719" font-size="16.291381457785" fill="var(--text)" font-family="Courier New, monospace">dst="2"/&gt;</text>
  <rect x="40" y="380.634953187197" width="356.7568" height="239.365046812803" rx="6.233549438601" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="426.666738624331" text-anchor="middle" font-size="22.807830148408" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Parquet (Columnar)</text>
  <text x="218.3784" y="472.698416124968" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">vertices.parquet</text>
  <text x="218.3784" y="505.841288687325" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">edges.parquet</text>
  <text x="218.3784" y="546.349208062484" text-anchor="middle" font-size="17.920519603563" fill="var(--ok-accent)" font-family="Arial, sans-serif">Best for Spark!</text>
  <text x="218.3784" y="579.491972688345" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">Compressed, fast reads</text>
  <rect x="461.6217" y="380.634953187197" width="356.7568" height="239.365046812803" rx="6.233549438601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="426.666738624331" text-anchor="middle" font-size="22.807830148408" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">CSV / TSV</text>
  <text x="640" y="472.698416124968" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple text format</text>
  <text x="640" y="505.841288687325" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">Easy to produce/consume</text>
  <text x="640" y="538.984161249681" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">No schema enforcement</text>
  <text x="640" y="579.491972688345" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">Good for interop</text>
  <rect x="883.2432" y="380.634953187197" width="356.7568" height="239.365046812803" rx="6.233549438601" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6217" y="426.666738624331" text-anchor="middle" font-size="22.807830148408" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">JSON</text>
  <text x="1061.6217" y="472.698416124968" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">Nested properties</text>
  <text x="1061.6217" y="505.841288687325" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">Schema flexibility</text>
  <text x="1061.6217" y="538.984161249681" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">Human readable</text>
  <text x="1061.6217" y="579.491972688345" text-anchor="middle" font-size="17.920519603563" fill="var(--text-muted)" font-family="Arial, sans-serif">Larger file sizes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.2258" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Graph Data Formats</text>
  <rect x="40" y="82.647" width="356.7568" height="255.8824" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="125.2941" text-anchor="middle" font-size="21.9533" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Edge List</text>
  <rect x="72.4325" y="142.353" width="291.8919" height="170.5883" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375"/>
  <text x="96.7567" y="179.8823" font-size="17.2491" fill="var(--text)" font-family="Courier New, monospace">1  2</text>
  <text x="96.7567" y="207.1765" font-size="17.2491" fill="var(--text)" font-family="Courier New, monospace">1  3</text>
  <text x="96.7567" y="234.4706" font-size="17.2491" fill="var(--text)" font-family="Courier New, monospace">2  4</text>
  <text x="96.7567" y="261.7647" font-size="17.2491" fill="var(--text)" font-family="Courier New, monospace">3  5</text>
  <text x="96.7567" y="289.0588" font-size="17.2491" fill="var(--text-faint)" font-family="Courier New, monospace">src  dst</text>
  <rect x="461.6217" y="82.647" width="356.7568" height="255.8824" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.2941" text-anchor="middle" font-size="21.9533" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Adjacency List</text>
  <rect x="494.054" y="142.353" width="291.8919" height="170.5883" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375"/>
  <text x="518.3784" y="179.8823" font-size="17.2491" fill="var(--text)" font-family="Courier New, monospace">1: [2, 3]</text>
  <text x="518.3784" y="207.1765" font-size="17.2491" fill="var(--text)" font-family="Courier New, monospace">2: [4]</text>
  <text x="518.3784" y="234.4706" font-size="17.2491" fill="var(--text)" font-family="Courier New, monospace">3: [5]</text>
  <text x="518.3784" y="261.7647" font-size="17.2491" fill="var(--text)" font-family="Courier New, monospace">4: []</text>
  <text x="518.3784" y="289.0588" font-size="17.2491" fill="var(--text-faint)" font-family="Courier New, monospace">node: [neighbors]</text>
  <rect x="883.2432" y="82.647" width="356.7568" height="255.8824" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6217" y="125.2941" text-anchor="middle" font-size="21.9533" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">GraphML (XML)</text>
  <rect x="915.6757" y="142.353" width="291.8919" height="170.5883" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375"/>
  <text x="931.8919" y="176.4706" font-size="15.681" fill="var(--text)" font-family="Courier New, monospace">&lt;graph&gt;</text>
  <text x="948.1081" y="203.7647" font-size="15.681" fill="var(--text)" font-family="Courier New, monospace">&lt;node id="1"/&gt;</text>
  <text x="948.1081" y="231.0588" font-size="15.681" fill="var(--text)" font-family="Courier New, monospace">&lt;node id="2"/&gt;</text>
  <text x="948.1081" y="258.3529" font-size="15.681" fill="var(--text)" font-family="Courier New, monospace">&lt;edge src="1"</text>
  <text x="972.4324" y="285.6471" font-size="15.681" fill="var(--text)" font-family="Courier New, monospace">dst="2"/&gt;</text>
  <rect x="40" y="398.2353" width="356.7568" height="221.7647" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="218.3784" y="440.8824" text-anchor="middle" font-size="21.9533" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Parquet (Columnar)</text>
  <text x="218.3784" y="483.5294" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">vertices.parquet</text>
  <text x="218.3784" y="514.2353" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">edges.parquet</text>
  <text x="218.3784" y="551.7647" text-anchor="middle" font-size="17.2491" fill="var(--ok-accent)" font-family="Arial, sans-serif">Best for Spark!</text>
  <text x="218.3784" y="582.4705" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">Compressed, fast reads</text>
  <rect x="461.6217" y="398.2353" width="356.7568" height="221.7647" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="440.8824" text-anchor="middle" font-size="21.9533" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">CSV / TSV</text>
  <text x="640" y="483.5294" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">Simple text format</text>
  <text x="640" y="514.2353" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">Easy to produce/consume</text>
  <text x="640" y="544.9412" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">No schema enforcement</text>
  <text x="640" y="582.4705" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">Good for interop</text>
  <rect x="883.2432" y="398.2353" width="356.7568" height="221.7647" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1061.6217" y="440.8824" text-anchor="middle" font-size="21.9533" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">JSON</text>
  <text x="1061.6217" y="483.5294" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">Nested properties</text>
  <text x="1061.6217" y="514.2353" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">Schema flexibility</text>
  <text x="1061.6217" y="544.9412" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">Human readable</text>
  <text x="1061.6217" y="582.4705" text-anchor="middle" font-size="17.2491" fill="var(--text-muted)" font-family="Arial, sans-serif">Larger file sizes</text>
</svg>

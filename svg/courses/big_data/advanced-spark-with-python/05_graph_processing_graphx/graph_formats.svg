  <ns0:text x="615.015" y="532.7568" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Easy to produce/consume</ns0:text>
  <ns0:text x="615.015" y="563.8919" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">No schema enforcement</ns0:text>
  <ns0:text x="615.015" y="601.9459" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Good for interop</ns0:text>

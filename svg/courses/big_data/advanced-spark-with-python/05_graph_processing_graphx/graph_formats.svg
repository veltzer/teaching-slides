  <ns0:text x="99.9399" y="221.4054" font-family="Courier New" font-size="16.9129" fill="#333">1  3</ns0:text>
  <ns0:text x="99.9399" y="249.0811" font-family="Courier New" font-size="16.9129" fill="#333">2  4</ns0:text>
  <ns0:text x="99.9399" y="276.7568" font-family="Courier New" font-size="16.9129" fill="#333">3  5</ns0:text>
  <ns0:text x="99.9399" y="304.4324" font-family="Courier New" font-size="16.9129" fill="#888">src  dst</ns0:text>
  <ns0:rect x="445.8859" y="95.1351" width="338.2583" height="259.4595" rx="12.3003" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.0751" />
  <ns0:text x="615.015" y="138.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="#2e7d32">Adjacency List</ns0:text>
  <ns0:rect x="476.6366" y="155.6757" width="276.7568" height="172.973" rx="6.1502" fill="#fff" stroke="#ccc" stroke-width="1.5375" />
  <ns0:text x="499.6997" y="193.7297" font-family="Courier New" font-size="16.9129" fill="#333">1: [2, 3]</ns0:text>
  <ns0:text x="499.6997" y="221.4054" font-family="Courier New" font-size="16.9129" fill="#333">2: [4]</ns0:text>
  <ns0:text x="499.6997" y="249.0811" font-family="Courier New" font-size="16.9129" fill="#333">3: [5]</ns0:text>
  <ns0:text x="499.6997" y="276.7568" font-family="Courier New" font-size="16.9129" fill="#333">4: []</ns0:text>
  <ns0:text x="499.6997" y="304.4324" font-family="Courier New" font-size="16.9129" fill="#888">node: [neighbors]</ns0:text>
  <ns0:rect x="845.6456" y="95.1351" width="338.2583" height="259.4595" rx="12.3003" fill="#fff3e0" stroke="#e65100" stroke-width="3.0751" />
  <ns0:text x="1014.7748" y="138.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="#e65100">GraphML (XML)</ns0:text>
  <ns0:rect x="876.3964" y="155.6757" width="276.7568" height="172.973" rx="6.1502" fill="#fff" stroke="#ccc" stroke-width="1.5375" />
  <ns0:text x="891.7718" y="190.2703" font-family="Courier New" font-size="15.3754" fill="#333">&lt;graph&gt;</ns0:text>
  <ns0:text x="907.1471" y="217.9459" font-family="Courier New" font-size="15.3754" fill="#333">&lt;node id="1"/&gt;</ns0:text>
  <ns0:text x="907.1471" y="245.6216" font-family="Courier New" font-size="15.3754" fill="#333">&lt;node id="2"/&gt;</ns0:text>
  <ns0:text x="907.1471" y="273.2973" font-family="Courier New" font-size="15.3754" fill="#333">&lt;edge src="1"</ns0:text>
  <ns0:text x="930.2102" y="300.973" font-family="Courier New" font-size="15.3754" fill="#333">dst="2"/&gt;</ns0:text>
  <ns0:rect x="46.1261" y="415.1351" width="338.2583" height="224.8649" rx="12.3003" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.0751" />
  <ns0:text x="215.2553" y="458.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="#7b1fa2">Parquet (Columnar)</ns0:text>
  <ns0:text x="215.2553" y="501.6216" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">vertices.parquet</ns0:text>
  <ns0:text x="215.2553" y="532.7568" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">edges.parquet</ns0:text>
  <ns0:text x="215.2553" y="570.8108" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#2e7d32">Best for Spark!</ns0:text>
  <ns0:text x="215.2553" y="601.9459" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Compressed, fast reads</ns0:text>
  <ns0:rect x="445.8859" y="415.1351" width="338.2583" height="224.8649" rx="12.3003" fill="#e8f4f8" stroke="#2e7d32" stroke-width="3.0751" />
  <ns0:text x="615.015" y="458.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="#2e7d32">CSV / TSV</ns0:text>
  <ns0:text x="615.015" y="501.6216" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Simple text format</ns0:text>
  <ns0:text x="615.015" y="532.7568" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Easy to produce/consume</ns0:text>
  <ns0:text x="615.015" y="563.8919" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">No schema enforcement</ns0:text>
  <ns0:text x="615.015" y="601.9459" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Good for interop</ns0:text>
  <ns0:rect x="845.6456" y="415.1351" width="338.2583" height="224.8649" rx="12.3003" fill="#fce4ec" stroke="#c62828" stroke-width="3.0751" />
  <ns0:text x="1014.7748" y="458.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="#c62828">JSON</ns0:text>
  <ns0:text x="1014.7748" y="501.6216" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Nested properties</ns0:text>
  <ns0:text x="1014.7748" y="532.7568" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Schema flexibility</ns0:text>
  <ns0:text x="1014.7748" y="563.8919" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Human readable</ns0:text>
  <ns0:text x="1014.7748" y="601.9459" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="#555">Larger file sizes</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="51.8919" text-anchor="middle" font-family="Arial" font-size="27.6757" font-weight="bold" fill="var(--primary-accent)">Graph Data Formats</text>
  <rect x="46.1261" y="95.1351" width="338.2583" height="259.4595" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="215.2553" y="138.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="var(--primary-accent)">Edge List</text>
  <rect x="76.8769" y="155.6757" width="276.7568" height="172.973" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375" />
  <text x="99.9399" y="193.7297" font-family="Courier New" font-size="16.9129" fill="var(--text)">1  2</text>
  <text x="99.9399" y="221.4054" font-family="Courier New" font-size="16.9129" fill="var(--text)">1  3</text>
  <text x="99.9399" y="249.0811" font-family="Courier New" font-size="16.9129" fill="var(--text)">2  4</text>
  <text x="99.9399" y="276.7568" font-family="Courier New" font-size="16.9129" fill="var(--text)">3  5</text>
  <text x="99.9399" y="304.4324" font-family="Courier New" font-size="16.9129" fill="var(--text-faint)">src  dst</text>
  <rect x="445.8859" y="95.1351" width="338.2583" height="259.4595" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="615.015" y="138.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="var(--ok-accent)">Adjacency List</text>
  <rect x="476.6366" y="155.6757" width="276.7568" height="172.973" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375" />
  <text x="499.6997" y="193.7297" font-family="Courier New" font-size="16.9129" fill="var(--text)">1: [2, 3]</text>
  <text x="499.6997" y="221.4054" font-family="Courier New" font-size="16.9129" fill="var(--text)">2: [4]</text>
  <text x="499.6997" y="249.0811" font-family="Courier New" font-size="16.9129" fill="var(--text)">3: [5]</text>
  <text x="499.6997" y="276.7568" font-family="Courier New" font-size="16.9129" fill="var(--text)">4: []</text>
  <text x="499.6997" y="304.4324" font-family="Courier New" font-size="16.9129" fill="var(--text-faint)">node: [neighbors]</text>
  <rect x="845.6456" y="95.1351" width="338.2583" height="259.4595" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1014.7748" y="138.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="var(--warn-accent)">GraphML (XML)</text>
  <rect x="876.3964" y="155.6757" width="276.7568" height="172.973" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375" />
  <text x="891.7718" y="190.2703" font-family="Courier New" font-size="15.3754" fill="var(--text)">&lt;graph&gt;</text>
  <text x="907.1471" y="217.9459" font-family="Courier New" font-size="15.3754" fill="var(--text)">&lt;node id="1"/&gt;</text>
  <text x="907.1471" y="245.6216" font-family="Courier New" font-size="15.3754" fill="var(--text)">&lt;node id="2"/&gt;</text>
  <text x="907.1471" y="273.2973" font-family="Courier New" font-size="15.3754" fill="var(--text)">&lt;edge src="1"</text>
  <text x="930.2102" y="300.973" font-family="Courier New" font-size="15.3754" fill="var(--text)">dst="2"/&gt;</text>
  <rect x="46.1261" y="415.1351" width="338.2583" height="224.8649" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="215.2553" y="458.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="var(--info-accent)">Parquet (Columnar)</text>
  <text x="215.2553" y="501.6216" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">vertices.parquet</text>
  <text x="215.2553" y="532.7568" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">edges.parquet</text>
  <text x="215.2553" y="570.8108" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--ok-accent)">Best for Spark!</text>
  <text x="215.2553" y="601.9459" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">Compressed, fast reads</text>
  <rect x="445.8859" y="415.1351" width="338.2583" height="224.8649" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="615.015" y="458.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="var(--ok-accent)">CSV / TSV</text>
  <text x="615.015" y="501.6216" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">Simple text format</text>
  <text x="615.015" y="532.7568" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">Easy to produce/consume</text>
  <text x="615.015" y="563.8919" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">No schema enforcement</text>
  <text x="615.015" y="601.9459" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">Good for interop</text>
  <rect x="845.6456" y="415.1351" width="338.2583" height="224.8649" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1014.7748" y="458.3784" text-anchor="middle" font-family="Arial" font-size="21.5255" font-weight="bold" fill="var(--danger-accent)">JSON</text>
  <text x="1014.7748" y="501.6216" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">Nested properties</text>
  <text x="1014.7748" y="532.7568" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">Schema flexibility</text>
  <text x="1014.7748" y="563.8919" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">Human readable</text>
  <text x="1014.7748" y="601.9459" text-anchor="middle" font-family="Arial" font-size="16.9129" fill="var(--text-muted)">Larger file sizes</text>
</svg>
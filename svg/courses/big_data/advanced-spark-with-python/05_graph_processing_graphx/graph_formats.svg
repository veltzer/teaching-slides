<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="28.2258" font-weight="bold" fill="var(--primary-accent)">Graph Data Formats</text>
  <rect x="40" y="82.647" width="356.7568" height="255.8824" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="218.3784" y="125.2941" text-anchor="middle" font-family="Arial" font-size="21.9533" font-weight="bold" fill="var(--primary-accent)">Edge List</text>
  <rect x="72.4325" y="142.353" width="291.8919" height="170.5883" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375" />
  <text x="96.7567" y="179.8823" font-family="Courier New" font-size="17.2491" fill="var(--text)">1  2</text>
  <text x="96.7567" y="207.1765" font-family="Courier New" font-size="17.2491" fill="var(--text)">1  3</text>
  <text x="96.7567" y="234.4706" font-family="Courier New" font-size="17.2491" fill="var(--text)">2  4</text>
  <text x="96.7567" y="261.7647" font-family="Courier New" font-size="17.2491" fill="var(--text)">3  5</text>
  <text x="96.7567" y="289.0588" font-family="Courier New" font-size="17.2491" fill="var(--text-faint)">src  dst</text>
  <rect x="461.6217" y="82.647" width="356.7568" height="255.8824" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="125.2941" text-anchor="middle" font-family="Arial" font-size="21.9533" font-weight="bold" fill="var(--ok-accent)">Adjacency List</text>
  <rect x="494.054" y="142.353" width="291.8919" height="170.5883" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375" />
  <text x="518.3784" y="179.8823" font-family="Courier New" font-size="17.2491" fill="var(--text)">1: [2, 3]</text>
  <text x="518.3784" y="207.1765" font-family="Courier New" font-size="17.2491" fill="var(--text)">2: [4]</text>
  <text x="518.3784" y="234.4706" font-family="Courier New" font-size="17.2491" fill="var(--text)">3: [5]</text>
  <text x="518.3784" y="261.7647" font-family="Courier New" font-size="17.2491" fill="var(--text)">4: []</text>
  <text x="518.3784" y="289.0588" font-family="Courier New" font-size="17.2491" fill="var(--text-faint)">node: [neighbors]</text>
  <rect x="883.2432" y="82.647" width="356.7568" height="255.8824" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1061.6217" y="125.2941" text-anchor="middle" font-family="Arial" font-size="21.9533" font-weight="bold" fill="var(--warn-accent)">GraphML (XML)</text>
  <rect x="915.6757" y="142.353" width="291.8919" height="170.5883" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5375" />
  <text x="931.8919" y="176.4706" font-family="Courier New" font-size="15.681" fill="var(--text)">&lt;graph&gt;</text>
  <text x="948.1081" y="203.7647" font-family="Courier New" font-size="15.681" fill="var(--text)">&lt;node id="1"/&gt;</text>
  <text x="948.1081" y="231.0588" font-family="Courier New" font-size="15.681" fill="var(--text)">&lt;node id="2"/&gt;</text>
  <text x="948.1081" y="258.3529" font-family="Courier New" font-size="15.681" fill="var(--text)">&lt;edge src="1"</text>
  <text x="972.4324" y="285.6471" font-family="Courier New" font-size="15.681" fill="var(--text)">dst="2"/&gt;</text>
  <rect x="40" y="398.2353" width="356.7568" height="221.7647" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="218.3784" y="440.8824" text-anchor="middle" font-family="Arial" font-size="21.9533" font-weight="bold" fill="var(--info-accent)">Parquet (Columnar)</text>
  <text x="218.3784" y="483.5294" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">vertices.parquet</text>
  <text x="218.3784" y="514.2353" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">edges.parquet</text>
  <text x="218.3784" y="551.7647" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--ok-accent)">Best for Spark!</text>
  <text x="218.3784" y="582.4705" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">Compressed, fast reads</text>
  <rect x="461.6217" y="398.2353" width="356.7568" height="221.7647" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="440.8824" text-anchor="middle" font-family="Arial" font-size="21.9533" font-weight="bold" fill="var(--ok-accent)">CSV / TSV</text>
  <text x="640" y="483.5294" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">Simple text format</text>
  <text x="640" y="514.2353" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">Easy to produce/consume</text>
  <text x="640" y="544.9412" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">No schema enforcement</text>
  <text x="640" y="582.4705" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">Good for interop</text>
  <rect x="883.2432" y="398.2353" width="356.7568" height="221.7647" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1061.6217" y="440.8824" text-anchor="middle" font-family="Arial" font-size="21.9533" font-weight="bold" fill="var(--danger-accent)">JSON</text>
  <text x="1061.6217" y="483.5294" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">Nested properties</text>
  <text x="1061.6217" y="514.2353" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">Schema flexibility</text>
  <text x="1061.6217" y="544.9412" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">Human readable</text>
  <text x="1061.6217" y="582.4705" text-anchor="middle" font-family="Arial" font-size="17.2491" fill="var(--text-muted)">Larger file sizes</text>
</svg>
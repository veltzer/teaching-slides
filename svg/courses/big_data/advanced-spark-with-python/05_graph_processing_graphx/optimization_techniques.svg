<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="604.8946" y="48.6076" text-anchor="middle" font-family="Arial" font-size="27.2203" font-weight="bold" fill="var(--primary-deeper)">Graph Optimization Techniques</text>
  <rect x="45.3671" y="89.1139" width="347.8144" height="178.2278" rx="12.0979" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3.0245" />
  <text x="219.2743" y="126.3798" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="var(--primary-dk)">1. Partitioning</text>
  <text x="68.0506" y="162.0254" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Choose right strategy</text>
  <text x="68.0506" y="191.1899" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Balance partition sizes</text>
  <text x="68.0506" y="220.3545" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Minimize cross-partition</text>
  <text x="68.0506" y="249.519" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">  edges (less shuffle)</text>
  <rect x="430.9874" y="89.1139" width="347.8144" height="178.2278" rx="12.0979" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="3.0245" />
  <text x="604.8946" y="126.3798" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="var(--ok-dk)">2. Caching</text>
  <text x="453.6709" y="162.0254" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Cache before iterations</text>
  <text x="453.6709" y="191.1899" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Unpersist old versions</text>
  <text x="453.6709" y="220.3545" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Use serialized storage</text>
  <text x="453.6709" y="249.519" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Checkpoint long lineages</text>
  <rect x="816.6077" y="89.1139" width="347.8144" height="178.2278" rx="12.0979" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="3.0245" />
  <text x="990.5149" y="126.3798" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="var(--warn-dk)">3. Serialization</text>
  <text x="839.2912" y="162.0254" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Use Kryo serializer</text>
  <text x="839.2912" y="191.1899" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Register graph classes</text>
  <text x="839.2912" y="220.3545" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Reduce object overhead</text>
  <text x="839.2912" y="249.519" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Compact data types</text>
  <rect x="45.3671" y="315.9494" width="347.8144" height="178.2278" rx="12.0979" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="3.0245" />
  <text x="219.2743" y="353.2152" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="var(--info-mid)">4. Algorithm Choice</text>
  <text x="68.0506" y="388.8608" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Use built-in when possible</text>
  <text x="68.0506" y="418.0253" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Set maxIterations</text>
  <text x="68.0506" y="447.19" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Tune tolerance (tol)</text>
  <text x="68.0506" y="476.3545" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Approximate when ok</text>
  <rect x="430.9874" y="315.9494" width="347.8144" height="178.2278" rx="12.0979" fill="var(--primary-pale2)" stroke="var(--ok-dk)" stroke-width="3.0245" />
  <text x="604.8946" y="353.2152" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="var(--ok-dk)">5. Data Reduction</text>
  <text x="453.6709" y="388.8608" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Filter before processing</text>
  <text x="453.6709" y="418.0253" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Use subgraph views</text>
  <text x="453.6709" y="447.19" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Remove low-degree nodes</text>
  <text x="453.6709" y="476.3545" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Sample large graphs</text>
  <rect x="816.6077" y="315.9494" width="347.8144" height="178.2278" rx="12.0979" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="3.0245" />
  <text x="990.5149" y="353.2152" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="var(--danger-dk)">6. Resource Tuning</text>
  <text x="839.2912" y="388.8608" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Increase executor memory</text>
  <text x="839.2912" y="418.0253" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Set memoryOverhead</text>
  <text x="839.2912" y="447.19" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Tune parallelism</text>
  <text x="839.2912" y="476.3545" font-family="Arial" font-size="16.6346" fill="var(--text-dark)">- Monitor GC pressure</text>
  <rect x="226.8355" y="550.8861" width="756.1182" height="89.1139" rx="12.0979" fill="var(--surface)" stroke="var(--text-faintest)" stroke-width="2.2684" />
  <text x="604.8946" y="586.5317" text-anchor="middle" font-family="Arial" font-size="18.1468" font-weight="bold" fill="var(--text-dark)">Impact Order: Partitioning &gt; Caching &gt; Algorithm &gt; Resource Tuning</text>
  <text x="604.8946" y="618.9367" text-anchor="middle" font-family="Arial" font-size="16.6346" fill="var(--text-mid)">Always profile before optimizing -- measure, don't guess</text>
</svg>
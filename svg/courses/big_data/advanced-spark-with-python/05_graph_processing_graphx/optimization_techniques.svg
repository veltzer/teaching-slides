<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.9148" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Graph Optimization Techniques</text>
  <rect x="40" y="79.726" width="372.973" height="174.7945" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="116.274" text-anchor="middle" font-size="20.1607" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Partitioning</text>
  <text x="64.3243" y="151.233" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Choose right strategy</text>
  <text x="64.3243" y="179.8356" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Balance partition sizes</text>
  <text x="64.3243" y="208.4384" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Minimize cross-partition</text>
  <text x="64.3243" y="237.0411" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">  edges (less shuffle)</text>
  <rect x="453.5135" y="79.726" width="372.973" height="174.7945" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="116.274" text-anchor="middle" font-size="20.1607" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Caching</text>
  <text x="477.8378" y="151.233" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Cache before iterations</text>
  <text x="477.8378" y="179.8356" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Unpersist old versions</text>
  <text x="477.8378" y="208.4384" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Use serialized storage</text>
  <text x="477.8378" y="237.0411" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Checkpoint long lineages</text>
  <rect x="867.027" y="79.726" width="372.973" height="174.7945" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="116.274" text-anchor="middle" font-size="20.1607" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">3. Serialization</text>
  <text x="891.3513" y="151.233" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Use Kryo serializer</text>
  <text x="891.3513" y="179.8356" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Register graph classes</text>
  <text x="891.3513" y="208.4384" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Reduce object overhead</text>
  <text x="891.3513" y="237.0411" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Compact data types</text>
  <rect x="40" y="302.1918" width="372.973" height="174.7945" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="338.7397" text-anchor="middle" font-size="20.1607" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">4. Algorithm Choice</text>
  <text x="64.3243" y="373.6987" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Use built-in when possible</text>
  <text x="64.3243" y="402.3014" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Set maxIterations</text>
  <text x="64.3243" y="430.9042" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Tune tolerance (tol)</text>
  <text x="64.3243" y="459.5069" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Approximate when ok</text>
  <rect x="453.5135" y="302.1918" width="372.973" height="174.7945" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="338.7397" text-anchor="middle" font-size="20.1607" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5. Data Reduction</text>
  <text x="477.8378" y="373.6987" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Filter before processing</text>
  <text x="477.8378" y="402.3014" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Use subgraph views</text>
  <text x="477.8378" y="430.9042" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Remove low-degree nodes</text>
  <text x="477.8378" y="459.5069" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Sample large graphs</text>
  <rect x="867.027" y="302.1918" width="372.973" height="174.7945" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="338.7397" text-anchor="middle" font-size="20.1607" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">6. Resource Tuning</text>
  <text x="891.3513" y="373.6987" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Increase executor memory</text>
  <text x="891.3513" y="402.3014" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Set memoryOverhead</text>
  <text x="891.3513" y="430.9042" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Tune parallelism</text>
  <text x="891.3513" y="459.5069" font-size="17.059" fill="var(--text)" font-family="Arial, sans-serif">- Monitor GC pressure</text>
  <rect x="234.5946" y="532.6028" width="810.8108" height="87.3972" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="567.5617" text-anchor="middle" font-size="18.6098" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Impact Order: Partitioning &gt; Caching &gt; Algorithm &gt; Resource Tuning</text>
  <text x="640" y="599.3425" text-anchor="middle" font-size="17.059" fill="var(--text-muted)" font-family="Arial, sans-serif">Always profile before optimizing -- measure, don't guess</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="27.9148" font-weight="bold" fill="var(--primary-accent)">Graph Optimization Techniques</text>
  <rect x="40" y="79.726" width="372.973" height="174.7945" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="116.274" text-anchor="middle" font-family="Arial" font-size="20.1607" font-weight="bold" fill="var(--primary-accent)">1. Partitioning</text>
  <text x="64.3243" y="151.233" font-family="Arial" font-size="17.059" fill="var(--text)">- Choose right strategy</text>
  <text x="64.3243" y="179.8356" font-family="Arial" font-size="17.059" fill="var(--text)">- Balance partition sizes</text>
  <text x="64.3243" y="208.4384" font-family="Arial" font-size="17.059" fill="var(--text)">- Minimize cross-partition</text>
  <text x="64.3243" y="237.0411" font-family="Arial" font-size="17.059" fill="var(--text)">  edges (less shuffle)</text>
  <rect x="453.5135" y="79.726" width="372.973" height="174.7945" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="116.274" text-anchor="middle" font-family="Arial" font-size="20.1607" font-weight="bold" fill="var(--ok-accent)">2. Caching</text>
  <text x="477.8378" y="151.233" font-family="Arial" font-size="17.059" fill="var(--text)">- Cache before iterations</text>
  <text x="477.8378" y="179.8356" font-family="Arial" font-size="17.059" fill="var(--text)">- Unpersist old versions</text>
  <text x="477.8378" y="208.4384" font-family="Arial" font-size="17.059" fill="var(--text)">- Use serialized storage</text>
  <text x="477.8378" y="237.0411" font-family="Arial" font-size="17.059" fill="var(--text)">- Checkpoint long lineages</text>
  <rect x="867.027" y="79.726" width="372.973" height="174.7945" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="116.274" text-anchor="middle" font-family="Arial" font-size="20.1607" font-weight="bold" fill="var(--warn-accent)">3. Serialization</text>
  <text x="891.3513" y="151.233" font-family="Arial" font-size="17.059" fill="var(--text)">- Use Kryo serializer</text>
  <text x="891.3513" y="179.8356" font-family="Arial" font-size="17.059" fill="var(--text)">- Register graph classes</text>
  <text x="891.3513" y="208.4384" font-family="Arial" font-size="17.059" fill="var(--text)">- Reduce object overhead</text>
  <text x="891.3513" y="237.0411" font-family="Arial" font-size="17.059" fill="var(--text)">- Compact data types</text>
  <rect x="40" y="302.1918" width="372.973" height="174.7945" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="338.7397" text-anchor="middle" font-family="Arial" font-size="20.1607" font-weight="bold" fill="var(--info-accent)">4. Algorithm Choice</text>
  <text x="64.3243" y="373.6987" font-family="Arial" font-size="17.059" fill="var(--text)">- Use built-in when possible</text>
  <text x="64.3243" y="402.3014" font-family="Arial" font-size="17.059" fill="var(--text)">- Set maxIterations</text>
  <text x="64.3243" y="430.9042" font-family="Arial" font-size="17.059" fill="var(--text)">- Tune tolerance (tol)</text>
  <text x="64.3243" y="459.5069" font-family="Arial" font-size="17.059" fill="var(--text)">- Approximate when ok</text>
  <rect x="453.5135" y="302.1918" width="372.973" height="174.7945" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="338.7397" text-anchor="middle" font-family="Arial" font-size="20.1607" font-weight="bold" fill="var(--ok-accent)">5. Data Reduction</text>
  <text x="477.8378" y="373.6987" font-family="Arial" font-size="17.059" fill="var(--text)">- Filter before processing</text>
  <text x="477.8378" y="402.3014" font-family="Arial" font-size="17.059" fill="var(--text)">- Use subgraph views</text>
  <text x="477.8378" y="430.9042" font-family="Arial" font-size="17.059" fill="var(--text)">- Remove low-degree nodes</text>
  <text x="477.8378" y="459.5069" font-family="Arial" font-size="17.059" fill="var(--text)">- Sample large graphs</text>
  <rect x="867.027" y="302.1918" width="372.973" height="174.7945" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="338.7397" text-anchor="middle" font-family="Arial" font-size="20.1607" font-weight="bold" fill="var(--danger-accent)">6. Resource Tuning</text>
  <text x="891.3513" y="373.6987" font-family="Arial" font-size="17.059" fill="var(--text)">- Increase executor memory</text>
  <text x="891.3513" y="402.3014" font-family="Arial" font-size="17.059" fill="var(--text)">- Set memoryOverhead</text>
  <text x="891.3513" y="430.9042" font-family="Arial" font-size="17.059" fill="var(--text)">- Tune parallelism</text>
  <text x="891.3513" y="459.5069" font-family="Arial" font-size="17.059" fill="var(--text)">- Monitor GC pressure</text>
  <rect x="234.5946" y="532.6028" width="810.8108" height="87.3972" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="567.5617" text-anchor="middle" font-family="Arial" font-size="18.6098" font-weight="bold" fill="var(--text)">Impact Order: Partitioning &gt; Caching &gt; Algorithm &gt; Resource Tuning</text>
  <text x="640" y="599.3425" text-anchor="middle" font-family="Arial" font-size="17.059" fill="var(--text-muted)">Always profile before optimizing -- measure, don't guess</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="390" height="223.076923076923" rx="8.44894167246" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--primary-text)">1. Partitioning</text>
  <text x="235" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--primary-text)">Right strategy</text>
  <text x="235" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--primary-text)">Balance sizes</text>
  <text x="235" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--primary-text)">Fewer cross-edges</text>
  <text x="235" y="246.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--primary-text)">Less shuffle</text>

  <rect x="445" y="40" width="390" height="223.076923076923" rx="8.44894167246" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--ok-text)">2. Caching</text>
  <text x="640" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--ok-text)">Cache before loops</text>
  <text x="640" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--ok-text)">Unpersist old</text>
  <text x="640" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--ok-text)">Serialized storage</text>
  <text x="640" y="246.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--ok-text)">Checkpoint lineage</text>

  <rect x="850" y="40" width="390" height="223.076923076923" rx="8.44894167246" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="84.615384615384" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--warn-text)">3. Serialization</text>
  <text x="1045" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--warn-text)">Kryo serializer</text>
  <text x="1045" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--warn-text)">Register classes</text>
  <text x="1045" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--warn-text)">Compact types</text>
  <text x="1045" y="246.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--warn-text)">Less overhead</text>

  <rect x="40" y="296.538461538461" width="390" height="223.076923076923" rx="8.44894167246" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="235" y="341.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--info-text)">4. Algorithm</text>
  <text x="235" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--info-text)">Prefer built-in</text>
  <text x="235" y="424.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--info-text)">Set maxIterations</text>
  <text x="235" y="463.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--info-text)">Tune tolerance</text>
  <text x="235" y="502.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--info-text)">Approximate if OK</text>

  <rect x="445" y="296.538461538461" width="390" height="223.076923076923" rx="8.44894167246" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="341.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--primary-text)">5. Data Reduction</text>
  <text x="640" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--primary-text)">Filter early</text>
  <text x="640" y="424.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--primary-text)">Subgraph views</text>
  <text x="640" y="463.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--primary-text)">Drop low-degree nodes</text>
  <text x="640" y="502.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--primary-text)">Sample big graphs</text>

  <rect x="850" y="296.538461538461" width="390" height="223.076923076923" rx="8.44894167246" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="341.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--danger-text)">6. Resources</text>
  <text x="1045" y="385.769230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--danger-text)">More executor mem</text>
  <text x="1045" y="424.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--danger-text)">memoryOverhead</text>
  <text x="1045" y="463.846153846153" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--danger-text)">Tune parallelism</text>
  <text x="1045" y="502.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--danger-text)">Watch GC</text>

  <rect x="240" y="547.5" width="800" height="72.500000000001" rx="8.44894167246" fill="var(--surface)" stroke="var(--border)"/>
  <text x="640" y="586.538461538461" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.010118763033" font-weight="bold" fill="var(--text)">Impact: Partition &gt; Cache &gt; Algorithm &gt; Resources</text>
  <text x="640" y="611.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" fill="var(--text-muted)">Profile first</text>
</svg>

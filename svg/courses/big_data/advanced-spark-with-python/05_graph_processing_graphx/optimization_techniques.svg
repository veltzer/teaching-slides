<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="604.8946" y="48.6076" text-anchor="middle" font-family="Arial" font-size="27.2203" font-weight="bold" fill="#1a237e">Graph Optimization Techniques</ns0:text>
  <ns0:rect x="45.3671" y="89.1139" width="347.8144" height="178.2278" rx="12.0979" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.0245" />
  <ns0:text x="219.2743" y="126.3798" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="#1565c0">1. Partitioning</ns0:text>
  <ns0:text x="68.0506" y="162.0254" font-family="Arial" font-size="16.6346" fill="#333">- Choose right strategy</ns0:text>
  <ns0:text x="68.0506" y="191.1899" font-family="Arial" font-size="16.6346" fill="#333">- Balance partition sizes</ns0:text>
  <ns0:text x="68.0506" y="220.3545" font-family="Arial" font-size="16.6346" fill="#333">- Minimize cross-partition</ns0:text>
  <ns0:text x="68.0506" y="249.519" font-family="Arial" font-size="16.6346" fill="#333">  edges (less shuffle)</ns0:text>
  <ns0:rect x="430.9874" y="89.1139" width="347.8144" height="178.2278" rx="12.0979" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.0245" />
  <ns0:text x="604.8946" y="126.3798" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="#2e7d32">2. Caching</ns0:text>
  <ns0:text x="453.6709" y="162.0254" font-family="Arial" font-size="16.6346" fill="#333">- Cache before iterations</ns0:text>
  <ns0:text x="453.6709" y="191.1899" font-family="Arial" font-size="16.6346" fill="#333">- Unpersist old versions</ns0:text>
  <ns0:text x="453.6709" y="220.3545" font-family="Arial" font-size="16.6346" fill="#333">- Use serialized storage</ns0:text>
  <ns0:text x="453.6709" y="249.519" font-family="Arial" font-size="16.6346" fill="#333">- Checkpoint long lineages</ns0:text>
  <ns0:rect x="816.6077" y="89.1139" width="347.8144" height="178.2278" rx="12.0979" fill="#fff3e0" stroke="#e65100" stroke-width="3.0245" />
  <ns0:text x="990.5149" y="126.3798" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="#e65100">3. Serialization</ns0:text>
  <ns0:text x="839.2912" y="162.0254" font-family="Arial" font-size="16.6346" fill="#333">- Use Kryo serializer</ns0:text>
  <ns0:text x="839.2912" y="191.1899" font-family="Arial" font-size="16.6346" fill="#333">- Register graph classes</ns0:text>
  <ns0:text x="839.2912" y="220.3545" font-family="Arial" font-size="16.6346" fill="#333">- Reduce object overhead</ns0:text>
  <ns0:text x="839.2912" y="249.519" font-family="Arial" font-size="16.6346" fill="#333">- Compact data types</ns0:text>
  <ns0:rect x="45.3671" y="315.9494" width="347.8144" height="178.2278" rx="12.0979" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.0245" />
  <ns0:text x="219.2743" y="353.2152" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="#7b1fa2">4. Algorithm Choice</ns0:text>
  <ns0:text x="68.0506" y="388.8608" font-family="Arial" font-size="16.6346" fill="#333">- Use built-in when possible</ns0:text>
  <ns0:text x="68.0506" y="418.0253" font-family="Arial" font-size="16.6346" fill="#333">- Set maxIterations</ns0:text>
  <ns0:text x="68.0506" y="447.19" font-family="Arial" font-size="16.6346" fill="#333">- Tune tolerance (tol)</ns0:text>
  <ns0:text x="68.0506" y="476.3545" font-family="Arial" font-size="16.6346" fill="#333">- Approximate when ok</ns0:text>
  <ns0:rect x="430.9874" y="315.9494" width="347.8144" height="178.2278" rx="12.0979" fill="#e8f4f8" stroke="#2e7d32" stroke-width="3.0245" />
  <ns0:text x="604.8946" y="353.2152" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="#2e7d32">5. Data Reduction</ns0:text>
  <ns0:text x="453.6709" y="388.8608" font-family="Arial" font-size="16.6346" fill="#333">- Filter before processing</ns0:text>
  <ns0:text x="453.6709" y="418.0253" font-family="Arial" font-size="16.6346" fill="#333">- Use subgraph views</ns0:text>
  <ns0:text x="453.6709" y="447.19" font-family="Arial" font-size="16.6346" fill="#333">- Remove low-degree nodes</ns0:text>
  <ns0:text x="453.6709" y="476.3545" font-family="Arial" font-size="16.6346" fill="#333">- Sample large graphs</ns0:text>
  <ns0:rect x="816.6077" y="315.9494" width="347.8144" height="178.2278" rx="12.0979" fill="#fce4ec" stroke="#c62828" stroke-width="3.0245" />
  <ns0:text x="990.5149" y="353.2152" text-anchor="middle" font-family="Arial" font-size="19.6591" font-weight="bold" fill="#c62828">6. Resource Tuning</ns0:text>
  <ns0:text x="839.2912" y="388.8608" font-family="Arial" font-size="16.6346" fill="#333">- Increase executor memory</ns0:text>
  <ns0:text x="839.2912" y="418.0253" font-family="Arial" font-size="16.6346" fill="#333">- Set memoryOverhead</ns0:text>
  <ns0:text x="839.2912" y="447.19" font-family="Arial" font-size="16.6346" fill="#333">- Tune parallelism</ns0:text>
  <ns0:text x="839.2912" y="476.3545" font-family="Arial" font-size="16.6346" fill="#333">- Monitor GC pressure</ns0:text>
  <ns0:rect x="226.8355" y="550.8861" width="756.1182" height="89.1139" rx="12.0979" fill="#f5f5f5" stroke="#999" stroke-width="2.2684" />
  <ns0:text x="604.8946" y="586.5317" text-anchor="middle" font-family="Arial" font-size="18.1468" font-weight="bold" fill="#333">Impact Order: Partitioning &gt; Caching &gt; Algorithm &gt; Resource Tuning</ns0:text>
  <ns0:text x="604.8946" y="618.9367" text-anchor="middle" font-family="Arial" font-size="16.6346" fill="#666">Always profile before optimizing -- measure, don't guess</ns0:text>
</ns0:svg>
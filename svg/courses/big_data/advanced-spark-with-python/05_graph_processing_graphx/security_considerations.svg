<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="27.623" font-weight="bold" fill="var(--primary-accent)">Graph Security Considerations</text>
  <path d="M 639.9999 72.676 L 696.7568 97.1831 L 696.7568 154.3661 C 696.7568 203.3802 639.9999 236.0564 639.9999 236.0564 C 639.9999 236.0564 583.2432 203.3802 583.2432 154.3661 L 583.2432 97.1831 Z" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9425" />
  <text x="639.9999" y="167.4366" text-anchor="middle" font-family="Arial" font-size="24.5537" fill="var(--primary-accent)">🔒</text>
  <rect x="40" y="121.6901" width="372.9729" height="196.0564" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="162.5352" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)">Data Privacy</text>
  <text x="72.4324" y="200.1127" font-family="Arial" font-size="16.8807" fill="var(--text)">- PII in vertex properties</text>
  <text x="72.4324" y="229.5211" font-family="Arial" font-size="16.8807" fill="var(--text)">- Relationship sensitivity</text>
  <text x="72.4324" y="258.9296" font-family="Arial" font-size="16.8807" fill="var(--text)">- Data anonymization</text>
  <text x="72.4324" y="288.338" font-family="Arial" font-size="16.8807" fill="var(--text)">- GDPR compliance</text>
  <rect x="867.0271" y="121.6901" width="372.9729" height="196.0564" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="162.5352" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--warn-accent)">Access Control</text>
  <text x="899.4594" y="200.1127" font-family="Arial" font-size="16.8807" fill="var(--text)">- Role-based access (RBAC)</text>
  <text x="899.4594" y="229.5211" font-family="Arial" font-size="16.8807" fill="var(--text)">- Kerberos authentication</text>
  <text x="899.4594" y="258.9296" font-family="Arial" font-size="16.8807" fill="var(--text)">- Spark ACLs</text>
  <text x="899.4594" y="288.338" font-family="Arial" font-size="16.8807" fill="var(--text)">- Encryption at rest</text>
  <rect x="40" y="366.7606" width="372.9729" height="196.0564" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="407.6056" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--info-accent)">Network Security</text>
  <text x="72.4324" y="445.183" font-family="Arial" font-size="16.8807" fill="var(--text)">- TLS/SSL for transport</text>
  <text x="72.4324" y="474.5915" font-family="Arial" font-size="16.8807" fill="var(--text)">- Encrypted shuffles</text>
  <text x="72.4324" y="503.9999" font-family="Arial" font-size="16.8807" fill="var(--text)">- Secure cluster network</text>
  <text x="72.4324" y="533.4084" font-family="Arial" font-size="16.8807" fill="var(--text)">- Firewall configuration</text>
  <rect x="867.0271" y="366.7606" width="372.9729" height="196.0564" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="407.6056" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)">Audit and Monitoring</text>
  <text x="899.4594" y="445.183" font-family="Arial" font-size="16.8807" fill="var(--text)">- Query logging</text>
  <text x="899.4594" y="474.5915" font-family="Arial" font-size="16.8807" fill="var(--text)">- Access audit trails</text>
  <text x="899.4594" y="503.9999" font-family="Arial" font-size="16.8807" fill="var(--text)">- Anomaly detection</text>
  <text x="899.4594" y="533.4084" font-family="Arial" font-size="16.8807" fill="var(--text)">- Data lineage tracking</text>
  <line x1="412.9729" y1="219.7182" x2="583.2432" y2="154.3661" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138" />
  <line x1="867.0271" y1="219.7182" x2="696.7568" y2="154.3661" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138" />
  <line x1="412.9729" y1="464.7887" x2="583.2432" y2="236.0564" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138" />
  <line x1="867.0271" y1="464.7887" x2="696.7568" y2="236.0564" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138" />
  <text x="639.9999" y="620" text-anchor="middle" font-family="Arial" font-size="16.8807" fill="var(--text-faint)">Graph data often contains sensitive relationships -- security is critical</text>
</svg>
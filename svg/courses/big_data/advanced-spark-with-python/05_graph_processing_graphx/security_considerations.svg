  <text x="232" y="189" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">Data Privacy</text>
  <text x="80" y="230.4" font-family="Arial" font-size="17.6" fill="#333">- PII in vertex properties</text>
  <text x="80" y="262.8" font-family="Arial" font-size="17.6" fill="#333">- Relationship sensitivity</text>
  <text x="80" y="295.2" font-family="Arial" font-size="17.6" fill="#333">- Data anonymization</text>
  <text x="80" y="327.6" font-family="Arial" font-size="17.6" fill="#333">- GDPR compliance</text>
  <rect x="864" y="144" width="368" height="216" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="1048" y="189" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#e65100">Access Control</text>
  <text x="896" y="230.4" font-family="Arial" font-size="17.6" fill="#333">- Role-based access (RBAC)</text>
  <text x="896" y="262.8" font-family="Arial" font-size="17.6" fill="#333">- Kerberos authentication</text>
  <text x="896" y="295.2" font-family="Arial" font-size="17.6" fill="#333">- Spark ACLs</text>
  <text x="896" y="327.6" font-family="Arial" font-size="17.6" fill="#333">- Encryption at rest</text>
  <rect x="48" y="414" width="368" height="216" rx="12.8" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3.2" />
  <text x="232" y="459" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#7b1fa2">Network Security</text>
  <text x="80" y="500.4" font-family="Arial" font-size="17.6" fill="#333">- TLS/SSL for transport</text>
  <text x="80" y="532.8" font-family="Arial" font-size="17.6" fill="#333">- Encrypted shuffles</text>
  <text x="80" y="565.2" font-family="Arial" font-size="17.6" fill="#333">- Secure cluster network</text>
  <text x="80" y="597.6" font-family="Arial" font-size="17.6" fill="#333">- Firewall configuration</text>
  <rect x="864" y="414" width="368" height="216" rx="12.8" fill="#e0f2f1" stroke="#00695c" stroke-width="3.2" />
  <text x="1048" y="459" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#00695c">Audit and Monitoring</text>
  <text x="896" y="500.4" font-family="Arial" font-size="17.6" fill="#333">- Query logging</text>
  <text x="896" y="532.8" font-family="Arial" font-size="17.6" fill="#333">- Access audit trails</text>
  <text x="896" y="565.2" font-family="Arial" font-size="17.6" fill="#333">- Anomaly detection</text>
  <text x="896" y="597.6" font-family="Arial" font-size="17.6" fill="#333">- Data lineage tracking</text>

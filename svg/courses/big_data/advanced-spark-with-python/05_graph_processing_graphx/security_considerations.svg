  <ns0:text x="963.6782" y="173.7931" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#e65100">Access Control</ns0:text>
  <ns0:text x="823.908" y="211.8621" font-family="Arial" font-size="16.1839" fill="#333">- Role-based access (RBAC)</ns0:text>
  <ns0:text x="823.908" y="241.6552" font-family="Arial" font-size="16.1839" fill="#333">- Kerberos authentication</ns0:text>
  <ns0:text x="823.908" y="271.4483" font-family="Arial" font-size="16.1839" fill="#333">- Spark ACLs</ns0:text>
  <ns0:text x="823.908" y="301.2414" font-family="Arial" font-size="16.1839" fill="#333">- Encryption at rest</ns0:text>

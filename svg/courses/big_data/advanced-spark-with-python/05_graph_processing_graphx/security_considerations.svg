  <ns0:text x="213.3333" y="422.069" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#7b1fa2">Network Security</ns0:text>
  <ns0:text x="73.5632" y="460.1379" font-family="Arial" font-size="16.1839" fill="#333">- TLS/SSL for transport</ns0:text>
  <ns0:text x="73.5632" y="489.931" font-family="Arial" font-size="16.1839" fill="#333">- Encrypted shuffles</ns0:text>
  <ns0:text x="73.5632" y="519.7241" font-family="Arial" font-size="16.1839" fill="#333">- Secure cluster network</ns0:text>
  <ns0:text x="73.5632" y="549.5172" font-family="Arial" font-size="16.1839" fill="#333">- Firewall configuration</ns0:text>
  <ns0:rect x="794.4828" y="380.6897" width="338.3908" height="198.6207" rx="11.7701" fill="#e0f2f1" stroke="#00695c" stroke-width="2.9425" />
  <ns0:text x="963.6782" y="422.069" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#00695c">Audit and Monitoring</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="588.5057" y="49.6552" text-anchor="middle" font-family="Arial" font-size="26.4828" font-weight="bold" fill="var(--primary-accent)">Graph Security Considerations</text>
  <path d="M 588.5057 82.7586 L 640 107.5862 L 640 165.5172 C 640 215.1724 588.5057 248.2759 588.5057 248.2759 C 588.5057 248.2759 537.0115 215.1724 537.0115 165.5172 L 537.0115 107.5862 Z" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9425" />
  <text x="588.5057" y="178.7586" text-anchor="middle" font-family="Arial" font-size="23.5402" fill="var(--primary-accent)">🔒</text>
  <rect x="44.1379" y="132.4138" width="338.3908" height="198.6207" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.3333" y="173.7931" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">Data Privacy</text>
  <text x="73.5632" y="211.8621" font-family="Arial" font-size="16.1839" fill="var(--text)">- PII in vertex properties</text>
  <text x="73.5632" y="241.6552" font-family="Arial" font-size="16.1839" fill="var(--text)">- Relationship sensitivity</text>
  <text x="73.5632" y="271.4483" font-family="Arial" font-size="16.1839" fill="var(--text)">- Data anonymization</text>
  <text x="73.5632" y="301.2414" font-family="Arial" font-size="16.1839" fill="var(--text)">- GDPR compliance</text>
  <rect x="794.4828" y="132.4138" width="338.3908" height="198.6207" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="963.6782" y="173.7931" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--warn-accent)">Access Control</text>
  <text x="823.908" y="211.8621" font-family="Arial" font-size="16.1839" fill="var(--text)">- Role-based access (RBAC)</text>
  <text x="823.908" y="241.6552" font-family="Arial" font-size="16.1839" fill="var(--text)">- Kerberos authentication</text>
  <text x="823.908" y="271.4483" font-family="Arial" font-size="16.1839" fill="var(--text)">- Spark ACLs</text>
  <text x="823.908" y="301.2414" font-family="Arial" font-size="16.1839" fill="var(--text)">- Encryption at rest</text>
  <rect x="44.1379" y="380.6897" width="338.3908" height="198.6207" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="213.3333" y="422.069" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--info-accent)">Network Security</text>
  <text x="73.5632" y="460.1379" font-family="Arial" font-size="16.1839" fill="var(--text)">- TLS/SSL for transport</text>
  <text x="73.5632" y="489.931" font-family="Arial" font-size="16.1839" fill="var(--text)">- Encrypted shuffles</text>
  <text x="73.5632" y="519.7241" font-family="Arial" font-size="16.1839" fill="var(--text)">- Secure cluster network</text>
  <text x="73.5632" y="549.5172" font-family="Arial" font-size="16.1839" fill="var(--text)">- Firewall configuration</text>
  <rect x="794.4828" y="380.6897" width="338.3908" height="198.6207" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="963.6782" y="422.069" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">Audit and Monitoring</text>
  <text x="823.908" y="460.1379" font-family="Arial" font-size="16.1839" fill="var(--text)">- Query logging</text>
  <text x="823.908" y="489.931" font-family="Arial" font-size="16.1839" fill="var(--text)">- Access audit trails</text>
  <text x="823.908" y="519.7241" font-family="Arial" font-size="16.1839" fill="var(--text)">- Anomaly detection</text>
  <text x="823.908" y="549.5172" font-family="Arial" font-size="16.1839" fill="var(--text)">- Data lineage tracking</text>
  <line x1="382.5287" y1="231.7241" x2="537.0115" y2="165.5172" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138" />
  <line x1="794.4828" y1="231.7241" x2="640" y2="165.5172" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138" />
  <line x1="382.5287" y1="480" x2="537.0115" y2="248.2759" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138" />
  <line x1="794.4828" y1="480" x2="640" y2="248.2759" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138" />
  <text x="588.5057" y="637.2414" text-anchor="middle" font-family="Arial" font-size="16.1839" fill="var(--text-faint)">Graph data often contains sensitive relationships -- security is critical</text>
</svg>
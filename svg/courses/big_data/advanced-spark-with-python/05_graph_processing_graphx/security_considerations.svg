  <ns0:text x="213.3333" y="173.7931" text-anchor="middle" font-family="Arial" font-size="19.1264" font-weight="bold" fill="#2e7d32">Data Privacy</ns0:text>
  <ns0:text x="73.5632" y="211.8621" font-family="Arial" font-size="16.1839" fill="#333">- PII in vertex properties</ns0:text>
  <ns0:text x="73.5632" y="241.6552" font-family="Arial" font-size="16.1839" fill="#333">- Relationship sensitivity</ns0:text>
  <ns0:text x="73.5632" y="271.4483" font-family="Arial" font-size="16.1839" fill="#333">- Data anonymization</ns0:text>
  <ns0:text x="73.5632" y="301.2414" font-family="Arial" font-size="16.1839" fill="#333">- GDPR compliance</ns0:text>

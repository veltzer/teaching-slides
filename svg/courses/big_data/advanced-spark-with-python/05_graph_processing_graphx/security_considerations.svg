<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <path d="M 639.9999 40 L 696.7568 65.970207774554 L 696.7568 126.567111984857 C 696.7568 178.507421563827 639.9999 213.134435909991 639.9999 213.134435909991 C 639.9999 213.134435909991 583.2432 178.507421563827 583.2432 126.567111984857 L 583.2432 65.970207774554 Z" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9425"/>
  <text x="639.9999" y="140.417938917351" text-anchor="middle" font-size="25.276020326022" fill="var(--primary-accent)" font-family="Arial, sans-serif">🔒</text>
  <rect x="40" y="91.94030957897" width="372.9729" height="207.761238315879" rx="6.176507897227" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="135.223918556467" text-anchor="middle" font-size="20.53678581648" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Privacy</text>
  <text x="72.4324" y="175.044847293377" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- PII in vertex properties</text>
  <text x="72.4324" y="206.208969458675" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Relationship sensitivity</text>
  <text x="72.4324" y="237.373197594112" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Data anonymization</text>
  <text x="72.4324" y="268.537319759411" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- GDPR compliance</text>
  <rect x="867.0271" y="91.94030957897" width="372.9729" height="207.761238315879" rx="6.176507897227" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="135.223918556467" text-anchor="middle" font-size="20.53678581648" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Access Control</text>
  <text x="899.4594" y="175.044847293377" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Role-based access (RBAC)</text>
  <text x="899.4594" y="206.208969458675" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Kerberos authentication</text>
  <text x="899.4594" y="237.373197594112" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Spark ACLs</text>
  <text x="899.4594" y="268.537319759411" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Encryption at rest</text>
  <rect x="40" y="351.641857473818" width="372.9729" height="207.761238315879" rx="6.176507897227" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="394.925360481178" text-anchor="middle" font-size="20.53678581648" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Network Security</text>
  <text x="72.4324" y="434.746183247948" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- TLS/SSL for transport</text>
  <text x="72.4324" y="465.910411383385" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Encrypted shuffles</text>
  <text x="72.4324" y="497.074533548684" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Secure cluster network</text>
  <text x="72.4324" y="528.238761684121" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Firewall configuration</text>
  <rect x="867.0271" y="351.641857473818" width="372.9729" height="207.761238315879" rx="6.176507897227" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="394.925360481178" text-anchor="middle" font-size="20.53678581648" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Audit and Monitoring</text>
  <text x="899.4594" y="434.746183247948" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Query logging</text>
  <text x="899.4594" y="465.910411383385" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Access audit trails</text>
  <text x="899.4594" y="497.074533548684" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Anomaly detection</text>
  <text x="899.4594" y="528.238761684121" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">- Data lineage tracking</text>
  <line x1="412.9729" y1="195.820822766771" x2="583.2432" y2="126.567111984857" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138"/>
  <line x1="867.0271" y1="195.820822766771" x2="696.7568" y2="126.567111984857" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138"/>
  <line x1="412.9729" y1="455.522370661619" x2="583.2432" y2="213.134435909991" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138"/>
  <line x1="867.0271" y1="455.522370661619" x2="696.7568" y2="213.134435909991" stroke="var(--text-faint)" stroke-width="1.4713" stroke-dasharray="5.8851 4.4138"/>
  <text x="639.9999" y="620" text-anchor="middle" font-size="17.377296143452" fill="var(--text-faint)" font-family="Arial, sans-serif">Graph data often contains sensitive relationships -- security is critical</text>
</svg>

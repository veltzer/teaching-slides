  <ns0:text x="823.908" y="489.931" font-family="Arial" font-size="16.1839" fill="#333">- Access audit trails</ns0:text>
  <ns0:text x="823.908" y="519.7241" font-family="Arial" font-size="16.1839" fill="#333">- Anomaly detection</ns0:text>
  <ns0:text x="823.908" y="549.5172" font-family="Arial" font-size="16.1839" fill="#333">- Data lineage tracking</ns0:text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</ns0:defs>
  <ns0:text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial" font-size="26.5974" font-weight="bold" fill="var(--primary-deeper)">Triangle Counting Algorithm</ns0:text>
  <ns0:rect x="29.5527" y="83.1169" width="502.3954" height="498.7013" rx="14.7763" fill="var(--surface-light)" stroke="var(--border-softer)" stroke-width="1.4776" />
  <ns0:text x="280.7504" y="124.6753" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-dk)">Triangle Detected</ns0:text>
  <ns0:circle cx="280.7504" cy="199.4805" r="44.329" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="2.9553" />
  <ns0:text x="280.7504" y="192.8312" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--text-dark)">A</ns0:text>
  <ns0:text x="280.7504" y="219.4286" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">count=1</ns0:text>
  <ns0:circle cx="147.7633" cy="432.2078" r="44.329" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="2.9553" />
  <ns0:text x="147.7633" y="425.5584" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--text-dark)">B</ns0:text>
  <ns0:text x="147.7633" y="452.1558" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">count=1</ns0:text>
  <ns0:circle cx="413.7374" cy="432.2078" r="44.329" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="2.9553" />
  <ns0:text x="413.7374" y="425.5584" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--text-dark)">C</ns0:text>
  <ns0:text x="413.7374" y="452.1558" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">count=1</ns0:text>
  <ns0:line x1="246.7648" y1="237.7143" x2="174.3608" y2="390.6494" stroke="var(--warn-mid)" stroke-width="4.4329" />
  <ns0:line x1="314.7359" y1="237.7143" x2="387.14" y2="390.6494" stroke="var(--warn-mid)" stroke-width="4.4329" />
  <ns0:line x1="192.0924" y1="432.2078" x2="369.4084" y2="432.2078" stroke="var(--warn-mid)" stroke-width="4.4329" />
  <ns0:polygon points="280.7504,199.4805 147.7633,432.2078 413.7374,432.2078" fill="var(--warn-pale)" fill-opacity="0.4" stroke="none" />
  <ns0:rect x="591.0534" y="83.1169" width="561.5007" height="498.7013" rx="14.7763" fill="var(--surface)" stroke="var(--text-faintest)" stroke-width="1.4776" />
  <ns0:text x="871.8038" y="132.987" text-anchor="middle" font-family="Arial" font-size="20.6869" font-weight="bold" fill="var(--text-dark)">Algorithm Steps</ns0:text>
  <ns0:rect x="620.6061" y="157.9221" width="502.3954" height="66.4935" rx="8.8658" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.2165" />
  <ns0:text x="635.3824" y="197.8182" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">1. For each edge (u,v), find common neighbors</ns0:text>
  <ns0:rect x="620.6061" y="241.039" width="502.3954" height="66.4935" rx="8.8658" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.2165" />
  <ns0:text x="635.3824" y="280.9351" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">2. If neighbor w connects to both u and v</ns0:text>
  <ns0:rect x="620.6061" y="324.1558" width="502.3954" height="66.4935" rx="8.8658" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.2165" />
  <ns0:text x="635.3824" y="364.0519" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">3. Triangle (u, v, w) is found</ns0:text>
  <ns0:rect x="620.6061" y="407.2727" width="502.3954" height="66.4935" rx="8.8658" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="2.2165" />
  <ns0:text x="635.3824" y="447.1688" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">4. Increment count for each vertex</ns0:text>
  <ns0:rect x="620.6061" y="498.7013" width="502.3954" height="59.8442" rx="8.8658" fill="var(--primary-pale2)" stroke="var(--ok-dk)" stroke-width="2.9553" />
  <ns0:text x="871.8038" y="536.9351" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--ok-dk)">Result: triangleCount per vertex</ns0:text>
  <ns0:text x="591.0534" y="640" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text-faint)">Complexity: O(E^1.5) -- useful for measuring network clustering</ns0:text>
</ns0:svg>
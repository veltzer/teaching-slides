<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial" font-size="26.5974" font-weight="bold" fill="var(--primary-accent)">Triangle Counting Algorithm</text>
  <rect x="29.5527" y="83.1169" width="502.3954" height="498.7013" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="280.7504" y="124.6753" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">Triangle Detected</text>
  <circle cx="280.7504" cy="199.4805" r="44.329" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9553" />
  <text x="280.7504" y="192.8312" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--text)">A</text>
  <text x="280.7504" y="219.4286" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">count=1</text>
  <circle cx="147.7633" cy="432.2078" r="44.329" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9553" />
  <text x="147.7633" y="425.5584" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--text)">B</text>
  <text x="147.7633" y="452.1558" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">count=1</text>
  <circle cx="413.7374" cy="432.2078" r="44.329" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9553" />
  <text x="413.7374" y="425.5584" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--text)">C</text>
  <text x="413.7374" y="452.1558" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">count=1</text>
  <line x1="246.7648" y1="237.7143" x2="174.3608" y2="390.6494" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="314.7359" y1="237.7143" x2="387.14" y2="390.6494" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="192.0924" y1="432.2078" x2="369.4084" y2="432.2078" stroke="var(--warn-border)" stroke-width="2" />
  <polygon points="280.7504,199.4805 147.7633,432.2078 413.7374,432.2078" fill="var(--warn-fill)" fill-opacity="0.4" stroke="none" />
  <rect x="591.0534" y="83.1169" width="561.5007" height="498.7013" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="871.8038" y="132.987" text-anchor="middle" font-family="Arial" font-size="20.6869" font-weight="bold" fill="var(--text)">Algorithm Steps</text>
  <rect x="620.6061" y="157.9221" width="502.3954" height="66.4935" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="635.3824" y="197.8182" font-family="Arial" font-size="17.7316" fill="var(--text)">1. For each edge (u,v), find common neighbors</text>
  <rect x="620.6061" y="241.039" width="502.3954" height="66.4935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="635.3824" y="280.9351" font-family="Arial" font-size="17.7316" fill="var(--text)">2. If neighbor w connects to both u and v</text>
  <rect x="620.6061" y="324.1558" width="502.3954" height="66.4935" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="635.3824" y="364.0519" font-family="Arial" font-size="17.7316" fill="var(--text)">3. Triangle (u, v, w) is found</text>
  <rect x="620.6061" y="407.2727" width="502.3954" height="66.4935" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="635.3824" y="447.1688" font-family="Arial" font-size="17.7316" fill="var(--text)">4. Increment count for each vertex</text>
  <rect x="620.6061" y="498.7013" width="502.3954" height="59.8442" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="871.8038" y="536.9351" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Result: triangleCount per vertex</text>
  <text x="591.0534" y="640" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text-faint)">Complexity: O(E^1.5) -- useful for measuring network clustering</text>
</svg>
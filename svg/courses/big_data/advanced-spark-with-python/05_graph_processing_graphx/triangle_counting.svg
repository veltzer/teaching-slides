<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="27.2571" font-weight="bold" fill="var(--primary-accent)">Triangle Counting Algorithm</text>
  <rect x="40" y="72.6761" width="536.8421" height="490.1408" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="308.4211" y="113.5211" text-anchor="middle" font-family="Arial" font-size="19.6857" font-weight="bold" fill="var(--primary-accent)">Triangle Detected</text>
  <rect x="262.993" y="141.614" width="90.857" height="90.857" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9553" filter="url(#shadow)"/>
  <text x="308.4211" y="180.5071" text-anchor="middle" font-family="Arial" font-size="19.6857" font-weight="bold" fill="var(--text)">A</text>
  <text x="308.4211" y="206.6479" text-anchor="middle" font-family="Arial" font-size="15.1428" fill="var(--text-muted)">count=1</text>
  <rect x="120.887" y="370.346" width="90.857" height="90.857" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9553" filter="url(#shadow)"/>
  <text x="166.3157" y="409.2394" text-anchor="middle" font-family="Arial" font-size="19.6857" font-weight="bold" fill="var(--text)">B</text>
  <text x="166.3157" y="435.3802" text-anchor="middle" font-family="Arial" font-size="15.1428" fill="var(--text-muted)">count=1</text>
  <rect x="405.098" y="370.346" width="90.857" height="90.857" rx="14" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9553" filter="url(#shadow)"/>
  <text x="450.5263" y="409.2394" text-anchor="middle" font-family="Arial" font-size="19.6857" font-weight="bold" fill="var(--text)">C</text>
  <text x="450.5263" y="435.3802" text-anchor="middle" font-family="Arial" font-size="15.1428" fill="var(--text-muted)">count=1</text>
  <line x1="272.1052" y1="224.6198" x2="194.7369" y2="374.9296" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="344.7368" y1="224.6198" x2="422.1053" y2="374.9296" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="213.6842" y1="415.7747" x2="403.1579" y2="415.7747" stroke="var(--warn-border)" stroke-width="2" />
  <polygon points="308.4211,187.0423 166.3157,415.7747 450.5263,415.7747" fill="var(--warn-fill)" fill-opacity="0.4" stroke="none" />
  <rect x="640" y="72.6761" width="600" height="490.1408" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="940.0001" y="121.6902" text-anchor="middle" font-family="Arial" font-size="21.2" font-weight="bold" fill="var(--text)">Algorithm Steps</text>
  <rect x="671.579" y="146.1972" width="536.8421" height="65.3521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="687.3684" y="185.4085" font-family="Arial" font-size="18.1714" fill="var(--text)">1. For each edge (u,v), find common neighbors</text>
  <rect x="671.579" y="227.8874" width="536.8421" height="65.3521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="687.3684" y="267.0986" font-family="Arial" font-size="18.1714" fill="var(--text)">2. If neighbor w connects to both u and v</text>
  <rect x="671.579" y="309.5774" width="536.8421" height="65.3521" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="687.3684" y="348.7887" font-family="Arial" font-size="18.1714" fill="var(--text)">3. Triangle (u, v, w) is found</text>
  <rect x="671.579" y="391.2676" width="536.8421" height="65.3521" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="687.3684" y="430.4789" font-family="Arial" font-size="18.1714" fill="var(--text)">4. Increment count for each vertex</text>
  <rect x="671.579" y="481.1268" width="536.8421" height="58.8169" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0001" y="518.7043" text-anchor="middle" font-family="Arial" font-size="18.1714" font-weight="bold" fill="var(--ok-accent)">Result: triangleCount per vertex</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial" font-size="16.6572" fill="var(--text-faint)">Complexity: O(E^1.5) -- useful for measuring network clustering</text>
</svg>
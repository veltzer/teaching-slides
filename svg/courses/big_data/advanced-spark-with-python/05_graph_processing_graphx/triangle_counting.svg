<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="536.8421" height="519.40297874805" rx="6.176508461473" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="308.4211" y="83.283510915566" text-anchor="middle" font-size="20.264815436669" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Triangle Detected</text>
  <rect x="262.993" y="113.053601350133" width="90.857" height="96.281306188164" rx="14.41185307677" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9553" filter="url(#shadow)"/>
  <text x="308.4211" y="154.268680757409" text-anchor="middle" font-size="20.264815436669" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A</text>
  <text x="308.4211" y="181.970127743371" text-anchor="middle" font-size="15.588272055065" fill="var(--text-muted)" font-family="Arial, sans-serif">count=1</text>
  <rect x="120.887" y="355.441262477301" width="90.857" height="96.281306188164" rx="14.41185307677" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9553" filter="url(#shadow)"/>
  <text x="166.3157" y="396.65665979505" text-anchor="middle" font-size="20.264815436669" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">B</text>
  <text x="166.3157" y="424.358106781012" text-anchor="middle" font-size="15.588272055065" fill="var(--text-muted)" font-family="Arial, sans-serif">count=1</text>
  <rect x="405.098" y="355.441262477301" width="90.857" height="96.281306188164" rx="14.41185307677" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9553" filter="url(#shadow)"/>
  <text x="450.5263" y="396.65665979505" text-anchor="middle" font-size="20.264815436669" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">C</text>
  <text x="450.5263" y="424.358106781012" text-anchor="middle" font-size="15.588272055065" fill="var(--text-muted)" font-family="Arial, sans-serif">count=1</text>
  <line x1="272.1052" y1="201.014978516378" x2="194.7369" y2="360.298510625975" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="344.7368" y1="201.014978516378" x2="422.1053" y2="360.298510625975" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="213.6842" y1="403.582127511698" x2="403.1579" y2="403.582127511698" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="308.4211,161.194042503899 166.3157,403.582127511698 450.5263,403.582127511698" fill="var(--warn-fill)" fill-opacity="0.4" stroke="none"/>
  <rect x="640" y="40" width="600" height="519.40297874805" rx="6.176508461473" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940.0001" y="91.940319068837" text-anchor="middle" font-size="21.823663230537" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Algorithm Steps</text>
  <rect x="671.579" y="117.910425618176" width="536.8421" height="69.253723435063" rx="6.176508461473" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="687.3684" y="159.462702067277" font-size="18.705967642801" fill="var(--text)" font-family="Arial, sans-serif">1. For each edge (u,v), find common neighbors</text>
  <rect x="671.579" y="204.477659389623" width="536.8421" height="69.253723435063" rx="6.176508461473" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="687.3684" y="246.029829868566" font-size="18.705967642801" fill="var(--text)" font-family="Arial, sans-serif">2. If neighbor w connects to both u and v</text>
  <rect x="671.579" y="291.044681220754" width="536.8421" height="69.253723435063" rx="6.176508461473" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="687.3684" y="332.596957669855" font-size="18.705967642801" fill="var(--text)" font-family="Arial, sans-serif">3. Triangle (u, v, w) is found</text>
  <rect x="671.579" y="377.611914992201" width="536.8421" height="69.253723435063" rx="6.176508461473" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="687.3684" y="419.164191441302" font-size="18.705967642801" fill="var(--text)" font-family="Arial, sans-serif">4. Increment count for each vertex</text>
  <rect x="671.579" y="472.835850946761" width="536.8421" height="62.328361688572" rx="6.176508461473" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940.0001" y="512.656786959239" text-anchor="middle" font-size="18.705967642801" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Result: triangleCount per vertex</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.147222790741" fill="var(--text-faint)" font-family="Arial, sans-serif">Complexity: O(E^1.5) -- useful for measuring network clustering</text>
</svg>

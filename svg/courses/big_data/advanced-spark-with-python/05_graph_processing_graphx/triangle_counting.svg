<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">Triangle Counting Algorithm</text>

  <!-- Triangle 1 highlighted -->
  <rect x="20" y="50" width="340" height="300" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="190" y="75" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Triangle Detected</text>

  <!-- Node A -->
  <circle cx="190" cy="120" r="30" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="190" y="116" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">A</text>
  <text x="190" y="132" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">count=1</text>

  <!-- Node B -->
  <circle cx="100" cy="260" r="30" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="100" y="256" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">B</text>
  <text x="100" y="272" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">count=1</text>

  <!-- Node C -->
  <circle cx="280" cy="260" r="30" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="280" y="256" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">C</text>
  <text x="280" y="272" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">count=1</text>

  <!-- Triangle edges (highlighted) -->
  <line x1="167" y1="143" x2="118" y2="235" stroke="#f57c00" stroke-width="3"/>
  <line x1="213" y1="143" x2="262" y2="235" stroke="#f57c00" stroke-width="3"/>
  <line x1="130" y1="260" x2="250" y2="260" stroke="#f57c00" stroke-width="3"/>

  <!-- Triangle fill (semi-transparent) -->
  <polygon points="190,120 100,260 280,260" fill="#fff3e0" fill-opacity="0.4" stroke="none"/>

  <!-- Right side: Algorithm steps -->
  <rect x="400" y="50" width="380" height="300" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="590" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Algorithm Steps</text>

  <!-- Step 1 -->
  <rect x="420" y="95" width="340" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="430" y="119" font-family="Arial" font-size="12" fill="#333">1. For each edge (u,v), find common neighbors</text>

  <!-- Step 2 -->
  <rect x="420" y="145" width="340" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="430" y="169" font-family="Arial" font-size="12" fill="#333">2. If neighbor w connects to both u and v</text>

  <!-- Step 3 -->
  <rect x="420" y="195" width="340" height="40" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="430" y="219" font-family="Arial" font-size="12" fill="#333">3. Triangle (u, v, w) is found</text>

  <!-- Step 4 -->
  <rect x="420" y="245" width="340" height="40" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="430" y="269" font-family="Arial" font-size="12" fill="#333">4. Increment count for each vertex</text>

  <!-- Result -->
  <rect x="420" y="300" width="340" height="36" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="590" y="323" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00695c">Result: triangleCount per vertex</text>

  <!-- Bottom note -->
  <text x="400" y="385" text-anchor="middle" font-family="Arial" font-size="11" fill="#888">Complexity: O(E^1.5) -- useful for measuring network clustering</text>
</svg>

  <rect x="40" y="371.05306625067" width="325.810697" height="248.94693374933" rx="6.221086429683" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.905399" y="415.507906507254" text-anchor="middle" font-size="22.46514770071" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Edges</text>
  <text x="202.905399" y="459.962746763838" text-anchor="middle" font-size="19.255781545204" fill="var(--text)" font-family="Arial, sans-serif">(1, 2, "friend")</text>
  <text x="202.905399" y="495.526533125335" text-anchor="middle" font-size="19.255781545204" fill="var(--text)" font-family="Arial, sans-serif">(1, 3, "colleague")</text>
  <text x="202.905399" y="531.090426791545" text-anchor="middle" font-size="19.255781545204" fill="var(--text)" font-family="Arial, sans-serif">(2, 4, "friend")</text>
  <text x="202.905399" y="566.654213153042" text-anchor="middle" font-size="19.255781545204" fill="var(--text)" font-family="Arial, sans-serif">(3, 5, "colleague")</text>
  <line x1="365.810697" y1="264.361492556753" x2="512.425566" y2="264.361492556753" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="439.118132" y="246.579599376005" text-anchor="middle" font-size="17.651202573379" fill="var(--text-muted)" font-family="Arial, sans-serif">create</text>
  <rect x="528.716196" y="175.451919348298" width="260.648578" height="177.819253721623" rx="6.221086429683" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="659.040435" y="237.68865278563" text-anchor="middle" font-size="25.674410268228" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">GraphFrame</text>
  <text x="659.040435" y="273.252439147127" text-anchor="middle" font-size="17.651202573379" fill="var(--text-muted)" font-family="Arial, sans-serif">vertices + edges</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="642.749805" y="40" text-anchor="middle" font-size="27.883326" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Graph Construction</text>
  <rect x="40" y="89.7143" width="325.810697" height="265.1429" rx="6.005606" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.905399" y="131.1429" text-anchor="middle" font-size="21.68702" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Vertices</text>
  <text x="202.905399" y="172.5715" text-anchor="middle" font-size="18.588817" fill="var(--text)" font-family="Arial, sans-serif">(1, "Alice")</text>
  <text x="202.905399" y="205.7143" text-anchor="middle" font-size="18.588817" fill="var(--text)" font-family="Arial, sans-serif">(2, "Bob")</text>
  <text x="202.905399" y="238.8572" text-anchor="middle" font-size="18.588817" fill="var(--text)" font-family="Arial, sans-serif">(3, "Charlie")</text>
  <text x="202.905399" y="272" text-anchor="middle" font-size="18.588817" fill="var(--text)" font-family="Arial, sans-serif">(4, "Diana")</text>
  <text x="202.905399" y="305.1429" text-anchor="middle" font-size="18.588817" fill="var(--text)" font-family="Arial, sans-serif">(5, "Eve")</text>
  <rect x="40" y="388" width="325.810697" height="232" rx="6.005606" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.905399" y="429.4286" text-anchor="middle" font-size="21.68702" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Edges</text>
  <text x="202.905399" y="470.8572" text-anchor="middle" font-size="18.588817" fill="var(--text)" font-family="Arial, sans-serif">(1, 2, "friend")</text>
  <text x="202.905399" y="504" text-anchor="middle" font-size="18.588817" fill="var(--text)" font-family="Arial, sans-serif">(1, 3, "colleague")</text>
  <text x="202.905399" y="537.1429" text-anchor="middle" font-size="18.588817" fill="var(--text)" font-family="Arial, sans-serif">(2, 4, "friend")</text>
  <text x="202.905399" y="570.2857" text-anchor="middle" font-size="18.588817" fill="var(--text)" font-family="Arial, sans-serif">(3, 5, "colleague")</text>
  <line x1="365.810697" y1="288.5714" x2="512.425566" y2="288.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="439.118132" y="272" text-anchor="middle" font-size="17.039816" fill="var(--text-muted)" font-family="Arial, sans-serif">create</text>
  <rect x="528.716196" y="205.7143" width="260.648578" height="165.7143" rx="6.005606" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="659.040435" y="263.7143" text-anchor="middle" font-size="24.785123" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">GraphFrame</text>
  <text x="659.040435" y="296.8571" text-anchor="middle" font-size="17.039816" fill="var(--text-muted)" font-family="Arial, sans-serif">vertices + edges</text>
  <text x="659.040435" y="330" text-anchor="middle" font-size="17.039816" fill="var(--text-muted)" font-family="Arial, sans-serif">= property graph</text>
  <line x1="789.364674" y1="288.5714" x2="903.398483" y2="288.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="957.767683" y="79.4832" width="86.747959" height="86.7478" rx="14.000013" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="1001.141562" y="114.5715" text-anchor="middle" font-size="17.039816" fill="var(--text)" font-family="Arial, sans-serif">1</text>
  <text x="1001.141562" y="139.4285" text-anchor="middle" font-size="15.490814" fill="var(--text-muted)" font-family="Arial, sans-serif">Alice</text>
  <rect x="1153.252041" y="195.483" width="86.747959" height="86.7478" rx="14.000013" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="1196.62822" y="230.5714" text-anchor="middle" font-size="17.039816" fill="var(--text)" font-family="Arial, sans-serif">2</text>
  <text x="1196.62822" y="255.4286" text-anchor="middle" font-size="15.490814" fill="var(--text-muted)" font-family="Arial, sans-serif">Bob</text>
  <rect x="957.767683" y="311.483" width="86.747959" height="86.7478" rx="14.000013" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="1001.141562" y="346.5715" text-anchor="middle" font-size="17.039816" fill="var(--text)" font-family="Arial, sans-serif">3</text>
  <text x="1001.141562" y="371.4286" text-anchor="middle" font-size="15.490814" fill="var(--text-muted)" font-family="Arial, sans-serif">Charlie</text>
  <rect x="1153.252041" y="427.483" width="86.747959" height="86.7478" rx="14.000013" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="1196.62822" y="462.5714" text-anchor="middle" font-size="17.039816" fill="var(--text)" font-family="Arial, sans-serif">4</text>
  <text x="1196.62822" y="487.4286" text-anchor="middle" font-size="15.490814" fill="var(--text-muted)" font-family="Arial, sans-serif">Diana</text>
  <rect x="957.767683" y="526.912" width="86.747959" height="86.7478" rx="14.000013" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2.9942" filter="url(#shadow)"/>
  <text x="1001.141562" y="562" text-anchor="middle" font-size="17.039816" fill="var(--text)" font-family="Arial, sans-serif">5</text>
  <text x="1001.141562" y="586.8572" text-anchor="middle" font-size="15.490814" fill="var(--text-muted)" font-family="Arial, sans-serif">Eve</text>
  <line x1="1041.867837" y1="147.7143" x2="1160.788955" y2="205.7143" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1115.175471" y="164.2857" font-size="15.490814" fill="var(--warn-accent)" font-family="Arial, sans-serif">friend</text>
  <line x1="1001.141562" y1="169.2571" x2="1001.141562" y2="308.4571" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1025.577407" y="247.1428" font-size="15.490814" fill="var(--warn-accent)" font-family="Arial, sans-serif">colleague</text>
  <line x1="1196.62822" y1="285.2572" x2="1196.62822" y2="424.4572" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1221.063965" y="363.1429" font-size="15.490814" fill="var(--warn-accent)" font-family="Arial, sans-serif">friend</text>
  <line x1="1001.141562" y1="401.2571" x2="1001.141562" y2="523.8857" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1025.577407" y="470.8572" font-size="15.490814" fill="var(--warn-accent)" font-family="Arial, sans-serif">colleague</text>
</svg>

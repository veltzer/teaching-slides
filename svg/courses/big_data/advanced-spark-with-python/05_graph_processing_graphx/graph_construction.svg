<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-family="Arial" font-size="26.9474" font-weight="bold" fill="var(--primary-accent)">Graph Construction</text>
  <rect x="44.9123" y="101.0526" width="299.4152" height="269.4737" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="194.6199" y="143.1579" text-anchor="middle" font-family="Arial" font-size="20.9591" font-weight="bold" fill="var(--primary-accent)">Vertices</text>
  <text x="194.6199" y="185.2632" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text)">(1, "Alice")</text>
  <text x="194.6199" y="218.9474" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text)">(2, "Bob")</text>
  <text x="194.6199" y="252.6316" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text)">(3, "Charlie")</text>
  <text x="194.6199" y="286.3158" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text)">(4, "Diana")</text>
  <text x="194.6199" y="320" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text)">(5, "Eve")</text>
  <rect x="44.9123" y="404.2105" width="299.4152" height="235.7895" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="194.6199" y="446.3158" text-anchor="middle" font-family="Arial" font-size="20.9591" font-weight="bold" fill="var(--warn-accent)">Edges</text>
  <text x="194.6199" y="488.4211" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text)">(1, 2, "friend")</text>
  <text x="194.6199" y="522.1053" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text)">(1, 3, "colleague")</text>
  <text x="194.6199" y="555.7895" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text)">(2, 4, "friend")</text>
  <text x="194.6199" y="589.4737" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text)">(3, 5, "colleague")</text>
  <line x1="344.3275" y1="303.1579" x2="479.0643" y2="303.1579" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="411.6959" y="286.3158" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">create</text>
  <rect x="494.0351" y="218.9474" width="239.5322" height="168.4211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="613.8012" y="277.8947" text-anchor="middle" font-family="Arial" font-size="23.9532" font-weight="bold" fill="var(--ok-accent)">GraphFrame</text>
  <text x="613.8012" y="311.5789" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">vertices + edges</text>
  <text x="613.8012" y="345.2632" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">= property graph</text>
  <line x1="733.5673" y1="303.1579" x2="838.3626" y2="303.1579" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="928.1871" cy="134.7368" r="41.9181" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="928.1871" y="126.3158" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text)">1</text>

  <line x1="1107.8363" y1="299.7895" x2="1107.8363" y2="441.2632" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1130.2924" y="378.9474" font-family="Arial" font-size="14.9708" fill="var(--warn-accent)">friend</text>
  <line x1="928.1871" y1="417.6842" x2="928.1871" y2="542.3158" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="950.6433" y="488.4211" font-family="Arial" font-size="14.9708" fill="var(--warn-accent)">colleague</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="642.7487" y="40" text-anchor="middle" font-family="Arial" font-size="27.8833" font-weight="bold" fill="var(--primary-accent)">Graph Construction</text>
  <rect x="40" y="89.7143" width="325.8101" height="265.1429" rx="6.0056" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="202.9051" y="131.1429" text-anchor="middle" font-family="Arial" font-size="21.687" font-weight="bold" fill="var(--primary-accent)">Vertices</text>
  <text x="202.9051" y="172.5715" text-anchor="middle" font-family="Arial" font-size="18.5888" fill="var(--text)">(1, "Alice")</text>
  <text x="202.9051" y="205.7143" text-anchor="middle" font-family="Arial" font-size="18.5888" fill="var(--text)">(2, "Bob")</text>
  <text x="202.9051" y="238.8572" text-anchor="middle" font-family="Arial" font-size="18.5888" fill="var(--text)">(3, "Charlie")</text>
  <text x="202.9051" y="272" text-anchor="middle" font-family="Arial" font-size="18.5888" fill="var(--text)">(4, "Diana")</text>
  <text x="202.9051" y="305.1429" text-anchor="middle" font-family="Arial" font-size="18.5888" fill="var(--text)">(5, "Eve")</text>
  <rect x="40" y="388" width="325.8101" height="232" rx="6.0056" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="202.9051" y="429.4286" text-anchor="middle" font-family="Arial" font-size="21.687" font-weight="bold" fill="var(--warn-accent)">Edges</text>
  <text x="202.9051" y="470.8572" text-anchor="middle" font-family="Arial" font-size="18.5888" fill="var(--text)">(1, 2, "friend")</text>
  <text x="202.9051" y="504" text-anchor="middle" font-family="Arial" font-size="18.5888" fill="var(--text)">(1, 3, "colleague")</text>
  <text x="202.9051" y="537.1429" text-anchor="middle" font-family="Arial" font-size="18.5888" fill="var(--text)">(2, 4, "friend")</text>
  <text x="202.9051" y="570.2857" text-anchor="middle" font-family="Arial" font-size="18.5888" fill="var(--text)">(3, 5, "colleague")</text>
  <line x1="365.8101" y1="288.5714" x2="512.4247" y2="288.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="439.1174" y="272" text-anchor="middle" font-family="Arial" font-size="17.0398" fill="var(--text-muted)">create</text>
  <rect x="528.7153" y="205.7143" width="260.6481" height="165.7143" rx="6.0056" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="659.0393" y="263.7143" text-anchor="middle" font-family="Arial" font-size="24.7851" font-weight="bold" fill="var(--ok-accent)">GraphFrame</text>
  <text x="659.0393" y="296.8571" text-anchor="middle" font-family="Arial" font-size="17.0398" fill="var(--text-muted)">vertices + edges</text>
  <text x="659.0393" y="330" text-anchor="middle" font-family="Arial" font-size="17.0398" fill="var(--text-muted)">= property graph</text>
  <line x1="789.3633" y1="288.5714" x2="903.3969" y2="288.5714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <circle cx="1001.1398" cy="122.8571" r="43.3739" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="1001.1398" y="114.5715" text-anchor="middle" font-family="Arial" font-size="17.0398" fill="var(--text)">1</text>
  <text x="1001.1398" y="139.4285" text-anchor="middle" font-family="Arial" font-size="15.4908" fill="var(--text-muted)">Alice</text>
  <circle cx="1196.6261" cy="238.8572" r="43.3739" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="1196.6261" y="230.5714" text-anchor="middle" font-family="Arial" font-size="17.0398" fill="var(--text)">2</text>
  <text x="1196.6261" y="255.4286" text-anchor="middle" font-family="Arial" font-size="15.4908" fill="var(--text-muted)">Bob</text>
  <circle cx="1001.1398" cy="354.8571" r="43.3739" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="1001.1398" y="346.5715" text-anchor="middle" font-family="Arial" font-size="17.0398" fill="var(--text)">3</text>
  <text x="1001.1398" y="371.4286" text-anchor="middle" font-family="Arial" font-size="15.4908" fill="var(--text-muted)">Charlie</text>
  <circle cx="1196.6261" cy="470.8572" r="43.3739" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="1196.6261" y="462.5714" text-anchor="middle" font-family="Arial" font-size="17.0398" fill="var(--text)">4</text>
  <text x="1196.6261" y="487.4286" text-anchor="middle" font-family="Arial" font-size="15.4908" fill="var(--text-muted)">Diana</text>
  <circle cx="1001.1398" cy="570.2857" r="43.3739" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="1001.1398" y="562" text-anchor="middle" font-family="Arial" font-size="17.0398" fill="var(--text)">5</text>
  <text x="1001.1398" y="586.8572" text-anchor="middle" font-family="Arial" font-size="15.4908" fill="var(--text-muted)">Eve</text>
  <line x1="1041.866" y1="147.7143" x2="1160.7869" y2="205.7143" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1115.1735" y="164.2857" font-family="Arial" font-size="15.4908" fill="var(--warn-accent)">friend</text>
  <line x1="1001.1398" y1="169.2571" x2="1001.1398" y2="308.4571" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1025.5756" y="247.1428" font-family="Arial" font-size="15.4908" fill="var(--warn-accent)">colleague</text>
  <line x1="1196.6261" y1="285.2572" x2="1196.6261" y2="424.4572" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1221.0618" y="363.1429" font-family="Arial" font-size="15.4908" fill="var(--warn-accent)">friend</text>
  <line x1="1001.1398" y1="401.2571" x2="1001.1398" y2="523.8857" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1025.5756" y="470.8572" font-family="Arial" font-size="15.4908" fill="var(--warn-accent)">colleague</text>
</svg>
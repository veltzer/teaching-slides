<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">Graph Construction</text>

  <!-- Vertices list -->
  <rect x="30" y="60" width="200" height="160" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="130" y="85" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0">Vertices</text>
  <text x="130" y="110" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(1, "Alice")</text>
  <text x="130" y="130" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(2, "Bob")</text>
  <text x="130" y="150" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(3, "Charlie")</text>
  <text x="130" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(4, "Diana")</text>
  <text x="130" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(5, "Eve")</text>

  <!-- Edges list -->
  <rect x="30" y="240" width="200" height="140" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="130" y="265" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e65100">Edges</text>
  <text x="130" y="290" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(1, 2, "friend")</text>
  <text x="130" y="310" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(1, 3, "colleague")</text>
  <text x="130" y="330" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(2, 4, "friend")</text>
  <text x="130" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">(3, 5, "colleague")</text>

  <!-- Arrow to GraphFrame -->
  <line x1="230" y1="180" x2="320" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="170" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">create</text>

  <!-- GraphFrame box -->
  <rect x="330" y="130" width="160" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="410" y="165" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2e7d32">GraphFrame</text>
  <text x="410" y="185" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">vertices + edges</text>
  <text x="410" y="205" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">= property graph</text>

  <!-- Arrow to resulting graph -->
  <line x1="490" y1="180" x2="560" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Resulting graph visualization -->
  <!-- Node 1 - Alice -->
  <circle cx="620" cy="80" r="28" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="620" y="75" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">1</text>
  <text x="620" y="90" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Alice</text>

  <!-- Node 2 - Bob -->
  <circle cx="740" cy="150" r="28" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="740" y="145" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">2</text>
  <text x="740" y="160" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Bob</text>

  <!-- Node 3 - Charlie -->
  <circle cx="620" cy="220" r="28" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="620" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">3</text>
  <text x="620" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Charlie</text>

  <!-- Node 4 - Diana -->
  <circle cx="740" cy="290" r="28" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="740" y="285" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">4</text>
  <text x="740" y="300" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Diana</text>

  <!-- Node 5 - Eve -->
  <circle cx="620" cy="350" r="28" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
  <text x="620" y="345" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">5</text>
  <text x="620" y="360" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Eve</text>

  <!-- Edges -->
  <line x1="645" y1="95" x2="718" y2="130" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="105" font-family="Arial" font-size="10" fill="#e65100">friend</text>

  <line x1="620" y1="108" x2="620" y2="192" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="155" font-family="Arial" font-size="10" fill="#e65100">colleague</text>

  <line x1="740" y1="178" x2="740" y2="262" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="755" y="225" font-family="Arial" font-size="10" fill="#e65100">friend</text>

  <line x1="620" y1="248" x2="620" y2="322" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="290" font-family="Arial" font-size="10" fill="#e65100">colleague</text>
</svg>

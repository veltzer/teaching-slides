  <line x1="965.614" y1="160" x2="1074.9006" y2="218.9474" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1032.9825" y="176.8421" font-family="Arial" font-size="14.9708" fill="var(--warn-accent)">friend</text>

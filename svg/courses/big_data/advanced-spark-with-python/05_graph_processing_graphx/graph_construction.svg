  <text x="1107.8363" y="269.4737" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">Bob</text>
  <circle cx="928.1871" cy="370.5263" r="41.9181" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="928.1871" y="362.1053" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text)">3</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <!-- PLACEHOLDERSVG — replace with real diagram -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">Iteration 0 (uniform)</text>
  <rect x="40" y="58.125" width="249.9999" height="81.5625" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="90.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">A</text>
  <text x="165" y="123.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--primary-accent)">0.33</text>
  <line x1="289.9999" y1="97.9999" x2="390.0001" y2="97.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="415" y="58.125" width="249.9999" height="81.5625" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="90.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">B</text>
  <text x="540" y="123.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--primary-accent)">0.33</text>
  <line x1="665" y1="97.9999" x2="765" y2="97.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="790" y="58.125" width="249.9999" height="81.5625" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.0001" y="90.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">C</text>
  <text x="915.0001" y="123.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--primary-accent)">0.33</text>
  <text x="640" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">Iteration 1 (redistribute)</text>
  <text x="640" y="224.8749" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-faint)">PR(v) = (1-d)/N + d * SUM(PR(u)/out(u)), d=0.85</text>
  <rect x="40" y="243" width="249.9999" height="81.5625" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="275.6249" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">A</text>
  <text x="165" y="308.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--warn-accent)">0.21</text>
  <line x1="289.9999" y1="282.8749" x2="390.0001" y2="282.8749" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="415" y="243" width="249.9999" height="81.5625" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="275.6249" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">B</text>
  <text x="540" y="308.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--warn-accent)">0.33</text>
  <line x1="665" y1="282.8749" x2="765" y2="282.8749" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="790" y="243" width="249.9999" height="81.5625" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.0001" y="275.6249" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">C</text>
  <text x="915.0001" y="308.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--ok-accent)">0.46</text>
  <rect x="40" y="366.25" width="1200" height="99.6875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="402.4999" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" font-weight="bold" fill="var(--text)">After convergence</text>
  <text x="640" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9935" fill="var(--text-muted)">Vertices with more incoming links from important vertices get higher scores</text>
  <rect x="40" y="493.125" width="1200" height="126.875" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="529.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" font-weight="bold" fill="var(--text)">Applications</text>
  <text x="339.9999" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-muted)">Influence detection</text>
  <text x="640" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-muted)">Citation ranking</text>
  <text x="939.9999" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-muted)">Web page ranking</text>
  <text x="640" y="601.8749" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-muted)">Recommendation systems</text>
</svg>

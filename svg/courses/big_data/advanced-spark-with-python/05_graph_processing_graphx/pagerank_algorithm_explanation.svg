<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-pr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 7.4667,0" fill="#333" />
    </marker>
  </defs>
  <text x="585.6209" y="37.6471" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" font-weight="bold" fill="var(--text)">Iteration 0 (uniform)</text>
  <rect x="117.1242" y="56.4706" width="195.2069" height="84.7059" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="214.7277" y="90.353" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" font-weight="bold" fill="var(--text)">A</text>
  <text x="214.7277" y="124.2353" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5882" fill="var(--primary-accent)">0.33</text>
  <line x1="312.3311" y1="97.8823" x2="390.414" y2="97.8823" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pr)" />
  <rect x="409.9346" y="56.4706" width="195.2069" height="84.7059" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="507.5381" y="90.353" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" font-weight="bold" fill="var(--text)">B</text>
  <text x="507.5381" y="124.2353" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5882" fill="var(--primary-accent)">0.33</text>
  <line x1="605.1416" y1="97.8823" x2="683.2244" y2="97.8823" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pr)" />
  <rect x="702.7451" y="56.4706" width="195.2069" height="84.7059" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="800.3486" y="90.353" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" font-weight="bold" fill="var(--text)">C</text>
  <text x="800.3486" y="124.2353" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5882" fill="var(--primary-accent)">0.33</text>
  <text x="585.6209" y="197.6471" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" font-weight="bold" fill="var(--text)">Iteration 1 (redistribute)</text>
  <text x="585.6209" y="229.647" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" fill="var(--text-faint)">PR(v) = (1-d)/N + d * SUM(PR(u)/out(u)), d=0.85</text>
  <rect x="117.1242" y="248.4706" width="195.2069" height="84.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="214.7277" y="282.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" font-weight="bold" fill="var(--text)">A</text>
  <text x="214.7277" y="316.2353" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5882" fill="var(--warn-accent)">0.21</text>
  <line x1="312.3311" y1="289.8823" x2="390.414" y2="289.8823" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pr)" />
  <rect x="409.9346" y="248.4706" width="195.2069" height="84.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="507.5381" y="282.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" font-weight="bold" fill="var(--text)">B</text>
  <text x="507.5381" y="316.2353" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5882" fill="var(--warn-accent)">0.33</text>
  <line x1="605.1416" y1="289.8823" x2="683.2244" y2="289.8823" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pr)" />
  <rect x="702.7451" y="248.4706" width="195.2069" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="800.3486" y="282.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" font-weight="bold" fill="var(--text)">C</text>
  <text x="800.3486" y="316.2353" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5882" fill="var(--ok-accent)">0.46</text>
  <rect x="117.1242" y="376.4706" width="936.9934" height="103.5294" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="585.6209" y="414.1176" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5882" font-weight="bold" fill="var(--text)">After convergence</text>
  <text x="585.6209" y="451.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7059" fill="var(--text-muted)">Vertices with more incoming links from important vertices get higher scores</text>
  <rect x="117.1242" y="508.2353" width="936.9934" height="131.7647" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="585.6209" y="545.8823" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5882" font-weight="bold" fill="var(--text)">Applications</text>
  <text x="351.3725" y="583.5294" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" fill="var(--text-muted)">Influence detection</text>
  <text x="585.6209" y="583.5294" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" fill="var(--text-muted)">Citation ranking</text>
  <text x="819.8692" y="583.5294" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" fill="var(--text-muted)">Web page ranking</text>
  <text x="585.6209" y="621.1764" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4706" fill="var(--text-muted)">Recommendation systems</text>
</svg>
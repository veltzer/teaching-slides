<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-pr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 7.4667,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">Iteration 0 (uniform)</text>
  <rect x="40" y="58.125" width="249.9999" height="81.5625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="90.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">A</text>
  <text x="165" y="123.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--primary-accent)">0.33</text>
  <line x1="289.9999" y1="97.9999" x2="390.0001" y2="97.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pr)" />
  <rect x="415" y="58.125" width="249.9999" height="81.5625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="90.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">B</text>
  <text x="540" y="123.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--primary-accent)">0.33</text>
  <line x1="665" y1="97.9999" x2="765" y2="97.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pr)" />
  <rect x="790" y="58.125" width="249.9999" height="81.5625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.0001" y="90.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">C</text>
  <text x="915.0001" y="123.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--primary-accent)">0.33</text>
  <text x="640" y="194.0625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">Iteration 1 (redistribute)</text>
  <text x="640" y="224.8749" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-faint)">PR(v) = (1-d)/N + d * SUM(PR(u)/out(u)), d=0.85</text>
  <rect x="40" y="243" width="249.9999" height="81.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="275.6249" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">A</text>
  <text x="165" y="308.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--warn-accent)">0.21</text>
  <line x1="289.9999" y1="282.8749" x2="390.0001" y2="282.8749" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pr)" />
  <rect x="415" y="243" width="249.9999" height="81.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="275.6249" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">B</text>
  <text x="540" y="308.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--warn-accent)">0.33</text>
  <line x1="665" y1="282.8749" x2="765" y2="282.8749" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pr)" />
  <rect x="790" y="243" width="249.9999" height="81.5625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="915.0001" y="275.6249" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" font-weight="bold" fill="var(--text)">C</text>
  <text x="915.0001" y="308.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" fill="var(--ok-accent)">0.46</text>
  <rect x="40" y="366.25" width="1200" height="99.6875" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="402.4999" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" font-weight="bold" fill="var(--text)">After convergence</text>
  <text x="640" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9935" fill="var(--text-muted)">Vertices with more incoming links from important vertices get higher scores</text>
  <rect x="40" y="493.125" width="1200" height="126.875" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="529.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.0838" font-weight="bold" fill="var(--text)">Applications</text>
  <text x="339.9999" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-muted)">Influence detection</text>
  <text x="640" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-muted)">Citation ranking</text>
  <text x="939.9999" y="565.625" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-muted)">Web page ranking</text>
  <text x="640" y="601.8749" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.1741" fill="var(--text-muted)">Recommendation systems</text>
</svg>
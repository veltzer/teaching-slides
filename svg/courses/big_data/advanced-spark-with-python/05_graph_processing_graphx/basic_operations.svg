<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="48.787968778687" width="323.8095" height="79.090976584015" rx="6.179143483694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.9048" y="98.000084848476" text-anchor="middle" font-size="24.150667377394" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Input Graph</text>
  <rect x="516.1905" y="40" width="495.2381" height="73.818174104684" rx="6.179143483694" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="85.697055831029" text-anchor="middle" font-size="22.425656488196" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">mapVertices(func)</text>
  <line x1="363.8095" y1="87.454585950409" x2="506.6666" y2="76.909087052342" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="516.1905" y="136.666702020198" width="495.2381" height="73.818174104684" rx="6.179143483694" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="182.363757851227" text-anchor="middle" font-size="22.425656488196" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">mapEdges(func)</text>
  <line x1="363.8095" y1="87.454585950409" x2="506.6666" y2="173.57578907254" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="516.1905" y="233.333404040397" width="495.2381" height="73.818174104684" rx="6.179143483694" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="279.03035381083" text-anchor="middle" font-size="22.425656488196" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">filter(vpred, epred)</text>
  <line x1="363.8095" y1="87.454585950409" x2="506.6666" y2="270.242491092739" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="516.1905" y="330.000106060595" width="495.2381" height="73.818174104684" rx="6.179143483694" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="375.696949770434" text-anchor="middle" font-size="22.425656488196" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">subgraph(vpred, epred)</text>
  <line x1="363.8095" y1="87.454585950409" x2="506.6666" y2="366.909193112937" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="516.1905" y="426.666595959603" width="495.2381" height="73.818174104684" rx="6.179143483694" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="472.363651790632" text-anchor="middle" font-size="22.425656488196" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">reverse()</text>
  <line x1="363.8095" y1="87.454585950409" x2="506.6666" y2="463.57578907254" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1011.4286" y1="76.909087052342" x2="1144.7619" y2="76.909087052342" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1011.4286" y1="173.57578907254" x2="1144.7619" y2="173.57578907254" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1011.4286" y1="270.242491092739" x2="1144.7619" y2="270.242491092739" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1011.4286" y1="366.909193112937" x2="1144.7619" y2="366.909193112937" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1011.4286" y1="463.57578907254" x2="1144.7619" y2="463.57578907254" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1173.3334" y="83.939525711648" font-size="20.700542613274" fill="var(--text-muted)" font-family="Arial, sans-serif">New vertex properties</text>
  <text x="1173.3334" y="180.606121671252" font-size="20.700542613274" fill="var(--text-muted)" font-family="Arial, sans-serif">New edge properties</text>
  <text x="1173.3334" y="277.272717630855" font-size="20.700542613274" fill="var(--text-muted)" font-family="Arial, sans-serif">Filtered graph</text>
  <text x="1173.3334" y="373.939419651053" font-size="20.700542613274" fill="var(--text-muted)" font-family="Arial, sans-serif">Subgraph view</text>
  <text x="1173.3334" y="470.606121671252" font-size="20.700542613274" fill="var(--text-muted)" font-family="Arial, sans-serif">Reversed edges</text>
  <rect x="287.6191" y="549.696992194672" width="952.3809" height="70.303007805328" rx="6.179143483694" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.9883 4.4912"/>
  <text x="763.8095" y="593.63630578513" text-anchor="middle" font-size="20.700542613274" fill="var(--text-muted)" font-family="Arial, sans-serif">All operations return a new graph (immutable transformations)</text>
</svg>

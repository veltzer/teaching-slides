<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="763.8095" y="40" text-anchor="middle" font-size="30.1507" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Basic Graph Operations</text>
  <rect x="40" y="81.4286" width="323.8095" height="74.5715" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.9048" y="127.8286" text-anchor="middle" font-size="23.4505" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Input Graph</text>
  <rect x="516.1905" y="73.1428" width="495.2381" height="69.6" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="116.2286" text-anchor="middle" font-size="21.7755" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">mapVertices(func)</text>
  <line x1="363.8095" y1="117.8857" x2="506.6666" y2="107.9428" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="516.1905" y="164.2857" width="495.2381" height="69.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="207.3715" text-anchor="middle" font-size="21.7755" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">mapEdges(func)</text>
  <line x1="363.8095" y1="117.8857" x2="506.6666" y2="199.0857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="516.1905" y="255.4286" width="495.2381" height="69.6" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="298.5143" text-anchor="middle" font-size="21.7755" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">filter(vpred, epred)</text>
  <line x1="363.8095" y1="117.8857" x2="506.6666" y2="290.2286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="516.1905" y="346.5715" width="495.2381" height="69.6" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="389.6571" text-anchor="middle" font-size="21.7755" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">subgraph(vpred, epred)</text>
  <line x1="363.8095" y1="117.8857" x2="506.6666" y2="381.3715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="516.1905" y="437.7142" width="495.2381" height="69.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="763.8095" y="480.8" text-anchor="middle" font-size="21.7755" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">reverse()</text>
  <line x1="363.8095" y1="117.8857" x2="506.6666" y2="472.5143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1011.4286" y1="107.9428" x2="1144.7619" y2="107.9428" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1011.4286" y1="199.0857" x2="1144.7619" y2="199.0857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1011.4286" y1="290.2286" x2="1144.7619" y2="290.2286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1011.4286" y1="381.3715" x2="1144.7619" y2="381.3715" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1011.4286" y1="472.5143" x2="1144.7619" y2="472.5143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1173.3334" y="114.5715" font-size="20.1004" fill="var(--text-muted)" font-family="Arial, sans-serif">New vertex properties</text>
  <text x="1173.3334" y="205.7143" font-size="20.1004" fill="var(--text-muted)" font-family="Arial, sans-serif">New edge properties</text>
  <text x="1173.3334" y="296.8571" font-size="20.1004" fill="var(--text-muted)" font-family="Arial, sans-serif">Filtered graph</text>
  <text x="1173.3334" y="388" font-size="20.1004" fill="var(--text-muted)" font-family="Arial, sans-serif">Subgraph view</text>
  <text x="1173.3334" y="479.1429" font-size="20.1004" fill="var(--text-muted)" font-family="Arial, sans-serif">Reversed edges</text>
  <rect x="287.6191" y="553.7143" width="952.3809" height="66.2857" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.9883 4.4912" />
  <text x="763.8095" y="595.1428" text-anchor="middle" font-size="20.1004" fill="var(--text-muted)" font-family="Arial, sans-serif">All operations return a new graph (immutable transformations)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-family="Arial" font-size="26.9474" font-weight="bold" fill="var(--primary-accent)">Basic Graph Operations</text>
  <rect x="29.9415" y="92.6316" width="254.5029" height="75.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="157.193" y="139.7895" text-anchor="middle" font-family="Arial" font-size="20.9591" font-weight="bold" fill="var(--primary-accent)">Input Graph</text>
  <rect x="404.2105" y="84.2105" width="389.2398" height="70.7368" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="598.8304" y="128" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">mapVertices(func)</text>
  <line x1="284.4444" y1="129.6842" x2="396.7251" y2="119.5789" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="404.2105" y="176.8421" width="389.2398" height="70.7368" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="598.8304" y="220.6316" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--warn-accent)">mapEdges(func)</text>
  <line x1="284.4444" y1="129.6842" x2="396.7251" y2="212.2105" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="404.2105" y="269.4737" width="389.2398" height="70.7368" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="598.8304" y="313.2632" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--info-accent)">filter(vpred, epred)</text>
  <line x1="284.4444" y1="129.6842" x2="396.7251" y2="304.8421" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="404.2105" y="362.1053" width="389.2398" height="70.7368" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="598.8304" y="405.8947" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--danger-accent)">subgraph(vpred, epred)</text>
  <line x1="284.4444" y1="129.6842" x2="396.7251" y2="397.4737" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="404.2105" y="454.7368" width="389.2398" height="70.7368" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="598.8304" y="498.5263" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">reverse()</text>
  <line x1="284.4444" y1="129.6842" x2="396.7251" y2="490.1053" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="793.4503" y1="119.5789" x2="898.2456" y2="119.5789" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="793.4503" y1="212.2105" x2="898.2456" y2="212.2105" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="793.4503" y1="304.8421" x2="898.2456" y2="304.8421" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="793.4503" y1="397.4737" x2="898.2456" y2="397.4737" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="793.4503" y1="490.1053" x2="898.2456" y2="490.1053" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="920.7018" y="126.3158" font-family="Arial" font-size="17.9649" fill="var(--text-muted)">New vertex properties</text>
  <text x="920.7018" y="218.9474" font-family="Arial" font-size="17.9649" fill="var(--text-muted)">New edge properties</text>
  <text x="920.7018" y="311.5789" font-family="Arial" font-size="17.9649" fill="var(--text-muted)">Filtered graph</text>
  <text x="920.7018" y="404.2105" font-family="Arial" font-size="17.9649" fill="var(--text-muted)">Subgraph view</text>
  <text x="920.7018" y="496.8421" font-family="Arial" font-size="17.9649" fill="var(--text-muted)">Reversed edges</text>
  <rect x="224.5614" y="572.6316" width="748.538" height="67.3684" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="5.9883 4.4912" />
  <text x="598.8304" y="614.7368" text-anchor="middle" font-family="Arial" font-size="17.9649" fill="var(--text-muted)">All operations return a new graph (immutable transformations)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="29.8907" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark SQL Optimization Checklist</text>
  <rect x="40" y="68.2927" width="378.9474" height="551.7073" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.4737" y="103.6585" text-anchor="middle" font-size="20.9234" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Layer</text>
  <rect x="63.6842" y="124.878" width="331.5789" height="42.4391" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="153.1707" font-size="17.9344" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use Parquet/ORC format</text>
  <rect x="63.6842" y="181.4634" width="331.5789" height="42.4391" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="209.7561" font-size="17.9344" fill="var(--primary-accent)" font-family="Arial, sans-serif">Enable compression (Snappy)</text>
  <rect x="63.6842" y="238.0487" width="331.5789" height="42.4391" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="266.3414" font-size="17.9344" fill="var(--primary-accent)" font-family="Arial, sans-serif">Partition by common filters</text>
  <rect x="63.6842" y="294.6341" width="331.5789" height="42.4391" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="322.9269" font-size="17.9344" fill="var(--primary-accent)" font-family="Arial, sans-serif">Collect table statistics</text>
  <rect x="63.6842" y="351.2195" width="331.5789" height="42.4391" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="379.5122" font-size="17.9344" fill="var(--primary-accent)" font-family="Arial, sans-serif">Right-size file counts</text>
  <rect x="63.6842" y="407.8049" width="331.5789" height="42.4391" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="436.0976" font-size="17.9344" fill="var(--primary-accent)" font-family="Arial, sans-serif">Use explicit schemas</text>
  <rect x="450.5263" y="68.2927" width="378.9474" height="551.7073" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="103.6585" text-anchor="middle" font-size="20.9234" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Query Layer</text>
  <rect x="474.2105" y="124.878" width="331.5789" height="42.4391" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="153.1707" font-size="17.9344" fill="var(--ok-accent)" font-family="Arial, sans-serif">Select specific columns</text>
  <rect x="474.2105" y="181.4634" width="331.5789" height="42.4391" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="209.7561" font-size="17.9344" fill="var(--ok-accent)" font-family="Arial, sans-serif">Filter early (pushdown)</text>
  <rect x="474.2105" y="238.0487" width="331.5789" height="42.4391" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="266.3414" font-size="17.9344" fill="var(--ok-accent)" font-family="Arial, sans-serif">Use broadcast joins</text>
  <rect x="474.2105" y="294.6341" width="331.5789" height="42.4391" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="322.9269" font-size="17.9344" fill="var(--ok-accent)" font-family="Arial, sans-serif">Avoid UDFs if possible</text>
  <rect x="474.2105" y="351.2195" width="331.5789" height="42.4391" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="379.5122" font-size="17.9344" fill="var(--ok-accent)" font-family="Arial, sans-serif">Cache repeated queries</text>
  <rect x="474.2105" y="407.8049" width="331.5789" height="42.4391" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="436.0976" font-size="17.9344" fill="var(--ok-accent)" font-family="Arial, sans-serif">Match types in filters</text>
  <rect x="861.0526" y="68.2927" width="378.9474" height="551.7073" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.5264" y="103.6585" text-anchor="middle" font-size="20.9234" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Infrastructure</text>
  <rect x="884.7369" y="124.878" width="331.5789" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="153.1707" font-size="17.9344" fill="var(--warn-accent)" font-family="Arial, sans-serif">Enable AQE</text>
  <rect x="884.7369" y="181.4634" width="331.5789" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="209.7561" font-size="17.9344" fill="var(--warn-accent)" font-family="Arial, sans-serif">Enable CBO</text>
  <rect x="884.7369" y="238.0487" width="331.5789" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="266.3414" font-size="17.9344" fill="var(--warn-accent)" font-family="Arial, sans-serif">Tune shuffle partitions</text>
  <rect x="884.7369" y="294.6341" width="331.5789" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="322.9269" font-size="17.9344" fill="var(--warn-accent)" font-family="Arial, sans-serif">Configure memory fraction</text>
  <rect x="884.7369" y="351.2195" width="331.5789" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="379.5122" font-size="17.9344" fill="var(--warn-accent)" font-family="Arial, sans-serif">Monitor Spark UI metrics</text>
  <rect x="884.7369" y="407.8049" width="331.5789" height="42.4391" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="436.0976" font-size="17.9344" fill="var(--warn-accent)" font-family="Arial, sans-serif">Review explain() output</text>
  <text x="229.4737" y="506.8293" text-anchor="middle" font-size="17.9344" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Impact: High</text>
  <text x="229.4737" y="535.122" text-anchor="middle" font-size="16.4399" fill="var(--text)" font-family="Arial, sans-serif">Format + partitioning</text>
  <text x="229.4737" y="557.7561" text-anchor="middle" font-size="16.4399" fill="var(--text)" font-family="Arial, sans-serif">give biggest gains</text>
  <text x="640.0001" y="506.8293" text-anchor="middle" font-size="17.9344" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Impact: Medium</text>
  <text x="640.0001" y="535.122" text-anchor="middle" font-size="16.4399" fill="var(--text)" font-family="Arial, sans-serif">Query patterns affect</text>
  <text x="640.0001" y="557.7561" text-anchor="middle" font-size="16.4399" fill="var(--text)" font-family="Arial, sans-serif">plan quality</text>
  <text x="1050.5264" y="506.8293" text-anchor="middle" font-size="17.9344" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Impact: Varies</text>
  <text x="1050.5264" y="535.122" text-anchor="middle" font-size="16.4399" fill="var(--text)" font-family="Arial, sans-serif">Config tuning needs</text>
  <text x="1050.5264" y="557.7561" text-anchor="middle" font-size="16.4399" fill="var(--text)" font-family="Arial, sans-serif">workload testing</text>
</svg>
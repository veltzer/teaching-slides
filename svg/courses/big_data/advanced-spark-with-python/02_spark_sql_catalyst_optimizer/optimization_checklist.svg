<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640.0001" y="40" text-anchor="middle" font-family="Arial" font-size="29.8907" font-weight="bold" fill="var(--primary-accent)">Spark SQL Optimization Checklist</text>
  <rect x="40" y="68.2927" width="378.9474" height="551.7073" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="229.4737" y="103.6585" text-anchor="middle" font-family="Arial" font-size="20.9234" font-weight="bold" fill="var(--primary-accent)">Data Layer</text>
  <rect x="63.6842" y="124.878" width="331.5789" height="42.4391" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="153.1707" font-family="Arial" font-size="17.9344" fill="var(--primary-accent)">Use Parquet/ORC format</text>
  <rect x="63.6842" y="181.4634" width="331.5789" height="42.4391" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="209.7561" font-family="Arial" font-size="17.9344" fill="var(--primary-accent)">Enable compression (Snappy)</text>
  <rect x="63.6842" y="238.0487" width="331.5789" height="42.4391" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="266.3414" font-family="Arial" font-size="17.9344" fill="var(--primary-accent)">Partition by common filters</text>
  <rect x="63.6842" y="294.6341" width="331.5789" height="42.4391" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="322.9269" font-family="Arial" font-size="17.9344" fill="var(--primary-accent)">Collect table statistics</text>
  <rect x="63.6842" y="351.2195" width="331.5789" height="42.4391" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="379.5122" font-family="Arial" font-size="17.9344" fill="var(--primary-accent)">Right-size file counts</text>
  <rect x="63.6842" y="407.8049" width="331.5789" height="42.4391" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="87.3685" y="436.0976" font-family="Arial" font-size="17.9344" fill="var(--primary-accent)">Use explicit schemas</text>
  <rect x="450.5263" y="68.2927" width="378.9474" height="551.7073" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="103.6585" text-anchor="middle" font-family="Arial" font-size="20.9234" font-weight="bold" fill="var(--ok-accent)">Query Layer</text>
  <rect x="474.2105" y="124.878" width="331.5789" height="42.4391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="153.1707" font-family="Arial" font-size="17.9344" fill="var(--ok-accent)">Select specific columns</text>
  <rect x="474.2105" y="181.4634" width="331.5789" height="42.4391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="209.7561" font-family="Arial" font-size="17.9344" fill="var(--ok-accent)">Filter early (pushdown)</text>
  <rect x="474.2105" y="238.0487" width="331.5789" height="42.4391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="266.3414" font-family="Arial" font-size="17.9344" fill="var(--ok-accent)">Use broadcast joins</text>
  <rect x="474.2105" y="294.6341" width="331.5789" height="42.4391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="322.9269" font-family="Arial" font-size="17.9344" fill="var(--ok-accent)">Avoid UDFs if possible</text>
  <rect x="474.2105" y="351.2195" width="331.5789" height="42.4391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="379.5122" font-family="Arial" font-size="17.9344" fill="var(--ok-accent)">Cache repeated queries</text>
  <rect x="474.2105" y="407.8049" width="331.5789" height="42.4391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.8948" y="436.0976" font-family="Arial" font-size="17.9344" fill="var(--ok-accent)">Match types in filters</text>
  <rect x="861.0526" y="68.2927" width="378.9474" height="551.7073" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.5264" y="103.6585" text-anchor="middle" font-family="Arial" font-size="20.9234" font-weight="bold" fill="var(--warn-accent)">Infrastructure</text>
  <rect x="884.7369" y="124.878" width="331.5789" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="153.1707" font-family="Arial" font-size="17.9344" fill="var(--warn-accent)">Enable AQE</text>
  <rect x="884.7369" y="181.4634" width="331.5789" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="209.7561" font-family="Arial" font-size="17.9344" fill="var(--warn-accent)">Enable CBO</text>
  <rect x="884.7369" y="238.0487" width="331.5789" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="266.3414" font-family="Arial" font-size="17.9344" fill="var(--warn-accent)">Tune shuffle partitions</text>
  <rect x="884.7369" y="294.6341" width="331.5789" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="322.9269" font-family="Arial" font-size="17.9344" fill="var(--warn-accent)">Configure memory fraction</text>
  <rect x="884.7369" y="351.2195" width="331.5789" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="379.5122" font-family="Arial" font-size="17.9344" fill="var(--warn-accent)">Monitor Spark UI metrics</text>
  <rect x="884.7369" y="407.8049" width="331.5789" height="42.4391" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="908.4211" y="436.0976" font-family="Arial" font-size="17.9344" fill="var(--warn-accent)">Review explain() output</text>
  <text x="229.4737" y="506.8293" text-anchor="middle" font-family="Arial" font-size="17.9344" font-weight="bold" fill="var(--primary-accent)">Impact: High</text>
  <text x="229.4737" y="535.122" text-anchor="middle" font-family="Arial" font-size="16.4399" fill="var(--text)">Format + partitioning</text>
  <text x="229.4737" y="557.7561" text-anchor="middle" font-family="Arial" font-size="16.4399" fill="var(--text)">give biggest gains</text>
  <text x="640.0001" y="506.8293" text-anchor="middle" font-family="Arial" font-size="17.9344" font-weight="bold" fill="var(--ok-accent)">Impact: Medium</text>
  <text x="640.0001" y="535.122" text-anchor="middle" font-family="Arial" font-size="16.4399" fill="var(--text)">Query patterns affect</text>
  <text x="640.0001" y="557.7561" text-anchor="middle" font-family="Arial" font-size="16.4399" fill="var(--text)">plan quality</text>
  <text x="1050.5264" y="506.8293" text-anchor="middle" font-family="Arial" font-size="17.9344" font-weight="bold" fill="var(--warn-accent)">Impact: Varies</text>
  <text x="1050.5264" y="535.122" text-anchor="middle" font-family="Arial" font-size="16.4399" fill="var(--text)">Config tuning needs</text>
  <text x="1050.5264" y="557.7561" text-anchor="middle" font-family="Arial" font-size="16.4399" fill="var(--text)">workload testing</text>
</svg>
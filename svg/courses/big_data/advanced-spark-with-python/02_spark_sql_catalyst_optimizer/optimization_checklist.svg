  <ns0:text x="829.0909" y="334.5455" font-family="Arial" font-size="17.4545" fill="#e65100">Configure memory fraction</ns0:text>
  <ns0:rect x="807.2727" y="363.6364" width="305.4545" height="43.6364" rx="5.8182" fill="#ffe0b2" stroke="#e65100" stroke-width="1.4545" />
  <ns0:text x="829.0909" y="392.7273" font-family="Arial" font-size="17.4545" fill="#e65100">Monitor Spark UI metrics</ns0:text>
  <ns0:rect x="807.2727" y="421.8182" width="305.4545" height="43.6364" rx="5.8182" fill="#ffe0b2" stroke="#e65100" stroke-width="1.4545" />
  <ns0:text x="829.0909" y="450.9091" font-family="Arial" font-size="17.4545" fill="#e65100">Review explain() output</ns0:text>
  <ns0:text x="203.6364" y="523.6364" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="#1565c0">Impact: High</ns0:text>
  <ns0:text x="203.6364" y="552.7273" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Format + partitioning</ns0:text>
  <ns0:text x="203.6364" y="576" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">give biggest gains</ns0:text>
  <ns0:text x="581.8182" y="523.6364" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="#2e7d32">Impact: Medium</ns0:text>
  <ns0:text x="581.8182" y="552.7273" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Query patterns affect</ns0:text>

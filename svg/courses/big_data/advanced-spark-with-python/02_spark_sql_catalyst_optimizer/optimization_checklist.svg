<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="581.8182" y="43.6364" text-anchor="middle" font-family="Arial" font-size="29.0909" font-weight="bold" fill="var(--primary-accent)">Spark SQL Optimization Checklist</text>
  <rect x="29.0909" y="72.7273" width="349.0909" height="567.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="203.6364" y="109.0909" text-anchor="middle" font-family="Arial" font-size="20.3636" font-weight="bold" fill="var(--primary-accent)">Data Layer</text>
  <rect x="50.9091" y="130.9091" width="305.4545" height="43.6364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="72.7273" y="160" font-family="Arial" font-size="17.4545" fill="var(--primary-accent)">Use Parquet/ORC format</text>
  <rect x="50.9091" y="189.0909" width="305.4545" height="43.6364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="72.7273" y="218.1818" font-family="Arial" font-size="17.4545" fill="var(--primary-accent)">Enable compression (Snappy)</text>
  <rect x="50.9091" y="247.2727" width="305.4545" height="43.6364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="72.7273" y="276.3636" font-family="Arial" font-size="17.4545" fill="var(--primary-accent)">Partition by common filters</text>
  <rect x="50.9091" y="305.4545" width="305.4545" height="43.6364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="72.7273" y="334.5455" font-family="Arial" font-size="17.4545" fill="var(--primary-accent)">Collect table statistics</text>
  <rect x="50.9091" y="363.6364" width="305.4545" height="43.6364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="72.7273" y="392.7273" font-family="Arial" font-size="17.4545" fill="var(--primary-accent)">Right-size file counts</text>
  <rect x="50.9091" y="421.8182" width="305.4545" height="43.6364" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="72.7273" y="450.9091" font-family="Arial" font-size="17.4545" fill="var(--primary-accent)">Use explicit schemas</text>
  <rect x="407.2727" y="72.7273" width="349.0909" height="567.2727" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="581.8182" y="109.0909" text-anchor="middle" font-family="Arial" font-size="20.3636" font-weight="bold" fill="var(--ok-accent)">Query Layer</text>
  <rect x="429.0909" y="130.9091" width="305.4545" height="43.6364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="450.9091" y="160" font-family="Arial" font-size="17.4545" fill="var(--ok-accent)">Select specific columns</text>
  <rect x="429.0909" y="189.0909" width="305.4545" height="43.6364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="450.9091" y="218.1818" font-family="Arial" font-size="17.4545" fill="var(--ok-accent)">Filter early (pushdown)</text>
  <rect x="429.0909" y="247.2727" width="305.4545" height="43.6364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="450.9091" y="276.3636" font-family="Arial" font-size="17.4545" fill="var(--ok-accent)">Use broadcast joins</text>
  <rect x="429.0909" y="305.4545" width="305.4545" height="43.6364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="450.9091" y="334.5455" font-family="Arial" font-size="17.4545" fill="var(--ok-accent)">Avoid UDFs if possible</text>
  <rect x="429.0909" y="363.6364" width="305.4545" height="43.6364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="450.9091" y="392.7273" font-family="Arial" font-size="17.4545" fill="var(--ok-accent)">Cache repeated queries</text>
  <rect x="429.0909" y="421.8182" width="305.4545" height="43.6364" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="450.9091" y="450.9091" font-family="Arial" font-size="17.4545" fill="var(--ok-accent)">Match types in filters</text>
  <rect x="785.4545" y="72.7273" width="349.0909" height="567.2727" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="960" y="109.0909" text-anchor="middle" font-family="Arial" font-size="20.3636" font-weight="bold" fill="var(--warn-accent)">Infrastructure</text>
  <rect x="807.2727" y="130.9091" width="305.4545" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="829.0909" y="160" font-family="Arial" font-size="17.4545" fill="var(--warn-accent)">Enable AQE</text>
  <rect x="807.2727" y="189.0909" width="305.4545" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="829.0909" y="218.1818" font-family="Arial" font-size="17.4545" fill="var(--warn-accent)">Enable CBO</text>
  <rect x="807.2727" y="247.2727" width="305.4545" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="829.0909" y="276.3636" font-family="Arial" font-size="17.4545" fill="var(--warn-accent)">Tune shuffle partitions</text>
  <rect x="807.2727" y="305.4545" width="305.4545" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="829.0909" y="334.5455" font-family="Arial" font-size="17.4545" fill="var(--warn-accent)">Configure memory fraction</text>
  <rect x="807.2727" y="363.6364" width="305.4545" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="829.0909" y="392.7273" font-family="Arial" font-size="17.4545" fill="var(--warn-accent)">Monitor Spark UI metrics</text>
  <rect x="807.2727" y="421.8182" width="305.4545" height="43.6364" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="829.0909" y="450.9091" font-family="Arial" font-size="17.4545" fill="var(--warn-accent)">Review explain() output</text>
  <text x="203.6364" y="523.6364" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--primary-accent)">Impact: High</text>
  <text x="203.6364" y="552.7273" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Format + partitioning</text>
  <text x="203.6364" y="576" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">give biggest gains</text>
  <text x="581.8182" y="523.6364" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--ok-accent)">Impact: Medium</text>
  <text x="581.8182" y="552.7273" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Query patterns affect</text>
  <text x="581.8182" y="576" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">plan quality</text>
  <text x="960" y="523.6364" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="var(--warn-accent)">Impact: Varies</text>
  <text x="960" y="552.7273" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">Config tuning needs</text>
  <text x="960" y="576" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text)">workload testing</text>
</svg>
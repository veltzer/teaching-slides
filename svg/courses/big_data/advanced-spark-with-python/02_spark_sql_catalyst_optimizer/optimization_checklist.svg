<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="11.2" refX="14.4" refY="5.6" orient="auto">
      <ns0:polygon points="0,16 5.6,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="581.8182" y="43.6364" text-anchor="middle" font-family="Arial" font-size="29.0909" font-weight="bold" fill="#1a237e">Spark SQL Optimization Checklist</ns0:text>
  <ns0:rect x="29.0909" y="72.7273" width="349.0909" height="567.2727" rx="11.6364" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.9091" />
  <ns0:text x="203.6364" y="109.0909" text-anchor="middle" font-family="Arial" font-size="20.3636" font-weight="bold" fill="#1a237e">Data Layer</ns0:text>
  <ns0:rect x="50.9091" y="130.9091" width="305.4545" height="43.6364" rx="5.8182" fill="#bbdefb" stroke="#1565c0" stroke-width="1.4545" />
  <ns0:text x="72.7273" y="160" font-family="Arial" font-size="17.4545" fill="#1a237e">Use Parquet/ORC format</ns0:text>
  <ns0:rect x="50.9091" y="189.0909" width="305.4545" height="43.6364" rx="5.8182" fill="#bbdefb" stroke="#1565c0" stroke-width="1.4545" />
  <ns0:text x="72.7273" y="218.1818" font-family="Arial" font-size="17.4545" fill="#1a237e">Enable compression (Snappy)</ns0:text>
  <ns0:rect x="50.9091" y="247.2727" width="305.4545" height="43.6364" rx="5.8182" fill="#bbdefb" stroke="#1565c0" stroke-width="1.4545" />
  <ns0:text x="72.7273" y="276.3636" font-family="Arial" font-size="17.4545" fill="#1a237e">Partition by common filters</ns0:text>
  <ns0:rect x="50.9091" y="305.4545" width="305.4545" height="43.6364" rx="5.8182" fill="#bbdefb" stroke="#1565c0" stroke-width="1.4545" />
  <ns0:text x="72.7273" y="334.5455" font-family="Arial" font-size="17.4545" fill="#1a237e">Collect table statistics</ns0:text>
  <ns0:rect x="50.9091" y="363.6364" width="305.4545" height="43.6364" rx="5.8182" fill="#bbdefb" stroke="#1565c0" stroke-width="1.4545" />
  <ns0:text x="72.7273" y="392.7273" font-family="Arial" font-size="17.4545" fill="#1a237e">Right-size file counts</ns0:text>
  <ns0:rect x="50.9091" y="421.8182" width="305.4545" height="43.6364" rx="5.8182" fill="#bbdefb" stroke="#1565c0" stroke-width="1.4545" />
  <ns0:text x="72.7273" y="450.9091" font-family="Arial" font-size="17.4545" fill="#1a237e">Use explicit schemas</ns0:text>
  <ns0:rect x="407.2727" y="72.7273" width="349.0909" height="567.2727" rx="11.6364" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.9091" />
  <ns0:text x="581.8182" y="109.0909" text-anchor="middle" font-family="Arial" font-size="20.3636" font-weight="bold" fill="#1b5e20">Query Layer</ns0:text>
  <ns0:rect x="429.0909" y="130.9091" width="305.4545" height="43.6364" rx="5.8182" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4545" />
  <ns0:text x="450.9091" y="160" font-family="Arial" font-size="17.4545" fill="#1b5e20">Select specific columns</ns0:text>
  <ns0:rect x="429.0909" y="189.0909" width="305.4545" height="43.6364" rx="5.8182" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4545" />
  <ns0:text x="450.9091" y="218.1818" font-family="Arial" font-size="17.4545" fill="#1b5e20">Filter early (pushdown)</ns0:text>
  <ns0:rect x="429.0909" y="247.2727" width="305.4545" height="43.6364" rx="5.8182" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4545" />
  <ns0:text x="450.9091" y="276.3636" font-family="Arial" font-size="17.4545" fill="#1b5e20">Use broadcast joins</ns0:text>
  <ns0:rect x="429.0909" y="305.4545" width="305.4545" height="43.6364" rx="5.8182" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4545" />
  <ns0:text x="450.9091" y="334.5455" font-family="Arial" font-size="17.4545" fill="#1b5e20">Avoid UDFs if possible</ns0:text>
  <ns0:rect x="429.0909" y="363.6364" width="305.4545" height="43.6364" rx="5.8182" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4545" />
  <ns0:text x="450.9091" y="392.7273" font-family="Arial" font-size="17.4545" fill="#1b5e20">Cache repeated queries</ns0:text>
  <ns0:rect x="429.0909" y="421.8182" width="305.4545" height="43.6364" rx="5.8182" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4545" />
  <ns0:text x="450.9091" y="450.9091" font-family="Arial" font-size="17.4545" fill="#1b5e20">Match types in filters</ns0:text>
  <ns0:rect x="785.4545" y="72.7273" width="349.0909" height="567.2727" rx="11.6364" fill="#fff3e0" stroke="#e65100" stroke-width="2.9091" />
  <ns0:text x="960" y="109.0909" text-anchor="middle" font-family="Arial" font-size="20.3636" font-weight="bold" fill="#e65100">Infrastructure</ns0:text>
  <ns0:rect x="807.2727" y="130.9091" width="305.4545" height="43.6364" rx="5.8182" fill="#ffe0b2" stroke="#e65100" stroke-width="1.4545" />
  <ns0:text x="829.0909" y="160" font-family="Arial" font-size="17.4545" fill="#e65100">Enable AQE</ns0:text>
  <ns0:rect x="807.2727" y="189.0909" width="305.4545" height="43.6364" rx="5.8182" fill="#ffe0b2" stroke="#e65100" stroke-width="1.4545" />
  <ns0:text x="829.0909" y="218.1818" font-family="Arial" font-size="17.4545" fill="#e65100">Enable CBO</ns0:text>
  <ns0:rect x="807.2727" y="247.2727" width="305.4545" height="43.6364" rx="5.8182" fill="#ffe0b2" stroke="#e65100" stroke-width="1.4545" />
  <ns0:text x="829.0909" y="276.3636" font-family="Arial" font-size="17.4545" fill="#e65100">Tune shuffle partitions</ns0:text>
  <ns0:rect x="807.2727" y="305.4545" width="305.4545" height="43.6364" rx="5.8182" fill="#ffe0b2" stroke="#e65100" stroke-width="1.4545" />
  <ns0:text x="829.0909" y="334.5455" font-family="Arial" font-size="17.4545" fill="#e65100">Configure memory fraction</ns0:text>
  <ns0:rect x="807.2727" y="363.6364" width="305.4545" height="43.6364" rx="5.8182" fill="#ffe0b2" stroke="#e65100" stroke-width="1.4545" />
  <ns0:text x="829.0909" y="392.7273" font-family="Arial" font-size="17.4545" fill="#e65100">Monitor Spark UI metrics</ns0:text>
  <ns0:rect x="807.2727" y="421.8182" width="305.4545" height="43.6364" rx="5.8182" fill="#ffe0b2" stroke="#e65100" stroke-width="1.4545" />
  <ns0:text x="829.0909" y="450.9091" font-family="Arial" font-size="17.4545" fill="#e65100">Review explain() output</ns0:text>
  <ns0:text x="203.6364" y="523.6364" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="#1565c0">Impact: High</ns0:text>
  <ns0:text x="203.6364" y="552.7273" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Format + partitioning</ns0:text>
  <ns0:text x="203.6364" y="576" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">give biggest gains</ns0:text>
  <ns0:text x="581.8182" y="523.6364" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="#2e7d32">Impact: Medium</ns0:text>
  <ns0:text x="581.8182" y="552.7273" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Query patterns affect</ns0:text>
  <ns0:text x="581.8182" y="576" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">plan quality</ns0:text>
  <ns0:text x="960" y="523.6364" text-anchor="middle" font-family="Arial" font-size="17.4545" font-weight="bold" fill="#e65100">Impact: Varies</ns0:text>
  <ns0:text x="960" y="552.7273" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">Config tuning needs</ns0:text>
  <ns0:text x="960" y="576" text-anchor="middle" font-family="Arial" font-size="16" fill="#333">workload testing</ns0:text>
</ns0:svg>
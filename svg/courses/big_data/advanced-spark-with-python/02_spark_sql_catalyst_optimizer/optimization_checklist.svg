  <ns0:text x="450.9091" y="218.1818" font-family="Arial" font-size="17.4545" fill="#1b5e20">Filter early (pushdown)</ns0:text>
  <ns0:rect x="429.0909" y="247.2727" width="305.4545" height="43.6364" rx="5.8182" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4545" />
  <ns0:text x="450.9091" y="276.3636" font-family="Arial" font-size="17.4545" fill="#1b5e20">Use broadcast joins</ns0:text>

<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1a237e">Spark SQL Optimization Checklist</text>

  <!-- Column 1: Data Layer -->
  <rect x="20" y="50" width="240" height="390" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="140" y="75" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1a237e">Data Layer</text>

  <rect x="35" y="90" width="210" height="30" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="50" y="110" font-family="Arial" font-size="12" fill="#1a237e">Use Parquet/ORC format</text>

  <rect x="35" y="130" width="210" height="30" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="50" y="150" font-family="Arial" font-size="12" fill="#1a237e">Enable compression (Snappy)</text>

  <rect x="35" y="170" width="210" height="30" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="50" y="190" font-family="Arial" font-size="12" fill="#1a237e">Partition by common filters</text>

  <rect x="35" y="210" width="210" height="30" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="50" y="230" font-family="Arial" font-size="12" fill="#1a237e">Collect table statistics</text>

  <rect x="35" y="250" width="210" height="30" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="50" y="270" font-family="Arial" font-size="12" fill="#1a237e">Right-size file counts</text>

  <rect x="35" y="290" width="210" height="30" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="50" y="310" font-family="Arial" font-size="12" fill="#1a237e">Use explicit schemas</text>

  <!-- Column 2: Query Layer -->
  <rect x="280" y="50" width="240" height="390" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1b5e20">Query Layer</text>

  <rect x="295" y="90" width="210" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="310" y="110" font-family="Arial" font-size="12" fill="#1b5e20">Select specific columns</text>

  <rect x="295" y="130" width="210" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="310" y="150" font-family="Arial" font-size="12" fill="#1b5e20">Filter early (pushdown)</text>

  <rect x="295" y="170" width="210" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="310" y="190" font-family="Arial" font-size="12" fill="#1b5e20">Use broadcast joins</text>

  <rect x="295" y="210" width="210" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="310" y="230" font-family="Arial" font-size="12" fill="#1b5e20">Avoid UDFs if possible</text>

  <rect x="295" y="250" width="210" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="310" y="270" font-family="Arial" font-size="12" fill="#1b5e20">Cache repeated queries</text>

  <rect x="295" y="290" width="210" height="30" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="310" y="310" font-family="Arial" font-size="12" fill="#1b5e20">Match types in filters</text>

  <!-- Column 3: Infrastructure -->
  <rect x="540" y="50" width="240" height="390" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="660" y="75" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e65100">Infrastructure</text>

  <rect x="555" y="90" width="210" height="30" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="570" y="110" font-family="Arial" font-size="12" fill="#e65100">Enable AQE</text>

  <rect x="555" y="130" width="210" height="30" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="570" y="150" font-family="Arial" font-size="12" fill="#e65100">Enable CBO</text>

  <rect x="555" y="170" width="210" height="30" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="570" y="190" font-family="Arial" font-size="12" fill="#e65100">Tune shuffle partitions</text>

  <rect x="555" y="210" width="210" height="30" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="570" y="230" font-family="Arial" font-size="12" fill="#e65100">Configure memory fraction</text>

  <rect x="555" y="250" width="210" height="30" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="570" y="270" font-family="Arial" font-size="12" fill="#e65100">Monitor Spark UI metrics</text>

  <rect x="555" y="290" width="210" height="30" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  <text x="570" y="310" font-family="Arial" font-size="12" fill="#e65100">Review explain() output</text>

  <!-- Priority indicators -->
  <text x="140" y="360" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0">Impact: High</text>
  <text x="140" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Format + partitioning</text>
  <text x="140" y="396" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">give biggest gains</text>

  <text x="400" y="360" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Impact: Medium</text>
  <text x="400" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Query patterns affect</text>
  <text x="400" y="396" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">plan quality</text>

  <text x="660" y="360" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Impact: Varies</text>
  <text x="660" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Config tuning needs</text>
  <text x="660" y="396" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">workload testing</text>
</svg>

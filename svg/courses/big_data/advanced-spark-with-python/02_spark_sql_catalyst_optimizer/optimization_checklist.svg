<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="11.2" refX="14.4" refY="5.6" orient="auto">
      <polygon points="0,16 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="48" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#1a237e">Spark SQL Optimization Checklist</text>
  <rect x="32" y="80" width="384" height="624" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="224" y="120" text-anchor="middle" font-family="Arial" font-size="22.4" font-weight="bold" fill="#1a237e">Data Layer</text>
  <rect x="56" y="144" width="336" height="48" rx="6.4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.6" />
  <text x="80" y="176" font-family="Arial" font-size="19.2" fill="#1a237e">Use Parquet/ORC format</text>
  <rect x="56" y="208" width="336" height="48" rx="6.4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.6" />
  <text x="80" y="240" font-family="Arial" font-size="19.2" fill="#1a237e">Enable compression (Snappy)</text>
  <rect x="56" y="272" width="336" height="48" rx="6.4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.6" />
  <text x="80" y="304" font-family="Arial" font-size="19.2" fill="#1a237e">Partition by common filters</text>
  <rect x="56" y="336" width="336" height="48" rx="6.4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.6" />
  <text x="80" y="368" font-family="Arial" font-size="19.2" fill="#1a237e">Collect table statistics</text>
  <rect x="56" y="400" width="336" height="48" rx="6.4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.6" />
  <text x="80" y="432" font-family="Arial" font-size="19.2" fill="#1a237e">Right-size file counts</text>
  <rect x="56" y="464" width="336" height="48" rx="6.4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.6" />
  <text x="80" y="496" font-family="Arial" font-size="19.2" fill="#1a237e">Use explicit schemas</text>
  <rect x="448" y="80" width="384" height="624" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="640" y="120" text-anchor="middle" font-family="Arial" font-size="22.4" font-weight="bold" fill="#1b5e20">Query Layer</text>
  <rect x="472" y="144" width="336" height="48" rx="6.4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="496" y="176" font-family="Arial" font-size="19.2" fill="#1b5e20">Select specific columns</text>
  <rect x="472" y="208" width="336" height="48" rx="6.4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="496" y="240" font-family="Arial" font-size="19.2" fill="#1b5e20">Filter early (pushdown)</text>
  <rect x="472" y="272" width="336" height="48" rx="6.4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="496" y="304" font-family="Arial" font-size="19.2" fill="#1b5e20">Use broadcast joins</text>
  <rect x="472" y="336" width="336" height="48" rx="6.4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="496" y="368" font-family="Arial" font-size="19.2" fill="#1b5e20">Avoid UDFs if possible</text>
  <rect x="472" y="400" width="336" height="48" rx="6.4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="496" y="432" font-family="Arial" font-size="19.2" fill="#1b5e20">Cache repeated queries</text>
  <rect x="472" y="464" width="336" height="48" rx="6.4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="496" y="496" font-family="Arial" font-size="19.2" fill="#1b5e20">Match types in filters</text>
  <rect x="864" y="80" width="384" height="624" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="1056" y="120" text-anchor="middle" font-family="Arial" font-size="22.4" font-weight="bold" fill="#e65100">Infrastructure</text>
  <rect x="888" y="144" width="336" height="48" rx="6.4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.6" />
  <text x="912" y="176" font-family="Arial" font-size="19.2" fill="#e65100">Enable AQE</text>
  <rect x="888" y="208" width="336" height="48" rx="6.4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.6" />
  <text x="912" y="240" font-family="Arial" font-size="19.2" fill="#e65100">Enable CBO</text>
  <rect x="888" y="272" width="336" height="48" rx="6.4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.6" />
  <text x="912" y="304" font-family="Arial" font-size="19.2" fill="#e65100">Tune shuffle partitions</text>
  <rect x="888" y="336" width="336" height="48" rx="6.4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.6" />
  <text x="912" y="368" font-family="Arial" font-size="19.2" fill="#e65100">Configure memory fraction</text>
  <rect x="888" y="400" width="336" height="48" rx="6.4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.6" />
  <text x="912" y="432" font-family="Arial" font-size="19.2" fill="#e65100">Monitor Spark UI metrics</text>
  <rect x="888" y="464" width="336" height="48" rx="6.4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.6" />
  <text x="912" y="496" font-family="Arial" font-size="19.2" fill="#e65100">Review explain() output</text>
  <text x="224" y="576" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#1565c0">Impact: High</text>
  <text x="224" y="608" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Format + partitioning</text>
  <text x="224" y="633.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">give biggest gains</text>
  <text x="640" y="576" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#2e7d32">Impact: Medium</text>
  <text x="640" y="608" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Query patterns affect</text>
  <text x="640" y="633.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">plan quality</text>
  <text x="1056" y="576" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#e65100">Impact: Varies</text>
  <text x="1056" y="608" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Config tuning needs</text>
  <text x="1056" y="633.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">workload testing</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-pp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 6.4,0" fill="#333" />
    </marker>
  </defs>
  <text x="259.5805" y="42.2937" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2727" font-weight="bold" fill="var(--text)">Before Optimization</text>
  <rect x="107.4126" y="70.4895" width="304.3356" height="82.2378" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="259.5805" y="122.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4826" fill="var(--text)">Filter region=North</text>
  <line x1="259.5805" y1="152.7273" x2="259.5805" y2="199.7203" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="107.4126" y="211.4685" width="304.3356" height="82.2378" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="259.5805" y="263.1609" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4826" fill="var(--text)">Filter amount&gt;500</text>
  <line x1="259.5805" y1="293.7063" x2="259.5805" y2="340.6993" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="107.4126" y="352.4476" width="304.3356" height="82.2378" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="259.5805" y="404.1399" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4826" fill="var(--text)">Join</text>
  <line x1="187.972" y1="434.6853" x2="143.2168" y2="493.4266" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <line x1="331.1888" y1="434.6853" x2="375.9441" y2="493.4266" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="53.7063" y="505.1749" width="179.0209" height="82.2378" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="143.2168" y="556.8672" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" fill="var(--text)">Orders Scan</text>
  <rect x="286.4336" y="505.1749" width="179.0209" height="82.2378" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="375.9441" y="556.8672" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" fill="var(--text)">Cust. Scan</text>
  <text x="626.5735" y="352.4476" text-anchor="middle" font-family="Arial, sans-serif" font-size="50.1259" fill="var(--text)">--&gt;</text>
  <text x="975.6644" y="42.2937" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2727" font-weight="bold" fill="var(--text)">After Optimization</text>
  <rect x="823.4966" y="70.4895" width="304.3356" height="82.2378" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="975.6644" y="122.1818" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4826" fill="var(--text)">Join</text>
  <line x1="904.056" y1="152.7273" x2="823.4966" y2="223.2168" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <line x1="1047.2728" y1="152.7273" x2="1127.8322" y2="223.2168" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="671.3287" y="234.965" width="304.3356" height="82.2378" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="823.4966" y="286.6574" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4826" fill="var(--text)">Filter amt&gt;500</text>
  <line x1="823.4966" y1="317.2028" x2="823.4966" y2="364.1958" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="975.6644" y="234.965" width="304.3356" height="82.2378" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1127.8322" y="286.6574" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4826" fill="var(--text)">Filter rgn=North</text>
  <line x1="1127.8322" y1="317.2028" x2="1127.8322" y2="364.1958" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="716.084" y="375.9441" width="214.8252" height="82.2378" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="823.4966" y="427.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" fill="var(--text)">Orders Scan</text>
  <rect x="1020.4196" y="375.9441" width="214.8252" height="82.2378" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1127.8322" y="427.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6923" fill="var(--text)">Cust. Scan</text>
</svg>
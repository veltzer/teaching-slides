<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-pp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 6.4,0" fill="#333" />
    </marker>
  </defs>
  <text x="241.4599" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.747" font-weight="bold" fill="var(--text)">Before Optimization</text>
  <rect x="92.5548" y="70" width="297.8102" height="87.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="241.4599" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9204" fill="var(--text)">Filter region=North</text>
  <line x1="241.4599" y1="157.5" x2="241.4599" y2="207.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="92.5548" y="219.9999" width="297.8102" height="87.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="241.4599" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9204" fill="var(--text)">Filter amount&gt;500</text>
  <line x1="241.4599" y1="307.5" x2="241.4599" y2="357.4999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="92.5548" y="370" width="297.8102" height="87.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="241.4599" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9204" fill="var(--text)">Join</text>
  <line x1="171.3868" y1="457.4999" x2="127.5913" y2="519.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <line x1="311.5328" y1="457.4999" x2="355.3285" y2="519.9999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="40" y="532.5" width="175.1824" height="87.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="127.5913" y="587.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0936" fill="var(--text)">Orders Scan</text>
  <rect x="267.7373" y="532.5" width="175.1824" height="87.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="355.3285" y="587.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0936" fill="var(--text)">Cust. Scan</text>
  <text x="600.584" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="51.1474" fill="var(--text)">--&gt;</text>
  <text x="942.1898" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.747" font-weight="bold" fill="var(--text)">After Optimization</text>
  <rect x="793.2848" y="70" width="297.8102" height="87.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="942.1898" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9204" fill="var(--text)">Join</text>
  <line x1="872.1168" y1="157.5" x2="793.2848" y2="232.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <line x1="1012.2628" y1="157.5" x2="1091.0949" y2="232.5" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="644.3796" y="244.9999" width="297.8102" height="87.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="793.2848" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9204" fill="var(--text)">Filter amt&gt;500</text>
  <line x1="793.2848" y1="332.4999" x2="793.2848" y2="382.4999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="942.1898" y="244.9999" width="297.8102" height="87.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1091.0949" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9204" fill="var(--text)">Filter rgn=North</text>
  <line x1="1091.0949" y1="332.4999" x2="1091.0949" y2="382.4999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-pp)" />
  <rect x="688.1753" y="395" width="210.219" height="87.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="793.2848" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0936" fill="var(--text)">Orders Scan</text>
  <rect x="985.9854" y="395" width="210.219" height="87.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1091.0949" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0936" fill="var(--text)">Cust. Scan</text>
</svg>
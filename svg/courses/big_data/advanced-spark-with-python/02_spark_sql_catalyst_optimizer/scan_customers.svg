<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-pp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker>
  </defs>
  <!-- Before Optimization title -->
  <text x="145" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Before Optimization</text>
  <!-- Filter region=N -->
  <rect x="60" y="30" width="170" height="35" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="145" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Filter region=North</text>
  <line x1="145" y1="65" x2="145" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrow-pp)"/>
  <!-- Filter amount>500 -->
  <rect x="60" y="90" width="170" height="35" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="145" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Filter amount>500</text>
  <line x1="145" y1="125" x2="145" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow-pp)"/>
  <!-- Join -->
  <rect x="60" y="150" width="170" height="35" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="145" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Join</text>
  <line x1="105" y1="185" x2="80" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow-pp)"/>
  <line x1="185" y1="185" x2="210" y2="210" stroke="#333" stroke-width="2" marker-end="url(#arrow-pp)"/>
  <!-- Scans -->
  <rect x="30" y="215" width="100" height="35" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="80" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Orders Scan</text>
  <rect x="160" y="215" width="100" height="35" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="210" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Cust. Scan</text>
  <!-- Arrow between -->
  <text x="350" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#333">--></text>
  <!-- After Optimization title -->
  <text x="545" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">After Optimization</text>
  <!-- Join (top) -->
  <rect x="460" y="30" width="170" height="35" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
  <text x="545" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Join</text>
  <line x1="505" y1="65" x2="460" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arrow-pp)"/>
  <line x1="585" y1="65" x2="630" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arrow-pp)"/>
  <!-- Filter amt>500 -->
  <rect x="375" y="100" width="170" height="35" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="460" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Filter amt>500</text>
  <line x1="460" y1="135" x2="460" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow-pp)"/>
  <!-- Filter rgn=North -->
  <rect x="545" y="100" width="170" height="35" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="630" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Filter rgn=North</text>
  <line x1="630" y1="135" x2="630" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow-pp)"/>
  <!-- Scans -->
  <rect x="400" y="160" width="120" height="35" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="460" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Orders Scan</text>
  <rect x="570" y="160" width="120" height="35" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="630" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Cust. Scan</text>
</svg>

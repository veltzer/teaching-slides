    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="583.4758" y="49.2308" text-anchor="middle" font-family="Arial" font-size="29.1738" font-weight="bold" fill="var(--primary-deeper)">Spark SQL Monitoring and Debugging</text>
  <circle cx="583.4758" cy="213.3333" r="72.9345" fill="var(--primary-dk)" stroke="var(--primary-deep)" stroke-width="2.9174" />
  <text x="583.4758" y="205.1282" text-anchor="middle" font-family="Arial" font-size="20.4217" font-weight="bold" fill="var(--bg)">Spark SQL</text>
  <text x="583.4758" y="234.6667" text-anchor="middle" font-family="Arial" font-size="17.5043" fill="var(--primary-pale)">Debugging</text>
  <rect x="43.7607" y="82.0513" width="233.3903" height="90.2564" rx="11.6695" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.9174" />
  <text x="160.4558" y="119.7949" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--primary-deeper)">Spark UI</text>
  <text x="160.4558" y="152.6154" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">SQL tab, DAG view</text>
  <line x1="277.151" y1="126.359" x2="510.5413" y2="188.7179" stroke="var(--primary-dk)" stroke-width="2.188" marker-end="url(#arrow)" />
  <rect x="889.8006" y="82.0513" width="233.3903" height="90.2564" rx="11.6695" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.9174" />
  <text x="1006.4957" y="119.7949" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--ok-deep)">df.explain()</text>
  <text x="1006.4957" y="152.6154" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Logical + Physical plans</text>
  <line x1="889.8006" y1="126.359" x2="656.4103" y2="188.7179" stroke="var(--ok-dk)" stroke-width="2.188" marker-end="url(#arrow)" />
  <rect x="43.7607" y="254.359" width="233.3903" height="90.2564" rx="11.6695" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.9174" />
  <text x="160.4558" y="292.1026" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--warn-dk)">Query Listener</text>
  <text x="160.4558" y="324.9231" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Event-based monitoring</text>
  <line x1="277.151" y1="298.6667" x2="510.5413" y2="229.7436" stroke="var(--warn-dk)" stroke-width="2.188" marker-end="url(#arrow)" />
  <rect x="889.8006" y="254.359" width="233.3903" height="90.2564" rx="11.6695" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="2.9174" />
  <text x="1006.4957" y="292.1026" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--danger-dk)">Metrics System</text>
  <text x="1006.4957" y="324.9231" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Dropwizard / Prometheus</text>
  <line x1="889.8006" y1="298.6667" x2="656.4103" y2="229.7436" stroke="var(--danger-dk)" stroke-width="2.188" marker-end="url(#arrow)" />
  <text x="583.4758" y="393.8462" text-anchor="middle" font-family="Arial" font-size="21.8803" font-weight="bold" fill="var(--text-dark)">Key Metrics to Monitor</text>
  <rect x="43.7607" y="426.6667" width="247.9772" height="98.4615" rx="8.7521" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.188" />
  <text x="167.7493" y="464.4103" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--primary-deeper)">Query Time</text>
  <text x="167.7493" y="497.2308" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Total + per-stage time</text>
  <rect x="320.9117" y="426.6667" width="247.9772" height="98.4615" rx="8.7521" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.188" />
  <text x="444.9003" y="464.4103" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--ok-deep)">Shuffle Size</text>
  <text x="444.9003" y="497.2308" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Read/write bytes</text>
  <rect x="598.0627" y="426.6667" width="247.9772" height="98.4615" rx="8.7521" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.188" />
  <text x="722.0513" y="464.4103" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--warn-dk)">Spill to Disk</text>
  <text x="722.0513" y="497.2308" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Memory pressure sign</text>
  <rect x="875.2137" y="426.6667" width="247.9772" height="98.4615" rx="8.7521" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="2.188" />
  <text x="999.2023" y="464.4103" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--danger-dk)">GC Time</text>
  <text x="999.2023" y="497.2308" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Garbage collection %</text>
  <rect x="43.7607" y="557.9487" width="1079.4302" height="82.0513" rx="11.6695" fill="var(--surface)" stroke="var(--text-disabled)" stroke-width="2.188" />
  <text x="583.4758" y="594.0513" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--text-dark)">Debug Commands</text>
  <text x="218.8034" y="623.5897" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--primary-dk)">explain(mode="extended")</text>
  <text x="539.7151" y="623.5897" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--ok-dk)">explain(mode="cost")</text>
  <text x="831.453" y="623.5897" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--warn-dk)">explain(mode="formatted")</text>

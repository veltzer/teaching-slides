<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="563.804" y="95.792374207206" width="152.392" height="161.356228748226" rx="14.405880859762" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9174"/>
  <text x="640" y="167.941135986161" text-anchor="middle" font-size="21.953430539639" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Spark SQL</text>
  <text x="640" y="198.647122975776" text-anchor="middle" font-size="18.817167377319" fill="var(--primary-accent)" font-family="Arial, sans-serif">Debugging</text>
  <rect x="40" y="40" width="259.4594" height="93.823513840831" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="79.235339584773" text-anchor="middle" font-size="20.385350408054" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark UI</text>
  <text x="169.7297" y="113.352961730103" text-anchor="middle" font-size="17.249087245734" fill="var(--text)" font-family="Arial, sans-serif">SQL tab, DAG view</text>
  <line x1="299.4594" y1="86.0588216609" x2="558.9189" y2="150.882324913496" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980.5406" y="40" width="259.4594" height="93.823513840831" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="79.235339584773" text-anchor="middle" font-size="20.385350408054" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">df.explain()</text>
  <text x="1110.2702" y="113.352961730103" text-anchor="middle" font-size="17.249087245734" fill="var(--text)" font-family="Arial, sans-serif">Logical + Physical plans</text>
  <line x1="980.5406" y1="86.0588216609" x2="721.0811" y2="150.882324913496" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="219.117675086504" width="259.4594" height="93.823513840831" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="258.353014671277" text-anchor="middle" font-size="20.385350408054" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Query Listener</text>
  <text x="169.7297" y="292.470636816607" text-anchor="middle" font-size="17.249087245734" fill="var(--text)" font-family="Arial, sans-serif">Event-based monitoring</text>
  <line x1="299.4594" y1="265.176496747404" x2="558.9189" y2="193.529405536332" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980.5406" y="219.117675086504" width="259.4594" height="93.823513840831" rx="6.173948939898" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="258.353014671277" text-anchor="middle" font-size="20.385350408054" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Metrics System</text>
  <text x="1110.2702" y="292.470636816607" text-anchor="middle" font-size="17.249087245734" fill="var(--text)" font-family="Arial, sans-serif">Dropwizard / Prometheus</text>
  <line x1="980.5406" y1="265.176496747404" x2="721.0811" y2="193.529405536332" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="364.117728027678" text-anchor="middle" font-size="23.521407772075" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Metrics to Monitor</text>
  <rect x="40" y="398.235350173008" width="275.6757" height="102.352866435989" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="437.470583875433" text-anchor="middle" font-size="18.817167377319" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Query Time</text>
  <text x="177.8378" y="471.588311903111" text-anchor="middle" font-size="17.249087245734" fill="var(--text)" font-family="Arial, sans-serif">Total + per-stage time</text>
  <rect x="348.1081" y="398.235350173008" width="275.6757" height="102.352866435989" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.9459" y="437.470583875433" text-anchor="middle" font-size="18.817167377319" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Shuffle Size</text>
  <text x="485.9459" y="471.588311903111" text-anchor="middle" font-size="17.249087245734" fill="var(--text)" font-family="Arial, sans-serif">Read/write bytes</text>
  <rect x="656.2162" y="398.235350173008" width="275.6757" height="102.352866435989" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.0541" y="437.470583875433" text-anchor="middle" font-size="18.817167377319" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Spill to Disk</text>
  <text x="794.0541" y="471.588311903111" text-anchor="middle" font-size="17.249087245734" fill="var(--text)" font-family="Arial, sans-serif">Memory pressure sign</text>
  <rect x="964.3243" y="398.235350173008" width="275.6757" height="102.352866435989" rx="6.173948939898" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="437.470583875433" text-anchor="middle" font-size="18.817167377319" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">GC Time</text>
  <text x="1102.1622" y="471.588311903111" text-anchor="middle" font-size="17.249087245734" fill="var(--text)" font-family="Arial, sans-serif">Garbage collection %</text>
  <rect x="40" y="534.705838754327" width="1200" height="85.294161245673" rx="6.173948939898" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="572.235307820069" text-anchor="middle" font-size="20.385350408054" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Debug Commands</text>
  <text x="234.5946" y="602.941083044986" text-anchor="middle" font-size="17.249087245734" fill="var(--primary-accent)" font-family="Arial, sans-serif">explain(mode="extended")</text>
  <text x="591.3513" y="602.941083044986" text-anchor="middle" font-size="17.249087245734" fill="var(--ok-accent)" font-family="Arial, sans-serif">explain(mode="cost")</text>
  <text x="915.6757" y="602.941083044986" text-anchor="middle" font-size="17.249087245734" fill="var(--warn-accent)" font-family="Arial, sans-serif">explain(mode="formatted")</text>
</svg>

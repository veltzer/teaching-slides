<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.4783" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark SQL Monitoring and Debugging</text>
  <rect x="563.804" y="124.915" width="152.392" height="152.392" rx="14" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9174"/>
  <text x="640" y="193.0555" text-anchor="middle" font-size="21.3349" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Spark SQL</text>
  <text x="640" y="222.0556" text-anchor="middle" font-size="18.287" fill="var(--primary-accent)" font-family="Arial, sans-serif">Debugging</text>
  <rect x="40" y="72.2222" width="259.4594" height="88.6111" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="109.2778" text-anchor="middle" font-size="19.811" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark UI</text>
  <text x="169.7297" y="141.5" text-anchor="middle" font-size="16.7631" fill="var(--text)" font-family="Arial, sans-serif">SQL tab, DAG view</text>
  <line x1="299.4594" y1="115.7222" x2="558.9189" y2="176.9444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="980.5406" y="72.2222" width="259.4594" height="88.6111" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="109.2778" text-anchor="middle" font-size="19.811" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">df.explain()</text>
  <text x="1110.2702" y="141.5" text-anchor="middle" font-size="16.7631" fill="var(--text)" font-family="Arial, sans-serif">Logical + Physical plans</text>
  <line x1="980.5406" y1="115.7222" x2="721.0811" y2="176.9444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="241.3889" width="259.4594" height="88.6111" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="278.4445" text-anchor="middle" font-size="19.811" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Query Listener</text>
  <text x="169.7297" y="310.6667" text-anchor="middle" font-size="16.7631" fill="var(--text)" font-family="Arial, sans-serif">Event-based monitoring</text>
  <line x1="299.4594" y1="284.8889" x2="558.9189" y2="217.2222" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="980.5406" y="241.3889" width="259.4594" height="88.6111" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="278.4445" text-anchor="middle" font-size="19.811" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Metrics System</text>
  <text x="1110.2702" y="310.6667" text-anchor="middle" font-size="16.7631" fill="var(--text)" font-family="Arial, sans-serif">Dropwizard / Prometheus</text>
  <line x1="980.5406" y1="284.8889" x2="721.0811" y2="217.2222" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="378.3334" text-anchor="middle" font-size="22.8587" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Key Metrics to Monitor</text>
  <rect x="40" y="410.5556" width="275.6757" height="96.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="447.6111" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Query Time</text>
  <text x="177.8378" y="479.8334" text-anchor="middle" font-size="16.7631" fill="var(--text)" font-family="Arial, sans-serif">Total + per-stage time</text>
  <rect x="348.1081" y="410.5556" width="275.6757" height="96.6666" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.9459" y="447.6111" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Shuffle Size</text>
  <text x="485.9459" y="479.8334" text-anchor="middle" font-size="16.7631" fill="var(--text)" font-family="Arial, sans-serif">Read/write bytes</text>
  <rect x="656.2162" y="410.5556" width="275.6757" height="96.6666" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.0541" y="447.6111" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Spill to Disk</text>
  <text x="794.0541" y="479.8334" text-anchor="middle" font-size="16.7631" fill="var(--text)" font-family="Arial, sans-serif">Memory pressure sign</text>
  <rect x="964.3243" y="410.5556" width="275.6757" height="96.6666" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="447.6111" text-anchor="middle" font-size="18.287" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">GC Time</text>
  <text x="1102.1622" y="479.8334" text-anchor="middle" font-size="16.7631" fill="var(--text)" font-family="Arial, sans-serif">Garbage collection %</text>
  <rect x="40" y="539.4444" width="1200" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="574.8889" text-anchor="middle" font-size="19.811" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Debug Commands</text>
  <text x="234.5946" y="603.8888" text-anchor="middle" font-size="16.7631" fill="var(--primary-accent)" font-family="Arial, sans-serif">explain(mode="extended")</text>
  <text x="591.3513" y="603.8888" text-anchor="middle" font-size="16.7631" fill="var(--ok-accent)" font-family="Arial, sans-serif">explain(mode="cost")</text>
  <text x="915.6757" y="603.8888" text-anchor="middle" font-size="16.7631" fill="var(--warn-accent)" font-family="Arial, sans-serif">explain(mode="formatted")</text>
</svg>
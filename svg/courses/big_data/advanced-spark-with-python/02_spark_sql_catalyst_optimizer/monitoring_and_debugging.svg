<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1a237e">Spark SQL Monitoring and Debugging</text>

  <!-- Central node -->
  <circle cx="400" cy="130" r="50" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="400" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">Spark SQL</text>
  <text x="400" y="143" text-anchor="middle" font-family="Arial" font-size="12" fill="#e3f2fd">Debugging</text>

  <!-- Tool 1: Spark UI -->
  <rect x="30" y="50" width="160" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="110" y="73" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1a237e">Spark UI</text>
  <text x="110" y="93" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">SQL tab, DAG view</text>
  <line x1="190" y1="77" x2="350" y2="115" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Tool 2: explain() -->
  <rect x="610" y="50" width="160" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="690" y="73" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1b5e20">df.explain()</text>
  <text x="690" y="93" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Logical + Physical plans</text>
  <line x1="610" y1="77" x2="450" y2="115" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Tool 3: Query Listener -->
  <rect x="30" y="155" width="160" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="110" y="178" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Query Listener</text>
  <text x="110" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Event-based monitoring</text>
  <line x1="190" y1="182" x2="350" y2="140" stroke="#e65100" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Tool 4: Metrics -->
  <rect x="610" y="155" width="160" height="55" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="690" y="178" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c62828">Metrics System</text>
  <text x="690" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Dropwizard / Prometheus</text>
  <line x1="610" y1="182" x2="450" y2="140" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Key Metrics Section -->
  <text x="400" y="240" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Key Metrics to Monitor</text>

  <rect x="30" y="260" width="170" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="115" y="283" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1a237e">Query Time</text>
  <text x="115" y="303" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Total + per-stage time</text>

  <rect x="220" y="260" width="170" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="305" y="283" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1b5e20">Shuffle Size</text>
  <text x="305" y="303" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Read/write bytes</text>

  <rect x="410" y="260" width="170" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="495" y="283" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Spill to Disk</text>
  <text x="495" y="303" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Memory pressure sign</text>

  <rect x="600" y="260" width="170" height="60" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="685" y="283" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#c62828">GC Time</text>
  <text x="685" y="303" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Garbage collection %</text>

  <!-- Debug commands -->
  <rect x="30" y="340" width="740" height="50" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="400" y="362" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#333">Debug Commands</text>
  <text x="150" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#1565c0">explain(mode="extended")</text>
  <text x="370" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#2e7d32">explain(mode="cost")</text>
  <text x="570" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#e65100">explain(mode="formatted")</text>
</svg>

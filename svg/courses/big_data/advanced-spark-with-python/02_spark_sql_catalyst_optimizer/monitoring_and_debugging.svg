<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="30.4783" font-weight="bold" fill="var(--primary-accent)">Spark SQL Monitoring and Debugging</text>
  <rect x="563.804" y="124.915" width="152.392" height="152.392" rx="14" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9174"/>
  <text x="640" y="193.0555" text-anchor="middle" font-family="Arial" font-size="21.3349" font-weight="bold" fill="var(--bg)">Spark SQL</text>
  <text x="640" y="222.0556" text-anchor="middle" font-family="Arial" font-size="18.287" fill="var(--primary-accent)">Debugging</text>
  <rect x="40" y="72.2222" width="259.4594" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="109.2778" text-anchor="middle" font-family="Arial" font-size="19.811" font-weight="bold" fill="var(--primary-accent)">Spark UI</text>
  <text x="169.7297" y="141.5" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--text)">SQL tab, DAG view</text>
  <line x1="299.4594" y1="115.7222" x2="558.9189" y2="176.9444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="980.5406" y="72.2222" width="259.4594" height="88.6111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="109.2778" text-anchor="middle" font-family="Arial" font-size="19.811" font-weight="bold" fill="var(--ok-accent)">df.explain()</text>
  <text x="1110.2702" y="141.5" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--text)">Logical + Physical plans</text>
  <line x1="980.5406" y1="115.7222" x2="721.0811" y2="176.9444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="241.3889" width="259.4594" height="88.6111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="278.4445" text-anchor="middle" font-family="Arial" font-size="19.811" font-weight="bold" fill="var(--warn-accent)">Query Listener</text>
  <text x="169.7297" y="310.6667" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--text)">Event-based monitoring</text>
  <line x1="299.4594" y1="284.8889" x2="558.9189" y2="217.2222" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="980.5406" y="241.3889" width="259.4594" height="88.6111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="278.4445" text-anchor="middle" font-family="Arial" font-size="19.811" font-weight="bold" fill="var(--danger-accent)">Metrics System</text>
  <text x="1110.2702" y="310.6667" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--text)">Dropwizard / Prometheus</text>
  <line x1="980.5406" y1="284.8889" x2="721.0811" y2="217.2222" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="378.3334" text-anchor="middle" font-family="Arial" font-size="22.8587" font-weight="bold" fill="var(--text)">Key Metrics to Monitor</text>
  <rect x="40" y="410.5556" width="275.6757" height="96.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="447.6111" text-anchor="middle" font-family="Arial" font-size="18.287" font-weight="bold" fill="var(--primary-accent)">Query Time</text>
  <text x="177.8378" y="479.8334" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--text)">Total + per-stage time</text>
  <rect x="348.1081" y="410.5556" width="275.6757" height="96.6666" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.9459" y="447.6111" text-anchor="middle" font-family="Arial" font-size="18.287" font-weight="bold" fill="var(--ok-accent)">Shuffle Size</text>
  <text x="485.9459" y="479.8334" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--text)">Read/write bytes</text>
  <rect x="656.2162" y="410.5556" width="275.6757" height="96.6666" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.0541" y="447.6111" text-anchor="middle" font-family="Arial" font-size="18.287" font-weight="bold" fill="var(--warn-accent)">Spill to Disk</text>
  <text x="794.0541" y="479.8334" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--text)">Memory pressure sign</text>
  <rect x="964.3243" y="410.5556" width="275.6757" height="96.6666" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1622" y="447.6111" text-anchor="middle" font-family="Arial" font-size="18.287" font-weight="bold" fill="var(--danger-accent)">GC Time</text>
  <text x="1102.1622" y="479.8334" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--text)">Garbage collection %</text>
  <rect x="40" y="539.4444" width="1200" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="574.8889" text-anchor="middle" font-family="Arial" font-size="19.811" font-weight="bold" fill="var(--text)">Debug Commands</text>
  <text x="234.5946" y="603.8888" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--primary-accent)">explain(mode="extended")</text>
  <text x="591.3513" y="603.8888" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--ok-accent)">explain(mode="cost")</text>
  <text x="915.6757" y="603.8888" text-anchor="middle" font-family="Arial" font-size="16.7631" fill="var(--warn-accent)">explain(mode="formatted")</text>
</svg>
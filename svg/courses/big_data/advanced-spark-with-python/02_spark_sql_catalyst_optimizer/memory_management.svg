  <rect x="278.297852985262" y="69.491596811266" width="680.851038519188" height="550.508403188734" rx="6.743350636983" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="618.723372244856" y="118.644057598391" text-anchor="middle" font-size="24.146365182555" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Unified Memory (spark.memory.fraction = 0.6)</text>
  <rect x="303.829743312709" y="148.135654409656" width="306.382998822998" height="432.542376960644" rx="6.743350636983" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="457.021295206479" y="197.28811519678" text-anchor="middle" font-size="22.421528478792" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Execution</text>
  <text x="457.021295206479" y="236.610204165472" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">Shuffles</text>
  <text x="457.021295206479" y="275.932172795171" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">Joins</text>
  <text x="457.021295206479" y="315.254261763863" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">Sorts</text>
  <text x="457.021295206479" y="354.576350732553" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">Aggregations</text>
  <line x1="627.234002354005" y1="207.118727693196" x2="627.234002354005" y2="541.355942401609" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.3882 4.4329"/>
  <text x="627.234002354005" y="197.28811519678" text-anchor="middle" font-size="17.247355535035" fill="var(--warn-accent)" font-family="Arial, sans-serif">dynamic</text>
  <line x1="610.212742135707" y1="374.237335047403" x2="644.255262572303" y2="374.237335047403" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="593.191481917408" y1="364.406842889978" x2="610.212742135707" y2="374.237335047403" stroke="var(--warn-border)" stroke-width="2"/>

  <text x="1097.2972" y="152.537234350629" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">User Memory</text>
  <text x="1097.2972" y="195.82095720651" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">UDF data</text>
  <text x="1097.2972" y="230.447765938962" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">Internal metadata</text>
  <text x="1097.2972" y="265.074680641573" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">RDD dependencies</text>
  <text x="1097.2972" y="317.014893740251" text-anchor="middle" font-size="17.377400672738" fill="var(--text-faint)" font-family="Arial, sans-serif">(1 - fraction)</text>
</svg>

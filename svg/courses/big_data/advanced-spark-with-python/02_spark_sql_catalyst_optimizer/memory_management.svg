  <rect x="72.4325" y="109.253723435063" width="194.5946" height="484.77606404544" rx="6.176508461473" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7298" y="152.537234350629" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Reserved</text>
  <text x="169.7298" y="187.164149053239" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">300 MB</text>
  <text x="169.7298" y="221.790957785691" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">System use</text>
  <rect x="299.4595" y="109.253723435063" width="648.6486" height="484.77606404544" rx="6.176508461473" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.7838" y="152.537234350629" text-anchor="middle" font-size="22.116635615226" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Unified Memory (spark.memory.fraction = 0.6)</text>
  <rect x="323.7838" y="178.507446870126" width="291.8919" height="380.895531877925" rx="6.176508461473" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="469.7298" y="221.790957785691" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Execution</text>
  <text x="469.7298" y="256.417872488302" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">Shuffles</text>
  <text x="469.7298" y="291.044681220754" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">Joins</text>
  <text x="469.7298" y="325.671595923365" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">Sorts</text>
  <text x="469.7298" y="360.298510625975" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">Aggregations</text>
  <line x1="631.8919" y1="230.447765938962" x2="631.8919" y2="524.77606404544" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.3882 4.4329"/>
  <text x="631.8919" y="221.790957785691" text-anchor="middle" font-size="15.797552750101" fill="var(--warn-accent)" font-family="Arial, sans-serif">dynamic</text>
  <line x1="615.6757" y1="377.611914992201" x2="648.1081" y2="377.611914992201" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="599.4595" y1="368.955212809088" x2="615.6757" y2="377.611914992201" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="599.4595" y1="386.268617175314" x2="615.6757" y2="377.611914992201" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="648.1081" y1="377.611914992201" x2="664.3243" y2="368.955212809088" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="648.1081" y1="377.611914992201" x2="664.3243" y2="386.268617175314" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="640" y="178.507446870126" width="283.7838" height="380.895531877925" rx="6.176508461473" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="781.0811" y="221.790957785691" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Storage</text>
  <text x="781.0811" y="256.417872488302" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">Cached tables</text>
  <text x="781.0811" y="291.044681220754" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">Broadcast vars</text>
  <text x="781.0811" y="325.671595923365" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">Unroll memory</text>

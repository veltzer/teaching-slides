  <text x="142.127666274333" y="118.644057598391" text-anchor="middle" font-size="22.421528478792" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Reserved</text>
  <text x="142.127666274333" y="157.966146567081" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">300 MB</text>

  <text x="1115.744548491519" y="167.796759063497" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">UDF data</text>
  <text x="1115.744548491519" y="207.118727693196" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">Internal metadata</text>
  <text x="1115.744548491519" y="246.440816661888" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">RDD dependencies</text>

  <rect x="635.744632463154" y="148.135654409656" width="297.872368713848" height="432.542376960644" rx="6.743350636983" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="783.829764305618" y="197.28811519678" text-anchor="middle" font-size="22.421528478792" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Storage</text>
  <text x="783.829764305618" y="236.610204165472" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">Cached tables</text>
  <text x="783.829764305618" y="275.932172795171" text-anchor="middle" font-size="18.972192238798" fill="var(--text)" font-family="Arial, sans-serif">Broadcast vars</text>

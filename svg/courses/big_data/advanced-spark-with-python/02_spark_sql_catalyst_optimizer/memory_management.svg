<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial" font-size="29.5527" font-weight="bold" fill="var(--primary-accent)">Spark SQL Memory Management</text>
  <rect x="44.329" y="83.1169" width="1093.4488" height="556.8831" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="591.0534" y="124.6753" text-anchor="middle" font-family="Arial" font-size="22.1645" font-weight="bold" fill="var(--text)">JVM Heap (spark.executor.memory)</text>
  <rect x="73.8817" y="149.6104" width="177.316" height="465.4545" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="162.5397" y="191.1688" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--danger-accent)">Reserved</text>
  <text x="162.5397" y="224.4156" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">300 MB</text>
  <text x="162.5397" y="257.6623" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">System use</text>
  <rect x="280.7504" y="149.6104" width="591.0534" height="465.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="576.2771" y="191.1688" text-anchor="middle" font-family="Arial" font-size="20.6869" font-weight="bold" fill="var(--primary-accent)">Unified Memory (spark.memory.fraction = 0.6)</text>
  <rect x="302.9149" y="216.1039" width="265.974" height="365.7143" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="435.9019" y="257.6623" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">Execution</text>
  <text x="435.9019" y="290.9091" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Shuffles</text>
  <text x="435.9019" y="324.1558" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Joins</text>
  <text x="435.9019" y="357.4026" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Sorts</text>
  <text x="435.9019" y="390.6494" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Aggregations</text>
  <line x1="583.6652" y1="265.974" x2="583.6652" y2="548.5714" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.3882 4.4329" />
  <text x="583.6652" y="257.6623" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--warn-accent)">dynamic</text>
  <line x1="568.8889" y1="407.2727" x2="598.4416" y2="407.2727" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="554.1126" y1="398.961" x2="568.8889" y2="407.2727" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="554.1126" y1="415.5844" x2="568.8889" y2="407.2727" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="598.4416" y1="407.2727" x2="613.2179" y2="398.961" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="598.4416" y1="407.2727" x2="613.2179" y2="415.5844" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="591.0534" y="216.1039" width="258.5859" height="365.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="719.6075" y="257.6623" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--ok-accent)">Storage</text>
  <text x="719.6075" y="290.9091" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Cached tables</text>
  <text x="719.6075" y="324.1558" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Broadcast vars</text>
  <text x="719.6075" y="357.4026" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Unroll memory</text>
  <rect x="901.3564" y="149.6104" width="214.2569" height="465.4545" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1007.746" y="191.1688" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--warn-accent)">User Memory</text>
  <text x="1007.746" y="232.7273" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">UDF data</text>
  <text x="1007.746" y="265.974" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Internal metadata</text>
  <text x="1007.746" y="299.2208" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">RDD dependencies</text>
  <text x="1007.746" y="349.0909" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text-faint)">(1 - fraction)</text>
</svg>
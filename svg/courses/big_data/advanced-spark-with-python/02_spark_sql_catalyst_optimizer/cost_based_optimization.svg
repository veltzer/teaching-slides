<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1a237e">Cost-Based Optimization (CBO)</text>

  <!-- Statistics Collection -->
  <rect x="30" y="60" width="160" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="110" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1a237e">Statistics</text>
  <text x="110" y="103" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Row count, data size</text>
  <text x="110" y="119" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Column min/max/nulls</text>
  <line x1="190" y1="95" x2="240" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Cost Model -->
  <rect x="245" y="60" width="160" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="325" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1b5e20">Cost Model</text>
  <text x="325" y="103" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Estimate I/O cost</text>
  <text x="325" y="119" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Estimate CPU cost</text>
  <line x1="405" y1="95" x2="455" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Plan Comparison -->
  <rect x="460" y="60" width="160" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="540" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Plan Comparison</text>
  <text x="540" y="103" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Evaluate alternatives</text>
  <text x="540" y="119" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Pick lowest cost</text>
  <line x1="620" y1="95" x2="650" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Best Plan -->
  <rect x="655" y="60" width="120" height="70" rx="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="715" y="90" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#fff">Best Plan</text>
  <text x="715" y="110" text-anchor="middle" font-family="Arial" font-size="11" fill="#e3f2fd">Optimal execution</text>

  <!-- Example: Join Reorder Decision -->
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Example: Join Reorder Decision</text>

  <!-- Plan A -->
  <rect x="60" y="195" width="280" height="180" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="200" y="220" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#c62828">Plan A: Orders JOIN Customers</text>

  <rect x="100" y="235" width="200" height="35" rx="5" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="200" y="258" text-anchor="middle" font-family="Arial" font-size="12" fill="#c62828">Join(1M x 10K) = Sort Merge</text>

  <rect x="100" y="280" width="200" height="35" rx="5" fill="#ffcdd2" stroke="#c62828" stroke-width="1"/>
  <text x="200" y="303" text-anchor="middle" font-family="Arial" font-size="12" fill="#c62828">Shuffle: 2 x large</text>

  <text x="200" y="355" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c62828">Cost: 850</text>

  <!-- Plan B -->
  <rect x="460" y="195" width="280" height="180" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="600" y="220" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32">Plan B: Broadcast Join</text>

  <rect x="500" y="235" width="200" height="35" rx="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="600" y="258" text-anchor="middle" font-family="Arial" font-size="12" fill="#2e7d32">Broadcast(10K) + Hash Join</text>

  <rect x="500" y="280" width="200" height="35" rx="5" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="600" y="303" text-anchor="middle" font-family="Arial" font-size="12" fill="#2e7d32">No shuffle needed</text>

  <text x="600" y="355" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Cost: 120 (chosen)</text>

  <!-- Arrow showing choice -->
  <text x="400" y="395" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">CBO uses table/column statistics to pick optimal join strategy</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="576.09" y="48.6076" text-anchor="middle" font-family="Arial" font-size="28.8045" font-weight="bold" fill="var(--primary-accent)">Cost-Based Optimization (CBO)</text>
  <rect x="43.2068" y="97.2152" width="230.436" height="113.4177" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="158.4248" y="137.7215" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--primary-accent)">Statistics</text>
  <text x="158.4248" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Row count, data size</text>
  <text x="158.4248" y="192.8101" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Column min/max/nulls</text>
  <line x1="273.6428" y1="153.9241" x2="345.654" y2="153.9241" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="352.8551" y="97.2152" width="230.436" height="113.4177" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="468.0731" y="137.7215" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--ok-accent)">Cost Model</text>
  <text x="468.0731" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Estimate I/O cost</text>
  <text x="468.0731" y="192.8101" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Estimate CPU cost</text>
  <line x1="583.2911" y1="153.9241" x2="655.3024" y2="153.9241" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="662.5035" y="97.2152" width="230.436" height="113.4177" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="777.7215" y="137.7215" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--warn-accent)">Plan Comparison</text>
  <text x="777.7215" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Evaluate alternatives</text>
  <text x="777.7215" y="192.8101" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text)">Pick lowest cost</text>
  <line x1="892.9395" y1="153.9241" x2="936.1463" y2="153.9241" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="943.3474" y="97.2152" width="172.827" height="113.4177" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.8805" />
  <text x="1029.7609" y="145.8228" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--bg)">Best Plan</text>
  <text x="1029.7609" y="178.2278" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--primary-accent)">Optimal execution</text>
  <text x="576.09" y="275.443" text-anchor="middle" font-family="Arial" font-size="21.6034" font-weight="bold" fill="var(--text)">Example: Join Reorder Decision</text>
  <rect x="86.4135" y="315.9494" width="403.263" height="291.6456" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="288.045" y="356.4557" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--danger-accent)">Plan A: Orders JOIN Customers</text>
  <rect x="144.0225" y="380.7595" width="288.045" height="56.7089" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="288.045" y="418.0253" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--danger-accent)">Join(1M x 10K) = Sort Merge</text>
  <rect x="144.0225" y="453.6709" width="288.045" height="56.7089" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="288.045" y="490.9367" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--danger-accent)">Shuffle: 2 x large</text>
  <text x="288.045" y="575.1899" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--danger-accent)">Cost: 850</text>
  <rect x="662.5035" y="315.9494" width="403.263" height="291.6456" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="864.135" y="356.4557" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--ok-accent)">Plan B: Broadcast Join</text>
  <rect x="720.1125" y="380.7595" width="288.045" height="56.7089" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="864.135" y="418.0253" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--ok-accent)">Broadcast(10K) + Hash Join</text>
  <rect x="720.1125" y="453.6709" width="288.045" height="56.7089" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="864.135" y="490.9367" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--ok-accent)">No shuffle needed</text>
  <text x="864.135" y="575.1899" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--ok-accent)">Cost: 120 (chosen)</text>
  <text x="576.09" y="640" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text)">CBO uses table/column statistics to pick optimal join strategy</text>
</svg>
  <ns0:text x="158.4248" y="137.7215" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--primary-deeper)">Statistics</ns0:text>
  <ns0:text x="158.4248" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text-dark)">Row count, data size</ns0:text>

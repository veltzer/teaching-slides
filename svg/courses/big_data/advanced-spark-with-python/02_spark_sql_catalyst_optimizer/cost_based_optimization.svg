  <ns0:text x="468.0731" y="137.7215" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--ok-deep)">Cost Model</ns0:text>
  <ns0:text x="468.0731" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text-dark)">Estimate I/O cost</ns0:text>
  <ns0:text x="468.0731" y="192.8101" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text-dark)">Estimate CPU cost</ns0:text>
  <ns0:line x1="583.2911" y1="153.9241" x2="655.3024" y2="153.9241" stroke="var(--text-dark)" stroke-width="2.8805" marker-end="url(#arrow)" />
  <ns0:rect x="662.5035" y="97.2152" width="230.436" height="113.4177" rx="11.5218" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.8805" />
  <ns0:text x="777.7215" y="137.7215" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--warn-dk)">Plan Comparison</ns0:text>
  <ns0:text x="777.7215" y="166.8861" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text-dark)">Evaluate alternatives</ns0:text>
  <ns0:text x="777.7215" y="192.8101" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text-dark)">Pick lowest cost</ns0:text>
  <ns0:line x1="892.9395" y1="153.9241" x2="936.1463" y2="153.9241" stroke="var(--text-dark)" stroke-width="2.8805" marker-end="url(#arrow)" />
  <ns0:rect x="943.3474" y="97.2152" width="172.827" height="113.4177" rx="11.5218" fill="var(--primary-dk)" stroke="var(--primary-deep)" stroke-width="2.8805" />
  <ns0:text x="1029.7609" y="145.8228" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--bg)">Best Plan</ns0:text>
  <ns0:text x="1029.7609" y="178.2278" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--primary-pale)">Optimal execution</ns0:text>
  <ns0:text x="576.09" y="275.443" text-anchor="middle" font-family="Arial" font-size="21.6034" font-weight="bold" fill="var(--text-dark)">Example: Join Reorder Decision</ns0:text>
  <ns0:rect x="86.4135" y="315.9494" width="403.263" height="291.6456" rx="11.5218" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="2.1603" />
  <ns0:text x="288.045" y="356.4557" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--danger-dk)">Plan A: Orders JOIN Customers</ns0:text>
  <ns0:rect x="144.0225" y="380.7595" width="288.045" height="56.7089" rx="7.2011" fill="var(--danger-lt)" stroke="var(--danger-dk)" stroke-width="1.4402" />

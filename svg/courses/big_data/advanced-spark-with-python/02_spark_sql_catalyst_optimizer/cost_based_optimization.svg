<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#1a237e">Cost-Based Optimization (CBO)</text>
  <rect x="48" y="108" width="256" height="126" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="176" y="153" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1a237e">Statistics</text>
  <text x="176" y="185.4" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Row count, data size</text>
  <text x="176" y="214.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Column min/max/nulls</text>
  <line x1="304" y1="171" x2="384" y2="171" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <rect x="392" y="108" width="256" height="126" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="520" y="153" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1b5e20">Cost Model</text>
  <text x="520" y="185.4" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Estimate I/O cost</text>
  <text x="520" y="214.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Estimate CPU cost</text>
  <line x1="648" y1="171" x2="728" y2="171" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <rect x="736" y="108" width="256" height="126" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="864" y="153" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#e65100">Plan Comparison</text>
  <text x="864" y="185.4" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Evaluate alternatives</text>
  <text x="864" y="214.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Pick lowest cost</text>
  <line x1="992" y1="171" x2="1040" y2="171" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <rect x="1048" y="108" width="192" height="126" rx="12.8" fill="#1565c0" stroke="#0d47a1" stroke-width="3.2" />
  <text x="1144" y="162" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#fff">Best Plan</text>
  <text x="1144" y="198" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#e3f2fd">Optimal execution</text>
  <text x="640" y="306" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#333">Example: Join Reorder Decision</text>
  <rect x="96" y="351" width="448" height="324" rx="12.8" fill="#ffebee" stroke="#c62828" stroke-width="2.4" />
  <text x="320" y="396" text-anchor="middle" font-family="Arial" font-size="22.4" font-weight="bold" fill="#c62828">Plan A: Orders JOIN Customers</text>
  <rect x="160" y="423" width="320" height="63" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-width="1.6" />
  <text x="320" y="464.4" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#c62828">Join(1M x 10K) = Sort Merge</text>
  <rect x="160" y="504" width="320" height="63" rx="8" fill="#ffcdd2" stroke="#c62828" stroke-width="1.6" />
  <text x="320" y="545.4" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#c62828">Shuffle: 2 x large</text>
  <text x="320" y="639" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#c62828">Cost: 850</text>
  <rect x="736" y="351" width="448" height="324" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.4" />
  <text x="960" y="396" text-anchor="middle" font-family="Arial" font-size="22.4" font-weight="bold" fill="#2e7d32">Plan B: Broadcast Join</text>
  <rect x="800" y="423" width="320" height="63" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="960" y="464.4" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#2e7d32">Broadcast(10K) + Hash Join</text>
  <rect x="800" y="504" width="320" height="63" rx="8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" />
  <text x="960" y="545.4" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#2e7d32">No shuffle needed</text>
  <text x="960" y="639" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">Cost: 120 (chosen)</text>
  <text x="640" y="711" text-anchor="middle" font-family="Arial" font-size="19.2" fill="#333">CBO uses table/column statistics to pick optimal join strategy</text>
</svg>
  <ns0:rect x="144.0225" y="453.6709" width="288.045" height="56.7089" rx="7.2011" fill="var(--danger-lt)" stroke="var(--danger-dk)" stroke-width="1.4402" />
  <ns0:text x="288.045" y="490.9367" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--danger-dk)">Shuffle: 2 x large</ns0:text>
  <ns0:text x="288.045" y="575.1899" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--danger-dk)">Cost: 850</ns0:text>
  <ns0:rect x="662.5035" y="315.9494" width="403.263" height="291.6456" rx="11.5218" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.1603" />
  <ns0:text x="864.135" y="356.4557" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--ok-dk)">Plan B: Broadcast Join</ns0:text>
  <ns0:rect x="720.1125" y="380.7595" width="288.045" height="56.7089" rx="7.2011" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="1.4402" />
  <ns0:text x="864.135" y="418.0253" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--ok-dk)">Broadcast(10K) + Hash Join</ns0:text>
  <ns0:rect x="720.1125" y="453.6709" width="288.045" height="56.7089" rx="7.2011" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="1.4402" />
  <ns0:text x="864.135" y="490.9367" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--ok-dk)">No shuffle needed</ns0:text>
  <ns0:text x="864.135" y="575.1899" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--ok-dk)">Cost: 120 (chosen)</ns0:text>
  <ns0:text x="576.09" y="640" text-anchor="middle" font-family="Arial" font-size="17.2827" fill="var(--text-dark)">CBO uses table/column statistics to pick optimal join strategy</ns0:text>

  <text x="583.4758" y="57.4359" text-anchor="middle" font-family="Arial" font-size="29.1738" font-weight="bold" fill="var(--primary-deeper)">Why Spark SQL?</text>
  <circle cx="583.4758" cy="344.6154" r="87.5214" fill="var(--primary-dk)" stroke="var(--primary-deep)" stroke-width="2.9174" />
  <text x="583.4758" y="336.4103" text-anchor="middle" font-family="Arial" font-size="21.8803" font-weight="bold" fill="var(--bg)">Spark</text>
  <text x="583.4758" y="369.2308" text-anchor="middle" font-family="Arial" font-size="21.8803" font-weight="bold" fill="var(--bg)">SQL</text>
  <rect x="43.7607" y="114.8718" width="233.3903" height="98.4615" rx="11.6695" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.9174" />
  <text x="160.4558" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--primary-deeper)">Unified API</text>
  <text x="160.4558" y="188.7179" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">SQL + DataFrame + Dataset</text>
  <line x1="277.151" y1="164.1026" x2="495.9544" y2="311.7949" stroke="var(--primary-dk)" stroke-width="2.9174" marker-end="url(#arrow)" />
  <rect x="43.7607" y="459.4872" width="233.3903" height="98.4615" rx="11.6695" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.9174" />
  <text x="160.4558" y="500.5128" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--ok-deep)">Catalyst Optimizer</text>
  <text x="160.4558" y="533.3333" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Auto query optimization</text>
  <line x1="277.151" y1="508.7179" x2="495.9544" y2="377.4359" stroke="var(--ok-dk)" stroke-width="2.9174" marker-end="url(#arrow)" />
  <rect x="889.8006" y="114.8718" width="233.3903" height="98.4615" rx="11.6695" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.9174" />
  <text x="1006.4957" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--warn-dk)">High Performance</text>
  <text x="1006.4957" y="188.7179" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Tungsten engine</text>
  <line x1="670.9972" y1="311.7949" x2="889.8006" y2="164.1026" stroke="var(--warn-dk)" stroke-width="2.9174" marker-end="url(#arrow)" />
  <rect x="889.8006" y="459.4872" width="233.3903" height="98.4615" rx="11.6695" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="2.9174" />
  <text x="1006.4957" y="500.5128" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--danger-dk)">Data Sources</text>
  <text x="1006.4957" y="533.3333" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">JDBC, Parquet, JSON...</text>
  <line x1="670.9972" y1="377.4359" x2="889.8006" y2="508.7179" stroke="var(--danger-dk)" stroke-width="2.9174" marker-end="url(#arrow)" />
  <rect x="466.7806" y="557.9487" width="233.3903" height="82.0513" rx="11.6695" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="2.9174" />
  <text x="583.4758" y="594.0513" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--info-dk)">Interoperability</text>
  <text x="583.4758" y="623.5897" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Hive, ANSI SQL compatible</text>
  <line x1="583.4758" y1="443.0769" x2="583.4758" y2="557.9487" stroke="var(--info-dk)" stroke-width="2.9174" marker-end="url(#arrow)" />
  <rect x="466.7806" y="90.2564" width="233.3903" height="82.0513" rx="11.6695" fill="var(--primary-pale3)" stroke="var(--ok-dk)" stroke-width="2.9174" />
  <text x="583.4758" y="126.359" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--ok-dk)">Schema Awareness</text>
  <text x="583.4758" y="155.8974" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-dark)">Structured + typed data</text>
  <line x1="583.4758" y1="246.1538" x2="583.4758" y2="172.3077" stroke="var(--ok-dk)" stroke-width="2.9174" marker-end="url(#arrow)" />
</svg>
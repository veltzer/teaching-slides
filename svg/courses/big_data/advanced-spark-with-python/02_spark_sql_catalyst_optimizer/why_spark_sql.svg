<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="30.6922" font-weight="bold" fill="var(--primary-accent)">Why Spark SQL?</text>
  <rect x="547.923" y="233.839" width="184.153" height="184.153" rx="14" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9174"/>
  <text x="640" y="317.7465" text-anchor="middle" font-family="Arial" font-size="23.0191" font-weight="bold" fill="var(--bg)">Spark</text>
  <text x="640" y="350.4226" text-anchor="middle" font-family="Arial" font-size="23.0191" font-weight="bold" fill="var(--bg)">SQL</text>
  <rect x="40" y="97.1831" width="259.4594" height="98.0281" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="138.0281" text-anchor="middle" font-family="Arial" font-size="19.95" font-weight="bold" fill="var(--primary-accent)">Unified API</text>
  <text x="169.7297" y="170.7042" text-anchor="middle" font-family="Arial" font-size="16.8807" fill="var(--text)">SQL + DataFrame + Dataset</text>
  <line x1="299.4594" y1="146.1972" x2="542.7027" y2="293.2395" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="440.2817" width="259.4594" height="98.0281" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="481.1267" text-anchor="middle" font-family="Arial" font-size="19.95" font-weight="bold" fill="var(--ok-accent)">Catalyst Optimizer</text>
  <text x="169.7297" y="513.8028" text-anchor="middle" font-family="Arial" font-size="16.8807" fill="var(--text)">Auto query optimization</text>
  <line x1="299.4594" y1="489.2957" x2="542.7027" y2="358.5916" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="980.5406" y="97.1831" width="259.4594" height="98.0281" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="138.0281" text-anchor="middle" font-family="Arial" font-size="19.95" font-weight="bold" fill="var(--warn-accent)">High Performance</text>
  <text x="1110.2702" y="170.7042" text-anchor="middle" font-family="Arial" font-size="16.8807" fill="var(--text)">Tungsten engine</text>
  <line x1="737.2973" y1="293.2395" x2="980.5406" y2="146.1972" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="980.5406" y="440.2817" width="259.4594" height="98.0281" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="481.1267" text-anchor="middle" font-family="Arial" font-size="19.95" font-weight="bold" fill="var(--danger-accent)">Data Sources</text>
  <text x="1110.2702" y="513.8028" text-anchor="middle" font-family="Arial" font-size="16.8807" fill="var(--text)">JDBC, Parquet, JSON...</text>
  <line x1="737.2973" y1="358.5916" x2="980.5406" y2="489.2957" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="510.2702" y="538.3098" width="259.4594" height="81.6902" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="574.2535" text-anchor="middle" font-family="Arial" font-size="19.95" font-weight="bold" fill="var(--info-accent)">Interoperability</text>
  <text x="640" y="603.6619" text-anchor="middle" font-family="Arial" font-size="16.8807" fill="var(--text)">Hive, ANSI SQL compatible</text>
  <line x1="640" y1="423.9436" x2="640" y2="538.3098" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="510.2702" y="72.676" width="259.4594" height="81.6902" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="108.6197" text-anchor="middle" font-family="Arial" font-size="19.95" font-weight="bold" fill="var(--ok-accent)">Schema Awareness</text>
  <text x="640" y="138.0281" text-anchor="middle" font-family="Arial" font-size="16.8807" fill="var(--text)">Structured + typed data</text>
  <line x1="640" y1="227.8873" x2="640" y2="154.3662" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
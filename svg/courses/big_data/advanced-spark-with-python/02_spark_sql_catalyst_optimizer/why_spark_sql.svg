<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="547.923" y="210.78465406231" width="184.153" height="195.14718886802" rx="14.411851760196" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9174"/>
  <text x="640" y="299.701547894848" text-anchor="middle" font-size="23.696275489508" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Spark</text>
  <text x="640" y="334.328456270874" text-anchor="middle" font-size="23.696275489508" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">SQL</text>
  <rect x="40" y="65.970207774554" width="259.4594" height="103.880513187801" rx="6.176507897227" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="109.253710781913" text-anchor="middle" font-size="20.536888758279" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Unified API</text>
  <text x="169.7297" y="143.880619157939" text-anchor="middle" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">SQL + DataFrame + Dataset</text>
  <line x1="299.4594" y1="117.910517353524" x2="542.7027" y2="273.731446090433" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="429.552268857204" width="259.4594" height="103.880513187801" rx="6.176507897227" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="472.835771864563" text-anchor="middle" font-size="20.536888758279" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Catalyst Optimizer</text>
  <text x="169.7297" y="507.462680240589" text-anchor="middle" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">Auto query optimization</text>
  <line x1="299.4594" y1="481.492472466035" x2="542.7027" y2="342.985156872346" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980.5406" y="65.970207774554" width="259.4594" height="103.880513187801" rx="6.176507897227" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="109.253710781913" text-anchor="middle" font-size="20.536888758279" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">High Performance</text>
  <text x="1110.2702" y="143.880619157939" text-anchor="middle" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">Tungsten engine</text>
  <line x1="737.2973" y1="273.731446090433" x2="980.5406" y2="117.910517353524" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980.5406" y="429.552268857204" width="259.4594" height="103.880513187801" rx="6.176507897227" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="472.835771864563" text-anchor="middle" font-size="20.536888758279" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data Sources</text>
  <text x="1110.2702" y="507.462680240589" text-anchor="middle" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">JDBC, Parquet, JSON...</text>
  <line x1="737.2973" y1="342.985156872346" x2="980.5406" y2="481.492472466035" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510.2702" y="533.432782045005" width="259.4594" height="86.567217954996" rx="6.176507897227" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="571.522370661619" text-anchor="middle" font-size="20.536888758279" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Interoperability</text>
  <text x="640" y="602.686492826918" text-anchor="middle" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">Hive, ANSI SQL compatible</text>
  <line x1="640" y1="412.238761684121" x2="640" y2="533.432782045005" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510.2702" y="40" width="259.4594" height="86.567217954996" rx="6.176507897227" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="78.089588616615" text-anchor="middle" font-size="20.536888758279" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Schema Awareness</text>
  <text x="640" y="109.253710781913" text-anchor="middle" font-size="17.377296143452" fill="var(--text)" font-family="Arial, sans-serif">Structured + typed data</text>
  <line x1="640" y1="204.477629338381" x2="640" y2="126.567217954996" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

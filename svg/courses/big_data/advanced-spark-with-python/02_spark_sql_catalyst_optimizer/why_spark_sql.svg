<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="583.4758" y="57.4359" text-anchor="middle" font-family="Arial" font-size="29.1738" font-weight="bold" fill="var(--primary-accent)">Why Spark SQL?</text>
  <circle cx="583.4758" cy="344.6154" r="87.5214" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9174" />
  <text x="583.4758" y="336.4103" text-anchor="middle" font-family="Arial" font-size="21.8803" font-weight="bold" fill="var(--bg)">Spark</text>
  <text x="583.4758" y="369.2308" text-anchor="middle" font-family="Arial" font-size="21.8803" font-weight="bold" fill="var(--bg)">SQL</text>
  <rect x="43.7607" y="114.8718" width="233.3903" height="98.4615" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="160.4558" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--primary-accent)">Unified API</text>
  <text x="160.4558" y="188.7179" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">SQL + DataFrame + Dataset</text>
  <line x1="277.151" y1="164.1026" x2="495.9544" y2="311.7949" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="43.7607" y="459.4872" width="233.3903" height="98.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="160.4558" y="500.5128" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--ok-accent)">Catalyst Optimizer</text>
  <text x="160.4558" y="533.3333" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Auto query optimization</text>
  <line x1="277.151" y1="508.7179" x2="495.9544" y2="377.4359" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="889.8006" y="114.8718" width="233.3903" height="98.4615" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1006.4957" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--warn-accent)">High Performance</text>
  <text x="1006.4957" y="188.7179" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Tungsten engine</text>
  <line x1="670.9972" y1="311.7949" x2="889.8006" y2="164.1026" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="889.8006" y="459.4872" width="233.3903" height="98.4615" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1006.4957" y="500.5128" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--danger-accent)">Data Sources</text>
  <text x="1006.4957" y="533.3333" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">JDBC, Parquet, JSON...</text>
  <line x1="670.9972" y1="377.4359" x2="889.8006" y2="508.7179" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="466.7806" y="557.9487" width="233.3903" height="82.0513" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="583.4758" y="594.0513" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--info-accent)">Interoperability</text>
  <text x="583.4758" y="623.5897" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Hive, ANSI SQL compatible</text>
  <line x1="583.4758" y1="443.0769" x2="583.4758" y2="557.9487" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="466.7806" y="90.2564" width="233.3903" height="82.0513" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="583.4758" y="126.359" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--ok-accent)">Schema Awareness</text>
  <text x="583.4758" y="155.8974" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">Structured + typed data</text>
  <line x1="583.4758" y1="246.1538" x2="583.4758" y2="172.3077" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
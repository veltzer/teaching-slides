<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1a237e">Why Spark SQL?</text>

  <!-- Central hub -->
  <circle cx="400" cy="210" r="60" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="400" y="205" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">Spark</text>
  <text x="400" y="225" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">SQL</text>

  <!-- Benefit 1: Unified API -->
  <rect x="30" y="70" width="160" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="110" y="95" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1a237e">Unified API</text>
  <text x="110" y="115" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">SQL + DataFrame + Dataset</text>
  <line x1="190" y1="100" x2="340" y2="190" stroke="#1565c0" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Benefit 2: Catalyst Optimizer -->
  <rect x="30" y="280" width="160" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="110" y="305" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1b5e20">Catalyst Optimizer</text>
  <text x="110" y="325" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Auto query optimization</text>
  <line x1="190" y1="310" x2="340" y2="230" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Benefit 3: Performance -->
  <rect x="610" y="70" width="160" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="690" y="95" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">High Performance</text>
  <text x="690" y="115" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Tungsten engine</text>
  <line x1="460" y1="190" x2="610" y2="100" stroke="#e65100" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Benefit 4: Data Sources -->
  <rect x="610" y="280" width="160" height="60" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="690" y="305" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c62828">Data Sources</text>
  <text x="690" y="325" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">JDBC, Parquet, JSON...</text>
  <line x1="460" y1="230" x2="610" y2="310" stroke="#c62828" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Benefit 5: Interoperability -->
  <rect x="320" y="340" width="160" height="50" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="400" y="362" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Interoperability</text>
  <text x="400" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Hive, ANSI SQL compatible</text>
  <line x1="400" y1="270" x2="400" y2="340" stroke="#6a1b9a" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Benefit 6: Schema -->
  <rect x="320" y="55" width="160" height="50" rx="8" fill="#e0f7fa" stroke="#00695c" stroke-width="2"/>
  <text x="400" y="77" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#00695c">Schema Awareness</text>
  <text x="400" y="95" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Structured + typed data</text>
  <line x1="400" y1="150" x2="400" y2="105" stroke="#00695c" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>

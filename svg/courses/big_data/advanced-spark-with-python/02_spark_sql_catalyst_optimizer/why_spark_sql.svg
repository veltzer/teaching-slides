<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.6922" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Why Spark SQL?</text>
  <rect x="547.923" y="233.839" width="184.153" height="184.153" rx="14" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9174"/>
  <text x="640" y="317.7465" text-anchor="middle" font-size="23.0191" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Spark</text>
  <text x="640" y="350.4226" text-anchor="middle" font-size="23.0191" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">SQL</text>
  <rect x="40" y="97.1831" width="259.4594" height="98.0281" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="138.0281" text-anchor="middle" font-size="19.95" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Unified API</text>
  <text x="169.7297" y="170.7042" text-anchor="middle" font-size="16.8807" fill="var(--text)" font-family="Arial, sans-serif">SQL + DataFrame + Dataset</text>
  <line x1="299.4594" y1="146.1972" x2="542.7027" y2="293.2395" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="440.2817" width="259.4594" height="98.0281" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7297" y="481.1267" text-anchor="middle" font-size="19.95" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Catalyst Optimizer</text>
  <text x="169.7297" y="513.8028" text-anchor="middle" font-size="16.8807" fill="var(--text)" font-family="Arial, sans-serif">Auto query optimization</text>
  <line x1="299.4594" y1="489.2957" x2="542.7027" y2="358.5916" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980.5406" y="97.1831" width="259.4594" height="98.0281" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="138.0281" text-anchor="middle" font-size="19.95" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">High Performance</text>
  <text x="1110.2702" y="170.7042" text-anchor="middle" font-size="16.8807" fill="var(--text)" font-family="Arial, sans-serif">Tungsten engine</text>
  <line x1="737.2973" y1="293.2395" x2="980.5406" y2="146.1972" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980.5406" y="440.2817" width="259.4594" height="98.0281" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2702" y="481.1267" text-anchor="middle" font-size="19.95" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data Sources</text>
  <text x="1110.2702" y="513.8028" text-anchor="middle" font-size="16.8807" fill="var(--text)" font-family="Arial, sans-serif">JDBC, Parquet, JSON...</text>
  <line x1="737.2973" y1="358.5916" x2="980.5406" y2="489.2957" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510.2702" y="538.3098" width="259.4594" height="81.6902" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="574.2535" text-anchor="middle" font-size="19.95" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Interoperability</text>
  <text x="640" y="603.6619" text-anchor="middle" font-size="16.8807" fill="var(--text)" font-family="Arial, sans-serif">Hive, ANSI SQL compatible</text>
  <line x1="640" y1="423.9436" x2="640" y2="538.3098" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="510.2702" y="72.676" width="259.4594" height="81.6902" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="108.6197" text-anchor="middle" font-size="19.95" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Schema Awareness</text>
  <text x="640" y="138.0281" text-anchor="middle" font-size="16.8807" fill="var(--text)" font-family="Arial, sans-serif">Structured + typed data</text>
  <line x1="640" y1="227.8873" x2="640" y2="154.3662" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

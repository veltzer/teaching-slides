  <ns0:line x1="546.5169" y1="201.3483" x2="604.0449" y2="201.3483" stroke="var(--primary-dk)" stroke-width="4.3146" marker-end="url(#arrow)" />
  <ns0:text x="877.3034" y="86.2921" text-anchor="middle" font-family="Arial" font-size="21.573" font-weight="bold" fill="var(--ok-dk)">Solution: AQE Skew Join</ns0:text>
  <ns0:rect x="661.573" y="208.5393" width="57.5281" height="57.5281" rx="2.8764" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2.1573" />

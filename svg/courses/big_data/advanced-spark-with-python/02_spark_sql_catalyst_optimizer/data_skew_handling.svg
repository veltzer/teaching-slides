  <ns0:text x="165.3933" y="464.5393" text-anchor="middle" font-family="Arial" font-size="17.2584" font-weight="bold" fill="var(--primary-deeper)">AQE Skew Join</ns0:text>
  <ns0:text x="165.3933" y="493.3034" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text-dark)">Auto-split large</ns0:text>
  <ns0:text x="165.3933" y="514.8764" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text-dark)">partitions at runtime</ns0:text>
  <ns0:rect x="316.4045" y="431.4607" width="244.4944" height="93.4831" rx="8.6292" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.1573" />
  <ns0:text x="438.6517" y="464.5393" text-anchor="middle" font-family="Arial" font-size="17.2584" font-weight="bold" fill="var(--ok-deep)">Salting</ns0:text>
  <ns0:text x="438.6517" y="493.3034" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text-dark)">Add random prefix to</ns0:text>
  <ns0:text x="438.6517" y="514.8764" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text-dark)">skewed join keys</ns0:text>
  <ns0:rect x="589.6629" y="431.4607" width="244.4944" height="93.4831" rx="8.6292" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.1573" />
  <ns0:text x="711.9101" y="464.5393" text-anchor="middle" font-family="Arial" font-size="17.2584" font-weight="bold" fill="var(--warn-dk)">Broadcast Join</ns0:text>
  <ns0:text x="711.9101" y="493.3034" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text-dark)">Broadcast small table</ns0:text>
  <ns0:text x="711.9101" y="514.8764" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text-dark)">to avoid shuffle</ns0:text>
  <ns0:rect x="862.9213" y="431.4607" width="244.4944" height="93.4831" rx="8.6292" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="2.1573" />
  <ns0:text x="985.1685" y="464.5393" text-anchor="middle" font-family="Arial" font-size="17.2584" font-weight="bold" fill="var(--info-dk)">Repartition</ns0:text>
  <ns0:text x="985.1685" y="493.3034" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text-dark)">Custom partitioner</ns0:text>
  <ns0:text x="985.1685" y="514.8764" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text-dark)">to spread data evenly</ns0:text>
  <ns0:rect x="143.8202" y="553.7079" width="862.9213" height="43.1461" rx="8.6292" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="1.4382" />
  <ns0:text x="575.2809" y="582.4719" text-anchor="middle" font-family="Arial" font-size="17.2584" fill="var(--primary-deeper)">spark.sql.adaptive.skewJoin.enabled = true | skewedPartitionFactor = 5</ns0:text>
  <ns0:text x="575.2809" y="640" text-anchor="middle" font-family="Arial" font-size="17.2584" fill="var(--text-dark)">AQE detects skew at runtime and automatically splits oversized partitions</ns0:text>

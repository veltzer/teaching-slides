<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="575.2809" y="43.1461" text-anchor="middle" font-family="Arial" font-size="28.764" font-weight="bold" fill="var(--primary-accent)">Data Skew Handling</text>
  <text x="287.6404" y="86.2921" text-anchor="middle" font-family="Arial" font-size="21.573" font-weight="bold" fill="var(--danger-accent)">Problem: Skewed Partitions</text>
  <rect x="86.2921" y="230.1124" width="57.5281" height="43.1461" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="115.0562" y="302.0225" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--text)">P1</text>
  <rect x="158.2022" y="100.6742" width="57.5281" height="172.5843" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="186.9663" y="302.0225" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--danger-accent)">P2</text>
  <text x="186.9663" y="93.4831" text-anchor="middle" font-family="Arial" font-size="14.382" font-weight="bold" fill="var(--danger-accent)">Skewed!</text>
  <rect x="230.1124" y="215.7303" width="57.5281" height="57.5281" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="258.8764" y="302.0225" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--text)">P3</text>
  <rect x="302.0225" y="222.9213" width="57.5281" height="50.3371" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="330.7865" y="302.0225" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--text)">P4</text>
  <rect x="373.9326" y="237.3034" width="57.5281" height="35.9551" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="402.6966" y="302.0225" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--text)">P5</text>
  <rect x="445.8427" y="208.5393" width="57.5281" height="64.7191" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="474.6067" y="302.0225" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--text)">P6</text>
  <text x="287.6404" y="337.9775" text-anchor="middle" font-family="Arial" font-size="17.2584" fill="var(--danger-accent)">P2 has 10x more data = straggler task</text>
  <line x1="546.5169" y1="201.3483" x2="604.0449" y2="201.3483" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="877.3034" y="86.2921" text-anchor="middle" font-family="Arial" font-size="21.573" font-weight="bold" fill="var(--ok-accent)">Solution: AQE Skew Join</text>
  <rect x="661.573" y="208.5393" width="57.5281" height="57.5281" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="690.3371" y="294.8315" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--text)">P1</text>
  <rect x="733.4831" y="201.3483" width="57.5281" height="64.7191" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="762.2472" y="294.8315" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--ok-accent)">P2a</text>
  <rect x="805.3933" y="198.4719" width="57.5281" height="67.5955" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="834.1573" y="294.8315" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--ok-accent)">P2b</text>
  <rect x="877.3034" y="204.2247" width="57.5281" height="61.8427" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="906.0674" y="294.8315" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--ok-accent)">P2c</text>
  <rect x="949.2135" y="215.7303" width="57.5281" height="50.3371" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="977.9775" y="294.8315" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--text)">P3</text>
  <rect x="1021.1236" y="212.8539" width="57.5281" height="53.2135" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1049.8876" y="294.8315" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--text)">P4+</text>
  <text x="877.3034" y="337.9775" text-anchor="middle" font-family="Arial" font-size="17.2584" fill="var(--ok-accent)">P2 split into 3 sub-partitions</text>
  <text x="575.2809" y="402.6966" text-anchor="middle" font-family="Arial" font-size="21.573" font-weight="bold" fill="var(--text)">Skew Handling Strategies</text>
  <rect x="43.1461" y="431.4607" width="244.4944" height="93.4831" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.3933" y="464.5393" text-anchor="middle" font-family="Arial" font-size="17.2584" font-weight="bold" fill="var(--primary-accent)">AQE Skew Join</text>
  <text x="165.3933" y="493.3034" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text)">Auto-split large</text>
  <text x="165.3933" y="514.8764" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text)">partitions at runtime</text>
  <rect x="316.4045" y="431.4607" width="244.4944" height="93.4831" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="438.6517" y="464.5393" text-anchor="middle" font-family="Arial" font-size="17.2584" font-weight="bold" fill="var(--ok-accent)">Salting</text>
  <text x="438.6517" y="493.3034" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text)">Add random prefix to</text>
  <text x="438.6517" y="514.8764" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text)">skewed join keys</text>
  <rect x="589.6629" y="431.4607" width="244.4944" height="93.4831" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="711.9101" y="464.5393" text-anchor="middle" font-family="Arial" font-size="17.2584" font-weight="bold" fill="var(--warn-accent)">Broadcast Join</text>
  <text x="711.9101" y="493.3034" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text)">Broadcast small table</text>
  <text x="711.9101" y="514.8764" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text)">to avoid shuffle</text>
  <rect x="862.9213" y="431.4607" width="244.4944" height="93.4831" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="985.1685" y="464.5393" text-anchor="middle" font-family="Arial" font-size="17.2584" font-weight="bold" fill="var(--info-accent)">Repartition</text>
  <text x="985.1685" y="493.3034" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text)">Custom partitioner</text>
  <text x="985.1685" y="514.8764" text-anchor="middle" font-family="Arial" font-size="15.8202" fill="var(--text)">to spread data evenly</text>
  <rect x="143.8202" y="553.7079" width="862.9213" height="43.1461" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="575.2809" y="582.4719" text-anchor="middle" font-family="Arial" font-size="17.2584" fill="var(--primary-accent)">spark.sql.adaptive.skewJoin.enabled = true | skewedPartitionFactor = 5</text>
  <text x="575.2809" y="640" text-anchor="middle" font-family="Arial" font-size="17.2584" fill="var(--text)">AQE detects skew at runtime and automatically splits oversized partitions</text>
</svg>
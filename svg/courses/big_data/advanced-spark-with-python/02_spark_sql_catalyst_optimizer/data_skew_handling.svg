<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="315.6756" y="40" text-anchor="middle" font-size="23.444898080305" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Problem: Skewed Partitions</text>
  <rect x="88.6486" y="190.649496238796" width="64.8649" height="45.194784196327" rx="6.22938093323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="265.974136566009" text-anchor="middle" font-size="15.629932053537" fill="var(--text)" font-family="Arial, sans-serif">P1</text>
  <rect x="169.7296" y="55.065035857628" width="64.8649" height="180.779244577496" rx="6.22938093323" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.1621" y="265.974136566009" text-anchor="middle" font-size="15.629932053537" fill="var(--danger-accent)" font-family="Arial, sans-serif">P2</text>
  <text x="202.1621" y="47.532517928814" text-anchor="middle" font-size="15.629932053537" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Skewed!</text>
  <rect x="250.8108" y="175.584460381168" width="64.8649" height="60.25971226177" rx="6.22938093323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="283.2432" y="265.974136566009" text-anchor="middle" font-size="15.629932053537" fill="var(--text)" font-family="Arial, sans-serif">P3</text>
  <rect x="331.8919" y="183.116870517796" width="64.8649" height="52.727302125142" rx="6.22938093323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="364.3243" y="265.974136566009" text-anchor="middle" font-size="15.629932053537" fill="var(--text)" font-family="Arial, sans-serif">P4</text>
  <rect x="412.973" y="198.181906375425" width="64.8649" height="37.662374059699" rx="6.22938093323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="445.4054" y="265.974136566009" text-anchor="middle" font-size="15.629932053537" fill="var(--text)" font-family="Arial, sans-serif">P5</text>
  <rect x="494.054" y="168.051942452354" width="64.8649" height="67.792230190584" rx="6.22938093323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.4864" y="265.974136566009" text-anchor="middle" font-size="15.629932053537" fill="var(--text)" font-family="Arial, sans-serif">P6</text>
  <text x="315.6756" y="303.636402833522" text-anchor="middle" font-size="18.755939228847" fill="var(--danger-accent)" font-family="Arial, sans-serif">P2 has 10x more data = straggler task</text>
  <line x1="607.5676" y1="160.519532315726" x2="672.4324" y2="160.519532315726" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="980.5406" y="40" text-anchor="middle" font-size="23.444898080305" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Solution: AQE Skew Join</text>
  <rect x="737.2973" y="168.051942452354" width="64.8649" height="60.25971226177" rx="6.22938093323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="769.7298" y="258.441618637195" text-anchor="middle" font-size="15.629932053537" fill="var(--text)" font-family="Arial, sans-serif">P1</text>
  <rect x="818.3783" y="160.519532315726" width="64.8649" height="67.792230190584" rx="6.22938093323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850.8108" y="258.441618637195" text-anchor="middle" font-size="15.629932053537" fill="var(--ok-accent)" font-family="Arial, sans-serif">P2a</text>
  <rect x="899.4595" y="157.5065251442" width="64.8649" height="70.805129569924" rx="6.22938093323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.8919" y="258.441618637195" text-anchor="middle" font-size="15.629932053537" fill="var(--ok-accent)" font-family="Arial, sans-serif">P2b</text>
  <rect x="980.5406" y="163.532539487251" width="64.8649" height="64.779223019058" rx="6.22938093323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.973" y="258.441618637195" text-anchor="middle" font-size="15.629932053537" fill="var(--ok-accent)" font-family="Arial, sans-serif">P2c</text>
  <rect x="1061.6217" y="175.584460381168" width="64.8649" height="52.727302125142" rx="6.22938093323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.054" y="258.441618637195" text-anchor="middle" font-size="15.629932053537" fill="var(--text)" font-family="Arial, sans-serif">P3</text>
  <rect x="1142.7027" y="172.571453209642" width="64.8649" height="55.740309296667" rx="6.22938093323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1175.1351" y="258.441618637195" text-anchor="middle" font-size="15.629932053537" fill="var(--text)" font-family="Arial, sans-serif">P4+</text>
  <text x="980.5406" y="303.636402833522" text-anchor="middle" font-size="18.755939228847" fill="var(--ok-accent)" font-family="Arial, sans-serif">P2 split into 3 sub-partitions</text>
  <text x="640" y="371.42852523192" text-anchor="middle" font-size="23.444898080305" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Skew Handling Strategies</text>
  <rect x="40" y="401.558489154991" width="275.6757" height="97.921978529283" rx="6.22938093323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8379" y="436.207748250979" text-anchor="middle" font-size="18.755939228847" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">AQE Skew Join</text>
  <text x="177.8379" y="466.337712174049" text-anchor="middle" font-size="17.1929875527" fill="var(--text)" font-family="Arial, sans-serif">Auto-split large</text>
  <text x="177.8379" y="488.93505037612" text-anchor="middle" font-size="17.1929875527" fill="var(--text)" font-family="Arial, sans-serif">partitions at runtime</text>
  <rect x="348.1081" y="401.558489154991" width="275.6757" height="97.921978529283" rx="6.22938093323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.946" y="436.207748250979" text-anchor="middle" font-size="18.755939228847" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Salting</text>
  <text x="485.946" y="466.337712174049" text-anchor="middle" font-size="17.1929875527" fill="var(--text)" font-family="Arial, sans-serif">Add random prefix to</text>
  <text x="485.946" y="488.93505037612" text-anchor="middle" font-size="17.1929875527" fill="var(--text)" font-family="Arial, sans-serif">skewed join keys</text>
  <rect x="656.2162" y="401.558489154991" width="275.6757" height="97.921978529283" rx="6.22938093323" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.054" y="436.207748250979" text-anchor="middle" font-size="18.755939228847" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Broadcast Join</text>
  <text x="794.054" y="466.337712174049" text-anchor="middle" font-size="17.1929875527" fill="var(--text)" font-family="Arial, sans-serif">Broadcast small table</text>
  <text x="794.054" y="488.93505037612" text-anchor="middle" font-size="17.1929875527" fill="var(--text)" font-family="Arial, sans-serif">to avoid shuffle</text>
  <rect x="964.3243" y="401.558489154991" width="275.6757" height="97.921978529283" rx="6.22938093323" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="436.207748250979" text-anchor="middle" font-size="18.755939228847" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Repartition</text>
  <text x="1102.1621" y="466.337712174049" text-anchor="middle" font-size="17.1929875527" fill="var(--text)" font-family="Arial, sans-serif">Custom partitioner</text>
  <text x="1102.1621" y="488.93505037612" text-anchor="middle" font-size="17.1929875527" fill="var(--text)" font-family="Arial, sans-serif">to spread data evenly</text>
  <rect x="153.5135" y="529.610431607345" width="972.973" height="45.194784196327" rx="6.22938093323" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="559.74028773823" text-anchor="middle" font-size="18.755939228847" fill="var(--primary-accent)" font-family="Arial, sans-serif">spark.sql.adaptive.skewJoin.enabled = true | skewedPartitionFactor = 5</text>
  <text x="640" y="620" text-anchor="middle" font-size="18.755939228847" fill="var(--text)" font-family="Arial, sans-serif">AQE detects skew at runtime and automatically splits oversized partitions</text>
</svg>

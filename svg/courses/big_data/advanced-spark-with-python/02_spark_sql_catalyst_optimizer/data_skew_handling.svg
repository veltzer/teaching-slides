<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="30.1088" font-weight="bold" fill="var(--primary-accent)">Data Skew Handling</text>
  <text x="315.6756" y="81.9276" text-anchor="middle" font-family="Arial" font-size="22.5816" font-weight="bold" fill="var(--danger-accent)">Problem: Skewed Partitions</text>
  <rect x="88.6486" y="221.6868" width="64.8649" height="41.9277" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.0811" y="291.5663" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--text)">P1</text>
  <rect x="169.7296" y="95.9036" width="64.8649" height="167.7109" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="202.1621" y="291.5663" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--danger-accent)">P2</text>
  <text x="202.1621" y="88.9156" text-anchor="middle" font-family="Arial" font-size="15.0544" font-weight="bold" fill="var(--danger-accent)">Skewed!</text>
  <rect x="250.8108" y="207.7108" width="64.8649" height="55.9036" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="283.2432" y="291.5663" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--text)">P3</text>
  <rect x="331.8919" y="214.6987" width="64.8649" height="48.9157" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="364.3243" y="291.5663" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--text)">P4</text>
  <rect x="412.973" y="228.6747" width="64.8649" height="34.9398" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="445.4054" y="291.5663" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--text)">P5</text>
  <rect x="494.054" y="200.7228" width="64.8649" height="62.8916" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.4864" y="291.5663" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--text)">P6</text>
  <text x="315.6756" y="326.506" text-anchor="middle" font-family="Arial" font-size="18.0653" fill="var(--danger-accent)">P2 has 10x more data = straggler task</text>
  <line x1="607.5676" y1="193.7349" x2="672.4324" y2="193.7349" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="980.5406" y="81.9276" text-anchor="middle" font-family="Arial" font-size="22.5816" font-weight="bold" fill="var(--ok-accent)">Solution: AQE Skew Join</text>
  <rect x="737.2973" y="200.7228" width="64.8649" height="55.9036" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="769.7298" y="284.5783" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--text)">P1</text>
  <rect x="818.3783" y="193.7349" width="64.8649" height="62.8916" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="850.8108" y="284.5783" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--ok-accent)">P2a</text>
  <rect x="899.4595" y="190.9397" width="64.8649" height="65.6867" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="931.8919" y="284.5783" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--ok-accent)">P2b</text>
  <rect x="980.5406" y="196.5301" width="64.8649" height="60.0964" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.973" y="284.5783" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--ok-accent)">P2c</text>
  <rect x="1061.6217" y="207.7108" width="64.8649" height="48.9157" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1094.054" y="284.5783" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--text)">P3</text>
  <rect x="1142.7027" y="204.9156" width="64.8649" height="51.7109" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1175.1351" y="284.5783" text-anchor="middle" font-family="Arial" font-size="15.0544" fill="var(--text)">P4+</text>
  <text x="980.5406" y="326.506" text-anchor="middle" font-family="Arial" font-size="18.0653" fill="var(--ok-accent)">P2 split into 3 sub-partitions</text>
  <text x="640" y="389.3975" text-anchor="middle" font-family="Arial" font-size="22.5816" font-weight="bold" fill="var(--text)">Skew Handling Strategies</text>
  <rect x="40" y="417.3494" width="275.6757" height="90.8433" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8379" y="449.4939" text-anchor="middle" font-family="Arial" font-size="18.0653" font-weight="bold" fill="var(--primary-accent)">AQE Skew Join</text>
  <text x="177.8379" y="477.4458" text-anchor="middle" font-family="Arial" font-size="16.5599" fill="var(--text)">Auto-split large</text>
  <text x="177.8379" y="498.4096" text-anchor="middle" font-family="Arial" font-size="16.5599" fill="var(--text)">partitions at runtime</text>
  <rect x="348.1081" y="417.3494" width="275.6757" height="90.8433" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.946" y="449.4939" text-anchor="middle" font-family="Arial" font-size="18.0653" font-weight="bold" fill="var(--ok-accent)">Salting</text>
  <text x="485.946" y="477.4458" text-anchor="middle" font-family="Arial" font-size="16.5599" fill="var(--text)">Add random prefix to</text>
  <text x="485.946" y="498.4096" text-anchor="middle" font-family="Arial" font-size="16.5599" fill="var(--text)">skewed join keys</text>
  <rect x="656.2162" y="417.3494" width="275.6757" height="90.8433" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.054" y="449.4939" text-anchor="middle" font-family="Arial" font-size="18.0653" font-weight="bold" fill="var(--warn-accent)">Broadcast Join</text>
  <text x="794.054" y="477.4458" text-anchor="middle" font-family="Arial" font-size="16.5599" fill="var(--text)">Broadcast small table</text>
  <text x="794.054" y="498.4096" text-anchor="middle" font-family="Arial" font-size="16.5599" fill="var(--text)">to avoid shuffle</text>
  <rect x="964.3243" y="417.3494" width="275.6757" height="90.8433" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="449.4939" text-anchor="middle" font-family="Arial" font-size="18.0653" font-weight="bold" fill="var(--info-accent)">Repartition</text>
  <text x="1102.1621" y="477.4458" text-anchor="middle" font-family="Arial" font-size="16.5599" fill="var(--text)">Custom partitioner</text>
  <text x="1102.1621" y="498.4096" text-anchor="middle" font-family="Arial" font-size="16.5599" fill="var(--text)">to spread data evenly</text>
  <rect x="153.5135" y="536.1446" width="972.973" height="41.9277" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="564.0964" text-anchor="middle" font-family="Arial" font-size="18.0653" fill="var(--primary-accent)">spark.sql.adaptive.skewJoin.enabled = true | skewedPartitionFactor = 5</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial" font-size="18.0653" fill="var(--text)">AQE detects skew at runtime and automatically splits oversized partitions</text>
</svg>
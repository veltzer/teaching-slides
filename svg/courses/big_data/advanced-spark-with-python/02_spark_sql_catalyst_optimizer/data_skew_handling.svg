<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1a237e">Data Skew Handling</text>

  <!-- Problem illustration -->
  <text x="200" y="60" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#c62828">Problem: Skewed Partitions</text>

  <!-- Skewed bar chart -->
  <rect x="60" y="160" width="40" height="30" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="80" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P1</text>
  <rect x="110" y="70" width="40" height="120" rx="2" fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="130" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#c62828">P2</text>
  <text x="130" y="65" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#c62828">Skewed!</text>
  <rect x="160" y="150" width="40" height="40" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="180" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P3</text>
  <rect x="210" y="155" width="40" height="35" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="230" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P4</text>
  <rect x="260" y="165" width="40" height="25" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="280" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P5</text>
  <rect x="310" y="145" width="40" height="45" rx="2" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="330" y="210" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P6</text>

  <text x="200" y="235" text-anchor="middle" font-family="Arial" font-size="12" fill="#c62828">P2 has 10x more data = straggler task</text>

  <!-- Arrow to solution -->
  <line x1="380" y1="140" x2="420" y2="140" stroke="#1565c0" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Solution illustration -->
  <text x="610" y="60" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#2e7d32">Solution: AQE Skew Join</text>

  <!-- Balanced bar chart -->
  <rect x="460" y="145" width="40" height="40" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="480" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P1</text>
  <rect x="510" y="140" width="40" height="45" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="530" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">P2a</text>
  <rect x="560" y="138" width="40" height="47" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="580" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">P2b</text>
  <rect x="610" y="142" width="40" height="43" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="630" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">P2c</text>
  <rect x="660" y="150" width="40" height="35" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="680" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P3</text>
  <rect x="710" y="148" width="40" height="37" rx="2" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="730" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#333">P4+</text>

  <text x="610" y="235" text-anchor="middle" font-family="Arial" font-size="12" fill="#2e7d32">P2 split into 3 sub-partitions</text>

  <!-- Strategies -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Skew Handling Strategies</text>

  <rect x="30" y="300" width="170" height="65" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="115" y="323" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1a237e">AQE Skew Join</text>
  <text x="115" y="343" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Auto-split large</text>
  <text x="115" y="358" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">partitions at runtime</text>

  <rect x="220" y="300" width="170" height="65" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="305" y="323" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1b5e20">Salting</text>
  <text x="305" y="343" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Add random prefix to</text>
  <text x="305" y="358" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">skewed join keys</text>

  <rect x="410" y="300" width="170" height="65" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="495" y="323" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Broadcast Join</text>
  <text x="495" y="343" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Broadcast small table</text>
  <text x="495" y="358" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">to avoid shuffle</text>

  <rect x="600" y="300" width="170" height="65" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="685" y="323" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#6a1b9a">Repartition</text>
  <text x="685" y="343" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Custom partitioner</text>
  <text x="685" y="358" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">to spread data evenly</text>

  <!-- Config note -->
  <rect x="100" y="385" width="600" height="30" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1"/>
  <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="12" fill="#1a237e">spark.sql.adaptive.skewJoin.enabled = true | skewedPartitionFactor = 5</text>

  <!-- Bottom line -->
  <text x="400" y="445" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">AQE detects skew at runtime and automatically splits oversized partitions</text>
</svg>

  <ns0:text x="330.7865" y="302.0225" text-anchor="middle" font-family="Arial" font-size="14.382" fill="var(--text-dark)">P4</ns0:text>
  <ns0:rect x="373.9326" y="237.3034" width="57.5281" height="35.9551" rx="2.8764" fill="var(--primary-lt)" stroke="var(--primary-dk)" stroke-width="1.4382" />

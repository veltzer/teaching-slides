<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-aqe2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.9032" font-weight="bold" fill="var(--danger-accent)">Without AQE (200 shuffle partitions)</text>
  <rect x="61.9355" y="77.1429" width="144.5161" height="128.5714" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="134.1935" y="133.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="var(--text)">1M</text>
  <text x="134.1935" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--danger-accent)">skew!</text>
  <rect x="216.7742" y="77.1429" width="144.5161" height="128.5714" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="289.0323" y="133.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="var(--text)">1M</text>
  <text x="289.0323" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--danger-accent)">skew!</text>
  <rect x="371.6129" y="77.1429" width="72.2581" height="128.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="408.7742" y="149.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">5K</text>
  <rect x="454.1935" y="77.1429" width="72.2581" height="128.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="491.3548" y="149.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">5K</text>
  <rect x="536.7742" y="77.1429" width="72.2581" height="128.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="573.9355" y="149.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">5K</text>
  <rect x="619.3548" y="77.1429" width="72.2581" height="128.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="656.5161" y="149.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">5K</text>
  <rect x="701.9355" y="77.1429" width="72.2581" height="128.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="739.0968" y="149.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">5K</text>
  <rect x="784.5161" y="77.1429" width="72.2581" height="128.5714" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="2.0645" />
  <text x="821.6774" y="149.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-faint)">empty</text>
  <rect x="867.0968" y="77.1429" width="72.2581" height="128.5714" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="2.0645" />
  <text x="904.2581" y="149.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-faint)">empty</text>
  <text x="990.9677" y="149.1429" font-family="Arial, sans-serif" font-size="28.9032" fill="var(--text-faint)">...</text>
  <text x="640" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="var(--text-faint)">many empty/tiny partitions + skewed partitions</text>
  <line x1="640" y1="295.7143" x2="640" y2="360" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-aqe2)" />
  <text x="701.9355" y="342" font-family="Arial, sans-serif" font-size="22.7097" fill="var(--text)" font-weight="bold">AQE</text>
  <text x="640" y="411.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.9032" font-weight="bold" fill="var(--ok-accent)">With AQE (optimized partitions)</text>
  <rect x="103.2258" y="437.1429" width="247.7419" height="128.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="227.0968" y="493.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="var(--text)">500K (1_a)</text>
  <text x="227.0968" y="534.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--ok-accent)">split skew</text>
  <rect x="371.6129" y="437.1429" width="247.7419" height="128.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="495.4839" y="493.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="var(--text)">500K (1_b)</text>
  <text x="495.4839" y="534.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--ok-accent)">split skew</text>
  <rect x="640" y="437.1429" width="268.3871" height="128.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="774.1935" y="493.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="var(--text)">50K (merged 2-10)</text>
  <text x="774.1935" y="534.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--primary-accent)">coalesced</text>
  <rect x="929.0323" y="437.1429" width="268.3871" height="128.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1063.2258" y="493.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" font-weight="bold" fill="var(--text)">50K (merged 11-20)</text>
  <text x="1063.2258" y="534.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--primary-accent)">coalesced</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="650.9091" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.5542" font-weight="bold" fill="var(--danger-accent)">Without AQE (200 shuffle partitions)</text>
  <rect x="40" y="69" width="152.7272" height="145" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="116.3636" y="132.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">1M</text>
  <text x="116.3636" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--danger-accent)">skew!</text>
  <rect x="203.6363" y="69" width="152.7272" height="145" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="132.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">1M</text>
  <text x="280" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--danger-accent)">skew!</text>
  <rect x="367.2727" y="69" width="76.3637" height="145" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="406.5454" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="454.5454" y="69" width="76.3637" height="145" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="493.8181" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="541.8182" y="69" width="76.3637" height="145" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="581.0909" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="629.0908" y="69" width="76.3637" height="145" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="668.3636" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="716.3636" y="69" width="76.3637" height="145" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.6364" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="803.6363" y="69" width="76.3637" height="145" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="2.0645"/>
  <text x="842.909" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text-faint)">empty</text>
  <rect x="890.9091" y="69" width="76.3637" height="145" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="2.0645"/>
  <text x="930.1818" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text-faint)">empty</text>
  <text x="1021.8181" y="150.2" font-family="Arial, sans-serif" font-size="31.5542" fill="var(--text-faint)">...</text>
  <text x="650.9091" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" fill="var(--text-faint)">many empty/tiny partitions + skewed partitions</text>
  <line x1="650.9091" y1="315.5" x2="650.9091" y2="388" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716.3636" y="367.7" font-family="Arial, sans-serif" font-size="24.7927" fill="var(--text)" font-weight="bold">AQE</text>
  <text x="650.9091" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.5542" font-weight="bold" fill="var(--ok-accent)">With AQE (optimized partitions)</text>
  <rect x="83.6363" y="475" width="261.8181" height="145" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.5455" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">500K (1_a)</text>
  <text x="214.5455" y="585.1999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--ok-accent)">split skew</text>
  <rect x="367.2727" y="475" width="261.8181" height="145" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="498.1818" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">500K (1_b)</text>
  <text x="498.1818" y="585.1999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--ok-accent)">split skew</text>
  <rect x="650.9091" y="475" width="283.6364" height="145" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.7272" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">50K (merged 2-10)</text>
  <text x="792.7272" y="585.1999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--primary-accent)">coalesced</text>
  <rect x="956.3636" y="475" width="283.6364" height="145" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.1818" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">50K (merged 11-20)</text>
  <text x="1098.1818" y="585.1999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--primary-accent)">coalesced</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-aqe2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <text x="650.9091" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.5542" font-weight="bold" fill="var(--danger-accent)">Without AQE (200 shuffle partitions)</text>
  <rect x="40" y="69" width="152.7272" height="145" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="116.3636" y="132.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">1M</text>
  <text x="116.3636" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--danger-accent)">skew!</text>
  <rect x="203.6363" y="69" width="152.7272" height="145" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="280" y="132.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">1M</text>
  <text x="280" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--danger-accent)">skew!</text>
  <rect x="367.2727" y="69" width="76.3637" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="406.5454" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="454.5454" y="69" width="76.3637" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="493.8181" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="541.8182" y="69" width="76.3637" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="581.0909" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="629.0908" y="69" width="76.3637" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="668.3636" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="716.3636" y="69" width="76.3637" height="145" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="755.6364" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text)">5K</text>
  <rect x="803.6363" y="69" width="76.3637" height="145" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="2.0645" />
  <text x="842.909" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text-faint)">empty</text>
  <rect x="890.9091" y="69" width="76.3637" height="145" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="2.0645" />
  <text x="930.1818" y="150.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--text-faint)">empty</text>
  <text x="1021.8181" y="150.2" font-family="Arial, sans-serif" font-size="31.5542" fill="var(--text-faint)">...</text>
  <text x="650.9091" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" fill="var(--text-faint)">many empty/tiny partitions + skewed partitions</text>
  <line x1="650.9091" y1="315.5" x2="650.9091" y2="388" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-aqe2)" />
  <text x="716.3636" y="367.7" font-family="Arial, sans-serif" font-size="24.7927" fill="var(--text)" font-weight="bold">AQE</text>
  <text x="650.9091" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.5542" font-weight="bold" fill="var(--ok-accent)">With AQE (optimized partitions)</text>
  <rect x="83.6363" y="475" width="261.8181" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="214.5455" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">500K (1_a)</text>
  <text x="214.5455" y="585.1999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--ok-accent)">split skew</text>
  <rect x="367.2727" y="475" width="261.8181" height="145" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="498.1818" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">500K (1_b)</text>
  <text x="498.1818" y="585.1999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--ok-accent)">split skew</text>
  <rect x="650.9091" y="475" width="283.6364" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="792.7272" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">50K (merged 2-10)</text>
  <text x="792.7272" y="585.1999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--primary-accent)">coalesced</text>
  <rect x="956.3636" y="475" width="283.6364" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.1818" y="538.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7927" font-weight="bold" fill="var(--text)">50K (merged 11-20)</text>
  <text x="1098.1818" y="585.1999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5388" fill="var(--primary-accent)">coalesced</text>
</svg>
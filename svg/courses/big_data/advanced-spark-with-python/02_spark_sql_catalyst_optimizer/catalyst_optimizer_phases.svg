  <text x="123.2" y="334.9714" text-anchor="middle" font-family="Arial" font-size="16.8871" fill="var(--text)">Whole-stage</text>
  <line x1="123.2" y1="363.1429" x2="123.2" y2="429.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="437.7142" width="168" height="91.1429" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9942" />
  <text x="123.2" y="475.8286" text-anchor="middle" font-family="Arial" font-size="19.9576" font-weight="bold" fill="var(--bg)">RDDs</text>
  <text x="123.2" y="505.6572" text-anchor="middle" font-family="Arial" font-size="16.8871" fill="var(--bg)">Execution</text>

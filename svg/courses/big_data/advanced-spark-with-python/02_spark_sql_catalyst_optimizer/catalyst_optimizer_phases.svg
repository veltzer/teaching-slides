  <rect x="40" y="106.2857" width="208" height="91.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="144.0001" y="144.4" text-anchor="middle" font-family="Arial" font-size="19.9576" font-weight="bold" fill="var(--primary-accent)">SQL Query /</text>
  <text x="144.0001" y="174.2286" text-anchor="middle" font-family="Arial" font-size="19.9576" font-weight="bold" fill="var(--primary-accent)">DataFrame</text>
  <line x1="248" y1="151.0286" x2="288" y2="151.0286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="296" y="106.2857" width="192" height="91.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="391.9999" y="144.4" text-anchor="middle" font-family="Arial" font-size="18.4223" font-weight="bold" fill="var(--warn-accent)">Unresolved</text>
  <text x="391.9999" y="174.2286" text-anchor="middle" font-family="Arial" font-size="18.4223" font-weight="bold" fill="var(--warn-accent)">Logical Plan</text>
  <line x1="488" y1="151.0286" x2="528" y2="151.0286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="536" y="106.2857" width="192" height="91.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="631.9999" y="144.4" text-anchor="middle" font-family="Arial" font-size="19.9576" font-weight="bold" fill="var(--ok-accent)">Analyzer</text>
  <text x="631.9999" y="174.2286" text-anchor="middle" font-family="Arial" font-size="16.8871" fill="var(--text)">Resolve references</text>
  <line x1="728" y1="151.0286" x2="768" y2="151.0286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="776" y="106.2857" width="192" height="91.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="872" y="144.4" text-anchor="middle" font-family="Arial" font-size="18.4223" font-weight="bold" fill="var(--warn-accent)">Resolved</text>
  <text x="872" y="174.2286" text-anchor="middle" font-family="Arial" font-size="18.4223" font-weight="bold" fill="var(--warn-accent)">Logical Plan</text>
  <line x1="967.9999" y1="151.0286" x2="1007.9999" y2="151.0286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1016" y="106.2857" width="223.9999" height="91.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1127.9999" y="144.4" text-anchor="middle" font-family="Arial" font-size="19.9576" font-weight="bold" fill="var(--ok-accent)">Optimizer</text>
  <text x="1127.9999" y="174.2286" text-anchor="middle" font-family="Arial" font-size="16.8871" fill="var(--text)">Rule-based + CBO</text>
  <line x1="1127.9999" y1="197.4286" x2="1127.9999" y2="263.7143" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1016" y="272" width="223.9999" height="91.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1127.9999" y="310.1143" text-anchor="middle" font-family="Arial" font-size="18.4223" font-weight="bold" fill="var(--warn-accent)">Optimized</text>
  <text x="1127.9999" y="339.9428" text-anchor="middle" font-family="Arial" font-size="18.4223" font-weight="bold" fill="var(--warn-accent)">Logical Plan</text>
  <line x1="1016" y1="316.7429" x2="856" y2="316.7429" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="616" y="272" width="232" height="91.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="731.2" y="310.1143" text-anchor="middle" font-family="Arial" font-size="19.9576" font-weight="bold" fill="var(--ok-accent)">Physical Planner</text>
  <text x="731.2" y="339.9428" text-anchor="middle" font-family="Arial" font-size="16.8871" fill="var(--text)">Strategy selection</text>

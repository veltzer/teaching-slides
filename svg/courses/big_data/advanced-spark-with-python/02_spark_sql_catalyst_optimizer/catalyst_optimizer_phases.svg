  <text x="747.1999" y="479.1429" text-anchor="middle" font-family="Arial" font-size="21.4928" font-weight="bold" fill="var(--text)">Optimization Rules Applied</text>
  <text x="376" y="520.5715" text-anchor="middle" font-family="Arial" font-size="18.4223" fill="var(--primary-accent)">Constant Folding</text>
  <text x="648" y="520.5715" text-anchor="middle" font-family="Arial" font-size="18.4223" fill="var(--ok-accent)">Predicate Pushdown</text>
  <text x="936" y="520.5715" text-anchor="middle" font-family="Arial" font-size="18.4223" fill="var(--warn-accent)">Column Pruning</text>
  <text x="504" y="570.2857" text-anchor="middle" font-family="Arial" font-size="18.4223" fill="var(--info-accent)">Join Reordering</text>
  <text x="808" y="570.2857" text-anchor="middle" font-family="Arial" font-size="18.4223" fill="var(--danger-accent)">Boolean Simplification</text>
  <text x="1095.9999" y="570.2857" text-anchor="middle" font-family="Arial" font-size="18.4223" fill="var(--ok-accent)">Null Propagation</text>
</svg>
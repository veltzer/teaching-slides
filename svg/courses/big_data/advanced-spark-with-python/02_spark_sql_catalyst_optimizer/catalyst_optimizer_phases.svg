<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1a237e">Catalyst Optimizer Phases</text>

  <!-- Phase 1: SQL/DataFrame -->
  <rect x="20" y="70" width="130" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="85" y="93" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1a237e">SQL Query /</text>
  <text x="85" y="111" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1a237e">DataFrame</text>
  <line x1="150" y1="97" x2="175" y2="97" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Phase 2: Unresolved Plan -->
  <rect x="180" y="70" width="120" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="240" y="93" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Unresolved</text>
  <text x="240" y="111" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Logical Plan</text>
  <line x1="300" y1="97" x2="325" y2="97" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Phase 3: Analysis -->
  <rect x="330" y="70" width="120" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="390" y="93" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1b5e20">Analyzer</text>
  <text x="390" y="111" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Resolve references</text>
  <line x1="450" y1="97" x2="475" y2="97" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Phase 4: Resolved Plan -->
  <rect x="480" y="70" width="120" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="540" y="93" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Resolved</text>
  <text x="540" y="111" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Logical Plan</text>
  <line x1="600" y1="97" x2="625" y2="97" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Phase 5: Optimizer -->
  <rect x="630" y="70" width="140" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="700" y="93" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1b5e20">Optimizer</text>
  <text x="700" y="111" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Rule-based + CBO</text>

  <!-- Arrow down to optimized plan -->
  <line x1="700" y1="125" x2="700" y2="165" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Phase 6: Optimized Plan -->
  <rect x="630" y="170" width="140" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="700" y="193" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Optimized</text>
  <text x="700" y="211" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Logical Plan</text>
  <line x1="630" y1="197" x2="530" y2="197" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Phase 7: Physical Planner -->
  <rect x="380" y="170" width="145" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="452" y="193" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1b5e20">Physical Planner</text>
  <text x="452" y="211" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Strategy selection</text>
  <line x1="380" y1="197" x2="305" y2="197" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Phase 8: Physical Plans -->
  <rect x="155" y="170" width="145" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="227" y="193" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Physical Plans</text>
  <text x="227" y="211" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Cost model selection</text>
  <line x1="155" y1="197" x2="130" y2="197" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Phase 9: Code Generation -->
  <rect x="20" y="170" width="105" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="72" y="190" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1b5e20">Code Gen</text>
  <text x="72" y="208" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Whole-stage</text>
  <line x1="72" y1="225" x2="72" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Phase 10: Execution -->
  <rect x="20" y="270" width="105" height="55" rx="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="72" y="293" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#fff">RDDs</text>
  <text x="72" y="311" text-anchor="middle" font-family="Arial" font-size="11" fill="#fff">Execution</text>

  <!-- Optimization rules box -->
  <rect x="155" y="270" width="615" height="110" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="462" y="295" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#333">Optimization Rules Applied</text>
  <text x="230" y="320" text-anchor="middle" font-family="Arial" font-size="12" fill="#1565c0">Constant Folding</text>
  <text x="400" y="320" text-anchor="middle" font-family="Arial" font-size="12" fill="#2e7d32">Predicate Pushdown</text>
  <text x="580" y="320" text-anchor="middle" font-family="Arial" font-size="12" fill="#e65100">Column Pruning</text>
  <text x="310" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#6a1b9a">Join Reordering</text>
  <text x="500" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#c62828">Boolean Simplification</text>
  <text x="680" y="350" text-anchor="middle" font-family="Arial" font-size="12" fill="#00695c">Null Propagation</text>
</svg>

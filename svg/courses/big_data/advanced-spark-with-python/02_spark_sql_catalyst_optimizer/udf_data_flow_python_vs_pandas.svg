<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="681.3793" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.8266" font-weight="bold" fill="var(--danger-accent)">Python UDF (row-by-row)</text>
  <rect x="40" y="72.2222" width="289.6552" height="85.9259" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="115.1852" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">JVM</text>
  <text x="184.8277" y="143.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">Row 1</text>
  <line x1="329.6552" y1="115.1852" x2="433.1035" y2="115.1852" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="443.4483" y="72.2222" width="289.6552" height="85.9259" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="115.1852" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">Serialize</text>
  <text x="588.2759" y="143.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">(pickle)</text>
  <line x1="733.1035" y1="115.1852" x2="836.5518" y2="115.1852" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="846.8966" y="72.2222" width="289.6552" height="85.9259" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="115.1852" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">Python func()</text>
  <line x1="991.7242" y1="158.1481" x2="991.7242" y2="201.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="846.8966" y="211.8519" width="289.6552" height="64.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="254.8148" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">Result</text>
  <line x1="846.8966" y1="244.0741" x2="733.1035" y2="244.0741" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="443.4483" y="211.8519" width="289.6552" height="64.4444" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="254.8148" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">Deserialize</text>
  <line x1="443.4483" y1="244.0741" x2="329.6552" y2="244.0741" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="211.8519" width="289.6552" height="64.4444" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="254.8148" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">JVM Result</text>
  <text x="1240" y="168.8889" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--danger-accent)" font-weight="bold">x N rows</text>
  <text x="1240" y="201.1111" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--danger-accent)">(very slow!)</text>
  <text x="681.3793" y="362.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.8266" font-weight="bold" fill="var(--ok-accent)">Pandas UDF (batch)</text>
  <rect x="40" y="394.4444" width="289.6552" height="107.4074" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="437.4074" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">JVM Batch</text>
  <text x="184.8277" y="473.9259" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">(10K rows)</text>
  <line x1="329.6552" y1="448.1481" x2="433.1035" y2="448.1481" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="443.4483" y="394.4444" width="289.6552" height="107.4074" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="437.4074" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">Arrow</text>
  <text x="588.2759" y="473.9259" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">(zero-copy)</text>
  <line x1="733.1035" y1="448.1481" x2="836.5518" y2="448.1481" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="846.8966" y="394.4444" width="289.6552" height="107.4074" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="437.4074" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">Python pandas</text>
  <text x="991.7242" y="473.9259" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">vectorized</text>
  <line x1="991.7242" y1="501.8519" x2="991.7242" y2="544.8148" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="846.8966" y="555.5556" width="289.6552" height="64.4444" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="598.5185" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">Result Series</text>
  <line x1="846.8966" y1="587.7778" x2="733.1035" y2="587.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="443.4483" y="555.5556" width="289.6552" height="64.4444" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="598.5185" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">Arrow</text>
  <line x1="443.4483" y1="587.7778" x2="329.6552" y2="587.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="555.5556" width="289.6552" height="64.4444" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="598.5185" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">JVM Result</text>
  <text x="1240" y="512.5926" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--ok-accent)" font-weight="bold">x N/10K batches</text>
  <text x="1240" y="544.8148" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--ok-accent)">(much faster!)</text>
</svg>
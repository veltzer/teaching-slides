  <text x="588.2759" y="465.333312156864" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4524406532" fill="var(--text-muted)">(zero-copy)</text>
  <line x1="733.1035" y1="438.03917208766" x2="836.5518" y2="438.03917208766" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="846.8966" y="381.176433217995" width="289.6552" height="113.725477739332" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.542887624181" fill="var(--text)">Python pandas</text>
  <text x="991.7242" y="465.333312156864" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4524406532" fill="var(--text-muted)">vectorized</text>
  <line x1="991.7242" y1="494.902016839675" x2="991.7242" y2="540.392144405998" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="846.8966" y="551.764755709341" width="289.6552" height="68.235244290659" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="597.254883275664" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--text)">Result Series</text>
  <line x1="846.8966" y1="585.88237785467" x2="733.1035" y2="585.88237785467" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="443.4483" y="551.764755709341" width="289.6552" height="68.235244290659" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="597.254883275664" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--text)">Arrow</text>
  <line x1="443.4483" y1="585.88237785467" x2="329.6552" y2="585.88237785467" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="551.764755709341" width="289.6552" height="68.235244290659" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="597.254883275664" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--text)">JVM Result</text>
  <text x="1240" y="506.274522260668" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--ok-accent)" font-weight="bold">x N/10K batches</text>
  <text x="1240" y="540.392144405998" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--ok-accent)">(much faster!)</text>
</svg>

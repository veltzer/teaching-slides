<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-udf" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20 6.2222,0" fill="#333" />
    </marker>
  </defs>
  <text x="604.4444" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.8889" font-weight="bold" fill="var(--danger-accent)">Python UDF (row-by-row)</text>
  <rect x="53.3333" y="70" width="248.8889" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="177.7778" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3333" fill="var(--text)">JVM</text>
  <text x="177.7778" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" fill="var(--text-muted)">Row 1</text>
  <line x1="302.2222" y1="110" x2="391.1111" y2="110" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="400" y="70" width="248.8889" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="524.4444" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3333" fill="var(--text)">Serialize</text>
  <text x="524.4444" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" fill="var(--text-muted)">(pickle)</text>
  <line x1="648.8889" y1="110" x2="737.7778" y2="110" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="746.6667" y="70" width="248.8889" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="871.1111" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3333" fill="var(--text)">Python func()</text>
  <line x1="871.1111" y1="150" x2="871.1111" y2="190" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="746.6667" y="200" width="248.8889" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="871.1111" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--text)">Result</text>
  <line x1="746.6667" y1="230" x2="648.8889" y2="230" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="400" y="200" width="248.8889" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="524.4444" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--text)">Deserialize</text>
  <line x1="400" y1="230" x2="302.2222" y2="230" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="53.3333" y="200" width="248.8889" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="177.7778" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--text)">JVM Result</text>
  <text x="1084.4444" y="160" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--danger-accent)" font-weight="bold">x N rows</text>
  <text x="1084.4444" y="190" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--danger-accent)">(very slow!)</text>
  <text x="604.4444" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.8889" font-weight="bold" fill="var(--ok-accent)">Pandas UDF (batch)</text>
  <rect x="53.3333" y="370" width="248.8889" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="177.7778" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3333" fill="var(--text)">JVM Batch</text>
  <text x="177.7778" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" fill="var(--text-muted)">(10K rows)</text>
  <line x1="302.2222" y1="420" x2="391.1111" y2="420" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="400" y="370" width="248.8889" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="524.4444" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3333" fill="var(--text)">Arrow</text>
  <text x="524.4444" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" fill="var(--text-muted)">(zero-copy)</text>
  <line x1="648.8889" y1="420" x2="737.7778" y2="420" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="746.6667" y="370" width="248.8889" height="100" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="871.1111" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3333" fill="var(--text)">Python pandas</text>
  <text x="871.1111" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" fill="var(--text-muted)">vectorized</text>
  <line x1="871.1111" y1="470" x2="871.1111" y2="510" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="746.6667" y="520" width="248.8889" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="871.1111" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--text)">Result Series</text>
  <line x1="746.6667" y1="550" x2="648.8889" y2="550" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="400" y="520" width="248.8889" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="524.4444" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--text)">Arrow</text>
  <line x1="400" y1="550" x2="302.2222" y2="550" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="53.3333" y="520" width="248.8889" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="177.7778" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--text)">JVM Result</text>
  <text x="1084.4444" y="480" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--ok-accent)" font-weight="bold">x N/10K batches</text>
  <text x="1084.4444" y="510" font-family="Arial, sans-serif" font-size="19.5556" fill="var(--ok-accent)">(much faster!)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-udf" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20 6.2222,0" fill="#333" />
    </marker>
  </defs>
  <text x="681.3793" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.8266" font-weight="bold" fill="var(--danger-accent)">Python UDF (row-by-row)</text>
  <rect x="40" y="72.2222" width="289.6552" height="85.9259" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="115.1852" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">JVM</text>
  <text x="184.8277" y="143.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">Row 1</text>
  <line x1="329.6552" y1="115.1852" x2="433.1035" y2="115.1852" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="443.4483" y="72.2222" width="289.6552" height="85.9259" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="115.1852" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">Serialize</text>
  <text x="588.2759" y="143.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">(pickle)</text>
  <line x1="733.1035" y1="115.1852" x2="836.5518" y2="115.1852" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="846.8966" y="72.2222" width="289.6552" height="85.9259" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="115.1852" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">Python func()</text>
  <line x1="991.7242" y1="158.1481" x2="991.7242" y2="201.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="846.8966" y="211.8519" width="289.6552" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="254.8148" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">Result</text>
  <line x1="846.8966" y1="244.0741" x2="733.1035" y2="244.0741" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="443.4483" y="211.8519" width="289.6552" height="64.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="254.8148" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">Deserialize</text>
  <line x1="443.4483" y1="244.0741" x2="329.6552" y2="244.0741" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="40" y="211.8519" width="289.6552" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="254.8148" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">JVM Result</text>
  <text x="1240" y="168.8889" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--danger-accent)" font-weight="bold">x N rows</text>
  <text x="1240" y="201.1111" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--danger-accent)">(very slow!)</text>
  <text x="681.3793" y="362.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.8266" font-weight="bold" fill="var(--ok-accent)">Pandas UDF (batch)</text>
  <rect x="40" y="394.4444" width="289.6552" height="107.4074" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="437.4074" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">JVM Batch</text>
  <text x="184.8277" y="473.9259" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">(10K rows)</text>
  <line x1="329.6552" y1="448.1481" x2="433.1035" y2="448.1481" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="443.4483" y="394.4444" width="289.6552" height="107.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="437.4074" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">Arrow</text>
  <text x="588.2759" y="473.9259" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">(zero-copy)</text>
  <line x1="733.1035" y1="448.1481" x2="836.5518" y2="448.1481" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="846.8966" y="394.4444" width="289.6552" height="107.4074" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="437.4074" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8514" fill="var(--text)">Python pandas</text>
  <text x="991.7242" y="473.9259" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.8762" fill="var(--text-muted)">vectorized</text>
  <line x1="991.7242" y1="501.8519" x2="991.7242" y2="544.8148" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="846.8966" y="555.5556" width="289.6552" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="598.5185" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">Result Series</text>
  <line x1="846.8966" y1="587.7778" x2="733.1035" y2="587.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="443.4483" y="555.5556" width="289.6552" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="598.5185" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">Arrow</text>
  <line x1="443.4483" y1="587.7778" x2="329.6552" y2="587.7778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-udf)" />
  <rect x="40" y="555.5556" width="289.6552" height="64.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="598.5185" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--text)">JVM Result</text>
  <text x="1240" y="512.5926" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--ok-accent)" font-weight="bold">x N/10K batches</text>
  <text x="1240" y="544.8148" font-family="Arial, sans-serif" font-size="21.8638" fill="var(--ok-accent)">(much faster!)</text>
</svg>
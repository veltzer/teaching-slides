<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="289.6552" height="90.980361014995" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="85.490233448672" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.542887624181" fill="var(--text)">JVM</text>
  <text x="184.8277" y="115.058832249135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4524406532" fill="var(--text-muted)">Row 1</text>
  <line x1="329.6552" y1="85.490233448672" x2="433.1035" y2="85.490233448672" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="443.4483" y="40" width="289.6552" height="90.980361014995" rx="6.173948939898" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="85.490233448672" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.542887624181" fill="var(--text)">Serialize</text>
  <text x="588.2759" y="115.058832249135" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4524406532" fill="var(--text-muted)">(pickle)</text>
  <line x1="733.1035" y1="85.490233448672" x2="836.5518" y2="85.490233448672" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="846.8966" y="40" width="289.6552" height="90.980361014995" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="85.490233448672" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.542887624181" fill="var(--text)">Python func()</text>
  <line x1="991.7242" y1="130.980361014995" x2="991.7242" y2="176.470594463668" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="846.8966" y="187.84320576701" width="289.6552" height="68.235244290659" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7242" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--text)">Result</text>
  <line x1="846.8966" y1="221.96082791234" x2="733.1035" y2="221.96082791234" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="443.4483" y="187.84320576701" width="289.6552" height="68.235244290659" rx="6.173948939898" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.2759" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--text)">Deserialize</text>
  <line x1="443.4483" y1="221.96082791234" x2="329.6552" y2="221.96082791234" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="187.84320576701" width="289.6552" height="68.235244290659" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--text)">JVM Result</text>
  <text x="1240" y="142.352972318338" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--danger-accent)" font-weight="bold">x N rows</text>
  <text x="1240" y="176.470594463668" font-family="Arial, sans-serif" font-size="22.497664138691" fill="var(--danger-accent)">(very slow!)</text>
  <text x="681.3793" y="347.058811072665" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.633334595161" font-weight="bold" fill="var(--ok-accent)">Pandas UDF (batch)</text>
  <rect x="40" y="381.176433217995" width="289.6552" height="113.725477739332" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8277" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.542887624181" fill="var(--text)">JVM Batch</text>

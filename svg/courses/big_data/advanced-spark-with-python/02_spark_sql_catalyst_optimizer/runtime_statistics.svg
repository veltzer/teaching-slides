<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.6923" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Runtime Statistics Collection</text>
  <rect x="40" y="80.8451" width="227.027" height="73.5211" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.5135" y="126.5915" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Query Start</text>
  <line x1="267.027" y1="116.7888" x2="331.8919" y2="116.7888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="340" y="80.8451" width="243.2432" height="73.5211" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="461.6216" y="113.5211" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Collect Runtime</text>
  <text x="461.6216" y="139.662" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Statistics</text>
  <line x1="583.2432" y1="116.7888" x2="648.1081" y2="116.7888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="656.2162" y="80.8451" width="243.2432" height="73.5211" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="777.8378" y="113.5211" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">AQE Re-optimize</text>
  <text x="777.8378" y="139.662" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Plan</text>
  <line x1="899.4594" y1="116.7888" x2="964.3243" y2="116.7888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="972.4325" y="80.8451" width="259.4595" height="73.5211" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9553"/>
  <text x="1102.1621" y="126.5915" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Optimized Execution</text>
  <text x="640" y="211.5493" text-anchor="middle" font-size="23.0192" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Statistics Collected at Runtime</text>
  <rect x="40" y="244.2253" width="372.973" height="98.0282" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="281.8028" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Partition Sizes</text>
  <text x="226.4865" y="314.4789" text-anchor="middle" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">Bytes per shuffle partition</text>
  <rect x="453.5135" y="244.2253" width="372.973" height="98.0282" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="281.8028" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Row Counts</text>
  <text x="640" y="314.4789" text-anchor="middle" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">Actual rows per partition</text>
  <rect x="867.027" y="244.2253" width="372.973" height="98.0282" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="281.8028" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Data Distribution</text>
  <text x="1053.5135" y="314.4789" text-anchor="middle" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">Skew detection info</text>
  <rect x="40" y="366.7606" width="372.973" height="98.0282" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="404.338" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Join Output Size</text>
  <text x="226.4865" y="437.0141" text-anchor="middle" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">Actual join cardinality</text>
  <rect x="453.5135" y="366.7606" width="372.973" height="98.0282" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="404.338" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Filter Selectivity</text>
  <text x="640" y="437.0141" text-anchor="middle" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">Actual filter pass rate</text>
  <rect x="867.027" y="366.7606" width="372.973" height="98.0282" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="404.338" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Task Metrics</text>
  <text x="1053.5135" y="437.0141" text-anchor="middle" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">Duration, GC time, spill</text>
  <text x="640" y="513.8029" text-anchor="middle" font-size="23.0192" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">AQE Actions Based on Statistics</text>
  <rect x="40" y="538.3098" width="283.7838" height="81.6902" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="181.0811" y="570.9859" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Coalesce Small</text>
  <text x="181.0811" y="600.3943" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Partitions</text>
  <rect x="356.2162" y="538.3098" width="283.7838" height="81.6902" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="497.2972" y="570.9859" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Split Skewed</text>
  <text x="497.2972" y="600.3943" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Partitions</text>
  <rect x="672.4325" y="538.3098" width="283.7838" height="81.6902" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="813.5135" y="570.9859" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Switch Join</text>
  <text x="813.5135" y="600.3943" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Strategy</text>
  <rect x="988.6486" y="538.3098" width="251.3514" height="81.6902" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1113.5135" y="570.9859" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Optimize</text>
  <text x="1113.5135" y="600.3943" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Shuffle</text>
</svg>

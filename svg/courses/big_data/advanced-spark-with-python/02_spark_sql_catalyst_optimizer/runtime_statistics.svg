<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="30.6923" font-weight="bold" fill="var(--primary-accent)">Runtime Statistics Collection</text>
  <rect x="40" y="80.8451" width="227.027" height="73.5211" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="153.5135" y="126.5915" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)">Query Start</text>
  <line x1="267.027" y1="116.7888" x2="331.8919" y2="116.7888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="340" y="80.8451" width="243.2432" height="73.5211" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="461.6216" y="113.5211" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--ok-accent)">Collect Runtime</text>
  <text x="461.6216" y="139.662" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--ok-accent)">Statistics</text>
  <line x1="583.2432" y1="116.7888" x2="648.1081" y2="116.7888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="656.2162" y="80.8451" width="243.2432" height="73.5211" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="777.8378" y="113.5211" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--warn-accent)">AQE Re-optimize</text>
  <text x="777.8378" y="139.662" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--warn-accent)">Plan</text>
  <line x1="899.4594" y1="116.7888" x2="964.3243" y2="116.7888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="972.4325" y="80.8451" width="259.4595" height="73.5211" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9553" />
  <text x="1102.1621" y="126.5915" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--bg)">Optimized Execution</text>
  <text x="640" y="211.5493" text-anchor="middle" font-family="Arial" font-size="23.0192" font-weight="bold" fill="var(--text)">Statistics Collected at Runtime</text>
  <rect x="40" y="244.2253" width="372.973" height="98.0282" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="226.4865" y="281.8028" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)">Partition Sizes</text>
  <text x="226.4865" y="314.4789" text-anchor="middle" font-family="Arial" font-size="16.8808" fill="var(--text)">Bytes per shuffle partition</text>
  <rect x="453.5135" y="244.2253" width="372.973" height="98.0282" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="281.8028" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)">Row Counts</text>
  <text x="640" y="314.4789" text-anchor="middle" font-family="Arial" font-size="16.8808" fill="var(--text)">Actual rows per partition</text>
  <rect x="867.027" y="244.2253" width="372.973" height="98.0282" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1053.5135" y="281.8028" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--warn-accent)">Data Distribution</text>
  <text x="1053.5135" y="314.4789" text-anchor="middle" font-family="Arial" font-size="16.8808" fill="var(--text)">Skew detection info</text>
  <rect x="40" y="366.7606" width="372.973" height="98.0282" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="226.4865" y="404.338" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--danger-accent)">Join Output Size</text>
  <text x="226.4865" y="437.0141" text-anchor="middle" font-family="Arial" font-size="16.8808" fill="var(--text)">Actual join cardinality</text>
  <rect x="453.5135" y="366.7606" width="372.973" height="98.0282" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="404.338" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--info-accent)">Filter Selectivity</text>
  <text x="640" y="437.0141" text-anchor="middle" font-family="Arial" font-size="16.8808" fill="var(--text)">Actual filter pass rate</text>
  <rect x="867.027" y="366.7606" width="372.973" height="98.0282" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1053.5135" y="404.338" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)">Task Metrics</text>
  <text x="1053.5135" y="437.0141" text-anchor="middle" font-family="Arial" font-size="16.8808" fill="var(--text)">Duration, GC time, spill</text>
  <text x="640" y="513.8029" text-anchor="middle" font-family="Arial" font-size="23.0192" font-weight="bold" fill="var(--text)">AQE Actions Based on Statistics</text>
  <rect x="40" y="538.3098" width="283.7838" height="81.6902" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="181.0811" y="570.9859" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)">Coalesce Small</text>
  <text x="181.0811" y="600.3943" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)">Partitions</text>
  <rect x="356.2162" y="538.3098" width="283.7838" height="81.6902" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="497.2972" y="570.9859" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)">Split Skewed</text>
  <text x="497.2972" y="600.3943" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)">Partitions</text>
  <rect x="672.4325" y="538.3098" width="283.7838" height="81.6902" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="813.5135" y="570.9859" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)">Switch Join</text>
  <text x="813.5135" y="600.3943" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)">Strategy</text>
  <rect x="988.6486" y="538.3098" width="251.3514" height="81.6902" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1113.5135" y="570.9859" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)">Optimize</text>
  <text x="1113.5135" y="600.3943" text-anchor="middle" font-family="Arial" font-size="18.4153" font-weight="bold" fill="var(--primary-accent)">Shuffle</text>
</svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#1a237e">Runtime Statistics Collection</text>

  <!-- Query Execution flow -->
  <rect x="30" y="55" width="140" height="45" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="100" y="83" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1a237e">Query Start</text>
  <line x1="170" y1="77" x2="210" y2="77" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="215" y="55" width="150" height="45" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="290" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1b5e20">Collect Runtime</text>
  <text x="290" y="91" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1b5e20">Statistics</text>
  <line x1="365" y1="77" x2="405" y2="77" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="410" y="55" width="150" height="45" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="485" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">AQE Re-optimize</text>
  <text x="485" y="91" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Plan</text>
  <line x1="560" y1="77" x2="600" y2="77" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="605" y="55" width="160" height="45" rx="8" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="685" y="83" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#fff">Optimized Execution</text>

  <!-- Statistics collected -->
  <text x="400" y="135" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#333">Statistics Collected at Runtime</text>

  <!-- Row 1 -->
  <rect x="30" y="155" width="230" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="145" y="178" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1a237e">Partition Sizes</text>
  <text x="145" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Bytes per shuffle partition</text>

  <rect x="285" y="155" width="230" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="400" y="178" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1b5e20">Row Counts</text>
  <text x="400" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Actual rows per partition</text>

  <rect x="540" y="155" width="230" height="60" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="655" y="178" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Data Distribution</text>
  <text x="655" y="198" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Skew detection info</text>

  <!-- Row 2 -->
  <rect x="30" y="230" width="230" height="60" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="145" y="253" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c62828">Join Output Size</text>
  <text x="145" y="273" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Actual join cardinality</text>

  <rect x="285" y="230" width="230" height="60" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="400" y="253" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Filter Selectivity</text>
  <text x="400" y="273" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Actual filter pass rate</text>

  <rect x="540" y="230" width="230" height="60" rx="6" fill="#e0f7fa" stroke="#00695c" stroke-width="1.5"/>
  <text x="655" y="253" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#00695c">Task Metrics</text>
  <text x="655" y="273" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Duration, GC time, spill</text>

  <!-- AQE actions -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#333">AQE Actions Based on Statistics</text>

  <rect x="30" y="335" width="175" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="117" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#3949ab">Coalesce Small</text>
  <text x="117" y="373" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#3949ab">Partitions</text>

  <rect x="225" y="335" width="175" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="312" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#3949ab">Split Skewed</text>
  <text x="312" y="373" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#3949ab">Partitions</text>

  <rect x="420" y="335" width="175" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="507" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#3949ab">Switch Join</text>
  <text x="507" y="373" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#3949ab">Strategy</text>

  <rect x="615" y="335" width="155" height="50" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="692" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#3949ab">Optimize</text>
  <text x="692" y="373" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#3949ab">Shuffle</text>
</svg>

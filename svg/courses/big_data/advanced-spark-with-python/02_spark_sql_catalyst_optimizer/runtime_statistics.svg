<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial" font-size="29.5527" font-weight="bold" fill="var(--primary-accent)">Runtime Statistics Collection</text>
  <rect x="44.329" y="91.4286" width="206.8687" height="74.8052" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="147.7633" y="137.974" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">Query Start</text>
  <line x1="251.1977" y1="128" x2="310.303" y2="128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="317.6912" y="91.4286" width="221.645" height="74.8052" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="428.5137" y="124.6753" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Collect Runtime</text>
  <text x="428.5137" y="151.2727" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Statistics</text>
  <line x1="539.3362" y1="128" x2="598.4416" y2="128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="605.8297" y="91.4286" width="221.645" height="74.8052" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="716.6522" y="124.6753" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--warn-accent)">AQE Re-optimize</text>
  <text x="716.6522" y="151.2727" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--warn-accent)">Plan</text>
  <line x1="827.4747" y1="128" x2="886.5801" y2="128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="893.9683" y="91.4286" width="236.4214" height="74.8052" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9553" />
  <text x="1012.1789" y="137.974" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--bg)">Optimized Execution</text>
  <text x="591.0534" y="224.4156" text-anchor="middle" font-family="Arial" font-size="22.1645" font-weight="bold" fill="var(--text)">Statistics Collected at Runtime</text>
  <rect x="44.329" y="257.6623" width="339.8557" height="99.7403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="214.2569" y="295.8961" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">Partition Sizes</text>
  <text x="214.2569" y="329.1429" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Bytes per shuffle partition</text>
  <rect x="421.1255" y="257.6623" width="339.8557" height="99.7403" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="591.0534" y="295.8961" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--ok-accent)">Row Counts</text>
  <text x="591.0534" y="329.1429" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Actual rows per partition</text>
  <rect x="797.9221" y="257.6623" width="339.8557" height="99.7403" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="967.8499" y="295.8961" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--warn-accent)">Data Distribution</text>
  <text x="967.8499" y="329.1429" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Skew detection info</text>
  <rect x="44.329" y="382.3377" width="339.8557" height="99.7403" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="214.2569" y="420.5714" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--danger-accent)">Join Output Size</text>
  <text x="214.2569" y="453.8182" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Actual join cardinality</text>
  <rect x="421.1255" y="382.3377" width="339.8557" height="99.7403" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="591.0534" y="420.5714" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--info-accent)">Filter Selectivity</text>
  <text x="591.0534" y="453.8182" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Actual filter pass rate</text>
  <rect x="797.9221" y="382.3377" width="339.8557" height="99.7403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="967.8499" y="420.5714" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--ok-accent)">Task Metrics</text>
  <text x="967.8499" y="453.8182" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Duration, GC time, spill</text>
  <text x="591.0534" y="531.9481" text-anchor="middle" font-family="Arial" font-size="22.1645" font-weight="bold" fill="var(--text)">AQE Actions Based on Statistics</text>
  <rect x="44.329" y="556.8831" width="258.5859" height="83.1169" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="172.8831" y="590.1299" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Coalesce Small</text>
  <text x="172.8831" y="620.0519" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Partitions</text>
  <rect x="332.4675" y="556.8831" width="258.5859" height="83.1169" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="461.0216" y="590.1299" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Split Skewed</text>
  <text x="461.0216" y="620.0519" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Partitions</text>
  <rect x="620.6061" y="556.8831" width="258.5859" height="83.1169" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="749.1602" y="590.1299" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Switch Join</text>
  <text x="749.1602" y="620.0519" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Strategy</text>
  <rect x="908.7446" y="556.8831" width="229.0332" height="83.1169" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1022.5224" y="590.1299" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Optimize</text>
  <text x="1022.5224" y="620.0519" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--primary-accent)">Shuffle</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="575.7429" y="46.2651" text-anchor="middle" font-family="Arial" font-size="28.7871" font-weight="bold" fill="var(--primary-accent)">File Format Optimization</text>
  <text x="158.3293" y="100.241" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--text)">Format</text>
  <text x="403.0201" y="100.241" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--text)">Columnar</text>
  <text x="575.7429" y="100.241" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--text)">Compression</text>
  <text x="762.8594" y="100.241" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--text)">Pushdown</text>
  <text x="978.763" y="100.241" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--text)">Best For</text>
  <line x1="28.7871" y1="115.6626" x2="1122.6988" y2="115.6626" stroke="var(--border)" stroke-width="1.4394" />
  <rect x="43.1807" y="131.0843" width="230.2972" height="69.3976" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="158.3293" y="174.2651" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--ok-accent)">Parquet</text>
  <text x="403.0201" y="174.2651" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--ok-accent)">Yes</text>
  <text x="575.7429" y="174.2651" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--ok-accent)">Excellent</text>
  <text x="762.8594" y="174.2651" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--ok-accent)">Full</text>
  <text x="978.763" y="174.2651" text-anchor="middle" font-family="Arial" font-size="17.2723" fill="var(--text)">Analytics, default</text>
  <rect x="43.1807" y="223.6144" width="230.2972" height="69.3976" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="158.3293" y="266.7951" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--primary-accent)">ORC</text>
  <text x="403.0201" y="266.7951" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--primary-accent)">Yes</text>
  <text x="575.7429" y="266.7951" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--primary-accent)">Excellent</text>
  <text x="762.8594" y="266.7951" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--primary-accent)">Full</text>
  <text x="978.763" y="266.7951" text-anchor="middle" font-family="Arial" font-size="17.2723" fill="var(--text)">Hive workloads</text>
  <rect x="43.1807" y="316.1446" width="230.2972" height="69.3976" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="158.3293" y="359.3253" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--warn-accent)">Avro</text>
  <text x="403.0201" y="359.3253" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--warn-accent)">No (row)</text>
  <text x="575.7429" y="359.3253" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--warn-accent)">Good</text>
  <text x="762.8594" y="359.3253" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--warn-accent)">Limited</text>
  <text x="978.763" y="359.3253" text-anchor="middle" font-family="Arial" font-size="17.2723" fill="var(--text)">Schema evolution</text>
  <rect x="43.1807" y="408.6747" width="230.2972" height="69.3976" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="158.3293" y="451.8554" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--danger-accent)">JSON</text>
  <text x="403.0201" y="451.8554" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--danger-accent)">No (row)</text>
  <text x="575.7429" y="451.8554" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--danger-accent)">Poor</text>
  <text x="762.8594" y="451.8554" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--danger-accent)">None</text>
  <text x="978.763" y="451.8554" text-anchor="middle" font-family="Arial" font-size="17.2723" fill="var(--text)">Interchange only</text>
  <rect x="43.1807" y="501.2048" width="230.2972" height="69.3976" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="158.3293" y="544.3856" text-anchor="middle" font-family="Arial" font-size="20.151" font-weight="bold" fill="var(--danger-accent)">CSV</text>
  <text x="403.0201" y="544.3856" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--danger-accent)">No (row)</text>
  <text x="575.7429" y="544.3856" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--danger-accent)">None</text>
  <text x="762.8594" y="544.3856" text-anchor="middle" font-family="Arial" font-size="18.7116" fill="var(--danger-accent)">None</text>
  <text x="978.763" y="544.3856" text-anchor="middle" font-family="Arial" font-size="17.2723" fill="var(--text)">Legacy import</text>
  <rect x="143.9357" y="593.7349" width="863.6144" height="46.2651" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="575.7429" y="624.5783" text-anchor="middle" font-family="Arial" font-size="18.7116" font-weight="bold" fill="var(--ok-accent)">Recommendation: Use Parquet with Snappy compression for most Spark SQL workloads</text>
</svg>
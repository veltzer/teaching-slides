<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="29.7999" font-weight="bold" fill="var(--primary-accent)">File Format Optimization</text>
  <text x="182.1053" y="92.7273" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--text)">Format</text>
  <text x="450.5264" y="92.7273" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--text)">Columnar</text>
  <text x="639.9999" y="92.7273" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--text)">Compression</text>
  <text x="845.2631" y="92.7273" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--text)">Pushdown</text>
  <text x="1082.1052" y="92.7273" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--text)">Best For</text>
  <line x1="40" y1="107.7921" x2="1240" y2="107.7921" stroke="var(--border)" stroke-width="1.4394" />
  <rect x="55.7895" y="122.8571" width="252.6316" height="67.7922" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="165.039" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--ok-accent)">Parquet</text>
  <text x="450.5264" y="165.039" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--ok-accent)">Yes</text>
  <text x="639.9999" y="165.039" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--ok-accent)">Excellent</text>
  <text x="845.2631" y="165.039" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--ok-accent)">Full</text>
  <text x="1082.1052" y="165.039" text-anchor="middle" font-family="Arial" font-size="17.88" fill="var(--text)">Analytics, default</text>
  <rect x="55.7895" y="213.2467" width="252.6316" height="67.7922" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="255.4285" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--primary-accent)">ORC</text>
  <text x="450.5264" y="255.4285" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--primary-accent)">Yes</text>
  <text x="639.9999" y="255.4285" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--primary-accent)">Excellent</text>
  <text x="845.2631" y="255.4285" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--primary-accent)">Full</text>
  <text x="1082.1052" y="255.4285" text-anchor="middle" font-family="Arial" font-size="17.88" fill="var(--text)">Hive workloads</text>
  <rect x="55.7895" y="303.6364" width="252.6316" height="67.7922" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="345.8182" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--warn-accent)">Avro</text>
  <text x="450.5264" y="345.8182" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--warn-accent)">No (row)</text>
  <text x="639.9999" y="345.8182" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--warn-accent)">Good</text>
  <text x="845.2631" y="345.8182" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--warn-accent)">Limited</text>
  <text x="1082.1052" y="345.8182" text-anchor="middle" font-family="Arial" font-size="17.88" fill="var(--text)">Schema evolution</text>
  <rect x="55.7895" y="394.026" width="252.6316" height="67.7922" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="436.2078" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--danger-accent)">JSON</text>
  <text x="450.5264" y="436.2078" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--danger-accent)">No (row)</text>
  <text x="639.9999" y="436.2078" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--danger-accent)">Poor</text>
  <text x="845.2631" y="436.2078" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--danger-accent)">None</text>
  <text x="1082.1052" y="436.2078" text-anchor="middle" font-family="Arial" font-size="17.88" fill="var(--text)">Interchange only</text>
  <rect x="55.7895" y="484.4156" width="252.6316" height="67.7922" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="526.5975" text-anchor="middle" font-family="Arial" font-size="20.86" font-weight="bold" fill="var(--danger-accent)">CSV</text>
  <text x="450.5264" y="526.5975" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--danger-accent)">No (row)</text>
  <text x="639.9999" y="526.5975" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--danger-accent)">None</text>
  <text x="845.2631" y="526.5975" text-anchor="middle" font-family="Arial" font-size="19.3699" fill="var(--danger-accent)">None</text>
  <text x="1082.1052" y="526.5975" text-anchor="middle" font-family="Arial" font-size="17.88" fill="var(--text)">Legacy import</text>
  <rect x="166.3158" y="574.8052" width="947.3683" height="45.1948" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="604.9351" text-anchor="middle" font-family="Arial" font-size="19.3699" font-weight="bold" fill="var(--ok-accent)">Recommendation: Use Parquet with Snappy compression for most Spark SQL workloads</text>
</svg>
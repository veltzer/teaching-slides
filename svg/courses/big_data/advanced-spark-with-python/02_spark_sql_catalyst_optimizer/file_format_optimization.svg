  <text x="450.5264" y="40" text-anchor="middle" font-size="21.878153138644" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Columnar</text>
  <text x="639.9999" y="40" text-anchor="middle" font-size="21.878153138644" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Compression</text>
  <text x="845.2631" y="40" text-anchor="middle" font-size="21.878153138644" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Pushdown</text>
  <text x="1082.1052" y="40" text-anchor="middle" font-size="21.878153138644" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Best For</text>
  <line x1="40" y1="56.571280857135" x2="1240" y2="56.571280857135" stroke="var(--border)" stroke-width="1.4394"/>
  <rect x="55.7895" y="73.142781714282" width="252.6316" height="74.571423857143" rx="6.292853251767" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="119.542874114287" text-anchor="middle" font-size="21.878153138644" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Parquet</text>
  <text x="450.5264" y="119.542874114287" text-anchor="middle" font-size="20.315323033567" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <text x="639.9999" y="119.542874114287" text-anchor="middle" font-size="20.315323033567" fill="var(--ok-accent)" font-family="Arial, sans-serif">Excellent</text>
  <text x="845.2631" y="119.542874114287" text-anchor="middle" font-size="20.315323033567" fill="var(--ok-accent)" font-family="Arial, sans-serif">Full</text>
  <text x="1082.1052" y="119.542874114287" text-anchor="middle" font-size="18.752702690266" fill="var(--text)" font-family="Arial, sans-serif">Analytics, default</text>
  <rect x="55.7895" y="172.571346857139" width="252.6316" height="74.571423857143" rx="6.292853251767" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="218.971329257138" text-anchor="middle" font-size="21.878153138644" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ORC</text>
  <text x="450.5264" y="218.971329257138" text-anchor="middle" font-size="20.315323033567" fill="var(--primary-accent)" font-family="Arial, sans-serif">Yes</text>
  <text x="639.9999" y="218.971329257138" text-anchor="middle" font-size="20.315323033567" fill="var(--primary-accent)" font-family="Arial, sans-serif">Excellent</text>
  <text x="845.2631" y="218.971329257138" text-anchor="middle" font-size="20.315323033567" fill="var(--primary-accent)" font-family="Arial, sans-serif">Full</text>
  <text x="1082.1052" y="218.971329257138" text-anchor="middle" font-size="18.752702690266" fill="var(--text)" font-family="Arial, sans-serif">Hive workloads</text>
  <rect x="55.7895" y="272.000022000001" width="252.6316" height="74.571423857143" rx="6.292853251767" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="318.4000044" text-anchor="middle" font-size="21.878153138644" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Avro</text>
  <text x="450.5264" y="318.4000044" text-anchor="middle" font-size="20.315323033567" fill="var(--warn-accent)" font-family="Arial, sans-serif">No (row)</text>
  <text x="639.9999" y="318.4000044" text-anchor="middle" font-size="20.315323033567" fill="var(--warn-accent)" font-family="Arial, sans-serif">Good</text>
  <text x="845.2631" y="318.4000044" text-anchor="middle" font-size="20.315323033567" fill="var(--warn-accent)" font-family="Arial, sans-serif">Limited</text>
  <text x="1082.1052" y="318.4000044" text-anchor="middle" font-size="18.752702690266" fill="var(--text)" font-family="Arial, sans-serif">Schema evolution</text>
  <rect x="55.7895" y="371.428587142858" width="252.6316" height="74.571423857143" rx="6.292853251767" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="417.828569542857" text-anchor="middle" font-size="21.878153138644" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">JSON</text>
  <text x="450.5264" y="417.828569542857" text-anchor="middle" font-size="20.315323033567" fill="var(--danger-accent)" font-family="Arial, sans-serif">No (row)</text>
  <text x="639.9999" y="417.828569542857" text-anchor="middle" font-size="20.315323033567" fill="var(--danger-accent)" font-family="Arial, sans-serif">Poor</text>
  <text x="845.2631" y="417.828569542857" text-anchor="middle" font-size="20.315323033567" fill="var(--danger-accent)" font-family="Arial, sans-serif">None</text>
  <text x="1082.1052" y="417.828569542857" text-anchor="middle" font-size="18.752702690266" fill="var(--text)" font-family="Arial, sans-serif">Interchange only</text>
  <rect x="55.7895" y="470.857152285715" width="252.6316" height="74.571423857143" rx="6.292853251767" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="182.1053" y="517.25724468572" text-anchor="middle" font-size="21.878153138644" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">CSV</text>
  <text x="450.5264" y="517.25724468572" text-anchor="middle" font-size="20.315323033567" fill="var(--danger-accent)" font-family="Arial, sans-serif">No (row)</text>
  <text x="639.9999" y="517.25724468572" text-anchor="middle" font-size="20.315323033567" fill="var(--danger-accent)" font-family="Arial, sans-serif">None</text>
  <text x="845.2631" y="517.25724468572" text-anchor="middle" font-size="20.315323033567" fill="var(--danger-accent)" font-family="Arial, sans-serif">None</text>
  <text x="1082.1052" y="517.25724468572" text-anchor="middle" font-size="18.752702690266" fill="var(--text)" font-family="Arial, sans-serif">Legacy import</text>
  <rect x="166.3158" y="570.285717428572" width="947.3683" height="49.714282571428" rx="6.292853251767" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="603.428609142859" text-anchor="middle" font-size="20.315323033567" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Recommendation: Use Parquet with Snappy compression for most Spark SQL workloads</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="160" y="40" width="960" height="43.3644" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="67.1028" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1723" font-weight="bold" fill="var(--text)">SQL Query / DataFrame API</text>
  <line x1="639.9999" y1="83.3645" x2="639.9999" y2="105.0467" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="110.4673" width="1200" height="75.8878" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="137.5701" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0172" font-weight="bold" fill="var(--text)">Phase 1: PARSING</text>
  <text x="639.9999" y="164.6729" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.7069" fill="var(--text-muted)">SQL string --&gt; Unresolved Logical Plan (names as strings, no types)</text>
  <line x1="639.9999" y1="186.3552" x2="639.9999" y2="208.0374" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="213.458" width="1200" height="75.8878" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="240.5608" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0172" font-weight="bold" fill="var(--text)">Phase 2: ANALYSIS</text>
  <text x="639.9999" y="267.6636" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.7069" fill="var(--text-muted)">Resolve columns, tables, functions using Catalog</text>
  <line x1="639.9999" y1="289.3458" x2="639.9999" y2="311.028" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="316.4486" width="1200" height="97.5701" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="346.8038" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0172" font-weight="bold" fill="var(--text)">Phase 3: LOGICAL OPTIMIZATION</text>
  <text x="639.9999" y="372.8224" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.7069" fill="var(--text-muted)">Predicate pushdown, Column pruning,</text>
  <text x="639.9999" y="394.5047" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.7069" fill="var(--text-muted)">Constant folding, Boolean simplification</text>
  <line x1="639.9999" y1="414.0187" x2="639.9999" y2="435.7009" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="441.1215" width="1200" height="75.8878" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="468.2243" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0172" font-weight="bold" fill="var(--text)">Phase 4: PHYSICAL PLANNING</text>
  <text x="639.9999" y="495.3271" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.7069" fill="var(--text-muted)">Generate physical plans; CBO selects cheapest</text>
  <line x1="639.9999" y1="517.0094" x2="639.9999" y2="538.6916" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="544.1122" width="1200" height="75.8878" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="571.2149" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0172" font-weight="bold" fill="var(--text)">Phase 5: CODE GENERATION (Tungsten)</text>
  <text x="639.9999" y="598.3177" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.7069" fill="var(--text-muted)">Whole-stage codegen: Java bytecode for CPU-efficient execution</text>
</svg>

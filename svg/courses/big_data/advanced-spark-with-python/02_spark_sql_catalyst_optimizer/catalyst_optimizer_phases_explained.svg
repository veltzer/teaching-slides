<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-cat" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,10.5882 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <rect x="227.0968" y="5.2941" width="825.8065" height="42.3529" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="31.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.8235" font-weight="bold" fill="var(--text)">SQL Query / DataFrame API</text>
  <line x1="640" y1="47.6471" x2="640" y2="68.8235" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cat)" />
  <rect x="123.871" y="74.1176" width="1032.2581" height="74.1176" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="100.5882" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7647" font-weight="bold" fill="var(--text)">Phase 1: PARSING</text>
  <text x="640" y="127.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.6471" fill="var(--text-muted)">SQL string --&gt; Unresolved Logical Plan (names as strings, no types)</text>
  <line x1="640" y1="148.2353" x2="640" y2="169.4118" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cat)" />
  <rect x="123.871" y="174.7059" width="1032.2581" height="74.1176" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="201.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7647" font-weight="bold" fill="var(--text)">Phase 2: ANALYSIS</text>
  <text x="640" y="227.6471" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.6471" fill="var(--text-muted)">Resolve columns, tables, functions using Catalog</text>
  <line x1="640" y1="248.8235" x2="640" y2="270" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cat)" />
  <rect x="123.871" y="275.2941" width="1032.2581" height="95.2941" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="304.9412" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7647" font-weight="bold" fill="var(--text)">Phase 3: LOGICAL OPTIMIZATION</text>
  <text x="640" y="330.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.6471" fill="var(--text-muted)">Predicate pushdown, Column pruning,</text>
  <text x="640" y="351.5294" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.6471" fill="var(--text-muted)">Constant folding, Boolean simplification</text>
  <line x1="640" y1="370.5882" x2="640" y2="391.7647" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cat)" />
  <rect x="123.871" y="397.0588" width="1032.2581" height="74.1176" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="423.5294" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7647" font-weight="bold" fill="var(--text)">Phase 4: PHYSICAL PLANNING</text>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.6471" fill="var(--text-muted)">Generate physical plans; CBO selects cheapest</text>
  <line x1="640" y1="471.1765" x2="640" y2="492.3529" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-cat)" />
  <rect x="123.871" y="497.6471" width="1032.2581" height="74.1176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="524.1176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.7647" font-weight="bold" fill="var(--text)">Phase 5: CODE GENERATION (Tungsten)</text>
  <text x="640" y="550.5882" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.6471" fill="var(--text-muted)">Whole-stage codegen: Java bytecode for CPU-efficient execution</text>
</svg>
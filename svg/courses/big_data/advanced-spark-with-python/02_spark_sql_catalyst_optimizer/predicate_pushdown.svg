<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="632.0988" y="53.3333" text-anchor="middle" font-family="Arial" font-size="31.6049" font-weight="bold" fill="var(--primary-accent)">Predicate Pushdown</text>
  <text x="316.0494" y="115.5556" text-anchor="middle" font-family="Arial" font-size="25.284" font-weight="bold" fill="var(--danger-accent)">Before Optimization</text>
  <rect x="221.2346" y="142.2222" width="189.6296" height="71.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="316.0494" y="186.6667" text-anchor="middle" font-family="Arial" font-size="20.5432" fill="var(--danger-accent)">Result</text>
  <rect x="221.2346" y="248.8889" width="189.6296" height="71.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="316.0494" y="293.3333" text-anchor="middle" font-family="Arial" font-size="20.5432" fill="var(--danger-accent)">Filter (age &gt; 25)</text>
  <line x1="316.0494" y1="213.3333" x2="316.0494" y2="248.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="221.2346" y="355.5556" width="189.6296" height="71.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="316.0494" y="400" text-anchor="middle" font-family="Arial" font-size="20.5432" fill="var(--danger-accent)">Join</text>
  <line x1="316.0494" y1="320" x2="316.0494" y2="355.5556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="126.4198" y="480" width="173.8272" height="71.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="213.3333" y="524.4444" text-anchor="middle" font-family="Arial" font-size="18.963" fill="var(--danger-accent)">Scan Orders</text>
  <line x1="276.5432" y1="426.6667" x2="237.037" y2="480" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="331.8519" y="480" width="189.6296" height="71.1111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="426.6667" y="524.4444" text-anchor="middle" font-family="Arial" font-size="18.963" fill="var(--danger-accent)">Scan Customers</text>
  <line x1="355.5556" y1="426.6667" x2="402.963" y2="480" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="316.0494" y="640" text-anchor="middle" font-family="Arial" font-size="18.963" fill="var(--danger-accent)">All rows scanned, then filtered</text>
  <line x1="584.6914" y1="355.5556" x2="679.5062" y2="355.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="632.0988" y="337.7778" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--primary-accent)">Catalyst</text>
  <text x="948.1481" y="115.5556" text-anchor="middle" font-family="Arial" font-size="25.284" font-weight="bold" fill="var(--ok-accent)">After Optimization</text>
  <rect x="853.3333" y="142.2222" width="189.6296" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.1481" y="186.6667" text-anchor="middle" font-family="Arial" font-size="20.5432" fill="var(--ok-accent)">Result</text>
  <rect x="853.3333" y="248.8889" width="189.6296" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.1481" y="293.3333" text-anchor="middle" font-family="Arial" font-size="20.5432" fill="var(--ok-accent)">Join</text>
  <line x1="948.1481" y1="213.3333" x2="948.1481" y2="248.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="726.9136" y="373.3333" width="189.6296" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="821.7284" y="417.7778" text-anchor="middle" font-family="Arial" font-size="18.963" fill="var(--warn-accent)">Filter (age &gt; 25)</text>
  <line x1="908.642" y1="320" x2="853.3333" y2="373.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="726.9136" y="488.8889" width="189.6296" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="821.7284" y="533.3333" text-anchor="middle" font-family="Arial" font-size="18.963" fill="var(--ok-accent)">Scan Orders</text>
  <line x1="821.7284" y1="444.4444" x2="821.7284" y2="488.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="979.7531" y="373.3333" width="205.4321" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1082.4691" y="417.7778" text-anchor="middle" font-family="Arial" font-size="18.963" fill="var(--ok-accent)">Scan Customers</text>
  <line x1="987.6543" y1="320" x2="1058.7654" y2="373.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="948.1481" y="640" text-anchor="middle" font-family="Arial" font-size="18.963" fill="var(--ok-accent)">Filter pushed before join = fewer rows</text>
</svg>
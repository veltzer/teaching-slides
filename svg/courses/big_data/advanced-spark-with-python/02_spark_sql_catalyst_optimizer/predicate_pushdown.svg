<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="613.1343" y="40" text-anchor="middle" font-family="Arial" font-size="33.4552" font-weight="bold" fill="var(--primary-accent)">Predicate Pushdown</text>
  <text x="254.9253" y="101.5152" text-anchor="middle" font-family="Arial" font-size="26.7642" font-weight="bold" fill="var(--danger-accent)">Before Optimization</text>
  <rect x="147.4627" y="127.8788" width="214.9253" height="70.303" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.9253" y="171.8182" text-anchor="middle" font-family="Arial" font-size="21.7459" fill="var(--danger-accent)">Result</text>
  <rect x="147.4627" y="233.3334" width="214.9253" height="70.303" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.9253" y="277.2727" text-anchor="middle" font-family="Arial" font-size="21.7459" fill="var(--danger-accent)">Filter (age &gt; 25)</text>
  <line x1="254.9253" y1="198.1818" x2="254.9253" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="147.4627" y="338.7879" width="214.9253" height="70.303" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.9253" y="382.7273" text-anchor="middle" font-family="Arial" font-size="21.7459" fill="var(--danger-accent)">Join</text>
  <line x1="254.9253" y1="303.6364" x2="254.9253" y2="338.7879" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="461.8182" width="197.015" height="70.303" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.5074" y="505.7575" text-anchor="middle" font-family="Arial" font-size="20.0732" fill="var(--danger-accent)">Scan Orders</text>
  <line x1="210.1492" y1="409.091" x2="165.373" y2="461.8182" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="272.8358" y="461.8182" width="214.9253" height="70.303" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.2985" y="505.7575" text-anchor="middle" font-family="Arial" font-size="20.0732" fill="var(--danger-accent)">Scan Customers</text>
  <line x1="299.7015" y1="409.091" x2="353.4328" y2="461.8182" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="254.9253" y="620" text-anchor="middle" font-family="Arial" font-size="20.0732" fill="var(--danger-accent)">All rows scanned, then filtered</text>
  <line x1="559.403" y1="338.7879" x2="666.8657" y2="338.7879" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="613.1343" y="321.2122" text-anchor="middle" font-family="Arial" font-size="20.0732" font-weight="bold" fill="var(--primary-accent)">Catalyst</text>
  <text x="971.3432" y="101.5152" text-anchor="middle" font-family="Arial" font-size="26.7642" font-weight="bold" fill="var(--ok-accent)">After Optimization</text>
  <rect x="863.8805" y="127.8788" width="214.9253" height="70.303" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.3432" y="171.8182" text-anchor="middle" font-family="Arial" font-size="21.7459" fill="var(--ok-accent)">Result</text>
  <rect x="863.8805" y="233.3334" width="214.9253" height="70.303" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.3432" y="277.2727" text-anchor="middle" font-family="Arial" font-size="21.7459" fill="var(--ok-accent)">Join</text>
  <line x1="971.3432" y1="198.1818" x2="971.3432" y2="233.3334" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="720.597" y="356.3636" width="214.9253" height="70.303" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.0597" y="400.3031" text-anchor="middle" font-family="Arial" font-size="20.0732" fill="var(--warn-accent)">Filter (age &gt; 25)</text>
  <line x1="926.5672" y1="303.6364" x2="863.8805" y2="356.3636" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="720.597" y="470.6061" width="214.9253" height="70.303" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.0597" y="514.5454" text-anchor="middle" font-family="Arial" font-size="20.0732" fill="var(--ok-accent)">Scan Orders</text>
  <line x1="828.0597" y1="426.6666" x2="828.0597" y2="470.6061" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1007.1642" y="356.3636" width="232.8358" height="70.303" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.582" y="400.3031" text-anchor="middle" font-family="Arial" font-size="20.0732" fill="var(--ok-accent)">Scan Customers</text>
  <line x1="1016.1194" y1="303.6364" x2="1096.7164" y2="356.3636" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="971.3432" y="620" text-anchor="middle" font-family="Arial" font-size="20.0732" fill="var(--ok-accent)">Filter pushed before join = fewer rows</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="254.9253" y="40" text-anchor="middle" font-size="28.307417405284" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Before Optimization</text>
  <rect x="147.4627" y="69.491487503587" width="214.9253" height="78.644041252511" rx="6.345958572709" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.9253" y="118.644041252511" text-anchor="middle" font-size="22.999763421046" fill="var(--danger-accent)" font-family="Arial, sans-serif">Result</text>
  <rect x="147.4627" y="187.457661246771" width="214.9253" height="78.644041252511" rx="6.345958572709" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.9253" y="236.610103131278" text-anchor="middle" font-size="22.999763421046" fill="var(--danger-accent)" font-family="Arial, sans-serif">Filter (age &gt; 25)</text>
  <line x1="254.9253" y1="148.135528756099" x2="254.9253" y2="187.457661246771" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="147.4627" y="305.423723125538" width="214.9253" height="78.644041252511" rx="6.345958572709" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.9253" y="354.576276874462" text-anchor="middle" font-size="22.999763421046" fill="var(--danger-accent)" font-family="Arial, sans-serif">Join</text>
  <line x1="254.9253" y1="266.101702499283" x2="254.9253" y2="305.423723125538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="443.050851249641" width="197.015" height="78.644041252511" rx="6.345958572709" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="138.5074" y="492.203293134148" text-anchor="middle" font-size="21.230615936951" fill="var(--danger-accent)" font-family="Arial, sans-serif">Scan Orders</text>
  <line x1="210.1492" y1="384.067876242467" x2="165.373" y2="443.050851249641" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="272.8358" y="443.050851249641" width="214.9253" height="78.644041252511" rx="6.345958572709" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="380.2985" y="492.203293134148" text-anchor="middle" font-size="21.230615936951" fill="var(--danger-accent)" font-family="Arial, sans-serif">Scan Customers</text>
  <line x1="299.7015" y1="384.067876242467" x2="353.4328" y2="443.050851249641" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254.9253" y="620" text-anchor="middle" font-size="21.230615936951" fill="var(--danger-accent)" font-family="Arial, sans-serif">All rows scanned, then filtered</text>
  <line x1="559.403" y1="305.423723125538" x2="666.8657" y2="305.423723125538" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="613.1343" y="285.762768744619" text-anchor="middle" font-size="21.230615936951" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Catalyst</text>
  <text x="971.3432" y="40" text-anchor="middle" font-size="28.307417405284" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">After Optimization</text>
  <rect x="863.8805" y="69.491487503587" width="214.9253" height="78.644041252511" rx="6.345958572709" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.3432" y="118.644041252511" text-anchor="middle" font-size="22.999763421046" fill="var(--ok-accent)" font-family="Arial, sans-serif">Result</text>
  <rect x="863.8805" y="187.457661246771" width="214.9253" height="78.644041252511" rx="6.345958572709" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.3432" y="236.610103131278" text-anchor="middle" font-size="22.999763421046" fill="var(--ok-accent)" font-family="Arial, sans-serif">Join</text>
  <line x1="971.3432" y1="148.135528756099" x2="971.3432" y2="187.457661246771" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="720.597" y="325.084677506457" width="214.9253" height="78.644041252511" rx="6.345958572709" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.0597" y="374.237343119798" text-anchor="middle" font-size="21.230615936951" fill="var(--warn-accent)" font-family="Arial, sans-serif">Filter (age &gt; 25)</text>
  <line x1="926.5672" y1="266.101702499283" x2="863.8805" y2="325.084677506457" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="720.597" y="452.881384372309" width="214.9253" height="78.644041252511" rx="6.345958572709" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.0597" y="502.033826256816" text-anchor="middle" font-size="21.230615936951" fill="var(--ok-accent)" font-family="Arial, sans-serif">Scan Orders</text>
  <line x1="828.0597" y1="403.728718758968" x2="828.0597" y2="452.881384372309" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1007.1642" y="325.084677506457" width="232.8358" height="78.644041252511" rx="6.345958572709" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.582" y="374.237343119798" text-anchor="middle" font-size="21.230615936951" fill="var(--ok-accent)" font-family="Arial, sans-serif">Scan Customers</text>
  <line x1="1016.1194" y1="266.101702499283" x2="1096.7164" y2="325.084677506457" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="971.3432" y="620" text-anchor="middle" font-size="21.230615936951" fill="var(--ok-accent)" font-family="Arial, sans-serif">Filter pushed before join = fewer rows</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="477.8378" y="40" width="324.3243" height="69.253723435063" rx="6.176508461473" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9553"/>
  <text x="640" y="83.283510915566" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Need custom logic?</text>
  <rect x="445.4054" y="161.194042503899" width="389.1891" height="69.253723435063" rx="6.176508461473" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="204.477659389623" text-anchor="middle" font-size="20.536787692589" fill="var(--warn-accent)" font-family="Arial, sans-serif">Built-in function available?</text>
  <line x1="640" y1="109.253723435063" x2="640" y2="161.194042503899" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="964.3243" y="161.194042503899" width="275.6757" height="69.253723435063" rx="6.176508461473" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="204.477659389623" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Use Built-in (10-1000x)</text>
  <line x1="834.5946" y1="195.82095720651" x2="964.3243" y2="195.82095720651" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="899.4594" y="183.701468179994" font-size="17.377400672738" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="445.4054" y="291.044681220754" width="389.1891" height="69.253723435063" rx="6.176508461473" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="334.328404076635" text-anchor="middle" font-size="20.536787692589" fill="var(--warn-accent)" font-family="Arial, sans-serif">Can use Pandas/Arrow?</text>
  <line x1="640" y1="230.447765938962" x2="640" y2="291.044681220754" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="656.2162" y="270.268701951441" font-size="17.377400672738" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="964.3243" y="291.044681220754" width="275.6757" height="69.253723435063" rx="6.176508461473" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="334.328404076635" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pandas UDF (3-100x)</text>
  <line x1="834.5946" y1="325.671595923365" x2="964.3243" y2="325.671595923365" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="899.4594" y="313.552212867006" font-size="17.377400672738" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="445.4054" y="420.895531877925" width="389.1891" height="69.253723435063" rx="6.176508461473" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="464.17904279349" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Python UDF (1x baseline)</text>
  <line x1="640" y1="360.298510625975" x2="640" y2="420.895531877925" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="656.2162" y="400.119340668295" font-size="17.377400672738" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="40" y="161.194042503899" width="356.7568" height="328.955318779246" rx="6.176508461473" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="218.3784" y="204.477659389623" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Tips</text>
  <text x="64.3243" y="247.761170305189" font-size="18.95704271176" fill="var(--text)" font-family="Arial, sans-serif">- Keep UDFs simple</text>
  <text x="64.3243" y="285.850659910886" font-size="18.95704271176" fill="var(--text)" font-family="Arial, sans-serif">- Avoid global state</text>
  <text x="64.3243" y="323.9403614569" font-size="18.95704271176" fill="var(--text)" font-family="Arial, sans-serif">- Handle nulls explicitly</text>
  <text x="64.3243" y="362.029851062598" font-size="18.95704271176" fill="var(--text)" font-family="Arial, sans-serif">- Use type hints</text>
  <text x="64.3243" y="400.119340668295" font-size="18.95704271176" fill="var(--text)" font-family="Arial, sans-serif">- Test independently</text>
  <text x="64.3243" y="438.208936244151" font-size="18.95704271176" fill="var(--text)" font-family="Arial, sans-serif">- Minimize serialization</text>
  <text x="64.3243" y="476.298531820006" font-size="18.95704271176" fill="var(--text)" font-family="Arial, sans-serif">- Prefer SQL expressions</text>
  <rect x="40" y="542.089574381824" width="1200" height="77.910425618176" rx="6.176508461473" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="580.179063987522" text-anchor="middle" font-size="20.536787692589" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Performance Priority: Built-in Functions &gt; Pandas UDF &gt; Python UDF</text>
  <text x="640" y="607.880510973484" text-anchor="middle" font-size="17.377400672738" fill="var(--text)" font-family="Arial, sans-serif">Built-ins are optimized by Catalyst; UDFs are opaque black boxes</text>
</svg>

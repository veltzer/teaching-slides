<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial" font-size="30.6923" font-weight="bold" fill="var(--primary-accent)">UDF Best Practices</text>
  <rect x="477.8378" y="72.6761" width="324.3243" height="65.3521" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9553" />
  <text x="640" y="113.5211" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--bg)">Need custom logic?</text>
  <rect x="445.4054" y="187.0423" width="389.1891" height="65.3521" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="227.8874" text-anchor="middle" font-family="Arial" font-size="19.9499" fill="var(--warn-accent)">Built-in function available?</text>
  <line x1="640" y1="138.0282" x2="640" y2="187.0423" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="964.3243" y="187.0423" width="275.6757" height="65.3521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1102.1621" y="227.8874" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)">Use Built-in (10-1000x)</text>
  <line x1="834.5946" y1="219.7184" x2="964.3243" y2="219.7184" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="899.4594" y="208.2817" font-family="Arial" font-size="16.8808" fill="var(--ok-accent)">Yes</text>
  <rect x="445.4054" y="309.5774" width="389.1891" height="65.3521" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="350.4226" text-anchor="middle" font-family="Arial" font-size="19.9499" fill="var(--warn-accent)">Can use Pandas/Arrow?</text>
  <line x1="640" y1="252.3944" x2="640" y2="309.5774" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="656.2162" y="289.9719" font-family="Arial" font-size="16.8808" fill="var(--danger-accent)">No</text>
  <rect x="964.3243" y="309.5774" width="275.6757" height="65.3521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1102.1621" y="350.4226" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)">Pandas UDF (3-100x)</text>
  <line x1="834.5946" y1="342.2535" x2="964.3243" y2="342.2535" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="899.4594" y="330.8169" font-family="Arial" font-size="16.8808" fill="var(--ok-accent)">Yes</text>
  <rect x="445.4054" y="432.1127" width="389.1891" height="65.3521" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="472.9577" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--danger-accent)">Python UDF (1x baseline)</text>
  <line x1="640" y1="374.9296" x2="640" y2="432.1127" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="656.2162" y="412.507" font-family="Arial" font-size="16.8808" fill="var(--danger-accent)">No</text>
  <rect x="40" y="187.0423" width="356.7568" height="310.4226" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="218.3784" y="227.8874" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--text)">Tips</text>
  <text x="64.3243" y="268.7324" font-family="Arial" font-size="18.4153" fill="var(--text)">- Keep UDFs simple</text>
  <text x="64.3243" y="304.676" font-family="Arial" font-size="18.4153" fill="var(--text)">- Avoid global state</text>
  <text x="64.3243" y="340.6198" font-family="Arial" font-size="18.4153" fill="var(--text)">- Handle nulls explicitly</text>
  <text x="64.3243" y="376.5634" font-family="Arial" font-size="18.4153" fill="var(--text)">- Use type hints</text>
  <text x="64.3243" y="412.507" font-family="Arial" font-size="18.4153" fill="var(--text)">- Test independently</text>
  <text x="64.3243" y="448.4507" font-family="Arial" font-size="18.4153" fill="var(--text)">- Minimize serialization</text>
  <text x="64.3243" y="484.3944" font-family="Arial" font-size="18.4153" fill="var(--text)">- Prefer SQL expressions</text>
  <rect x="40" y="546.4789" width="1200" height="73.5211" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="582.4225" text-anchor="middle" font-family="Arial" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)">Performance Priority: Built-in Functions &gt; Pandas UDF &gt; Python UDF</text>
  <text x="640" y="608.5633" text-anchor="middle" font-family="Arial" font-size="16.8808" fill="var(--text)">Built-ins are optimized by Catalyst; UDFs are opaque black boxes</text>
</svg>
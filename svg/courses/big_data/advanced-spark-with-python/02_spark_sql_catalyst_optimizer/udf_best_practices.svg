<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="54" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#1a237e">UDF Best Practices</text>
  <rect x="480" y="90" width="320" height="72" rx="32" fill="#1565c0" stroke="#0d47a1" stroke-width="3.2" />
  <text x="640" y="135" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#fff">Need custom logic?</text>
  <rect x="448" y="216" width="384" height="72" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="640" y="261" text-anchor="middle" font-family="Arial" font-size="20.8" fill="#e65100">Built-in function available?</text>
  <line x1="640" y1="162" x2="640" y2="216" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <rect x="960" y="216" width="272" height="72" rx="12.8" fill="#c8e6c9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="1096" y="261" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">Use Built-in (10-1000x)</text>
  <line x1="832" y1="252" x2="960" y2="252" stroke="#2e7d32" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <text x="896" y="239.4" font-family="Arial" font-size="17.6" fill="#2e7d32">Yes</text>
  <rect x="448" y="351" width="384" height="72" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="640" y="396" text-anchor="middle" font-family="Arial" font-size="20.8" fill="#e65100">Can use Pandas/Arrow?</text>
  <line x1="640" y1="288" x2="640" y2="351" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <text x="656" y="329.4" font-family="Arial" font-size="17.6" fill="#c62828">No</text>
  <rect x="960" y="351" width="272" height="72" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="1096" y="396" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1565c0">Pandas UDF (3-100x)</text>
  <line x1="832" y1="387" x2="960" y2="387" stroke="#1565c0" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <text x="896" y="374.4" font-family="Arial" font-size="17.6" fill="#2e7d32">Yes</text>
  <rect x="448" y="486" width="384" height="72" rx="12.8" fill="#ffcdd2" stroke="#c62828" stroke-width="3.2" />
  <text x="640" y="531" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#c62828">Python UDF (1x baseline)</text>
  <line x1="640" y1="423" x2="640" y2="486" stroke="#333" stroke-width="3.2" marker-end="url(#arrowhead)" />
  <text x="656" y="464.4" font-family="Arial" font-size="17.6" fill="#c62828">No</text>
  <rect x="48" y="216" width="352" height="342" rx="12.8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2.4" />
  <text x="224" y="261" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#333">Tips</text>
  <text x="72" y="306" font-family="Arial" font-size="19.2" fill="#333">- Keep UDFs simple</text>
  <text x="72" y="345.6" font-family="Arial" font-size="19.2" fill="#333">- Avoid global state</text>
  <text x="72" y="385.2" font-family="Arial" font-size="19.2" fill="#333">- Handle nulls explicitly</text>
  <text x="72" y="424.8" font-family="Arial" font-size="19.2" fill="#333">- Use type hints</text>
  <text x="72" y="464.4" font-family="Arial" font-size="19.2" fill="#333">- Test independently</text>
  <text x="72" y="504" font-family="Arial" font-size="19.2" fill="#333">- Minimize serialization</text>
  <text x="72" y="543.6" font-family="Arial" font-size="19.2" fill="#333">- Prefer SQL expressions</text>
  <rect x="48" y="612" width="1184" height="81" rx="12.8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.4" />
  <text x="640" y="651.6" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1a237e">Performance Priority: Built-in Functions &gt; Pandas UDF &gt; Python UDF</text>
  <text x="640" y="680.4" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#333">Built-ins are optimized by Catalyst; UDFs are opaque black boxes</text>
</svg>
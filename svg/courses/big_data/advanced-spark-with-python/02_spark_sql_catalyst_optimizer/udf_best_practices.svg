<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:marker id="arrowhead" markerWidth="16" markerHeight="12.6" refX="14.4" refY="6.3" orient="auto">
      <ns0:polygon points="0,18 5.6,0" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial" font-size="29.5527" font-weight="bold" fill="var(--primary-deeper)">UDF Best Practices</ns0:text>
  <ns0:rect x="443.29" y="83.1169" width="295.5267" height="66.4935" rx="29.5527" fill="var(--primary-dk)" stroke="var(--primary-deep)" stroke-width="2.9553" />
  <ns0:text x="591.0534" y="124.6753" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--bg)">Need custom logic?</ns0:text>
  <ns0:rect x="413.7374" y="199.4805" width="354.632" height="66.4935" rx="11.8211" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.9553" />
  <ns0:text x="591.0534" y="241.039" text-anchor="middle" font-family="Arial" font-size="19.2092" fill="var(--warn-dk)">Built-in function available?</ns0:text>
  <ns0:line x1="591.0534" y1="149.6104" x2="591.0534" y2="199.4805" stroke="var(--text-dark)" stroke-width="2.9553" marker-end="url(#arrow)" />
  <ns0:rect x="886.5801" y="199.4805" width="251.1977" height="66.4935" rx="11.8211" fill="var(--ok-lt)" stroke="var(--ok-dk)" stroke-width="2.9553" />
  <ns0:text x="1012.1789" y="241.039" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--ok-dk)">Use Built-in (10-1000x)</ns0:text>
  <ns0:line x1="768.3694" y1="232.7273" x2="886.5801" y2="232.7273" stroke="var(--ok-dk)" stroke-width="2.9553" marker-end="url(#arrow)" />
  <ns0:text x="827.4747" y="221.0909" font-family="Arial" font-size="16.254" fill="var(--ok-dk)">Yes</ns0:text>
  <ns0:rect x="413.7374" y="324.1558" width="354.632" height="66.4935" rx="11.8211" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2.9553" />
  <ns0:text x="591.0534" y="365.7143" text-anchor="middle" font-family="Arial" font-size="19.2092" fill="var(--warn-dk)">Can use Pandas/Arrow?</ns0:text>
  <ns0:line x1="591.0534" y1="265.974" x2="591.0534" y2="324.1558" stroke="var(--text-dark)" stroke-width="2.9553" marker-end="url(#arrow)" />
  <ns0:text x="605.8297" y="304.2078" font-family="Arial" font-size="16.254" fill="var(--danger-dk)">No</ns0:text>
  <ns0:rect x="886.5801" y="324.1558" width="251.1977" height="66.4935" rx="11.8211" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2.9553" />
  <ns0:text x="1012.1789" y="365.7143" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-dk)">Pandas UDF (3-100x)</ns0:text>
  <ns0:line x1="768.3694" y1="357.4026" x2="886.5801" y2="357.4026" stroke="var(--primary-dk)" stroke-width="2.9553" marker-end="url(#arrow)" />
  <ns0:text x="827.4747" y="345.7662" font-family="Arial" font-size="16.254" fill="var(--ok-dk)">Yes</ns0:text>
  <ns0:rect x="413.7374" y="448.8312" width="354.632" height="66.4935" rx="11.8211" fill="var(--danger-lt)" stroke="var(--danger-dk)" stroke-width="2.9553" />
  <ns0:text x="591.0534" y="490.3896" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--danger-dk)">Python UDF (1x baseline)</ns0:text>
  <ns0:line x1="591.0534" y1="390.6494" x2="591.0534" y2="448.8312" stroke="var(--text-dark)" stroke-width="2.9553" marker-end="url(#arrow)" />
  <ns0:text x="605.8297" y="428.8831" font-family="Arial" font-size="16.254" fill="var(--danger-dk)">No</ns0:text>
  <ns0:rect x="44.329" y="199.4805" width="325.0794" height="315.8442" rx="11.8211" fill="var(--surface)" stroke="var(--text-disabled)" stroke-width="2.2165" />
  <ns0:text x="206.8687" y="241.039" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--text-dark)">Tips</ns0:text>
  <ns0:text x="66.4935" y="282.5974" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">- Keep UDFs simple</ns0:text>
  <ns0:text x="66.4935" y="319.1688" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">- Avoid global state</ns0:text>
  <ns0:text x="66.4935" y="355.7403" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">- Handle nulls explicitly</ns0:text>
  <ns0:text x="66.4935" y="392.3117" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">- Use type hints</ns0:text>
  <ns0:text x="66.4935" y="428.8831" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">- Test independently</ns0:text>
  <ns0:text x="66.4935" y="465.4545" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">- Minimize serialization</ns0:text>
  <ns0:text x="66.4935" y="502.026" font-family="Arial" font-size="17.7316" fill="var(--text-dark)">- Prefer SQL expressions</ns0:text>
  <ns0:rect x="44.329" y="565.1948" width="1093.4488" height="74.8052" rx="11.8211" fill="var(--info-indigo-lt)" stroke="var(--primary-indigo)" stroke-width="2.2165" />
  <ns0:text x="591.0534" y="601.7662" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-deeper)">Performance Priority: Built-in Functions &gt; Pandas UDF &gt; Python UDF</ns0:text>
  <ns0:text x="591.0534" y="628.3636" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text-dark)">Built-ins are optimized by Catalyst; UDFs are opaque black boxes</ns0:text>
</ns0:svg>
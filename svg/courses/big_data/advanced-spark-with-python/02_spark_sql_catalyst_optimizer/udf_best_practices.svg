<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial" font-size="29.5527" font-weight="bold" fill="var(--primary-accent)">UDF Best Practices</text>
  <rect x="443.29" y="83.1169" width="295.5267" height="66.4935" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9553" />
  <text x="591.0534" y="124.6753" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--bg)">Need custom logic?</text>
  <rect x="413.7374" y="199.4805" width="354.632" height="66.4935" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="591.0534" y="241.039" text-anchor="middle" font-family="Arial" font-size="19.2092" fill="var(--warn-accent)">Built-in function available?</text>
  <line x1="591.0534" y1="149.6104" x2="591.0534" y2="199.4805" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="886.5801" y="199.4805" width="251.1977" height="66.4935" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1012.1789" y="241.039" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--ok-accent)">Use Built-in (10-1000x)</text>
  <line x1="768.3694" y1="232.7273" x2="886.5801" y2="232.7273" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="827.4747" y="221.0909" font-family="Arial" font-size="16.254" fill="var(--ok-accent)">Yes</text>
  <rect x="413.7374" y="324.1558" width="354.632" height="66.4935" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="591.0534" y="365.7143" text-anchor="middle" font-family="Arial" font-size="19.2092" fill="var(--warn-accent)">Can use Pandas/Arrow?</text>
  <line x1="591.0534" y1="265.974" x2="591.0534" y2="324.1558" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="605.8297" y="304.2078" font-family="Arial" font-size="16.254" fill="var(--danger-accent)">No</text>
  <rect x="886.5801" y="324.1558" width="251.1977" height="66.4935" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1012.1789" y="365.7143" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">Pandas UDF (3-100x)</text>
  <line x1="768.3694" y1="357.4026" x2="886.5801" y2="357.4026" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="827.4747" y="345.7662" font-family="Arial" font-size="16.254" fill="var(--ok-accent)">Yes</text>
  <rect x="413.7374" y="448.8312" width="354.632" height="66.4935" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="591.0534" y="490.3896" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--danger-accent)">Python UDF (1x baseline)</text>
  <line x1="591.0534" y1="390.6494" x2="591.0534" y2="448.8312" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="605.8297" y="428.8831" font-family="Arial" font-size="16.254" fill="var(--danger-accent)">No</text>
  <rect x="44.329" y="199.4805" width="325.0794" height="315.8442" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="206.8687" y="241.039" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--text)">Tips</text>
  <text x="66.4935" y="282.5974" font-family="Arial" font-size="17.7316" fill="var(--text)">- Keep UDFs simple</text>
  <text x="66.4935" y="319.1688" font-family="Arial" font-size="17.7316" fill="var(--text)">- Avoid global state</text>
  <text x="66.4935" y="355.7403" font-family="Arial" font-size="17.7316" fill="var(--text)">- Handle nulls explicitly</text>
  <text x="66.4935" y="392.3117" font-family="Arial" font-size="17.7316" fill="var(--text)">- Use type hints</text>
  <text x="66.4935" y="428.8831" font-family="Arial" font-size="17.7316" fill="var(--text)">- Test independently</text>
  <text x="66.4935" y="465.4545" font-family="Arial" font-size="17.7316" fill="var(--text)">- Minimize serialization</text>
  <text x="66.4935" y="502.026" font-family="Arial" font-size="17.7316" fill="var(--text)">- Prefer SQL expressions</text>
  <rect x="44.329" y="565.1948" width="1093.4488" height="74.8052" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="591.0534" y="601.7662" text-anchor="middle" font-family="Arial" font-size="19.2092" font-weight="bold" fill="var(--primary-accent)">Performance Priority: Built-in Functions &gt; Pandas UDF &gt; Python UDF</text>
  <text x="591.0534" y="628.3636" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text)">Built-ins are optimized by Catalyst; UDFs are opaque black boxes</text>
</svg>
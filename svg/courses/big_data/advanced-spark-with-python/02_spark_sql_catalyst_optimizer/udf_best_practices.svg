<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.6923" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">UDF Best Practices</text>
  <rect x="477.8378" y="72.6761" width="324.3243" height="65.3521" rx="6" fill="var(--primary-accent)" stroke="var(--primary-border)" stroke-width="2.9553"/>
  <text x="640" y="113.5211" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Need custom logic?</text>
  <rect x="445.4054" y="187.0423" width="389.1891" height="65.3521" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="227.8874" text-anchor="middle" font-size="19.9499" fill="var(--warn-accent)" font-family="Arial, sans-serif">Built-in function available?</text>
  <line x1="640" y1="138.0282" x2="640" y2="187.0423" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="964.3243" y="187.0423" width="275.6757" height="65.3521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="227.8874" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Use Built-in (10-1000x)</text>
  <line x1="834.5946" y1="219.7184" x2="964.3243" y2="219.7184" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="899.4594" y="208.2817" font-size="16.8808" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="445.4054" y="309.5774" width="389.1891" height="65.3521" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="350.4226" text-anchor="middle" font-size="19.9499" fill="var(--warn-accent)" font-family="Arial, sans-serif">Can use Pandas/Arrow?</text>
  <line x1="640" y1="252.3944" x2="640" y2="309.5774" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="656.2162" y="289.9719" font-size="16.8808" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="964.3243" y="309.5774" width="275.6757" height="65.3521" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="350.4226" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pandas UDF (3-100x)</text>
  <line x1="834.5946" y1="342.2535" x2="964.3243" y2="342.2535" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="899.4594" y="330.8169" font-size="16.8808" fill="var(--ok-accent)" font-family="Arial, sans-serif">Yes</text>
  <rect x="445.4054" y="432.1127" width="389.1891" height="65.3521" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="472.9577" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Python UDF (1x baseline)</text>
  <line x1="640" y1="374.9296" x2="640" y2="432.1127" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="656.2162" y="412.507" font-size="16.8808" fill="var(--danger-accent)" font-family="Arial, sans-serif">No</text>
  <rect x="40" y="187.0423" width="356.7568" height="310.4226" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="218.3784" y="227.8874" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Tips</text>
  <text x="64.3243" y="268.7324" font-size="18.4153" fill="var(--text)" font-family="Arial, sans-serif">- Keep UDFs simple</text>
  <text x="64.3243" y="304.676" font-size="18.4153" fill="var(--text)" font-family="Arial, sans-serif">- Avoid global state</text>
  <text x="64.3243" y="340.6198" font-size="18.4153" fill="var(--text)" font-family="Arial, sans-serif">- Handle nulls explicitly</text>
  <text x="64.3243" y="376.5634" font-size="18.4153" fill="var(--text)" font-family="Arial, sans-serif">- Use type hints</text>
  <text x="64.3243" y="412.507" font-size="18.4153" fill="var(--text)" font-family="Arial, sans-serif">- Test independently</text>
  <text x="64.3243" y="448.4507" font-size="18.4153" fill="var(--text)" font-family="Arial, sans-serif">- Minimize serialization</text>
  <text x="64.3243" y="484.3944" font-size="18.4153" fill="var(--text)" font-family="Arial, sans-serif">- Prefer SQL expressions</text>
  <rect x="40" y="546.4789" width="1200" height="73.5211" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="582.4225" text-anchor="middle" font-size="19.9499" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Performance Priority: Built-in Functions &gt; Pandas UDF &gt; Python UDF</text>
  <text x="640" y="608.5633" text-anchor="middle" font-size="16.8808" fill="var(--text)" font-family="Arial, sans-serif">Built-ins are optimized by Catalyst; UDFs are opaque black boxes</text>
</svg>

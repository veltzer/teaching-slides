<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="583.4758" y="49.2308" text-anchor="middle" font-family="Arial" font-size="29.1738" font-weight="bold" fill="var(--primary-accent)">Dynamic Partition Pruning</text>
  <text x="277.151" y="98.4615" text-anchor="middle" font-family="Arial" font-size="23.339" font-weight="bold" fill="var(--danger-accent)">Without DPP</text>
  <rect x="131.2821" y="123.0769" width="291.7379" height="57.4359" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="277.151" y="160.8205" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text)">SELECT * FROM fact JOIN dim</text>
  <rect x="72.9345" y="213.3333" width="80.2279" height="180.5128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="112.3191" y="311.7949" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--danger-accent)">P1</text>
  <rect x="167.7493" y="213.3333" width="80.2279" height="180.5128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="207.1339" y="311.7949" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--danger-accent)">P2</text>
  <rect x="262.5641" y="213.3333" width="80.2279" height="180.5128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="301.9487" y="311.7949" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--danger-accent)">P3</text>
  <rect x="357.3789" y="213.3333" width="80.2279" height="180.5128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="396.7635" y="311.7949" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--danger-accent)">P4</text>
  <rect x="452.1937" y="213.3333" width="80.2279" height="180.5128" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="491.5783" y="311.7949" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--danger-accent)">P5</text>
  <text x="277.151" y="434.8718" text-anchor="middle" font-family="Arial" font-size="17.5043" fill="var(--danger-accent)">All 5 partitions scanned</text>
  <text x="277.151" y="467.6923" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--danger-accent)">Slow: reads unnecessary data</text>
  <line x1="554.302" y1="295.3846" x2="612.6496" y2="295.3846" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="583.4758" y="278.9744" text-anchor="middle" font-family="Arial" font-size="16.0456" font-weight="bold" fill="var(--primary-accent)">DPP</text>
  <text x="889.8006" y="98.4615" text-anchor="middle" font-family="Arial" font-size="23.339" font-weight="bold" fill="var(--ok-accent)">With DPP</text>
  <rect x="641.8234" y="123.0769" width="291.7379" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="787.6923" y="160.8205" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--ok-accent)">dim filter: region = 'North'</text>
  <line x1="787.6923" y1="180.5128" x2="787.6923" y2="213.3333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="670.9972" y="213.3333" width="233.3903" height="49.2308" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="787.6923" y="246.1538" text-anchor="middle" font-family="Arial" font-size="16.0456" font-weight="bold" fill="var(--warn-accent)">Broadcast filter values</text>
  <rect x="641.8234" y="295.3846" width="80.2279" height="180.5128" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.4587" stroke-dasharray="4.3761 4.3761" />
  <text x="681.208" y="393.8462" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-faint)">P1</text>
  <line x1="641.8234" y1="295.3846" x2="722.0513" y2="475.8974" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="722.0513" y1="295.3846" x2="641.8234" y2="475.8974" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="736.6382" y="295.3846" width="80.2279" height="180.5128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="776.0228" y="393.8462" text-anchor="middle" font-family="Arial" font-size="14.5869" font-weight="bold" fill="var(--ok-accent)">P2</text>
  <rect x="831.453" y="295.3846" width="80.2279" height="180.5128" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.4587" stroke-dasharray="4.3761 4.3761" />
  <text x="870.8376" y="393.8462" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-faint)">P3</text>
  <line x1="831.453" y1="295.3846" x2="911.6809" y2="475.8974" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="911.6809" y1="295.3846" x2="831.453" y2="475.8974" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="926.2678" y="295.3846" width="80.2279" height="180.5128" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="965.6524" y="393.8462" text-anchor="middle" font-family="Arial" font-size="14.5869" font-weight="bold" fill="var(--ok-accent)">P4</text>
  <rect x="1021.0826" y="295.3846" width="80.2279" height="180.5128" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.4587" stroke-dasharray="4.3761 4.3761" />
  <text x="1060.4672" y="393.8462" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-faint)">P5</text>
  <line x1="1021.0826" y1="295.3846" x2="1101.3105" y2="475.8974" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="1101.3105" y1="295.3846" x2="1021.0826" y2="475.8974" stroke="var(--danger-border)" stroke-width="2" />
  <text x="889.8006" y="516.9231" text-anchor="middle" font-family="Arial" font-size="17.5043" fill="var(--ok-accent)">Only 2 of 5 partitions scanned</text>
  <text x="889.8006" y="549.7436" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--ok-accent)">Fast: skips irrelevant partitions</text>
  <rect x="145.8689" y="590.7692" width="875.2137" height="49.2308" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="583.4758" y="623.5897" text-anchor="middle" font-family="Arial" font-size="17.5043" fill="var(--primary-accent)">DPP uses dimension-side filter results to prune fact-table partitions at runtime</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#333" />
    </marker>
  </defs>
  <text x="635.7447" y="40" text-anchor="middle" font-family="Arial" font-size="31.2257" font-weight="bold" fill="var(--primary-accent)">Dynamic Partition Pruning</text>
  <text x="278.2979" y="88.3333" text-anchor="middle" font-family="Arial" font-size="24.9805" font-weight="bold" fill="var(--danger-accent)">Without DPP</text>
  <rect x="108.0851" y="112.5" width="340.4256" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="278.2979" y="149.5555" text-anchor="middle" font-family="Arial" font-size="17.1742" fill="var(--text)">SELECT * FROM fact JOIN dim</text>
  <rect x="40" y="201.1111" width="93.617" height="177.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="85.9574" y="297.7778" text-anchor="middle" font-family="Arial" font-size="15.6129" fill="var(--danger-accent)">P1</text>
  <rect x="150.6383" y="201.1111" width="93.617" height="177.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="196.5957" y="297.7778" text-anchor="middle" font-family="Arial" font-size="15.6129" fill="var(--danger-accent)">P2</text>
  <rect x="261.2766" y="201.1111" width="93.617" height="177.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.234" y="297.7778" text-anchor="middle" font-family="Arial" font-size="15.6129" fill="var(--danger-accent)">P3</text>
  <rect x="371.9149" y="201.1111" width="93.617" height="177.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="417.8723" y="297.7778" text-anchor="middle" font-family="Arial" font-size="15.6129" fill="var(--danger-accent)">P4</text>
  <rect x="482.5532" y="201.1111" width="93.617" height="177.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="528.5106" y="297.7778" text-anchor="middle" font-family="Arial" font-size="15.6129" fill="var(--danger-accent)">P5</text>
  <text x="278.2979" y="418.6111" text-anchor="middle" font-family="Arial" font-size="18.7355" fill="var(--danger-accent)">All 5 partitions scanned</text>
  <text x="278.2979" y="450.8333" text-anchor="middle" font-family="Arial" font-size="18.7355" font-weight="bold" fill="var(--danger-accent)">Slow: reads unnecessary data</text>
  <line x1="601.7021" y1="281.6666" x2="669.7873" y2="281.6666" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="635.7447" y="265.5556" text-anchor="middle" font-family="Arial" font-size="17.1742" font-weight="bold" fill="var(--primary-accent)">DPP</text>
  <text x="993.1916" y="88.3333" text-anchor="middle" font-family="Arial" font-size="24.9805" font-weight="bold" fill="var(--ok-accent)">With DPP</text>
  <rect x="703.8298" y="112.5" width="340.4256" height="56.3889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="874.0426" y="149.5555" text-anchor="middle" font-family="Arial" font-size="17.1742" fill="var(--ok-accent)">dim filter: region = 'North'</text>
  <line x1="874.0426" y1="168.8888" x2="874.0426" y2="201.1111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="737.8724" y="201.1111" width="272.3404" height="48.3334" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="874.0426" y="233.3333" text-anchor="middle" font-family="Arial" font-size="17.1742" font-weight="bold" fill="var(--warn-accent)">Broadcast filter values</text>
  <rect x="703.8298" y="281.6666" width="93.617" height="177.2222" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.4587" stroke-dasharray="4.3761 4.3761" />
  <text x="749.7873" y="378.3334" text-anchor="middle" font-family="Arial" font-size="15.6129" fill="var(--text-faint)">P1</text>
  <line x1="703.8298" y1="281.6666" x2="797.4468" y2="458.8888" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="797.4468" y1="281.6666" x2="703.8298" y2="458.8888" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="814.4681" y="281.6666" width="93.617" height="177.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.4256" y="378.3334" text-anchor="middle" font-family="Arial" font-size="15.6129" font-weight="bold" fill="var(--ok-accent)">P2</text>
  <rect x="925.1064" y="281.6666" width="93.617" height="177.2222" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.4587" stroke-dasharray="4.3761 4.3761" />
  <text x="971.0639" y="378.3334" text-anchor="middle" font-family="Arial" font-size="15.6129" fill="var(--text-faint)">P3</text>
  <line x1="925.1064" y1="281.6666" x2="1018.7234" y2="458.8888" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="1018.7234" y1="281.6666" x2="925.1064" y2="458.8888" stroke="var(--danger-border)" stroke-width="2" />
  <rect x="1035.7447" y="281.6666" width="93.617" height="177.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1081.7021" y="378.3334" text-anchor="middle" font-family="Arial" font-size="15.6129" font-weight="bold" fill="var(--ok-accent)">P4</text>
  <rect x="1146.383" y="281.6666" width="93.617" height="177.2222" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.4587" stroke-dasharray="4.3761 4.3761" />
  <text x="1192.3404" y="378.3334" text-anchor="middle" font-family="Arial" font-size="15.6129" fill="var(--text-faint)">P5</text>
  <line x1="1146.383" y1="281.6666" x2="1240" y2="458.8888" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="1240" y1="281.6666" x2="1146.383" y2="458.8888" stroke="var(--danger-border)" stroke-width="2" />
  <text x="993.1916" y="499.1667" text-anchor="middle" font-family="Arial" font-size="18.7355" fill="var(--ok-accent)">Only 2 of 5 partitions scanned</text>
  <text x="993.1916" y="531.3889" text-anchor="middle" font-family="Arial" font-size="18.7355" font-weight="bold" fill="var(--ok-accent)">Fast: skips irrelevant partitions</text>
  <rect x="125.1063" y="571.6666" width="1021.2767" height="48.3334" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.7447" y="603.8888" text-anchor="middle" font-family="Arial" font-size="18.7355" fill="var(--primary-accent)">DPP uses dimension-side filter results to prune fact-table partitions at runtime</text>
</svg>
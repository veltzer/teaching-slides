<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-aqe7" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,21.1765 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <rect x="38.3964" y="9.8461" width="1113.4977" height="275.6923" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="595.1453" y="49.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.9577" font-weight="bold" fill="var(--danger-accent)">Without AQE (static planning)</text>
  <text x="595.1453" y="88.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1181" fill="var(--text-muted)">shuffle.partitions = 200 (fixed), Join strategy decided upfront</text>
  <text x="595.1453" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1181" fill="var(--text-faint)">Result: 200 partitions, many empty/tiny</text>
  <rect x="76.7929" y="147.6923" width="105.5903" height="59.0769" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="130.548" y="185.1077" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" fill="var(--text)">5</text>
  <rect x="191.9823" y="147.6923" width="57.5947" height="59.0769" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="259.1762" y="147.6923" width="57.5947" height="59.0769" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="326.37" y="147.6923" width="153.5859" height="59.0769" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="403.163" y="185.1077" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" font-weight="bold" fill="var(--danger-accent)">9M skew!</text>
  <rect x="489.555" y="147.6923" width="57.5947" height="59.0769" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="556.7488" y="147.6923" width="57.5947" height="59.0769" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="623.9426" y="147.6923" width="57.5947" height="59.0769" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="691.1365" y="147.6923" width="57.5947" height="59.0769" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <text x="806.3259" y="185.1077" font-family="Arial, sans-serif" font-size="26.8775" fill="var(--text-faint)">...</text>
  <text x="595.1453" y="246.1539" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" fill="var(--danger-accent)">many empty partitions + skewed data</text>
  <line x1="595.1453" y1="291.4462" x2="595.1453" y2="344.6153" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-aqe7)" />
  <text x="662.3392" y="328.8616" font-family="Arial, sans-serif" font-size="23.0379" fill="var(--text)" font-weight="bold">AQE optimizes</text>
  <rect x="38.3964" y="354.4616" width="1113.4977" height="285.5384" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="595.1453" y="393.8461" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.9577" font-weight="bold" fill="var(--ok-accent)">With AQE (runtime optimization)</text>
  <text x="595.1453" y="433.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" fill="var(--text-muted)">Step 1: Run map stages, collect statistics | Step 2: Re-optimize | Step 3: Coalesce | Step 4: Split skew</text>
  <text x="595.1453" y="472.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1181" fill="var(--text-faint)">Result: balanced partitions</text>
  <rect x="95.9912" y="492.3077" width="230.3788" height="68.923" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="211.1806" y="521.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" font-weight="bold" fill="var(--text)">3M (sk1)</text>
  <text x="211.1806" y="547.4462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" fill="var(--ok-accent)">split skew</text>
  <rect x="345.5682" y="492.3077" width="230.3788" height="68.923" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="460.7577" y="521.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" font-weight="bold" fill="var(--text)">3M (sk2)</text>
  <text x="460.7577" y="547.4462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" fill="var(--ok-accent)">split skew</text>
  <rect x="595.1453" y="492.3077" width="230.3788" height="68.923" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="710.3347" y="521.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" font-weight="bold" fill="var(--text)">3M (sk3)</text>
  <text x="710.3347" y="547.4462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" fill="var(--ok-accent)">split skew</text>
  <rect x="844.7224" y="492.3077" width="134.3876" height="68.923" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="911.9162" y="521.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" font-weight="bold" fill="var(--text)">1M</text>
  <text x="911.9162" y="547.4462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" fill="var(--primary-accent)">coalesced</text>
  <rect x="988.7091" y="492.3077" width="134.3876" height="68.923" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1055.903" y="521.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" font-weight="bold" fill="var(--text)">1M</text>
  <text x="1055.903" y="547.4462" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1983" fill="var(--primary-accent)">coalesced</text>
</svg>
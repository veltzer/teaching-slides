<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="1200" height="253.75" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="76.2501" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.8566" font-weight="bold" fill="var(--danger-accent)">Without AQE (static planning)</text>
  <text x="640.0001" y="112.5001" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0325" fill="var(--text-muted)">shuffle.partitions = 200 (fixed), Join strategy decided upfront</text>
  <text x="640.0001" y="148.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0325" fill="var(--text-faint)">Result: 200 partitions, many empty/tiny</text>
  <rect x="81.3793" y="166.875" width="113.7931" height="54.375" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="139.3104" y="201.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" fill="var(--text)">5</text>
  <rect x="205.5173" y="166.875" width="62.069" height="54.375" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="277.9311" y="166.875" width="62.069" height="54.375" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="350.3449" y="166.875" width="165.5173" height="54.375" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="433.1036" y="201.3125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" font-weight="bold" fill="var(--danger-accent)">9M skew!</text>
  <rect x="526.2069" y="166.875" width="62.069" height="54.375" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="598.6207" y="166.875" width="62.069" height="54.375" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="671.0345" y="166.875" width="62.069" height="54.375" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <rect x="743.4484" y="166.875" width="62.069" height="54.375" rx="6" fill="var(--border)" stroke="var(--text-faint)" stroke-width="1.9198" />
  <text x="867.5863" y="201.3125" font-family="Arial, sans-serif" font-size="26.7686" fill="var(--text-faint)">...</text>
  <text x="640.0001" y="257.5001" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" fill="var(--danger-accent)">many empty partitions + skewed data</text>
  <line x1="640.0001" y1="299.1876" x2="640.0001" y2="348.1249" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="712.4139" y="333.6251" font-family="Arial, sans-serif" font-size="22.9445" fill="var(--text)" font-weight="bold">AQE optimizes</text>
  <rect x="40" y="357.1876" width="1200" height="262.8124" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="393.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.8566" font-weight="bold" fill="var(--ok-accent)">With AQE (runtime optimization)</text>
  <text x="640.0001" y="429.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" fill="var(--text-muted)">Step 1: Run map stages, collect statistics | Step 2: Re-optimize | Step 3: Coalesce | Step 4: Split skew</text>
  <text x="640.0001" y="465.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0325" fill="var(--text-faint)">Result: balanced partitions</text>
  <rect x="102.0691" y="484.0625" width="248.2758" height="63.4374" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.207" y="511.2501" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" font-weight="bold" fill="var(--text)">3M (sk1)</text>
  <text x="226.207" y="534.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" fill="var(--ok-accent)">split skew</text>
  <rect x="371.0345" y="484.0625" width="248.2758" height="63.4374" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.1725" y="511.2501" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" font-weight="bold" fill="var(--text)">3M (sk2)</text>
  <text x="495.1725" y="534.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" fill="var(--ok-accent)">split skew</text>
  <rect x="640.0001" y="484.0625" width="248.2758" height="63.4374" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.138" y="511.2501" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" font-weight="bold" fill="var(--text)">3M (sk3)</text>
  <text x="764.138" y="534.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" fill="var(--ok-accent)">split skew</text>
  <rect x="908.9656" y="484.0625" width="144.8275" height="63.4374" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="981.3794" y="511.2501" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" font-weight="bold" fill="var(--text)">1M</text>
  <text x="981.3794" y="534.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" fill="var(--primary-accent)">coalesced</text>
  <rect x="1064.1379" y="484.0625" width="144.8275" height="63.4374" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.5518" y="511.2501" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" font-weight="bold" fill="var(--text)">1M</text>
  <text x="1136.5518" y="534.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1205" fill="var(--primary-accent)">coalesced</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="230" height="495.533980582525" rx="8.489856883536" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--primary-text)">Partitioning</text>
  <text x="155" y="107.57281553398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">Very High</text>
  <text x="60" y="158.252427184466" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--primary-text)">Settings</text>
  <text x="60" y="186.407766990292" font-family="Courier New, monospace" font-size="12.734785325303" fill="var(--primary-text)">shuffle.partitions</text>
  <text x="60" y="208.932038834951" font-family="Courier New, monospace" font-size="12.734785325303" fill="var(--primary-text)">repartition(n)</text>
  <text x="60" y="276.504854368931" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--primary-text)">Sizing</text>
  <text x="60" y="304.660194174757" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">2-4x cores</text>
  <text x="60" y="329.436893203884" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">128-256 MB</text>

  <rect x="280" y="40" width="230" height="495.533980582525" rx="8.489856883536" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--ok-text)">Caching</text>
  <text x="395" y="107.57281553398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--ok-text)">High</text>
  <text x="300" y="158.252427184466" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--ok-text)">Levels</text>
  <text x="300" y="186.407766990292" font-family="Courier New, monospace" font-size="12.734785325303" fill="var(--ok-text)">MEMORY_ONLY</text>
  <text x="300" y="208.932038834951" font-family="Courier New, monospace" font-size="12.734785325303" fill="var(--ok-text)">DISK_ONLY</text>
  <text x="300" y="276.504854368931" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--ok-text)">When</text>
  <text x="300" y="304.660194174757" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--ok-text)">Reused twice+</text>
  <text x="300" y="372.233009708738" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--ok-text)">API</text>
  <text x="300" y="400.388349514564" font-family="Courier New, monospace" font-size="12.734785325303" fill="var(--ok-text)">df.cache()</text>

  <rect x="520" y="40" width="230" height="495.533980582525" rx="8.489856883536" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--danger-text)">Shuffle Opt.</text>
  <text x="635" y="107.57281553398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--danger-text)">Very High</text>
  <text x="540" y="158.252427184466" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--danger-text)">Reduce</text>
  <text x="540" y="186.407766990292" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--danger-text)">Avoid wide joins</text>
  <text x="540" y="208.932038834951" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--danger-text)">Salt skew</text>
  <text x="540" y="276.504854368931" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--danger-text)">AQE</text>
  <text x="540" y="304.660194174757" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--danger-text)">Auto coalesce</text>
  <text x="540" y="372.233009708738" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--danger-text)">Enable</text>
  <text x="540" y="400.388349514564" font-family="Courier New, monospace" font-size="12.734785325303" fill="var(--danger-text)">sql.adaptive</text>

  <rect x="760" y="40" width="230" height="495.533980582525" rx="8.489856883536" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--info-text)">Serialization</text>
  <text x="875" y="107.57281553398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Medium</text>
  <text x="780" y="158.252427184466" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--info-text)">Kryo</text>
  <text x="780" y="186.407766990292" font-family="Courier New, monospace" font-size="12.734785325303" fill="var(--info-text)">spark.serializer</text>
  <text x="780" y="208.932038834951" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">10x faster</text>
  <text x="780" y="276.504854368931" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--info-text)">Formats</text>
  <text x="780" y="304.660194174757" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">Parquet columnar</text>
  <text x="780" y="329.436893203884" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">ORC analytics</text>

  <rect x="1000" y="40" width="240" height="495.533980582525" rx="8.489856883536" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--warn-text)">Broadcast Joins</text>
  <text x="1120" y="107.57281553398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">High</text>
  <text x="1020" y="158.252427184466" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--warn-text)">How</text>
  <text x="1020" y="186.407766990292" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Ship small side</text>
  <text x="1020" y="208.932038834951" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">No shuffle</text>
  <text x="1020" y="276.504854368931" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--warn-text)">Threshold</text>
  <text x="1020" y="304.660194174757" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Default 10 MB</text>
  <text x="1020" y="372.233009708738" font-family="Arial, sans-serif" font-size="14.857249546187" font-weight="bold" fill="var(--warn-text)">Risk</text>
  <text x="1020" y="400.388349514564" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">Driver OOM</text>

  <text x="640" y="586.21359223301" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.102177987955" font-weight="bold" fill="var(--text)">Priority</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" fill="var(--text-muted)">partitions, shuffles, broadcast, cache</text>
</svg>

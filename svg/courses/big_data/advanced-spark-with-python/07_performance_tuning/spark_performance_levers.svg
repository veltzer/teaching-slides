  <text x="568.8889" y="568.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Tuning Priority Order</text>
  <text x="568.8889" y="588.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">1. Fix partitioning &amp; shuffle   2. Add broadcast joins for small tables   3. Cache reused DataFrames</text>
  <text x="568.8889" y="606.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)" text-anchor="middle">4. Switch to Kryo serialization   5. Enable AQE for automatic runtime adaptation</text>

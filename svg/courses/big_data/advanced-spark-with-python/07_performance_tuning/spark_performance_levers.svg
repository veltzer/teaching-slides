  <rect x="553.75" y="135.0556" width="172.5" height="12.8889" fill="var(--border)" rx="6" />
  <rect x="553.75" y="135.0556" width="172.5" height="12.8889" fill="var(--danger-fill)" rx="6" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="145.5277" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="var(--bg)" text-anchor="middle">Very High</text>
  <text x="553.75" y="168.8889" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--danger-accent)">Reduce shuffles</text>
  <text x="553.75" y="185" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Avoid wide joins</text>
  <text x="553.75" y="199.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Salting for skew</text>
  <text x="553.75" y="214" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Push filters early</text>

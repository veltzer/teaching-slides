  <text x="60" y="227.962962962963" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--primary-text)">repartition(n)</text>
  <text x="60" y="292.407407407407" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--primary-text)">Sizing</text>
  <text x="60" y="319.259259259259" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">2-4x cores</text>
  <text x="60" y="342.888888888889" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--primary-text)">128-256 MB</text>

  <rect x="280" y="66.851851851852" width="230" height="472.592592592593" rx="8.291003602746" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--ok-text)">Caching</text>

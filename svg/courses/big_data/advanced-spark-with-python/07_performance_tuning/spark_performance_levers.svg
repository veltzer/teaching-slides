  <text x="300" y="179.62962962963" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--ok-text)">Levels</text>
  <text x="300" y="206.481481481482" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--ok-text)">MEMORY_ONLY</text>
  <text x="300" y="227.962962962963" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--ok-text)">DISK_ONLY</text>
  <text x="300" y="292.407407407407" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--ok-text)">When</text>
  <text x="300" y="319.259259259259" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--ok-text)">Reused twice+</text>

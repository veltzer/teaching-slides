  <text x="640" y="555.5556" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Tuning Priority Order</text>
  <text x="640" y="573.2777" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">1. Fix partitioning &amp; shuffle   2. Add broadcast joins for small tables   3. Cache reused DataFrames</text>
  <text x="640" y="589.3889" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)" text-anchor="middle">4. Switch to Kryo serialization   5. Enable AQE for automatic runtime adaptation</text>

  <text x="778.7499" y="305.8333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Parquet: columnar</text>
  <text x="778.7499" y="320.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Avro: row-based</text>
  <text x="778.7499" y="334.8333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">ORC: analytics</text>

  <text x="103.75" y="217.2223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">repartition(n)</text>
  <text x="103.75" y="233.3333" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">coalesce(n)</text>
  <text x="103.75" y="257.5" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">Best practice</text>
  <text x="103.75" y="273.6111" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">2-4x cores per</text>
  <text x="103.75" y="286.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">partition 128-256 MB</text>
  <text x="103.75" y="310.6667" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">Warning</text>
  <text x="103.75" y="326.7777" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">Too few: underuse</text>
  <text x="103.75" y="339.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--danger-accent)">Too many: overhead</text>

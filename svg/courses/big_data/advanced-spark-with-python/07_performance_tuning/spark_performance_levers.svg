  <text x="1003.75" y="185" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Small table sent</text>
  <text x="1003.75" y="199.5" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">to every executor</text>
  <text x="1003.75" y="214" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">No shuffle needed</text>
  <text x="1003.75" y="236.5556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">Threshold</text>
  <text x="1003.75" y="252.6667" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">spark.sql.autoBroad</text>
  <text x="1003.75" y="265.5556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">castJoinThreshold</text>
  <text x="1003.75" y="280.0556" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Default: 10 MB</text>
  <text x="1003.75" y="302.6111" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">Explicit hint</text>
  <text x="1003.75" y="318.7223" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">broadcast(small_df)</text>

  <text x="778.7499" y="197.8889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">= KryoSerializer</text>
  <text x="778.7499" y="212.3889" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">10x faster vs Java</text>
  <text x="778.7499" y="236.5556" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--info-accent)">Register classes</text>

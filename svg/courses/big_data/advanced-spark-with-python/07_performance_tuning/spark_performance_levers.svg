  <text x="780" y="342.888888888889" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">ORC analytics</text>

  <rect x="1000" y="66.851851851852" width="240" height="472.592592592593" rx="8.291003602746" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--warn-text)">Broadcast Joins</text>
  <text x="1120" y="131.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">High</text>
  <text x="1020" y="179.62962962963" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--warn-text)">How</text>
  <text x="1020" y="206.481481481482" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">Ship small side</text>
  <text x="1020" y="227.962962962963" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">No shuffle</text>
  <text x="1020" y="292.407407407407" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--warn-text)">Threshold</text>
  <text x="1020" y="319.259259259259" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">Default 10 MB</text>
  <text x="1020" y="383.703703703704" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--warn-text)">Risk</text>
  <text x="1020" y="410.555555555556" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--warn-text)">Driver OOM</text>

  <text x="640" y="587.777777777778" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--text)">Priority</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.545631755148" fill="var(--text-muted)">partitions, shuffles, broadcast, cache</text>
</svg>

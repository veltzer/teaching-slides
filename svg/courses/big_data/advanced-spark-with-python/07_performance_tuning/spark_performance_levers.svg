  <ns0:text x="142.2222" y="97.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#888888" text-anchor="middle">Impact</ns0:text>
  <ns0:rect x="60.4444" y="104.8889" width="163.5556" height="14.2222" fill="#e0e0e0" rx="7.1111" />
  <ns0:rect x="60.4444" y="104.8889" width="163.5556" height="14.2222" fill="#e53935" rx="7.1111" />
  <ns0:text x="142.2222" y="116.4444" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Very High</ns0:text>
  <ns0:text x="60.4444" y="142.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">Key settings</ns0:text>
  <ns0:text x="60.4444" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">spark.sql.shuffle</ns0:text>
  <ns0:text x="60.4444" y="174.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">  .partitions</ns0:text>
  <ns0:text x="60.4444" y="195.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">repartition(n)</ns0:text>
  <ns0:text x="60.4444" y="213.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">coalesce(n)</ns0:text>
  <ns0:text x="60.4444" y="240" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">Best practice</ns0:text>
  <ns0:text x="60.4444" y="257.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">2-4x cores per</ns0:text>
  <ns0:text x="60.4444" y="272" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">partition 128-256 MB</ns0:text>
  <ns0:text x="60.4444" y="298.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">Warning</ns0:text>
  <ns0:text x="60.4444" y="316.4444" font-family="Arial,sans-serif" font-size="10.6667" fill="#e53935">Too few: underuse</ns0:text>
  <ns0:text x="60.4444" y="330.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#e53935">Too many: overhead</ns0:text>
  <ns0:rect x="256" y="26.6667" width="199.1111" height="497.7778" fill="url(#grad-surface)" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="256" y="26.6667" width="199.1111" height="46.2222" fill="#388e3c" rx="10.6667" />

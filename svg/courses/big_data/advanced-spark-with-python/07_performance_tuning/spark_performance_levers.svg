  <ns0:text x="355.5556" y="55.1111" font-family="Arial,sans-serif" font-size="15.1111" font-weight="bold" fill="#ffffff" text-anchor="middle">Caching</ns0:text>
  <ns0:text x="355.5556" y="97.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#888888" text-anchor="middle">Impact</ns0:text>
  <ns0:rect x="273.7778" y="104.8889" width="163.5556" height="14.2222" fill="#e0e0e0" rx="7.1111" />
  <ns0:rect x="273.7778" y="104.8889" width="135.1111" height="14.2222" fill="#fb8c00" rx="7.1111" />
  <ns0:text x="341.3333" y="116.4444" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">High</ns0:text>
  <ns0:text x="273.7778" y="142.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">Memory levels</ns0:text>
  <ns0:text x="273.7778" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">MEMORY_ONLY</ns0:text>
  <ns0:text x="273.7778" y="176" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">MEMORY_AND_DISK</ns0:text>
  <ns0:text x="273.7778" y="192" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">MEMORY_ONLY_SER</ns0:text>
  <ns0:text x="273.7778" y="208" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">DISK_ONLY</ns0:text>
  <ns0:text x="273.7778" y="225.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">OFF_HEAP</ns0:text>
  <ns0:text x="273.7778" y="248.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">When to cache</ns0:text>
  <ns0:text x="273.7778" y="266.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Reused &gt; 2x times</ns0:text>
  <ns0:text x="273.7778" y="282.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Fits in memory</ns0:text>
  <ns0:text x="273.7778" y="298.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Expensive compute</ns0:text>
  <ns0:text x="273.7778" y="321.7778" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">API</ns0:text>
  <ns0:text x="273.7778" y="339.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">df.cache()</ns0:text>
  <ns0:text x="273.7778" y="353.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">df.persist(level)</ns0:text>
  <ns0:rect x="469.3333" y="26.6667" width="199.1111" height="497.7778" fill="url(#grad-surface)" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="469.3333" y="26.6667" width="199.1111" height="46.2222" fill="#e65100" rx="10.6667" />

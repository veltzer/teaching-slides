  <text x="640" y="583.857493" font-size="12.140706" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">1. Fix partitioning &amp; shuffle   2. Add broadcast joins for small tables   3. Cache reused DataFrames</text>
  <text x="640" y="601.068271" font-size="12.140706" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">4. Switch to Kryo serialization   5. Enable AQE for automatic runtime adaptation</text>

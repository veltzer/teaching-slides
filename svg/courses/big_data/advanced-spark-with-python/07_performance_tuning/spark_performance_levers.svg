  <ns0:text x="568.8889" y="55.1111" font-family="Arial,sans-serif" font-size="15.1111" font-weight="bold" fill="#ffffff" text-anchor="middle">Shuffle Opt.</ns0:text>
  <ns0:text x="568.8889" y="97.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#888888" text-anchor="middle">Impact</ns0:text>
  <ns0:rect x="487.1111" y="104.8889" width="163.5556" height="14.2222" fill="#e0e0e0" rx="7.1111" />
  <ns0:rect x="487.1111" y="104.8889" width="163.5556" height="14.2222" fill="#e53935" rx="7.1111" />
  <ns0:text x="568.8889" y="116.4444" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Very High</ns0:text>
  <ns0:text x="487.1111" y="142.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#bf360c">Reduce shuffles</ns0:text>
  <ns0:text x="487.1111" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Avoid wide joins</ns0:text>
  <ns0:text x="487.1111" y="176" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Salting for skew</ns0:text>
  <ns0:text x="487.1111" y="192" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Push filters early</ns0:text>
  <ns0:text x="487.1111" y="216.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#bf360c">AQE features</ns0:text>
  <ns0:text x="487.1111" y="234.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Auto coalesce</ns0:text>
  <ns0:text x="487.1111" y="250.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Skew join handling</ns0:text>
  <ns0:text x="487.1111" y="266.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Plan switching</ns0:text>
  <ns0:text x="487.1111" y="291.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#bf360c">Config</ns0:text>
  <ns0:text x="487.1111" y="309.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">spark.sql.adaptive</ns0:text>
  <ns0:text x="487.1111" y="323.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">  .enabled = true</ns0:text>
  <ns0:rect x="682.6667" y="26.6667" width="199.1111" height="497.7778" fill="url(#grad-surface)" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="682.6667" y="26.6667" width="199.1111" height="46.2222" fill="#6a1b9a" rx="10.6667" />
  <ns0:rect x="682.6667" y="58.6667" width="199.1111" height="14.2222" fill="#6a1b9a" />
  <ns0:text x="782.2222" y="55.1111" font-family="Arial,sans-serif" font-size="15.1111" font-weight="bold" fill="#ffffff" text-anchor="middle">Serialization</ns0:text>
  <ns0:text x="782.2222" y="97.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#888888" text-anchor="middle">Impact</ns0:text>
  <ns0:rect x="700.4444" y="104.8889" width="163.5556" height="14.2222" fill="#e0e0e0" rx="7.1111" />
  <ns0:rect x="700.4444" y="104.8889" width="106.6667" height="14.2222" fill="#fb8c00" rx="7.1111" />
  <ns0:text x="753.7778" y="116.4444" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Medium</ns0:text>
  <ns0:text x="700.4444" y="142.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#6a1b9a">Kryo (preferred)</ns0:text>
  <ns0:text x="700.4444" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">spark.serializer</ns0:text>
  <ns0:text x="700.4444" y="174.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">= KryoSerializer</ns0:text>
  <ns0:text x="700.4444" y="190.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">10x faster vs Java</ns0:text>
  <ns0:text x="700.4444" y="216.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#6a1b9a">Register classes</ns0:text>
  <ns0:text x="700.4444" y="234.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">spark.kryo</ns0:text>
  <ns0:text x="700.4444" y="248.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">  .registrationRequired</ns0:text>
  <ns0:text x="700.4444" y="275.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#6a1b9a">Format matters</ns0:text>
  <ns0:text x="700.4444" y="293.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Parquet: columnar</ns0:text>
  <ns0:text x="700.4444" y="309.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Avro: row-based</ns0:text>
  <ns0:text x="700.4444" y="325.3333" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">ORC: analytics</ns0:text>
  <ns0:rect x="896" y="26.6667" width="199.1111" height="497.7778" fill="url(#grad-surface)" rx="10.6667" filter="url(#shadow)" />
  <ns0:rect x="896" y="26.6667" width="199.1111" height="46.2222" fill="#00838f" rx="10.6667" />
  <ns0:rect x="896" y="58.6667" width="199.1111" height="14.2222" fill="#00838f" />
  <ns0:text x="995.5556" y="55.1111" font-family="Arial,sans-serif" font-size="15.1111" font-weight="bold" fill="#ffffff" text-anchor="middle">Broadcast Joins</ns0:text>
  <ns0:text x="995.5556" y="97.7778" font-family="Arial,sans-serif" font-size="10.6667" fill="#888888" text-anchor="middle">Impact</ns0:text>
  <ns0:rect x="913.7778" y="104.8889" width="163.5556" height="14.2222" fill="#e0e0e0" rx="7.1111" />
  <ns0:rect x="913.7778" y="104.8889" width="135.1111" height="14.2222" fill="#fb8c00" rx="7.1111" />
  <ns0:text x="981.3333" y="116.4444" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">High</ns0:text>
  <ns0:text x="913.7778" y="142.2222" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#006064">How it works</ns0:text>
  <ns0:text x="913.7778" y="160" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Small table sent</ns0:text>
  <ns0:text x="913.7778" y="176" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">to every executor</ns0:text>
  <ns0:text x="913.7778" y="192" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">No shuffle needed</ns0:text>
  <ns0:text x="913.7778" y="216.8889" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#006064">Threshold</ns0:text>
  <ns0:text x="913.7778" y="234.6667" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">spark.sql.autoBroad</ns0:text>
  <ns0:text x="913.7778" y="248.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">castJoinThreshold</ns0:text>
  <ns0:text x="913.7778" y="264.8889" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">Default: 10 MB</ns0:text>
  <ns0:text x="913.7778" y="289.7778" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#006064">Explicit hint</ns0:text>
  <ns0:text x="913.7778" y="307.5556" font-family="Arial,sans-serif" font-size="10.6667" fill="#333333">broadcast(small_df)</ns0:text>
  <ns0:text x="913.7778" y="332.4444" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#006064">Limit</ns0:text>
  <ns0:text x="913.7778" y="350.2222" font-family="Arial,sans-serif" font-size="10.6667" fill="#e53935">Driver OOM if too big</ns0:text>
  <ns0:rect x="42.6667" y="545.7778" width="1052.4444" height="80" fill="#e3f2fd" rx="8.8889" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="568.8889" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0" text-anchor="middle">Tuning Priority Order</ns0:text>
  <ns0:text x="568.8889" y="588.4444" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333" text-anchor="middle">1. Fix partitioning &amp; shuffle   2. Add broadcast joins for small tables   3. Cache reused DataFrames</ns0:text>
  <ns0:text x="568.8889" y="606.2222" font-family="Arial,sans-serif" font-size="11.5556" fill="#333333" text-anchor="middle">4. Switch to Kryo serialization   5. Enable AQE for automatic runtime adaptation</ns0:text>
</ns0:svg>
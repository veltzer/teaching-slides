  <text x="540" y="410.555555555556" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--danger-text)">sql.adaptive</text>

  <rect x="760" y="66.851851851852" width="230" height="472.592592592593" rx="8.291003602746" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="875" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--info-text)">Serialization</text>
  <text x="875" y="131.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">Medium</text>
  <text x="780" y="179.62962962963" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--info-text)">Kryo</text>
  <text x="780" y="206.481481481482" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--info-text)">spark.serializer</text>
  <text x="780" y="227.962962962963" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--info-text)">10x faster</text>
  <text x="780" y="292.407407407407" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--info-text)">Formats</text>

  <text x="300" y="410.555555555556" font-family="Courier New, monospace" font-size="12.436505404118" fill="var(--ok-text)">df.cache()</text>

  <rect x="520" y="66.851851851852" width="230" height="472.592592592593" rx="8.291003602746" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.654758106178" font-weight="bold" fill="var(--danger-text)">Shuffle Opt.</text>
  <text x="635" y="131.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--danger-text)">Very High</text>
  <text x="540" y="179.62962962963" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--danger-text)">Reduce</text>
  <text x="540" y="206.481481481482" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--danger-text)">Avoid wide joins</text>
  <text x="540" y="227.962962962963" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--danger-text)">Salt skew</text>
  <text x="540" y="292.407407407407" font-family="Arial, sans-serif" font-size="14.509256304805" font-weight="bold" fill="var(--danger-text)">AQE</text>
  <text x="540" y="319.259259259259" font-family="Arial, sans-serif" font-size="13.472880854462" fill="var(--danger-text)">Auto coalesce</text>

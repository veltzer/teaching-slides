  <text x="185.8065" y="387.871" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">Parquet</text>
  <line x1="289.0323" y1="364.6452" x2="371.6129" y2="364.6452" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-dag)" />
  <rect x="381.9355" y="325.1613" width="206.4516" height="81.2903" rx="12.3871" fill="#fff" stroke="#2e7d32" stroke-width="3.0968" />
  <text x="485.1613" y="376.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#333">Select</text>
  <line x1="588.3871" y1="364.6452" x2="712.2581" y2="364.6452" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-dag)" />
  <rect x="722.5806" y="325.1613" width="247.7419" height="81.2903" rx="12.3871" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.0968" />
  <text x="846.4516" y="376.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#333">ShuffleWrite</text>
  <rect x="41.2903" y="464.5161" width="1176.7742" height="162.5806" rx="16.5161" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4.129" />
  <text x="103.2258" y="506.3226" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="#7b1fa2">Stage 2: Join + Aggregate</text>
  <rect x="82.5806" y="522.5806" width="247.7419" height="81.2903" rx="12.3871" fill="#fff" stroke="#7b1fa2" stroke-width="3.0968" />
  <text x="206.4516" y="557.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#333">ShuffleRead</text>
  <text x="206.4516" y="585.2903" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">(both sides)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-dag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,23.2258 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="41.8065" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.8387" font-weight="bold" fill="var(--text)">DAG: Join + Aggregation</text>
  <rect x="41.2903" y="69.6774" width="1176.7742" height="162.5806" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="103.2258" y="111.4839" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="var(--primary-accent)">Stage 0: Scan Table A</text>
  <rect x="82.5806" y="127.7419" width="206.4516" height="81.2903" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="3.0968" />
  <text x="185.8065" y="162.5806" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">FileScan</text>
  <text x="185.8065" y="190.4516" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-muted)">Parquet</text>
  <line x1="289.0323" y1="167.2258" x2="371.6129" y2="167.2258" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-dag)" />
  <rect x="381.9355" y="127.7419" width="247.7419" height="81.2903" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="3.0968" />
  <text x="505.8065" y="162.5806" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">Filter</text>
  <text x="505.8065" y="190.4516" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-muted)">(pushdown)</text>
  <line x1="629.6774" y1="167.2258" x2="712.2581" y2="167.2258" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-dag)" />
  <rect x="722.5806" y="127.7419" width="247.7419" height="81.2903" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="846.4516" y="178.8387" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">ShuffleWrite</text>
  <rect x="41.2903" y="267.0968" width="1176.7742" height="162.5806" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="103.2258" y="308.9032" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="var(--ok-accent)">Stage 1: Scan Table B</text>
  <rect x="82.5806" y="325.1613" width="206.4516" height="81.2903" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="3.0968" />
  <text x="185.8065" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">FileScan</text>
  <text x="185.8065" y="387.871" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-muted)">Parquet</text>
  <line x1="289.0323" y1="364.6452" x2="371.6129" y2="364.6452" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-dag)" />
  <rect x="381.9355" y="325.1613" width="206.4516" height="81.2903" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="3.0968" />
  <text x="485.1613" y="376.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">Select</text>
  <line x1="588.3871" y1="364.6452" x2="712.2581" y2="364.6452" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-dag)" />
  <rect x="722.5806" y="325.1613" width="247.7419" height="81.2903" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="846.4516" y="376.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">ShuffleWrite</text>
  <rect x="41.2903" y="464.5161" width="1176.7742" height="162.5806" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="103.2258" y="506.3226" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="var(--info-accent)">Stage 2: Join + Aggregate</text>
  <rect x="82.5806" y="522.5806" width="247.7419" height="81.2903" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="3.0968" />
  <text x="206.4516" y="557.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">ShuffleRead</text>
  <text x="206.4516" y="585.2903" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-muted)">(both sides)</text>
  <line x1="330.3226" y1="562.0645" x2="412.9032" y2="562.0645" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-dag)" />
  <rect x="423.2258" y="522.5806" width="206.4516" height="81.2903" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="3.0968" />
  <text x="526.4516" y="573.6774" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">Join</text>
  <line x1="629.6774" y1="562.0645" x2="712.2581" y2="562.0645" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-dag)" />
  <rect x="722.5806" y="522.5806" width="247.7419" height="81.2903" rx="6" fill="var(--bg)" stroke="var(--info-border)" stroke-width="3.0968" />
  <text x="846.4516" y="573.6774" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text)">Aggregate</text>
</svg>
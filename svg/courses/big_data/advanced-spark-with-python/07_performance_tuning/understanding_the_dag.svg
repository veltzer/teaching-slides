  <text x="640" y="41.8065" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.8387" font-weight="bold" fill="var(--text-dark)">DAG: Join + Aggregation</text>
  <rect x="41.2903" y="69.6774" width="1176.7742" height="162.5806" rx="16.5161" fill="var(--primary-pale3)" stroke="var(--primary-strong)" stroke-width="4.129" />
  <text x="103.2258" y="111.4839" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="var(--primary-strong)">Stage 0: Scan Table A</text>
  <rect x="82.5806" y="127.7419" width="206.4516" height="81.2903" rx="12.3871" fill="var(--bg)" stroke="var(--primary-strong)" stroke-width="3.0968" />

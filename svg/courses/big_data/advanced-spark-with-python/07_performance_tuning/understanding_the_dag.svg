  <text x="846.4516" y="178.8387" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#333">ShuffleWrite</text>
  <rect x="41.2903" y="267.0968" width="1176.7742" height="162.5806" rx="16.5161" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.129" />
  <text x="103.2258" y="308.9032" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="#2e7d32">Stage 1: Scan Table B</text>
  <rect x="82.5806" y="325.1613" width="206.4516" height="81.2903" rx="12.3871" fill="#fff" stroke="#2e7d32" stroke-width="3.0968" />

  <text x="185.8065" y="387.871" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-muted)">Parquet</text>
  <line x1="289.0323" y1="364.6452" x2="371.6129" y2="364.6452" stroke="var(--text-dark)" stroke-width="4.129" marker-end="url(#arrow-dag)" />
  <rect x="381.9355" y="325.1613" width="206.4516" height="81.2903" rx="12.3871" fill="var(--bg)" stroke="var(--ok-dk)" stroke-width="3.0968" />
  <text x="485.1613" y="376.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-dark)">Select</text>
  <line x1="588.3871" y1="364.6452" x2="712.2581" y2="364.6452" stroke="var(--text-dark)" stroke-width="4.129" marker-end="url(#arrow-dag)" />
  <rect x="722.5806" y="325.1613" width="247.7419" height="81.2903" rx="12.3871" fill="var(--warn-pale)" stroke="var(--warn-deep)" stroke-width="3.0968" />
  <text x="846.4516" y="376.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-dark)">ShuffleWrite</text>

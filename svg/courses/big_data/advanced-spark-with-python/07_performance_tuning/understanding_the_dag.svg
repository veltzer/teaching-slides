  <text x="206.4516" y="585.2903" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-muted)">(both sides)</text>
  <line x1="330.3226" y1="562.0645" x2="412.9032" y2="562.0645" stroke="var(--text-dark)" stroke-width="4.129" marker-end="url(#arrow-dag)" />
  <rect x="423.2258" y="522.5806" width="206.4516" height="81.2903" rx="12.3871" fill="var(--bg)" stroke="var(--info-mid)" stroke-width="3.0968" />
  <text x="526.4516" y="573.6774" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="var(--text-dark)">Join</text>

  <text x="526.4516" y="573.6774" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#333">Join</text>
  <line x1="629.6774" y1="562.0645" x2="712.2581" y2="562.0645" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-dag)" />
  <rect x="722.5806" y="522.5806" width="247.7419" height="81.2903" rx="12.3871" fill="#fff" stroke="#7b1fa2" stroke-width="3.0968" />
  <text x="846.4516" y="573.6774" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#333">Aggregate</text>

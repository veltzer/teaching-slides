<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="169.166640416669" rx="6.148170194568" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="103.1579" y="83.500026249998" font-family="Arial, sans-serif" font-size="25.519210026595" font-weight="bold" fill="var(--primary-accent)">Stage 0: Scan Table A</text>
  <rect x="82.1052" y="100.416679791666" width="210.5263" height="84.58337270833" rx="6.148170194568" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="3.0968"/>
  <text x="187.3685" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text)">FileScan</text>
  <text x="187.3685" y="165.666719166662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text-muted)">Parquet</text>
  <line x1="292.6316" y1="141.500026249998" x2="376.8421" y2="141.500026249998" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="387.3685" y="100.416679791666" width="252.6315" height="84.58337270833" rx="6.148170194568" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="3.0968"/>
  <text x="513.6843" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text)">Filter</text>
  <text x="513.6843" y="165.666719166662" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text-muted)">(pushdown)</text>
  <line x1="640" y1="141.500026249998" x2="724.2106" y2="141.500026249998" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="734.7368" y="100.416679791666" width="252.6315" height="84.58337270833" rx="6.148170194568" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.0526" y="153.583320208334" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text)">ShuffleWrite</text>
  <rect x="40" y="245.416732291661" width="1200" height="169.166640416669" rx="6.148170194568" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="103.1579" y="288.916653541668" font-family="Arial, sans-serif" font-size="25.519210026595" font-weight="bold" fill="var(--ok-accent)">Stage 1: Scan Table B</text>
  <rect x="82.1052" y="305.833412083327" width="210.5263" height="84.58337270833" rx="6.148170194568" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="3.0968"/>
  <text x="187.3685" y="342.083398958328" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text)">FileScan</text>
  <text x="187.3685" y="371.083451458323" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text-muted)">Parquet</text>
  <line x1="292.6316" y1="346.916758541659" x2="376.8421" y2="346.916758541659" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="387.3685" y="305.833412083327" width="210.5263" height="84.58337270833" rx="6.148170194568" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="3.0968"/>
  <text x="492.6316" y="359.000052499996" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text)">Select</text>
  <line x1="597.8948" y1="346.916758541659" x2="724.2106" y2="346.916758541659" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="734.7368" y="305.833412083327" width="252.6315" height="84.58337270833" rx="6.148170194568" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="861.0526" y="359.000052499996" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text)">ShuffleWrite</text>
  <rect x="40" y="450.833359583331" width="1200" height="169.166640416669" rx="6.148170194568" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="103.1579" y="494.333385833329" font-family="Arial, sans-serif" font-size="25.519210026595" font-weight="bold" fill="var(--info-accent)">Stage 2: Join + Aggregate</text>
  <rect x="82.1052" y="511.250039374997" width="252.6315" height="84.58337270833" rx="6.148170194568" fill="var(--bg)" stroke="var(--info-border)" stroke-width="3.0968"/>
  <text x="208.4211" y="547.500131249989" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text)">ShuffleRead</text>
  <text x="208.4211" y="576.500078749993" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text-muted)">(both sides)</text>
  <line x1="334.7369" y1="552.333385833329" x2="418.9474" y2="552.333385833329" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="429.4737" y="511.250039374997" width="210.5263" height="84.58337270833" rx="6.148170194568" fill="var(--bg)" stroke="var(--info-border)" stroke-width="3.0968"/>
  <text x="534.7368" y="564.416679791666" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text)">Join</text>
  <line x1="640" y1="552.333385833329" x2="724.2106" y2="552.333385833329" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="734.7368" y="511.250039374997" width="252.6315" height="84.58337270833" rx="6.148170194568" fill="var(--bg)" stroke="var(--info-border)" stroke-width="3.0968"/>
  <text x="861.0526" y="564.416679791666" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.266008355496" fill="var(--text)">Aggregate</text>
</svg>

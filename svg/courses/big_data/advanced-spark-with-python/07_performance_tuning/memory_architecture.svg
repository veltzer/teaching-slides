<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.000161" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.785042" font-weight="bold" fill="var(--text)">Executor Memory Layout (spark.executor.memory = 8g)</text>
  <text x="640.000161" y="89.400631" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.831142" fill="var(--text-muted)">Total Container: 8g + max(384m, 0.1*8g) = 8.8 GB</text>
  <rect x="40" y="107.697161" width="1200" height="439.116822" rx="6.315572" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.000161" y="144.290221" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.800373" font-weight="bold" fill="var(--primary-accent)">JVM Heap (8 GB)</text>
  <rect x="84.444544" y="162.586854" width="1111.111127" height="45.741325" rx="6.315572" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.000161" y="193.690852" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.846473" fill="var(--text)">Reserved Memory (300 MB)</text>
  <rect x="84.444544" y="222.965403" width="1111.111127" height="182.9653" rx="6.315572" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.000161" y="255.899157" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.831142" font-weight="bold" fill="var(--text)">Spark Memory (0.6 * 8g = 4.8 GB)</text>
  <rect x="128.88898" y="272.365931" width="511.111073" height="109.77918" rx="6.315572" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="384.444517" y="308.959094" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.831142" font-weight="bold" fill="var(--text)">Execution (60%)</text>
  <text x="384.444517" y="336.403785" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.846473" fill="var(--text-muted)">Shuffles, sorts, joins, aggs</text>
  <text x="384.444517" y="363.84858" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.846473" fill="var(--text-muted)">2.88 GB</text>
  <rect x="662.222433" y="272.365931" width="511.111073" height="109.77918" rx="6.315572" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="917.777862" y="308.959094" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.831142" font-weight="bold" fill="var(--text)">Storage (40%)</text>
  <text x="917.777862" y="336.403785" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.846473" fill="var(--text-muted)">Cached data, broadcast vars</text>
  <text x="917.777862" y="363.84858" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.846473" fill="var(--text-muted)">1.92 GB</text>
  <rect x="84.444544" y="418.738274" width="1111.111127" height="100.630915" rx="6.315572" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.000161" y="460.820292" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.831142" font-weight="bold" fill="var(--text)">User Memory (0.4 * 8g = 3.2 GB)</text>
  <text x="640.000161" y="497.413352" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.846473" fill="var(--text-muted)">UDF data, internal metadata</text>
  <rect x="40" y="555.962145" width="1200" height="64.037855" rx="6.315572" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.000161" y="596.214614" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.831142" fill="var(--text)">Off-Heap / Overhead (800 MB) - OS overhead, Python processes</text>
</svg>
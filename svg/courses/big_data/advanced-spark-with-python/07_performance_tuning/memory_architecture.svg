<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640.000161" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.824805567696" fill="var(--text-muted)">Total Container: 8g + max(384m, 0.1*8g) = 8.8 GB</text>
  <rect x="40" y="60.000000037693" width="1200" height="480.000112401189" rx="6.603030796501" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640.000161" y="100.00000011308" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.974699596523" font-weight="bold" fill="var(--primary-accent)">JVM Heap (8 GB)</text>
  <rect x="84.444544" y="120.000112740428" width="1111.111127" height="50.000000094233" rx="6.603030796501" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640.000161" y="154.000000214851" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.749802618184" fill="var(--text)">Reserved Memory (300 MB)</text>
  <rect x="84.444544" y="186.000112864816" width="1111.111127" height="200.000000376932" rx="6.603030796501" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640.000161" y="222.000112932664" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.824805567696" font-weight="bold" fill="var(--text)">Spark Memory (0.6 * 8g = 4.8 GB)</text>
  <rect x="128.88898" y="240.000000376932" width="511.111073" height="120.000000226159" rx="6.603030796501" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="384.444517" y="280.000113041974" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.824805567696" font-weight="bold" fill="var(--text)">Execution (60%)</text>
  <text x="384.444517" y="309.999999415755" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.749802618184" fill="var(--text-muted)">Shuffles, sorts, joins, aggs</text>
  <text x="384.444517" y="339.999999472295" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.749802618184" fill="var(--text-muted)">2.88 GB</text>
  <rect x="662.222433" y="240.000000376932" width="511.111073" height="120.000000226159" rx="6.603030796501" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="917.777862" y="280.000113041974" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.824805567696" font-weight="bold" fill="var(--text)">Storage (40%)</text>
  <text x="917.777862" y="309.999999415755" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.749802618184" fill="var(--text-muted)">Cached data, broadcast vars</text>
  <text x="917.777862" y="339.999999472295" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.749802618184" fill="var(--text-muted)">1.92 GB</text>
  <rect x="84.444544" y="400.000113268133" width="1111.111127" height="110.000000207313" rx="6.603030796501" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640.000161" y="446.000112261724" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.824805567696" font-weight="bold" fill="var(--text)">User Memory (0.4 * 8g = 3.2 GB)</text>
  <text x="640.000161" y="486.000112337111" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.749802618184" fill="var(--text-muted)">UDF data, internal metadata</text>
  <rect x="40" y="549.999999868074" width="1200" height="70.000000131926" rx="6.603030796501" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640.000161" y="594.000112540654" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.824805567696" fill="var(--text)">Off-Heap / Overhead (800 MB) - OS overhead, Python processes</text>
</svg>

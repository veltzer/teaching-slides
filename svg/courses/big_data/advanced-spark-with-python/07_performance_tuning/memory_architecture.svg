<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333">Executor Memory Layout (spark.executor.memory = 8g)</text>
  <rect x="41.2903" y="50" width="1197.4194" height="640" rx="16" fill="#f5f5f5" stroke="#333" stroke-width="4" />
  <text x="640" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#555">Total Container: 8g + max(384m, 0.1*8g) = 8.8 GB</text>
  <rect x="82.5806" y="110" width="1114.8387" height="480" rx="16" fill="#e1f5fe" stroke="#0277bd" stroke-width="4" />
  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#0277bd">JVM Heap (8 GB)</text>
  <rect x="123.871" y="170" width="1032.2581" height="50" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="3" />
  <text x="640" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#333">Reserved Memory (300 MB)</text>
  <rect x="123.871" y="236" width="1032.2581" height="200" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3" />
  <text x="640" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">Spark Memory (0.6 * 8g = 4.8 GB)</text>
  <rect x="165.1613" y="290" width="474.8387" height="120" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" />
  <text x="402.5806" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">Execution (60%)</text>
  <text x="402.5806" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555">Shuffles, sorts, joins, aggs</text>
  <text x="402.5806" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555">2.88 GB</text>
  <rect x="660.6452" y="290" width="474.8387" height="120" rx="12" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" />
  <text x="898.0645" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">Storage (40%)</text>
  <text x="898.0645" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555">Cached data, broadcast vars</text>
  <text x="898.0645" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555">1.92 GB</text>
  <rect x="123.871" y="450" width="1032.2581" height="110" rx="12" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" />
  <text x="640" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">User Memory (0.4 * 8g = 3.2 GB)</text>
  <text x="640" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#555">UDF data, internal metadata</text>
  <rect x="82.5806" y="600" width="1114.8387" height="70" rx="12" fill="#fce4ec" stroke="#c62828" stroke-width="3" />
  <text x="640" y="644" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#333">Off-Heap / Overhead (800 MB) - OS overhead, Python processes</text>
</svg>
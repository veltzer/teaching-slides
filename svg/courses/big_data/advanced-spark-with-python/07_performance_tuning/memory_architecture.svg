<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.3967" font-weight="bold" fill="var(--text)">Executor Memory Layout (spark.executor.memory = 8g)</text>
  <rect x="40" y="52.4159" width="1200" height="567.5841" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="87.8899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7403" fill="var(--text-muted)">Total Container: 8g + max(384m, 0.1*8g) = 8.8 GB</text>
  <rect x="81.3793" y="105.6269" width="1117.2413" height="425.6881" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="141.1009" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.5112" font-weight="bold" fill="var(--primary-accent)">JVM Heap (8 GB)</text>
  <rect x="122.7587" y="158.838" width="1034.4827" height="44.3425" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.0001" y="188.9908" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8548" fill="var(--text)">Reserved Memory (300 MB)</text>
  <rect x="122.7587" y="217.3701" width="1034.4827" height="177.37" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="249.2967" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7403" font-weight="bold" fill="var(--text)">Spark Memory (0.6 * 8g = 4.8 GB)</text>
  <rect x="164.138" y="265.2599" width="475.862" height="106.422" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="402.069" y="300.734" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7403" font-weight="bold" fill="var(--text)">Execution (60%)</text>
  <text x="402.069" y="327.3394" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8548" fill="var(--text-muted)">Shuffles, sorts, joins, aggs</text>
  <text x="402.069" y="353.9449" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8548" fill="var(--text-muted)">2.88 GB</text>
  <rect x="660.6898" y="265.2599" width="475.862" height="106.422" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="898.6207" y="300.734" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7403" font-weight="bold" fill="var(--text)">Storage (40%)</text>
  <text x="898.6207" y="327.3394" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8548" fill="var(--text-muted)">Cached data, broadcast vars</text>
  <text x="898.6207" y="353.9449" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8548" fill="var(--text-muted)">1.92 GB</text>
  <rect x="122.7587" y="407.156" width="1034.4827" height="97.5535" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="447.9511" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7403" font-weight="bold" fill="var(--text)">User Memory (0.4 * 8g = 3.2 GB)</text>
  <text x="640.0001" y="483.4251" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8548" fill="var(--text-muted)">UDF data, internal metadata</text>
  <rect x="81.3793" y="540.1834" width="1117.2413" height="62.0795" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.0001" y="579.2049" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7403" fill="var(--text)">Off-Heap / Overhead (800 MB) - OS overhead, Python processes</text>
</svg>
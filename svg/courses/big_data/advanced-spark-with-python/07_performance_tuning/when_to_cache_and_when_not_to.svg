<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="24.6154" y="15" width="1230.7692" height="330" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="640" y="60" text-anchor="middle" font-size="24" font-weight="bold" fill="#28a745">CACHE when:</text>
  <text x="73.8462" y="105" font-size="19.5" fill="#333">• DataFrame used in 2+ actions</text>
  <text x="73.8462" y="142.5" font-size="19.5" fill="#333">• Computation is expensive (joins, aggs)</text>
  <text x="73.8462" y="180" font-size="19.5" fill="#333">• Data fits in memory (or mostly)</text>
  <text x="73.8462" y="217.5" font-size="19.5" fill="#333">• Iterative algorithms (ML training)</text>
  <text x="73.8462" y="255" font-size="19.5" fill="#333">• Interactive exploration (notebooks)</text>
  <rect x="24.6154" y="375" width="1230.7692" height="330" rx="7.5" fill="#f8d7da" stroke="#dc3545" stroke-width="3" />
  <text x="640" y="420" text-anchor="middle" font-size="24" font-weight="bold" fill="#dc3545">DO NOT CACHE when:</text>
  <text x="73.8462" y="465" font-size="19.5" fill="#333">• DataFrame used only once</text>
  <text x="73.8462" y="502.5" font-size="19.5" fill="#333">• Data is too large for memory</text>
  <text x="73.8462" y="540" font-size="19.5" fill="#333">• Source read is fast (e.g., small file)</text>
  <text x="73.8462" y="577.5" font-size="19.5" fill="#333">• Memory is scarce for execution</text>
  <text x="73.8462" y="615" font-size="19.5" fill="#333">• Data changes between uses</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="22.3459" y="13.617" width="1117.294" height="299.5745" rx="6.8085" fill="#d4edda" stroke="#28a745" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="54.4681" text-anchor="middle" font-size="21.7872" font-weight="bold" fill="#28a745">CACHE when:</ns0:text>
  <ns0:text x="67.0377" y="95.3191" font-size="17.7021" fill="#333">• DataFrame used in 2+ actions</ns0:text>
  <ns0:text x="67.0377" y="129.3617" font-size="17.7021" fill="#333">• Computation is expensive (joins, aggs)</ns0:text>
  <ns0:text x="67.0377" y="163.4043" font-size="17.7021" fill="#333">• Data fits in memory (or mostly)</ns0:text>
  <ns0:text x="67.0377" y="197.4468" font-size="17.7021" fill="#333">• Iterative algorithms (ML training)</ns0:text>
  <ns0:text x="67.0377" y="231.4894" font-size="17.7021" fill="#333">• Interactive exploration (notebooks)</ns0:text>
  <ns0:rect x="22.3459" y="340.4255" width="1117.294" height="299.5745" rx="6.8085" fill="#f8d7da" stroke="#dc3545" stroke-width="2.7234" />
  <ns0:text x="580.9929" y="381.2766" text-anchor="middle" font-size="21.7872" font-weight="bold" fill="#dc3545">DO NOT CACHE when:</ns0:text>
  <ns0:text x="67.0377" y="422.1277" font-size="17.7021" fill="#333">• DataFrame used only once</ns0:text>
  <ns0:text x="67.0377" y="456.1702" font-size="17.7021" fill="#333">• Data is too large for memory</ns0:text>
  <ns0:text x="67.0377" y="490.2128" font-size="17.7021" fill="#333">• Source read is fast (e.g., small file)</ns0:text>
  <ns0:text x="67.0377" y="524.2553" font-size="17.7021" fill="#333">• Memory is scarce for execution</ns0:text>
  <ns0:text x="67.0377" y="558.2979" font-size="17.7021" fill="#333">• Data changes between uses</ns0:text>
</ns0:svg>
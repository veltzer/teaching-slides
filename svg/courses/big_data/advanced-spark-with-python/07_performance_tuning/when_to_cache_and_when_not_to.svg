<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="500" height="220" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="260" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#28a745">CACHE when:</text>
  <text x="30" y="70" font-size="13" fill="#333">&#x2022; DataFrame used in 2+ actions</text>
  <text x="30" y="95" font-size="13" fill="#333">&#x2022; Computation is expensive (joins, aggs)</text>
  <text x="30" y="120" font-size="13" fill="#333">&#x2022; Data fits in memory (or mostly)</text>
  <text x="30" y="145" font-size="13" fill="#333">&#x2022; Iterative algorithms (ML training)</text>
  <text x="30" y="170" font-size="13" fill="#333">&#x2022; Interactive exploration (notebooks)</text>
  <rect x="10" y="250" width="500" height="220" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="260" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc3545">DO NOT CACHE when:</text>
  <text x="30" y="310" font-size="13" fill="#333">&#x2022; DataFrame used only once</text>
  <text x="30" y="335" font-size="13" fill="#333">&#x2022; Data is too large for memory</text>
  <text x="30" y="360" font-size="13" fill="#333">&#x2022; Source read is fast (e.g., small file)</text>
  <text x="30" y="385" font-size="13" fill="#333">&#x2022; Memory is scarce for execution</text>
  <text x="30" y="410" font-size="13" fill="#333">&#x2022; Data changes between uses</text>
</svg>

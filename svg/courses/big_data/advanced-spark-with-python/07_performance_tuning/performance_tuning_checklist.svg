<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="21.3436" y="8.3117" width="1109.8668" height="631.6883" rx="4.1559" fill="var(--surface-light)" stroke="var(--primary-bright)" stroke-width="1.6624" />
  <text x="576.277" y="33.2468" text-anchor="middle" font-size="13.2987" font-weight="bold" fill="var(--text-dark)">Performance Tuning Checklist</text>
  <line x1="64.0308" y1="41.5584" x2="1088.5232" y2="41.5584" stroke="var(--primary-bright)" stroke-width="1.6624" />
  <rect x="64.0308" y="54.026" width="1024.4925" height="99.7402" rx="4.1559" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.2467" />
  <text x="106.7179" y="72.3117" font-size="10.8052" font-weight="bold" fill="var(--text-dark)">Before Running</text>
  <text x="106.7179" y="88.935" font-size="10" fill="var(--text-muted)">☐ Set appropriate executor memory</text>
  <text x="106.7179" y="103.0649" font-size="10" fill="var(--text-muted)">☐ Set executor cores (2-5 per executor)</text>
  <text x="106.7179" y="117.1948" font-size="10" fill="var(--text-muted)">☐ Enable AQE</text>
  <text x="106.7179" y="131.3247" font-size="10" fill="var(--text-muted)">☐ Set shuffle partitions</text>
  <text x="106.7179" y="145.4546" font-size="10" fill="var(--text-muted)">☐ Enable Kryo serialization</text>
  <rect x="64.0308" y="162.0779" width="1024.4925" height="91.4286" rx="4.1559" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="1.2467" />
  <text x="106.7179" y="180.3636" font-size="10.8052" font-weight="bold" fill="var(--text-dark)">Data Reading</text>
  <text x="106.7179" y="196.987" font-size="10" fill="var(--text-muted)">☐ Use columnar formats (Parquet)</text>
  <text x="106.7179" y="211.1168" font-size="10" fill="var(--text-muted)">☐ Define schema explicitly</text>
  <text x="106.7179" y="225.2467" font-size="10" fill="var(--text-muted)">☐ Use partition pruning</text>
  <text x="106.7179" y="239.3766" font-size="10" fill="var(--text-muted)">☐ Push predicates to source</text>
  <rect x="64.0308" y="261.8181" width="1024.4925" height="99.7402" rx="4.1559" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="1.2467" />
  <text x="106.7179" y="280.1038" font-size="10.8052" font-weight="bold" fill="var(--text-dark)">Transformations</text>
  <text x="106.7179" y="296.7273" font-size="10" fill="var(--text-muted)">☐ Filter early, select early</text>
  <text x="106.7179" y="310.8571" font-size="10" fill="var(--text-muted)">☐ Avoid UDFs (use built-in functions)</text>
  <text x="106.7179" y="324.987" font-size="10" fill="var(--text-muted)">☐ Broadcast small tables in joins</text>
  <text x="106.7179" y="339.1169" font-size="10" fill="var(--text-muted)">☐ Handle data skew</text>
  <text x="106.7179" y="353.2467" font-size="10" fill="var(--text-muted)">☐ Cache reused DataFrames</text>
  <rect x="64.0308" y="369.8701" width="1024.4925" height="91.4286" rx="4.1559" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.2467" />
  <text x="106.7179" y="388.1558" font-size="10.8052" font-weight="bold" fill="var(--text-dark)">Writing</text>
  <text x="106.7179" y="404.7792" font-size="10" fill="var(--text-muted)">☐ Coalesce before writing</text>
  <text x="106.7179" y="418.9091" font-size="10" fill="var(--text-muted)">☐ Partition output by query pattern</text>
  <text x="106.7179" y="433.0389" font-size="10" fill="var(--text-muted)">☐ Use dynamic partition overwrite</text>
  <text x="106.7179" y="447.1688" font-size="10" fill="var(--text-muted)">☐ Choose appropriate compression</text>
  <rect x="64.0308" y="469.6104" width="1024.4925" height="91.4286" rx="4.1559" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="1.2467" />
  <text x="106.7179" y="487.8961" font-size="10.8052" font-weight="bold" fill="var(--text-dark)">Monitoring</text>
  <text x="106.7179" y="504.5194" font-size="10" fill="var(--text-muted)">☐ Check Spark UI for skew</text>
  <text x="106.7179" y="518.6493" font-size="10" fill="var(--text-muted)">☐ Check GC time per executor</text>
  <text x="106.7179" y="532.7792" font-size="10" fill="var(--text-muted)">☐ Check shuffle spill metrics</text>
  <text x="106.7179" y="546.909" font-size="10" fill="var(--text-muted)">☐ Check task duration distribution</text>
</svg>
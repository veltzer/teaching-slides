<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 780" font-family="Arial, sans-serif">
  <rect x="10" y="10" width="520" height="760" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2"/>
  <text x="270" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Performance Tuning Checklist</text>
  <line x1="30" y1="50" x2="510" y2="50" stroke="#4a90e2" stroke-width="2"/>
  <!-- Before Running -->
  <rect x="30" y="65" width="480" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="50" y="87" font-size="13" font-weight="bold" fill="#333">Before Running</text>
  <text x="50" y="107" font-size="11" fill="#555">☐ Set appropriate executor memory</text>
  <text x="50" y="124" font-size="11" fill="#555">☐ Set executor cores (2-5 per executor)</text>
  <text x="50" y="141" font-size="11" fill="#555">☐ Enable AQE</text>
  <text x="50" y="158" font-size="11" fill="#555">☐ Set shuffle partitions</text>
  <text x="50" y="175" font-size="11" fill="#555">☐ Enable Kryo serialization</text>
  <!-- Data Reading -->
  <rect x="30" y="195" width="480" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="50" y="217" font-size="13" font-weight="bold" fill="#333">Data Reading</text>
  <text x="50" y="237" font-size="11" fill="#555">☐ Use columnar formats (Parquet)</text>
  <text x="50" y="254" font-size="11" fill="#555">☐ Define schema explicitly</text>
  <text x="50" y="271" font-size="11" fill="#555">☐ Use partition pruning</text>
  <text x="50" y="288" font-size="11" fill="#555">☐ Push predicates to source</text>
  <!-- Transformations -->
  <rect x="30" y="315" width="480" height="120" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="50" y="337" font-size="13" font-weight="bold" fill="#333">Transformations</text>
  <text x="50" y="357" font-size="11" fill="#555">☐ Filter early, select early</text>
  <text x="50" y="374" font-size="11" fill="#555">☐ Avoid UDFs (use built-in functions)</text>
  <text x="50" y="391" font-size="11" fill="#555">☐ Broadcast small tables in joins</text>
  <text x="50" y="408" font-size="11" fill="#555">☐ Handle data skew</text>
  <text x="50" y="425" font-size="11" fill="#555">☐ Cache reused DataFrames</text>
  <!-- Writing -->
  <rect x="30" y="445" width="480" height="110" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="50" y="467" font-size="13" font-weight="bold" fill="#333">Writing</text>
  <text x="50" y="487" font-size="11" fill="#555">☐ Coalesce before writing</text>
  <text x="50" y="504" font-size="11" fill="#555">☐ Partition output by query pattern</text>
  <text x="50" y="521" font-size="11" fill="#555">☐ Use dynamic partition overwrite</text>
  <text x="50" y="538" font-size="11" fill="#555">☐ Choose appropriate compression</text>
  <!-- Monitoring -->
  <rect x="30" y="565" width="480" height="110" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="50" y="587" font-size="13" font-weight="bold" fill="#333">Monitoring</text>
  <text x="50" y="607" font-size="11" fill="#555">☐ Check Spark UI for skew</text>
  <text x="50" y="624" font-size="11" fill="#555">☐ Check GC time per executor</text>
  <text x="50" y="641" font-size="11" fill="#555">☐ Check shuffle spill metrics</text>
  <text x="50" y="658" font-size="11" fill="#555">☐ Check task duration distribution</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="23.7037" y="9.2308" width="1232.5926" height="701.5385" rx="4.6154" fill="#f8f9fa" stroke="#4a90e2" stroke-width="1.8462" />
  <text x="640" y="36.9231" text-anchor="middle" font-size="14.7692" font-weight="bold" fill="#333">Performance Tuning Checklist</text>
  <line x1="71.1111" y1="46.1538" x2="1208.8889" y2="46.1538" stroke="#4a90e2" stroke-width="1.8462" />
  <rect x="71.1111" y="60" width="1137.7778" height="110.7692" rx="4.6154" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3846" />
  <text x="118.5185" y="80.3077" font-size="12" font-weight="bold" fill="#333">Before Running</text>
  <text x="118.5185" y="98.7692" font-size="10.1538" fill="#555">☐ Set appropriate executor memory</text>
  <text x="118.5185" y="114.4615" font-size="10.1538" fill="#555">☐ Set executor cores (2-5 per executor)</text>
  <text x="118.5185" y="130.1538" font-size="10.1538" fill="#555">☐ Enable AQE</text>
  <text x="118.5185" y="145.8462" font-size="10.1538" fill="#555">☐ Set shuffle partitions</text>
  <text x="118.5185" y="161.5385" font-size="10.1538" fill="#555">☐ Enable Kryo serialization</text>
  <rect x="71.1111" y="180" width="1137.7778" height="101.5385" rx="4.6154" fill="#d4edda" stroke="#28a745" stroke-width="1.3846" />
  <text x="118.5185" y="200.3077" font-size="12" font-weight="bold" fill="#333">Data Reading</text>
  <text x="118.5185" y="218.7692" font-size="10.1538" fill="#555">☐ Use columnar formats (Parquet)</text>
  <text x="118.5185" y="234.4615" font-size="10.1538" fill="#555">☐ Define schema explicitly</text>
  <text x="118.5185" y="250.1538" font-size="10.1538" fill="#555">☐ Use partition pruning</text>
  <text x="118.5185" y="265.8462" font-size="10.1538" fill="#555">☐ Push predicates to source</text>
  <rect x="71.1111" y="290.7692" width="1137.7778" height="110.7692" rx="4.6154" fill="#fff3cd" stroke="#ffc107" stroke-width="1.3846" />
  <text x="118.5185" y="311.0769" font-size="12" font-weight="bold" fill="#333">Transformations</text>
  <text x="118.5185" y="329.5385" font-size="10.1538" fill="#555">☐ Filter early, select early</text>
  <text x="118.5185" y="345.2308" font-size="10.1538" fill="#555">☐ Avoid UDFs (use built-in functions)</text>
  <text x="118.5185" y="360.9231" font-size="10.1538" fill="#555">☐ Broadcast small tables in joins</text>
  <text x="118.5185" y="376.6154" font-size="10.1538" fill="#555">☐ Handle data skew</text>
  <text x="118.5185" y="392.3077" font-size="10.1538" fill="#555">☐ Cache reused DataFrames</text>
  <rect x="71.1111" y="410.7692" width="1137.7778" height="101.5385" rx="4.6154" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3846" />
  <text x="118.5185" y="431.0769" font-size="12" font-weight="bold" fill="#333">Writing</text>
  <text x="118.5185" y="449.5385" font-size="10.1538" fill="#555">☐ Coalesce before writing</text>
  <text x="118.5185" y="465.2308" font-size="10.1538" fill="#555">☐ Partition output by query pattern</text>
  <text x="118.5185" y="480.9231" font-size="10.1538" fill="#555">☐ Use dynamic partition overwrite</text>
  <text x="118.5185" y="496.6154" font-size="10.1538" fill="#555">☐ Choose appropriate compression</text>
  <rect x="71.1111" y="521.5385" width="1137.7778" height="101.5385" rx="4.6154" fill="#f8d7da" stroke="#dc3545" stroke-width="1.3846" />
  <text x="118.5185" y="541.8462" font-size="12" font-weight="bold" fill="#333">Monitoring</text>
  <text x="118.5185" y="560.3077" font-size="10.1538" fill="#555">☐ Check Spark UI for skew</text>
  <text x="118.5185" y="576" font-size="10.1538" fill="#555">☐ Check GC time per executor</text>
  <text x="118.5185" y="591.6923" font-size="10.1538" fill="#555">☐ Check shuffle spill metrics</text>
  <text x="118.5185" y="607.3846" font-size="10.1538" fill="#555">☐ Check task duration distribution</text>
</svg>
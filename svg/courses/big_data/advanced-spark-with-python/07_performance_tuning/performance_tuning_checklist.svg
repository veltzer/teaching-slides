<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.999892" y="40" text-anchor="middle" font-size="15.087827" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Performance Tuning Checklist</text>
  <line x1="40" y1="49.133765" x2="1239.999783" y2="49.133765" stroke="var(--primary-border)" stroke-width="1.6624" />
  <rect x="40" y="62.834592" width="1200" height="109.606257" rx="6.832069" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="89.999838" y="82.929114" font-size="12.258895" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Before Running</text>
  <text x="89.999838" y="101.196644" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Set appropriate executor memory</text>
  <text x="89.999838" y="116.724344" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Set executor cores (2-5 per executor)</text>
  <text x="89.999838" y="132.251924" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Enable AQE</text>
  <text x="89.999838" y="147.779504" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Set shuffle partitions</text>
  <text x="89.999838" y="163.307084" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Enable Kryo serialization</text>
  <rect x="40" y="181.574733" width="1200" height="100.472492" rx="6.832069" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="89.999838" y="201.669136" font-size="12.258895" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Data Reading</text>
  <text x="89.999838" y="219.936905" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Use columnar formats (Parquet)</text>
  <text x="89.999838" y="235.464366" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Define schema explicitly</text>
  <text x="89.999838" y="250.992065" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Use partition pruning</text>
  <text x="89.999838" y="266.519645" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Push predicates to source</text>
  <rect x="40" y="291.18099" width="1200" height="109.606257" rx="6.832069" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="89.999838" y="311.275393" font-size="12.258895" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Transformations</text>
  <text x="89.999838" y="329.543282" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Filter early, select early</text>
  <text x="89.999838" y="345.070742" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Avoid UDFs (use built-in functions)</text>
  <text x="89.999838" y="360.598322" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Broadcast small tables in joins</text>
  <text x="89.999838" y="376.126022" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Handle data skew</text>
  <text x="89.999838" y="391.653482" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Cache reused DataFrames</text>
  <rect x="40" y="409.921251" width="1200" height="100.472492" rx="6.832069" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="89.999838" y="430.015654" font-size="12.258895" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Writing</text>
  <text x="89.999838" y="448.283423" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Coalesce before writing</text>
  <text x="89.999838" y="463.811003" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Partition output by query pattern</text>
  <text x="89.999838" y="479.338464" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Use dynamic partition overwrite</text>
  <text x="89.999838" y="494.866044" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Choose appropriate compression</text>
  <rect x="40" y="519.527508" width="1200" height="100.472492" rx="6.832069" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="89.999838" y="539.62203" font-size="12.258895" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Monitoring</text>
  <text x="89.999838" y="557.88968" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Check Spark UI for skew</text>
  <text x="89.999838" y="573.41726" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Check GC time per executor</text>
  <text x="89.999838" y="588.94484" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Check shuffle spill metrics</text>
  <text x="89.999838" y="604.4723" font-size="11.386782" fill="var(--text-muted)" font-family="Arial, sans-serif">☐ Check task duration distribution</text>
</svg>
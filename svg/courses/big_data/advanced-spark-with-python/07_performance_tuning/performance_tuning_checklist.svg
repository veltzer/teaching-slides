<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="21.3436" y="8.3117" width="1109.8668" height="631.6883" rx="4.1559" fill="#f9f9f9" stroke="#4a90e2" stroke-width="1.6624" />
  <ns0:text x="576.277" y="33.2468" text-anchor="middle" font-size="13.2987" font-weight="bold" fill="#333">Performance Tuning Checklist</ns0:text>
  <ns0:line x1="64.0308" y1="41.5584" x2="1088.5232" y2="41.5584" stroke="#4a90e2" stroke-width="1.6624" />
  <ns0:rect x="64.0308" y="54.026" width="1024.4925" height="99.7402" rx="4.1559" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.2467" />
  <ns0:text x="106.7179" y="72.3117" font-size="10.8052" font-weight="bold" fill="#333">Before Running</ns0:text>
  <ns0:text x="106.7179" y="88.935" font-size="10" fill="#555">☐ Set appropriate executor memory</ns0:text>
  <ns0:text x="106.7179" y="103.0649" font-size="10" fill="#555">☐ Set executor cores (2-5 per executor)</ns0:text>
  <ns0:text x="106.7179" y="117.1948" font-size="10" fill="#555">☐ Enable AQE</ns0:text>
  <ns0:text x="106.7179" y="131.3247" font-size="10" fill="#555">☐ Set shuffle partitions</ns0:text>
  <ns0:text x="106.7179" y="145.4546" font-size="10" fill="#555">☐ Enable Kryo serialization</ns0:text>
  <ns0:rect x="64.0308" y="162.0779" width="1024.4925" height="91.4286" rx="4.1559" fill="#d4edda" stroke="#28a745" stroke-width="1.2467" />
  <ns0:text x="106.7179" y="180.3636" font-size="10.8052" font-weight="bold" fill="#333">Data Reading</ns0:text>
  <ns0:text x="106.7179" y="196.987" font-size="10" fill="#555">☐ Use columnar formats (Parquet)</ns0:text>
  <ns0:text x="106.7179" y="211.1168" font-size="10" fill="#555">☐ Define schema explicitly</ns0:text>
  <ns0:text x="106.7179" y="225.2467" font-size="10" fill="#555">☐ Use partition pruning</ns0:text>
  <ns0:text x="106.7179" y="239.3766" font-size="10" fill="#555">☐ Push predicates to source</ns0:text>
  <ns0:rect x="64.0308" y="261.8181" width="1024.4925" height="99.7402" rx="4.1559" fill="#fff3cd" stroke="#ffc107" stroke-width="1.2467" />
  <ns0:text x="106.7179" y="280.1038" font-size="10.8052" font-weight="bold" fill="#333">Transformations</ns0:text>
  <ns0:text x="106.7179" y="296.7273" font-size="10" fill="#555">☐ Filter early, select early</ns0:text>
  <ns0:text x="106.7179" y="310.8571" font-size="10" fill="#555">☐ Avoid UDFs (use built-in functions)</ns0:text>
  <ns0:text x="106.7179" y="324.987" font-size="10" fill="#555">☐ Broadcast small tables in joins</ns0:text>
  <ns0:text x="106.7179" y="339.1169" font-size="10" fill="#555">☐ Handle data skew</ns0:text>
  <ns0:text x="106.7179" y="353.2467" font-size="10" fill="#555">☐ Cache reused DataFrames</ns0:text>
  <ns0:rect x="64.0308" y="369.8701" width="1024.4925" height="91.4286" rx="4.1559" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.2467" />
  <ns0:text x="106.7179" y="388.1558" font-size="10.8052" font-weight="bold" fill="#333">Writing</ns0:text>
  <ns0:text x="106.7179" y="404.7792" font-size="10" fill="#555">☐ Coalesce before writing</ns0:text>
  <ns0:text x="106.7179" y="418.9091" font-size="10" fill="#555">☐ Partition output by query pattern</ns0:text>
  <ns0:text x="106.7179" y="433.0389" font-size="10" fill="#555">☐ Use dynamic partition overwrite</ns0:text>
  <ns0:text x="106.7179" y="447.1688" font-size="10" fill="#555">☐ Choose appropriate compression</ns0:text>
  <ns0:rect x="64.0308" y="469.6104" width="1024.4925" height="91.4286" rx="4.1559" fill="#f8d7da" stroke="#dc3545" stroke-width="1.2467" />
  <ns0:text x="106.7179" y="487.8961" font-size="10.8052" font-weight="bold" fill="#333">Monitoring</ns0:text>
  <ns0:text x="106.7179" y="504.5194" font-size="10" fill="#555">☐ Check Spark UI for skew</ns0:text>
  <ns0:text x="106.7179" y="518.6493" font-size="10" fill="#555">☐ Check GC time per executor</ns0:text>
  <ns0:text x="106.7179" y="532.7792" font-size="10" fill="#555">☐ Check shuffle spill metrics</ns0:text>
  <ns0:text x="106.7179" y="546.909" font-size="10" fill="#555">☐ Check task duration distribution</ns0:text>
</ns0:svg>
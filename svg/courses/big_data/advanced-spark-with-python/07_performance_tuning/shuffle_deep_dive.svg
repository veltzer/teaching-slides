<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-sh" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <text x="592.2679" y="31.5617" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7945" font-weight="bold" fill="var(--primary-accent)">Writer Side (Map stage)</text>
  <rect x="57.3163" y="43.8356" width="1069.9033" height="263.0137" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="95.5271" y="73.6438" font-family="Arial, sans-serif" font-size="19.2877" font-weight="bold" fill="var(--text)">Executor</text>
  <rect x="95.5271" y="87.6712" width="210.1596" height="61.3699" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6301" />
  <text x="200.6069" y="126.2466" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5343" fill="var(--text)">Task (process)</text>
  <line x1="305.6867" y1="117.4795" x2="382.1083" y2="117.4795" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <rect x="391.661" y="87.6712" width="382.1083" height="61.3699" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6301" />
  <text x="582.7152" y="113.9726" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5343" fill="var(--text)">Sort by partition key</text>
  <text x="582.7152" y="136.7672" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5343" fill="var(--text-muted)">+ spill to disk</text>
  <line x1="477.6354" y1="149.0411" x2="248.3704" y2="201.6438" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <line x1="582.7152" y1="149.0411" x2="582.7152" y2="201.6438" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <line x1="687.795" y1="149.0411" x2="917.06" y2="201.6438" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <rect x="133.7379" y="210.411" width="229.265" height="61.3699" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="248.3704" y="248.9863" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5343" fill="var(--text)">Part 0 file</text>
  <rect x="468.0828" y="210.411" width="229.265" height="61.3699" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.7152" y="248.9863" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5343" fill="var(--text)">Part 1 file</text>
  <rect x="802.4275" y="210.411" width="229.265" height="61.3699" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="917.06" y="248.9863" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5343" fill="var(--text)">Part 2 file</text>
  <text x="592.2679" y="350.685" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7945" font-weight="bold" fill="var(--ok-accent)">Reader Side (Reduce stage)</text>
  <rect x="57.3163" y="368.2192" width="1069.9033" height="271.7808" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="95.5271" y="399.7808" font-family="Arial, sans-serif" font-size="19.2877" font-weight="bold" fill="var(--text)">Executor (for Partition 0)</text>
  <text x="592.2679" y="434.8493" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2877" fill="var(--text-muted)">Fetch Part 0 from all map executors</text>
  <rect x="152.8433" y="452.3836" width="210.1596" height="61.3699" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6301" />
  <text x="257.9231" y="478.685" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5343" fill="var(--text)">Exec 0 Part 0</text>
  <rect x="420.3191" y="452.3836" width="210.1596" height="61.3699" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6301" />
  <text x="525.3989" y="478.685" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5343" fill="var(--text)">Exec 1 Part 0</text>
  <rect x="687.795" y="452.3836" width="210.1596" height="61.3699" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6301" />
  <text x="792.8748" y="478.685" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5343" fill="var(--text)">Exec 2 Part 0</text>
  <line x1="257.9231" y1="513.7535" x2="525.3989" y2="561.0959" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <line x1="525.3989" y1="513.7535" x2="525.3989" y2="561.0959" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <line x1="792.8748" y1="513.7535" x2="525.3989" y2="561.0959" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <rect x="382.1083" y="569.8631" width="286.5812" height="52.6027" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="525.3989" y="604.9315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2877" fill="var(--text)">Merge + Sort</text>
</svg>
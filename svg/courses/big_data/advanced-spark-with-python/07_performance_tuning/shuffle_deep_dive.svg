<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="255.882352941176" rx="6.061449560078" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="69.000010205881" font-family="Arial, sans-serif" font-size="20.147854241063" font-weight="bold" fill="var(--text)">Executor</text>
  <rect x="82.8571" y="82.647109852933" width="235.7143" height="59.705933382345" rx="6.061449560078" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6301"/>
  <text x="200.7143" y="120.176480794116" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.316286232326" fill="var(--text)">Task (process)</text>
  <line x1="318.5714" y1="111.647120058814" x2="404.2856" y2="111.647120058814" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="414.9999" y="82.647109852933" width="428.5714" height="59.705933382345" rx="6.061449560078" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6301"/>
  <text x="629.2857" y="108.235294117647" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.316286232326" fill="var(--text)">Sort by partition key</text>
  <text x="629.2857" y="130.411856558809" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.316286232326" fill="var(--text-muted)">+ spill to disk</text>
  <line x1="511.4285" y1="142.352941176471" x2="254.2856" y2="193.529411764706" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="629.2857" y1="142.352941176471" x2="629.2857" y2="193.529411764706" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="747.1428" y1="142.352941176471" x2="1004.2857" y2="193.529411764706" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="125.7142" y="202.058874558816" width="257.1429" height="59.705933382345" rx="6.061449560078" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2856" y="239.588245499998" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.316286232326" fill="var(--text)">Part 0 file</text>
  <rect x="500.7143" y="202.058874558816" width="257.1429" height="59.705933382345" rx="6.061449560078" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.2857" y="239.588245499998" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.316286232326" fill="var(--text)">Part 1 file</text>
  <rect x="875.7143" y="202.058874558816" width="257.1429" height="59.705933382345" rx="6.061449560078" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1004.2857" y="239.588245499998" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.316286232326" fill="var(--text)">Part 2 file</text>
  <text x="639.9999" y="338.52946279411" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.811091282696" font-weight="bold" fill="var(--ok-accent)">Reader Side (Reduce stage)</text>
  <rect x="40" y="355.588286323521" width="1200" height="264.411713676478" rx="6.061449560078" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="386.294107441178" font-family="Arial, sans-serif" font-size="20.147854241063" font-weight="bold" fill="var(--text)">Executor (for Partition 0)</text>
  <text x="639.9999" y="420.411754500002" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.147854241063" fill="var(--text-muted)">Fetch Part 0 from all map executors</text>
  <rect x="147.1428" y="437.470680088221" width="235.7143" height="59.705933382345" rx="6.061449560078" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6301"/>
  <text x="264.9999" y="463.058864352935" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.316286232326" fill="var(--text)">Exec 0 Part 0</text>
  <rect x="447.1427" y="437.470680088221" width="235.7143" height="59.705933382345" rx="6.061449560078" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6301"/>
  <text x="564.9999" y="463.058864352935" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.316286232326" fill="var(--text)">Exec 1 Part 0</text>
  <rect x="747.1428" y="437.470680088221" width="235.7143" height="59.705933382345" rx="6.061449560078" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6301"/>
  <text x="865" y="463.058864352935" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.316286232326" fill="var(--text)">Exec 2 Part 0</text>
  <line x1="264.9999" y1="497.176511411758" x2="564.9999" y2="543.235345147051" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="564.9999" y1="497.176511411758" x2="564.9999" y2="543.235345147051" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="865" y1="497.176511411758" x2="564.9999" y2="543.235345147051" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="404.2856" y="551.764807941161" width="321.4285" height="51.176470588235" rx="6.061449560078" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="564.9999" y="585.882352941176" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.147854241063" fill="var(--text)">Merge + Sort</text>
</svg>

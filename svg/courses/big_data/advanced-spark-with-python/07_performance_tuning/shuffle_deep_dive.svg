<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-sh" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.5697" font-weight="bold" fill="var(--primary-accent)">Writer Side (Map stage)</text>
  <rect x="40" y="51.7002" width="1200" height="250.7205" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="80.1152" font-family="Arial, sans-serif" font-size="19.9436" font-weight="bold" fill="var(--text)">Executor</text>
  <rect x="82.8571" y="93.487" width="235.7143" height="58.5015" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6301" />
  <text x="200.7143" y="130.2593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1306" fill="var(--text)">Task (process)</text>
  <line x1="318.5714" y1="121.902" x2="404.2856" y2="121.902" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <rect x="414.9999" y="93.487" width="428.5714" height="58.5015" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2.6301" />
  <text x="629.2857" y="118.559" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1306" fill="var(--text)">Sort by partition key</text>
  <text x="629.2857" y="140.2882" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1306" fill="var(--text-muted)">+ spill to disk</text>
  <line x1="511.4285" y1="151.9884" x2="254.2856" y2="202.1325" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <line x1="629.2857" y1="151.9884" x2="629.2857" y2="202.1325" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <line x1="747.1428" y1="151.9884" x2="1004.2857" y2="202.1325" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <rect x="125.7142" y="210.4899" width="257.1429" height="58.5015" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="254.2856" y="247.2622" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1306" fill="var(--text)">Part 0 file</text>
  <rect x="500.7143" y="210.4899" width="257.1429" height="58.5015" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.2857" y="247.2622" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1306" fill="var(--text)">Part 1 file</text>
  <rect x="875.7143" y="210.4899" width="257.1429" height="58.5015" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1004.2857" y="247.2622" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1306" fill="var(--text)">Part 2 file</text>
  <text x="639.9999" y="344.2075" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.5697" font-weight="bold" fill="var(--ok-accent)">Reader Side (Reduce stage)</text>
  <rect x="40" y="360.9222" width="1200" height="259.0778" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.8571" y="391.0086" font-family="Arial, sans-serif" font-size="19.9436" font-weight="bold" fill="var(--text)">Executor (for Partition 0)</text>
  <text x="639.9999" y="424.438" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9436" fill="var(--text-muted)">Fetch Part 0 from all map executors</text>
  <rect x="147.1428" y="441.1528" width="235.7143" height="58.5015" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6301" />
  <text x="264.9999" y="466.2248" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1306" fill="var(--text)">Exec 0 Part 0</text>
  <rect x="447.1427" y="441.1528" width="235.7143" height="58.5015" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6301" />
  <text x="564.9999" y="466.2248" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1306" fill="var(--text)">Exec 1 Part 0</text>
  <rect x="747.1428" y="441.1528" width="235.7143" height="58.5015" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2.6301" />
  <text x="865" y="466.2248" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1306" fill="var(--text)">Exec 2 Part 0</text>
  <line x1="264.9999" y1="499.6542" x2="564.9999" y2="544.7839" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <line x1="564.9999" y1="499.6542" x2="564.9999" y2="544.7839" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <line x1="865" y1="499.6542" x2="564.9999" y2="544.7839" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-sh)" />
  <rect x="404.2856" y="553.1413" width="321.4285" height="50.1441" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="564.9999" y="586.5706" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9436" fill="var(--text)">Merge + Sort</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="Arial, sans-serif">
  <text x="270" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Data Skew Solution: Salting (for Joins)</text>
  <!-- Main box -->
  <rect x="20" y="40" width="500" height="360" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <!-- Original key -->
  <rect x="40" y="60" width="460" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="60" y="82" font-size="13" font-weight="bold" fill="#333">Original key: "hot_user_123"</text>
  <text x="60" y="102" font-size="12" fill="#dc3545">Records: 10,000,000</text>
  <!-- Arrow -->
  <text x="270" y="135" text-anchor="middle" font-size="20" fill="#28a745">▼ salt_factor = 10</text>
  <!-- Salted keys -->
  <rect x="40" y="150" width="460" height="200" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="60" y="175" font-size="13" font-weight="bold" fill="#333">Salted Keys:</text>
  <text x="60" y="198" font-size="12" fill="#555">"hot_user_123_0" → 1,000,000 records</text>
  <text x="60" y="218" font-size="12" fill="#555">"hot_user_123_1" → 1,000,000 records</text>
  <text x="60" y="238" font-size="12" fill="#555">"hot_user_123_2" → 1,000,000 records</text>
  <text x="60" y="258" font-size="12" fill="#555">...</text>
  <text x="60" y="278" font-size="12" fill="#555">"hot_user_123_9" → 1,000,000 records</text>
  <text x="60" y="302" font-size="11" fill="#28a745">Each partition now handles 1/10 of the data</text>
  <!-- Note -->
  <rect x="40" y="360" width="460" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="270" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#856404">Note: Small table must be exploded with all salt values (0-9) to match</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="96.666704545454" rx="6.668313367116" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173913043478" y="78.666704545455" font-size="23.672623591817" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Original key: "hot_user_123"</text>
  <text x="92.173913043478" y="113.818181818182" font-size="21.851618349814" fill="var(--danger-accent)" font-family="Arial, sans-serif">Records: 10,000,000</text>
  <text x="640" y="171.818181818182" text-anchor="middle" font-size="36.419326870172" fill="var(--ok-accent)" font-family="Arial, sans-serif">▼ salt_factor = 10</text>
  <rect x="40" y="198.181818181818" width="1200" height="351.515113636364" rx="6.668313367116" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173913043478" y="242.12125" font-size="23.672623591817" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Salted Keys:</text>
  <text x="92.173913043478" y="282.545454545454" font-size="21.851618349814" fill="var(--text-muted)" font-family="Arial, sans-serif">"hot_user_123_0" → 1,000,000 records</text>
  <text x="92.173913043478" y="317.697045454546" font-size="21.851618349814" fill="var(--text-muted)" font-family="Arial, sans-serif">"hot_user_123_1" → 1,000,000 records</text>
  <text x="92.173913043478" y="352.848522727273" font-size="21.851618349814" fill="var(--text-muted)" font-family="Arial, sans-serif">"hot_user_123_2" → 1,000,000 records</text>
  <text x="92.173913043478" y="388" font-size="21.851618349814" fill="var(--text-muted)" font-family="Arial, sans-serif">...</text>
  <text x="92.173913043478" y="423.151590909092" font-size="21.851618349814" fill="var(--text-muted)" font-family="Arial, sans-serif">"hot_user_123_9" → 1,000,000 records</text>
  <text x="92.173913043478" y="465.333409090909" font-size="20.030613107811" fill="var(--ok-accent)" font-family="Arial, sans-serif">Each partition now handles 1/10 of the data</text>
  <rect x="40" y="567.272727272728" width="1200" height="52.727272727272" rx="6.668313367116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="602.424318181819" text-anchor="middle" font-size="20.030613107811" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Note: Small table must be exploded with all salt values (0-9) to match</text>
</svg>

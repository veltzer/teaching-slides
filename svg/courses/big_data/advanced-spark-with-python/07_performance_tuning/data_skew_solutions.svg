<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="42.8571" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">Data Skew Solution: Salting (for Joins)</text>
  <rect x="47.4074" y="68.5714" width="1185.1852" height="617.1429" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4286" />
  <rect x="94.8148" y="102.8571" width="1090.3704" height="94.2857" rx="8.5714" fill="#f8d7da" stroke="#dc3545" stroke-width="2.5714" />
  <text x="142.2222" y="140.5714" font-size="22.2857" font-weight="bold" fill="#333">Original key: "hot_user_123"</text>
  <text x="142.2222" y="174.8571" font-size="20.5714" fill="#dc3545">Records: 10,000,000</text>
  <text x="640" y="231.4286" text-anchor="middle" font-size="34.2857" fill="#28a745">▼ salt_factor = 10</text>
  <rect x="94.8148" y="257.1429" width="1090.3704" height="342.8571" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="2.5714" />
  <text x="142.2222" y="300" font-size="22.2857" font-weight="bold" fill="#333">Salted Keys:</text>
  <text x="142.2222" y="339.4286" font-size="20.5714" fill="#555">"hot_user_123_0" → 1,000,000 records</text>
  <text x="142.2222" y="373.7143" font-size="20.5714" fill="#555">"hot_user_123_1" → 1,000,000 records</text>
  <text x="142.2222" y="408" font-size="20.5714" fill="#555">"hot_user_123_2" → 1,000,000 records</text>
  <text x="142.2222" y="442.2857" font-size="20.5714" fill="#555">...</text>
  <text x="142.2222" y="476.5714" font-size="20.5714" fill="#555">"hot_user_123_9" → 1,000,000 records</text>
  <text x="142.2222" y="517.7143" font-size="18.8571" fill="#28a745">Each partition now handles 1/10 of the data</text>
  <rect x="94.8148" y="617.1429" width="1090.3704" height="51.4286" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="2.5714" />
  <text x="640" y="651.4286" text-anchor="middle" font-size="18.8571" font-weight="bold" fill="#856404">Note: Small table must be exploded with all salt values (0-9) to match</text>
</svg>
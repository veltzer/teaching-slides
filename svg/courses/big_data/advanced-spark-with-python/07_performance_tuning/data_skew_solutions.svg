<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="597.3333" y="40" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">Data Skew Solution: Salting (for Joins)</ns0:text>
  <ns0:rect x="44.2469" y="64" width="1106.1728" height="576" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <ns0:rect x="88.4938" y="96" width="1017.679" height="88" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="2.4" />
  <ns0:text x="132.7407" y="131.2" font-size="20.8" font-weight="bold" fill="#333">Original key: "hot_user_123"</ns0:text>
  <ns0:text x="132.7407" y="163.2" font-size="19.2" fill="#dc3545">Records: 10,000,000</ns0:text>
  <ns0:text x="597.3333" y="216" text-anchor="middle" font-size="32" fill="#28a745">▼ salt_factor = 10</ns0:text>
  <ns0:rect x="88.4938" y="240" width="1017.679" height="320" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2.4" />
  <ns0:text x="132.7407" y="280" font-size="20.8" font-weight="bold" fill="#333">Salted Keys:</ns0:text>
  <ns0:text x="132.7407" y="316.8" font-size="19.2" fill="#555">"hot_user_123_0" → 1,000,000 records</ns0:text>
  <ns0:text x="132.7407" y="348.8" font-size="19.2" fill="#555">"hot_user_123_1" → 1,000,000 records</ns0:text>
  <ns0:text x="132.7407" y="380.8" font-size="19.2" fill="#555">"hot_user_123_2" → 1,000,000 records</ns0:text>
  <ns0:text x="132.7407" y="412.8" font-size="19.2" fill="#555">...</ns0:text>
  <ns0:text x="132.7407" y="444.8" font-size="19.2" fill="#555">"hot_user_123_9" → 1,000,000 records</ns0:text>
  <ns0:text x="132.7407" y="483.2" font-size="17.6" fill="#28a745">Each partition now handles 1/10 of the data</ns0:text>
  <ns0:rect x="88.4938" y="576" width="1017.679" height="48" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <ns0:text x="597.3333" y="608" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#bf360c">Note: Small table must be exploded with all salt values (0-9) to match</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" rx="6.123724356958" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="88" y="72.2221875" width="1104" height="88.611145833333" rx="6.123724356958" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="107.666666666667" font-size="21.739323529273" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Original key: "hot_user_123"</text>
  <text x="136" y="139.888854166667" font-size="20.067036469461" fill="var(--danger-accent)" font-family="Arial, sans-serif">Records: 10,000,000</text>
  <text x="640" y="193.055520833333" text-anchor="middle" font-size="33.445026761744" fill="var(--ok-accent)" font-family="Arial, sans-serif">▼ salt_factor = 10</text>
  <rect x="88" y="217.2221875" width="1104" height="322.2221875" rx="6.123724356958" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136" y="257.5" font-size="21.739323529273" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Salted Keys:</text>
  <text x="136" y="294.555520833333" font-size="20.067036469461" fill="var(--text-muted)" font-family="Arial, sans-serif">"hot_user_123_0" → 1,000,000 records</text>
  <text x="136" y="326.7778125" font-size="20.067036469461" fill="var(--text-muted)" font-family="Arial, sans-serif">"hot_user_123_1" → 1,000,000 records</text>
  <text x="136" y="359" font-size="20.067036469461" fill="var(--text-muted)" font-family="Arial, sans-serif">"hot_user_123_2" → 1,000,000 records</text>
  <text x="136" y="391.2221875" font-size="20.067036469461" fill="var(--text-muted)" font-family="Arial, sans-serif">...</text>
  <text x="136" y="423.444479166667" font-size="20.067036469461" fill="var(--text-muted)" font-family="Arial, sans-serif">"hot_user_123_9" → 1,000,000 records</text>
  <text x="136" y="462.111145833333" font-size="18.394749409648" fill="var(--ok-accent)" font-family="Arial, sans-serif">Each partition now handles 1/10 of the data</text>
  <rect x="88" y="555.555520833333" width="1104" height="48.333333333333" rx="6.123724356958" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="587.7778125" text-anchor="middle" font-size="18.394749409648" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Note: Small table must be exploded with all salt values (0-9) to match</text>
</svg>

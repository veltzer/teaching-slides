<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="623.4399" y="52.6027" text-anchor="middle" font-family="Arial" font-size="28.0548" font-weight="bold" fill="var(--primary-accent)">Model Evaluation Metrics</text>
  <rect x="46.758" y="263.0137" width="202.618" height="105.2055" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="148.067" y="310.3562" text-anchor="middle" font-family="Arial" font-size="20.2618" font-weight="bold" fill="var(--primary-accent)">Predictions</text>
  <text x="148.067" y="341.9178" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">DataFrame</text>
  <rect x="342.8919" y="96.4384" width="264.9619" height="157.8082" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="475.3729" y="136.7671" text-anchor="middle" font-family="Arial" font-size="20.2618" font-weight="bold" fill="var(--ok-accent)">Binary Classification</text>
  <text x="475.3729" y="171.8356" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">AUC-ROC</text>
  <text x="475.3729" y="199.8904" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">AUC-PR</text>
  <text x="475.3729" y="227.9452" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">Precision / Recall</text>
  <rect x="342.8919" y="289.3151" width="264.9619" height="157.8082" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="475.3729" y="329.6438" text-anchor="middle" font-family="Arial" font-size="20.2618" font-weight="bold" fill="var(--warn-accent)">Multiclass</text>
  <text x="475.3729" y="364.7123" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">Accuracy</text>
  <text x="475.3729" y="392.7671" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">F1 Score</text>
  <text x="475.3729" y="420.8219" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">Weighted Precision</text>
  <rect x="342.8919" y="482.1918" width="264.9619" height="157.8082" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="475.3729" y="522.5205" text-anchor="middle" font-family="Arial" font-size="20.2618" font-weight="bold" fill="var(--info-accent)">Regression</text>
  <text x="475.3729" y="557.589" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">RMSE</text>
  <text x="475.3729" y="585.6438" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">MAE</text>
  <text x="475.3729" y="613.6986" text-anchor="middle" font-family="Arial" font-size="17.1446" fill="var(--text-muted)">R-squared</text>
  <line x1="249.376" y1="289.3151" x2="339.7747" y2="192.8767" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="249.376" y1="315.6164" x2="339.7747" y2="368.2192" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="249.376" y1="341.9178" x2="339.7747" y2="543.5616" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="701.3699" y="271.7808" width="233.79" height="105.2055" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="818.2648" y="319.1233" text-anchor="middle" font-family="Arial" font-size="20.2618" font-weight="bold" fill="var(--ok-accent)">Evaluator</text>
  <text x="818.2648" y="350.6849" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">Select best model</text>
  <rect x="1013.0898" y="271.7808" width="202.618" height="105.2055" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1114.3988" y="319.1233" text-anchor="middle" font-family="Arial" font-size="20.2618" font-weight="bold" fill="var(--danger-accent)">Best Model</text>
  <text x="1114.3988" y="350.6849" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">Highest metric</text>
  <line x1="607.8539" y1="175.3425" x2="698.2527" y2="298.0822" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="607.8539" y1="368.2192" x2="698.2527" y2="333.1507" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="607.8539" y1="561.0959" x2="698.2527" y2="350.6849" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="935.1598" y1="324.3836" x2="1009.9726" y2="324.3836" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
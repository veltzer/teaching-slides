<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="632" y="40" text-anchor="middle" font-size="28.2454" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Model Evaluation Metrics</text>
  <rect x="40" y="247.7612" width="208" height="103.8806" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144" y="294.5075" text-anchor="middle" font-size="20.3995" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Predictions</text>
  <text x="144" y="325.6717" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">DataFrame</text>
  <rect x="343.9999" y="83.2837" width="271.9999" height="155.8209" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="123.1045" text-anchor="middle" font-size="20.3995" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Binary Classification</text>
  <text x="480" y="157.7314" text-anchor="middle" font-size="17.2611" fill="var(--text-muted)" font-family="Arial, sans-serif">AUC-ROC</text>
  <text x="480" y="185.4329" text-anchor="middle" font-size="17.2611" fill="var(--text-muted)" font-family="Arial, sans-serif">AUC-PR</text>
  <text x="480" y="213.1344" text-anchor="middle" font-size="17.2611" fill="var(--text-muted)" font-family="Arial, sans-serif">Precision / Recall</text>
  <rect x="343.9999" y="273.7314" width="271.9999" height="155.8209" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="313.5522" text-anchor="middle" font-size="20.3995" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Multiclass</text>
  <text x="480" y="348.1791" text-anchor="middle" font-size="17.2611" fill="var(--text-muted)" font-family="Arial, sans-serif">Accuracy</text>
  <text x="480" y="375.8806" text-anchor="middle" font-size="17.2611" fill="var(--text-muted)" font-family="Arial, sans-serif">F1 Score</text>
  <text x="480" y="403.5821" text-anchor="middle" font-size="17.2611" fill="var(--text-muted)" font-family="Arial, sans-serif">Weighted Precision</text>
  <rect x="343.9999" y="464.1791" width="271.9999" height="155.8209" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="504" text-anchor="middle" font-size="20.3995" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Regression</text>
  <text x="480" y="538.6268" text-anchor="middle" font-size="17.2611" fill="var(--text-muted)" font-family="Arial, sans-serif">RMSE</text>
  <text x="480" y="566.3283" text-anchor="middle" font-size="17.2611" fill="var(--text-muted)" font-family="Arial, sans-serif">MAE</text>
  <text x="480" y="594.0298" text-anchor="middle" font-size="17.2611" fill="var(--text-muted)" font-family="Arial, sans-serif">R-squared</text>
  <line x1="248" y1="273.7314" x2="340.7999" y2="178.5075" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="248" y1="299.7015" x2="340.7999" y2="351.6418" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="248" y1="325.6717" x2="340.7999" y2="524.7761" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="712" y="256.4179" width="240" height="103.8806" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.9999" y="303.1642" text-anchor="middle" font-size="20.3995" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Evaluator</text>
  <text x="831.9999" y="334.3283" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">Select best model</text>
  <rect x="1032" y="256.4179" width="208" height="103.8806" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136" y="303.1642" text-anchor="middle" font-size="20.3995" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Best Model</text>
  <text x="1136" y="334.3283" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">Highest metric</text>
  <line x1="616" y1="161.1941" x2="708.8" y2="282.3881" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616" y1="351.6418" x2="708.8" y2="317.015" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616" y1="542.0896" x2="708.8" y2="334.3283" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="952" y1="308.3583" x2="1028.8" y2="308.3583" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

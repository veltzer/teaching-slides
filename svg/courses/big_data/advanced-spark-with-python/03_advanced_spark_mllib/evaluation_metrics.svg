<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632" y="40" text-anchor="middle" font-family="Arial" font-size="28.2454" font-weight="bold" fill="var(--primary-accent)">Model Evaluation Metrics</text>
  <rect x="40" y="247.7612" width="208" height="103.8806" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144" y="294.5075" text-anchor="middle" font-family="Arial" font-size="20.3995" font-weight="bold" fill="var(--primary-accent)">Predictions</text>
  <text x="144" y="325.6717" text-anchor="middle" font-family="Arial" font-size="15.6919" fill="var(--text-muted)">DataFrame</text>
  <rect x="343.9999" y="83.2837" width="271.9999" height="155.8209" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="123.1045" text-anchor="middle" font-family="Arial" font-size="20.3995" font-weight="bold" fill="var(--ok-accent)">Binary Classification</text>
  <text x="480" y="157.7314" text-anchor="middle" font-family="Arial" font-size="17.2611" fill="var(--text-muted)">AUC-ROC</text>
  <text x="480" y="185.4329" text-anchor="middle" font-family="Arial" font-size="17.2611" fill="var(--text-muted)">AUC-PR</text>
  <text x="480" y="213.1344" text-anchor="middle" font-family="Arial" font-size="17.2611" fill="var(--text-muted)">Precision / Recall</text>
  <rect x="343.9999" y="273.7314" width="271.9999" height="155.8209" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="313.5522" text-anchor="middle" font-family="Arial" font-size="20.3995" font-weight="bold" fill="var(--warn-accent)">Multiclass</text>
  <text x="480" y="348.1791" text-anchor="middle" font-family="Arial" font-size="17.2611" fill="var(--text-muted)">Accuracy</text>
  <text x="480" y="375.8806" text-anchor="middle" font-family="Arial" font-size="17.2611" fill="var(--text-muted)">F1 Score</text>
  <text x="480" y="403.5821" text-anchor="middle" font-family="Arial" font-size="17.2611" fill="var(--text-muted)">Weighted Precision</text>
  <rect x="343.9999" y="464.1791" width="271.9999" height="155.8209" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="504" text-anchor="middle" font-family="Arial" font-size="20.3995" font-weight="bold" fill="var(--info-accent)">Regression</text>
  <text x="480" y="538.6268" text-anchor="middle" font-family="Arial" font-size="17.2611" fill="var(--text-muted)">RMSE</text>
  <text x="480" y="566.3283" text-anchor="middle" font-family="Arial" font-size="17.2611" fill="var(--text-muted)">MAE</text>
  <text x="480" y="594.0298" text-anchor="middle" font-family="Arial" font-size="17.2611" fill="var(--text-muted)">R-squared</text>
  <line x1="248" y1="273.7314" x2="340.7999" y2="178.5075" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="248" y1="299.7015" x2="340.7999" y2="351.6418" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="248" y1="325.6717" x2="340.7999" y2="524.7761" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="712" y="256.4179" width="240" height="103.8806" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.9999" y="303.1642" text-anchor="middle" font-family="Arial" font-size="20.3995" font-weight="bold" fill="var(--ok-accent)">Evaluator</text>
  <text x="831.9999" y="334.3283" text-anchor="middle" font-family="Arial" font-size="15.6919" fill="var(--text-muted)">Select best model</text>
  <rect x="1032" y="256.4179" width="208" height="103.8806" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136" y="303.1642" text-anchor="middle" font-family="Arial" font-size="20.3995" font-weight="bold" fill="var(--danger-accent)">Best Model</text>
  <text x="1136" y="334.3283" text-anchor="middle" font-family="Arial" font-size="15.6919" fill="var(--text-muted)">Highest metric</text>
  <line x1="616" y1="161.1941" x2="708.8" y2="282.3881" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="616" y1="351.6418" x2="708.8" y2="317.015" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="616" y1="542.0896" x2="708.8" y2="334.3283" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="952" y1="308.3583" x2="1028.8" y2="308.3583" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
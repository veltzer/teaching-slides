<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="217.741853563978" width="208" height="112.258092403752" rx="6.237245734541" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="144" y="268.258027565028" text-anchor="middle" font-size="21.206115726961" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Predictions</text>
  <text x="144" y="301.935476899062" text-anchor="middle" font-size="16.31237272364" fill="var(--text-muted)" font-family="Arial, sans-serif">DataFrame</text>
  <rect x="343.9999" y="40" width="271.9999" height="168.387138605628" rx="6.237245734541" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="83.032164292383" text-anchor="middle" font-size="21.206115726961" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Binary Classification</text>
  <text x="480" y="120.451564448481" text-anchor="middle" font-size="17.943620391413" fill="var(--text-muted)" font-family="Arial, sans-serif">AUC-ROC</text>
  <text x="480" y="150.38706296045" text-anchor="middle" font-size="17.943620391413" fill="var(--text-muted)" font-family="Arial, sans-serif">AUC-PR</text>
  <text x="480" y="180.32256147242" text-anchor="middle" font-size="17.943620391413" fill="var(--text-muted)" font-family="Arial, sans-serif">Precision / Recall</text>
  <rect x="343.9999" y="245.806430697186" width="271.9999" height="168.387138605628" rx="6.237245734541" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="288.838594989569" text-anchor="middle" font-size="21.206115726961" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Multiclass</text>
  <text x="480" y="326.257995145666" text-anchor="middle" font-size="17.943620391413" fill="var(--text-muted)" font-family="Arial, sans-serif">Accuracy</text>
  <text x="480" y="356.193493657636" text-anchor="middle" font-size="17.943620391413" fill="var(--text-muted)" font-family="Arial, sans-serif">F1 Score</text>
  <text x="480" y="386.128992169606" text-anchor="middle" font-size="17.943620391413" fill="var(--text-muted)" font-family="Arial, sans-serif">Weighted Precision</text>
  <rect x="343.9999" y="451.612861394372" width="271.9999" height="168.387138605628" rx="6.237245734541" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="494.645133751295" text-anchor="middle" font-size="21.206115726961" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Regression</text>
  <text x="480" y="532.064425842852" text-anchor="middle" font-size="17.943620391413" fill="var(--text-muted)" font-family="Arial, sans-serif">RMSE</text>
  <text x="480" y="561.999924354822" text-anchor="middle" font-size="17.943620391413" fill="var(--text-muted)" font-family="Arial, sans-serif">MAE</text>
  <text x="480" y="591.935422866792" text-anchor="middle" font-size="17.943620391413" fill="var(--text-muted)" font-family="Arial, sans-serif">R-squared</text>
  <line x1="248" y1="245.806430697186" x2="340.7999" y2="142.903161316323" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="248" y1="273.870899765854" x2="340.7999" y2="329.99994596773" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="248" y1="301.935476899062" x2="340.7999" y2="517.096730619137" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="712" y="227.096676586867" width="240" height="112.258092403752" rx="6.237245734541" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.9999" y="277.612850587918" text-anchor="middle" font-size="21.206115726961" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Evaluator</text>
  <text x="831.9999" y="311.290191857411" text-anchor="middle" font-size="16.31237272364" fill="var(--text-muted)" font-family="Arial, sans-serif">Select best model</text>
  <rect x="1032" y="227.096676586867" width="208" height="112.258092403752" rx="6.237245734541" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136" y="277.612850587918" text-anchor="middle" font-size="21.206115726961" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Best Model</text>
  <text x="1136" y="311.290191857411" text-anchor="middle" font-size="16.31237272364" fill="var(--text-muted)" font-family="Arial, sans-serif">Highest metric</text>
  <line x1="616" y1="124.193515270544" x2="708.8" y2="255.161253720075" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616" y1="329.99994596773" x2="708.8" y2="292.580653876173" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616" y1="535.806484729456" x2="708.8" y2="311.290191857411" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="952" y1="283.225830853283" x2="1028.8" y2="283.225830853283" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

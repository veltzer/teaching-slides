<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-ml" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 6.4,0" fill="#333" />
    </marker>
  </defs>
  <rect x="40" y="40" width="328.2051" height="60.6977" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="66.9767" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" font-weight="bold" fill="var(--text)">Raw Data</text>
  <text x="204.1026" y="87.2093" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4745" fill="var(--text-muted)">(CSV/Parquet)</text>
  <line x1="204.1026" y1="100.6977" x2="204.1026" y2="120.9302" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="40" y="127.6744" width="328.2051" height="47.2093" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="157.3488" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">Imputer</text>
  <line x1="368.2051" y1="150.6046" x2="470.7693" y2="150.6046" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="481.0256" y="130.3721" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="860.5129" y="157.3488" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">Fill nulls with median</text>
  <line x1="204.1026" y1="174.8837" x2="204.1026" y2="195.1162" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="40" y="201.8604" width="328.2051" height="47.2093" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="231.5349" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">StringIndexer</text>
  <line x1="368.2051" y1="224.7907" x2="470.7693" y2="224.7907" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="481.0256" y="204.5582" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="860.5129" y="231.5349" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">"Gold" -&gt; 0, "Silver" -&gt; 1</text>
  <line x1="204.1026" y1="249.0698" x2="204.1026" y2="269.3023" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="40" y="276.0465" width="328.2051" height="47.2093" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="305.7209" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">OneHotEncoder</text>
  <line x1="368.2051" y1="298.9767" x2="470.7693" y2="298.9767" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="481.0256" y="278.7442" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="860.5129" y="305.7209" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">0 -&gt; [1,0,0], 1 -&gt; [0,1,0]</text>
  <line x1="204.1026" y1="323.2558" x2="204.1026" y2="343.4883" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="40" y="350.2325" width="328.2051" height="47.2093" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="379.907" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">VectorAssembler</text>
  <line x1="368.2051" y1="373.1628" x2="470.7693" y2="373.1628" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="481.0256" y="352.9302" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="860.5129" y="379.907" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">Combine all into [0.5, 1.2, 3.4, 1, 0, 0]</text>
  <line x1="204.1026" y1="397.4419" x2="204.1026" y2="417.6744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="40" y="424.4186" width="328.2051" height="47.2093" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="454.093" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">StandardScaler</text>
  <line x1="368.2051" y1="447.3488" x2="470.7693" y2="447.3488" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="481.0256" y="427.1163" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="860.5129" y="454.093" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">Normalize: mean=0, std=1</text>
  <line x1="204.1026" y1="471.6279" x2="204.1026" y2="491.8604" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="40" y="498.6046" width="328.2051" height="47.2093" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="528.279" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">Classifier</text>
  <line x1="368.2051" y1="521.5349" x2="470.7693" y2="521.5349" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="481.0256" y="501.3023" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="860.5129" y="528.279" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">RandomForest / GBT / LR</text>
  <line x1="204.1026" y1="545.8139" x2="204.1026" y2="566.0465" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="40" y="572.7907" width="328.2051" height="47.2093" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="602.4651" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" font-weight="bold" fill="var(--text)">Predictions</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-ml" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,13.8462 6.4,0" fill="#333" />
    </marker>
  </defs>
  <rect x="109.7143" y="6.9231" width="292.5714" height="62.3077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="256" y="34.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6154" font-weight="bold" fill="var(--text)">Raw Data</text>
  <text x="256" y="55.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8462" fill="var(--text-muted)">(CSV/Parquet)</text>
  <line x1="256" y1="69.2308" x2="256" y2="90" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="109.7143" y="96.9231" width="292.5714" height="48.4615" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="256" y="127.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6154" fill="var(--text)">Imputer</text>
  <line x1="402.2857" y1="120.4615" x2="493.7143" y2="120.4615" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="502.8571" y="99.6923" width="676.5714" height="41.5385" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="841.1429" y="127.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2308" fill="var(--text-muted)">Fill nulls with median</text>
  <line x1="256" y1="145.3846" x2="256" y2="166.1538" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="109.7143" y="173.0769" width="292.5714" height="48.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="256" y="203.5385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6154" fill="var(--text)">StringIndexer</text>
  <line x1="402.2857" y1="196.6154" x2="493.7143" y2="196.6154" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="502.8571" y="175.8462" width="676.5714" height="41.5385" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="841.1429" y="203.5385" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2308" fill="var(--text-muted)">"Gold" -&gt; 0, "Silver" -&gt; 1</text>
  <line x1="256" y1="221.5385" x2="256" y2="242.3077" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="109.7143" y="249.2308" width="292.5714" height="48.4615" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="256" y="279.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6154" fill="var(--text)">OneHotEncoder</text>
  <line x1="402.2857" y1="272.7692" x2="493.7143" y2="272.7692" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="502.8571" y="252" width="676.5714" height="41.5385" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="841.1429" y="279.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2308" fill="var(--text-muted)">0 -&gt; [1,0,0], 1 -&gt; [0,1,0]</text>
  <line x1="256" y1="297.6923" x2="256" y2="318.4615" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="109.7143" y="325.3846" width="292.5714" height="48.4615" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="256" y="355.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6154" fill="var(--text)">VectorAssembler</text>
  <line x1="402.2857" y1="348.9231" x2="493.7143" y2="348.9231" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="502.8571" y="328.1538" width="676.5714" height="41.5385" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="841.1429" y="355.8462" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2308" fill="var(--text-muted)">Combine all into [0.5, 1.2, 3.4, 1, 0, 0]</text>
  <line x1="256" y1="373.8462" x2="256" y2="394.6154" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="109.7143" y="401.5385" width="292.5714" height="48.4615" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="256" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6154" fill="var(--text)">StandardScaler</text>
  <line x1="402.2857" y1="425.0769" x2="493.7143" y2="425.0769" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="502.8571" y="404.3077" width="676.5714" height="41.5385" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="841.1429" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2308" fill="var(--text-muted)">Normalize: mean=0, std=1</text>
  <line x1="256" y1="450" x2="256" y2="470.7692" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="109.7143" y="477.6923" width="292.5714" height="48.4615" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="256" y="508.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6154" fill="var(--text)">Classifier</text>
  <line x1="402.2857" y1="501.2308" x2="493.7143" y2="501.2308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="502.8571" y="480.4615" width="676.5714" height="41.5385" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="841.1429" y="508.1538" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.2308" fill="var(--text-muted)">RandomForest / GBT / LR</text>
  <line x1="256" y1="526.1538" x2="256" y2="546.9231" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ml)" />
  <rect x="109.7143" y="553.8462" width="292.5714" height="48.4615" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="256" y="584.3077" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6154" font-weight="bold" fill="var(--text)">Predictions</text>
</svg>
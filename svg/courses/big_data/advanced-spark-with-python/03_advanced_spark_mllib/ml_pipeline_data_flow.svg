<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="328.2051" height="60.6977" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="66.9767" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" font-weight="bold" fill="var(--text)">Raw Data</text>
  <text x="204.1026" y="87.2093" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4745" fill="var(--text-muted)">(CSV/Parquet)</text>
  <line x1="204.1026" y1="100.6977" x2="204.1026" y2="120.9302" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="127.6744" width="328.2051" height="47.2093" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="157.3488" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">Imputer</text>
  <line x1="368.2051" y1="150.6046" x2="470.7693" y2="150.6046" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="481.0256" y="130.3721" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860.5129" y="157.3488" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">Fill nulls with median</text>
  <line x1="204.1026" y1="174.8837" x2="204.1026" y2="195.1162" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="201.8604" width="328.2051" height="47.2093" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="231.5349" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">StringIndexer</text>
  <line x1="368.2051" y1="224.7907" x2="470.7693" y2="224.7907" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="481.0256" y="204.5582" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860.5129" y="231.5349" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">"Gold" -&gt; 0, "Silver" -&gt; 1</text>
  <line x1="204.1026" y1="249.0698" x2="204.1026" y2="269.3023" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="276.0465" width="328.2051" height="47.2093" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="305.7209" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">OneHotEncoder</text>
  <line x1="368.2051" y1="298.9767" x2="470.7693" y2="298.9767" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="481.0256" y="278.7442" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860.5129" y="305.7209" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">0 -&gt; [1,0,0], 1 -&gt; [0,1,0]</text>
  <line x1="204.1026" y1="323.2558" x2="204.1026" y2="343.4883" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="350.2325" width="328.2051" height="47.2093" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="379.907" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">VectorAssembler</text>
  <line x1="368.2051" y1="373.1628" x2="470.7693" y2="373.1628" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="481.0256" y="352.9302" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860.5129" y="379.907" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">Combine all into [0.5, 1.2, 3.4, 1, 0, 0]</text>
  <line x1="204.1026" y1="397.4419" x2="204.1026" y2="417.6744" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="424.4186" width="328.2051" height="47.2093" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="454.093" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">StandardScaler</text>
  <line x1="368.2051" y1="447.3488" x2="470.7693" y2="447.3488" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="481.0256" y="427.1163" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860.5129" y="454.093" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">Normalize: mean=0, std=1</text>
  <line x1="204.1026" y1="471.6279" x2="204.1026" y2="491.8604" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="498.6046" width="328.2051" height="47.2093" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="528.279" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" fill="var(--text)">Classifier</text>
  <line x1="368.2051" y1="521.5349" x2="470.7693" y2="521.5349" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="481.0256" y="501.3023" width="758.9744" height="40.4652" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="860.5129" y="528.279" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9219" fill="var(--text-muted)">RandomForest / GBT / LR</text>
  <line x1="204.1026" y1="545.8139" x2="204.1026" y2="566.0465" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="572.7907" width="328.2051" height="47.2093" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.1026" y="602.4651" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3693" font-weight="bold" fill="var(--text)">Predictions</text>
</svg>

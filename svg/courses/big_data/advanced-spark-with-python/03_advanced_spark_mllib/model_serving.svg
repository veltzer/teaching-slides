<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="54" text-anchor="middle" font-family="Arial" font-size="28.8" font-weight="bold" fill="var(--primary-accent)">Model Serving Architecture</text>
  <rect x="48" y="288" width="176" height="108" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="333" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="var(--primary-accent)">Client</text>
  <text x="136" y="363.6" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text-muted)">REST / gRPC</text>
  <rect x="288" y="288" width="176" height="108" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="376" y="333" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="var(--warn-accent)">API Gateway</text>
  <text x="376" y="363.6" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text-muted)">Load balancer</text>
  <rect x="544" y="126" width="208" height="99" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="648" y="167.4" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="var(--ok-accent)">Feature Store</text>
  <text x="648" y="201.6" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text-muted)">Real-time features</text>
  <rect x="544" y="279" width="208" height="126" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="648" y="324" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="var(--info-accent)">Model Server</text>
  <text x="648" y="356.4" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text-muted)">Spark / ONNX</text>
  <text x="648" y="385.2" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text-muted)">Inference engine</text>
  <rect x="544" y="459" width="208" height="99" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="648" y="500.4" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="var(--ok-accent)">Model Registry</text>
  <text x="648" y="534.6" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text-muted)">MLflow / versions</text>
  <rect x="848" y="288" width="192" height="108" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="944" y="333" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="var(--warn-accent)">Prediction</text>
  <text x="944" y="363.6" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text-muted)">Score + proba</text>
  <rect x="1072" y="180" width="176" height="99" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1160" y="221.4" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="var(--danger-accent)">Monitoring</text>
  <text x="1160" y="255.6" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text-muted)">Latency / drift</text>
  <rect x="1072" y="405" width="176" height="99" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1160" y="446.4" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="var(--danger-accent)">Logging</text>
  <text x="1160" y="480.6" text-anchor="middle" font-family="Arial" font-size="16" fill="var(--text-muted)">Audit trail</text>
  <line x1="224" y1="342" x2="284.8" y2="342" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="464" y1="342" x2="540.8" y2="342" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="648" y1="225" x2="648" y2="275.4" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="648" y1="459" x2="648" y2="408.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="752" y1="342" x2="844.8" y2="342" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1040" y1="315" x2="1072" y2="252" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1040" y1="369" x2="1072" y2="432" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
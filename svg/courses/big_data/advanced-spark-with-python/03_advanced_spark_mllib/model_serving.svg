<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="632" y="40" text-anchor="middle" font-family="Arial" font-size="30.8952" font-weight="bold" fill="var(--primary-accent)">Model Serving Architecture</text>
  <rect x="40" y="309.2857" width="176" height="124.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="361.0714" text-anchor="middle" font-family="Arial" font-size="20.5968" font-weight="bold" fill="var(--primary-accent)">Client</text>
  <text x="128" y="396.2857" text-anchor="middle" font-family="Arial" font-size="17.164" fill="var(--text-muted)">REST / gRPC</text>
  <rect x="280" y="309.2857" width="176" height="124.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="368" y="361.0714" text-anchor="middle" font-family="Arial" font-size="20.5968" font-weight="bold" fill="var(--warn-accent)">API Gateway</text>
  <text x="368" y="396.2857" text-anchor="middle" font-family="Arial" font-size="17.164" fill="var(--text-muted)">Load balancer</text>
  <rect x="536" y="122.8571" width="208" height="113.9286" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="170.5" text-anchor="middle" font-family="Arial" font-size="20.5968" font-weight="bold" fill="var(--ok-accent)">Feature Store</text>
  <text x="640" y="209.8571" text-anchor="middle" font-family="Arial" font-size="17.164" fill="var(--text-muted)">Real-time features</text>
  <rect x="536" y="298.9286" width="208" height="145" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="350.7143" text-anchor="middle" font-family="Arial" font-size="20.5968" font-weight="bold" fill="var(--info-accent)">Model Server</text>
  <text x="640" y="388" text-anchor="middle" font-family="Arial" font-size="17.164" fill="var(--text-muted)">Spark / ONNX</text>
  <text x="640" y="421.1429" text-anchor="middle" font-family="Arial" font-size="17.164" fill="var(--text-muted)">Inference engine</text>
  <rect x="536" y="506.0714" width="208" height="113.9286" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="553.7143" text-anchor="middle" font-family="Arial" font-size="20.5968" font-weight="bold" fill="var(--ok-accent)">Model Registry</text>
  <text x="640" y="593.0714" text-anchor="middle" font-family="Arial" font-size="17.164" fill="var(--text-muted)">MLflow / versions</text>
  <rect x="840" y="309.2857" width="192" height="124.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="936" y="361.0714" text-anchor="middle" font-family="Arial" font-size="20.5968" font-weight="bold" fill="var(--warn-accent)">Prediction</text>
  <text x="936" y="396.2857" text-anchor="middle" font-family="Arial" font-size="17.164" fill="var(--text-muted)">Score + proba</text>
  <rect x="1064" y="185" width="176" height="113.9286" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1152" y="232.6429" text-anchor="middle" font-family="Arial" font-size="20.5968" font-weight="bold" fill="var(--danger-accent)">Monitoring</text>
  <text x="1152" y="272" text-anchor="middle" font-family="Arial" font-size="17.164" fill="var(--text-muted)">Latency / drift</text>
  <rect x="1064" y="443.9286" width="176" height="113.9286" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1152" y="491.5714" text-anchor="middle" font-family="Arial" font-size="20.5968" font-weight="bold" fill="var(--danger-accent)">Logging</text>
  <text x="1152" y="530.9286" text-anchor="middle" font-family="Arial" font-size="17.164" fill="var(--text-muted)">Audit trail</text>
  <line x1="216" y1="371.4286" x2="276.8" y2="371.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="456" y1="371.4286" x2="532.8" y2="371.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="236.7857" x2="640" y2="294.7857" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="506.0714" x2="640" y2="448.0714" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="744" y1="371.4286" x2="836.8" y2="371.4286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1032" y1="340.3571" x2="1064" y2="267.8571" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1032" y1="402.5" x2="1064" y2="475" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="257.500014583332" width="176" height="144.999970833336" rx="6.480740419066" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="317.916659375001" text-anchor="middle" font-size="22.247085710568" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Client</text>
  <text x="128" y="359.000005833333" text-anchor="middle" font-size="18.53923809214" fill="var(--text-muted)" font-family="Arial, sans-serif">REST / gRPC</text>
  <rect x="280" y="257.500014583332" width="176" height="144.999970833336" rx="6.480740419066" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="368" y="317.916659375001" text-anchor="middle" font-size="22.247085710568" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">API Gateway</text>
  <text x="368" y="359.000005833333" text-anchor="middle" font-size="18.53923809214" fill="var(--text-muted)" font-family="Arial, sans-serif">Load balancer</text>
  <rect x="536" y="40" width="208" height="132.916688541665" rx="6.480740419066" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="95.583378541663" text-anchor="middle" font-size="22.247085710568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Feature Store</text>
  <text x="640" y="141.499991250001" text-anchor="middle" font-size="18.53923809214" fill="var(--text-muted)" font-family="Arial, sans-serif">Real-time features</text>
  <rect x="536" y="245.416732291661" width="208" height="169.166652083335" rx="6.480740419066" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="305.83337708333" text-anchor="middle" font-size="22.247085710568" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Model Server</text>
  <text x="640" y="349.333356666665" text-anchor="middle" font-size="18.53923809214" fill="var(--text-muted)" font-family="Arial, sans-serif">Spark / ONNX</text>
  <text x="640" y="388.000069999994" text-anchor="middle" font-size="18.53923809214" fill="var(--text-muted)" font-family="Arial, sans-serif">Inference engine</text>
  <rect x="536" y="487.083311458335" width="208" height="132.916688541665" rx="6.480740419066" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="542.666689999998" text-anchor="middle" font-size="22.247085710568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Model Registry</text>
  <text x="640" y="588.583302708336" text-anchor="middle" font-size="18.53923809214" fill="var(--text-muted)" font-family="Arial, sans-serif">MLflow / versions</text>
  <rect x="840" y="257.500014583332" width="192" height="144.999970833336" rx="6.480740419066" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="936" y="317.916659375001" text-anchor="middle" font-size="22.247085710568" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Prediction</text>
  <text x="936" y="359.000005833333" text-anchor="middle" font-size="18.53923809214" fill="var(--text-muted)" font-family="Arial, sans-serif">Score + proba</text>
  <rect x="1064" y="112.500043749996" width="176" height="132.916688541665" rx="6.480740419066" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1152" y="168.083422291659" text-anchor="middle" font-size="22.247085710568" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Monitoring</text>
  <text x="1152" y="214.000034999997" text-anchor="middle" font-size="18.53923809214" fill="var(--text-muted)" font-family="Arial, sans-serif">Latency / drift</text>
  <rect x="1064" y="414.583384374996" width="176" height="132.916688541665" rx="6.480740419066" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1152" y="470.166646250002" text-anchor="middle" font-size="22.247085710568" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Logging</text>
  <text x="1152" y="516.083375624996" text-anchor="middle" font-size="18.53923809214" fill="var(--text-muted)" font-family="Arial, sans-serif">Audit trail</text>
  <line x1="216" y1="330.000058333328" x2="276.8" y2="330.000058333328" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="456" y1="330.000058333328" x2="532.8" y2="330.000058333328" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="172.916688541665" x2="640" y2="240.583349374999" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="487.083311458335" x2="640" y2="419.416650625001" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="744" y1="330.000058333328" x2="836.8" y2="330.000058333328" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1032" y1="293.749978125002" x2="1064" y2="209.166652083335" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1032" y1="366.250021874998" x2="1064" y2="450.833347916665" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

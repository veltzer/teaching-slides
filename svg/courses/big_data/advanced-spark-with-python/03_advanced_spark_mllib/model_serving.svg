<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </defs>
  <text x="640" y="54" text-anchor="middle" font-family="Arial" font-size="28.8" font-weight="bold" fill="#1a237e">Model Serving Architecture</text>
  <rect x="48" y="288" width="176" height="108" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="136" y="333" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#1565c0">Client</text>
  <text x="136" y="363.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">REST / gRPC</text>
  <rect x="288" y="288" width="176" height="108" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="376" y="333" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#e65100">API Gateway</text>
  <text x="376" y="363.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Load balancer</text>
  <rect x="544" y="126" width="208" height="99" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="648" y="167.4" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#2e7d32">Feature Store</text>
  <text x="648" y="201.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Real-time features</text>
  <rect x="544" y="279" width="208" height="126" rx="12.8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="3.2" />
  <text x="648" y="324" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#6a1b9a">Model Server</text>
  <text x="648" y="356.4" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Spark / ONNX</text>
  <text x="648" y="385.2" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Inference engine</text>
  <rect x="544" y="459" width="208" height="99" rx="12.8" fill="#e1f5fe" stroke="#2e7d32" stroke-width="3.2" />
  <text x="648" y="500.4" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#2e7d32">Model Registry</text>
  <text x="648" y="534.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">MLflow / versions</text>
  <rect x="848" y="288" width="192" height="108" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="944" y="333" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#e65100">Prediction</text>
  <text x="944" y="363.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Score + proba</text>
  <rect x="1072" y="180" width="176" height="99" rx="12.8" fill="#fce4ec" stroke="#c62828" stroke-width="3.2" />
  <text x="1160" y="221.4" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#c62828">Monitoring</text>
  <text x="1160" y="255.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Latency / drift</text>
  <rect x="1072" y="405" width="176" height="99" rx="12.8" fill="#fce4ec" stroke="#c62828" stroke-width="3.2" />
  <text x="1160" y="446.4" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#c62828">Logging</text>
  <text x="1160" y="480.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Audit trail</text>
  <line x1="224" y1="342" x2="284.8" y2="342" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="464" y1="342" x2="540.8" y2="342" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="648" y1="225" x2="648" y2="275.4" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="648" y1="459" x2="648" y2="408.6" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="752" y1="342" x2="844.8" y2="342" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="1040" y1="315" x2="1072" y2="252" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="1040" y1="369" x2="1072" y2="432" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
</svg>
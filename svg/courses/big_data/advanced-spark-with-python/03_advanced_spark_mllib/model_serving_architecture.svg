<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrow-ms" markerWidth="20.6452" markerHeight="15.75" refX="18.5806" refY="7.875" orient="auto">
      <polygon points="0,22.5 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <rect x="165.1613" y="11.25" width="949.6774" height="157.5" rx="16.5161" fill="#e1f5fe" stroke="#0277bd" stroke-width="4.129" />
  <text x="640" y="56.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.8387" font-weight="bold" fill="#333">Training Pipeline</text>
  <text x="640" y="101.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#555">Raw Data --&gt; Features --&gt; Train --&gt; Evaluate --&gt; Save Model</text>
  <line x1="640" y1="168.75" x2="640" y2="225" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-ms)" />
  <rect x="433.5484" y="236.25" width="412.9032" height="123.75" rx="16.5161" fill="#fff3e0" stroke="#ef6c00" stroke-width="4.129" />
  <text x="640" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.8387" font-weight="bold" fill="#333">MLflow Model Registry</text>
  <text x="640" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7097" fill="#555">(versioned)</text>
  <line x1="495.4839" y1="360" x2="268.3871" y2="438.75" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-ms)" />
  <line x1="640" y1="360" x2="640" y2="438.75" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-ms)" />
  <line x1="784.5161" y1="360" x2="1011.6129" y2="438.75" stroke="#333" stroke-width="4.129" marker-end="url(#arrow-ms)" />
  <rect x="82.5806" y="450" width="371.6129" height="157.5" rx="16.5161" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.129" />
  <text x="268.3871" y="499.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="#333">Batch Scoring</text>
  <text x="268.3871" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">Spark job</text>
  <text x="268.3871" y="573.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">scheduled daily</text>
  <rect x="454.1935" y="450" width="371.6129" height="157.5" rx="16.5161" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4.129" />
  <text x="640" y="499.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="#333">Streaming Scoring</text>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">Structured Streaming</text>
  <text x="640" y="573.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">real-time</text>
  <rect x="825.8065" y="450" width="371.6129" height="157.5" rx="16.5161" fill="#fce4ec" stroke="#c62828" stroke-width="4.129" />
  <text x="1011.6129" y="499.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.7742" font-weight="bold" fill="#333">REST API Serving</text>
  <text x="1011.6129" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">MLflow serve</text>
  <text x="1011.6129" y="573.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6452" fill="#555">or custom</text>
</svg>
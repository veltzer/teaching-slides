<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrow-ms" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 7.2258,0" fill="#333" />
    </marker>
  </defs>
  <rect x="128.8889" y="40" width="1022.2221" height="153.2075" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="83.7736" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.4629" font-weight="bold" fill="var(--text)">Training Pipeline</text>
  <text x="640" y="127.5472" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2378" fill="var(--text-muted)">Raw Data --&gt; Features --&gt; Train --&gt; Evaluate --&gt; Save Model</text>
  <line x1="640" y1="193.2075" x2="640" y2="247.9245" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ms)" />
  <rect x="417.7778" y="258.8679" width="444.4444" height="120.3774" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="309.2075" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.4629" font-weight="bold" fill="var(--text)">MLflow Model Registry</text>
  <text x="640" y="352.9811" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2378" fill="var(--text-muted)">(versioned)</text>
  <line x1="484.4445" y1="379.2453" x2="240" y2="455.8491" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ms)" />
  <line x1="640" y1="379.2453" x2="640" y2="455.8491" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ms)" />
  <line x1="795.5555" y1="379.2453" x2="1040" y2="455.8491" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow-ms)" />
  <rect x="40" y="466.7925" width="400" height="153.2075" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="240" y="514.9434" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3504" font-weight="bold" fill="var(--text)">Batch Scoring</text>
  <text x="240" y="554.3396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">Spark job</text>
  <text x="240" y="587.1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">scheduled daily</text>
  <rect x="440" y="466.7925" width="400" height="153.2075" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="640" y="514.9434" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3504" font-weight="bold" fill="var(--text)">Streaming Scoring</text>
  <text x="640" y="554.3396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">Structured Streaming</text>
  <text x="640" y="587.1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">real-time</text>
  <rect x="840" y="466.7925" width="400" height="153.2075" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1040" y="514.9434" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3504" font-weight="bold" fill="var(--text)">REST API Serving</text>
  <text x="1040" y="554.3396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">MLflow serve</text>
  <text x="1040" y="587.1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">or custom</text>
</svg>
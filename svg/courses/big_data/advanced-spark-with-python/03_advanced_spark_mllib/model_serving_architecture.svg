<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="128.8889" y="40" width="1022.2221" height="153.2075" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.7736" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.4629" font-weight="bold" fill="var(--text)">Training Pipeline</text>
  <text x="640" y="127.5472" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2378" fill="var(--text-muted)">Raw Data --&gt; Features --&gt; Train --&gt; Evaluate --&gt; Save Model</text>
  <line x1="640" y1="193.2075" x2="640" y2="247.9245" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="417.7778" y="258.8679" width="444.4444" height="120.3774" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="309.2075" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.4629" font-weight="bold" fill="var(--text)">MLflow Model Registry</text>
  <text x="640" y="352.9811" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2378" fill="var(--text-muted)">(versioned)</text>
  <line x1="484.4445" y1="379.2453" x2="240" y2="455.8491" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="379.2453" x2="640" y2="455.8491" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="795.5555" y1="379.2453" x2="1040" y2="455.8491" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="466.7925" width="400" height="153.2075" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="514.9434" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3504" font-weight="bold" fill="var(--text)">Batch Scoring</text>
  <text x="240" y="554.3396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">Spark job</text>
  <text x="240" y="587.1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">scheduled daily</text>
  <rect x="440" y="466.7925" width="400" height="153.2075" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="514.9434" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3504" font-weight="bold" fill="var(--text)">Streaming Scoring</text>
  <text x="640" y="554.3396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">Structured Streaming</text>
  <text x="640" y="587.1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">real-time</text>
  <rect x="840" y="466.7925" width="400" height="153.2075" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="514.9434" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3504" font-weight="bold" fill="var(--text)">REST API Serving</text>
  <text x="1040" y="554.3396" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">MLflow serve</text>
  <text x="1040" y="587.1698" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1253" fill="var(--text-muted)">or custom</text>
</svg>
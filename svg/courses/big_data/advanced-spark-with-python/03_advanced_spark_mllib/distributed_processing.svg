<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">Distributed ML Processing</text>

  <!-- Master node -->
  <rect x="300" y="50" width="200" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="73" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0">Cluster Manager</text>
  <text x="400" y="92" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">YARN / Kubernetes</text>

  <!-- Data source -->
  <rect x="30" y="155" width="130" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="95" y="178" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">HDFS / S3</text>
  <text x="95" y="196" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Distributed data</text>

  <!-- Executors -->
  <rect x="220" y="145" width="140" height="75" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="290" y="168" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Executor 1</text>
  <text x="290" y="186" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Feature transform</text>
  <text x="290" y="202" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Partition 1..k</text>

  <rect x="420" y="145" width="140" height="75" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="490" y="168" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Executor 2</text>
  <text x="490" y="186" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Feature transform</text>
  <text x="490" y="202" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Partition k+1..n</text>

  <rect x="620" y="145" width="140" height="75" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="690" y="168" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Executor N</text>
  <text x="690" y="186" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Feature transform</text>
  <text x="690" y="202" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Partition n+1..m</text>

  <!-- Shuffle -->
  <rect x="250" y="265" width="300" height="45" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="400" y="293" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Shuffle / Aggregate (Model Training)</text>

  <!-- Output -->
  <rect x="300" y="345" width="200" height="45" rx="8" fill="#e0f7fa" stroke="#00695c" stroke-width="2"/>
  <text x="400" y="373" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#00695c">Trained Model</text>

  <!-- Arrows -->
  <line x1="350" y1="105" x2="300" y2="143" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="105" x2="490" y2="143" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="105" x2="680" y2="143" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="160" y1="182" x2="218" y2="182" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="290" y1="220" x2="330" y2="263" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="220" x2="430" y2="263" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="220" x2="520" y2="263" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="400" y1="310" x2="400" y2="343" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

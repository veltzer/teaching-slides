<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="648.2192" y="40" text-anchor="middle" font-family="Arial" font-size="27.6177" font-weight="bold" fill="var(--primary-accent)">Distributed ML Processing</text>
  <rect x="483.8356" y="72.2222" width="328.7671" height="88.6111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="648.2192" y="109.2778" text-anchor="middle" font-family="Arial" font-size="21.4805" font-weight="bold" fill="var(--primary-accent)">Cluster Manager</text>
  <text x="648.2192" y="139.8889" text-anchor="middle" font-family="Arial" font-size="16.8775" fill="var(--text-muted)">YARN / Kubernetes</text>
  <rect x="40" y="241.3889" width="213.6986" height="88.6111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="146.8493" y="278.4445" text-anchor="middle" font-family="Arial" font-size="18.4119" font-weight="bold" fill="var(--warn-accent)">HDFS / S3</text>
  <text x="146.8493" y="307.4444" text-anchor="middle" font-family="Arial" font-size="15.3432" fill="var(--text-muted)">Distributed data</text>
  <rect x="352.3288" y="225.2777" width="230.137" height="120.8333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="467.3972" y="262.3333" text-anchor="middle" font-family="Arial" font-size="18.4119" font-weight="bold" fill="var(--ok-accent)">Executor 1</text>
  <text x="467.3972" y="291.3333" text-anchor="middle" font-family="Arial" font-size="15.3432" fill="var(--text-muted)">Feature transform</text>
  <text x="467.3972" y="317.1111" text-anchor="middle" font-family="Arial" font-size="15.3432" fill="var(--text-muted)">Partition 1..k</text>
  <rect x="681.0959" y="225.2777" width="230.137" height="120.8333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="796.1643" y="262.3333" text-anchor="middle" font-family="Arial" font-size="18.4119" font-weight="bold" fill="var(--ok-accent)">Executor 2</text>
  <text x="796.1643" y="291.3333" text-anchor="middle" font-family="Arial" font-size="15.3432" fill="var(--text-muted)">Feature transform</text>
  <text x="796.1643" y="317.1111" text-anchor="middle" font-family="Arial" font-size="15.3432" fill="var(--text-muted)">Partition k+1..n</text>
  <rect x="1009.863" y="225.2777" width="230.137" height="120.8333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1124.9315" y="262.3333" text-anchor="middle" font-family="Arial" font-size="18.4119" font-weight="bold" fill="var(--ok-accent)">Executor N</text>
  <text x="1124.9315" y="291.3333" text-anchor="middle" font-family="Arial" font-size="15.3432" fill="var(--text-muted)">Feature transform</text>
  <text x="1124.9315" y="317.1111" text-anchor="middle" font-family="Arial" font-size="15.3432" fill="var(--text-muted)">Partition n+1..m</text>
  <rect x="401.6439" y="418.6111" width="493.1506" height="72.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="648.2192" y="463.7222" text-anchor="middle" font-family="Arial" font-size="19.9462" font-weight="bold" fill="var(--info-accent)">Shuffle / Aggregate (Model Training)</text>
  <rect x="483.8356" y="547.5" width="328.7671" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="648.2192" y="592.6111" text-anchor="middle" font-family="Arial" font-size="19.9462" font-weight="bold" fill="var(--ok-accent)">Trained Model</text>
  <line x1="566.0274" y1="160.8333" x2="483.8356" y2="222.0556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="648.2192" y1="160.8333" x2="796.1643" y2="222.0556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="730.411" y1="160.8333" x2="1108.4931" y2="222.0556" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="253.6986" y1="284.8889" x2="349.0411" y2="284.8889" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="467.3972" y1="346.1111" x2="533.1506" y2="415.3888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="796.1643" y1="346.1111" x2="697.5343" y2="415.3888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1124.9315" y1="346.1111" x2="845.4794" y2="415.3888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="648.2192" y1="491.1111" x2="648.2192" y2="544.2778" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
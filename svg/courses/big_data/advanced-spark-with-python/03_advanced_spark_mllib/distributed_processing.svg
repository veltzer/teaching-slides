<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="483.8356" y="40" width="328.7671" height="93.823513840831" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.2192" y="79.235339584773" text-anchor="middle" font-size="22.10325170058" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Cluster Manager</text>
  <text x="648.2192" y="111.647091211071" text-anchor="middle" font-size="17.366803872188" fill="var(--text-muted)" font-family="Arial, sans-serif">YARN / Kubernetes</text>
  <rect x="40" y="219.117675086504" width="213.6986" height="93.823513840831" rx="6.173948939898" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="258.353014671277" text-anchor="middle" font-size="18.945688414418" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">HDFS / S3</text>
  <text x="146.8493" y="289.058789896195" text-anchor="middle" font-size="15.788022229107" fill="var(--text-muted)" font-family="Arial, sans-serif">Distributed data</text>
  <rect x="352.3288" y="202.058758131491" width="230.137" height="127.941135986161" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="467.3972" y="241.294097716264" text-anchor="middle" font-size="18.945688414418" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Executor 1</text>
  <text x="467.3972" y="271.99997882353" text-anchor="middle" font-size="15.788022229107" fill="var(--text-muted)" font-family="Arial, sans-serif">Feature transform</text>
  <text x="467.3972" y="299.294118892734" text-anchor="middle" font-size="15.788022229107" fill="var(--text-muted)" font-family="Arial, sans-serif">Partition 1..k</text>
  <rect x="681.0959" y="202.058758131491" width="230.137" height="127.941135986161" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.1643" y="241.294097716264" text-anchor="middle" font-size="18.945688414418" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Executor 2</text>
  <text x="796.1643" y="271.99997882353" text-anchor="middle" font-size="15.788022229107" fill="var(--text-muted)" font-family="Arial, sans-serif">Feature transform</text>
  <text x="796.1643" y="299.294118892734" text-anchor="middle" font-size="15.788022229107" fill="var(--text-muted)" font-family="Arial, sans-serif">Partition k+1..n</text>
  <rect x="1009.863" y="202.058758131491" width="230.137" height="127.941135986161" rx="6.173948939898" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9315" y="241.294097716264" text-anchor="middle" font-size="18.945688414418" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Executor N</text>
  <text x="1124.9315" y="271.99997882353" text-anchor="middle" font-size="15.788022229107" fill="var(--text-muted)" font-family="Arial, sans-serif">Feature transform</text>
  <text x="1124.9315" y="299.294118892734" text-anchor="middle" font-size="15.788022229107" fill="var(--text-muted)" font-family="Arial, sans-serif">Partition n+1..m</text>
  <rect x="401.6439" y="406.764702768166" width="493.1506" height="76.764702768166" rx="6.173948939898" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.2192" y="454.529394948098" text-anchor="middle" font-size="20.524470057499" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Shuffle / Aggregate (Model Training)</text>
  <rect x="483.8356" y="543.235297231834" width="328.7671" height="76.764702768166" rx="6.173948939898" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.2192" y="590.999989411765" text-anchor="middle" font-size="20.524470057499" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Trained Model</text>
  <line x1="566.0274" y1="133.823513840831" x2="483.8356" y2="198.647122975776" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="648.2192" y1="133.823513840831" x2="796.1643" y2="198.647122975776" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730.411" y1="133.823513840831" x2="1108.4931" y2="198.647122975776" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="253.6986" y1="265.176496747404" x2="349.0411" y2="265.176496747404" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="467.3972" y1="330" x2="533.1506" y2="403.352855847754" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="796.1643" y1="330" x2="697.5343" y2="403.352855847754" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1124.9315" y1="330" x2="845.4794" y2="403.352855847754" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="648.2192" y1="483.529405536332" x2="648.2192" y2="539.823556193771" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

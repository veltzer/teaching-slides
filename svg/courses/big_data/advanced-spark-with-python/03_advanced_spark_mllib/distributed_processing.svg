<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="583.4758" y="49.2308" text-anchor="middle" font-family="Arial" font-size="26.2564" font-weight="bold" fill="var(--primary-accent)">Distributed ML Processing</text>
  <rect x="437.6068" y="82.0513" width="291.7379" height="90.2564" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="583.4758" y="119.7949" text-anchor="middle" font-family="Arial" font-size="20.4217" font-weight="bold" fill="var(--primary-accent)">Cluster Manager</text>
  <text x="583.4758" y="150.9744" text-anchor="middle" font-family="Arial" font-size="16.0456" fill="var(--text-muted)">YARN / Kubernetes</text>
  <rect x="43.7607" y="254.359" width="189.6296" height="90.2564" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="138.5755" y="292.1026" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--warn-accent)">HDFS / S3</text>
  <text x="138.5755" y="321.641" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Distributed data</text>
  <rect x="320.9117" y="237.9487" width="204.2165" height="123.0769" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="423.0199" y="275.6923" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--ok-accent)">Executor 1</text>
  <text x="423.0199" y="305.2308" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Feature transform</text>
  <text x="423.0199" y="331.4872" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Partition 1..k</text>
  <rect x="612.6496" y="237.9487" width="204.2165" height="123.0769" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="714.7578" y="275.6923" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--ok-accent)">Executor 2</text>
  <text x="714.7578" y="305.2308" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Feature transform</text>
  <text x="714.7578" y="331.4872" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Partition k+1..n</text>
  <rect x="904.3875" y="237.9487" width="204.2165" height="123.0769" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1006.4957" y="275.6923" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--ok-accent)">Executor N</text>
  <text x="1006.4957" y="305.2308" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Feature transform</text>
  <text x="1006.4957" y="331.4872" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Partition n+1..m</text>
  <rect x="364.6724" y="434.8718" width="437.6068" height="73.8462" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="583.4758" y="480.8205" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--info-accent)">Shuffle / Aggregate (Model Training)</text>
  <rect x="437.6068" y="566.1538" width="291.7379" height="73.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="583.4758" y="612.1026" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--ok-accent)">Trained Model</text>
  <line x1="510.5413" y1="172.3077" x2="437.6068" y2="234.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="583.4758" y1="172.3077" x2="714.7578" y2="234.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="656.4103" y1="172.3077" x2="991.9088" y2="234.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="233.3903" y1="298.6667" x2="317.9943" y2="298.6667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="423.0199" y1="361.0256" x2="481.3675" y2="431.5897" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="714.7578" y1="361.0256" x2="627.2365" y2="431.5897" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1006.4957" y1="361.0256" x2="758.5185" y2="431.5897" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="583.4758" y1="508.7179" x2="583.4758" y2="562.8718" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
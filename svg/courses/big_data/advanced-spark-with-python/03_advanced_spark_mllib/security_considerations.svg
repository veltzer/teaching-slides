<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="595.3488" y="44.6512" text-anchor="middle" font-family="Arial" font-size="26.7907" font-weight="bold" fill="var(--primary-accent)">ML Security Considerations</text>
  <rect x="446.5116" y="267.907" width="297.6744" height="89.3023" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.3488" y="305.1163" text-anchor="middle" font-family="Arial" font-size="20.8372" font-weight="bold" fill="var(--primary-accent)">ML Pipeline</text>
  <text x="595.3488" y="334.8837" text-anchor="middle" font-family="Arial" font-size="16.3721" fill="var(--text-muted)">Model + Data</text>
  <rect x="44.6512" y="81.8605" width="253.0233" height="104.186" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="171.1628" y="119.0698" text-anchor="middle" font-family="Arial" font-size="17.8605" font-weight="bold" fill="var(--danger-accent)">Data Privacy</text>
  <text x="171.1628" y="145.8605" text-anchor="middle" font-family="Arial" font-size="14.8837" fill="var(--text-muted)">PII masking</text>
  <text x="171.1628" y="166.6977" text-anchor="middle" font-family="Arial" font-size="14.8837" fill="var(--text-muted)">Data encryption at rest</text>
  <rect x="893.0233" y="81.8605" width="253.0233" height="104.186" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1019.5349" y="119.0698" text-anchor="middle" font-family="Arial" font-size="17.8605" font-weight="bold" fill="var(--warn-accent)">Access Control</text>
  <text x="1019.5349" y="145.8605" text-anchor="middle" font-family="Arial" font-size="14.8837" fill="var(--text-muted)">RBAC policies</text>
  <text x="1019.5349" y="166.6977" text-anchor="middle" font-family="Arial" font-size="14.8837" fill="var(--text-muted)">API authentication</text>
  <rect x="44.6512" y="446.5116" width="253.0233" height="104.186" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="171.1628" y="483.7209" text-anchor="middle" font-family="Arial" font-size="17.8605" font-weight="bold" fill="var(--ok-accent)">Model Security</text>
  <text x="171.1628" y="510.5116" text-anchor="middle" font-family="Arial" font-size="14.8837" fill="var(--text-muted)">Adversarial defense</text>
  <text x="171.1628" y="531.3488" text-anchor="middle" font-family="Arial" font-size="14.8837" fill="var(--text-muted)">Model signing</text>
  <rect x="893.0233" y="446.5116" width="253.0233" height="104.186" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1019.5349" y="483.7209" text-anchor="middle" font-family="Arial" font-size="17.8605" font-weight="bold" fill="var(--info-accent)">Audit Trail</text>
  <text x="1019.5349" y="510.5116" text-anchor="middle" font-family="Arial" font-size="14.8837" fill="var(--text-muted)">Prediction logging</text>
  <text x="1019.5349" y="531.3488" text-anchor="middle" font-family="Arial" font-size="14.8837" fill="var(--text-muted)">Data lineage</text>
  <rect x="468.8372" y="565.5814" width="253.0233" height="74.4186" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.3488" y="598.3256" text-anchor="middle" font-family="Arial" font-size="17.8605" font-weight="bold" fill="var(--ok-accent)">Network Security</text>
  <text x="595.3488" y="625.1163" text-anchor="middle" font-family="Arial" font-size="14.8837" fill="var(--text-muted)">TLS, VPC, encryption in transit</text>
  <line x1="297.6744" y1="141.3953" x2="443.5349" y2="282.7907" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="893.0233" y1="141.3953" x2="747.1628" y2="282.7907" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="297.6744" y1="491.1628" x2="443.5349" y2="342.3256" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="893.0233" y1="491.1628" x2="747.1628" y2="342.3256" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="595.3488" y1="357.2093" x2="595.3488" y2="562.6047" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
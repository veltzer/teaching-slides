<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="477.8377" y="233.333333333333" width="324.3243" height="92.8" rx="6.196773353932" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="272" text-anchor="middle" font-size="22.171848501256" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ML Pipeline</text>
  <text x="639.9999" y="302.933333333333" text-anchor="middle" font-size="17.420679091241" fill="var(--text-muted)" font-family="Arial, sans-serif">Model + Data</text>
  <rect x="40" y="40" width="275.6757" height="108.266666666667" rx="6.196773353932" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="78.666666666667" text-anchor="middle" font-size="19.00447108095" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Data Privacy</text>
  <text x="177.8378" y="106.506666666667" text-anchor="middle" font-size="15.836990381088" fill="var(--text-muted)" font-family="Arial, sans-serif">PII masking</text>
  <text x="177.8378" y="128.16" text-anchor="middle" font-size="15.836990381088" fill="var(--text-muted)" font-family="Arial, sans-serif">Data encryption at rest</text>
  <rect x="964.3243" y="40" width="275.6757" height="108.266666666667" rx="6.196773353932" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="78.666666666667" text-anchor="middle" font-size="19.00447108095" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Access Control</text>
  <text x="1102.1621" y="106.506666666667" text-anchor="middle" font-size="15.836990381088" fill="var(--text-muted)" font-family="Arial, sans-serif">RBAC policies</text>
  <text x="1102.1621" y="128.16" text-anchor="middle" font-size="15.836990381088" fill="var(--text-muted)" font-family="Arial, sans-serif">API authentication</text>
  <rect x="40" y="418.933333333333" width="275.6757" height="108.266666666667" rx="6.196773353932" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="457.6" text-anchor="middle" font-size="19.00447108095" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Model Security</text>
  <text x="177.8378" y="485.44" text-anchor="middle" font-size="15.836990381088" fill="var(--text-muted)" font-family="Arial, sans-serif">Adversarial defense</text>
  <text x="177.8378" y="507.093333333333" text-anchor="middle" font-size="15.836990381088" fill="var(--text-muted)" font-family="Arial, sans-serif">Model signing</text>
  <rect x="964.3243" y="418.933333333333" width="275.6757" height="108.266666666667" rx="6.196773353932" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="457.6" text-anchor="middle" font-size="19.00447108095" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Audit Trail</text>
  <text x="1102.1621" y="485.44" text-anchor="middle" font-size="15.836990381088" fill="var(--text-muted)" font-family="Arial, sans-serif">Prediction logging</text>
  <text x="1102.1621" y="507.093333333333" text-anchor="middle" font-size="15.836990381088" fill="var(--text-muted)" font-family="Arial, sans-serif">Data lineage</text>
  <rect x="502.1621" y="542.666666666667" width="275.6757" height="77.333333333333" rx="6.196773353932" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="576.693333333333" text-anchor="middle" font-size="19.00447108095" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Network Security</text>
  <text x="639.9999" y="604.533333333333" text-anchor="middle" font-size="15.836990381088" fill="var(--text-muted)" font-family="Arial, sans-serif">TLS, VPC, encryption in transit</text>
  <line x1="315.6756" y1="101.86656" x2="474.5946" y2="248.8" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="964.3243" y1="101.86656" x2="805.4053" y2="248.8" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315.6756" y1="465.333333333333" x2="474.5946" y2="310.666666666667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="964.3243" y1="465.333333333333" x2="805.4053" y2="310.666666666667" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="639.9999" y1="326.133333333333" x2="639.9999" y2="539.573333333333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

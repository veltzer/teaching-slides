<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="27.6014" font-weight="bold" fill="var(--primary-accent)">ML Security Considerations</text>
  <rect x="477.8377" y="257.5" width="324.3243" height="87" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="293.75" text-anchor="middle" font-family="Arial" font-size="21.4678" font-weight="bold" fill="var(--primary-accent)">ML Pipeline</text>
  <text x="639.9999" y="322.75" text-anchor="middle" font-family="Arial" font-size="16.8675" fill="var(--text-muted)">Model + Data</text>
  <rect x="40" y="76.25" width="275.6757" height="101.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="112.5" text-anchor="middle" font-family="Arial" font-size="18.401" font-weight="bold" fill="var(--danger-accent)">Data Privacy</text>
  <text x="177.8378" y="138.6" text-anchor="middle" font-family="Arial" font-size="15.3341" fill="var(--text-muted)">PII masking</text>
  <text x="177.8378" y="158.9" text-anchor="middle" font-family="Arial" font-size="15.3341" fill="var(--text-muted)">Data encryption at rest</text>
  <rect x="964.3243" y="76.25" width="275.6757" height="101.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="112.5" text-anchor="middle" font-family="Arial" font-size="18.401" font-weight="bold" fill="var(--warn-accent)">Access Control</text>
  <text x="1102.1621" y="138.6" text-anchor="middle" font-family="Arial" font-size="15.3341" fill="var(--text-muted)">RBAC policies</text>
  <text x="1102.1621" y="158.9" text-anchor="middle" font-family="Arial" font-size="15.3341" fill="var(--text-muted)">API authentication</text>
  <rect x="40" y="431.5" width="275.6757" height="101.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="467.75" text-anchor="middle" font-family="Arial" font-size="18.401" font-weight="bold" fill="var(--ok-accent)">Model Security</text>
  <text x="177.8378" y="493.85" text-anchor="middle" font-family="Arial" font-size="15.3341" fill="var(--text-muted)">Adversarial defense</text>
  <text x="177.8378" y="514.15" text-anchor="middle" font-family="Arial" font-size="15.3341" fill="var(--text-muted)">Model signing</text>
  <rect x="964.3243" y="431.5" width="275.6757" height="101.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="467.75" text-anchor="middle" font-family="Arial" font-size="18.401" font-weight="bold" fill="var(--info-accent)">Audit Trail</text>
  <text x="1102.1621" y="493.85" text-anchor="middle" font-family="Arial" font-size="15.3341" fill="var(--text-muted)">Prediction logging</text>
  <text x="1102.1621" y="514.15" text-anchor="middle" font-family="Arial" font-size="15.3341" fill="var(--text-muted)">Data lineage</text>
  <rect x="502.1621" y="547.5" width="275.6757" height="72.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="579.4" text-anchor="middle" font-family="Arial" font-size="18.401" font-weight="bold" fill="var(--ok-accent)">Network Security</text>
  <text x="639.9999" y="605.5" text-anchor="middle" font-family="Arial" font-size="15.3341" fill="var(--text-muted)">TLS, VPC, encryption in transit</text>
  <line x1="315.6756" y1="134.2499" x2="474.5946" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="964.3243" y1="134.2499" x2="805.4053" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="315.6756" y1="475" x2="474.5946" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="964.3243" y1="475" x2="805.4053" y2="330" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="639.9999" y1="344.5" x2="639.9999" y2="544.6" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
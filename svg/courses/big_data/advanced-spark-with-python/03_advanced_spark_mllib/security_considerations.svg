<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">ML Security Considerations</text>

  <!-- Central: ML Pipeline -->
  <rect x="300" y="180" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="205" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0">ML Pipeline</text>
  <text x="400" y="225" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Model + Data</text>

  <!-- Data Privacy -->
  <rect x="30" y="55" width="170" height="70" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="115" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#c62828">Data Privacy</text>
  <text x="115" y="98" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">PII masking</text>
  <text x="115" y="112" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Data encryption at rest</text>

  <!-- Access Control -->
  <rect x="600" y="55" width="170" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="685" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Access Control</text>
  <text x="685" y="98" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">RBAC policies</text>
  <text x="685" y="112" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">API authentication</text>

  <!-- Model Security -->
  <rect x="30" y="300" width="170" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="115" y="325" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Model Security</text>
  <text x="115" y="343" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Adversarial defense</text>
  <text x="115" y="357" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Model signing</text>

  <!-- Audit -->
  <rect x="600" y="300" width="170" height="70" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="685" y="325" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#6a1b9a">Audit Trail</text>
  <text x="685" y="343" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Prediction logging</text>
  <text x="685" y="357" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Data lineage</text>

  <!-- Network -->
  <rect x="315" y="380" width="170" height="50" rx="8" fill="#e0f7fa" stroke="#00695c" stroke-width="2"/>
  <text x="400" y="402" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00695c">Network Security</text>
  <text x="400" y="420" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">TLS, VPC, encryption in transit</text>

  <!-- Arrows -->
  <line x1="200" y1="95" x2="298" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="95" x2="502" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="330" x2="298" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="330" x2="502" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="240" x2="400" y2="378" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

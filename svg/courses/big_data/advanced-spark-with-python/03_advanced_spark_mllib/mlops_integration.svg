  <line x1="615.5155" y1="183.0928" x2="664.4845" y2="183.0928" stroke="var(--text)" stroke-width="1.3813" marker-end="url(#arrow)" />
  <line x1="873.2473" y1="183.0928" x2="922.2164" y2="183.0928" stroke="var(--text)" stroke-width="1.3813" marker-end="url(#arrow)" />

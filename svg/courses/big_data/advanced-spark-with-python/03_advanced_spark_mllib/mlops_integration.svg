  <text x="1021.4432" y="163.7629" text-anchor="middle" font-family="Arial" font-size="16.7525" font-weight="bold" fill="var(--info-accent)">Deployment</text>
  <text x="1021.4432" y="189.5361" text-anchor="middle" font-family="Arial" font-size="13.994" fill="var(--text-muted)">Kubernetes / Spark</text>

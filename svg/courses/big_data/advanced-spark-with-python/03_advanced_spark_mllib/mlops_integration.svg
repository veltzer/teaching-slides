  <text x="770.1546" y="163.7629" text-anchor="middle" font-family="Arial" font-size="16.7525" font-weight="bold" fill="var(--warn-accent)">Model Registry</text>
  <text x="770.1546" y="189.5361" text-anchor="middle" font-family="Arial" font-size="13.994" fill="var(--text-muted)">MLflow / versioning</text>
  <text x="770.1546" y="208.8659" text-anchor="middle" font-family="Arial" font-size="13.994" fill="var(--text-muted)">Staging / Production</text>

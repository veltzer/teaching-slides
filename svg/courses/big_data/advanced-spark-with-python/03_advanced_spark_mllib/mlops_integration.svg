  <path d="M 1021.4432 234.6392 L 1021.4432 556.804 L 164.4845 556.804 L 164.4845 208.8659 L 161.9072 195.9794" fill="none" stroke="var(--danger-border)" stroke-width="1.3813" stroke-dasharray="5.5252 2.7626" marker-end="url(#arrow)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="641.6171" y="40" text-anchor="middle" font-size="27.9872" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">MLOps Integration</text>
  <rect x="43.2344" y="99.7936" width="258.76" height="119.5877" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.6147" y="137.1647" text-anchor="middle" font-size="20.2128" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Development</text>
  <text x="172.6147" y="167.0618" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">Experiment tracking</text>
  <text x="172.6147" y="189.4843" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">Notebook / IDE</text>
  <rect x="350.512" y="99.7936" width="258.76" height="119.5877" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.8921" y="137.1647" text-anchor="middle" font-size="20.2128" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">CI / CD Pipeline</text>
  <text x="479.8921" y="167.0618" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">Automated testing</text>
  <text x="479.8921" y="189.4843" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">Model validation</text>
  <rect x="673.9622" y="99.7936" width="258.76" height="119.5877" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="803.3423" y="137.1647" text-anchor="middle" font-size="20.2128" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Model Registry</text>
  <text x="803.3423" y="167.0618" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">MLflow / versioning</text>
  <text x="803.3423" y="189.4843" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">Staging / Production</text>
  <rect x="997.4123" y="99.7936" width="242.5877" height="119.5877" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1118.7061" y="137.1647" text-anchor="middle" font-size="20.2128" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Deployment</text>
  <text x="1118.7061" y="167.0618" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">Kubernetes / Spark</text>
  <text x="1118.7061" y="189.4843" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">Canary / Blue-green</text>
  <line x1="301.9944" y1="159.5875" x2="347.2776" y2="159.5875" stroke="var(--text)" stroke-width="0.5423" marker-end="url(#arrow)" />
  <line x1="609.2722" y1="159.5875" x2="670.7278" y2="159.5875" stroke="var(--text)" stroke-width="0.5423" marker-end="url(#arrow)" />
  <line x1="932.7222" y1="159.5875" x2="994.1777" y2="159.5875" stroke="var(--text)" stroke-width="0.5423" marker-end="url(#arrow)" />
  <rect x="188.787" y="309.072" width="905.6603" height="82.2166" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="641.6171" y="343.4537" text-anchor="middle" font-size="21.7678" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Monitoring and Observability</text>
  <text x="641.6171" y="373.3505" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">Model performance | Data drift | Latency | Resource usage</text>
  <line x1="172.6147" y1="219.3814" x2="318.1671" y2="306.0826" stroke="var(--text)" stroke-width="0.5423" marker-end="url(#arrow)" />
  <line x1="479.8921" y1="219.3814" x2="479.8921" y2="306.0826" stroke="var(--text)" stroke-width="0.5423" marker-end="url(#arrow)" />
  <line x1="803.3423" y1="219.3814" x2="803.3423" y2="306.0826" stroke="var(--text)" stroke-width="0.5423" marker-end="url(#arrow)" />
  <line x1="1118.7061" y1="219.3814" x2="965.0675" y2="306.0826" stroke="var(--text)" stroke-width="0.5423" marker-end="url(#arrow)" />
  <rect x="188.787" y="458.5566" width="404.3127" height="74.7422" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390.9433" y="491.4432" text-anchor="middle" font-size="19.2567" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Feature Store</text>
  <text x="390.9433" y="518.3504" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">Shared features, versioning</text>
  <rect x="690.1347" y="458.5566" width="404.3127" height="74.7422" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="892.2909" y="491.4432" text-anchor="middle" font-size="19.2567" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Data Pipeline</text>
  <text x="892.2909" y="518.3504" text-anchor="middle" font-size="19.2567" fill="var(--text-muted)" font-family="Arial, sans-serif">ETL, validation, lineage</text>
  <line x1="641.6171" y1="391.2887" x2="641.6171" y2="455.5669" stroke="var(--text)" stroke-width="0.5423" marker-end="url(#arrow)" />
  <path d="M 1118.7061 219.3814 L 1118.7061 593.0926 L 43.2344 593.0926 L 43.2344 189.4843 L 40 174.536" fill="none" stroke="var(--danger-border)" stroke-width="0.5423" stroke-dasharray="2.1691 1.0845" marker-end="url(#arrow)" />
  <text x="576.9271" y="620" text-anchor="middle" font-size="19.2567" fill="var(--danger-accent)" font-family="Arial, sans-serif">Feedback loop: retrain on new data</text>
</svg>
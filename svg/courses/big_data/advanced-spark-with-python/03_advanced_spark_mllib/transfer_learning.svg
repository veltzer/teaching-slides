<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="598.8304" y="50.5263" text-anchor="middle" font-family="Arial" font-size="26.9474" font-weight="bold" fill="var(--primary-accent)">Transfer Learning</text>
  <rect x="44.9123" y="134.7368" width="299.4152" height="202.1053" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="194.6199" y="176.8421" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--primary-accent)">Pre-trained Model</text>
  <text x="194.6199" y="210.5263" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Trained on large dataset</text>
  <rect x="74.8538" y="235.7895" width="239.5322" height="33.6842" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="194.6199" y="261.0526" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--primary-accent)">Frozen base layers</text>
  <rect x="74.8538" y="277.8947" width="239.5322" height="33.6842" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="194.6199" y="303.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--primary-accent)">Learned features</text>
  <line x1="344.3275" y1="235.7895" x2="431.1579" y2="235.7895" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="389.2398" y="218.9474" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">Transfer</text>
  <rect x="434.152" y="134.7368" width="299.4152" height="202.1053" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="583.8596" y="176.8421" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--ok-accent)">Adapted Model</text>
  <text x="583.8596" y="210.5263" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Domain-specific task</text>
  <rect x="464.0936" y="235.7895" width="239.5322" height="33.6842" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="583.8596" y="261.0526" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--ok-accent)">Frozen base layers</text>
  <rect x="464.0936" y="277.8947" width="239.5322" height="33.6842" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="583.8596" y="303.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--warn-accent)">New trainable head</text>
  <rect x="434.152" y="404.2105" width="299.4152" height="92.6316" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="583.8596" y="442.9474" text-anchor="middle" font-family="Arial" font-size="17.9649" font-weight="bold" fill="var(--warn-accent)">Small Target Dataset</text>
  <text x="583.8596" y="471.5789" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">Fine-tune new layers</text>
  <line x1="583.8596" y1="404.2105" x2="583.8596" y2="340.2105" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="733.5673" y1="235.7895" x2="820.3977" y2="235.7895" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="778.4795" y="218.9474" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">Fine-tune</text>
  <rect x="823.3918" y="134.7368" width="314.386" height="202.1053" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="980.5848" y="176.8421" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="var(--info-accent)">Production Model</text>
  <text x="980.5848" y="210.5263" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="var(--text-muted)">Best of both worlds</text>
  <rect x="853.3333" y="235.7895" width="254.5029" height="33.6842" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="980.5848" y="261.0526" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--info-accent)">General knowledge</text>
  <rect x="853.3333" y="277.8947" width="254.5029" height="33.6842" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="980.5848" y="303.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--info-accent)">Domain expertise</text>
  <rect x="149.7076" y="555.7895" width="898.2456" height="84.2105" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="598.8304" y="592.8421" text-anchor="middle" font-family="Arial" font-size="17.9649" font-weight="bold" fill="var(--ok-accent)">Benefits: Less data needed | Faster training | Better generalization</text>
  <text x="598.8304" y="623.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="var(--text-muted)">Reuse features learned from large-scale pre-training</text>
</svg>
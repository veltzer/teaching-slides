<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="648.2191" y="40" text-anchor="middle" font-family="Arial" font-size="28.0095" font-weight="bold" fill="var(--primary-accent)">Transfer Learning</text>
  <rect x="40" y="122.8571" width="328.7671" height="198.8572" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="204.3836" y="164.2857" text-anchor="middle" font-family="Arial" font-size="20.2291" font-weight="bold" fill="var(--primary-accent)">Pre-trained Model</text>
  <text x="204.3836" y="197.4286" text-anchor="middle" font-family="Arial" font-size="17.1169" fill="var(--text-muted)">Trained on large dataset</text>
  <rect x="72.8767" y="222.2858" width="263.0137" height="33.1428" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="204.3836" y="247.1428" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--primary-accent)">Frozen base layers</text>
  <rect x="72.8767" y="263.7143" width="263.0137" height="33.1428" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="204.3836" y="288.5714" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--primary-accent)">Learned features</text>
  <line x1="368.7671" y1="222.2858" x2="464.1096" y2="222.2858" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="418.0822" y="205.7143" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--text-muted)">Transfer</text>
  <rect x="467.3972" y="122.8571" width="328.7671" height="198.8572" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="631.7807" y="164.2857" text-anchor="middle" font-family="Arial" font-size="20.2291" font-weight="bold" fill="var(--ok-accent)">Adapted Model</text>
  <text x="631.7807" y="197.4286" text-anchor="middle" font-family="Arial" font-size="17.1169" fill="var(--text-muted)">Domain-specific task</text>
  <rect x="500.274" y="222.2858" width="263.0137" height="33.1428" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="631.7807" y="247.1428" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--ok-accent)">Frozen base layers</text>
  <rect x="500.274" y="263.7143" width="263.0137" height="33.1428" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="631.7807" y="288.5714" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--warn-accent)">New trainable head</text>
  <rect x="467.3972" y="388" width="328.7671" height="91.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="631.7807" y="426.1143" text-anchor="middle" font-family="Arial" font-size="18.673" font-weight="bold" fill="var(--warn-accent)">Small Target Dataset</text>
  <text x="631.7807" y="454.2857" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--text-muted)">Fine-tune new layers</text>
  <line x1="631.7807" y1="388" x2="631.7807" y2="325.0286" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="796.1644" y1="222.2858" x2="891.5069" y2="222.2858" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="845.4794" y="205.7143" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--text-muted)">Fine-tune</text>
  <rect x="894.7945" y="122.8571" width="345.2055" height="198.8572" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1067.3972" y="164.2857" text-anchor="middle" font-family="Arial" font-size="20.2291" font-weight="bold" fill="var(--info-accent)">Production Model</text>
  <text x="1067.3972" y="197.4286" text-anchor="middle" font-family="Arial" font-size="17.1169" fill="var(--text-muted)">Best of both worlds</text>
  <rect x="927.6712" y="222.2858" width="279.452" height="33.1428" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1067.3972" y="247.1428" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--info-accent)">General knowledge</text>
  <rect x="927.6712" y="263.7143" width="279.452" height="33.1428" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1067.3972" y="288.5714" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--info-accent)">Domain expertise</text>
  <rect x="155.0685" y="537.1429" width="986.3014" height="82.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="648.2191" y="573.6" text-anchor="middle" font-family="Arial" font-size="18.673" font-weight="bold" fill="var(--ok-accent)">Benefits: Less data needed | Faster training | Better generalization</text>
  <text x="648.2191" y="603.4286" text-anchor="middle" font-family="Arial" font-size="15.5609" fill="var(--text-muted)">Reuse features learned from large-scale pre-training</text>
</svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">Transfer Learning</text>

  <!-- Pre-trained model -->
  <rect x="30" y="80" width="200" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Pre-trained Model</text>
  <text x="130" y="125" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Trained on large dataset</text>
  <rect x="50" y="140" width="160" height="20" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1"/>
  <text x="130" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#1565c0">Frozen base layers</text>
  <rect x="50" y="165" width="160" height="20" rx="4" fill="#90caf9" stroke="#1565c0" stroke-width="1"/>
  <text x="130" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#1565c0">Learned features</text>

  <!-- Arrow -->
  <line x1="230" y1="140" x2="288" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="130" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Transfer</text>

  <!-- New model -->
  <rect x="290" y="80" width="200" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="390" y="105" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Adapted Model</text>
  <text x="390" y="125" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Domain-specific task</text>
  <rect x="310" y="140" width="160" height="20" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="390" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">Frozen base layers</text>
  <rect x="310" y="165" width="160" height="20" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
  <text x="390" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#e65100">New trainable head</text>

  <!-- Small dataset -->
  <rect x="290" y="240" width="200" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="390" y="263" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Small Target Dataset</text>
  <text x="390" y="280" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Fine-tune new layers</text>

  <line x1="390" y1="240" x2="390" y2="202" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Fine-tuned model -->
  <line x1="490" y1="140" x2="548" y2="140" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="130" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Fine-tune</text>

  <rect x="550" y="80" width="210" height="120" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="655" y="105" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Production Model</text>
  <text x="655" y="125" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Best of both worlds</text>
  <rect x="570" y="140" width="170" height="20" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1"/>
  <text x="655" y="155" text-anchor="middle" font-family="Arial" font-size="10" fill="#6a1b9a">General knowledge</text>
  <rect x="570" y="165" width="170" height="20" rx="4" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1"/>
  <text x="655" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#6a1b9a">Domain expertise</text>

  <!-- Benefits -->
  <rect x="100" y="330" width="600" height="50" rx="8" fill="#e0f7fa" stroke="#00695c" stroke-width="2"/>
  <text x="400" y="352" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00695c">Benefits: Less data needed | Faster training | Better generalization</text>
  <text x="400" y="370" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Reuse features learned from large-scale pre-training</text>
</svg>

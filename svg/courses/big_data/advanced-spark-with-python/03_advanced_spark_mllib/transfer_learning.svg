<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </ns0:defs>
  <ns0:text x="598.8304" y="50.5263" text-anchor="middle" font-family="Arial" font-size="26.9474" font-weight="bold" fill="#1a237e">Transfer Learning</ns0:text>
  <ns0:rect x="44.9123" y="134.7368" width="299.4152" height="202.1053" rx="11.9766" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.9942" />
  <ns0:text x="194.6199" y="176.8421" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="#1565c0">Pre-trained Model</ns0:text>
  <ns0:text x="194.6199" y="210.5263" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="#555">Trained on large dataset</ns0:text>
  <ns0:rect x="74.8538" y="235.7895" width="239.5322" height="33.6842" rx="5.9883" fill="#bbdefb" stroke="#1565c0" stroke-width="1.4971" />
  <ns0:text x="194.6199" y="261.0526" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#1565c0">Frozen base layers</ns0:text>
  <ns0:rect x="74.8538" y="277.8947" width="239.5322" height="33.6842" rx="5.9883" fill="#90caf9" stroke="#1565c0" stroke-width="1.4971" />
  <ns0:text x="194.6199" y="303.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#1565c0">Learned features</ns0:text>
  <ns0:line x1="344.3275" y1="235.7895" x2="431.1579" y2="235.7895" stroke="#333" stroke-width="2.9942" marker-end="url(#arrow)" />
  <ns0:text x="389.2398" y="218.9474" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#555">Transfer</ns0:text>
  <ns0:rect x="434.152" y="134.7368" width="299.4152" height="202.1053" rx="11.9766" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.9942" />
  <ns0:text x="583.8596" y="176.8421" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="#2e7d32">Adapted Model</ns0:text>
  <ns0:text x="583.8596" y="210.5263" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="#555">Domain-specific task</ns0:text>
  <ns0:rect x="464.0936" y="235.7895" width="239.5322" height="33.6842" rx="5.9883" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.4971" />
  <ns0:text x="583.8596" y="261.0526" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#2e7d32">Frozen base layers</ns0:text>
  <ns0:rect x="464.0936" y="277.8947" width="239.5322" height="33.6842" rx="5.9883" fill="#fff3e0" stroke="#e65100" stroke-width="1.4971" />
  <ns0:text x="583.8596" y="303.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#e65100">New trainable head</ns0:text>
  <ns0:rect x="434.152" y="404.2105" width="299.4152" height="92.6316" rx="11.9766" fill="#fff3e0" stroke="#e65100" stroke-width="2.9942" />
  <ns0:text x="583.8596" y="442.9474" text-anchor="middle" font-family="Arial" font-size="17.9649" font-weight="bold" fill="#e65100">Small Target Dataset</ns0:text>
  <ns0:text x="583.8596" y="471.5789" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#555">Fine-tune new layers</ns0:text>
  <ns0:line x1="583.8596" y1="404.2105" x2="583.8596" y2="340.2105" stroke="#333" stroke-width="2.2456" marker-end="url(#arrow)" />
  <ns0:line x1="733.5673" y1="235.7895" x2="820.3977" y2="235.7895" stroke="#333" stroke-width="2.9942" marker-end="url(#arrow)" />
  <ns0:text x="778.4795" y="218.9474" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#555">Fine-tune</ns0:text>
  <ns0:rect x="823.3918" y="134.7368" width="314.386" height="202.1053" rx="11.9766" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.9942" />
  <ns0:text x="980.5848" y="176.8421" text-anchor="middle" font-family="Arial" font-size="19.462" font-weight="bold" fill="#6a1b9a">Production Model</ns0:text>
  <ns0:text x="980.5848" y="210.5263" text-anchor="middle" font-family="Arial" font-size="16.4678" fill="#555">Best of both worlds</ns0:text>
  <ns0:rect x="853.3333" y="235.7895" width="254.5029" height="33.6842" rx="5.9883" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1.4971" />
  <ns0:text x="980.5848" y="261.0526" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#6a1b9a">General knowledge</ns0:text>
  <ns0:rect x="853.3333" y="277.8947" width="254.5029" height="33.6842" rx="5.9883" fill="#e1bee7" stroke="#6a1b9a" stroke-width="1.4971" />
  <ns0:text x="980.5848" y="303.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#6a1b9a">Domain expertise</ns0:text>
  <ns0:rect x="149.7076" y="555.7895" width="898.2456" height="84.2105" rx="11.9766" fill="#e1f5fe" stroke="#2e7d32" stroke-width="2.9942" />
  <ns0:text x="598.8304" y="592.8421" text-anchor="middle" font-family="Arial" font-size="17.9649" font-weight="bold" fill="#2e7d32">Benefits: Less data needed | Faster training | Better generalization</ns0:text>
  <ns0:text x="598.8304" y="623.1579" text-anchor="middle" font-family="Arial" font-size="14.9708" fill="#555">Reuse features learned from large-scale pre-training</ns0:text>
</ns0:svg>
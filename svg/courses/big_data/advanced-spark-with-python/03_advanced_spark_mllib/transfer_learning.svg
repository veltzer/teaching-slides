<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="328.7671" height="232.000046666663" rx="6.480740419066" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.3836" y="88.333362499997" text-anchor="middle" font-size="21.84992433522" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Pre-trained Model</text>
  <text x="204.3836" y="127.000075833327" text-anchor="middle" font-size="18.488364279851" fill="var(--text-muted)" font-family="Arial, sans-serif">Trained on large dataset</text>
  <rect x="72.8767" y="156.000139999988" width="263.0137" height="38.666596666673" rx="6.480740419066" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.3836" y="184.999970833336" text-anchor="middle" font-size="16.807692264506" fill="var(--primary-accent)" font-family="Arial, sans-serif">Frozen base layers</text>
  <rect x="72.8767" y="204.333385833329" width="263.0137" height="38.666596666673" rx="6.480740419066" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.3836" y="233.333333333333" text-anchor="middle" font-size="16.807692264506" fill="var(--primary-accent)" font-family="Arial, sans-serif">Learned features</text>
  <line x1="368.7671" y1="156.000139999988" x2="464.1096" y2="156.000139999988" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418.0822" y="136.666724999995" text-anchor="middle" font-size="16.807692264506" fill="var(--text-muted)" font-family="Arial, sans-serif">Transfer</text>
  <rect x="467.3972" y="40" width="328.7671" height="232.000046666663" rx="6.480740419066" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.7807" y="88.333362499997" text-anchor="middle" font-size="21.84992433522" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Adapted Model</text>
  <text x="631.7807" y="127.000075833327" text-anchor="middle" font-size="18.488364279851" fill="var(--text-muted)" font-family="Arial, sans-serif">Domain-specific task</text>
  <rect x="500.274" y="156.000139999988" width="263.0137" height="38.666596666673" rx="6.480740419066" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.7807" y="184.999970833336" text-anchor="middle" font-size="16.807692264506" fill="var(--ok-accent)" font-family="Arial, sans-serif">Frozen base layers</text>
  <rect x="500.274" y="204.333385833329" width="263.0137" height="38.666596666673" rx="6.480740419066" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.7807" y="233.333333333333" text-anchor="middle" font-size="16.807692264506" fill="var(--warn-accent)" font-family="Arial, sans-serif">New trainable head</text>
  <rect x="467.3972" y="349.333356666665" width="328.7671" height="106.333374166663" rx="6.480740419066" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.7807" y="393.800036166664" text-anchor="middle" font-size="20.169144307535" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Small Target Dataset</text>
  <text x="631.7807" y="426.666666666667" text-anchor="middle" font-size="16.807692264506" fill="var(--text-muted)" font-family="Arial, sans-serif">Fine-tune new layers</text>
  <line x1="631.7807" y1="349.333356666665" x2="631.7807" y2="275.866729666661" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="796.1644" y1="156.000139999988" x2="891.5069" y2="156.000139999988" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="845.4794" y="136.666724999995" text-anchor="middle" font-size="16.807692264506" fill="var(--text-muted)" font-family="Arial, sans-serif">Fine-tune</text>
  <rect x="894.7945" y="40" width="345.2055" height="232.000046666663" rx="6.480740419066" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.3972" y="88.333362499997" text-anchor="middle" font-size="21.84992433522" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Production Model</text>
  <text x="1067.3972" y="127.000075833327" text-anchor="middle" font-size="18.488364279851" fill="var(--text-muted)" font-family="Arial, sans-serif">Best of both worlds</text>
  <rect x="927.6712" y="156.000139999988" width="279.452" height="38.666596666673" rx="6.480740419066" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.3972" y="184.999970833336" text-anchor="middle" font-size="16.807692264506" fill="var(--info-accent)" font-family="Arial, sans-serif">General knowledge</text>
  <rect x="927.6712" y="204.333385833329" width="279.452" height="38.666596666673" rx="6.480740419066" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1067.3972" y="233.333333333333" text-anchor="middle" font-size="16.807692264506" fill="var(--info-accent)" font-family="Arial, sans-serif">Domain expertise</text>
  <rect x="155.0685" y="523.333391666662" width="986.3014" height="96.666608333338" rx="6.480740419066" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.2191" y="565.866671333333" text-anchor="middle" font-size="20.169144307535" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Benefits: Less data needed | Faster training | Better generalization</text>
  <text x="648.2191" y="600.666701666664" text-anchor="middle" font-size="16.807692264506" fill="var(--text-muted)" font-family="Arial, sans-serif">Reuse features learned from large-scale pre-training</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.623" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ML Performance Optimization</text>
  <rect x="477.8378" y="236.0563" width="324.3243" height="98.0282" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="276.9014" text-anchor="middle" font-size="21.4846" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ML Pipeline</text>
  <text x="640" y="309.5774" text-anchor="middle" font-size="16.8808" fill="var(--text-muted)" font-family="Arial, sans-serif">Optimization targets</text>
  <rect x="40" y="72.6761" width="275.6757" height="114.3662" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="113.5211" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Optimization</text>
  <text x="177.8378" y="142.9296" text-anchor="middle" font-size="15.3461" fill="var(--text-muted)" font-family="Arial, sans-serif">Caching, partitioning</text>
  <text x="177.8378" y="165.8028" text-anchor="middle" font-size="15.3461" fill="var(--text-muted)" font-family="Arial, sans-serif">Data locality</text>
  <rect x="40" y="415.7747" width="275.6757" height="114.3662" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.8378" y="456.6197" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Memory Management</text>
  <text x="177.8378" y="486.0282" text-anchor="middle" font-size="15.3461" fill="var(--text-muted)" font-family="Arial, sans-serif">Executor memory</text>
  <text x="177.8378" y="508.9014" text-anchor="middle" font-size="15.3461" fill="var(--text-muted)" font-family="Arial, sans-serif">Broadcast variables</text>
  <rect x="964.3243" y="72.6761" width="275.6757" height="114.3662" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="113.5211" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Parallelism</text>
  <text x="1102.1621" y="142.9296" text-anchor="middle" font-size="15.3461" fill="var(--text-muted)" font-family="Arial, sans-serif">CV parallelism</text>
  <text x="1102.1621" y="165.8028" text-anchor="middle" font-size="15.3461" fill="var(--text-muted)" font-family="Arial, sans-serif">Shuffle partitions</text>
  <rect x="964.3243" y="415.7747" width="275.6757" height="114.3662" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.1621" y="456.6197" text-anchor="middle" font-size="18.4153" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Algorithm Tuning</text>
  <text x="1102.1621" y="486.0282" text-anchor="middle" font-size="15.3461" fill="var(--text-muted)" font-family="Arial, sans-serif">Feature selection</text>
  <text x="1102.1621" y="508.9014" text-anchor="middle" font-size="15.3461" fill="var(--text-muted)" font-family="Arial, sans-serif">Model complexity</text>
  <line x1="315.6757" y1="138.0282" x2="474.5946" y2="252.3944" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315.6757" y1="464.7887" x2="474.5946" y2="317.7465" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="964.3243" y1="138.0282" x2="805.4054" y2="252.3944" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="964.3243" y1="464.7887" x2="805.4054" y2="317.7465" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="396.7568" y="562.8169" width="486.4864" height="57.1831" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="598.7606" text-anchor="middle" font-size="18.4153" fill="var(--danger-accent)" font-family="Arial, sans-serif">Profile first, then optimize bottlenecks</text>
</svg>

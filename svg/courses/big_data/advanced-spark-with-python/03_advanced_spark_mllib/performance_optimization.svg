<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">ML Performance Optimization</text>

  <!-- Central node -->
  <rect x="300" y="150" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0">ML Pipeline</text>
  <text x="400" y="195" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Optimization targets</text>

  <!-- Data Optimization -->
  <rect x="30" y="50" width="170" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="115" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Data Optimization</text>
  <text x="115" y="93" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Caching, partitioning</text>
  <text x="115" y="107" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Data locality</text>

  <!-- Memory Management -->
  <rect x="30" y="260" width="170" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="115" y="285" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Memory Management</text>
  <text x="115" y="303" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Executor memory</text>
  <text x="115" y="317" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Broadcast variables</text>

  <!-- Parallelism -->
  <rect x="600" y="50" width="170" height="70" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="685" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#6a1b9a">Parallelism</text>
  <text x="685" y="93" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">CV parallelism</text>
  <text x="685" y="107" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Shuffle partitions</text>

  <!-- Algorithm Tuning -->
  <rect x="600" y="260" width="170" height="70" rx="8" fill="#e0f7fa" stroke="#00695c" stroke-width="2"/>
  <text x="685" y="285" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00695c">Algorithm Tuning</text>
  <text x="685" y="303" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Feature selection</text>
  <text x="685" y="317" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Model complexity</text>

  <!-- Arrows -->
  <line x1="200" y1="90" x2="298" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="290" x2="298" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="90" x2="502" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="290" x2="502" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom tip -->
  <rect x="250" y="350" width="300" height="35" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
  <text x="400" y="372" text-anchor="middle" font-family="Arial" font-size="12" fill="#c62828">Profile first, then optimize bottlenecks</text>
</svg>

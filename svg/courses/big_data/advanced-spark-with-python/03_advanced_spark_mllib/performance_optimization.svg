<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="591.0534" y="49.8701" text-anchor="middle" font-family="Arial" font-size="26.5974" font-weight="bold" fill="var(--primary-accent)">ML Performance Optimization</text>
  <rect x="443.29" y="249.3506" width="295.5267" height="99.7403" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="591.0534" y="290.9091" text-anchor="middle" font-family="Arial" font-size="20.6869" font-weight="bold" fill="var(--primary-accent)">ML Pipeline</text>
  <text x="591.0534" y="324.1558" text-anchor="middle" font-family="Arial" font-size="16.254" fill="var(--text-muted)">Optimization targets</text>
  <rect x="44.329" y="83.1169" width="251.1977" height="116.3636" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="169.9278" y="124.6753" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Data Optimization</text>
  <text x="169.9278" y="154.5974" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">Caching, partitioning</text>
  <text x="169.9278" y="177.8701" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">Data locality</text>
  <rect x="44.329" y="432.2078" width="251.1977" height="116.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="169.9278" y="473.7662" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--warn-accent)">Memory Management</text>
  <text x="169.9278" y="503.6883" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">Executor memory</text>
  <text x="169.9278" y="526.961" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">Broadcast variables</text>
  <rect x="886.5801" y="83.1169" width="251.1977" height="116.3636" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="1012.1789" y="124.6753" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--info-accent)">Parallelism</text>
  <text x="1012.1789" y="154.5974" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">CV parallelism</text>
  <text x="1012.1789" y="177.8701" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">Shuffle partitions</text>
  <rect x="886.5801" y="432.2078" width="251.1977" height="116.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1012.1789" y="473.7662" text-anchor="middle" font-family="Arial" font-size="17.7316" font-weight="bold" fill="var(--ok-accent)">Algorithm Tuning</text>
  <text x="1012.1789" y="503.6883" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">Feature selection</text>
  <text x="1012.1789" y="526.961" text-anchor="middle" font-family="Arial" font-size="14.7763" fill="var(--text-muted)">Model complexity</text>
  <line x1="295.5267" y1="149.6104" x2="440.3348" y2="265.974" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="295.5267" y1="482.0779" x2="440.3348" y2="332.4675" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="886.5801" y1="149.6104" x2="741.772" y2="265.974" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="886.5801" y1="482.0779" x2="741.772" y2="332.4675" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="369.4084" y="581.8182" width="443.29" height="58.1818" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="591.0534" y="618.3896" text-anchor="middle" font-family="Arial" font-size="17.7316" fill="var(--danger-accent)">Profile first, then optimize bottlenecks</text>
</svg>
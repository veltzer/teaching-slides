<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="674.2857" y="40" text-anchor="middle" font-family="Arial" font-size="28.2033" font-weight="bold" fill="var(--primary-accent)">A/B Testing Workflow</text>
  <rect x="40" y="241.3889" width="205.7142" height="96.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8572" y="281.6666" text-anchor="middle" font-family="Arial" font-size="20.3691" font-weight="bold" fill="var(--primary-accent)">User Traffic</text>
  <text x="142.8572" y="310.6667" text-anchor="middle" font-family="Arial" font-size="15.6685" fill="var(--text-muted)">Incoming requests</text>
  <rect x="331.4286" y="241.3889" width="205.7142" height="96.6666" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="434.2858" y="281.6666" text-anchor="middle" font-family="Arial" font-size="20.3691" font-weight="bold" fill="var(--warn-accent)">Router</text>
  <text x="434.2858" y="310.6667" text-anchor="middle" font-family="Arial" font-size="15.6685" fill="var(--text-muted)">Traffic split</text>
  <rect x="640" y="104.4444" width="257.1428" height="104.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="768.5714" y="144.7222" text-anchor="middle" font-family="Arial" font-size="20.3691" font-weight="bold" fill="var(--ok-accent)">Model A (Control)</text>
  <text x="768.5714" y="176.9444" text-anchor="middle" font-family="Arial" font-size="15.6685" fill="var(--text-muted)">Current production</text>
  <text x="768.5714" y="197.8889" text-anchor="middle" font-family="Arial" font-size="15.6685" fill="var(--ok-accent)">70% traffic</text>
  <rect x="640" y="378.3334" width="257.1428" height="104.7223" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="768.5714" y="418.6111" text-anchor="middle" font-family="Arial" font-size="20.3691" font-weight="bold" fill="var(--info-accent)">Model B (Test)</text>
  <text x="768.5714" y="450.8333" text-anchor="middle" font-family="Arial" font-size="15.6685" fill="var(--text-muted)">New candidate</text>
  <text x="768.5714" y="471.7777" text-anchor="middle" font-family="Arial" font-size="15.6685" fill="var(--info-accent)">30% traffic</text>
  <rect x="1000" y="241.3889" width="240" height="96.6666" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="281.6666" text-anchor="middle" font-family="Arial" font-size="18.8023" font-weight="bold" fill="var(--ok-accent)">Metrics Collection</text>
  <text x="1120" y="310.6667" text-anchor="middle" font-family="Arial" font-size="15.6685" fill="var(--text-muted)">AUC, latency, errors</text>
  <rect x="811.4285" y="555.5556" width="291.4286" height="64.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.1428" y="595.8333" text-anchor="middle" font-family="Arial" font-size="18.8023" font-weight="bold" fill="var(--danger-accent)">Statistical Significance Test</text>
  <line x1="245.7142" y1="289.7222" x2="328" y2="289.7222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="537.1428" y1="265.5556" x2="636.5714" y2="168.8888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="537.1428" y1="313.8888" x2="636.5714" y2="418.6111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="897.1428" y1="156" x2="1000" y2="262.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="897.1428" y1="429.8889" x2="1000" y2="317.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1120" y1="338.0555" x2="1017.1429" y2="552.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
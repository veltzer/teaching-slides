<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="674.2857" y="40" text-anchor="middle" font-size="28.2033" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">A/B Testing Workflow</text>
  <rect x="40" y="241.3889" width="205.7142" height="96.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8572" y="281.6666" text-anchor="middle" font-size="20.3691" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">User Traffic</text>
  <text x="142.8572" y="310.6667" text-anchor="middle" font-size="15.6685" fill="var(--text-muted)" font-family="Arial, sans-serif">Incoming requests</text>
  <rect x="331.4286" y="241.3889" width="205.7142" height="96.6666" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="434.2858" y="281.6666" text-anchor="middle" font-size="20.3691" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Router</text>
  <text x="434.2858" y="310.6667" text-anchor="middle" font-size="15.6685" fill="var(--text-muted)" font-family="Arial, sans-serif">Traffic split</text>
  <rect x="640" y="104.4444" width="257.1428" height="104.7223" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="768.5714" y="144.7222" text-anchor="middle" font-size="20.3691" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Model A (Control)</text>
  <text x="768.5714" y="176.9444" text-anchor="middle" font-size="15.6685" fill="var(--text-muted)" font-family="Arial, sans-serif">Current production</text>
  <text x="768.5714" y="197.8889" text-anchor="middle" font-size="15.6685" fill="var(--ok-accent)" font-family="Arial, sans-serif">70% traffic</text>
  <rect x="640" y="378.3334" width="257.1428" height="104.7223" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="768.5714" y="418.6111" text-anchor="middle" font-size="20.3691" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Model B (Test)</text>
  <text x="768.5714" y="450.8333" text-anchor="middle" font-size="15.6685" fill="var(--text-muted)" font-family="Arial, sans-serif">New candidate</text>
  <text x="768.5714" y="471.7777" text-anchor="middle" font-size="15.6685" fill="var(--info-accent)" font-family="Arial, sans-serif">30% traffic</text>
  <rect x="1000" y="241.3889" width="240" height="96.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="281.6666" text-anchor="middle" font-size="18.8023" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Metrics Collection</text>
  <text x="1120" y="310.6667" text-anchor="middle" font-size="15.6685" fill="var(--text-muted)" font-family="Arial, sans-serif">AUC, latency, errors</text>
  <rect x="811.4285" y="555.5556" width="291.4286" height="64.4444" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="957.1428" y="595.8333" text-anchor="middle" font-size="18.8023" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Statistical Significance Test</text>
  <line x1="245.7142" y1="289.7222" x2="328" y2="289.7222" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="537.1428" y1="265.5556" x2="636.5714" y2="168.8888" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="537.1428" y1="313.8888" x2="636.5714" y2="418.6111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="897.1428" y1="156" x2="1000" y2="262.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="897.1428" y1="429.8889" x2="1000" y2="317.1111" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1120" y1="338.0555" x2="1017.1429" y2="552.3333" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="583.4758" y="49.2308" text-anchor="middle" font-family="Arial" font-size="26.2564" font-weight="bold" fill="var(--primary-accent)">A/B Testing Workflow</text>
  <rect x="43.7607" y="254.359" width="175.0427" height="98.4615" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="131.2821" y="295.3846" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--primary-accent)">User Traffic</text>
  <text x="131.2821" y="324.9231" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Incoming requests</text>
  <rect x="291.7379" y="254.359" width="175.0427" height="98.4615" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="379.2593" y="295.3846" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--warn-accent)">Router</text>
  <text x="379.2593" y="324.9231" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Traffic split</text>
  <rect x="554.302" y="114.8718" width="218.8034" height="106.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="663.7037" y="155.8974" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--ok-accent)">Model A (Control)</text>
  <text x="663.7037" y="188.7179" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">Current production</text>
  <text x="663.7037" y="210.0513" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--ok-accent)">70% traffic</text>
  <rect x="554.302" y="393.8462" width="218.8034" height="106.6667" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="663.7037" y="434.8718" text-anchor="middle" font-family="Arial" font-size="18.963" font-weight="bold" fill="var(--info-accent)">Model B (Test)</text>
  <text x="663.7037" y="467.6923" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">New candidate</text>
  <text x="663.7037" y="489.0256" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--info-accent)">30% traffic</text>
  <rect x="860.6268" y="254.359" width="204.2165" height="98.4615" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="962.735" y="295.3846" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--ok-accent)">Metrics Collection</text>
  <text x="962.735" y="324.9231" text-anchor="middle" font-family="Arial" font-size="14.5869" fill="var(--text-muted)">AUC, latency, errors</text>
  <rect x="700.1709" y="574.359" width="247.9772" height="65.641" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="824.1595" y="615.3846" text-anchor="middle" font-family="Arial" font-size="17.5043" font-weight="bold" fill="var(--danger-accent)">Statistical Significance Test</text>
  <line x1="218.8034" y1="303.5897" x2="288.8205" y2="303.5897" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="466.7806" y1="278.9744" x2="551.3846" y2="180.5128" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="466.7806" y1="328.2051" x2="551.3846" y2="434.8718" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="773.1054" y1="167.3846" x2="860.6268" y2="275.6923" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="773.1054" y1="446.359" x2="860.6268" y2="331.4872" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="962.735" y1="352.8205" x2="875.2137" y2="571.0769" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
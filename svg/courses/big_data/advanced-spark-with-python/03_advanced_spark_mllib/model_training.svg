<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </defs>
  <text x="640" y="54" text-anchor="middle" font-family="Arial" font-size="28.8" font-weight="bold" fill="#1a237e">Model Training Workflow</text>
  <rect x="48" y="180" width="192" height="99" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="144" y="225" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#1565c0">Training Data</text>
  <text x="144" y="255.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">80% split</text>
  <rect x="296" y="180" width="192" height="99" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="392" y="225" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#e65100">Pipeline</text>
  <text x="392" y="255.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Feature stages</text>
  <rect x="544" y="180" width="192" height="99" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="640" y="225" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#2e7d32">Estimator</text>
  <text x="640" y="255.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">RF / GBT / LR</text>
  <rect x="544" y="342" width="192" height="99" rx="12.8" fill="#fce4ec" stroke="#c62828" stroke-width="3.2" />
  <text x="640" y="383.4" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#c62828">ParamGrid</text>
  <text x="640" y="414" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Hyperparams</text>
  <rect x="800" y="180" width="208" height="99" rx="12.8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="3.2" />
  <text x="904" y="225" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#6a1b9a">CrossValidator</text>
  <text x="904" y="255.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">k-fold CV</text>
  <rect x="1064" y="180" width="176" height="99" rx="12.8" fill="#e1f5fe" stroke="#2e7d32" stroke-width="3.2" />
  <text x="1152" y="225" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#2e7d32">Best Model</text>
  <text x="1152" y="255.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Selected</text>
  <rect x="48" y="540" width="192" height="99" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="144" y="585" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#1565c0">Test Data</text>
  <text x="144" y="615.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">20% split</text>
  <rect x="544" y="540" width="192" height="99" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="640" y="585" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#e65100">Evaluate</text>
  <text x="640" y="615.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">AUC / F1 / Acc</text>
  <rect x="1064" y="540" width="176" height="99" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="1152" y="585" text-anchor="middle" font-family="Arial" font-size="19.2" font-weight="bold" fill="#2e7d32">Deploy</text>
  <text x="1152" y="615.6" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">Save model</text>
  <line x1="240" y1="228.6" x2="292.8" y2="228.6" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="488" y1="228.6" x2="540.8" y2="228.6" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="736" y1="228.6" x2="796.8" y2="228.6" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="1008" y1="228.6" x2="1060.8" y2="228.6" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="640" y1="342" x2="640" y2="282.6" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="240" y1="588.6" x2="540.8" y2="588.6" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="1152" y1="279" x2="1152" y2="536.4" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
  <line x1="736" y1="588.6" x2="1060.8" y2="588.6" stroke="#333" stroke-width="2.4" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="193.2886" height="125.097986735868" rx="6.773651546092" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136.6443" y="96.86276758939" text-anchor="middle" font-size="21.65513820447" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Training Data</text>
  <text x="136.6443" y="135.529357785464" text-anchor="middle" font-size="18.045910872327" fill="var(--text-muted)" font-family="Arial, sans-serif">80% split</text>
  <rect x="289.6644" y="40" width="193.2886" height="125.097986735868" rx="6.773651546092" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="386.3087" y="96.86276758939" text-anchor="middle" font-size="21.65513820447" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Pipeline</text>
  <text x="386.3087" y="135.529357785464" text-anchor="middle" font-size="18.045910872327" fill="var(--text-muted)" font-family="Arial, sans-serif">Feature stages</text>
  <rect x="539.3289" y="40" width="193.2886" height="125.097986735868" rx="6.773651546092" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.9732" y="96.86276758939" text-anchor="middle" font-size="21.65513820447" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Estimator</text>
  <text x="635.9732" y="135.529357785464" text-anchor="middle" font-size="18.045910872327" fill="var(--text-muted)" font-family="Arial, sans-serif">RF / GBT / LR</text>
  <rect x="539.3289" y="244.705912341409" width="193.2886" height="125.097986735868" rx="6.773651546092" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.9732" y="297.019571856976" text-anchor="middle" font-size="21.65513820447" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">ParamGrid</text>
  <text x="635.9732" y="335.686289504038" text-anchor="middle" font-size="18.045910872327" fill="var(--text-muted)" font-family="Arial, sans-serif">Hyperparams</text>
  <rect x="797.047" y="40" width="209.396" height="125.097986735868" rx="6.773651546092" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="901.745" y="96.86276758939" text-anchor="middle" font-size="21.65513820447" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">CrossValidator</text>
  <text x="901.745" y="135.529357785464" text-anchor="middle" font-size="18.045910872327" fill="var(--text-muted)" font-family="Arial, sans-serif">k-fold CV</text>
  <rect x="1062.8188" y="40" width="177.1812" height="125.097986735868" rx="6.773651546092" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.4094" y="96.86276758939" text-anchor="middle" font-size="21.65513820447" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Best Model</text>
  <text x="1151.4094" y="135.529357785464" text-anchor="middle" font-size="18.045910872327" fill="var(--text-muted)" font-family="Arial, sans-serif">Selected</text>
  <rect x="40" y="494.902013264132" width="193.2886" height="125.097986735868" rx="6.773651546092" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="136.6443" y="551.764653402535" text-anchor="middle" font-size="21.65513820447" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Test Data</text>
  <text x="136.6443" y="590.431371049596" text-anchor="middle" font-size="18.045910872327" fill="var(--text-muted)" font-family="Arial, sans-serif">20% split</text>
  <rect x="539.3289" y="494.902013264132" width="193.2886" height="125.097986735868" rx="6.773651546092" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.9732" y="551.764653402535" text-anchor="middle" font-size="21.65513820447" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Evaluate</text>
  <text x="635.9732" y="590.431371049596" text-anchor="middle" font-size="18.045910872327" fill="var(--text-muted)" font-family="Arial, sans-serif">AUC / F1 / Acc</text>
  <rect x="1062.8188" y="494.902013264132" width="177.1812" height="125.097986735868" rx="6.773651546092" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1151.4094" y="551.764653402535" text-anchor="middle" font-size="21.65513820447" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Deploy</text>
  <text x="1151.4094" y="590.431371049596" text-anchor="middle" font-size="18.045910872327" fill="var(--text-muted)" font-family="Arial, sans-serif">Save model</text>
  <line x1="233.2886" y1="101.411748212225" x2="286.443" y2="101.411748212225" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="482.953" y1="101.411748212225" x2="536.1074" y2="101.411748212225" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="732.6174" y1="101.411748212225" x2="793.8255" y2="101.411748212225" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1006.443" y1="101.411748212225" x2="1059.5973" y2="101.411748212225" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="635.9732" y1="244.705912341409" x2="635.9732" y2="169.64709480969" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="233.2886" y1="556.313761476357" x2="536.1074" y2="556.313761476357" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1151.4094" y1="165.097986735868" x2="1151.4094" y2="490.35290519031" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="732.6174" y1="556.313761476357" x2="1059.5973" y2="556.313761476357" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

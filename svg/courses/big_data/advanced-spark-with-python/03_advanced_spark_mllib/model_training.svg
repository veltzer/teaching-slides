<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="635.9732" y="40" text-anchor="middle" font-family="Arial" font-size="28.7727" font-weight="bold" fill="var(--primary-accent)">Model Training Workflow</text>
  <rect x="40" y="164.9231" width="193.2886" height="98.1538" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136.6443" y="209.5385" text-anchor="middle" font-family="Arial" font-size="19.1818" font-weight="bold" fill="var(--primary-accent)">Training Data</text>
  <text x="136.6443" y="239.8769" text-anchor="middle" font-family="Arial" font-size="15.9848" fill="var(--text-muted)">80% split</text>
  <rect x="289.6644" y="164.9231" width="193.2886" height="98.1538" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="386.3087" y="209.5385" text-anchor="middle" font-family="Arial" font-size="19.1818" font-weight="bold" fill="var(--warn-accent)">Pipeline</text>
  <text x="386.3087" y="239.8769" text-anchor="middle" font-family="Arial" font-size="15.9848" fill="var(--text-muted)">Feature stages</text>
  <rect x="539.3289" y="164.9231" width="193.2886" height="98.1538" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="635.9732" y="209.5385" text-anchor="middle" font-family="Arial" font-size="19.1818" font-weight="bold" fill="var(--ok-accent)">Estimator</text>
  <text x="635.9732" y="239.8769" text-anchor="middle" font-family="Arial" font-size="15.9848" fill="var(--text-muted)">RF / GBT / LR</text>
  <rect x="539.3289" y="325.5385" width="193.2886" height="98.1538" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="635.9732" y="366.5846" text-anchor="middle" font-family="Arial" font-size="19.1818" font-weight="bold" fill="var(--danger-accent)">ParamGrid</text>
  <text x="635.9732" y="396.9231" text-anchor="middle" font-family="Arial" font-size="15.9848" fill="var(--text-muted)">Hyperparams</text>
  <rect x="797.047" y="164.9231" width="209.396" height="98.1538" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="901.745" y="209.5385" text-anchor="middle" font-family="Arial" font-size="19.1818" font-weight="bold" fill="var(--info-accent)">CrossValidator</text>
  <text x="901.745" y="239.8769" text-anchor="middle" font-family="Arial" font-size="15.9848" fill="var(--text-muted)">k-fold CV</text>
  <rect x="1062.8188" y="164.9231" width="177.1812" height="98.1538" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1151.4094" y="209.5385" text-anchor="middle" font-family="Arial" font-size="19.1818" font-weight="bold" fill="var(--ok-accent)">Best Model</text>
  <text x="1151.4094" y="239.8769" text-anchor="middle" font-family="Arial" font-size="15.9848" fill="var(--text-muted)">Selected</text>
  <rect x="40" y="521.8462" width="193.2886" height="98.1538" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136.6443" y="566.4615" text-anchor="middle" font-family="Arial" font-size="19.1818" font-weight="bold" fill="var(--primary-accent)">Test Data</text>
  <text x="136.6443" y="596.8" text-anchor="middle" font-family="Arial" font-size="15.9848" fill="var(--text-muted)">20% split</text>
  <rect x="539.3289" y="521.8462" width="193.2886" height="98.1538" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="635.9732" y="566.4615" text-anchor="middle" font-family="Arial" font-size="19.1818" font-weight="bold" fill="var(--warn-accent)">Evaluate</text>
  <text x="635.9732" y="596.8" text-anchor="middle" font-family="Arial" font-size="15.9848" fill="var(--text-muted)">AUC / F1 / Acc</text>
  <rect x="1062.8188" y="521.8462" width="177.1812" height="98.1538" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1151.4094" y="566.4615" text-anchor="middle" font-family="Arial" font-size="19.1818" font-weight="bold" fill="var(--ok-accent)">Deploy</text>
  <text x="1151.4094" y="596.8" text-anchor="middle" font-family="Arial" font-size="15.9848" fill="var(--text-muted)">Save model</text>
  <line x1="233.2886" y1="213.1077" x2="286.443" y2="213.1077" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="482.953" y1="213.1077" x2="536.1074" y2="213.1077" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="732.6174" y1="213.1077" x2="793.8255" y2="213.1077" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1006.443" y1="213.1077" x2="1059.5973" y2="213.1077" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="635.9732" y1="325.5385" x2="635.9732" y2="266.6462" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="233.2886" y1="570.0308" x2="536.1074" y2="570.0308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1151.4094" y1="263.0769" x2="1151.4094" y2="518.2769" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="732.6174" y1="570.0308" x2="1059.5973" y2="570.0308" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
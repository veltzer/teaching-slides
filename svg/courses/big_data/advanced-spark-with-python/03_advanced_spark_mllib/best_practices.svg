<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.621" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ML Best Practices Summary</text>
  <rect x="40" y="93.5385" width="372.973" height="160.6154" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="138.1538" text-anchor="middle" font-size="22.1152" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Data Quality</text>
  <text x="226.4865" y="173.8462" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Validate inputs early</text>
  <text x="226.4865" y="202.4" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Monitor for data drift</text>
  <text x="226.4865" y="230.9538" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Version your datasets</text>
  <rect x="453.5135" y="93.5385" width="372.973" height="160.6154" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="138.1538" text-anchor="middle" font-size="22.1152" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Model Development</text>
  <text x="640" y="173.8462" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Start simple, add complexity</text>
  <text x="640" y="202.4" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Cross-validate rigorously</text>
  <text x="640" y="230.9538" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Track experiments (MLflow)</text>
  <rect x="867.027" y="93.5385" width="372.973" height="160.6154" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="138.1538" text-anchor="middle" font-size="22.1152" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Deployment</text>
  <text x="1053.5135" y="173.8462" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">A/B test before rollout</text>
  <text x="1053.5135" y="202.4" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Automate pipelines</text>
  <text x="1053.5135" y="230.9538" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Plan rollback strategy</text>
  <rect x="40" y="316.6154" width="372.973" height="160.6154" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.4865" y="361.2308" text-anchor="middle" font-size="22.1152" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Monitoring</text>
  <text x="226.4865" y="396.9231" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Track prediction quality</text>
  <text x="226.4865" y="425.4769" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Alert on performance drops</text>
  <text x="226.4865" y="454.0308" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Log all predictions</text>
  <rect x="453.5135" y="316.6154" width="372.973" height="160.6154" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="361.2308" text-anchor="middle" font-size="22.1152" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Performance</text>
  <text x="640" y="396.9231" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Cache intermediate results</text>
  <text x="640" y="425.4769" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Optimize partitioning</text>
  <text x="640" y="454.0308" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Profile before tuning</text>
  <rect x="867.027" y="316.6154" width="372.973" height="160.6154" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.5135" y="361.2308" text-anchor="middle" font-size="22.1152" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Testing</text>
  <text x="1053.5135" y="396.9231" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Unit test transformers</text>
  <text x="1053.5135" y="425.4769" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Integration test pipelines</text>
  <text x="1053.5135" y="454.0308" text-anchor="middle" font-size="18.7128" fill="var(--text-muted)" font-family="Arial, sans-serif">Validate model outputs</text>
  <rect x="153.5135" y="539.6923" width="972.973" height="80.3077" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="589.6615" text-anchor="middle" font-size="22.1152" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Key Principle: Automate everything, measure everything, version everything</text>
</svg>

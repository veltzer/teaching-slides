<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">ML Best Practices Summary</text>

  <!-- Data -->
  <rect x="30" y="60" width="230" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="145" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Data Quality</text>
  <text x="145" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Validate inputs early</text>
  <text x="145" y="121" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Monitor for data drift</text>
  <text x="145" y="137" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Version your datasets</text>

  <!-- Model -->
  <rect x="285" y="60" width="230" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Model Development</text>
  <text x="400" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Start simple, add complexity</text>
  <text x="400" y="121" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Cross-validate rigorously</text>
  <text x="400" y="137" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Track experiments (MLflow)</text>

  <!-- Deployment -->
  <rect x="540" y="60" width="230" height="90" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="655" y="85" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Deployment</text>
  <text x="655" y="105" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">A/B test before rollout</text>
  <text x="655" y="121" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Automate pipelines</text>
  <text x="655" y="137" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Plan rollback strategy</text>

  <!-- Monitoring -->
  <rect x="30" y="185" width="230" height="90" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="145" y="210" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Monitoring</text>
  <text x="145" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Track prediction quality</text>
  <text x="145" y="246" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Alert on performance drops</text>
  <text x="145" y="262" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Log all predictions</text>

  <!-- Performance -->
  <rect x="285" y="185" width="230" height="90" rx="8" fill="#e0f7fa" stroke="#00695c" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#00695c">Performance</text>
  <text x="400" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Cache intermediate results</text>
  <text x="400" y="246" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Optimize partitioning</text>
  <text x="400" y="262" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Profile before tuning</text>

  <!-- Testing -->
  <rect x="540" y="185" width="230" height="90" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="655" y="210" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#c62828">Testing</text>
  <text x="655" y="230" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Unit test transformers</text>
  <text x="655" y="246" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Integration test pipelines</text>
  <text x="655" y="262" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Validate model outputs</text>

  <!-- Bottom summary -->
  <rect x="100" y="310" width="600" height="45" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="400" y="338" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#f57f17">Key Principle: Automate everything, measure everything, version everything</text>
</svg>

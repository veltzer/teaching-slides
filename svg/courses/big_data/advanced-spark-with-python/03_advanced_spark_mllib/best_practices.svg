<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
  </defs>
  <text x="640" y="48" text-anchor="middle" font-family="Arial" font-size="28.8" font-weight="bold" fill="#1a237e">ML Best Practices Summary</text>
  <rect x="48" y="96" width="368" height="144" rx="12.8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.2" />
  <text x="232" y="136" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">Data Quality</text>
  <text x="232" y="168" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Validate inputs early</text>
  <text x="232" y="193.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Monitor for data drift</text>
  <text x="232" y="219.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Version your datasets</text>
  <rect x="456" y="96" width="368" height="144" rx="12.8" fill="#e3f2fd" stroke="#1565c0" stroke-width="3.2" />
  <text x="640" y="136" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#1565c0">Model Development</text>
  <text x="640" y="168" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Start simple, add complexity</text>
  <text x="640" y="193.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Cross-validate rigorously</text>
  <text x="640" y="219.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Track experiments (MLflow)</text>
  <rect x="864" y="96" width="368" height="144" rx="12.8" fill="#fff3e0" stroke="#e65100" stroke-width="3.2" />
  <text x="1048" y="136" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#e65100">Deployment</text>
  <text x="1048" y="168" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">A/B test before rollout</text>
  <text x="1048" y="193.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Automate pipelines</text>
  <text x="1048" y="219.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Plan rollback strategy</text>
  <rect x="48" y="296" width="368" height="144" rx="12.8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="3.2" />
  <text x="232" y="336" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#6a1b9a">Monitoring</text>
  <text x="232" y="368" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Track prediction quality</text>
  <text x="232" y="393.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Alert on performance drops</text>
  <text x="232" y="419.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Log all predictions</text>
  <rect x="456" y="296" width="368" height="144" rx="12.8" fill="#e1f5fe" stroke="#2e7d32" stroke-width="3.2" />
  <text x="640" y="336" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#2e7d32">Performance</text>
  <text x="640" y="368" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Cache intermediate results</text>
  <text x="640" y="393.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Optimize partitioning</text>
  <text x="640" y="419.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Profile before tuning</text>
  <rect x="864" y="296" width="368" height="144" rx="12.8" fill="#fce4ec" stroke="#c62828" stroke-width="3.2" />
  <text x="1048" y="336" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#c62828">Testing</text>
  <text x="1048" y="368" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Unit test transformers</text>
  <text x="1048" y="393.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Integration test pipelines</text>
  <text x="1048" y="419.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="#555">Validate model outputs</text>
  <rect x="160" y="496" width="960" height="72" rx="12.8" fill="#fff9c4" stroke="#f9a825" stroke-width="3.2" />
  <text x="640" y="540.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="#f57c00">Key Principle: Automate everything, measure everything, version everything</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="48" text-anchor="middle" font-family="Arial" font-size="28.8" font-weight="bold" fill="var(--primary-accent)">ML Best Practices Summary</text>
  <rect x="48" y="96" width="368" height="144" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="232" y="136" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="var(--ok-accent)">Data Quality</text>
  <text x="232" y="168" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Validate inputs early</text>
  <text x="232" y="193.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Monitor for data drift</text>
  <text x="232" y="219.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Version your datasets</text>
  <rect x="456" y="96" width="368" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="136" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="var(--primary-accent)">Model Development</text>
  <text x="640" y="168" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Start simple, add complexity</text>
  <text x="640" y="193.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Cross-validate rigorously</text>
  <text x="640" y="219.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Track experiments (MLflow)</text>
  <rect x="864" y="96" width="368" height="144" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1048" y="136" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="var(--warn-accent)">Deployment</text>
  <text x="1048" y="168" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">A/B test before rollout</text>
  <text x="1048" y="193.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Automate pipelines</text>
  <text x="1048" y="219.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Plan rollback strategy</text>
  <rect x="48" y="296" width="368" height="144" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="232" y="336" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="var(--info-accent)">Monitoring</text>
  <text x="232" y="368" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Track prediction quality</text>
  <text x="232" y="393.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Alert on performance drops</text>
  <text x="232" y="419.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Log all predictions</text>
  <rect x="456" y="296" width="368" height="144" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="336" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="var(--ok-accent)">Performance</text>
  <text x="640" y="368" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Cache intermediate results</text>
  <text x="640" y="393.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Optimize partitioning</text>
  <text x="640" y="419.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Profile before tuning</text>
  <rect x="864" y="296" width="368" height="144" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1048" y="336" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="var(--danger-accent)">Testing</text>
  <text x="1048" y="368" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Unit test transformers</text>
  <text x="1048" y="393.6" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Integration test pipelines</text>
  <text x="1048" y="419.2" text-anchor="middle" font-family="Arial" font-size="17.6" fill="var(--text-muted)">Validate model outputs</text>
  <rect x="160" y="496" width="960" height="72" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="540.8" text-anchor="middle" font-family="Arial" font-size="20.8" font-weight="bold" fill="var(--warn-accent)">Key Principle: Automate everything, measure everything, version everything</text>
</svg>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">Distributed Training Architecture</text>

  <!-- Driver -->
  <rect x="300" y="50" width="200" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="73" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0">Driver Program</text>
  <text x="400" y="92" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Pipeline orchestration</text>

  <!-- Worker nodes -->
  <rect x="30" y="170" width="160" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="110" y="195" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Worker 1</text>
  <text x="110" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Data Partition 1</text>
  <text x="110" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Local gradient</text>
  <rect x="55" y="245" width="110" height="18" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="110" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">CPU / GPU</text>

  <rect x="220" y="170" width="160" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="300" y="195" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Worker 2</text>
  <text x="300" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Data Partition 2</text>
  <text x="300" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Local gradient</text>
  <rect x="245" y="245" width="110" height="18" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="300" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">CPU / GPU</text>

  <rect x="420" y="170" width="160" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="500" y="195" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Worker 3</text>
  <text x="500" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Data Partition 3</text>
  <text x="500" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Local gradient</text>
  <rect x="445" y="245" width="110" height="18" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="500" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">CPU / GPU</text>

  <rect x="610" y="170" width="160" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="690" y="195" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Worker N</text>
  <text x="690" y="215" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Data Partition N</text>
  <text x="690" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Local gradient</text>
  <rect x="635" y="245" width="110" height="18" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1"/>
  <text x="690" y="258" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">CPU / GPU</text>

  <!-- Arrows driver to workers -->
  <line x1="350" y1="105" x2="130" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="105" x2="310" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="105" x2="490" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="105" x2="670" y2="168" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Aggregation -->
  <rect x="250" y="320" width="300" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="400" y="343" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e65100">Parameter Server / AllReduce</text>
  <text x="400" y="362" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Aggregate gradients, update global model</text>

  <!-- Arrows workers to aggregation -->
  <line x1="110" y1="270" x2="265" y2="318" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="270" x2="340" y2="318" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="270" x2="460" y2="318" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="270" x2="535" y2="318" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

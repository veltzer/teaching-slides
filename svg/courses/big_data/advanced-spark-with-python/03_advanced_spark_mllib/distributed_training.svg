<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.0205" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Distributed Training Architecture</text>
  <rect x="477.8378" y="73.6232" width="324.3243" height="92.4638" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="112.2899" text-anchor="middle" font-size="21.7937" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Driver Program</text>
  <text x="640" y="144.2319" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Pipeline orchestration</text>
  <rect x="40" y="275.3623" width="259.4594" height="168.116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7298" y="317.3913" text-anchor="middle" font-size="20.237" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Worker 1</text>
  <text x="169.7298" y="351.0145" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Data Partition 1</text>
  <text x="169.7298" y="384.6377" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Local gradient</text>
  <rect x="80.5405" y="401.4492" width="178.3784" height="30.2609" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.7298" y="423.3043" text-anchor="middle" font-size="15.567" fill="var(--ok-accent)" font-family="Arial, sans-serif">CPU / GPU</text>
  <rect x="348.1081" y="275.3623" width="259.4594" height="168.116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.8378" y="317.3913" text-anchor="middle" font-size="20.237" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Worker 2</text>
  <text x="477.8378" y="351.0145" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Data Partition 2</text>
  <text x="477.8378" y="384.6377" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Local gradient</text>
  <rect x="388.6487" y="401.4492" width="178.3784" height="30.2609" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.8378" y="423.3043" text-anchor="middle" font-size="15.567" fill="var(--ok-accent)" font-family="Arial, sans-serif">CPU / GPU</text>
  <rect x="672.4325" y="275.3623" width="259.4594" height="168.116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1622" y="317.3913" text-anchor="middle" font-size="20.237" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Worker 3</text>
  <text x="802.1622" y="351.0145" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Data Partition 3</text>
  <text x="802.1622" y="384.6377" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Local gradient</text>
  <rect x="712.973" y="401.4492" width="178.3784" height="30.2609" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="802.1622" y="423.3043" text-anchor="middle" font-size="15.567" fill="var(--ok-accent)" font-family="Arial, sans-serif">CPU / GPU</text>
  <rect x="980.5406" y="275.3623" width="259.4594" height="168.116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="317.3913" text-anchor="middle" font-size="20.237" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Worker N</text>
  <text x="1110.2703" y="351.0145" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Data Partition N</text>
  <text x="1110.2703" y="384.6377" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Local gradient</text>
  <rect x="1021.0811" y="401.4492" width="178.3784" height="30.2609" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.2703" y="423.3043" text-anchor="middle" font-size="15.567" fill="var(--ok-accent)" font-family="Arial, sans-serif">CPU / GPU</text>
  <line x1="558.919" y1="166.087" x2="202.1622" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="607.5676" y1="166.087" x2="494.0541" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672.4325" y1="166.087" x2="785.9459" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="721.0811" y1="166.087" x2="1077.8378" y2="272" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="396.7568" y="527.5362" width="486.4865" height="92.4638" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="566.2029" text-anchor="middle" font-size="21.7937" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Parameter Server / AllReduce</text>
  <text x="640" y="598.1449" text-anchor="middle" font-size="17.1236" fill="var(--text-muted)" font-family="Arial, sans-serif">Aggregate gradients, update global model</text>
  <line x1="169.7298" y1="443.4783" x2="421.0811" y2="524.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="477.8378" y1="443.4783" x2="542.7027" y2="524.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="802.1622" y1="443.4783" x2="737.2973" y2="524.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1110.2703" y1="443.4783" x2="858.9189" y2="524.1739" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

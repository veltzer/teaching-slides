  <text x="802.1622" y="317.3913" text-anchor="middle" font-family="Arial" font-size="20.237" font-weight="bold" fill="var(--ok-accent)">Worker 3</text>
  <text x="802.1622" y="351.0145" text-anchor="middle" font-family="Arial" font-size="17.1236" fill="var(--text-muted)">Data Partition 3</text>
  <text x="802.1622" y="384.6377" text-anchor="middle" font-family="Arial" font-size="17.1236" fill="var(--text-muted)">Local gradient</text>

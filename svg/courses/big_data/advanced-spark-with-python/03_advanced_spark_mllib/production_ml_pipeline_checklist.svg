<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="18.7417" y="4.539" width="1143.2441" height="635.461" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="590.3638" y="27.234" font-size="13.617" font-weight="bold" fill="var(--text)" text-anchor="middle">Production ML Pipeline Checklist</text>
  <rect x="37.4834" y="40.8511" width="1105.7607" height="104.3972" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="56.2251" y="59.0071" font-size="11.8014" font-weight="bold" fill="var(--text)" text-anchor="start">Data Quality</text>
  <text x="74.9668" y="77.1631" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Schema validation on input</text>
  <text x="74.9668" y="95.3191" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Null/missing value handling</text>
  <text x="74.9668" y="113.4752" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Outlier detection and clipping</text>
  <text x="74.9668" y="131.6312" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Feature drift monitoring</text>
  <rect x="37.4834" y="154.3262" width="1105.7607" height="104.3972" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="56.2251" y="172.4823" font-size="11.8014" font-weight="bold" fill="var(--text)" text-anchor="start">Model Training</text>
  <text x="74.9668" y="190.6383" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Cross-validation (k &gt;= 5)</text>
  <text x="74.9668" y="208.7943" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Multiple model comparison</text>
  <text x="74.9668" y="226.9504" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Hyperparameter tuning</text>
  <text x="74.9668" y="245.1064" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Class imbalance handling</text>
  <rect x="37.4834" y="267.8014" width="1105.7607" height="104.3972" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="56.2251" y="285.9574" font-size="11.8014" font-weight="bold" fill="var(--text)" text-anchor="start">Evaluation</text>
  <text x="74.9668" y="304.1135" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Hold-out test set (never touched)</text>
  <text x="74.9668" y="322.2695" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Multiple metrics (AUC, F1, precision)</text>
  <text x="74.9668" y="340.4255" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Confusion matrix analysis</text>
  <text x="74.9668" y="358.5816" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Threshold tuning for business needs</text>
  <rect x="37.4834" y="381.2766" width="1105.7607" height="104.3972" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="56.2251" y="399.4326" font-size="11.8014" font-weight="bold" fill="var(--text)" text-anchor="start">Deployment</text>
  <text x="74.9668" y="417.5887" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Model versioning (MLflow registry)</text>
  <text x="74.9668" y="435.7447" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ A/B testing framework</text>
  <text x="74.9668" y="453.9007" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Rollback capability</text>
  <text x="74.9668" y="472.0567" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Latency monitoring</text>
  <rect x="37.4834" y="494.7518" width="1105.7607" height="104.3972" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="56.2251" y="512.9078" font-size="11.8014" font-weight="bold" fill="var(--text)" text-anchor="start">Monitoring</text>
  <text x="74.9668" y="531.0638" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Prediction distribution tracking</text>
  <text x="74.9668" y="549.2199" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Feature drift detection</text>
  <text x="74.9668" y="567.3759" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Model performance decay alerts</text>
  <text x="74.9668" y="585.5319" font-size="10.8936" fill="var(--text)" text-anchor="start">☐ Retraining triggers</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.000103" y="40" font-size="14.285293" font-weight="bold" fill="var(--text)" text-anchor="middle">Production ML Pipeline Checklist</text>
  <rect x="40" y="53.809556" width="1200" height="105.873" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="72.222222" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start">Data Quality</text>
  <text x="80.678003" y="90.634889" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Schema validation on input</text>
  <text x="80.678003" y="109.047556" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Null/missing value handling</text>
  <text x="80.678003" y="127.460333" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Outlier detection and clipping</text>
  <text x="80.678003" y="145.873" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Feature drift monitoring</text>
  <rect x="40" y="168.888889" width="1200" height="105.873" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="187.301556" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start">Model Training</text>
  <text x="80.678003" y="205.714222" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Cross-validation (k &gt;= 5)</text>
  <text x="80.678003" y="224.127" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Multiple model comparison</text>
  <text x="80.678003" y="242.539667" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Hyperparameter tuning</text>
  <text x="80.678003" y="260.952333" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Class imbalance handling</text>
  <rect x="40" y="283.968222" width="1200" height="105.873" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="302.380889" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start">Evaluation</text>
  <text x="80.678003" y="320.793667" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Hold-out test set (never touched)</text>
  <text x="80.678003" y="339.206333" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Multiple metrics (AUC, F1, precision)</text>
  <text x="80.678003" y="357.619" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Confusion matrix analysis</text>
  <text x="80.678003" y="376.031778" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Threshold tuning for business needs</text>
  <rect x="40" y="399.047556" width="1200" height="105.873" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="417.460333" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start">Deployment</text>
  <text x="80.678003" y="435.873" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Model versioning (MLflow registry)</text>
  <text x="80.678003" y="454.285667" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ A/B testing framework</text>
  <text x="80.678003" y="472.698444" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Rollback capability</text>
  <text x="80.678003" y="491.111111" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Latency monitoring</text>
  <rect x="40" y="514.127" width="1200" height="105.873" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="532.539667" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start">Monitoring</text>
  <text x="80.678003" y="550.952333" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Prediction distribution tracking</text>
  <text x="80.678003" y="569.365111" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Feature drift detection</text>
  <text x="80.678003" y="587.777778" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Model performance decay alerts</text>
  <text x="80.678003" y="606.190444" font-size="11.428277" fill="var(--text)" text-anchor="start">☐ Retraining triggers</text>
</svg>
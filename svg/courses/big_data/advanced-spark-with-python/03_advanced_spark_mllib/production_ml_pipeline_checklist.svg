<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640.000103" y="40" font-size="14.285293" font-weight="bold" fill="var(--text)" text-anchor="middle" font-family="Arial, sans-serif">Production ML Pipeline Checklist</text>
  <rect x="40" y="53.809556" width="1200" height="105.873" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="72.222222" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Data Quality</text>
  <text x="80.678003" y="90.634889" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Schema validation on input</text>
  <text x="80.678003" y="109.047556" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Null/missing value handling</text>
  <text x="80.678003" y="127.460333" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Outlier detection and clipping</text>
  <text x="80.678003" y="145.873" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Feature drift monitoring</text>
  <rect x="40" y="168.888889" width="1200" height="105.873" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="187.301556" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Model Training</text>
  <text x="80.678003" y="205.714222" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Cross-validation (k &gt;= 5)</text>
  <text x="80.678003" y="224.127" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Multiple model comparison</text>
  <text x="80.678003" y="242.539667" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Hyperparameter tuning</text>
  <text x="80.678003" y="260.952333" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Class imbalance handling</text>
  <rect x="40" y="283.968222" width="1200" height="105.873" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="302.380889" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Evaluation</text>
  <text x="80.678003" y="320.793667" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Hold-out test set (never touched)</text>
  <text x="80.678003" y="339.206333" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Multiple metrics (AUC, F1, precision)</text>
  <text x="80.678003" y="357.619" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Confusion matrix analysis</text>
  <text x="80.678003" y="376.031778" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Threshold tuning for business needs</text>
  <rect x="40" y="399.047556" width="1200" height="105.873" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="417.460333" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Deployment</text>
  <text x="80.678003" y="435.873" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Model versioning (MLflow registry)</text>
  <text x="80.678003" y="454.285667" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ A/B testing framework</text>
  <text x="80.678003" y="472.698444" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Rollback capability</text>
  <text x="80.678003" y="491.111111" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Latency monitoring</text>
  <rect x="40" y="514.127" width="1200" height="105.873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.430858" filter="url(#shadow)"/>
  <text x="60.33895" y="532.539667" font-size="12.38058" font-weight="bold" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">Monitoring</text>
  <text x="80.678003" y="550.952333" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Prediction distribution tracking</text>
  <text x="80.678003" y="569.365111" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Feature drift detection</text>
  <text x="80.678003" y="587.777778" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Model performance decay alerts</text>
  <text x="80.678003" y="606.190444" font-size="11.428277" fill="var(--text)" text-anchor="start" font-family="Arial, sans-serif">☐ Retraining triggers</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="171.320652153776" width="176" height="120.377401424001" rx="6.746068552901" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="221.660288152354" text-anchor="middle" font-size="21.171749111949" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Input Data</text>
  <text x="128" y="258.867795727997" text-anchor="middle" font-size="17.643105520878" fill="var(--text-muted)" font-family="Arial, sans-serif">Raw DataFrame</text>
  <rect x="279.9999" y="40" width="208" height="120.377401424001" rx="6.746068552901" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="384" y="90.339509583464" text-anchor="middle" font-size="21.171749111949" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Schema Check</text>
  <text x="384" y="131.9245197152" text-anchor="middle" font-size="17.643105520878" fill="var(--text-muted)" font-family="Arial, sans-serif">Types, columns</text>
  <rect x="279.9999" y="313.584807867554" width="208" height="120.377401424001" rx="6.746068552901" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="384" y="363.924443866132" text-anchor="middle" font-size="21.171749111949" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Null Check</text>
  <text x="384" y="405.509453997867" text-anchor="middle" font-size="17.643105520878" fill="var(--text-muted)" font-family="Arial, sans-serif">Missing values</text>
  <rect x="552" y="40" width="208" height="120.377401424001" rx="6.746068552901" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656" y="90.339509583464" text-anchor="middle" font-size="21.171749111949" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Range Check</text>
  <text x="656" y="131.9245197152" text-anchor="middle" font-size="17.643105520878" fill="var(--text-muted)" font-family="Arial, sans-serif">Min/max bounds</text>
  <rect x="552" y="313.584807867554" width="208" height="120.377401424001" rx="6.746068552901" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656" y="363.924443866132" text-anchor="middle" font-size="21.171749111949" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Distribution</text>
  <text x="656" y="405.509453997867" text-anchor="middle" font-size="17.643105520878" fill="var(--text-muted)" font-family="Arial, sans-serif">Drift detection</text>
  <rect x="823.9999" y="171.320652153776" width="208" height="120.377401424001" rx="6.746068552901" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="927.9999" y="221.660288152354" text-anchor="middle" font-size="21.171749111949" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Anomaly Check</text>
  <text x="927.9999" y="258.867795727997" text-anchor="middle" font-size="17.643105520878" fill="var(--text-muted)" font-family="Arial, sans-serif">Outlier detection</text>
  <rect x="1096" y="171.320652153776" width="144" height="120.377401424001" rx="6.746068552901" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1168" y="221.660288152354" text-anchor="middle" font-size="21.171749111949" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Valid</text>
  <text x="1168" y="258.867795727997" text-anchor="middle" font-size="17.643105520878" fill="var(--text-muted)" font-family="Arial, sans-serif">To pipeline</text>
  <rect x="887.9999" y="521.50947928089" width="192" height="98.49052071911" rx="6.746068552901" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="984" y="582.792492424356" text-anchor="middle" font-size="21.171749111949" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Alert / Reject</text>
  <line x1="216" y1="197.584782584531" x2="276.7999" y2="116.60364001422" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="216" y1="258.867795727997" x2="276.7999" y2="357.358442862221" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="488" y1="99.094261865421" x2="548.8" y2="99.094261865421" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="488" y1="372.679196148088" x2="548.8" y2="372.679196148088" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="99.094261865421" x2="823.9999" y2="204.150910003555" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="372.679196148088" x2="823.9999" y2="258.867795727997" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1032" y1="230.41504043431" x2="1092.8" y2="230.41504043431" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="927.9999" y1="291.698053577777" x2="952" y2="517.131976724798" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.793 4.6758" marker-end="url(#arrow)"/>
</svg>

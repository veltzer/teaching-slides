<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="632" y="40" text-anchor="middle" font-size="28.2454" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Data Validation Pipeline</text>
  <rect x="40" y="265.0746" width="176" height="95.2239" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="128" y="304.8955" text-anchor="middle" font-size="18.8303" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Input Data</text>
  <text x="128" y="334.3283" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">Raw DataFrame</text>
  <rect x="279.9999" y="161.1941" width="208" height="95.2239" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="384" y="201.0149" text-anchor="middle" font-size="18.8303" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Schema Check</text>
  <text x="384" y="233.9105" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">Types, columns</text>
  <rect x="279.9999" y="377.6119" width="208" height="95.2239" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="384" y="417.4328" text-anchor="middle" font-size="18.8303" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Null Check</text>
  <text x="384" y="450.3284" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">Missing values</text>
  <rect x="552" y="161.1941" width="208" height="95.2239" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656" y="201.0149" text-anchor="middle" font-size="18.8303" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Range Check</text>
  <text x="656" y="233.9105" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">Min/max bounds</text>
  <rect x="552" y="377.6119" width="208" height="95.2239" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656" y="417.4328" text-anchor="middle" font-size="18.8303" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Distribution</text>
  <text x="656" y="450.3284" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">Drift detection</text>
  <rect x="823.9999" y="265.0746" width="208" height="95.2239" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="927.9999" y="304.8955" text-anchor="middle" font-size="18.8303" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Anomaly Check</text>
  <text x="927.9999" y="334.3283" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">Outlier detection</text>
  <rect x="1096" y="265.0746" width="144" height="95.2239" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1168" y="304.8955" text-anchor="middle" font-size="18.8303" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Valid</text>
  <text x="1168" y="334.3283" text-anchor="middle" font-size="15.6919" fill="var(--text-muted)" font-family="Arial, sans-serif">To pipeline</text>
  <rect x="887.9999" y="542.0896" width="192" height="77.9104" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="984" y="590.5672" text-anchor="middle" font-size="18.8303" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Alert / Reject</text>
  <line x1="216" y1="285.8507" x2="276.7999" y2="221.791" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="216" y1="334.3283" x2="276.7999" y2="412.2388" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="488" y1="207.9403" x2="548.8" y2="207.9403" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="488" y1="424.3582" x2="548.8" y2="424.3582" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="207.9403" x2="823.9999" y2="291.0448" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="424.3582" x2="823.9999" y2="334.3283" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1032" y1="311.8209" x2="1092.8" y2="311.8209" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="927.9999" y1="360.2985" x2="952" y2="538.6268" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.793 4.6758" marker-end="url(#arrow)"/>
</svg>

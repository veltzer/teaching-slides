<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">Data Validation Pipeline</text>

  <!-- Input Data -->
  <rect x="30" y="160" width="110" height="55" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="85" y="183" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#1565c0">Input Data</text>
  <text x="85" y="200" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Raw DataFrame</text>

  <!-- Schema Validation -->
  <rect x="180" y="100" width="130" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="245" y="123" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Schema Check</text>
  <text x="245" y="142" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Types, columns</text>

  <!-- Null check -->
  <rect x="180" y="225" width="130" height="55" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="245" y="248" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2e7d32">Null Check</text>
  <text x="245" y="267" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Missing values</text>

  <!-- Range Validation -->
  <rect x="350" y="100" width="130" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="415" y="123" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Range Check</text>
  <text x="415" y="142" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Min/max bounds</text>

  <!-- Distribution Check -->
  <rect x="350" y="225" width="130" height="55" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="415" y="248" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e65100">Distribution</text>
  <text x="415" y="267" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Drift detection</text>

  <!-- Anomaly Detection -->
  <rect x="520" y="160" width="130" height="55" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="585" y="183" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#6a1b9a">Anomaly Check</text>
  <text x="585" y="200" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">Outlier detection</text>

  <!-- Validated Data -->
  <rect x="690" y="160" width="90" height="55" rx="8" fill="#e0f7fa" stroke="#00695c" stroke-width="2"/>
  <text x="735" y="183" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00695c">Valid</text>
  <text x="735" y="200" text-anchor="middle" font-family="Arial" font-size="10" fill="#555">To pipeline</text>

  <!-- Alert -->
  <rect x="560" y="320" width="120" height="45" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="620" y="348" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#c62828">Alert / Reject</text>

  <!-- Arrows -->
  <line x1="140" y1="172" x2="178" y2="135" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="200" x2="178" y2="245" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="127" x2="348" y2="127" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="252" x2="348" y2="252" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="127" x2="520" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="252" x2="520" y2="200" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="187" x2="688" y2="187" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="585" y1="215" x2="600" y2="318" stroke="#c62828" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
</svg>

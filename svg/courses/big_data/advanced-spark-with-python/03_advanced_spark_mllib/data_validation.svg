<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="623.4399" y="52.6027" text-anchor="middle" font-family="Arial" font-size="28.0548" font-weight="bold" fill="var(--primary-accent)">Data Validation Pipeline</text>
  <rect x="46.758" y="280.5479" width="171.446" height="96.4384" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="132.481" y="320.8767" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--primary-accent)">Input Data</text>
  <text x="132.481" y="350.6849" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">Raw DataFrame</text>
  <rect x="280.5479" y="175.3425" width="202.618" height="96.4384" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="381.8569" y="215.6712" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--ok-accent)">Schema Check</text>
  <text x="381.8569" y="248.9863" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">Types, columns</text>
  <rect x="280.5479" y="394.5205" width="202.618" height="96.4384" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="381.8569" y="434.8493" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--ok-accent)">Null Check</text>
  <text x="381.8569" y="468.1644" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">Missing values</text>
  <rect x="545.5099" y="175.3425" width="202.618" height="96.4384" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="646.8189" y="215.6712" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--warn-accent)">Range Check</text>
  <text x="646.8189" y="248.9863" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">Min/max bounds</text>
  <rect x="545.5099" y="394.5205" width="202.618" height="96.4384" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="646.8189" y="434.8493" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--warn-accent)">Distribution</text>
  <text x="646.8189" y="468.1644" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">Drift detection</text>
  <rect x="810.4718" y="280.5479" width="202.618" height="96.4384" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="911.7808" y="320.8767" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--info-accent)">Anomaly Check</text>
  <text x="911.7808" y="350.6849" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">Outlier detection</text>
  <rect x="1075.4338" y="280.5479" width="140.274" height="96.4384" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1145.5708" y="320.8767" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--ok-accent)">Valid</text>
  <text x="1145.5708" y="350.6849" text-anchor="middle" font-family="Arial" font-size="15.586" fill="var(--text-muted)">To pipeline</text>
  <rect x="872.8158" y="561.0959" width="187.032" height="78.9041" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="966.3318" y="610.1918" text-anchor="middle" font-family="Arial" font-size="18.7032" font-weight="bold" fill="var(--danger-accent)">Alert / Reject</text>
  <line x1="218.204" y1="301.589" x2="277.4307" y2="236.7123" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="218.204" y1="350.6849" x2="277.4307" y2="429.589" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="483.1659" y1="222.6849" x2="542.3927" y2="222.6849" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="483.1659" y1="441.863" x2="542.3927" y2="441.863" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="748.1279" y1="222.6849" x2="810.4718" y2="306.8493" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="748.1279" y1="441.863" x2="810.4718" y2="350.6849" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1013.0898" y1="327.8904" x2="1072.3166" y2="327.8904" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="911.7808" y1="376.9863" x2="935.1598" y2="557.589" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.793 4.6758" marker-end="url(#arrow)" />
</svg>
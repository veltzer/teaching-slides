<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.9999" y="40" text-anchor="middle" font-size="27.8519" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Feature Engineering Pipeline</text>
  <rect x="40" y="261.7647" width="173.6842" height="102.353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="126.842" y="304.4118" text-anchor="middle" font-size="18.568" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Raw Data</text>
  <text x="126.842" y="330" text-anchor="middle" font-size="15.4733" fill="var(--text-muted)" font-family="Arial, sans-serif">DataFrame</text>
  <rect x="276.8421" y="125.2941" width="189.4737" height="93.8235" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="371.5789" y="164.5294" text-anchor="middle" font-size="18.568" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">StringIndexer</text>
  <text x="371.5789" y="193.5294" text-anchor="middle" font-size="15.4733" fill="var(--text-muted)" font-family="Arial, sans-serif">Categorical cols</text>
  <rect x="513.6842" y="125.2941" width="189.4737" height="93.8235" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="608.4211" y="164.5294" text-anchor="middle" font-size="18.568" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">OneHotEncoder</text>
  <text x="608.4211" y="193.5294" text-anchor="middle" font-size="15.4733" fill="var(--text-muted)" font-family="Arial, sans-serif">Binary vectors</text>
  <rect x="276.8421" y="415.2941" width="189.4737" height="93.8235" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="371.5789" y="454.5294" text-anchor="middle" font-size="18.568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">StandardScaler</text>
  <text x="371.5789" y="483.5294" text-anchor="middle" font-size="15.4733" fill="var(--text-muted)" font-family="Arial, sans-serif">Numeric cols</text>
  <rect x="513.6842" y="415.2941" width="189.4737" height="93.8235" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="608.4211" y="454.5294" text-anchor="middle" font-size="18.568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">PCA</text>
  <text x="608.4211" y="483.5294" text-anchor="middle" font-size="15.4733" fill="var(--text-muted)" font-family="Arial, sans-serif">Dim reduction</text>
  <rect x="782.1052" y="253.2353" width="205.2632" height="110.8823" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.7368" y="299.2941" text-anchor="middle" font-size="18.568" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Vector</text>
  <text x="884.7368" y="326.5882" text-anchor="middle" font-size="18.568" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Assembler</text>
  <rect x="1050.5263" y="253.2353" width="189.4737" height="110.8823" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.2631" y="299.2941" text-anchor="middle" font-size="18.568" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Feature Vector</text>
  <text x="1145.2631" y="330" text-anchor="middle" font-size="15.4733" fill="var(--text-muted)" font-family="Arial, sans-serif">Ready for ML</text>
  <line x1="213.6842" y1="287.3529" x2="273.6842" y2="185" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="213.6842" y1="338.5294" x2="273.6842" y2="446" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="466.3158" y1="171.353" x2="510.5262" y2="171.353" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="466.3158" y1="461.3529" x2="510.5262" y2="461.3529" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="703.1578" y1="171.353" x2="782.1052" y2="282.2353" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="703.1578" y1="461.3529" x2="782.1052" y2="333.4118" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="987.3684" y1="307.8236" x2="1047.3684" y2="307.8236" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="639.9999" y="620" text-anchor="middle" font-size="18.568" fill="var(--text-muted)" font-family="Arial, sans-serif">Categorical path (top) and Numeric path (bottom) merge into a single feature vector</text>
</svg>

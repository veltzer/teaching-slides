<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="639.9999" y="40" text-anchor="middle" font-family="Arial" font-size="27.8519" font-weight="bold" fill="var(--primary-accent)">Feature Engineering Pipeline</text>
  <rect x="40" y="261.7647" width="173.6842" height="102.353" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="126.842" y="304.4118" text-anchor="middle" font-family="Arial" font-size="18.568" font-weight="bold" fill="var(--primary-accent)">Raw Data</text>
  <text x="126.842" y="330" text-anchor="middle" font-family="Arial" font-size="15.4733" fill="var(--text-muted)">DataFrame</text>
  <rect x="276.8421" y="125.2941" width="189.4737" height="93.8235" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="371.5789" y="164.5294" text-anchor="middle" font-family="Arial" font-size="18.568" font-weight="bold" fill="var(--warn-accent)">StringIndexer</text>
  <text x="371.5789" y="193.5294" text-anchor="middle" font-family="Arial" font-size="15.4733" fill="var(--text-muted)">Categorical cols</text>
  <rect x="513.6842" y="125.2941" width="189.4737" height="93.8235" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="608.4211" y="164.5294" text-anchor="middle" font-family="Arial" font-size="18.568" font-weight="bold" fill="var(--warn-accent)">OneHotEncoder</text>
  <text x="608.4211" y="193.5294" text-anchor="middle" font-family="Arial" font-size="15.4733" fill="var(--text-muted)">Binary vectors</text>
  <rect x="276.8421" y="415.2941" width="189.4737" height="93.8235" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="371.5789" y="454.5294" text-anchor="middle" font-family="Arial" font-size="18.568" font-weight="bold" fill="var(--ok-accent)">StandardScaler</text>
  <text x="371.5789" y="483.5294" text-anchor="middle" font-family="Arial" font-size="15.4733" fill="var(--text-muted)">Numeric cols</text>
  <rect x="513.6842" y="415.2941" width="189.4737" height="93.8235" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="608.4211" y="454.5294" text-anchor="middle" font-family="Arial" font-size="18.568" font-weight="bold" fill="var(--ok-accent)">PCA</text>
  <text x="608.4211" y="483.5294" text-anchor="middle" font-family="Arial" font-size="15.4733" fill="var(--text-muted)">Dim reduction</text>
  <rect x="782.1052" y="253.2353" width="205.2632" height="110.8823" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.7368" y="299.2941" text-anchor="middle" font-family="Arial" font-size="18.568" font-weight="bold" fill="var(--info-accent)">Vector</text>
  <text x="884.7368" y="326.5882" text-anchor="middle" font-family="Arial" font-size="18.568" font-weight="bold" fill="var(--info-accent)">Assembler</text>
  <rect x="1050.5263" y="253.2353" width="189.4737" height="110.8823" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.2631" y="299.2941" text-anchor="middle" font-family="Arial" font-size="18.568" font-weight="bold" fill="var(--ok-accent)">Feature Vector</text>
  <text x="1145.2631" y="330" text-anchor="middle" font-family="Arial" font-size="15.4733" fill="var(--text-muted)">Ready for ML</text>
  <line x1="213.6842" y1="287.3529" x2="273.6842" y2="185" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="213.6842" y1="338.5294" x2="273.6842" y2="446" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="466.3158" y1="171.353" x2="510.5262" y2="171.353" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="466.3158" y1="461.3529" x2="510.5262" y2="461.3529" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="703.1578" y1="171.353" x2="782.1052" y2="282.2353" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="703.1578" y1="461.3529" x2="782.1052" y2="333.4118" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="987.3684" y1="307.8236" x2="1047.3684" y2="307.8236" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="639.9999" y="620" text-anchor="middle" font-family="Arial" font-size="18.568" fill="var(--text-muted)">Categorical path (top) and Numeric path (bottom) merge into a single feature vector</text>
</svg>
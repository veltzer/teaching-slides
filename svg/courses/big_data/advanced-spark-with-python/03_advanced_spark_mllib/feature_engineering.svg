<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="615.015" y="51.8919" text-anchor="middle" font-family="Arial" font-size="27.6757" font-weight="bold" fill="var(--primary-accent)">Feature Engineering Pipeline</text>
  <rect x="30.7508" y="276.7568" width="169.1291" height="103.7838" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="115.3153" y="320" text-anchor="middle" font-family="Arial" font-size="18.4505" font-weight="bold" fill="var(--primary-accent)">Raw Data</text>
  <text x="115.3153" y="345.9459" text-anchor="middle" font-family="Arial" font-size="15.3754" fill="var(--text-muted)">DataFrame</text>
  <rect x="261.3814" y="138.3784" width="184.5045" height="95.1351" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="353.6336" y="178.1622" text-anchor="middle" font-family="Arial" font-size="18.4505" font-weight="bold" fill="var(--warn-accent)">StringIndexer</text>
  <text x="353.6336" y="207.5676" text-anchor="middle" font-family="Arial" font-size="15.3754" fill="var(--text-muted)">Categorical cols</text>
  <rect x="492.012" y="138.3784" width="184.5045" height="95.1351" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="584.2643" y="178.1622" text-anchor="middle" font-family="Arial" font-size="18.4505" font-weight="bold" fill="var(--warn-accent)">OneHotEncoder</text>
  <text x="584.2643" y="207.5676" text-anchor="middle" font-family="Arial" font-size="15.3754" fill="var(--text-muted)">Binary vectors</text>
  <rect x="261.3814" y="432.4324" width="184.5045" height="95.1351" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="353.6336" y="472.2162" text-anchor="middle" font-family="Arial" font-size="18.4505" font-weight="bold" fill="var(--ok-accent)">StandardScaler</text>
  <text x="353.6336" y="501.6216" text-anchor="middle" font-family="Arial" font-size="15.3754" fill="var(--text-muted)">Numeric cols</text>
  <rect x="492.012" y="432.4324" width="184.5045" height="95.1351" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="584.2643" y="472.2162" text-anchor="middle" font-family="Arial" font-size="18.4505" font-weight="bold" fill="var(--ok-accent)">PCA</text>
  <text x="584.2643" y="501.6216" text-anchor="middle" font-family="Arial" font-size="15.3754" fill="var(--text-muted)">Dim reduction</text>
  <rect x="753.3934" y="268.1081" width="199.8799" height="112.4324" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="853.3333" y="314.8108" text-anchor="middle" font-family="Arial" font-size="18.4505" font-weight="bold" fill="var(--info-accent)">Vector</text>
  <text x="853.3333" y="342.4865" text-anchor="middle" font-family="Arial" font-size="18.4505" font-weight="bold" fill="var(--info-accent)">Assembler</text>
  <rect x="1014.7748" y="268.1081" width="184.5045" height="112.4324" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1107.027" y="314.8108" text-anchor="middle" font-family="Arial" font-size="18.4505" font-weight="bold" fill="var(--ok-accent)">Feature Vector</text>
  <text x="1107.027" y="345.9459" text-anchor="middle" font-family="Arial" font-size="15.3754" fill="var(--text-muted)">Ready for ML</text>
  <line x1="199.8799" y1="302.7027" x2="258.3063" y2="198.9189" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="199.8799" y1="354.5946" x2="258.3063" y2="463.5676" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="445.8859" y1="185.0811" x2="488.9369" y2="185.0811" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="445.8859" y1="479.1351" x2="488.9369" y2="479.1351" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="676.5165" y1="185.0811" x2="753.3934" y2="297.5135" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="676.5165" y1="479.1351" x2="753.3934" y2="349.4054" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="953.2733" y1="323.4595" x2="1011.6997" y2="323.4595" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="615.015" y="640" text-anchor="middle" font-family="Arial" font-size="18.4505" fill="var(--text-muted)">Categorical path (top) and Numeric path (bottom) merge into a single feature vector</text>
</svg>
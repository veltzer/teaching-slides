<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="200.000008085612" width="173.6842" height="120.000064684897" rx="6.49668338817" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="126.842" y="250.000054577882" text-anchor="middle" font-size="20.105069525258" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Raw Data</text>
  <text x="126.842" y="280.000012128418" text-anchor="middle" font-size="16.754188511696" fill="var(--text-muted)" font-family="Arial, sans-serif">DataFrame</text>
  <rect x="276.8421" y="40" width="189.4737" height="109.999961593343" rx="6.49668338817" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="371.5789" y="86.000005255648" text-anchor="middle" font-size="20.105069525258" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">StringIndexer</text>
  <text x="371.5789" y="120.000004042806" text-anchor="middle" font-size="16.754188511696" fill="var(--text-muted)" font-family="Arial, sans-serif">Categorical cols</text>
  <rect x="513.6842" y="40" width="189.4737" height="109.999961593343" rx="6.49668338817" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="608.4211" y="86.000005255648" text-anchor="middle" font-size="20.105069525258" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">OneHotEncoder</text>
  <text x="608.4211" y="120.000004042806" text-anchor="middle" font-size="16.754188511696" fill="var(--text-muted)" font-family="Arial, sans-serif">Binary vectors</text>
  <rect x="276.8421" y="379.999987871582" width="189.4737" height="109.999961593343" rx="6.49668338817" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="371.5789" y="425.99999312723" text-anchor="middle" font-size="20.105069525258" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">StandardScaler</text>
  <text x="371.5789" y="459.999991914388" text-anchor="middle" font-size="16.754188511696" fill="var(--text-muted)" font-family="Arial, sans-serif">Numeric cols</text>
  <rect x="513.6842" y="379.999987871582" width="189.4737" height="109.999961593343" rx="6.49668338817" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="608.4211" y="425.99999312723" text-anchor="middle" font-size="20.105069525258" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">PCA</text>
  <text x="608.4211" y="459.999991914388" text-anchor="middle" font-size="16.754188511696" fill="var(--text-muted)" font-family="Arial, sans-serif">Dim reduction</text>
  <rect x="782.1052" y="190.000022235433" width="205.2632" height="129.9999332937" rx="6.49668338817" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.7368" y="243.999992722949" text-anchor="middle" font-size="20.105069525258" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Vector</text>
  <text x="884.7368" y="275.999970891796" text-anchor="middle" font-size="20.105069525258" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Assembler</text>
  <rect x="1050.5263" y="190.000022235433" width="189.4737" height="129.9999332937" rx="6.49668338817" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1145.2631" y="243.999992722949" text-anchor="middle" font-size="20.105069525258" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Feature Vector</text>
  <text x="1145.2631" y="280.000012128418" text-anchor="middle" font-size="16.754188511696" fill="var(--text-muted)" font-family="Arial, sans-serif">Ready for ML</text>
  <line x1="213.6842" y1="229.999965636149" x2="273.6842" y2="110.000018192627" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="213.6842" y1="289.999997978597" x2="273.6842" y2="416.000007277051" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="466.3158" y1="94.000087728891" x2="510.5262" y2="94.000087728891" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="466.3158" y1="433.999958359098" x2="510.5262" y2="433.999958359098" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="703.1578" y1="94.000087728891" x2="782.1052" y2="224.000021022591" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="703.1578" y1="433.999958359098" x2="782.1052" y2="284.00005336504" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="987.3684" y1="254.000095814503" x2="1047.3684" y2="254.000095814503" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="639.9999" y="620" text-anchor="middle" font-size="20.105069525258" fill="var(--text-muted)" font-family="Arial, sans-serif">Categorical path (top) and Numeric path (bottom) merge into a single feature vector</text>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">MLlib Architecture Overview</text>

  <!-- Top layer: Spark Core -->
  <rect x="50" y="50" width="700" height="50" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1565c0">Spark Core Engine</text>

  <!-- Middle layer: ML Pipeline API -->
  <rect x="50" y="120" width="700" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#2e7d32">ML Pipeline API (spark.ml)</text>

  <!-- Component boxes -->
  <rect x="50" y="190" width="160" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="130" y="220" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Transformers</text>
  <text x="130" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Feature extraction</text>

  <rect x="230" y="190" width="160" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="310" y="220" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Estimators</text>
  <text x="310" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Model training</text>

  <rect x="410" y="190" width="160" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="490" y="220" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Evaluators</text>
  <text x="490" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Model evaluation</text>

  <rect x="590" y="190" width="160" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="670" y="220" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Persistence</text>
  <text x="670" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Save / Load models</text>

  <!-- Arrows from pipeline to components -->
  <line x1="130" y1="170" x2="130" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="170" x2="310" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="170" x2="490" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="170" x2="670" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom layer: Algorithms -->
  <rect x="50" y="285" width="220" height="50" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="160" y="315" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Classification / Regression</text>

  <rect x="290" y="285" width="220" height="50" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="400" y="315" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Clustering / Recommendation</text>

  <rect x="530" y="285" width="220" height="50" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="640" y="315" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Feature Engineering</text>

  <!-- Bottom: DataFrames -->
  <rect x="150" y="355" width="500" height="40" rx="8" fill="#e0f7fa" stroke="#00695c" stroke-width="2"/>
  <text x="400" y="380" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#00695c">DataFrame API (Distributed Data)</text>
</svg>

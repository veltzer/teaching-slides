<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="576.09" y="48.6076" text-anchor="middle" font-family="Arial" font-size="25.9241" font-weight="bold" fill="var(--primary-accent)">MLlib Architecture Overview</text>
  <rect x="72.0113" y="81.0127" width="1008.1575" height="81.0127" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="576.09" y="129.6203" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--primary-accent)">Spark Core Engine</text>
  <rect x="72.0113" y="194.4304" width="1008.1575" height="81.0127" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="576.09" y="243.038" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--ok-accent)">ML Pipeline API (spark.ml)</text>
  <rect x="72.0113" y="307.8481" width="230.436" height="113.4177" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="187.2293" y="356.4557" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--warn-accent)">Transformers</text>
  <text x="187.2293" y="388.8608" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text-muted)">Feature extraction</text>
  <rect x="331.2518" y="307.8481" width="230.436" height="113.4177" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="446.4698" y="356.4557" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--warn-accent)">Estimators</text>
  <text x="446.4698" y="388.8608" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text-muted)">Model training</text>
  <rect x="590.4923" y="307.8481" width="230.436" height="113.4177" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="705.7103" y="356.4557" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--warn-accent)">Evaluators</text>
  <text x="705.7103" y="388.8608" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text-muted)">Model evaluation</text>
  <rect x="849.7328" y="307.8481" width="230.436" height="113.4177" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="964.9508" y="356.4557" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--warn-accent)">Persistence</text>
  <text x="964.9508" y="388.8608" text-anchor="middle" font-family="Arial" font-size="15.8425" fill="var(--text-muted)">Save / Load models</text>
  <line x1="187.2293" y1="275.443" x2="187.2293" y2="304.6076" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="446.4698" y1="275.443" x2="446.4698" y2="304.6076" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="705.7103" y1="275.443" x2="705.7103" y2="304.6076" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="964.9508" y1="275.443" x2="964.9508" y2="304.6076" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="72.0113" y="461.7722" width="316.8495" height="81.0127" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="230.436" y="510.3797" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--info-accent)">Classification / Regression</text>
  <rect x="417.6653" y="461.7722" width="316.8495" height="81.0127" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="576.09" y="510.3797" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--info-accent)">Clustering / Recommendation</text>
  <rect x="763.3193" y="461.7722" width="316.8495" height="81.0127" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" />
  <text x="921.744" y="510.3797" text-anchor="middle" font-family="Arial" font-size="18.7229" font-weight="bold" fill="var(--info-accent)">Feature Engineering</text>
  <rect x="216.0338" y="575.1899" width="720.1125" height="64.8101" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="576.09" y="615.6962" text-anchor="middle" font-family="Arial" font-size="20.1632" font-weight="bold" fill="var(--ok-accent)">DataFrame API (Distributed Data)</text>
</svg>
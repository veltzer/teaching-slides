<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="84.058030812863" rx="6.171463517385" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="90.434755009448" text-anchor="middle" font-size="22.407761169824" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Spark Core Engine</text>
  <rect x="40" y="157.681095022045" width="1200" height="84.058030812863" rx="6.171463517385" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="208.115955828609" text-anchor="middle" font-size="22.407761169824" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ML Pipeline API (spark.ml)</text>
  <rect x="40" y="275.362295841207" width="274.2857" height="117.681200819162" rx="6.171463517385" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.1429" y="325.797050850654" text-anchor="middle" font-size="20.80719210659" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Transformers</text>
  <text x="177.1429" y="359.42032665407" text-anchor="middle" font-size="17.606053980122" fill="var(--text-muted)" font-family="Arial, sans-serif">Feature extraction</text>
  <rect x="348.5714" y="275.362295841207" width="274.2857" height="117.681200819162" rx="6.171463517385" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.7143" y="325.797050850654" text-anchor="middle" font-size="20.80719210659" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Estimators</text>
  <text x="485.7143" y="359.42032665407" text-anchor="middle" font-size="17.606053980122" fill="var(--text-muted)" font-family="Arial, sans-serif">Model training</text>
  <rect x="657.1429" y="275.362295841207" width="274.2857" height="117.681200819162" rx="6.171463517385" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="794.2857" y="325.797050850654" text-anchor="middle" font-size="20.80719210659" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Evaluators</text>
  <text x="794.2857" y="359.42032665407" text-anchor="middle" font-size="17.606053980122" fill="var(--text-muted)" font-family="Arial, sans-serif">Model evaluation</text>
  <rect x="965.7143" y="275.362295841207" width="274.2857" height="117.681200819162" rx="6.171463517385" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102.8571" y="325.797050850654" text-anchor="middle" font-size="20.80719210659" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Persistence</text>
  <text x="1102.8571" y="359.42032665407" text-anchor="middle" font-size="17.606053980122" fill="var(--text-muted)" font-family="Arial, sans-serif">Save / Load models</text>
  <line x1="177.1429" y1="241.739020037792" x2="177.1429" y2="271.999957681153" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485.7143" y1="241.739020037792" x2="485.7143" y2="271.999957681153" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="794.2857" y1="241.739020037792" x2="794.2857" y2="271.999957681153" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1102.8571" y1="241.739020037792" x2="1102.8571" y2="271.999957681153" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="435.072459168241" width="377.1429" height="84.058030812863" rx="6.171463517385" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="228.5714" y="485.507214177689" text-anchor="middle" font-size="20.80719210659" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Classification / Regression</text>
  <rect x="451.4286" y="435.072459168241" width="377.1429" height="84.058030812863" rx="6.171463517385" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="485.507214177689" text-anchor="middle" font-size="20.80719210659" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Clustering / Recommendation</text>
  <rect x="862.8571" y="435.072459168241" width="377.1429" height="84.058030812863" rx="6.171463517385" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.4285" y="485.507214177689" text-anchor="middle" font-size="20.80719210659" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Feature Engineering</text>
  <rect x="211.4286" y="552.753659987403" width="857.1429" height="67.246340012597" rx="6.171463517385" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="594.782622495276" text-anchor="middle" font-size="22.407761169824" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">DataFrame API (Distributed Data)</text>
</svg>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#1a237e">Neural Network Architecture</text>

  <!-- Input layer -->
  <text x="100" y="60" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#1565c0">Input Layer</text>
  <circle cx="100" cy="100" r="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" font-family="Arial" font-size="10" fill="#1565c0">x1</text>
  <circle cx="100" cy="170" r="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#1565c0">x2</text>
  <circle cx="100" cy="240" r="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="100" y="245" text-anchor="middle" font-family="Arial" font-size="10" fill="#1565c0">x3</text>
  <circle cx="100" cy="310" r="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="100" y="315" text-anchor="middle" font-family="Arial" font-size="10" fill="#1565c0">x4</text>

  <!-- Hidden layer 1 -->
  <text x="300" y="60" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#2e7d32">Hidden Layer 1</text>
  <circle cx="300" cy="120" r="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="300" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">h1</text>
  <circle cx="300" cy="200" r="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="300" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">h2</text>
  <circle cx="300" cy="280" r="22" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="300" y="285" text-anchor="middle" font-family="Arial" font-size="10" fill="#2e7d32">h3</text>

  <!-- Hidden layer 2 -->
  <text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#e65100">Hidden Layer 2</text>
  <circle cx="500" cy="140" r="22" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="500" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="#e65100">h4</text>
  <circle cx="500" cy="230" r="22" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="500" y="235" text-anchor="middle" font-family="Arial" font-size="10" fill="#e65100">h5</text>

  <!-- Output layer -->
  <text x="700" y="60" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#6a1b9a">Output Layer</text>
  <circle cx="700" cy="190" r="22" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="700" y="195" text-anchor="middle" font-family="Arial" font-size="10" fill="#6a1b9a">y</text>

  <!-- Connections input to hidden1 -->
  <line x1="122" y1="100" x2="278" y2="120" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="100" x2="278" y2="200" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="100" x2="278" y2="280" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="170" x2="278" y2="120" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="170" x2="278" y2="200" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="170" x2="278" y2="280" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="240" x2="278" y2="120" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="240" x2="278" y2="200" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="240" x2="278" y2="280" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="310" x2="278" y2="120" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="310" x2="278" y2="200" stroke="#90caf9" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="310" x2="278" y2="280" stroke="#90caf9" stroke-width="1" opacity="0.6"/>

  <!-- Connections hidden1 to hidden2 -->
  <line x1="322" y1="120" x2="478" y2="140" stroke="#a5d6a7" stroke-width="1" opacity="0.6"/>
  <line x1="322" y1="120" x2="478" y2="230" stroke="#a5d6a7" stroke-width="1" opacity="0.6"/>
  <line x1="322" y1="200" x2="478" y2="140" stroke="#a5d6a7" stroke-width="1" opacity="0.6"/>
  <line x1="322" y1="200" x2="478" y2="230" stroke="#a5d6a7" stroke-width="1" opacity="0.6"/>
  <line x1="322" y1="280" x2="478" y2="140" stroke="#a5d6a7" stroke-width="1" opacity="0.6"/>
  <line x1="322" y1="280" x2="478" y2="230" stroke="#a5d6a7" stroke-width="1" opacity="0.6"/>

  <!-- Connections hidden2 to output -->
  <line x1="522" y1="140" x2="678" y2="190" stroke="#ce93d8" stroke-width="1.5" opacity="0.7"/>
  <line x1="522" y1="230" x2="678" y2="190" stroke="#ce93d8" stroke-width="1.5" opacity="0.7"/>

  <!-- Activation labels -->
  <text x="200" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">ReLU activation</text>
  <text x="400" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">ReLU activation</text>
  <text x="600" y="380" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">Sigmoid / Softmax</text>
</svg>

  <circle cx="700" cy="200" r="15" fill="#e599f7" opacity="0.4"/>
  <rect x="695" y="160" width="10" height="15" fill="#e599f7" opacity="0.6" rx="2"/>
  <rect x="695" y="225" width="10" height="15" fill="#e599f7" opacity="0.6" rx="2"/>
  <rect x="660" y="195" width="15" height="10" fill="#e599f7" opacity="0.6" rx="2"/>
  <rect x="725" y="195" width="15" height="10" fill="#e599f7" opacity="0.6" rx="2"/>
  <!-- Title text -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">ADVANCED SPARK WITH PYTHON</text>

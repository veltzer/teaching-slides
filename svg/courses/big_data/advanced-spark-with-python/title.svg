  <polygon points="380,40 340,180 390,180 350,360 430,160 380,160 420,40" fill="#e8590c" opacity="0.9"/>
  <!-- Data nodes cluster -->
  <circle cx="150" cy="100" r="30" fill="#f76707" opacity="0.7"/>
  <circle cx="650" cy="100" r="30" fill="#f76707" opacity="0.7"/>
  <circle cx="150" cy="300" r="30" fill="#f76707" opacity="0.7"/>
  <circle cx="650" cy="300" r="30" fill="#f76707" opacity="0.7"/>
  <!-- Connection lines -->
  <line x1="180" y1="100" x2="340" y2="180" stroke="#f76707" stroke-width="2" opacity="0.4"/>
  <line x1="620" y1="100" x2="430" y2="160" stroke="#f76707" stroke-width="2" opacity="0.4"/>
  <line x1="180" y1="300" x2="350" y2="260" stroke="#f76707" stroke-width="2" opacity="0.4"/>
  <line x1="620" y1="300" x2="430" y2="260" stroke="#f76707" stroke-width="2" opacity="0.4"/>
  <!-- Python snake symbol -->

  <line x1="881.7778" y1="480" x2="611.5556" y2="416" stroke="var(--warn-border)" stroke-width="2" opacity="0.4" />
  <path d="M 113.7778 288 Q 113.7778 256 142.2222 256 L 184.8889 256 Q 213.3333 256 213.3333 288 L 213.3333 336 Q 213.3333 368 184.8889 368 L 142.2222 368 Q 113.7778 368 113.7778 336 Z" fill="var(--info-fill)" opacity="0.8" />
  <path d="M 128 272 Q 128 264 135.1111 264 L 156.4444 264 Q 163.5556 264 163.5556 272 L 163.5556 280 Q 163.5556 288 156.4444 288 L 135.1111 288 Q 128 288 128 280 Z" fill="var(--warn-fill)" opacity="0.9" />

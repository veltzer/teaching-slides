<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <polygon points="609.9999,98 550,301 625,301 565,562 685,272 609.9999,272 670,98" fill="var(--warn-accent)" opacity="0.9" />
  <circle cx="265" cy="185" r="41.7133" fill="var(--warn-accent)" opacity="0.7" />
  <circle cx="1014.9999" cy="185" r="41.7133" fill="var(--warn-accent)" opacity="0.7" />
  <circle cx="265" cy="475" r="41.7133" fill="var(--warn-accent)" opacity="0.7" />
  <circle cx="1014.9999" cy="475" r="41.7133" fill="var(--warn-accent)" opacity="0.7" />
  <line x1="310" y1="185" x2="550" y2="301" stroke="var(--warn-border)" stroke-width="2" opacity="0.4" />
  <line x1="970" y1="185" x2="685" y2="272" stroke="var(--warn-border)" stroke-width="2" opacity="0.4" />
  <line x1="310" y1="475" x2="565" y2="417" stroke="var(--warn-border)" stroke-width="2" opacity="0.4" />
  <line x1="970" y1="475" x2="685" y2="417" stroke="var(--warn-border)" stroke-width="2" opacity="0.4" />
  <path d="M 160 301 Q 160 272 190 272 L 235 272 Q 265 272 265 301 L 265 344.5 Q 265 373.5 235 373.5 L 190 373.5 Q 160 373.5 160 344.5 Z" fill="var(--info-fill)" opacity="0.8" />
  <path d="M 175 286.5 Q 175 279.25 182.5 279.25 L 204.9999 279.25 Q 212.5 279.25 212.5 286.5 L 212.5 293.75 Q 212.5 301 204.9999 301 L 182.5 301 Q 175 301 175 293.75 Z" fill="var(--warn-fill)" opacity="0.9" />
  <circle cx="1090" cy="330" r="48.6655" fill="none" stroke="var(--info-border)" stroke-width="5.6889" opacity="0.6" />
  <circle cx="1090" cy="330" r="20.8566" fill="var(--info-fill)" opacity="0.4" />
  <rect x="1082.4999" y="272" width="15" height="21.75" fill="url(#grad-info)" opacity="0.6" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1082.4999" y="366.25" width="15" height="21.75" fill="url(#grad-info)" opacity="0.6" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1030" y="322.75" width="22.5" height="14.5" fill="url(#grad-info)" opacity="0.6" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1127.5" y="322.75" width="22.5" height="14.5" fill="url(#grad-info)" opacity="0.6" rx="6" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="605.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.028" fill="var(--border)" letter-spacing="3">ADVANCED SPARK WITH PYTHON</text>
</svg>
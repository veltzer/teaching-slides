<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Data Sources -->
  <rect x="60" y="50" width="240" height="70" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Data Sources</text>
  <!-- Feature Engineering -->
  <rect x="430" y="50" width="280" height="70" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">Feature Engineering</text>
  <!-- Algorithm Selection -->
  <rect x="850" y="50" width="280" height="70" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">Algorithm Selection</text>
  <!-- Model Training -->
  <rect x="850" y="195" width="280" height="70" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Model Training</text>
  <!-- Model Evaluation -->
  <rect x="850" y="340" width="280" height="70" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c62828">Model Evaluation</text>
  <!-- Prediction -->
  <rect x="850" y="485" width="280" height="70" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="990" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Prediction</text>
  <!-- Model Tuning (feedback loop) -->
  <rect x="430" y="340" width="280" height="70" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">Model Tuning</text>
  <!-- Arrows -->
  <line x1="300" y1="85" x2="430" y2="85" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="85" x2="850" y2="85" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="120" x2="990" y2="195" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="265" x2="990" y2="340" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="410" x2="990" y2="485" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Model Evaluation feeds Model Tuning -->
  <line x1="850" y1="375" x2="710" y2="375" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Model Tuning feeds back to Model Training -->
  <path d="M 570 340 Q 570 230 850 230" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="269.158879" height="80.396047" rx="7.835828" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="174.579439" y="88.237571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--primary-accent)">Data Sources</text>
  <rect x="454.953271" y="40" width="314.018692" height="80.396047" rx="7.835828" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="611.962617" y="88.237571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--ok-accent)">Feature Engineering</text>
  <rect x="925.981308" y="40" width="314.018692" height="80.396047" rx="7.835828" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.990654" y="88.237571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--warn-accent)">Algorithm Selection</text>
  <rect x="925.981308" y="206.534556" width="314.018692" height="80.396047" rx="7.835828" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1082.990654" y="254.77227" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--primary-accent)">Model Training</text>
  <rect x="925.981308" y="373.069255" width="314.018692" height="80.396047" rx="7.835828" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.990654" y="421.306826" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--danger-accent)">Model Evaluation</text>
  <rect x="925.981308" y="539.603953" width="314.018692" height="80.396047" rx="7.835828" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1082.990654" y="587.841524" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--bg)">Prediction</text>
  <rect x="454.953271" y="373.069255" width="314.018692" height="80.396047" rx="7.835828" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="611.962617" y="421.306826" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--warn-accent)">Model Tuning</text>
  <line x1="309.158998" y1="80.197952" x2="454.953271" y2="80.197952" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)"/>
  <line x1="768.971963" y1="80.197952" x2="925.981308" y2="80.197952" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)"/>
  <line x1="1082.990654" y1="120.395904" x2="1082.990654" y2="206.534556" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)"/>
  <line x1="1082.990654" y1="286.930603" x2="1082.990654" y2="373.069255" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)"/>
  <line x1="1082.990654" y1="453.465301" x2="1082.990654" y2="539.603953" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)"/>
  <line x1="925.981308" y1="413.267207" x2="768.971963" y2="413.267207" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)"/>
  <path d="M 611.962617 373.069255 Q 611.962617 246.732651 925.981308 246.732651" fill="none" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)"/>
</svg>

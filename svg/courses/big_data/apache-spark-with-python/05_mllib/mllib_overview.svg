<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="963.7647" height="542.1176" fill="var(--bg)" rx="6"/>
  <rect x="45.1765" y="37.6471" width="180.7059" height="52.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="135.5294" y="69.2706" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5529" font-weight="bold" fill="var(--primary-accent)">Data Sources</text>
  <rect x="323.7647" y="37.6471" width="210.8235" height="52.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="429.1765" y="69.2706" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5529" font-weight="bold" fill="var(--ok-accent)">Feature Engineering</text>
  <rect x="640" y="37.6471" width="210.8235" height="52.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="745.4118" y="69.2706" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5529" font-weight="bold" fill="var(--warn-accent)">Algorithm Selection</text>
  <rect x="640" y="146.8235" width="210.8235" height="52.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="745.4118" y="178.4471" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5529" font-weight="bold" fill="var(--primary-accent)">Model Training</text>
  <rect x="640" y="256" width="210.8235" height="52.7059" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="745.4118" y="287.6235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5529" font-weight="bold" fill="var(--danger-accent)">Model Evaluation</text>
  <rect x="640" y="365.1765" width="210.8235" height="52.7059" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="745.4118" y="396.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5529" font-weight="bold" fill="var(--bg)">Prediction</text>
  <rect x="323.7647" y="256" width="210.8235" height="52.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="429.1765" y="287.6235" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5529" font-weight="bold" fill="var(--warn-accent)">Model Tuning</text>
  <line x1="225.8824" y1="64" x2="323.7647" y2="64" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="534.5882" y1="64" x2="640" y2="64" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="745.4118" y1="90.3529" x2="745.4118" y2="146.8235" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="745.4118" y1="199.5294" x2="745.4118" y2="256" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="745.4118" y1="308.7059" x2="745.4118" y2="365.1765" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="640" y1="282.3529" x2="534.5882" y2="282.3529" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <path d="M 429.1765 256 Q 429.1765 173.1765 640 173.1765" fill="none" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
</svg>
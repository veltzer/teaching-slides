<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="269.158879" height="80.396047" rx="7.835828" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="174.579439" y="88.237571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--primary-accent)">Data Sources</text>
  <rect x="454.953271" y="40" width="314.018692" height="80.396047" rx="7.835828" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="611.962617" y="88.237571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--ok-accent)">Feature Engineering</text>
  <rect x="925.981308" y="40" width="314.018692" height="80.396047" rx="7.835828" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1082.990654" y="88.237571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--warn-accent)">Algorithm Selection</text>
  <rect x="925.981308" y="206.534556" width="314.018692" height="80.396047" rx="7.835828" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1082.990654" y="254.77227" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--primary-accent)">Model Training</text>
  <rect x="925.981308" y="373.069255" width="314.018692" height="80.396047" rx="7.835828" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1082.990654" y="421.306826" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--danger-accent)">Model Evaluation</text>
  <rect x="925.981308" y="539.603953" width="314.018692" height="80.396047" rx="7.835828" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1082.990654" y="587.841524" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--bg)">Prediction</text>
  <rect x="454.953271" y="373.069255" width="314.018692" height="80.396047" rx="7.835828" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="611.962617" y="421.306826" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.428525" font-weight="bold" fill="var(--warn-accent)">Model Tuning</text>
  <line x1="309.158998" y1="80.197952" x2="454.953271" y2="80.197952" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="768.971963" y1="80.197952" x2="925.981308" y2="80.197952" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="1082.990654" y1="120.395904" x2="1082.990654" y2="206.534556" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="1082.990654" y1="286.930603" x2="1082.990654" y2="373.069255" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="1082.990654" y1="453.465301" x2="1082.990654" y2="539.603953" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <line x1="925.981308" y1="413.267207" x2="768.971963" y2="413.267207" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
  <path d="M 611.962617 373.069255 Q 611.962617 246.732651 925.981308 246.732651" fill="none" stroke="var(--text-muted)" stroke-width="1.5059" marker-end="url(#arrow)" />
</svg>
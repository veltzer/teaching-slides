<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="266.666667" height="90.980359" rx="7.761141" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="173.333333" y="93.450841" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--primary-accent)">Data Sources</text>
  <rect x="484.444444" y="40" width="344.444444" height="90.980359" rx="7.761141" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="656.666667" y="83.215543" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--ok-accent)">DataFrame /</text>
  <text x="656.666667" y="110.509764" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--ok-accent)">Dataset API</text>
  <rect x="484.444444" y="193.529462" width="344.444444" height="90.980359" rx="7.761141" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="656.666667" y="246.980302" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--warn-accent)">SQL Interface</text>
  <rect x="484.444444" y="364.117705" width="344.444444" height="90.980359" rx="7.761141" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="656.666667" y="417.568687" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--primary-accent)">Catalyst Optimizer</text>
  <rect x="484.444444" y="529.019641" width="344.444444" height="90.980359" rx="7.761141" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="656.666667" y="582.470764" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--danger-accent)">Optimized RDD</text>
  <rect x="951.111111" y="529.019641" width="288.888889" height="90.980359" rx="7.761141" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1095.555556" y="582.470764" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--bg)">Execution</text>
  <line x1="306.666667" y1="85.490038" x2="484.444444" y2="85.490038" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="306.666667" y1="102.54882" x2="395.555556" y2="153.725307" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="395.555556" y1="153.725307" x2="395.555556" y2="239.0195" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="395.555556" y1="239.0195" x2="484.444444" y2="239.0195" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="656.666667" y1="130.980359" x2="656.666667" y2="364.117705" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="656.666667" y1="284.509821" x2="656.666667" y2="364.117705" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="656.666667" y1="455.098064" x2="656.666667" y2="529.019641" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="828.88877" y1="574.509821" x2="951.111111" y2="574.509821" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
</svg>
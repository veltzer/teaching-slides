<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Data Sources (left) -->
  <rect x="60" y="40" width="240" height="80" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Data Sources</text>
  <!-- DataFrame / Dataset API -->
  <rect x="460" y="40" width="310" height="80" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">DataFrame /</text>
  <text x="615" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">Dataset API</text>
  <!-- SQL Interface -->
  <rect x="460" y="175" width="310" height="80" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">SQL Interface</text>
  <!-- Catalyst Optimizer -->
  <rect x="460" y="325" width="310" height="80" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Catalyst Optimizer</text>
  <!-- Optimized RDD -->
  <rect x="460" y="470" width="310" height="80" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="615" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c62828">Optimized RDD</text>
  <!-- Execution (right) -->
  <rect x="880" y="470" width="260" height="80" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1010" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Execution</text>
  <!-- Arrows -->
  <line x1="300" y1="80" x2="460" y2="80" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Data source also feeds SQL interface via connector -->
  <line x1="300" y1="95" x2="380" y2="140" stroke="#555555" stroke-width="1.5"/>
  <line x1="380" y1="140" x2="380" y2="215" stroke="#555555" stroke-width="1.5"/>
  <line x1="380" y1="215" x2="460" y2="215" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- DataFrame/Dataset to Catalyst -->
  <line x1="615" y1="120" x2="615" y2="325" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- SQL to Catalyst -->
  <line x1="615" y1="255" x2="615" y2="325" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Catalyst to Optimized RDD -->
  <line x1="615" y1="405" x2="615" y2="470" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Optimized RDD to Execution -->
  <line x1="770" y1="510" x2="880" y2="510" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

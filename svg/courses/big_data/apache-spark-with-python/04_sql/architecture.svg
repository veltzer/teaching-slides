<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="266.666667" height="90.980359" rx="7.761141" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="173.333333" y="93.450841" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--primary-accent)">Data Sources</text>
  <rect x="484.444444" y="40" width="344.444444" height="90.980359" rx="7.761141" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.666667" y="83.215543" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--ok-accent)">DataFrame /</text>
  <text x="656.666667" y="110.509764" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--ok-accent)">Dataset API</text>
  <rect x="484.444444" y="193.529462" width="344.444444" height="90.980359" rx="7.761141" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.666667" y="246.980302" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--warn-accent)">SQL Interface</text>
  <rect x="484.444444" y="364.117705" width="344.444444" height="90.980359" rx="7.761141" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="656.666667" y="417.568687" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--primary-accent)">Catalyst Optimizer</text>
  <rect x="484.444444" y="529.019641" width="344.444444" height="90.980359" rx="7.761141" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="656.666667" y="582.470764" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--danger-accent)">Optimized RDD</text>
  <rect x="951.111111" y="529.019641" width="288.888889" height="90.980359" rx="7.761141" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.555556" y="582.470764" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.233942" font-weight="bold" fill="var(--bg)">Execution</text>
  <line x1="306.666667" y1="85.490038" x2="484.444444" y2="85.490038" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="306.666667" y1="102.54882" x2="395.555556" y2="153.725307" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="395.555556" y1="153.725307" x2="395.555556" y2="239.0195" stroke="var(--text-muted)" stroke-width="1.3333" />
  <line x1="395.555556" y1="239.0195" x2="484.444444" y2="239.0195" stroke="var(--text-muted)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="656.666667" y1="130.980359" x2="656.666667" y2="364.117705" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="656.666667" y1="284.509821" x2="656.666667" y2="364.117705" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="656.666667" y1="455.098064" x2="656.666667" y2="529.019641" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="828.88877" y1="574.509821" x2="951.111111" y2="574.509821" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
</svg>
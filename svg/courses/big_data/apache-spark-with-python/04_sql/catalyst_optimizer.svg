<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="91.063831" y="40" width="1021.276593" height="66.123806" rx="10.722336" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="601.702127" y="79.674237" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.506976" font-weight="bold" fill="var(--primary-accent)">SQL / DataFrame Query</text>
  <rect x="40" y="148.631959" width="1123.404254" height="66.123806" rx="10.722336" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="601.702127" y="188.306196" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.506976" font-weight="bold" fill="var(--warn-accent)">Unresolved Logical Plan</text>
  <rect x="40" y="255.374563" width="1123.404254" height="66.123806" rx="10.722336" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="601.702127" y="295.048917" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.506976" font-weight="bold" fill="var(--ok-accent)">Resolved Logical Plan</text>
  <rect x="40" y="362.117284" width="1123.404254" height="66.123806" rx="10.722336" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="601.702127" y="401.791521" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.506976" font-weight="bold" fill="var(--primary-accent)">Optimized Logical Plan</text>
  <rect x="91.063831" y="468.860005" width="1021.276593" height="66.123806" rx="10.722336" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="601.702127" y="508.534359" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.506976" font-weight="bold" fill="var(--danger-accent)">Physical Plan</text>
  <rect x="193.191489" y="563.322502" width="817.021004" height="56.677498" rx="10.722336" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="601.702127" y="598.273702" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.954024" font-weight="bold" fill="var(--bg)">Best Plan (RDD)</text>
  <line x1="601.702127" y1="106.123806" x2="601.702127" y2="148.631959" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="601.702127" y1="214.755648" x2="601.702127" y2="255.374563" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="601.702127" y1="321.498487" x2="601.702127" y2="362.117284" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="601.702127" y1="428.24109" x2="601.702127" y2="468.860005" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="601.702127" y1="534.983694" x2="601.702127" y2="563.322502" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="1240" y="188.306196" font-family="Arial, sans-serif" font-size="21.741859" fill="var(--text-faint)" font-style="italic">Parsing</text>
  <text x="1240" y="295.048917" font-family="Arial, sans-serif" font-size="21.741859" fill="var(--text-faint)" font-style="italic">Analysis</text>
  <text x="1240" y="401.791521" font-family="Arial, sans-serif" font-size="21.741859" fill="var(--text-faint)" font-style="italic">Optimization</text>
  <text x="1240" y="508.534359" font-family="Arial, sans-serif" font-size="21.741859" fill="var(--text-faint)" font-style="italic">Planning</text>
  <text x="1240" y="598.273702" font-family="Arial, sans-serif" font-size="21.741859" fill="var(--text-faint)" font-style="italic">Execution</text>
</svg>
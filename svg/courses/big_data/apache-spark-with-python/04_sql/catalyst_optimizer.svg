<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Pipeline stages - vertical layout centered -->
  <!-- SQL / DataFrame input -->
  <rect x="440" y="30" width="400" height="70" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1565c0">SQL / DataFrame Query</text>
  <!-- Unresolved Logical Plan -->
  <rect x="420" y="145" width="440" height="70" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#e65100">Unresolved Logical Plan</text>
  <!-- Resolved Logical Plan -->
  <rect x="420" y="258" width="440" height="70" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#2e7d32">Resolved Logical Plan</text>
  <!-- Optimized Logical Plan -->
  <rect x="420" y="371" width="440" height="70" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1565c0">Optimized Logical Plan</text>
  <!-- Physical Plan -->
  <rect x="440" y="484" width="400" height="70" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#c62828">Physical Plan</text>
  <!-- Best Plan / RDD -->
  <rect x="480" y="584" width="320" height="60" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="621" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Best Plan (RDD)</text>
  <!-- Arrows -->
  <line x1="640" y1="100" x2="640" y2="145" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="215" x2="640" y2="258" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="328" x2="640" y2="371" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="441" x2="640" y2="484" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="554" x2="640" y2="584" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Stage annotations -->
  <text x="890" y="187" font-family="Arial, sans-serif" font-size="14" fill="#888888" font-style="italic">Parsing</text>
  <text x="890" y="300" font-family="Arial, sans-serif" font-size="14" fill="#888888" font-style="italic">Analysis</text>
  <text x="890" y="413" font-family="Arial, sans-serif" font-size="14" fill="#888888" font-style="italic">Optimization</text>
  <text x="890" y="526" font-family="Arial, sans-serif" font-size="14" fill="#888888" font-style="italic">Planning</text>
  <text x="890" y="621" font-family="Arial, sans-serif" font-size="14" fill="#888888" font-style="italic">Execution</text>
</svg>

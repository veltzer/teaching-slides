<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- == WHY PYTHON FOR SPARK == -->
  <rect x="60" y="30" width="1160" height="44" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">Why Python for Spark: readable syntax, rich ecosystem, PySpark native API, data science libs (pandas/numpy/scikit-learn)</text>

  <!-- == DATA TYPES SECTION == -->
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-dk)">Key Data Types</text>

  <!-- List -->
  <rect x="60" y="114" width="270" height="180" rx="8" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="195" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-dk)" text-anchor="middle">list  [ ]</text>
  <text x="80" y="158" font-family="monospace" font-size="12" fill="var(--text-dark)">nums = [1, 2, 3, 4, 5]</text>
  <text x="80" y="176" font-family="monospace" font-size="12" fill="var(--text-dark)">nums.append(6)</text>
  <text x="80" y="194" font-family="monospace" font-size="12" fill="var(--text-dark)">nums[0]  # -&gt; 1</text>
  <text x="80" y="212" font-family="monospace" font-size="12" fill="var(--text-dark)">nums[1:3]  # -&gt; [2,3]</text>
  <text x="80" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">Spark: RDD is like a</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">distributed list</text>
  <text x="80" y="268" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Ordered, mutable, allows dupes</text>
  <text x="80" y="284" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">O(1) append, O(n) search</text>

  <!-- Dict -->
  <rect x="350" y="114" width="270" height="180" rx="8" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="485" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-dk)" text-anchor="middle">dict  &#x7b; &#x7d;</text>
  <text x="370" y="158" font-family="monospace" font-size="12" fill="var(--text-dark)">d = {"name": "Alice"}</text>
  <text x="370" y="176" font-family="monospace" font-size="12" fill="var(--text-dark)">d["age"] = 30</text>
  <text x="370" y="194" font-family="monospace" font-size="12" fill="var(--text-dark)">d.get("age", 0)</text>
  <text x="370" y="212" font-family="monospace" font-size="12" fill="var(--text-dark)">d.keys() / d.values()</text>
  <text x="370" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">Spark: Row objects are</text>
  <text x="370" y="250" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">dict-like in DataFrames</text>
  <text x="370" y="268" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Key-value, O(1) lookup</text>
  <text x="370" y="284" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">JSON-like, flexible schema</text>

  <!-- Tuple -->
  <rect x="640" y="114" width="270" height="180" rx="8" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="775" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-mid)" text-anchor="middle">tuple  ( )</text>
  <text x="660" y="158" font-family="monospace" font-size="12" fill="var(--text-dark)">t = (1, "hello", 3.14)</text>
  <text x="660" y="176" font-family="monospace" font-size="12" fill="var(--text-dark)">x, y, z = t  # unpack</text>
  <text x="660" y="194" font-family="monospace" font-size="12" fill="var(--text-dark)">t[0]  # -&gt; 1</text>
  <text x="660" y="212" font-family="monospace" font-size="12" fill="var(--text-dark)">t + (4,)  # concatenate</text>
  <text x="660" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">Spark: key-value pairs</text>
  <text x="660" y="250" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">in PairRDDs are tuples</text>
  <text x="660" y="268" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Immutable, hashable</text>
  <text x="660" y="284" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Lighter than list</text>

  <!-- Set -->
  <rect x="930" y="114" width="306" height="180" rx="8" fill="var(--info-pale)" stroke="var(--info)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1083" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-dk)" text-anchor="middle">set  &#x7b; &#x7d;</text>
  <text x="950" y="158" font-family="monospace" font-size="12" fill="var(--text-dark)">s = {1, 2, 3, 2}  # -&gt; {1,2,3}</text>
  <text x="950" y="176" font-family="monospace" font-size="12" fill="var(--text-dark)">s.add(4)</text>
  <text x="950" y="194" font-family="monospace" font-size="12" fill="var(--text-dark)">s1 &amp; s2  # intersection</text>
  <text x="950" y="212" font-family="monospace" font-size="12" fill="var(--text-dark)">s1 | s2  # union</text>
  <text x="950" y="234" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)">Spark: distinct() is a</text>
  <text x="950" y="250" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)">distributed set operation</text>
  <text x="950" y="268" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">Unordered, unique elements</text>
  <text x="950" y="284" font-family="Arial, sans-serif" font-size="12" fill="var(--text-lighter)">O(1) membership test</text>

  <!-- == LIST COMPREHENSIONS + LAMBDA == -->
  <text x="60" y="322" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-muted)">List Comprehensions, Lambda, map/filter</text>

  <rect x="60" y="338" width="560" height="280" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1"/>

  <text x="80" y="362" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">List Comprehensions</text>
  <text x="80" y="382" font-family="monospace" font-size="12" fill="var(--text-dark)"># Traditional loop</text>
  <text x="80" y="398" font-family="monospace" font-size="12" fill="var(--text-dark)">squares = []</text>
  <text x="80" y="414" font-family="monospace" font-size="12" fill="var(--text-dark)">for x in range(10):</text>
  <text x="80" y="430" font-family="monospace" font-size="12" fill="var(--text-dark)">    squares.append(x**2)</text>

  <text x="80" y="454" font-family="monospace" font-size="12" fill="var(--ok-dk)"># List comprehension (Pythonic)</text>
  <text x="80" y="470" font-family="monospace" font-size="12" fill="var(--ok-dk)">squares = [x**2 for x in range(10)]</text>

  <text x="80" y="492" font-family="monospace" font-size="12" fill="var(--warn-mid)"># With condition</text>
  <text x="80" y="508" font-family="monospace" font-size="12" fill="var(--warn-mid)">evens = [x for x in range(10) if x%2==0]</text>

  <text x="80" y="530" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--primary-dk)">Lambda + map/filter (Spark transformations!)</text>
  <text x="80" y="548" font-family="monospace" font-size="12" fill="var(--text-dark)">double = lambda x: x * 2</text>
  <text x="80" y="564" font-family="monospace" font-size="12" fill="var(--text-dark)">list(map(double, [1,2,3]))   # -&gt; [2,4,6]</text>
  <text x="80" y="580" font-family="monospace" font-size="12" fill="var(--text-dark)">list(filter(lambda x: x&gt;2, [1,2,3,4])) # -&gt; [3,4]</text>
  <text x="80" y="598" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">In Spark: rdd.map(lambda x: x*2)  rdd.filter(lambda x: x&gt;0)</text>
  <text x="80" y="614" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Lambdas are serialized and sent to Spark executors!</text>

  <!-- Right: Function definitions + Spark connection -->
  <rect x="650" y="338" width="586" height="280" rx="8" fill="url(#grad-surface)" stroke="var(--border-faint)" stroke-width="1"/>

  <text x="670" y="362" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-dk)">Function Definitions</text>
  <text x="670" y="382" font-family="monospace" font-size="12" fill="var(--text-dark)">def greet(name: str, greeting: str = "Hello") -&gt; str:</text>
  <text x="670" y="398" font-family="monospace" font-size="12" fill="var(--text-dark)">    """Docstring: return a greeting."""</text>
  <text x="670" y="414" font-family="monospace" font-size="12" fill="var(--text-dark)">    return f"{greeting}, {name}!"</text>

  <text x="670" y="436" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-mid)">Type Hints (important for PySpark)</text>
  <text x="670" y="456" font-family="monospace" font-size="12" fill="var(--text-dark)">from typing import List, Dict, Optional</text>
  <text x="670" y="472" font-family="monospace" font-size="12" fill="var(--text-dark)">def process(rows: List[Dict]) -&gt; List[int]:</text>
  <text x="670" y="488" font-family="monospace" font-size="12" fill="var(--text-dark)">    return [r["age"] for r in rows]</text>

  <text x="670" y="510" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-dk)">Python -&gt; Spark Mapping</text>
  <text x="670" y="530" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">list            -&gt;  RDD / Column values</text>
  <text x="670" y="548" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">dict            -&gt;  DataFrame Row / schema</text>
  <text x="670" y="566" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">lambda/function -&gt;  UDF, map(), flatMap()</text>
  <text x="670" y="584" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">list comprehension -&gt; DataFrame select/transform</text>
  <text x="670" y="602" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">filter()        -&gt;  rdd.filter() / df.filter()</text>
  <text x="670" y="618" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">map()           -&gt;  rdd.map() / df.withColumn()</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
      <!-- Gradients -->






      <!-- Drop shadow -->

      <!-- Arrow markers -->
    </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- == WHY PYTHON FOR SPARK == -->
  <rect x="60" y="30" width="1160" height="44" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Why Python for Spark: readable syntax, rich ecosystem, PySpark native API, data science libs (pandas/numpy/scikit-learn)</text>

  <!-- == DATA TYPES SECTION == -->
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Key Data Types</text>

  <!-- List -->
  <rect x="60" y="114" width="270" height="180" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="195" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">list  [ ]</text>
  <text x="80" y="158" font-family="monospace" font-size="12" fill="#333333">nums = [1, 2, 3, 4, 5]</text>
  <text x="80" y="176" font-family="monospace" font-size="12" fill="#333333">nums.append(6)</text>
  <text x="80" y="194" font-family="monospace" font-size="12" fill="#333333">nums[0]  # -&gt; 1</text>
  <text x="80" y="212" font-family="monospace" font-size="12" fill="#333333">nums[1:3]  # -&gt; [2,3]</text>
  <text x="80" y="234" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">Spark: RDD is like a</text>
  <text x="80" y="250" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">distributed list</text>
  <text x="80" y="268" font-family="Arial, sans-serif" font-size="12" fill="#777777">Ordered, mutable, allows dupes</text>
  <text x="80" y="284" font-family="Arial, sans-serif" font-size="12" fill="#777777">O(1) append, O(n) search</text>

  <!-- Dict -->
  <rect x="350" y="114" width="270" height="180" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="485" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">dict  &#x7b; &#x7d;</text>
  <text x="370" y="158" font-family="monospace" font-size="12" fill="#333333">d = {"name": "Alice"}</text>
  <text x="370" y="176" font-family="monospace" font-size="12" fill="#333333">d["age"] = 30</text>
  <text x="370" y="194" font-family="monospace" font-size="12" fill="#333333">d.get("age", 0)</text>
  <text x="370" y="212" font-family="monospace" font-size="12" fill="#333333">d.keys() / d.values()</text>
  <text x="370" y="234" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">Spark: Row objects are</text>
  <text x="370" y="250" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">dict-like in DataFrames</text>
  <text x="370" y="268" font-family="Arial, sans-serif" font-size="12" fill="#777777">Key-value, O(1) lookup</text>
  <text x="370" y="284" font-family="Arial, sans-serif" font-size="12" fill="#777777">JSON-like, flexible schema</text>

  <!-- Tuple -->
  <rect x="640" y="114" width="270" height="180" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="775" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00" text-anchor="middle">tuple  ( )</text>
  <text x="660" y="158" font-family="monospace" font-size="12" fill="#333333">t = (1, "hello", 3.14)</text>
  <text x="660" y="176" font-family="monospace" font-size="12" fill="#333333">x, y, z = t  # unpack</text>
  <text x="660" y="194" font-family="monospace" font-size="12" fill="#333333">t[0]  # -&gt; 1</text>
  <text x="660" y="212" font-family="monospace" font-size="12" fill="#333333">t + (4,)  # concatenate</text>
  <text x="660" y="234" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Spark: key-value pairs</text>
  <text x="660" y="250" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">in PairRDDs are tuples</text>
  <text x="660" y="268" font-family="Arial, sans-serif" font-size="12" fill="#777777">Immutable, hashable</text>
  <text x="660" y="284" font-family="Arial, sans-serif" font-size="12" fill="#777777">Lighter than list</text>

  <!-- Set -->
  <rect x="930" y="114" width="306" height="180" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1083" y="136" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6a1b9a" text-anchor="middle">set  &#x7b; &#x7d;</text>
  <text x="950" y="158" font-family="monospace" font-size="12" fill="#333333">s = {1, 2, 3, 2}  # -&gt; {1,2,3}</text>
  <text x="950" y="176" font-family="monospace" font-size="12" fill="#333333">s.add(4)</text>
  <text x="950" y="194" font-family="monospace" font-size="12" fill="#333333">s1 &amp; s2  # intersection</text>
  <text x="950" y="212" font-family="monospace" font-size="12" fill="#333333">s1 | s2  # union</text>
  <text x="950" y="234" font-family="Arial, sans-serif" font-size="12" fill="#6a1b9a">Spark: distinct() is a</text>
  <text x="950" y="250" font-family="Arial, sans-serif" font-size="12" fill="#6a1b9a">distributed set operation</text>
  <text x="950" y="268" font-family="Arial, sans-serif" font-size="12" fill="#777777">Unordered, unique elements</text>
  <text x="950" y="284" font-family="Arial, sans-serif" font-size="12" fill="#777777">O(1) membership test</text>

  <!-- == LIST COMPREHENSIONS + LAMBDA == -->
  <text x="60" y="322" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#555555">List Comprehensions, Lambda, map/filter</text>

  <rect x="60" y="338" width="560" height="280" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>

  <text x="80" y="362" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">List Comprehensions</text>
  <text x="80" y="382" font-family="monospace" font-size="12" fill="#333333"># Traditional loop</text>
  <text x="80" y="398" font-family="monospace" font-size="12" fill="#333333">squares = []</text>
  <text x="80" y="414" font-family="monospace" font-size="12" fill="#333333">for x in range(10):</text>
  <text x="80" y="430" font-family="monospace" font-size="12" fill="#333333">    squares.append(x**2)</text>

  <text x="80" y="454" font-family="monospace" font-size="12" fill="#2e7d32"># List comprehension (Pythonic)</text>
  <text x="80" y="470" font-family="monospace" font-size="12" fill="#2e7d32">squares = [x**2 for x in range(10)]</text>

  <text x="80" y="492" font-family="monospace" font-size="12" fill="#f57c00"># With condition</text>
  <text x="80" y="508" font-family="monospace" font-size="12" fill="#f57c00">evens = [x for x in range(10) if x%2==0]</text>

  <text x="80" y="530" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565c0">Lambda + map/filter (Spark transformations!)</text>
  <text x="80" y="548" font-family="monospace" font-size="12" fill="#333333">double = lambda x: x * 2</text>
  <text x="80" y="564" font-family="monospace" font-size="12" fill="#333333">list(map(double, [1,2,3]))   # -&gt; [2,4,6]</text>
  <text x="80" y="580" font-family="monospace" font-size="12" fill="#333333">list(filter(lambda x: x&gt;2, [1,2,3,4])) # -&gt; [3,4]</text>
  <text x="80" y="598" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">In Spark: rdd.map(lambda x: x*2)  rdd.filter(lambda x: x&gt;0)</text>
  <text x="80" y="614" font-family="Arial, sans-serif" font-size="12" fill="#555555">Lambdas are serialized and sent to Spark executors!</text>

  <!-- Right: Function definitions + Spark connection -->
  <rect x="650" y="338" width="586" height="280" rx="8" fill="url(#grad-surface)" stroke="#cccccc" stroke-width="1"/>

  <text x="670" y="362" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Function Definitions</text>
  <text x="670" y="382" font-family="monospace" font-size="12" fill="#333333">def greet(name: str, greeting: str = "Hello") -&gt; str:</text>
  <text x="670" y="398" font-family="monospace" font-size="12" fill="#333333">    """Docstring: return a greeting."""</text>
  <text x="670" y="414" font-family="monospace" font-size="12" fill="#333333">    return f"{greeting}, {name}!"</text>

  <text x="670" y="436" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#f57c00">Type Hints (important for PySpark)</text>
  <text x="670" y="456" font-family="monospace" font-size="12" fill="#333333">from typing import List, Dict, Optional</text>
  <text x="670" y="472" font-family="monospace" font-size="12" fill="#333333">def process(rows: List[Dict]) -&gt; List[int]:</text>
  <text x="670" y="488" font-family="monospace" font-size="12" fill="#333333">    return [r["age"] for r in rows]</text>

  <text x="670" y="510" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Python -&gt; Spark Mapping</text>
  <text x="670" y="530" font-family="Arial, sans-serif" font-size="12" fill="#333333">list            -&gt;  RDD / Column values</text>
  <text x="670" y="548" font-family="Arial, sans-serif" font-size="12" fill="#333333">dict            -&gt;  DataFrame Row / schema</text>
  <text x="670" y="566" font-family="Arial, sans-serif" font-size="12" fill="#333333">lambda/function -&gt;  UDF, map(), flatMap()</text>
  <text x="670" y="584" font-family="Arial, sans-serif" font-size="12" fill="#333333">list comprehension -&gt; DataFrame select/transform</text>
  <text x="670" y="602" font-family="Arial, sans-serif" font-size="12" fill="#333333">filter()        -&gt;  rdd.filter() / df.filter()</text>
  <text x="670" y="618" font-family="Arial, sans-serif" font-size="12" fill="#333333">map()           -&gt;  rdd.map() / df.withColumn()</text>
</svg>

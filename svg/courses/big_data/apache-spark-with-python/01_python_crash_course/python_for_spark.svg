<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- == WHY PYTHON FOR SPARK == -->
  <rect x="40" y="40" width="1183.673469" height="43.401361" rx="6.530612" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="631.836735" y="67.619048" font-family="Arial, sans-serif" font-size="17.055347" font-weight="bold" fill="var(--bg)" text-anchor="middle">Why Python for Spark: readable syntax, rich ecosystem, PySpark native API, data science libs (pandas/numpy/scikit-learn)</text>

  <!-- == DATA TYPES SECTION == -->
  <text x="40" y="109.047619" font-family="Arial, sans-serif" font-size="15.048816" font-weight="bold" fill="var(--primary-accent)">Key Data Types</text>

  <!-- List -->
  <rect x="40" y="122.857143" width="275.510204" height="177.55102" rx="6.530612" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.755102" y="144.557823" font-family="Arial, sans-serif" font-size="14.045605" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">list  [ ]</text>
  <text x="60.408163" y="166.258503" font-family="monospace" font-size="12.039075" fill="var(--text)">nums = [1, 2, 3, 4, 5]</text>
  <text x="60.408163" y="184.013605" font-family="monospace" font-size="12.039075" fill="var(--text)">nums.append(6)</text>
  <text x="60.408163" y="201.768707" font-family="monospace" font-size="12.039075" fill="var(--text)">nums[0]  # -&gt; 1</text>
  <text x="60.408163" y="219.52381" font-family="monospace" font-size="12.039075" fill="var(--text)">nums[1:3]  # -&gt; [2,3]</text>
  <text x="60.408163" y="241.22449" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--primary-accent)">Spark: RDD is like a</text>
  <text x="60.408163" y="257.006803" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--primary-accent)">distributed list</text>
  <text x="60.408163" y="274.761905" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text-muted)">Ordered, mutable, allows dupes</text>
  <text x="60.408163" y="290.544218" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text-muted)">O(1) append, O(n) search</text>

  <!-- Dict -->
  <rect x="335.918367" y="122.857143" width="275.510204" height="177.55102" rx="6.530612" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="473.673469" y="144.557823" font-family="Arial, sans-serif" font-size="14.045605" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">dict  &#x7b; &#x7d;</text>
  <text x="356.326531" y="166.258503" font-family="monospace" font-size="12.039075" fill="var(--text)">d = {"name": "Alice"}</text>
  <text x="356.326531" y="184.013605" font-family="monospace" font-size="12.039075" fill="var(--text)">d["age"] = 30</text>
  <text x="356.326531" y="201.768707" font-family="monospace" font-size="12.039075" fill="var(--text)">d.get("age", 0)</text>
  <text x="356.326531" y="219.52381" font-family="monospace" font-size="12.039075" fill="var(--text)">d.keys() / d.values()</text>
  <text x="356.326531" y="241.22449" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--ok-accent)">Spark: Row objects are</text>
  <text x="356.326531" y="257.006803" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--ok-accent)">dict-like in DataFrames</text>
  <text x="356.326531" y="274.761905" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text-muted)">Key-value, O(1) lookup</text>
  <text x="356.326531" y="290.544218" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text-muted)">JSON-like, flexible schema</text>

  <!-- Tuple -->
  <rect x="631.836735" y="122.857143" width="275.510204" height="177.55102" rx="6.530612" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="769.591837" y="144.557823" font-family="Arial, sans-serif" font-size="14.045605" font-weight="bold" fill="var(--warn-accent)" text-anchor="middle">tuple  ( )</text>
  <text x="652.244898" y="166.258503" font-family="monospace" font-size="12.039075" fill="var(--text)">t = (1, "hello", 3.14)</text>
  <text x="652.244898" y="184.013605" font-family="monospace" font-size="12.039075" fill="var(--text)">x, y, z = t  # unpack</text>
  <text x="652.244898" y="201.768707" font-family="monospace" font-size="12.039075" fill="var(--text)">t[0]  # -&gt; 1</text>
  <text x="652.244898" y="219.52381" font-family="monospace" font-size="12.039075" fill="var(--text)">t + (4,)  # concatenate</text>
  <text x="652.244898" y="241.22449" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--warn-accent)">Spark: key-value pairs</text>
  <text x="652.244898" y="257.006803" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--warn-accent)">in PairRDDs are tuples</text>
  <text x="652.244898" y="274.761905" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text-muted)">Immutable, hashable</text>
  <text x="652.244898" y="290.544218" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text-muted)">Lighter than list</text>

  <!-- Set -->
  <rect x="927.755102" y="122.857143" width="312.244898" height="177.55102" rx="6.530612" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.877551" y="144.557823" font-family="Arial, sans-serif" font-size="14.045605" font-weight="bold" fill="var(--info-accent)" text-anchor="middle">set  &#x7b; &#x7d;</text>
  <text x="948.163265" y="166.258503" font-family="monospace" font-size="12.039075" fill="var(--text)">s = {1, 2, 3, 2}  # -&gt; {1,2,3}</text>
  <text x="948.163265" y="184.013605" font-family="monospace" font-size="12.039075" fill="var(--text)">s.add(4)</text>
  <text x="948.163265" y="201.768707" font-family="monospace" font-size="12.039075" fill="var(--text)">s1 &amp; s2  # intersection</text>
  <text x="948.163265" y="219.52381" font-family="monospace" font-size="12.039075" fill="var(--text)">s1 | s2  # union</text>
  <text x="948.163265" y="241.22449" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--info-accent)">Spark: distinct() is a</text>
  <text x="948.163265" y="257.006803" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--info-accent)">distributed set operation</text>
  <text x="948.163265" y="274.761905" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text-muted)">Unordered, unique elements</text>
  <text x="948.163265" y="290.544218" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text-muted)">O(1) membership test</text>

  <!-- == LIST COMPREHENSIONS + LAMBDA == -->
  <text x="40" y="328.027211" font-family="Arial, sans-serif" font-size="15.048816" font-weight="bold" fill="var(--text-muted)">List Comprehensions, Lambda, map/filter</text>

  <rect x="40" y="343.809524" width="571.428571" height="276.190476" rx="6.530612" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <text x="60.408163" y="367.482993" font-family="Arial, sans-serif" font-size="13.042395" font-weight="bold" fill="var(--primary-accent)">List Comprehensions</text>
  <text x="60.408163" y="387.210884" font-family="monospace" font-size="12.039075" fill="var(--text)"># Traditional loop</text>
  <text x="60.408163" y="402.993197" font-family="monospace" font-size="12.039075" fill="var(--text)">squares = []</text>
  <text x="60.408163" y="418.77551" font-family="monospace" font-size="12.039075" fill="var(--text)">for x in range(10):</text>
  <text x="60.408163" y="434.557823" font-family="monospace" font-size="12.039075" fill="var(--text)">    squares.append(x**2)</text>

  <text x="60.408163" y="458.231293" font-family="monospace" font-size="12.039075" fill="var(--ok-accent)"># List comprehension (Pythonic)</text>
  <text x="60.408163" y="474.013605" font-family="monospace" font-size="12.039075" fill="var(--ok-accent)">squares = [x**2 for x in range(10)]</text>

  <text x="60.408163" y="495.714286" font-family="monospace" font-size="12.039075" fill="var(--warn-accent)"># With condition</text>
  <text x="60.408163" y="511.496599" font-family="monospace" font-size="12.039075" fill="var(--warn-accent)">evens = [x for x in range(10) if x%2==0]</text>

  <text x="60.408163" y="533.197279" font-family="Arial, sans-serif" font-size="12.039075" font-weight="bold" fill="var(--primary-accent)">Lambda + map/filter (Spark transformations!)</text>
  <text x="60.408163" y="550.952381" font-family="monospace" font-size="12.039075" fill="var(--text)">double = lambda x: x * 2</text>
  <text x="60.408163" y="566.734694" font-family="monospace" font-size="12.039075" fill="var(--text)">list(map(double, [1,2,3]))   # -&gt; [2,4,6]</text>
  <text x="60.408163" y="582.517007" font-family="monospace" font-size="12.039075" fill="var(--text)">list(filter(lambda x: x&gt;2, [1,2,3,4])) # -&gt; [3,4]</text>
  <text x="60.408163" y="600.272109" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--primary-accent)">In Spark: rdd.map(lambda x: x*2)  rdd.filter(lambda x: x&gt;0)</text>
  <text x="60.408163" y="616.054422" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text-muted)">Lambdas are serialized and sent to Spark executors!</text>

  <!-- Right: Function definitions + Spark connection -->
  <rect x="642.040816" y="343.809524" width="597.959184" height="276.190476" rx="6.530612" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <text x="662.44898" y="367.482993" font-family="Arial, sans-serif" font-size="13.042395" font-weight="bold" fill="var(--ok-accent)">Function Definitions</text>
  <text x="662.44898" y="387.210884" font-family="monospace" font-size="12.039075" fill="var(--text)">def greet(name: str, greeting: str = "Hello") -&gt; str:</text>
  <text x="662.44898" y="402.993197" font-family="monospace" font-size="12.039075" fill="var(--text)">    """Docstring: return a greeting."""</text>
  <text x="662.44898" y="418.77551" font-family="monospace" font-size="12.039075" fill="var(--text)">    return f"{greeting}, {name}!"</text>

  <text x="662.44898" y="440.47619" font-family="Arial, sans-serif" font-size="13.042395" font-weight="bold" fill="var(--warn-accent)">Type Hints (important for PySpark)</text>
  <text x="662.44898" y="460.204082" font-family="monospace" font-size="12.039075" fill="var(--text)">from typing import List, Dict, Optional</text>
  <text x="662.44898" y="475.986395" font-family="monospace" font-size="12.039075" fill="var(--text)">def process(rows: List[Dict]) -&gt; List[int]:</text>
  <text x="662.44898" y="491.768707" font-family="monospace" font-size="12.039075" fill="var(--text)">    return [r["age"] for r in rows]</text>

  <text x="662.44898" y="513.469388" font-family="Arial, sans-serif" font-size="13.042395" font-weight="bold" fill="var(--primary-accent)">Python -&gt; Spark Mapping</text>
  <text x="662.44898" y="533.197279" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text)">list            -&gt;  RDD / Column values</text>
  <text x="662.44898" y="550.952381" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text)">dict            -&gt;  DataFrame Row / schema</text>
  <text x="662.44898" y="568.707483" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text)">lambda/function -&gt;  UDF, map(), flatMap()</text>
  <text x="662.44898" y="586.462585" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text)">list comprehension -&gt; DataFrame select/transform</text>
  <text x="662.44898" y="604.217687" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text)">filter()        -&gt;  rdd.filter() / df.filter()</text>
  <text x="662.44898" y="620" font-family="Arial, sans-serif" font-size="12.039075" fill="var(--text)">map()           -&gt;  rdd.map() / df.withColumn()</text>
</svg>

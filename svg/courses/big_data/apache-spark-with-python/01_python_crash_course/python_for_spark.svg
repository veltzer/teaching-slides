<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Row 1: core data types -->
  <rect x="40" y="40" width="279.310344827586" height="171.851851851852" rx="10.540925533895" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.655172413793" y="77.592592592593" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--bg)" text-anchor="middle">list  [ ]</text>
  <text x="179.655172413793" y="115.185185185185" font-family="Courier New, monospace" font-size="16.865480854231" fill="var(--bg)" text-anchor="middle">[1, 2, 3]</text>
  <text x="179.655172413793" y="147.407407407407" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)" text-anchor="middle">ordered, mutable</text>
  <text x="179.655172413793" y="179.62962962963" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--bg)" text-anchor="middle">Spark: RDD</text>

  <rect x="340" y="40" width="279.310344827586" height="171.851851851852" rx="10.540925533895" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.655172413793" y="77.592592592593" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--bg)" text-anchor="middle">dict  { }</text>
  <text x="479.655172413793" y="115.185185185185" font-family="Courier New, monospace" font-size="16.865480854231" fill="var(--bg)" text-anchor="middle">{"k": "v"}</text>
  <text x="479.655172413793" y="147.407407407407" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)" text-anchor="middle">key/value, O(1)</text>
  <text x="479.655172413793" y="179.62962962963" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--bg)" text-anchor="middle">Spark: Row</text>

  <rect x="640" y="40" width="279.310344827586" height="171.851851851852" rx="10.540925533895" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="779.655172413793" y="77.592592592593" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--bg)" text-anchor="middle">tuple  ( )</text>
  <text x="779.655172413793" y="115.185185185185" font-family="Courier New, monospace" font-size="16.865480854231" fill="var(--bg)" text-anchor="middle">(1, "x")</text>
  <text x="779.655172413793" y="147.407407407407" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)" text-anchor="middle">immutable, hashable</text>
  <text x="779.655172413793" y="179.62962962963" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--bg)" text-anchor="middle">Spark: PairRDD</text>

  <rect x="940" y="40" width="300" height="171.851851851852" rx="10.540925533895" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="77.592592592593" font-family="Arial, sans-serif" font-size="23.190036174568" font-weight="bold" fill="var(--bg)" text-anchor="middle">set  { }</text>
  <text x="1090" y="115.185185185185" font-family="Courier New, monospace" font-size="16.865480854231" fill="var(--bg)" text-anchor="middle">{1, 2, 3}</text>
  <text x="1090" y="147.407407407407" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--bg)" text-anchor="middle">unique, unordered</text>
  <text x="1090" y="179.62962962963" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--bg)" text-anchor="middle">Spark: distinct()</text>

  <!-- Row 2: comprehensions + lambda -->
  <rect x="40" y="254.814814814815" width="579.310344827586" height="365.185185185185" rx="10.540925533895" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.655172413793" y="292.407407407407" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Comprehensions &amp; Lambdas</text>
  <text x="60.689655172414" y="335.37037037037" font-family="Courier New, monospace" font-size="18.97366596101" fill="var(--text)">squares = [x*x for x in range(10)]</text>
  <text x="60.689655172414" y="372.962962962963" font-family="Courier New, monospace" font-size="18.97366596101" fill="var(--text)">evens = [x for x in xs if x%2==0]</text>
  <text x="60.689655172414" y="421.296296296296" font-family="Courier New, monospace" font-size="18.97366596101" fill="var(--text)">double = lambda x: x * 2</text>
  <text x="60.689655172414" y="458.888888888889" font-family="Courier New, monospace" font-size="18.97366596101" fill="var(--text)">map(double, xs)</text>
  <text x="60.689655172414" y="496.481481481482" font-family="Courier New, monospace" font-size="18.97366596101" fill="var(--text)">filter(lambda x: x&gt;0, xs)</text>
  <text x="329.655172413793" y="550.185185185185" font-family="Arial, sans-serif" font-size="17.919573407621" font-weight="bold" fill="var(--ok-accent)" text-anchor="middle">rdd.map(lambda x: x*2)</text>
  <text x="329.655172413793" y="587.777777777778" font-family="Arial, sans-serif" font-size="15.811388300842" fill="var(--text-muted)" text-anchor="middle">lambdas serialize to executors</text>

  <!-- Row 2 right: mapping -->
  <rect x="660.689655172414" y="254.814814814815" width="579.310344827586" height="365.185185185185" rx="10.540925533895" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.344827586207" y="292.407407407407" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--primary-accent)" text-anchor="middle">Python to Spark</text>
  <text x="691.724137931035" y="340.740740740741" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--text)">list</text>
  <text x="950.344827586207" y="340.740740740741" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--primary-accent)">RDD / Column</text>
  <text x="691.724137931035" y="383.703703703704" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--text)">dict</text>
  <text x="950.344827586207" y="383.703703703704" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--primary-accent)">Row / schema</text>
  <text x="691.724137931035" y="426.666666666667" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--text)">tuple</text>
  <text x="950.344827586207" y="426.666666666667" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--primary-accent)">PairRDD key/value</text>
  <text x="691.724137931035" y="469.62962962963" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--text)">lambda</text>
  <text x="950.344827586207" y="469.62962962963" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--primary-accent)">UDF / map</text>
  <text x="691.724137931035" y="512.592592592593" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--text)">map()</text>
  <text x="950.344827586207" y="512.592592592593" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--primary-accent)">rdd.map</text>
  <text x="691.724137931035" y="555.555555555556" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--text)">filter()</text>
  <text x="950.344827586207" y="555.555555555556" font-family="Courier New, monospace" font-size="17.919573407621" fill="var(--primary-accent)">df.filter</text>
  <text x="950.344827586207" y="598.518518518519" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-muted)" text-anchor="middle">type hints help PySpark UDFs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="35.5556" y="253.3333" width="168.8889" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="120" y="306.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Input</text>
  <text x="120" y="328.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--text-muted)">Data</text>
  <rect x="248.8889" y="253.3333" width="168.8889" height="115.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="333.3333" y="306.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" font-weight="bold" fill="var(--ok-accent)">Map</text>
  <text x="333.3333" y="328.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--text-muted)">Phase</text>
  <rect x="462.2222" y="253.3333" width="213.3333" height="115.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="568.8889" y="302.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">Shuffle</text>
  <text x="568.8889" y="326.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" font-weight="bold" fill="var(--warn-accent)">+ Sort</text>
  <rect x="720" y="253.3333" width="186.6667" height="115.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="813.3333" y="306.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" font-weight="bold" fill="var(--primary-accent)">Reduce</text>
  <text x="813.3333" y="328.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--text-muted)">Phase</text>
  <rect x="951.1111" y="253.3333" width="168.8889" height="115.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1035.5556" y="306.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Output</text>
  <text x="1035.5556" y="328.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.4444" fill="var(--primary-accent)">Result</text>
  <line x1="204.4444" y1="311.1111" x2="248.8889" y2="311.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="417.7778" y1="311.1111" x2="462.2222" y2="311.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="675.5556" y1="311.1111" x2="720" y2="311.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="906.6667" y1="311.1111" x2="951.1111" y2="311.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="120" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-faint)" font-style="italic">HDFS / S3</text>
  <text x="333.3333" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-faint)" font-style="italic">key-value pairs</text>
  <text x="568.8889" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-faint)" font-style="italic">group by key</text>
  <text x="813.3333" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-faint)" font-style="italic">aggregate values</text>
  <text x="1035.5556" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-faint)" font-style="italic">HDFS / S3</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="186.885246" height="456.969924" rx="12.838094" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="133.442623" y="250.909328" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.188963" font-weight="bold" fill="var(--primary-accent)">Input</text>
  <text x="133.442623" y="338.788144" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.032017" fill="var(--text-muted)">Data</text>
  <rect x="276.065574" y="40" width="186.885246" height="456.969924" rx="12.838094" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="369.508197" y="250.909328" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.188963" font-weight="bold" fill="var(--ok-accent)">Map</text>
  <text x="369.508197" y="338.788144" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.032017" fill="var(--text-muted)">Phase</text>
  <rect x="512.131148" y="40" width="236.065574" height="456.969924" rx="12.838094" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.163934" y="233.333476" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.188963" font-weight="bold" fill="var(--warn-accent)">Shuffle</text>
  <text x="630.163934" y="328.242547" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.188963" font-weight="bold" fill="var(--warn-accent)">+ Sort</text>
  <rect x="797.377049" y="40" width="206.557377" height="456.969924" rx="12.838094" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="900.655633" y="250.909328" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.188963" font-weight="bold" fill="var(--primary-accent)">Reduce</text>
  <text x="900.655633" y="338.788144" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.032017" fill="var(--text-muted)">Phase</text>
  <rect x="1053.114754" y="40" width="186.885246" height="456.969924" rx="12.838094" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1146.557377" y="250.909328" text-anchor="middle" font-family="Arial, sans-serif" font-size="37.188963" font-weight="bold" fill="var(--bg)">Output</text>
  <text x="1146.557377" y="338.788144" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.032017" fill="var(--primary-accent)">Result</text>
  <line x1="226.885141" y1="268.484744" x2="276.065574" y2="268.484744" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="462.95082" y1="268.484744" x2="512.131148" y2="268.484744" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="748.196721" y1="268.484744" x2="797.377049" y2="268.484744" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1003.934426" y1="268.484744" x2="1053.114754" y2="268.484744" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="133.442623" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.172847" fill="var(--text-faint)" font-style="italic">HDFS / S3</text>
  <text x="369.508197" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.172847" fill="var(--text-faint)" font-style="italic">key-value pairs</text>
  <text x="630.163934" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.172847" fill="var(--text-faint)" font-style="italic">group by key</text>
  <text x="900.655633" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.172847" fill="var(--text-faint)" font-style="italic">aggregate values</text>
  <text x="1146.557377" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.172847" fill="var(--text-faint)" font-style="italic">HDFS / S3</text>
</svg>

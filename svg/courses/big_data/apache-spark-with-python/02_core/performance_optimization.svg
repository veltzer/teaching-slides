<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="460" y="40" width="381.818182" height="98.723365" rx="8.010826" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="650.909091" y="97.999847" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.525962" font-weight="bold" fill="var(--bg)">Performance Optimization</text>
  <rect x="40" y="274.467916" width="240" height="98.723365" rx="8.010826" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="160" y="331.233958" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.88489" font-weight="bold" fill="var(--ok-accent)">Caching</text>
  <text x="160" y="358.383021" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.923349" fill="var(--text-muted)">persist() / cache()</text>
  <rect x="345.454545" y="274.467916" width="240" height="98.723365" rx="8.010826" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="465.454545" y="331.233958" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.88489" font-weight="bold" fill="var(--primary-accent)">Partitioning</text>
  <text x="465.454545" y="358.383021" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.923349" fill="var(--text-muted)">repartition / coalesce</text>
  <rect x="650.909091" y="274.467916" width="240" height="98.723365" rx="8.010826" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="770.909091" y="331.233958" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.88489" font-weight="bold" fill="var(--warn-accent)">Serialization</text>
  <text x="770.909091" y="358.383021" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.923349" fill="var(--text-muted)">Kryo serializer</text>
  <rect x="956.363636" y="274.467916" width="283.636364" height="98.723365" rx="8.010826" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1098.181702" y="331.233958" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.88489" font-weight="bold" fill="var(--danger-accent)">Broadcast Joins</text>
  <text x="1098.181702" y="358.383021" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.923349" fill="var(--text-muted)">small table broadcast</text>
  <rect x="192.727273" y="521.276635" width="305.454545" height="98.723365" rx="8.010826" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="345.454545" y="578.042524" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.88489" font-weight="bold" fill="var(--danger-accent)">Memory Management</text>
  <text x="345.454545" y="605.191587" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.923349" fill="var(--text-muted)">spark.memory.fraction</text>
  <rect x="563.636364" y="521.276635" width="305.454545" height="98.723365" rx="8.010826" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="716.363636" y="578.042524" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.88489" font-weight="bold" fill="var(--info-accent)">Shuffle Reduction</text>
  <text x="716.363636" y="605.191587" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.923349" fill="var(--text-muted)">reduceByKey vs groupByKey</text>
  <line x1="547.272611" y1="138.723365" x2="192.727273" y2="274.467916" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="596.36352" y1="138.723365" x2="443.636364" y2="274.467916" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="650.909091" y1="138.723365" x2="749.090909" y2="274.467916" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="738.181818" y1="138.723365" x2="1054.545455" y2="274.467916" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="580" y1="138.723365" x2="345.454545" y2="521.276635" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="683.636364" y1="138.723365" x2="694.545338" y2="521.276635" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
</svg>
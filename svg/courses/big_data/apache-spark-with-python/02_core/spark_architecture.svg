<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="473.333333" y="40" width="333.333333" height="71.858451" rx="7.373717" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="83.11502" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.359938" font-weight="bold" fill="var(--bg)">Driver Program</text>
  <rect x="473.333333" y="158.053033" width="333.333333" height="71.858451" rx="7.373717" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="201.168053" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.359938" font-weight="bold" fill="var(--primary-accent)">SparkContext</text>
  <rect x="473.333333" y="281.23884" width="333.333333" height="71.858451" rx="7.373717" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="324.353987" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.359938" font-weight="bold" fill="var(--text-muted)">Cluster Manager</text>
  <rect x="40" y="430.088516" width="288.888889" height="71.858451" rx="7.373717" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="184.444326" y="473.203663" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.223895" fill="var(--text)">Worker Node 1</text>
  <rect x="495.555556" y="430.088516" width="288.888889" height="71.858451" rx="7.373717" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="473.203663" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.223895" fill="var(--text)">Worker Node 2</text>
  <rect x="951.111111" y="430.088516" width="288.888889" height="71.858451" rx="7.373717" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1095.555437" y="473.203663" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.223895" fill="var(--text)">Worker Node n</text>
  <rect x="48.888889" y="558.407097" width="271.111111" height="61.592903" rx="7.373717" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.444326" y="595.362864" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.223895" fill="var(--text-muted)">Executor 1</text>
  <rect x="504.444326" y="558.407097" width="271.111111" height="61.592903" rx="7.373717" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="595.362864" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.223895" fill="var(--text-muted)">Executor 2</text>
  <rect x="960" y="558.407097" width="271.111111" height="61.592903" rx="7.373717" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.555437" y="595.362864" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.223895" fill="var(--text-muted)">Executor n</text>
  <line x1="640" y1="111.858324" x2="640" y2="158.053033" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="640" y1="229.911484" x2="640" y2="281.23884" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="556.666667" y1="353.097418" x2="240" y2="430.088516" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="640" y1="353.097418" x2="640" y2="430.088516" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="723.333333" y1="353.097418" x2="1017.777778" y2="430.088516" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="184.444326" y1="501.947094" x2="184.444326" y2="558.407097" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="640" y1="501.947094" x2="640" y2="558.407097" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="1095.555437" y1="501.947094" x2="1095.555437" y2="558.407097" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Driver Program -->
  <rect x="490" y="40" width="300" height="70" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Driver Program</text>
  <!-- SparkContext -->
  <rect x="490" y="155" width="300" height="70" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1565c0">SparkContext</text>
  <!-- Cluster Manager -->
  <rect x="490" y="275" width="300" height="70" rx="8" fill="url(#grad-surface)" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#555555">Cluster Manager</text>
  <!-- Worker Nodes -->
  <rect x="100" y="420" width="260" height="70" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333333">Worker Node 1</text>
  <rect x="510" y="420" width="260" height="70" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333333">Worker Node 2</text>
  <rect x="920" y="420" width="260" height="70" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333333">Worker Node n</text>
  <!-- Executors -->
  <rect x="108" y="545" width="244" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555555">Executor 1</text>
  <rect x="518" y="545" width="244" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555555">Executor 2</text>
  <rect x="928" y="545" width="244" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#555555">Executor n</text>
  <!-- Arrows -->
  <line x1="640" y1="110" x2="640" y2="155" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="225" x2="640" y2="275" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="345" x2="280" y2="420" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="345" x2="640" y2="420" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="715" y1="345" x2="980" y2="420" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="490" x2="230" y2="545" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="490" x2="640" y2="545" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1050" y1="490" x2="1050" y2="545" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- RDD Operations (root) -->
  <rect x="60" y="295" width="240" height="100" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="180" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">RDD Operations</text>
  <!-- Transformations -->
  <rect x="390" y="140" width="240" height="100" rx="8" fill="url(#grad-surface)" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">Transformations</text>
  <text x="510" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">(lazy evaluation)</text>
  <!-- Actions -->
  <rect x="390" y="460" width="240" height="100" rx="8" fill="url(#grad-surface)" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c62828">Actions</text>
  <text x="510" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">(eager evaluation)</text>
  <!-- Transformation examples -->
  <rect x="730" y="60" width="280" height="80" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2e7d32">map, filter, flatMap</text>
  <rect x="730" y="175" width="280" height="80" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2e7d32">union, intersection</text>
  <!-- Action examples -->
  <rect x="730" y="370" width="280" height="80" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c62828">reduce, collect, count</text>
  <rect x="730" y="485" width="280" height="80" rx="8" fill="#ffebee" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c62828">take, saveAsTextFile</text>
  <!-- Arrows: root to categories -->
  <line x1="300" y1="325" x2="390" y2="215" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="365" x2="390" y2="490" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows: transformations to examples -->
  <line x1="630" y1="175" x2="730" y2="110" stroke="#43a047" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="205" x2="730" y2="215" stroke="#43a047" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrows: actions to examples -->
  <line x1="630" y1="490" x2="730" y2="415" stroke="#e53935" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="525" x2="730" y2="530" stroke="#e53935" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

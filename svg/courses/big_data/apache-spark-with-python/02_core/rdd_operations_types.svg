<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="309.90109" width="303.157895" height="114.851564" rx="8.31601" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="191.578947" y="375.366493" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.089542" font-weight="bold" fill="var(--bg)">RDD Operations</text>
  <rect x="456.842105" y="131.881137" width="303.157895" height="114.851564" rx="8.31601" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="608.421053" y="180.118863" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.680532" font-weight="bold" fill="var(--ok-accent)">Transformations</text>
  <text x="608.421053" y="209.980332" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.658216" fill="var(--text-muted)">(lazy evaluation)</text>
  <rect x="456.842105" y="499.406114" width="303.157895" height="114.851564" rx="8.31601" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="608.421053" y="547.643697" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.680532" font-weight="bold" fill="var(--danger-accent)">Actions</text>
  <text x="608.421053" y="577.505024" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.658216" fill="var(--text-muted)">(eager evaluation)</text>
  <rect x="886.315789" y="40" width="353.684211" height="91.881137" rx="8.31601" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.15776" y="92.831754" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.271522" fill="var(--ok-accent)">map, filter, flatMap</text>
  <rect x="886.315789" y="172.079384" width="353.684211" height="91.881137" rx="8.31601" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.15776" y="224.910853" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.271522" fill="var(--ok-accent)">union, intersection</text>
  <rect x="886.315789" y="396.039763" width="353.684211" height="91.881137" rx="8.31601" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.15776" y="448.871375" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.271522" fill="var(--danger-accent)">reduce, collect, count</text>
  <rect x="886.315789" y="528.118863" width="353.684211" height="91.881137" rx="8.31601" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1063.15776" y="580.950616" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.271522" fill="var(--danger-accent)">take, saveAsTextFile</text>
  <line x1="343.157895" y1="344.356588" x2="456.842105" y2="218.01981" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="343.157895" y1="390.297014" x2="456.842105" y2="533.861612" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="760" y1="172.079384" x2="886.315789" y2="97.425782" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="760" y1="206.53474" x2="886.315789" y2="218.01981" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="760" y1="533.861612" x2="886.315789" y2="447.722939" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="760" y1="574.059574" x2="886.315789" y2="579.802038" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
</svg>

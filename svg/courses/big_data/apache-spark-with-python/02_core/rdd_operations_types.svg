<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="277.6389" width="225" height="80.5556" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="323.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">RDD Operations</text>
  <rect x="405.625" y="152.7777" width="225" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="518.125" y="186.6111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)">Transformations</text>
  <text x="518.125" y="207.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">(lazy evaluation)</text>
  <rect x="405.625" y="410.5556" width="225" height="80.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="518.125" y="444.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--danger-accent)">Actions</text>
  <text x="518.125" y="465.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">(eager evaluation)</text>
  <rect x="724.375" y="88.3333" width="262.5" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="855.6249" y="125.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--ok-accent)">map, filter, flatMap</text>
  <rect x="724.375" y="180.9723" width="262.5" height="64.4444" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="855.6249" y="218.0277" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--ok-accent)">union, intersection</text>
  <rect x="724.375" y="338.0556" width="262.5" height="64.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="855.6249" y="375.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--danger-accent)">reduce, collect, count</text>
  <rect x="724.375" y="430.6944" width="262.5" height="64.4444" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="855.6249" y="467.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--danger-accent)">take, saveAsTextFile</text>
  <line x1="321.25" y1="301.8056" x2="405.625" y2="213.1944" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="321.25" y1="334.0277" x2="405.625" y2="434.7223" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="630.625" y1="180.9723" x2="724.375" y2="128.6111" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="630.625" y1="205.1389" x2="724.375" y2="213.1944" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="630.625" y1="434.7223" x2="724.375" y2="374.3056" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="630.625" y1="462.9167" x2="724.375" y2="466.9444" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  

    <!-- Gradients -->






    <!-- Drop shadow -->

    <!-- Arrow markers -->
  
      <!-- Gradients -->






      <!-- Drop shadow -->

      <!-- Arrow markers -->
    </defs>
  <rect width="1280" height="640" fill="#ffffff"/>

  <!-- == HEADER == -->
  <rect x="60" y="20" width="1160" height="40" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Python Functional Programming -&gt; Spark Transformations</text>

  <!-- == FOUR CONCEPT CARDS == -->
  <!-- Higher-Order Functions -->
  <rect x="60" y="76" width="280" height="240" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="76" width="280" height="34" rx="10" fill="#1e88e5"/>
  <rect x="60" y="95" width="280" height="15" fill="#1e88e5"/>
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Higher-Order Functions</text>
  <text x="80" y="126" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">Functions that take/return functions</text>
  <text x="80" y="148" font-family="monospace" font-size="11" fill="#333333">def apply(func, data):</text>
  <text x="80" y="164" font-family="monospace" font-size="11" fill="#333333">    return [func(x) for x in data]</text>
  <text x="80" y="184" font-family="monospace" font-size="11" fill="#333333">apply(str.upper, ["a","b"])</text>
  <text x="80" y="204" font-family="monospace" font-size="11" fill="#333333"># -&gt; ["A", "B"]</text>
  <text x="80" y="226" font-family="Arial, sans-serif" font-size="12" fill="#1565c0">Spark equivalent:</text>
  <text x="80" y="244" font-family="monospace" font-size="11" fill="#333333">rdd.map(str.upper)</text>
  <text x="80" y="262" font-family="monospace" font-size="11" fill="#333333">df.withColumn("u", upper(col("c")))</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="11" fill="#555555">map/reduce/filter are HOFs.</text>
  <text x="80" y="298" font-family="Arial, sans-serif" font-size="11" fill="#555555">Spark is built around them.</text>
  <text x="80" y="308" font-family="Arial, sans-serif" font-size="11" fill="#555555">Pass any function to any transform.</text>

  <!-- Closures -->
  <rect x="360" y="76" width="280" height="240" rx="10" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="76" width="280" height="34" rx="10" fill="#43a047"/>
  <rect x="360" y="95" width="280" height="15" fill="#43a047"/>
  <text x="500" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Closures</text>
  <text x="380" y="126" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">Inner function captures outer scope</text>
  <text x="380" y="148" font-family="monospace" font-size="11" fill="#333333">def multiplier(n):</text>
  <text x="380" y="164" font-family="monospace" font-size="11" fill="#333333">    def inner(x):</text>
  <text x="380" y="180" font-family="monospace" font-size="11" fill="#333333">        return x * n  # n captured</text>
  <text x="380" y="196" font-family="monospace" font-size="11" fill="#333333">    return inner</text>
  <text x="380" y="212" font-family="monospace" font-size="11" fill="#333333">triple = multiplier(3)</text>
  <text x="380" y="228" font-family="monospace" font-size="11" fill="#333333">triple(5)  # -&gt; 15</text>
  <text x="380" y="248" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">Spark use: factory functions</text>
  <text x="380" y="266" font-family="monospace" font-size="11" fill="#333333">threshold = 100</text>
  <text x="380" y="282" font-family="monospace" font-size="11" fill="#333333">rdd.filter(lambda x: x &gt; threshold)</text>
  <text x="380" y="302" font-family="Arial, sans-serif" font-size="11" fill="#555555">Caution: large closed-over objects</text>
  <text x="380" y="316" font-family="Arial, sans-serif" font-size="11" fill="#555555">are serialized to every executor!</text>

  <!-- Iterators/Generators -->
  <rect x="660" y="76" width="280" height="240" rx="10" fill="#fff3e0" stroke="#fb8c00" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="76" width="280" height="34" rx="10" fill="#fb8c00"/>
  <rect x="660" y="95" width="280" height="15" fill="#fb8c00"/>
  <text x="800" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Iterators / Generators</text>
  <text x="680" y="126" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Lazy evaluation - compute on demand</text>
  <text x="680" y="148" font-family="monospace" font-size="11" fill="#333333">def squares_gen(n):</text>
  <text x="680" y="164" font-family="monospace" font-size="11" fill="#333333">    for i in range(n):</text>
  <text x="680" y="180" font-family="monospace" font-size="11" fill="#333333">        yield i ** 2  # lazy!</text>
  <text x="680" y="200" font-family="monospace" font-size="11" fill="#333333">gen = squares_gen(1000000)</text>
  <text x="680" y="216" font-family="monospace" font-size="11" fill="#333333">next(gen)  # 0, then 1, then 4...</text>
  <text x="680" y="236" font-family="Arial, sans-serif" font-size="12" fill="#f57c00">Spark connection:</text>
  <text x="680" y="254" font-family="Arial, sans-serif" font-size="12" fill="#333333">Spark RDDs are lazy! Nothing</text>
  <text x="680" y="270" font-family="Arial, sans-serif" font-size="12" fill="#333333">executes until action called.</text>
  <text x="680" y="290" font-family="monospace" font-size="11" fill="#333333">rdd = sc.parallelize(range(10**9))</text>
  <text x="680" y="306" font-family="monospace" font-size="11" fill="#333333"># nothing runs yet!</text>
  <text x="680" y="316" font-family="Arial, sans-serif" font-size="11" fill="#555555">rdd.count() triggers execution.</text>

  <!-- Decorators -->
  <rect x="960" y="76" width="276" height="240" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2" filter="url(#shadow)"/>
  <rect x="960" y="76" width="276" height="34" rx="10" fill="#8e24aa"/>
  <rect x="960" y="95" width="276" height="15" fill="#8e24aa"/>
  <text x="1098" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Decorators</text>
  <text x="980" y="126" font-family="Arial, sans-serif" font-size="12" fill="#6a1b9a">Wrap functions, add behavior</text>
  <text x="980" y="148" font-family="monospace" font-size="11" fill="#333333">def log(func):</text>
  <text x="980" y="164" font-family="monospace" font-size="11" fill="#333333">    def wrapper(*args):</text>
  <text x="980" y="180" font-family="monospace" font-size="11" fill="#333333">        print(f"calling {func.__name__}")</text>
  <text x="980" y="196" font-family="monospace" font-size="11" fill="#333333">        return func(*args)</text>
  <text x="980" y="212" font-family="monospace" font-size="11" fill="#333333">    return wrapper</text>
  <text x="980" y="228" font-family="monospace" font-size="11" fill="#333333">@log</text>
  <text x="980" y="244" font-family="monospace" font-size="11" fill="#333333">def compute(x): return x * 2</text>
  <text x="980" y="264" font-family="Arial, sans-serif" font-size="12" fill="#6a1b9a">Spark: @udf decorator</text>
  <text x="980" y="282" font-family="monospace" font-size="11" fill="#333333">from pyspark.sql.functions import udf</text>
  <text x="980" y="298" font-family="monospace" font-size="11" fill="#333333">@udf(returnType=IntegerType())</text>
  <text x="980" y="314" font-family="monospace" font-size="11" fill="#333333">def square(x): return x * x</text>

  <!-- == FUNCTIONAL SPARK MAPPING TABLE == -->
  <text x="60" y="344" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#555555">Functional Concepts -&gt; Spark Transformations</text>

  <!-- Table -->
  <rect x="60" y="360" width="1160" height="36" rx="4" fill="#1565c0"/>
  <text x="180" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Python Concept</text>
  <text x="450" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Spark Transformation</text>
  <text x="750" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Example</text>
  <text x="1060" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Notes</text>

  <rect x="60" y="396" width="1160" height="32" fill="#e3f2fd"/>
  <text x="180" y="416" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">map()</text>
  <text x="450" y="416" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">rdd.map() / df.withColumn()</text>
  <text x="750" y="416" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">rdd.map(lambda x: x*2)</text>
  <text x="1060" y="416" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">1-to-1 element transform</text>

  <rect x="60" y="428" width="1160" height="32" fill="#ffffff"/>
  <text x="180" y="448" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">filter()</text>
  <text x="450" y="448" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">rdd.filter() / df.filter()</text>
  <text x="750" y="448" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">rdd.filter(lambda x: x &gt; 0)</text>
  <text x="1060" y="448" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Keep matching elements</text>

  <rect x="60" y="460" width="1160" height="32" fill="#e8f5e9"/>
  <text x="180" y="480" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">reduce()</text>
  <text x="450" y="480" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">rdd.reduce() / df.agg()</text>
  <text x="750" y="480" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">rdd.reduce(lambda a,b: a+b)</text>
  <text x="1060" y="480" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Aggregate to single value</text>

  <rect x="60" y="492" width="1160" height="32" fill="#ffffff"/>
  <text x="180" y="512" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">flatMap()</text>
  <text x="450" y="512" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">rdd.flatMap()</text>
  <text x="750" y="512" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">rdd.flatMap(lambda x: x.split())</text>
  <text x="1060" y="512" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">1-to-many, then flatten</text>

  <rect x="60" y="524" width="1160" height="32" fill="#fff3e0"/>
  <text x="180" y="544" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">generator / yield</text>
  <text x="450" y="544" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">RDD lazy evaluation</text>
  <text x="750" y="544" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">rdd.map(f).filter(g).count()</text>
  <text x="1060" y="544" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Nothing runs until action</text>

  <rect x="60" y="556" width="1160" height="32" fill="#f3e5f5"/>
  <text x="180" y="576" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">@udf decorator</text>
  <text x="450" y="576" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">PySpark UDF</text>
  <text x="750" y="576" font-family="monospace" font-size="12" fill="#333333" text-anchor="middle">@udf(StringType()) def parse(x): ...</text>
  <text x="1060" y="576" font-family="Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Slower than built-in funcs</text>

  <!-- == CAUTION BANNER == -->
  <rect x="60" y="598" width="1160" height="32" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
  <text x="640" y="618" font-family="Arial, sans-serif" font-size="13" fill="#f57c00" text-anchor="middle">Key Spark rule: prefer built-in Spark SQL functions over Python UDFs -- UDFs cross JVM boundary and are 10-100x slower. Use pandas UDFs (vectorized) when Python logic is required.</text>
</svg>

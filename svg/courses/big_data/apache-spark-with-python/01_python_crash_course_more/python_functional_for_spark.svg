<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.424811740757" font-weight="bold" fill="var(--primary-accent)">Python Functional Features to Spark</text>

  <!-- Four concept cards -->
  <rect x="40" y="86.607142857143" width="290" height="227.857142857143" rx="10.177004891982" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--primary-text)">Higher-Order</text>
  <text x="185" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--primary-text)">map filter reduce</text>
  <text x="185" y="205.714285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--primary-text)">rdd.map(f)</text>
  <text x="185" y="241.964285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--primary-text)">df.filter(c)</text>
  <text x="185" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--primary-text)">core Spark API</text>

  <rect x="340" y="86.607142857143" width="290" height="227.857142857143" rx="10.177004891982" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--ok-text)">Closures</text>
  <text x="485" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--ok-text)">Capture outer scope</text>
  <text x="485" y="205.714285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--ok-text)">lambda x: x &gt; t</text>
  <text x="485" y="247.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--ok-text)">t shipped to</text>
  <text x="485" y="270.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--ok-text)">every executor</text>

  <rect x="640" y="86.607142857143" width="290" height="227.857142857143" rx="10.177004891982" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--warn-text)">Lazy</text>
  <text x="785" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Generators like RDDs</text>
  <text x="785" y="205.714285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--warn-text)">rdd.map(f)</text>
  <text x="785" y="241.964285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--warn-text)">rdd.count()</text>
  <text x="785" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--warn-text)">action triggers run</text>

  <rect x="940" y="86.607142857143" width="300" height="227.857142857143" rx="10.177004891982" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.30090831637" font-weight="bold" fill="var(--info-text)">Decorators</text>
  <text x="1090" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--info-text)">Wrap functions</text>
  <text x="1090" y="205.714285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--info-text)">@udf(IntType())</text>
  <text x="1090" y="241.964285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="13.230106359577" fill="var(--info-text)">def f(x): ...</text>
  <text x="1090" y="283.392857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.230106359577" fill="var(--info-text)">builds PySpark UDFs</text>

  <!-- Mapping table -->
  <rect x="40" y="355.892857142857" width="1200" height="37.285714285714" rx="6.106202935189" fill="var(--primary-accent)"/>
  <text x="200" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Python</text>
  <text x="640" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Spark</text>
  <text x="1020" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.265507337973" font-weight="bold" fill="var(--bg)">Example</text>

  <text x="200" y="423.214285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">map</text>
  <text x="640" y="423.214285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">rdd.map</text>
  <text x="1020" y="423.214285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">rdd.map(lambda x: x*2)</text>

  <text x="200" y="459.464285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">filter</text>
  <text x="640" y="459.464285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">rdd.filter</text>
  <text x="1020" y="459.464285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">rdd.filter(x &gt; 0)</text>

  <text x="200" y="495.714285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">reduce</text>
  <text x="640" y="495.714285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">rdd.reduce</text>
  <text x="1020" y="495.714285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">reduce(a+b)</text>

  <text x="200" y="531.964285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">yield</text>
  <text x="640" y="531.964285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">lazy chain</text>
  <text x="1020" y="531.964285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">action runs</text>

  <text x="200" y="568.214285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">@decorator</text>
  <text x="640" y="568.214285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">@udf</text>
  <text x="1020" y="568.214285714286" text-anchor="middle" font-family="Courier New, monospace" font-size="14.247806848775" fill="var(--text)">slow crossing JVM</text>

  <rect x="40" y="588.928571428572" width="1200" height="31.071428571429" rx="6.106202935189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="609.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.247806848775" fill="var(--warn-text)">Prefer builtins; pandas UDFs when Python needed.</text>
</svg>

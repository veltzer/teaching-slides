<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Four concept cards -->
  <rect x="40" y="40" width="290" height="247.766990291262" rx="10.612321104419" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877513" font-weight="bold" fill="var(--primary-text)">Higher-Order</text>
  <text x="185" y="124.466019417475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--primary-text)">map filter reduce</text>
  <text x="185" y="169.514563106796" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--primary-text)">rdd.map(f)</text>
  <text x="185" y="208.932038834952" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--primary-text)">df.filter(c)</text>
  <text x="185" y="253.980582524272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--primary-text)">core Spark API</text>

  <rect x="340" y="40" width="290" height="247.766990291262" rx="10.612321104419" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877513" font-weight="bold" fill="var(--ok-text)">Closures</text>
  <text x="485" y="124.466019417475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--ok-text)">Capture outer scope</text>
  <text x="485" y="169.514563106796" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--ok-text)">lambda x: x &gt; t</text>
  <text x="485" y="214.563106796116" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--ok-text)">t shipped to</text>
  <text x="485" y="240.466019417476" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--ok-text)">every executor</text>

  <rect x="640" y="40" width="290" height="247.766990291262" rx="10.612321104419" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877513" font-weight="bold" fill="var(--warn-text)">Lazy</text>
  <text x="785" y="124.466019417475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--warn-text)">Generators like RDDs</text>
  <text x="785" y="169.514563106796" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--warn-text)">rdd.map(f)</text>
  <text x="785" y="208.932038834952" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--warn-text)">rdd.count()</text>
  <text x="785" y="253.980582524272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--warn-text)">action triggers run</text>

  <rect x="940" y="40" width="300" height="247.766990291262" rx="10.612321104419" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="79.417475728155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.040945877513" font-weight="bold" fill="var(--info-text)">Decorators</text>
  <text x="1090" y="124.466019417475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--info-text)">Wrap functions</text>
  <text x="1090" y="169.514563106796" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--info-text)">@udf(IntType())</text>
  <text x="1090" y="208.932038834952" text-anchor="middle" font-family="Courier New, monospace" font-size="13.796017435745" fill="var(--info-text)">def f(x): ...</text>
  <text x="1090" y="253.980582524272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.796017435745" fill="var(--info-text)">builds PySpark UDFs</text>

  <!-- Mapping table -->
  <rect x="40" y="332.815533980582" width="1200" height="40.543689320388" rx="6.367392662651" fill="var(--primary-accent)"/>
  <text x="200" y="360.970873786407" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--bg)">Python</text>
  <text x="640" y="360.970873786407" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--bg)">Spark</text>
  <text x="1020" y="360.970873786407" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.918481656629" font-weight="bold" fill="var(--bg)">Example</text>

  <text x="200" y="406.019417475728" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">map</text>
  <text x="640" y="406.019417475728" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">rdd.map</text>
  <text x="1020" y="406.019417475728" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">rdd.map(lambda x: x*2)</text>

  <text x="200" y="445.436893203884" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">filter</text>
  <text x="640" y="445.436893203884" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">rdd.filter</text>
  <text x="1020" y="445.436893203884" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">rdd.filter(x &gt; 0)</text>

  <text x="200" y="484.854368932039" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">reduce</text>
  <text x="640" y="484.854368932039" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">rdd.reduce</text>
  <text x="1020" y="484.854368932039" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">reduce(a+b)</text>

  <text x="200" y="524.271844660194" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">yield</text>
  <text x="640" y="524.271844660194" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">lazy chain</text>
  <text x="1020" y="524.271844660194" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">action runs</text>

  <text x="200" y="563.68932038835" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">@decorator</text>
  <text x="640" y="563.68932038835" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">@udf</text>
  <text x="1020" y="563.68932038835" text-anchor="middle" font-family="Courier New, monospace" font-size="14.857249546187" fill="var(--text)">slow crossing JVM</text>

  <rect x="40" y="586.21359223301" width="1200" height="33.786407766991" rx="6.367392662651" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="608.73786407767" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.857249546187" fill="var(--warn-text)">Prefer builtins; pandas UDFs when Python needed.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)" rx="6"/>

  <!-- == HEADER == -->
  <rect x="60" y="20" width="1160" height="40" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Functional Programming -&gt; Spark Transformations</text>

  <!-- == FOUR CONCEPT CARDS == -->
  <!-- Higher-Order Functions -->
  <rect x="60" y="76" width="280" height="240" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="76" width="280" height="34" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="60" y="95" width="280" height="15" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Higher-Order Functions</text>
  <text x="80" y="126" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">Functions that take/return functions</text>
  <text x="80" y="148" font-family="monospace" font-size="11" fill="var(--text)">def apply(func, data):</text>
  <text x="80" y="164" font-family="monospace" font-size="11" fill="var(--text)">    return [func(x) for x in data]</text>
  <text x="80" y="184" font-family="monospace" font-size="11" fill="var(--text)">apply(str.upper, ["a","b"])</text>
  <text x="80" y="204" font-family="monospace" font-size="11" fill="var(--text)"># -&gt; ["A", "B"]</text>
  <text x="80" y="226" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-accent)">Spark equivalent:</text>
  <text x="80" y="244" font-family="monospace" font-size="11" fill="var(--text)">rdd.map(str.upper)</text>
  <text x="80" y="262" font-family="monospace" font-size="11" fill="var(--text)">df.withColumn("u", upper(col("c")))</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">map/reduce/filter are HOFs.</text>
  <text x="80" y="298" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Spark is built around them.</text>
  <text x="80" y="308" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Pass any function to any transform.</text>

  <!-- Closures -->
  <rect x="360" y="76" width="280" height="240" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="76" width="280" height="34" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="360" y="95" width="280" height="15" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="500" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Closures</text>
  <text x="380" y="126" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Inner function captures outer scope</text>
  <text x="380" y="148" font-family="monospace" font-size="11" fill="var(--text)">def multiplier(n):</text>
  <text x="380" y="164" font-family="monospace" font-size="11" fill="var(--text)">    def inner(x):</text>
  <text x="380" y="180" font-family="monospace" font-size="11" fill="var(--text)">        return x * n  # n captured</text>
  <text x="380" y="196" font-family="monospace" font-size="11" fill="var(--text)">    return inner</text>
  <text x="380" y="212" font-family="monospace" font-size="11" fill="var(--text)">triple = multiplier(3)</text>
  <text x="380" y="228" font-family="monospace" font-size="11" fill="var(--text)">triple(5)  # -&gt; 15</text>
  <text x="380" y="248" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-accent)">Spark use: factory functions</text>
  <text x="380" y="266" font-family="monospace" font-size="11" fill="var(--text)">threshold = 100</text>
  <text x="380" y="282" font-family="monospace" font-size="11" fill="var(--text)">rdd.filter(lambda x: x &gt; threshold)</text>
  <text x="380" y="302" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Caution: large closed-over objects</text>
  <text x="380" y="316" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">are serialized to every executor!</text>

  <!-- Iterators/Generators -->
  <rect x="660" y="76" width="280" height="240" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="76" width="280" height="34" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="660" y="95" width="280" height="15" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="800" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Iterators / Generators</text>
  <text x="680" y="126" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">Lazy evaluation - compute on demand</text>
  <text x="680" y="148" font-family="monospace" font-size="11" fill="var(--text)">def squares_gen(n):</text>
  <text x="680" y="164" font-family="monospace" font-size="11" fill="var(--text)">    for i in range(n):</text>
  <text x="680" y="180" font-family="monospace" font-size="11" fill="var(--text)">        yield i ** 2  # lazy!</text>
  <text x="680" y="200" font-family="monospace" font-size="11" fill="var(--text)">gen = squares_gen(1000000)</text>
  <text x="680" y="216" font-family="monospace" font-size="11" fill="var(--text)">next(gen)  # 0, then 1, then 4...</text>
  <text x="680" y="236" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-accent)">Spark connection:</text>
  <text x="680" y="254" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">Spark RDDs are lazy! Nothing</text>
  <text x="680" y="270" font-family="Arial, sans-serif" font-size="12" fill="var(--text)">executes until action called.</text>
  <text x="680" y="290" font-family="monospace" font-size="11" fill="var(--text)">rdd = sc.parallelize(range(10**9))</text>
  <text x="680" y="306" font-family="monospace" font-size="11" fill="var(--text)"># nothing runs yet!</text>
  <text x="680" y="316" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">rdd.count() triggers execution.</text>

  <!-- Decorators -->
  <rect x="960" y="76" width="276" height="240" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="960" y="76" width="276" height="34" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="960" y="95" width="276" height="15" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1098" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Decorators</text>
  <text x="980" y="126" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)">Wrap functions, add behavior</text>
  <text x="980" y="148" font-family="monospace" font-size="11" fill="var(--text)">def log(func):</text>
  <text x="980" y="164" font-family="monospace" font-size="11" fill="var(--text)">    def wrapper(*args):</text>
  <text x="980" y="180" font-family="monospace" font-size="11" fill="var(--text)">        print(f"calling {func.__name__}")</text>
  <text x="980" y="196" font-family="monospace" font-size="11" fill="var(--text)">        return func(*args)</text>
  <text x="980" y="212" font-family="monospace" font-size="11" fill="var(--text)">    return wrapper</text>
  <text x="980" y="228" font-family="monospace" font-size="11" fill="var(--text)">@log</text>
  <text x="980" y="244" font-family="monospace" font-size="11" fill="var(--text)">def compute(x): return x * 2</text>
  <text x="980" y="264" font-family="Arial, sans-serif" font-size="12" fill="var(--info-accent)">Spark: @udf decorator</text>
  <text x="980" y="282" font-family="monospace" font-size="11" fill="var(--text)">from pyspark.sql.functions import udf</text>
  <text x="980" y="298" font-family="monospace" font-size="11" fill="var(--text)">@udf(returnType=IntegerType())</text>
  <text x="980" y="314" font-family="monospace" font-size="11" fill="var(--text)">def square(x): return x * x</text>

  <!-- == FUNCTIONAL SPARK MAPPING TABLE == -->
  <text x="60" y="344" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-muted)">Functional Concepts -&gt; Spark Transformations</text>

  <!-- Table -->
  <rect x="60" y="360" width="1160" height="36" rx="6" fill="var(--primary-accent)"/>
  <text x="180" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Concept</text>
  <text x="450" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Spark Transformation</text>
  <text x="750" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Example</text>
  <text x="1060" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Notes</text>

  <rect x="60" y="396" width="1160" height="32" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="180" y="416" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">map()</text>
  <text x="450" y="416" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">rdd.map() / df.withColumn()</text>
  <text x="750" y="416" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">rdd.map(lambda x: x*2)</text>
  <text x="1060" y="416" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">1-to-1 element transform</text>

  <rect x="60" y="428" width="1160" height="32" fill="var(--bg)" rx="6"/>
  <text x="180" y="448" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">filter()</text>
  <text x="450" y="448" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">rdd.filter() / df.filter()</text>
  <text x="750" y="448" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">rdd.filter(lambda x: x &gt; 0)</text>
  <text x="1060" y="448" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Keep matching elements</text>

  <rect x="60" y="460" width="1160" height="32" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="180" y="480" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">reduce()</text>
  <text x="450" y="480" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">rdd.reduce() / df.agg()</text>
  <text x="750" y="480" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">rdd.reduce(lambda a,b: a+b)</text>
  <text x="1060" y="480" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Aggregate to single value</text>

  <rect x="60" y="492" width="1160" height="32" fill="var(--bg)" rx="6"/>
  <text x="180" y="512" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">flatMap()</text>
  <text x="450" y="512" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">rdd.flatMap()</text>
  <text x="750" y="512" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">rdd.flatMap(lambda x: x.split())</text>
  <text x="1060" y="512" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">1-to-many, then flatten</text>

  <rect x="60" y="524" width="1160" height="32" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="180" y="544" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">generator / yield</text>
  <text x="450" y="544" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">RDD lazy evaluation</text>
  <text x="750" y="544" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">rdd.map(f).filter(g).count()</text>
  <text x="1060" y="544" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Nothing runs until action</text>

  <rect x="60" y="556" width="1160" height="32" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="180" y="576" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">@udf decorator</text>
  <text x="450" y="576" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">PySpark UDF</text>
  <text x="750" y="576" font-family="monospace" font-size="12" fill="var(--text)" text-anchor="middle">@udf(StringType()) def parse(x): ...</text>
  <text x="1060" y="576" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Slower than built-in funcs</text>

  <!-- == CAUTION BANNER == -->
  <rect x="60" y="598" width="1160" height="32" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="618" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)" text-anchor="middle">Key Spark rule: prefer built-in Spark SQL functions over Python UDFs -- UDFs cross JVM boundary and are 10-100x slower. Use pandas UDFs (vectorized) when Python logic is required.</text>
</svg>

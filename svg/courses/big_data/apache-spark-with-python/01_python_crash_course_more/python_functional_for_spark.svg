<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>

  <!-- == HEADER == -->
  <rect x="96.25" y="58.125" width="1087.5" height="36.25" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="81.6875" font-family="Arial, sans-serif" font-size="14.7479" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Functional Programming -&gt; Spark Transformations</text>

  <!-- == FOUR CONCEPT CARDS == -->
  <!-- Higher-Order Functions -->
  <rect x="96.25" y="108.875" width="262.5" height="217.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="96.25" y="108.875" width="262.5" height="30.8125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="96.25" y="126.0938" width="262.5" height="13.5938" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="130.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">Higher-Order Functions</text>
  <text x="115" y="154.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">Functions that take/return functions</text>
  <text x="115" y="174.125" font-family="monospace" font-size="10.1392" fill="var(--text)">def apply(func, data):</text>
  <text x="115" y="188.625" font-family="monospace" font-size="10.1392" fill="var(--text)">    return [func(x) for x in data]</text>
  <text x="115" y="206.75" font-family="monospace" font-size="10.1392" fill="var(--text)">apply(str.upper, ["a","b"])</text>
  <text x="115" y="224.875" font-family="monospace" font-size="10.1392" fill="var(--text)"># -&gt; ["A", "B"]</text>
  <text x="115" y="244.8125" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--primary-accent)">Spark equivalent:</text>
  <text x="115" y="261.125" font-family="monospace" font-size="10.1392" fill="var(--text)">rdd.map(str.upper)</text>
  <text x="115" y="277.4375" font-family="monospace" font-size="10.1392" fill="var(--text)">df.withColumn("u", upper(col("c")))</text>
  <text x="115" y="293.75" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">map/reduce/filter are HOFs.</text>
  <text x="115" y="310.0625" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Spark is built around them.</text>
  <text x="115" y="319.125" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Pass any function to any transform.</text>

  <!-- Closures -->
  <rect x="377.5" y="108.875" width="262.5" height="217.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="377.5" y="108.875" width="262.5" height="30.8125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="377.5" y="126.0938" width="262.5" height="13.5938" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="508.75" y="130.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">Closures</text>
  <text x="396.25" y="154.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Inner function captures outer scope</text>
  <text x="396.25" y="174.125" font-family="monospace" font-size="10.1392" fill="var(--text)">def multiplier(n):</text>
  <text x="396.25" y="188.625" font-family="monospace" font-size="10.1392" fill="var(--text)">    def inner(x):</text>
  <text x="396.25" y="203.125" font-family="monospace" font-size="10.1392" fill="var(--text)">        return x * n  # n captured</text>
  <text x="396.25" y="217.625" font-family="monospace" font-size="10.1392" fill="var(--text)">    return inner</text>
  <text x="396.25" y="232.125" font-family="monospace" font-size="10.1392" fill="var(--text)">triple = multiplier(3)</text>
  <text x="396.25" y="246.625" font-family="monospace" font-size="10.1392" fill="var(--text)">triple(5)  # -&gt; 15</text>
  <text x="396.25" y="264.75" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--ok-accent)">Spark use: factory functions</text>
  <text x="396.25" y="281.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">threshold = 100</text>
  <text x="396.25" y="295.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">rdd.filter(lambda x: x &gt; threshold)</text>
  <text x="396.25" y="313.6875" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">Caution: large closed-over objects</text>
  <text x="396.25" y="326.375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">are serialized to every executor!</text>

  <!-- Iterators/Generators -->
  <rect x="658.75" y="108.875" width="262.5" height="217.5" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="658.75" y="108.875" width="262.5" height="30.8125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="658.75" y="126.0938" width="262.5" height="13.5938" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="790" y="130.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">Iterators / Generators</text>
  <text x="677.5" y="154.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">Lazy evaluation - compute on demand</text>
  <text x="677.5" y="174.125" font-family="monospace" font-size="10.1392" fill="var(--text)">def squares_gen(n):</text>
  <text x="677.5" y="188.625" font-family="monospace" font-size="10.1392" fill="var(--text)">    for i in range(n):</text>
  <text x="677.5" y="203.125" font-family="monospace" font-size="10.1392" fill="var(--text)">        yield i ** 2  # lazy!</text>
  <text x="677.5" y="221.25" font-family="monospace" font-size="10.1392" fill="var(--text)">gen = squares_gen(1000000)</text>
  <text x="677.5" y="235.75" font-family="monospace" font-size="10.1392" fill="var(--text)">next(gen)  # 0, then 1, then 4...</text>
  <text x="677.5" y="253.875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--warn-accent)">Spark connection:</text>
  <text x="677.5" y="270.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">Spark RDDs are lazy! Nothing</text>
  <text x="677.5" y="284.6875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--text)">executes until action called.</text>
  <text x="677.5" y="302.8125" font-family="monospace" font-size="10.1392" fill="var(--text)">rdd = sc.parallelize(range(10**9))</text>
  <text x="677.5" y="317.3125" font-family="monospace" font-size="10.1392" fill="var(--text)"># nothing runs yet!</text>
  <text x="677.5" y="326.375" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)">rdd.count() triggers execution.</text>

  <!-- Decorators -->
  <rect x="940" y="108.875" width="258.75" height="217.5" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="108.875" width="258.75" height="30.8125" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <rect x="940" y="126.0938" width="258.75" height="13.5938" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1069.375" y="130.625" font-family="Arial, sans-serif" font-size="11.9827" font-weight="bold" fill="var(--bg)" text-anchor="middle">Decorators</text>
  <text x="958.75" y="154.1875" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">Wrap functions, add behavior</text>
  <text x="958.75" y="174.125" font-family="monospace" font-size="10.1392" fill="var(--text)">def log(func):</text>
  <text x="958.75" y="188.625" font-family="monospace" font-size="10.1392" fill="var(--text)">    def wrapper(*args):</text>
  <text x="958.75" y="203.125" font-family="monospace" font-size="10.1392" fill="var(--text)">        print(f"calling {func.__name__}")</text>
  <text x="958.75" y="217.625" font-family="monospace" font-size="10.1392" fill="var(--text)">        return func(*args)</text>
  <text x="958.75" y="232.125" font-family="monospace" font-size="10.1392" fill="var(--text)">    return wrapper</text>
  <text x="958.75" y="246.625" font-family="monospace" font-size="10.1392" fill="var(--text)">@log</text>
  <text x="958.75" y="261.125" font-family="monospace" font-size="10.1392" fill="var(--text)">def compute(x): return x * 2</text>
  <text x="958.75" y="279.25" font-family="Arial, sans-serif" font-size="11.0609" fill="var(--info-accent)">Spark: @udf decorator</text>
  <text x="958.75" y="295.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">from pyspark.sql.functions import udf</text>
  <text x="958.75" y="310.0625" font-family="monospace" font-size="10.1392" fill="var(--text)">@udf(returnType=IntegerType())</text>
  <text x="958.75" y="324.5625" font-family="monospace" font-size="10.1392" fill="var(--text)">def square(x): return x * x</text>

  <!-- == FUNCTIONAL SPARK MAPPING TABLE == -->
  <text x="96.25" y="351.75" font-family="Arial, sans-serif" font-size="13.8261" font-weight="bold" fill="var(--text-muted)">Functional Concepts -&gt; Spark Transformations</text>

  <!-- Table -->
  <rect x="96.25" y="366.25" width="1087.5" height="32.625" rx="6" fill="var(--primary-accent)"/>
  <text x="208.75" y="387.0938" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Concept</text>
  <text x="461.875" y="387.0938" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Spark Transformation</text>
  <text x="743.125" y="387.0938" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Example</text>
  <text x="1033.75" y="387.0938" font-family="Arial, sans-serif" font-size="11.0609" font-weight="bold" fill="var(--bg)" text-anchor="middle">Notes</text>

  <rect x="96.25" y="398.875" width="1087.5" height="29" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="208.75" y="417" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">map()</text>
  <text x="461.875" y="417" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">rdd.map() / df.withColumn()</text>
  <text x="743.125" y="417" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">rdd.map(lambda x: x*2)</text>
  <text x="1033.75" y="417" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">1-to-1 element transform</text>

  <rect x="96.25" y="427.875" width="1087.5" height="29" fill="var(--bg)" rx="6"/>
  <text x="208.75" y="446" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">filter()</text>
  <text x="461.875" y="446" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">rdd.filter() / df.filter()</text>
  <text x="743.125" y="446" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">rdd.filter(lambda x: x &gt; 0)</text>
  <text x="1033.75" y="446" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Keep matching elements</text>

  <rect x="96.25" y="456.875" width="1087.5" height="29" fill="var(--ok-fill)" rx="6" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="208.75" y="475" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">reduce()</text>
  <text x="461.875" y="475" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">rdd.reduce() / df.agg()</text>
  <text x="743.125" y="475" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">rdd.reduce(lambda a,b: a+b)</text>
  <text x="1033.75" y="475" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Aggregate to single value</text>

  <rect x="96.25" y="485.875" width="1087.5" height="29" fill="var(--bg)" rx="6"/>
  <text x="208.75" y="504" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">flatMap()</text>
  <text x="461.875" y="504" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">rdd.flatMap()</text>
  <text x="743.125" y="504" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">rdd.flatMap(lambda x: x.split())</text>
  <text x="1033.75" y="504" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">1-to-many, then flatten</text>

  <rect x="96.25" y="514.875" width="1087.5" height="29" fill="var(--warn-fill)" rx="6" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="208.75" y="533" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">generator / yield</text>
  <text x="461.875" y="533" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">RDD lazy evaluation</text>
  <text x="743.125" y="533" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">rdd.map(f).filter(g).count()</text>
  <text x="1033.75" y="533" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Nothing runs until action</text>

  <rect x="96.25" y="543.875" width="1087.5" height="29" fill="var(--info-fill)" rx="6" stroke="var(--info-border)" stroke-width="2"/>
  <text x="208.75" y="562" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">@udf decorator</text>
  <text x="461.875" y="562" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">PySpark UDF</text>
  <text x="743.125" y="562" font-family="monospace" font-size="11.0609" fill="var(--text)" text-anchor="middle">@udf(StringType()) def parse(x): ...</text>
  <text x="1033.75" y="562" font-family="Arial, sans-serif" font-size="10.1392" fill="var(--text-muted)" text-anchor="middle">Slower than built-in funcs</text>

  <!-- == CAUTION BANNER == -->
  <rect x="96.25" y="581.9375" width="1087.5" height="29" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="600.0625" font-family="Arial, sans-serif" font-size="11.9827" fill="var(--warn-accent)" text-anchor="middle">Key Spark rule: prefer built-in Spark SQL functions over Python UDFs -- UDFs cross JVM boundary and are 10-100x slower. Use pandas UDFs (vectorized) when Python logic is required.</text>
</svg>

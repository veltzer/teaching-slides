<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect width="1280" height="640" fill="var(--bg)"/>

  <!-- == HEADER == -->
  <rect x="60" y="20" width="1160" height="40" rx="8" fill="url(#grad-primary)" filter="url(#shadow)"/>
  <text x="640" y="46" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Functional Programming -&gt; Spark Transformations</text>

  <!-- == FOUR CONCEPT CARDS == -->
  <!-- Higher-Order Functions -->
  <rect x="60" y="76" width="280" height="240" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="76" width="280" height="34" rx="10" fill="var(--primary)"/>
  <rect x="60" y="95" width="280" height="15" fill="var(--primary)"/>
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Higher-Order Functions</text>
  <text x="80" y="126" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">Functions that take/return functions</text>
  <text x="80" y="148" font-family="monospace" font-size="11" fill="var(--text-dark)">def apply(func, data):</text>
  <text x="80" y="164" font-family="monospace" font-size="11" fill="var(--text-dark)">    return [func(x) for x in data]</text>
  <text x="80" y="184" font-family="monospace" font-size="11" fill="var(--text-dark)">apply(str.upper, ["a","b"])</text>
  <text x="80" y="204" font-family="monospace" font-size="11" fill="var(--text-dark)"># -&gt; ["A", "B"]</text>
  <text x="80" y="226" font-family="Arial, sans-serif" font-size="12" fill="var(--primary-dk)">Spark equivalent:</text>
  <text x="80" y="244" font-family="monospace" font-size="11" fill="var(--text-dark)">rdd.map(str.upper)</text>
  <text x="80" y="262" font-family="monospace" font-size="11" fill="var(--text-dark)">df.withColumn("u", upper(col("c")))</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">map/reduce/filter are HOFs.</text>
  <text x="80" y="298" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Spark is built around them.</text>
  <text x="80" y="308" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Pass any function to any transform.</text>

  <!-- Closures -->
  <rect x="360" y="76" width="280" height="240" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="360" y="76" width="280" height="34" rx="10" fill="var(--ok)"/>
  <rect x="360" y="95" width="280" height="15" fill="var(--ok)"/>
  <text x="500" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Closures</text>
  <text x="380" y="126" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">Inner function captures outer scope</text>
  <text x="380" y="148" font-family="monospace" font-size="11" fill="var(--text-dark)">def multiplier(n):</text>
  <text x="380" y="164" font-family="monospace" font-size="11" fill="var(--text-dark)">    def inner(x):</text>
  <text x="380" y="180" font-family="monospace" font-size="11" fill="var(--text-dark)">        return x * n  # n captured</text>
  <text x="380" y="196" font-family="monospace" font-size="11" fill="var(--text-dark)">    return inner</text>
  <text x="380" y="212" font-family="monospace" font-size="11" fill="var(--text-dark)">triple = multiplier(3)</text>
  <text x="380" y="228" font-family="monospace" font-size="11" fill="var(--text-dark)">triple(5)  # -&gt; 15</text>
  <text x="380" y="248" font-family="Arial, sans-serif" font-size="12" fill="var(--ok-dk)">Spark use: factory functions</text>
  <text x="380" y="266" font-family="monospace" font-size="11" fill="var(--text-dark)">threshold = 100</text>
  <text x="380" y="282" font-family="monospace" font-size="11" fill="var(--text-dark)">rdd.filter(lambda x: x &gt; threshold)</text>
  <text x="380" y="302" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">Caution: large closed-over objects</text>
  <text x="380" y="316" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">are serialized to every executor!</text>

  <!-- Iterators/Generators -->
  <rect x="660" y="76" width="280" height="240" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="76" width="280" height="34" rx="10" fill="var(--warn)"/>
  <rect x="660" y="95" width="280" height="15" fill="var(--warn)"/>
  <text x="800" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Iterators / Generators</text>
  <text x="680" y="126" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">Lazy evaluation - compute on demand</text>
  <text x="680" y="148" font-family="monospace" font-size="11" fill="var(--text-dark)">def squares_gen(n):</text>
  <text x="680" y="164" font-family="monospace" font-size="11" fill="var(--text-dark)">    for i in range(n):</text>
  <text x="680" y="180" font-family="monospace" font-size="11" fill="var(--text-dark)">        yield i ** 2  # lazy!</text>
  <text x="680" y="200" font-family="monospace" font-size="11" fill="var(--text-dark)">gen = squares_gen(1000000)</text>
  <text x="680" y="216" font-family="monospace" font-size="11" fill="var(--text-dark)">next(gen)  # 0, then 1, then 4...</text>
  <text x="680" y="236" font-family="Arial, sans-serif" font-size="12" fill="var(--warn-mid)">Spark connection:</text>
  <text x="680" y="254" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">Spark RDDs are lazy! Nothing</text>
  <text x="680" y="270" font-family="Arial, sans-serif" font-size="12" fill="var(--text-dark)">executes until action called.</text>
  <text x="680" y="290" font-family="monospace" font-size="11" fill="var(--text-dark)">rdd = sc.parallelize(range(10**9))</text>
  <text x="680" y="306" font-family="monospace" font-size="11" fill="var(--text-dark)"># nothing runs yet!</text>
  <text x="680" y="316" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)">rdd.count() triggers execution.</text>

  <!-- Decorators -->
  <rect x="960" y="76" width="276" height="240" rx="10" fill="var(--info-pale)" stroke="var(--info)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="960" y="76" width="276" height="34" rx="10" fill="var(--info)"/>
  <rect x="960" y="95" width="276" height="15" fill="var(--info)"/>
  <text x="1098" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--bg)" text-anchor="middle">Decorators</text>
  <text x="980" y="126" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)">Wrap functions, add behavior</text>
  <text x="980" y="148" font-family="monospace" font-size="11" fill="var(--text-dark)">def log(func):</text>
  <text x="980" y="164" font-family="monospace" font-size="11" fill="var(--text-dark)">    def wrapper(*args):</text>
  <text x="980" y="180" font-family="monospace" font-size="11" fill="var(--text-dark)">        print(f"calling {func.__name__}")</text>
  <text x="980" y="196" font-family="monospace" font-size="11" fill="var(--text-dark)">        return func(*args)</text>
  <text x="980" y="212" font-family="monospace" font-size="11" fill="var(--text-dark)">    return wrapper</text>
  <text x="980" y="228" font-family="monospace" font-size="11" fill="var(--text-dark)">@log</text>
  <text x="980" y="244" font-family="monospace" font-size="11" fill="var(--text-dark)">def compute(x): return x * 2</text>
  <text x="980" y="264" font-family="Arial, sans-serif" font-size="12" fill="var(--info-dk)">Spark: @udf decorator</text>
  <text x="980" y="282" font-family="monospace" font-size="11" fill="var(--text-dark)">from pyspark.sql.functions import udf</text>
  <text x="980" y="298" font-family="monospace" font-size="11" fill="var(--text-dark)">@udf(returnType=IntegerType())</text>
  <text x="980" y="314" font-family="monospace" font-size="11" fill="var(--text-dark)">def square(x): return x * x</text>

  <!-- == FUNCTIONAL SPARK MAPPING TABLE == -->
  <text x="60" y="344" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text-muted)">Functional Concepts -&gt; Spark Transformations</text>

  <!-- Table -->
  <rect x="60" y="360" width="1160" height="36" rx="4" fill="var(--primary-dk)"/>
  <text x="180" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Python Concept</text>
  <text x="450" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Spark Transformation</text>
  <text x="750" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Example</text>
  <text x="1060" y="383" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="var(--bg)" text-anchor="middle">Notes</text>

  <rect x="60" y="396" width="1160" height="32" fill="var(--primary-pale)"/>
  <text x="180" y="416" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">map()</text>
  <text x="450" y="416" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">rdd.map() / df.withColumn()</text>
  <text x="750" y="416" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">rdd.map(lambda x: x*2)</text>
  <text x="1060" y="416" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">1-to-1 element transform</text>

  <rect x="60" y="428" width="1160" height="32" fill="var(--bg)"/>
  <text x="180" y="448" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">filter()</text>
  <text x="450" y="448" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">rdd.filter() / df.filter()</text>
  <text x="750" y="448" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">rdd.filter(lambda x: x &gt; 0)</text>
  <text x="1060" y="448" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Keep matching elements</text>

  <rect x="60" y="460" width="1160" height="32" fill="var(--ok-pale)"/>
  <text x="180" y="480" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">reduce()</text>
  <text x="450" y="480" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">rdd.reduce() / df.agg()</text>
  <text x="750" y="480" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">rdd.reduce(lambda a,b: a+b)</text>
  <text x="1060" y="480" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Aggregate to single value</text>

  <rect x="60" y="492" width="1160" height="32" fill="var(--bg)"/>
  <text x="180" y="512" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">flatMap()</text>
  <text x="450" y="512" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">rdd.flatMap()</text>
  <text x="750" y="512" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">rdd.flatMap(lambda x: x.split())</text>
  <text x="1060" y="512" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">1-to-many, then flatten</text>

  <rect x="60" y="524" width="1160" height="32" fill="var(--warn-pale)"/>
  <text x="180" y="544" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">generator / yield</text>
  <text x="450" y="544" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">RDD lazy evaluation</text>
  <text x="750" y="544" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">rdd.map(f).filter(g).count()</text>
  <text x="1060" y="544" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Nothing runs until action</text>

  <rect x="60" y="556" width="1160" height="32" fill="var(--info-pale)"/>
  <text x="180" y="576" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">@udf decorator</text>
  <text x="450" y="576" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">PySpark UDF</text>
  <text x="750" y="576" font-family="monospace" font-size="12" fill="var(--text-dark)" text-anchor="middle">@udf(StringType()) def parse(x): ...</text>
  <text x="1060" y="576" font-family="Arial, sans-serif" font-size="11" fill="var(--text-muted)" text-anchor="middle">Slower than built-in funcs</text>

  <!-- == CAUTION BANNER == -->
  <rect x="60" y="598" width="1160" height="32" rx="6" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="640" y="618" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-mid)" text-anchor="middle">Key Spark rule: prefer built-in Spark SQL functions over Python UDFs -- UDFs cross JVM boundary and are 10-100x slower. Use pandas UDFs (vectorized) when Python logic is required.</text>
</svg>

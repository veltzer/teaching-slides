<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="257.500022" width="185.365854" height="159.50004" rx="8.211831" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="132.682927" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--primary-accent)">Input</text>
  <text x="132.682927" y="358.999901" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651267" fill="var(--text-muted)">Kafka / Flume</text>
  <text x="132.682927" y="386.549992" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651267" fill="var(--text-muted)">TCP / HDFS</text>
  <rect x="274.146341" y="257.500022" width="156.097561" height="159.50004" rx="8.211831" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="352.195122" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--ok-accent)">Receivers</text>
  <text x="352.195122" y="363.349963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.462057" fill="var(--text-muted)">batch interval</text>
  <rect x="479.02439" y="257.500022" width="165.853659" height="159.50004" rx="8.211831" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="561.95122" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--warn-accent)">DStreams</text>
  <text x="561.95122" y="363.349963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.462057" fill="var(--text-muted)">sequence of RDDs</text>
  <rect x="693.658537" y="40" width="126.829268" height="115.999964" rx="8.211831" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="757.073171" y="106.699925" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.030098" fill="var(--primary-accent)">RDD t=1</text>
  <rect x="693.658537" y="271.999927" width="126.829268" height="115.999964" rx="8.211831" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="757.073171" y="338.700034" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.030098" fill="var(--primary-accent)">RDD t=2</text>
  <rect x="693.658537" y="504.000036" width="126.829268" height="115.999964" rx="8.211831" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="757.073171" y="570.700141" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.030098" fill="var(--primary-accent)">RDD t=3</text>
  <rect x="879.02439" y="257.500022" width="165.853659" height="159.50004" rx="8.211831" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="961.95122" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--danger-accent)">Processing</text>
  <text x="961.95122" y="363.349963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.462057" fill="var(--text-muted)">transformations</text>
  <rect x="1093.658537" y="257.500022" width="146.341463" height="159.50004" rx="8.211831" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1166.829164" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--bg)">Output</text>
  <text x="1166.829164" y="363.349963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.462057" fill="var(--primary-accent)">HDFS / DB</text>
  <line x1="225.365854" y1="337.249953" x2="274.146341" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="430.243902" y1="337.249953" x2="479.02439" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="644.878049" y1="301.000099" x2="693.658537" y2="112.499888" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="644.878049" y1="337.249953" x2="693.658537" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="644.878049" y1="373.499986" x2="693.658537" y2="562.000197" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="820.487805" y1="112.499888" x2="879.02439" y2="301.000099" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="820.487805" y1="337.249953" x2="879.02439" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="820.487805" y1="562.000197" x2="879.02439" y2="373.499986" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="1044.878049" y1="337.249953" x2="1093.658537" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
</svg>

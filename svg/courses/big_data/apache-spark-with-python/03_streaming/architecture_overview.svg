<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="277.6389" width="178.125" height="88.6111" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="157.1875" y="315.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Input</text>
  <text x="157.1875" y="334.0277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1663" fill="var(--text-muted)">Kafka / Flume</text>
  <text x="157.1875" y="349.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1663" fill="var(--text-muted)">TCP / HDFS</text>
  <rect x="293.125" y="277.6389" width="150" height="88.6111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="368.125" y="315.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)">Receivers</text>
  <text x="368.125" y="336.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">batch interval</text>
  <rect x="490" y="277.6389" width="159.375" height="88.6111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="569.6875" y="315.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--warn-accent)">DStreams</text>
  <text x="569.6875" y="336.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">sequence of RDDs</text>
  <rect x="696.25" y="156.8056" width="121.875" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="757.1875" y="193.8611" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--primary-accent)">RDD t=1</text>
  <rect x="696.25" y="285.6944" width="121.875" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="757.1875" y="322.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--primary-accent)">RDD t=2</text>
  <rect x="696.25" y="414.5833" width="121.875" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="757.1875" y="451.6389" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--primary-accent)">RDD t=3</text>
  <rect x="874.375" y="277.6389" width="159.375" height="88.6111" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="954.0625" y="315.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--danger-accent)">Processing</text>
  <text x="954.0625" y="336.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">transformations</text>
  <rect x="1080.625" y="277.6389" width="140.625" height="88.6111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1150.9374" y="315.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">Output</text>
  <text x="1150.9374" y="336.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--primary-accent)">HDFS / DB</text>
  <line x1="246.25" y1="321.9444" x2="293.125" y2="321.9444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="443.125" y1="321.9444" x2="490" y2="321.9444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="649.375" y1="301.8056" x2="696.25" y2="197.0833" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="649.375" y1="321.9444" x2="696.25" y2="321.9444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="649.375" y1="342.0833" x2="696.25" y2="446.8056" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="818.125" y1="197.0833" x2="874.375" y2="301.8056" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="818.125" y1="321.9444" x2="874.375" y2="321.9444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="818.125" y1="446.8056" x2="874.375" y2="342.0833" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="1033.75" y1="321.9444" x2="1080.625" y2="321.9444" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
</svg>
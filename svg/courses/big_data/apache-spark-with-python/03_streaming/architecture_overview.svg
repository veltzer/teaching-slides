<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Input Sources -->
  <rect x="30" y="295" width="190" height="110" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="125" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Input</text>
  <text x="125" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555555">Kafka / Flume</text>
  <text x="125" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555555">TCP / HDFS</text>
  <!-- Receivers -->
  <rect x="270" y="295" width="160" height="110" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">Receivers</text>
  <text x="350" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">batch interval</text>
  <!-- DStreams -->
  <rect x="480" y="295" width="170" height="110" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="565" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">DStreams</text>
  <text x="565" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">sequence of RDDs</text>
  <!-- RDD time slices -->
  <rect x="700" y="145" width="130" height="80" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1565c0">RDD t=1</text>
  <rect x="700" y="305" width="130" height="80" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1565c0">RDD t=2</text>
  <rect x="700" y="465" width="130" height="80" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="765" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1565c0">RDD t=3</text>
  <!-- Processing -->
  <rect x="890" y="295" width="170" height="110" rx="8" fill="#fce4ec" stroke="#e53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="975" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c62828">Processing</text>
  <text x="975" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">transformations</text>
  <!-- Output Sinks -->
  <rect x="1110" y="295" width="150" height="110" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1185" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Output</text>
  <text x="1185" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#e3f2fd">HDFS / DB</text>
  <!-- Arrows -->
  <line x1="220" y1="350" x2="270" y2="350" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="350" x2="480" y2="350" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="325" x2="700" y2="195" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="350" x2="700" y2="350" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="375" x2="700" y2="505" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="195" x2="890" y2="325" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="350" x2="890" y2="350" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="505" x2="890" y2="375" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1060" y1="350" x2="1110" y2="350" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

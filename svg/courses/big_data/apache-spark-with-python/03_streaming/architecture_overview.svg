<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="257.500022" width="185.365854" height="159.50004" rx="8.211831" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="132.682927" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--primary-accent)">Input</text>
  <text x="132.682927" y="358.999901" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651267" fill="var(--text-muted)">Kafka / Flume</text>
  <text x="132.682927" y="386.549992" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.651267" fill="var(--text-muted)">TCP / HDFS</text>
  <rect x="274.146341" y="257.500022" width="156.097561" height="159.50004" rx="8.211831" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="352.195122" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--ok-accent)">Receivers</text>
  <text x="352.195122" y="363.349963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.462057" fill="var(--text-muted)">batch interval</text>
  <rect x="479.02439" y="257.500022" width="165.853659" height="159.50004" rx="8.211831" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="561.95122" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--warn-accent)">DStreams</text>
  <text x="561.95122" y="363.349963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.462057" fill="var(--text-muted)">sequence of RDDs</text>
  <rect x="693.658537" y="40" width="126.829268" height="115.999964" rx="8.211831" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="757.073171" y="106.699925" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.030098" fill="var(--primary-accent)">RDD t=1</text>
  <rect x="693.658537" y="271.999927" width="126.829268" height="115.999964" rx="8.211831" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="757.073171" y="338.700034" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.030098" fill="var(--primary-accent)">RDD t=2</text>
  <rect x="693.658537" y="504.000036" width="126.829268" height="115.999964" rx="8.211831" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="757.073171" y="570.700141" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.030098" fill="var(--primary-accent)">RDD t=3</text>
  <rect x="879.02439" y="257.500022" width="165.853659" height="159.50004" rx="8.211831" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="961.95122" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--danger-accent)">Processing</text>
  <text x="961.95122" y="363.349963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.462057" fill="var(--text-muted)">transformations</text>
  <rect x="1093.658537" y="257.500022" width="146.341463" height="159.50004" rx="8.211831" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1166.829164" y="325.650028" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.408928" font-weight="bold" fill="var(--bg)">Output</text>
  <text x="1166.829164" y="363.349963" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.462057" fill="var(--primary-accent)">HDFS / DB</text>
  <line x1="225.365854" y1="337.249953" x2="274.146341" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="430.243902" y1="337.249953" x2="479.02439" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="644.878049" y1="301.000099" x2="693.658537" y2="112.499888" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="644.878049" y1="337.249953" x2="693.658537" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="644.878049" y1="373.499986" x2="693.658537" y2="562.000197" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="820.487805" y1="112.499888" x2="879.02439" y2="301.000099" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="820.487805" y1="337.249953" x2="879.02439" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="820.487805" y1="562.000197" x2="879.02439" y2="373.499986" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="1044.878049" y1="337.249953" x2="1093.658537" y2="337.249953" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
</svg>
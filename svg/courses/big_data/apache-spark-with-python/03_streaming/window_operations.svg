<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Time axis -->
  <line x1="60" y1="100" x2="1240" y2="100" stroke="#e0e0e0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="1248" y="106" font-family="sans-serif" font-size="16" fill="#1565c0">time</text>

  <!-- Batch interval ticks (every 100px = 1 second) -->
  <text x="30" y="96" font-family="sans-serif" font-size="13" fill="#9e9e9e">t=</text>
  <!-- t0..t8 ticks -->
  <line x1="100"  y1="94" x2="100"  y2="108" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="100"  y="122" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">0</text>
  <line x1="250"  y1="94" x2="250"  y2="108" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="250"  y="122" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">1</text>
  <line x1="400"  y1="94" x2="400"  y2="108" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="400"  y="122" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">2</text>
  <line x1="550"  y1="94" x2="550"  y2="108" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="550"  y="122" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">3</text>
  <line x1="700"  y1="94" x2="700"  y2="108" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="700"  y="122" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">4</text>
  <line x1="850"  y1="94" x2="850"  y2="108" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="850"  y="122" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">5</text>
  <line x1="1000" y1="94" x2="1000" y2="108" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="1000" y="122" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">6</text>
  <line x1="1150" y1="94" x2="1150" y2="108" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="1150" y="122" text-anchor="middle" font-family="monospace" font-size="13" fill="#9e9e9e">7</text>
  <text x="640" y="138" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9e9e9e">batch interval = 1s</text>

  <!-- Row 1: Input DStream batches -->
  <text x="30" y="175" font-family="sans-serif" font-size="15" font-weight="bold" fill="#212121">Input</text>
  <text x="30" y="195" font-family="sans-serif" font-size="13" fill="#555555">DStream</text>
  <rect x="100"  y="155" width="140" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170"  y="185" text-anchor="middle" font-family="monospace" font-size="14" fill="#1565c0">RDD[0]</text>
  <rect x="250"  y="155" width="140" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320"  y="185" text-anchor="middle" font-family="monospace" font-size="14" fill="#1565c0">RDD[1]</text>
  <rect x="400"  y="155" width="140" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470"  y="185" text-anchor="middle" font-family="monospace" font-size="14" fill="#1565c0">RDD[2]</text>
  <rect x="550"  y="155" width="140" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620"  y="185" text-anchor="middle" font-family="monospace" font-size="14" fill="#1565c0">RDD[3]</text>
  <rect x="700"  y="155" width="140" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770"  y="185" text-anchor="middle" font-family="monospace" font-size="14" fill="#1565c0">RDD[4]</text>
  <rect x="850"  y="155" width="140" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="920"  y="185" text-anchor="middle" font-family="monospace" font-size="14" fill="#1565c0">RDD[5]</text>
  <rect x="1000" y="155" width="140" height="50" rx="4" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1070" y="185" text-anchor="middle" font-family="monospace" font-size="14" fill="#1565c0">RDD[6]</text>

  <!-- Window 1: windowDuration=3s, slideDuration=1s -->
  <text x="30" y="270" font-family="sans-serif" font-size="15" font-weight="bold" fill="#212121">Window</text>
  <text x="30" y="290" font-family="sans-serif" font-size="13" fill="#555555">3s / slide 1s</text>

  <!-- Window at t=2 covers [0,1,2] -->
  <rect x="100" y="250" width="440" height="50" rx="4" fill="url(#grad-accent)" opacity="0.7" filter="url(#shadow)"/>
  <text x="320" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">w1: RDD[0]+[1]+[2]</text>

  <!-- Window at t=3 covers [1,2,3] -->
  <rect x="250" y="316" width="440" height="50" rx="4" fill="url(#grad-accent)" opacity="0.7" filter="url(#shadow)"/>
  <text x="470" y="346" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">w2: RDD[1]+[2]+[3]</text>

  <!-- Window at t=4 covers [2,3,4] -->
  <rect x="400" y="382" width="440" height="50" rx="4" fill="url(#grad-accent)" opacity="0.7" filter="url(#shadow)"/>
  <text x="620" y="412" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">w3: RDD[2]+[3]+[4]</text>

  <!-- Slide interval arrow -->
  <line x1="100" y1="460" x2="250" y2="460" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="175" y="478" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1565c0">slide = 1s</text>
  <line x1="250" y1="460" x2="400" y2="460" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <!-- Code example -->
  <rect x="30" y="500" width="620" height="96" rx="6" fill="#f2f2f2" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="340" y="526" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#212121">Code</text>
  <text x="50"  y="550" font-family="monospace" font-size="14" fill="#1565c0">windowed = stream.window(</text>
  <text x="50"  y="572" font-family="monospace" font-size="14" fill="#1565c0">    windowDuration=3,   # seconds</text>
  <text x="50"  y="594" font-family="monospace" font-size="14" fill="#1565c0">    slideDuration=1)</text>

  <!-- Key points -->
  <rect x="680" y="500" width="570" height="96" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="965" y="526" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Key parameters</text>
  <text x="700" y="550" font-family="sans-serif" font-size="14" fill="#555555">windowDuration: how much history to include</text>
  <text x="700" y="572" font-family="sans-serif" font-size="14" fill="#555555">slideDuration: how often result is computed</text>
  <text x="700" y="594" font-family="sans-serif" font-size="14" fill="#555555">Both must be multiples of the batch interval</text>
</svg>

  <text x="959.672212" y="539.123739" text-anchor="middle" font-size="15.99057" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Key parameters</text>
  <text x="699.016451" y="566.852788" font-size="14.924442" fill="var(--text-muted)" font-family="Arial, sans-serif">windowDuration: how much history to include</text>
  <text x="699.016451" y="592.270951" font-size="14.924442" fill="var(--text-muted)" font-family="Arial, sans-serif">slideDuration: how often result is computed</text>
  <text x="699.016451" y="617.689401" font-size="14.924442" fill="var(--text-muted)" font-family="Arial, sans-serif">Both must be multiples of the batch interval</text>

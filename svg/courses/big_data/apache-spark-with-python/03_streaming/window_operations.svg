<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <line x1="96.25" y1="120.5556" x2="1202.5" y2="120.5556" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="1209.9999" y="125.3889" font-family="sans-serif" font-size="13.9044" fill="var(--primary-accent)">time</text>
  <text x="68.125" y="117.3333" font-family="sans-serif" font-size="11.2974" fill="var(--text-faint)">t=</text>
  <line x1="133.75" y1="115.7223" x2="133.75" y2="127" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="133.75" y="138.2777" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">0</text>
  <line x1="274.375" y1="115.7223" x2="274.375" y2="127" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="274.375" y="138.2777" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">1</text>
  <line x1="415" y1="115.7223" x2="415" y2="127" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="415" y="138.2777" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">2</text>
  <line x1="555.625" y1="115.7223" x2="555.625" y2="127" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="555.625" y="138.2777" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">3</text>
  <line x1="696.25" y1="115.7223" x2="696.25" y2="127" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="696.25" y="138.2777" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">4</text>
  <line x1="836.875" y1="115.7223" x2="836.875" y2="127" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="836.875" y="138.2777" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">5</text>
  <line x1="977.5" y1="115.7223" x2="977.5" y2="127" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="977.5" y="138.2777" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">6</text>
  <line x1="1118.125" y1="115.7223" x2="1118.125" y2="127" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="1118.125" y="138.2777" text-anchor="middle" font-family="monospace" font-size="11.2974" fill="var(--text-faint)">7</text>
  <text x="640" y="151.1667" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--text-faint)">batch interval = 1s</text>
  <text x="68.125" y="180.9723" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)">Input</text>
  <text x="68.125" y="197.0833" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">DStream</text>
  <rect x="133.75" y="164.8611" width="131.25" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="199.375" y="189.0277" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">RDD[0]</text>
  <rect x="274.375" y="164.8611" width="131.25" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="339.9999" y="189.0277" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">RDD[1]</text>
  <rect x="415" y="164.8611" width="131.25" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="480.625" y="189.0277" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">RDD[2]</text>
  <rect x="555.625" y="164.8611" width="131.25" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="621.25" y="189.0277" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">RDD[3]</text>
  <rect x="696.25" y="164.8611" width="131.25" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="761.8749" y="189.0277" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">RDD[4]</text>
  <rect x="836.875" y="164.8611" width="131.25" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="902.5" y="189.0277" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">RDD[5]</text>
  <rect x="977.5" y="164.8611" width="131.25" height="40.2777" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1043.125" y="189.0277" text-anchor="middle" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">RDD[6]</text>
  <text x="68.125" y="257.5" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)">Window</text>
  <text x="68.125" y="273.6111" font-family="sans-serif" font-size="11.2974" fill="var(--text-muted)">3s / slide 1s</text>
  <rect x="133.75" y="241.3889" width="412.5" height="40.2777" rx="6" fill="var(--primary-fill)" opacity="0.7" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="339.9999" y="265.5556" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--bg)">w1: RDD[0]+[1]+[2]</text>
  <rect x="274.375" y="294.5556" width="412.5" height="40.2777" rx="6" fill="var(--primary-fill)" opacity="0.7" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="480.625" y="318.7223" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--bg)">w2: RDD[1]+[2]+[3]</text>
  <rect x="415" y="347.7223" width="412.5" height="40.2777" rx="6" fill="var(--primary-fill)" opacity="0.7" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="621.25" y="371.8889" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--bg)">w3: RDD[2]+[3]+[4]</text>
  <line x1="133.75" y1="410.5556" x2="274.375" y2="410.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="204.0625" y="425.0556" text-anchor="middle" font-family="sans-serif" font-size="12.1663" fill="var(--primary-accent)">slide = 1s</text>
  <line x1="274.375" y1="410.5556" x2="415" y2="410.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="68.125" y="442.7777" width="581.25" height="77.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="358.75" y="463.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--text)">Code</text>
  <text x="86.875" y="483.0556" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">windowed = stream.window(</text>
  <text x="86.875" y="500.7777" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">    windowDuration=3,   # seconds</text>
  <text x="86.875" y="518.5" font-family="monospace" font-size="12.1663" fill="var(--primary-accent)">    slideDuration=1)</text>
  <rect x="677.4999" y="442.7777" width="534.375" height="77.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="944.6875" y="463.7223" text-anchor="middle" font-family="sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">Key parameters</text>
  <text x="696.25" y="483.0556" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">windowDuration: how much history to include</text>
  <text x="696.25" y="500.7777" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">slideDuration: how often result is computed</text>
  <text x="696.25" y="518.5" font-family="sans-serif" font-size="12.1663" fill="var(--text-muted)">Both must be multiples of the batch interval</text>
</svg>
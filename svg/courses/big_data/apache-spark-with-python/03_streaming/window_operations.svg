<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <line x1="53.3333" y1="88.8889" x2="1102.2222" y2="88.8889" stroke="var(--border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="1109.3333" y="94.2222" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">time</text>
  <text x="26.6667" y="85.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">t=</text>
  <line x1="88.8889" y1="83.5556" x2="88.8889" y2="96" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="88.8889" y="108.4444" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">0</text>
  <line x1="222.2222" y1="83.5556" x2="222.2222" y2="96" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="222.2222" y="108.4444" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">1</text>
  <line x1="355.5556" y1="83.5556" x2="355.5556" y2="96" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="355.5556" y="108.4444" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">2</text>
  <line x1="488.8889" y1="83.5556" x2="488.8889" y2="96" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="488.8889" y="108.4444" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">3</text>
  <line x1="622.2222" y1="83.5556" x2="622.2222" y2="96" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="622.2222" y="108.4444" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">4</text>
  <line x1="755.5556" y1="83.5556" x2="755.5556" y2="96" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="755.5556" y="108.4444" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">5</text>
  <line x1="888.8889" y1="83.5556" x2="888.8889" y2="96" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="888.8889" y="108.4444" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">6</text>
  <line x1="1022.2222" y1="83.5556" x2="1022.2222" y2="96" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="1022.2222" y="108.4444" text-anchor="middle" font-family="monospace" font-size="11.5556" fill="var(--text-faint)">7</text>
  <text x="568.8889" y="122.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">batch interval = 1s</text>
  <text x="26.6667" y="155.5556" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Input</text>
  <text x="26.6667" y="173.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">DStream</text>
  <rect x="88.8889" y="137.7778" width="124.4444" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="151.1111" y="164.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">RDD[0]</text>
  <rect x="222.2222" y="137.7778" width="124.4444" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="284.4444" y="164.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">RDD[1]</text>
  <rect x="355.5556" y="137.7778" width="124.4444" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="417.7778" y="164.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">RDD[2]</text>
  <rect x="488.8889" y="137.7778" width="124.4444" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="551.1111" y="164.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">RDD[3]</text>
  <rect x="622.2222" y="137.7778" width="124.4444" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="684.4444" y="164.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">RDD[4]</text>
  <rect x="755.5556" y="137.7778" width="124.4444" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="817.7778" y="164.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">RDD[5]</text>
  <rect x="888.8889" y="137.7778" width="124.4444" height="44.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="951.1111" y="164.4444" text-anchor="middle" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">RDD[6]</text>
  <text x="26.6667" y="240" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Window</text>
  <text x="26.6667" y="257.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)">3s / slide 1s</text>
  <rect x="88.8889" y="222.2222" width="391.1111" height="44.4444" rx="6" fill="var(--primary-fill)" opacity="0.7" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="284.4444" y="248.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">w1: RDD[0]+[1]+[2]</text>
  <rect x="222.2222" y="280.8889" width="391.1111" height="44.4444" rx="6" fill="var(--primary-fill)" opacity="0.7" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="417.7778" y="307.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">w2: RDD[1]+[2]+[3]</text>
  <rect x="355.5556" y="339.5556" width="391.1111" height="44.4444" rx="6" fill="var(--primary-fill)" opacity="0.7" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="551.1111" y="366.2222" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">w3: RDD[2]+[3]+[4]</text>
  <line x1="88.8889" y1="408.8889" x2="222.2222" y2="408.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="155.5556" y="424.8889" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">slide = 1s</text>
  <line x1="222.2222" y1="408.8889" x2="355.5556" y2="408.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <rect x="26.6667" y="444.4444" width="551.1111" height="85.3333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="302.2222" y="467.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--text)">Code</text>
  <text x="44.4444" y="488.8889" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">windowed = stream.window(</text>
  <text x="44.4444" y="508.4444" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">    windowDuration=3,   # seconds</text>
  <text x="44.4444" y="528" font-family="monospace" font-size="12.4444" fill="var(--primary-accent)">    slideDuration=1)</text>
  <rect x="604.4444" y="444.4444" width="506.6667" height="85.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="857.7778" y="467.5556" text-anchor="middle" font-family="sans-serif" font-size="13.3333" font-weight="bold" fill="var(--primary-accent)">Key parameters</text>
  <text x="622.2222" y="488.8889" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">windowDuration: how much history to include</text>
  <text x="622.2222" y="508.4444" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">slideDuration: how often result is computed</text>
  <text x="622.2222" y="528" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Both must be multiples of the batch interval</text>
</svg>
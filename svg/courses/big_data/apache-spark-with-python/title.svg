<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <polygon points="640,88.3333 572.5,289.7223 647.5,289.7223 580,563.6111 715,253.4723 640,253.4723 700,88.3333" fill="var(--warn-accent)" opacity="0.85"/>
  <circle cx="220" cy="156" r="34.7611" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="1060" cy="156" r="34.7611" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="220" cy="504" r="34.7611" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="1060" cy="504" r="34.7611" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="190" cy="330" r="27.8088" fill="var(--warn-accent)" opacity="0.4"/>
  <circle cx="1090" cy="330" r="27.8088" fill="var(--warn-accent)" opacity="0.4"/>
  <line x1="257.5" y1="156" x2="580" y2="281.6667" stroke="var(--warn-border)" stroke-width="1.7778" opacity="0.3"/>
  <line x1="1022.5" y1="156" x2="700" y2="253.4723" stroke="var(--warn-border)" stroke-width="1.7778" opacity="0.3"/>
  <line x1="257.5" y1="504" x2="587.5" y2="434.7223" stroke="var(--warn-border)" stroke-width="1.7778" opacity="0.3"/>
  <line x1="1022.5" y1="504" x2="700" y2="434.7223" stroke="var(--warn-border)" stroke-width="1.7778" opacity="0.3"/>
  <path d="M 339.9999 272 Q 339.9999 243 370 243 L 430 243 Q 460 243 460 272 L 460 330 Q 460 359 430 359 L 370 359 Q 339.9999 359 339.9999 330 Z" fill="var(--info-fill)" opacity="0.7"/>
  <circle cx="377.5" cy="264.75" r="6.9522" fill="var(--warn-fill)" opacity="0.9"/>
  <circle cx="422.5" cy="337.25" r="6.9522" fill="var(--warn-fill)" opacity="0.9"/>
  <line x1="820" y1="214" x2="910" y2="214" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="835" y1="253.4723" x2="955" y2="253.4723" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <line x1="820" y1="292.9444" x2="925" y2="292.9444" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="850" y1="332.4167" x2="970" y2="332.4167" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
    
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Apache Spark With Python</text>
</svg>

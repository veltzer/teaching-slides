<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <polygon points="640,88.3333 572.5,289.7223 647.5,289.7223 580,563.6111 715,253.4723 640,253.4723 700,88.3333" fill="var(--warn-accent)" opacity="0.85"/>
  <circle cx="220" cy="156" r="34.7611" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="1060" cy="156" r="34.7611" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="220" cy="504" r="34.7611" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="1060" cy="504" r="34.7611" fill="var(--warn-accent)" opacity="0.5"/>
  <circle cx="190" cy="330" r="27.8088" fill="var(--warn-accent)" opacity="0.4"/>
  <circle cx="1090" cy="330" r="27.8088" fill="var(--warn-accent)" opacity="0.4"/>
  <line x1="257.5" y1="156" x2="580" y2="281.6667" stroke="var(--warn-border)" stroke-width="1.7778" opacity="0.3"/>
  <line x1="1022.5" y1="156" x2="700" y2="253.4723" stroke="var(--warn-border)" stroke-width="1.7778" opacity="0.3"/>
  <line x1="257.5" y1="504" x2="587.5" y2="434.7223" stroke="var(--warn-border)" stroke-width="1.7778" opacity="0.3"/>
  <line x1="1022.5" y1="504" x2="700" y2="434.7223" stroke="var(--warn-border)" stroke-width="1.7778" opacity="0.3"/>
  <path d="M 339.9999 272 Q 339.9999 243 370 243 L 430 243 Q 460 243 460 272 L 460 330 Q 460 359 430 359 L 370 359 Q 339.9999 359 339.9999 330 Z" fill="var(--info-fill)" opacity="0.7"/>
  <circle cx="377.5" cy="264.75" r="6.9522" fill="var(--warn-fill)" opacity="0.9"/>
  <circle cx="422.5" cy="337.25" r="6.9522" fill="var(--warn-fill)" opacity="0.9"/>
  <line x1="820" y1="214" x2="910" y2="214" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="835" y1="253.4723" x2="955" y2="253.4723" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <line x1="820" y1="292.9444" x2="925" y2="292.9444" stroke="var(--primary-border)" stroke-width="2" opacity="0.5"/>
  <line x1="850" y1="332.4167" x2="970" y2="332.4167" stroke="var(--primary-border)" stroke-width="2" opacity="0.4"/>
  <text x="640" y="595.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.5947" fill="var(--border)" letter-spacing="3">APACHE SPARK WITH PYTHON</text>
</svg>

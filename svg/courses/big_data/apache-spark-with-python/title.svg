<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Spark lightning bolt -->
  <polygon points="400,30 355,180 405,180 360,370 450,150 400,150 440,30" fill="#e8590c" opacity="0.85"/>
  <!-- Distributed data circles -->
  <circle cx="120" cy="80" r="25" fill="#f76707" opacity="0.5"/>
  <circle cx="680" cy="80" r="25" fill="#f76707" opacity="0.5"/>
  <circle cx="120" cy="320" r="25" fill="#f76707" opacity="0.5"/>
  <circle cx="680" cy="320" r="25" fill="#f76707" opacity="0.5"/>
  <circle cx="100" cy="200" r="20" fill="#f76707" opacity="0.4"/>
  <circle cx="700" cy="200" r="20" fill="#f76707" opacity="0.4"/>
  <!-- Connection lines to bolt -->
  <line x1="145" y1="80" x2="360" y2="170" stroke="#f76707" stroke-width="1.5" opacity="0.3"/>
  <line x1="655" y1="80" x2="440" y2="150" stroke="#f76707" stroke-width="1.5" opacity="0.3"/>
  <line x1="145" y1="320" x2="365" y2="280" stroke="#f76707" stroke-width="1.5" opacity="0.3"/>
  <line x1="655" y1="320" x2="440" y2="280" stroke="#f76707" stroke-width="1.5" opacity="0.3"/>
  <!-- Python logo element -->
  <path d="M200,160 Q200,140 220,140 L260,140 Q280,140 280,160 L280,200 Q280,220 260,220 L220,220 Q200,220 200,200 Z" fill="#3776ab" opacity="0.7"/>
  <circle cx="225" cy="155" r="5" fill="#ffd43b" opacity="0.9"/>
  <circle cx="255" cy="205" r="5" fill="#ffd43b" opacity="0.9"/>
  <!-- Data stream lines -->
  <line x1="520" y1="120" x2="580" y2="120" stroke="#74c0fc" stroke-width="3" opacity="0.5"/>
  <line x1="530" y1="150" x2="610" y2="150" stroke="#74c0fc" stroke-width="3" opacity="0.4"/>
  <line x1="520" y1="180" x2="590" y2="180" stroke="#74c0fc" stroke-width="3" opacity="0.5"/>
  <line x1="540" y1="210" x2="620" y2="210" stroke="#74c0fc" stroke-width="3" opacity="0.4"/>
  <!-- Title -->
  <text x="400" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#adb5bd" letter-spacing="3">APACHE SPARK WITH PYTHON</text>

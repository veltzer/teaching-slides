<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="73.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">YARN Metrics and Visualization Pipeline</text>
  <rect x="96.25" y="185" width="243.75" height="96.6667" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="218.125" y="215.6111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">YARN Metrics</text>
  <text x="218.125" y="235.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">CPU utilization</text>
  <text x="218.125" y="251.8611" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Memory utilization</text>
  <text x="218.125" y="267.9723" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Container counts</text>
  <rect x="96.25" y="346.1111" width="243.75" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="218.125" y="376.7223" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)">Spark Metrics</text>
  <text x="218.125" y="396.8611" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Stage duration</text>
  <text x="218.125" y="412.9723" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Task throughput</text>
  <text x="218.125" y="429.0833" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Shuffle read/write</text>
  <rect x="508.7499" y="257.5" width="262.5" height="104.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="289.7223" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3806" font-weight="bold" fill="var(--warn-accent)">Graphite</text>
  <text x="640" y="312.2777" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Time-series store</text>
  <text x="640" y="328.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Aggregation</text>
  <text x="640" y="344.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Retention policies</text>
  <rect x="930.6249" y="257.5" width="262.5" height="104.7223" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="1061.875" y="289.7223" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">Grafana</text>
  <text x="1061.875" y="312.2777" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Dashboards</text>
  <text x="1061.875" y="328.3889" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Alerts</text>
  <text x="1061.875" y="344.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-muted)">Visual analytics</text>
  <line x1="339.9999" y1="241.3889" x2="508.7499" y2="297.7777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="429.0625" y="259.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.4284" fill="var(--text-faint)" font-style="italic">collect</text>
  <line x1="339.9999" y1="386.3889" x2="508.7499" y2="346.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="429.0625" y="382.3611" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.4284" fill="var(--text-faint)" font-style="italic">collect</text>
  <line x1="771.25" y1="309.8611" x2="930.6249" y2="309.8611" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="850.9375" y="301.8056" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.4284" fill="var(--text-faint)" font-style="italic">visualize</text>
  <text x="640" y="491.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text-muted)">Example: CPU Utilization per Node</text>
  <rect x="368.125" y="531.3889" width="56.25" height="0" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="368.125" y="509.6389" width="56.25" height="21.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="396.25" y="543.4723" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Node 1</text>
  <text x="396.25" y="505.6111" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">45%</text>
  <rect x="471.25" y="491.1111" width="56.25" height="40.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="499.375" y="543.4723" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Node 2</text>
  <text x="499.375" y="487.0833" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">83%</text>
  <rect x="574.375" y="499.1667" width="56.25" height="32.2223" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="602.5" y="543.4723" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Node 3</text>
  <text x="602.5" y="495.1389" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">67%</text>
  <rect x="677.4999" y="515.2777" width="56.25" height="16.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="705.625" y="543.4723" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Node 4</text>
  <text x="705.625" y="511.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">33%</text>
  <rect x="780.625" y="503.1944" width="56.25" height="28.1944" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="808.75" y="543.4723" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Node 5</text>
  <text x="808.75" y="499.1667" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">58%</text>
  <line x1="358.75" y1="531.3889" x2="855.6249" y2="531.3889" stroke="var(--border)" stroke-width="0.8889" />
</svg>
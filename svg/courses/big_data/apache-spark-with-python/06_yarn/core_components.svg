  <text x="736.428571" y="439.207078" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.814066" fill="var(--primary-accent)">Container 4</text>
  <rect x="918.571429" y="405.765735" width="150" height="57.477539" rx="7.305787" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />

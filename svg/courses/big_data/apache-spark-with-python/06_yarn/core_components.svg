  <rect x="500.714286" y="40" width="300" height="78.378427" rx="7.305787" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="650.714286" y="71.351267" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046795" font-weight="bold" fill="var(--warn-accent)">Resource Manager</text>
  <text x="650.714286" y="98.522383" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.756066" fill="var(--text-faint)" font-style="italic">(Master)</text>

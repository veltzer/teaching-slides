  <rect x="104.285714" y="264.684644" width="267.857143" height="67.927919" rx="7.305787" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="238.214286" y="305.441317" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.93043" fill="var(--ok-accent)">Node Manager 1</text>

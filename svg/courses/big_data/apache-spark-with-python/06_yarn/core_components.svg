  <line x1="848.8889" y1="102.2222" x2="142.2222" y2="346.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <line x1="880" y1="102.2222" x2="280" y2="346.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <line x1="911.1111" y1="102.2222" x2="493.3333" y2="346.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <line x1="942.2222" y1="102.2222" x2="631.1111" y2="346.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <line x1="973.3333" y1="102.2222" x2="844.4444" y2="346.6667" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow)" />
  <line x1="800" y1="524.4444" x2="853.3333" y2="524.4444" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" />
  <text x="862.2222" y="528.8889" font-family="Arial, sans-serif" font-size="11.5556" fill="var(--text-faint)">resource request</text>

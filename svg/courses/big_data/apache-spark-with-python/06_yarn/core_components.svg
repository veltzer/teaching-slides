  <line x1="257.7778" y1="284.4444" x2="280" y2="346.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="506.6667" y1="284.4444" x2="493.3333" y2="346.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />

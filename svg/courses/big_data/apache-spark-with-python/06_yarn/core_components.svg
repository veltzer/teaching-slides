<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Client -->
  <rect x="60" y="45" width="190" height="65" rx="8" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1565c0">Client</text>
  <!-- Resource Manager -->
  <rect x="490" y="40" width="280" height="75" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">Resource Manager</text>
  <text x="630" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888888" font-style="italic">(Master)</text>
  <!-- Application Master -->
  <rect x="900" y="40" width="280" height="75" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">Application Master</text>
  <text x="1040" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888888" font-style="italic">(per application)</text>
  <!-- Node Managers -->
  <rect x="120" y="255" width="250" height="65" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="245" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2e7d32">Node Manager 1</text>
  <rect x="515" y="255" width="250" height="65" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2e7d32">Node Manager 2</text>
  <rect x="910" y="255" width="250" height="65" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2e7d32">Node Manager n</text>
  <!-- Containers row 1 -->
  <rect x="90" y="390" width="140" height="55" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1565c0">Container 1</text>
  <rect x="245" y="390" width="140" height="55" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="315" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1565c0">Container 2</text>
  <rect x="485" y="390" width="140" height="55" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="555" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1565c0">Container 3</text>
  <rect x="640" y="390" width="140" height="55" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1565c0">Container 4</text>
  <rect x="880" y="390" width="140" height="55" rx="6" fill="url(#grad-surface)" stroke="#1e88e5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="950" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1565c0">Container 5</text>
  <!-- Arrows: client to RM -->
  <line x1="250" y1="78" x2="490" y2="78" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- RM to App Master -->
  <line x1="770" y1="78" x2="900" y2="78" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- RM to Node Managers -->
  <line x1="555" y1="115" x2="270" y2="255" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="115" x2="640" y2="255" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="705" y1="115" x2="1010" y2="255" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Node Managers to Containers -->
  <line x1="200" y1="320" x2="160" y2="390" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="320" x2="315" y2="390" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="320" x2="555" y2="390" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="320" x2="710" y2="390" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="975" y1="320" x2="950" y2="390" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- App Master dashed lines to containers (resource requests) -->
  <line x1="955" y1="115" x2="160" y2="390" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="990" y1="115" x2="315" y2="390" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="1025" y1="115" x2="555" y2="390" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="1060" y1="115" x2="710" y2="390" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="1095" y1="115" x2="950" y2="390" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <!-- Legend for dashed lines -->
  <line x1="900" y1="590" x2="960" y2="590" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="970" y="595" font-family="Arial, sans-serif" font-size="13" fill="#888888">resource request</text>
</svg>

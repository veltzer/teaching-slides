  <rect x="152.5" y="245.4167" width="234.375" height="52.3611" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="269.6875" y="276.8333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--ok-accent)">Node Manager 1</text>

  <text x="705.625" y="379.9444" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1663" fill="var(--primary-accent)">Container 4</text>
  <rect x="865" y="354.1667" width="131.25" height="44.3056" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="930.6249" y="379.9444" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1663" fill="var(--primary-accent)">Container 5</text>

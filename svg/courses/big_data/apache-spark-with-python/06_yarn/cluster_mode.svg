<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="201.1111" width="187.5" height="64.4444" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="161.875" y="237.3611" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">Client</text>
  <text x="161.875" y="255.0833" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-faint)" font-style="italic">submits job</text>
  <rect x="302.5" y="64.1667" width="918.75" height="491.3889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.1111 3.5556" />
  <text x="761.8749" y="86.7223" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1663" fill="var(--primary-accent)" font-weight="bold">YARN Cluster</text>
  <rect x="339.9999" y="104.4444" width="262.5" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="471.25" y="132.6389" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--warn-accent)">Resource Manager</text>
  <text x="471.25" y="155.1944" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-faint)" font-style="italic">allocates AM container</text>
  <rect x="696.25" y="88.3333" width="299.9999" height="96.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="846.2499" y="118.9444" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)">Application Master</text>
  <rect x="724.375" y="128.6111" width="243.75" height="40.2777" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="846.2499" y="153.5833" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" font-weight="bold" fill="var(--bg)">Driver (inside AM)</text>
  <rect x="358.75" y="273.6111" width="225" height="52.3611" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="471.25" y="305.0277" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--ok-accent)">Node Manager 1</text>
  <rect x="358.75" y="346.1111" width="225" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="471.25" y="375.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--warn-accent)">Executor 1</text>
  <rect x="677.4999" y="273.6111" width="225" height="52.3611" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="790" y="305.0277" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--ok-accent)">Node Manager 2</text>
  <rect x="677.4999" y="346.1111" width="225" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="790" y="375.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--warn-accent)">Executor 2</text>
  <line x1="255.6249" y1="233.3333" x2="339.9999" y2="201.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="602.5" y1="128.6111" x2="696.25" y2="128.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="433.75" y1="168.8889" x2="433.75" y2="273.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="508.7499" y1="168.8889" x2="752.5" y2="273.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="471.25" y1="325.9723" x2="471.25" y2="346.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="790" y1="325.9723" x2="790" y2="346.1111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="790" y1="185" x2="499.375" y2="346.1111" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow-primary)" />
  <line x1="846.2499" y1="185" x2="808.75" y2="346.1111" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow-primary)" />
  <text x="640" y="491.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--primary-accent)" font-style="italic">Driver runs inside the cluster - no client-side JVM needed during execution</text>
</svg>
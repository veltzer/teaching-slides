<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="331.707317" height="393.220498" rx="6.761514" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.1111 3.5556" filter="url(#shadow)"/>
  <text x="205.853659" y="67.525482" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.710435" fill="var(--text-muted)" font-weight="bold">Client Machine</text>
  <rect x="74.146341" y="89.152456" width="263.414634" height="78.644026" rx="6.761514" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="205.853659" y="126.508502" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.586529" font-weight="bold" fill="var(--bg)">Driver</text>
  <text x="205.853659" y="151.084669" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.731255" fill="var(--primary-accent)">SparkContext here</text>
  <rect x="74.146341" y="216.949181" width="263.414634" height="68.813584" rx="6.761514" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="205.853659" y="258.237283" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627831" font-weight="bold" fill="var(--primary-accent)">SparkContext</text>
  <rect x="420.487805" y="40" width="819.512195" height="580" rx="6.761514" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.1111 3.5556" filter="url(#shadow)"/>
  <text x="830.243902" y="67.525482" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.710435" fill="var(--primary-accent)" font-weight="bold">YARN Cluster</text>
  <rect x="508.292683" y="89.152456" width="263.414634" height="78.644026" rx="6.761514" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="640" y="123.559309" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.627831" font-weight="bold" fill="var(--warn-accent)">Resource Manager</text>
  <text x="640" y="151.084669" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.731255" fill="var(--text-faint)" font-style="italic">schedules containers</text>
  <rect x="459.512195" y="236.610066" width="224.39014" height="63.898302" rx="6.761514" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="571.707317" y="273.966113" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.669133" fill="var(--ok-accent)">Node Manager 1</text>
  <rect x="459.512195" y="325.084657" width="224.39014" height="58.98302" rx="6.761514" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="571.707317" y="360.474493" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.669133" fill="var(--warn-accent)">Executor 1</text>
  <rect x="761.951115" y="236.610066" width="224.39014" height="63.898302" rx="6.761514" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="874.146341" y="273.966113" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.669133" fill="var(--ok-accent)">Node Manager 2</text>
  <rect x="761.951115" y="325.084657" width="224.39014" height="58.98302" rx="6.761514" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="874.146341" y="360.474493" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.669133" fill="var(--warn-accent)">Executor 2</text>
  <line x1="337.560976" y1="295.593208" x2="508.292683" y2="295.593208" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="423.414634" y="290.677926" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.751962" fill="var(--text-faint)" font-style="italic">job submit</text>
  <line x1="596.097561" y1="167.796604" x2="542.43892" y2="236.610066" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="683.902439" y1="167.796604" x2="830.243902" y2="236.610066" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="571.707317" y1="300.50849" x2="571.707317" y2="325.084657" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="874.146341" y1="300.50849" x2="874.146341" y2="325.084657" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="337.560976" y1="138.305155" x2="508.292683" y2="359.491632" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow-primary)" />
  <line x1="337.560976" y1="138.305155" x2="761.951115" y2="359.491632" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow-primary)" />
  <text x="459.512195" y="502.033838" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.731255" fill="var(--primary-accent)" font-style="italic">Driver dispatches tasks directly to executors</text>
</svg>
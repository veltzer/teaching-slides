<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="68.125" y="64.1667" width="318.75" height="322.2223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="7.1111 3.5556" />
  <text x="227.5" y="86.7223" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1663" fill="var(--text-muted)" font-weight="bold">Client Machine</text>
  <rect x="100.9375" y="104.4444" width="253.125" height="64.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="227.5" y="135.0556" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">Driver</text>
  <text x="227.5" y="155.1944" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--primary-accent)">SparkContext here</text>
  <rect x="100.9375" y="209.1667" width="253.125" height="56.3889" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="227.5" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">SparkContext</text>
  <rect x="433.75" y="64.1667" width="787.5" height="475.2777" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="7.1111 3.5556" />
  <text x="827.5" y="86.7223" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1663" fill="var(--primary-accent)" font-weight="bold">YARN Cluster</text>
  <rect x="518.125" y="104.4444" width="253.125" height="64.4444" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="644.6875" y="132.6389" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6425" font-weight="bold" fill="var(--warn-accent)">Resource Manager</text>
  <text x="644.6875" y="155.1944" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--text-faint)" font-style="italic">schedules containers</text>
  <rect x="471.25" y="225.2777" width="215.6249" height="52.3611" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="579.0625" y="255.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--ok-accent)">Node Manager 1</text>
  <rect x="471.25" y="297.7777" width="215.6249" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="579.0625" y="326.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--warn-accent)">Executor 1</text>
  <rect x="761.8749" y="225.2777" width="215.6249" height="52.3611" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="869.6875" y="255.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--ok-accent)">Node Manager 2</text>
  <rect x="761.8749" y="297.7777" width="215.6249" height="48.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <text x="869.6875" y="326.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9044" fill="var(--warn-accent)">Executor 2</text>
  <line x1="354.0625" y1="273.6111" x2="518.125" y2="273.6111" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="436.5625" y="269.5833" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.4284" fill="var(--text-faint)" font-style="italic">job submit</text>
  <line x1="602.5" y1="168.8889" x2="550.9374" y2="225.2777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="686.875" y1="168.8889" x2="827.5" y2="225.2777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="579.0625" y1="277.6389" x2="579.0625" y2="297.7777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="869.6875" y1="277.6389" x2="869.6875" y2="297.7777" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="354.0625" y1="144.7223" x2="518.125" y2="325.9723" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow-primary)" />
  <line x1="354.0625" y1="144.7223" x2="761.8749" y2="325.9723" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 3.5556" marker-end="url(#arrow-primary)" />
  <text x="471.25" y="442.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.2974" fill="var(--primary-accent)" font-style="italic">Driver dispatches tasks directly to executors</text>
</svg>
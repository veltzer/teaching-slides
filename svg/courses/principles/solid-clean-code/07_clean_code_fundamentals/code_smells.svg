<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Common Code Smells</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Bloaters</text>
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Long methods</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Large classes</text>
  <text x="60" y="225" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Long parameter lists</text>
  <text x="60" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Primitive obsession</text>
  <text x="60" y="295" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Code grew unchecked</text>
  <text x="60" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Fix: extract method</text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Fix: extract class</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Couplers</text>
  <text x="365" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Feature envy</text>
  <text x="365" y="195" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Inappropriate intimacy</text>
  <text x="365" y="225" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Message chains</text>
  <text x="365" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Middle man</text>
  <text x="365" y="295" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Modules know too much</text>
  <text x="365" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Fix: move method</text>
  <text x="365" y="370" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Fix: hide delegate</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Dispensables</text>
  <text x="670" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Dead code</text>
  <text x="670" y="195" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Duplicated code</text>
  <text x="670" y="225" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Speculative generality</text>
  <text x="670" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Comments hiding bad code</text>
  <text x="670" y="295" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Pure clutter</text>
  <text x="670" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Fix: delete it</text>
  <text x="670" y="370" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Fix: extract function</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Change Preventers</text>
  <text x="975" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Divergent change</text>
  <text x="975" y="195" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Shotgun surgery</text>
  <text x="975" y="225" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Parallel hierarchies</text>
  <text x="975" y="255" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Conditional complexity</text>
  <text x="975" y="295" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">Edits ripple wide</text>
  <text x="975" y="345" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Fix: split class</text>
  <text x="975" y="370" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Fix: replace conditional</text>
</svg>

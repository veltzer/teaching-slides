<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Splitting a God Class by Actor</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Before</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">Employee class</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">calculatePay()</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">reportHours()</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">save()</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">Three actors</text>
  <text x="60" y="310" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Finance, HR, DBA</text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--danger-text)">All edit same class</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">PayCalculator</text>
  <text x="365" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Owner: Finance</text>
  <text x="365" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Reads policy</text>
  <text x="365" y="220" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Tax rules</text>
  <text x="365" y="245" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Bonus formula</text>
  <text x="365" y="285" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Changes when</text>
  <text x="365" y="310" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">payroll law shifts</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">HourReporter</text>
  <text x="670" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Owner: HR</text>
  <text x="670" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Calculates hours</text>
  <text x="670" y="220" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Per week or month</text>
  <text x="670" y="245" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Time tracking format</text>
  <text x="670" y="285" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Changes when</text>
  <text x="670" y="310" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">reports differ</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">EmployeeRepository</text>
  <text x="975" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Owner: DBA</text>
  <text x="975" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Saves and loads</text>
  <text x="975" y="220" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Schema mapping</text>
  <text x="975" y="245" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Query tuning</text>
  <text x="975" y="285" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Changes when</text>
  <text x="975" y="310" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">storage migrates</text>
</svg>

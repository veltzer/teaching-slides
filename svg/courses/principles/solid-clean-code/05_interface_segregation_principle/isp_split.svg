<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Interface Segregation</text>
  <rect x="40" y="80" width="585" height="540" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="332" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Fat interface</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">interface Worker {</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">  work()</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">  eat()</text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">  sleep()</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">}</text>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">RobotWorker can't eat or sleep</text>
  <text x="60" y="365" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Forced to throw or stub</text>
  <text x="60" y="395" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Coupled to unused methods</text>
  <rect x="640" y="80" width="600" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="940" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Split interface</text>
  <text x="660" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">interface Workable { work() }</text>
  <text x="660" y="190" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">interface Eatable { eat() }</text>
  <text x="660" y="220" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">interface Sleepable { sleep() }</text>
  <text x="660" y="280" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Robot implements Workable only</text>
  <text x="660" y="335" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Mix what each class needs</text>
  <text x="660" y="365" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Tests target specific roles</text>
  <text x="660" y="395" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Loosely coupled</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Liskov Substitution Principle</text>

  <rect x="40" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--danger-text)">Violates LSP</text>
  <rect x="60.689655172414" y="151.743119266055" width="537.931034482759" height="234.128440366972" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="81.379310344828" y="183.669724770642" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">class Bird {</text>
  <text x="102.068965517241" y="210.275229357798" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">fly() { ... }</text>
  <text x="81.379310344828" y="236.880733944954" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">}</text>
  <text x="81.379310344828" y="279.449541284404" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">class Penguin extends Bird {</text>
  <text x="102.068965517241" y="306.05504587156" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">fly() {</text>
  <text x="122.758620689655" y="332.660550458716" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">throw new Error(...)</text>
  <text x="102.068965517241" y="359.266055045872" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">}</text>

  <text x="60.689655172414" y="433.761467889908" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--danger-text)">Caller can't trust the contract</text>
  <text x="60.689655172414" y="465.688073394495" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- "Bird" promises fly()</text>
  <text x="60.689655172414" y="492.293577981651" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Penguin breaks it</text>
  <text x="60.689655172414" y="518.899082568807" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Surprises the caller</text>
  <text x="60.689655172414" y="572.110091743119" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--danger-text)">Inheritance abused</text>

  <rect x="660.689655172414" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--ok-text)">Follows LSP</text>
  <rect x="681.379310344828" y="151.743119266055" width="537.931034482759" height="234.128440366972" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="702.068965517241" y="183.669724770642" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">class Bird { ... }</text>
  <text x="702.068965517241" y="220.917431192661" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">interface Flyer {</text>
  <text x="722.758620689655" y="247.522935779817" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">fly()</text>
  <text x="702.068965517241" y="274.128440366972" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">}</text>
  <text x="702.068965517241" y="311.376146788991" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">class Sparrow extends Bird</text>
  <text x="722.758620689655" y="337.981651376147" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">implements Flyer { ... }</text>
  <text x="702.068965517241" y="375.229357798165" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">class Penguin extends Bird { ... }</text>

  <text x="681.379310344828" y="433.761467889908" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">Subtype keeps the contract</text>
  <text x="681.379310344828" y="465.688073394495" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Sparrow flies; Penguin doesn't</text>
  <text x="681.379310344828" y="492.293577981651" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Caller of Flyer gets fly()</text>
  <text x="681.379310344828" y="518.899082568807" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- No surprises</text>
  <text x="681.379310344828" y="572.110091743119" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--ok-text)">Composition / capability split</text>
</svg>

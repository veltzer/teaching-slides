<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.678503320114" font-weight="bold" fill="var(--text)">SOLID Principles</text>

  <rect x="40" y="89.714285714286" width="223.728813559322" height="265.142857142857" rx="10.599465471469" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.864406779661" y="128.380952380952" text-anchor="middle" font-family="Arial, sans-serif" font-size="38.15807569729" font-weight="bold" fill="var(--primary-text)">S</text>
  <text x="151.864406779661" y="167.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" font-weight="bold" fill="var(--primary-text)">Single Responsibility</text>
  <text x="60.338983050847" y="211.238095238095" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--primary-text)">Each class one reason</text>
  <text x="60.338983050847" y="235.542857142857" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--primary-text)">to change</text>
  <text x="60.338983050847" y="288.571428571429" font-family="Arial, sans-serif" font-size="12.719358565763" font-style="italic" fill="var(--primary-text)">Cohesion over breadth</text>

  <rect x="284.067796610169" y="89.714285714286" width="223.728813559322" height="265.142857142857" rx="10.599465471469" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="395.932203389831" y="128.380952380952" text-anchor="middle" font-family="Arial, sans-serif" font-size="38.15807569729" font-weight="bold" fill="var(--ok-text)">O</text>
  <text x="395.932203389831" y="167.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" font-weight="bold" fill="var(--ok-text)">Open / Closed</text>
  <text x="304.406779661017" y="211.238095238095" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--ok-text)">Open for extension</text>
  <text x="304.406779661017" y="235.542857142857" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--ok-text)">Closed for change</text>
  <text x="304.406779661017" y="288.571428571429" font-family="Arial, sans-serif" font-size="12.719358565763" font-style="italic" fill="var(--ok-text)">Strategy, plugins</text>

  <rect x="528.135593220339" y="89.714285714286" width="223.728813559322" height="265.142857142857" rx="10.599465471469" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="128.380952380952" text-anchor="middle" font-family="Arial, sans-serif" font-size="38.15807569729" font-weight="bold" fill="var(--warn-text)">L</text>
  <text x="640" y="167.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" font-weight="bold" fill="var(--warn-text)">Liskov Substitution</text>
  <text x="548.474576271186" y="211.238095238095" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--warn-text)">Subtypes substitute</text>
  <text x="548.474576271186" y="235.542857142857" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--warn-text)">parents safely</text>
  <text x="548.474576271186" y="288.571428571429" font-family="Arial, sans-serif" font-size="12.719358565763" font-style="italic" fill="var(--warn-text)">No surprises</text>

  <rect x="772.203389830509" y="89.714285714286" width="223.728813559322" height="265.142857142857" rx="10.599465471469" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="884.067796610169" y="128.380952380952" text-anchor="middle" font-family="Arial, sans-serif" font-size="38.15807569729" font-weight="bold" fill="var(--info-text)">I</text>
  <text x="884.067796610169" y="167.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" font-weight="bold" fill="var(--info-text)">Interface Segregation</text>
  <text x="792.542372881356" y="211.238095238095" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--info-text)">Small, focused</text>
  <text x="792.542372881356" y="235.542857142857" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--info-text)">interfaces</text>
  <text x="792.542372881356" y="288.571428571429" font-family="Arial, sans-serif" font-size="12.719358565763" font-style="italic" fill="var(--info-text)">No fat APIs</text>

  <rect x="1016.271186440678" y="89.714285714286" width="223.728813559322" height="265.142857142857" rx="10.599465471469" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.135593220339" y="128.380952380952" text-anchor="middle" font-family="Arial, sans-serif" font-size="38.15807569729" font-weight="bold" fill="var(--danger-text)">D</text>
  <text x="1128.135593220339" y="167.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" font-weight="bold" fill="var(--danger-text)">Dependency Inversion</text>
  <text x="1036.610169491525" y="211.238095238095" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--danger-text)">Depend on</text>
  <text x="1036.610169491525" y="235.542857142857" font-family="Arial, sans-serif" font-size="13.77930511291" fill="var(--danger-text)">abstractions</text>
  <text x="1036.610169491525" y="288.571428571429" font-family="Arial, sans-serif" font-size="12.719358565763" font-style="italic" fill="var(--danger-text)">Inject dependencies</text>

  <rect x="40" y="399.047619047619" width="1200" height="220.952380952381" rx="10.599465471469" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.830508474576" y="443.238095238095" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.198930942939" font-weight="bold" fill="var(--text)">Why these five</text>
  <text x="629.830508474576" y="481.904761904762" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--text)">Together they describe code that's easy to change without breaking things</text>
  <text x="629.830508474576" y="515.047619047619" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--text-muted)">Each principle pulls toward decoupling and clear boundaries</text>
  <text x="629.830508474576" y="548.190476190476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.839251660057" fill="var(--text-muted)">Memorize the names; internalize the shape they push code into</text>
  <text x="629.830508474576" y="592.380952380952" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.77930511291" font-style="italic" fill="var(--text-muted)">Beware over-applying — abstractions also have a cost</text>
</svg>

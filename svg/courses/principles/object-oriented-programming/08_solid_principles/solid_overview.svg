<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dba868"/><stop offset="100%" stop-color="#9c6e2e"/></linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bd7d75"/><stop offset="100%" stop-color="#7d3f38"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">SOLID: five OOP design heuristics</text>

  <rect x="40" y="100" width="240" height="220" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="160" y="150" text-anchor="middle" font-size="40" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">S</text>
  <text x="160" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Single</text>
  <text x="160" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Responsibility</text>
  <text x="160" y="270" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">one reason to change</text>

  <rect x="290" y="100" width="240" height="220" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="410" y="150" text-anchor="middle" font-size="40" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">O</text>
  <text x="410" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Open /</text>
  <text x="410" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Closed</text>
  <text x="410" y="270" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">extend without modifying</text>

  <rect x="540" y="100" width="240" height="220" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="660" y="150" text-anchor="middle" font-size="40" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">L</text>
  <text x="660" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Liskov</text>
  <text x="660" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Substitution</text>
  <text x="660" y="270" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">subtypes are substitutable</text>

  <rect x="790" y="100" width="240" height="220" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="910" y="150" text-anchor="middle" font-size="40" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">I</text>
  <text x="910" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Interface</text>
  <text x="910" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Segregation</text>
  <text x="910" y="270" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">small focused interfaces</text>

  <rect x="1040" y="100" width="200" height="220" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1140" y="150" text-anchor="middle" font-size="40" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">D</text>
  <text x="1140" y="200" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Dependency</text>
  <text x="1140" y="225" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Inversion</text>
  <text x="1140" y="270" text-anchor="middle" font-size="13" fill="var(--text)" font-family="Arial, sans-serif">depend on abstractions</text>

  <rect x="40" y="380" width="1200" height="160" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="420" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">How they fit together</text>
  <text x="640" y="455" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">SRP gives you small classes &#8594; OCP &amp; LSP let you extend them safely</text>
  <text x="640" y="485" text-anchor="middle" font-size="14" fill="var(--text)" font-family="Arial, sans-serif">ISP keeps the contracts focused &#8594; DIP makes the dependencies pluggable</text>
  <text x="640" y="520" text-anchor="middle" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">violations of one usually drag the others down</text>

  <text x="640" y="620" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">heuristics, not laws &#8226; apply when you smell trouble, not pre-emptively</text>
</svg>

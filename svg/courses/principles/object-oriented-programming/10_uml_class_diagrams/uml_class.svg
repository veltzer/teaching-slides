<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7493b3"/><stop offset="100%" stop-color="#3d5a7d"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#94b384"/><stop offset="100%" stop-color="#5a7a4d"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9384a5"/><stop offset="100%" stop-color="#574a68"/></linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/></marker>
  </defs>

  <text x="40" y="40" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">A UML class box: name, attributes, methods</text>

  <!-- Account class box -->
  <rect x="80" y="100" width="380" height="280" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <line x1="80" y1="160" x2="460" y2="160" stroke="var(--border)" stroke-width="2"/>
  <line x1="80" y1="260" x2="460" y2="260" stroke="var(--border)" stroke-width="2"/>

  <text x="270" y="135" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Account</text>

  <text x="100" y="190" font-size="16" fill="var(--text)" font-family="Courier New, monospace">- balance : double</text>
  <text x="100" y="220" font-size="16" fill="var(--text)" font-family="Courier New, monospace">- owner : Customer</text>
  <text x="100" y="250" font-size="16" fill="var(--text)" font-family="Courier New, monospace">+ TAX_RATE : double  [static]</text>

  <text x="100" y="290" font-size="16" fill="var(--text)" font-family="Courier New, monospace">+ deposit(amount: double): void</text>
  <text x="100" y="320" font-size="16" fill="var(--text)" font-family="Courier New, monospace">+ withdraw(amount: double): bool</text>
  <text x="100" y="350" font-size="16" fill="var(--text)" font-family="Courier New, monospace">+ getBalance(): double</text>

  <!-- Customer class box -->
  <rect x="700" y="100" width="280" height="160" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="6"/>
  <line x1="700" y1="160" x2="980" y2="160" stroke="var(--border)" stroke-width="2"/>
  <line x1="700" y1="220" x2="980" y2="220" stroke="var(--border)" stroke-width="2"/>
  <text x="840" y="135" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Customer</text>
  <text x="720" y="190" font-size="16" fill="var(--text)" font-family="Courier New, monospace">- name : String</text>
  <text x="720" y="250" font-size="16" fill="var(--text)" font-family="Courier New, monospace">+ getName(): String</text>

  <!-- Association line from Account.owner to Customer -->
  <line x1="460" y1="220" x2="700" y2="180" stroke="var(--text)" stroke-width="2"/>
  <text x="475" y="210" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">*</text>
  <text x="685" y="170" font-size="13" fill="var(--text-muted)" font-family="Arial, sans-serif">1</text>

  <!-- Legend -->
  <rect x="40" y="450" width="1200" height="160" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/>
  <text x="640" y="485" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Visibility prefixes</text>
  <text x="200" y="525" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">+  public</text>
  <text x="500" y="525" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">-  private</text>
  <text x="800" y="525" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">#  protected</text>
  <text x="1080" y="525" text-anchor="middle" font-size="16" fill="var(--text)" font-family="Courier New, monospace">~  package</text>
  <text x="640" y="565" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">italic class name = abstract &#8226; underlined member = static</text>
  <text x="640" y="590" text-anchor="middle" font-size="14" fill="var(--text-muted)" font-family="Arial, sans-serif">multiplicity at line ends: 1, 0..1, *, 1..*</text>
  <text x="640" y="620" text-anchor="middle" font-size="13" fill="var(--text-faint)" font-family="Arial, sans-serif">stereotypes in &lt;&lt;...&gt;&gt; for special meanings</text>
</svg>

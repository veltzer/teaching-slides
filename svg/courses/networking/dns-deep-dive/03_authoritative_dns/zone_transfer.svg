<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.793210076336" font-weight="bold" fill="var(--text)">Zone Transfer: Primary to Secondaries</text>

  <!-- Primary -->
  <rect x="40" y="229.911504424779" width="248.275862068966" height="164.247787610619" rx="6.183048479155" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.137931034483" y="276.106194690266" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.610161597182" font-weight="bold" fill="var(--primary-text)">Primary</text>
  <text x="164.137931034483" y="312.035398230089" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--primary-text)">authoritative source</text>
  <text x="164.137931034483" y="342.83185840708" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--primary-text)">all edits made here</text>
  <text x="164.137931034483" y="368.495575221239" text-anchor="middle" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--primary-text)">serial: 2026010102</text>

  <!-- Secondaries -->
  <rect x="805.51724137931" y="86.194690265487" width="248.275862068966" height="123.185840707965" rx="6.183048479155" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="929.655172413793" y="127.256637168142" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--ok-text)">Secondary 1</text>
  <text x="929.655172413793" y="158.053097345133" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">us-east</text>
  <text x="929.655172413793" y="183.716814159292" text-anchor="middle" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--ok-text)">serial: 2026010102</text>

  <rect x="805.51724137931" y="250.442477876106" width="248.275862068966" height="123.185840707965" rx="6.183048479155" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="929.655172413793" y="291.504424778761" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--ok-text)">Secondary 2</text>
  <text x="929.655172413793" y="322.300884955752" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">eu-west</text>
  <text x="929.655172413793" y="347.964601769912" text-anchor="middle" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--ok-text)">serial: 2026010102</text>

  <rect x="805.51724137931" y="414.690265486726" width="248.275862068966" height="123.185840707965" rx="6.183048479155" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="929.655172413793" y="455.752212389381" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--warn-text)">Secondary 3</text>
  <text x="929.655172413793" y="486.548672566372" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">ap-south (catching up)</text>
  <text x="929.655172413793" y="512.212389380531" text-anchor="middle" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--warn-text)">serial: 2026010101</text>

  <!-- arrows -->
  <path d="M 288.275862068966 291.504424778761 Q 495.172413793103 188.849557522124 805.51724137931 147.787610619469" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="484.827586206897" y="209.380530973451" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text-muted)">NOTIFY</text>
  <text x="484.827586206897" y="229.911504424779" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text-muted)">→ AXFR/IXFR</text>

  <path d="M 288.275862068966 312.035398230089 Q 495.172413793103 312.035398230089 805.51724137931 312.035398230089" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="484.827586206897" y="296.637168141593" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text-muted)">NOTIFY → IXFR</text>

  <path d="M 288.275862068966 353.097345132743 Q 495.172413793103 435.221238938053 805.51724137931 476.283185840708" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="484.827586206897" y="445.486725663717" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text-muted)">retry pending...</text>

  <!-- Bottom: explanation -->
  <rect x="40" y="558.407079646018" width="1200" height="61.592920353982" rx="6.183048479155" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="584.070796460177" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--text)">AXFR = full zone transfer · IXFR = incremental · TSIG authenticates the channel</text>
  <text x="640" y="609.734513274336" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--text-muted)">primary pushes changes via NOTIFY; secondaries pull current zone</text>
</svg>

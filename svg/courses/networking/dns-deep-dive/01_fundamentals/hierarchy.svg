<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="650.169491525424" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.683509612306" font-weight="bold" fill="var(--text)">DNS Namespace Hierarchy</text>

  <!-- Root -->
  <rect x="548.474576271186" y="86.607142857143" width="203.389830508475" height="72.5" rx="6.157732987455" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.169491525424" y="122.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.525776624851" font-weight="bold" fill="var(--primary-text)">root  (.)</text>
  <text x="650.169491525424" y="146.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.31546597491" fill="var(--primary-text)">13 logical servers, anycast</text>

  <!-- TLDs -->
  <rect x="101.016949152542" y="221.25" width="183.050847457627" height="72.5" rx="6.157732987455" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.542372881356" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--info-text)">.com</text>

  <rect x="324.745762711864" y="221.25" width="183.050847457627" height="72.5" rx="6.157732987455" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="416.271186440678" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--info-text)">.org</text>

  <rect x="548.474576271186" y="221.25" width="183.050847457627" height="72.5" rx="6.157732987455" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--info-text)">.io</text>

  <rect x="772.203389830509" y="221.25" width="183.050847457627" height="72.5" rx="6.157732987455" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="863.728813559322" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--info-text)">.uk</text>

  <rect x="995.932203389831" y="221.25" width="203.389830508475" height="72.5" rx="6.157732987455" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.627118644068" y="257.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.473198962366" font-weight="bold" fill="var(--info-text)">.dev (et al)</text>

  <line x1="650.169491525424" y1="159.107142857143" x2="192.542372881356" y2="221.25" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="650.169491525424" y1="159.107142857143" x2="416.271186440678" y2="221.25" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="650.169491525424" y1="159.107142857143" x2="640" y2="221.25" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="650.169491525424" y1="159.107142857143" x2="863.728813559322" y2="221.25" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="650.169491525424" y1="159.107142857143" x2="1097.627118644068" y2="221.25" stroke="var(--text-muted)" stroke-width="2"/>

  <!-- Domains -->
  <rect x="60.338983050847" y="345.535714285714" width="203.389830508475" height="62.142857142857" rx="6.157732987455" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="162.033898305085" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--ok-text)">example.com</text>

  <rect x="284.06779661017" y="345.535714285714" width="203.389830508475" height="62.142857142857" rx="6.157732987455" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.762711864407" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--ok-text)">wikipedia.org</text>

  <rect x="507.796610169492" y="345.535714285714" width="203.389830508475" height="62.142857142857" rx="6.157732987455" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.491525423729" y="381.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.368043637396" font-weight="bold" fill="var(--ok-text)">github.io</text>

  <line x1="192.542372881356" y1="293.75" x2="162.033898305085" y2="345.535714285714" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="416.271186440678" y1="293.75" x2="385.762711864407" y2="345.535714285714" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="640" y1="293.75" x2="609.491525423729" y2="345.535714285714" stroke="var(--text-muted)" stroke-width="2"/>

  <!-- Subdomains -->
  <rect x="40" y="459.464285714286" width="183.050847457627" height="51.785714285714" rx="6.157732987455" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="131.525423728814" y="490.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--warn-text)">www.example.com</text>

  <rect x="243.389830508475" y="459.464285714286" width="183.050847457627" height="51.785714285714" rx="6.157732987455" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334.915254237288" y="490.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--warn-text)">mail.example.com</text>

  <rect x="446.779661016949" y="459.464285714286" width="183.050847457627" height="51.785714285714" rx="6.157732987455" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="538.305084745763" y="490.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-weight="bold" fill="var(--warn-text)">en.wikipedia.org</text>

  <line x1="162.033898305085" y1="407.678571428571" x2="131.525423728814" y2="459.464285714286" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="162.033898305085" y1="407.678571428571" x2="334.915254237288" y2="459.464285714286" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="385.762711864407" y1="407.678571428571" x2="538.305084745763" y2="459.464285714286" stroke="var(--text-muted)" stroke-width="2"/>

  <!-- Right side explanation -->
  <rect x="792.542372881356" y="345.535714285714" width="447.457627118644" height="248.571428571429" rx="6.157732987455" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1016.271186440678" y="376.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.420621299881" font-weight="bold" fill="var(--text)">Read right-to-left for hierarchy</text>
  <text x="812.881355932203" y="412.857142857143" font-family="Courier New, monospace" font-size="14.368043637396" fill="var(--text)">www.example.com.</text>
  <text x="812.881355932203" y="443.928571428571" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--text-muted)">- trailing dot is the root</text>
  <text x="812.881355932203" y="467.75" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--text-muted)">- com is the TLD</text>
  <text x="812.881355932203" y="491.571428571429" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--text-muted)">- example is second-level</text>
  <text x="812.881355932203" y="515.392857142857" font-family="Arial, sans-serif" font-size="13.341754806153" fill="var(--text-muted)">- www is the host/subdomain</text>
  <text x="812.881355932203" y="558.892857142857" font-family="Arial, sans-serif" font-size="13.341754806153" font-style="italic" fill="var(--text)">each level delegated to the next</text>

  <text x="650.169491525424" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.341754806153" font-style="italic" fill="var(--text-muted)">resolution walks from root downward; caching makes it fast</text>
</svg>

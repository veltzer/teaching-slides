<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">Encrypted DNS: DoT vs DoH</text>

  <!-- Plain DNS -->
  <text x="308.965517241379" y="87.027027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--danger-accent)">Plain DNS (port 53)</text>
  <rect x="40" y="118.378378378378" width="186.206896551724" height="83.603603603604" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--primary-text)">Client</text>

  <rect x="391.724137931034" y="118.378378378378" width="186.206896551724" height="83.603603603604" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.827586206897" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-text)">Resolver</text>

  <path d="M 226.206896551724 160.18018018018 L 391.724137931034 160.18018018018" fill="none" stroke="var(--danger-fill)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="308.965517241379" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-accent)">UDP/53 — visible</text>
  <text x="308.965517241379" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.437255388021" font-style="italic" fill="var(--danger-accent)">queries visible on path</text>

  <!-- DoT -->
  <text x="308.965517241379" y="264.684684684685" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--ok-accent)">DoT — DNS over TLS (port 853)</text>
  <rect x="40" y="296.036036036036" width="186.206896551724" height="83.603603603604" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="337.837837837838" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--primary-text)">Client</text>

  <rect x="391.724137931034" y="296.036036036036" width="186.206896551724" height="83.603603603604" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.827586206897" y="337.837837837838" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-text)">Resolver</text>

  <path d="M 226.206896551724 337.837837837838 L 391.724137931034 337.837837837838" fill="none" stroke="var(--ok-fill)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="308.965517241379" y="327.387387387387" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-accent)">TCP/853 — encrypted</text>
  <text x="308.965517241379" y="363.963963963964" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.437255388021" font-style="italic" fill="var(--text-muted)">distinct port; identifiable</text>

  <!-- DoH -->
  <text x="308.965517241379" y="442.342342342342" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--ok-accent)">DoH — DNS over HTTPS (port 443)</text>
  <rect x="40" y="473.693693693694" width="186.206896551724" height="83.603603603604" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="515.495495495495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--primary-text)">Client</text>

  <rect x="391.724137931034" y="473.693693693694" width="186.206896551724" height="83.603603603604" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.827586206897" y="515.495495495495" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-text)">Resolver</text>

  <path d="M 226.206896551724 515.495495495495 L 391.724137931034 515.495495495495" fill="none" stroke="var(--ok-fill)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="308.965517241379" y="505.045045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-accent)">TCP/443 — encrypted</text>
  <text x="308.965517241379" y="541.621621621622" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.437255388021" font-style="italic" fill="var(--text-muted)">looks like HTTPS; hard to block</text>

  <!-- Right panel: comparisons -->
  <rect x="640" y="87.027027027027" width="600" height="532.972972972973" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="940" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--text)">Trade-offs</text>

  <text x="660.689655172414" y="165.405405405405" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-accent)">DoT advantages</text>
  <text x="660.689655172414" y="191.531531531532" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- distinct protocol</text>
  <text x="660.689655172414" y="215.567567567568" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- simpler</text>
  <text x="660.689655172414" y="239.603603603604" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- enterprise routable</text>

  <text x="660.689655172414" y="285.585585585586" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-accent)">DoH advantages</text>
  <text x="660.689655172414" y="311.711711711712" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- looks like web</text>
  <text x="660.689655172414" y="335.747747747748" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- bypasses firewalls</text>
  <text x="660.689655172414" y="359.783783783784" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- HTTP/2 multiplexing</text>

  <text x="660.689655172414" y="405.765765765766" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--danger-accent)">What neither solves</text>
  <text x="660.689655172414" y="431.891891891892" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- resolver sees queries</text>
  <text x="660.689655172414" y="455.927927927928" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- TLS metadata: SNI, cert, timing</text>
  <text x="660.689655172414" y="479.963963963964" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- ECS leaks prefix</text>

  <text x="660.689655172414" y="525.945945945946" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--text-muted)">pair with DNSSEC</text>
  <text x="660.689655172414" y="552.072072072072" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--text-muted)">consider Oblivious DoH</text>
  <text x="660.689655172414" y="588.648648648649" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--ok-accent)">trust the resolver</text>
</svg>

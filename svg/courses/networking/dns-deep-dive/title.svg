<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2196f3"/><stop offset="100%" stop-color="#1565c0"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4caf50"/><stop offset="100%" stop-color="#2e7d32"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9c27b0"/><stop offset="100%" stop-color="#6a1b9a"/></linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">DNS Deep Dive</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Resolution, records, DNSSEC, DoH/DoT, attacks and defense</text>

  <!-- Hierarchy: root -> TLD -> domain -->
  <rect x="540" y="240" width="200" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">root (.)</text>

  <rect x="320" y="340" width="160" height="50" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">.com</text>

  <rect x="560" y="340" width="160" height="50" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">.org</text>

  <rect x="800" y="340" width="160" height="50" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="880" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">.io</text>

  <rect x="240" y="430" width="160" height="50" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="320" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">example.com</text>

  <rect x="540" y="430" width="160" height="50" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="620" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">wikipedia.org</text>

  <line x1="640" y1="300" x2="400" y2="340" stroke="var(--surface)" stroke-width="2"/>
  <line x1="640" y1="300" x2="640" y2="340" stroke="var(--surface)" stroke-width="2"/>
  <line x1="640" y1="300" x2="880" y2="340" stroke="var(--surface)" stroke-width="2"/>
  <line x1="400" y1="390" x2="320" y2="430" stroke="var(--surface)" stroke-width="2"/>
  <line x1="640" y1="390" x2="620" y2="430" stroke="var(--surface)" stroke-width="2"/>

  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-faint)">the internet's most-used distributed database</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Recursive DNS Resolution</text>
  <rect x="40" y="80" width="220" height="100" rx="8" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--info-text)">Stub resolver</text>
  <text x="150" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">In your OS</text>

  <rect x="320" y="80" width="280" height="100" rx="8" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-text)">Recursive resolver</text>
  <text x="460" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Caches answers</text>

  <rect x="660" y="80" width="220" height="100" rx="8" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-text)">Root servers</text>
  <text x="770" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">"Ask the .com TLD"</text>

  <rect x="940" y="80" width="220" height="100" rx="8" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-text)">TLD + auth</text>
  <text x="1050" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">"The IP is X"</text>

  <line x1="260" y1="130" x2="320" y2="130" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="130" x2="660" y2="130" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="130" x2="940" y2="130" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="220" width="1200" height="400" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Why caching matters</text>
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">First lookup: stub → resolver → root → TLD → authoritative (slow, ~hundreds of ms)</text>
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">Cached lookup: stub → resolver (cache hit) — sub-millisecond</text>
  <text x="60" y="370" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">TTL controls staleness; lower TTL = faster propagation but more queries</text>
  <text x="60" y="425" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--text)">The hierarchy</text>
  <text x="60" y="455" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Roots delegate to TLDs (.com, .org, country codes)</text>
  <text x="60" y="485" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">TLDs delegate to authoritative nameservers per zone</text>
  <text x="60" y="515" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">Authoritative servers hold the actual records</text>
  <text x="60" y="570" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-muted)">Resolvers shield the rest of the system from this churn</text>
</svg>

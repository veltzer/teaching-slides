<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">Common DNS Record Types</text>

  <rect x="40" y="87.027027027027" width="300" height="125.405405405405" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--primary-text)">A / AAAA</text>
  <text x="190" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">→ IPv4/IPv6</text>
  <text x="190" y="181.081081081081" text-anchor="middle" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--primary-text)">www  A  1.2.3.4</text>

  <rect x="360.689655172414" y="87.027027027027" width="300" height="125.405405405405" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.689655172414" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--info-text)">CNAME</text>
  <text x="510.689655172414" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">alias</text>
  <text x="510.689655172414" y="181.081081081081" text-anchor="middle" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--info-text)">www  CNAME  example.com</text>

  <rect x="681.379310344828" y="87.027027027027" width="300" height="125.405405405405" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.379310344828" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--warn-text)">MX</text>
  <text x="831.379310344828" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">mail server</text>
  <text x="831.379310344828" y="181.081081081081" text-anchor="middle" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--warn-text)">@  MX  10 mail.example.com</text>

  <rect x="1002.068965517241" y="87.027027027027" width="237.931034482759" height="125.405405405405" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.034482758621" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--info-text)">NS</text>
  <text x="1121.034482758621" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">auth server</text>
  <text x="1121.034482758621" y="181.081081081081" text-anchor="middle" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--info-text)">@ NS ns1.example.com</text>

  <rect x="40" y="233.333333333333" width="300" height="125.405405405405" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--ok-text)">TXT</text>
  <text x="190" y="301.261261261261" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">text</text>
  <text x="190" y="327.387387387387" text-anchor="middle" font-family="Courier New, monospace" font-size="11.437255388021" fill="var(--ok-text)">SPF, DKIM, DMARC</text>

  <rect x="360.689655172414" y="233.333333333333" width="300" height="125.405405405405" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="510.689655172414" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--ok-text)">SRV</text>
  <text x="510.689655172414" y="301.261261261261" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">discovery</text>
  <text x="510.689655172414" y="327.387387387387" text-anchor="middle" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--ok-text)">_sip._tcp prio wt port</text>

  <rect x="681.379310344828" y="233.333333333333" width="300" height="125.405405405405" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.379310344828" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--info-text)">PTR</text>
  <text x="831.379310344828" y="301.261261261261" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">reverse</text>
  <text x="831.379310344828" y="327.387387387387" text-anchor="middle" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--info-text)">in-addr.arpa zone</text>

  <rect x="1002.068965517241" y="233.333333333333" width="237.931034482759" height="125.405405405405" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.034482758621" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--warn-text)">CAA</text>
  <text x="1121.034482758621" y="301.261261261261" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">CA auth</text>
  <text x="1121.034482758621" y="327.387387387387" text-anchor="middle" font-family="Courier New, monospace" font-size="11.437255388021" fill="var(--warn-text)">issue "le"</text>

  <rect x="40" y="379.63963963964" width="620.689655172414" height="125.405405405405" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.344827586207" y="416.216216216216" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--primary-text)">SOA — Start of Authority (zone metadata)</text>
  <text x="60.689655172414" y="447.567567567568" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--primary-text)">primary, admin, serial, refresh, retry</text>
  <text x="60.689655172414" y="473.693693693694" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--primary-text)">2026010101 3600 1800 604800 300</text>
  <text x="60.689655172414" y="494.594594594595" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--primary-text)">required at zone apex</text>

  <rect x="681.379310344828" y="379.63963963964" width="558.620689655172" height="125.405405405405" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.689655172414" y="416.216216216216" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--info-text)">DNSSEC: RRSIG, DNSKEY, DS</text>
  <text x="702.068965517241" y="447.567567567568" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">RRSIG — record signature</text>
  <text x="702.068965517241" y="473.693693693694" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">DNSKEY — public key</text>
  <text x="702.068965517241" y="494.594594594595" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">DS — delegation signer</text>

  <text x="640" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--text-muted)">Modern: HTTPS / SVCB / TLSA</text>
  <text x="640" y="588.648648648649" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text-muted)">connection hints, ECH, TLS pinning</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--text-muted)">each type has a specific purpose</text>
</svg>

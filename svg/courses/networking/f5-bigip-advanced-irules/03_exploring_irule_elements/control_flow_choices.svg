<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="380" height="100" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">if / elseif</text>
  <text x="230.0" y="112.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">few conditions</text>
  <rect x="450" y="40" width="380" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">switch -glob</text>
  <text x="640.0" y="112.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">literal patterns</text>
  <rect x="860" y="40" width="380" height="100" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050.0" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">class match</text>
  <text x="1050.0" y="112.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">big lists</text>
  <rect x="40" y="180" width="380" height="300" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="56" y="312.0" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">if { $u starts_with "/a" } {</text>
  <text x="56" y="335.0" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">  pool a</text>
  <text x="56" y="358.0" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">}</text>
  <rect x="450" y="180" width="380" height="300" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="466" y="300.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">switch -glob $u {</text>
  <text x="466" y="323.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">  "/a*" { pool a }</text>
  <text x="466" y="346.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">  default { pool c }</text>
  <text x="466" y="369.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">}</text>
  <rect x="860" y="180" width="380" height="300" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="876" y="323.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">class match -value \</text>
  <text x="876" y="346.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">  $u starts_with dg_routes</text>
  <rect x="40" y="520" width="380" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="230.0" y="575.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">linear cost</text>
  <rect x="450" y="520" width="380" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="575.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">first match wins</text>
  <rect x="860" y="520" width="380" height="100" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1050.0" y="575.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">no code change</text>
</svg>

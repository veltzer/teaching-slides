<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="560" height="300" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="56" y="70" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--text-faint)">request</text>
  <text x="56" y="157.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">GET /app/login?user=bob HTTP/1.1</text>
  <text x="56" y="180.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">Host: www.example.com</text>
  <text x="56" y="203.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">Cookie: session=abc123</text>
  <text x="56" y="226.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">User-Agent: curl/8.5</text>
  <text x="56" y="249.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)"/>
  <text x="56" y="272.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">user=bob&amp;pass=secret</text>
  <rect x="680" y="40" width="560" height="300" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="696" y="70" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--text-faint)">response</text>
  <text x="696" y="157.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">HTTP/1.1 200 OK</text>
  <text x="696" y="180.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">Server: Apache/2.4</text>
  <text x="696" y="203.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">Set-Cookie: session=abc123</text>
  <text x="696" y="226.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">Content-Length: 512</text>
  <text x="696" y="249.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)"/>
  <text x="696" y="272.5" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="var(--surface)">&lt;html&gt;...&lt;/html&gt;</text>
  <rect x="40" y="380" width="170" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.0" y="414.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">HTTP::method</text>
  <rect x="235" y="380" width="170" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.0" y="414.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">HTTP::uri</text>
  <rect x="430" y="380" width="170" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="515.0" y="414.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">HTTP::host</text>
  <rect x="40" y="470" width="170" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.0" y="504.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">HTTP::cookie</text>
  <rect x="235" y="470" width="170" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.0" y="504.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">HTTP::header</text>
  <rect x="430" y="470" width="170" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="515.0" y="504.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--primary-text)">HTTP::payload</text>
  <rect x="40" y="560" width="560" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.0" y="594.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">HTTP_REQUEST / HTTP_REQUEST_DATA</text>
  <rect x="680" y="380" width="265" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812.5" y="414.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--ok-text)">HTTP::status</text>
  <rect x="975" y="380" width="265" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.5" y="414.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--ok-text)">HTTP::header</text>
  <rect x="680" y="470" width="265" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812.5" y="504.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--ok-text)">HTTP::cookie</text>
  <rect x="975" y="470" width="265" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.5" y="504.3" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="var(--ok-text)">HTTP::payload</text>
  <rect x="680" y="560" width="560" height="60" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.0" y="594.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">HTTP_RESPONSE / HTTP_RESPONSE_DATA</text>
</svg>

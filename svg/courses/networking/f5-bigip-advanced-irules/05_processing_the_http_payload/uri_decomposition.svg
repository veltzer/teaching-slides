<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="70" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="56" y="81.7" text-anchor="start" font-family="Courier New, monospace" font-size="20" fill="var(--surface)">/app/reports/2024%20q1.pdf?user=bob&amp;fmt=raw</text>
  <text x="640" y="135" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--text-muted)">HTTP::uri</text>
  <line x1="640" y1="145" x2="640" y2="190" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="190" width="580" height="90" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.0" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">HTTP::path</text>
  <text x="330.0" y="257.0" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--primary-text)">/app/reports/2024%20q1.pdf</text>
  <rect x="660" y="190" width="580" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.0" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">HTTP::query</text>
  <text x="950.0" y="257.0" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">user=bob&amp;fmt=raw</text>
  <line x1="330" y1="280" x2="200" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="280" x2="460" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="280" x2="820" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="280" x2="1080" y2="340" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="340" width="300" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">URI::path</text>
  <text x="190.0" y="407.0" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--info-text)">/app/reports/</text>
  <rect x="360" y="340" width="260" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490.0" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">URI::basename</text>
  <text x="490.0" y="407.0" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--info-text)">2024%20q1.pdf</text>
  <rect x="660" y="340" width="280" height="90" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.0" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">URI::query user</text>
  <text x="800.0" y="407.0" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--warn-text)">bob</text>
  <rect x="960" y="340" width="280" height="90" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.0" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">URI::query fmt</text>
  <text x="1100.0" y="407.0" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--warn-text)">raw</text>
  <line x1="490" y1="430" x2="490" y2="500" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="500" width="260" height="120" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490.0" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">URI::decode</text>
  <text x="490.0" y="582.0" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">2024 q1.pdf</text>
  <rect x="40" y="500" width="300" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="190.0" y="548.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">decode first,</text>
  <text x="190.0" y="581.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">then decide</text>
  <rect x="660" y="500" width="580" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.0" y="548.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">decision on the decoded form</text>
  <text x="950.0" y="581.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--text)">forward one form consistently</text>
</svg>

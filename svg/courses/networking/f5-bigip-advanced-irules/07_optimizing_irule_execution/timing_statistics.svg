<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="480" height="580" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="56" y="239.3" text-anchor="start" font-family="Courier New, monospace" font-size="16" fill="var(--surface)">tmsh show ltm rule my_rule</text>
  <text x="56" y="263.3" text-anchor="start" font-family="Courier New, monospace" font-size="16" fill="var(--surface)"/>
  <text x="56" y="287.3" text-anchor="start" font-family="Courier New, monospace" font-size="16" fill="var(--surface)">Executions</text>
  <text x="56" y="311.3" text-anchor="start" font-family="Courier New, monospace" font-size="16" fill="var(--surface)">  Total       184213</text>
  <text x="56" y="335.3" text-anchor="start" font-family="Courier New, monospace" font-size="16" fill="var(--surface)">  Failures         0</text>
  <text x="56" y="359.3" text-anchor="start" font-family="Courier New, monospace" font-size="16" fill="var(--surface)">  Aborts           0</text>
  <text x="56" y="383.3" text-anchor="start" font-family="Courier New, monospace" font-size="16" fill="var(--surface)">CPU Cycles</text>
  <text x="56" y="407.3" text-anchor="start" font-family="Courier New, monospace" font-size="16" fill="var(--surface)">  Average       4120</text>
  <text x="56" y="431.3" text-anchor="start" font-family="Courier New, monospace" font-size="16" fill="var(--surface)">  Maximum      89330</text>
  <rect x="600" y="40" width="300" height="110" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.0" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Executions</text>
  <text x="750.0" y="116.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">how often it runs</text>
  <rect x="600" y="200" width="300" height="110" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.0" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Average cycles</text>
  <text x="750.0" y="276.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">typical cost</text>
  <rect x="600" y="360" width="300" height="110" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.0" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Maximum cycles</text>
  <text x="750.0" y="436.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">the slow branch</text>
  <rect x="600" y="510" width="300" height="110" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750.0" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Failures, aborts</text>
  <text x="750.0" y="586.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">runtime errors</text>
  <line x1="520" y1="95" x2="600" y2="95" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="255" x2="600" y2="255" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="415" x2="600" y2="415" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="565" x2="600" y2="565" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980" y="200" width="260" height="270" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.0" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Microseconds</text>
  <text x="1110.0" y="325.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">cycles / clock rate</text>
  <text x="1110.0" y="356.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">4120 / 2.5 GHz</text>
  <text x="1110.0" y="387.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">= 1.6 us</text>
  <line x1="900" y1="255" x2="980" y2="300" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="900" y1="415" x2="980" y2="370" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
</svg>

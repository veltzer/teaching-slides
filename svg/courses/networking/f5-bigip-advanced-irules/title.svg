<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2196f3"/><stop offset="100%" stop-color="#1565c0"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4caf50"/><stop offset="100%" stop-color="#2e7d32"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9c27b0"/><stop offset="100%" stop-color="#6a1b9a"/></linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">F5 BIG-IP Advanced iRules</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Tcl at the edge: events, HTTP, troubleshooting, efficiency, defense</text>

  <rect x="120" y="300" width="220" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="230" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="230" y="368" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">HTTP request</text>

  <rect x="470" y="260" width="340" height="170" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">BIG-IP virtual server</text>
  <text x="640" y="340" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--primary-text)">when HTTP_REQUEST {</text>
  <text x="640" y="366" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--primary-text)">  if { [HTTP::uri] contains ".." } { reject }</text>
  <text x="640" y="392" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--primary-text)">}</text>

  <rect x="940" y="270" width="220" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1050" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">web server 1</text>
  <rect x="940" y="360" width="220" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1050" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">web server 2</text>

  <line x1="340" y1="345" x2="470" y2="345" stroke="var(--surface)" stroke-width="2"/>
  <line x1="810" y1="320" x2="940" y2="300" stroke="var(--surface)" stroke-width="2"/>
  <line x1="810" y1="370" x2="940" y2="390" stroke="var(--surface)" stroke-width="2"/>

  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-faint)">inspect, rewrite, route, reject and log traffic inside TMM</text>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">two days, hands on, one lab BIG-IP per student</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="380" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="76.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Symptom</text>
  <rect x="440" y="40" width="380" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.0" y="76.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Likely cause</text>
  <rect x="840" y="40" width="400" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.0" y="76.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">Fix</text>
  <rect x="40" y="110" width="380" height="120" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="158.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">TCL error in log</text>
  <text x="230.0" y="191.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">syntax error</text>
  <rect x="440" y="110" width="380" height="120" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.0" y="175.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">unbraced expr or if</text>
  <rect x="840" y="110" width="400" height="120" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.0" y="175.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">brace every condition</text>
  <rect x="40" y="240" width="380" height="120" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="288.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">command not valid</text>
  <text x="230.0" y="321.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">in event context</text>
  <rect x="440" y="240" width="380" height="120" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.0" y="305.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">HTTP:: in CLIENT_ACCEPTED</text>
  <rect x="840" y="240" width="400" height="120" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.0" y="305.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">move to HTTP_REQUEST</text>
  <rect x="40" y="370" width="380" height="120" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="418.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">browser loops</text>
  <text x="230.0" y="451.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">on redirect</text>
  <rect x="440" y="370" width="380" height="120" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.0" y="435.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">redirect fires on https too</text>
  <rect x="840" y="370" width="400" height="120" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.0" y="418.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">check port or</text>
  <text x="1040.0" y="451.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">HTTP::header X-Forwarded-Proto</text>
  <rect x="40" y="500" width="380" height="120" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230.0" y="548.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">multiple respond</text>
  <text x="230.0" y="581.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">invocations</text>
  <rect x="440" y="500" width="380" height="120" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.0" y="565.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">no return after respond</text>
  <rect x="840" y="500" width="400" height="120" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.0" y="548.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">return right after</text>
  <text x="1040.0" y="581.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">HTTP::respond</text>
</svg>

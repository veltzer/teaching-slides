<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Virtual server</text>
  <text x="640.0" y="111.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">10.1.10.100:80</text>
  <rect x="40" y="220" width="360" height="130" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Profiles</text>
  <text x="220.0" y="306.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">tcp, http, clientssl</text>
  <rect x="460" y="220" width="360" height="130" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">iRules</text>
  <text x="640.0" y="306.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">ordered list</text>
  <rect x="880" y="220" width="360" height="130" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060.0" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Pool</text>
  <text x="1060.0" y="306.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">round robin</text>
  <line x1="220" y1="140" x2="220" y2="220" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="640" y1="140" x2="640" y2="220" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1060" y1="140" x2="1060" y2="220" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="880" y="430" width="170" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="965.0" y="465.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">member</text>
  <text x="965.0" y="493.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">10.1.1.10:80</text>
  <rect x="1070" y="430" width="170" height="90" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155.0" y="465.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">member</text>
  <text x="1155.0" y="493.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">10.1.1.11:80</text>
  <line x1="1060" y1="350" x2="965" y2="430" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="1060" y1="350" x2="1155" y2="430" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="880" y="560" width="170" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="965.0" y="594.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">node 10.1.1.10</text>
  <rect x="1070" y="560" width="170" height="60" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1155.0" y="594.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">node 10.1.1.11</text>
  <line x1="965" y1="520" x2="965" y2="560" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1155" y1="520" x2="1155" y2="560" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460" y="430" width="360" height="190" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">Monitor</text>
  <text x="640.0" y="515.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">http</text>
  <text x="640.0" y="546.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">checks members</text>
  <text x="640.0" y="577.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">marks down</text>
  <line x1="820" y1="520" x2="880" y2="490" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-danger)"/>
  <rect x="40" y="430" width="360" height="190" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="220.0" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Events come from profiles</text>
  <text x="220.0" y="517.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">http gives HTTP_REQUEST</text>
  <text x="220.0" y="546.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">clientssl gives</text>
  <text x="220.0" y="574.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">CLIENTSSL_HANDSHAKE</text>
</svg>

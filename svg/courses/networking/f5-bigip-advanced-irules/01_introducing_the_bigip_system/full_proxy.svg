<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="200" width="240" height="200" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160.0" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="160.0" y="306.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">browser</text>
  <text x="160.0" y="337.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">curl</text>
  <rect x="500" y="40" width="280" height="580" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">BIG-IP</text>
  <text x="640.0" y="351.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">TMM</text>
  <rect x="520" y="130" width="240" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Client-side</text>
  <text x="640.0" y="197.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">TCP / SSL / HTTP</text>
  <text x="640.0" y="225.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">profiles</text>
  <rect x="520" y="280" width="240" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">iRules</text>
  <text x="640.0" y="347.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">inspect</text>
  <text x="640.0" y="375.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">rewrite</text>
  <rect x="520" y="430" width="240" height="120" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Server-side</text>
  <text x="640.0" y="497.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">TCP / SSL / HTTP</text>
  <text x="640.0" y="525.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">profiles</text>
  <rect x="1000" y="100" width="240" height="120" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.0" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Member 1</text>
  <text x="1120.0" y="181.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">10.1.1.10:80</text>
  <rect x="1000" y="300" width="240" height="120" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.0" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Member 2</text>
  <text x="1120.0" y="381.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">10.1.1.11:80</text>
  <rect x="1000" y="500" width="240" height="120" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.0" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">Member 3</text>
  <text x="1120.0" y="581.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">10.1.1.12:80</text>
  <line x1="280" y1="300" x2="500" y2="300" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="390.0" y="292.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">connection 1</text>
  <line x1="780" y1="300" x2="1000" y2="160" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="900.0" y="230.0" text-anchor="start" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">connection 2</text>
  <line x1="780" y1="340" x2="1000" y2="360" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-ok)"/>
  <line x1="780" y1="380" x2="1000" y2="560" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-ok)"/>
</svg>

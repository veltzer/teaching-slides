<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="645.217391304348" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.150795336906" font-weight="bold" fill="var(--text)">Grant Types</text>

  <rect x="40" y="87.027027027027" width="386.086956521739" height="167.207207207207" rx="6.265568154671" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.04347826087" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.796704464012" font-weight="bold" fill="var(--ok-text)">Code + PKCE</text>
  <text x="233.04347826087" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--ok-text)">browser</text>
  <text x="60.869565217391" y="186.306306306306" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--ok-text)">- web, SPA, mobile</text>
  <text x="60.869565217391" y="210.342342342342" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--ok-text)">- modern default</text>
  <text x="60.869565217391" y="237.513513513513" font-family="Arial, sans-serif" font-size="13.575397668453" font-style="italic" fill="var(--ok-text)">PKCE for all</text>

  <rect x="446.95652173913" y="87.027027027027" width="386.086956521739" height="167.207207207207" rx="6.265568154671" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.796704464012" font-weight="bold" fill="var(--primary-text)">Client Creds</text>
  <text x="640" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--primary-text)">M2M</text>
  <text x="467.826086956522" y="186.306306306306" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--primary-text)">- backend</text>
  <text x="467.826086956522" y="210.342342342342" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--primary-text)">- cron, webhooks</text>
  <text x="467.826086956522" y="237.513513513513" font-family="Arial, sans-serif" font-size="13.575397668453" font-style="italic" fill="var(--primary-text)">pair with mTLS</text>

  <rect x="853.913043478261" y="87.027027027027" width="386.086956521739" height="167.207207207207" rx="6.265568154671" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.95652173913" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.796704464012" font-weight="bold" fill="var(--info-text)">Device Grant</text>
  <text x="1046.95652173913" y="154.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--info-text)">no browser</text>
  <text x="874.782608695652" y="186.306306306306" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--info-text)">- TVs, IoT, CLI tools</text>
  <text x="874.782608695652" y="210.342342342342" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--info-text)">- finish on phone</text>
  <text x="874.782608695652" y="237.513513513513" font-family="Arial, sans-serif" font-size="13.575397668453" font-style="italic" fill="var(--info-text)">code on screen</text>

  <rect x="40" y="285.585585585586" width="386.086956521739" height="167.207207207207" rx="6.265568154671" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="233.04347826087" y="322.162162162162" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.796704464012" font-weight="bold" fill="var(--warn-text)">Refresh</text>
  <text x="233.04347826087" y="353.513513513514" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--warn-text)">renew</text>
  <text x="60.869565217391" y="384.864864864865" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--warn-text)">- no re-prompt</text>
  <text x="60.869565217391" y="408.900900900901" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--warn-text)">- rotate on use</text>
  <text x="60.869565217391" y="436.072072072072" font-family="Arial, sans-serif" font-size="13.575397668453" font-style="italic" fill="var(--warn-text)">guard carefully</text>

  <rect x="446.95652173913" y="285.585585585586" width="386.086956521739" height="167.207207207207" rx="6.265568154671" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="322.162162162162" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.796704464012" font-weight="bold" fill="var(--danger-text)">Implicit (dead)</text>
  <text x="640" y="353.513513513514" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--danger-text)">URL tokens</text>
  <text x="467.826086956522" y="384.864864864865" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--danger-text)">- removed from OAuth 2.1</text>
  <text x="467.826086956522" y="408.900900900901" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--danger-text)">- use code + PKCE</text>
  <text x="467.826086956522" y="436.072072072072" font-family="Arial, sans-serif" font-size="13.575397668453" font-style="italic" fill="var(--danger-text)">don't use</text>

  <rect x="853.913043478261" y="285.585585585586" width="386.086956521739" height="167.207207207207" rx="6.265568154671" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1046.95652173913" y="322.162162162162" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.796704464012" font-weight="bold" fill="var(--danger-text)">ROPC (dead)</text>
  <text x="1046.95652173913" y="353.513513513514" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--danger-text)">password sharing</text>
  <text x="874.782608695652" y="384.864864864865" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--danger-text)">- defeats purpose</text>
  <text x="874.782608695652" y="408.900900900901" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--danger-text)">- removed from OAuth 2.1</text>
  <text x="874.782608695652" y="436.072072072072" font-family="Arial, sans-serif" font-size="13.575397668453" font-style="italic" fill="var(--danger-text)">migrate away</text>

  <rect x="40" y="494.594594594595" width="1200" height="125.405405405405" rx="6.265568154671" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="531.171171171171" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.708181745788" font-weight="bold" fill="var(--text)">Decision</text>
  <text x="60.869565217391" y="562.522522522523" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--text)">- no user? → Client Creds</text>
  <text x="60.869565217391" y="586.558558558559" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--text)">- browser → Code + PKCE</text>
  <text x="60.869565217391" y="610.594594594595" font-family="Arial, sans-serif" font-size="13.575397668453" fill="var(--text)">- no browser → Device Grant</text>
</svg>

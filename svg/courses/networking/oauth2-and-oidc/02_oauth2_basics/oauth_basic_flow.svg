<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.280399254524" font-weight="bold" fill="var(--text)">OAuth2 Authorization Code Flow Walkthrough</text>

  <rect x="40" y="87.889908256881" width="206.896551724138" height="63.853211009174" rx="6.295476751044" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--primary-text)">User</text>

  <rect x="443.448275862069" y="87.889908256881" width="206.896551724138" height="63.853211009174" rx="6.295476751044" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="546.896551724138" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--ok-text)">Client</text>

  <rect x="857.241379310345" y="87.889908256881" width="206.896551724138" height="63.853211009174" rx="6.295476751044" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.689655172414" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.787938002784" font-weight="bold" fill="var(--info-text)">Auth Server</text>

  <line x1="143.448275862069" y1="151.743119266055" x2="143.448275862069" y2="620" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="546.896551724138" y1="151.743119266055" x2="546.896551724138" y2="620" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="960.689655172414" y1="151.743119266055" x2="960.689655172414" y2="620" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 4"/>

  <path d="M 143.448275862069 194.311926605505 L 546.896551724138 194.311926605505" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="153.793103448276" y="183.669724770642" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">1. clicks "Sign in"</text>

  <path d="M 546.896551724138 236.880733944954 L 960.689655172414 236.880733944954" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="557.241379310345" y="226.238532110092" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">2. /authorize redirect (state, scope)</text>

  <path d="M 960.689655172414 279.449541284404 L 143.448275862069 279.449541284404" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="371.034482758621" y="268.807339449541" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">3. login + consent UI</text>

  <path d="M 143.448275862069 322.018348623853 L 960.689655172414 322.018348623853" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="153.793103448276" y="311.376146788991" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">4. submits credentials, approves</text>

  <path d="M 960.689655172414 364.587155963303 L 546.896551724138 364.587155963303" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="557.241379310345" y="353.94495412844" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">5. redirect back with code</text>

  <path d="M 546.896551724138 407.155963302752 L 960.689655172414 407.155963302752" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="557.241379310345" y="396.51376146789" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">6. POST /token (code + secret)</text>

  <path d="M 960.689655172414 449.724770642202 L 546.896551724138 449.724770642202" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="557.241379310345" y="439.082568807339" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">7. access_token, refresh_token</text>

  <path d="M 546.896551724138 492.293577981651 L 143.448275862069 492.293577981651" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="153.793103448276" y="481.651376146789" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">8. logged in!</text>

  <rect x="40" y="556.146788990826" width="1200" height="63.853211009174" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="582.752293577982" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--text)">Tokens never travel through the user agent's URL — only the code does</text>
  <text x="640" y="607.229357798165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--text-muted)">step 6 is server-to-server; tokens stay on the backend</text>
</svg>

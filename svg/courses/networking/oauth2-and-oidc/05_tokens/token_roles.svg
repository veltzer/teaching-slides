<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">The Three Token Types</text>

  <rect x="40" y="107.927927927928" width="393.103448275862" height="292.612612612613" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.551724137931" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--primary-text)">Access Token</text>
  <text x="236.551724137931" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">authorizes APIs</text>
  <text x="60.689655172414" y="228.108108108108" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--primary-text)">at: resource server</text>
  <text x="60.689655172414" y="259.459459459459" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--primary-text)">life: 5-60 min</text>
  <text x="60.689655172414" y="290.810810810811" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--primary-text)">format: opaque/JWT</text>
  <text x="60.689655172414" y="322.162162162162" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">- bearer token</text>
  <text x="60.689655172414" y="348.288288288288" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">- carries scopes</text>
  <text x="60.689655172414" y="377.54954954955" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--primary-text)">Authorization: Bearer ...</text>

  <rect x="443.448275862069" y="107.927927927928" width="393.103448275862" height="292.612612612613" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--warn-text)">Refresh Token</text>
  <text x="640" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">renews access</text>
  <text x="464.137931034483" y="228.108108108108" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--warn-text)">at: /token</text>
  <text x="464.137931034483" y="259.459459459459" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--warn-text)">life: hours-weeks</text>
  <text x="464.137931034483" y="290.810810810811" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--warn-text)">format: opaque</text>
  <text x="464.137931034483" y="322.162162162162" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">- rotate on use</text>
  <text x="464.137931034483" y="348.288288288288" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">- never sent to APIs</text>
  <text x="464.137931034483" y="377.54954954955" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--warn-text)">most sensitive</text>

  <rect x="846.896551724138" y="107.927927927928" width="393.103448275862" height="292.612612612613" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1043.448275862069" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.874510776042" font-weight="bold" fill="var(--info-text)">ID Token</text>
  <text x="1043.448275862069" y="186.306306306306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">user identity (OIDC)</text>
  <text x="867.586206896552" y="228.108108108108" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--info-text)">at: client only</text>
  <text x="867.586206896552" y="259.459459459459" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--info-text)">life: same as access</text>
  <text x="867.586206896552" y="290.810810810811" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--info-text)">format: JWT</text>
  <text x="867.586206896552" y="322.162162162162" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">- sub, name, etc</text>
  <text x="867.586206896552" y="348.288288288288" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--info-text)">- never sent to APIs</text>
  <text x="867.586206896552" y="377.54954954955" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--info-text)">verify all claims</text>

  <rect x="40" y="431.891891891892" width="1200" height="188.108108108108" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="466.378378378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--text)">Common mistakes</text>
  <text x="60.689655172414" y="499.81981981982" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--danger-accent)">- using ID token for APIs</text>
  <text x="60.689655172414" y="525.945945945946" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--danger-accent)">- tokens in localStorage (XSS)</text>
  <text x="60.689655172414" y="552.072072072072" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--danger-accent)">- skipping aud/iss/exp checks</text>
  <text x="60.689655172414" y="578.198198198198" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--danger-accent)">- long-lived tokens, no revocation</text>
  <text x="60.689655172414" y="609.54954954955" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--ok-accent)">short access + rotating refresh = solid</text>
</svg>

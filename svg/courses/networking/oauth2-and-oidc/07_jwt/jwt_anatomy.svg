<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">JWT Anatomy: Header, Payload, Signature</text>

  <rect x="40" y="76.576576576577" width="1200" height="62.702702702703" rx="6.23850293892" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="113.153153153153" text-anchor="middle" font-family="Courier New, monospace" font-size="14.556506857481" fill="var(--surface)">eyJhbGciOiJSUzI1NiIsImtpZCI6ImtleS0yMDI2In0 . eyJzdWIiOiJ1c2VyXzQyIiwiZXhwIjoxNzAzMDEyNDAwfQ . SflKxwRJSMeKKF2QT4...</text>

  <rect x="40" y="160.18018018018" width="382.758620689655" height="229.90990990991" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="196.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--primary-text)">Header</text>
  <text x="231.379310344828" y="222.882882882883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--primary-text)">algorithm + key ID</text>
  <text x="60.689655172414" y="259.459459459459" font-family="Courier New, monospace" font-size="13.516756367661" fill="var(--primary-text)">{</text>
  <text x="60.689655172414" y="280.36036036036" font-family="Courier New, monospace" font-size="13.516756367661" fill="var(--primary-text)">  "alg": "RS256",</text>
  <text x="60.689655172414" y="301.261261261261" font-family="Courier New, monospace" font-size="13.516756367661" fill="var(--primary-text)">  "typ": "JWT",</text>
  <text x="60.689655172414" y="322.162162162162" font-family="Courier New, monospace" font-size="13.516756367661" fill="var(--primary-text)">  "kid": "key-2026"</text>
  <text x="60.689655172414" y="343.063063063063" font-family="Courier New, monospace" font-size="13.516756367661" fill="var(--primary-text)">}</text>
  <text x="60.689655172414" y="377.54954954955" font-family="Arial, sans-serif" font-size="11.437255388021" font-style="italic" fill="var(--primary-text)">base64url-encoded</text>

  <rect x="443.448275862069" y="160.18018018018" width="382.758620689655" height="229.90990990991" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="634.827586206897" y="196.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--ok-text)">Payload (Claims)</text>
  <text x="634.827586206897" y="222.882882882883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--ok-text)">the data</text>
  <text x="464.137931034483" y="259.459459459459" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--ok-text)">{</text>
  <text x="464.137931034483" y="277.225225225225" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--ok-text)">  "iss": "https://auth/",</text>
  <text x="464.137931034483" y="294.990990990991" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--ok-text)">  "sub": "user_42",</text>
  <text x="464.137931034483" y="312.756756756757" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--ok-text)">  "aud": "client_xyz",</text>
  <text x="464.137931034483" y="330.522522522523" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--ok-text)">  "exp": 1703012400,</text>
  <text x="464.137931034483" y="348.288288288288" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--ok-text)">  "scope": "read:profile"</text>
  <text x="464.137931034483" y="366.054054054054" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--ok-text)">}</text>

  <rect x="846.896551724138" y="160.18018018018" width="382.758620689655" height="229.90990990991" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1038.275862068966" y="196.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--warn-text)">Signature</text>
  <text x="1038.275862068966" y="222.882882882883" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">prevents tampering</text>
  <text x="867.586206896552" y="264.684684684685" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">RS256: RSA + SHA-256</text>
  <text x="867.586206896552" y="290.810810810811" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">private key signs</text>
  <text x="867.586206896552" y="316.936936936937" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--warn-text)">public key verifies</text>
  <text x="867.586206896552" y="348.288288288288" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--warn-text)">covers header + payload</text>
  <text x="867.586206896552" y="377.54954954955" font-family="Arial, sans-serif" font-size="12.477005877841" font-style="italic" fill="var(--warn-text)">any change → invalid</text>

  <rect x="40" y="431.891891891892" width="1200" height="188.108108108108" rx="6.23850293892" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="468.468468468468" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.715508816761" font-weight="bold" fill="var(--danger-text)">Critical pitfalls</text>
  <text x="60.689655172414" y="499.81981981982" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--danger-text)">- never trust alg from header; pin it</text>
  <text x="60.689655172414" y="525.945945945946" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--danger-text)">- algorithm confusion attacks</text>
  <text x="60.689655172414" y="552.072072072072" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--danger-text)">- always validate iss, aud, exp; check signature first</text>
  <text x="60.689655172414" y="583.423423423423" font-family="Arial, sans-serif" font-size="13.516756367661" font-style="italic" fill="var(--danger-text)">decoding is not validating</text>
</svg>

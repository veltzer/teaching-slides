<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="661.428571428571" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.512019135483" font-weight="bold" fill="var(--text)">PKCE: Proof Key for Code Exchange</text>

  <rect x="40" y="87.027027027027" width="578.571428571429" height="229.90990990991" rx="6.348927492804" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046782478411" font-weight="bold" fill="var(--primary-text)">1. Client generates secret</text>
  <text x="61.428571428571" y="170.630630630631" font-family="Courier New, monospace" font-size="14.814164149876" fill="var(--primary-text)">verifier = random_bytes(32)</text>
  <text x="61.428571428571" y="199.891891891892" font-family="Courier New, monospace" font-size="14.814164149876" fill="var(--primary-text)">challenge = SHA256(verifier)</text>
  <text x="61.428571428571" y="241.693693693694" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--primary-text)">verifier kept private</text>
  <text x="61.428571428571" y="269.90990990991" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--primary-text)">challenge sent in /authorize</text>
  <text x="61.428571428571" y="298.126126126126" font-family="Arial, sans-serif" font-size="12.697854985608" font-style="italic" fill="var(--primary-text)">stolen code is useless</text>

  <rect x="661.428571428571" y="87.027027027027" width="578.571428571429" height="229.90990990991" rx="6.348927492804" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046782478411" font-weight="bold" fill="var(--ok-text)">2. Server verifies match</text>
  <text x="682.857142857143" y="170.630630630631" font-family="Courier New, monospace" font-size="14.814164149876" fill="var(--ok-text)">on /authorize: store challenge</text>
  <text x="682.857142857143" y="199.891891891892" font-family="Courier New, monospace" font-size="14.814164149876" fill="var(--ok-text)">on /token: SHA256(verifier)</text>
  <text x="682.857142857143" y="241.693693693694" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--ok-text)">if hash matches, issue tokens</text>
  <text x="682.857142857143" y="269.90990990991" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--ok-text)">if not, reject</text>
  <text x="682.857142857143" y="298.126126126126" font-family="Arial, sans-serif" font-size="12.697854985608" font-style="italic" fill="var(--ok-text)">works for public clients</text>

  <rect x="40" y="358.738738738739" width="1200" height="125.405405405405" rx="6.348927492804" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="395.315315315315" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.046782478411" font-weight="bold" fill="var(--warn-text)">Attack scenario: code interception on mobile</text>
  <text x="61.428571428571" y="426.666666666667" font-family="Arial, sans-serif" font-size="14.814164149876" fill="var(--warn-text)">- app hijacks URL scheme</text>
  <text x="61.428571428571" y="452.792792792793" font-family="Arial, sans-serif" font-size="14.814164149876" fill="var(--warn-text)">- intercepts the code</text>
  <text x="61.428571428571" y="476.828828828829" font-family="Arial, sans-serif" font-size="14.814164149876" font-weight="bold" fill="var(--warn-text)">without PKCE: attacker gets tokens; with PKCE: code is useless</text>

  <rect x="40" y="515.495495495495" width="1200" height="104.504504504504" rx="6.348927492804" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="546.846846846847" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.814164149876" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="61.428571428571" y="576.108108108108" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--text)">- verifier: 43-128 URL-safe chars</text>
  <text x="61.428571428571" y="600.144144144144" font-family="Arial, sans-serif" font-size="13.756009567742" fill="var(--text)">- method=S256; never plain</text>
</svg>

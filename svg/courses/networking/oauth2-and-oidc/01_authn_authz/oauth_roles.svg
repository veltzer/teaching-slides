<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.280399254524" font-weight="bold" fill="var(--text)">The Four OAuth2 Roles</text>

  <rect x="40" y="173.02752293578" width="248.275862068966" height="127.706422018349" rx="6.295476751044" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.137931034483" y="215.596330275229" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--primary-text)">Resource Owner</text>
  <text x="164.137931034483" y="249.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--primary-text)">the user</text>
  <text x="164.137931034483" y="277.321100917431" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">approves access</text>

  <rect x="329.655172413793" y="173.02752293578" width="248.275862068966" height="127.706422018349" rx="6.295476751044" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="453.793103448276" y="215.596330275229" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--ok-text)">Client</text>
  <text x="453.793103448276" y="249.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--ok-text)">the application</text>
  <text x="453.793103448276" y="277.321100917431" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">requests access</text>

  <rect x="619.310344827586" y="173.02752293578" width="248.275862068966" height="127.706422018349" rx="6.295476751044" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="743.448275862069" y="215.596330275229" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--info-text)">Auth Server</text>
  <text x="743.448275862069" y="249.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--info-text)">issues tokens</text>
  <text x="743.448275862069" y="277.321100917431" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">authenticates user</text>

  <rect x="908.965517241379" y="173.02752293578" width="248.275862068966" height="127.706422018349" rx="6.295476751044" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.103448275862" y="215.596330275229" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--warn-text)">Resource Server</text>
  <text x="1033.103448275862" y="249.651376146789" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--warn-text)">protected API</text>
  <text x="1033.103448275862" y="277.321100917431" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">validates tokens</text>

  <path d="M 288.275862068966 226.238532110092 L 329.655172413793 226.238532110092" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 577.931034482759 226.238532110092 L 619.310344827586 226.238532110092" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 867.586206896552 226.238532110092 L 908.965517241379 226.238532110092" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="308.965517241379" y="213.467889908257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.541707376914" fill="var(--text-muted)">delegates</text>
  <text x="598.620689655172" y="213.467889908257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.541707376914" fill="var(--text-muted)">requests token</text>
  <text x="888.275862068966" y="213.467889908257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.541707376914" fill="var(--text-muted)">uses token</text>

  <rect x="40" y="364.587155963303" width="1200" height="255.412844036697" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="401.834862385321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">Authentication vs Authorization</text>
  <text x="60.689655172414" y="439.082568807339" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-accent)">Authentication: who are you?</text>
  <text x="60.689655172414" y="465.688073394495" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- verified by username + password, MFA, certificates</text>
  <text x="60.689655172414" y="492.293577981651" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- result: an identity claim</text>
  <text x="60.689655172414" y="527.412844036697" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-accent)">Authorization: what can you do?</text>
  <text x="60.689655172414" y="554.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- granted via roles, scopes, or attributes</text>
  <text x="60.689655172414" y="580.623853211009" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- result: allow or deny</text>
  <text x="640" y="614.678899082569" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--danger-accent)">OAuth2 is authorization; OIDC adds identity (auth) on top</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.280399254524" font-weight="bold" fill="var(--text)">OAuth2 / OIDC Provider Landscape</text>

  <rect x="40" y="87.889908256881" width="289.655172413793" height="234.128440366972" rx="6.295476751044" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--ok-text)">Keycloak</text>
  <text x="184.827586206897" y="157.064220183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">open source</text>
  <text x="60.689655172414" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">+ full control</text>
  <text x="60.689655172414" y="220.917431192661" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">+ no fees</text>
  <text x="60.689655172414" y="252.844036697248" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- ops burden</text>
  <text x="60.689655172414" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- needs security skill</text>
  <text x="60.689655172414" y="306.05504587156" font-family="Arial, sans-serif" font-size="11.541707376914" font-style="italic" fill="var(--ok-text)">use: full control</text>

  <rect x="360.689655172414" y="87.889908256881" width="289.655172413793" height="234.128440366972" rx="6.295476751044" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="505.51724137931" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--primary-text)">Auth0</text>
  <text x="505.51724137931" y="157.064220183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">managed</text>
  <text x="381.379310344828" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">+ great DX</text>
  <text x="381.379310344828" y="220.917431192661" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">+ rich SDKs</text>
  <text x="381.379310344828" y="252.844036697248" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- per-user pricing</text>
  <text x="381.379310344828" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- vendor lock-in</text>
  <text x="381.379310344828" y="306.05504587156" font-family="Arial, sans-serif" font-size="11.541707376914" font-style="italic" fill="var(--primary-text)">use: B2C, fast</text>

  <rect x="681.379310344828" y="87.889908256881" width="289.655172413793" height="234.128440366972" rx="6.295476751044" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="826.206896551724" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--info-text)">Okta / Entra</text>
  <text x="826.206896551724" y="157.064220183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">enterprise SSO</text>
  <text x="702.068965517241" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">+ workforce identity</text>
  <text x="702.068965517241" y="220.917431192661" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">+ governance</text>
  <text x="702.068965517241" y="252.844036697248" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- expensive</text>
  <text x="702.068965517241" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">- enterprise-shaped</text>
  <text x="702.068965517241" y="306.05504587156" font-family="Arial, sans-serif" font-size="11.541707376914" font-style="italic" fill="var(--info-text)">use: B2B</text>

  <rect x="1002.068965517241" y="87.889908256881" width="237.931034482759" height="234.128440366972" rx="6.295476751044" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1121.034482758621" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--warn-text)">Cloud IdP</text>
  <text x="1121.034482758621" y="157.064220183486" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Cognito, Firebase</text>
  <text x="1022.758620689655" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">+ cloud-native</text>
  <text x="1022.758620689655" y="220.917431192661" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">+ low cost</text>
  <text x="1022.758620689655" y="252.844036697248" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- less polished</text>
  <text x="1022.758620689655" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- cloud lock-in</text>
  <text x="1022.758620689655" y="306.05504587156" font-family="Arial, sans-serif" font-size="11.541707376914" font-style="italic" fill="var(--warn-text)">use: cloud</text>

  <rect x="40" y="364.587155963303" width="1200" height="255.412844036697" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="401.834862385321" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">Decision factors</text>
  <text x="60.689655172414" y="433.761467889908" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--text)">technical:</text>
  <text x="60.689655172414" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- protocol coverage</text>
  <text x="60.689655172414" y="484.844036697248" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- federation, MFA, WebAuthn</text>
  <text x="60.689655172414" y="511.449541284404" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- SDK coverage</text>
  <text x="60.689655172414" y="550.825688073395" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--text)">organizational:</text>
  <text x="60.689655172414" y="577.431192660551" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- cost vs ops vs risk</text>
  <text x="60.689655172414" y="604.036697247706" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- compliance (SOC 2, GDPR, etc)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">REST: Six Constraints</text>

  <rect x="40" y="81.061946902655" width="382.758620689655" height="164.247787610619" rx="10.305080798591" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--primary-text)">Client-Server</text>
  <text x="60.689655172414" y="142.654867256637" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">Separate UI and storage</text>
  <text x="60.689655172414" y="168.318584070796" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">Each evolves independently</text>
  <text x="60.689655172414" y="199.115044247788" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--primary-text)">Browser != server team</text>

  <rect x="448.620689655172" y="81.061946902655" width="382.758620689655" height="164.247787610619" rx="10.305080798591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--ok-text)">Stateless</text>
  <text x="469.310344827586" y="142.654867256637" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">No session on server</text>
  <text x="469.310344827586" y="168.318584070796" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">Each request self-contained</text>
  <text x="469.310344827586" y="199.115044247788" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--ok-text)">Easier to scale horizontally</text>

  <rect x="857.241379310345" y="81.061946902655" width="382.758620689655" height="164.247787610619" rx="10.305080798591" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="111.858407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--warn-text)">Cacheable</text>
  <text x="877.931034482759" y="142.654867256637" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">Responses mark cacheability</text>
  <text x="877.931034482759" y="168.318584070796" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">Cache-Control, ETag</text>
  <text x="877.931034482759" y="199.115044247788" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--warn-text)">Reduce calls to origin</text>

  <rect x="40" y="276.106194690265" width="382.758620689655" height="164.247787610619" rx="10.305080798591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="306.902654867257" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--info-text)">Layered System</text>
  <text x="60.689655172414" y="337.699115044248" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">Client doesn't see beyond next hop</text>
  <text x="60.689655172414" y="363.362831858407" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">Proxies, gateways, LBs allowed</text>
  <text x="60.689655172414" y="394.159292035398" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--info-text)">Composable infrastructure</text>

  <rect x="448.620689655172" y="276.106194690265" width="382.758620689655" height="164.247787610619" rx="10.305080798591" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="306.902654867257" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--danger-text)">Uniform Interface</text>
  <text x="469.310344827586" y="337.699115044248" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--danger-text)">Resources via URIs</text>
  <text x="469.310344827586" y="363.362831858407" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--danger-text)">Standard verbs, content types</text>
  <text x="469.310344827586" y="394.159292035398" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--danger-text)">Predictable for clients</text>

  <rect x="857.241379310345" y="276.106194690265" width="382.758620689655" height="164.247787610619" rx="10.305080798591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1048.620689655173" y="306.902654867257" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--text)">Code on Demand</text>
  <text x="877.931034482759" y="337.699115044248" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text)">Optional</text>
  <text x="877.931034482759" y="363.362831858407" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text)">Server can ship JS to client</text>
  <text x="877.931034482759" y="394.159292035398" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--text-muted)">Rarely used today</text>

  <rect x="40" y="476.283185840708" width="1200" height="143.716814159292" rx="10.305080798591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--ok-text)">In practice</text>
  <text x="640" y="543.008849557522" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--ok-text)">Most "REST APIs" satisfy 4-5 of these</text>
  <text x="640" y="571.752212389381" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--ok-text)">Stateless + uniform interface are non-negotiable</text>
  <text x="640" y="599.469026548673" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">HATEOAS (full uniform interface) is rare; pragmatic REST drops it</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs/>

  <text x="640" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">REST API Authentication</text>

  <rect x="60" y="100" width="370" height="240" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="245" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">API key</text>
  <text x="80" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Static secret</text>
  <text x="80" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Authorization: Bearer sk_xxx</text>
  <text x="80" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Or X-API-Key header</text>
  <text x="80" y="265" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">+ Simple</text>
  <text x="80" y="290" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">- No expiry, no scopes</text>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--primary-text)">Server-to-server</text>

  <rect x="455" y="100" width="370" height="240" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">JWT</text>
  <text x="475" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Signed, self-contained</text>
  <text x="475" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Authorization: Bearer eyJ...</text>
  <text x="475" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Has user ID, scopes, expiry</text>
  <text x="475" y="265" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">+ Stateless verify</text>
  <text x="475" y="290" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Hard to revoke</text>
  <text x="475" y="320" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--ok-text)">Short TTL + refresh</text>

  <rect x="850" y="100" width="370" height="240" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1035" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">OAuth 2.0</text>
  <text x="870" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Delegated access</text>
  <text x="870" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">3rd party gets scoped token</text>
  <text x="870" y="225" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Authorization Code grant</text>
  <text x="870" y="265" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">+ Standard, scoped</text>
  <text x="870" y="290" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">- Complex flows</text>
  <text x="870" y="320" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--warn-text)">"Sign in with X"</text>

  <rect x="60" y="380" width="1160" height="220" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Always</text>
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- TLS / HTTPS only (passwords + tokens in transit)</text>
  <text x="80" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- Rotate keys, support multiple in flight</text>
  <text x="80" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- Rate limit per key + per IP</text>
  <text x="80" y="525" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">- Audit log: who called what, when</text>
  <text x="80" y="565" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-muted)">Never put secrets in URL query strings (logged everywhere)</text>
</svg>

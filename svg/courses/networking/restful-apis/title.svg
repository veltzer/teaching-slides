<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">RESTful APIs</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Designing HTTP APIs</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <line x1="290" y1="262" x2="978" y2="262" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="990,262 978,256 978,268" fill="var(--text-muted)"/>
  <line x1="302" y1="300" x2="990" y2="300" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7,5"/>
  <polygon points="290,300 302,294 302,306" fill="var(--text-muted)"/>
  <line x1="290" y1="340" x2="978" y2="340" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="990,340 978,334 978,346" fill="var(--text-muted)"/>
  <line x1="302" y1="378" x2="990" y2="378" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7,5"/>
  <polygon points="290,378 302,372 302,384" fill="var(--text-muted)"/>
  <line x1="290" y1="418" x2="978" y2="418" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="990,418 978,412 978,424" fill="var(--text-muted)"/>
  <line x1="302" y1="456" x2="990" y2="456" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="7,5"/>
  <polygon points="290,456 302,450 302,462" fill="var(--text-muted)"/>
  <rect x="100" y="225" width="190" height="260" rx="14" fill="var(--primary-fill)"/>
  <text x="195" y="362" font-size="24" font-weight="bold" fill="var(--primary-text)">Client</text>
  <rect x="990" y="225" width="190" height="260" rx="14" fill="var(--info-fill)"/>
  <text x="1085" y="362" font-size="24" font-weight="bold" fill="var(--info-text)">Server</text>
  <rect x="527" y="246" width="226" height="32" fill="var(--code-bg)"/>
  <rect x="537" y="248" width="90" height="28" rx="6" fill="var(--ok-fill)"/>
  <text x="582" y="268" font-size="15" font-weight="bold" fill="var(--ok-text)">GET</text>
  <text x="641" y="268" text-anchor="start" font-size="17" font-family="Courier New, monospace" fill="var(--surface)">/users/42</text>
  <rect x="550" y="288" width="180" height="24" fill="var(--code-bg)"/>
  <text x="640" y="305" font-size="16" font-family="Courier New, monospace" fill="var(--text-faint)">200 OK</text>
  <rect x="527" y="324" width="226" height="32" fill="var(--code-bg)"/>
  <rect x="537" y="326" width="90" height="28" rx="6" fill="var(--primary-accent)"/>
  <text x="582" y="346" font-size="15" font-weight="bold" fill="var(--primary-text)">POST</text>
  <text x="641" y="346" text-anchor="start" font-size="17" font-family="Courier New, monospace" fill="var(--surface)">/users</text>
  <rect x="550" y="366" width="180" height="24" fill="var(--code-bg)"/>
  <text x="640" y="383" font-size="16" font-family="Courier New, monospace" fill="var(--text-faint)">201 Created</text>
  <rect x="527" y="402" width="226" height="32" fill="var(--code-bg)"/>
  <rect x="537" y="404" width="90" height="28" rx="6" fill="var(--danger-fill)"/>
  <text x="582" y="424" font-size="15" font-weight="bold" fill="var(--danger-text)">DELETE</text>
  <text x="641" y="424" text-anchor="start" font-size="17" font-family="Courier New, monospace" fill="var(--surface)">/users/42</text>
  <rect x="550" y="444" width="180" height="24" fill="var(--code-bg)"/>
  <text x="640" y="461" font-size="16" font-family="Courier New, monospace" fill="var(--text-faint)">204 No Content</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">methods • status • URL • JSON • auth</text>
</svg>

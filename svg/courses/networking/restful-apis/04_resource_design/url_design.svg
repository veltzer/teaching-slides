<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">REST URL Design</text>
  <rect x="40" y="80" width="585" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Do this</text>
  <text x="60" y="160" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">GET /users</text>
  <text x="60" y="190" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">GET /users/42</text>
  <text x="60" y="220" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">POST /users</text>
  <text x="60" y="250" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">PUT /users/42</text>
  <text x="60" y="280" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">DELETE /users/42</text>
  <text x="60" y="310" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">GET /users/42/orders</text>
  <text x="60" y="340" font-family="Courier New, monospace" font-size="15" fill="var(--ok-text)">GET /users?role=admin&amp;limit=20</text>
  <text x="60" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Why</text>
  <text x="60" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Plural collection nouns</text>
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Verbs in HTTP methods</text>
  <text x="60" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Hierarchy via path segments</text>
  <text x="60" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Filters in query strings</text>

  <rect x="640" y="80" width="600" height="540" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Avoid this</text>
  <text x="660" y="160" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">POST /getUser?id=42</text>
  <text x="660" y="190" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">GET /api/v1/UserList</text>
  <text x="660" y="220" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">POST /createOrder</text>
  <text x="660" y="250" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">DELETE /removeUser/42</text>
  <text x="660" y="280" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">GET /users.php?op=list</text>
  <text x="660" y="310" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">PATCH /users/42/email</text>
  <text x="660" y="340" font-family="Courier New, monospace" font-size="15" fill="var(--danger-text)">GET /users/active</text>
  <text x="660" y="395" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">Why not</text>
  <text x="660" y="425" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Verbs in URLs duplicate the method</text>
  <text x="660" y="450" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">CamelCase makes URLs harder to read</text>
  <text x="660" y="475" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Trailing extensions leak the impl</text>
  <text x="660" y="500" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">"active" is a filter, not a resource</text>
</svg>

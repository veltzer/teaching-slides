<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="634.871794871795" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.917736988175" font-weight="bold" fill="var(--text)">gRPC Status Codes</text>

  <!-- OK -->
  <rect x="40" y="87.027027027027" width="287.179487179487" height="104.504504504504" rx="6.21178545881" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="183.589743589744" y="128.828828828829" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.705951529365" font-weight="bold" fill="var(--ok-text)">OK</text>
  <text x="183.589743589744" y="160.18018018018" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--ok-text)">success — HTTP 200</text>

  <!-- Client errors -->
  <rect x="357.948717948718" y="87.027027027027" width="287.179487179487" height="104.504504504504" rx="6.21178545881" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.538461538461" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--warn-text)">INVALID_ARGUMENT</text>
  <text x="501.538461538461" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--warn-text)">400 — bad request</text>
  <text x="501.538461538461" y="173.765765765766" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.423570917619" fill="var(--warn-text)">malformed payload</text>

  <rect x="675.897435897436" y="87.027027027027" width="287.179487179487" height="104.504504504504" rx="6.21178545881" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="819.487179487179" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--warn-text)">UNAUTHENTICATED</text>
  <text x="819.487179487179" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--warn-text)">401 — no/bad creds</text>

  <rect x="993.846153846154" y="87.027027027027" width="246.153846153846" height="104.504504504504" rx="6.21178545881" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.923076923077" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--warn-text)">PERMISSION_DENIED</text>
  <text x="1116.923076923077" y="149.72972972973" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--warn-text)">403 — auth ok, not allowed</text>

  <rect x="40" y="212.432432432432" width="287.179487179487" height="104.504504504504" rx="6.21178545881" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="183.589743589744" y="249.009009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--warn-text)">NOT_FOUND</text>
  <text x="183.589743589744" y="275.135135135135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--warn-text)">404 — entity missing</text>

  <rect x="357.948717948718" y="212.432432432432" width="287.179487179487" height="104.504504504504" rx="6.21178545881" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.538461538461" y="249.009009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--warn-text)">ALREADY_EXISTS</text>
  <text x="501.538461538461" y="275.135135135135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--warn-text)">409 — duplicate</text>

  <rect x="675.897435897436" y="212.432432432432" width="287.179487179487" height="104.504504504504" rx="6.21178545881" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="819.487179487179" y="249.009009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.600058799961" font-weight="bold" fill="var(--warn-text)">RESOURCE_EXHAUSTED</text>
  <text x="819.487179487179" y="275.135135135135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--warn-text)">429 — quota/rate limit</text>

  <rect x="993.846153846154" y="212.432432432432" width="246.153846153846" height="104.504504504504" rx="6.21178545881" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.923076923077" y="249.009009009009" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--info-text)">CANCELLED</text>
  <text x="1116.923076923077" y="275.135135135135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--info-text)">499 — caller cancelled</text>

  <!-- Server errors -->
  <rect x="40" y="337.837837837838" width="287.179487179487" height="104.504504504504" rx="6.21178545881" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="183.589743589744" y="374.414414414414" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--danger-text)">INTERNAL</text>
  <text x="183.589743589744" y="400.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--danger-text)">500 — server bug</text>

  <rect x="357.948717948718" y="337.837837837838" width="287.179487179487" height="104.504504504504" rx="6.21178545881" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.538461538461" y="374.414414414414" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--danger-text)">UNAVAILABLE</text>
  <text x="501.538461538461" y="400.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--danger-text)">503 — try again later</text>

  <rect x="675.897435897436" y="337.837837837838" width="287.179487179487" height="104.504504504504" rx="6.21178545881" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="819.487179487179" y="374.414414414414" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--danger-text)">DEADLINE_EXCEEDED</text>
  <text x="819.487179487179" y="400.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--danger-text)">504 — too slow</text>

  <rect x="993.846153846154" y="337.837837837838" width="246.153846153846" height="104.504504504504" rx="6.21178545881" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.923076923077" y="374.414414414414" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.635356376429" font-weight="bold" fill="var(--danger-text)">UNIMPLEMENTED</text>
  <text x="1116.923076923077" y="400.540540540541" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--danger-text)">501 — method missing</text>

  <!-- Bottom -->
  <rect x="40" y="473.693693693694" width="1200" height="146.306306306306" rx="6.21178545881" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="634.871794871795" y="505.045045045045" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.564761223492" font-weight="bold" fill="var(--text)">Use the right code; it drives client behavior</text>
  <text x="60.512820512821" y="534.306306306306" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- INTERNAL means "we have a bug" — clients shouldn't retry blindly</text>
  <text x="60.512820512821" y="559.387387387387" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- UNAVAILABLE / DEADLINE_EXCEEDED — retry-friendly, ideally with backoff</text>
  <text x="60.512820512821" y="584.468468468468" font-family="Arial, sans-serif" font-size="13.458868494088" fill="var(--text)">- INVALID_ARGUMENT — caller is wrong; retrying won't help</text>
  <text x="60.512820512821" y="609.54954954955" font-family="Arial, sans-serif" font-size="13.458868494088" font-style="italic" fill="var(--text-muted)">rich error details (errdetails package) carry domain-specific info</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Layers Of Authentication</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Channel TLS</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Encrypts the transport</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Verifies server identity</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Optional client certificate</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Configured at channel build</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Always recommended in production</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Call credentials</text>
  <text x="365" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Per call token attachment</text>
  <text x="365" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">OAuth bearer tokens</text>
  <text x="365" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">JSON Web Tokens</text>
  <text x="365" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Refresh logic in plugin</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Rides in initial metadata</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Authorization</text>
  <text x="670" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Decides what is allowed</text>
  <text x="670" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Per method or per resource</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Role or scope checks</text>
  <text x="670" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Lives in interceptors</text>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Returns permission denied</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Service mesh</text>
  <text x="975" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Mutual TLS by default</text>
  <text x="975" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Identity from a sidecar</text>
  <text x="975" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Policy applied uniformly</text>
  <text x="975" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Apps stay simple</text>
  <text x="975" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Examples: Istio, Linkerd</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Testing gRPC Services</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Unit</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Call handler functions</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Skip the network entirely</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Mock dependencies</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Fastest feedback loop</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Run on every commit</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">In process</text>
  <text x="365" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Bufconn or in process server</text>
  <text x="365" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Real client and stub code</text>
  <text x="365" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">No real socket needed</text>
  <text x="365" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Catches wire issues</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Still very fast</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Integration</text>
  <text x="670" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Real server in a container</text>
  <text x="670" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Real database alongside</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Use grpcurl for ad hoc</text>
  <text x="670" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Slower but realistic</text>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Run on pull requests</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Contract</text>
  <text x="975" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Lock the proto contract</text>
  <text x="975" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Use buf breaking</text>
  <text x="975" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Compatibility checks</text>
  <text x="975" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Catches accidental changes</text>
  <text x="975" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Ship before deployment</text>
</svg>

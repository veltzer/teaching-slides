<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">gRPC</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="100" y="240" width="220" height="200" rx="12" fill="var(--primary-fill)"/>
  <text x="210" y="335" font-size="24" font-weight="bold" fill="var(--primary-text)">Client</text>
  <text x="210" y="365" font-size="16" fill="var(--primary-text)">generated stub</text>
  <rect x="960" y="240" width="220" height="200" rx="12" fill="var(--info-fill)"/>
  <text x="1070" y="335" font-size="24" font-weight="bold" fill="var(--info-text)">Server</text>
  <text x="1070" y="365" font-size="16" fill="var(--info-text)">service handler</text>
  <rect x="335" y="240" width="610" height="200" rx="12" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="445" y="276" font-size="16" fill="var(--surface)">unary</text>
  <text x="445" y="321" font-size="16" fill="var(--surface)">server stream</text>
  <text x="445" y="366" font-size="16" fill="var(--surface)">client stream</text>
  <text x="445" y="411" font-size="16" fill="var(--surface)">bidirectional</text>
  <line x1="545" y1="263" x2="907" y2="263" stroke="var(--ok-fill)" stroke-width="3"/>
  <polygon points="905,257 919,263 905,269" fill="var(--ok-fill)"/>
  <line x1="557" y1="277" x2="919" y2="277" stroke="var(--warn-fill)" stroke-width="3"/>
  <polygon points="559,271 545,277 559,283" fill="var(--warn-fill)"/>
  <circle cx="725" cy="263" r="6" fill="var(--ok-fill)"/>
  <circle cx="725" cy="277" r="6" fill="var(--warn-fill)"/>
  <line x1="545" y1="308" x2="907" y2="308" stroke="var(--ok-fill)" stroke-width="3"/>
  <polygon points="905,302 919,308 905,314" fill="var(--ok-fill)"/>
  <line x1="557" y1="322" x2="919" y2="322" stroke="var(--warn-fill)" stroke-width="3"/>
  <polygon points="559,316 545,322 559,328" fill="var(--warn-fill)"/>
  <circle cx="725" cy="308" r="6" fill="var(--ok-fill)"/>
  <circle cx="650" cy="322" r="6" fill="var(--warn-fill)"/>
  <circle cx="725" cy="322" r="6" fill="var(--warn-fill)"/>
  <circle cx="800" cy="322" r="6" fill="var(--warn-fill)"/>
  <line x1="545" y1="353" x2="907" y2="353" stroke="var(--ok-fill)" stroke-width="3"/>
  <polygon points="905,347 919,353 905,359" fill="var(--ok-fill)"/>
  <line x1="557" y1="367" x2="919" y2="367" stroke="var(--warn-fill)" stroke-width="3"/>
  <polygon points="559,361 545,367 559,373" fill="var(--warn-fill)"/>
  <circle cx="650" cy="353" r="6" fill="var(--ok-fill)"/>
  <circle cx="725" cy="353" r="6" fill="var(--ok-fill)"/>
  <circle cx="800" cy="353" r="6" fill="var(--ok-fill)"/>
  <circle cx="725" cy="367" r="6" fill="var(--warn-fill)"/>
  <line x1="545" y1="398" x2="907" y2="398" stroke="var(--ok-fill)" stroke-width="3"/>
  <polygon points="905,392 919,398 905,404" fill="var(--ok-fill)"/>
  <line x1="557" y1="412" x2="919" y2="412" stroke="var(--warn-fill)" stroke-width="3"/>
  <polygon points="559,406 545,412 559,418" fill="var(--warn-fill)"/>
  <circle cx="650" cy="398" r="6" fill="var(--ok-fill)"/>
  <circle cx="725" cy="398" r="6" fill="var(--ok-fill)"/>
  <circle cx="800" cy="398" r="6" fill="var(--ok-fill)"/>
  <circle cx="650" cy="412" r="6" fill="var(--warn-fill)"/>
  <circle cx="725" cy="412" r="6" fill="var(--warn-fill)"/>
  <circle cx="800" cy="412" r="6" fill="var(--warn-fill)"/>
  <text x="640" y="225" font-size="16" fill="var(--text-faint)">HTTP/2 channel: <tspan fill="var(--ok-fill)">requests</tspan> and <tspan fill="var(--warn-fill)">responses</tspan></text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">protocol buffers • four RPC types • deadlines &amp; errors • interceptors • load balancing • gateway &amp; testing</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

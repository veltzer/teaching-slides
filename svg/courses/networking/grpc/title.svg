<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">gRPC Development</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">High-performance RPC over HTTP/2 with Protocol Buffers</text>

  <!-- Two services with bidirectional stream -->
  <rect x="180" y="320" width="220" height="120" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="290" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Client</text>
  <text x="290" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Go · Python · Java</text>

  <rect x="880" y="320" width="220" height="120" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="990" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Server</text>
  <text x="990" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">C++ · Rust · Java</text>

  <path d="M 400 360 L 880 360" fill="none" stroke="var(--surface)" stroke-width="3"/>
  <path d="M 880 400 L 400 400" fill="none" stroke="var(--surface)" stroke-width="3"/>

  <text x="640" y="375" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--surface)">request</text>
  <text x="640" y="420" text-anchor="middle" font-family="Courier New, monospace" font-size="14" fill="var(--surface)">response</text>

  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-faint)">unary · streaming · bidirectional · cross-language</text>
</svg>

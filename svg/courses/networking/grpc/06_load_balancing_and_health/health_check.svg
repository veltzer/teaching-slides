<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">gRPC Health Checking</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Health service</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Standard proto definition</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Check and Watch methods</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Per service status keys</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Empty key for the whole server</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Wired into most languages</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Status values</text>
  <text x="365" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">SERVING means ready</text>
  <text x="365" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">NOT SERVING means out</text>
  <text x="365" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">UNKNOWN during startup</text>
  <text x="365" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">SERVICE UNKNOWN if missing</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Watch streams updates</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Probes</text>
  <text x="670" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Liveness, readiness, startup</text>
  <text x="670" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">grpc_health_probe binary</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Built into Kubernetes 1.23+</text>
  <text x="670" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Sidecar can also probe</text>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Short timeouts recommended</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Best practices</text>
  <text x="975" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Reflect real dependencies</text>
  <text x="975" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Drain on shutdown</text>
  <text x="975" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Avoid noisy flapping</text>
  <text x="975" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Cache cheaply</text>
  <text x="975" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Test failure scenarios</text>
</svg>

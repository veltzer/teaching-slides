<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">HTTP/2 Features That Power gRPC</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Multiplexing</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Many streams per connection</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">No head of line blocking</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Better connection reuse</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Lower handshake costs</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Concurrency comes free</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Binary framing</text>
  <text x="365" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Length prefixed frames</text>
  <text x="365" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Easier to parse</text>
  <text x="365" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Streams are interleaved</text>
  <text x="365" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Frame types for control</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Better than text parsing</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">HPACK</text>
  <text x="670" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Header field compression</text>
  <text x="670" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Static and dynamic tables</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Repeated headers shrink</text>
  <text x="670" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Saves bandwidth</text>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Per connection state</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Flow control</text>
  <text x="975" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Per stream window</text>
  <text x="975" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Per connection window</text>
  <text x="975" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Backpressure for streams</text>
  <text x="975" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Avoids memory blowups</text>
  <text x="975" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Tunable per server</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.280399254524" font-weight="bold" fill="var(--text)">gRPC Architecture</text>

  <!-- Client side -->
  <rect x="40" y="109.174311926606" width="331.034482758621" height="297.981651376147" rx="6.295476751044" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="205.51724137931" y="146.422018348624" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--primary-text)">Client</text>

  <rect x="60.689655172414" y="173.02752293578" width="289.655172413793" height="63.853211009174" rx="4.196984500696" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="205.51724137931" y="213.467889908257" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">Application code</text>

  <rect x="60.689655172414" y="247.522935779817" width="289.655172413793" height="63.853211009174" rx="4.196984500696" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="205.51724137931" y="287.963302752294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">Generated stub</text>

  <rect x="60.689655172414" y="322.018348623853" width="289.655172413793" height="63.853211009174" rx="4.196984500696" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="205.51724137931" y="362.45871559633" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">gRPC library + HTTP/2</text>

  <!-- Wire -->
  <rect x="412.413793103448" y="215.596330275229" width="455.172413793103" height="127.706422018349" rx="6.295476751044" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="258.165137614679" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--info-text)">HTTP/2 + Protobuf wire</text>
  <text x="640" y="290.091743119266" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">multiplexed streams</text>
  <text x="640" y="314.56880733945" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">binary framing, header compression</text>

  <path d="M 371.034482758621 279.449541284404 L 412.413793103448 279.449541284404" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 867.586206896552 279.449541284404 L 908.965517241379 279.449541284404" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Server side -->
  <rect x="908.965517241379" y="109.174311926606" width="331.034482758621" height="297.981651376147" rx="6.295476751044" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="146.422018348624" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--ok-text)">Server</text>

  <rect x="929.655172413793" y="173.02752293578" width="289.655172413793" height="63.853211009174" rx="4.196984500696" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1074.48275862069" y="213.467889908257" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">Service implementation</text>

  <rect x="929.655172413793" y="247.522935779817" width="289.655172413793" height="63.853211009174" rx="4.196984500696" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1074.48275862069" y="287.963302752294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">Generated server skeleton</text>

  <rect x="929.655172413793" y="322.018348623853" width="289.655172413793" height="63.853211009174" rx="4.196984500696" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1074.48275862069" y="362.45871559633" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">gRPC library + HTTP/2</text>

  <!-- Bottom: shared schema -->
  <rect x="40" y="460.366972477064" width="1200" height="159.633027522936" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="497.614678899083" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">.proto file: the shared contract</text>
  <text x="60.689655172414" y="529.54128440367" font-family="Courier New, monospace" font-size="13.640199627262" fill="var(--text)">service Greeter {</text>
  <text x="60.689655172414" y="554.018348623853" font-family="Courier New, monospace" font-size="13.640199627262" fill="var(--text)">    rpc SayHello (HelloRequest) returns (HelloReply);</text>
  <text x="60.689655172414" y="578.495412844037" font-family="Courier New, monospace" font-size="13.640199627262" fill="var(--text)">}</text>
  <text x="60.689655172414" y="607.229357798165" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--text-muted)">protoc generates client stubs and server skeletons in many languages</text>
</svg>

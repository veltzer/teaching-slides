<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">gRPC Load Balancing Approaches</text>

  <!-- Client-side LB -->
  <text x="308.965517241379" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--text-muted)">Client-Side LB</text>

  <rect x="60.689655172414" y="128.828828828829" width="165.51724137931" height="83.603603603604" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="170.630630630631" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--primary-text)">Client</text>
  <text x="143.448275862069" y="196.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.437255388021" fill="var(--primary-text)">picks backend</text>

  <rect x="371.034482758621" y="87.027027027027" width="165.51724137931" height="62.702702702703" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="453.793103448276" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-text)">Backend 1</text>

  <rect x="371.034482758621" y="160.18018018018" width="165.51724137931" height="62.702702702703" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="453.793103448276" y="196.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-text)">Backend 2</text>

  <rect x="371.034482758621" y="233.333333333333" width="165.51724137931" height="62.702702702703" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="453.793103448276" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-text)">Backend 3</text>

  <path d="M 226.206896551724 154.954954954955 L 371.034482758621 118.378378378378" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 226.206896551724 170.630630630631 L 371.034482758621 191.531531531532" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 226.206896551724 191.531531531532 L 371.034482758621 264.684684684685" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="60.689655172414" y="332.612612612613" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text-muted)">+ low latency, no extra hop</text>
  <text x="60.689655172414" y="356.648648648649" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text-muted)">+ per-RPC routing</text>
  <text x="60.689655172414" y="380.684684684685" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-accent)">- client must discover backends</text>

  <!-- divider -->
  <line x1="640" y1="87.027027027027" x2="640" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Proxy/mesh -->
  <text x="971.034482758621" y="97.477477477477" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.795009796401" font-weight="bold" fill="var(--text-muted)">Proxy / Service Mesh</text>

  <rect x="702.068965517241" y="128.828828828829" width="144.827586206897" height="83.603603603604" rx="6.23850293892" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="774.48275862069" y="170.630630630631" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--primary-text)">Client</text>

  <rect x="888.275862068966" y="128.828828828829" width="165.51724137931" height="83.603603603604" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="165.405405405405" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--warn-text)">Envoy</text>
  <text x="971.034482758621" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.437255388021" fill="var(--warn-text)">L7 proxy</text>

  <rect x="1095.172413793103" y="87.027027027027" width="144.827586206897" height="62.702702702703" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1167.586206896552" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-text)">Backend 1</text>

  <rect x="1095.172413793103" y="160.18018018018" width="144.827586206897" height="62.702702702703" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1167.586206896552" y="196.756756756757" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-text)">Backend 2</text>

  <rect x="1095.172413793103" y="233.333333333333" width="144.827586206897" height="62.702702702703" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1167.586206896552" y="269.90990990991" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-text)">Backend 3</text>

  <path d="M 846.896551724138 170.630630630631 L 888.275862068966 170.630630630631" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1053.793103448276 154.954954954955 L 1095.172413793103 118.378378378378" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1053.793103448276 170.630630630631 L 1095.172413793103 191.531531531532" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1053.793103448276 191.531531531532 L 1095.172413793103 264.684684684685" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="702.068965517241" y="332.612612612613" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text-muted)">+ centralized control</text>
  <text x="702.068965517241" y="356.648648648649" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text-muted)">+ mTLS, retries, observability</text>
  <text x="702.068965517241" y="380.684684684685" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--danger-accent)">- extra hop, operational overhead</text>

  <!-- bottom: anti-pattern -->
  <rect x="40" y="431.891891891892" width="1200" height="188.108108108108" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="466.378378378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--danger-accent)">Anti-pattern: L4 (TCP) load balancer</text>
  <text x="60.689655172414" y="502.954954954955" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- gRPC uses HTTP/2 with persistent connections</text>
  <text x="60.689655172414" y="531.171171171171" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- L4 LB picks a backend per connection, not per RPC</text>
  <text x="60.689655172414" y="559.387387387387" font-family="Arial, sans-serif" font-size="14.556506857481" fill="var(--text)">- result: traffic sticks to one backend, others idle</text>
  <text x="60.689655172414" y="590.738738738739" font-family="Arial, sans-serif" font-size="14.556506857481" font-style="italic" fill="var(--ok-accent)">use client-side LB or L7 proxy/mesh — never plain L4 for gRPC</text>
</svg>

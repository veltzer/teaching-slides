<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Metadata Flow Across A Call</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Initial metadata</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Sent with the request</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Carries auth tokens</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Carries trace headers</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Carries user agent info</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Encoded as HTTP/2 headers</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Response metadata</text>
  <text x="365" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Sent before the body</text>
  <text x="365" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Carries content type</text>
  <text x="365" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Carries server hints</text>
  <text x="365" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Visible to interceptors</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Forms the initial frame</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Trailers</text>
  <text x="670" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Sent after the body</text>
  <text x="670" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Carries final status</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Carries error details</text>
  <text x="670" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Late binding for streams</text>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Always closes the call</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Conventions</text>
  <text x="975" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Lowercase ASCII keys</text>
  <text x="975" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Suffix bin for binary</text>
  <text x="975" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Authority and path are reserved</text>
  <text x="975" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Avoid huge values</text>
  <text x="975" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Compress with HPACK</text>
</svg>

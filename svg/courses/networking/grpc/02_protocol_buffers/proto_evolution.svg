<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Evolving Proto Schemas Safely</text>

  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Safe changes</text>
  <text x="60" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Add new fields</text>
  <text x="60" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Add new messages</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Add enum values</text>
  <text x="60" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Mark fields as reserved</text>
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Rename in source only</text>

  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Risky</text>
  <text x="365" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Changing a field type</text>
  <text x="365" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Changing field number</text>
  <text x="365" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Splitting messages</text>
  <text x="365" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Required default semantics</text>
  <text x="365" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Test before rollout</text>

  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Breaking</text>
  <text x="670" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Removing a field</text>
  <text x="670" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Reusing a field number</text>
  <text x="670" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Renaming services</text>
  <text x="670" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Changing message wrapping</text>
  <text x="670" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Plan a hard migration</text>

  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Tooling</text>
  <text x="975" y="170" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">buf breaking detector</text>
  <text x="975" y="200" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Lint rules for naming</text>
  <text x="975" y="230" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Schema registry storage</text>
  <text x="975" y="260" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Diff in code review</text>
  <text x="975" y="290" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">CI gates the merge</text>
</svg>

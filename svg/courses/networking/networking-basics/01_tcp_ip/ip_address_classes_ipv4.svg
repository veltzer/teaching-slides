  <text x="650.3449" y="203.125" text-anchor="middle" font-size="21.0818" fill="var(--text-muted)">223.255.255.255</text>
  <rect x="784.8275" y="40" width="227.5862" height="163.125" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="898.6207" y="105.25" text-anchor="middle" font-size="23.1901" font-weight="bold" fill="var(--text)">Class D</text>
  <text x="898.6207" y="166.8751" text-anchor="middle" font-size="21.0818" fill="var(--text-muted)">224.0.0.0 -</text>
  <text x="898.6207" y="203.125" text-anchor="middle" font-size="21.0818" fill="var(--text-muted)">239.255.255.255</text>
  <rect x="1033.1035" y="40" width="206.8965" height="163.125" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1136.5517" y="105.25" text-anchor="middle" font-size="23.1901" font-weight="bold" fill="var(--text)">Class E</text>
  <text x="1136.5517" y="166.8751" text-anchor="middle" font-size="21.0818" fill="var(--text-muted)">240.0.0.0 -</text>
  <text x="1136.5517" y="203.125" text-anchor="middle" font-size="21.0818" fill="var(--text-muted)">255.255.255.255</text>

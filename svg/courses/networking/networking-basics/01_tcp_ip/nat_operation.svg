<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="179.2856" y="40" text-anchor="middle" font-size="23.9782" font-weight="bold" fill="var(--text)">Private Network</text>
  <rect x="40" y="77.4194" width="257.1428" height="130.9677" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5714" y="141.0323" text-anchor="middle" font-size="21.7983">PC1: 192.168.1.10</text>
  <text x="168.5714" y="189.6774" text-anchor="middle" font-size="21.7983">:3000</text>
  <rect x="40" y="245.8065" width="257.1428" height="130.9677" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5714" y="309.4194" text-anchor="middle" font-size="21.7983">PC2: 192.168.1.11</text>
  <text x="168.5714" y="358.0645" text-anchor="middle" font-size="21.7983">:4000</text>
  <rect x="40" y="414.1935" width="257.1428" height="130.9677" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="168.5714" y="477.8065" text-anchor="middle" font-size="21.7983">PC3: 192.168.1.12</text>
  <text x="168.5714" y="526.4516" text-anchor="middle" font-size="21.7983">:5000</text>
  <rect x="468.5713" y="189.6774" width="300" height="261.9355" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="618.5714" y="283.2258" text-anchor="middle" font-size="26.158" font-weight="bold" fill="var(--text)">NAT Router</text>
  <text x="618.5714" y="339.3548" text-anchor="middle" font-size="21.7983" fill="var(--text-muted)">Translation Table</text>
  <text x="618.5714" y="395.4839" text-anchor="middle" font-size="21.7983" fill="var(--text-muted)">Public: 203.0.113.5</text>
  <rect x="940" y="189.6774" width="300" height="261.9355" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1089.9999" y="283.2258" text-anchor="middle" font-size="26.158" font-weight="bold" fill="var(--text)">Internet</text>
  <text x="1089.9999" y="339.3548" text-anchor="middle" font-size="23.9782" fill="var(--text-muted)">Web Server</text>
  <text x="1089.9999" y="395.4839" text-anchor="middle" font-size="21.7983" fill="var(--text-muted)">93.184.216.34</text>
  <line x1="297.1428" y1="152.2581" x2="468.5713" y2="264.5161" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="297.1428" y1="309.4194" x2="468.5713" y2="320.6452" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="297.1428" y1="477.8065" x2="468.5713" y2="376.7742" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="768.5714" y1="320.6452" x2="940" y2="320.6452" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="639.9999" y="620" text-anchor="middle" font-size="21.7983" fill="var(--text-muted)">All outbound traffic appears as 203.0.113.5 to external servers</text>
</svg>
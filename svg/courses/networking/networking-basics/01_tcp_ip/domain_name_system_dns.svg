  <line x1="576" y1="396" x2="490.6667" y2="396" stroke="var(--ok-dk)" stroke-width="4.2667" stroke-dasharray="8.5333 6.4" marker-end="url(#arrowd3_00_tcp_ip)" />
  <line x1="298.6667" y1="378" x2="213.3333" y2="378" stroke="var(--ok-dk)" stroke-width="4.2667" stroke-dasharray="8.5333 6.4" marker-end="url(#arrowd3_00_tcp_ip)" />
  <text x="640" y="198" text-anchor="middle" font-size="23.4667" fill="var(--text-dark)">Query: "What is the IP of example.com?"</text>
  <text x="640" y="576" text-anchor="middle" font-size="23.4667" fill="var(--ok-dk)">Response: 93.184.216.34</text>

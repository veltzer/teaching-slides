<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="21.3333" y="270" width="192" height="180" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="117.3333" y="342" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="var(--text)">Browser</text>
  <text x="117.3333" y="396" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">example.com?</text>
  <rect x="298.6667" y="270" width="192" height="180" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="394.6667" y="342" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="var(--text)">Local DNS</text>
  <text x="394.6667" y="396" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Resolver</text>
  <rect x="576" y="270" width="192" height="180" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="672" y="342" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="var(--text)">Root DNS</text>
  <text x="672" y="396" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">(.) servers</text>
  <rect x="853.3333" y="270" width="192" height="180" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="949.3333" y="342" text-anchor="middle" font-size="23.4667" font-weight="bold" fill="var(--text)">TLD DNS</text>
  <text x="949.3333" y="396" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">(.com)</text>
  <rect x="1088" y="270" width="170.6667" height="180" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1173.3333" y="342" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">Authoritative</text>
  <text x="1173.3333" y="396" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">DNS</text>
  <line x1="213.3333" y1="342" x2="298.6667" y2="342" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="490.6667" y1="324" x2="576" y2="324" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="768" y1="324" x2="853.3333" y2="324" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="1045.3333" y1="324" x2="1088" y2="324" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="1088" y1="396" x2="1045.3333" y2="396" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.5333 6.4" marker-end="url(#arrow-ok)" />
  <line x1="853.3333" y1="396" x2="768" y2="396" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.5333 6.4" marker-end="url(#arrow-ok)" />
  <line x1="576" y1="396" x2="490.6667" y2="396" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.5333 6.4" marker-end="url(#arrow-ok)" />
  <line x1="298.6667" y1="378" x2="213.3333" y2="378" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.5333 6.4" marker-end="url(#arrow-ok)" />
  <text x="640" y="198" text-anchor="middle" font-size="23.4667" fill="var(--text)">Query: "What is the IP of example.com?"</text>
  <text x="640" y="576" text-anchor="middle" font-size="23.4667" fill="var(--ok-accent)">Response: 93.184.216.34</text>
  <text x="117.3333" y="630" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Step 1</text>
  <text x="394.6667" y="630" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Step 2</text>
  <text x="672" y="630" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Step 3</text>
  <text x="949.3333" y="630" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Step 4</text>
  <text x="1173.3333" y="630" text-anchor="middle" font-size="21.3333" fill="var(--text-muted)">Step 5</text>
</svg>
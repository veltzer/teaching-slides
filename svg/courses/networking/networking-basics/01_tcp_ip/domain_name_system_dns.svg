  <text x="640" y="198" text-anchor="middle" font-size="23.4667" fill="#333">Query: "What is the IP of example.com?"</text>
  <text x="640" y="576" text-anchor="middle" font-size="23.4667" fill="#2e7d32">Response: 93.184.216.34</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="110" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="90" text-anchor="middle" font-size="30" font-weight="bold" fill="var(--primary-text)">IP Header</text>
  <text x="640" y="130" text-anchor="middle" font-size="18" fill="var(--primary-text)">Version, TTL, Protocol, Checksum, Length</text>

  <rect x="40" y="170" width="590" height="140" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="335" y="225" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--ok-text)">Source IP</text>
  <text x="335" y="265" text-anchor="middle" font-size="18" fill="var(--ok-text)">32-bit address of sender</text>
  <text x="335" y="293" text-anchor="middle" font-size="18" fill="var(--ok-text)">e.g. 192.168.1.10</text>

  <rect x="650" y="170" width="590" height="140" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="945" y="225" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--warn-text)">Destination IP</text>
  <text x="945" y="265" text-anchor="middle" font-size="18" fill="var(--warn-text)">32-bit address of receiver</text>
  <text x="945" y="293" text-anchor="middle" font-size="18" fill="var(--warn-text)">routed hop by hop</text>

  <rect x="40" y="330" width="1200" height="290" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="385" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">Payload Data</text>
  <text x="640" y="435" text-anchor="middle" font-size="20" fill="var(--text-muted)">Upper-layer segment: TCP, UDP, or ICMP</text>
  <text x="640" y="475" text-anchor="middle" font-size="18" fill="var(--text-muted)">MTU typically 1500 bytes on Ethernet</text>
  <text x="640" y="515" text-anchor="middle" font-size="18" fill="var(--text-muted)">Fragmented if larger than the path MTU</text>
  <text x="640" y="555" text-anchor="middle" font-size="18" fill="var(--text-muted)">Routers inspect headers, never the payload</text>
  <text x="640" y="595" text-anchor="middle" font-size="18" fill="var(--text-muted)">End hosts reassemble and deliver</text>
</svg>

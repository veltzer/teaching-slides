<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_intro.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-dark: #f0f0f0;
        --black: #000000;
        --border-faint: #cccccc;
        --border-strong: #bdbdbd;
        --code-bg: #1a1a2e;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-bright: #4a90e2;
        --primary-tint: #90caf9;
        --primary-google: #4285f4;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --ok-dk: #2e7d32;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-google: #34a853;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-soft: #27ae60;
        --ok-pale2: #d4edda;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-yellow: #ffc107;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-pale: #ffebee;
        --info-vivid: #673ab7;
        --info-indigo: #3f51b5;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-deep: #4a148c;
        --info-tint: #e1bee7;
      }
    </style>
    <!-- Gradients -->
    <!-- Drop shadow -->
    <!-- Arrow markers -->

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="g-app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>
    <linearGradient id="g-pres" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f39c12" />
      <stop offset="100%" stop-color="#d68910" />
    </linearGradient>
    <linearGradient id="g-sess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#daa520" />
    </linearGradient>
    <linearGradient id="g-trans" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#27ae60" />
    </linearGradient>
    <linearGradient id="g-net" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3498db" />
      <stop offset="100%" stop-color="#2980b9" />
    </linearGradient>
    <linearGradient id="g-link" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b59b6" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>
    <linearGradient id="g-phys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1abc9c" />
      <stop offset="100%" stop-color="#16a085" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" />
  <rect x="355.5556" y="48" width="426.6667" height="64" rx="7.1111" fill="url(#g-app)" opacity="0.9" filter="url(#shadow)" />
  <text x="568.8889" y="88" text-anchor="middle" font-size="19.9111" fill="var(--bg)" font-weight="bold">Application</text>
  <rect x="355.5556" y="124.8" width="426.6667" height="64" rx="7.1111" fill="url(#g-pres)" opacity="0.9" filter="url(#shadow)" />
  <text x="568.8889" y="164.8" text-anchor="middle" font-size="19.9111" fill="var(--bg)" font-weight="bold">Presentation</text>
  <rect x="355.5556" y="201.6" width="426.6667" height="64" rx="7.1111" fill="url(#g-sess)" opacity="0.9" filter="url(#shadow)" />
  <text x="568.8889" y="241.6" text-anchor="middle" font-size="19.9111" fill="var(--text)" font-weight="bold">Session</text>
  <rect x="355.5556" y="278.4" width="426.6667" height="64" rx="7.1111" fill="url(#g-trans)" opacity="0.9" filter="url(#shadow)" />
  <text x="568.8889" y="318.4" text-anchor="middle" font-size="19.9111" fill="var(--bg)" font-weight="bold">Transport</text>
  <rect x="355.5556" y="355.2" width="426.6667" height="64" rx="7.1111" fill="url(#g-net)" opacity="0.9" filter="url(#shadow)" />
  <text x="568.8889" y="395.2" text-anchor="middle" font-size="19.9111" fill="var(--bg)" font-weight="bold">Network</text>
  <rect x="355.5556" y="432" width="426.6667" height="64" rx="7.1111" fill="url(#g-link)" opacity="0.9" filter="url(#shadow)" />
  <text x="568.8889" y="472" text-anchor="middle" font-size="19.9111" fill="var(--bg)" font-weight="bold">Data Link</text>
  <rect x="355.5556" y="508.8" width="426.6667" height="64" rx="7.1111" fill="url(#g-phys)" opacity="0.9" filter="url(#shadow)" />
  <text x="568.8889" y="548.8" text-anchor="middle" font-size="19.9111" fill="var(--bg)" font-weight="bold">Physical</text>
  <text x="327.1111" y="88" text-anchor="end" font-size="15.6444" fill="var(--text-faint)">HTTP, FTP, DNS</text>
  <text x="327.1111" y="318.4" text-anchor="end" font-size="15.6444" fill="var(--text-faint)">TCP / UDP</text>
  <text x="327.1111" y="395.2" text-anchor="end" font-size="15.6444" fill="var(--text-faint)">IP, ICMP</text>
  <text x="327.1111" y="548.8" text-anchor="end" font-size="15.6444" fill="var(--text-faint)">Ethernet, Wi-Fi</text>
  <text x="810.6667" y="88" font-size="15.6444" fill="var(--text-faint)">Layer 7</text>
  <text x="810.6667" y="164.8" font-size="15.6444" fill="var(--text-faint)">Layer 6</text>
  <text x="810.6667" y="241.6" font-size="15.6444" fill="var(--text-faint)">Layer 5</text>
  <text x="810.6667" y="318.4" font-size="15.6444" fill="var(--text-faint)">Layer 4</text>
  <text x="810.6667" y="395.2" font-size="15.6444" fill="var(--text-faint)">Layer 3</text>
  <text x="810.6667" y="472" font-size="15.6444" fill="var(--text-faint)">Layer 2</text>
  <text x="810.6667" y="548.8" font-size="15.6444" fill="var(--text-faint)">Layer 1</text>
  <rect x="113.7778" y="128" width="85.3333" height="48" rx="4.2667" fill="none" stroke="var(--primary-soft)" stroke-width="2.1333" opacity="0.5" />
  <rect x="938.6667" y="448" width="85.3333" height="48" rx="4.2667" fill="none" stroke="var(--danger-light)" stroke-width="2.1333" opacity="0.5" />
  <rect x="142.2222" y="480" width="71.1111" height="40" rx="4.2667" fill="none" stroke="var(--ok-vivid)" stroke-width="2.1333" opacity="0.4" />
  <rect x="967.1111" y="96" width="71.1111" height="40" rx="4.2667" fill="none" stroke="var(--warn-yellow)" stroke-width="2.1333" opacity="0.4" />
</svg>

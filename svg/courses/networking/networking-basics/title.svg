<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>

  <!-- No background rect — Marp provides white slide background -->

  <!-- ===== LEFT: Network topology illustration ===== -->

  <!-- Nodes — circles with gradient fills -->
  <!-- Router (center) -->
  <circle cx="200" cy="300" r="52" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3" filter="url(#shadow)" />
  <text x="200" y="295" text-anchor="middle" font-size="14" fill="var(--text-dark)" font-weight="bold">Router</text>
  <text x="200" y="313" text-anchor="middle" font-size="12" fill="var(--text-muted)">IP / ICMP</text>

  <!-- Server (top-right of router) -->
  <circle cx="400" cy="130" r="44" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="3" filter="url(#shadow)" />
  <text x="400" y="127" text-anchor="middle" font-size="14" fill="var(--text-dark)" font-weight="bold">Server</text>
  <text x="400" y="143" text-anchor="middle" font-size="11" fill="var(--text-muted)">HTTP</text>

  <!-- Client (top-left of router) -->
  <circle cx="70" cy="110" r="40" fill="var(--info-pale)" stroke="var(--info-dk)" stroke-width="3" filter="url(#shadow)" />
  <text x="70" y="107" text-anchor="middle" font-size="14" fill="var(--text-dark)" font-weight="bold">Client</text>
  <text x="70" y="123" text-anchor="middle" font-size="11" fill="var(--text-muted)">Browser</text>

  <!-- Firewall (left of router) -->
  <circle cx="60" cy="430" r="40" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="3" filter="url(#shadow)" />
  <text x="60" y="427" text-anchor="middle" font-size="13" fill="var(--text-dark)" font-weight="bold">Firewall</text>
  <text x="60" y="443" text-anchor="middle" font-size="11" fill="var(--text-muted)">Filter</text>

  <!-- DNS (right of router) -->
  <circle cx="420" cy="360" r="40" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="3" filter="url(#shadow)" />
  <text x="420" y="357" text-anchor="middle" font-size="14" fill="var(--text-dark)" font-weight="bold">DNS</text>
  <text x="420" y="373" text-anchor="middle" font-size="11" fill="var(--text-muted)">Resolve</text>

  <!-- Switch (bottom) -->
  <circle cx="260" cy="520" r="38" fill="var(--border-strong)" stroke="var(--text-muted)" stroke-width="3" filter="url(#shadow)" />
  <text x="260" y="517" text-anchor="middle" font-size="13" fill="var(--text-dark)" font-weight="bold">Switch</text>
  <text x="260" y="533" text-anchor="middle" font-size="11" fill="var(--surface)">L2</text>

  <!-- Connection lines -->
  <line x1="105" y1="140" x2="158" y2="264" stroke="var(--primary-tint)" stroke-width="2.5" />
  <line x1="248" y1="272" x2="362" y2="150" stroke="var(--primary-tint)" stroke-width="2.5" />
  <line x1="96" y1="410" x2="155" y2="335" stroke="var(--primary-tint)" stroke-width="2.5" />
  <line x1="245" y1="330" x2="383" y2="340" stroke="var(--primary-tint)" stroke-width="2.5" />
  <line x1="220" y1="350" x2="250" y2="484" stroke="var(--primary-tint)" stroke-width="2.5" />
  <line x1="290" y1="500" x2="395" y2="390" stroke="var(--primary-tint)" stroke-width="2" stroke-dasharray="6 4" />

  <!-- ===== RIGHT: Protocol stack + labels ===== -->

  <!-- Compact OSI stack -->
  <rect x="580" y="60" width="340" height="62" rx="8" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="2" filter="url(#shadow)" />
  <text x="750" y="98" text-anchor="middle" font-size="18" fill="var(--text-dark)" font-weight="bold">Application</text>
  <text x="940" y="98" font-size="14" fill="var(--text-muted)">HTTP, FTP, DNS</text>

  <rect x="580" y="132" width="340" height="62" rx="8" fill="var(--warn-pale)" stroke="var(--warn-dk)" stroke-width="2" filter="url(#shadow)" />
  <text x="750" y="170" text-anchor="middle" font-size="18" fill="var(--text-dark)" font-weight="bold">Transport</text>
  <text x="940" y="170" font-size="14" fill="var(--text-muted)">TCP, UDP</text>

  <rect x="580" y="204" width="340" height="62" rx="8" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="2" filter="url(#shadow)" />
  <text x="750" y="242" text-anchor="middle" font-size="18" fill="var(--text-dark)" font-weight="bold">Network</text>
  <text x="940" y="242" font-size="14" fill="var(--text-muted)">IP, ICMP, ARP</text>

  <rect x="580" y="276" width="340" height="62" rx="8" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2" filter="url(#shadow)" />
  <text x="750" y="314" text-anchor="middle" font-size="18" fill="var(--text-dark)" font-weight="bold">Link / Physical</text>
  <text x="940" y="314" font-size="14" fill="var(--text-muted)">Ethernet, Wi-Fi</text>

  <!-- Key topics list -->
  <rect x="580" y="380" width="650" height="240" rx="12" fill="var(--surface-light)" stroke="var(--border)" stroke-width="1.5" />
  <text x="600" y="415" font-size="16" font-weight="bold" fill="var(--primary-dk)">What you will learn:</text>

  <circle cx="610" cy="450" r="5" fill="var(--primary)" />
  <text x="625" y="455" font-size="15" fill="var(--text-dark)">TCP/IP fundamentals and packet structure</text>

  <circle cx="610" cy="480" r="5" fill="var(--ok)" />
  <text x="625" y="485" font-size="15" fill="var(--text-dark)">HTTP protocol evolution (1.0 → 3.0)</text>

  <circle cx="610" cy="510" r="5" fill="var(--warn)" />
  <text x="625" y="515" font-size="15" fill="var(--text-dark)">DNS deep dive and resolution</text>

  <circle cx="610" cy="540" r="5" fill="var(--danger)" />
  <text x="625" y="545" font-size="15" fill="var(--text-dark)">Network security, TLS, and firewalls</text>

  <circle cx="610" cy="570" r="5" fill="var(--info)" />
  <text x="625" y="575" font-size="15" fill="var(--text-dark)">Socket programming and modern networking</text>

  <circle cx="610" cy="600" r="5" fill="var(--border-strong)" />
  <text x="625" y="605" font-size="15" fill="var(--text-dark)">Kubernetes, service mesh, and observability</text>
</svg>
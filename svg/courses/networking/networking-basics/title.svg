<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- OSI Model layers -->
  <rect x="250" y="30" width="300" height="40" rx="5" fill="#e74c3c" opacity="0.85"/>
  <text x="400" y="55" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Application</text>
  <rect x="250" y="78" width="300" height="40" rx="5" fill="#e67e22" opacity="0.85"/>
  <text x="400" y="103" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Presentation</text>
  <rect x="250" y="126" width="300" height="40" rx="5" fill="#f1c40f" opacity="0.85"/>
  <text x="400" y="151" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">Session</text>
  <rect x="250" y="174" width="300" height="40" rx="5" fill="#2ecc71" opacity="0.85"/>
  <text x="400" y="199" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Transport</text>
  <rect x="250" y="222" width="300" height="40" rx="5" fill="#3498db" opacity="0.85"/>
  <text x="400" y="247" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Network</text>
  <rect x="250" y="270" width="300" height="40" rx="5" fill="#9b59b6" opacity="0.85"/>
  <text x="400" y="295" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Data Link</text>
  <rect x="250" y="318" width="300" height="40" rx="5" fill="#1abc9c" opacity="0.85"/>
  <text x="400" y="343" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Physical</text>
  <!-- TCP/IP labels on left -->
  <text x="230" y="55" text-anchor="end" font-size="11" fill="#888">HTTP, FTP, DNS</text>
  <text x="230" y="199" text-anchor="end" font-size="11" fill="#888">TCP / UDP</text>
  <text x="230" y="247" text-anchor="end" font-size="11" fill="#888">IP, ICMP</text>
  <text x="230" y="343" text-anchor="end" font-size="11" fill="#888">Ethernet, Wi-Fi</text>
  <!-- Arrows on right side -->
  <text x="570" y="55" font-size="11" fill="#888">Layer 7</text>
  <text x="570" y="103" font-size="11" fill="#888">Layer 6</text>
  <text x="570" y="151" font-size="11" fill="#888">Layer 5</text>
  <text x="570" y="199" font-size="11" fill="#888">Layer 4</text>
  <text x="570" y="247" font-size="11" fill="#888">Layer 3</text>
  <text x="570" y="295" font-size="11" fill="#888">Layer 2</text>
  <text x="570" y="343" font-size="11" fill="#888">Layer 1</text>
  <!-- Decorative network packets -->
  <rect x="80" y="80" width="60" height="30" rx="3" fill="none" stroke="#3498db" stroke-width="1.5" opacity="0.5"/>
  <rect x="660" y="280" width="60" height="30" rx="3" fill="none" stroke="#e74c3c" stroke-width="1.5" opacity="0.5"/>
  <rect x="100" y="300" width="50" height="25" rx="3" fill="none" stroke="#2ecc71" stroke-width="1.5" opacity="0.4"/>
  <rect x="680" y="60" width="50" height="25" rx="3" fill="none" stroke="#f1c40f" stroke-width="1.5" opacity="0.4"/>
</svg>

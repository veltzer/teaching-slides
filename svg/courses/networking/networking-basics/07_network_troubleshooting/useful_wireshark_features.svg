<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="154.5" text-anchor="middle" font-size="25.7802" font-weight="bold" fill="var(--text)">Useful Wireshark Features</text>
  <rect x="40" y="175.9898" width="581.8182" height="71.6327" rx="6.0017" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="67.2728" y="207.5082" font-size="18.619" font-weight="bold" fill="var(--primary-accent)">1. Capture Filters</text>
  <text x="67.2728" y="233.2959" font-size="15.7546" fill="var(--text-muted)">host 10.0.0.5 and port 80</text>
  <rect x="658.1818" y="175.9898" width="581.8182" height="71.6327" rx="6.0017" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="685.4546" y="207.5082" font-size="18.619" font-weight="bold" fill="var(--ok-accent)">2. Display Filters</text>
  <text x="685.4546" y="233.2959" font-size="15.7546" fill="var(--text-muted)">http.request.method == "POST"</text>
  <rect x="40" y="261.9489" width="581.8182" height="71.6327" rx="6.0017" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="67.2728" y="293.4673" font-size="18.619" font-weight="bold" fill="var(--danger-accent)">3. Statistics -&gt; Conversations</text>
  <text x="67.2728" y="319.2551" font-size="15.7546" fill="var(--text-muted)">All connections with byte/packet counts</text>
  <rect x="658.1818" y="261.9489" width="581.8182" height="71.6327" rx="6.0017" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="685.4546" y="293.4673" font-size="18.619" font-weight="bold" fill="var(--primary-accent)">4. Protocol Hierarchy</text>
  <text x="685.4546" y="319.2551" font-size="15.7546" fill="var(--text-muted)">Distribution of protocols in capture</text>
  <rect x="40" y="347.9081" width="581.8182" height="71.6327" rx="6.0017" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="67.2728" y="379.4265" font-size="18.619" font-weight="bold" fill="var(--ok-accent)">5. Follow TCP Stream</text>
  <text x="67.2728" y="405.2143" font-size="15.7546" fill="var(--text-muted)">Reassembles complete TCP conversation</text>
  <rect x="658.1818" y="347.9081" width="581.8182" height="71.6327" rx="6.0017" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="685.4546" y="379.4265" font-size="18.619" font-weight="bold" fill="var(--danger-accent)">6. Expert Information</text>
  <text x="685.4546" y="405.2143" font-size="15.7546" fill="var(--text-muted)">Highlights retransmissions, resets, etc.</text>
  <rect x="40" y="433.8673" width="581.8182" height="71.6327" rx="6.0017" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="67.2728" y="465.3857" font-size="18.619" font-weight="bold" fill="var(--primary-accent)">7. IO Graphs</text>
  <text x="67.2728" y="491.1734" font-size="15.7546" fill="var(--text-muted)">Plot traffic patterns over time</text>
  <rect x="658.1818" y="433.8673" width="581.8182" height="71.6327" rx="6.0017" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="685.4546" y="465.3857" font-size="18.619" font-weight="bold" fill="var(--ok-accent)">8. Export Objects -&gt; HTTP</text>
  <text x="685.4546" y="491.1734" font-size="15.7546" fill="var(--text-muted)">Extract files transferred over HTTP</text>
</svg>
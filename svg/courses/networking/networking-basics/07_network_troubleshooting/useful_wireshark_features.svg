<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Useful Wireshark Features</text>

  <rect x="40" y="100" width="390" height="170" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">1. Capture Filters</text>
  <text x="60" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Decide which packets hit disk</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">BPF syntax, applied by kernel</text>
  <text x="60" y="220" font-family="monospace" font-size="13" fill="var(--primary-text)">host 10.0.0.5 and port 80</text>
  <text x="60" y="250" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Lower CPU, smaller pcap files</text>

  <rect x="445" y="100" width="390" height="170" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="465" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">2. Display Filters</text>
  <text x="465" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Narrow the view post-capture</text>
  <text x="465" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Field-based, dissector aware</text>
  <text x="465" y="220" font-family="monospace" font-size="13" fill="var(--ok-text)">http.request.method == "POST"</text>
  <text x="465" y="250" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Chain with &amp;&amp;, ||, !</text>

  <rect x="850" y="100" width="390" height="170" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="870" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">3. Conversations</text>
  <text x="870" y="165" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Statistics → Conversations</text>
  <text x="870" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">All connections at a glance</text>
  <text x="870" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Byte and packet counts by pair</text>
  <text x="870" y="250" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Click a row to filter to that flow</text>

  <rect x="40" y="285" width="390" height="170" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">4. Protocol Hierarchy</text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Statistics → Protocol Hierarchy</text>
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Tree of protocols seen</text>
  <text x="60" y="405" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Shows bytes per protocol</text>
  <text x="60" y="435" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Spots unexpected traffic quickly</text>

  <rect x="445" y="285" width="390" height="170" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="465" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">5. Follow Stream</text>
  <text x="465" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Reassemble TCP, UDP, HTTP, TLS</text>
  <text x="465" y="375" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Read both sides as plain text</text>
  <text x="465" y="405" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Great for debugging protocols</text>
  <text x="465" y="435" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Right-click a packet → Follow</text>

  <rect x="850" y="285" width="390" height="170" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="870" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">6. Expert Info</text>
  <text x="870" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Analyze → Expert Information</text>
  <text x="870" y="375" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Flags retransmits, resets, dupes</text>
  <text x="870" y="405" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Severity-graded, jump-to-packet</text>
  <text x="870" y="435" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">First place to look for anomalies</text>

  <rect x="40" y="470" width="390" height="150" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="60" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">7. IO Graphs</text>
  <text x="60" y="535" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Plot traffic over time</text>
  <text x="60" y="560" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Overlay filters on one chart</text>
  <text x="60" y="590" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Spot bursts, silences, retries</text>

  <rect x="445" y="470" width="390" height="150" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="465" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">8. Export Objects</text>
  <text x="465" y="535" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">File → Export Objects → HTTP</text>
  <text x="465" y="560" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Pull files out of captures</text>
  <text x="465" y="590" font-family="Arial, sans-serif" font-size="13" fill="var(--info-text)">Also works for SMB, DICOM, TFTP</text>

  <rect x="850" y="470" width="390" height="150" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="870" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--danger-text)">9. Coloring Rules</text>
  <text x="870" y="535" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">View → Coloring Rules</text>
  <text x="870" y="560" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">Highlight errors, your flow</text>
  <text x="870" y="590" font-family="Arial, sans-serif" font-size="13" fill="var(--danger-text)">Custom rules per project</text>
</svg>

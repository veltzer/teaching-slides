<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Useful Wireshark Features</text>
  <!-- Feature 1 -->
  <rect x="20" y="45" width="320" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="35" y="67" font-size="13" font-weight="bold" fill="#4a90e2">1. Capture Filters</text>
  <text x="35" y="85" font-size="11" fill="#555">host 10.0.0.5 and port 80</text>
  <!-- Feature 2 -->
  <rect x="360" y="45" width="320" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="375" y="67" font-size="13" font-weight="bold" fill="#28a745">2. Display Filters</text>
  <text x="375" y="85" font-size="11" fill="#555">http.request.method == "POST"</text>
  <!-- Feature 3 -->
  <rect x="20" y="105" width="320" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="35" y="127" font-size="13" font-weight="bold" fill="#856404">3. Statistics -&gt; Conversations</text>
  <text x="35" y="145" font-size="11" fill="#555">All connections with byte/packet counts</text>
  <!-- Feature 4 -->
  <rect x="360" y="105" width="320" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="127" font-size="13" font-weight="bold" fill="#4a90e2">4. Protocol Hierarchy</text>
  <text x="375" y="145" font-size="11" fill="#555">Distribution of protocols in capture</text>
  <!-- Feature 5 -->
  <rect x="20" y="165" width="320" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="35" y="187" font-size="13" font-weight="bold" fill="#28a745">5. Follow TCP Stream</text>
  <text x="35" y="205" font-size="11" fill="#555">Reassembles complete TCP conversation</text>
  <!-- Feature 6 -->
  <rect x="360" y="165" width="320" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="187" font-size="13" font-weight="bold" fill="#856404">6. Expert Information</text>
  <text x="375" y="205" font-size="11" fill="#555">Highlights retransmissions, resets, etc.</text>
  <!-- Feature 7 -->
  <rect x="20" y="225" width="320" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="35" y="247" font-size="13" font-weight="bold" fill="#4a90e2">7. IO Graphs</text>
  <text x="35" y="265" font-size="11" fill="#555">Plot traffic patterns over time</text>
  <!-- Feature 8 -->
  <rect x="360" y="225" width="320" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="375" y="247" font-size="13" font-weight="bold" fill="#28a745">8. Export Objects -&gt; HTTP</text>
  <text x="375" y="265" font-size="11" fill="#555">Extract files transferred over HTTP</text>
</svg>
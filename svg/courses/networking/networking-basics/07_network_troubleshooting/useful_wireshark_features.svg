<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="43.2" text-anchor="middle" font-size="25.92" font-weight="bold" fill="#333">Useful Wireshark Features</text>
  <rect x="36.5714" y="64.8" width="585.1429" height="72" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="64" y="96.48" font-size="18.72" font-weight="bold" fill="#4a90e2">1. Capture Filters</text>
  <text x="64" y="122.4" font-size="15.84" fill="#555">host 10.0.0.5 and port 80</text>
  <rect x="658.2857" y="64.8" width="585.1429" height="72" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="685.7143" y="96.48" font-size="18.72" font-weight="bold" fill="#28a745">2. Display Filters</text>
  <text x="685.7143" y="122.4" font-size="15.84" fill="#555">http.request.method == "POST"</text>
  <rect x="36.5714" y="151.2" width="585.1429" height="72" rx="7.2" fill="#fff3cd" stroke="#ffc107" stroke-width="2.88" />
  <text x="64" y="182.88" font-size="18.72" font-weight="bold" fill="#856404">3. Statistics -&gt; Conversations</text>
  <text x="64" y="208.8" font-size="15.84" fill="#555">All connections with byte/packet counts</text>
  <rect x="658.2857" y="151.2" width="585.1429" height="72" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="685.7143" y="182.88" font-size="18.72" font-weight="bold" fill="#4a90e2">4. Protocol Hierarchy</text>
  <text x="685.7143" y="208.8" font-size="15.84" fill="#555">Distribution of protocols in capture</text>
  <rect x="36.5714" y="237.6" width="585.1429" height="72" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="64" y="269.28" font-size="18.72" font-weight="bold" fill="#28a745">5. Follow TCP Stream</text>
  <text x="64" y="295.2" font-size="15.84" fill="#555">Reassembles complete TCP conversation</text>
  <rect x="658.2857" y="237.6" width="585.1429" height="72" rx="7.2" fill="#fff3cd" stroke="#ffc107" stroke-width="2.88" />
  <text x="685.7143" y="269.28" font-size="18.72" font-weight="bold" fill="#856404">6. Expert Information</text>
  <text x="685.7143" y="295.2" font-size="15.84" fill="#555">Highlights retransmissions, resets, etc.</text>
  <rect x="36.5714" y="324" width="585.1429" height="72" rx="7.2" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.88" />
  <text x="64" y="355.68" font-size="18.72" font-weight="bold" fill="#4a90e2">7. IO Graphs</text>
  <text x="64" y="381.6" font-size="15.84" fill="#555">Plot traffic patterns over time</text>
  <rect x="658.2857" y="324" width="585.1429" height="72" rx="7.2" fill="#d4edda" stroke="#28a745" stroke-width="2.88" />
  <text x="685.7143" y="355.68" font-size="18.72" font-weight="bold" fill="#28a745">8. Export Objects -&gt; HTTP</text>
  <text x="685.7143" y="381.6" font-size="15.84" fill="#555">Extract files transferred over HTTP</text>
</svg>
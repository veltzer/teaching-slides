<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="45" text-anchor="middle" font-size="27" font-weight="bold" fill="#333">Troubleshooting Methodology</text>
  <rect x="170.6667" y="75" width="938.6667" height="82.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="213.3333" y="112.5" font-size="21" font-weight="bold" fill="#4a90e2">1. Identify the problem</text>
  <text x="213.3333" y="142.5" font-size="18" fill="#555">"What exactly isn't working?"</text>
  <line x1="640" y1="157.5" x2="640" y2="180" stroke="#4a90e2" stroke-width="3" marker-end="url(#aTM)" />
  <rect x="170.6667" y="180" width="938.6667" height="82.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="213.3333" y="217.5" font-size="21" font-weight="bold" fill="#28a745">2. Gather information</text>
  <text x="213.3333" y="247.5" font-size="18" fill="#555">Logs, error messages, recent changes</text>
  <line x1="640" y1="262.5" x2="640" y2="285" stroke="#28a745" stroke-width="3" marker-end="url(#aTMg)" />
  <rect x="170.6667" y="285" width="938.6667" height="82.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="213.3333" y="322.5" font-size="21" font-weight="bold" fill="#856404">3. Test layer by layer (bottom-up)</text>
  <text x="213.3333" y="352.5" font-size="18" fill="#555">Physical -&gt; Link -&gt; Network -&gt; Transport -&gt; Application</text>
  <line x1="640" y1="367.5" x2="640" y2="390" stroke="#ffc107" stroke-width="3" marker-end="url(#aTMy)" />
  <rect x="170.6667" y="390" width="938.6667" height="82.5" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="213.3333" y="427.5" font-size="21" font-weight="bold" fill="#4a90e2">4. Isolate the cause</text>
  <text x="213.3333" y="457.5" font-size="18" fill="#555">Narrow down: local? network? remote?</text>
  <line x1="640" y1="472.5" x2="640" y2="495" stroke="#4a90e2" stroke-width="3" marker-end="url(#aTM)" />
  <rect x="170.6667" y="495" width="938.6667" height="82.5" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="213.3333" y="532.5" font-size="21" font-weight="bold" fill="#28a745">5. Fix and verify</text>
  <text x="213.3333" y="562.5" font-size="18" fill="#555">Apply fix, confirm it works</text>
  <line x1="640" y1="577.5" x2="640" y2="600" stroke="#28a745" stroke-width="3" marker-end="url(#aTMg)" />
  <rect x="170.6667" y="600" width="938.6667" height="82.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="3" />
  <text x="213.3333" y="637.5" font-size="21" font-weight="bold" fill="#856404">6. Document</text>
  <text x="213.3333" y="667.5" font-size="18" fill="#555">Record the problem and solution</text>
  <defs>
    <marker id="aTM" markerWidth="21.3333" markerHeight="10.5" refX="10.6667" refY="10.5" orient="auto">
      <polygon points="0,7.5 14.9333,15" fill="#4a90e2" />
    </marker>
    <marker id="aTMg" markerWidth="21.3333" markerHeight="10.5" refX="10.6667" refY="10.5" orient="auto">
      <polygon points="0,7.5 14.9333,15" fill="#28a745" />
    </marker>
    <marker id="aTMy" markerWidth="21.3333" markerHeight="10.5" refX="10.6667" refY="10.5" orient="auto">
      <polygon points="0,7.5 14.9333,15" fill="#ffc107" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="1200" height="78.765404892548" rx="6.146362873407" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="94.5454" y="75.802523548238" font-size="23.200368620104" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">1. Identify the problem</text>
  <text x="94.5454" y="104.444479423867" font-size="19.886044880001" fill="var(--text-muted)" font-family="Arial, sans-serif">"What exactly isn't working?"</text>
  <line x1="639.9999" y1="118.765404892548" x2="639.9999" y2="140.246898033837" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="40" y="140.246898033837" width="1200" height="78.765404892548" rx="6.146362873407" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="94.5454" y="176.049316643806" font-size="23.200368620104" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">2. Gather information</text>
  <text x="94.5454" y="204.691377457704" font-size="19.886044880001" fill="var(--text-muted)" font-family="Arial, sans-serif">Logs, error messages, recent changes</text>
  <line x1="639.9999" y1="219.012302926385" x2="639.9999" y2="240.493796067674" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="40" y="240.493796067674" width="1200" height="78.765404892548" rx="6.146362873407" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="94.5454" y="276.296319615912" font-size="23.200368620104" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">3. Test layer by layer (bottom-up)</text>
  <text x="94.5454" y="304.938380429809" font-size="19.886044880001" fill="var(--text-muted)" font-family="Arial, sans-serif">Physical -&gt; Link -&gt; Network -&gt; Transport -&gt; Application</text>
  <line x1="639.9999" y1="319.25930589849" x2="639.9999" y2="340.740799039779" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <rect x="40" y="340.740799039779" width="1200" height="78.765404892548" rx="6.146362873407" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="94.5454" y="376.543217649748" font-size="23.200368620104" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">4. Isolate the cause</text>
  <text x="94.5454" y="405.185173525378" font-size="19.886044880001" fill="var(--text-muted)" font-family="Arial, sans-serif">Narrow down: local? network? remote?</text>
  <line x1="639.9999" y1="419.506203932326" x2="639.9999" y2="440.987592135347" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="40" y="440.987592135347" width="1200" height="78.765404892548" rx="6.146362873407" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="94.5454" y="476.790220621853" font-size="23.200368620104" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">5. Fix and verify</text>
  <text x="94.5454" y="505.432071559214" font-size="19.886044880001" fill="var(--text-muted)" font-family="Arial, sans-serif">Apply fix, confirm it works</text>
  <line x1="639.9999" y1="519.753101966163" x2="639.9999" y2="541.234595107452" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="40" y="541.234595107452" width="1200" height="78.765404892548" rx="6.146362873407" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="94.5454" y="577.037013717422" font-size="23.200368620104" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">6. Document</text>
  <text x="94.5454" y="605.679074531319" font-size="19.886044880001" fill="var(--text-muted)" font-family="Arial, sans-serif">Record the problem and solution</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

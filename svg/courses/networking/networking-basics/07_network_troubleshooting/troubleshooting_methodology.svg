<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Arial, sans-serif">
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Troubleshooting Methodology</text>
  <!-- Step 1 -->
  <rect x="80" y="50" width="440" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="75" font-size="14" font-weight="bold" fill="#4a90e2">1. Identify the problem</text>
  <text x="100" y="95" font-size="12" fill="#555">"What exactly isn't working?"</text>
  <line x1="300" y1="105" x2="300" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#aTM)"/>
  <!-- Step 2 -->
  <rect x="80" y="120" width="440" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="100" y="145" font-size="14" font-weight="bold" fill="#28a745">2. Gather information</text>
  <text x="100" y="165" font-size="12" fill="#555">Logs, error messages, recent changes</text>
  <line x1="300" y1="175" x2="300" y2="190" stroke="#28a745" stroke-width="2" marker-end="url(#aTMg)"/>
  <!-- Step 3 -->
  <rect x="80" y="190" width="440" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="100" y="215" font-size="14" font-weight="bold" fill="#856404">3. Test layer by layer (bottom-up)</text>
  <text x="100" y="235" font-size="12" fill="#555">Physical -&gt; Link -&gt; Network -&gt; Transport -&gt; Application</text>
  <line x1="300" y1="245" x2="300" y2="260" stroke="#ffc107" stroke-width="2" marker-end="url(#aTMy)"/>
  <!-- Step 4 -->
  <rect x="80" y="260" width="440" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="285" font-size="14" font-weight="bold" fill="#4a90e2">4. Isolate the cause</text>
  <text x="100" y="305" font-size="12" fill="#555">Narrow down: local? network? remote?</text>
  <line x1="300" y1="315" x2="300" y2="330" stroke="#4a90e2" stroke-width="2" marker-end="url(#aTM)"/>
  <!-- Step 5 -->
  <rect x="80" y="330" width="440" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="100" y="355" font-size="14" font-weight="bold" fill="#28a745">5. Fix and verify</text>
  <text x="100" y="375" font-size="12" fill="#555">Apply fix, confirm it works</text>
  <line x1="300" y1="385" x2="300" y2="400" stroke="#28a745" stroke-width="2" marker-end="url(#aTMg)"/>
  <!-- Step 6 -->
  <rect x="80" y="400" width="440" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="100" y="425" font-size="14" font-weight="bold" fill="#856404">6. Document</text>
  <text x="100" y="445" font-size="12" fill="#555">Record the problem and solution</text>
  <defs>
    <marker id="aTM" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 5 7, 10 0" fill="#4a90e2"/>
    </marker>
    <marker id="aTMg" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 5 7, 10 0" fill="#28a745"/>
    </marker>
    <marker id="aTMy" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0 0, 5 7, 10 0" fill="#ffc107"/>
    </marker>
  </defs>
</svg>
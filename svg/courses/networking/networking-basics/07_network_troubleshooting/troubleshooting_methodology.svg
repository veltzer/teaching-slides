<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="600.1465" y="42.1978" text-anchor="middle" font-size="25.3187" font-weight="bold" fill="var(--text)">Troubleshooting Methodology</text>
  <rect x="160.0391" y="70.3297" width="880.2149" height="77.3626" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="200.0488" y="105.4945" font-size="19.6923" font-weight="bold" fill="var(--primary-accent)">1. Identify the problem</text>
  <text x="200.0488" y="133.6264" font-size="16.8791" fill="var(--text-muted)">"What exactly isn't working?"</text>
  <line x1="600.1465" y1="147.6923" x2="600.1465" y2="168.7912" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="160.0391" y="168.7912" width="880.2149" height="77.3626" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="200.0488" y="203.956" font-size="19.6923" font-weight="bold" fill="var(--ok-accent)">2. Gather information</text>
  <text x="200.0488" y="232.0879" font-size="16.8791" fill="var(--text-muted)">Logs, error messages, recent changes</text>
  <line x1="600.1465" y1="246.1538" x2="600.1465" y2="267.2527" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="160.0391" y="267.2527" width="880.2149" height="77.3626" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="200.0488" y="302.4176" font-size="19.6923" font-weight="bold" fill="var(--danger-accent)">3. Test layer by layer (bottom-up)</text>
  <text x="200.0488" y="330.5495" font-size="16.8791" fill="var(--text-muted)">Physical -&gt; Link -&gt; Network -&gt; Transport -&gt; Application</text>
  <line x1="600.1465" y1="344.6154" x2="600.1465" y2="365.7143" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)" />
  <rect x="160.0391" y="365.7143" width="880.2149" height="77.3626" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="200.0488" y="400.8791" font-size="19.6923" font-weight="bold" fill="var(--primary-accent)">4. Isolate the cause</text>
  <text x="200.0488" y="429.011" font-size="16.8791" fill="var(--text-muted)">Narrow down: local? network? remote?</text>
  <line x1="600.1465" y1="443.0769" x2="600.1465" y2="464.1758" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="160.0391" y="464.1758" width="880.2149" height="77.3626" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="200.0488" y="499.3407" font-size="19.6923" font-weight="bold" fill="var(--ok-accent)">5. Fix and verify</text>
  <text x="200.0488" y="527.4725" font-size="16.8791" fill="var(--text-muted)">Apply fix, confirm it works</text>
  <line x1="600.1465" y1="541.5385" x2="600.1465" y2="562.6374" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="160.0391" y="562.6374" width="880.2149" height="77.3626" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="200.0488" y="597.8022" font-size="19.6923" font-weight="bold" fill="var(--danger-accent)">6. Document</text>
  <text x="200.0488" y="625.9341" font-size="16.8791" fill="var(--text-muted)">Record the problem and solution</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
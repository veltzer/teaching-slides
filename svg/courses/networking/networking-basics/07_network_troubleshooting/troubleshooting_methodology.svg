<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="600.1465" y="42.1978" text-anchor="middle" font-size="25.3187" font-weight="bold" fill="#333">Troubleshooting Methodology</ns0:text>
  <ns0:rect x="160.0391" y="70.3297" width="880.2149" height="77.3626" rx="7.033" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8132" />
  <ns0:text x="200.0488" y="105.4945" font-size="19.6923" font-weight="bold" fill="#4a90e2">1. Identify the problem</ns0:text>
  <ns0:text x="200.0488" y="133.6264" font-size="16.8791" fill="#555">"What exactly isn't working?"</ns0:text>
  <ns0:line x1="600.1465" y1="147.6923" x2="600.1465" y2="168.7912" stroke="#4a90e2" stroke-width="2.8132" marker-end="url(#aTM)" />
  <ns0:rect x="160.0391" y="168.7912" width="880.2149" height="77.3626" rx="7.033" fill="#d4edda" stroke="#28a745" stroke-width="2.8132" />
  <ns0:text x="200.0488" y="203.956" font-size="19.6923" font-weight="bold" fill="#28a745">2. Gather information</ns0:text>
  <ns0:text x="200.0488" y="232.0879" font-size="16.8791" fill="#555">Logs, error messages, recent changes</ns0:text>
  <ns0:line x1="600.1465" y1="246.1538" x2="600.1465" y2="267.2527" stroke="#28a745" stroke-width="2.8132" marker-end="url(#aTMg)" />
  <ns0:rect x="160.0391" y="267.2527" width="880.2149" height="77.3626" rx="7.033" fill="#fff3cd" stroke="#ffc107" stroke-width="2.8132" />
  <ns0:text x="200.0488" y="302.4176" font-size="19.6923" font-weight="bold" fill="#856404">3. Test layer by layer (bottom-up)</ns0:text>
  <ns0:text x="200.0488" y="330.5495" font-size="16.8791" fill="#555">Physical -&gt; Link -&gt; Network -&gt; Transport -&gt; Application</ns0:text>
  <ns0:line x1="600.1465" y1="344.6154" x2="600.1465" y2="365.7143" stroke="#ffc107" stroke-width="2.8132" marker-end="url(#aTMy)" />
  <ns0:rect x="160.0391" y="365.7143" width="880.2149" height="77.3626" rx="7.033" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8132" />
  <ns0:text x="200.0488" y="400.8791" font-size="19.6923" font-weight="bold" fill="#4a90e2">4. Isolate the cause</ns0:text>
  <ns0:text x="200.0488" y="429.011" font-size="16.8791" fill="#555">Narrow down: local? network? remote?</ns0:text>
  <ns0:line x1="600.1465" y1="443.0769" x2="600.1465" y2="464.1758" stroke="#4a90e2" stroke-width="2.8132" marker-end="url(#aTM)" />
  <ns0:rect x="160.0391" y="464.1758" width="880.2149" height="77.3626" rx="7.033" fill="#d4edda" stroke="#28a745" stroke-width="2.8132" />
  <ns0:text x="200.0488" y="499.3407" font-size="19.6923" font-weight="bold" fill="#28a745">5. Fix and verify</ns0:text>
  <ns0:text x="200.0488" y="527.4725" font-size="16.8791" fill="#555">Apply fix, confirm it works</ns0:text>
  <ns0:line x1="600.1465" y1="541.5385" x2="600.1465" y2="562.6374" stroke="#28a745" stroke-width="2.8132" marker-end="url(#aTMg)" />
  <ns0:rect x="160.0391" y="562.6374" width="880.2149" height="77.3626" rx="7.033" fill="#fff3cd" stroke="#ffc107" stroke-width="2.8132" />
  <ns0:text x="200.0488" y="597.8022" font-size="19.6923" font-weight="bold" fill="#856404">6. Document</ns0:text>
  <ns0:text x="200.0488" y="625.9341" font-size="16.8791" fill="#555">Record the problem and solution</ns0:text>
  <ns0:defs>
    <ns0:marker id="aTM" markerWidth="21.3333" markerHeight="10.5" refX="10.6667" refY="10.5" orient="auto">
      <ns0:polygon points="0,7.5 14.9333,15" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="aTMg" markerWidth="21.3333" markerHeight="10.5" refX="10.6667" refY="10.5" orient="auto">
      <ns0:polygon points="0,7.5 14.9333,15" fill="#28a745" />
    </ns0:marker>
    <ns0:marker id="aTMy" markerWidth="21.3333" markerHeight="10.5" refX="10.6667" refY="10.5" orient="auto">
      <ns0:polygon points="0,7.5 14.9333,15" fill="#ffc107" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
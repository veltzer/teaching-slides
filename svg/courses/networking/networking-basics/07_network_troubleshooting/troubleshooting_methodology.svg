<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="600.1465" y="42.1978" text-anchor="middle" font-size="25.3187" font-weight="bold" fill="var(--text-dark)">Troubleshooting Methodology</text>
  <rect x="160.0391" y="70.3297" width="880.2149" height="77.3626" rx="7.033" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8132" />
  <text x="200.0488" y="105.4945" font-size="19.6923" font-weight="bold" fill="var(--primary-bright)">1. Identify the problem</text>
  <text x="200.0488" y="133.6264" font-size="16.8791" fill="var(--text-muted)">"What exactly isn't working?"</text>
  <line x1="600.1465" y1="147.6923" x2="600.1465" y2="168.7912" stroke="var(--primary-bright)" stroke-width="2.8132" marker-end="url(#arrow-primary)" />
  <rect x="160.0391" y="168.7912" width="880.2149" height="77.3626" rx="7.033" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8132" />
  <text x="200.0488" y="203.956" font-size="19.6923" font-weight="bold" fill="var(--ok-bright)">2. Gather information</text>
  <text x="200.0488" y="232.0879" font-size="16.8791" fill="var(--text-muted)">Logs, error messages, recent changes</text>
  <line x1="600.1465" y1="246.1538" x2="600.1465" y2="267.2527" stroke="var(--ok-bright)" stroke-width="2.8132" marker-end="url(#arrow-ok)" />
  <rect x="160.0391" y="267.2527" width="880.2149" height="77.3626" rx="7.033" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8132" />
  <text x="200.0488" y="302.4176" font-size="19.6923" font-weight="bold" fill="var(--danger-deeper)">3. Test layer by layer (bottom-up)</text>
  <text x="200.0488" y="330.5495" font-size="16.8791" fill="var(--text-muted)">Physical -&gt; Link -&gt; Network -&gt; Transport -&gt; Application</text>
  <line x1="600.1465" y1="344.6154" x2="600.1465" y2="365.7143" stroke="var(--warn-yellow)" stroke-width="2.8132" marker-end="url(#arrow-warn)" />
  <rect x="160.0391" y="365.7143" width="880.2149" height="77.3626" rx="7.033" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.8132" />
  <text x="200.0488" y="400.8791" font-size="19.6923" font-weight="bold" fill="var(--primary-bright)">4. Isolate the cause</text>
  <text x="200.0488" y="429.011" font-size="16.8791" fill="var(--text-muted)">Narrow down: local? network? remote?</text>
  <line x1="600.1465" y1="443.0769" x2="600.1465" y2="464.1758" stroke="var(--primary-bright)" stroke-width="2.8132" marker-end="url(#arrow-primary)" />
  <rect x="160.0391" y="464.1758" width="880.2149" height="77.3626" rx="7.033" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.8132" />
  <text x="200.0488" y="499.3407" font-size="19.6923" font-weight="bold" fill="var(--ok-bright)">5. Fix and verify</text>
  <text x="200.0488" y="527.4725" font-size="16.8791" fill="var(--text-muted)">Apply fix, confirm it works</text>
  <line x1="600.1465" y1="541.5385" x2="600.1465" y2="562.6374" stroke="var(--ok-bright)" stroke-width="2.8132" marker-end="url(#arrow-ok)" />
  <rect x="160.0391" y="562.6374" width="880.2149" height="77.3626" rx="7.033" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.8132" />
  <text x="200.0488" y="597.8022" font-size="19.6923" font-weight="bold" fill="var(--danger-deeper)">6. Document</text>
  <text x="200.0488" y="625.9341" font-size="16.8791" fill="var(--text-muted)">Record the problem and solution</text>
  <defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="29.1188" font-weight="bold" fill="var(--text)">Troubleshooting Methodology</text>
  <rect x="40" y="67.2941" width="1200" height="75.0588" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="94.5454" y="101.4118" font-size="22.6479" font-weight="bold" fill="var(--primary-accent)">1. Identify the problem</text>
  <text x="94.5454" y="128.7059" font-size="19.4125" fill="var(--text-muted)">"What exactly isn't working?"</text>
  <line x1="639.9999" y1="142.3529" x2="639.9999" y2="162.8235" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="40" y="162.8235" width="1200" height="75.0588" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="94.5454" y="196.9411" font-size="22.6479" font-weight="bold" fill="var(--ok-accent)">2. Gather information</text>
  <text x="94.5454" y="224.2353" font-size="19.4125" fill="var(--text-muted)">Logs, error messages, recent changes</text>
  <line x1="639.9999" y1="237.8823" x2="639.9999" y2="258.3529" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="40" y="258.3529" width="1200" height="75.0588" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="94.5454" y="292.4706" font-size="22.6479" font-weight="bold" fill="var(--danger-accent)">3. Test layer by layer (bottom-up)</text>
  <text x="94.5454" y="319.7648" font-size="19.4125" fill="var(--text-muted)">Physical -&gt; Link -&gt; Network -&gt; Transport -&gt; Application</text>
  <line x1="639.9999" y1="333.4118" x2="639.9999" y2="353.8824" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)" />
  <rect x="40" y="353.8824" width="1200" height="75.0588" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="94.5454" y="388" font-size="22.6479" font-weight="bold" fill="var(--primary-accent)">4. Isolate the cause</text>
  <text x="94.5454" y="415.2941" font-size="19.4125" fill="var(--text-muted)">Narrow down: local? network? remote?</text>
  <line x1="639.9999" y1="428.9412" x2="639.9999" y2="449.4117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="40" y="449.4117" width="1200" height="75.0588" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="94.5454" y="483.5295" font-size="22.6479" font-weight="bold" fill="var(--ok-accent)">5. Fix and verify</text>
  <text x="94.5454" y="510.8235" font-size="19.4125" fill="var(--text-muted)">Apply fix, confirm it works</text>
  <line x1="639.9999" y1="524.4706" x2="639.9999" y2="544.9412" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="40" y="544.9412" width="1200" height="75.0588" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="94.5454" y="579.0588" font-size="22.6479" font-weight="bold" fill="var(--danger-accent)">6. Document</text>
  <text x="94.5454" y="606.353" font-size="19.4125" fill="var(--text-muted)">Record the problem and solution</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
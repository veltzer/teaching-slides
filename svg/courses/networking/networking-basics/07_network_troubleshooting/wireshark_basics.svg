  <ns0:rect x="33.5133" y="46.1856" width="1105.9401" height="39.5876" rx="6.5979" fill="#4a90e2" stroke="#4a90e2" stroke-width="2.6392" />
  <ns0:rect x="33.5133" y="65.9794" width="1105.9401" height="19.7938" fill="#4a90e2" />
  <ns0:text x="586.4834" y="72.5773" text-anchor="middle" font-size="17.1546" font-weight="bold" fill="#fff">Wireshark</ns0:text>
  <ns0:rect x="50.27" y="92.3711" width="1072.4268" height="39.5876" rx="3.9588" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.3196" />
  <ns0:text x="67.0267" y="118.7629" font-size="14.5155" fill="#555">Filter: tcp.port == 80 &amp;&amp; ip.addr == 10.0.0.5</ns0:text>
  <ns0:rect x="50.27" y="138.5567" width="1072.4268" height="32.9897" rx="0" fill="#e8f4f8" stroke="#ddd" stroke-width="1.3196" />
  <ns0:text x="67.0267" y="160.9897" font-size="13.1959" font-weight="bold" fill="#333">No.  Time     Source          Dest            Protocol  Info</ns0:text>

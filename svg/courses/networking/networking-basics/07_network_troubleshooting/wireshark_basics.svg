  <ns0:text x="67.0267" y="427.5464" font-size="13.1959" fill="#333">HTTP: GET / HTTP/1.1  Host: example.com</ns0:text>
  <ns0:text x="67.0267" y="459.2165" font-size="13.1959" fill="#555">Three panes: Packet List | Protocol Details | Hex Dump</ns0:text>

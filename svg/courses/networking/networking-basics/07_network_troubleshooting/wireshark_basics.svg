<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="586.4834" y="32.9897" text-anchor="middle" font-size="23.7526" font-weight="bold" fill="var(--text)">Wireshark Basics</text>
  <rect x="33.5133" y="46.1856" width="1105.9401" height="593.8144" rx="6" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="2.6392" />
  <rect x="33.5133" y="46.1856" width="1105.9401" height="39.5876" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="33.5133" y="65.9794" width="1105.9401" height="19.7938" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="586.4834" y="72.5773" text-anchor="middle" font-size="17.1546" font-weight="bold" fill="var(--text)">Wireshark</text>
  <rect x="50.27" y="92.3711" width="1072.4268" height="39.5876" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="67.0267" y="118.7629" font-size="14.5155" fill="var(--text-muted)">Filter: tcp.port == 80 &amp;&amp; ip.addr == 10.0.0.5</text>
  <rect x="50.27" y="138.5567" width="1072.4268" height="32.9897" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="67.0267" y="160.9897" font-size="13.1959" font-weight="bold" fill="var(--text)">No.  Time     Source          Dest            Protocol  Info</text>
  <rect x="50.27" y="171.5464" width="1072.4268" height="26.3918" rx="6" fill="var(--text-muted)" stroke="var(--border)" stroke-width="0.6598" />
  <text x="67.0267" y="190.0206" font-size="13.1959" fill="var(--text)">1    0.000    10.0.0.5        93.184.216.34   TCP       SYN</text>
  <rect x="50.27" y="197.9381" width="1072.4268" height="26.3918" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="67.0267" y="216.4124" font-size="13.1959" fill="var(--text)">2    0.022    93.184.216.34   10.0.0.5        TCP       SYN,ACK</text>
  <rect x="50.27" y="224.3299" width="1072.4268" height="26.3918" rx="6" fill="var(--text-muted)" stroke="var(--border)" stroke-width="0.6598" />
  <text x="67.0267" y="242.8041" font-size="13.1959" fill="var(--text)">3    0.022    10.0.0.5        93.184.216.34   TCP       ACK</text>
  <rect x="50.27" y="250.7216" width="1072.4268" height="26.3918" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="67.0267" y="269.1959" font-size="13.1959" fill="var(--text)">4    0.023    10.0.0.5        93.184.216.34   HTTP      GET /</text>
  <rect x="50.27" y="277.1134" width="1072.4268" height="26.3918" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="67.0267" y="295.5876" font-size="13.1959" fill="var(--text)">5    0.045    93.184.216.34   10.0.0.5        HTTP      200 OK</text>
  <rect x="50.27" y="316.701" width="1072.4268" height="158.3505" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="67.0267" y="340.4536" font-size="14.5155" font-weight="bold" fill="var(--danger-accent)">Frame 4: 214 bytes on wire</text>
  <text x="67.0267" y="364.2062" font-size="13.1959" fill="var(--text)">Ethernet II: src=52:54:00:12:34:56, dst=52:54:00:ab:cd:ef</text>
  <text x="67.0267" y="385.3196" font-size="13.1959" fill="var(--text)">Internet Protocol: src=10.0.0.5, dst=93.184.216.34</text>
  <text x="67.0267" y="406.433" font-size="13.1959" fill="var(--text)">TCP: src port=54321, dst port=80, seq=1001, ack=2001</text>
  <text x="67.0267" y="427.5464" font-size="13.1959" fill="var(--text)">HTTP: GET / HTTP/1.1  Host: example.com</text>
  <text x="67.0267" y="459.2165" font-size="13.1959" fill="var(--text-muted)">Three panes: Packet List | Protocol Details | Hex Dump</text>
  <rect x="50.27" y="481.6495" width="1072.4268" height="65.9794" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="67.0267" y="505.4021" font-size="13.1959" font-family="monospace" fill="var(--text-muted)">0000  52 54 00 ab cd ef 52 54  00 12 34 56 08 00 45 00</text>
  <text x="67.0267" y="527.8351" font-size="13.1959" font-family="monospace" fill="var(--text-muted)">0010  00 c8 12 34 40 00 40 06  ...</text>
  <rect x="50.27" y="560.8247" width="335.1334" height="32.9897" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="217.8367" y="583.2577" text-anchor="middle" font-size="13.1959" fill="var(--primary-accent)" font-weight="bold">Packet List Pane</text>
  <rect x="418.9167" y="560.8247" width="335.1334" height="32.9897" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="586.4834" y="583.2577" text-anchor="middle" font-size="13.1959" fill="var(--danger-accent)" font-weight="bold">Protocol Details Pane</text>
  <rect x="787.5634" y="560.8247" width="335.1334" height="32.9897" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="955.1301" y="583.2577" text-anchor="middle" font-size="13.1959" fill="var(--text-muted)" font-weight="bold">Hex Dump Pane</text>
</svg>
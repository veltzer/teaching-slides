<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="24.1853" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Wireshark Basics</text>
  <rect x="40" y="52.6087" width="1200" height="567.3913" rx="6" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="2.6392" />
  <rect x="40" y="52.6087" width="1200" height="37.8261" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="71.5217" width="1200" height="18.913" fill="url(#grad-primary)" rx="6" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="77.8261" text-anchor="middle" font-size="17.4671" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Wireshark</text>
  <rect x="58.1819" y="96.7391" width="1163.6364" height="37.8261" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="121.9565" font-size="14.7799" fill="var(--text-muted)" font-family="Arial, sans-serif">Filter: tcp.port == 80 &amp;&amp; ip.addr == 10.0.0.5</text>
  <rect x="58.1819" y="140.8696" width="1163.6364" height="31.5217" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="162.3043" font-size="13.4363" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">No.  Time     Source          Dest            Protocol  Info</text>
  <rect x="58.1819" y="172.3913" width="1163.6364" height="25.2174" rx="6" fill="var(--text-muted)" stroke="var(--border)" stroke-width="0.6598" />
  <text x="76.3637" y="190.0435" font-size="13.4363" fill="var(--text)" font-family="Arial, sans-serif">1    0.000    10.0.0.5        93.184.216.34   TCP       SYN</text>
  <rect x="58.1819" y="197.6086" width="1163.6364" height="25.2174" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="76.3637" y="215.2609" font-size="13.4363" fill="var(--text)" font-family="Arial, sans-serif">2    0.022    93.184.216.34   10.0.0.5        TCP       SYN,ACK</text>
  <rect x="58.1819" y="222.8261" width="1163.6364" height="25.2174" rx="6" fill="var(--text-muted)" stroke="var(--border)" stroke-width="0.6598" />
  <text x="76.3637" y="240.4782" font-size="13.4363" fill="var(--text)" font-family="Arial, sans-serif">3    0.022    10.0.0.5        93.184.216.34   TCP       ACK</text>
  <rect x="58.1819" y="248.0434" width="1163.6364" height="25.2174" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="265.6957" font-size="13.4363" fill="var(--text)" font-family="Arial, sans-serif">4    0.023    10.0.0.5        93.184.216.34   HTTP      GET /</text>
  <rect x="58.1819" y="273.2609" width="1163.6364" height="25.2174" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="290.913" font-size="13.4363" fill="var(--text)" font-family="Arial, sans-serif">5    0.045    93.184.216.34   10.0.0.5        HTTP      200 OK</text>
  <rect x="58.1819" y="311.0869" width="1163.6364" height="151.3043" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="333.7826" font-size="14.7799" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Frame 4: 214 bytes on wire</text>
  <text x="76.3637" y="356.4783" font-size="13.4363" fill="var(--text)" font-family="Arial, sans-serif">Ethernet II: src=52:54:00:12:34:56, dst=52:54:00:ab:cd:ef</text>
  <text x="76.3637" y="376.6522" font-size="13.4363" fill="var(--text)" font-family="Arial, sans-serif">Internet Protocol: src=10.0.0.5, dst=93.184.216.34</text>
  <text x="76.3637" y="396.8261" font-size="13.4363" fill="var(--text)" font-family="Arial, sans-serif">TCP: src port=54321, dst port=80, seq=1001, ack=2001</text>
  <text x="76.3637" y="417" font-size="13.4363" fill="var(--text)" font-family="Arial, sans-serif">HTTP: GET / HTTP/1.1  Host: example.com</text>
  <text x="76.3637" y="447.2609" font-size="13.4363" fill="var(--text-muted)" font-family="Arial, sans-serif">Three panes: Packet List | Protocol Details | Hex Dump</text>
  <rect x="58.1819" y="468.6957" width="1163.6364" height="63.0435" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="76.3637" y="491.3913" font-size="13.4363" fill="var(--text-muted)" font-family="Courier New, monospace">0000  52 54 00 ab cd ef 52 54  00 12 34 56 08 00 45 00</text>
  <text x="76.3637" y="512.8261" font-size="13.4363" fill="var(--text-muted)" font-family="Courier New, monospace">0010  00 c8 12 34 40 00 40 06  ...</text>
  <rect x="58.1819" y="544.3478" width="363.6364" height="31.5217" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="240.0001" y="565.7826" text-anchor="middle" font-size="13.4363" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Packet List Pane</text>
  <rect x="458.1819" y="544.3478" width="363.6364" height="31.5217" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="565.7826" text-anchor="middle" font-size="13.4363" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Protocol Details Pane</text>
  <rect x="858.1819" y="544.3478" width="363.6364" height="31.5217" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1040.0001" y="565.7826" text-anchor="middle" font-size="13.4363" fill="var(--text-muted)" font-weight="bold" font-family="Arial, sans-serif">Hex Dump Pane</text>
</svg>
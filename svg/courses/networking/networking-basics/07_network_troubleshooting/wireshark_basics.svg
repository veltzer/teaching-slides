<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Wireshark Basics</text>
  <!-- Main window -->
  <rect x="20" y="35" width="660" height="450" rx="5" fill="#fff" stroke="#4a90e2" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="20" y="35" width="660" height="30" rx="5" fill="#4a90e2" stroke="#4a90e2" stroke-width="2"/>
  <rect x="20" y="50" width="660" height="15" fill="#4a90e2"/>
  <text x="350" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Wireshark</text>
  <!-- Filter bar -->
  <rect x="30" y="70" width="640" height="30" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="40" y="90" font-size="11" fill="#555">Filter: tcp.port == 80 &amp;&amp; ip.addr == 10.0.0.5</text>
  <!-- Packet list -->
  <rect x="30" y="105" width="640" height="25" rx="0" fill="#e8f4f8" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="122" font-size="10" font-weight="bold" fill="#333">No.  Time     Source          Dest            Protocol  Info</text>
  <rect x="30" y="130" width="640" height="20" rx="0" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="144" font-size="10" fill="#333">1    0.000    10.0.0.5        93.184.216.34   TCP       SYN</text>
  <rect x="30" y="150" width="640" height="20" rx="0" fill="#f8f9fa" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="164" font-size="10" fill="#333">2    0.022    93.184.216.34   10.0.0.5        TCP       SYN,ACK</text>
  <rect x="30" y="170" width="640" height="20" rx="0" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="184" font-size="10" fill="#333">3    0.022    10.0.0.5        93.184.216.34   TCP       ACK</text>
  <rect x="30" y="190" width="640" height="20" rx="0" fill="#d4edda" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="204" font-size="10" fill="#333">4    0.023    10.0.0.5        93.184.216.34   HTTP      GET /</text>
  <rect x="30" y="210" width="640" height="20" rx="0" fill="#d4edda" stroke="#ddd" stroke-width="0.5"/>
  <text x="40" y="224" font-size="10" fill="#333">5    0.045    93.184.216.34   10.0.0.5        HTTP      200 OK</text>
  <!-- Protocol details -->
  <rect x="30" y="240" width="640" height="120" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="40" y="258" font-size="11" font-weight="bold" fill="#856404">Frame 4: 214 bytes on wire</text>
  <text x="40" y="276" font-size="10" fill="#333">Ethernet II: src=52:54:00:12:34:56, dst=52:54:00:ab:cd:ef</text>
  <text x="40" y="292" font-size="10" fill="#333">Internet Protocol: src=10.0.0.5, dst=93.184.216.34</text>
  <text x="40" y="308" font-size="10" fill="#333">TCP: src port=54321, dst port=80, seq=1001, ack=2001</text>
  <text x="40" y="324" font-size="10" fill="#333">HTTP: GET / HTTP/1.1  Host: example.com</text>
  <text x="40" y="348" font-size="10" fill="#555">Three panes: Packet List | Protocol Details | Hex Dump</text>
  <!-- Hex dump -->
  <rect x="30" y="365" width="640" height="50" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="383" font-size="10" font-family="monospace" fill="#555">0000  52 54 00 ab cd ef 52 54  00 12 34 56 08 00 45 00</text>
  <text x="40" y="400" font-size="10" font-family="monospace" fill="#555">0010  00 c8 12 34 40 00 40 06  ...</text>
  <!-- Labels -->
  <rect x="30" y="425" width="200" height="25" rx="3" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="130" y="442" text-anchor="middle" font-size="10" fill="#4a90e2" font-weight="bold">Packet List Pane</text>
  <rect x="250" y="425" width="200" height="25" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="350" y="442" text-anchor="middle" font-size="10" fill="#856404" font-weight="bold">Protocol Details Pane</text>
  <rect x="470" y="425" width="200" height="25" rx="3" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="570" y="442" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">Hex Dump Pane</text>
</svg>
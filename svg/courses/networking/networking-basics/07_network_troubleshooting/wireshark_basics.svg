  <ns0:text x="67.0267" y="190.0206" font-size="13.1959" fill="#333">1    0.000    10.0.0.5        93.184.216.34   TCP       SYN</ns0:text>
  <ns0:rect x="50.27" y="197.9381" width="1072.4268" height="26.3918" rx="0" fill="#f9f9f9" stroke="#ddd" stroke-width="0.6598" />
  <ns0:text x="67.0267" y="216.4124" font-size="13.1959" fill="#333">2    0.022    93.184.216.34   10.0.0.5        TCP       SYN,ACK</ns0:text>
  <ns0:rect x="50.27" y="224.3299" width="1072.4268" height="26.3918" rx="0" fill="#fff" stroke="#ddd" stroke-width="0.6598" />
  <ns0:text x="67.0267" y="242.8041" font-size="13.1959" fill="#333">3    0.022    10.0.0.5        93.184.216.34   TCP       ACK</ns0:text>
  <ns0:rect x="50.27" y="250.7216" width="1072.4268" height="26.3918" rx="0" fill="#d4edda" stroke="#ddd" stroke-width="0.6598" />
  <ns0:text x="67.0267" y="269.1959" font-size="13.1959" fill="#333">4    0.023    10.0.0.5        93.184.216.34   HTTP      GET /</ns0:text>
  <ns0:rect x="50.27" y="277.1134" width="1072.4268" height="26.3918" rx="0" fill="#d4edda" stroke="#ddd" stroke-width="0.6598" />
  <ns0:text x="67.0267" y="295.5876" font-size="13.1959" fill="#333">5    0.045    93.184.216.34   10.0.0.5        HTTP      200 OK</ns0:text>
  <ns0:rect x="50.27" y="316.701" width="1072.4268" height="158.3505" rx="3.9588" fill="#fff3cd" stroke="#ffc107" stroke-width="1.3196" />
  <ns0:text x="67.0267" y="340.4536" font-size="14.5155" font-weight="bold" fill="#bf360c">Frame 4: 214 bytes on wire</ns0:text>
  <ns0:text x="67.0267" y="364.2062" font-size="13.1959" fill="#333">Ethernet II: src=52:54:00:12:34:56, dst=52:54:00:ab:cd:ef</ns0:text>

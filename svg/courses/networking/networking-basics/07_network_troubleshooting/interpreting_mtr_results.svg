<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Interpreting MTR Results</text>
  <!-- Case 1 -->
  <rect x="20" y="45" width="660" height="95" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="40" y="70" font-size="14" font-weight="bold" fill="#28a745">Case 1: Loss at one hop but not later</text>
  <text x="40" y="90" font-size="12" fill="#333">Hop 3: 30% loss | Hop 4: 0% loss | Hop 5: 0% loss</text>
  <text x="40" y="110" font-size="12" fill="#555">Router at hop 3 is rate-limiting ICMP responses - NOT an actual problem</text>
  <text x="40" y="130" font-size="11" fill="#28a745" font-weight="bold">Verdict: False alarm (ICMP deprioritized)</text>
  <!-- Case 2 -->
  <rect x="20" y="150" width="660" height="95" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="40" y="175" font-size="14" font-weight="bold" fill="#dc3545">Case 2: Loss starts at one hop and continues</text>
  <text x="40" y="195" font-size="12" fill="#333">Hop 3: 0% loss | Hop 4: 20% loss | Hop 5: 20% loss | Hop 6: 20% loss</text>
  <text x="40" y="215" font-size="12" fill="#555">Real packet loss starting at hop 4</text>
  <text x="40" y="235" font-size="11" fill="#dc3545" font-weight="bold">Verdict: Problem at or between hop 3 and hop 4</text>
  <!-- Case 3 -->
  <rect x="20" y="255" width="660" height="95" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="40" y="280" font-size="14" font-weight="bold" fill="#856404">Case 3: Latency spike at one hop</text>
  <text x="40" y="300" font-size="12" fill="#333">Hop 3: avg 5ms | Hop 4: avg 150ms (large jump) | Hop 5: avg 152ms</text>
  <text x="40" y="320" font-size="12" fill="#555">Link between hop 3 and 4 has high latency</text>
  <text x="40" y="340" font-size="11" fill="#856404" font-weight="bold">Verdict: Congestion, distance, or poor peering</text>
  <!-- Case 4 -->
  <rect x="20" y="360" width="660" height="95" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="40" y="385" font-size="14" font-weight="bold" fill="#4a90e2">Case 4: High jitter (StDev)</text>
  <text x="40" y="405" font-size="12" fill="#333">Hop 5: Avg=10ms, StDev=25ms, Best=5ms, Worst=200ms</text>
  <text x="40" y="425" font-size="12" fill="#555">Inconsistent performance</text>
  <text x="40" y="445" font-size="11" fill="#4a90e2" font-weight="bold">Verdict: Possible congestion, bufferbloat, or wireless issues</text>
  <!-- Key takeaway -->
  <rect x="100" y="470" width="500" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="350" y="492" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Key: Look for patterns that persist across subsequent hops</text>
</svg>
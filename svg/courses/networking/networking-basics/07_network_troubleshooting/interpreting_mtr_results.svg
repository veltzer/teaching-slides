<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="585.7866" y="38.0198" text-anchor="middle" font-size="22.8119" font-weight="bold" fill="var(--text)">Interpreting MTR Results</text>
  <rect x="33.4735" y="57.0297" width="1104.6262" height="120.3961" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="66.9471" y="88.7129" font-size="17.7426" font-weight="bold" fill="var(--ok-accent)">Case 1: Loss at one hop but not later</text>
  <text x="66.9471" y="114.0594" font-size="15.2079" fill="var(--text)">Hop 3: 30% loss | Hop 4: 0% loss | Hop 5: 0% loss</text>
  <text x="66.9471" y="139.406" font-size="15.2079" fill="var(--text-muted)">Router at hop 3 is rate-limiting ICMP responses - NOT an actual problem</text>
  <text x="66.9471" y="164.7525" font-size="13.9406" fill="var(--ok-accent)" font-weight="bold">Verdict: False alarm (ICMP deprioritized)</text>
  <rect x="33.4735" y="190.099" width="1104.6262" height="120.3961" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="66.9471" y="221.7822" font-size="17.7426" font-weight="bold" fill="var(--danger-accent)">Case 2: Loss starts at one hop and continues</text>
  <text x="66.9471" y="247.1287" font-size="15.2079" fill="var(--text)">Hop 3: 0% loss | Hop 4: 20% loss | Hop 5: 20% loss | Hop 6: 20% loss</text>
  <text x="66.9471" y="272.4753" font-size="15.2079" fill="var(--text-muted)">Real packet loss starting at hop 4</text>
  <text x="66.9471" y="297.8218" font-size="13.9406" fill="var(--danger-accent)" font-weight="bold">Verdict: Problem at or between hop 3 and hop 4</text>
  <rect x="33.4735" y="323.1683" width="1104.6262" height="120.3961" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="66.9471" y="354.8515" font-size="17.7426" font-weight="bold" fill="var(--danger-accent)">Case 3: Latency spike at one hop</text>
  <text x="66.9471" y="380.198" font-size="15.2079" fill="var(--text)">Hop 3: avg 5ms | Hop 4: avg 150ms (large jump) | Hop 5: avg 152ms</text>
  <text x="66.9471" y="405.5446" font-size="15.2079" fill="var(--text-muted)">Link between hop 3 and 4 has high latency</text>
  <text x="66.9471" y="430.8911" font-size="13.9406" fill="var(--danger-accent)" font-weight="bold">Verdict: Congestion, distance, or poor peering</text>
  <rect x="33.4735" y="456.2376" width="1104.6262" height="120.3961" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="66.9471" y="487.9208" font-size="17.7426" font-weight="bold" fill="var(--primary-accent)">Case 4: High jitter (StDev)</text>
  <text x="66.9471" y="513.2673" font-size="15.2079" fill="var(--text)">Hop 5: Avg=10ms, StDev=25ms, Best=5ms, Worst=200ms</text>
  <text x="66.9471" y="538.6139" font-size="15.2079" fill="var(--text-muted)">Inconsistent performance</text>
  <text x="66.9471" y="563.9604" font-size="13.9406" fill="var(--primary-accent)" font-weight="bold">Verdict: Possible congestion, bufferbloat, or wireless issues</text>
  <rect x="167.3676" y="595.6436" width="836.838" height="44.3564" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="585.7866" y="623.5248" text-anchor="middle" font-size="15.2079" fill="var(--text)" font-weight="bold">Key: Look for patterns that persist across subsequent hops</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="121.272727272727" rx="8.215285088839" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="76.909090909091" font-size="18.484391449889" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Case 1: Loss at one hop, then clean</text>
  <text x="70" y="108.545454545454" font-size="15.403659541574" fill="var(--ok-text)" font-family="Courier New, monospace">Hop3: 30%  Hop4: 0%  Hop5: 0%</text>
  <text x="70" y="145.454545454545" font-size="15.403659541574" fill="var(--ok-text)" font-family="Arial, sans-serif">ICMP rate-limited - false alarm</text>

  <rect x="40" y="174.981818181818" width="1200" height="121.272727272727" rx="8.215285088839" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="211.890909090909" font-size="18.484391449889" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Case 2: Loss persists past one hop</text>
  <text x="70" y="243.527272727273" font-size="15.403659541574" fill="var(--danger-text)" font-family="Courier New, monospace">Hop3: 0%  Hop4: 20%  Hop5: 20%</text>
  <text x="70" y="280.436363636364" font-size="15.403659541574" fill="var(--danger-text)" font-family="Arial, sans-serif">Real loss between hops 3-4</text>

  <rect x="40" y="309.963636363637" width="1200" height="121.272727272727" rx="8.215285088839" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="346.872727272728" font-size="18.484391449889" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Case 3: Latency spike</text>
  <text x="70" y="378.509090909091" font-size="15.403659541574" fill="var(--warn-text)" font-family="Courier New, monospace">Hop3: 5ms  Hop4: 150ms  Hop5: 152ms</text>
  <text x="70" y="415.418181818182" font-size="15.403659541574" fill="var(--warn-text)" font-family="Arial, sans-serif">Congestion or distant peering</text>

  <rect x="40" y="444.945454545454" width="1200" height="121.272727272727" rx="8.215285088839" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="481.854545454545" font-size="18.484391449889" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Case 4: High jitter (StDev)</text>
  <text x="70" y="513.490909090909" font-size="15.403659541574" fill="var(--primary-text)" font-family="Courier New, monospace">Avg=10  StDev=25  Worst=200</text>
  <text x="70" y="550.4" font-size="15.403659541574" fill="var(--primary-text)" font-family="Arial, sans-serif">Bufferbloat or wireless issues</text>

  <rect x="190" y="577.818181818181" width="900" height="42.181818181819" rx="8.215285088839" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="606.290909090909" text-anchor="middle" font-size="15.403659541574" fill="var(--primary-text)" font-weight="bold" font-family="Arial, sans-serif">Look for patterns persisting across hops</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="23.3382" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Interpreting MTR Results</text>
  <rect x="40" y="58.3158" width="1200" height="116.0001" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="88.8421" font-size="18.1519" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Case 1: Loss at one hop but not later</text>
  <text x="76.3637" y="113.2632" font-size="15.5588" fill="var(--text)" font-family="Arial, sans-serif">Hop 3: 30% loss | Hop 4: 0% loss | Hop 5: 0% loss</text>
  <text x="76.3637" y="137.6843" font-size="15.5588" fill="var(--text-muted)" font-family="Arial, sans-serif">Router at hop 3 is rate-limiting ICMP responses - NOT an actual problem</text>
  <text x="76.3637" y="162.1053" font-size="14.2622" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Verdict: False alarm (ICMP deprioritized)</text>
  <rect x="40" y="186.5263" width="1200" height="116.0001" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="217.0527" font-size="18.1519" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Case 2: Loss starts at one hop and continues</text>
  <text x="76.3637" y="241.4737" font-size="15.5588" fill="var(--text)" font-family="Arial, sans-serif">Hop 3: 0% loss | Hop 4: 20% loss | Hop 5: 20% loss | Hop 6: 20% loss</text>
  <text x="76.3637" y="265.8948" font-size="15.5588" fill="var(--text-muted)" font-family="Arial, sans-serif">Real packet loss starting at hop 4</text>
  <text x="76.3637" y="290.3158" font-size="14.2622" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Verdict: Problem at or between hop 3 and hop 4</text>
  <rect x="40" y="314.7368" width="1200" height="116.0001" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="345.2632" font-size="18.1519" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Case 3: Latency spike at one hop</text>
  <text x="76.3637" y="369.6842" font-size="15.5588" fill="var(--text)" font-family="Arial, sans-serif">Hop 3: avg 5ms | Hop 4: avg 150ms (large jump) | Hop 5: avg 152ms</text>
  <text x="76.3637" y="394.1053" font-size="15.5588" fill="var(--text-muted)" font-family="Arial, sans-serif">Link between hop 3 and 4 has high latency</text>
  <text x="76.3637" y="418.5263" font-size="14.2622" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">Verdict: Congestion, distance, or poor peering</text>
  <rect x="40" y="442.9473" width="1200" height="116.0001" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="473.4737" font-size="18.1519" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Case 4: High jitter (StDev)</text>
  <text x="76.3637" y="497.8947" font-size="15.5588" fill="var(--text)" font-family="Arial, sans-serif">Hop 5: Avg=10ms, StDev=25ms, Best=5ms, Worst=200ms</text>
  <text x="76.3637" y="522.3158" font-size="15.5588" fill="var(--text-muted)" font-family="Arial, sans-serif">Inconsistent performance</text>
  <text x="76.3637" y="546.7368" font-size="14.2622" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Verdict: Possible congestion, bufferbloat, or wireless issues</text>
  <rect x="185.4546" y="577.2632" width="909.0909" height="42.7368" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="604.1264" text-anchor="middle" font-size="15.5588" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Key: Look for patterns that persist across subsequent hops</text>
</svg>
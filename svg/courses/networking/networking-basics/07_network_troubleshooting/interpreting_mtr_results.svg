<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="23.3382" font-weight="bold" fill="var(--text)">Interpreting MTR Results</text>
  <rect x="40" y="58.3158" width="1200" height="116.0001" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="88.8421" font-size="18.1519" font-weight="bold" fill="var(--ok-accent)">Case 1: Loss at one hop but not later</text>
  <text x="76.3637" y="113.2632" font-size="15.5588" fill="var(--text)">Hop 3: 30% loss | Hop 4: 0% loss | Hop 5: 0% loss</text>
  <text x="76.3637" y="137.6843" font-size="15.5588" fill="var(--text-muted)">Router at hop 3 is rate-limiting ICMP responses - NOT an actual problem</text>
  <text x="76.3637" y="162.1053" font-size="14.2622" fill="var(--ok-accent)" font-weight="bold">Verdict: False alarm (ICMP deprioritized)</text>
  <rect x="40" y="186.5263" width="1200" height="116.0001" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="217.0527" font-size="18.1519" font-weight="bold" fill="var(--danger-accent)">Case 2: Loss starts at one hop and continues</text>
  <text x="76.3637" y="241.4737" font-size="15.5588" fill="var(--text)">Hop 3: 0% loss | Hop 4: 20% loss | Hop 5: 20% loss | Hop 6: 20% loss</text>
  <text x="76.3637" y="265.8948" font-size="15.5588" fill="var(--text-muted)">Real packet loss starting at hop 4</text>
  <text x="76.3637" y="290.3158" font-size="14.2622" fill="var(--danger-accent)" font-weight="bold">Verdict: Problem at or between hop 3 and hop 4</text>
  <rect x="40" y="314.7368" width="1200" height="116.0001" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="345.2632" font-size="18.1519" font-weight="bold" fill="var(--danger-accent)">Case 3: Latency spike at one hop</text>
  <text x="76.3637" y="369.6842" font-size="15.5588" fill="var(--text)">Hop 3: avg 5ms | Hop 4: avg 150ms (large jump) | Hop 5: avg 152ms</text>
  <text x="76.3637" y="394.1053" font-size="15.5588" fill="var(--text-muted)">Link between hop 3 and 4 has high latency</text>
  <text x="76.3637" y="418.5263" font-size="14.2622" fill="var(--danger-accent)" font-weight="bold">Verdict: Congestion, distance, or poor peering</text>
  <rect x="40" y="442.9473" width="1200" height="116.0001" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="473.4737" font-size="18.1519" font-weight="bold" fill="var(--primary-accent)">Case 4: High jitter (StDev)</text>
  <text x="76.3637" y="497.8947" font-size="15.5588" fill="var(--text)">Hop 5: Avg=10ms, StDev=25ms, Best=5ms, Worst=200ms</text>
  <text x="76.3637" y="522.3158" font-size="15.5588" fill="var(--text-muted)">Inconsistent performance</text>
  <text x="76.3637" y="546.7368" font-size="14.2622" fill="var(--primary-accent)" font-weight="bold">Verdict: Possible congestion, bufferbloat, or wireless issues</text>
  <rect x="185.4546" y="577.2632" width="909.0909" height="42.7368" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="604.1264" text-anchor="middle" font-size="15.5588" fill="var(--text)" font-weight="bold">Key: Look for patterns that persist across subsequent hops</text>
</svg>
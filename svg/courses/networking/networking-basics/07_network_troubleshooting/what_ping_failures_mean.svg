<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.8327" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">What Ping Failures Mean</text>
  <rect x="40" y="60.7143" width="1200" height="96.6667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="95.2381" font-size="20.0921" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">"Destination Host Unreachable"</text>
  <text x="76.3637" y="122.8571" font-size="17.2218" fill="var(--text)" font-family="Arial, sans-serif">Your gateway doesn't know how to reach the target</text>
  <text x="76.3637" y="144.9524" font-size="15.7866" fill="var(--text-muted)" font-family="Arial, sans-serif">Check: ip route, gateway status</text>
  <rect x="40" y="171.1905" width="1200" height="117.381" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="205.7142" font-size="20.0921" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">"Request timed out" / No response</text>
  <text x="76.3637" y="233.3333" font-size="17.2218" fill="var(--text)" font-family="Arial, sans-serif">Packets may be dropped by firewall, host may be down, ICMP may be blocked</text>
  <text x="76.3637" y="258.1905" font-size="17.2218" fill="var(--text-muted)" font-family="Arial, sans-serif">Many servers block ping intentionally</text>
  <text x="76.3637" y="278.9047" font-size="15.7866" fill="var(--text-muted)" font-family="Arial, sans-serif">Check: traceroute to see where packets stop</text>
  <rect x="40" y="302.3809" width="1200" height="96.6667" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="336.9047" font-size="20.0921" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">"Network is unreachable"</text>
  <text x="76.3637" y="364.5238" font-size="17.2218" fill="var(--text)" font-family="Arial, sans-serif">No route to the destination network</text>
  <text x="76.3637" y="386.619" font-size="15.7866" fill="var(--text-muted)" font-family="Arial, sans-serif">Check: ip route, default gateway</text>
  <rect x="40" y="412.8572" width="1200" height="96.6667" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="447.3809" font-size="20.0921" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">High latency (&gt;100ms local, &gt;300ms cross-continent)</text>
  <text x="76.3637" y="475" font-size="17.2218" fill="var(--text)" font-family="Arial, sans-serif">Network congestion or routing issue (suboptimal path)</text>
  <text x="76.3637" y="497.0952" font-size="15.7866" fill="var(--text-muted)" font-family="Arial, sans-serif">Check: traceroute, mtr</text>
  <rect x="40" y="523.3333" width="1200" height="96.6667" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="76.3637" y="557.8571" font-size="20.0921" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Packet loss (&gt;1%)</text>
  <text x="76.3637" y="585.4761" font-size="17.2218" fill="var(--text)" font-family="Arial, sans-serif">Network congestion, flapping link, bad cable, or wireless interference</text>
  <text x="76.3637" y="607.5714" font-size="15.7866" fill="var(--text-muted)" font-family="Arial, sans-serif">Check: mtr for sustained test, ip -s link for errors</text>
</svg>
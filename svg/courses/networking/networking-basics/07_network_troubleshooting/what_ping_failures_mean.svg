<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="1200" height="104.819277108433" rx="8.70640632691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70.508474576271" y="77.269076305222" font-family="Arial, sans-serif" font-size="19.589414235548" font-weight="bold" fill="var(--danger-text)">Destination Host Unreachable</text>
  <text x="70.508474576271" y="109.879518072289" font-family="Arial, sans-serif" font-size="15.236211072093" fill="var(--danger-text)">Gateway has no route to target</text>
  <text x="70.508474576271" y="135.502008032129" font-family="Arial, sans-serif" font-size="14.147910281229" fill="var(--danger-text)">Check: ip route</text>

  <rect x="40" y="158.795180722892" width="1200" height="104.819277108433" rx="8.70640632691" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70.508474576271" y="196.064257028113" font-family="Arial, sans-serif" font-size="19.589414235548" font-weight="bold" fill="var(--warn-text)">Request timed out</text>
  <text x="70.508474576271" y="228.674698795181" font-family="Arial, sans-serif" font-size="15.236211072093" fill="var(--warn-text)">Firewall drops, host down, or ICMP blocked</text>
  <text x="70.508474576271" y="254.297188755021" font-family="Arial, sans-serif" font-size="14.147910281229" fill="var(--warn-text)">Check: traceroute</text>

  <rect x="40" y="277.590361445784" width="1200" height="104.819277108433" rx="8.70640632691" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70.508474576271" y="314.859437751005" font-family="Arial, sans-serif" font-size="19.589414235548" font-weight="bold" fill="var(--danger-text)">Network is unreachable</text>
  <text x="70.508474576271" y="347.469879518072" font-family="Arial, sans-serif" font-size="15.236211072093" fill="var(--danger-text)">No route to destination network</text>
  <text x="70.508474576271" y="373.092369477912" font-family="Arial, sans-serif" font-size="14.147910281229" fill="var(--danger-text)">Check: default gateway</text>

  <rect x="40" y="396.385542168675" width="1200" height="104.819277108433" rx="8.70640632691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70.508474576271" y="433.654618473896" font-family="Arial, sans-serif" font-size="19.589414235548" font-weight="bold" fill="var(--primary-text)">High latency</text>
  <text x="70.508474576271" y="466.265060240964" font-family="Arial, sans-serif" font-size="15.236211072093" fill="var(--primary-text)">Congestion or suboptimal route</text>
  <text x="70.508474576271" y="491.887550200804" font-family="Arial, sans-serif" font-size="14.147910281229" fill="var(--primary-text)">Check: mtr</text>

  <rect x="40" y="515.180722891567" width="1200" height="104.819277108433" rx="8.70640632691" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="70.508474576271" y="552.449799196787" font-family="Arial, sans-serif" font-size="19.589414235548" font-weight="bold" fill="var(--warn-text)">Packet loss</text>
  <text x="70.508474576271" y="585.060240963856" font-family="Arial, sans-serif" font-size="15.236211072093" fill="var(--warn-text)">Bad cable, wireless noise, flapping link</text>
  <text x="70.508474576271" y="610.682730923695" font-family="Arial, sans-serif" font-size="14.147910281229" fill="var(--warn-text)">Check: mtr + ip -s link</text>
</svg>

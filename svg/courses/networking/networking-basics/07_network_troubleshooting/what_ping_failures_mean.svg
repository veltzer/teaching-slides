<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="606.8148" y="42.6667" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">What Ping Failures Mean</text>
  <rect x="34.6751" y="64" width="1144.2793" height="99.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="69.3503" y="99.5556" font-size="19.9111" font-weight="bold" fill="var(--danger-accent)">"Destination Host Unreachable"</text>
  <text x="69.3503" y="128" font-size="17.0667" fill="var(--text)">Your gateway doesn't know how to reach the target</text>
  <text x="69.3503" y="150.7556" font-size="15.6444" fill="var(--text-muted)">Check: ip route, gateway status</text>
  <rect x="34.6751" y="177.7778" width="1144.2793" height="120.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="69.3503" y="213.3333" font-size="19.9111" font-weight="bold" fill="var(--danger-accent)">"Request timed out" / No response</text>
  <text x="69.3503" y="241.7778" font-size="17.0667" fill="var(--text)">Packets may be dropped by firewall, host may be down, ICMP may be blocked</text>
  <text x="69.3503" y="267.3778" font-size="17.0667" fill="var(--text-muted)">Many servers block ping intentionally</text>
  <text x="69.3503" y="288.7111" font-size="15.6444" fill="var(--text-muted)">Check: traceroute to see where packets stop</text>
  <rect x="34.6751" y="312.8889" width="1144.2793" height="99.5556" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="69.3503" y="348.4444" font-size="19.9111" font-weight="bold" fill="var(--danger-accent)">"Network is unreachable"</text>
  <text x="69.3503" y="376.8889" font-size="17.0667" fill="var(--text)">No route to the destination network</text>
  <text x="69.3503" y="399.6444" font-size="15.6444" fill="var(--text-muted)">Check: ip route, default gateway</text>
  <rect x="34.6751" y="426.6667" width="1144.2793" height="99.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="69.3503" y="462.2222" font-size="19.9111" font-weight="bold" fill="var(--primary-accent)">High latency (&gt;100ms local, &gt;300ms cross-continent)</text>
  <text x="69.3503" y="490.6667" font-size="17.0667" fill="var(--text)">Network congestion or routing issue (suboptimal path)</text>
  <text x="69.3503" y="513.4222" font-size="15.6444" fill="var(--text-muted)">Check: traceroute, mtr</text>
  <rect x="34.6751" y="540.4444" width="1144.2793" height="99.5556" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="69.3503" y="576" font-size="19.9111" font-weight="bold" fill="var(--danger-accent)">Packet loss (&gt;1%)</text>
  <text x="69.3503" y="604.4444" font-size="17.0667" fill="var(--text)">Network congestion, flapping link, bad cable, or wireless interference</text>
  <text x="69.3503" y="627.2" font-size="15.6444" fill="var(--text-muted)">Check: mtr for sustained test, ip -s link for errors</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="25.8327" font-weight="bold" fill="var(--text)">What Ping Failures Mean</text>
  <rect x="40" y="60.7143" width="1200" height="96.6667" rx="6.0545" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="76.3637" y="95.2381" font-size="20.0921" font-weight="bold" fill="var(--danger-accent)">"Destination Host Unreachable"</text>
  <text x="76.3637" y="122.8571" font-size="17.2218" fill="var(--text)">Your gateway doesn't know how to reach the target</text>
  <text x="76.3637" y="144.9524" font-size="15.7866" fill="var(--text-muted)">Check: ip route, gateway status</text>
  <rect x="40" y="171.1905" width="1200" height="117.381" rx="6.0545" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="76.3637" y="205.7142" font-size="20.0921" font-weight="bold" fill="var(--danger-accent)">"Request timed out" / No response</text>
  <text x="76.3637" y="233.3333" font-size="17.2218" fill="var(--text)">Packets may be dropped by firewall, host may be down, ICMP may be blocked</text>
  <text x="76.3637" y="258.1905" font-size="17.2218" fill="var(--text-muted)">Many servers block ping intentionally</text>
  <text x="76.3637" y="278.9047" font-size="15.7866" fill="var(--text-muted)">Check: traceroute to see where packets stop</text>
  <rect x="40" y="302.3809" width="1200" height="96.6667" rx="6.0545" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="76.3637" y="336.9047" font-size="20.0921" font-weight="bold" fill="var(--danger-accent)">"Network is unreachable"</text>
  <text x="76.3637" y="364.5238" font-size="17.2218" fill="var(--text)">No route to the destination network</text>
  <text x="76.3637" y="386.619" font-size="15.7866" fill="var(--text-muted)">Check: ip route, default gateway</text>
  <rect x="40" y="412.8572" width="1200" height="96.6667" rx="6.0545" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="76.3637" y="447.3809" font-size="20.0921" font-weight="bold" fill="var(--primary-accent)">High latency (&gt;100ms local, &gt;300ms cross-continent)</text>
  <text x="76.3637" y="475" font-size="17.2218" fill="var(--text)">Network congestion or routing issue (suboptimal path)</text>
  <text x="76.3637" y="497.0952" font-size="15.7866" fill="var(--text-muted)">Check: traceroute, mtr</text>
  <rect x="40" y="523.3333" width="1200" height="96.6667" rx="6.0545" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="76.3637" y="557.8571" font-size="20.0921" font-weight="bold" fill="var(--danger-accent)">Packet loss (&gt;1%)</text>
  <text x="76.3637" y="585.4761" font-size="17.2218" fill="var(--text)">Network congestion, flapping link, bad cable, or wireless interference</text>
  <text x="76.3637" y="607.5714" font-size="15.7866" fill="var(--text-muted)">Check: mtr for sustained test, ip -s link for errors</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:text x="606.8148" y="42.6667" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#333">What Ping Failures Mean</ns0:text>
  <ns0:rect x="34.6751" y="64" width="1144.2793" height="99.5556" rx="7.1111" fill="#f8d7da" stroke="#dc3545" stroke-width="2.8444" />
  <ns0:text x="69.3503" y="99.5556" font-size="19.9111" font-weight="bold" fill="#dc3545">"Destination Host Unreachable"</ns0:text>
  <ns0:text x="69.3503" y="128" font-size="17.0667" fill="#333">Your gateway doesn't know how to reach the target</ns0:text>
  <ns0:text x="69.3503" y="150.7556" font-size="15.6444" fill="#555">Check: ip route, gateway status</ns0:text>
  <ns0:rect x="34.6751" y="177.7778" width="1144.2793" height="120.8889" rx="7.1111" fill="#fff3cd" stroke="#ffc107" stroke-width="2.8444" />
  <ns0:text x="69.3503" y="213.3333" font-size="19.9111" font-weight="bold" fill="#bf360c">"Request timed out" / No response</ns0:text>
  <ns0:text x="69.3503" y="241.7778" font-size="17.0667" fill="#333">Packets may be dropped by firewall, host may be down, ICMP may be blocked</ns0:text>
  <ns0:text x="69.3503" y="267.3778" font-size="17.0667" fill="#555">Many servers block ping intentionally</ns0:text>
  <ns0:text x="69.3503" y="288.7111" font-size="15.6444" fill="#555">Check: traceroute to see where packets stop</ns0:text>
  <ns0:rect x="34.6751" y="312.8889" width="1144.2793" height="99.5556" rx="7.1111" fill="#f8d7da" stroke="#dc3545" stroke-width="2.8444" />
  <ns0:text x="69.3503" y="348.4444" font-size="19.9111" font-weight="bold" fill="#dc3545">"Network is unreachable"</ns0:text>
  <ns0:text x="69.3503" y="376.8889" font-size="17.0667" fill="#333">No route to the destination network</ns0:text>
  <ns0:text x="69.3503" y="399.6444" font-size="15.6444" fill="#555">Check: ip route, default gateway</ns0:text>
  <ns0:rect x="34.6751" y="426.6667" width="1144.2793" height="99.5556" rx="7.1111" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.8444" />
  <ns0:text x="69.3503" y="462.2222" font-size="19.9111" font-weight="bold" fill="#4a90e2">High latency (&gt;100ms local, &gt;300ms cross-continent)</ns0:text>
  <ns0:text x="69.3503" y="490.6667" font-size="17.0667" fill="#333">Network congestion or routing issue (suboptimal path)</ns0:text>
  <ns0:text x="69.3503" y="513.4222" font-size="15.6444" fill="#555">Check: traceroute, mtr</ns0:text>
  <ns0:rect x="34.6751" y="540.4444" width="1144.2793" height="99.5556" rx="7.1111" fill="#fff3cd" stroke="#ffc107" stroke-width="2.8444" />
  <ns0:text x="69.3503" y="576" font-size="19.9111" font-weight="bold" fill="#bf360c">Packet loss (&gt;1%)</ns0:text>
  <ns0:text x="69.3503" y="604.4444" font-size="17.0667" fill="#333">Network congestion, flapping link, bad cable, or wireless interference</ns0:text>
  <ns0:text x="69.3503" y="627.2" font-size="15.6444" fill="#555">Check: mtr for sustained test, ip -s link for errors</ns0:text>
</ns0:svg>
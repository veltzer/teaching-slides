<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="27.4736" font-weight="bold" fill="var(--text)">Certificates &amp; PKI Chain of Trust</text>
  <rect x="412.0702" y="70.5263" width="455.8596" height="106.8421" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="108.6841" text-anchor="middle" font-size="21.3685" font-weight="bold" fill="var(--danger-accent)">Root CA (trusted)</text>
  <text x="640" y="139.2104" text-anchor="middle" font-size="18.3158" fill="var(--text-muted)">Self-signed, embedded in browsers/OS</text>
  <text x="640" y="165.1579" text-anchor="middle" font-size="16.7894" fill="var(--text-muted)">e.g., DigiCert</text>
  <line x1="640" y1="177.3684" x2="640" y2="238.421" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="696.9824" y="215.5262" font-size="16.7894" fill="var(--primary-accent)">Signs</text>
  <rect x="412.0702" y="238.421" width="455.8596" height="106.8421" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="276.5789" text-anchor="middle" font-size="21.3685" font-weight="bold" fill="var(--primary-accent)">Intermediate CA</text>
  <text x="640" y="307.1052" text-anchor="middle" font-size="18.3158" fill="var(--text-muted)">Signed by Root CA</text>
  <text x="640" y="333.0525" text-anchor="middle" font-size="16.7894" fill="var(--text-muted)">e.g., Let's Encrypt</text>
  <line x1="640" y1="345.2631" x2="640" y2="406.3157" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="696.9824" y="383.4211" font-size="16.7894" fill="var(--primary-accent)">Signs</text>
  <rect x="412.0702" y="406.3157" width="455.8596" height="137.3684" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="444.4737" text-anchor="middle" font-size="21.3685" font-weight="bold" fill="var(--ok-accent)">Server Certificate</text>
  <text x="640" y="475" text-anchor="middle" font-size="18.3158" fill="var(--text-muted)">Signed by Intermediate CA</text>
  <text x="640" y="505.5263" text-anchor="middle" font-size="16.7894" fill="var(--text-muted)">e.g., example.com</text>
  <text x="640" y="531.4737" text-anchor="middle" font-size="15.2632" fill="var(--text-muted)">Contains: domain, public key, validity, issuer</text>
  <rect x="298.1053" y="574.2105" width="683.7894" height="45.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="604.7368" text-anchor="middle" font-size="18.3158" fill="var(--text)">Browser verifies chain: Server -&gt; Intermediate -&gt; Root</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.821872" font-weight="bold" fill="var(--text)">Certificates and the PKI Chain of Trust</text>
  <rect x="40" y="71.926606" width="385" height="404.40367" rx="6.189663" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232" y="135.779817" text-anchor="middle" font-size="26.821872" font-weight="bold" fill="var(--warn-text)">Root CA</text>
  <text x="232" y="210.275229" text-anchor="middle" font-size="18.568989" fill="var(--warn-text)">Self-signed</text>
  <text x="232" y="258.165138" text-anchor="middle" font-size="18.568989" fill="var(--warn-text)">Embedded in OS</text>
  <text x="232" y="306.055046" text-anchor="middle" font-size="18.568989" fill="var(--warn-text)">and browser stores</text>
  <text x="232" y="391.192661" text-anchor="middle" font-size="16.505768" fill="var(--warn-text)">e.g., DigiCert</text>
  <rect x="445" y="71.926606" width="385" height="404.40367" rx="6.189663" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="637" y="135.779817" text-anchor="middle" font-size="26.821872" font-weight="bold" fill="var(--primary-text)">Intermediate CA</text>
  <text x="637" y="210.275229" text-anchor="middle" font-size="18.568989" fill="var(--primary-text)">Signed by Root</text>
  <text x="637" y="258.165138" text-anchor="middle" font-size="18.568989" fill="var(--primary-text)">Issues end-entity</text>
  <text x="637" y="306.055046" text-anchor="middle" font-size="18.568989" fill="var(--primary-text)">certificates</text>
  <text x="637" y="391.192661" text-anchor="middle" font-size="16.505768" fill="var(--primary-text)">e.g., Let's Encrypt</text>
  <rect x="850" y="71.926606" width="385" height="404.40367" rx="6.189663" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1042" y="135.779817" text-anchor="middle" font-size="26.821872" font-weight="bold" fill="var(--ok-text)">Server Cert</text>
  <text x="1042" y="210.275229" text-anchor="middle" font-size="18.568989" fill="var(--ok-text)">Signed by</text>
  <text x="1042" y="258.165138" text-anchor="middle" font-size="18.568989" fill="var(--ok-text)">Intermediate CA</text>
  <text x="1042" y="306.055046" text-anchor="middle" font-size="18.568989" fill="var(--ok-text)">Domain, key, validity</text>
  <text x="1042" y="391.192661" text-anchor="middle" font-size="16.505768" fill="var(--ok-text)">e.g., example.com</text>
  <line x1="425" y1="274.12844" x2="445" y2="274.12844" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="258.165138" text-anchor="middle" font-size="14.442547" fill="var(--text-muted)">signs</text>
  <line x1="830" y1="274.12844" x2="850" y2="274.12844" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="840" y="258.165138" text-anchor="middle" font-size="14.442547" fill="var(--text-muted)">signs</text>
  <rect x="40" y="497.614679" width="1200" height="122.385321" rx="6.189663" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="540.183486" text-anchor="middle" font-size="18.568989" font-weight="bold" fill="var(--text)">Browser verifies chain: Server -&gt; Intermediate -&gt; Root</text>
  <text x="640" y="575.302752" text-anchor="middle" font-size="15.474157" fill="var(--text-muted)">Trust the root once; every descendant cert is trusted automatically.</text>
  <text x="640" y="604.036697" text-anchor="middle" font-size="15.474157" fill="var(--text-muted)">Compromise of any CA in the path breaks every cert below it.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="51.4286" text-anchor="middle" font-size="30.8571" font-weight="bold" fill="#333">Certificates &amp; PKI Chain of Trust</text>
  <rect x="384" y="85.7143" width="512" height="120" rx="8.5714" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4286" />
  <text x="640" y="128.5714" text-anchor="middle" font-size="24" font-weight="bold" fill="#856404">Root CA (trusted)</text>
  <text x="640" y="162.8571" text-anchor="middle" font-size="20.5714" fill="#555">Self-signed, embedded in browsers/OS</text>
  <text x="640" y="192" text-anchor="middle" font-size="18.8571" fill="#555">e.g., DigiCert</text>
  <line x1="640" y1="205.7143" x2="640" y2="274.2857" stroke="#4a90e2" stroke-width="3.4286" marker-end="url(#aPKI)" />
  <text x="704" y="248.5714" font-size="18.8571" fill="#4a90e2">Signs</text>
  <rect x="384" y="274.2857" width="512" height="120" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4286" />
  <text x="640" y="317.1429" text-anchor="middle" font-size="24" font-weight="bold" fill="#4a90e2">Intermediate CA</text>
  <text x="640" y="351.4286" text-anchor="middle" font-size="20.5714" fill="#555">Signed by Root CA</text>
  <text x="640" y="380.5714" text-anchor="middle" font-size="18.8571" fill="#555">e.g., Let's Encrypt</text>
  <line x1="640" y1="394.2857" x2="640" y2="462.8571" stroke="#4a90e2" stroke-width="3.4286" marker-end="url(#aPKI)" />
  <text x="704" y="437.1429" font-size="18.8571" fill="#4a90e2">Signs</text>
  <rect x="384" y="462.8571" width="512" height="154.2857" rx="8.5714" fill="#d4edda" stroke="#28a745" stroke-width="3.4286" />
  <text x="640" y="505.7143" text-anchor="middle" font-size="24" font-weight="bold" fill="#28a745">Server Certificate</text>
  <text x="640" y="540" text-anchor="middle" font-size="20.5714" fill="#555">Signed by Intermediate CA</text>
  <text x="640" y="574.2857" text-anchor="middle" font-size="18.8571" fill="#555">e.g., example.com</text>
  <text x="640" y="603.4286" text-anchor="middle" font-size="17.1429" fill="#555">Contains: domain, public key, validity, issuer</text>
  <rect x="256" y="651.4286" width="768" height="51.4286" rx="8.5714" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.7143" />
  <text x="640" y="685.7143" text-anchor="middle" font-size="20.5714" fill="#333">Browser verifies chain: Server -&gt; Intermediate -&gt; Root</text>
  <defs>
    <marker id="aPKI" markerWidth="18.2857" markerHeight="12" refX="18.2857" refY="6" orient="auto">
      <polygon points="0,17.1429 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="582.7642" y="46.8293" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text)">Certificates &amp; PKI Chain of Trust</text>
  <rect x="349.6585" y="78.0488" width="466.2113" height="109.2683" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="582.7642" y="117.0731" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--danger-accent)">Root CA (trusted)</text>
  <text x="582.7642" y="148.2926" text-anchor="middle" font-size="18.7317" fill="var(--text-muted)">Self-signed, embedded in browsers/OS</text>
  <text x="582.7642" y="174.8293" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">e.g., DigiCert</text>
  <line x1="582.7642" y1="187.3171" x2="582.7642" y2="249.7561" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="641.0406" y="226.3414" font-size="17.1707" fill="var(--primary-accent)">Signs</text>
  <rect x="349.6585" y="249.7561" width="466.2113" height="109.2683" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.7642" y="288.7805" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--primary-accent)">Intermediate CA</text>
  <text x="582.7642" y="320" text-anchor="middle" font-size="18.7317" fill="var(--text-muted)">Signed by Root CA</text>
  <text x="582.7642" y="346.5365" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">e.g., Let's Encrypt</text>
  <line x1="582.7642" y1="359.0243" x2="582.7642" y2="421.4633" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="641.0406" y="398.0488" font-size="17.1707" fill="var(--primary-accent)">Signs</text>
  <rect x="349.6585" y="421.4633" width="466.2113" height="140.4878" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="582.7642" y="460.4878" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--ok-accent)">Server Certificate</text>
  <text x="582.7642" y="491.7073" text-anchor="middle" font-size="18.7317" fill="var(--text-muted)">Signed by Intermediate CA</text>
  <text x="582.7642" y="522.9268" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">e.g., example.com</text>
  <text x="582.7642" y="549.4634" text-anchor="middle" font-size="15.6098" fill="var(--text-muted)">Contains: domain, public key, validity, issuer</text>
  <rect x="233.1057" y="593.1707" width="699.317" height="46.8293" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="582.7642" y="624.3902" text-anchor="middle" font-size="18.7317" fill="var(--text)">Browser verifies chain: Server -&gt; Intermediate -&gt; Root</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="582.7642" y="46.8293" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="var(--text-dark)">Certificates &amp; PKI Chain of Trust</text>
  <rect x="349.6585" y="78.0488" width="466.2113" height="109.2683" rx="7.8049" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.122" />
  <text x="582.7642" y="117.0731" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--danger-deeper)">Root CA (trusted)</text>
  <text x="582.7642" y="148.2926" text-anchor="middle" font-size="18.7317" fill="var(--text-muted)">Self-signed, embedded in browsers/OS</text>
  <text x="582.7642" y="174.8293" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">e.g., DigiCert</text>
  <line x1="582.7642" y1="187.3171" x2="582.7642" y2="249.7561" stroke="var(--primary-bright)" stroke-width="3.122" marker-end="url(#arrow-primary)" />
  <text x="641.0406" y="226.3414" font-size="17.1707" fill="var(--primary-bright)">Signs</text>
  <rect x="349.6585" y="249.7561" width="466.2113" height="109.2683" rx="7.8049" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.122" />
  <text x="582.7642" y="288.7805" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--primary-bright)">Intermediate CA</text>
  <text x="582.7642" y="320" text-anchor="middle" font-size="18.7317" fill="var(--text-muted)">Signed by Root CA</text>
  <text x="582.7642" y="346.5365" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">e.g., Let's Encrypt</text>
  <line x1="582.7642" y1="359.0243" x2="582.7642" y2="421.4633" stroke="var(--primary-bright)" stroke-width="3.122" marker-end="url(#arrow-primary)" />
  <text x="641.0406" y="398.0488" font-size="17.1707" fill="var(--primary-bright)">Signs</text>
  <rect x="349.6585" y="421.4633" width="466.2113" height="140.4878" rx="7.8049" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.122" />
  <text x="582.7642" y="460.4878" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="var(--ok-bright)">Server Certificate</text>
  <text x="582.7642" y="491.7073" text-anchor="middle" font-size="18.7317" fill="var(--text-muted)">Signed by Intermediate CA</text>
  <text x="582.7642" y="522.9268" text-anchor="middle" font-size="17.1707" fill="var(--text-muted)">e.g., example.com</text>
  <text x="582.7642" y="549.4634" text-anchor="middle" font-size="15.6098" fill="var(--text-muted)">Contains: domain, public key, validity, issuer</text>
  <rect x="233.1057" y="593.1707" width="699.317" height="46.8293" rx="7.8049" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="1.561" />
  <text x="582.7642" y="624.3902" text-anchor="middle" font-size="18.7317" fill="var(--text-dark)">Browser verifies chain: Server -&gt; Intermediate -&gt; Root</text>
  <defs>

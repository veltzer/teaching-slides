<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="582.7642" y="46.8293" text-anchor="middle" font-size="28.0975" font-weight="bold" fill="#333">Certificates &amp; PKI Chain of Trust</ns0:text>
  <ns0:rect x="349.6585" y="78.0488" width="466.2113" height="109.2683" rx="7.8049" fill="#fff3cd" stroke="#ffc107" stroke-width="3.122" />
  <ns0:text x="582.7642" y="117.0731" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#bf360c">Root CA (trusted)</ns0:text>
  <ns0:text x="582.7642" y="148.2926" text-anchor="middle" font-size="18.7317" fill="#555">Self-signed, embedded in browsers/OS</ns0:text>
  <ns0:text x="582.7642" y="174.8293" text-anchor="middle" font-size="17.1707" fill="#555">e.g., DigiCert</ns0:text>
  <ns0:line x1="582.7642" y1="187.3171" x2="582.7642" y2="249.7561" stroke="#4a90e2" stroke-width="3.122" marker-end="url(#aPKI)" />
  <ns0:text x="641.0406" y="226.3414" font-size="17.1707" fill="#4a90e2">Signs</ns0:text>
  <ns0:rect x="349.6585" y="249.7561" width="466.2113" height="109.2683" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.122" />
  <ns0:text x="582.7642" y="288.7805" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#4a90e2">Intermediate CA</ns0:text>
  <ns0:text x="582.7642" y="320" text-anchor="middle" font-size="18.7317" fill="#555">Signed by Root CA</ns0:text>
  <ns0:text x="582.7642" y="346.5365" text-anchor="middle" font-size="17.1707" fill="#555">e.g., Let's Encrypt</ns0:text>
  <ns0:line x1="582.7642" y1="359.0243" x2="582.7642" y2="421.4633" stroke="#4a90e2" stroke-width="3.122" marker-end="url(#aPKI)" />
  <ns0:text x="641.0406" y="398.0488" font-size="17.1707" fill="#4a90e2">Signs</ns0:text>
  <ns0:rect x="349.6585" y="421.4633" width="466.2113" height="140.4878" rx="7.8049" fill="#d4edda" stroke="#28a745" stroke-width="3.122" />
  <ns0:text x="582.7642" y="460.4878" text-anchor="middle" font-size="21.8537" font-weight="bold" fill="#28a745">Server Certificate</ns0:text>
  <ns0:text x="582.7642" y="491.7073" text-anchor="middle" font-size="18.7317" fill="#555">Signed by Intermediate CA</ns0:text>
  <ns0:text x="582.7642" y="522.9268" text-anchor="middle" font-size="17.1707" fill="#555">e.g., example.com</ns0:text>
  <ns0:text x="582.7642" y="549.4634" text-anchor="middle" font-size="15.6098" fill="#555">Contains: domain, public key, validity, issuer</ns0:text>
  <ns0:rect x="233.1057" y="593.1707" width="699.317" height="46.8293" rx="7.8049" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.561" />
  <ns0:text x="582.7642" y="624.3902" text-anchor="middle" font-size="18.7317" fill="#333">Browser verifies chain: Server -&gt; Intermediate -&gt; Root</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="aPKI" markerWidth="18.2857" markerHeight="12" refX="18.2857" refY="6" orient="auto">
      <ns0:polygon points="0,17.1429 6.4,0" fill="#4a90e2" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
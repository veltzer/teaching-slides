<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Certificates &amp; PKI Chain of Trust</text>
  <!-- Root CA -->
  <rect x="210" y="50" width="280" height="70" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Root CA (trusted)</text>
  <text x="350" y="95" text-anchor="middle" font-size="12" fill="#555">Self-signed, embedded in browsers/OS</text>
  <text x="350" y="112" text-anchor="middle" font-size="11" fill="#555">e.g., DigiCert</text>
  <!-- Arrow -->
  <line x1="350" y1="120" x2="350" y2="160" stroke="#4a90e2" stroke-width="2" marker-end="url(#aPKI)"/>
  <text x="385" y="145" font-size="11" fill="#4a90e2">Signs</text>
  <!-- Intermediate CA -->
  <rect x="210" y="160" width="280" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Intermediate CA</text>
  <text x="350" y="205" text-anchor="middle" font-size="12" fill="#555">Signed by Root CA</text>
  <text x="350" y="222" text-anchor="middle" font-size="11" fill="#555">e.g., Let's Encrypt</text>
  <!-- Arrow -->
  <line x1="350" y1="230" x2="350" y2="270" stroke="#4a90e2" stroke-width="2" marker-end="url(#aPKI)"/>
  <text x="385" y="255" font-size="11" fill="#4a90e2">Signs</text>
  <!-- Server Certificate -->
  <rect x="210" y="270" width="280" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Server Certificate</text>
  <text x="350" y="315" text-anchor="middle" font-size="12" fill="#555">Signed by Intermediate CA</text>
  <text x="350" y="335" text-anchor="middle" font-size="11" fill="#555">e.g., example.com</text>
  <text x="350" y="352" text-anchor="middle" font-size="10" fill="#555">Contains: domain, public key, validity, issuer</text>
  <!-- Verification note -->
  <rect x="140" y="380" width="420" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="350" y="400" text-anchor="middle" font-size="12" fill="#333">Browser verifies chain: Server -> Intermediate -> Root</text>
  <defs>
    <marker id="aPKI" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
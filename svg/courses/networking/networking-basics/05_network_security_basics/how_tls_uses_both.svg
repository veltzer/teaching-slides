<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="72" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#333">How TLS Uses Both Encryption Types</text>
  <text x="324.2667" y="156" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#4a90e2">Phase 1: Asymmetric (Key Exchange)</text>
  <rect x="68.2667" y="192" width="204.8" height="192" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="170.6667" y="276" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Client</text>
  <text x="170.6667" y="336" text-anchor="middle" font-size="18.7733" fill="#555">Public Key</text>
  <line x1="273.0667" y1="264" x2="358.4" y2="264" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#aTLS)" />
  <line x1="358.4" y1="312" x2="273.0667" y2="312" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#aTLS2)" />
  <rect x="358.4" y="192" width="204.8" height="192" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="460.8" y="276" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Server</text>
  <text x="460.8" y="336" text-anchor="middle" font-size="18.7733" fill="#555">Crypto</text>
  <text x="324.2667" y="456" text-anchor="middle" font-size="20.48" fill="#555">Slow but solves key distribution</text>
  <text x="955.7333" y="156" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#28a745">Phase 2: Symmetric (Bulk Data)</text>
  <rect x="699.7333" y="192" width="204.8" height="192" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="802.1333" y="276" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Client</text>
  <text x="802.1333" y="336" text-anchor="middle" font-size="18.7733" fill="#555">Shared</text>
  <line x1="904.5333" y1="264" x2="989.8667" y2="264" stroke="#28a745" stroke-width="3.4133" marker-end="url(#aTLSg)" />
  <line x1="989.8667" y1="312" x2="904.5333" y2="312" stroke="#28a745" stroke-width="3.4133" marker-end="url(#aTLSg2)" />
  <rect x="989.8667" y="192" width="204.8" height="192" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="1092.2667" y="276" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Server</text>
  <text x="1092.2667" y="336" text-anchor="middle" font-size="18.7733" fill="#555">Session Key</text>
  <text x="955.7333" y="456" text-anchor="middle" font-size="20.48" fill="#555">Fast, used for all application data</text>
  <line x1="563.2" y1="288" x2="699.7333" y2="288" stroke="#ffc107" stroke-width="5.12" stroke-dasharray="13.6533 6.8267" />
  <text x="631.4667" y="552" text-anchor="middle" font-size="22.1867" fill="#856404" font-weight="bold">Session key negotiated in Phase 1 is used in Phase 2</text>
  <rect x="204.8" y="595.2" width="870.4" height="84" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="2.56" />
  <text x="640" y="648" text-anchor="middle" font-size="20.48" fill="#333">Combines security of asymmetric with speed of symmetric encryption</text>
  <defs>
    <marker id="aTLS" markerWidth="17.0667" markerHeight="16.8" refX="17.0667" refY="8.4" orient="auto">
      <polygon points="0,24 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="aTLS2" markerWidth="17.0667" markerHeight="16.8" refX="0" refY="8.4" orient="auto">
      <polygon points="0,0 5.9733,24" fill="#4a90e2" />
    </marker>
    <marker id="aTLSg" markerWidth="17.0667" markerHeight="16.8" refX="17.0667" refY="8.4" orient="auto">
      <polygon points="0,24 5.9733,0" fill="#28a745" />
    </marker>
    <marker id="aTLSg2" markerWidth="17.0667" markerHeight="16.8" refX="0" refY="8.4" orient="auto">
      <polygon points="0,0 5.9733,24" fill="#28a745" />
    </marker>
  </defs>
</svg>
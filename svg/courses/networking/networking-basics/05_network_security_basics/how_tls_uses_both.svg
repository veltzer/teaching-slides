<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="603.0624" y="67.8445" text-anchor="middle" font-size="28.947" font-weight="bold" fill="#333">How TLS Uses Both Encryption Types</ns0:text>
  <ns0:text x="305.5517" y="146.9965" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="#4a90e2">Phase 1: Asymmetric (Key Exchange)</ns0:text>
  <ns0:rect x="64.3267" y="180.9187" width="192.98" height="180.9187" rx="8.0408" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2163" />
  <ns0:text x="160.8167" y="260.0707" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="#333">Client</ns0:text>
  <ns0:text x="160.8167" y="316.6078" text-anchor="middle" font-size="17.6898" fill="#555">Public Key</ns0:text>
  <ns0:line x1="257.3067" y1="248.7633" x2="337.715" y2="248.7633" stroke="#4a90e2" stroke-width="3.2163" marker-end="url(#aTLS)" />
  <ns0:line x1="337.715" y1="293.9929" x2="257.3067" y2="293.9929" stroke="#4a90e2" stroke-width="3.2163" marker-end="url(#aTLS2)" />
  <ns0:rect x="337.715" y="180.9187" width="192.98" height="180.9187" rx="8.0408" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2163" />
  <ns0:text x="434.2049" y="260.0707" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="#333">Server</ns0:text>
  <ns0:text x="434.2049" y="316.6078" text-anchor="middle" font-size="17.6898" fill="#555">Crypto</ns0:text>
  <ns0:text x="305.5517" y="429.682" text-anchor="middle" font-size="19.298" fill="#555">Slow but solves key distribution</ns0:text>
  <ns0:text x="900.5732" y="146.9965" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="#28a745">Phase 2: Symmetric (Bulk Data)</ns0:text>
  <ns0:rect x="659.3482" y="180.9187" width="192.98" height="180.9187" rx="8.0408" fill="#d4edda" stroke="#28a745" stroke-width="3.2163" />
  <ns0:text x="755.8382" y="260.0707" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="#333">Client</ns0:text>
  <ns0:text x="755.8382" y="316.6078" text-anchor="middle" font-size="17.6898" fill="#555">Shared</ns0:text>
  <ns0:line x1="852.3282" y1="248.7633" x2="932.7366" y2="248.7633" stroke="#28a745" stroke-width="3.2163" marker-end="url(#aTLSg)" />
  <ns0:line x1="932.7366" y1="293.9929" x2="852.3282" y2="293.9929" stroke="#28a745" stroke-width="3.2163" marker-end="url(#aTLSg2)" />
  <ns0:rect x="932.7366" y="180.9187" width="192.98" height="180.9187" rx="8.0408" fill="#d4edda" stroke="#28a745" stroke-width="3.2163" />
  <ns0:text x="1029.2266" y="260.0707" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="#333">Server</ns0:text>
  <ns0:text x="1029.2266" y="316.6078" text-anchor="middle" font-size="17.6898" fill="#555">Session Key</ns0:text>
  <ns0:text x="900.5732" y="429.682" text-anchor="middle" font-size="19.298" fill="#555">Fast, used for all application data</ns0:text>
  <ns0:line x1="530.6949" y1="271.3781" x2="659.3482" y2="271.3781" stroke="#ffc107" stroke-width="4.8245" stroke-dasharray="12.8653 6.4327" />
  <ns0:text x="595.0216" y="520.1413" text-anchor="middle" font-size="20.9062" fill="#bf360c" font-weight="bold">Session key negotiated in Phase 1 is used in Phase 2</ns0:text>
  <ns0:rect x="192.98" y="560.8481" width="820.1649" height="79.1519" rx="8.0408" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4122" />
  <ns0:text x="603.0624" y="610.6007" text-anchor="middle" font-size="19.298" fill="#333">Combines security of asymmetric with speed of symmetric encryption</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="aTLS" markerWidth="17.0667" markerHeight="16.8" refX="17.0667" refY="8.4" orient="auto">
      <ns0:polygon points="0,24 5.9733,0" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="aTLS2" markerWidth="17.0667" markerHeight="16.8" refX="0" refY="8.4" orient="auto">
      <ns0:polygon points="0,0 5.9733,24" fill="#4a90e2" />
    </ns0:marker>
    <ns0:marker id="aTLSg" markerWidth="17.0667" markerHeight="16.8" refX="17.0667" refY="8.4" orient="auto">
      <ns0:polygon points="0,24 5.9733,0" fill="#28a745" />
    </ns0:marker>
    <ns0:marker id="aTLSg2" markerWidth="17.0667" markerHeight="16.8" refX="0" refY="8.4" orient="auto">
      <ns0:polygon points="0,0 5.9733,24" fill="#28a745" />
    </ns0:marker>
  </ns0:defs>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="603.0624" y="67.8445" text-anchor="middle" font-size="28.947" font-weight="bold" fill="var(--text)">How TLS Uses Both Encryption Types</text>
  <text x="305.5517" y="146.9965" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="var(--primary-accent)">Phase 1: Asymmetric (Key Exchange)</text>
  <rect x="64.3267" y="180.9187" width="192.98" height="180.9187" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="160.8167" y="260.0707" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="var(--text)">Client</text>
  <text x="160.8167" y="316.6078" text-anchor="middle" font-size="17.6898" fill="var(--text-muted)">Public Key</text>
  <line x1="257.3067" y1="248.7633" x2="337.715" y2="248.7633" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="337.715" y1="293.9929" x2="257.3067" y2="293.9929" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="337.715" y="180.9187" width="192.98" height="180.9187" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="434.2049" y="260.0707" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="var(--text)">Server</text>
  <text x="434.2049" y="316.6078" text-anchor="middle" font-size="17.6898" fill="var(--text-muted)">Crypto</text>
  <text x="305.5517" y="429.682" text-anchor="middle" font-size="19.298" fill="var(--text-muted)">Slow but solves key distribution</text>
  <text x="900.5732" y="146.9965" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="var(--ok-accent)">Phase 2: Symmetric (Bulk Data)</text>
  <rect x="659.3482" y="180.9187" width="192.98" height="180.9187" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="755.8382" y="260.0707" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="var(--text)">Client</text>
  <text x="755.8382" y="316.6078" text-anchor="middle" font-size="17.6898" fill="var(--text-muted)">Shared</text>
  <line x1="852.3282" y1="248.7633" x2="932.7366" y2="248.7633" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="932.7366" y1="293.9929" x2="852.3282" y2="293.9929" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="932.7366" y="180.9187" width="192.98" height="180.9187" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1029.2266" y="260.0707" text-anchor="middle" font-size="22.5143" font-weight="bold" fill="var(--text)">Server</text>
  <text x="1029.2266" y="316.6078" text-anchor="middle" font-size="17.6898" fill="var(--text-muted)">Session Key</text>
  <text x="900.5732" y="429.682" text-anchor="middle" font-size="19.298" fill="var(--text-muted)">Fast, used for all application data</text>
  <line x1="530.6949" y1="271.3781" x2="659.3482" y2="271.3781" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="12.8653 6.4327" />
  <text x="595.0216" y="520.1413" text-anchor="middle" font-size="20.9062" fill="var(--danger-accent)" font-weight="bold">Session key negotiated in Phase 1 is used in Phase 2</text>
  <rect x="192.98" y="560.8481" width="820.1649" height="79.1519" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="603.0624" y="610.6007" text-anchor="middle" font-size="19.298" fill="var(--text)">Combines security of asymmetric with speed of symmetric encryption</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="72" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#333">DNS Amplification DDoS Attack</text>
  <rect x="51.2" y="192" width="256" height="192" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4133" />
  <text x="179.2" y="276" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#dc3545">Attacker</text>
  <text x="179.2" y="336" text-anchor="middle" font-size="18.7733" fill="#555">Spoofs src=victim IP</text>
  <rect x="494.9333" y="192" width="290.1333" height="192" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="640" y="276" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#856404">Open DNS Resolver</text>
  <text x="640" y="336" text-anchor="middle" font-size="18.7733" fill="#555">Amplifies ~50x</text>
  <rect x="972.8" y="192" width="256" height="192" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="1100.8" y="276" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Victim</text>
  <text x="1100.8" y="336" text-anchor="middle" font-size="18.7733" fill="#555">Overwhelmed</text>
  <line x1="307.2" y1="252" x2="494.9333" y2="252" stroke="#dc3545" stroke-width="3.4133" marker-end="url(#aR)" />
  <text x="401.0667" y="232.8" text-anchor="middle" font-size="17.0667" fill="#dc3545">Small query</text>
  <line x1="785.0667" y1="288" x2="972.8" y2="288" stroke="#dc3545" stroke-width="6.8267" marker-end="url(#aR)" />
  <text x="878.9333" y="268.8" text-anchor="middle" font-size="17.0667" fill="#dc3545">Huge response</text>
  <rect x="170.6667" y="480" width="938.6667" height="156" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="2.56" />
  <text x="640" y="540" text-anchor="middle" font-size="22.1867" fill="#333">Attacker sends small DNS queries with victim's spoofed source IP.</text>
  <text x="640" y="595.2" text-anchor="middle" font-size="22.1867" fill="#333">DNS resolvers reply with much larger responses directly to the victim.</text>
  <defs>
    <marker id="aR" markerWidth="17.0667" markerHeight="16.8" refX="17.0667" refY="8.4" orient="auto">
      <polygon points="0,24 5.9733,0" fill="#dc3545" />
    </marker>
  </defs>
</svg>
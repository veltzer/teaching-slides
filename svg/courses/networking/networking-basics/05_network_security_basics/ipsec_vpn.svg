<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="596.867" y="62.9508" text-anchor="middle" font-size="28.6496" font-weight="bold" fill="var(--text)">IPSec VPN Modes</text>
  <text x="596.867" y="136.3934" text-anchor="middle" font-size="23.8747" font-weight="bold" fill="var(--primary-accent)">Transport Mode</text>
  <rect x="79.5822" y="157.377" width="254.6633" height="104.918" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="206.9139" y="199.3443" text-anchor="middle" font-size="19.0997" font-weight="bold" fill="var(--text)">IP Header</text>
  <text x="206.9139" y="235.0164" text-anchor="middle" font-size="15.9165" fill="var(--text-muted)">(original)</text>
  <rect x="334.2455" y="157.377" width="318.3291" height="104.918" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="493.4101" y="199.3443" text-anchor="middle" font-size="19.0997" font-weight="bold" fill="var(--text)">IPSec Header</text>
  <text x="493.4101" y="235.0164" text-anchor="middle" font-size="15.9165" fill="var(--text-muted)">(ESP/AH)</text>
  <rect x="652.5746" y="157.377" width="445.6607" height="104.918" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="875.405" y="199.3443" text-anchor="middle" font-size="19.0997" font-weight="bold" fill="var(--text)">Original Data</text>
  <text x="875.405" y="235.0164" text-anchor="middle" font-size="15.9165" fill="var(--text-muted)">(encrypted)</text>
  <text x="596.867" y="356.7213" text-anchor="middle" font-size="23.8747" font-weight="bold" fill="var(--ok-accent)">Tunnel Mode</text>
  <rect x="79.5822" y="377.7049" width="190.9974" height="104.918" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="175.081" y="419.6721" text-anchor="middle" font-size="19.0997" font-weight="bold" fill="var(--text)">New IP Hdr</text>
  <text x="175.081" y="455.3443" text-anchor="middle" font-size="15.9165" fill="var(--text-muted)">Outer IP</text>
  <rect x="270.5797" y="377.7049" width="238.7468" height="104.918" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="389.9531" y="419.6721" text-anchor="middle" font-size="19.0997" font-weight="bold" fill="var(--text)">IPSec Header</text>
  <text x="389.9531" y="455.3443" text-anchor="middle" font-size="15.9165" fill="var(--text-muted)">(ESP/AH)</text>
  <rect x="509.3265" y="377.7049" width="222.8303" height="104.918" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="620.7417" y="419.6721" text-anchor="middle" font-size="19.0997" font-weight="bold" fill="var(--text)">Orig IP Hdr</text>
  <text x="620.7417" y="455.3443" text-anchor="middle" font-size="15.9165" fill="var(--text-muted)">Inner IP</text>
  <rect x="732.1569" y="377.7049" width="366.0784" height="104.918" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="915.1961" y="419.6721" text-anchor="middle" font-size="19.0997" font-weight="bold" fill="var(--text)">Original Data</text>
  <text x="915.1961" y="455.3443" text-anchor="middle" font-size="15.9165" fill="var(--text-muted)">(encrypted)</text>
  <rect x="270.5797" y="493.1148" width="827.6556" height="52.459" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.9582 4.7749" />
  <text x="684.4076" y="528.7869" text-anchor="middle" font-size="17.5081" fill="var(--danger-accent)">Everything inside is encrypted</text>
  <rect x="159.1646" y="577.0492" width="875.405" height="62.9508" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="596.867" y="619.0164" text-anchor="middle" font-size="19.0997" fill="var(--text)">Transport: end-to-end between hosts | Tunnel: gateway-to-gateway (site-to-site VPN)</text>
</svg>
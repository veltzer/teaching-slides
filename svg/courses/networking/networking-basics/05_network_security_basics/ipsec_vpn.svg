<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="649.375" y="40" text-anchor="middle" font-size="31.1748" font-weight="bold" fill="var(--text)">IPSec VPN Modes</text>
  <text x="649.375" y="113.8182" text-anchor="middle" font-size="25.979" font-weight="bold" fill="var(--primary-accent)">Transport Mode</text>
  <rect x="40" y="134.9091" width="300" height="105.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="190.0001" y="177.091" text-anchor="middle" font-size="20.7832" font-weight="bold" fill="var(--text)">IP Header</text>
  <text x="190.0001" y="212.9455" text-anchor="middle" font-size="17.3194" fill="var(--text-muted)">(original)</text>
  <rect x="340" y="134.9091" width="375" height="105.4545" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="527.5001" y="177.091" text-anchor="middle" font-size="20.7832" font-weight="bold" fill="var(--text)">IPSec Header</text>
  <text x="527.5001" y="212.9455" text-anchor="middle" font-size="17.3194" fill="var(--text-muted)">(ESP/AH)</text>
  <rect x="715" y="134.9091" width="525" height="105.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="977.5001" y="177.091" text-anchor="middle" font-size="20.7832" font-weight="bold" fill="var(--text)">Original Data</text>
  <text x="977.5001" y="212.9455" text-anchor="middle" font-size="17.3194" fill="var(--text-muted)">(encrypted)</text>
  <text x="649.375" y="335.2727" text-anchor="middle" font-size="25.979" font-weight="bold" fill="var(--ok-accent)">Tunnel Mode</text>
  <rect x="40" y="356.3636" width="224.9999" height="105.4545" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="152.5001" y="398.5454" text-anchor="middle" font-size="20.7832" font-weight="bold" fill="var(--text)">New IP Hdr</text>
  <text x="152.5001" y="434.4" text-anchor="middle" font-size="17.3194" fill="var(--text-muted)">Outer IP</text>
  <rect x="265.0001" y="356.3636" width="281.25" height="105.4545" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="405.625" y="398.5454" text-anchor="middle" font-size="20.7832" font-weight="bold" fill="var(--text)">IPSec Header</text>
  <text x="405.625" y="434.4" text-anchor="middle" font-size="17.3194" fill="var(--text-muted)">(ESP/AH)</text>
  <rect x="546.25" y="356.3636" width="262.4999" height="105.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="677.5" y="398.5454" text-anchor="middle" font-size="20.7832" font-weight="bold" fill="var(--text)">Orig IP Hdr</text>
  <text x="677.5" y="434.4" text-anchor="middle" font-size="17.3194" fill="var(--text-muted)">Inner IP</text>
  <rect x="808.7501" y="356.3636" width="431.2499" height="105.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1024.375" y="398.5454" text-anchor="middle" font-size="20.7832" font-weight="bold" fill="var(--text)">Original Data</text>
  <text x="1024.375" y="434.4" text-anchor="middle" font-size="17.3194" fill="var(--text-muted)">(encrypted)</text>
  <rect x="265.0001" y="472.3637" width="974.9999" height="52.7273" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.9582 4.7749" />
  <text x="752.5001" y="508.2182" text-anchor="middle" font-size="19.0513" fill="var(--danger-accent)">Everything inside is encrypted</text>
  <rect x="133.7501" y="556.7273" width="1031.25" height="63.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="649.375" y="598.9091" text-anchor="middle" font-size="20.7832" fill="var(--text)">Transport: end-to-end between hosts | Tunnel: gateway-to-gateway (site-to-site VPN)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">IPSec VPN Modes</text>
  <!-- Transport Mode -->
  <text x="375" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90e2">Transport Mode</text>
  <rect x="50" y="75" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">IP Header</text>
  <text x="130" y="112" text-anchor="middle" font-size="10" fill="#555">(original)</text>
  <rect x="210" y="75" width="200" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="310" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">IPSec Header</text>
  <text x="310" y="112" text-anchor="middle" font-size="10" fill="#555">(ESP/AH)</text>
  <rect x="410" y="75" width="280" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="550" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Original Data</text>
  <text x="550" y="112" text-anchor="middle" font-size="10" fill="#555">(encrypted)</text>

  <!-- Tunnel Mode -->
  <text x="375" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#28a745">Tunnel Mode</text>
  <rect x="50" y="180" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="110" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">New IP Hdr</text>
  <text x="110" y="217" text-anchor="middle" font-size="10" fill="#555">Outer IP</text>
  <rect x="170" y="180" width="150" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="245" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">IPSec Header</text>
  <text x="245" y="217" text-anchor="middle" font-size="10" fill="#555">(ESP/AH)</text>
  <rect x="320" y="180" width="140" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="390" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Orig IP Hdr</text>
  <text x="390" y="217" text-anchor="middle" font-size="10" fill="#555">Inner IP</text>
  <rect x="460" y="180" width="230" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="575" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Original Data</text>
  <text x="575" y="217" text-anchor="middle" font-size="10" fill="#555">(encrypted)</text>
  <!-- Bracket for encrypted part -->
  <rect x="170" y="235" width="520" height="25" rx="3" fill="none" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="430" y="252" text-anchor="middle" font-size="11" fill="#dc3545">Everything inside is encrypted</text>

  <!-- Note -->
  <rect x="100" y="275" width="550" height="30" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1"/>
  <text x="375" y="295" text-anchor="middle" font-size="12" fill="#333">Transport: end-to-end between hosts | Tunnel: gateway-to-gateway (site-to-site VPN)</text>
</svg>
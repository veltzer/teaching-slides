<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="34.7139" font-weight="bold" fill="var(--text)">Asymmetric Encryption</text>
  <rect x="457.3913" y="72.2222" width="365.2174" height="150.3704" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="119.4814" text-anchor="middle" font-size="26.9997" font-weight="bold" fill="var(--text)">Key Pair</text>
  <text x="640" y="162.4445" text-anchor="middle" font-size="23.1426" fill="var(--ok-accent)">Public Key - Anyone can have</text>
  <text x="640" y="201.1111" text-anchor="middle" font-size="23.1426" fill="var(--danger-accent)">Private Key - Only owner has</text>
  <text x="318.2609" y="297.7778" text-anchor="middle" font-size="28.9283" font-weight="bold" fill="var(--primary-accent)">Encryption</text>
  <rect x="40" y="329.9999" width="191.3043" height="107.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="135.6522" y="394.4444" text-anchor="middle" font-size="25.0712" fill="var(--text)">Plain Text</text>
  <line x1="231.3043" y1="383.7037" x2="353.0435" y2="383.7037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="292.1739" y="362.2222" text-anchor="middle" font-size="19.2855" fill="var(--primary-accent)">Public Key</text>
  <rect x="353.0435" y="329.9999" width="208.6957" height="107.4074" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="457.3913" y="394.4444" text-anchor="middle" font-size="25.0712" fill="var(--text)">Cipher Text</text>
  <line x1="457.3913" y1="437.4074" x2="457.3913" y2="501.8519" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="353.0435" y="512.5926" width="208.6957" height="107.4074" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="457.3913" y="577.0371" text-anchor="middle" font-size="25.0712" fill="var(--text)">Cipher Text</text>
  <line x1="353.0435" y1="566.2963" x2="231.3043" y2="566.2963" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="292.1739" y="544.8148" text-anchor="middle" font-size="19.2855" fill="var(--danger-accent)">Private Key</text>
  <rect x="40" y="512.5926" width="191.3043" height="107.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="135.6522" y="577.0371" text-anchor="middle" font-size="25.0712" fill="var(--text)">Plain Text</text>
  <text x="961.7391" y="297.7778" text-anchor="middle" font-size="28.9283" font-weight="bold" fill="var(--ok-accent)">Digital Signature</text>
  <rect x="700.8695" y="329.9999" width="191.3043" height="107.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="796.5217" y="394.4444" text-anchor="middle" font-size="25.0712" fill="var(--text)">Data</text>
  <line x1="892.1739" y1="383.7037" x2="1013.913" y2="383.7037" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="953.0435" y="362.2222" text-anchor="middle" font-size="19.2855" fill="var(--danger-accent)">Private Key</text>
  <rect x="1013.913" y="329.9999" width="226.087" height="107.4074" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1126.9566" y="394.4444" text-anchor="middle" font-size="25.0712" fill="var(--text)">Signed Data</text>
  <line x1="1126.9566" y1="437.4074" x2="1126.9566" y2="501.8519" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="1013.913" y="512.5926" width="226.087" height="107.4074" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1126.9566" y="577.0371" text-anchor="middle" font-size="25.0712" fill="var(--text)">Signed Data</text>
  <line x1="1013.913" y1="566.2963" x2="892.1739" y2="566.2963" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="953.0435" y="544.8148" text-anchor="middle" font-size="19.2855" fill="var(--primary-accent)">Public Key</text>
  <rect x="700.8695" y="512.5926" width="191.3043" height="107.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="796.5217" y="577.0371" text-anchor="middle" font-size="25.0712" fill="var(--text)">Valid?</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
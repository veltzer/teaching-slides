<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Asymmetric Encryption</text>
  <!-- Key pair box -->
  <rect x="270" y="45" width="210" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Key Pair</text>
  <text x="375" y="87" text-anchor="middle" font-size="12" fill="#28a745">Public Key - Anyone can have</text>
  <text x="375" y="105" text-anchor="middle" font-size="12" fill="#dc3545">Private Key - Only owner has</text>

  <!-- Encryption section -->
  <text x="190" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90e2">Encryption</text>
  <rect x="30" y="165" width="110" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="85" y="195" text-anchor="middle" font-size="13" fill="#333">Plain Text</text>
  <line x1="140" y1="190" x2="210" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#aB)"/>
  <text x="175" y="180" text-anchor="middle" font-size="10" fill="#4a90e2">Public Key</text>
  <rect x="210" y="165" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="270" y="195" text-anchor="middle" font-size="13" fill="#333">Cipher Text</text>

  <line x1="270" y1="215" x2="270" y2="245" stroke="#4a90e2" stroke-width="2" marker-end="url(#aB)"/>

  <rect x="210" y="250" width="120" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="270" y="280" text-anchor="middle" font-size="13" fill="#333">Cipher Text</text>
  <line x1="210" y1="275" x2="140" y2="275" stroke="#28a745" stroke-width="2" marker-end="url(#aG2)"/>
  <text x="175" y="265" text-anchor="middle" font-size="10" fill="#dc3545">Private Key</text>
  <rect x="30" y="250" width="110" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="85" y="280" text-anchor="middle" font-size="13" fill="#333">Plain Text</text>

  <!-- Digital Signature section -->
  <text x="560" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#28a745">Digital Signature</text>
  <rect x="410" y="165" width="110" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="465" y="195" text-anchor="middle" font-size="13" fill="#333">Data</text>
  <line x1="520" y1="190" x2="590" y2="190" stroke="#28a745" stroke-width="2" marker-end="url(#aG)"/>
  <text x="555" y="180" text-anchor="middle" font-size="10" fill="#dc3545">Private Key</text>
  <rect x="590" y="165" width="130" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="655" y="195" text-anchor="middle" font-size="13" fill="#333">Signed Data</text>

  <line x1="655" y1="215" x2="655" y2="245" stroke="#28a745" stroke-width="2" marker-end="url(#aG)"/>

  <rect x="590" y="250" width="130" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="655" y="280" text-anchor="middle" font-size="13" fill="#333">Signed Data</text>
  <line x1="590" y1="275" x2="520" y2="275" stroke="#4a90e2" stroke-width="2" marker-end="url(#aB2)"/>
  <text x="555" y="265" text-anchor="middle" font-size="10" fill="#4a90e2">Public Key</text>
  <rect x="410" y="250" width="110" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="465" y="280" text-anchor="middle" font-size="13" fill="#333">Valid?</text>

  <defs>
    <marker id="aB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="aB2" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4a90e2"/>
    </marker>
    <marker id="aG" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="aG2" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
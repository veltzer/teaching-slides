<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="51.4286" text-anchor="middle" font-size="30.72" font-weight="bold" fill="var(--text)">Asymmetric Encryption</text>
  <rect x="460.8" y="77.1429" width="358.4" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="114.8571" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Key Pair</text>
  <text x="640" y="149.1429" text-anchor="middle" font-size="20.48" fill="var(--ok-accent)">Public Key - Anyone can have</text>
  <text x="640" y="180" text-anchor="middle" font-size="20.48" fill="var(--danger-accent)">Private Key - Only owner has</text>
  <text x="324.2667" y="257.1429" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--primary-accent)">Encryption</text>
  <rect x="51.2" y="282.8571" width="187.7333" height="85.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="145.0667" y="334.2857" text-anchor="middle" font-size="22.1867" fill="var(--text)">Plain Text</text>
  <line x1="238.9333" y1="325.7143" x2="358.4" y2="325.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="298.6667" y="308.5714" text-anchor="middle" font-size="17.0667" fill="var(--primary-accent)">Public Key</text>
  <rect x="358.4" y="282.8571" width="204.8" height="85.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="460.8" y="334.2857" text-anchor="middle" font-size="22.1867" fill="var(--text)">Cipher Text</text>
  <line x1="460.8" y1="368.5714" x2="460.8" y2="420" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="358.4" y="428.5714" width="204.8" height="85.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="460.8" y="480" text-anchor="middle" font-size="22.1867" fill="var(--text)">Cipher Text</text>
  <line x1="358.4" y1="471.4286" x2="238.9333" y2="471.4286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="298.6667" y="454.2857" text-anchor="middle" font-size="17.0667" fill="var(--danger-accent)">Private Key</text>
  <rect x="51.2" y="428.5714" width="187.7333" height="85.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="145.0667" y="480" text-anchor="middle" font-size="22.1867" fill="var(--text)">Plain Text</text>
  <text x="955.7333" y="257.1429" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--ok-accent)">Digital Signature</text>
  <rect x="699.7333" y="282.8571" width="187.7333" height="85.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="793.6" y="334.2857" text-anchor="middle" font-size="22.1867" fill="var(--text)">Data</text>
  <line x1="887.4667" y1="325.7143" x2="1006.9333" y2="325.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="947.2" y="308.5714" text-anchor="middle" font-size="17.0667" fill="var(--danger-accent)">Private Key</text>
  <rect x="1006.9333" y="282.8571" width="221.8667" height="85.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1117.8667" y="334.2857" text-anchor="middle" font-size="22.1867" fill="var(--text)">Signed Data</text>
  <line x1="1117.8667" y1="368.5714" x2="1117.8667" y2="420" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="1006.9333" y="428.5714" width="221.8667" height="85.7143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1117.8667" y="480" text-anchor="middle" font-size="22.1867" fill="var(--text)">Signed Data</text>
  <line x1="1006.9333" y1="471.4286" x2="887.4667" y2="471.4286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="947.2" y="454.2857" text-anchor="middle" font-size="17.0667" fill="var(--primary-accent)">Public Key</text>
  <rect x="699.7333" y="428.5714" width="187.7333" height="85.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="793.6" y="480" text-anchor="middle" font-size="22.1867" fill="var(--text)">Valid?</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
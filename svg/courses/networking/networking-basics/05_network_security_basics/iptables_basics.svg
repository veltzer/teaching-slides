<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="40" text-anchor="middle" font-size="34.9322" font-weight="bold" fill="var(--text)">iptables / Netfilter Basics</text>
  <rect x="40" y="92.7273" width="1200" height="527.2727" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="158.6364" text-anchor="middle" font-size="29.1102" font-weight="bold" fill="var(--primary-accent)">Netfilter</text>
  <rect x="77.5001" y="198.1818" width="206.25" height="105.4545" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="180.625" y="264.0909" text-anchor="middle" font-size="23.2882" font-weight="bold" fill="var(--text)">PREROUTING</text>
  <line x1="283.75" y1="250.9091" x2="349.375" y2="250.9091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="349.375" y="198.1818" width="150" height="105.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="424.3751" y="264.0909" text-anchor="middle" font-size="23.2882" font-weight="bold" fill="var(--text)">INPUT</text>
  <line x1="499.375" y1="250.9091" x2="583.7501" y2="250.9091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="583.7501" y="185" width="243.75" height="131.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="705.6251" y="245.6364" text-anchor="middle" font-size="21.3475" font-weight="bold" fill="var(--text)">[Local Process]</text>
  <text x="705.6251" y="290.4545" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)">Application</text>
  <line x1="827.5" y1="250.9091" x2="893.125" y2="250.9091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="893.125" y="198.1818" width="150" height="105.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="968.1251" y="264.0909" text-anchor="middle" font-size="23.2882" font-weight="bold" fill="var(--text)">OUTPUT</text>
  <line x1="1043.1251" y1="250.9091" x2="1071.25" y2="250.9091" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1071.25" y="198.1818" width="150" height="105.4545" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1146.2501" y="245.6364" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)">POST</text>
  <text x="1146.2501" y="282.5455" text-anchor="middle" font-size="19.4068" font-weight="bold" fill="var(--text)">ROUTING</text>
  <line x1="180.625" y1="303.6364" x2="180.625" y2="422.2727" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="180.625" y1="422.2727" x2="358.7501" y2="422.2727" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="358.7501" y="369.5455" width="206.25" height="105.4545" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="461.875" y="435.4545" text-anchor="middle" font-size="23.2882" font-weight="bold" fill="var(--danger-accent)">FORWARD</text>
  <text x="461.875" y="514.5455" text-anchor="middle" font-size="19.4068" fill="var(--text-muted)">(routing)</text>
  <line x1="565" y1="422.2727" x2="968.1251" y2="422.2727" stroke="var(--danger-border)" stroke-width="2" />
  <line x1="968.1251" y1="422.2727" x2="968.1251" y2="303.6364" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">iptables / Netfilter Basics</text>
  <!-- Main container -->
  <rect x="30" y="50" width="640" height="200" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90e2">Netfilter</text>
  <!-- Chain boxes -->
  <rect x="50" y="90" width="110" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="105" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">PREROUTING</text>
  <line x1="160" y1="110" x2="195" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#aIPT)"/>

  <rect x="195" y="90" width="80" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="235" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">INPUT</text>
  <line x1="275" y1="110" x2="320" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#aIPT)"/>

  <rect x="320" y="85" width="130" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="385" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">[Local Process]</text>
  <text x="385" y="125" text-anchor="middle" font-size="10" fill="#555">Application</text>
  <line x1="450" y1="110" x2="485" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#aIPT)"/>

  <rect x="485" y="90" width="80" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="525" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">OUTPUT</text>
  <line x1="565" y1="110" x2="580" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#aIPT)"/>

  <rect x="580" y="90" width="80" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="620" y="108" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">POST</text>
  <text x="620" y="122" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">ROUTING</text>

  <!-- FORWARD chain -->
  <line x1="105" y1="130" x2="105" y2="175" stroke="#dc3545" stroke-width="2"/>
  <line x1="105" y1="175" x2="200" y2="175" stroke="#dc3545" stroke-width="2" marker-end="url(#aIPTr)"/>
  <rect x="200" y="155" width="110" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="255" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">FORWARD</text>
  <text x="255" y="210" text-anchor="middle" font-size="10" fill="#555">(routing)</text>
  <line x1="310" y1="175" x2="525" y2="175" stroke="#dc3545" stroke-width="1.5"/>
  <line x1="525" y1="175" x2="525" y2="130" stroke="#dc3545" stroke-width="1.5" marker-end="url(#aIPTr2)"/>

  <defs>
    <marker id="aIPT" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="aIPTr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="aIPTr2" markerWidth="10" markerHeight="7" refX="5" refY="0" orient="auto">
      <polygon points="0 7, 5 0, 10 7" fill="#dc3545"/>
    </marker>
  </defs>
</svg>
  <ns0:text x="1018.3814" y="77.0371" text-anchor="middle" font-size="16.5926" font-weight="bold" fill="#333">Server</ns0:text>
  <ns0:line x1="1018.3814" y1="94.8148" x2="1018.3814" y2="640" stroke="#28a745" stroke-width="1.7778" stroke-dasharray="4.7407 4.7407" />
  <ns0:line x1="203.6762" y1="118.5185" x2="1018.3814" y2="118.5185" stroke="#4a90e2" stroke-width="2.3704" marker-end="url(#aTH)" />
  <ns0:text x="611.0288" y="112.5926" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="#4a90e2">ClientHello</ns0:text>
  <ns0:text x="611.0288" y="132.7408" text-anchor="middle" font-size="11.8519" fill="#555">TLS version, cipher suites, client random</ns0:text>
  <ns0:line x1="1018.3814" y1="165.9259" x2="203.6762" y2="165.9259" stroke="#28a745" stroke-width="2.3704" marker-end="url(#aTH2)" />
  <ns0:text x="611.0288" y="160" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="#28a745">ServerHello</ns0:text>
  <ns0:text x="611.0288" y="183.7037" text-anchor="middle" font-size="11.8519" fill="#555">chosen cipher, server random</ns0:text>
  <ns0:line x1="1018.3814" y1="207.4074" x2="203.6762" y2="207.4074" stroke="#28a745" stroke-width="2.3704" marker-end="url(#aTH2)" />
  <ns0:text x="611.0288" y="201.4815" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="#28a745">Certificate</ns0:text>
  <ns0:text x="611.0288" y="222.8148" text-anchor="middle" font-size="11.8519" fill="#555">server's X.509 certificate</ns0:text>
  <ns0:line x1="1018.3814" y1="248.8889" x2="203.6762" y2="248.8889" stroke="#28a745" stroke-width="2.3704" marker-end="url(#aTH2)" />
  <ns0:text x="611.0288" y="242.963" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="#28a745">ServerKeyExchange</ns0:text>
  <ns0:line x1="1018.3814" y1="284.4444" x2="203.6762" y2="284.4444" stroke="#28a745" stroke-width="2.3704" marker-end="url(#aTH2)" />
  <ns0:text x="611.0288" y="278.5185" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="#28a745">ServerHelloDone</ns0:text>
  <ns0:line x1="203.6762" y1="331.8519" x2="1018.3814" y2="331.8519" stroke="#4a90e2" stroke-width="2.3704" marker-end="url(#aTH)" />
  <ns0:text x="611.0288" y="325.9259" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="#4a90e2">ClientKeyExchange</ns0:text>
  <ns0:text x="611.0288" y="349.6296" text-anchor="middle" font-size="11.8519" fill="#555">pre-master secret, encrypted</ns0:text>
  <ns0:line x1="203.6762" y1="379.2593" x2="1018.3814" y2="379.2593" stroke="#4a90e2" stroke-width="2.3704" marker-end="url(#aTH)" />
  <ns0:text x="611.0288" y="373.3334" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="#4a90e2">ChangeCipherSpec</ns0:text>
  <ns0:line x1="203.6762" y1="420.7408" x2="1018.3814" y2="420.7408" stroke="#4a90e2" stroke-width="2.3704" marker-end="url(#aTH)" />
  <ns0:text x="611.0288" y="414.8149" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="#4a90e2">Finished (encrypted)</ns0:text>
  <ns0:line x1="1018.3814" y1="462.2222" x2="203.6762" y2="462.2222" stroke="#28a745" stroke-width="2.3704" marker-end="url(#aTH2)" />

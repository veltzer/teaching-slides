<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="611.0288" y="29.6296" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="#333">TLS 1.2 Handshake</ns0:text>

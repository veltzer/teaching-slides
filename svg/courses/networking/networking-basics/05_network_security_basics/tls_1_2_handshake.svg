  <ns0:line x1="1018.3814" y1="503.7037" x2="203.6762" y2="503.7037" stroke="#28a745" stroke-width="2.3704" marker-end="url(#aTH2)" />
  <ns0:text x="611.0288" y="497.7778" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="#28a745">Finished (encrypted)</ns0:text>
  <ns0:rect x="162.9411" y="545.1852" width="896.1757" height="41.4815" rx="5.9259" fill="#d4edda" stroke="#28a745" stroke-width="2.3704" />
  <ns0:text x="611.0288" y="571.2593" text-anchor="middle" font-size="15.4074" font-weight="bold" fill="#28a745">Encrypted Application Data</ns0:text>
  <ns0:text x="611.0288" y="616.2963" text-anchor="middle" font-size="14.2223" fill="#555">2 round trips before first application data</ns0:text>

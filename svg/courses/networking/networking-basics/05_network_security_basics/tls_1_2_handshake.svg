<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="611.0288" y="29.6296" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text)">TLS 1.2 Handshake</text>
  <rect x="101.8382" y="47.4074" width="203.6762" height="47.4074" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="203.6762" y="77.0371" text-anchor="middle" font-size="16.5926" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="203.6762" y1="94.8148" x2="203.6762" y2="640" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="4.7407 4.7407" />
  <rect x="916.5432" y="47.4074" width="203.6762" height="47.4074" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1018.3814" y="77.0371" text-anchor="middle" font-size="16.5926" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="1018.3814" y1="94.8148" x2="1018.3814" y2="640" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="4.7407 4.7407" />
  <line x1="203.6762" y1="118.5185" x2="1018.3814" y2="118.5185" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="611.0288" y="112.5926" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--primary-accent)">ClientHello</text>
  <text x="611.0288" y="132.7408" text-anchor="middle" font-size="11.8519" fill="var(--text-muted)">TLS version, cipher suites, client random</text>
  <line x1="1018.3814" y1="165.9259" x2="203.6762" y2="165.9259" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="160" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-accent)">ServerHello</text>
  <text x="611.0288" y="183.7037" text-anchor="middle" font-size="11.8519" fill="var(--text-muted)">chosen cipher, server random</text>
  <line x1="1018.3814" y1="207.4074" x2="203.6762" y2="207.4074" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="201.4815" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-accent)">Certificate</text>
  <text x="611.0288" y="222.8148" text-anchor="middle" font-size="11.8519" fill="var(--text-muted)">server's X.509 certificate</text>
  <line x1="1018.3814" y1="248.8889" x2="203.6762" y2="248.8889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="242.963" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-accent)">ServerKeyExchange</text>
  <line x1="1018.3814" y1="284.4444" x2="203.6762" y2="284.4444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="278.5185" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-accent)">ServerHelloDone</text>
  <line x1="203.6762" y1="331.8519" x2="1018.3814" y2="331.8519" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="611.0288" y="325.9259" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--primary-accent)">ClientKeyExchange</text>
  <text x="611.0288" y="349.6296" text-anchor="middle" font-size="11.8519" fill="var(--text-muted)">pre-master secret, encrypted</text>
  <line x1="203.6762" y1="379.2593" x2="1018.3814" y2="379.2593" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="611.0288" y="373.3334" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--primary-accent)">ChangeCipherSpec</text>
  <line x1="203.6762" y1="420.7408" x2="1018.3814" y2="420.7408" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="611.0288" y="414.8149" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--primary-accent)">Finished (encrypted)</text>
  <line x1="1018.3814" y1="462.2222" x2="203.6762" y2="462.2222" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="456.2963" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-accent)">ChangeCipherSpec</text>
  <line x1="1018.3814" y1="503.7037" x2="203.6762" y2="503.7037" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="497.7778" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-accent)">Finished (encrypted)</text>
  <rect x="162.9411" y="545.1852" width="896.1757" height="41.4815" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="611.0288" y="571.2593" text-anchor="middle" font-size="15.4074" font-weight="bold" fill="var(--ok-accent)">Encrypted Application Data</text>
  <text x="611.0288" y="616.2963" text-anchor="middle" font-size="14.2223" fill="var(--text-muted)">2 round trips before first application data</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="22.5741" font-weight="bold" fill="var(--text)">TLS 1.2 Handshake</text>
  <rect x="40" y="56.8932" width="240" height="45.0485" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.9999" y="85.0486" text-anchor="middle" font-size="17.5577" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="159.9999" y1="101.9418" x2="159.9999" y2="620" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="4.7407 4.7407" />
  <rect x="1000" y="56.8932" width="240" height="45.0485" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.0001" y="85.0486" text-anchor="middle" font-size="17.5577" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="1120.0001" y1="101.9418" x2="1120.0001" y2="620" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="4.7407 4.7407" />
  <line x1="159.9999" y1="124.466" x2="1120.0001" y2="124.466" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="118.835" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--primary-accent)">ClientHello</text>
  <text x="640" y="137.9807" text-anchor="middle" font-size="12.5412" fill="var(--text-muted)">TLS version, cipher suites, client random</text>
  <line x1="1120.0001" y1="169.5146" x2="159.9999" y2="169.5146" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="640" y="163.8835" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--ok-accent)">ServerHello</text>
  <text x="640" y="186.4078" text-anchor="middle" font-size="12.5412" fill="var(--text-muted)">chosen cipher, server random</text>
  <line x1="1120.0001" y1="208.9321" x2="159.9999" y2="208.9321" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="640" y="203.301" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--ok-accent)">Certificate</text>
  <text x="640" y="223.5728" text-anchor="middle" font-size="12.5412" fill="var(--text-muted)">server's X.509 certificate</text>
  <line x1="1120.0001" y1="248.3495" x2="159.9999" y2="248.3495" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="640" y="242.7185" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--ok-accent)">ServerKeyExchange</text>
  <line x1="1120.0001" y1="282.1359" x2="159.9999" y2="282.1359" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="640" y="276.5049" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--ok-accent)">ServerHelloDone</text>
  <line x1="159.9999" y1="327.1845" x2="1120.0001" y2="327.1845" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="321.5534" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--primary-accent)">ClientKeyExchange</text>
  <text x="640" y="344.0777" text-anchor="middle" font-size="12.5412" fill="var(--text-muted)">pre-master secret, encrypted</text>
  <line x1="159.9999" y1="372.2331" x2="1120.0001" y2="372.2331" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="366.602" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--primary-accent)">ChangeCipherSpec</text>
  <line x1="159.9999" y1="411.6506" x2="1120.0001" y2="411.6506" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="406.0195" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--primary-accent)">Finished (encrypted)</text>
  <line x1="1120.0001" y1="451.0679" x2="159.9999" y2="451.0679" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="640" y="445.4369" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--ok-accent)">ChangeCipherSpec</text>
  <line x1="1120.0001" y1="490.4854" x2="159.9999" y2="490.4854" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="640" y="484.8544" text-anchor="middle" font-size="15.0495" font-weight="bold" fill="var(--ok-accent)">Finished (encrypted)</text>
  <rect x="112" y="529.9029" width="1056.0003" height="39.4175" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="554.6797" text-anchor="middle" font-size="16.3035" font-weight="bold" fill="var(--ok-accent)">Encrypted Application Data</text>
  <text x="640" y="597.4757" text-anchor="middle" font-size="15.0495" fill="var(--text-muted)">2 round trips before first application data</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="611.0288" y="29.6296" text-anchor="middle" font-size="21.3333" font-weight="bold" fill="var(--text-dark)">TLS 1.2 Handshake</text>
  <rect x="101.8382" y="47.4074" width="203.6762" height="47.4074" rx="5.9259" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.3704" />
  <text x="203.6762" y="77.0371" text-anchor="middle" font-size="16.5926" font-weight="bold" fill="var(--text-dark)">Client</text>
  <line x1="203.6762" y1="94.8148" x2="203.6762" y2="640" stroke="var(--primary-bright)" stroke-width="1.7778" stroke-dasharray="4.7407 4.7407" />
  <rect x="916.5432" y="47.4074" width="203.6762" height="47.4074" rx="5.9259" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.3704" />
  <text x="1018.3814" y="77.0371" text-anchor="middle" font-size="16.5926" font-weight="bold" fill="var(--text-dark)">Server</text>
  <line x1="1018.3814" y1="94.8148" x2="1018.3814" y2="640" stroke="var(--ok-bright)" stroke-width="1.7778" stroke-dasharray="4.7407 4.7407" />
  <line x1="203.6762" y1="118.5185" x2="1018.3814" y2="118.5185" stroke="var(--primary-bright)" stroke-width="2.3704" marker-end="url(#arrow-primary)" />
  <text x="611.0288" y="112.5926" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--primary-bright)">ClientHello</text>
  <text x="611.0288" y="132.7408" text-anchor="middle" font-size="11.8519" fill="var(--text-muted)">TLS version, cipher suites, client random</text>
  <line x1="1018.3814" y1="165.9259" x2="203.6762" y2="165.9259" stroke="var(--ok-bright)" stroke-width="2.3704" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="160" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-bright)">ServerHello</text>
  <text x="611.0288" y="183.7037" text-anchor="middle" font-size="11.8519" fill="var(--text-muted)">chosen cipher, server random</text>
  <line x1="1018.3814" y1="207.4074" x2="203.6762" y2="207.4074" stroke="var(--ok-bright)" stroke-width="2.3704" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="201.4815" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-bright)">Certificate</text>
  <text x="611.0288" y="222.8148" text-anchor="middle" font-size="11.8519" fill="var(--text-muted)">server's X.509 certificate</text>
  <line x1="1018.3814" y1="248.8889" x2="203.6762" y2="248.8889" stroke="var(--ok-bright)" stroke-width="2.3704" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="242.963" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-bright)">ServerKeyExchange</text>
  <line x1="1018.3814" y1="284.4444" x2="203.6762" y2="284.4444" stroke="var(--ok-bright)" stroke-width="2.3704" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="278.5185" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-bright)">ServerHelloDone</text>
  <line x1="203.6762" y1="331.8519" x2="1018.3814" y2="331.8519" stroke="var(--primary-bright)" stroke-width="2.3704" marker-end="url(#arrow-primary)" />
  <text x="611.0288" y="325.9259" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--primary-bright)">ClientKeyExchange</text>
  <text x="611.0288" y="349.6296" text-anchor="middle" font-size="11.8519" fill="var(--text-muted)">pre-master secret, encrypted</text>
  <line x1="203.6762" y1="379.2593" x2="1018.3814" y2="379.2593" stroke="var(--primary-bright)" stroke-width="2.3704" marker-end="url(#arrow-primary)" />
  <text x="611.0288" y="373.3334" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--primary-bright)">ChangeCipherSpec</text>
  <line x1="203.6762" y1="420.7408" x2="1018.3814" y2="420.7408" stroke="var(--primary-bright)" stroke-width="2.3704" marker-end="url(#arrow-primary)" />
  <text x="611.0288" y="414.8149" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--primary-bright)">Finished (encrypted)</text>
  <line x1="1018.3814" y1="462.2222" x2="203.6762" y2="462.2222" stroke="var(--ok-bright)" stroke-width="2.3704" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="456.2963" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-bright)">ChangeCipherSpec</text>
  <line x1="1018.3814" y1="503.7037" x2="203.6762" y2="503.7037" stroke="var(--ok-bright)" stroke-width="2.3704" marker-end="url(#arrow-ok)" />
  <text x="611.0288" y="497.7778" text-anchor="middle" font-size="14.2223" font-weight="bold" fill="var(--ok-bright)">Finished (encrypted)</text>
  <rect x="162.9411" y="545.1852" width="896.1757" height="41.4815" rx="5.9259" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.3704" />
  <text x="611.0288" y="571.2593" text-anchor="middle" font-size="15.4074" font-weight="bold" fill="var(--ok-bright)">Encrypted Application Data</text>
  <text x="611.0288" y="616.2963" text-anchor="middle" font-size="14.2223" fill="var(--text-muted)">2 round trips before first application data</text>
  <defs>

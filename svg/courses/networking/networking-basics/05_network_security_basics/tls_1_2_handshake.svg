<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="240" height="46.39995468" rx="6.089334918058" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="159.9999" y="69.0000618" text-anchor="middle" font-size="17.819119281797" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Client</text>
  <line x1="159.9999" y1="86.40005768" x2="159.9999" y2="620" stroke="var(--primary-border)" stroke-width="1.7778" stroke-dasharray="4.7407 4.7407"/>
  <rect x="1000" y="40" width="240" height="46.39995468" rx="6.089334918058" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120.0001" y="69.0000618" text-anchor="middle" font-size="17.819119281797" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Server</text>
  <line x1="1120.0001" y1="86.40005768" x2="1120.0001" y2="620" stroke="var(--ok-border)" stroke-width="1.7778" stroke-dasharray="4.7407 4.7407"/>
  <line x1="159.9999" y1="109.59998352" x2="1120.0001" y2="109.59998352" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="640" y="103.80005356" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ClientHello</text>
  <text x="640" y="123.520124423999" text-anchor="middle" font-size="12.727927845724" fill="var(--text-muted)" font-family="Arial, sans-serif">TLS version, cipher suites, client random</text>
  <line x1="1120.0001" y1="156.0000412" x2="159.9999" y2="156.0000412" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="150.20000824" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ServerHello</text>
  <text x="640" y="173.40003708" text-anchor="middle" font-size="12.727927845724" fill="var(--text-muted)" font-family="Arial, sans-serif">chosen cipher, server random</text>
  <line x1="1120.0001" y1="196.60006592" x2="159.9999" y2="196.60006592" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="190.80003296" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Certificate</text>
  <text x="640" y="211.679986816" text-anchor="middle" font-size="12.727927845724" fill="var(--text-muted)" font-family="Arial, sans-serif">server's X.509 certificate</text>
  <line x1="1120.0001" y1="237.19998764" x2="159.9999" y2="237.19998764" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="231.40005768" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ServerKeyExchange</text>
  <line x1="1120.0001" y1="271.9999794" x2="159.9999" y2="271.9999794" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="266.20004944" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ServerHelloDone</text>
  <line x1="159.9999" y1="318.40003708" x2="1120.0001" y2="318.40003708" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="640" y="312.60000412" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ClientKeyExchange</text>
  <text x="640" y="335.80003296" text-anchor="middle" font-size="12.727927845724" fill="var(--text-muted)" font-family="Arial, sans-serif">pre-master secret, encrypted</text>
  <line x1="159.9999" y1="364.800094759999" x2="1120.0001" y2="364.800094759999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="640" y="359.0000618" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ChangeCipherSpec</text>
  <line x1="159.9999" y1="405.400119479999" x2="1120.0001" y2="405.400119479999" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="640" y="399.600086519999" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Finished (encrypted)</text>
  <line x1="1120.0001" y1="445.9999382" x2="159.9999" y2="445.9999382" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="440.20000824" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ChangeCipherSpec</text>
  <line x1="1120.0001" y1="486.59996292" x2="159.9999" y2="486.59996292" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="480.80003296" text-anchor="middle" font-size="15.273574308218" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Finished (encrypted)</text>
  <rect x="112" y="527.19998764" width="1056.0003" height="40.60002472" rx="6.089334918058" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="552.720091463999" text-anchor="middle" font-size="16.546245306092" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Encrypted Application Data</text>
  <text x="640" y="596.79997116" text-anchor="middle" font-size="15.273574308218" fill="var(--text-muted)" font-family="Arial, sans-serif">2 round trips before first application data</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

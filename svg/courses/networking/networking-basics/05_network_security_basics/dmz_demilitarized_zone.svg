<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="300" height="580" rx="6.336706445031" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="95.769230036982" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--danger-text)" font-family="Arial, sans-serif">Internet</text>
  <text x="190" y="151.538461131657" text-anchor="middle" font-size="16.897883167788" fill="var(--danger-text)" font-family="Arial, sans-serif">Untrusted</text>
  <text x="190" y="196.15384558432" text-anchor="middle" font-size="16.897883167788" fill="var(--danger-text)" font-family="Arial, sans-serif">public traffic</text>
  <text x="190" y="330" text-anchor="middle" font-size="16.897883167788" fill="var(--danger-text)" font-family="Arial, sans-serif">browsers,</text>
  <text x="190" y="363.461537810651" text-anchor="middle" font-size="16.897883167788" fill="var(--danger-text)" font-family="Arial, sans-serif">attackers,</text>
  <text x="190" y="396.923076678994" text-anchor="middle" font-size="16.897883167788" fill="var(--danger-text)" font-family="Arial, sans-serif">scanners</text>
  <line x1="340" y1="330" x2="400" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="313.269230565828" text-anchor="middle" font-size="12.673412890062" fill="var(--text-muted)" font-family="Arial, sans-serif">FW1</text>
  <rect x="400" y="40" width="480" height="580" rx="6.336706445031" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="95.769230036982" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">DMZ</text>
  <text x="640" y="129.230768905325" text-anchor="middle" font-size="14.785648028925" fill="var(--warn-text)" font-family="Arial, sans-serif">public-facing hosts</text>
  <rect x="440" y="173.846153357988" width="400" height="111.538461131657" rx="6.336706445031" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="224.038461660503" text-anchor="middle" font-size="21.122354473956" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Web Server</text>
  <text x="640" y="257.499999471154" text-anchor="middle" font-size="14.785648028925" fill="var(--text-muted)" font-family="Arial, sans-serif">exposed, hardened</text>
  <rect x="440" y="330" width="400" height="111.538461131657" rx="6.336706445031" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="380.192307244822" text-anchor="middle" font-size="21.122354473956" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Mail Server</text>
  <text x="640" y="413.653846113166" text-anchor="middle" font-size="14.785648028925" fill="var(--text-muted)" font-family="Arial, sans-serif">exposed, hardened</text>
  <rect x="440" y="486.15384558432" width="400" height="111.538461131657" rx="6.336706445031" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="536.346153886834" text-anchor="middle" font-size="21.122354473956" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">DNS Server</text>
  <text x="640" y="569.807692755177" text-anchor="middle" font-size="14.785648028925" fill="var(--text-muted)" font-family="Arial, sans-serif">exposed, hardened</text>
  <line x1="880" y1="330" x2="940" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="910" y="313.269230565828" text-anchor="middle" font-size="12.673412890062" fill="var(--text-muted)" font-family="Arial, sans-serif">FW2</text>
  <rect x="940" y="40" width="300" height="580" rx="6.336706445031" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="95.769230036982" text-anchor="middle" font-size="25.346824751682" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Internal</text>
  <text x="1090" y="129.230768905325" text-anchor="middle" font-size="16.897883167788" fill="var(--ok-text)" font-family="Arial, sans-serif">Trusted LAN</text>
  <text x="1090" y="218.461537810651" text-anchor="middle" font-size="16.897883167788" fill="var(--ok-text)" font-family="Arial, sans-serif">Databases</text>
  <text x="1090" y="285.384615547337" text-anchor="middle" font-size="16.897883167788" fill="var(--ok-text)" font-family="Arial, sans-serif">App servers</text>
  <text x="1090" y="352.307692226331" text-anchor="middle" font-size="16.897883167788" fill="var(--ok-text)" font-family="Arial, sans-serif">Workstations</text>
  <text x="1090" y="441.538461131657" text-anchor="middle" font-size="14.785648028925" fill="var(--ok-text)" font-family="Arial, sans-serif">no direct</text>
  <text x="1090" y="469.42307720784" text-anchor="middle" font-size="14.785648028925" fill="var(--ok-text)" font-family="Arial, sans-serif">internet access</text>
</svg>

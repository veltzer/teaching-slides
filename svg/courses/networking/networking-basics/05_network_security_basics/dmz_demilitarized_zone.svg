<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="70" text-anchor="middle" font-size="28" font-weight="bold" fill="var(--text)">DMZ: Demilitarized Zone</text>
  <rect x="40" y="100" width="300" height="520" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="190" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--danger-text)">Internet</text>
  <text x="190" y="200" text-anchor="middle" font-size="16" fill="var(--danger-text)">Untrusted</text>
  <text x="190" y="240" text-anchor="middle" font-size="16" fill="var(--danger-text)">public traffic</text>
  <text x="190" y="360" text-anchor="middle" font-size="16" fill="var(--danger-text)">browsers,</text>
  <text x="190" y="390" text-anchor="middle" font-size="16" fill="var(--danger-text)">attackers,</text>
  <text x="190" y="420" text-anchor="middle" font-size="16" fill="var(--danger-text)">scanners</text>
  <line x1="340" y1="360" x2="400" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="345" text-anchor="middle" font-size="12" fill="var(--text-muted)">FW1</text>
  <rect x="400" y="100" width="480" height="520" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--warn-text)">DMZ</text>
  <text x="640" y="180" text-anchor="middle" font-size="14" fill="var(--warn-text)">public-facing hosts</text>
  <rect x="440" y="220" width="400" height="100" rx="6" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="265" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)">Web Server</text>
  <text x="640" y="295" text-anchor="middle" font-size="14" fill="var(--text-muted)">exposed, hardened</text>
  <rect x="440" y="360" width="400" height="100" rx="6" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="405" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)">Mail Server</text>
  <text x="640" y="435" text-anchor="middle" font-size="14" fill="var(--text-muted)">exposed, hardened</text>
  <rect x="440" y="500" width="400" height="100" rx="6" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="545" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)">DNS Server</text>
  <text x="640" y="575" text-anchor="middle" font-size="14" fill="var(--text-muted)">exposed, hardened</text>
  <line x1="880" y1="360" x2="940" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="910" y="345" text-anchor="middle" font-size="12" fill="var(--text-muted)">FW2</text>
  <rect x="940" y="100" width="300" height="520" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="150" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--ok-text)">Internal</text>
  <text x="1090" y="180" text-anchor="middle" font-size="16" fill="var(--ok-text)">Trusted LAN</text>
  <text x="1090" y="260" text-anchor="middle" font-size="16" fill="var(--ok-text)">Databases</text>
  <text x="1090" y="320" text-anchor="middle" font-size="16" fill="var(--ok-text)">App servers</text>
  <text x="1090" y="380" text-anchor="middle" font-size="16" fill="var(--ok-text)">Workstations</text>
  <text x="1090" y="460" text-anchor="middle" font-size="14" fill="var(--ok-text)">no direct</text>
  <text x="1090" y="485" text-anchor="middle" font-size="14" fill="var(--ok-text)">internet access</text>
</svg>

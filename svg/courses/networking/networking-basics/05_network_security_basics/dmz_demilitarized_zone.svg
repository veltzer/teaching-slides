<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="28.753498" font-weight="bold" fill="var(--text)">DMZ: Demilitarized Zone</text>
  <rect x="40" y="71.636364" width="300" height="548.363636" rx="6.161464" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="190" y="124.363636" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--danger-text)">Internet</text>
  <text x="190" y="177.090909" text-anchor="middle" font-size="16.43057" fill="var(--danger-text)">Untrusted</text>
  <text x="190" y="219.272727" text-anchor="middle" font-size="16.43057" fill="var(--danger-text)">public traffic</text>
  <text x="190" y="345.818182" text-anchor="middle" font-size="16.43057" fill="var(--danger-text)">browsers,</text>
  <text x="190" y="377.454545" text-anchor="middle" font-size="16.43057" fill="var(--danger-text)">attackers,</text>
  <text x="190" y="409.090909" text-anchor="middle" font-size="16.43057" fill="var(--danger-text)">scanners</text>
  <line x1="340" y1="345.818182" x2="400" y2="345.818182" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="330" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)">FW1</text>
  <rect x="400" y="71.636364" width="480" height="548.363636" rx="6.161464" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="124.363636" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--warn-text)">DMZ</text>
  <text x="640" y="156" text-anchor="middle" font-size="14.376749" fill="var(--warn-text)">public-facing hosts</text>
  <rect x="440" y="198.181818" width="400" height="105.454545" rx="6.161464" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="245.636364" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)">Web Server</text>
  <text x="640" y="277.272727" text-anchor="middle" font-size="14.376749" fill="var(--text-muted)">exposed, hardened</text>
  <rect x="440" y="345.818182" width="400" height="105.454545" rx="6.161464" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="393.272727" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)">Mail Server</text>
  <text x="640" y="424.909091" text-anchor="middle" font-size="14.376749" fill="var(--text-muted)">exposed, hardened</text>
  <rect x="440" y="493.454545" width="400" height="105.454545" rx="6.161464" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="540.909091" text-anchor="middle" font-size="20.538213" font-weight="bold" fill="var(--text)">DNS Server</text>
  <text x="640" y="572.545455" text-anchor="middle" font-size="14.376749" fill="var(--text-muted)">exposed, hardened</text>
  <line x1="880" y1="345.818182" x2="940" y2="345.818182" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="910" y="330" text-anchor="middle" font-size="12.322928" fill="var(--text-muted)">FW2</text>
  <rect x="940" y="71.636364" width="300" height="548.363636" rx="6.161464" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="124.363636" text-anchor="middle" font-size="24.645855" font-weight="bold" fill="var(--ok-text)">Internal</text>
  <text x="1090" y="156" text-anchor="middle" font-size="16.43057" fill="var(--ok-text)">Trusted LAN</text>
  <text x="1090" y="240.363636" text-anchor="middle" font-size="16.43057" fill="var(--ok-text)">Databases</text>
  <text x="1090" y="303.636364" text-anchor="middle" font-size="16.43057" fill="var(--ok-text)">App servers</text>
  <text x="1090" y="366.909091" text-anchor="middle" font-size="16.43057" fill="var(--ok-text)">Workstations</text>
  <text x="1090" y="451.272727" text-anchor="middle" font-size="14.376749" fill="var(--ok-text)">no direct</text>
  <text x="1090" y="477.636364" text-anchor="middle" font-size="14.376749" fill="var(--ok-text)">internet access</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="40" text-anchor="middle" font-size="22.4521" font-weight="bold" fill="var(--text)">DMZ (Demilitarized Zone)</text>
  <rect x="420.4643" y="58.7096" width="439.0715" height="49.8924" rx="6.0001" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640.0001" y="89.8925" text-anchor="middle" font-size="17.4628" font-weight="bold" fill="var(--danger-accent)">Internet</text>
  <line x1="640.0001" y1="108.6021" x2="640.0001" y2="139.7849" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="371.6785" y="139.7849" width="536.6429" height="56.129" rx="6.0001" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="174.7096" text-anchor="middle" font-size="17.4628" font-weight="bold" fill="var(--danger-accent)">Outer Firewall</text>
  <line x1="640.0001" y1="195.9139" x2="640.0001" y2="227.0968" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)" />
  <rect x="298.5" y="227.0968" width="683" height="137.2043" rx="6.0001" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="258.2796" text-anchor="middle" font-size="17.4628" font-weight="bold" fill="var(--primary-accent)">DMZ</text>
  <text x="444.8572" y="289.4623" text-anchor="middle" font-size="14.9681" fill="var(--text-muted)">Web Server</text>
  <text x="640.0001" y="289.4623" text-anchor="middle" font-size="14.9681" fill="var(--text-muted)">Mail Server</text>
  <text x="835.1429" y="289.4623" text-anchor="middle" font-size="14.9681" fill="var(--text-muted)">DNS Server</text>
  <rect x="347.2858" y="270.7527" width="195.1429" height="31.1829" rx="6.0001" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="1.2929" />
  <rect x="566.8214" y="270.7527" width="195.1429" height="31.1829" rx="6.0001" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="1.2929" />
  <rect x="786.3572" y="270.7527" width="170.7501" height="31.1829" rx="6.0001" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="1.2929" />
  <text x="444.8572" y="291.957" text-anchor="middle" font-size="13.7207" fill="var(--text-muted)">Web</text>
  <text x="664.3928" y="291.957" text-anchor="middle" font-size="13.7207" fill="var(--text-muted)">Mail</text>
  <text x="871.7322" y="291.957" text-anchor="middle" font-size="13.7207" fill="var(--text-muted)">DNS</text>
  <line x1="640.0001" y1="364.3011" x2="640.0001" y2="395.4838" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)" />
  <rect x="371.6785" y="395.4838" width="536.6429" height="56.129" rx="6.0001" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="430.4086" text-anchor="middle" font-size="17.4628" font-weight="bold" fill="var(--danger-accent)">Inner Firewall</text>
  <line x1="640.0001" y1="451.6129" x2="640.0001" y2="482.7957" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="298.5" y="482.7957" width="683" height="137.2043" rx="6.0001" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="513.9785" text-anchor="middle" font-size="17.4628" font-weight="bold" fill="var(--ok-accent)">Internal Network</text>
  <rect x="347.2858" y="526.4516" width="195.1429" height="31.1829" rx="6.0001" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="1.2929" />
  <rect x="566.8214" y="526.4516" width="195.1429" height="31.1829" rx="6.0001" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="1.2929" />
  <rect x="786.3572" y="526.4516" width="170.7501" height="31.1829" rx="6.0001" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="1.2929" />
  <text x="444.8572" y="547.6559" text-anchor="middle" font-size="13.7207" fill="var(--text-muted)">Database</text>
  <text x="664.3928" y="547.6559" text-anchor="middle" font-size="13.7207" fill="var(--text-muted)">App Srv</text>
  <text x="871.7322" y="547.6559" text-anchor="middle" font-size="13.7207" fill="var(--text-muted)">Workst.</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" font-family="Arial, sans-serif">
  <text x="250" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">DMZ (Demilitarized Zone)</text>
  <!-- Internet -->
  <rect x="160" y="45" width="180" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="250" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Internet</text>
  <!-- Arrow -->
  <line x1="250" y1="85" x2="250" y2="110" stroke="#dc3545" stroke-width="2" marker-end="url(#aDMZ)"/>
  <!-- Outer Firewall -->
  <rect x="140" y="110" width="220" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="250" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Outer Firewall</text>
  <!-- Arrow -->
  <line x1="250" y1="155" x2="250" y2="180" stroke="#ffc107" stroke-width="2" marker-end="url(#aDMZy)"/>
  <!-- DMZ -->
  <rect x="110" y="180" width="280" height="110" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="250" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">DMZ</text>
  <text x="170" y="230" text-anchor="middle" font-size="12" fill="#555">Web Server</text>
  <text x="250" y="230" text-anchor="middle" font-size="12" fill="#555">Mail Server</text>
  <text x="330" y="230" text-anchor="middle" font-size="12" fill="#555">DNS Server</text>
  <rect x="130" y="215" width="80" height="25" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <rect x="220" y="215" width="80" height="25" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <rect x="310" y="215" width="70" height="25" rx="3" fill="#fff" stroke="#4a90e2" stroke-width="1"/>
  <text x="170" y="232" text-anchor="middle" font-size="11" fill="#555">Web</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#555">Mail</text>
  <text x="345" y="232" text-anchor="middle" font-size="11" fill="#555">DNS</text>
  <!-- Arrow -->
  <line x1="250" y1="290" x2="250" y2="315" stroke="#ffc107" stroke-width="2" marker-end="url(#aDMZy)"/>
  <!-- Inner Firewall -->
  <rect x="140" y="315" width="220" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="250" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#856404">Inner Firewall</text>
  <!-- Arrow -->
  <line x1="250" y1="360" x2="250" y2="385" stroke="#28a745" stroke-width="2" marker-end="url(#aDMZg)"/>
  <!-- Internal Network -->
  <rect x="110" y="385" width="280" height="110" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="250" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Internal Network</text>
  <rect x="130" y="420" width="80" height="25" rx="3" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <rect x="220" y="420" width="80" height="25" rx="3" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <rect x="310" y="420" width="70" height="25" rx="3" fill="#fff" stroke="#28a745" stroke-width="1"/>
  <text x="170" y="437" text-anchor="middle" font-size="11" fill="#555">Database</text>
  <text x="260" y="437" text-anchor="middle" font-size="11" fill="#555">App Srv</text>
  <text x="345" y="437" text-anchor="middle" font-size="11" fill="#555">Workst.</text>
  <defs>
    <marker id="aDMZ" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="aDMZy" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffc107"/>
    </marker>
    <marker id="aDMZg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
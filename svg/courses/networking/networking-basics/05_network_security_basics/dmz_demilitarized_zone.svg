<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="632.0988" y="38.7879" text-anchor="middle" font-size="23.2727" font-weight="bold" fill="var(--text)">DMZ (Demilitarized Zone)</text>
  <rect x="404.5432" y="58.1818" width="455.1111" height="51.7171" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="632.0988" y="90.5051" text-anchor="middle" font-size="18.101" font-weight="bold" fill="var(--danger-accent)">Internet</text>
  <line x1="632.0988" y1="109.899" x2="632.0988" y2="142.2222" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="353.9753" y="142.2222" width="556.2469" height="58.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="632.0988" y="178.4242" text-anchor="middle" font-size="18.101" font-weight="bold" fill="var(--danger-accent)">Outer Firewall</text>
  <line x1="632.0988" y1="200.404" x2="632.0988" y2="232.7273" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)" />
  <rect x="278.1235" y="232.7273" width="707.9506" height="142.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="632.0988" y="265.0505" text-anchor="middle" font-size="18.101" font-weight="bold" fill="var(--primary-accent)">DMZ</text>
  <text x="429.8272" y="297.3737" text-anchor="middle" font-size="15.5152" fill="var(--text-muted)">Web Server</text>
  <text x="632.0988" y="297.3737" text-anchor="middle" font-size="15.5152" fill="var(--text-muted)">Mail Server</text>
  <text x="834.3704" y="297.3737" text-anchor="middle" font-size="15.5152" fill="var(--text-muted)">DNS Server</text>
  <rect x="328.6914" y="277.9798" width="202.2716" height="32.3233" rx="6" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="1.2929" />
  <rect x="556.2469" y="277.9798" width="202.2716" height="32.3233" rx="6" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="1.2929" />
  <rect x="783.8025" y="277.9798" width="176.9877" height="32.3233" rx="6" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="1.2929" />
  <text x="429.8272" y="299.9596" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Web</text>
  <text x="657.3827" y="299.9596" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Mail</text>
  <text x="872.2963" y="299.9596" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">DNS</text>
  <line x1="632.0988" y1="374.9495" x2="632.0988" y2="407.2727" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)" />
  <rect x="353.9753" y="407.2727" width="556.2469" height="58.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="632.0988" y="443.4748" text-anchor="middle" font-size="18.101" font-weight="bold" fill="var(--danger-accent)">Inner Firewall</text>
  <line x1="632.0988" y1="465.4545" x2="632.0988" y2="497.7778" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="278.1235" y="497.7778" width="707.9506" height="142.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="632.0988" y="530.101" text-anchor="middle" font-size="18.101" font-weight="bold" fill="var(--ok-accent)">Internal Network</text>
  <rect x="328.6914" y="543.0303" width="202.2716" height="32.3233" rx="6" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="1.2929" />
  <rect x="556.2469" y="543.0303" width="202.2716" height="32.3233" rx="6" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="1.2929" />
  <rect x="783.8025" y="543.0303" width="176.9877" height="32.3233" rx="6" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="1.2929" />
  <text x="429.8272" y="565.0101" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Database</text>
  <text x="657.3827" y="565.0101" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">App Srv</text>
  <text x="872.2963" y="565.0101" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Workst.</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
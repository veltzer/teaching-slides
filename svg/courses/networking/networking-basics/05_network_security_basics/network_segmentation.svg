<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999945" y="40" text-anchor="middle" font-size="28.247009905934" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Corporate Network</text>
  <rect x="40" y="71.636425652894" width="359.999967" height="210.909179504133" rx="6.945502134507" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0000385" y="124.363720528926" text-anchor="middle" font-size="26.22934153586" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">VLAN 10</text>
  <text x="220.0000385" y="166.545580793389" text-anchor="middle" font-size="24.211788924154" fill="var(--text)" font-family="Arial, sans-serif">Office</text>
  <text x="220.0000385" y="208.72731923967" text-anchor="middle" font-size="22.194004795711" fill="var(--text-muted)" font-family="Arial, sans-serif">10.10.0.0/24</text>
  <rect x="460.0000165" y="71.636425652894" width="359.999967" height="210.909179504133" rx="6.945502134507" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.999945" y="124.363720528926" text-anchor="middle" font-size="26.22934153586" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">VLAN 20</text>
  <text x="639.999945" y="166.545580793389" text-anchor="middle" font-size="24.211788924154" fill="var(--text)" font-family="Arial, sans-serif">Development</text>
  <text x="639.999945" y="208.72731923967" text-anchor="middle" font-size="22.194004795711" fill="var(--text-muted)" font-family="Arial, sans-serif">10.20.0.0/24</text>
  <rect x="880.000033" y="71.636425652894" width="359.999967" height="210.909179504133" rx="6.945502134507" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.9999615" y="124.363720528926" text-anchor="middle" font-size="26.22934153586" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">VLAN 30</text>
  <text x="1059.9999615" y="166.545580793389" text-anchor="middle" font-size="24.211788924154" fill="var(--text)" font-family="Arial, sans-serif">Production</text>
  <text x="1059.9999615" y="208.72731923967" text-anchor="middle" font-size="22.194004795711" fill="var(--text-muted)" font-family="Arial, sans-serif">10.30.0.0/24</text>
  <line x1="220.0000385" y1="282.545483338843" x2="220.0000385" y2="377.45463847934" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="639.999945" y1="282.545483338843" x2="639.999945" y2="377.45463847934" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="1059.9999615" y1="282.545483338843" x2="1059.9999615" y2="377.45463847934" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="220.0000385" y1="377.45463847934" x2="440.000036666666" y2="440.727367966943" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="639.999945" y1="377.45463847934" x2="440.000036666666" y2="440.727367966943" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="639.999945" y1="377.45463847934" x2="840.000073333333" y2="440.727367966943" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="1059.9999615" y1="377.45463847934" x2="840.000073333333" y2="440.727367966943" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="279.999978" y="440.727367966943" width="320.000007333333" height="105.454467933884" rx="6.945502134507" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440.000036666666" y="503.999975636364" text-anchor="middle" font-size="26.22934153586" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Firewall Rules</text>
  <rect x="680.000014666667" y="440.727367966943" width="320.000007333333" height="105.454467933884" rx="6.945502134507" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840.000073333333" y="503.999975636364" text-anchor="middle" font-size="26.22934153586" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">Firewall Rules</text>
  <text x="639.999945" y="620" text-anchor="middle" font-size="24.211788924154" fill="var(--text-muted)" font-family="Arial, sans-serif">Each VLAN is isolated; traffic between VLANs must pass through firewall rules</text>
</svg>

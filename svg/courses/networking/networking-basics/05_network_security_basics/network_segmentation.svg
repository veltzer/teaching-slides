<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="Arial, sans-serif">
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Network Segmentation with VLANs</text>
  <!-- Corporate Network container -->
  <rect x="20" y="45" width="660" height="320" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Corporate Network</text>
  <!-- VLAN 10 -->
  <rect x="50" y="85" width="180" height="100" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">VLAN 10</text>
  <text x="140" y="130" text-anchor="middle" font-size="12" fill="#333">Office</text>
  <text x="140" y="150" text-anchor="middle" font-size="11" fill="#555">10.10.0.0/24</text>
  <!-- VLAN 20 -->
  <rect x="260" y="85" width="180" height="100" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">VLAN 20</text>
  <text x="350" y="130" text-anchor="middle" font-size="12" fill="#333">Development</text>
  <text x="350" y="150" text-anchor="middle" font-size="11" fill="#555">10.20.0.0/24</text>
  <!-- VLAN 30 -->
  <rect x="470" y="85" width="180" height="100" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="560" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">VLAN 30</text>
  <text x="560" y="130" text-anchor="middle" font-size="12" fill="#333">Production</text>
  <text x="560" y="150" text-anchor="middle" font-size="11" fill="#555">10.30.0.0/24</text>
  <!-- Lines down to firewalls -->
  <line x1="140" y1="185" x2="140" y2="230" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="350" y1="185" x2="350" y2="230" stroke="#28a745" stroke-width="1.5"/>
  <line x1="560" y1="185" x2="560" y2="230" stroke="#ffc107" stroke-width="1.5"/>
  <line x1="140" y1="230" x2="250" y2="260" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="350" y1="230" x2="250" y2="260" stroke="#28a745" stroke-width="1.5"/>
  <line x1="350" y1="230" x2="450" y2="260" stroke="#28a745" stroke-width="1.5"/>
  <line x1="560" y1="230" x2="450" y2="260" stroke="#ffc107" stroke-width="1.5"/>
  <!-- Firewalls -->
  <rect x="170" y="260" width="160" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="250" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Firewall Rules</text>
  <rect x="370" y="260" width="160" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="450" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Firewall Rules</text>
  <!-- Note -->
  <text x="350" y="345" text-anchor="middle" font-size="12" fill="#555">Each VLAN is isolated; traffic between VLANs must pass through firewall rules</text>
</svg>
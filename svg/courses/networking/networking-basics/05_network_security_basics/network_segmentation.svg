<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="592.2678" y="52.6027" text-anchor="middle" font-size="30.4595" font-weight="bold" fill="var(--text)">Network Segmentation with VLANs</text>
  <rect x="33.8439" y="78.9041" width="1116.8479" height="561.0959" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="592.2678" y="122.7397" text-anchor="middle" font-size="23.6907" font-weight="bold" fill="var(--primary-accent)">Corporate Network</text>
  <rect x="84.6097" y="149.0411" width="304.5949" height="175.3425" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="236.9071" y="192.8767" text-anchor="middle" font-size="21.9985" font-weight="bold" fill="var(--primary-accent)">VLAN 10</text>
  <text x="236.9071" y="227.9452" text-anchor="middle" font-size="20.3064" fill="var(--text)">Office</text>
  <text x="236.9071" y="263.0137" text-anchor="middle" font-size="18.6141" fill="var(--text-muted)">10.10.0.0/24</text>
  <rect x="439.9704" y="149.0411" width="304.5949" height="175.3425" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="592.2678" y="192.8767" text-anchor="middle" font-size="21.9985" font-weight="bold" fill="var(--ok-accent)">VLAN 20</text>
  <text x="592.2678" y="227.9452" text-anchor="middle" font-size="20.3064" fill="var(--text)">Development</text>
  <text x="592.2678" y="263.0137" text-anchor="middle" font-size="18.6141" fill="var(--text-muted)">10.20.0.0/24</text>
  <rect x="795.3311" y="149.0411" width="304.5949" height="175.3425" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="947.6285" y="192.8767" text-anchor="middle" font-size="21.9985" font-weight="bold" fill="var(--danger-accent)">VLAN 30</text>
  <text x="947.6285" y="227.9452" text-anchor="middle" font-size="20.3064" fill="var(--text)">Production</text>
  <text x="947.6285" y="263.0137" text-anchor="middle" font-size="18.6141" fill="var(--text-muted)">10.30.0.0/24</text>
  <line x1="236.9071" y1="324.3835" x2="236.9071" y2="403.2877" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="592.2678" y1="324.3835" x2="592.2678" y2="403.2877" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="947.6285" y1="324.3835" x2="947.6285" y2="403.2877" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="236.9071" y1="403.2877" x2="423.0485" y2="455.8904" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="592.2678" y1="403.2877" x2="423.0485" y2="455.8904" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="592.2678" y1="403.2877" x2="761.4872" y2="455.8904" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="947.6285" y1="403.2877" x2="761.4872" y2="455.8904" stroke="var(--warn-border)" stroke-width="2" />
  <rect x="287.6729" y="455.8904" width="270.751" height="87.6712" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="423.0485" y="508.4931" text-anchor="middle" font-size="21.9985" font-weight="bold" fill="var(--danger-accent)">Firewall Rules</text>
  <rect x="626.1117" y="455.8904" width="270.751" height="87.6712" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="761.4872" y="508.4931" text-anchor="middle" font-size="21.9985" font-weight="bold" fill="var(--danger-accent)">Firewall Rules</text>
  <text x="592.2678" y="604.9315" text-anchor="middle" font-size="20.3064" fill="var(--text-muted)">Each VLAN is isolated; traffic between VLANs must pass through firewall rules</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="Arial, sans-serif">
  <text x="300" y="25" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">TLS 1.3 Handshake</text>
  <!-- Client column -->
  <rect x="50" y="40" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Client</text>
  <line x1="100" y1="80" x2="100" y2="400" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Server column -->
  <rect x="450" y="40" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="500" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Server</text>
  <line x1="500" y1="80" x2="500" y2="400" stroke="#28a745" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- ClientHello -->
  <line x1="100" y1="100" x2="500" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#aT13)"/>
  <text x="300" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">ClientHello</text>
  <text x="300" y="115" text-anchor="middle" font-size="10" fill="#555">TLS version, cipher suites, key share</text>
  <!-- ServerHello -->
  <line x1="500" y1="145" x2="100" y2="145" stroke="#28a745" stroke-width="2" marker-end="url(#aT132)"/>
  <text x="300" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">ServerHello</text>
  <text x="300" y="160" text-anchor="middle" font-size="10" fill="#555">chosen cipher, key share</text>
  <!-- EncryptedExtensions -->
  <line x1="500" y1="185" x2="100" y2="185" stroke="#28a745" stroke-width="2" marker-end="url(#aT132)"/>
  <text x="300" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">EncryptedExtensions</text>
  <!-- Certificate -->
  <line x1="500" y1="215" x2="100" y2="215" stroke="#28a745" stroke-width="2" marker-end="url(#aT132)"/>
  <text x="300" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Certificate</text>
  <!-- CertificateVerify -->
  <line x1="500" y1="245" x2="100" y2="245" stroke="#28a745" stroke-width="2" marker-end="url(#aT132)"/>
  <text x="300" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">CertificateVerify</text>
  <!-- Server Finished -->
  <line x1="500" y1="275" x2="100" y2="275" stroke="#28a745" stroke-width="2" marker-end="url(#aT132)"/>
  <text x="300" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Finished</text>
  <!-- Client Finished -->
  <line x1="100" y1="315" x2="500" y2="315" stroke="#4a90e2" stroke-width="2" marker-end="url(#aT13)"/>
  <text x="300" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a90e2">Finished</text>
  <!-- Encrypted data -->
  <rect x="80" y="345" width="440" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Encrypted Application Data</text>
  <!-- Note -->
  <rect x="100" y="400" width="400" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="300" y="422" text-anchor="middle" font-size="12" fill="#856404" font-weight="bold">1 round trip (vs 2 in TLS 1.2), 0-RTT on reconnect</text>
  <defs>
    <marker id="aT13" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="aT132" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
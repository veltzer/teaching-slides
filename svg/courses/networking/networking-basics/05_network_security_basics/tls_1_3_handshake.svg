<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="639.9999" y="40" text-anchor="middle" font-size="28.7231" font-weight="bold" fill="var(--text)">TLS 1.3 Handshake</text>
  <rect x="40" y="61.2195" width="240" height="56.5854" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="96.5854" text-anchor="middle" font-size="22.3402" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="160" y1="117.8048" x2="160" y2="570.4878" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="5.8851 5.8851" />
  <rect x="1000" y="61.2195" width="240" height="56.5854" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="96.5854" text-anchor="middle" font-size="22.3402" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="1120" y1="117.8048" x2="1120" y2="570.4878" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.8851 5.8851" />
  <line x1="160" y1="146.0975" x2="1120" y2="146.0975" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="639.9999" y="139.0244" text-anchor="middle" font-size="19.1487" font-weight="bold" fill="var(--primary-accent)">ClientHello</text>
  <text x="639.9999" y="167.3171" text-anchor="middle" font-size="15.9572" fill="var(--text-muted)">TLS version, cipher suites, key share</text>
  <line x1="1120" y1="209.7561" x2="160" y2="209.7561" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="639.9999" y="202.6829" text-anchor="middle" font-size="19.1487" font-weight="bold" fill="var(--ok-accent)">ServerHello</text>
  <text x="639.9999" y="230.9756" text-anchor="middle" font-size="15.9572" fill="var(--text-muted)">chosen cipher, key share</text>
  <line x1="1120" y1="266.3415" x2="160" y2="266.3415" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="639.9999" y="259.2683" text-anchor="middle" font-size="19.1487" font-weight="bold" fill="var(--ok-accent)">EncryptedExtensions</text>
  <line x1="1120" y1="308.7805" x2="160" y2="308.7805" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="639.9999" y="301.7073" text-anchor="middle" font-size="19.1487" font-weight="bold" fill="var(--ok-accent)">Certificate</text>
  <line x1="1120" y1="351.2195" x2="160" y2="351.2195" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="639.9999" y="344.1463" text-anchor="middle" font-size="19.1487" font-weight="bold" fill="var(--ok-accent)">CertificateVerify</text>
  <line x1="1120" y1="393.6585" x2="160" y2="393.6585" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="639.9999" y="386.5854" text-anchor="middle" font-size="19.1487" font-weight="bold" fill="var(--ok-accent)">Finished</text>
  <line x1="160" y1="450.2439" x2="1120" y2="450.2439" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="639.9999" y="443.1708" text-anchor="middle" font-size="19.1487" font-weight="bold" fill="var(--primary-accent)">Finished</text>
  <rect x="112" y="492.6829" width="1056.0001" height="49.5122" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="523.8049" text-anchor="middle" font-size="20.7444" font-weight="bold" fill="var(--ok-accent)">Encrypted Application Data</text>
  <rect x="160" y="570.4878" width="960" height="49.5122" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="601.6098" text-anchor="middle" font-size="19.1487" fill="var(--danger-accent)" font-weight="bold">1 round trip (vs 2 in TLS 1.2), 0-RTT on reconnect</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
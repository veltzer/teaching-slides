<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="40" text-anchor="middle" font-size="28.8" font-weight="bold" fill="#333">TLS 1.3 Handshake</text>
  <rect x="106.6667" y="64" width="213.3333" height="64" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="213.3333" y="104" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Client</text>
  <line x1="213.3333" y1="128" x2="213.3333" y2="640" stroke="#4a90e2" stroke-width="2.4" stroke-dasharray="6.4 6.4" />
  <rect x="960" y="64" width="213.3333" height="64" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="1066.6667" y="104" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Server</text>
  <line x1="1066.6667" y1="128" x2="1066.6667" y2="640" stroke="#28a745" stroke-width="2.4" stroke-dasharray="6.4 6.4" />
  <line x1="213.3333" y1="160" x2="1066.6667" y2="160" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#aT13)" />
  <text x="640" y="152" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#4a90e2">ClientHello</text>
  <text x="640" y="184" text-anchor="middle" font-size="16" fill="#555">TLS version, cipher suites, key share</text>
  <line x1="1066.6667" y1="232" x2="213.3333" y2="232" stroke="#28a745" stroke-width="3.2" marker-end="url(#aT132)" />
  <text x="640" y="224" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">ServerHello</text>
  <text x="640" y="256" text-anchor="middle" font-size="16" fill="#555">chosen cipher, key share</text>
  <line x1="1066.6667" y1="296" x2="213.3333" y2="296" stroke="#28a745" stroke-width="3.2" marker-end="url(#aT132)" />
  <text x="640" y="288" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">EncryptedExtensions</text>
  <line x1="1066.6667" y1="344" x2="213.3333" y2="344" stroke="#28a745" stroke-width="3.2" marker-end="url(#aT132)" />
  <text x="640" y="336" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">Certificate</text>
  <line x1="1066.6667" y1="392" x2="213.3333" y2="392" stroke="#28a745" stroke-width="3.2" marker-end="url(#aT132)" />
  <text x="640" y="384" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">CertificateVerify</text>
  <line x1="1066.6667" y1="440" x2="213.3333" y2="440" stroke="#28a745" stroke-width="3.2" marker-end="url(#aT132)" />
  <text x="640" y="432" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#28a745">Finished</text>
  <line x1="213.3333" y1="504" x2="1066.6667" y2="504" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#aT13)" />
  <text x="640" y="496" text-anchor="middle" font-size="19.2" font-weight="bold" fill="#4a90e2">Finished</text>
  <rect x="170.6667" y="552" width="938.6667" height="56" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="640" y="587.2" text-anchor="middle" font-size="20.8" font-weight="bold" fill="#28a745">Encrypted Application Data</text>
  <rect x="213.3333" y="640" width="853.3333" height="56" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4" />
  <text x="640" y="675.2" text-anchor="middle" font-size="19.2" fill="#856404" font-weight="bold">1 round trip (vs 2 in TLS 1.2), 0-RTT on reconnect</text>
  <defs>
    <marker id="aT13" markerWidth="21.3333" markerHeight="11.2" refX="21.3333" refY="5.6" orient="auto">
      <polygon points="0,16 7.4667,0" fill="#4a90e2" />
    </marker>
    <marker id="aT132" markerWidth="21.3333" markerHeight="11.2" refX="0" refY="5.6" orient="auto">
      <polygon points="0,0 7.4667,16" fill="#28a745" />
    </marker>
  </defs>
</svg>
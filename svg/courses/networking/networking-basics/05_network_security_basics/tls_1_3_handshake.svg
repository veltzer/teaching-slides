<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="588.5057" y="36.7816" text-anchor="middle" font-size="26.4828" font-weight="bold" fill="var(--text)">TLS 1.3 Handshake</text>
  <rect x="98.0843" y="58.8506" width="196.1686" height="58.8506" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="196.1686" y="95.6322" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="196.1686" y1="117.7011" x2="196.1686" y2="588.5057" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="5.8851 5.8851" />
  <rect x="882.7586" y="58.8506" width="196.1686" height="58.8506" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="980.8429" y="95.6322" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="980.8429" y1="117.7011" x2="980.8429" y2="588.5057" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="5.8851 5.8851" />
  <line x1="196.1686" y1="147.1264" x2="980.8429" y2="147.1264" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="588.5057" y="139.7701" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--primary-accent)">ClientHello</text>
  <text x="588.5057" y="169.1954" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">TLS version, cipher suites, key share</text>
  <line x1="980.8429" y1="213.3333" x2="196.1686" y2="213.3333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="588.5057" y="205.977" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--ok-accent)">ServerHello</text>
  <text x="588.5057" y="235.4023" text-anchor="middle" font-size="14.7126" fill="var(--text-muted)">chosen cipher, key share</text>
  <line x1="980.8429" y1="272.1839" x2="196.1686" y2="272.1839" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="588.5057" y="264.8276" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--ok-accent)">EncryptedExtensions</text>
  <line x1="980.8429" y1="316.3218" x2="196.1686" y2="316.3218" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="588.5057" y="308.9655" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--ok-accent)">Certificate</text>
  <line x1="980.8429" y1="360.4598" x2="196.1686" y2="360.4598" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="588.5057" y="353.1034" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--ok-accent)">CertificateVerify</text>
  <line x1="980.8429" y1="404.5977" x2="196.1686" y2="404.5977" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="588.5057" y="397.2414" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--ok-accent)">Finished</text>
  <line x1="196.1686" y1="463.4483" x2="980.8429" y2="463.4483" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="588.5057" y="456.092" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="var(--primary-accent)">Finished</text>
  <rect x="156.9349" y="507.5862" width="863.1418" height="51.4943" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="588.5057" y="539.954" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="var(--ok-accent)">Encrypted Application Data</text>
  <rect x="196.1686" y="588.5057" width="784.6743" height="51.4943" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="588.5057" y="620.8736" text-anchor="middle" font-size="17.6552" fill="var(--danger-accent)" font-weight="bold">1 round trip (vs 2 in TLS 1.2), 0-RTT on reconnect</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
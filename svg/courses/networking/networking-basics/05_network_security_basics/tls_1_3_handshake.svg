<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="588.5057" y="36.7816" text-anchor="middle" font-size="26.4828" font-weight="bold" fill="#333">TLS 1.3 Handshake</ns0:text>
  <ns0:rect x="98.0843" y="58.8506" width="196.1686" height="58.8506" rx="7.3563" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.9425" />
  <ns0:text x="196.1686" y="95.6322" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="#333">Client</ns0:text>
  <ns0:line x1="196.1686" y1="117.7011" x2="196.1686" y2="588.5057" stroke="#4a90e2" stroke-width="2.2069" stroke-dasharray="5.8851 5.8851" />
  <ns0:rect x="882.7586" y="58.8506" width="196.1686" height="58.8506" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.9425" />
  <ns0:text x="980.8429" y="95.6322" text-anchor="middle" font-size="20.5977" font-weight="bold" fill="#333">Server</ns0:text>
  <ns0:line x1="980.8429" y1="117.7011" x2="980.8429" y2="588.5057" stroke="#28a745" stroke-width="2.2069" stroke-dasharray="5.8851 5.8851" />
  <ns0:line x1="196.1686" y1="147.1264" x2="980.8429" y2="147.1264" stroke="#4a90e2" stroke-width="2.9425" marker-end="url(#aT13)" />
  <ns0:text x="588.5057" y="139.7701" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#4a90e2">ClientHello</ns0:text>
  <ns0:text x="588.5057" y="169.1954" text-anchor="middle" font-size="14.7126" fill="#555">TLS version, cipher suites, key share</ns0:text>
  <ns0:line x1="980.8429" y1="213.3333" x2="196.1686" y2="213.3333" stroke="#28a745" stroke-width="2.9425" marker-end="url(#aT132)" />
  <ns0:text x="588.5057" y="205.977" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#28a745">ServerHello</ns0:text>
  <ns0:text x="588.5057" y="235.4023" text-anchor="middle" font-size="14.7126" fill="#555">chosen cipher, key share</ns0:text>
  <ns0:line x1="980.8429" y1="272.1839" x2="196.1686" y2="272.1839" stroke="#28a745" stroke-width="2.9425" marker-end="url(#aT132)" />
  <ns0:text x="588.5057" y="264.8276" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#28a745">EncryptedExtensions</ns0:text>
  <ns0:line x1="980.8429" y1="316.3218" x2="196.1686" y2="316.3218" stroke="#28a745" stroke-width="2.9425" marker-end="url(#aT132)" />
  <ns0:text x="588.5057" y="308.9655" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#28a745">Certificate</ns0:text>
  <ns0:line x1="980.8429" y1="360.4598" x2="196.1686" y2="360.4598" stroke="#28a745" stroke-width="2.9425" marker-end="url(#aT132)" />
  <ns0:text x="588.5057" y="353.1034" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#28a745">CertificateVerify</ns0:text>
  <ns0:line x1="980.8429" y1="404.5977" x2="196.1686" y2="404.5977" stroke="#28a745" stroke-width="2.9425" marker-end="url(#aT132)" />
  <ns0:text x="588.5057" y="397.2414" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#28a745">Finished</ns0:text>
  <ns0:line x1="196.1686" y1="463.4483" x2="980.8429" y2="463.4483" stroke="#4a90e2" stroke-width="2.9425" marker-end="url(#aT13)" />
  <ns0:text x="588.5057" y="456.092" text-anchor="middle" font-size="17.6552" font-weight="bold" fill="#4a90e2">Finished</ns0:text>
  <ns0:rect x="156.9349" y="507.5862" width="863.1418" height="51.4943" rx="7.3563" fill="#d4edda" stroke="#28a745" stroke-width="2.9425" />
  <ns0:text x="588.5057" y="539.954" text-anchor="middle" font-size="19.1264" font-weight="bold" fill="#28a745">Encrypted Application Data</ns0:text>
  <ns0:rect x="196.1686" y="588.5057" width="784.6743" height="51.4943" rx="7.3563" fill="#fff3cd" stroke="#ffc107" stroke-width="2.2069" />
  <ns0:text x="588.5057" y="620.8736" text-anchor="middle" font-size="17.6552" fill="#bf360c" font-weight="bold">1 round trip (vs 2 in TLS 1.2), 0-RTT on reconnect</ns0:text>
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="34.7111" font-weight="bold" fill="var(--text)">Man-in-the-Middle (MITM) Attack</text>
  <rect x="40" y="166.087" width="270.9678" height="201.7391" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.4839" y="254.3478" text-anchor="middle" font-size="28.9259" font-weight="bold" fill="var(--text)">Client</text>
  <text x="175.4839" y="330" text-anchor="middle" font-size="21.2123" fill="var(--text-muted)">Thinks it talks</text>
  <text x="175.4839" y="367.8261" text-anchor="middle" font-size="21.2123" fill="var(--text-muted)">to the server</text>
  <rect x="485.1613" y="166.087" width="309.6774" height="201.7391" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="254.3478" text-anchor="middle" font-size="28.9259" font-weight="bold" fill="var(--danger-accent)">Attacker</text>
  <text x="640" y="317.3913" text-anchor="middle" font-size="21.2123" fill="var(--text-muted)">Intercepts &amp; modifies</text>
  <text x="640" y="355.2174" text-anchor="middle" font-size="21.2123" fill="var(--text-muted)">all traffic</text>
  <rect x="969.0322" y="166.087" width="270.9678" height="201.7391" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1104.5161" y="254.3478" text-anchor="middle" font-size="28.9259" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="310.9678" y1="216.5217" x2="485.1613" y2="216.5217" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="485.1613" y1="317.3913" x2="310.9678" y2="317.3913" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="794.8387" y1="216.5217" x2="969.0322" y2="216.5217" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="969.0322" y1="317.3913" x2="794.8387" y2="317.3913" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="252.9032" y="493.913" width="774.1936" height="126.087" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="569.5652" text-anchor="middle" font-size="25.0691" fill="var(--danger-accent)" font-weight="bold">TLS/HTTPS prevents MITM by authenticating the server</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="72" text-anchor="middle" font-size="32.9143" font-weight="bold" fill="#333">Man-in-the-Middle (MITM) Attack</text>
  <rect x="73.1429" y="192" width="256" height="192" rx="9.1429" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.6571" />
  <text x="201.1429" y="276" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">Client</text>
  <text x="201.1429" y="348" text-anchor="middle" font-size="20.1143" fill="#555">Thinks it talks</text>
  <text x="201.1429" y="384" text-anchor="middle" font-size="20.1143" fill="#555">to the server</text>
  <rect x="493.7143" y="192" width="292.5714" height="192" rx="9.1429" fill="#f8d7da" stroke="#dc3545" stroke-width="3.6571" />
  <text x="640" y="276" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#dc3545">Attacker</text>
  <text x="640" y="336" text-anchor="middle" font-size="20.1143" fill="#555">Intercepts &amp; modifies</text>
  <text x="640" y="372" text-anchor="middle" font-size="20.1143" fill="#555">all traffic</text>
  <rect x="950.8571" y="192" width="256" height="192" rx="9.1429" fill="#d4edda" stroke="#28a745" stroke-width="3.6571" />
  <text x="1078.8571" y="276" text-anchor="middle" font-size="27.4286" font-weight="bold" fill="#333">Server</text>
  <line x1="329.1429" y1="240" x2="493.7143" y2="240" stroke="#dc3545" stroke-width="3.6571" marker-end="url(#arrowR)" />
  <line x1="493.7143" y1="336" x2="329.1429" y2="336" stroke="#dc3545" stroke-width="3.6571" marker-end="url(#arrowR2)" />
  <line x1="786.2857" y1="240" x2="950.8571" y2="240" stroke="#dc3545" stroke-width="3.6571" marker-end="url(#arrowR)" />
  <line x1="950.8571" y1="336" x2="786.2857" y2="336" stroke="#dc3545" stroke-width="3.6571" marker-end="url(#arrowR2)" />
  <rect x="274.2857" y="504" width="731.4286" height="120" rx="9.1429" fill="#fff3cd" stroke="#ffc107" stroke-width="3.6571" />
  <text x="640" y="576" text-anchor="middle" font-size="23.7714" fill="#bf360c" font-weight="bold">TLS/HTTPS prevents MITM by authenticating the server</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowR" markerWidth="18.2857" markerHeight="16.8" refX="18.2857" refY="8.4" orient="auto">
      <polygon points="0,24 6.4,0" fill="#dc3545" />
    </marker>
    <marker id="arrowR2" markerWidth="18.2857" markerHeight="16.8" refX="0" refY="8.4" orient="auto">
      <polygon points="0,0 6.4,24" fill="#dc3545" />
    </marker>
  </defs>
</svg>
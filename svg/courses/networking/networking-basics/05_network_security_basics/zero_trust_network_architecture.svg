<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Zero Trust Network Architecture</text>
  <!-- Traditional Model -->
  <text x="190" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">Traditional Model</text>
  <rect x="30" y="75" width="320" height="150" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="190" y="100" text-anchor="middle" font-size="13" fill="#333">Trusted Network</text>
  <rect x="60" y="110" width="70" height="45" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="95" y="137" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">A</text>
  <line x1="130" y1="132" x2="155" y2="132" stroke="#dc3545" stroke-width="2" marker-end="url(#aZT)"/>
  <rect x="155" y="110" width="70" height="45" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="190" y="137" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">B</text>
  <line x1="225" y1="132" x2="250" y2="132" stroke="#dc3545" stroke-width="2" marker-end="url(#aZT)"/>
  <rect x="250" y="110" width="70" height="45" rx="5" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
  <text x="285" y="137" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">C</text>
  <text x="190" y="185" text-anchor="middle" font-size="12" fill="#dc3545" font-weight="bold">Free lateral movement</text>
  <text x="190" y="205" text-anchor="middle" font-size="11" fill="#555">Once inside, access everything</text>

  <!-- Zero Trust Model -->
  <text x="560" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#28a745">Zero Trust Model</text>
  <rect x="400" y="75" width="320" height="150" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="560" y="100" text-anchor="middle" font-size="13" fill="#333">No Implicit Trust</text>
  <rect x="430" y="110" width="70" height="45" rx="5" fill="#fff" stroke="#28a745" stroke-width="1.5"/>
  <text x="465" y="137" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">A</text>
  <line x1="500" y1="127" x2="520" y2="127" stroke="#28a745" stroke-width="2"/>
  <text x="515" y="142" font-size="14" fill="#dc3545">X</text>
  <rect x="525" y="110" width="70" height="45" rx="5" fill="#fff" stroke="#28a745" stroke-width="1.5"/>
  <text x="560" y="137" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">B</text>
  <line x1="595" y1="127" x2="615" y2="127" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="142" font-size="14" fill="#dc3545">X</text>
  <rect x="620" y="110" width="70" height="45" rx="5" fill="#fff" stroke="#28a745" stroke-width="1.5"/>
  <text x="655" y="137" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">C</text>
  <text x="560" y="185" text-anchor="middle" font-size="12" fill="#28a745" font-weight="bold">Every connection authenticated</text>
  <text x="560" y="205" text-anchor="middle" font-size="11" fill="#555">Verify explicitly, least privilege</text>

  <!-- Bottom note -->
  <rect x="150" y="245" width="450" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="375" y="267" text-anchor="middle" font-size="12" fill="#333">"Never trust, always verify" - authenticate every request regardless of source</text>
  <defs>
    <marker id="aZT" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
</svg>
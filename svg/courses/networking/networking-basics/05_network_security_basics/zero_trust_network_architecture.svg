  <text x="955.7333" y="444" text-anchor="middle" font-size="20.48" fill="#28a745" font-weight="bold">Every connection authenticated</text>
  <text x="955.7333" y="492" text-anchor="middle" font-size="18.7733" fill="#555">Verify explicitly, least privilege</text>

  <ns0:text x="463.2381" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="#333">C</ns0:text>
  <ns0:text x="308.8254" y="422.8571" text-anchor="middle" font-size="19.5048" fill="#dc3545" font-weight="bold">Free lateral movement</ns0:text>
  <ns0:text x="308.8254" y="468.5714" text-anchor="middle" font-size="17.8793" fill="#555">Once inside, access everything</ns0:text>
  <ns0:text x="910.2222" y="148.5714" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="#28a745">Zero Trust Model</ns0:text>
  <ns0:rect x="650.1588" y="171.4286" width="520.127" height="342.8571" rx="8.127" fill="#d4edda" stroke="#28a745" stroke-width="3.2508" />
  <ns0:text x="910.2222" y="228.5714" text-anchor="middle" font-size="21.1302" fill="#333">No Implicit Trust</ns0:text>
  <ns0:rect x="698.9207" y="251.4286" width="113.7778" height="102.8571" rx="8.127" fill="#fff" stroke="#28a745" stroke-width="2.4381" />
  <ns0:text x="755.8095" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="#333">A</ns0:text>
  <ns0:line x1="812.6984" y1="290.2857" x2="845.2064" y2="290.2857" stroke="#28a745" stroke-width="3.2508" />
  <ns0:text x="837.0793" y="324.5714" font-size="22.7555" fill="#dc3545">X</ns0:text>
  <ns0:rect x="853.3333" y="251.4286" width="113.7778" height="102.8571" rx="8.127" fill="#fff" stroke="#28a745" stroke-width="2.4381" />
  <ns0:text x="910.2222" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="#333">B</ns0:text>
  <ns0:line x1="967.1111" y1="290.2857" x2="999.619" y2="290.2857" stroke="#28a745" stroke-width="3.2508" />
  <ns0:text x="991.4921" y="324.5714" font-size="22.7555" fill="#dc3545">X</ns0:text>
  <ns0:rect x="1007.746" y="251.4286" width="113.7778" height="102.8571" rx="8.127" fill="#fff" stroke="#28a745" stroke-width="2.4381" />
  <ns0:text x="1064.635" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="#333">C</ns0:text>
  <ns0:text x="910.2222" y="422.8571" text-anchor="middle" font-size="19.5048" fill="#28a745" font-weight="bold">Every connection authenticated</ns0:text>
  <ns0:text x="910.2222" y="468.5714" text-anchor="middle" font-size="17.8793" fill="#555">Verify explicitly, least privilege</ns0:text>
  <ns0:rect x="243.8095" y="560" width="731.4286" height="80" rx="8.127" fill="#fff3cd" stroke="#ffc107" stroke-width="2.4381" />
  <ns0:text x="609.5238" y="610.2857" text-anchor="middle" font-size="19.5048" fill="#333">"Never trust, always verify" - authenticate every request regardless of source</ns0:text>

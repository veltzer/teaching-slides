  <line x1="365.7143" y1="301.7143" x2="406.3492" y2="301.7143" stroke="var(--danger-bright)" stroke-width="3.2508" marker-end="url(#arrow-danger)" />
  <rect x="406.3492" y="251.4286" width="113.7778" height="102.8571" rx="8.127" fill="var(--bg)" stroke="var(--danger-bright)" stroke-width="2.4381" />
  <text x="463.2381" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text-dark)">C</text>
  <text x="308.8254" y="422.8571" text-anchor="middle" font-size="19.5048" fill="var(--danger-bright)" font-weight="bold">Free lateral movement</text>
  <text x="308.8254" y="468.5714" text-anchor="middle" font-size="17.8793" fill="var(--text-muted)">Once inside, access everything</text>
  <text x="910.2222" y="148.5714" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--ok-bright)">Zero Trust Model</text>
  <rect x="650.1588" y="171.4286" width="520.127" height="342.8571" rx="8.127" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.2508" />
  <text x="910.2222" y="228.5714" text-anchor="middle" font-size="21.1302" fill="var(--text-dark)">No Implicit Trust</text>
  <rect x="698.9207" y="251.4286" width="113.7778" height="102.8571" rx="8.127" fill="var(--bg)" stroke="var(--ok-bright)" stroke-width="2.4381" />
  <text x="755.8095" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text-dark)">A</text>
  <line x1="812.6984" y1="290.2857" x2="845.2064" y2="290.2857" stroke="var(--ok-bright)" stroke-width="3.2508" />
  <text x="837.0793" y="324.5714" font-size="22.7555" fill="var(--danger-bright)">X</text>
  <rect x="853.3333" y="251.4286" width="113.7778" height="102.8571" rx="8.127" fill="var(--bg)" stroke="var(--ok-bright)" stroke-width="2.4381" />
  <text x="910.2222" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text-dark)">B</text>
  <line x1="967.1111" y1="290.2857" x2="999.619" y2="290.2857" stroke="var(--ok-bright)" stroke-width="3.2508" />
  <text x="991.4921" y="324.5714" font-size="22.7555" fill="var(--danger-bright)">X</text>
  <rect x="1007.746" y="251.4286" width="113.7778" height="102.8571" rx="8.127" fill="var(--bg)" stroke="var(--ok-bright)" stroke-width="2.4381" />
  <text x="1064.635" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text-dark)">C</text>
  <text x="910.2222" y="422.8571" text-anchor="middle" font-size="19.5048" fill="var(--ok-bright)" font-weight="bold">Every connection authenticated</text>
  <text x="910.2222" y="468.5714" text-anchor="middle" font-size="17.8793" fill="var(--text-muted)">Verify explicitly, least privilege</text>
  <rect x="243.8095" y="560" width="731.4286" height="80" rx="8.127" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4381" />
  <text x="609.5238" y="610.2857" text-anchor="middle" font-size="19.5048" fill="var(--text-dark)">"Never trust, always verify" - authenticate every request regardless of source</text>

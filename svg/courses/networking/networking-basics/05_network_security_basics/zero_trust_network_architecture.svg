<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:text x="609.5238" y="68.5714" text-anchor="middle" font-size="29.2571" font-weight="bold" fill="#333">Zero Trust Network Architecture</ns0:text>
  <ns0:text x="308.8254" y="148.5714" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="#dc3545">Traditional Model</ns0:text>

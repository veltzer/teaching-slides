<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="609.5238" y="68.5714" text-anchor="middle" font-size="29.2571" font-weight="bold" fill="var(--text)">Zero Trust Network Architecture</text>
  <text x="308.8254" y="148.5714" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--danger-accent)">Traditional Model</text>
  <rect x="48.7619" y="171.4286" width="520.127" height="342.8571" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="308.8254" y="228.5714" text-anchor="middle" font-size="21.1302" fill="var(--text)">Trusted Network</text>
  <rect x="97.5238" y="251.4286" width="113.7778" height="102.8571" rx="6" fill="var(--text-muted)" stroke="var(--danger-border)" stroke-width="2.4381" />
  <text x="154.4127" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text)">A</text>
  <line x1="211.3016" y1="301.7143" x2="251.9365" y2="301.7143" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="251.9365" y="251.4286" width="113.7778" height="102.8571" rx="6" fill="var(--text-muted)" stroke="var(--danger-border)" stroke-width="2.4381" />
  <text x="308.8254" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text)">B</text>
  <line x1="365.7143" y1="301.7143" x2="406.3492" y2="301.7143" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="406.3492" y="251.4286" width="113.7778" height="102.8571" rx="6" fill="var(--text-muted)" stroke="var(--danger-border)" stroke-width="2.4381" />
  <text x="463.2381" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text)">C</text>
  <text x="308.8254" y="422.8571" text-anchor="middle" font-size="19.5048" fill="var(--danger-accent)" font-weight="bold">Free lateral movement</text>
  <text x="308.8254" y="468.5714" text-anchor="middle" font-size="17.8793" fill="var(--text-muted)">Once inside, access everything</text>
  <text x="910.2222" y="148.5714" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--ok-accent)">Zero Trust Model</text>
  <rect x="650.1588" y="171.4286" width="520.127" height="342.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="910.2222" y="228.5714" text-anchor="middle" font-size="21.1302" fill="var(--text)">No Implicit Trust</text>
  <rect x="698.9207" y="251.4286" width="113.7778" height="102.8571" rx="6" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="2.4381" />
  <text x="755.8095" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text)">A</text>
  <line x1="812.6984" y1="290.2857" x2="845.2064" y2="290.2857" stroke="var(--ok-border)" stroke-width="2" />
  <text x="837.0793" y="324.5714" font-size="22.7555" fill="var(--danger-accent)">X</text>
  <rect x="853.3333" y="251.4286" width="113.7778" height="102.8571" rx="6" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="2.4381" />
  <text x="910.2222" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text)">B</text>
  <line x1="967.1111" y1="290.2857" x2="999.619" y2="290.2857" stroke="var(--ok-border)" stroke-width="2" />
  <text x="991.4921" y="324.5714" font-size="22.7555" fill="var(--danger-accent)">X</text>
  <rect x="1007.746" y="251.4286" width="113.7778" height="102.8571" rx="6" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="2.4381" />
  <text x="1064.635" y="313.1429" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--text)">C</text>
  <text x="910.2222" y="422.8571" text-anchor="middle" font-size="19.5048" fill="var(--ok-accent)" font-weight="bold">Every connection authenticated</text>
  <text x="910.2222" y="468.5714" text-anchor="middle" font-size="17.8793" fill="var(--text-muted)">Verify explicitly, least privilege</text>
  <rect x="243.8095" y="560" width="731.4286" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="609.5238" y="610.2857" text-anchor="middle" font-size="19.5048" fill="var(--text)">"Never trust, always verify" - authenticate every request regardless of source</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
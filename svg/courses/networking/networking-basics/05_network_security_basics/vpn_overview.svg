<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">VPN Overview</text>
  <!-- Without VPN -->
  <text x="375" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc3545">Without VPN</text>
  <rect x="30" y="70" width="110" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Client</text>
  <line x1="140" y1="95" x2="200" y2="95" stroke="#dc3545" stroke-width="2" marker-end="url(#aVPN)"/>
  <rect x="200" y="70" width="130" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="265" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">ISP</text>
  <text x="265" y="108" text-anchor="middle" font-size="10" fill="#555">Can see traffic</text>
  <line x1="330" y1="95" x2="380" y2="95" stroke="#dc3545" stroke-width="2" marker-end="url(#aVPN)"/>
  <rect x="380" y="70" width="140" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="450" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc3545">Internet</text>
  <text x="450" y="108" text-anchor="middle" font-size="10" fill="#555">Can see traffic</text>
  <line x1="520" y1="95" x2="580" y2="95" stroke="#dc3545" stroke-width="2" marker-end="url(#aVPN)"/>
  <rect x="580" y="70" width="110" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="635" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Server</text>

  <!-- With VPN -->
  <text x="375" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#28a745">With VPN</text>
  <rect x="30" y="180" width="110" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Client</text>
  <line x1="140" y1="205" x2="200" y2="205" stroke="#28a745" stroke-width="3"/>
  <rect x="200" y="180" width="130" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="265" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">ISP</text>
  <text x="265" y="218" text-anchor="middle" font-size="10" fill="#555">Sees encrypted</text>
  <line x1="330" y1="205" x2="380" y2="205" stroke="#28a745" stroke-width="3"/>
  <rect x="380" y="180" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="450" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#28a745">Internet</text>
  <text x="450" y="218" text-anchor="middle" font-size="10" fill="#555">Sees encrypted</text>
  <line x1="520" y1="205" x2="580" y2="205" stroke="#28a745" stroke-width="3"/>
  <rect x="580" y="180" width="110" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="635" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">VPN</text>
  <text x="635" y="218" text-anchor="middle" font-size="12" fill="#555">Server</text>
  <line x1="690" y1="205" x2="720" y2="205" stroke="#4a90e2" stroke-width="2" marker-end="url(#aVPNb)"/>
  <text x="730" y="210" font-size="11" fill="#555">Server</text>
  <!-- Encrypted tunnel indicator -->
  <rect x="120" y="195" width="470" height="20" rx="10" fill="none" stroke="#28a745" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Legend -->
  <rect x="200" y="280" width="350" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="220" y1="305" x2="280" y2="305" stroke="#28a745" stroke-width="3"/>
  <text x="290" y="309" font-size="12" fill="#333">= Encrypted tunnel</text>
  <line x1="220" y1="330" x2="280" y2="330" stroke="#dc3545" stroke-width="2"/>
  <text x="290" y="334" font-size="12" fill="#333">= Unprotected traffic</text>
  <defs>
    <marker id="aVPN" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="aVPNb" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
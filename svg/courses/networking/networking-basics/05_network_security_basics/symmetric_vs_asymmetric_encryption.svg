<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 250" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Symmetric Encryption</text>
  <!-- Plain Text -->
  <rect x="40" y="70" width="120" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Plain Text</text>
  <!-- Arrow encrypt -->
  <line x1="160" y1="100" x2="270" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#aSYM)"/>
  <text x="215" y="90" text-anchor="middle" font-size="11" fill="#4a90e2" font-weight="bold">Encrypt</text>
  <text x="215" y="75" text-anchor="middle" font-size="10" fill="#555">Key: "s3cr3t"</text>
  <!-- Cipher Text -->
  <rect x="270" y="70" width="170" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="355" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Ciphertext</text>
  <text x="355" y="118" text-anchor="middle" font-size="11" fill="#555">xK9#mP2...</text>
  <!-- Arrow decrypt -->
  <line x1="440" y1="100" x2="550" y2="100" stroke="#28a745" stroke-width="2" marker-end="url(#aSYMg)"/>
  <text x="495" y="90" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">Decrypt</text>
  <text x="495" y="75" text-anchor="middle" font-size="10" fill="#555">Key: "s3cr3t"</text>
  <!-- Plain Text 2 -->
  <rect x="550" y="70" width="120" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Plain Text</text>
  <!-- Key note -->
  <rect x="150" y="165" width="450" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="375" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Same key used for both encryption and decryption</text>
  <text x="375" y="205" text-anchor="middle" font-size="12" fill="#555">Fast but requires secure key exchange (key distribution problem)</text>
  <defs>
    <marker id="aSYM" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="aSYMg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
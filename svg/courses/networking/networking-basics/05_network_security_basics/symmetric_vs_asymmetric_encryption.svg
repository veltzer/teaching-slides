<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <rect x="40" y="40" width="228.5714" height="239.999986801427" rx="6.777243830394" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="154.2857" y="179.999960404281" text-anchor="middle" font-size="29.747921115067" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Plain Text</text>
  <line x1="268.5714" y1="160.000057193816" x2="478.0952" y2="160.000057193816" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="373.3333" y="119.999995600476" text-anchor="middle" font-size="23.373358522262" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">Encrypt</text>
  <text x="373.3333" y="60.00003079667" text-anchor="middle" font-size="21.24857962737" fill="var(--text-muted)" font-family="Arial, sans-serif">Key: "s3cr3t"</text>
  <rect x="478.0952" y="40" width="323.8095" height="239.999986801427" rx="6.777243830394" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="152.000019357907" text-anchor="middle" font-size="29.747921115067" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Ciphertext</text>
  <text x="640" y="232.000014958383" text-anchor="middle" font-size="23.373358522262" fill="var(--text-muted)" font-family="Arial, sans-serif">xK9#mP2...</text>
  <line x1="801.9047" y1="160.000057193816" x2="1011.4286" y2="160.000057193816" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="906.6666" y="119.999995600476" text-anchor="middle" font-size="23.373358522262" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">Decrypt</text>
  <text x="906.6666" y="60.00003079667" text-anchor="middle" font-size="21.24857962737" fill="var(--text-muted)" font-family="Arial, sans-serif">Key: "s3cr3t"</text>
  <rect x="1011.4286" y="40" width="228.5714" height="239.999986801427" rx="6.777243830394" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1125.7143" y="179.999960404281" text-anchor="middle" font-size="29.747921115067" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Plain Text</text>
  <rect x="249.5238" y="419.999947205708" width="857.1429" height="200.000052794292" rx="6.777243830394" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="678.0952" y="507.999980642093" text-anchor="middle" font-size="27.623142220174" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Same key used for both encryption and decryption</text>
  <text x="678.0952" y="579.999938406659" text-anchor="middle" font-size="25.498250371218" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast but requires secure key exchange (key distribution problem)</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

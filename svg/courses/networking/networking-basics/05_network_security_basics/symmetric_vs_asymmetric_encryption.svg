<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="86.4" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#333">Symmetric Encryption</text>
  <rect x="68.2667" y="201.6" width="204.8" height="172.8" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="170.6667" y="302.4" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Plain Text</text>
  <line x1="273.0667" y1="288" x2="460.8" y2="288" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#aSYM)" />
  <text x="366.9333" y="259.2" text-anchor="middle" font-size="18.7733" fill="#4a90e2" font-weight="bold">Encrypt</text>
  <text x="366.9333" y="216" text-anchor="middle" font-size="17.0667" fill="#555">Key: "s3cr3t"</text>
  <rect x="460.8" y="201.6" width="290.1333" height="172.8" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="605.8667" y="282.24" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Ciphertext</text>
  <text x="605.8667" y="339.84" text-anchor="middle" font-size="18.7733" fill="#555">xK9#mP2...</text>
  <line x1="750.9333" y1="288" x2="938.6667" y2="288" stroke="#28a745" stroke-width="3.4133" marker-end="url(#aSYMg)" />
  <text x="844.8" y="259.2" text-anchor="middle" font-size="18.7733" fill="#28a745" font-weight="bold">Decrypt</text>
  <text x="844.8" y="216" text-anchor="middle" font-size="17.0667" fill="#555">Key: "s3cr3t"</text>
  <rect x="938.6667" y="201.6" width="204.8" height="172.8" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="1041.0667" y="302.4" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="#333">Plain Text</text>
  <rect x="256" y="475.2" width="768" height="144" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.56" />
  <text x="640" y="538.56" text-anchor="middle" font-size="22.1867" fill="#333" font-weight="bold">Same key used for both encryption and decryption</text>
  <text x="640" y="590.4" text-anchor="middle" font-size="20.48" fill="#555">Fast but requires secure key exchange (key distribution problem)</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="aSYM" markerWidth="17.0667" markerHeight="20.16" refX="17.0667" refY="10.08" orient="auto">
      <polygon points="0,28.8 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="aSYMg" markerWidth="17.0667" markerHeight="20.16" refX="17.0667" refY="10.08" orient="auto">
      <polygon points="0,28.8 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
</svg>
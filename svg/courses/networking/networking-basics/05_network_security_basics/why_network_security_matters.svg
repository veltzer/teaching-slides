  <text x="949.4867" y="250.9804" text-anchor="middle" font-size="19.9892" font-weight="bold" fill="var(--text-dark)">Internet</text>
  <line x1="1041.1039" y1="250.9804" x2="1099.4056" y2="250.9804" stroke="var(--primary-bright)" stroke-width="3.3315" marker-end="url(#arrow-primary)" />

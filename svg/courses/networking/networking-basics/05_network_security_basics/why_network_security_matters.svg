  <text x="1157.7074" y="263.5294" text-anchor="middle" font-size="21.655" font-weight="bold" fill="var(--text-dark)">Server</text>
  <rect x="366.4686" y="376.4706" width="166.5766" height="87.8431" rx="8.3288" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4986" />
  <text x="449.7569" y="431.6863" text-anchor="middle" font-size="18.3234" fill="var(--danger-bright)" font-weight="bold">Attacker</text>
  <line x1="416.4416" y1="376.4706" x2="416.4416" y2="326.2745" stroke="var(--danger-bright)" stroke-width="2.4986" marker-end="url(#arrow-danger)" />
  <rect x="632.9911" y="376.4706" width="166.5766" height="87.8431" rx="8.3288" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4986" />
  <text x="716.2795" y="431.6863" text-anchor="middle" font-size="18.3234" fill="var(--danger-bright)" font-weight="bold">Attacker</text>
  <line x1="682.9641" y1="376.4706" x2="682.9641" y2="326.2745" stroke="var(--danger-bright)" stroke-width="2.4986" marker-end="url(#arrow-danger)" />
  <rect x="882.856" y="376.4706" width="166.5766" height="87.8431" rx="8.3288" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4986" />
  <text x="966.1444" y="431.6863" text-anchor="middle" font-size="18.3234" fill="var(--danger-bright)" font-weight="bold">Attacker</text>
  <line x1="949.4867" y1="376.4706" x2="949.4867" y2="326.2745" stroke="var(--danger-bright)" stroke-width="2.4986" marker-end="url(#arrow-danger)" />
  <rect x="199.8919" y="527.0588" width="849.5407" height="112.9412" rx="8.3288" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4986" />
  <text x="624.6623" y="577.2549" text-anchor="middle" font-size="21.655" fill="var(--text-dark)" font-weight="bold">Attackers can sniff traffic at every hop along the path</text>
  <text x="624.6623" y="622.4314" text-anchor="middle" font-size="19.9892" fill="var(--text-muted)">Encryption (TLS/VPN) protects data in transit</text>

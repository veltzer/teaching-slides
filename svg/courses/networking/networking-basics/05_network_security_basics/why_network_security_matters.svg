<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="631.4286" y="40" text-anchor="middle" font-size="30.8265" font-weight="bold" fill="var(--text)">Why Network Security Matters</text>
  <rect x="40" y="143.1111" width="188.5714" height="154.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="134.2858" y="233.3333" text-anchor="middle" font-size="22.2636" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="228.5714" y1="220.4444" x2="322.8571" y2="220.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="322.8571" y="143.1111" width="188.5714" height="154.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="417.1429" y="220.4444" text-anchor="middle" font-size="20.551" font-weight="bold" fill="var(--text)">Your LAN</text>
  <line x1="511.4285" y1="220.4444" x2="605.7143" y2="220.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="605.7143" y="143.1111" width="171.4286" height="154.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="691.4285" y="220.4444" text-anchor="middle" font-size="20.551" font-weight="bold" fill="var(--text)">ISP</text>
  <line x1="777.1428" y1="220.4444" x2="871.4285" y2="220.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="871.4285" y="143.1111" width="188.5714" height="154.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="965.7143" y="220.4444" text-anchor="middle" font-size="20.551" font-weight="bold" fill="var(--text)">Internet</text>
  <line x1="1060" y1="220.4444" x2="1119.9999" y2="220.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1119.9999" y="143.1111" width="120.0001" height="154.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1179.9999" y="233.3333" text-anchor="middle" font-size="22.2636" font-weight="bold" fill="var(--text)">Server</text>
  <rect x="365.7143" y="349.3333" width="171.4286" height="90.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="451.4286" y="406.0444" text-anchor="middle" font-size="18.8384" fill="var(--danger-accent)" font-weight="bold">Attacker</text>
  <line x1="417.1429" y1="349.3333" x2="417.1429" y2="297.7777" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="639.9999" y="349.3333" width="171.4286" height="90.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="725.7143" y="406.0444" text-anchor="middle" font-size="18.8384" fill="var(--danger-accent)" font-weight="bold">Attacker</text>
  <line x1="691.4285" y1="349.3333" x2="691.4285" y2="297.7777" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="897.1428" y="349.3333" width="171.4286" height="90.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="982.8572" y="406.0444" text-anchor="middle" font-size="18.8384" fill="var(--danger-accent)" font-weight="bold">Attacker</text>
  <line x1="965.7143" y1="349.3333" x2="965.7143" y2="297.7777" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="194.2857" y="504" width="874.2857" height="116" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="631.4286" y="555.5555" text-anchor="middle" font-size="22.2636" fill="var(--text)" font-weight="bold">Attackers can sniff traffic at every hop along the path</text>
  <text x="631.4286" y="601.9556" text-anchor="middle" font-size="20.551" fill="var(--text-muted)">Encryption (TLS/VPN) protects data in transit</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
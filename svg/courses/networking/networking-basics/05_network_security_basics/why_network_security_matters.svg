<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Why Network Security Matters</text>
  <!-- Network path -->
  <rect x="30" y="70" width="110" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Client</text>
  <line x1="140" y1="100" x2="195" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#aWhy)"/>
  <rect x="195" y="70" width="110" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="250" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Your LAN</text>
  <line x1="305" y1="100" x2="360" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#aWhy)"/>
  <rect x="360" y="70" width="100" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="410" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">ISP</text>
  <line x1="460" y1="100" x2="515" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#aWhy)"/>
  <rect x="515" y="70" width="110" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="570" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Internet</text>
  <line x1="625" y1="100" x2="660" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#aWhy)"/>
  <rect x="660" y="70" width="70" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="695" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Server</text>
  <!-- Attacker indicators -->
  <rect x="220" y="150" width="100" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="270" y="172" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">Attacker</text>
  <line x1="250" y1="150" x2="250" y2="130" stroke="#dc3545" stroke-width="1.5" marker-end="url(#aWhyR)"/>
  <rect x="380" y="150" width="100" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="430" y="172" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">Attacker</text>
  <line x1="410" y1="150" x2="410" y2="130" stroke="#dc3545" stroke-width="1.5" marker-end="url(#aWhyR)"/>
  <rect x="530" y="150" width="100" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="580" y="172" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">Attacker</text>
  <line x1="570" y1="150" x2="570" y2="130" stroke="#dc3545" stroke-width="1.5" marker-end="url(#aWhyR)"/>
  <!-- Note -->
  <rect x="120" y="210" width="510" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="375" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Attackers can sniff traffic at every hop along the path</text>
  <text x="375" y="248" text-anchor="middle" font-size="12" fill="#555">Encryption (TLS/VPN) protects data in transit</text>
  <defs>
    <marker id="aWhy" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="aWhyR" markerWidth="10" markerHeight="7" refX="5" refY="0" orient="auto">
      <polygon points="0 7, 5 0, 10 7" fill="#dc3545"/>
    </marker>
  </defs>
</svg>
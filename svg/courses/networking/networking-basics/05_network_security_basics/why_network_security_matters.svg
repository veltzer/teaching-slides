<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="624.6623" y="75.2942" text-anchor="middle" font-size="29.9838" font-weight="bold" fill="var(--text)">Why Network Security Matters</text>
  <rect x="49.973" y="175.6863" width="183.2342" height="150.5882" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="141.5902" y="263.5294" text-anchor="middle" font-size="21.655" font-weight="bold" fill="var(--text)">Client</text>
  <line x1="233.2072" y1="250.9804" x2="324.8244" y2="250.9804" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="324.8244" y="175.6863" width="183.2342" height="150.5882" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="416.4416" y="250.9804" text-anchor="middle" font-size="19.9892" font-weight="bold" fill="var(--text)">Your LAN</text>
  <line x1="508.0586" y1="250.9804" x2="599.6758" y2="250.9804" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="599.6758" y="175.6863" width="166.5766" height="150.5882" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="682.9641" y="250.9804" text-anchor="middle" font-size="19.9892" font-weight="bold" fill="var(--text)">ISP</text>
  <line x1="766.2524" y1="250.9804" x2="857.8695" y2="250.9804" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="857.8695" y="175.6863" width="183.2342" height="150.5882" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="949.4867" y="250.9804" text-anchor="middle" font-size="19.9892" font-weight="bold" fill="var(--text)">Internet</text>
  <line x1="1041.1039" y1="250.9804" x2="1099.4056" y2="250.9804" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="1099.4056" y="175.6863" width="116.6037" height="150.5882" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1157.7074" y="263.5294" text-anchor="middle" font-size="21.655" font-weight="bold" fill="var(--text)">Server</text>
  <rect x="366.4686" y="376.4706" width="166.5766" height="87.8431" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="449.7569" y="431.6863" text-anchor="middle" font-size="18.3234" fill="var(--danger-accent)" font-weight="bold">Attacker</text>
  <line x1="416.4416" y1="376.4706" x2="416.4416" y2="326.2745" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="632.9911" y="376.4706" width="166.5766" height="87.8431" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="716.2795" y="431.6863" text-anchor="middle" font-size="18.3234" fill="var(--danger-accent)" font-weight="bold">Attacker</text>
  <line x1="682.9641" y1="376.4706" x2="682.9641" y2="326.2745" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="882.856" y="376.4706" width="166.5766" height="87.8431" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="966.1444" y="431.6863" text-anchor="middle" font-size="18.3234" fill="var(--danger-accent)" font-weight="bold">Attacker</text>
  <line x1="949.4867" y1="376.4706" x2="949.4867" y2="326.2745" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="199.8919" y="527.0588" width="849.5407" height="112.9412" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="624.6623" y="577.2549" text-anchor="middle" font-size="21.655" fill="var(--text)" font-weight="bold">Attackers can sniff traffic at every hop along the path</text>
  <text x="624.6623" y="622.4314" text-anchor="middle" font-size="19.9892" fill="var(--text-muted)">Encryption (TLS/VPN) protects data in transit</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
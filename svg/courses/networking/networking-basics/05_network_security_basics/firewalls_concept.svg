<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="640" y="72" text-anchor="middle" font-size="30.72" font-weight="bold" fill="#333">Firewall Concept</text>
  <rect x="34.1333" y="192" width="238.9333" height="132" rx="8.5333" fill="#f8d7da" stroke="#dc3545" stroke-width="3.4133" />
  <text x="153.6" y="252" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#dc3545">Incoming</text>
  <text x="153.6" y="292.8" text-anchor="middle" font-size="20.48" fill="#555">Traffic</text>
  <line x1="273.0667" y1="240" x2="392.5333" y2="240" stroke="#dc3545" stroke-width="3.4133" marker-end="url(#aFW)" />
  <rect x="392.5333" y="132" width="494.9333" height="456" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="640" y="192" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="#856404">FIREWALL</text>
  <rect x="426.6667" y="216" width="426.6667" height="72" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="640" y="264" text-anchor="middle" font-size="20.48" fill="#333">Rule 1: Allow SSH (port 22)</text>
  <rect x="426.6667" y="300" width="426.6667" height="72" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="640" y="348" text-anchor="middle" font-size="20.48" fill="#333">Rule 2: Allow HTTP (port 80)</text>
  <rect x="426.6667" y="384" width="426.6667" height="72" rx="5.12" fill="#d4edda" stroke="#28a745" stroke-width="1.7067" />
  <text x="640" y="432" text-anchor="middle" font-size="20.48" fill="#333">Rule 3: Allow HTTPS (port 443)</text>
  <rect x="426.6667" y="468" width="426.6667" height="72" rx="5.12" fill="#f8d7da" stroke="#dc3545" stroke-width="1.7067" />
  <text x="640" y="516" text-anchor="middle" font-size="20.48" fill="#dc3545">Rule 4: Drop all other</text>
  <line x1="887.4667" y1="240" x2="1006.9333" y2="240" stroke="#28a745" stroke-width="3.4133" marker-end="url(#aFWg)" />
  <rect x="1006.9333" y="168" width="238.9333" height="192" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="1126.4" y="240" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#28a745">Internal</text>
  <text x="1126.4" y="283.2" text-anchor="middle" font-size="20.48" fill="#555">Network</text>
  <text x="1126.4" y="326.4" text-anchor="middle" font-size="20.48" fill="#555">Servers</text>
  <line x1="1006.9333" y1="456" x2="887.4667" y2="456" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#aFWb)" />
  <line x1="392.5333" y1="456" x2="273.0667" y2="456" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#aFWb)" />
  <rect x="34.1333" y="408" width="238.9333" height="108" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="153.6" y="468" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="#4a90e2">Outgoing</text>
  <defs>
    <marker id="aFW" markerWidth="17.0667" markerHeight="16.8" refX="17.0667" refY="8.4" orient="auto">
      <polygon points="0,24 5.9733,0" fill="#dc3545" />

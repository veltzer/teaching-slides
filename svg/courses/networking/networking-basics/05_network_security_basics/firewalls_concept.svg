<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="72" text-anchor="middle" font-size="30.72" font-weight="bold" fill="var(--text)">Firewall Concept</text>
  <rect x="34.1333" y="192" width="238.9333" height="132" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="153.6" y="252" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="var(--danger-accent)">Incoming</text>
  <text x="153.6" y="292.8" text-anchor="middle" font-size="20.48" fill="var(--text-muted)">Traffic</text>
  <line x1="273.0667" y1="240" x2="392.5333" y2="240" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <rect x="392.5333" y="132" width="494.9333" height="456" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="192" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="var(--danger-accent)">FIREWALL</text>
  <rect x="426.6667" y="216" width="426.6667" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="264" text-anchor="middle" font-size="20.48" fill="var(--text)">Rule 1: Allow SSH (port 22)</text>
  <rect x="426.6667" y="300" width="426.6667" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="348" text-anchor="middle" font-size="20.48" fill="var(--text)">Rule 2: Allow HTTP (port 80)</text>
  <rect x="426.6667" y="384" width="426.6667" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="432" text-anchor="middle" font-size="20.48" fill="var(--text)">Rule 3: Allow HTTPS (port 443)</text>
  <rect x="426.6667" y="468" width="426.6667" height="72" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="516" text-anchor="middle" font-size="20.48" fill="var(--danger-accent)">Rule 4: Drop all other</text>
  <line x1="887.4667" y1="240" x2="1006.9333" y2="240" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="1006.9333" y="168" width="238.9333" height="192" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1126.4" y="240" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="var(--ok-accent)">Internal</text>
  <text x="1126.4" y="283.2" text-anchor="middle" font-size="20.48" fill="var(--text-muted)">Network</text>
  <text x="1126.4" y="326.4" text-anchor="middle" font-size="20.48" fill="var(--text-muted)">Servers</text>
  <line x1="1006.9333" y1="456" x2="887.4667" y2="456" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="392.5333" y1="456" x2="273.0667" y2="456" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="34.1333" y="408" width="238.9333" height="108" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="153.6" y="468" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="var(--primary-accent)">Outgoing</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
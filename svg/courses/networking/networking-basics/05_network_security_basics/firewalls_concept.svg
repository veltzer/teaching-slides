<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 300" font-family="Arial, sans-serif">
  <text x="375" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Firewall Concept</text>
  <!-- Incoming traffic -->
  <rect x="20" y="80" width="140" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="90" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Incoming</text>
  <text x="90" y="122" text-anchor="middle" font-size="12" fill="#555">Traffic</text>
  <!-- Arrow in -->
  <line x1="160" y1="100" x2="230" y2="100" stroke="#dc3545" stroke-width="2" marker-end="url(#aFW)"/>
  <!-- Firewall -->
  <rect x="230" y="55" width="290" height="190" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#856404">FIREWALL</text>
  <rect x="250" y="90" width="250" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="375" y="110" text-anchor="middle" font-size="12" fill="#333">Rule 1: Allow SSH (port 22)</text>
  <rect x="250" y="125" width="250" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="375" y="145" text-anchor="middle" font-size="12" fill="#333">Rule 2: Allow HTTP (port 80)</text>
  <rect x="250" y="160" width="250" height="30" rx="3" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="375" y="180" text-anchor="middle" font-size="12" fill="#333">Rule 3: Allow HTTPS (port 443)</text>
  <rect x="250" y="195" width="250" height="30" rx="3" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="375" y="215" text-anchor="middle" font-size="12" fill="#dc3545">Rule 4: Drop all other</text>
  <!-- Arrow out -->
  <line x1="520" y1="100" x2="590" y2="100" stroke="#28a745" stroke-width="2" marker-end="url(#aFWg)"/>
  <!-- Internal -->
  <rect x="590" y="70" width="140" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="660" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">Internal</text>
  <text x="660" y="118" text-anchor="middle" font-size="12" fill="#555">Network</text>
  <text x="660" y="136" text-anchor="middle" font-size="12" fill="#555">Servers</text>
  <!-- Outgoing -->
  <line x1="590" y1="190" x2="520" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#aFWb)"/>
  <line x1="230" y1="190" x2="160" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#aFWb)"/>
  <rect x="20" y="170" width="140" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90e2">Outgoing</text>
  <defs>
    <marker id="aFW" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="aFWg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="aFWb" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
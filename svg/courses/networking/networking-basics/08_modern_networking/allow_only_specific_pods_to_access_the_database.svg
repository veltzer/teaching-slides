<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="612.6496" y="61.5385" text-anchor="middle" font-size="28.0068" font-weight="bold" fill="var(--text)">Network Policy: Pod Access Control</text>
  <rect x="35.0085" y="98.4615" width="542.6325" height="541.5385" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="306.3248" y="160" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--danger-accent)">Without Network Policy</text>
  <rect x="70.0171" y="209.2308" width="122.5299" height="110.7692" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="131.2821" y="275.6923" text-anchor="middle" font-size="21.0052" fill="var(--text)">Web</text>
  <rect x="253.812" y="209.2308" width="122.5299" height="110.7692" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="315.077" y="275.6923" text-anchor="middle" font-size="21.0052" fill="var(--text)">API</text>
  <rect x="437.6069" y="209.2308" width="122.5299" height="110.7692" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="498.8719" y="275.6923" text-anchor="middle" font-size="21.0052" fill="var(--text)">DB</text>
  <line x1="192.5471" y1="263.3847" x2="253.812" y2="263.3847" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="376.3419" y1="263.3847" x2="437.6069" y2="263.3847" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <path d="M 131.2821 320 Q 131.2821 418.4616 498.8719 320" stroke="var(--danger-border)" stroke-width="3.5008" fill="none" marker-end="url(#arrow-danger)" />
  <text x="306.3248" y="443.0769" text-anchor="middle" font-size="19.2547" fill="var(--danger-accent)" font-weight="bold">All Pods can reach DB</text>
  <rect x="647.6581" y="98.4615" width="542.6325" height="541.5385" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="918.9744" y="160" text-anchor="middle" font-size="22.7555" font-weight="bold" fill="var(--ok-accent)">With Network Policy</text>
  <rect x="682.6667" y="209.2308" width="122.5299" height="110.7692" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="743.9317" y="275.6923" text-anchor="middle" font-size="21.0052" fill="var(--text)">Web</text>
  <rect x="866.4616" y="209.2308" width="122.5299" height="110.7692" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="927.7266" y="275.6923" text-anchor="middle" font-size="21.0052" fill="var(--text)">API</text>
  <rect x="1050.2565" y="209.2308" width="122.5299" height="110.7692" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1111.5215" y="275.6923" text-anchor="middle" font-size="21.0052" fill="var(--text)">DB</text>
  <line x1="805.1967" y1="263.3847" x2="857.7094" y2="263.3847" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.7522 5.2513" />
  <text x="834.9539" y="246.1539" text-anchor="middle" font-size="28.0068" fill="var(--danger-accent)">✗</text>
  <line x1="988.9915" y1="263.3847" x2="1050.2565" y2="263.3847" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="918.9744" y="443.0769" text-anchor="middle" font-size="19.2547" fill="var(--ok-accent)" font-weight="bold">Only API can reach DB</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
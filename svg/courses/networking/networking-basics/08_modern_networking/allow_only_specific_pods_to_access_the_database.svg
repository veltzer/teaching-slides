<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640.0001" y="40" text-anchor="middle" font-size="28.5816" font-weight="bold" fill="var(--text)">Network Policy: Pod Access Control</text>
  <rect x="40" y="77.0212" width="563.6364" height="542.9788" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="321.8182" y="138.7234" text-anchor="middle" font-size="23.2225" font-weight="bold" fill="var(--danger-accent)">Without Network Policy</text>
  <rect x="76.3637" y="188.0851" width="127.2727" height="111.0638" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="140.0001" y="254.7234" text-anchor="middle" font-size="21.4363" fill="var(--text)">Web</text>
  <rect x="267.2728" y="188.0851" width="127.2727" height="111.0638" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="330.9092" y="254.7234" text-anchor="middle" font-size="21.4363" fill="var(--text)">API</text>
  <rect x="458.1819" y="188.0851" width="127.2727" height="111.0638" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="521.8183" y="254.7234" text-anchor="middle" font-size="21.4363" fill="var(--text)">DB</text>
  <line x1="203.6365" y1="242.383" x2="267.2728" y2="242.383" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <line x1="394.5455" y1="242.383" x2="458.1819" y2="242.383" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <path d="M 140.0001 299.1489 Q 140.0001 397.8724 521.8183 299.1489" stroke="var(--danger-border)" stroke-width="3.5008" fill="none" marker-end="url(#arrow-danger)" />
  <text x="321.8182" y="422.5532" text-anchor="middle" font-size="19.6499" fill="var(--danger-accent)" font-weight="bold">All Pods can reach DB</text>
  <rect x="676.3636" y="77.0212" width="563.6364" height="542.9788" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="958.1819" y="138.7234" text-anchor="middle" font-size="23.2225" font-weight="bold" fill="var(--ok-accent)">With Network Policy</text>
  <rect x="712.7273" y="188.0851" width="127.2727" height="111.0638" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="776.3637" y="254.7234" text-anchor="middle" font-size="21.4363" fill="var(--text)">Web</text>
  <rect x="903.6364" y="188.0851" width="127.2727" height="111.0638" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="967.2728" y="254.7234" text-anchor="middle" font-size="21.4363" fill="var(--text)">API</text>
  <rect x="1094.5456" y="188.0851" width="127.2727" height="111.0638" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1158.182" y="254.7234" text-anchor="middle" font-size="21.4363" fill="var(--text)">DB</text>
  <line x1="840.0001" y1="242.383" x2="894.5455" y2="242.383" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.7522 5.2513" />
  <text x="870.9092" y="225.1064" text-anchor="middle" font-size="28.5816" fill="var(--danger-accent)">✗</text>
  <line x1="1030.9091" y1="242.383" x2="1094.5456" y2="242.383" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="958.1819" y="422.5532" text-anchor="middle" font-size="19.6499" fill="var(--ok-accent)" font-weight="bold">Only API can reach DB</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
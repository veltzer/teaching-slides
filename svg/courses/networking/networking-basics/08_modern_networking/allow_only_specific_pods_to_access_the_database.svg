<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="Arial, sans-serif">
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Network Policy: Pod Access Control</text>
  <!-- Without Network Policy -->
  <rect x="20" y="40" width="310" height="220" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="175" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc3545">Without Network Policy</text>
  <rect x="40" y="85" width="70" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="75" y="112" text-anchor="middle" font-size="12" fill="#333">Web</text>
  <rect x="145" y="85" width="70" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="180" y="112" text-anchor="middle" font-size="12" fill="#333">API</text>
  <rect x="250" y="85" width="70" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="285" y="112" text-anchor="middle" font-size="12" fill="#333">DB</text>
  <!-- Arrows - all connect -->
  <line x1="110" y1="107" x2="145" y2="107" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="215" y1="107" x2="250" y2="107" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowRed)"/>
  <path d="M 75 130 Q 75 170 285 130" stroke="#dc3545" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  <text x="175" y="180" text-anchor="middle" font-size="11" fill="#dc3545" font-weight="bold">All Pods can reach DB</text>
  <!-- With Network Policy -->
  <rect x="370" y="40" width="310" height="220" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="525" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">With Network Policy</text>
  <rect x="390" y="85" width="70" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="425" y="112" text-anchor="middle" font-size="12" fill="#333">Web</text>
  <rect x="495" y="85" width="70" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="530" y="112" text-anchor="middle" font-size="12" fill="#333">API</text>
  <rect x="600" y="85" width="70" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="635" y="112" text-anchor="middle" font-size="12" fill="#333">DB</text>
  <!-- Blocked arrow from Web -->
  <line x1="460" y1="107" x2="490" y2="107" stroke="#dc3545" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="477" y="100" text-anchor="middle" font-size="16" fill="#dc3545">✗</text>
  <!-- Allowed arrow from API to DB -->
  <line x1="565" y1="107" x2="600" y2="107" stroke="#28a745" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="525" y="180" text-anchor="middle" font-size="11" fill="#28a745" font-weight="bold">Only API can reach DB</text>
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>

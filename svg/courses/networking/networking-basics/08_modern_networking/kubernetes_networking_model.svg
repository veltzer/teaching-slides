<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Kubernetes Networking Model</text>

  <!-- Cluster border -->
  <rect x="20" y="40" width="710" height="330" rx="5" fill="none" stroke="#4a90e2" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="375" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a90e2">Kubernetes Cluster</text>

  <!-- Node A -->
  <rect x="50" y="80" width="290" height="200" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="195" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Node A (10.0.1.0/24)</text>

  <!-- Pod 1 -->
  <rect x="75" y="120" width="110" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="130" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Pod 1</text>
  <text x="130" y="163" text-anchor="middle" font-size="10" fill="#666">10.0.1.2</text>
  <rect x="110" y="172" width="40" height="20" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="130" y="186" text-anchor="middle" font-size="9" fill="#856404">C1</text>

  <!-- Pod 2 -->
  <rect x="205" y="120" width="110" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="260" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Pod 2</text>
  <text x="260" y="163" text-anchor="middle" font-size="10" fill="#666">10.0.1.3</text>
  <rect x="240" y="172" width="40" height="20" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="260" y="186" text-anchor="middle" font-size="9" fill="#856404">C2</text>

  <!-- Node B -->
  <rect x="410" y="80" width="290" height="200" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="555" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Node B (10.0.2.0/24)</text>

  <!-- Pod 3 -->
  <rect x="435" y="120" width="110" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="490" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Pod 3</text>
  <text x="490" y="163" text-anchor="middle" font-size="10" fill="#666">10.0.2.2</text>
  <rect x="470" y="172" width="40" height="20" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="490" y="186" text-anchor="middle" font-size="9" fill="#856404">C3</text>

  <!-- Pod 4 -->
  <rect x="565" y="120" width="110" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="620" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Pod 4</text>
  <text x="620" y="163" text-anchor="middle" font-size="10" fill="#666">10.0.2.3</text>
  <rect x="600" y="172" width="40" height="20" rx="3" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="620" y="186" text-anchor="middle" font-size="9" fill="#856404">C4</text>

  <!-- Connection lines from nodes down -->
  <line x1="195" y1="280" x2="195" y2="310" stroke="#4a90e2" stroke-width="2"/>
  <line x1="555" y1="280" x2="555" y2="310" stroke="#4a90e2" stroke-width="2"/>

  <!-- CNI Plugin bar -->
  <rect x="120" y="310" width="510" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="375" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CNI Plugin</text>
  <text x="375" y="349" text-anchor="middle" font-size="11" fill="#666">(Calico, Flannel, Cilium, Weave)</text>

  <!-- Connection lines to CNI -->
  <line x1="195" y1="310" x2="250" y2="310" stroke="#4a90e2" stroke-width="2"/>
  <line x1="555" y1="310" x2="500" y2="310" stroke="#4a90e2" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="48" text-anchor="middle" font-size="30.72" font-weight="bold" fill="var(--text)">Kubernetes Networking Model</text>
  <rect x="34.1333" y="68.5714" width="1211.7333" height="565.7143" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="13.6533 6.8267" />
  <text x="640" y="111.4286" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--primary-accent)">Kubernetes Cluster</text>
  <rect x="85.3333" y="137.1429" width="494.9333" height="342.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="332.8" y="180" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="var(--text)">Node A (10.0.1.0/24)</text>
  <rect x="128" y="205.7143" width="187.7333" height="137.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="221.8667" y="248.5714" text-anchor="middle" font-size="20.48" font-weight="bold" fill="var(--text)">Pod 1</text>
  <text x="221.8667" y="279.4286" text-anchor="middle" font-size="17.0667" fill="var(--text-muted)">10.0.1.2</text>
  <rect x="187.7333" y="294.8571" width="68.2667" height="34.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="221.8667" y="318.8571" text-anchor="middle" font-size="17.0667" fill="var(--danger-accent)">C1</text>
  <rect x="349.8667" y="205.7143" width="187.7333" height="137.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="443.7333" y="248.5714" text-anchor="middle" font-size="20.48" font-weight="bold" fill="var(--text)">Pod 2</text>
  <text x="443.7333" y="279.4286" text-anchor="middle" font-size="17.0667" fill="var(--text-muted)">10.0.1.3</text>
  <rect x="409.6" y="294.8571" width="68.2667" height="34.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="443.7333" y="318.8571" text-anchor="middle" font-size="17.0667" fill="var(--danger-accent)">C2</text>
  <rect x="699.7333" y="137.1429" width="494.9333" height="342.8571" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="947.2" y="180" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="var(--text)">Node B (10.0.2.0/24)</text>
  <rect x="742.4" y="205.7143" width="187.7333" height="137.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="836.2667" y="248.5714" text-anchor="middle" font-size="20.48" font-weight="bold" fill="var(--text)">Pod 3</text>
  <text x="836.2667" y="279.4286" text-anchor="middle" font-size="17.0667" fill="var(--text-muted)">10.0.2.2</text>
  <rect x="802.1333" y="294.8571" width="68.2667" height="34.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="836.2667" y="318.8571" text-anchor="middle" font-size="17.0667" fill="var(--danger-accent)">C3</text>
  <rect x="964.2667" y="205.7143" width="187.7333" height="137.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1058.1333" y="248.5714" text-anchor="middle" font-size="20.48" font-weight="bold" fill="var(--text)">Pod 4</text>
  <text x="1058.1333" y="279.4286" text-anchor="middle" font-size="17.0667" fill="var(--text-muted)">10.0.2.3</text>
  <rect x="1024" y="294.8571" width="68.2667" height="34.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1058.1333" y="318.8571" text-anchor="middle" font-size="17.0667" fill="var(--danger-accent)">C4</text>
  <line x1="332.8" y1="480" x2="332.8" y2="531.4286" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="947.2" y1="480" x2="947.2" y2="531.4286" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="204.8" y="531.4286" width="870.4" height="77.1429" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="570.8571" text-anchor="middle" font-size="22.1867" font-weight="bold" fill="var(--text)">CNI Plugin</text>
  <text x="640" y="598.2857" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">(Calico, Flannel, Cilium, Weave)</text>
  <line x1="332.8" y1="531.4286" x2="426.6667" y2="531.4286" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="947.2" y1="531.4286" x2="853.3333" y2="531.4286" stroke="var(--primary-border)" stroke-width="2" />
</svg>
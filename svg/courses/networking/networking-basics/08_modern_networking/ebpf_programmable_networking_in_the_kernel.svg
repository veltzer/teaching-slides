<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <text x="639.9999" y="40" text-anchor="middle" font-size="26.358339320733" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">User Space</text>

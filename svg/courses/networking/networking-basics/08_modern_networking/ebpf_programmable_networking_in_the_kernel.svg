<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <rect x="34.0199" y="29.7674" width="1122.6578" height="610.2326" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.3488" y="81.8605" text-anchor="middle" font-size="23.814" font-weight="bold" fill="var(--text)">User Space</text>
  <rect x="102.0598" y="111.6279" width="255.1495" height="74.4186" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="229.6345" y="156.2791" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text)">Cilium</text>
  <rect x="459.2691" y="111.6279" width="255.1495" height="74.4186" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="586.8438" y="156.2791" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text)">bpftrace</text>
  <rect x="816.4784" y="111.6279" width="255.1495" height="74.4186" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="944.0531" y="156.2791" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text)">tc + BPF</text>
  <line x1="34.0199" y1="230.6977" x2="1156.6778" y2="230.6977" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.9302 4.4651" />
  <text x="595.3488" y="587.907" text-anchor="middle" font-size="23.814" font-weight="bold" fill="var(--text)">Kernel Space</text>
  <line x1="229.6345" y1="186.0465" x2="229.6345" y2="260.4651" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="586.8438" y1="186.0465" x2="586.8438" y2="260.4651" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="944.0531" y1="186.0465" x2="944.0531" y2="260.4651" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="102.0598" y="260.4651" width="986.578" height="96.7442" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="595.3488" y="297.6744" text-anchor="middle" font-size="22.3256" font-weight="bold" fill="var(--text)">eBPF Virtual Machine</text>
  <text x="595.3488" y="334.8837" text-anchor="middle" font-size="17.8605" fill="var(--text-muted)">(verified, sandboxed programs)</text>
  <line x1="229.6345" y1="357.2093" x2="229.6345" y2="416.7442" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="586.8438" y1="357.2093" x2="586.8438" y2="416.7442" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="944.0531" y1="357.2093" x2="944.0531" y2="416.7442" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="102.0598" y="416.7442" width="255.1495" height="111.6279" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="229.6345" y="458.4186" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text)">XDP</text>
  <text x="229.6345" y="488.186" text-anchor="middle" font-size="17.8605" fill="var(--text-muted)">(packet filter)</text>
  <rect x="459.2691" y="416.7442" width="255.1495" height="111.6279" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="586.8438" y="458.4186" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text)">Traffic Control</text>
  <text x="586.8438" y="488.186" text-anchor="middle" font-size="17.8605" fill="var(--text-muted)">(tc)</text>
  <rect x="816.4784" y="416.7442" width="255.1495" height="111.6279" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="944.0531" y="458.4186" text-anchor="middle" font-size="20.8372" font-weight="bold" fill="var(--text)">Socket Filter</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
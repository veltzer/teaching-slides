  <line x1="630.909" y1="355.588166133202" x2="630.909" y2="423.823516998267" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1012.7272" y1="355.588166133202" x2="1012.7272" y2="423.823516998267" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="112.7273" y="423.823516998267" width="272.7272" height="127.941132136668" rx="6.588761235029" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="249.0909" y="471.588166133202" text-anchor="middle" font-size="23.06351945247" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">XDP</text>

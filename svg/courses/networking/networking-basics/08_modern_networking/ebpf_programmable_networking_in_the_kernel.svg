  <line x1="630.909" y1="159.411683131469" x2="630.909" y2="244.705811418669" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1012.7272" y1="159.411683131469" x2="1012.7272" y2="244.705811418669" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <rect x="112.7273" y="244.705811418669" width="1054.5453" height="110.882354714533" rx="6.588761235029" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="287.3529358564" text-anchor="middle" font-size="24.710929386602" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">eBPF Virtual Machine</text>
  <text x="639.9999" y="329.999939705869" text-anchor="middle" font-size="19.768809396894" fill="var(--text-muted)" font-family="Arial, sans-serif">(verified, sandboxed programs)</text>

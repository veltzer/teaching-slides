<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="Arial, sans-serif">
  <!-- Outer box - Kernel -->
  <rect x="20" y="20" width="660" height="410" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>

  <!-- User Space label -->
  <text x="350" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">User Space</text>

  <!-- User space tools -->
  <rect x="60" y="75" width="150" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="135" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Cilium</text>

  <rect x="270" y="75" width="150" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="345" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">bpftrace</text>

  <rect x="480" y="75" width="150" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="555" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">tc + BPF</text>

  <!-- Divider -->
  <line x1="20" y1="155" x2="680" y2="155" stroke="#4a90e2" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="350" y="395" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Kernel Space</text>

  <!-- Arrows down -->
  <line x1="135" y1="125" x2="135" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="345" y1="125" x2="345" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="555" y1="125" x2="555" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- eBPF VM -->
  <rect x="60" y="175" width="580" height="65" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">eBPF Virtual Machine</text>
  <text x="350" y="225" text-anchor="middle" font-size="12" fill="#555">(verified, sandboxed programs)</text>

  <!-- Arrows from VM to hooks -->
  <line x1="135" y1="240" x2="135" y2="280" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="345" y1="240" x2="345" y2="280" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="555" y1="240" x2="555" y2="280" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Kernel hooks -->
  <rect x="60" y="280" width="150" height="75" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="135" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">XDP</text>
  <text x="135" y="328" text-anchor="middle" font-size="12" fill="#555">(packet filter)</text>

  <rect x="270" y="280" width="150" height="75" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="345" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Traffic Control</text>
  <text x="345" y="328" text-anchor="middle" font-size="12" fill="#555">(tc)</text>

  <rect x="480" y="280" width="150" height="75" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="555" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Socket Filter</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
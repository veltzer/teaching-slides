  <text x="1012.7272" y="125.2941282872" text-anchor="middle" font-size="23.06351945247" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">tc + BPF</text>
  <line x1="40" y1="210.588256574399" x2="1240" y2="210.588256574399" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="8.9302 4.4651"/>

  <text x="639.999891304348" y="93.210988342731" text-anchor="middle" font-size="28.234092140203" fill="var(--text-muted)" font-family="Arial, sans-serif">(Consul, CoreDNS, AWS Cloud Map)</text>
  <line x1="40" y1="119.816482514098" x2="1240" y2="119.816482514098" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="159.724786844542" width="1200" height="101.100978768624" rx="7.025794542142" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804347826" y="207.614651123642" font-size="30.800731983024" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">web.service.consul</text>
  <text x="718.260760869565" y="207.614651123642" font-size="30.800731983024" fill="var(--text-muted)" font-family="Arial, sans-serif">→</text>
  <text x="770.434673913044" y="207.614651123642" font-size="30.800731983024" fill="var(--ok-accent)" font-family="Arial, sans-serif">10.0.1.5, 10.0.2.3</text>
  <rect x="40" y="279.449573689085" width="1200" height="101.100978768624" rx="7.025794542142" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804347826" y="327.339437968184" font-size="30.800731983024" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">api.service.consul</text>
  <text x="718.260760869565" y="327.339437968184" font-size="30.800731983024" fill="var(--text-muted)" font-family="Arial, sans-serif">→</text>
  <text x="770.434673913044" y="327.339437968184" font-size="30.800731983024" fill="var(--ok-accent)" font-family="Arial, sans-serif">10.0.1.8</text>
  <rect x="40" y="399.174234386833" width="1200" height="101.100978768624" rx="7.025794542142" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804347826" y="447.064224812726" font-size="30.800731983024" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">db.service.consul</text>
  <text x="718.260760869565" y="447.064224812726" font-size="30.800731983024" fill="var(--text-muted)" font-family="Arial, sans-serif">→</text>
  <text x="770.434673913044" y="447.064224812726" font-size="30.800731983024" fill="var(--ok-accent)" font-family="Arial, sans-serif">10.0.3.2</text>
  <rect x="40" y="518.899021231376" width="1200" height="101.100978768624" rx="7.025794542142" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="92.173804347826" y="566.789011657269" font-size="30.800731983024" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">cache.service.consul</text>
  <text x="718.260760869565" y="566.789011657269" font-size="30.800731983024" fill="var(--text-muted)" font-family="Arial, sans-serif">→</text>
  <text x="770.434673913044" y="566.789011657269" font-size="30.800731983024" fill="var(--ok-accent)" font-family="Arial, sans-serif">10.0.1.9, 10.0.2.7</text>
</svg>

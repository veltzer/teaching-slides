<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" font-family="Arial, sans-serif">
  <text x="270" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">DNS-Based Service Discovery</text>
  <!-- Main registry box -->
  <rect x="20" y="40" width="500" height="260" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>

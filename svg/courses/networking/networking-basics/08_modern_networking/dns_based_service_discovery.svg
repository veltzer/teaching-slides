  <text x="270" y="90" text-anchor="middle" font-size="11" fill="#555">(Consul, CoreDNS, AWS Cloud Map)</text>
  <line x1="40" y1="100" x2="500" y2="100" stroke="#4a90e2" stroke-width="1"/>
  <!-- Entries -->
  <rect x="40" y="115" width="460" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="60" y="133" font-size="12" font-weight="bold" fill="#333">web.service.consul</text>
  <text x="300" y="133" font-size="12" fill="#555">→</text>
  <text x="320" y="133" font-size="12" fill="#28a745">10.0.1.5, 10.0.2.3</text>
  <rect x="40" y="160" width="460" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="60" y="178" font-size="12" font-weight="bold" fill="#333">api.service.consul</text>
  <text x="300" y="178" font-size="12" fill="#555">→</text>
  <text x="320" y="178" font-size="12" fill="#28a745">10.0.1.8</text>
  <rect x="40" y="205" width="460" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="60" y="223" font-size="12" font-weight="bold" fill="#333">db.service.consul</text>
  <text x="300" y="223" font-size="12" fill="#555">→</text>
  <text x="320" y="223" font-size="12" fill="#28a745">10.0.3.2</text>
  <rect x="40" y="250" width="460" height="38" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="60" y="268" font-size="12" font-weight="bold" fill="#333">cache.service.consul</text>

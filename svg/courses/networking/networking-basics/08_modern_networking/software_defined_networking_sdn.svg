  <text x="524.3373" y="204.2272" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">+ Data</text>
  <text x="293.012" y="297.4182" text-anchor="middle" font-size="18.506" fill="var(--text-muted)">Each switch makes its own</text>

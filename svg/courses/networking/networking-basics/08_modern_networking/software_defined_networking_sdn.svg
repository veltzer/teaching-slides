<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="255.3846" y="40" text-anchor="middle" font-size="25.2803" font-weight="bold" fill="var(--text)">Traditional Network</text>
  <text x="886.1539" y="40" text-anchor="middle" font-size="25.2803" font-weight="bold" fill="var(--text)">SDN</text>
  <rect x="40" y="81.7265" width="153.8462" height="146.0432" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="116.9231" y="133.8849" text-anchor="middle" font-size="18.9602" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="116.9231" y="171.4389" text-anchor="middle" font-size="17.3803" fill="var(--text-muted)">Control</text>
  <text x="116.9231" y="202.7338" text-anchor="middle" font-size="17.3803" fill="var(--text-muted)">+ Data</text>
  <rect x="224.6154" y="81.7265" width="153.8462" height="146.0432" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="301.5385" y="133.8849" text-anchor="middle" font-size="18.9602" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="301.5385" y="171.4389" text-anchor="middle" font-size="17.3803" fill="var(--text-muted)">Control</text>
  <text x="301.5385" y="202.7338" text-anchor="middle" font-size="17.3803" fill="var(--text-muted)">+ Data</text>
  <rect x="409.2308" y="81.7265" width="153.8462" height="146.0432" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486.1538" y="133.8849" text-anchor="middle" font-size="18.9602" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="486.1538" y="171.4389" text-anchor="middle" font-size="17.3803" fill="var(--text-muted)">Control</text>
  <text x="486.1538" y="202.7338" text-anchor="middle" font-size="17.3803" fill="var(--text-muted)">+ Data</text>
  <text x="255.3846" y="300.7913" text-anchor="middle" font-size="18.9602" fill="var(--text-muted)">Each switch makes its own</text>
  <text x="255.3846" y="338.3453" text-anchor="middle" font-size="18.9602" fill="var(--text-muted)">forwarding decisions independently</text>
  <rect x="686.1539" y="81.7265" width="400" height="146.0432" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="886.1539" y="133.8849" text-anchor="middle" font-size="22.1203" font-weight="bold" fill="var(--text)">SDN Controller</text>
  <text x="886.1539" y="175.6116" text-anchor="middle" font-size="18.9602" fill="var(--text-muted)">(centralized control plane)</text>
  <line x1="778.4616" y1="227.7697" x2="778.4616" y2="384.2445" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="886.1539" y1="227.7697" x2="886.1539" y2="384.2445" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="993.8461" y1="227.7697" x2="993.8461" y2="384.2445" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="686.1539" y="384.2445" width="169.2308" height="125.1798" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="770.7693" y="436.4029" text-anchor="middle" font-size="18.9602" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="770.7693" y="478.1295" text-anchor="middle" font-size="17.3803" fill="var(--text-muted)">(data only)</text>
  <rect x="878.4616" y="384.2445" width="169.2308" height="125.1798" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="963.0769" y="436.4029" text-anchor="middle" font-size="18.9602" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="963.0769" y="478.1295" text-anchor="middle" font-size="17.3803" fill="var(--text-muted)">(data only)</text>
  <rect x="1070.7692" y="384.2445" width="169.2308" height="125.1798" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155.3846" y="436.4029" text-anchor="middle" font-size="18.9602" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="1155.3846" y="478.1295" text-anchor="middle" font-size="17.3803" fill="var(--text-muted)">(data only)</text>
  <text x="963.0769" y="582.446" text-anchor="middle" font-size="18.9602" fill="var(--text-muted)">Switches forward packets based</text>
  <text x="963.0769" y="620" text-anchor="middle" font-size="18.9602" fill="var(--text-muted)">on controller instructions</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="Arial, sans-serif">
  <text x="190" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Traditional Network</text>
  <text x="600" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SDN</text>
  <rect x="50" y="45" width="100" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="100" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Switch</text>
  <text x="100" y="88" text-anchor="middle" font-size="11" fill="#555">Control</text>
  <text x="100" y="103" text-anchor="middle" font-size="11" fill="#555">+ Data</text>
  <rect x="170" y="45" width="100" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="220" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Switch</text>
  <text x="220" y="88" text-anchor="middle" font-size="11" fill="#555">Control</text>
  <text x="220" y="103" text-anchor="middle" font-size="11" fill="#555">+ Data</text>
  <rect x="290" y="45" width="100" height="70" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="340" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Switch</text>
  <text x="340" y="88" text-anchor="middle" font-size="11" fill="#555">Control</text>
  <text x="340" y="103" text-anchor="middle" font-size="11" fill="#555">+ Data</text>
  <text x="190" y="150" text-anchor="middle" font-size="12" fill="#555">Each switch makes its own</text>
  <text x="190" y="168" text-anchor="middle" font-size="12" fill="#555">forwarding decisions independently</text>
  <rect x="470" y="45" width="260" height="70" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="600" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">SDN Controller</text>
  <text x="600" y="90" text-anchor="middle" font-size="12" fill="#555">(centralized control plane)</text>
  <line x1="530" y1="115" x2="530" y2="190" stroke="#4a90e2" stroke-width="2"/>
  <line x1="600" y1="115" x2="600" y2="190" stroke="#4a90e2" stroke-width="2"/>
  <line x1="670" y1="115" x2="670" y2="190" stroke="#4a90e2" stroke-width="2"/>
  <rect x="470" y="190" width="110" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="525" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Switch</text>
  <text x="525" y="235" text-anchor="middle" font-size="11" fill="#555">(data only)</text>
  <rect x="595" y="190" width="110" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="650" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Switch</text>
  <text x="650" y="235" text-anchor="middle" font-size="11" fill="#555">(data only)</text>
  <rect x="720" y="190" width="110" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="775" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Switch</text>
  <text x="775" y="235" text-anchor="middle" font-size="11" fill="#555">(data only)</text>
  <text x="650" y="285" text-anchor="middle" font-size="12" fill="#555">Switches forward packets based</text>
  <text x="650" y="303" text-anchor="middle" font-size="12" fill="#555">on controller instructions</text>
</svg>
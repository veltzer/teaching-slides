<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="293.012" y="49.5697" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--text)">Traditional Network</text>
  <text x="925.3012" y="49.5697" text-anchor="middle" font-size="24.6747" font-weight="bold" fill="var(--text)">SDN</text>
  <rect x="77.1084" y="89.2254" width="154.2169" height="138.7952" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="154.2169" y="138.7952" text-anchor="middle" font-size="18.506" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="154.2169" y="174.4854" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">Control</text>
  <text x="154.2169" y="204.2272" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">+ Data</text>
  <rect x="262.1687" y="89.2254" width="154.2169" height="138.7952" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="339.2771" y="138.7952" text-anchor="middle" font-size="18.506" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="339.2771" y="174.4854" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">Control</text>
  <text x="339.2771" y="204.2272" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">+ Data</text>
  <rect x="447.2289" y="89.2254" width="154.2169" height="138.7952" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="524.3373" y="138.7952" text-anchor="middle" font-size="18.506" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="524.3373" y="174.4854" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">Control</text>
  <text x="524.3373" y="204.2272" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">+ Data</text>
  <text x="293.012" y="297.4182" text-anchor="middle" font-size="18.506" fill="var(--text-muted)">Each switch makes its own</text>
  <text x="293.012" y="333.1084" text-anchor="middle" font-size="18.506" fill="var(--text-muted)">forwarding decisions independently</text>
  <rect x="724.8193" y="89.2254" width="400.9639" height="138.7952" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="925.3012" y="138.7952" text-anchor="middle" font-size="21.5904" font-weight="bold" fill="var(--text)">SDN Controller</text>
  <text x="925.3012" y="178.451" text-anchor="middle" font-size="18.506" fill="var(--text-muted)">(centralized control plane)</text>
  <line x1="817.3494" y1="228.0206" x2="817.3494" y2="376.7297" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="925.3012" y1="228.0206" x2="925.3012" y2="376.7297" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1033.253" y1="228.0206" x2="1033.253" y2="376.7297" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="724.8193" y="376.7297" width="169.6386" height="118.9673" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="809.6386" y="426.2995" text-anchor="middle" font-size="18.506" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="809.6386" y="465.9553" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">(data only)</text>
  <rect x="917.5904" y="376.7297" width="169.6386" height="118.9673" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1002.4096" y="426.2995" text-anchor="middle" font-size="18.506" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="1002.4096" y="465.9553" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">(data only)</text>
  <rect x="1110.3614" y="376.7297" width="169.6386" height="118.9673" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1195.1807" y="426.2995" text-anchor="middle" font-size="18.506" font-weight="bold" fill="var(--text)">Switch</text>
  <text x="1195.1807" y="465.9553" text-anchor="middle" font-size="16.9639" fill="var(--text-muted)">(data only)</text>
  <text x="1002.4096" y="565.0947" text-anchor="middle" font-size="18.506" fill="var(--text-muted)">Switches forward packets based</text>
  <text x="1002.4096" y="600.7849" text-anchor="middle" font-size="18.506" fill="var(--text-muted)">on controller instructions</text>
</svg>
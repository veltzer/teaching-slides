<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="216" y="81.8182" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Traditional (1990s-2000s)</text>
  <text x="640" y="81.8182" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Cloud Era (2010s)</text>
  <text x="1064" y="81.8182" text-anchor="middle" font-size="22.4" font-weight="bold" fill="#333">Cloud-Native (2020s)</text>
  <rect x="48" y="130.9091" width="336" height="425.4545" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="3.2" />
  <text x="216" y="229.0909" text-anchor="middle" font-size="20.8" fill="#555">Physical switches</text>
  <text x="216" y="294.5455" text-anchor="middle" font-size="20.8" fill="#555">Manual config</text>
  <text x="216" y="360" text-anchor="middle" font-size="20.8" fill="#555">Static topology</text>
  <text x="216" y="425.4545" text-anchor="middle" font-size="20.8" fill="#555">Hardware-bound</text>
  <rect x="472" y="130.9091" width="336" height="425.4545" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="640" y="229.0909" text-anchor="middle" font-size="20.8" fill="#555">Virtual networks</text>
  <text x="640" y="294.5455" text-anchor="middle" font-size="20.8" fill="#555">SDN controllers</text>
  <text x="640" y="360" text-anchor="middle" font-size="20.8" fill="#555">API-driven</text>
  <text x="640" y="425.4545" text-anchor="middle" font-size="20.8" fill="#555">Software-defined</text>
  <rect x="896" y="130.9091" width="336" height="425.4545" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="1064" y="229.0909" text-anchor="middle" font-size="20.8" fill="#555">Container overlay</text>
  <text x="1064" y="294.5455" text-anchor="middle" font-size="20.8" fill="#555">Service mesh</text>
  <text x="1064" y="360" text-anchor="middle" font-size="20.8" fill="#555">Zero trust</text>
  <text x="1064" y="425.4545" text-anchor="middle" font-size="20.8" fill="#555">Programmable</text>
  <line x1="384" y1="343.6364" x2="472" y2="343.6364" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arr)" />
  <line x1="808" y1="343.6364" x2="896" y2="343.6364" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arr)" />
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr" viewBox="0 0 10 10" refX="14.4" refY="16.3636" markerWidth="9.6" markerHeight="19.6364" orient="auto-start-forward">
      <path d="M 0 0 L 16 16.3636 L 0 32.7273 z" fill="#4a90e2" />
    </marker>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="210.2703" y="40" text-anchor="middle" font-size="24.9309" font-weight="bold" fill="var(--text)">Traditional (1990s-2000s)</text>
  <text x="640" y="40" text-anchor="middle" font-size="24.9309" font-weight="bold" fill="var(--text)">Cloud Era (2010s)</text>
  <text x="1069.7297" y="40" text-anchor="middle" font-size="24.9309" font-weight="bold" fill="var(--text)">Cloud-Native (2020s)</text>
  <rect x="40" y="100" width="340.5405" height="520" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="210.2703" y="220" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Physical switches</text>
  <text x="210.2703" y="300.0001" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Manual config</text>
  <text x="210.2703" y="380" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Static topology</text>
  <text x="210.2703" y="460" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Hardware-bound</text>
  <rect x="469.7297" y="100" width="340.5405" height="520" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="220" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Virtual networks</text>
  <text x="640" y="300.0001" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">SDN controllers</text>
  <text x="640" y="380" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">API-driven</text>
  <text x="640" y="460" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Software-defined</text>
  <rect x="899.4595" y="100" width="340.5405" height="520" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1069.7297" y="220" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Container overlay</text>
  <text x="1069.7297" y="300.0001" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Service mesh</text>
  <text x="1069.7297" y="380" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Zero trust</text>
  <text x="1069.7297" y="460" text-anchor="middle" font-size="23.1501" fill="var(--text-muted)">Programmable</text>
  <line x1="380.5405" y1="360.0001" x2="469.7297" y2="360.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="810.2703" y1="360.0001" x2="899.4595" y2="360.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
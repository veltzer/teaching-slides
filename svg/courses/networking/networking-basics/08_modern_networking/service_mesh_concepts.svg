<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="287.1795" y="52.9412" text-anchor="middle" font-size="24.6154" font-weight="bold" fill="var(--text)">Without Service Mesh</text>
  <text x="951.7949" y="52.9412" text-anchor="middle" font-size="24.6154" font-weight="bold" fill="var(--text)">With Service Mesh</text>
  <rect x="65.641" y="95.2941" width="213.3333" height="254.1176" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="172.3077" y="148.2353" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--text)">Service A</text>
  <text x="172.3077" y="190.5882" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">(retry, timeout,</text>
  <text x="172.3077" y="222.3529" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">circuit breaker,</text>
  <text x="172.3077" y="254.1176" text-anchor="middle" font-size="18.0513" fill="var(--text-muted)">in code)</text>
  <rect x="377.4359" y="95.2941" width="213.3333" height="254.1176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="484.1026" y="222.3529" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--text)">Service B</text>
  <line x1="278.9744" y1="222.3529" x2="377.4359" y2="222.3529" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="722.0513" y="95.2941" width="213.3333" height="254.1176" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="828.7179" y="148.2353" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--text)">Service A</text>
  <rect x="771.2821" y="211.7647" width="98.4615" height="63.5294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="820.5128" y="254.1176" text-anchor="middle" font-size="18.0513" fill="var(--text)">Proxy</text>
  <rect x="1033.8462" y="95.2941" width="213.3333" height="254.1176" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1140.5128" y="148.2353" text-anchor="middle" font-size="22.9744" font-weight="bold" fill="var(--text)">Service B</text>
  <rect x="1083.0769" y="211.7647" width="98.4615" height="63.5294" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1132.3077" y="254.1176" text-anchor="middle" font-size="18.0513" fill="var(--text)">Proxy</text>
  <line x1="869.7436" y1="243.5294" x2="1083.0769" y2="243.5294" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="828.7179" y="402.3529" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Sidecar</text>
  <text x="1140.5128" y="402.3529" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">Sidecar</text>
  <text x="951.7949" y="465.8824" text-anchor="middle" font-size="21.3333" fill="var(--text)">Proxies handle:</text>
  <text x="951.7949" y="508.2353" text-anchor="middle" font-size="19.6923" fill="var(--text-muted)">mTLS | Retries | Circuit breaking | Observability</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
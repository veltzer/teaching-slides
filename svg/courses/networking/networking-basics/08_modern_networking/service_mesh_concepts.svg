<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="265" y="40" text-anchor="middle" font-size="27.9989" font-weight="bold" fill="var(--text)">Without Service Mesh</text>
  <text x="940" y="40" text-anchor="middle" font-size="27.9989" font-weight="bold" fill="var(--text)">With Service Mesh</text>
  <rect x="40" y="93.9534" width="216.6666" height="323.7209" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="148.3334" y="161.3953" text-anchor="middle" font-size="26.1324" font-weight="bold" fill="var(--text)">Service A</text>
  <text x="148.3334" y="215.3488" text-anchor="middle" font-size="20.5326" fill="var(--text-muted)">(retry, timeout,</text>
  <text x="148.3334" y="255.8139" text-anchor="middle" font-size="20.5326" fill="var(--text-muted)">circuit breaker,</text>
  <text x="148.3334" y="296.279" text-anchor="middle" font-size="20.5326" fill="var(--text-muted)">in code)</text>
  <rect x="356.6667" y="93.9534" width="216.6666" height="323.7209" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="465" y="255.8139" text-anchor="middle" font-size="26.1324" font-weight="bold" fill="var(--text)">Service B</text>
  <line x1="256.6667" y1="255.8139" x2="356.6667" y2="255.8139" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="706.6667" y="93.9534" width="216.6666" height="323.7209" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="815" y="161.3953" text-anchor="middle" font-size="26.1324" font-weight="bold" fill="var(--text)">Service A</text>
  <rect x="756.6667" y="242.3256" width="100" height="80.9302" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="806.6666" y="296.279" text-anchor="middle" font-size="20.5326" fill="var(--text)">Proxy</text>
  <rect x="1023.3334" y="93.9534" width="216.6666" height="323.7209" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.6666" y="161.3953" text-anchor="middle" font-size="26.1324" font-weight="bold" fill="var(--text)">Service B</text>
  <rect x="1073.3333" y="242.3256" width="100" height="80.9302" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.3333" y="296.279" text-anchor="middle" font-size="20.5326" fill="var(--text)">Proxy</text>
  <line x1="856.6667" y1="282.7907" x2="1073.3333" y2="282.7907" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="815" y="485.1162" text-anchor="middle" font-size="22.3991" fill="var(--text-muted)">Sidecar</text>
  <text x="1131.6666" y="485.1162" text-anchor="middle" font-size="22.3991" fill="var(--text-muted)">Sidecar</text>
  <text x="940" y="566.0466" text-anchor="middle" font-size="24.2657" fill="var(--text)">Proxies handle:</text>
  <text x="940" y="620" text-anchor="middle" font-size="22.3991" fill="var(--text-muted)">mTLS | Retries | Circuit breaking | Observability</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
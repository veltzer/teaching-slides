<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="Arial, sans-serif">
  <text x="175" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Without Service Mesh</text>
  <text x="580" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">With Service Mesh</text>
  <rect x="40" y="45" width="130" height="120" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="105" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Service A</text>
  <text x="105" y="90" text-anchor="middle" font-size="11" fill="#555">(retry, timeout,</text>
  <text x="105" y="105" text-anchor="middle" font-size="11" fill="#555">circuit breaker,</text>
  <text x="105" y="120" text-anchor="middle" font-size="11" fill="#555">in code)</text>
  <rect x="230" y="45" width="130" height="120" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="295" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Service B</text>
  <line x1="170" y1="105" x2="230" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="440" y="45" width="130" height="120" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="505" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Service A</text>
  <rect x="470" y="100" width="60" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="500" y="120" text-anchor="middle" font-size="11" fill="#333">Proxy</text>
  <rect x="630" y="45" width="130" height="120" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="695" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Service B</text>
  <rect x="660" y="100" width="60" height="30" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="690" y="120" text-anchor="middle" font-size="11" fill="#333">Proxy</text>
  <line x1="530" y1="115" x2="660" y2="115" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="190" text-anchor="middle" font-size="12" fill="#555">Sidecar</text>
  <text x="695" y="190" text-anchor="middle" font-size="12" fill="#555">Sidecar</text>
  <text x="580" y="220" text-anchor="middle" font-size="13" fill="#333">Proxies handle:</text>
  <text x="580" y="240" text-anchor="middle" font-size="12" fill="#555">mTLS | Retries | Circuit breaking | Observability</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
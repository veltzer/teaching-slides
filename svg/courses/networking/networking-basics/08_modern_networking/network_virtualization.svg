<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="350.7913" y="40" text-anchor="middle" font-size="27.0093" font-weight="bold" fill="var(--text)">Original Frame</text>
  <rect x="91.7986" y="68.2926" width="207.1942" height="141.4634" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.3957" y="153.1707" text-anchor="middle" font-size="23.4081" fill="var(--text)">Eth Hdr</text>
  <rect x="298.9928" y="68.2926" width="207.1942" height="141.4634" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="402.5899" y="153.1707" text-anchor="middle" font-size="23.4081" fill="var(--text)">IP Hdr</text>
  <rect x="506.187" y="68.2926" width="207.1942" height="141.4634" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.7841" y="153.1707" text-anchor="middle" font-size="23.4081" fill="var(--text)">Data</text>
  <text x="652.9496" y="322.9268" text-anchor="middle" font-size="27.0093" font-weight="bold" fill="var(--text)">VXLAN Encapsulated</text>
  <rect x="40" y="365.3658" width="164.0287" height="155.6098" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.1511" y="430.439" text-anchor="middle" font-size="19.8068" fill="var(--text)">Outer</text>
  <text x="121.1511" y="478.5366" text-anchor="middle" font-size="19.8068" fill="var(--text)">Eth Hdr</text>
  <rect x="212.6619" y="365.3658" width="164.0287" height="155.6098" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="293.8129" y="430.439" text-anchor="middle" font-size="19.8068" fill="var(--text)">Outer</text>
  <text x="293.8129" y="478.5366" text-anchor="middle" font-size="19.8068" fill="var(--text)">IP Hdr</text>
  <rect x="385.3238" y="365.3658" width="164.0287" height="155.6098" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.4748" y="430.439" text-anchor="middle" font-size="19.8068" fill="var(--text)">Outer</text>
  <text x="466.4748" y="478.5366" text-anchor="middle" font-size="19.8068" fill="var(--text)">UDP (4789)</text>
  <rect x="557.9856" y="365.3658" width="164.0287" height="155.6098" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.1367" y="430.439" text-anchor="middle" font-size="19.8068" fill="var(--text)">VXLAN</text>
  <text x="639.1367" y="478.5366" text-anchor="middle" font-size="19.8068" fill="var(--text)">Header (VNI)</text>
  <rect x="730.6475" y="365.3658" width="164.0287" height="155.6098" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="811.7985" y="430.439" text-anchor="middle" font-size="19.8068" fill="var(--text)">Original</text>
  <text x="811.7985" y="478.5366" text-anchor="middle" font-size="19.8068" fill="var(--text)">Eth Hdr</text>
  <rect x="903.3094" y="365.3658" width="164.0287" height="155.6098" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="984.4604" y="430.439" text-anchor="middle" font-size="19.8068" fill="var(--text)">Original</text>
  <text x="984.4604" y="478.5366" text-anchor="middle" font-size="19.8068" fill="var(--text)">IP Hdr</text>
  <rect x="1075.9712" y="365.3658" width="164.0287" height="155.6098" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.1223" y="458.7317" text-anchor="middle" font-size="23.4081" fill="var(--text)">Data</text>
  <text x="350.7913" y="620" text-anchor="middle" font-size="21.6075" fill="var(--warn-accent)" font-weight="bold">Outer transport headers</text>
  <line x1="40" y1="563.4146" x2="722.0144" y2="563.4146" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.8267 5.12" />
  <text x="989.6403" y="620" text-anchor="middle" font-size="21.6075" fill="var(--primary-accent)" font-weight="bold">Inner original headers + data</text>
  <line x1="730.6475" y1="563.4146" x2="1240" y2="563.4146" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6.8267 5.12" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 280" font-family="Arial, sans-serif">
  <!-- Title: Original Frame -->
  <text x="200" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Original Frame</text>
  <rect x="50" y="40" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="70" text-anchor="middle" font-size="13" fill="#333">Eth Hdr</text>
  <rect x="170" y="40" width="120" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="230" y="70" text-anchor="middle" font-size="13" fill="#333">IP Hdr</text>
  <rect x="290" y="40" width="120" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="70" text-anchor="middle" font-size="13" fill="#333">Data</text>

  <!-- Title: VXLAN Encapsulated -->
  <text x="375" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">VXLAN Encapsulated</text>

  <!-- Outer headers -->
  <rect x="20" y="145" width="95" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="67" y="168" text-anchor="middle" font-size="11" fill="#333">Outer</text>
  <text x="67" y="185" text-anchor="middle" font-size="11" fill="#333">Eth Hdr</text>

  <rect x="120" y="145" width="95" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="167" y="168" text-anchor="middle" font-size="11" fill="#333">Outer</text>
  <text x="167" y="185" text-anchor="middle" font-size="11" fill="#333">IP Hdr</text>

  <rect x="220" y="145" width="95" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="267" y="168" text-anchor="middle" font-size="11" fill="#333">Outer</text>
  <text x="267" y="185" text-anchor="middle" font-size="11" fill="#333">UDP (4789)</text>

  <rect x="320" y="145" width="95" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="367" y="168" text-anchor="middle" font-size="11" fill="#333">VXLAN</text>
  <text x="367" y="185" text-anchor="middle" font-size="11" fill="#333">Header (VNI)</text>

  <!-- Inner headers -->
  <rect x="420" y="145" width="95" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="467" y="168" text-anchor="middle" font-size="11" fill="#333">Original</text>
  <text x="467" y="185" text-anchor="middle" font-size="11" fill="#333">Eth Hdr</text>

  <rect x="520" y="145" width="95" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="567" y="168" text-anchor="middle" font-size="11" fill="#333">Original</text>
  <text x="567" y="185" text-anchor="middle" font-size="11" fill="#333">IP Hdr</text>

  <rect x="620" y="145" width="95" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="667" y="178" text-anchor="middle" font-size="13" fill="#333">Data</text>

  <!-- Labels -->
  <text x="200" y="235" text-anchor="middle" font-size="12" fill="#ffc107" font-weight="bold">Outer transport headers</text>
  <line x1="20" y1="215" x2="415" y2="215" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="570" y="235" text-anchor="middle" font-size="12" fill="#4a90e2" font-weight="bold">Inner original headers + data</text>
  <line x1="420" y1="215" x2="715" y2="215" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
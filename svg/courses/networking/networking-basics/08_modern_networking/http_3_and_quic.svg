<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="190.4465" y="59.0769" text-anchor="middle" font-size="23.8058" font-weight="bold" fill="var(--text)">HTTP/1.1 + TLS</text>
  <rect x="63.4822" y="88.6154" width="253.9287" height="88.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="190.4465" y="143.7538" text-anchor="middle" font-size="22.2187" fill="var(--text)">HTTP/1.1</text>
  <rect x="63.4822" y="177.2307" width="253.9287" height="88.6154" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="190.4465" y="232.3693" text-anchor="middle" font-size="22.2187" fill="var(--text)">TLS</text>
  <rect x="63.4822" y="265.8462" width="253.9287" height="88.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="190.4465" y="320.9846" text-anchor="middle" font-size="22.2187" fill="var(--text)">TCP</text>
  <rect x="63.4822" y="354.4616" width="253.9287" height="88.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="190.4465" y="409.6" text-anchor="middle" font-size="22.2187" fill="var(--text)">IP</text>
  <rect x="63.4822" y="482.4615" width="253.9287" height="78.7692" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="190.4465" y="531.6923" text-anchor="middle" font-size="19.0446" fill="var(--danger-accent)">3 RTT to first data</text>
  <text x="595.1453" y="59.0769" text-anchor="middle" font-size="23.8058" font-weight="bold" fill="var(--text)">HTTP/2 + TLS</text>
  <rect x="468.181" y="88.6154" width="253.9287" height="88.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.1453" y="143.7538" text-anchor="middle" font-size="22.2187" fill="var(--text)">HTTP/2</text>
  <rect x="468.181" y="177.2307" width="253.9287" height="88.6154" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="595.1453" y="232.3693" text-anchor="middle" font-size="22.2187" fill="var(--text)">TLS</text>
  <rect x="468.181" y="265.8462" width="253.9287" height="88.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.1453" y="320.9846" text-anchor="middle" font-size="22.2187" fill="var(--text)">TCP</text>
  <rect x="468.181" y="354.4616" width="253.9287" height="88.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.1453" y="409.6" text-anchor="middle" font-size="22.2187" fill="var(--text)">IP</text>
  <rect x="468.181" y="482.4615" width="253.9287" height="78.7692" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="595.1453" y="531.6923" text-anchor="middle" font-size="19.0446" fill="var(--danger-accent)">3 RTT to first data</text>
  <text x="991.9089" y="59.0769" text-anchor="middle" font-size="23.8058" font-weight="bold" fill="var(--text)">HTTP/3 + QUIC</text>
  <rect x="864.9445" y="88.6154" width="253.9287" height="88.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="991.9089" y="143.7538" text-anchor="middle" font-size="22.2187" fill="var(--text)">HTTP/3</text>
  <rect x="864.9445" y="177.2307" width="253.9287" height="157.5385" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="991.9089" y="232.3693" text-anchor="middle" font-size="22.2187" fill="var(--text)">QUIC</text>
  <text x="991.9089" y="275.6923" text-anchor="middle" font-size="19.0446" fill="var(--text-muted)">(includes TLS 1.3)</text>
  <rect x="864.9445" y="334.7692" width="253.9287" height="88.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="991.9089" y="389.9077" text-anchor="middle" font-size="22.2187" fill="var(--text)">UDP</text>
  <rect x="864.9445" y="423.3846" width="253.9287" height="88.6154" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="991.9089" y="478.523" text-anchor="middle" font-size="22.2187" fill="var(--text)">IP</text>
  <rect x="864.9445" y="541.5384" width="253.9287" height="98.4616" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="991.9089" y="580.9231" text-anchor="middle" font-size="19.0446" fill="var(--ok-accent)">1 RTT to first data</text>
  <text x="991.9089" y="620.3077" text-anchor="middle" font-size="19.0446" fill="var(--ok-accent)">0 RTT on reconnect</text>
</svg>
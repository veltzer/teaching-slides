<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="184.3609" y="40" text-anchor="middle" font-size="25.3642" font-weight="bold" fill="var(--text)">HTTP/1.1 + TLS</text>
  <rect x="40" y="69.4916" width="288.7218" height="88.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.3609" y="124.5423" text-anchor="middle" font-size="23.6732" fill="var(--text)">HTTP/1.1</text>
  <rect x="40" y="157.9661" width="288.7218" height="88.4746" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.3609" y="213.017" text-anchor="middle" font-size="23.6732" fill="var(--text)">TLS</text>
  <rect x="40" y="246.4407" width="288.7218" height="88.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.3609" y="301.4915" text-anchor="middle" font-size="23.6732" fill="var(--text)">TCP</text>
  <rect x="40" y="334.9153" width="288.7218" height="88.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.3609" y="389.9661" text-anchor="middle" font-size="23.6732" fill="var(--text)">IP</text>
  <rect x="40" y="462.7118" width="288.7218" height="78.644" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.3609" y="511.8644" text-anchor="middle" font-size="20.2913" fill="var(--danger-accent)">3 RTT to first data</text>
  <text x="644.5112" y="40" text-anchor="middle" font-size="25.3642" font-weight="bold" fill="var(--text)">HTTP/2 + TLS</text>
  <rect x="500.1504" y="69.4916" width="288.7218" height="88.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.5112" y="124.5423" text-anchor="middle" font-size="23.6732" fill="var(--text)">HTTP/2</text>
  <rect x="500.1504" y="157.9661" width="288.7218" height="88.4746" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.5112" y="213.017" text-anchor="middle" font-size="23.6732" fill="var(--text)">TLS</text>
  <rect x="500.1504" y="246.4407" width="288.7218" height="88.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.5112" y="301.4915" text-anchor="middle" font-size="23.6732" fill="var(--text)">TCP</text>
  <rect x="500.1504" y="334.9153" width="288.7218" height="88.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.5112" y="389.9661" text-anchor="middle" font-size="23.6732" fill="var(--text)">IP</text>
  <rect x="500.1504" y="462.7118" width="288.7218" height="78.644" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.5112" y="511.8644" text-anchor="middle" font-size="20.2913" fill="var(--danger-accent)">3 RTT to first data</text>
  <text x="1095.6391" y="40" text-anchor="middle" font-size="25.3642" font-weight="bold" fill="var(--text)">HTTP/3 + QUIC</text>
  <rect x="951.2782" y="69.4916" width="288.7218" height="88.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.6391" y="124.5423" text-anchor="middle" font-size="23.6732" fill="var(--text)">HTTP/3</text>
  <rect x="951.2782" y="157.9661" width="288.7218" height="157.2882" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.6391" y="213.017" text-anchor="middle" font-size="23.6732" fill="var(--text)">QUIC</text>
  <text x="1095.6391" y="256.2712" text-anchor="middle" font-size="20.2913" fill="var(--text-muted)">(includes TLS 1.3)</text>
  <rect x="951.2782" y="315.2542" width="288.7218" height="88.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.6391" y="370.3051" text-anchor="middle" font-size="23.6732" fill="var(--text)">UDP</text>
  <rect x="951.2782" y="403.7288" width="288.7218" height="88.4746" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.6391" y="458.7796" text-anchor="middle" font-size="23.6732" fill="var(--text)">IP</text>
  <rect x="951.2782" y="521.6949" width="288.7218" height="98.3051" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.6391" y="561.017" text-anchor="middle" font-size="20.2913" fill="var(--ok-accent)">1 RTT to first data</text>
  <text x="1095.6391" y="600.339" text-anchor="middle" font-size="20.2913" fill="var(--ok-accent)">0 RTT on reconnect</text>
</svg>
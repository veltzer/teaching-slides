<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 340" font-family="Arial, sans-serif">
  <!-- HTTP/1.1 + TLS stack -->
  <text x="120" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">HTTP/1.1 + TLS</text>
  <rect x="40" y="45" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="73" text-anchor="middle" font-size="14" fill="#333">HTTP/1.1</text>
  <rect x="40" y="90" width="160" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" font-size="14" fill="#333">TLS</text>
  <rect x="40" y="135" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="163" text-anchor="middle" font-size="14" fill="#333">TCP</text>
  <rect x="40" y="180" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="208" text-anchor="middle" font-size="14" fill="#333">IP</text>
  <rect x="40" y="245" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="120" y="270" text-anchor="middle" font-size="12" fill="#dc3545">3 RTT to first data</text>

  <!-- HTTP/2 + TLS stack -->
  <text x="375" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">HTTP/2 + TLS</text>
  <rect x="295" y="45" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="73" text-anchor="middle" font-size="14" fill="#333">HTTP/2</text>
  <rect x="295" y="90" width="160" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="375" y="118" text-anchor="middle" font-size="14" fill="#333">TLS</text>
  <rect x="295" y="135" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="163" text-anchor="middle" font-size="14" fill="#333">TCP</text>
  <rect x="295" y="180" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="208" text-anchor="middle" font-size="14" fill="#333">IP</text>
  <rect x="295" y="245" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="375" y="270" text-anchor="middle" font-size="12" fill="#dc3545">3 RTT to first data</text>

  <!-- HTTP/3 + QUIC stack -->
  <text x="625" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">HTTP/3 + QUIC</text>
  <rect x="545" y="45" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="625" y="73" text-anchor="middle" font-size="14" fill="#333">HTTP/3</text>
  <rect x="545" y="90" width="160" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="625" y="118" text-anchor="middle" font-size="14" fill="#333">QUIC</text>
  <text x="625" y="140" text-anchor="middle" font-size="12" fill="#555">(includes TLS 1.3)</text>
  <rect x="545" y="170" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="625" y="198" text-anchor="middle" font-size="14" fill="#333">UDP</text>
  <rect x="545" y="215" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="625" y="243" text-anchor="middle" font-size="14" fill="#333">IP</text>
  <rect x="545" y="275" width="160" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="625" y="295" text-anchor="middle" font-size="12" fill="#28a745">1 RTT to first data</text>
  <text x="625" y="315" text-anchor="middle" font-size="12" fill="#28a745">0 RTT on reconnect</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="301.9718" y="40" text-anchor="middle" font-size="32.5194" font-weight="bold" fill="var(--text)">REST/JSON</text>
  <rect x="40" y="104.4444" width="202.8169" height="177.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="141.4084" y="207.5556" text-anchor="middle" font-size="28.4544" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="411.831" y="104.4444" width="202.8169" height="177.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="513.2394" y="207.5556" text-anchor="middle" font-size="28.4544" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="242.8169" y1="162.4444" x2="408.4507" y2="162.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="325.6338" y="143.1111" text-anchor="middle" font-size="22.357" fill="var(--text-muted)">JSON</text>
  <line x1="408.4507" y1="226.8889" x2="242.8169" y2="226.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="325.6338" y="265.5556" text-anchor="middle" font-size="22.357" fill="var(--text-muted)">JSON</text>
  <text x="301.9718" y="72.2222" text-anchor="middle" font-size="24.3895" fill="var(--text-faint)">HTTP/1.1</text>
  <rect x="40" y="346.1111" width="574.6479" height="273.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="327.3239" y="420.2222" text-anchor="middle" font-size="26.422" fill="var(--text-muted)">Text-based &amp; larger payload</text>
  <text x="327.3239" y="484.6667" text-anchor="middle" font-size="26.422" fill="var(--text-muted)">No type safety</text>
  <text x="327.3239" y="549.1111" text-anchor="middle" font-size="26.422" fill="var(--text-muted)">Request/response only</text>
  <text x="952.676" y="40" text-anchor="middle" font-size="32.5194" font-weight="bold" fill="var(--text)">gRPC/Protobuf</text>
  <rect x="716.0563" y="104.4444" width="202.8169" height="177.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="817.4648" y="207.5556" text-anchor="middle" font-size="28.4544" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="1070.9859" y="104.4444" width="169.0141" height="177.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1155.4929" y="207.5556" text-anchor="middle" font-size="28.4544" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="918.8732" y1="162.4444" x2="1067.6055" y2="162.4444" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="993.2394" y="143.1111" text-anchor="middle" font-size="22.357" fill="var(--text-muted)">Binary</text>
  <line x1="1067.6055" y1="226.8889" x2="918.8732" y2="226.8889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="993.2394" y="265.5556" text-anchor="middle" font-size="22.357" fill="var(--text-muted)">Binary</text>
  <text x="952.676" y="72.2222" text-anchor="middle" font-size="24.3895" fill="var(--text-faint)">HTTP/2</text>
  <rect x="699.1549" y="346.1111" width="540.845" height="273.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="969.5774" y="420.2222" text-anchor="middle" font-size="26.422" fill="var(--text-muted)">Binary &amp; smaller payload</text>
  <text x="969.5774" y="484.6667" text-anchor="middle" font-size="26.422" fill="var(--text-muted)">Strongly typed</text>
  <text x="969.5774" y="549.1111" text-anchor="middle" font-size="26.422" fill="var(--text-muted)">Streaming support</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
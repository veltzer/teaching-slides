<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="315.7333" y="67.5" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="var(--text)">REST/JSON</text>
  <rect x="51.2" y="112.5" width="204.8" height="123.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="153.6" y="184.5" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="426.6667" y="112.5" width="204.8" height="123.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="529.0667" y="184.5" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="256" y1="153" x2="423.2533" y2="153" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="339.6267" y="139.5" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">JSON</text>
  <line x1="423.2533" y1="198" x2="256" y2="198" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="339.6267" y="225" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">JSON</text>
  <text x="315.7333" y="90" text-anchor="middle" font-size="20.48" fill="var(--text-faint)">HTTP/1.1</text>
  <rect x="51.2" y="281.25" width="580.2667" height="191.25" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="341.3333" y="333" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">Text-based &amp; larger payload</text>
  <text x="341.3333" y="378" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">No type safety</text>
  <text x="341.3333" y="423" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">Request/response only</text>
  <text x="972.8" y="67.5" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="var(--text)">gRPC/Protobuf</text>
  <rect x="733.8667" y="112.5" width="204.8" height="123.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="836.2667" y="184.5" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="1092.2667" y="112.5" width="170.6667" height="123.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1177.6" y="184.5" text-anchor="middle" font-size="23.8933" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="938.6667" y1="153" x2="1088.8533" y2="153" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="1013.76" y="139.5" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Binary</text>
  <line x1="1088.8533" y1="198" x2="938.6667" y2="198" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="1013.76" y="225" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Binary</text>
  <text x="972.8" y="90" text-anchor="middle" font-size="20.48" fill="var(--text-faint)">HTTP/2</text>
  <rect x="716.8" y="281.25" width="546.1333" height="191.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="989.8667" y="333" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">Binary &amp; smaller payload</text>
  <text x="989.8667" y="378" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">Strongly typed</text>
  <text x="989.8667" y="423" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">Streaming support</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
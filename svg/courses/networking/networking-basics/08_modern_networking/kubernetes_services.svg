<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 350" font-family="Arial, sans-serif">
  <!-- Client -->
  <rect x="20" y="80" width="140" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="90" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Client</text>
  <text x="90" y="127" text-anchor="middle" font-size="11" fill="#555">ClusterIP: 10.96.0.100</text>

  <!-- Arrow to service -->
  <line x1="160" y1="110" x2="240" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#ksarr)"/>

  <!-- Service -->
  <rect x="240" y="70" width="200" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="340" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Service</text>
  <text x="340" y="118" text-anchor="middle" font-size="13" fill="#555">web-service</text>
  <text x="340" y="138" text-anchor="middle" font-size="12" fill="#555">10.96.0.100:80</text>

  <!-- Load balances label -->
  <text x="340" y="175" text-anchor="middle" font-size="12" fill="#888">load balances to</text>

  <!-- Arrows to pods -->
  <line x1="260" y1="150" x2="120" y2="230" stroke="#28a745" stroke-width="2" marker-end="url(#ksarr2)"/>
  <line x1="340" y1="150" x2="340" y2="230" stroke="#28a745" stroke-width="2" marker-end="url(#ksarr2)"/>
  <line x1="420" y1="150" x2="480" y2="230" stroke="#28a745" stroke-width="2" marker-end="url(#ksarr2)"/>

  <!-- Pod 1 -->
  <rect x="50" y="230" width="140" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="120" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Pod 1</text>
  <text x="120" y="275" text-anchor="middle" font-size="12" fill="#555">10.0.1.2</text>

  <!-- Pod 2 -->
  <rect x="240" y="230" width="140" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="310" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Pod 2</text>
  <text x="310" y="275" text-anchor="middle" font-size="12" fill="#555">10.0.2.3</text>

  <!-- Pod 3 -->
  <rect x="410" y="230" width="140" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="480" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Pod 3</text>
  <text x="480" y="275" text-anchor="middle" font-size="12" fill="#555">10.0.1.4</text>

  <defs>
    <marker id="ksarr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="ksarr2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
</svg>
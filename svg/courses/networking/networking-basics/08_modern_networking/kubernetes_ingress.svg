<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" font-family="Arial, sans-serif">
  <!-- Internet -->
  <rect x="230" y="15" width="180" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="320" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Internet</text>

  <!-- Arrow down -->
  <line x1="320" y1="55" x2="320" y2="85" stroke="#4a90e2" stroke-width="2" marker-end="url(#karr)"/>

  <!-- Ingress Controller -->
  <rect x="140" y="85" width="360" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="320" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Ingress Controller</text>
  <text x="320" y="130" text-anchor="middle" font-size="12" fill="#555">(nginx, traefik, envoy)</text>

  <!-- Arrows to services -->
  <line x1="160" y1="145" x2="110" y2="200" stroke="#4a90e2" stroke-width="2" marker-end="url(#karr)"/>
  <line x1="320" y1="145" x2="320" y2="200" stroke="#4a90e2" stroke-width="2" marker-end="url(#karr)"/>
  <line x1="480" y1="145" x2="530" y2="200" stroke="#4a90e2" stroke-width="2" marker-end="url(#karr)"/>

  <!-- Domain labels -->
  <text x="110" y="185" text-anchor="middle" font-size="11" fill="#555">api.example.com</text>
  <text x="320" y="185" text-anchor="middle" font-size="11" fill="#555">www.example.com</text>
  <text x="530" y="185" text-anchor="middle" font-size="11" fill="#555">blog.example.com</text>

  <!-- Services -->
  <rect x="40" y="200" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">api-svc</text>

  <rect x="250" y="200" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="320" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">web-svc</text>

  <rect x="460" y="200" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="530" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">blog-svc</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="karr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
</svg>
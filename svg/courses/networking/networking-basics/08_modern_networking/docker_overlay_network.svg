  <line x1="258.1818" y1="322.3684" x2="258.1818" y2="360.5263" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="730.9091" y="40" width="509.0909" height="503.6842" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="985.4545" y="85.7895" text-anchor="middle" font-size="25.8075" font-weight="bold" fill="var(--text)">Host B</text>
  <rect x="840" y="116.3158" width="290.909" height="83.9474" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />

  <text x="238.9333" y="276.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--text)">Overlay Net</text>
  <text x="238.9333" y="308.8" text-anchor="middle" font-size="19.2" fill="var(--text-muted)">VXLAN tunnel</text>
  <rect x="85.3334" y="368" width="307.2" height="88" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="238.9333" y="404.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--text)">eth0</text>
  <text x="238.9333" y="436.8" text-anchor="middle" font-size="19.2" fill="var(--text-muted)">192.168.1.10</text>
  <line x1="238.9333" y1="200" x2="238.9333" y2="240" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="238.9333" y1="328" x2="238.9333" y2="368" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="682.6667" y="32" width="477.8667" height="528" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="921.6" y="80" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">Host B</text>
  <rect x="785.0667" y="112" width="273.0666" height="88" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="921.6" y="148.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--text)">Container</text>
  <text x="921.6" y="180.8" text-anchor="middle" font-size="19.2" fill="var(--text-muted)">10.0.0.3</text>
  <rect x="767.9999" y="240" width="307.2" height="88" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="921.6" y="276.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--text)">Overlay Net</text>
  <text x="921.6" y="308.8" text-anchor="middle" font-size="19.2" fill="var(--text-muted)">VXLAN tunnel</text>
  <rect x="767.9999" y="368" width="307.2" height="88" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="921.6" y="404.8" text-anchor="middle" font-size="20.8" font-weight="bold" fill="var(--text)">eth0</text>
  <text x="921.6" y="436.8" text-anchor="middle" font-size="19.2" fill="var(--text-muted)">192.168.1.20</text>
  <line x1="921.6" y1="200" x2="921.6" y2="240" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="921.6" y1="328" x2="921.6" y2="368" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="238.9333" y1="456" x2="238.9333" y2="608" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="921.6" y1="456" x2="921.6" y2="608" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="238.9333" y1="608" x2="921.6" y2="608" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="12.8 6.4" />
  <text x="580.2667" y="640" text-anchor="middle" font-size="22.4" font-weight="bold" fill="var(--primary-accent)">VXLAN Tunnel</text>
</svg>
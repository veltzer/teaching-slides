<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Arial, sans-serif">
  <!-- Host A -->
  <rect x="20" y="20" width="280" height="330" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="160" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Host A</text>
  <!-- Container A -->
  <rect x="60" y="70" width="160" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="140" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Container</text>
  <text x="140" y="113" text-anchor="middle" font-size="12" fill="#555">10.0.0.2</text>
  <!-- Overlay Net A -->
  <rect x="50" y="150" width="180" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="140" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Overlay Net</text>
  <text x="140" y="193" text-anchor="middle" font-size="12" fill="#555">VXLAN tunnel</text>
  <!-- eth0 A -->
  <rect x="50" y="230" width="180" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">eth0</text>
  <text x="140" y="273" text-anchor="middle" font-size="12" fill="#555">192.168.1.10</text>
  <!-- Lines Host A -->
  <line x1="140" y1="125" x2="140" y2="150" stroke="#4a90e2" stroke-width="2"/>
  <line x1="140" y1="205" x2="140" y2="230" stroke="#4a90e2" stroke-width="2"/>

  <!-- Host B -->
  <rect x="400" y="20" width="280" height="330" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="540" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Host B</text>
  <!-- Container B -->
  <rect x="460" y="70" width="160" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="540" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Container</text>
  <text x="540" y="113" text-anchor="middle" font-size="12" fill="#555">10.0.0.3</text>
  <!-- Overlay Net B -->
  <rect x="450" y="150" width="180" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="540" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Overlay Net</text>
  <text x="540" y="193" text-anchor="middle" font-size="12" fill="#555">VXLAN tunnel</text>
  <!-- eth0 B -->
  <rect x="450" y="230" width="180" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="540" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">eth0</text>
  <text x="540" y="273" text-anchor="middle" font-size="12" fill="#555">192.168.1.20</text>
  <!-- Lines Host B -->
  <line x1="540" y1="125" x2="540" y2="150" stroke="#4a90e2" stroke-width="2"/>
  <line x1="540" y1="205" x2="540" y2="230" stroke="#4a90e2" stroke-width="2"/>

  <!-- VXLAN tunnel connection -->
  <line x1="140" y1="285" x2="140" y2="380" stroke="#4a90e2" stroke-width="2"/>
  <line x1="540" y1="285" x2="540" y2="380" stroke="#4a90e2" stroke-width="2"/>
  <line x1="140" y1="380" x2="540" y2="380" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="340" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">VXLAN Tunnel</text>
</svg>
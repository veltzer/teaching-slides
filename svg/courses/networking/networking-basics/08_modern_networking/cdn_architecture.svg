<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="606.8148" y="42.6667" text-anchor="middle" font-size="25.6" font-weight="bold" fill="var(--text)">CDN Architecture</text>
  <rect x="476.783" y="71.1111" width="260.0635" height="78.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="606.8148" y="102.4" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--text)">Origin Server</text>
  <text x="606.8148" y="130.8444" text-anchor="middle" font-size="15.6444" fill="var(--text-muted)">(your server)</text>
  <line x1="520.127" y1="149.3333" x2="225.3884" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="606.8148" y1="149.3333" x2="606.8148" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="693.5027" y1="149.3333" x2="988.2413" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="86.6879" y="263.1111" width="277.401" height="78.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="225.3884" y="294.4" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--text)">CDN Edge</text>
  <text x="225.3884" y="322.8444" text-anchor="middle" font-size="15.6444" fill="var(--text-muted)">US-East</text>
  <rect x="468.1143" y="263.1111" width="277.401" height="78.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="606.8148" y="294.4" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--text)">CDN Edge</text>
  <text x="606.8148" y="322.8444" text-anchor="middle" font-size="15.6444" fill="var(--text-muted)">Europe</text>
  <rect x="849.5407" y="263.1111" width="277.401" height="78.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="988.2413" y="294.4" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--text)">CDN Edge</text>
  <text x="988.2413" y="322.8444" text-anchor="middle" font-size="15.6444" fill="var(--text-muted)">Asia</text>
  <line x1="225.3884" y1="341.3333" x2="225.3884" y2="440.8889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="606.8148" y1="341.3333" x2="606.8148" y2="440.8889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="988.2413" y1="341.3333" x2="988.2413" y2="440.8889" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="86.6879" y="448" width="277.401" height="92.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="225.3884" y="483.5556" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--text)">US Users</text>
  <text x="225.3884" y="512" text-anchor="middle" font-size="17.0667" fill="var(--ok-accent)" font-weight="bold">~5ms</text>
  <rect x="468.1143" y="448" width="277.401" height="92.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="606.8148" y="483.5556" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--text)">EU Users</text>
  <text x="606.8148" y="512" text-anchor="middle" font-size="17.0667" fill="var(--ok-accent)" font-weight="bold">~10ms</text>
  <rect x="849.5407" y="448" width="277.401" height="92.4444" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="988.2413" y="483.5556" text-anchor="middle" font-size="18.4889" font-weight="bold" fill="var(--text)">AS Users</text>
  <text x="988.2413" y="512" text-anchor="middle" font-size="17.0667" fill="var(--ok-accent)" font-weight="bold">~15ms</text>
  <rect x="260.0635" y="583.1111" width="693.5027" height="56.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="606.8148" y="618.6667" text-anchor="middle" font-size="18.4889" fill="var(--danger-accent)" font-weight="bold">vs ~200ms to origin from all locations</text>
</svg>
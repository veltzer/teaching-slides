<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="27.0936" font-weight="bold" fill="var(--text)">CDN Architecture</text>
  <rect x="489.9999" y="67.619" width="300.0001" height="75.9524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="98" text-anchor="middle" font-size="19.5676" font-weight="bold" fill="var(--text)">Origin Server</text>
  <text x="640" y="125.619" text-anchor="middle" font-size="16.5571" fill="var(--text-muted)">(your server)</text>
  <line x1="540" y1="143.5714" x2="200" y2="247.1428" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="640" y1="143.5714" x2="640" y2="247.1428" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="740.0001" y1="143.5714" x2="1080.0001" y2="247.1428" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <rect x="40" y="254.0476" width="320" height="75.9524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="284.4286" text-anchor="middle" font-size="19.5676" font-weight="bold" fill="var(--text)">CDN Edge</text>
  <text x="200" y="312.0476" text-anchor="middle" font-size="16.5571" fill="var(--text-muted)">US-East</text>
  <rect x="480" y="254.0476" width="320" height="75.9524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="284.4286" text-anchor="middle" font-size="19.5676" font-weight="bold" fill="var(--text)">CDN Edge</text>
  <text x="640" y="312.0476" text-anchor="middle" font-size="16.5571" fill="var(--text-muted)">Europe</text>
  <rect x="920" y="254.0476" width="320" height="75.9524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080.0001" y="284.4286" text-anchor="middle" font-size="19.5676" font-weight="bold" fill="var(--text)">CDN Edge</text>
  <text x="1080.0001" y="312.0476" text-anchor="middle" font-size="16.5571" fill="var(--text-muted)">Asia</text>
  <line x1="200" y1="330" x2="200" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="640" y1="330" x2="640" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="1080.0001" y1="330" x2="1080.0001" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <rect x="40" y="433.5714" width="320" height="89.7619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="468.0953" text-anchor="middle" font-size="19.5676" font-weight="bold" fill="var(--text)">US Users</text>
  <text x="200" y="495.7143" text-anchor="middle" font-size="18.0624" fill="var(--ok-accent)" font-weight="bold">~5ms</text>
  <rect x="480" y="433.5714" width="320" height="89.7619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="468.0953" text-anchor="middle" font-size="19.5676" font-weight="bold" fill="var(--text)">EU Users</text>
  <text x="640" y="495.7143" text-anchor="middle" font-size="18.0624" fill="var(--ok-accent)" font-weight="bold">~10ms</text>
  <rect x="920" y="433.5714" width="320" height="89.7619" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080.0001" y="468.0953" text-anchor="middle" font-size="19.5676" font-weight="bold" fill="var(--text)">AS Users</text>
  <text x="1080.0001" y="495.7143" text-anchor="middle" font-size="18.0624" fill="var(--ok-accent)" font-weight="bold">~15ms</text>
  <rect x="240" y="564.7619" width="800.0002" height="55.2381" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="599.2857" text-anchor="middle" font-size="19.5676" fill="var(--danger-accent)" font-weight="bold">vs ~200ms to origin from all locations</text>
</svg>
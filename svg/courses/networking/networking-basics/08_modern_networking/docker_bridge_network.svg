<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="Arial, sans-serif">
  <text x="280" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Docker Bridge Network</text>
  <!-- Host Machine -->
  <rect x="20" y="40" width="520" height="390" rx="5" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2"/>
  <text x="280" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90e2">Host Machine</text>
  <!-- Containers -->
  <rect x="50" y="85" width="130" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="115" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Container</text>
  <text x="115" y="127" text-anchor="middle" font-size="11" fill="#555">App A</text>
  <text x="115" y="144" text-anchor="middle" font-size="10" fill="#4a90e2">172.17.0.2</text>
  <rect x="210" y="85" width="130" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="275" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Container</text>
  <text x="275" y="127" text-anchor="middle" font-size="11" fill="#555">App B</text>
  <text x="275" y="144" text-anchor="middle" font-size="10" fill="#4a90e2">172.17.0.3</text>
  <rect x="370" y="85" width="130" height="80" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="435" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Container</text>
  <text x="435" y="127" text-anchor="middle" font-size="11" fill="#555">App C</text>
  <text x="435" y="144" text-anchor="middle" font-size="10" fill="#4a90e2">172.17.0.4</text>
  <!-- Lines from containers to bridge -->
  <line x1="115" y1="165" x2="115" y2="205" stroke="#4a90e2" stroke-width="2"/>
  <line x1="275" y1="165" x2="275" y2="205" stroke="#4a90e2" stroke-width="2"/>
  <line x1="435" y1="165" x2="435" y2="205" stroke="#4a90e2" stroke-width="2"/>
  <!-- Docker bridge -->
  <rect x="50" y="205" width="460" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="280" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#28a745">docker0 bridge</text>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#555">172.17.0.1</text>
  <!-- Line from bridge to NAT -->
  <line x1="280" y1="250" x2="280" y2="285" stroke="#333" stroke-width="2"/>
  <text x="340" y="275" font-size="10" fill="#555">iptables NAT</text>
  <!-- Host interface -->
  <rect x="50" y="285" width="460" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="280" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#856404">eth0 (host interface)</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#555">10.0.0.5</text>
  <!-- External network arrow -->
  <line x1="280" y1="330" x2="280" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrowBlack)"/>
  <text x="280" y="390" text-anchor="middle" font-size="12" fill="#555">External Network</text>
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>

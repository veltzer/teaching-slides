<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="640" y="40" text-anchor="middle" font-size="24.6107" font-weight="bold" fill="var(--text)">Docker Bridge Network</text>
  <rect x="40" y="61.4814" width="1200" height="558.5186" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="97.284" text-anchor="middle" font-size="21.5344" font-weight="bold" fill="var(--primary-accent)">Host Machine</text>
  <rect x="109.2308" y="125.9259" width="300" height="114.5679" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="259.2307" y="161.7284" text-anchor="middle" font-size="18.4581" font-weight="bold" fill="var(--text)">Container</text>
  <text x="259.2307" y="186.0741" text-anchor="middle" font-size="16.9199" fill="var(--text-muted)">App A</text>
  <text x="259.2307" y="210.4198" text-anchor="middle" font-size="15.3817" fill="var(--primary-accent)">172.17.0.2</text>
  <rect x="478.4616" y="125.9259" width="300" height="114.5679" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="628.4615" y="161.7284" text-anchor="middle" font-size="18.4581" font-weight="bold" fill="var(--text)">Container</text>
  <text x="628.4615" y="186.0741" text-anchor="middle" font-size="16.9199" fill="var(--text-muted)">App B</text>
  <text x="628.4615" y="210.4198" text-anchor="middle" font-size="15.3817" fill="var(--primary-accent)">172.17.0.3</text>
  <rect x="847.6924" y="125.9259" width="300" height="114.5679" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="997.6923" y="161.7284" text-anchor="middle" font-size="18.4581" font-weight="bold" fill="var(--text)">Container</text>
  <text x="997.6923" y="186.0741" text-anchor="middle" font-size="16.9199" fill="var(--text-muted)">App C</text>
  <text x="997.6923" y="210.4198" text-anchor="middle" font-size="15.3817" fill="var(--primary-accent)">172.17.0.4</text>
  <line x1="259.2307" y1="240.4938" x2="259.2307" y2="297.7778" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="628.4615" y1="240.4938" x2="628.4615" y2="297.7778" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="997.6923" y1="240.4938" x2="997.6923" y2="297.7778" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="109.2308" y="297.7778" width="1061.5384" height="64.4445" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="326.4197" text-anchor="middle" font-size="19.9962" font-weight="bold" fill="var(--ok-accent)">docker0 bridge</text>
  <text x="640" y="350.7655" text-anchor="middle" font-size="16.9199" fill="var(--text-muted)">172.17.0.1</text>
  <line x1="640" y1="362.2222" x2="640" y2="412.3457" stroke="var(--text)" stroke-width="2" />
  <text x="778.4616" y="398.0248" font-size="15.3817" fill="var(--text-muted)">iptables NAT</text>
  <rect x="109.2308" y="412.3457" width="1061.5384" height="64.4445" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="440.9877" text-anchor="middle" font-size="19.9962" font-weight="bold" fill="var(--danger-accent)">eth0 (host interface)</text>
  <text x="640" y="465.3334" text-anchor="middle" font-size="16.9199" fill="var(--text-muted)">10.0.0.5</text>
  <line x1="640" y1="476.7901" x2="640" y2="534.0741" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="562.7161" text-anchor="middle" font-size="18.4581" fill="var(--text-muted)">External Network</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
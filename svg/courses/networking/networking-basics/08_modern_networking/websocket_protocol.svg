<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <text x="315.7333" y="72" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="#333">HTTP (half-duplex)</text>
  <text x="964.2667" y="72" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="#333">WebSocket (full-duplex)</text>
  <rect x="85.3333" y="129.6" width="153.6" height="115.2" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="162.1333" y="201.6" text-anchor="middle" font-size="22.1867" fill="#333">Client</text>
  <rect x="392.5333" y="129.6" width="153.6" height="115.2" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="469.3333" y="201.6" text-anchor="middle" font-size="22.1867" fill="#333">Server</text>
  <line x1="238.9333" y1="288" x2="392.5333" y2="288" stroke="#4a90e2" stroke-width="2.56" marker-end="url(#ar)" />
  <text x="315.7333" y="273.6" text-anchor="middle" font-size="18.7733" fill="#555">Request</text>
  <line x1="392.5333" y1="345.6" x2="238.9333" y2="345.6" stroke="#28a745" stroke-width="2.56" marker-end="url(#ar)" />
  <text x="315.7333" y="331.2" text-anchor="middle" font-size="18.7733" fill="#555">Response</text>
  <line x1="238.9333" y1="417.6" x2="392.5333" y2="417.6" stroke="#4a90e2" stroke-width="2.56" marker-end="url(#ar)" />
  <text x="315.7333" y="403.2" text-anchor="middle" font-size="18.7733" fill="#555">Request</text>
  <line x1="392.5333" y1="475.2" x2="238.9333" y2="475.2" stroke="#28a745" stroke-width="2.56" marker-end="url(#ar)" />
  <text x="315.7333" y="460.8" text-anchor="middle" font-size="18.7733" fill="#555">Response</text>
  <rect x="750.9333" y="129.6" width="153.6" height="115.2" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="827.7333" y="201.6" text-anchor="middle" font-size="22.1867" fill="#333">Client</text>
  <rect x="1041.0667" y="129.6" width="153.6" height="115.2" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="1117.8667" y="201.6" text-anchor="middle" font-size="22.1867" fill="#333">Server</text>
  <line x1="904.5333" y1="187.2" x2="1041.0667" y2="187.2" stroke="#4a90e2" stroke-width="4.2667" />
  <line x1="1041.0667" y1="187.2" x2="904.5333" y2="187.2" stroke="#4a90e2" stroke-width="4.2667" />
  <polygon points="1030.8267,172.8 1047.8933,187.2 1030.8267,201.6" fill="#4a90e2" />
  <polygon points="914.7733,172.8 897.7067,187.2 914.7733,201.6" fill="#4a90e2" />
  <text x="972.8" y="316.8" text-anchor="middle" font-size="22.1867" fill="#555">Bidirectional real-time</text>
  <text x="972.8" y="374.4" text-anchor="middle" font-size="22.1867" fill="#555">communication over single</text>
  <text x="972.8" y="432" text-anchor="middle" font-size="22.1867" fill="#555">persistent connection</text>
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="ar" viewBox="0 0 10 10" refX="15.36" refY="14.4" markerWidth="10.24" markerHeight="17.28" orient="auto-start-forward">
      <path d="M 0 0 L 17.0667 14.4 L 0 28.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
  <rect x="392.5333" y="129.6" width="153.6" height="115.2" rx="8.5333" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.4133" />
  <text x="469.3333" y="201.6" text-anchor="middle" font-size="22.1867" fill="var(--text-dark)">Server</text>
  <line x1="238.9333" y1="288" x2="392.5333" y2="288" stroke="var(--primary-bright)" stroke-width="2.56" marker-end="url(#arrow-primary)" />
  <text x="315.7333" y="273.6" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Request</text>
  <line x1="392.5333" y1="345.6" x2="238.9333" y2="345.6" stroke="var(--ok-bright)" stroke-width="2.56" marker-end="url(#arrow-ok)" />
  <text x="315.7333" y="331.2" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Response</text>
  <line x1="238.9333" y1="417.6" x2="392.5333" y2="417.6" stroke="var(--primary-bright)" stroke-width="2.56" marker-end="url(#arrow-primary)" />
  <text x="315.7333" y="403.2" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Request</text>
  <line x1="392.5333" y1="475.2" x2="238.9333" y2="475.2" stroke="var(--ok-bright)" stroke-width="2.56" marker-end="url(#arrow-ok)" />
  <text x="315.7333" y="460.8" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Response</text>
  <rect x="750.9333" y="129.6" width="153.6" height="115.2" rx="8.5333" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.4133" />
  <text x="827.7333" y="201.6" text-anchor="middle" font-size="22.1867" fill="var(--text-dark)">Client</text>
  <rect x="1041.0667" y="129.6" width="153.6" height="115.2" rx="8.5333" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.4133" />
  <text x="1117.8667" y="201.6" text-anchor="middle" font-size="22.1867" fill="var(--text-dark)">Server</text>
  <line x1="904.5333" y1="187.2" x2="1041.0667" y2="187.2" stroke="var(--primary-bright)" stroke-width="4.2667" />
  <line x1="1041.0667" y1="187.2" x2="904.5333" y2="187.2" stroke="var(--primary-bright)" stroke-width="4.2667" />
  <polygon points="1030.8267,172.8 1047.8933,187.2 1030.8267,201.6" fill="var(--primary-bright)" />
  <polygon points="914.7733,172.8 897.7067,187.2 914.7733,201.6" fill="var(--primary-bright)" />
  <text x="972.8" y="316.8" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">Bidirectional real-time</text>
  <text x="972.8" y="374.4" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">communication over single</text>
  <text x="972.8" y="432" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">persistent connection</text>

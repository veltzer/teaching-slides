  <text x="315.7333" y="72" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="var(--text-dark)">HTTP (half-duplex)</text>
  <text x="964.2667" y="72" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="var(--text-dark)">WebSocket (full-duplex)</text>
  <rect x="85.3333" y="129.6" width="153.6" height="115.2" rx="8.5333" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.4133" />

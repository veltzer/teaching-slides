<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="315.7333" y="72" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="var(--text)">HTTP (half-duplex)</text>
  <text x="964.2667" y="72" text-anchor="middle" font-size="27.3067" font-weight="bold" fill="var(--text)">WebSocket (full-duplex)</text>
  <rect x="85.3333" y="129.6" width="153.6" height="115.2" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="162.1333" y="201.6" text-anchor="middle" font-size="22.1867" fill="var(--text)">Client</text>
  <rect x="392.5333" y="129.6" width="153.6" height="115.2" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="469.3333" y="201.6" text-anchor="middle" font-size="22.1867" fill="var(--text)">Server</text>
  <line x1="238.9333" y1="288" x2="392.5333" y2="288" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="315.7333" y="273.6" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Request</text>
  <line x1="392.5333" y1="345.6" x2="238.9333" y2="345.6" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="315.7333" y="331.2" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Response</text>
  <line x1="238.9333" y1="417.6" x2="392.5333" y2="417.6" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="315.7333" y="403.2" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Request</text>
  <line x1="392.5333" y1="475.2" x2="238.9333" y2="475.2" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="315.7333" y="460.8" text-anchor="middle" font-size="18.7733" fill="var(--text-muted)">Response</text>
  <rect x="750.9333" y="129.6" width="153.6" height="115.2" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="827.7333" y="201.6" text-anchor="middle" font-size="22.1867" fill="var(--text)">Client</text>
  <rect x="1041.0667" y="129.6" width="153.6" height="115.2" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1117.8667" y="201.6" text-anchor="middle" font-size="22.1867" fill="var(--text)">Server</text>
  <line x1="904.5333" y1="187.2" x2="1041.0667" y2="187.2" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1041.0667" y1="187.2" x2="904.5333" y2="187.2" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="1030.8267,172.8 1047.8933,187.2 1030.8267,201.6" fill="var(--primary-fill)" />
  <polygon points="914.7733,172.8 897.7067,187.2 914.7733,201.6" fill="var(--primary-fill)" />
  <text x="972.8" y="316.8" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">Bidirectional real-time</text>
  <text x="972.8" y="374.4" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">communication over single</text>
  <text x="972.8" y="432" text-anchor="middle" font-size="22.1867" fill="var(--text-muted)">persistent connection</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
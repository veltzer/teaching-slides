<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 250" font-family="Arial, sans-serif">
  <text x="185" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">HTTP (half-duplex)</text>
  <text x="565" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">WebSocket (full-duplex)</text>
  <rect x="50" y="45" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="95" y="70" text-anchor="middle" font-size="13" fill="#333">Client</text>
  <rect x="230" y="45" width="90" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="275" y="70" text-anchor="middle" font-size="13" fill="#333">Server</text>
  <line x1="140" y1="100" x2="230" y2="100" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="185" y="95" text-anchor="middle" font-size="11" fill="#555">Request</text>
  <line x1="230" y1="120" x2="140" y2="120" stroke="#28a745" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="185" y="115" text-anchor="middle" font-size="11" fill="#555">Response</text>
  <line x1="140" y1="145" x2="230" y2="145" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="185" y="140" text-anchor="middle" font-size="11" fill="#555">Request</text>
  <line x1="230" y1="165" x2="140" y2="165" stroke="#28a745" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="185" y="160" text-anchor="middle" font-size="11" fill="#555">Response</text>
  <rect x="440" y="45" width="90" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="485" y="70" text-anchor="middle" font-size="13" fill="#333">Client</text>
  <rect x="610" y="45" width="90" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="655" y="70" text-anchor="middle" font-size="13" fill="#333">Server</text>
  <line x1="530" y1="65" x2="610" y2="65" stroke="#4a90e2" stroke-width="2.5"/>
  <line x1="610" y1="65" x2="530" y2="65" stroke="#4a90e2" stroke-width="2.5"/>
  <polygon points="604,60 614,65 604,70" fill="#4a90e2"/>
  <polygon points="536,60 526,65 536,70" fill="#4a90e2"/>
  <text x="570" y="110" text-anchor="middle" font-size="13" fill="#555">Bidirectional real-time</text>
  <text x="570" y="130" text-anchor="middle" font-size="13" fill="#555">communication over single</text>
  <text x="570" y="150" text-anchor="middle" font-size="13" fill="#555">persistent connection</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-forward">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
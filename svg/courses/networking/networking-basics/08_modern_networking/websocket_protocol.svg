<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <text x="312.6154" y="126.4616" text-anchor="middle" font-size="27.5693" font-weight="bold" fill="var(--text)">HTTP (half-duplex)</text>
  <text x="967.3846" y="126.4616" text-anchor="middle" font-size="27.5693" font-weight="bold" fill="var(--text)">WebSocket (full-duplex)</text>
  <rect x="80" y="184.6154" width="155.0769" height="116.3077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="157.5385" y="257.3077" text-anchor="middle" font-size="22.4" fill="var(--text)">Client</text>
  <rect x="390.1538" y="184.6154" width="155.0769" height="116.3077" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="467.6923" y="257.3077" text-anchor="middle" font-size="22.4" fill="var(--text)">Server</text>
  <line x1="235.0769" y1="344.5385" x2="390.1538" y2="344.5385" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="312.6154" y="330" text-anchor="middle" font-size="18.9538" fill="var(--text-muted)">Request</text>
  <line x1="390.1538" y1="402.6923" x2="235.0769" y2="402.6923" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="312.6154" y="388.1538" text-anchor="middle" font-size="18.9538" fill="var(--text-muted)">Response</text>
  <line x1="235.0769" y1="475.3846" x2="390.1538" y2="475.3846" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="312.6154" y="460.8461" text-anchor="middle" font-size="18.9538" fill="var(--text-muted)">Request</text>
  <line x1="390.1538" y1="533.5384" x2="235.0769" y2="533.5384" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="312.6154" y="519" text-anchor="middle" font-size="18.9538" fill="var(--text-muted)">Response</text>
  <rect x="752" y="184.6154" width="155.0769" height="116.3077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="829.5384" y="257.3077" text-anchor="middle" font-size="22.4" fill="var(--text)">Client</text>
  <rect x="1044.9231" y="184.6154" width="155.0769" height="116.3077" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1122.4615" y="257.3077" text-anchor="middle" font-size="22.4" fill="var(--text)">Server</text>
  <line x1="907.0769" y1="242.7692" x2="1044.9231" y2="242.7692" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1044.9231" y1="242.7692" x2="907.0769" y2="242.7692" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="1034.5846,228.2308 1051.8153,242.7692 1034.5846,257.3077" fill="var(--primary-fill)" />
  <polygon points="917.4153,228.2308 900.1846,242.7692 917.4153,257.3077" fill="var(--primary-fill)" />
  <text x="976" y="373.6154" text-anchor="middle" font-size="22.4" fill="var(--text-muted)">Bidirectional real-time</text>
  <text x="976" y="431.7692" text-anchor="middle" font-size="22.4" fill="var(--text-muted)">communication over single</text>
  <text x="976" y="489.9231" text-anchor="middle" font-size="22.4" fill="var(--text-muted)">persistent connection</text>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
</svg>
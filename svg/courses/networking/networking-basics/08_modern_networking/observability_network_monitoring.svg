<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999944642854" y="40" text-anchor="middle" font-size="26.629145436511" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Observability Stack</text>
  <rect x="40" y="66.976671498102" width="1200" height="121.395356625203" rx="6.670209890791" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857170535716" y="100.697678312602" font-size="20.711557561731" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Metrics (Prometheus, Grafana):</text>
  <text x="82.857170535716" y="127.674349810704" font-size="19.232216178118" fill="var(--text-muted)" font-family="Arial, sans-serif">- Request rate, error rate, latency (RED)</text>
  <text x="82.857170535716" y="154.651132936721" font-size="19.232216178118" fill="var(--text-muted)" font-family="Arial, sans-serif">- Bandwidth, packet loss, connections</text>
  <rect x="40" y="208.60458756084" width="1200" height="121.395356625203" rx="6.670209890791" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857170535716" y="242.325594375339" font-size="20.711557561731" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Logs (ELK Stack, Loki):</text>
  <text x="82.857170535716" y="269.302265873441" font-size="19.232216178118" fill="var(--text-muted)" font-family="Arial, sans-serif">- Access logs, error logs, firewall logs</text>
  <text x="82.857170535716" y="296.279048999458" font-size="19.232216178118" fill="var(--text-muted)" font-family="Arial, sans-serif">- Structured logging with correlation IDs</text>
  <rect x="40" y="350.232503623577" width="1200" height="141.627916062737" rx="6.670209890791" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857170535716" y="383.953510438076" font-size="20.711557561731" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Traces (Jaeger, Zipkin):</text>
  <text x="82.857170535716" y="410.930181936178" font-size="19.232216178118" fill="var(--text-muted)" font-family="Arial, sans-serif">- Request flow across services</text>
  <text x="82.857170535716" y="437.906965062195" font-size="19.232216178118" fill="var(--text-muted)" font-family="Arial, sans-serif">- Latency breakdown per service</text>
  <text x="82.857170535716" y="464.883748188212" font-size="19.232216178118" fill="var(--text-muted)" font-family="Arial, sans-serif">- Dependency mapping</text>
  <rect x="40" y="512.092979123848" width="1200" height="107.907020876152" rx="6.670209890791" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857170535716" y="545.813985938347" font-size="20.711557561731" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Network-specific:</text>
  <text x="82.857170535716" y="572.79065743645" font-size="19.232216178118" fill="var(--text-muted)" font-family="Arial, sans-serif">- Smokeping (latency) | ntopng (traffic) | blackbox_exporter (probes)</text>
</svg>

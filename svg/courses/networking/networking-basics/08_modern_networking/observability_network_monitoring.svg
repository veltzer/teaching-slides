<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="67.6165" y="25.6" width="1048.0559" height="614.4" rx="6.4" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.56" />
  <ns0:text x="591.6444" y="70.4" text-anchor="middle" font-size="23.04" font-weight="bold" fill="#333">Observability Stack</ns0:text>
  <ns0:rect x="118.3289" y="96" width="946.6311" height="115.2" rx="6.4" fill="#d4edda" stroke="#28a745" stroke-width="1.92" />
  <ns0:text x="152.1371" y="128" font-size="17.92" font-weight="bold" fill="#333">Metrics (Prometheus, Grafana):</ns0:text>
  <ns0:text x="152.1371" y="153.6" font-size="16.64" fill="#555">- Request rate, error rate, latency (RED)</ns0:text>
  <ns0:text x="152.1371" y="179.2" font-size="16.64" fill="#555">- Bandwidth, packet loss, connections</ns0:text>
  <ns0:rect x="118.3289" y="230.4" width="946.6311" height="115.2" rx="6.4" fill="#d4edda" stroke="#28a745" stroke-width="1.92" />
  <ns0:text x="152.1371" y="262.4" font-size="17.92" font-weight="bold" fill="#333">Logs (ELK Stack, Loki):</ns0:text>
  <ns0:text x="152.1371" y="288" font-size="16.64" fill="#555">- Access logs, error logs, firewall logs</ns0:text>
  <ns0:text x="152.1371" y="313.6" font-size="16.64" fill="#555">- Structured logging with correlation IDs</ns0:text>
  <ns0:rect x="118.3289" y="364.8" width="946.6311" height="134.4" rx="6.4" fill="#d4edda" stroke="#28a745" stroke-width="1.92" />
  <ns0:text x="152.1371" y="396.8" font-size="17.92" font-weight="bold" fill="#333">Traces (Jaeger, Zipkin):</ns0:text>
  <ns0:text x="152.1371" y="422.4" font-size="16.64" fill="#555">- Request flow across services</ns0:text>
  <ns0:text x="152.1371" y="448" font-size="16.64" fill="#555">- Latency breakdown per service</ns0:text>
  <ns0:text x="152.1371" y="473.6" font-size="16.64" fill="#555">- Dependency mapping</ns0:text>
  <ns0:rect x="118.3289" y="518.4" width="946.6311" height="102.4" rx="6.4" fill="#fff3cd" stroke="#ffc107" stroke-width="1.92" />
  <ns0:text x="152.1371" y="550.4" font-size="17.92" font-weight="bold" fill="#333">Network-specific:</ns0:text>
  <ns0:text x="152.1371" y="576" font-size="16.64" fill="#555">- Smokeping (latency) | ntopng (traffic) | blackbox_exporter (probes)</ns0:text>
</ns0:svg>
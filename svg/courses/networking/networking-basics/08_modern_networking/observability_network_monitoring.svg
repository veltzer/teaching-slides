<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Arial, sans-serif">
  <rect x="40" y="20" width="620" height="480" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Observability Stack</text>
  <rect x="70" y="75" width="560" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="90" y="100" font-size="14" font-weight="bold" fill="#333">Metrics (Prometheus, Grafana):</text>
  <text x="90" y="120" font-size="13" fill="#555">- Request rate, error rate, latency (RED)</text>
  <text x="90" y="140" font-size="13" fill="#555">- Bandwidth, packet loss, connections</text>
  <rect x="70" y="180" width="560" height="90" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="90" y="205" font-size="14" font-weight="bold" fill="#333">Logs (ELK Stack, Loki):</text>
  <text x="90" y="225" font-size="13" fill="#555">- Access logs, error logs, firewall logs</text>
  <text x="90" y="245" font-size="13" fill="#555">- Structured logging with correlation IDs</text>
  <rect x="70" y="285" width="560" height="105" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="90" y="310" font-size="14" font-weight="bold" fill="#333">Traces (Jaeger, Zipkin):</text>
  <text x="90" y="330" font-size="13" fill="#555">- Request flow across services</text>
  <text x="90" y="350" font-size="13" fill="#555">- Latency breakdown per service</text>
  <text x="90" y="370" font-size="13" fill="#555">- Dependency mapping</text>
  <rect x="70" y="405" width="560" height="80" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="90" y="430" font-size="14" font-weight="bold" fill="#333">Network-specific:</text>
  <text x="90" y="450" font-size="13" fill="#555">- Smokeping (latency) | ntopng (traffic) | blackbox_exporter (probes)</text>
</svg>
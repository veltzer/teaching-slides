<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="73.1429" y="27.6923" width="1133.7143" height="664.6154" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="76.1538" text-anchor="middle" font-size="24.9231" font-weight="bold" fill="#333">Observability Stack</text>
  <rect x="128" y="103.8462" width="1024" height="124.6154" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.0769" />
  <text x="164.5714" y="138.4615" font-size="19.3846" font-weight="bold" fill="#333">Metrics (Prometheus, Grafana):</text>
  <text x="164.5714" y="166.1538" font-size="18" fill="#555">- Request rate, error rate, latency (RED)</text>
  <text x="164.5714" y="193.8462" font-size="18" fill="#555">- Bandwidth, packet loss, connections</text>
  <rect x="128" y="249.2308" width="1024" height="124.6154" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.0769" />
  <text x="164.5714" y="283.8462" font-size="19.3846" font-weight="bold" fill="#333">Logs (ELK Stack, Loki):</text>
  <text x="164.5714" y="311.5385" font-size="18" fill="#555">- Access logs, error logs, firewall logs</text>
  <text x="164.5714" y="339.2308" font-size="18" fill="#555">- Structured logging with correlation IDs</text>
  <rect x="128" y="394.6154" width="1024" height="145.3846" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.0769" />
  <text x="164.5714" y="429.2308" font-size="19.3846" font-weight="bold" fill="#333">Traces (Jaeger, Zipkin):</text>
  <text x="164.5714" y="456.9231" font-size="18" fill="#555">- Request flow across services</text>
  <text x="164.5714" y="484.6154" font-size="18" fill="#555">- Latency breakdown per service</text>
  <text x="164.5714" y="512.3077" font-size="18" fill="#555">- Dependency mapping</text>
  <rect x="128" y="560.7692" width="1024" height="110.7692" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0769" />
  <text x="164.5714" y="595.3846" font-size="19.3846" font-weight="bold" fill="#333">Network-specific:</text>
  <text x="164.5714" y="623.0769" font-size="18" fill="#555">- Smokeping (latency) | ntopng (traffic) | blackbox_exporter (probes)</text>
</svg>
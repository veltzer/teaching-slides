<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="1200" height="128.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="85.1111" text-anchor="middle" font-size="26.9258" font-weight="bold" fill="var(--text)">Application Layer</text>
  <text x="640" y="117.3333" text-anchor="middle" font-size="20.1944" fill="var(--text-muted)">Network monitoring, load balancing, firewalls</text>
  <text x="640" y="144.7222" text-anchor="middle" font-size="20.1944" fill="var(--text-muted)">Traffic engineering, policy management</text>
  <rect x="140" y="185" width="1000" height="56.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="222.0556" text-anchor="middle" font-size="21.8772" font-weight="bold" fill="var(--text)">Northbound API (REST, gRPC)</text>
  <line x1="640" y1="168.8889" x2="640" y2="185" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="40" y="257.5" width="1200" height="145" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="302.6111" text-anchor="middle" font-size="26.9258" font-weight="bold" fill="var(--text)">Control Layer</text>
  <text x="640" y="334.8333" text-anchor="middle" font-size="20.1944" fill="var(--text-muted)">SDN Controller (ONOS, OpenDaylight, Floodlight)</text>
  <text x="640" y="367.0556" text-anchor="middle" font-size="20.1944" fill="var(--text-muted)">Topology discovery, routing, policy engine</text>
  <line x1="640" y1="241.3889" x2="640" y2="257.5" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="140" y="418.6111" width="1000" height="56.3889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="455.6667" text-anchor="middle" font-size="21.8772" font-weight="bold" fill="var(--text)">Southbound API (OpenFlow, P4, NETCONF)</text>
  <line x1="640" y1="402.5" x2="640" y2="418.6111" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="40" y="491.1111" width="1200" height="128.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="536.2222" text-anchor="middle" font-size="26.9258" font-weight="bold" fill="var(--text)">Data Layer</text>
  <text x="640" y="568.4444" text-anchor="middle" font-size="20.1944" fill="var(--text-muted)">Physical/virtual switches and routers</text>
  <text x="640" y="595.8333" text-anchor="middle" font-size="20.1944" fill="var(--text-muted)">Forwarding based on flow tables</text>
  <line x1="640" y1="475" x2="640" y2="491.1111" stroke="var(--primary-border)" stroke-width="2" />
  <polygon points="630,257.5 640,246.2222 650,257.5" fill="var(--primary-fill)" />
  <polygon points="630,491.1111 640,479.8333 650,491.1111" fill="var(--primary-fill)" />
</svg>
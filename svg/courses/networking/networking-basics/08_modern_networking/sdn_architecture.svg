<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <rect x="128" y="30" width="1024" height="120" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="640" y="72" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Application Layer</text>
  <text x="640" y="102" text-anchor="middle" font-size="18" fill="#555">Network monitoring, load balancing, firewalls</text>
  <text x="640" y="127.5" text-anchor="middle" font-size="18" fill="#555">Traffic engineering, policy management</text>
  <rect x="213.3333" y="165" width="853.3333" height="52.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="640" y="199.5" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Northbound API (REST, gRPC)</text>
  <line x1="640" y1="150" x2="640" y2="165" stroke="#4a90e2" stroke-width="3" />
  <rect x="128" y="232.5" width="1024" height="135" rx="7.5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3" />
  <text x="640" y="274.5" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Control Layer</text>
  <text x="640" y="304.5" text-anchor="middle" font-size="18" fill="#555">SDN Controller (ONOS, OpenDaylight, Floodlight)</text>
  <text x="640" y="334.5" text-anchor="middle" font-size="18" fill="#555">Topology discovery, routing, policy engine</text>
  <line x1="640" y1="217.5" x2="640" y2="232.5" stroke="#4a90e2" stroke-width="3" />
  <rect x="213.3333" y="382.5" width="853.3333" height="52.5" rx="7.5" fill="#fff3cd" stroke="#ffc107" stroke-width="2.25" />
  <text x="640" y="417" text-anchor="middle" font-size="19.5" font-weight="bold" fill="#333">Southbound API (OpenFlow, P4, NETCONF)</text>
  <line x1="640" y1="367.5" x2="640" y2="382.5" stroke="#4a90e2" stroke-width="3" />
  <rect x="128" y="450" width="1024" height="120" rx="7.5" fill="#d4edda" stroke="#28a745" stroke-width="3" />
  <text x="640" y="492" text-anchor="middle" font-size="24" font-weight="bold" fill="#333">Data Layer</text>
  <text x="640" y="522" text-anchor="middle" font-size="18" fill="#555">Physical/virtual switches and routers</text>
  <text x="640" y="547.5" text-anchor="middle" font-size="18" fill="#555">Forwarding based on flow tables</text>
  <line x1="640" y1="435" x2="640" y2="450" stroke="#4a90e2" stroke-width="3" />
  <polygon points="631.4667,232.5 640,222 648.5333,232.5" fill="#4a90e2" />
  <polygon points="631.4667,450 640,439.5 648.5333,450" fill="#4a90e2" />
</svg>
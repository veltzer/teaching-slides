<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="Arial, sans-serif">
  <rect x="60" y="20" width="480" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Application Layer</text>
  <text x="300" y="68" text-anchor="middle" font-size="12" fill="#555">Network monitoring, load balancing, firewalls</text>
  <text x="300" y="85" text-anchor="middle" font-size="12" fill="#555">Traffic engineering, policy management</text>
  <rect x="100" y="110" width="400" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="300" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Northbound API (REST, gRPC)</text>
  <line x1="300" y1="100" x2="300" y2="110" stroke="#4a90e2" stroke-width="2"/>
  <rect x="60" y="155" width="480" height="90" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="300" y="183" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Control Layer</text>
  <text x="300" y="203" text-anchor="middle" font-size="12" fill="#555">SDN Controller (ONOS, OpenDaylight, Floodlight)</text>
  <text x="300" y="223" text-anchor="middle" font-size="12" fill="#555">Topology discovery, routing, policy engine</text>
  <line x1="300" y1="145" x2="300" y2="155" stroke="#4a90e2" stroke-width="2"/>
  <rect x="100" y="255" width="400" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="300" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Southbound API (OpenFlow, P4, NETCONF)</text>
  <line x1="300" y1="245" x2="300" y2="255" stroke="#4a90e2" stroke-width="2"/>
  <rect x="60" y="300" width="480" height="80" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="328" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Data Layer</text>
  <text x="300" y="348" text-anchor="middle" font-size="12" fill="#555">Physical/virtual switches and routers</text>
  <text x="300" y="365" text-anchor="middle" font-size="12" fill="#555">Forwarding based on flow tables</text>
  <line x1="300" y1="290" x2="300" y2="300" stroke="#4a90e2" stroke-width="2"/>
  <polygon points="296,155 300,148 304,155" fill="#4a90e2"/>
  <polygon points="296,300 300,293 304,300" fill="#4a90e2"/>
</svg>
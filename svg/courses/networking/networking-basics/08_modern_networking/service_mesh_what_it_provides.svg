<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <rect x="73.1429" y="27.6923" width="1133.7143" height="664.6154" rx="6.9231" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.7692" />
  <text x="640" y="76.1538" text-anchor="middle" font-size="24.9231" font-weight="bold" fill="#333">Service Mesh</text>
  <rect x="128" y="103.8462" width="1024" height="131.5385" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.0769" />
  <text x="164.5714" y="138.4615" font-size="19.3846" font-weight="bold" fill="#333">Traffic Management:</text>
  <text x="164.5714" y="166.1538" font-size="16.6154" fill="#555">- Load balancing (round-robin, least-conn)</text>
  <text x="164.5714" y="189.6923" font-size="16.6154" fill="#555">- Traffic splitting (canary deployments)</text>
  <text x="164.5714" y="213.2308" font-size="16.6154" fill="#555">- Retries, timeouts, circuit breaking</text>
  <rect x="128" y="256.1538" width="1024" height="117.6923" rx="6.9231" fill="#fff3cd" stroke="#ffc107" stroke-width="2.0769" />
  <text x="164.5714" y="290.7692" font-size="19.3846" font-weight="bold" fill="#333">Security:</text>
  <text x="164.5714" y="318.4615" font-size="16.6154" fill="#555">- Mutual TLS (mTLS) between all services</text>
  <text x="164.5714" y="342" font-size="16.6154" fill="#555">- Certificate management (automatic rotation) &amp; access policies</text>
  <rect x="128" y="394.6154" width="1024" height="117.6923" rx="6.9231" fill="#d4edda" stroke="#28a745" stroke-width="2.0769" />
  <text x="164.5714" y="429.2308" font-size="19.3846" font-weight="bold" fill="#333">Observability:</text>
  <text x="164.5714" y="456.9231" font-size="16.6154" fill="#555">- Distributed tracing (Jaeger, Zipkin)</text>
  <text x="164.5714" y="480.4615" font-size="16.6154" fill="#555">- Metrics (latency, error rates, throughput) &amp; dependency graphs</text>
  <rect x="128" y="533.0769" width="1024" height="117.6923" rx="6.9231" fill="#f8d7da" stroke="#dc3545" stroke-width="2.0769" />
  <text x="164.5714" y="567.6923" font-size="19.3846" font-weight="bold" fill="#333">Resilience:</text>
  <text x="164.5714" y="595.3846" font-size="16.6154" fill="#555">- Fault injection (chaos testing)</text>
  <text x="164.5714" y="618.9231" font-size="16.6154" fill="#555">- Rate limiting &amp; health checking</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Arial, sans-serif">
  <rect x="40" y="20" width="620" height="480" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Service Mesh</text>
  <rect x="70" y="75" width="560" height="95" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="90" y="100" font-size="14" font-weight="bold" fill="#333">Traffic Management:</text>
  <text x="90" y="120" font-size="12" fill="#555">- Load balancing (round-robin, least-conn)</text>
  <text x="90" y="137" font-size="12" fill="#555">- Traffic splitting (canary deployments)</text>
  <text x="90" y="154" font-size="12" fill="#555">- Retries, timeouts, circuit breaking</text>
  <rect x="70" y="185" width="560" height="85" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="90" y="210" font-size="14" font-weight="bold" fill="#333">Security:</text>
  <text x="90" y="230" font-size="12" fill="#555">- Mutual TLS (mTLS) between all services</text>
  <text x="90" y="247" font-size="12" fill="#555">- Certificate management (automatic rotation) &amp; access policies</text>
  <rect x="70" y="285" width="560" height="85" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="90" y="310" font-size="14" font-weight="bold" fill="#333">Observability:</text>
  <text x="90" y="330" font-size="12" fill="#555">- Distributed tracing (Jaeger, Zipkin)</text>
  <text x="90" y="347" font-size="12" fill="#555">- Metrics (latency, error rates, throughput) &amp; dependency graphs</text>
  <rect x="70" y="385" width="560" height="85" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="90" y="410" font-size="14" font-weight="bold" fill="#333">Resilience:</text>
  <text x="90" y="430" font-size="12" fill="#555">- Fault injection (chaos testing)</text>
  <text x="90" y="447" font-size="12" fill="#555">- Rate limiting &amp; health checking</text>
</svg>
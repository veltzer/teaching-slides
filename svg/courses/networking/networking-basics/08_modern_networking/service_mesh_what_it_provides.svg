<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="639.999944642854" y="40" text-anchor="middle" font-size="27.10612330141" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Service Mesh</text>
  <rect x="40" y="67.951731978511" width="1200" height="132.771131717234" rx="6.789685841671" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857170535716" y="102.891570445638" font-size="21.082540345541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Traffic Management:</text>
  <text x="82.857170535716" y="130.84330242415" font-size="18.070748867607" fill="var(--text-muted)" font-family="Arial, sans-serif">- Load balancing (round-robin, least-conn)</text>
  <text x="82.857170535716" y="154.602378702277" font-size="18.070748867607" fill="var(--text-muted)" font-family="Arial, sans-serif">- Traffic splitting (canary deployments)</text>
  <text x="82.857170535716" y="178.361454980404" font-size="18.070748867607" fill="var(--text-muted)" font-family="Arial, sans-serif">- Retries, timeouts, circuit breaking</text>
  <rect x="40" y="221.686720510958" width="1200" height="118.795150065319" rx="6.789685841671" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857170535716" y="256.626443315426" font-size="21.082540345541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Security:</text>
  <text x="82.857170535716" y="284.578290956596" font-size="18.070748867607" fill="var(--text-muted)" font-family="Arial, sans-serif">- Mutual TLS (mTLS) between all services</text>
  <text x="82.857170535716" y="308.337367234723" font-size="18.070748867607" fill="var(--text-muted)" font-family="Arial, sans-serif">- Certificate management (automatic rotation) &amp; access policies</text>
  <rect x="40" y="361.44572739149" width="1200" height="118.795150065319" rx="6.789685841671" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857170535716" y="396.385565858617" font-size="21.082540345541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Observability:</text>
  <text x="82.857170535716" y="424.337297837128" font-size="18.070748867607" fill="var(--text-muted)" font-family="Arial, sans-serif">- Distributed tracing (Jaeger, Zipkin)</text>
  <text x="82.857170535716" y="448.096374115255" font-size="18.070748867607" fill="var(--text-muted)" font-family="Arial, sans-serif">- Metrics (latency, error rates, throughput) &amp; dependency graphs</text>
  <rect x="40" y="501.20484993468" width="1200" height="118.795150065319" rx="6.789685841671" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="82.857170535716" y="536.144572739149" font-size="21.082540345541" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Resilience:</text>
  <text x="82.857170535716" y="564.096420380319" font-size="18.070748867607" fill="var(--text-muted)" font-family="Arial, sans-serif">- Fault injection (chaos testing)</text>
  <text x="82.857170535716" y="587.855380995788" font-size="18.070748867607" fill="var(--text-muted)" font-family="Arial, sans-serif">- Rate limiting &amp; health checking</text>
</svg>

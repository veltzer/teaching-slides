<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <ns0:rect x="67.6165" y="25.6" width="1048.0559" height="614.4" rx="6.4" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2.56" />
  <ns0:text x="591.6444" y="70.4" text-anchor="middle" font-size="23.04" font-weight="bold" fill="#333">Service Mesh</ns0:text>
  <ns0:rect x="118.3289" y="96" width="946.6311" height="121.6" rx="6.4" fill="#d4edda" stroke="#28a745" stroke-width="1.92" />
  <ns0:text x="152.1371" y="128" font-size="17.92" font-weight="bold" fill="#333">Traffic Management:</ns0:text>
  <ns0:text x="152.1371" y="153.6" font-size="15.36" fill="#555">- Load balancing (round-robin, least-conn)</ns0:text>
  <ns0:text x="152.1371" y="175.36" font-size="15.36" fill="#555">- Traffic splitting (canary deployments)</ns0:text>
  <ns0:text x="152.1371" y="197.12" font-size="15.36" fill="#555">- Retries, timeouts, circuit breaking</ns0:text>
  <ns0:rect x="118.3289" y="236.8" width="946.6311" height="108.8" rx="6.4" fill="#fff3cd" stroke="#ffc107" stroke-width="1.92" />
  <ns0:text x="152.1371" y="268.8" font-size="17.92" font-weight="bold" fill="#333">Security:</ns0:text>
  <ns0:text x="152.1371" y="294.4" font-size="15.36" fill="#555">- Mutual TLS (mTLS) between all services</ns0:text>
  <ns0:text x="152.1371" y="316.16" font-size="15.36" fill="#555">- Certificate management (automatic rotation) &amp; access policies</ns0:text>
  <ns0:rect x="118.3289" y="364.8" width="946.6311" height="108.8" rx="6.4" fill="#d4edda" stroke="#28a745" stroke-width="1.92" />
  <ns0:text x="152.1371" y="396.8" font-size="17.92" font-weight="bold" fill="#333">Observability:</ns0:text>
  <ns0:text x="152.1371" y="422.4" font-size="15.36" fill="#555">- Distributed tracing (Jaeger, Zipkin)</ns0:text>
  <ns0:text x="152.1371" y="444.16" font-size="15.36" fill="#555">- Metrics (latency, error rates, throughput) &amp; dependency graphs</ns0:text>
  <ns0:rect x="118.3289" y="492.8" width="946.6311" height="108.8" rx="6.4" fill="#f8d7da" stroke="#dc3545" stroke-width="1.92" />
  <ns0:text x="152.1371" y="524.8" font-size="17.92" font-weight="bold" fill="#333">Resilience:</ns0:text>
  <ns0:text x="152.1371" y="550.4" font-size="15.36" fill="#555">- Fault injection (chaos testing)</ns0:text>
  <ns0:text x="152.1371" y="572.16" font-size="15.36" fill="#555">- Rate limiting &amp; health checking</ns0:text>
</ns0:svg>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowd5_02_http" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="615.015" y="62.2703" text-anchor="middle" font-size="26.6506" font-weight="bold" fill="#333">HTTP/3 Protocol Stack</ns0:text>
  <ns0:rect x="307.5075" y="103.7838" width="615.015" height="121.0811" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="179.8919" text-anchor="middle" font-size="24.6006" font-weight="bold">HTTP/3 (Application)</ns0:text>
  <ns0:rect x="307.5075" y="242.1622" width="615.015" height="121.0811" fill="#f3e5f5" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="318.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">QPACK (Header Compression)</ns0:text>
  <ns0:rect x="307.5075" y="380.5405" width="615.015" height="121.0811" fill="#fff3e0" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="456.6486" text-anchor="middle" font-size="24.6006" font-weight="bold">QUIC (Transport + TLS 1.3)</ns0:text>
  <ns0:rect x="307.5075" y="518.9189" width="615.015" height="121.0811" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="10.2503" />
  <ns0:text x="615.015" y="595.027" text-anchor="middle" font-size="24.6006" font-weight="bold">UDP</ns0:text>
  <ns0:text x="1066.026" y="179.8919" text-anchor="middle" font-size="20.5005" fill="#555">Semantics</ns0:text>
  <ns0:text x="1066.026" y="318.2703" text-anchor="middle" font-size="20.5005" fill="#555">Compression</ns0:text>
  <ns0:text x="1066.026" y="456.6486" text-anchor="middle" font-size="20.5005" fill="#555">Reliability + Encryption</ns0:text>
  <ns0:text x="1066.026" y="595.027" text-anchor="middle" font-size="20.5005" fill="#555">Datagrams</ns0:text>
  <ns0:text x="164.004" y="318.2703" text-anchor="middle" font-size="20.5005" fill="#c62828">No TCP!</ns0:text>
  <ns0:text x="164.004" y="387.4595" text-anchor="middle" font-size="20.5005" fill="#c62828">No HOL</ns0:text>
  <ns0:text x="164.004" y="439.3514" text-anchor="middle" font-size="20.5005" fill="#c62828">blocking</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="136.1443" y="16.4103" width="194.4919" height="82.0513" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="233.3903" y="72.2051" text-anchor="middle" font-size="21.3941" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="816.8661" y="16.4103" width="194.4919" height="82.0513" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="914.1121" y="72.2051" text-anchor="middle" font-size="21.3941" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="233.3903" y1="114.8718" x2="233.3903" y2="640" stroke="var(--border)" stroke-width="2" />
  <line x1="914.1121" y1="114.8718" x2="914.1121" y2="640" stroke="var(--border)" stroke-width="2" />
  <line x1="233.3903" y1="157.5385" x2="914.1121" y2="180.5128" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="573.7512" y="141.1282" text-anchor="middle" font-size="19.4492" fill="var(--primary-accent)">TCP Connect (persistent)</text>
  <line x1="233.3903" y1="229.7436" x2="914.1121" y2="246.1538" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="573.7512" y="219.8974" text-anchor="middle" font-size="19.4492" fill="var(--primary-accent)">GET /page.html</text>
  <line x1="914.1121" y1="278.9744" x2="233.3903" y2="295.3846" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.7796 5.8348" marker-end="url(#arrow-ok)" />
  <text x="573.7512" y="288.8205" text-anchor="middle" font-size="19.4492" fill="var(--ok-accent)">200 OK + HTML</text>
  <line x1="233.3903" y1="344.6154" x2="914.1121" y2="361.0256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="573.7512" y="338.0513" text-anchor="middle" font-size="19.4492" fill="var(--primary-accent)">GET /style.css (same conn)</text>
  <line x1="914.1121" y1="393.8462" x2="233.3903" y2="410.2564" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.7796 5.8348" marker-end="url(#arrow-ok)" />
  <text x="573.7512" y="400.4103" text-anchor="middle" font-size="19.4492" fill="var(--ok-accent)">200 OK + CSS</text>
  <line x1="233.3903" y1="459.4872" x2="914.1121" y2="475.8974" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="573.7512" y="456.2051" text-anchor="middle" font-size="19.4492" fill="var(--primary-accent)">GET /app.js (same conn)</text>
  <line x1="914.1121" y1="508.7179" x2="233.3903" y2="525.1282" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.7796 5.8348" marker-end="url(#arrow-ok)" />
  <text x="573.7512" y="515.2821" text-anchor="middle" font-size="19.4492" fill="var(--ok-accent)">200 OK + JS</text>
  <rect x="972.4597" y="196.9231" width="175.0427" height="328.2051" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.7" />
  <text x="1059.981" y="262.5641" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">Keep-Alive</text>
  <text x="1059.981" y="311.7949" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">Pipelining</text>
  <text x="1059.981" y="361.0256" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">Chunked</text>
  <text x="1059.981" y="410.2564" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">encoding</text>
  <text x="573.7512" y="623.5897" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">Single TCP connection reused for multiple requests</text>
</svg>
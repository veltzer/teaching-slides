<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowd0_02_http" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="41.001" y="103.7838" width="287.007" height="449.7297" fill="#e3f2fd" stroke="#333" stroke-width="4.1001" rx="16.4004" />
  <ns0:text x="184.5045" y="190.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">Client (Browser)</ns0:text>
  <ns0:text x="184.5045" y="276.7568" text-anchor="middle" font-size="20.5005">GET /index.html</ns0:text>
  <ns0:text x="184.5045" y="328.6486" text-anchor="middle" font-size="20.5005">Host: example.com</ns0:text>
  <ns0:text x="184.5045" y="380.5405" text-anchor="middle" font-size="20.5005">Accept: text/html</ns0:text>
  <ns0:text x="184.5045" y="449.7297" text-anchor="middle" font-size="20.5005" fill="#555">Port 80 / 443</ns0:text>
  <ns0:rect x="881.5215" y="103.7838" width="307.5075" height="449.7297" fill="#e8f5e9" stroke="#333" stroke-width="4.1001" rx="16.4004" />
  <ns0:text x="1035.2752" y="190.2703" text-anchor="middle" font-size="24.6006" font-weight="bold">Server</ns0:text>
  <ns0:text x="1035.2752" y="276.7568" text-anchor="middle" font-size="20.5005">HTTP/1.1 200 OK</ns0:text>
  <ns0:text x="1035.2752" y="328.6486" text-anchor="middle" font-size="20.5005">Content-Type: text/html</ns0:text>
  <ns0:text x="1035.2752" y="380.5405" text-anchor="middle" font-size="20.5005">Content-Length: 1234</ns0:text>
  <ns0:text x="1035.2752" y="449.7297" text-anchor="middle" font-size="20.5005" fill="#555">&lt;html&gt;...&lt;/html&gt;</ns0:text>
  <ns0:line x1="328.008" y1="242.1622" x2="881.5215" y2="242.1622" stroke="#1565c0" stroke-width="4.1001" marker-end="url(#arrowd0_02_http)" />
  <ns0:text x="615.015" y="217.9459" text-anchor="middle" font-size="22.5506" fill="#1565c0" font-weight="bold">HTTP Request</ns0:text>
  <ns0:line x1="881.5215" y1="415.1351" x2="328.008" y2="415.1351" stroke="#2e7d32" stroke-width="4.1001" stroke-dasharray="10.2503 6.1502" marker-end="url(#arrowd0_02_http)" />
  <ns0:text x="615.015" y="484.3243" text-anchor="middle" font-size="22.5506" fill="#2e7d32" font-weight="bold">HTTP Response</ns0:text>
  <ns0:text x="615.015" y="640" text-anchor="middle" font-size="20.5005" fill="#555">Stateless request-response protocol over TCP</ns0:text>
</ns0:svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="266.6666" height="76.3158" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="173.3334" y="91.8947" text-anchor="middle" font-size="24.1597" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="973.3334" y="40" width="266.6666" height="76.3158" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1106.6668" y="91.8947" text-anchor="middle" font-size="24.1597" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="173.3334" y1="131.5789" x2="173.3334" y2="620" stroke="var(--border)" stroke-width="2" />
  <line x1="1106.6668" y1="131.5789" x2="1106.6668" y2="620" stroke="var(--border)" stroke-width="2" />
  <line x1="173.3334" y1="177.3684" x2="1106.6668" y2="201.7895" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640.0001" y="165.1579" text-anchor="middle" font-size="21.9634" fill="var(--primary-accent)">GET /index.html (Stream 1)</text>
  <line x1="1106.6668" y1="244.5263" x2="173.3334" y2="268.9473" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.7796 5.8348" marker-end="url(#arrow-ok)" />
  <text x="640.0001" y="244.5263" text-anchor="middle" font-size="21.9634" fill="var(--ok-accent)">200 OK + HTML (Stream 1)</text>
  <line x1="1106.6668" y1="314.7368" x2="173.3334" y2="339.1579" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)" />
  <text x="640.0001" y="314.7368" text-anchor="middle" font-size="21.9634" fill="var(--info-accent)">PUSH_PROMISE: /style.css (Stream 2)</text>
  <line x1="1106.6668" y1="384.9474" x2="173.3334" y2="409.3684" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="7.7796 5.8348" marker-end="url(#arrow-info)" />
  <text x="640.0001" y="384.9474" text-anchor="middle" font-size="21.9634" fill="var(--info-accent)">Push: style.css data (Stream 2)</text>
  <line x1="1106.6668" y1="455.1579" x2="173.3334" y2="479.5789" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="640.0001" y="455.1579" text-anchor="middle" font-size="21.9634" fill="var(--danger-accent)">PUSH_PROMISE: /app.js (Stream 4)</text>
  <line x1="1106.6668" y1="525.3684" x2="173.3334" y2="549.7894" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.7796 5.8348" marker-end="url(#arrow-danger)" />
  <text x="640.0001" y="525.3684" text-anchor="middle" font-size="21.9634" fill="var(--danger-accent)">Push: app.js data (Stream 4)</text>
  <text x="640.0001" y="610.8421" text-anchor="middle" font-size="21.9634" fill="var(--text-muted)">Server proactively sends resources before client requests them</text>
</svg>
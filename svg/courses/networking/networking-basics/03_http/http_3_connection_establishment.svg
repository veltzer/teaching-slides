  <text x="1152" y="234" text-anchor="middle" font-size="21.3333" fill="#555">0-RTT possible</text>
  <text x="1152" y="288" text-anchor="middle" font-size="21.3333" fill="#555">on reconnect!</text>
  <rect x="298.6667" y="486" width="661.3333" height="90" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" opacity="0.5" />
  <text x="629.3333" y="547.2" text-anchor="middle" font-size="21.3333" fill="#333">Transport + TLS handshake combined = 1 RTT (vs 3 RTT in TCP+TLS)</text>
  <text x="629.3333" y="666" text-anchor="middle" font-size="21.3333" fill="#555">QUIC eliminates separate TCP and TLS handshakes</text>

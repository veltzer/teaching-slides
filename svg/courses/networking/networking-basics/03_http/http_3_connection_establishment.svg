  <text x="629.3333" y="180" text-anchor="middle" font-size="21.3333" fill="#1565c0">QUIC Initial (ClientHello + TLS 1.3)</text>
  <line x1="1002.6667" y1="306" x2="256" y2="342" stroke="#2e7d32" stroke-width="4.2667" stroke-dasharray="8.5333 6.4" marker-end="url(#arrowd6_02_http)" />
  <text x="629.3333" y="295.2" text-anchor="middle" font-size="21.3333" fill="#2e7d32">QUIC Handshake (ServerHello + TLS)</text>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arrowd6_02_http" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <ns0:path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect x="136.1443" y="16.4103" width="194.4919" height="82.0513" fill="#e3f2fd" stroke="#333" stroke-width="3.8899" rx="9.7246" />
  <ns0:text x="233.3903" y="72.2051" text-anchor="middle" font-size="21.3941" font-weight="bold">Client</ns0:text>
  <ns0:rect x="816.8661" y="16.4103" width="194.4919" height="82.0513" fill="#e8f5e9" stroke="#333" stroke-width="3.8899" rx="9.7246" />
  <ns0:text x="914.1121" y="72.2051" text-anchor="middle" font-size="21.3941" font-weight="bold">Server</ns0:text>
  <ns0:line x1="233.3903" y1="114.8718" x2="233.3903" y2="640" stroke="#333" stroke-width="3.8899" />
  <ns0:line x1="914.1121" y1="114.8718" x2="914.1121" y2="640" stroke="#333" stroke-width="3.8899" />
  <ns0:line x1="233.3903" y1="180.5128" x2="914.1121" y2="213.3333" stroke="#1565c0" stroke-width="3.8899" marker-end="url(#arrowd6_02_http)" />
  <ns0:text x="573.7512" y="164.1026" text-anchor="middle" font-size="19.4492" fill="#1565c0">QUIC Initial (ClientHello + TLS 1.3)</ns0:text>
  <ns0:line x1="914.1121" y1="278.9744" x2="233.3903" y2="311.7949" stroke="#2e7d32" stroke-width="3.8899" stroke-dasharray="7.7796 5.8348" marker-end="url(#arrowd6_02_http)" />
  <ns0:text x="573.7512" y="269.1282" text-anchor="middle" font-size="19.4492" fill="#2e7d32">QUIC Handshake (ServerHello + TLS)</ns0:text>
  <ns0:line x1="233.3903" y1="361.0256" x2="914.1121" y2="393.8462" stroke="#7b1fa2" stroke-width="3.8899" marker-end="url(#arrowd6_02_http)" />
  <ns0:text x="573.7512" y="361.0256" text-anchor="middle" font-size="19.4492" fill="#7b1fa2">QUIC Handshake Done + HTTP/3 Request</ns0:text>
  <ns0:rect x="953.0104" y="164.1026" width="194.4919" height="131.2821" fill="#fff3e0" stroke="#333" stroke-width="1.9449" rx="5.8348" opacity="0.8" />
  <ns0:text x="1050.2564" y="213.3333" text-anchor="middle" font-size="19.4492" fill="#555">0-RTT possible</ns0:text>
  <ns0:text x="1050.2564" y="262.5641" text-anchor="middle" font-size="19.4492" fill="#555">on reconnect!</ns0:text>
  <ns0:rect x="272.2887" y="443.0769" width="602.9249" height="82.0513" fill="#e8f5e9" stroke="#333" stroke-width="1.9449" rx="5.8348" opacity="0.5" />
  <ns0:text x="573.7512" y="498.8718" text-anchor="middle" font-size="19.4492" fill="#333">Transport + TLS handshake combined = 1 RTT (vs 3 RTT in TCP+TLS)</ns0:text>
  <ns0:text x="573.7512" y="607.1795" text-anchor="middle" font-size="19.4492" fill="#555">QUIC eliminates separate TCP and TLS handshakes</ns0:text>
</ns0:svg>
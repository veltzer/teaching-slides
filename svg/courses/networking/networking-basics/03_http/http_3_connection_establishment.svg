<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="136.1443" y="16.4103" width="194.4919" height="82.0513" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="233.3903" y="72.2051" text-anchor="middle" font-size="21.3941" font-weight="bold" fill="var(--text)">Client</text>
  <rect x="816.8661" y="16.4103" width="194.4919" height="82.0513" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="914.1121" y="72.2051" text-anchor="middle" font-size="21.3941" font-weight="bold" fill="var(--text)">Server</text>
  <line x1="233.3903" y1="114.8718" x2="233.3903" y2="640" stroke="var(--border)" stroke-width="2" />
  <line x1="914.1121" y1="114.8718" x2="914.1121" y2="640" stroke="var(--border)" stroke-width="2" />
  <line x1="233.3903" y1="180.5128" x2="914.1121" y2="213.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="573.7512" y="164.1026" text-anchor="middle" font-size="19.4492" fill="var(--primary-accent)">QUIC Initial (ClientHello + TLS 1.3)</text>
  <line x1="914.1121" y1="278.9744" x2="233.3903" y2="311.7949" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.7796 5.8348" marker-end="url(#arrow-ok)" />
  <text x="573.7512" y="269.1282" text-anchor="middle" font-size="19.4492" fill="var(--ok-accent)">QUIC Handshake (ServerHello + TLS)</text>
  <line x1="233.3903" y1="361.0256" x2="914.1121" y2="393.8462" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)" />
  <text x="573.7512" y="361.0256" text-anchor="middle" font-size="19.4492" fill="var(--info-accent)">QUIC Handshake Done + HTTP/3 Request</text>
  <rect x="953.0104" y="164.1026" width="194.4919" height="131.2821" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" opacity="0.8" />
  <text x="1050.2564" y="213.3333" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">0-RTT possible</text>
  <text x="1050.2564" y="262.5641" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">on reconnect!</text>
  <rect x="272.2887" y="443.0769" width="602.9249" height="82.0513" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" opacity="0.5" />
  <text x="573.7512" y="498.8718" text-anchor="middle" font-size="19.4492" fill="var(--text)">Transport + TLS handshake combined = 1 RTT (vs 3 RTT in TCP+TLS)</text>
  <text x="573.7512" y="607.1795" text-anchor="middle" font-size="19.4492" fill="var(--text-muted)">QUIC eliminates separate TCP and TLS handshakes</text>
</svg>
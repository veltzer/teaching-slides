  <text x="1077.3333" y="349.2" text-anchor="middle" font-size="23.4667" font-weight="bold">App Server 2</text>
  <rect x="938.6667" y="450" width="277.3333" height="126" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1077.3333" y="529.2" text-anchor="middle" font-size="23.4667" font-weight="bold">App Server 3</text>
  <line x1="234.6667" y1="216" x2="426.6667" y2="270" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd2_01_network_components)" />
  <line x1="234.6667" y1="414" x2="426.6667" y2="396" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd2_01_network_components)" />
  <line x1="725.3333" y1="270" x2="938.6667" y2="151.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd2_01_network_components)" />
  <line x1="725.3333" y1="342" x2="938.6667" y2="331.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd2_01_network_components)" />

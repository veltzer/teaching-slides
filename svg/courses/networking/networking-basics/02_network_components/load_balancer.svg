<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="210.5883" width="210.5263" height="204.7059" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="145.2632" y="295.8824" text-anchor="middle" font-size="22.6941" font-weight="bold" fill="var(--text)">Clients</text>
  <text x="145.2632" y="364.1176" text-anchor="middle" font-size="20.631" fill="var(--text-muted)">Requests</text>
  <rect x="482.1053" y="142.353" width="273.6841" height="341.1765" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="618.9474" y="227.6471" text-anchor="middle" font-size="24.7572" font-weight="bold" fill="var(--text)">Load Balancer</text>
  <text x="618.9474" y="295.8824" text-anchor="middle" font-size="20.631" fill="var(--text-muted)">Round Robin /</text>
  <text x="618.9474" y="347.0588" text-anchor="middle" font-size="20.631" fill="var(--text-muted)">Least Connections /</text>
  <text x="618.9474" y="398.2353" text-anchor="middle" font-size="20.631" fill="var(--text-muted)">IP Hash</text>
  <rect x="966.3159" y="40" width="273.6841" height="119.4117" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1103.158" y="115.0589" text-anchor="middle" font-size="22.6941" font-weight="bold" fill="var(--text)">Server 1</text>
  <rect x="966.3159" y="193.5295" width="273.6841" height="119.4117" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1103.158" y="268.5882" text-anchor="middle" font-size="22.6941" font-weight="bold" fill="var(--text)">Server 2</text>
  <rect x="966.3159" y="347.0588" width="273.6841" height="119.4117" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1103.158" y="422.1177" text-anchor="middle" font-size="22.6941" font-weight="bold" fill="var(--text)">Server 3</text>
  <rect x="966.3159" y="500.5883" width="273.6841" height="119.4117" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1103.158" y="575.647" text-anchor="middle" font-size="22.6941" font-weight="bold" fill="var(--text)">Server N</text>
  <line x1="250.5264" y1="295.8824" x2="482.1053" y2="295.8824" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="755.7896" y1="244.7059" x2="966.3159" y2="98" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="755.7896" y1="278.8235" x2="966.3159" y2="251.5294" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="755.7896" y1="312.9412" x2="966.3159" y2="405.0589" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <line x1="755.7896" y1="347.0588" x2="966.3159" y2="558.5882" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
</svg>
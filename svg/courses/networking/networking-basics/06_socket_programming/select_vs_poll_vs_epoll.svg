<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="18.8235" markerHeight="14.8235" refX="16.9412" refY="7.4118" orient="auto">
      <polygon points="0,21.1765 6.5882,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="18.8235" markerHeight="14.8235" refX="1.8824" refY="7.4118" orient="auto">
      <polygon points="0,0 6.5882,21.1765" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="46.5882" text-anchor="middle" font-size="26.3529" fill="#222222" font-weight="bold">I/O Multiplexing: select / poll / epoll</text>
  <rect x="18.8235" y="84.7059" width="1242.3529" height="160.9412" fill="#fff3e0" stroke="#333333" stroke-width="2.8235" rx="7.5294" />
  <text x="160" y="131.2941" text-anchor="middle" font-size="24.4706" fill="#1a1a2e" font-weight="bold">select()</text>
  <line x1="301.1765" y1="93.1765" x2="301.1765" y2="237.1765" stroke="#aaa" stroke-width="1.8824" />
  <text x="320" y="131.2941" text-anchor="start" font-size="22.5882" fill="#222222">Pass ALL fds every time → kernel scans all → returns ready ones</text>
  <text x="320" y="169.4118" text-anchor="start" font-size="20.7059" fill="#555">Works on ~1024 fds max. O(n) scan per call.</text>
  <rect x="18.8235" y="254.1176" width="1242.3529" height="160.9412" fill="#f3e5f5" stroke="#333333" stroke-width="2.8235" rx="7.5294" />
  <text x="160" y="300.7059" text-anchor="middle" font-size="24.4706" fill="#1a1a2e" font-weight="bold">poll()</text>
  <line x1="301.1765" y1="262.5882" x2="301.1765" y2="406.5882" stroke="#aaa" stroke-width="1.8824" />
  <text x="320" y="300.7059" text-anchor="start" font-size="22.5882" fill="#222222">Similar to select() but no fd limit.</text>
  <text x="320" y="338.8235" text-anchor="start" font-size="20.7059" fill="#555">Still O(n) — kernel scans the whole list each call.</text>
  <rect x="18.8235" y="423.5294" width="1242.3529" height="160.9412" fill="#e8f5e9" stroke="#333333" stroke-width="2.8235" rx="7.5294" />
  <text x="160" y="470.1176" text-anchor="middle" font-size="24.4706" fill="#1a1a2e" font-weight="bold">epoll()</text>
  <line x1="301.1765" y1="432" x2="301.1765" y2="576" stroke="#aaa" stroke-width="1.8824" />
  <text x="320" y="470.1176" text-anchor="start" font-size="22.5882" fill="#222222">Register fds once; kernel notifies only about ready fds.</text>
  <text x="320" y="508.2353" text-anchor="start" font-size="20.7059" fill="#555">O(1) for returning events. Scales to millions of connections.</text>
  <rect x="150.5882" y="614.1176" width="978.8235" height="148.2353" fill="#c8e6c9" stroke="#388e3c" stroke-width="2.8235" rx="7.5294" />
  <text x="640" y="660.7059" text-anchor="middle" font-size="22.5882" fill="#1b5e20" font-weight="bold">Kernel (epoll): monitors registered fds efficiently</text>
  <text x="640" y="707.2941" text-anchor="middle" font-size="20.7059" fill="#2e7d32">Notifies userspace only about fds with actual events</text>
</svg>
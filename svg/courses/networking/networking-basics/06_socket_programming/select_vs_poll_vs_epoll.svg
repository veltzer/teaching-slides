<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:marker id="arr" markerWidth="18.8235" markerHeight="14.8235" refX="16.9412" refY="7.4118" orient="auto">
      <ns0:polygon points="0,21.1765 6.5882,0" fill="#555" />
    </ns0:marker>
    <ns0:marker id="arrl" markerWidth="18.8235" markerHeight="14.8235" refX="1.8824" refY="7.4118" orient="auto">
      <ns0:polygon points="0,0 6.5882,21.1765" fill="#555" />
    </ns0:marker>
  </ns0:defs>
  <ns0:text x="537.284" y="39.1111" text-anchor="middle" font-size="22.1234" fill="#222222" font-weight="bold">I/O Multiplexing: select / poll / epoll</ns0:text>
  <ns0:rect x="15.8024" y="71.1111" width="1042.963" height="135.1111" fill="#fff3e0" stroke="#333333" stroke-width="2.3703" rx="6.321" />
  <ns0:text x="134.321" y="110.2222" text-anchor="middle" font-size="20.5432" fill="#1a1a2e" font-weight="bold">select()</ns0:text>
  <ns0:line x1="252.8395" y1="78.2223" x2="252.8395" y2="199.1111" stroke="#aaa" stroke-width="1.5803" />
  <ns0:text x="268.642" y="110.2222" text-anchor="start" font-size="18.9629" fill="#222222">Pass ALL fds every time → kernel scans all → returns ready ones</ns0:text>
  <ns0:text x="268.642" y="142.2223" text-anchor="start" font-size="17.3827" fill="#555">Works on ~1024 fds max. O(n) scan per call.</ns0:text>
  <ns0:rect x="15.8024" y="213.3333" width="1042.963" height="135.1111" fill="#f3e5f5" stroke="#333333" stroke-width="2.3703" rx="6.321" />
  <ns0:text x="134.321" y="252.4445" text-anchor="middle" font-size="20.5432" fill="#1a1a2e" font-weight="bold">poll()</ns0:text>
  <ns0:line x1="252.8395" y1="220.4444" x2="252.8395" y2="341.3333" stroke="#aaa" stroke-width="1.5803" />
  <ns0:text x="268.642" y="252.4445" text-anchor="start" font-size="18.9629" fill="#222222">Similar to select() but no fd limit.</ns0:text>
  <ns0:text x="268.642" y="284.4444" text-anchor="start" font-size="17.3827" fill="#555">Still O(n) — kernel scans the whole list each call.</ns0:text>
  <ns0:rect x="15.8024" y="355.5556" width="1042.963" height="135.1111" fill="#e8f5e9" stroke="#333333" stroke-width="2.3703" rx="6.321" />
  <ns0:text x="134.321" y="394.6666" text-anchor="middle" font-size="20.5432" fill="#1a1a2e" font-weight="bold">epoll()</ns0:text>
  <ns0:line x1="252.8395" y1="362.6667" x2="252.8395" y2="483.5556" stroke="#aaa" stroke-width="1.5803" />
  <ns0:text x="268.642" y="394.6666" text-anchor="start" font-size="18.9629" fill="#222222">Register fds once; kernel notifies only about ready fds.</ns0:text>
  <ns0:text x="268.642" y="426.6667" text-anchor="start" font-size="17.3827" fill="#555">O(1) for returning events. Scales to millions of connections.</ns0:text>
  <ns0:rect x="126.4197" y="515.5555" width="821.7284" height="124.4445" fill="#c8e6c9" stroke="#388e3c" stroke-width="2.3703" rx="6.321" />
  <ns0:text x="537.284" y="554.6667" text-anchor="middle" font-size="18.9629" fill="#1b5e20" font-weight="bold">Kernel (epoll): monitors registered fds efficiently</ns0:text>
  <ns0:text x="537.284" y="593.7778" text-anchor="middle" font-size="17.3827" fill="#2e7d32">Notifies userspace only about fds with actual events</ns0:text>
</ns0:svg>
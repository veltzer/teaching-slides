<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="23.3144" fill="var(--text)" font-weight="bold">I/O Multiplexing: select / poll / epoll</text>
  <rect x="40" y="70.8876" width="1200" height="130.4142" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="176.3637" y="108.639" text-anchor="middle" font-size="21.6492" fill="var(--code-bg)" font-weight="bold">select()</text>
  <line x1="312.7273" y1="77.7516" x2="312.7273" y2="194.4379" stroke="var(--text-faint)" stroke-width="1.5803" />
  <text x="330.9092" y="108.639" text-anchor="start" font-size="19.9838" fill="var(--text)">Pass ALL fds every time → kernel scans all → returns ready ones</text>
  <text x="330.9092" y="139.5267" text-anchor="start" font-size="18.3185" fill="var(--text-muted)">Works on ~1024 fds max. O(n) scan per call.</text>
  <rect x="40" y="208.1657" width="1200" height="130.4142" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="176.3637" y="245.9172" text-anchor="middle" font-size="21.6492" fill="var(--code-bg)" font-weight="bold">poll()</text>
  <line x1="312.7273" y1="215.0296" x2="312.7273" y2="331.7159" stroke="var(--text-faint)" stroke-width="1.5803" />
  <text x="330.9092" y="245.9172" text-anchor="start" font-size="19.9838" fill="var(--text)">Similar to select() but no fd limit.</text>
  <text x="330.9092" y="276.8047" text-anchor="start" font-size="18.3185" fill="var(--text-muted)">Still O(n) — kernel scans the whole list each call.</text>
  <rect x="40" y="345.4438" width="1200" height="130.4142" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="176.3637" y="383.1952" text-anchor="middle" font-size="21.6492" fill="var(--code-bg)" font-weight="bold">epoll()</text>
  <line x1="312.7273" y1="352.3077" x2="312.7273" y2="468.9941" stroke="var(--text-faint)" stroke-width="1.5803" />
  <text x="330.9092" y="383.1952" text-anchor="start" font-size="19.9838" fill="var(--text)">Register fds once; kernel notifies only about ready fds.</text>
  <text x="330.9092" y="414.0829" text-anchor="start" font-size="18.3185" fill="var(--text-muted)">O(1) for returning events. Scales to millions of connections.</text>
  <rect x="167.2727" y="499.8816" width="945.4545" height="120.1184" fill="var(--text-muted)" stroke="var(--ok-border)" stroke-width="2.3703" rx="6" />
  <text x="640.0001" y="537.6332" text-anchor="middle" font-size="19.9838" fill="var(--ok-accent)" font-weight="bold">Kernel (epoll): monitors registered fds efficiently</text>
  <text x="640.0001" y="575.3846" text-anchor="middle" font-size="18.3185" fill="var(--ok-accent)">Notifies userspace only about fds with actual events</text>
</svg>
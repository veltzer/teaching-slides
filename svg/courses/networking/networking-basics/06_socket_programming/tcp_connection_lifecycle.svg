<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="70" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">TCP Socket Lifecycle</text>

  <rect x="60" y="90" width="220" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="128" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--primary-text)">Server</text>

  <rect x="1000" y="90" width="220" height="60" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1110" y="128" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)">Client</text>

  <line x1="170" y1="160" x2="170" y2="615" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="1110" y1="160" x2="1110" y2="615" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- server steps -->
  <rect x="40" y="175" width="260" height="44" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="170" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">socket() → bind()</text>

  <rect x="40" y="230" width="260" height="44" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="170" y="259" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">listen()</text>

  <rect x="40" y="285" width="260" height="44" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="170" y="314" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)">accept()</text>

  <!-- client steps -->
  <rect x="980" y="175" width="260" height="44" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="1110" y="204" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text)">socket()</text>

  <rect x="980" y="285" width="260" height="44" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1110" y="314" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--ok-text)">connect()</text>

  <!-- 3-way handshake -->
  <line x1="300" y1="355" x2="980" y2="355" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="348" text-anchor="middle" font-size="16" font-style="italic" fill="var(--text-muted)">SYN</text>
  <line x1="980" y1="385" x2="300" y2="385" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="378" text-anchor="middle" font-size="16" font-style="italic" fill="var(--text-muted)">SYN + ACK</text>
  <line x1="300" y1="415" x2="980" y2="415" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="408" text-anchor="middle" font-size="16" font-style="italic" fill="var(--text-muted)">ACK — connection established</text>

  <!-- data exchange -->
  <rect x="40" y="440" width="260" height="44" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="170" y="469" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)">recv() / send()</text>
  <rect x="980" y="440" width="260" height="44" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1110" y="469" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--primary-text)">send() / recv()</text>

  <line x1="980" y1="505" x2="300" y2="505" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="498" text-anchor="middle" font-size="16" font-style="italic" fill="var(--text-muted)">request bytes</text>

  <line x1="300" y1="540" x2="980" y2="540" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="533" text-anchor="middle" font-size="16" font-style="italic" fill="var(--text-muted)">response bytes</text>

  <!-- close -->
  <rect x="40" y="560" width="260" height="44" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="170" y="589" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-text)">close()</text>
  <rect x="980" y="560" width="260" height="44" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1110" y="589" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--danger-text)">close()</text>

  <line x1="300" y1="615" x2="980" y2="615" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="608" text-anchor="middle" font-size="16" font-style="italic" fill="var(--text-muted)">FIN handshake (FIN / ACK / FIN / ACK)</text>
</svg>

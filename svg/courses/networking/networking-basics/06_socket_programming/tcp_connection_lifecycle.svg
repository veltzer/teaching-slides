<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="40" text-anchor="middle" font-size="30.0742" fill="var(--text)" font-weight="bold">TCP Socket Lifecycle</text>
  <text x="248.5597" y="87.2593" text-anchor="middle" font-size="27.926" fill="var(--text)" font-weight="bold">Server</text>
  <text x="1031.4403" y="87.2593" text-anchor="middle" font-size="27.926" fill="var(--text)" font-weight="bold">Client</text>
  <line x1="248.5597" y1="110.889" x2="248.5597" y2="615.7037" stroke="var(--text-faint)" stroke-width="1.7561" stroke-dasharray="7.0244 5.2683" />
  <line x1="1031.4403" y1="110.889" x2="1031.4403" y2="615.7037" stroke="var(--text-faint)" stroke-width="1.7561" stroke-dasharray="7.0244 5.2683" />
  <text x="248.5597" y="151.7037" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">socket()</text>
  <text x="1031.4403" y="151.7037" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">socket()</text>
  <text x="248.5597" y="205.4075" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">bind()</text>
  <text x="248.5597" y="259.1111" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">listen()</text>
  <text x="248.5597" y="334.2963" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">accept()</text>
  <text x="1031.4403" y="334.2963" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">connect()</text>
  <line x1="317.6374" y1="347.1852" x2="962.3626" y2="347.1852" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="962.3626" y1="372.963" x2="317.6374" y2="372.963" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="340.7408" text-anchor="middle" font-size="23.6297" fill="var(--text-muted)" font-style="italic">3-way handshake (SYN→SYN-ACK→ACK)</text>
  <text x="248.5597" y="430.9629" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">recv()</text>
  <text x="1031.4403" y="430.9629" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">send()</text>
  <line x1="962.3626" y1="443.8519" x2="317.6374" y2="443.8519" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="437.4074" text-anchor="middle" font-size="23.6297" fill="var(--text-muted)" font-style="italic">data</text>
  <text x="248.5597" y="506.1481" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">send()</text>
  <text x="1031.4403" y="506.1481" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">recv()</text>
  <line x1="317.6374" y1="519.0371" x2="962.3626" y2="519.0371" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="512.5926" text-anchor="middle" font-size="23.6297" fill="var(--text-muted)" font-style="italic">data</text>
  <text x="248.5597" y="581.3333" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">close()</text>
  <text x="1031.4403" y="581.3333" text-anchor="middle" font-size="25.7779" fill="var(--text)" font-weight="bold">close()</text>
  <line x1="317.6374" y1="594.2221" x2="962.3626" y2="594.2221" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="962.3626" y1="620" x2="317.6374" y2="620" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="587.7778" text-anchor="middle" font-size="23.6297" fill="var(--text-muted)" font-style="italic">FIN handshake</text>
</svg>
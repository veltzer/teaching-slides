<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="38.6341" text-anchor="middle" font-size="24.5854" fill="var(--text)" font-weight="bold">TCP Socket Lifecycle</text>
  <text x="320" y="77.2683" text-anchor="middle" font-size="22.8293" fill="var(--text)" font-weight="bold">Server</text>
  <text x="960" y="77.2683" text-anchor="middle" font-size="22.8293" fill="var(--text)" font-weight="bold">Client</text>
  <line x1="320" y1="96.5854" x2="320" y2="509.2683" stroke="var(--text-faint)" stroke-width="1.7561" stroke-dasharray="7.0244 5.2683" />
  <line x1="960" y1="96.5854" x2="960" y2="509.2683" stroke="var(--text-faint)" stroke-width="1.7561" stroke-dasharray="7.0244 5.2683" />
  <text x="320" y="129.9512" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">socket()</text>
  <text x="960" y="129.9512" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">socket()</text>
  <text x="320" y="173.8537" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">bind()</text>
  <text x="320" y="217.7561" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">listen()</text>
  <text x="320" y="279.2195" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">accept()</text>
  <text x="960" y="279.2195" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">connect()</text>
  <line x1="376.4706" y1="289.7561" x2="903.5294" y2="289.7561" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="903.5294" y1="310.8293" x2="376.4706" y2="310.8293" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="284.4878" text-anchor="middle" font-size="19.3171" fill="var(--text-muted)" font-style="italic">3-way handshake (SYN→SYN-ACK→ACK)</text>
  <text x="320" y="358.2439" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">recv()</text>
  <text x="960" y="358.2439" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">send()</text>
  <line x1="903.5294" y1="368.7805" x2="376.4706" y2="368.7805" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="363.5122" text-anchor="middle" font-size="19.3171" fill="var(--text-muted)" font-style="italic">data</text>
  <text x="320" y="419.7073" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">send()</text>
  <text x="960" y="419.7073" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">recv()</text>
  <line x1="376.4706" y1="430.2439" x2="903.5294" y2="430.2439" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="424.9756" text-anchor="middle" font-size="19.3171" fill="var(--text-muted)" font-style="italic">data</text>
  <text x="320" y="481.1707" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">close()</text>
  <text x="960" y="481.1707" text-anchor="middle" font-size="21.0732" fill="var(--text)" font-weight="bold">close()</text>
  <line x1="376.4706" y1="491.7073" x2="903.5294" y2="491.7073" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="903.5294" y1="512.7805" x2="376.4706" y2="512.7805" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="486.439" text-anchor="middle" font-size="19.3171" fill="var(--text-muted)" font-style="italic">FIN handshake</text>
</svg>
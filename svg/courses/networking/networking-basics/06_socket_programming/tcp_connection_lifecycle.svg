<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640" y="80" text-anchor="middle" font-size="25.926" fill="var(--text)" font-weight="bold">TCP Socket Lifecycle</text>
  <text x="302.5515" y="120.7408" text-anchor="middle" font-size="24.0741" fill="var(--text)" font-weight="bold">Server</text>
  <text x="977.4485" y="120.7408" text-anchor="middle" font-size="24.0741" fill="var(--text)" font-weight="bold">Client</text>
  <line x1="302.5515" y1="141.1112" x2="302.5515" y2="576.2963" stroke="var(--text-faint)" stroke-width="1.7561" stroke-dasharray="7.0244 5.2683" />
  <line x1="977.4485" y1="141.1112" x2="977.4485" y2="576.2963" stroke="var(--text-faint)" stroke-width="1.7561" stroke-dasharray="7.0244 5.2683" />
  <text x="302.5515" y="176.2963" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">socket()</text>
  <text x="977.4485" y="176.2963" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">socket()</text>
  <text x="302.5515" y="222.5927" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">bind()</text>
  <text x="302.5515" y="268.8889" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">listen()</text>
  <text x="302.5515" y="333.7037" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">accept()</text>
  <text x="977.4485" y="333.7037" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">connect()</text>
  <line x1="362.1012" y1="344.8148" x2="917.8988" y2="344.8148" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="917.8988" y1="367.0371" x2="362.1012" y2="367.0371" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="339.2593" text-anchor="middle" font-size="20.3704" fill="var(--text-muted)" font-style="italic">3-way handshake (SYN→SYN-ACK→ACK)</text>
  <text x="302.5515" y="417.037" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">recv()</text>
  <text x="977.4485" y="417.037" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">send()</text>
  <line x1="917.8988" y1="428.1482" x2="362.1012" y2="428.1482" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="422.5926" text-anchor="middle" font-size="20.3704" fill="var(--text-muted)" font-style="italic">data</text>
  <text x="302.5515" y="481.8518" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">send()</text>
  <text x="977.4485" y="481.8518" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">recv()</text>
  <line x1="362.1012" y1="492.963" x2="917.8988" y2="492.963" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="487.4074" text-anchor="middle" font-size="20.3704" fill="var(--text-muted)" font-style="italic">data</text>
  <text x="302.5515" y="546.6666" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">close()</text>
  <text x="977.4485" y="546.6666" text-anchor="middle" font-size="22.2223" fill="var(--text)" font-weight="bold">close()</text>
  <line x1="362.1012" y1="557.7777" x2="917.8988" y2="557.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="917.8988" y1="580" x2="362.1012" y2="580" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="552.2222" text-anchor="middle" font-size="20.3704" fill="var(--text-muted)" font-style="italic">FIN handshake</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arr" markerWidth="18.8235" markerHeight="12.2927" refX="16.9412" refY="6.1463" orient="auto">
      <polygon points="0,17.561 6.5882,0" fill="#555" />
    </marker>
    <marker id="arrl" markerWidth="18.8235" markerHeight="12.2927" refX="1.8824" refY="6.1463" orient="auto">
      <polygon points="0,0 6.5882,17.561" fill="#555" />
    </marker>
  </defs>
  <text x="640" y="38.6341" text-anchor="middle" font-size="24.5854" fill="#222222" font-weight="bold">TCP Socket Lifecycle</text>
  <text x="320" y="77.2683" text-anchor="middle" font-size="22.8293" fill="#222222" font-weight="bold">Server</text>
  <text x="960" y="77.2683" text-anchor="middle" font-size="22.8293" fill="#222222" font-weight="bold">Client</text>
  <line x1="320" y1="96.5854" x2="320" y2="509.2683" stroke="#aaa" stroke-width="1.7561" stroke-dasharray="7.0244 5.2683" />
  <line x1="960" y1="96.5854" x2="960" y2="509.2683" stroke="#aaa" stroke-width="1.7561" stroke-dasharray="7.0244 5.2683" />
  <text x="320" y="129.9512" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">socket()</text>
  <text x="960" y="129.9512" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">socket()</text>
  <text x="320" y="173.8537" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">bind()</text>
  <text x="320" y="217.7561" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">listen()</text>
  <text x="320" y="279.2195" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">accept()</text>
  <text x="960" y="279.2195" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">connect()</text>
  <line x1="376.4706" y1="289.7561" x2="903.5294" y2="289.7561" stroke="#555" stroke-width="2.6341" marker-end="url(#arr)" />
  <line x1="903.5294" y1="310.8293" x2="376.4706" y2="310.8293" stroke="#555" stroke-width="2.6341" marker-end="url(#arr)" />
  <text x="640" y="284.4878" text-anchor="middle" font-size="19.3171" fill="#555" font-style="italic">3-way handshake (SYN→SYN-ACK→ACK)</text>
  <text x="320" y="358.2439" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">recv()</text>
  <text x="960" y="358.2439" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">send()</text>
  <line x1="903.5294" y1="368.7805" x2="376.4706" y2="368.7805" stroke="#555" stroke-width="2.6341" marker-end="url(#arr)" />
  <text x="640" y="363.5122" text-anchor="middle" font-size="19.3171" fill="#555" font-style="italic">data</text>
  <text x="320" y="419.7073" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">send()</text>
  <text x="960" y="419.7073" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">recv()</text>
  <line x1="376.4706" y1="430.2439" x2="903.5294" y2="430.2439" stroke="#555" stroke-width="2.6341" marker-end="url(#arr)" />
  <text x="640" y="424.9756" text-anchor="middle" font-size="19.3171" fill="#555" font-style="italic">data</text>
  <text x="320" y="481.1707" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">close()</text>
  <text x="960" y="481.1707" text-anchor="middle" font-size="21.0732" fill="#222222" font-weight="bold">close()</text>
  <line x1="376.4706" y1="491.7073" x2="903.5294" y2="491.7073" stroke="#555" stroke-width="2.6341" marker-end="url(#arr)" />
  <line x1="903.5294" y1="512.7805" x2="376.4706" y2="512.7805" stroke="#555" stroke-width="2.6341" marker-end="url(#arr)" />
  <text x="640" y="486.439" text-anchor="middle" font-size="19.3171" fill="#555" font-style="italic">FIN handshake</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
  </defs>
  <text x="640" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--text)">UDP Socket Lifecycle</text>
  <rect x="40" y="90" width="300" height="530" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--primary-text)">Server</text>
  <rect x="940" y="90" width="300" height="530" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--ok-text)">Client</text>
  <line x1="190" y1="160" x2="190" y2="615" stroke="var(--bg)" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="1090" y1="160" x2="1090" y2="615" stroke="var(--bg)" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="60" y="175" width="260" height="46" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-border)">socket()</text>
  <rect x="60" y="245" width="260" height="46" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="276" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-border)">bind()</text>
  <rect x="60" y="335" width="260" height="46" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="366" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-border)">recvfrom()</text>
  <rect x="60" y="455" width="260" height="46" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="486" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-border)">sendto()</text>
  <rect x="60" y="555" width="260" height="46" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="190" y="586" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--primary-border)">close()</text>
  <rect x="960" y="175" width="260" height="46" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-border)">socket()</text>
  <rect x="960" y="335" width="260" height="46" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="366" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-border)">sendto()</text>
  <rect x="960" y="455" width="260" height="46" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="486" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-border)">recvfrom()</text>
  <rect x="960" y="555" width="260" height="46" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1090" y="586" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ok-border)">close()</text>
  <line x1="960" y1="360" x2="340" y2="360" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="350" text-anchor="middle" font-size="18" font-style="italic" fill="var(--text-muted)">datagram</text>
  <line x1="340" y1="480" x2="960" y2="480" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="470" text-anchor="middle" font-size="18" font-style="italic" fill="var(--text-muted)">datagram</text>
  <text x="640" y="200" text-anchor="middle" font-size="20" fill="var(--text)">No connect() / accept() -- connectionless</text>
</svg>

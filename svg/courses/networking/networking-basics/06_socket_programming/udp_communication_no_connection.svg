<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="616.2963" y="58.6667" text-anchor="middle" font-size="25.3769" fill="var(--text)" font-weight="bold">UDP Socket Lifecycle</text>
  <text x="308.1481" y="117.3334" text-anchor="middle" font-size="23.5643" fill="var(--text)" font-weight="bold">Server</text>
  <text x="924.4444" y="117.3334" text-anchor="middle" font-size="23.5643" fill="var(--text)" font-weight="bold">Client</text>
  <line x1="308.1481" y1="146.6667" x2="308.1481" y2="640" stroke="var(--text-faint)" stroke-width="1.8127" stroke-dasharray="7.2505 5.4379" />
  <line x1="924.4444" y1="146.6667" x2="924.4444" y2="640" stroke="var(--text-faint)" stroke-width="1.8127" stroke-dasharray="7.2505 5.4379" />
  <text x="308.1481" y="197.3334" text-anchor="middle" font-size="21.7516" fill="var(--text)" font-weight="bold">socket()</text>
  <text x="924.4444" y="197.3334" text-anchor="middle" font-size="21.7516" fill="var(--text)" font-weight="bold">socket()</text>
  <text x="308.1481" y="263.9999" text-anchor="middle" font-size="21.7516" fill="var(--text)" font-weight="bold">bind()</text>
  <text x="308.1481" y="357.3333" text-anchor="middle" font-size="21.7516" fill="var(--text)" font-weight="bold">recvfrom()</text>
  <text x="924.4444" y="357.3333" text-anchor="middle" font-size="21.7516" fill="var(--text)" font-weight="bold">sendto()</text>
  <line x1="851.939" y1="373.3333" x2="380.6536" y2="373.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="616.2963" y="365.3333" text-anchor="middle" font-size="19.939" fill="var(--text-muted)" font-style="italic">datagram</text>
  <text x="308.1481" y="464" text-anchor="middle" font-size="21.7516" fill="var(--text)" font-weight="bold">sendto()</text>
  <text x="924.4444" y="464" text-anchor="middle" font-size="21.7516" fill="var(--text)" font-weight="bold">recvfrom()</text>
  <line x1="380.6536" y1="480" x2="851.939" y2="480" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="616.2963" y="471.9999" text-anchor="middle" font-size="19.939" fill="var(--text-muted)" font-style="italic">datagram</text>
  <text x="308.1481" y="570.6667" text-anchor="middle" font-size="21.7516" fill="var(--text)" font-weight="bold">close()</text>
  <text x="924.4444" y="570.6667" text-anchor="middle" font-size="21.7516" fill="var(--text)" font-weight="bold">close()</text>
</svg>
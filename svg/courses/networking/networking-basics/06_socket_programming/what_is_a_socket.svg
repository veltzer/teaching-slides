<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="634.53" y="54.1539" text-anchor="middle" font-size="26.1277" fill="var(--text)" font-weight="bold">Socket: Endpoint for Network Communication</text>
  <rect x="37.3253" y="98.4615" width="466.5661" height="541.5385" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="270.6084" y="157.5385" text-anchor="middle" font-size="24.2615" fill="var(--text)" font-weight="bold">Server Application</text>
  <text x="270.6084" y="221.5385" text-anchor="middle" font-size="22.3951" fill="var(--text)">socket()</text>
  <text x="270.6084" y="275.6924" text-anchor="middle" font-size="22.3951" fill="var(--text)">bind()</text>
  <text x="270.6084" y="329.8462" text-anchor="middle" font-size="22.3951" fill="var(--text)">listen()</text>
  <text x="270.6084" y="384" text-anchor="middle" font-size="22.3951" fill="var(--text)">accept()</text>
  <rect x="111.9759" y="516.9231" width="317.265" height="88.6154" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="2.7994" rx="6" />
  <text x="270.6084" y="571.077" text-anchor="middle" font-size="22.3951" fill="var(--primary-accent)" font-weight="bold">Socket  fd = 3</text>
  <rect x="765.1685" y="98.4615" width="466.5661" height="541.5385" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="998.4515" y="157.5385" text-anchor="middle" font-size="24.2615" fill="var(--text)" font-weight="bold">Client Application</text>
  <text x="998.4515" y="221.5385" text-anchor="middle" font-size="22.3951" fill="var(--text)">socket()</text>
  <text x="998.4515" y="275.6924" text-anchor="middle" font-size="22.3951" fill="var(--text)">connect()</text>
  <text x="998.4515" y="329.8462" text-anchor="middle" font-size="22.3951" fill="var(--text)">send()</text>
  <text x="998.4515" y="384" text-anchor="middle" font-size="22.3951" fill="var(--text)">recv()</text>
  <rect x="839.819" y="516.9231" width="317.265" height="88.6154" fill="var(--text-muted)" stroke="var(--warn-border)" stroke-width="2.7994" rx="6" />
  <text x="998.4515" y="571.077" text-anchor="middle" font-size="22.3951" fill="var(--warn-accent)" font-weight="bold">Socket  fd = 3</text>
  <line x1="503.8914" y1="561.2308" x2="765.1685" y2="561.2308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="765.1685" y1="536.6154" x2="503.8914" y2="536.6154" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="634.53" y="516.9231" text-anchor="middle" font-size="20.5289" fill="var(--text-muted)" font-style="italic">Network (TCP/UDP)</text>
</svg>
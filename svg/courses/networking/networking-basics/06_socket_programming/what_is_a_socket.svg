<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="640.0001" y="40" text-anchor="middle" font-size="26.0578" fill="var(--text)" font-weight="bold">Socket: Endpoint for Network Communication</text>
  <rect x="40" y="83.8655" width="468.75" height="536.1345" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="274.375" y="142.3529" text-anchor="middle" font-size="24.1966" fill="var(--text)" font-weight="bold">Server Application</text>
  <text x="274.375" y="205.7143" text-anchor="middle" font-size="22.3352" fill="var(--text)">socket()</text>
  <text x="274.375" y="259.3278" text-anchor="middle" font-size="22.3352" fill="var(--text)">bind()</text>
  <text x="274.375" y="312.9412" text-anchor="middle" font-size="22.3352" fill="var(--text)">listen()</text>
  <text x="274.375" y="366.5546" text-anchor="middle" font-size="22.3352" fill="var(--text)">accept()</text>
  <rect x="115" y="498.1513" width="318.75" height="87.7311" fill="var(--text-muted)" stroke="var(--primary-border)" stroke-width="2.7994" rx="6" />
  <text x="274.375" y="551.7648" text-anchor="middle" font-size="22.3352" fill="var(--primary-accent)" font-weight="bold">Socket  fd = 3</text>
  <rect x="771.25" y="83.8655" width="468.75" height="536.1345" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)"/>
  <text x="1005.625" y="142.3529" text-anchor="middle" font-size="24.1966" fill="var(--text)" font-weight="bold">Client Application</text>
  <text x="1005.625" y="205.7143" text-anchor="middle" font-size="22.3352" fill="var(--text)">socket()</text>
  <text x="1005.625" y="259.3278" text-anchor="middle" font-size="22.3352" fill="var(--text)">connect()</text>
  <text x="1005.625" y="312.9412" text-anchor="middle" font-size="22.3352" fill="var(--text)">send()</text>
  <text x="1005.625" y="366.5546" text-anchor="middle" font-size="22.3352" fill="var(--text)">recv()</text>
  <rect x="846.25" y="498.1513" width="318.75" height="87.7311" fill="var(--text-muted)" stroke="var(--warn-border)" stroke-width="2.7994" rx="6" />
  <text x="1005.625" y="551.7648" text-anchor="middle" font-size="22.3352" fill="var(--warn-accent)" font-weight="bold">Socket  fd = 3</text>
  <line x1="508.75" y1="542.0168" x2="771.25" y2="542.0168" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="771.25" y1="517.6471" x2="508.75" y2="517.6471" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640.0001" y="498.1513" text-anchor="middle" font-size="20.474" fill="var(--text-muted)" font-style="italic">Network (TCP/UDP)</text>
</svg>
  <line x1="673.9623" y1="49.2799" x2="1240" y2="176.88" stroke="var(--text-muted)" stroke-width="2" />
  <text x="190.2572" y="207.04" font-size="25.9592" fill="var(--text)" text-anchor="middle">.com</text>
  <text x="396.0892" y="207.04" font-size="25.9592" fill="var(--text)" text-anchor="middle">.org</text>
  <text x="601.9211" y="207.04" font-size="25.9592" fill="var(--text)" text-anchor="middle">.net</text>
  <text x="879.7941" y="207.04" font-size="25.9592" fill="var(--text)" text-anchor="middle">.uk</text>
  <text x="1065.0429" y="207.04" font-size="25.9592" fill="var(--text)" text-anchor="middle">.de</text>
  <text x="1240" y="207.04" font-size="25.9592" fill="var(--text)" text-anchor="middle">...</text>
  <line x1="190.2572" y1="216.3199" x2="87.3413" y2="385.68" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="190.2572" y1="216.3199" x2="262.2984" y2="385.68" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="190.2572" y1="216.3199" x2="437.2555" y2="385.68" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="879.7941" y1="216.3199" x2="879.7941" y2="385.68" stroke="var(--text-muted)" stroke-width="2" />
  <text x="87.3413" y="415.84" font-size="25.9592" fill="var(--text)" text-anchor="middle">google</text>
  <text x="262.2984" y="415.84" font-size="25.9592" fill="var(--text)" text-anchor="middle">amazon</text>
  <text x="437.2555" y="415.84" font-size="25.9592" fill="var(--text)" text-anchor="middle">example</text>
  <text x="879.7941" y="415.84" font-size="25.9592" fill="var(--text)" text-anchor="middle">bbc</text>
  <line x1="87.3413" y1="425.12" x2="40" y2="587.52" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="87.3413" y1="425.12" x2="159.3824" y2="587.52" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="262.2984" y1="425.12" x2="278.765" y2="587.52" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="879.7941" y1="425.12" x2="879.7941" y2="587.52" stroke="var(--text-muted)" stroke-width="2" />
  <text x="40" y="620" font-size="25.9592" fill="var(--text)" text-anchor="middle">www</text>
  <text x="159.3824" y="620" font-size="25.9592" fill="var(--text)" text-anchor="middle">mail</text>
  <text x="278.765" y="620" font-size="25.9592" fill="var(--text)" text-anchor="middle">www</text>
  <text x="879.7941" y="620" font-size="25.9592" fill="var(--text)" text-anchor="middle">www</text>
</svg>
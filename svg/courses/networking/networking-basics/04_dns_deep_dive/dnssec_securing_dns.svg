  <line x1="387.8788" y1="418.2857" x2="197.8182" y2="418.2857" stroke="var(--text-muted)" stroke-width="2.5714" marker-end="url(#arrow)" />
  <text x="292.8485" y="449.1429" font-size="18.8571" fill="var(--ok-deep)" text-anchor="middle">Verified Response</text>

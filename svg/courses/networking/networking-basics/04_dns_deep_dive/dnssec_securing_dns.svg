<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="80" y="110" font-size="25.6667" fill="var(--danger-accent)" font-weight="bold">Without DNSSEC:</text>
  <rect x="80" y="132" width="186.6667" height="91.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="173.3334" y="187" font-size="23.8333" fill="var(--text)" text-anchor="middle">Client</text>
  <rect x="515.5556" y="132" width="207.4074" height="91.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="619.2593" y="187" font-size="23.8333" fill="var(--text)" text-anchor="middle">Resolver</text>
  <rect x="971.8518" y="132" width="186.6667" height="91.6667" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1065.1852" y="187" font-size="23.8333" fill="var(--text)" text-anchor="middle">NS</text>
  <line x1="266.6667" y1="161.3333" x2="511.4074" y2="161.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="391.1111" y="152.1667" font-size="20.1666" fill="var(--text-muted)" text-anchor="middle">Query</text>
  <line x1="971.8518" y1="161.3333" x2="727.1111" y2="161.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="847.4074" y="152.1667" font-size="20.1666" fill="var(--text-muted)" text-anchor="middle">Response</text>
  <line x1="515.5556" y1="205.3333" x2="270.8149" y2="205.3333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="395.2593" y="234.6666" font-size="20.1666" fill="var(--text-muted)" text-anchor="middle">Response</text>
  <rect x="453.3333" y="262.1666" width="414.8148" height="80.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="660.7407" y="296.9999" font-size="22" fill="var(--danger-accent)" text-anchor="middle">⚠ Attacker can forge</text>
  <text x="660.7407" y="326.3333" font-size="22" fill="var(--danger-accent)" text-anchor="middle">responses (DNS spoofing)</text>
  <line x1="619.2593" y1="223.6666" x2="619.2593" y2="260.3333" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)" />
  <text x="80" y="410.6666" font-size="25.6667" fill="var(--ok-accent)" font-weight="bold">With DNSSEC:</text>
  <rect x="80" y="432.6667" width="186.6667" height="91.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="173.3334" y="487.6666" font-size="23.8333" fill="var(--text)" text-anchor="middle">Client</text>
  <rect x="474.0741" y="432.6667" width="269.6296" height="109.9999" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="608.8889" y="476.6666" font-size="23.8333" fill="var(--text)" text-anchor="middle">Resolver</text>
  <text x="608.8889" y="509.6667" font-size="20.1666" fill="var(--ok-accent)" text-anchor="middle">Validates signature</text>
  <rect x="992.5926" y="432.6667" width="207.4074" height="109.9999" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1096.2963" y="476.6666" font-size="23.8333" fill="var(--text)" text-anchor="middle">NS</text>
  <text x="1096.2963" y="509.6667" font-size="20.1666" fill="var(--ok-accent)" text-anchor="middle">Signs records</text>
  <line x1="266.6667" y1="461.9999" x2="469.9259" y2="461.9999" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="368.2963" y="452.8333" font-size="20.1666" fill="var(--text-muted)" text-anchor="middle">Query</text>
  <line x1="992.5926" y1="461.9999" x2="747.8519" y2="461.9999" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="868.1481" y="452.8333" font-size="20.1666" fill="var(--text-muted)" text-anchor="middle">Signed Response</text>
  <line x1="474.0741" y1="516.9999" x2="270.8149" y2="516.9999" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="372.4445" y="550" font-size="20.1666" fill="var(--ok-accent)" text-anchor="middle">Verified Response</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="40" y="40" font-size="30.5028" fill="var(--danger-accent)" font-weight="bold">Without DNSSEC:</text>
  <rect x="40" y="69" width="200" height="120.8334" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0001" y="141.5" font-size="28.3239" fill="var(--text)" text-anchor="middle">Client</text>
  <rect x="506.6667" y="69" width="222.2222" height="120.8334" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="617.7778" y="141.5" font-size="28.3239" fill="var(--text)" text-anchor="middle">Resolver</text>
  <rect x="995.5555" y="69" width="200" height="120.8334" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.5556" y="141.5" font-size="28.3239" fill="var(--text)" text-anchor="middle">NS</text>
  <line x1="240" y1="107.6666" x2="502.2222" y2="107.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="373.3333" y="95.5834" font-size="23.9664" fill="var(--text-muted)" text-anchor="middle">Query</text>
  <line x1="995.5555" y1="107.6666" x2="733.3333" y2="107.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="862.2222" y="95.5834" font-size="23.9664" fill="var(--text-muted)" text-anchor="middle">Response</text>
  <line x1="506.6667" y1="165.6666" x2="244.4445" y2="165.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="377.7778" y="204.3332" font-size="23.9664" fill="var(--text-muted)" text-anchor="middle">Response</text>
  <rect x="440" y="240.5832" width="444.4444" height="106.3334" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="662.2222" y="286.4999" font-size="26.1452" fill="var(--danger-accent)" text-anchor="middle">⚠ Attacker can forge</text>
  <text x="662.2222" y="325.1666" font-size="26.1452" fill="var(--danger-accent)" text-anchor="middle">responses (DNS spoofing)</text>
  <line x1="617.7778" y1="189.8332" x2="617.7778" y2="238.1666" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)" />
  <text x="40" y="436.3332" font-size="30.5028" fill="var(--ok-accent)" font-weight="bold">With DNSSEC:</text>
  <rect x="40" y="465.3334" width="200" height="120.8334" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0001" y="537.8332" font-size="28.3239" fill="var(--text)" text-anchor="middle">Client</text>
  <rect x="462.2222" y="465.3334" width="288.8889" height="144.9999" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="606.6667" y="523.3332" font-size="28.3239" fill="var(--text)" text-anchor="middle">Resolver</text>
  <text x="606.6667" y="566.8334" font-size="23.9664" fill="var(--ok-accent)" text-anchor="middle">Validates signature</text>
  <rect x="1017.7778" y="465.3334" width="222.2222" height="144.9999" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.8889" y="523.3332" font-size="28.3239" fill="var(--text)" text-anchor="middle">NS</text>
  <text x="1128.8889" y="566.8334" font-size="23.9664" fill="var(--ok-accent)" text-anchor="middle">Signs records</text>
  <line x1="240" y1="503.9999" x2="457.7777" y2="503.9999" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="348.8889" y="491.9166" font-size="23.9664" fill="var(--text-muted)" text-anchor="middle">Query</text>
  <line x1="1017.7778" y1="503.9999" x2="755.5556" y2="503.9999" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="884.4444" y="491.9166" font-size="23.9664" fill="var(--text-muted)" text-anchor="middle">Signed Response</text>
  <line x1="462.2222" y1="576.4999" x2="244.4445" y2="576.4999" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="353.3334" y="620" font-size="23.9664" fill="var(--ok-accent)" text-anchor="middle">Verified Response</text>
</svg>
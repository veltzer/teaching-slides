  <text x="314.1818" y="154.2857" font-size="18.8571" fill="var(--text-muted)" text-anchor="middle">Response</text>
  <rect x="368.4848" y="180" width="387.8788" height="75.4286" rx="6.8571" fill="var(--warn-pale4)" stroke="var(--warn-amber)" stroke-width="2.5714" />
  <text x="562.4242" y="212.5714" font-size="20.5714" fill="var(--danger-deep)" text-anchor="middle">⚠ Attacker can forge</text>
  <text x="562.4242" y="240" font-size="20.5714" fill="var(--danger-deep)" text-anchor="middle">responses (DNS spoofing)</text>
  <line x1="523.6364" y1="144" x2="523.6364" y2="178.2857" stroke="var(--warn-amber)" stroke-width="2.5714" marker-end="url(#arrow-warn)" />
  <text x="19.3939" y="318.8571" font-size="24" fill="var(--ok-deep)" font-weight="bold">With DNSSEC:</text>
  <rect x="19.3939" y="339.4286" width="174.5455" height="85.7143" rx="6.8571" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.5714" />
  <text x="106.6667" y="390.8571" font-size="22.2857" fill="var(--text-darker)" text-anchor="middle">Client</text>
  <rect x="387.8788" y="339.4286" width="252.1212" height="102.8571" rx="6.8571" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.5714" />
  <text x="513.9394" y="380.5714" font-size="22.2857" fill="var(--text-darker)" text-anchor="middle">Resolver</text>
  <text x="513.9394" y="411.4286" font-size="18.8571" fill="var(--ok-deep)" text-anchor="middle">Validates signature</text>
  <rect x="872.7273" y="339.4286" width="193.9394" height="102.8571" rx="6.8571" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="2.5714" />
  <text x="969.697" y="380.5714" font-size="22.2857" fill="var(--text-darker)" text-anchor="middle">NS</text>
  <text x="969.697" y="411.4286" font-size="18.8571" fill="var(--ok-deep)" text-anchor="middle">Signs records</text>
  <line x1="193.9394" y1="366.8571" x2="384" y2="366.8571" stroke="var(--text-muted)" stroke-width="2.5714" marker-end="url(#arrow)" />
  <text x="288.9697" y="358.2857" font-size="18.8571" fill="var(--text-muted)" text-anchor="middle">Query</text>
  <line x1="872.7273" y1="366.8571" x2="643.8788" y2="366.8571" stroke="var(--text-muted)" stroke-width="2.5714" marker-end="url(#arrow)" />

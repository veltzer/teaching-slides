<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <text x="19.3939" y="37.7143" font-size="24" fill="var(--danger-accent)" font-weight="bold">Without DNSSEC:</text>
  <rect x="19.3939" y="58.2857" width="174.5455" height="85.7143" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="106.6667" y="109.7143" font-size="22.2857" fill="var(--text)" text-anchor="middle">Client</text>
  <rect x="426.6667" y="58.2857" width="193.9394" height="85.7143" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="523.6364" y="109.7143" font-size="22.2857" fill="var(--text)" text-anchor="middle">Resolver</text>
  <rect x="853.3333" y="58.2857" width="174.5455" height="85.7143" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="940.6061" y="109.7143" font-size="22.2857" fill="var(--text)" text-anchor="middle">NS</text>
  <line x1="193.9394" y1="85.7143" x2="422.7879" y2="85.7143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="310.303" y="77.1429" font-size="18.8571" fill="var(--text-muted)" text-anchor="middle">Query</text>
  <line x1="853.3333" y1="85.7143" x2="624.4848" y2="85.7143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="736.9697" y="77.1429" font-size="18.8571" fill="var(--text-muted)" text-anchor="middle">Response</text>
  <line x1="426.6667" y1="126.8571" x2="197.8182" y2="126.8571" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="314.1818" y="154.2857" font-size="18.8571" fill="var(--text-muted)" text-anchor="middle">Response</text>
  <rect x="368.4848" y="180" width="387.8788" height="75.4286" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="562.4242" y="212.5714" font-size="20.5714" fill="var(--danger-accent)" text-anchor="middle">⚠ Attacker can forge</text>
  <text x="562.4242" y="240" font-size="20.5714" fill="var(--danger-accent)" text-anchor="middle">responses (DNS spoofing)</text>
  <line x1="523.6364" y1="144" x2="523.6364" y2="178.2857" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)" />
  <text x="19.3939" y="318.8571" font-size="24" fill="var(--ok-accent)" font-weight="bold">With DNSSEC:</text>
  <rect x="19.3939" y="339.4286" width="174.5455" height="85.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="106.6667" y="390.8571" font-size="22.2857" fill="var(--text)" text-anchor="middle">Client</text>
  <rect x="387.8788" y="339.4286" width="252.1212" height="102.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="513.9394" y="380.5714" font-size="22.2857" fill="var(--text)" text-anchor="middle">Resolver</text>
  <text x="513.9394" y="411.4286" font-size="18.8571" fill="var(--ok-accent)" text-anchor="middle">Validates signature</text>
  <rect x="872.7273" y="339.4286" width="193.9394" height="102.8571" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="969.697" y="380.5714" font-size="22.2857" fill="var(--text)" text-anchor="middle">NS</text>
  <text x="969.697" y="411.4286" font-size="18.8571" fill="var(--ok-accent)" text-anchor="middle">Signs records</text>
  <line x1="193.9394" y1="366.8571" x2="384" y2="366.8571" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="288.9697" y="358.2857" font-size="18.8571" fill="var(--text-muted)" text-anchor="middle">Query</text>
  <line x1="872.7273" y1="366.8571" x2="643.8788" y2="366.8571" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="756.3636" y="358.2857" font-size="18.8571" fill="var(--text-muted)" text-anchor="middle">Signed Response</text>
  <line x1="387.8788" y1="418.2857" x2="197.8182" y2="418.2857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="292.8485" y="449.1429" font-size="18.8571" fill="var(--ok-accent)" text-anchor="middle">Verified Response</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-size="30.319058" font-weight="bold" fill="var(--text)">NS Records: Delegation Chain</text>

  <!-- Left column: zone boxes -->
  <rect x="40" y="83.773585" width="385.714286" height="98.490566" rx="6.496941" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="122.075472" text-anchor="middle" font-size="23.822117" font-weight="bold" fill="var(--primary-text)">Root (.)</text>
  <text x="232.857143" y="158.188679" text-anchor="middle" font-size="17.325176" fill="var(--primary-text)">13 root servers (a–m.root-servers.net)</text>

  <rect x="40" y="226.037736" width="385.714286" height="98.490566" rx="6.496941" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="264.339623" text-anchor="middle" font-size="23.822117" font-weight="bold" fill="var(--primary-text)">.com TLD</text>
  <text x="232.857143" y="300.45283" text-anchor="middle" font-size="17.325176" fill="var(--primary-text)">Verisign gTLD name servers</text>

  <rect x="40" y="368.301887" width="385.714286" height="98.490566" rx="6.496941" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="406.603774" text-anchor="middle" font-size="23.822117" font-weight="bold" fill="var(--primary-text)">example.com</text>
  <text x="232.857143" y="442.716981" text-anchor="middle" font-size="17.325176" fill="var(--primary-text)">Authoritative zone</text>

  <rect x="40" y="510.566038" width="385.714286" height="109.433962" rx="6.496941" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="548.867925" text-anchor="middle" font-size="21.65647" font-weight="bold" fill="var(--ok-text)">Answer returned</text>
  <text x="232.857143" y="581.698113" text-anchor="middle" font-size="17.325176" fill="var(--ok-text)">a.iana-servers.net</text>
  <text x="232.857143" y="606.867925" text-anchor="middle" font-size="17.325176" fill="var(--ok-text)">b.iana-servers.net</text>

  <line x1="232.857143" y1="182.264151" x2="232.857143" y2="226.037736" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="232.857143" y1="324.528302" x2="232.857143" y2="368.301887" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="232.857143" y1="466.792453" x2="232.857143" y2="510.566038" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right column: messages -->
  <rect x="490" y="83.773585" width="750" height="98.490566" rx="6.496941" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.428571" y="122.075472" font-size="19.490823" font-weight="bold" fill="var(--text)">Query: "Who handles .com?"</text>
  <text x="511.428571" y="154.90566" font-size="17.325176" fill="var(--text-muted)">Root refers resolver to the .com TLD name servers via NS records.</text>

  <rect x="490" y="226.037736" width="750" height="98.490566" rx="6.496941" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.428571" y="264.339623" font-size="19.490823" font-weight="bold" fill="var(--text)">Query: "Who handles example.com?"</text>
  <text x="511.428571" y="297.169811" font-size="17.325176" fill="var(--text-muted)">.com TLD returns NS records pointing to the zone's authoritative servers.</text>

  <rect x="490" y="368.301887" width="750" height="98.490566" rx="6.496941" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.428571" y="406.603774" font-size="19.490823" font-weight="bold" fill="var(--text)">Response: "I am authoritative"</text>
  <text x="511.428571" y="439.433962" font-size="17.325176" fill="var(--text-muted)">Authoritative server answers with the actual record (A, MX, etc.).</text>

  <rect x="490" y="510.566038" width="750" height="109.433962" rx="6.496941" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.428571" y="548.867925" font-size="19.490823" font-weight="bold" fill="var(--text)">NS record format</text>
  <text x="511.428571" y="581.698113" font-size="17.325176" fill="var(--text-muted)" font-family="monospace">example.com.  IN  NS  a.iana-servers.net.</text>
  <text x="511.428571" y="606.867925" font-size="17.325176" fill="var(--text-muted)" font-family="monospace">example.com.  IN  NS  b.iana-servers.net.</text>
</svg>

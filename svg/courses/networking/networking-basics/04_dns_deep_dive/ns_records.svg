<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <!-- Left column: zone boxes -->
  <rect x="40" y="40" width="385.714286" height="106.530612222824" rx="6.756920632619" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="81.42857166035" text-anchor="middle" font-size="24.775375652936" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Root (.)</text>
  <text x="232.857143" y="120.489795565181" text-anchor="middle" font-size="18.018455020317" fill="var(--primary-text)" font-family="Arial, sans-serif">13 root servers (a–m.root-servers.net)</text>

  <rect x="40" y="193.877551108705" width="385.714286" height="106.530612222824" rx="6.756920632619" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="235.306122769055" text-anchor="middle" font-size="24.775375652936" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">.com TLD</text>
  <text x="232.857143" y="274.367346673886" text-anchor="middle" font-size="18.018455020317" fill="var(--primary-text)" font-family="Arial, sans-serif">Verisign gTLD name servers</text>

  <rect x="40" y="347.755102217409" width="385.714286" height="106.530612222824" rx="6.756920632619" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="389.183673877759" text-anchor="middle" font-size="24.775375652936" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">example.com</text>
  <text x="232.857143" y="428.244897782591" text-anchor="middle" font-size="18.018455020317" fill="var(--primary-text)" font-family="Arial, sans-serif">Authoritative zone</text>

  <rect x="40" y="501.632653326114" width="385.714286" height="118.367346673886" rx="6.756920632619" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="232.857143" y="543.061224986464" text-anchor="middle" font-size="22.523068775397" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Answer returned</text>
  <text x="232.857143" y="578.57142833965" text-anchor="middle" font-size="18.018455020317" fill="var(--ok-text)" font-family="Arial, sans-serif">a.iana-servers.net</text>
  <text x="232.857143" y="605.795918875052" text-anchor="middle" font-size="18.018455020317" fill="var(--ok-text)" font-family="Arial, sans-serif">b.iana-servers.net</text>

  <line x1="232.857143" y1="146.530612222824" x2="232.857143" y2="193.877551108705" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="232.857143" y1="300.408163331528" x2="232.857143" y2="347.755102217409" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="232.857143" y1="454.285714440233" x2="232.857143" y2="501.632653326114" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right column: messages -->
  <rect x="490" y="40" width="750" height="106.530612222824" rx="6.756920632619" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.428571" y="81.42857166035" font-size="20.270761897857" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Query: "Who handles .com?"</text>
  <text x="511.428571" y="116.938775013536" font-size="18.018455020317" fill="var(--text-muted)" font-family="Arial, sans-serif">Root refers resolver to the .com TLD name servers via NS records.</text>

  <rect x="490" y="193.877551108705" width="750" height="106.530612222824" rx="6.756920632619" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.428571" y="235.306122769055" font-size="20.270761897857" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Query: "Who handles example.com?"</text>
  <text x="511.428571" y="270.816326122241" font-size="18.018455020317" fill="var(--text-muted)" font-family="Arial, sans-serif">.com TLD returns NS records pointing to the zone's authoritative servers.</text>

  <rect x="490" y="347.755102217409" width="750" height="106.530612222824" rx="6.756920632619" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.428571" y="389.183673877759" font-size="20.270761897857" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Response: "I am authoritative"</text>
  <text x="511.428571" y="424.693877230945" font-size="18.018455020317" fill="var(--text-muted)" font-family="Arial, sans-serif">Authoritative server answers with the actual record (A, MX, etc.).</text>

  <rect x="490" y="501.632653326114" width="750" height="118.367346673886" rx="6.756920632619" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="511.428571" y="543.061224986464" font-size="20.270761897857" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">NS record format</text>
  <text x="511.428571" y="578.57142833965" font-size="18.018455020317" fill="var(--text-muted)" font-family="Courier New, monospace">example.com.  IN  NS  a.iana-servers.net.</text>
  <text x="511.428571" y="605.795918875052" font-size="18.018455020317" fill="var(--text-muted)" font-family="Courier New, monospace">example.com.  IN  NS  b.iana-servers.net.</text>
</svg>

<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <ns0:rect x="9.0177" y="9.2753" width="1136.2319" height="630.7247" rx="7.2142" fill="#f0f4f8" stroke="#333" stroke-width="2.7053" />
  <ns0:text x="36.0709" y="59.3623" font-size="23.4461" fill="#222">Step 1:  Browser checks its own DNS cache</ns0:text>
  <ns0:text x="36.0709" y="103.8841" font-size="23.4461" fill="#222">Step 2:  OS checks /etc/hosts file</ns0:text>
  <ns0:text x="36.0709" y="148.4058" font-size="23.4461" fill="#222">Step 3:  OS checks its DNS cache (systemd-resolved, nscd)</ns0:text>
  <ns0:text x="36.0709" y="192.9276" font-size="23.4461" fill="#222">Step 4:  Query sent to configured recursive resolver</ns0:text>
  <ns0:text x="36.0709" y="237.4493" font-size="23.4461" fill="#222">Step 5:  Resolver checks its cache</ns0:text>
  <ns0:text x="36.0709" y="281.971" font-size="23.4461" fill="#222">Step 6:  If not cached, resolver walks the DNS hierarchy:</ns0:text>
  <ns0:text x="79.3559" y="322.7826" font-size="23.4461" fill="#555">6a:  Query root server → get .com NS</ns0:text>
  <ns0:text x="79.3559" y="363.5942" font-size="23.4461" fill="#555">6b:  Query .com NS → get example.com NS</ns0:text>
  <ns0:text x="79.3559" y="404.4058" font-size="23.4461" fill="#555">6c:  Query example.com NS → get A record</ns0:text>
  <ns0:text x="36.0709" y="448.9276" font-size="23.4461" fill="#222">Step 7:  Resolver caches the result and returns it</ns0:text>
  <ns0:text x="36.0709" y="493.4493" font-size="23.4461" fill="#222">Step 8:  OS caches the result</ns0:text>
  <ns0:text x="36.0709" y="537.971" font-size="23.4461" fill="#222">Step 9:  Browser caches the result</ns0:text>
  <ns0:text x="36.0709" y="582.4928" font-size="23.4461" fill="#222">Step 10: Browser uses IP to establish TCP connection</ns0:text>
</ns0:svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
    </defs>
  <ns0:rect x="9.0177" y="9.2753" width="1136.2319" height="630.7247" rx="7.2142" fill="#f5f5f5" stroke="#333" stroke-width="2.7053" />
  <ns0:text x="36.0709" y="59.3623" font-size="23.4461" fill="#222">Step 1:  Browser checks its own DNS cache</ns0:text>
  <ns0:text x="36.0709" y="103.8841" font-size="23.4461" fill="#222">Step 2:  OS checks /etc/hosts file</ns0:text>
  <ns0:text x="36.0709" y="148.4058" font-size="23.4461" fill="#222">Step 3:  OS checks its DNS cache (systemd-resolved, nscd)</ns0:text>
  <ns0:text x="36.0709" y="192.9276" font-size="23.4461" fill="#222">Step 4:  Query sent to configured recursive resolver</ns0:text>
  <ns0:text x="36.0709" y="237.4493" font-size="23.4461" fill="#222">Step 5:  Resolver checks its cache</ns0:text>
  <ns0:text x="36.0709" y="281.971" font-size="23.4461" fill="#222">Step 6:  If not cached, resolver walks the DNS hierarchy:</ns0:text>
  <ns0:text x="79.3559" y="322.7826" font-size="23.4461" fill="#555">6a:  Query root server → get .com NS</ns0:text>
  <ns0:text x="79.3559" y="363.5942" font-size="23.4461" fill="#555">6b:  Query .com NS → get example.com NS</ns0:text>
  <ns0:text x="79.3559" y="404.4058" font-size="23.4461" fill="#555">6c:  Query example.com NS → get A record</ns0:text>
  <ns0:text x="36.0709" y="448.9276" font-size="23.4461" fill="#222">Step 7:  Resolver caches the result and returns it</ns0:text>
  <ns0:text x="36.0709" y="493.4493" font-size="23.4461" fill="#222">Step 8:  OS caches the result</ns0:text>
  <ns0:text x="36.0709" y="537.971" font-size="23.4461" fill="#222">Step 9:  Browser caches the result</ns0:text>
  <ns0:text x="36.0709" y="582.4928" font-size="23.4461" fill="#222">Step 10: Browser uses IP to establish TCP connection</ns0:text>
</ns0:svg>
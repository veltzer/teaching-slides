<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="161.5" width="334.4262" height="337" rx="5.9993" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="207.2131" y="307.5334" font-size="25.5709" fill="var(--text)" text-anchor="middle">www.example.com</text>
  <text x="207.2131" y="408.6334" font-size="23.6039" fill="var(--text-muted)" text-anchor="middle">(alias)</text>
  <line x1="374.4262" y1="330.0001" x2="468.8524" y2="330.0001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="421.6394" y="285.0667" font-size="21.6369" fill="var(--text-muted)" text-anchor="middle">CNAME</text>
  <rect x="472.7869" y="161.5" width="334.4262" height="337" rx="5.9993" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="307.5334" font-size="25.5709" fill="var(--text)" text-anchor="middle">example.com</text>
  <text x="640" y="408.6334" font-size="23.6039" fill="var(--text-muted)" text-anchor="middle">(canonical)</text>
  <line x1="807.2131" y1="330.0001" x2="901.6393" y2="330.0001" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="854.4262" y="285.0667" font-size="21.6369" fill="var(--text-muted)" text-anchor="middle">A</text>
  <rect x="905.5738" y="161.5" width="334.4262" height="337" rx="5.9993" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1072.7869" y="307.5334" font-size="25.5709" fill="var(--text)" text-anchor="middle">93.184.216.34</text>
  <text x="1072.7869" y="408.6334" font-size="23.6039" fill="var(--text-muted)" text-anchor="middle">(IP address)</text>
</svg>
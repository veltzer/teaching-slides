</defs>
  <rect x="12.3314" y="18.4971" width="1159.1522" height="621.5029" rx="9.8652" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="3.6994" />
  <text x="591.9075" y="118.3815" font-size="34.5279" fill="var(--text-darker)" text-anchor="middle" font-weight="bold">GeoDNS Server</text>
  <line x1="49.3256" y1="155.3757" x2="1134.4894" y2="155.3757" stroke="var(--text-dark)" stroke-width="2.4663" />
  <text x="73.9884" y="244.1618" font-size="32.0617" fill="var(--text-darker)">US client  →  1.2.3.4</text>
  <text x="789.21" y="244.1618" font-size="29.5954" fill="var(--text-muted)">(US data center)</text>
  <text x="73.9884" y="355.1445" font-size="32.0617" fill="var(--text-darker)">EU client  →  5.6.7.8</text>
  <text x="789.21" y="355.1445" font-size="29.5954" fill="var(--text-muted)">(EU data center)</text>
  <text x="73.9884" y="466.1272" font-size="32.0617" fill="var(--text-darker)">AS client  →  9.0.1.2</text>
  <text x="789.21" y="466.1272" font-size="29.5954" fill="var(--text-muted)">(Asia data center)</text>

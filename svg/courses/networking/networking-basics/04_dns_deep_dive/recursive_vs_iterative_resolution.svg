<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="169.9114" height="334.6151" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="124.9557" y="190.577" font-size="30.8708" fill="var(--text)" text-anchor="middle">Client</text>
  <rect x="263.0089" y="40" width="276.1062" height="334.6151" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="401.0619" y="173.8462" font-size="30.8708" fill="var(--text)" text-anchor="middle">Recursive</text>
  <text x="401.0619" y="263.077" font-size="30.8708" fill="var(--text)" text-anchor="middle">Resolver</text>
  <text x="401.0619" y="352.3077" font-size="25.7255" fill="var(--text-muted)" text-anchor="middle">(ISP/8.8.8.8)</text>
  <rect x="602.8318" y="40" width="148.6726" height="334.6151" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="677.1681" y="229.6155" font-size="30.8708" fill="var(--text)" text-anchor="middle">Root</text>
  <rect x="804.6018" y="40" width="148.6726" height="334.6151" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="878.938" y="190.577" font-size="30.8708" fill="var(--text)" text-anchor="middle">.com</text>
  <text x="878.938" y="279.8077" font-size="30.8708" fill="var(--text)" text-anchor="middle">NS</text>
  <rect x="1006.3717" y="40" width="233.6283" height="334.6151" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1123.1858" y="173.8462" font-size="30.8708" fill="var(--text)" text-anchor="middle">Authoritative</text>
  <text x="1123.1858" y="263.077" font-size="30.8708" fill="var(--text)" text-anchor="middle">NS</text>
  <line x1="209.9114" y1="140.3847" x2="258.761" y2="140.3847" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="539.1149" y1="140.3847" x2="598.5839" y2="140.3847" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="751.5043" y1="140.3847" x2="800.3539" y2="140.3847" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="953.2743" y1="140.3847" x2="1002.1238" y2="140.3847" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="258.761" y1="274.2308" x2="209.9114" y2="274.2308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="598.5839" y1="274.2308" x2="539.1149" y2="274.2308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="800.3539" y1="274.2308" x2="751.5043" y2="274.2308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1002.1238" y1="274.2308" x2="953.2743" y2="274.2308" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="124.9557" y="541.923" font-size="28.2981" fill="var(--text-muted)" text-anchor="middle">Single</text>
  <text x="124.9557" y="620" font-size="28.2981" fill="var(--text-muted)" text-anchor="middle">query</text>
  <text x="401.0619" y="541.923" font-size="28.2981" fill="var(--text-muted)" text-anchor="middle">Does all</text>
  <text x="401.0619" y="620" font-size="28.2981" fill="var(--text-muted)" text-anchor="middle">the work</text>
  <text x="942.6548" y="541.923" font-size="28.2981" fill="var(--text-muted)" text-anchor="middle">Iterative queries to each level</text>
</svg>
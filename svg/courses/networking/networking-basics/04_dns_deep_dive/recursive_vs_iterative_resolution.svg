<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="9.1429" y="65.4545" width="146.2857" height="196.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="82.2857" y="153.8182" font-size="21.9429" fill="var(--text)" text-anchor="middle">Client</text>
  <rect x="201.1429" y="65.4545" width="237.7143" height="196.3636" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="320" y="144" font-size="21.9429" fill="var(--text)" text-anchor="middle">Recursive</text>
  <text x="320" y="196.3636" font-size="21.9429" fill="var(--text)" text-anchor="middle">Resolver</text>
  <text x="320" y="248.7273" font-size="18.2857" fill="var(--text-muted)" text-anchor="middle">(ISP/8.8.8.8)</text>
  <rect x="493.7143" y="65.4545" width="128" height="196.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="557.7143" y="176.7273" font-size="21.9429" fill="var(--text)" text-anchor="middle">Root</text>
  <rect x="667.4286" y="65.4545" width="128" height="196.3636" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="731.4286" y="153.8182" font-size="21.9429" fill="var(--text)" text-anchor="middle">.com</text>
  <text x="731.4286" y="206.1818" font-size="21.9429" fill="var(--text)" text-anchor="middle">NS</text>
  <rect x="841.1429" y="65.4545" width="201.1429" height="196.3636" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="941.7143" y="144" font-size="21.9429" fill="var(--text)" text-anchor="middle">Authoritative</text>
  <text x="941.7143" y="196.3636" font-size="21.9429" fill="var(--text)" text-anchor="middle">NS</text>
  <line x1="155.4286" y1="124.3636" x2="197.4857" y2="124.3636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="438.8571" y1="124.3636" x2="490.0571" y2="124.3636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="621.7143" y1="124.3636" x2="663.7714" y2="124.3636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="795.4286" y1="124.3636" x2="837.4857" y2="124.3636" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="197.4857" y1="202.9091" x2="155.4286" y2="202.9091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="490.0571" y1="202.9091" x2="438.8571" y2="202.9091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="663.7714" y1="202.9091" x2="621.7143" y2="202.9091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="837.4857" y1="202.9091" x2="795.4286" y2="202.9091" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="82.2857" y="360" font-size="20.1143" fill="var(--text-muted)" text-anchor="middle">Single</text>
  <text x="82.2857" y="405.8182" font-size="20.1143" fill="var(--text-muted)" text-anchor="middle">query</text>
  <text x="320" y="360" font-size="20.1143" fill="var(--text-muted)" text-anchor="middle">Does all</text>
  <text x="320" y="405.8182" font-size="20.1143" fill="var(--text-muted)" text-anchor="middle">the work</text>
  <text x="786.2857" y="360" font-size="20.1143" fill="var(--text-muted)" text-anchor="middle">Iterative queries to each level</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="80" y="145.5108" width="158.584" height="212.872" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="159.292" y="241.3033" font-size="23.7877" fill="var(--text)" text-anchor="middle">Client</text>
  <rect x="288.1416" y="145.5108" width="257.6991" height="212.872" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="416.9911" y="230.6597" font-size="23.7877" fill="var(--text)" text-anchor="middle">Recursive</text>
  <text x="416.9911" y="287.4256" font-size="23.7877" fill="var(--text)" text-anchor="middle">Resolver</text>
  <text x="416.9911" y="344.1915" font-size="19.823" fill="var(--text-muted)" text-anchor="middle">(ISP/8.8.8.8)</text>
  <rect x="605.3097" y="145.5108" width="138.7611" height="212.872" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="674.6902" y="266.1384" font-size="23.7877" fill="var(--text)" text-anchor="middle">Root</text>
  <rect x="793.6283" y="145.5108" width="138.7611" height="212.872" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="863.0088" y="241.3033" font-size="23.7877" fill="var(--text)" text-anchor="middle">.com</text>
  <text x="863.0088" y="298.0692" font-size="23.7877" fill="var(--text)" text-anchor="middle">NS</text>
  <rect x="981.9469" y="145.5108" width="218.0531" height="212.872" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1090.9734" y="230.6597" font-size="23.7877" fill="var(--text)" text-anchor="middle">Authoritative</text>
  <text x="1090.9734" y="287.4256" font-size="23.7877" fill="var(--text)" text-anchor="middle">NS</text>
  <line x1="238.584" y1="209.3725" x2="284.1769" y2="209.3725" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="545.8406" y1="209.3725" x2="601.345" y2="209.3725" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="744.0707" y1="209.3725" x2="789.6636" y2="209.3725" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="932.3893" y1="209.3725" x2="977.9822" y2="209.3725" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="284.1769" y1="294.5213" x2="238.584" y2="294.5213" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="601.345" y1="294.5213" x2="545.8406" y2="294.5213" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="789.6636" y1="294.5213" x2="744.0707" y2="294.5213" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="977.9822" y1="294.5213" x2="932.3893" y2="294.5213" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="159.292" y="464.819" font-size="21.8053" fill="var(--text-muted)" text-anchor="middle">Single</text>
  <text x="159.292" y="514.4892" font-size="21.8053" fill="var(--text-muted)" text-anchor="middle">query</text>
  <text x="416.9911" y="464.819" font-size="21.8053" fill="var(--text-muted)" text-anchor="middle">Does all</text>
  <text x="416.9911" y="514.4892" font-size="21.8053" fill="var(--text-muted)" text-anchor="middle">the work</text>
  <text x="922.4778" y="464.819" font-size="21.8053" fill="var(--text-muted)" text-anchor="middle">Iterative queries to each level</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>
  </defs>
  <rect width="1137.7778" height="640" fill="url(#bg)" rx="6"/>
  <circle cx="568.8889" cy="320" r="56.8889" fill="none" stroke="var(--primary-border)" stroke-width="4.4444" />
  <circle cx="568.8889" cy="320" r="28.4444" fill="var(--danger-fill)" opacity="0.8" />
  <circle cx="284.4444" cy="160" r="21.3333" fill="var(--primary-accent)" />
  <circle cx="853.3333" cy="160" r="21.3333" fill="var(--primary-accent)" />
  <circle cx="284.4444" cy="480" r="21.3333" fill="var(--primary-accent)" />
  <circle cx="853.3333" cy="480" r="21.3333" fill="var(--primary-accent)" />
  <circle cx="142.2222" cy="320" r="21.3333" fill="var(--primary-accent)" />
  <circle cx="995.5556" cy="320" r="21.3333" fill="var(--primary-accent)" />
  <line x1="284.4444" y1="160" x2="540.4444" y2="296" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="853.3333" y1="160" x2="597.3333" y2="296" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="284.4444" y1="480" x2="540.4444" y2="344" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="853.3333" y1="480" x2="597.3333" y2="344" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="142.2222" y1="320" x2="512" y2="320" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="995.5556" y1="320" x2="625.7778" y2="320" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="284.4444" y1="160" x2="853.3333" y2="160" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3" />
  <line x1="284.4444" y1="480" x2="853.3333" y2="480" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3" />
  <line x1="142.2222" y1="320" x2="284.4444" y2="160" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3" />
  <line x1="995.5556" y1="320" x2="853.3333" y2="160" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3" />
  <text x="284.4444" y="168" text-anchor="middle" font-size="14.2222" fill="var(--bg)">eth0</text>
  <text x="853.3333" y="168" text-anchor="middle" font-size="14.2222" fill="var(--bg)">wlan0</text>
  <text x="284.4444" y="488" text-anchor="middle" font-size="14.2222" fill="var(--bg)">br0</text>
  <text x="853.3333" y="488" text-anchor="middle" font-size="14.2222" fill="var(--bg)">lo</text>
  <text x="142.2222" y="328" text-anchor="middle" font-size="14.2222" fill="var(--bg)">tun0</text>
  <text x="995.5556" y="328" text-anchor="middle" font-size="14.2222" fill="var(--bg)">veth0</text>
  <circle cx="426.6667" cy="240" r="5.3333" fill="var(--danger-fill)" opacity="0.7" />
  <circle cx="711.1111" cy="400" r="5.3333" fill="var(--danger-fill)" opacity="0.7" />
  <circle cx="355.5556" cy="320" r="5.3333" fill="var(--primary-fill)" opacity="0.7" />
  <circle cx="782.2222" cy="240" r="5.3333" fill="var(--primary-fill)" opacity="0.7" />
</svg>
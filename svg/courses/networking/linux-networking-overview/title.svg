<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <g transform="translate(0,60)">
  <circle cx="640" cy="330" r="55.6178" fill="none" stroke="var(--primary-border)" stroke-width="4.4444"/>
  <circle cx="640" cy="330" r="27.8088" fill="var(--danger-fill)" opacity="0.8"/>
  <circle cx="339.9999" cy="185" r="20.8566" fill="var(--primary-accent)"/>
  <circle cx="939.9999" cy="185" r="20.8566" fill="var(--primary-accent)"/>
  <circle cx="339.9999" cy="475" r="20.8566" fill="var(--primary-accent)"/>
  <circle cx="939.9999" cy="475" r="20.8566" fill="var(--primary-accent)"/>
  <circle cx="190" cy="330" r="20.8566" fill="var(--primary-accent)"/>
  <circle cx="1090" cy="330" r="20.8566" fill="var(--primary-accent)"/>
  <line x1="339.9999" y1="185" x2="609.9999" y2="308.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.6"/>
  <line x1="939.9999" y1="185" x2="670" y2="308.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.6"/>
  <line x1="339.9999" y1="475" x2="609.9999" y2="351.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.6"/>
  <line x1="939.9999" y1="475" x2="670" y2="351.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.6"/>
  <line x1="190" y1="330" x2="580" y2="330" stroke="var(--primary-border)" stroke-width="2" opacity="0.6"/>
  <line x1="1090" y1="330" x2="700" y2="330" stroke="var(--primary-border)" stroke-width="2" opacity="0.6"/>
  <line x1="339.9999" y1="185" x2="939.9999" y2="185" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3"/>
  <line x1="339.9999" y1="475" x2="939.9999" y2="475" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3"/>
  <line x1="190" y1="330" x2="339.9999" y2="185" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3"/>
  <line x1="1090" y1="330" x2="939.9999" y2="185" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3"/>
  <text x="339.9999" y="192.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">eth0</text>
  <text x="939.9999" y="192.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">wlan0</text>
  <text x="339.9999" y="482.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">br0</text>
  <text x="939.9999" y="482.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">lo</text>
  <text x="190" y="337.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">tun0</text>
  <text x="1090" y="337.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">veth0</text>
  <circle cx="490" cy="257.5" r="5.2141" fill="var(--danger-fill)" opacity="0.7"/>
  <circle cx="790" cy="402.5" r="5.2141" fill="var(--danger-fill)" opacity="0.7"/>
  <circle cx="415" cy="330" r="5.2141" fill="var(--primary-fill)" opacity="0.7"/>
  <circle cx="865" cy="257.5" r="5.2141" fill="var(--primary-fill)" opacity="0.7"/>
  </g>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Linux Networking Overview</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Packets, Sockets, and Protocols</text>
</svg>

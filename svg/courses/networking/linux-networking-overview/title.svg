<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Network nodes -->
  <circle cx="400" cy="200" r="40" fill="none" stroke="#0f3460" stroke-width="3"/>
  <circle cx="400" cy="200" r="20" fill="#e94560" opacity="0.8"/>
  <!-- Tux silhouette in center -->
  <text x="400" y="208" text-anchor="middle" font-size="24" fill="#fff">&#x1F427;</text>
  <!-- Surrounding nodes -->
  <circle cx="200" cy="100" r="15" fill="#0f3460"/>
  <circle cx="600" cy="100" r="15" fill="#0f3460"/>
  <circle cx="200" cy="300" r="15" fill="#0f3460"/>
  <circle cx="600" cy="300" r="15" fill="#0f3460"/>
  <circle cx="100" cy="200" r="15" fill="#0f3460"/>
  <circle cx="700" cy="200" r="15" fill="#0f3460"/>
  <!-- Connection lines -->
  <line x1="200" y1="100" x2="380" y2="185" stroke="#53a8b6" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="100" x2="420" y2="185" stroke="#53a8b6" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="300" x2="380" y2="215" stroke="#53a8b6" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="300" x2="420" y2="215" stroke="#53a8b6" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="200" x2="360" y2="200" stroke="#53a8b6" stroke-width="2" opacity="0.6"/>
  <line x1="700" y1="200" x2="440" y2="200" stroke="#53a8b6" stroke-width="2" opacity="0.6"/>
  <!-- Secondary connections -->
  <line x1="200" y1="100" x2="600" y2="100" stroke="#53a8b6" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="300" x2="600" y2="300" stroke="#53a8b6" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="200" x2="200" y2="100" stroke="#53a8b6" stroke-width="1" opacity="0.3"/>
  <line x1="700" y1="200" x2="600" y2="100" stroke="#53a8b6" stroke-width="1" opacity="0.3"/>
  <!-- Node labels -->
  <text x="200" y="105" text-anchor="middle" font-size="10" fill="#fff">eth0</text>
  <text x="600" y="105" text-anchor="middle" font-size="10" fill="#fff">wlan0</text>
  <text x="200" y="305" text-anchor="middle" font-size="10" fill="#fff">br0</text>
  <text x="600" y="305" text-anchor="middle" font-size="10" fill="#fff">lo</text>
  <text x="100" y="205" text-anchor="middle" font-size="10" fill="#fff">tun0</text>
  <text x="700" y="205" text-anchor="middle" font-size="10" fill="#fff">veth0</text>
  <!-- Data packets animation dots -->
  <circle cx="300" cy="150" r="4" fill="#e94560" opacity="0.7"/>
  <circle cx="500" cy="250" r="4" fill="#e94560" opacity="0.7"/>
  <circle cx="250" cy="200" r="4" fill="#53a8b6" opacity="0.7"/>
  <circle cx="550" cy="150" r="4" fill="#53a8b6" opacity="0.7"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1.6" y2="1.8">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <circle cx="640" cy="330" r="55.6178" fill="none" stroke="var(--primary-border)" stroke-width="4.4444" />
  <circle cx="640" cy="330" r="27.8088" fill="var(--danger-fill)" opacity="0.8" />
  <circle cx="339.9999" cy="185" r="20.8566" fill="var(--primary-accent)" />
  <circle cx="939.9999" cy="185" r="20.8566" fill="var(--primary-accent)" />
  <circle cx="339.9999" cy="475" r="20.8566" fill="var(--primary-accent)" />
  <circle cx="939.9999" cy="475" r="20.8566" fill="var(--primary-accent)" />
  <circle cx="190" cy="330" r="20.8566" fill="var(--primary-accent)" />
  <circle cx="1090" cy="330" r="20.8566" fill="var(--primary-accent)" />
  <line x1="339.9999" y1="185" x2="609.9999" y2="308.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="939.9999" y1="185" x2="670" y2="308.25" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="339.9999" y1="475" x2="609.9999" y2="351.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="939.9999" y1="475" x2="670" y2="351.75" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="190" y1="330" x2="580" y2="330" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="1090" y1="330" x2="700" y2="330" stroke="var(--primary-border)" stroke-width="2" opacity="0.6" />
  <line x1="339.9999" y1="185" x2="939.9999" y2="185" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3" />
  <line x1="339.9999" y1="475" x2="939.9999" y2="475" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3" />
  <line x1="190" y1="330" x2="339.9999" y2="185" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3" />
  <line x1="1090" y1="330" x2="939.9999" y2="185" stroke="var(--primary-border)" stroke-width="1.3333" opacity="0.3" />
  <text x="339.9999" y="192.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">eth0</text>
  <text x="939.9999" y="192.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">wlan0</text>
  <text x="339.9999" y="482.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">br0</text>
  <text x="939.9999" y="482.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">lo</text>
  <text x="190" y="337.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">tun0</text>
  <text x="1090" y="337.25" text-anchor="middle" font-size="13.9044" fill="var(--bg)" font-family="Arial, sans-serif">veth0</text>
  <circle cx="490" cy="257.5" r="5.2141" fill="var(--danger-fill)" opacity="0.7" />
  <circle cx="790" cy="402.5" r="5.2141" fill="var(--danger-fill)" opacity="0.7" />
  <circle cx="415" cy="330" r="5.2141" fill="var(--primary-fill)" opacity="0.7" />
  <circle cx="865" cy="257.5" r="5.2141" fill="var(--primary-fill)" opacity="0.7" />
</svg>
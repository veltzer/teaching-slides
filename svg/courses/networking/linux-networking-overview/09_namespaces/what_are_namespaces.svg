<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.140973" fill-opacity="0.2" />
  <text x="640" y="108.235208" text-anchor="middle" font-size="24.822737" font-weight="bold" fill="var(--info-accent)">Linux Kernel</text>
  <rect x="82.140468" y="146.617555" width="335.117057" height="400.882296" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.140973" filter="url(#shadow)" />
  <rect x="82.140468" y="146.617555" width="335.117057" height="55.441181" fill="var(--primary-fill)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="82.140468" y="189.264576" width="335.117057" height="12.794159" fill="var(--primary-fill)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="249.698997" y="183.933798" text-anchor="middle" font-size="21.719984" font-weight="bold" fill="var(--bg)">NS: default</text>
  <text x="249.698997" y="263.897063" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">eth0, lo</text>
  <text x="249.698997" y="315.073436" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">routing table</text>
  <text x="249.698997" y="366.249942" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">iptables rules</text>
  <text x="249.698997" y="417.426448" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">sockets, ports</text>
  <rect x="471.438127" y="146.617555" width="335.117057" height="400.882296" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.140973" filter="url(#shadow)" />
  <rect x="471.438127" y="146.617555" width="335.117057" height="55.441181" fill="var(--primary-fill)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="471.438127" y="189.264576" width="335.117057" height="12.794159" fill="var(--primary-fill)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="638.996656" y="183.933798" text-anchor="middle" font-size="21.719984" font-weight="bold" fill="var(--bg)">NS: myns1</text>
  <text x="638.996656" y="263.897063" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">veth1, lo</text>
  <text x="638.996656" y="315.073436" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">own routes</text>
  <text x="638.996656" y="366.249942" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">own firewall</text>
  <text x="638.996656" y="417.426448" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">own sockets</text>
  <rect x="860.735679" y="146.617555" width="335.117057" height="400.882296" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.140973" filter="url(#shadow)" />
  <rect x="860.735679" y="146.617555" width="335.117057" height="55.441181" fill="var(--primary-fill)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="860.735679" y="189.264576" width="335.117057" height="12.794159" fill="var(--primary-fill)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1028.294314" y="183.933798" text-anchor="middle" font-size="21.719984" font-weight="bold" fill="var(--bg)">NS: myns2</text>
  <text x="1028.294314" y="263.897063" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">veth3, lo</text>
  <text x="1028.294314" y="315.073436" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">own routes</text>
  <text x="1028.294314" y="366.249942" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">own firewall</text>
  <text x="1028.294314" y="417.426448" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)">own sockets</text>
  <text x="640" y="534.705692" text-anchor="middle" font-size="18.617112" fill="var(--info-accent)">Each namespace has a fully isolated network stack</text>
</svg>
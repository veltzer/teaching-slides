<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="641.081138849411" y="40" text-anchor="middle" font-size="29.607699209932" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Linux Kernel</text>
  <rect x="40" y="90.679611060797" width="361.08111579139" height="529.320388939203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.517504763888" filter="url(#shadow)"/>
  <rect x="40" y="90.679611060797" width="361.08111579139" height="73.203899955135" fill="url(#grad-primary)" rx="8.517504763888" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="146.990248791774" width="361.08111579139" height="16.893260903769" fill="url(#grad-primary)" rx="8.517504763888" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.540558434434" y="139.95155061911" text-anchor="middle" font-size="25.906843113898" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">NS: default</text>
  <text x="220.540558434434" y="245.534129228789" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">eth0, lo</text>
  <text x="220.540558434434" y="313.10682558168" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">routing table</text>
  <text x="220.540558434434" y="380.679697546247" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">iptables rules</text>
  <text x="220.540558434434" y="448.252569510813" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">sockets, ports</text>
  <rect x="459.459499749355" y="90.679611060797" width="361.08111579139" height="529.320388939203" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.517504763888" filter="url(#shadow)"/>
  <rect x="459.459499749355" y="90.679611060797" width="361.08111579139" height="73.203899955135" fill="url(#grad-primary)" rx="8.517504763888" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="459.459499749355" y="146.990248791774" width="361.08111579139" height="16.893260903769" fill="url(#grad-primary)" rx="8.517504763888" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000058183789" y="139.95155061911" text-anchor="middle" font-size="25.906843113898" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">NS: myns1</text>
  <text x="640.000058183789" y="245.534129228789" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">veth1, lo</text>
  <text x="640.000058183789" y="313.10682558168" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">own routes</text>
  <text x="640.000058183789" y="380.679697546247" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">own firewall</text>
  <text x="640.000058183789" y="448.252569510813" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">own sockets</text>
  <rect x="878.91888420861" y="90.679611060797" width="361.08111579139" height="529.320388939203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.517504763888" filter="url(#shadow)"/>
  <rect x="878.91888420861" y="90.679611060797" width="361.08111579139" height="73.203899955135" fill="url(#grad-primary)" rx="8.517504763888" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="878.91888420861" y="146.990248791774" width="361.08111579139" height="16.893260903769" fill="url(#grad-primary)" rx="8.517504763888" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1059.459556855667" y="139.95155061911" text-anchor="middle" font-size="25.906843113898" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">NS: myns2</text>
  <text x="1059.459556855667" y="245.534129228789" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">veth3, lo</text>
  <text x="1059.459556855667" y="313.10682558168" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">own routes</text>
  <text x="1059.459556855667" y="380.679697546247" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">own firewall</text>
  <text x="1059.459556855667" y="448.252569510813" text-anchor="middle" font-size="22.205845078793" fill="var(--text-muted)" font-family="Arial, sans-serif">own sockets</text>
  <text x="641.081138849411" y="603.106739096231" text-anchor="middle" font-size="22.205845078793" fill="var(--info-accent)" font-family="Arial, sans-serif">Each namespace has a fully isolated network stack</text>
</svg>

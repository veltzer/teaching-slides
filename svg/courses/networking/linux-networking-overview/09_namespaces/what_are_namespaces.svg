<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.140973" fill-opacity="0.2" filter="url(#shadow)"/>
  <text x="640" y="108.235208" text-anchor="middle" font-size="24.822737" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Linux Kernel</text>
  <rect x="82.140468" y="146.617555" width="335.117057" height="400.882296" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.140973" filter="url(#shadow)"/>
  <rect x="82.140468" y="146.617555" width="335.117057" height="55.441181" fill="url(#grad-primary)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="82.140468" y="189.264576" width="335.117057" height="12.794159" fill="url(#grad-primary)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="249.698997" y="183.933798" text-anchor="middle" font-size="21.719984" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">NS: default</text>
  <text x="249.698997" y="263.897063" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">eth0, lo</text>
  <text x="249.698997" y="315.073436" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">routing table</text>
  <text x="249.698997" y="366.249942" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">iptables rules</text>
  <text x="249.698997" y="417.426448" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">sockets, ports</text>
  <rect x="471.438127" y="146.617555" width="335.117057" height="400.882296" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.140973" filter="url(#shadow)"/>
  <rect x="471.438127" y="146.617555" width="335.117057" height="55.441181" fill="url(#grad-primary)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="471.438127" y="189.264576" width="335.117057" height="12.794159" fill="url(#grad-primary)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="638.996656" y="183.933798" text-anchor="middle" font-size="21.719984" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">NS: myns1</text>
  <text x="638.996656" y="263.897063" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">veth1, lo</text>
  <text x="638.996656" y="315.073436" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">own routes</text>
  <text x="638.996656" y="366.249942" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">own firewall</text>
  <text x="638.996656" y="417.426448" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">own sockets</text>
  <rect x="860.735679" y="146.617555" width="335.117057" height="400.882296" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.140973" filter="url(#shadow)"/>
  <rect x="860.735679" y="146.617555" width="335.117057" height="55.441181" fill="url(#grad-primary)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="860.735679" y="189.264576" width="335.117057" height="12.794159" fill="url(#grad-primary)" rx="7.140973" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.294314" y="183.933798" text-anchor="middle" font-size="21.719984" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">NS: myns2</text>
  <text x="1028.294314" y="263.897063" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">veth3, lo</text>
  <text x="1028.294314" y="315.073436" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">own routes</text>
  <text x="1028.294314" y="366.249942" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">own firewall</text>
  <text x="1028.294314" y="417.426448" text-anchor="middle" font-size="18.617112" fill="var(--text-muted)" font-family="Arial, sans-serif">own sockets</text>
  <text x="640" y="534.705692" text-anchor="middle" font-size="18.617112" fill="var(--info-accent)" font-family="Arial, sans-serif">Each namespace has a fully isolated network stack</text>
</svg>

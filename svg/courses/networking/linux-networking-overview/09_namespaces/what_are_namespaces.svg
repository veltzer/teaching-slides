<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Linux Namespace Isolation</text>
  <rect x="42.6667" y="108" width="1194.6667" height="576" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="4.2667" rx="10.6667" fill-opacity="0.3" />
  <text x="640" y="180" text-anchor="middle" font-size="25.6" font-weight="bold" fill="#7b1fa2">Linux Kernel</text>
  <rect x="85.3333" y="216" width="330.6667" height="396" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="249.6" y="288" text-anchor="middle" font-size="23.4667" font-weight="bold">NS: default</text>
  <text x="249.6" y="349.2" text-anchor="middle" font-size="21.3333" fill="#666">eth0, lo</text>
  <text x="249.6" y="403.2" text-anchor="middle" font-size="21.3333" fill="#666">routing table</text>
  <text x="249.6" y="457.2" text-anchor="middle" font-size="21.3333" fill="#666">iptables rules</text>
  <text x="249.6" y="511.2" text-anchor="middle" font-size="21.3333" fill="#666">sockets, ports</text>
  <rect x="473.6" y="216" width="330.6667" height="396" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="288" text-anchor="middle" font-size="23.4667" font-weight="bold">NS: myns1</text>
  <text x="640" y="349.2" text-anchor="middle" font-size="21.3333" fill="#666">veth1, lo</text>
  <text x="640" y="403.2" text-anchor="middle" font-size="21.3333" fill="#666">own routes</text>
  <text x="640" y="457.2" text-anchor="middle" font-size="21.3333" fill="#666">own firewall</text>
  <text x="640" y="511.2" text-anchor="middle" font-size="21.3333" fill="#666">own sockets</text>
  <rect x="864" y="216" width="330.6667" height="396" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1028.2667" y="288" text-anchor="middle" font-size="23.4667" font-weight="bold">NS: myns2</text>
  <text x="1028.2667" y="349.2" text-anchor="middle" font-size="21.3333" fill="#666">veth3, lo</text>
  <text x="1028.2667" y="403.2" text-anchor="middle" font-size="21.3333" fill="#666">own routes</text>
  <text x="1028.2667" y="457.2" text-anchor="middle" font-size="21.3333" fill="#666">own firewall</text>
  <text x="1028.2667" y="511.2" text-anchor="middle" font-size="21.3333" fill="#666">own sockets</text>
  <text x="640" y="576" text-anchor="middle" font-size="21.3333" fill="#7b1fa2">Each namespace has a fully isolated network stack</text>
</svg>
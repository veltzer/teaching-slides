<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-size="26.635505811928" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Host (default namespace)</text>
  <rect x="40" y="78.032853410198" width="302.158273419983" height="298.82910361156" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.35903475714" filter="url(#shadow)"/>
  <rect x="40" y="78.032853410198" width="302.158273419983" height="67.915544186414" fill="url(#grad-primary)" rx="8.35903475714" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="129.648747382292" width="302.158273419983" height="16.299818336046" fill="url(#grad-primary)" rx="8.35903475714" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="191.079137247762" y="124.215700049282" text-anchor="middle" font-size="23.003365215491" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Container A</text>
  <text x="191.079137247762" y="230.164097645894" text-anchor="middle" font-size="20.582031749101" fill="var(--text-muted)" font-family="Arial, sans-serif">net ns: ctn_a</text>
  <text x="191.079137247762" y="289.929816725148" text-anchor="middle" font-size="20.582031749101" fill="var(--text-muted)" font-family="Arial, sans-serif">eth0 (veth pair)</text>
  <rect x="937.841726580017" y="78.032853410198" width="302.158273419983" height="298.82910361156" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.35903475714" filter="url(#shadow)"/>
  <rect x="937.841726580017" y="78.032853410198" width="302.158273419983" height="67.915544186414" fill="url(#grad-primary)" rx="8.35903475714" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="937.841726580017" y="129.648747382292" width="302.158273419983" height="16.299818336046" fill="url(#grad-primary)" rx="8.35903475714" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1088.920862752238" y="124.215700049282" text-anchor="middle" font-size="23.003365215491" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Container B</text>
  <text x="1088.920862752238" y="230.164097645894" text-anchor="middle" font-size="20.582031749101" fill="var(--text-muted)" font-family="Arial, sans-serif">net ns: ctn_b</text>
  <text x="1088.920862752238" y="289.929816725148" text-anchor="middle" font-size="20.582031749101" fill="var(--text-muted)" font-family="Arial, sans-serif">eth0 (veth pair)</text>
  <rect x="432.805755983748" y="78.032853410198" width="414.388489108043" height="183.372323898987" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.35903475714" filter="url(#shadow)"/>
  <text x="640" y="156.815167316276" text-anchor="middle" font-size="25.424838491299" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Linux Bridge (br0)</text>
  <text x="640" y="224.730712786063" text-anchor="middle" font-size="20.582031749101" fill="var(--text-muted)" font-family="Arial, sans-serif">L2 switching</text>
  <line x1="342.158273419984" y1="192.131244235696" x2="432.805755983748" y2="167.68160079249" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="847.194244016252" y1="167.68160079249" x2="937.841726580017" y2="192.131244235696" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="512.661870372056" y="436.627676101013" width="254.676259255887" height="183.372323898987" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="8.35903475714" filter="url(#shadow)"/>
  <text x="640" y="518.126430254419" text-anchor="middle" font-size="23.003365215491" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">eth0 (host NIC)</text>
  <text x="640" y="583.325535476877" text-anchor="middle" font-size="20.582031749101" fill="var(--text-muted)" font-family="Arial, sans-serif">NAT / routing</text>
  <line x1="640" y1="261.405177309186" x2="640" y2="436.627676101013" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
</svg>

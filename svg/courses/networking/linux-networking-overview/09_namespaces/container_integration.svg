<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="580" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.114865" fill-opacity="0.15" filter="url(#shadow)"/>
  <text x="640" y="101.386707" text-anchor="middle" font-size="22.671042" font-weight="bold" fill="var(--info-accent)">Host (default namespace)</text>
  <rect x="82.140468" y="131.021805" width="280.936455" height="232.846841" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.114865" filter="url(#shadow)" />
  <rect x="82.140468" y="131.021805" width="280.936455" height="52.919611" fill="var(--primary-fill)" rx="7.114865" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="82.140468" y="171.240772" width="280.936455" height="12.700775" fill="var(--primary-fill)" rx="7.114865" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.608696" y="167.007356" text-anchor="middle" font-size="19.579514" font-weight="bold" fill="var(--bg)">Container A</text>
  <text x="222.608696" y="249.562065" text-anchor="middle" font-size="17.518575" fill="var(--text-muted)">net ns: ctn_a</text>
  <text x="222.608696" y="296.131354" text-anchor="middle" font-size="17.518575" fill="var(--text-muted)">eth0 (veth pair)</text>
  <rect x="916.923077" y="131.021805" width="280.936455" height="232.846841" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.114865" filter="url(#shadow)" />
  <rect x="916.923077" y="131.021805" width="280.936455" height="52.919611" fill="var(--primary-fill)" rx="7.114865" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="916.923077" y="171.240772" width="280.936455" height="12.700775" fill="var(--primary-fill)" rx="7.114865" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.391304" y="167.007356" text-anchor="middle" font-size="19.579514" font-weight="bold" fill="var(--bg)">Container B</text>
  <text x="1057.391304" y="249.562065" text-anchor="middle" font-size="17.518575" fill="var(--text-muted)">net ns: ctn_b</text>
  <text x="1057.391304" y="296.131354" text-anchor="middle" font-size="17.518575" fill="var(--text-muted)">eth0 (veth pair)</text>
  <rect x="447.35786" y="131.021805" width="385.284281" height="142.883226" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.114865" filter="url(#shadow)" />
  <text x="640" y="192.408774" text-anchor="middle" font-size="21.640572" font-weight="bold" fill="var(--warn-accent)">Linux Bridge (br0)</text>
  <text x="640" y="245.328386" text-anchor="middle" font-size="17.518575" fill="var(--text-muted)">L2 switching</text>
  <line x1="363.076923" y1="219.926967" x2="447.35786" y2="200.87587" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="832.64214" y1="200.87587" x2="916.923077" y2="219.926967" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="521.605351" y="410.437935" width="236.789298" height="142.883226" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.114865" filter="url(#shadow)" />
  <text x="640" y="473.941547" text-anchor="middle" font-size="19.579514" font-weight="bold" fill="var(--danger-accent)">eth0 (host NIC)</text>
  <text x="640" y="524.744516" text-anchor="middle" font-size="17.518575" fill="var(--text-muted)">NAT / routing</text>
  <line x1="640" y1="273.905031" x2="640" y2="410.437935" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="37.3333" y="88.8889" width="1063.1111" height="487.1111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" fill-opacity="0.15" />
  <text x="568.8889" y="140.4444" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--info-accent)">Host (default namespace)</text>
  <rect x="74.6667" y="165.3333" width="248.8889" height="195.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="74.6667" y="165.3333" width="248.8889" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="74.6667" y="199.1111" width="248.8889" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="199.1111" y="195.5556" text-anchor="middle" font-size="16.8889" font-weight="bold" fill="var(--bg)">Container A</text>
  <text x="199.1111" y="264.8889" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">net ns: ctn_a</text>
  <text x="199.1111" y="304" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">eth0 (veth pair)</text>
  <rect x="814.2222" y="165.3333" width="248.8889" height="195.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="814.2222" y="165.3333" width="248.8889" height="44.4444" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="814.2222" y="199.1111" width="248.8889" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="938.6667" y="195.5556" text-anchor="middle" font-size="16.8889" font-weight="bold" fill="var(--bg)">Container B</text>
  <text x="938.6667" y="264.8889" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">net ns: ctn_b</text>
  <text x="938.6667" y="304" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">eth0 (veth pair)</text>
  <rect x="398.2222" y="165.3333" width="341.3333" height="120" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="568.8889" y="216.8889" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--warn-accent)">Linux Bridge (br0)</text>
  <text x="568.8889" y="261.3333" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">L2 switching</text>
  <line x1="323.5556" y1="240" x2="398.2222" y2="224" stroke="var(--text-muted)" stroke-width="2" />
  <line x1="739.5556" y1="224" x2="814.2222" y2="240" stroke="var(--text-muted)" stroke-width="2" />
  <rect x="464" y="400" width="209.7778" height="120" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="568.8889" y="453.3333" text-anchor="middle" font-size="16.8889" font-weight="bold" fill="var(--danger-accent)">eth0 (host NIC)</text>
  <text x="568.8889" y="496" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">NAT / routing</text>
  <line x1="568.8889" y1="285.3333" x2="568.8889" y2="400" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
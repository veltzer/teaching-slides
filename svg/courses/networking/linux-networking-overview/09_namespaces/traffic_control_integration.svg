<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="136.6667" width="243.75" height="149.0277" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="218.125" y="193.0556" text-anchor="middle" font-size="18.2496" font-weight="bold" fill="var(--primary-accent)">Process</text>
  <text x="218.125" y="238.1667" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">cgroup: mygroup</text>
  <rect x="405.625" y="136.6667" width="243.75" height="149.0277" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="527.5" y="193.0556" text-anchor="middle" font-size="18.2496" font-weight="bold" fill="var(--info-accent)">net_cls</text>
  <text x="527.5" y="238.1667" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">classid 0x100001</text>
  <rect x="715" y="136.6667" width="243.75" height="149.0277" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="836.875" y="193.0556" text-anchor="middle" font-size="18.2496" font-weight="bold" fill="var(--warn-accent)">tc (qdisc)</text>
  <text x="836.875" y="238.1667" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Filter by classid</text>
  <rect x="1024.3749" y="136.6667" width="164.0625" height="149.0277" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1105.9375" y="193.0556" text-anchor="middle" font-size="18.2496" font-weight="bold" fill="var(--ok-accent)">eth0</text>
  <text x="1105.9375" y="238.1667" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Shaped</text>
  <line x1="339.9999" y1="210.7777" x2="405.625" y2="210.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="649.375" y1="210.7777" x2="715" y2="210.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="958.75" y1="210.7777" x2="1024.3749" y2="210.7777" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="96.25" y="352.5556" width="1089.375" height="149.0277" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" stroke-dasharray="8.8889 5.3333" filter="url(#shadow)" />
  <text x="640" y="412.1667" text-anchor="middle" font-size="18.2496" fill="var(--text)" font-weight="bold">net_prio: Set per-interface priority for cgroup processes</text>
  <text x="640" y="465.3333" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">echo "eth0 5" &gt; /sys/fs/cgroup/net_prio/mygroup/net_prio.ifpriomap</text>
</svg>
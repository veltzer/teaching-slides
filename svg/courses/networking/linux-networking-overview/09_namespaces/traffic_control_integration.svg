<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Four pipeline boxes -->
  <rect x="60" y="120" width="260" height="185" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="190" y="190" text-anchor="middle" font-size="21" font-weight="bold" fill="#0d47a1">Process</text>
  <text x="190" y="246" text-anchor="middle" font-size="17" fill="#777777">cgroup: mygroup</text>
  <rect x="390" y="120" width="260" height="185" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="520" y="190" text-anchor="middle" font-size="21" font-weight="bold" fill="#4a148c">net_cls</text>
  <text x="520" y="246" text-anchor="middle" font-size="17" fill="#777777">classid 0x100001</text>
  <rect x="720" y="120" width="260" height="185" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="850" y="190" text-anchor="middle" font-size="21" font-weight="bold" fill="#e65100">tc (qdisc)</text>
  <text x="850" y="246" text-anchor="middle" font-size="17" fill="#777777">Filter by classid</text>
  <rect x="1050" y="120" width="175" height="185" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="1137" y="190" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b5e20">eth0</text>
  <text x="1137" y="246" text-anchor="middle" font-size="17" fill="#777777">Shaped</text>
  <!-- Arrows -->
  <line x1="320" y1="212" x2="390" y2="212" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="650" y1="212" x2="720" y2="212" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="980" y1="212" x2="1050" y2="212" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Info box -->
  <rect x="60" y="388" width="1162" height="185" fill="#ffebee" stroke="#c62828" stroke-width="1.5" rx="10" stroke-dasharray="10,6" filter="url(#shadow)"/>
  <text x="640" y="462" text-anchor="middle" font-size="21" fill="#333333" font-weight="bold">net_prio: Set per-interface priority for cgroup processes</text>
  <text x="640" y="528" text-anchor="middle" font-size="16" fill="#777777">echo "eth0 5" &gt; /sys/fs/cgroup/net_prio/mygroup/net_prio.ifpriomap</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="267.811183" height="236.865262" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.928855" filter="url(#shadow)"/>
  <text x="173.905592" y="129.624758" text-anchor="middle" font-size="24.116406" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Process</text>
  <text x="173.905592" y="201.324533" text-anchor="middle" font-size="19.522823" fill="var(--text-muted)" font-family="Arial, sans-serif">cgroup: mygroup</text>
  <rect x="379.914194" y="40" width="267.811183" height="236.865262" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.928855" filter="url(#shadow)"/>
  <text x="513.819786" y="129.624758" text-anchor="middle" font-size="24.116406" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">net_cls</text>
  <text x="513.819786" y="201.324533" text-anchor="middle" font-size="19.522823" fill="var(--text-muted)" font-family="Arial, sans-serif">classid 0x100001</text>
  <rect x="719.828388" y="40" width="267.811183" height="236.865262" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.928855" filter="url(#shadow)"/>
  <text x="853.73398" y="129.624758" text-anchor="middle" font-size="24.116406" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">tc (qdisc)</text>
  <text x="853.73398" y="201.324533" text-anchor="middle" font-size="19.522823" fill="var(--text-muted)" font-family="Arial, sans-serif">Filter by classid</text>
  <rect x="1059.742473" y="40" width="180.257527" height="236.865262" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.928855" filter="url(#shadow)"/>
  <text x="1149.356325" y="129.624758" text-anchor="middle" font-size="24.116406" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">eth0</text>
  <text x="1149.356325" y="201.324533" text-anchor="middle" font-size="19.522823" fill="var(--text-muted)" font-family="Arial, sans-serif">Shaped</text>
  <line x1="307.811073" y1="157.792339" x2="379.914194" y2="157.792339" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="647.725378" y1="157.792339" x2="719.828388" y2="157.792339" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="987.639572" y1="157.792339" x2="1059.742473" y2="157.792339" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="383.134738" width="1196.909981" height="236.865262" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.928855" stroke-dasharray="8.8889 5.3333" filter="url(#shadow)"/>
  <text x="637.424947" y="477.880875" text-anchor="middle" font-size="24.116406" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">net_prio: Set per-interface priority for cgroup processes</text>
  <text x="637.424947" y="562.384095" text-anchor="middle" font-size="18.374329" fill="var(--text-muted)" font-family="Arial, sans-serif">echo "eth0 5" &gt; /sys/fs/cgroup/net_prio/mygroup/net_prio.ifpriomap</text>
</svg>

  <text x="192" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">Process</text>
  <text x="192" y="259.2" text-anchor="middle" font-size="21.3333" fill="#666">cgroup: mygroup</text>
  <rect x="394.6667" y="126" width="256" height="198" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="522.6667" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">net_cls</text>
  <text x="522.6667" y="259.2" text-anchor="middle" font-size="21.3333" fill="#666">classid 0x100001</text>
  <rect x="725.3333" y="126" width="256" height="198" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="853.3333" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">tc (qdisc)</text>

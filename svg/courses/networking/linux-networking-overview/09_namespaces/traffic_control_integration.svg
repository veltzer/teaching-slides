  <text x="1141.3333" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">eth0</text>
  <text x="1141.3333" y="259.2" text-anchor="middle" font-size="21.3333" fill="#666">Shaped</text>
  <line x1="320" y1="223.2" x2="394.6667" y2="223.2" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd2_08_namespaces)" />

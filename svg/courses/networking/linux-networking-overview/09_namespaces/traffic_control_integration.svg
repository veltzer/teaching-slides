  <text x="640" y="475.2" text-anchor="middle" font-size="23.4667" fill="#333" font-weight="bold">net_prio: Set per-interface priority for cgroup processes</text>
  <text x="640" y="540" text-anchor="middle" font-size="21.3333" fill="#666">echo "eth0 5" &gt; /sys/fs/cgroup/net_prio/mygroup/net_prio.ifpriomap</text>

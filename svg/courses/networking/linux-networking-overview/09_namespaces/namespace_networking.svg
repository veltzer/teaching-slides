<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Veth Pair Connecting Namespaces</text>
  <rect x="64" y="126" width="426.6667" height="432" fill="#e3f2fd" stroke="#1565c0" stroke-width="4.2667" rx="10.6667" />
  <text x="277.3333" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">Default Namespace</text>
  <rect x="128" y="234" width="298.6667" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="277.3333" y="313.2" text-anchor="middle" font-size="23.4667">veth0 (10.0.0.1)</text>
  <text x="277.3333" y="468" text-anchor="middle" font-size="21.3333" fill="#666">ip addr add 10.0.0.1/24</text>
  <rect x="789.3333" y="126" width="426.6667" height="432" fill="#e8f5e9" stroke="#2e7d32" stroke-width="4.2667" rx="10.6667" />
  <text x="1002.6667" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">Namespace: myns</text>
  <rect x="853.3333" y="234" width="298.6667" height="126" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1002.6667" y="313.2" text-anchor="middle" font-size="23.4667">veth1 (10.0.0.2)</text>
  <text x="1002.6667" y="468" text-anchor="middle" font-size="21.3333" fill="#666">ip netns exec myns</text>
  <line x1="426.6667" y1="295.2" x2="853.3333" y2="295.2" stroke="#c62828" stroke-width="6.4" stroke-dasharray="17.0667 8.5333" />
  <text x="640" y="277.2" text-anchor="middle" font-size="21.3333" fill="#c62828" font-weight="bold">veth pair link</text>
  <text x="640" y="648" text-anchor="middle" font-size="21.3333" fill="#666">ip link add veth0 type veth peer name veth1 | ip link set veth1 netns myns</text>
</svg>
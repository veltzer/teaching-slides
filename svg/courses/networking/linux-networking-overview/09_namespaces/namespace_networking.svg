<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="444.827586" height="481.376459" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.609043" filter="url(#shadow)"/>
  <rect x="40" y="40" width="444.827586" height="63.400817" fill="url(#grad-primary)" rx="7.609043" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="89.311698" width="444.827586" height="14.089119" fill="url(#grad-primary)" rx="7.609043" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="262.413683" y="83.441365" text-anchor="middle" font-size="23.143665" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Default Namespace</text>
  <rect x="102.068966" y="159.757001" width="320.689655" height="138.54259" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.609043" filter="url(#shadow)"/>
  <text x="262.413683" y="239.595099" text-anchor="middle" font-size="22.041622" fill="var(--warn-accent)" font-family="Arial, sans-serif">veth0 (10.0.0.1)</text>
  <text x="262.413683" y="413.360268" text-anchor="middle" font-size="17.633196" fill="var(--text-muted)" font-family="Arial, sans-serif">ip addr add 10.0.0.1/24</text>
  <rect x="795.172414" y="40" width="444.827586" height="481.376459" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.609043" filter="url(#shadow)"/>
  <rect x="795.172414" y="40" width="444.827586" height="63.400817" fill="url(#grad-primary)" rx="7.609043" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="795.172414" y="89.311698" width="444.827586" height="14.089119" fill="url(#grad-primary)" rx="7.609043" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1017.586097" y="83.441365" text-anchor="middle" font-size="23.143665" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Namespace: myns</text>
  <rect x="857.241379" y="159.757001" width="320.689655" height="138.54259" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.609043" filter="url(#shadow)"/>
  <text x="1017.586097" y="239.595099" text-anchor="middle" font-size="22.041622" fill="var(--warn-accent)" font-family="Arial, sans-serif">veth1 (10.0.0.2)</text>
  <text x="1017.586097" y="413.360268" text-anchor="middle" font-size="17.633196" fill="var(--text-muted)" font-family="Arial, sans-serif">ip netns exec myns</text>
  <line x1="422.758621" y1="227.854288" x2="795.172414" y2="227.854288" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="14.2222 7.1111" />
  <text x="608.965517" y="202.024212" text-anchor="middle" font-size="20.939452" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">veth pair link</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.633196" fill="var(--text-muted)" font-family="Arial, sans-serif">ip link add veth0 type veth peer name veth1 | ip link set veth1 netns myns</text>
</svg>
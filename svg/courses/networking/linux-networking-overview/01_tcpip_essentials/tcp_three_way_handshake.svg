<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Client box -->
  <rect x="160" y="30" width="200" height="100" fill="url(#grad-accent)" stroke="#1565c0" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="260" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Client</text>
  <!-- Server box -->
  <rect x="920" y="30" width="200" height="100" fill="url(#grad-accent)" stroke="#1565c0" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="1020" y="90" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffffff">Server</text>
  <!-- Lifelines -->
  <line x1="260" y1="130" x2="260" y2="660" stroke="#888888" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="1020" y1="130" x2="1020" y2="660" stroke="#888888" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- SYN -->
  <line x1="260" y1="230" x2="1020" y2="300" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="640" y="218" text-anchor="middle" font-size="21" fill="#1565c0">SYN (seq=x)</text>
  <!-- SYN-ACK -->
  <line x1="1020" y1="380" x2="260" y2="450" stroke="#7b1fa2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="368" text-anchor="middle" font-size="21" fill="#7b1fa2">SYN-ACK (seq=y, ack=x+1)</text>
  <!-- ACK -->
  <line x1="260" y1="530" x2="1020" y2="600" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="518" text-anchor="middle" font-size="21" fill="#2e7d32">ACK (ack=y+1)</text>
  <!-- Connection established label -->
  <text x="640" y="660" text-anchor="middle" font-size="20" fill="#777777">Connection Established</text>
</svg>

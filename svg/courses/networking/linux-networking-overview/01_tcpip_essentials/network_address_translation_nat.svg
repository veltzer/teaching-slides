<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Private LAN -->
  <rect x="42" y="160" width="260" height="360" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="42" y="160" width="260" height="54" fill="url(#grad-accent)" rx="10"/>
  <rect x="42" y="202" width="260" height="12" fill="url(#grad-accent)"/>
  <text x="172" y="197" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Private LAN</text>
  <text x="172" y="280" text-anchor="middle" font-size="18" fill="#333333">192.168.1.10</text>
  <text x="172" y="330" text-anchor="middle" font-size="18" fill="#333333">192.168.1.11</text>
  <text x="172" y="380" text-anchor="middle" font-size="18" fill="#333333">192.168.1.12</text>
  <!-- NAT Router -->
  <rect x="466" y="190" width="300" height="300" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="466" y="190" width="300" height="54" fill="url(#grad-surface)" rx="10"/>
  <text x="616" y="228" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">NAT Router</text>
  <text x="616" y="300" text-anchor="middle" font-size="18" fill="#555555">192.168.1.1 (int)</text>
  <text x="616" y="346" text-anchor="middle" font-size="18" fill="#555555">203.0.113.5 (ext)</text>
  <!-- Internet -->
  <rect x="934" y="210" width="280" height="260" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="934" y="210" width="280" height="54" fill="url(#grad-accent)" rx="10"/>
  <rect x="934" y="252" width="280" height="12" fill="url(#grad-accent)"/>
  <text x="1074" y="247" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Internet</text>
  <text x="1074" y="330" text-anchor="middle" font-size="18" fill="#333333">Public Servers</text>
  <!-- Arrows -->
  <line x1="302" y1="340" x2="466" y2="340" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="384" y="325" text-anchor="middle" font-size="16" fill="#1565c0">Private IP</text>
  <line x1="766" y1="340" x2="934" y2="340" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="850" y="325" text-anchor="middle" font-size="16" fill="#1565c0">Public IP</text>
  <!-- Labels bottom -->
  <text x="640" y="570" text-anchor="middle" font-size="18" fill="#555555">src: 192.168.1.10 --&gt; src: 203.0.113.5</text>
  <text x="640" y="618" text-anchor="middle" font-size="18" fill="#555555">Translation table maps internal:port to external:port</text>
</svg>

  </defs>
  <text x="300" y="18" text-anchor="middle" font-size="12" font-weight="bold">Network Address Translation</text>
  <rect x="20" y="50" width="120" height="100" fill="#e3f2fd" stroke="#333" stroke-width="1" rx="5"/>

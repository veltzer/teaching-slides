<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="266.211604" height="455.895251" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.861872" filter="url(#shadow)" />
  <rect x="40" y="40" width="266.211604" height="68.384288" fill="var(--primary-fill)" rx="7.861872" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="93.187884" width="266.211604" height="15.196561" fill="var(--primary-fill)" rx="7.861872" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="173.105802" y="86.855814" text-anchor="middle" font-size="22.774009" font-weight="bold" fill="var(--bg)">Private LAN</text>
  <text x="173.105802" y="191.965136" text-anchor="middle" font-size="20.496555" fill="var(--text)">192.168.1.10</text>
  <text x="173.105802" y="255.283799" text-anchor="middle" font-size="20.496555" fill="var(--text)">192.168.1.11</text>
  <text x="173.105802" y="318.602619" text-anchor="middle" font-size="20.496555" fill="var(--text)">192.168.1.12</text>
  <rect x="474.129693" y="77.991323" width="307.167235" height="379.912762" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.861872" filter="url(#shadow)" />
  <rect x="474.129693" y="77.991323" width="307.167235" height="68.384288" fill="var(--surface)" rx="7.861872" />
  <text x="627.713311" y="126.113582" text-anchor="middle" font-size="25.051331" font-weight="bold" fill="var(--warn-accent)">NAT Router</text>
  <text x="627.713311" y="217.292633" text-anchor="middle" font-size="20.496555" fill="var(--text-muted)">192.168.1.1 (int)</text>
  <text x="627.713311" y="275.545985" text-anchor="middle" font-size="20.496555" fill="var(--text-muted)">203.0.113.5 (ext)</text>
  <rect x="953.31058" y="103.31882" width="286.68942" height="329.257612" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.861872" filter="url(#shadow)" />
  <rect x="953.31058" y="103.31882" width="286.68942" height="68.384288" fill="var(--primary-fill)" rx="7.861872" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="953.31058" y="156.506547" width="286.68942" height="15.196561" fill="var(--primary-fill)" rx="7.861872" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1096.65529" y="150.174791" text-anchor="middle" font-size="25.051331" font-weight="bold" fill="var(--bg)">Internet</text>
  <text x="1096.65529" y="255.283799" text-anchor="middle" font-size="20.496555" fill="var(--text)">Public Servers</text>
  <line x1="306.211495" y1="267.947626" x2="474.129693" y2="267.947626" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="390.170648" y="248.952043" text-anchor="middle" font-size="18.219102" fill="var(--primary-accent)">Private IP</text>
  <line x1="781.296928" y1="267.947626" x2="953.31058" y2="267.947626" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="867.303754" y="248.952043" text-anchor="middle" font-size="18.219102" fill="var(--primary-accent)">Public IP</text>
  <text x="652.286689" y="559.214071" text-anchor="middle" font-size="20.496555" fill="var(--text-muted)">src: 192.168.1.10 --&gt; src: 203.0.113.5</text>
  <text x="652.286689" y="620" text-anchor="middle" font-size="20.496555" fill="var(--text-muted)">Translation table maps internal:port to external:port</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="266.211604" height="455.895251" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.861872" filter="url(#shadow)"/>
  <rect x="40" y="40" width="266.211604" height="68.384288" fill="url(#grad-primary)" rx="7.861872" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="93.187884" width="266.211604" height="15.196561" fill="url(#grad-primary)" rx="7.861872" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="173.105802" y="86.855814" text-anchor="middle" font-size="22.774009" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Private LAN</text>
  <text x="173.105802" y="191.965136" text-anchor="middle" font-size="20.496555" fill="var(--text)" font-family="Arial, sans-serif">192.168.1.10</text>
  <text x="173.105802" y="255.283799" text-anchor="middle" font-size="20.496555" fill="var(--text)" font-family="Arial, sans-serif">192.168.1.11</text>
  <text x="173.105802" y="318.602619" text-anchor="middle" font-size="20.496555" fill="var(--text)" font-family="Arial, sans-serif">192.168.1.12</text>
  <rect x="474.129693" y="77.991323" width="307.167235" height="379.912762" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.861872" filter="url(#shadow)"/>
  <rect x="474.129693" y="77.991323" width="307.167235" height="68.384288" fill="var(--surface)" rx="7.861872"/>
  <text x="627.713311" y="126.113582" text-anchor="middle" font-size="25.051331" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">NAT Router</text>
  <text x="627.713311" y="217.292633" text-anchor="middle" font-size="20.496555" fill="var(--text-muted)" font-family="Arial, sans-serif">192.168.1.1 (int)</text>
  <text x="627.713311" y="275.545985" text-anchor="middle" font-size="20.496555" fill="var(--text-muted)" font-family="Arial, sans-serif">203.0.113.5 (ext)</text>
  <rect x="953.31058" y="103.31882" width="286.68942" height="329.257612" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.861872" filter="url(#shadow)"/>
  <rect x="953.31058" y="103.31882" width="286.68942" height="68.384288" fill="url(#grad-primary)" rx="7.861872" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="953.31058" y="156.506547" width="286.68942" height="15.196561" fill="url(#grad-primary)" rx="7.861872" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1096.65529" y="150.174791" text-anchor="middle" font-size="25.051331" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Internet</text>
  <text x="1096.65529" y="255.283799" text-anchor="middle" font-size="20.496555" fill="var(--text)" font-family="Arial, sans-serif">Public Servers</text>
  <line x1="306.211495" y1="267.947626" x2="474.129693" y2="267.947626" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="390.170648" y="248.952043" text-anchor="middle" font-size="18.219102" fill="var(--primary-accent)" font-family="Arial, sans-serif">Private IP</text>
  <line x1="781.296928" y1="267.947626" x2="953.31058" y2="267.947626" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="867.303754" y="248.952043" text-anchor="middle" font-size="18.219102" fill="var(--primary-accent)" font-family="Arial, sans-serif">Public IP</text>
  <text x="652.286689" y="559.214071" text-anchor="middle" font-size="20.496555" fill="var(--text-muted)" font-family="Arial, sans-serif">src: 192.168.1.10 --&gt; src: 203.0.113.5</text>
  <text x="652.286689" y="620" text-anchor="middle" font-size="20.496555" fill="var(--text-muted)" font-family="Arial, sans-serif">Translation table maps internal:port to external:port</text>
</svg>

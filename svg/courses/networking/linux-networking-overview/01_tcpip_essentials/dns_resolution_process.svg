<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="120.5556" width="150" height="88.6111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="133.75" y="170.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--bg)">Client</text>
  <rect x="265" y="120.5556" width="164.0625" height="88.6111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="346.5625" y="162.4444" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)">Local</text>
  <text x="346.5625" y="183.3889" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)">Resolver</text>
  <rect x="485.3125" y="120.5556" width="164.0625" height="88.6111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="566.875" y="162.4444" text-anchor="middle" font-size="15.6425" fill="var(--warn-accent)">Root</text>
  <text x="566.875" y="183.3889" text-anchor="middle" font-size="15.6425" fill="var(--warn-accent)">DNS</text>
  <rect x="705.625" y="120.5556" width="164.0625" height="88.6111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="787.1874" y="162.4444" text-anchor="middle" font-size="15.6425" fill="var(--ok-accent)">TLD</text>
  <text x="787.1874" y="183.3889" text-anchor="middle" font-size="15.6425" fill="var(--ok-accent)">DNS</text>
  <rect x="925.9375" y="120.5556" width="290.625" height="88.6111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1071.25" y="162.4444" text-anchor="middle" font-size="15.6425" fill="var(--danger-accent)">Authoritative</text>
  <text x="1071.25" y="183.3889" text-anchor="middle" font-size="15.6425" fill="var(--danger-accent)">DNS</text>
  <line x1="208.75" y1="164.8611" x2="265" y2="164.8611" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="236.875" y="156.8056" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">1</text>
  <line x1="429.0625" y1="155.1944" x2="485.3125" y2="155.1944" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="457.1875" y="147.1389" text-anchor="middle" font-size="12.1663" fill="var(--primary-accent)">2</text>
  <line x1="485.3125" y1="175.3333" x2="429.0625" y2="175.3333" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow-primary)" />
  <line x1="429.0625" y1="273.6111" x2="705.625" y2="273.6111" stroke="var(--info-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="566.875" y="263.9444" text-anchor="middle" font-size="12.1663" fill="var(--info-accent)">3. Query TLD server</text>
  <line x1="705.625" y1="297.7777" x2="429.0625" y2="297.7777" stroke="var(--info-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)" />
  <line x1="429.0625" y1="354.1667" x2="925.9375" y2="354.1667" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="677.4999" y="344.5" text-anchor="middle" font-size="12.1663" fill="var(--ok-accent)">4. Query authoritative server</text>
  <line x1="925.9375" y1="378.3333" x2="429.0625" y2="378.3333" stroke="var(--ok-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)" />
  <text x="677.4999" y="402.5" text-anchor="middle" font-size="12.1663" fill="var(--ok-accent)">5. Return IP address</text>
  <line x1="265" y1="442.7777" x2="208.75" y2="442.7777" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)" />
  <text x="236.875" y="433.1111" text-anchor="middle" font-size="12.1663" fill="var(--text-muted)">6</text>
  <text x="640" y="515.2777" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Iterative DNS resolution with caching at resolver</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="155.465587" height="130.204106" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)"/>
  <text x="117.732794" y="113.387713" text-anchor="middle" font-size="21.448876" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Client</text>
  <rect x="253.765182" y="40" width="170.040486" height="130.204106" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)"/>
  <text x="338.299595" y="101.550909" text-anchor="middle" font-size="19.303939" fill="var(--info-accent)" font-family="Arial, sans-serif">Local</text>
  <text x="338.299595" y="132.32651" text-anchor="middle" font-size="19.303939" fill="var(--info-accent)" font-family="Arial, sans-serif">Resolver</text>
  <rect x="482.105263" y="40" width="170.040486" height="130.204106" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)"/>
  <text x="566.639676" y="101.550909" text-anchor="middle" font-size="19.303939" fill="var(--warn-accent)" font-family="Arial, sans-serif">Root</text>
  <text x="566.639676" y="132.32651" text-anchor="middle" font-size="19.303939" fill="var(--warn-accent)" font-family="Arial, sans-serif">DNS</text>
  <rect x="710.445344" y="40" width="170.040486" height="130.204106" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)"/>
  <text x="794.979653" y="101.550909" text-anchor="middle" font-size="19.303939" fill="var(--ok-accent)" font-family="Arial, sans-serif">TLD</text>
  <text x="794.979653" y="132.32651" text-anchor="middle" font-size="19.303939" fill="var(--ok-accent)" font-family="Arial, sans-serif">DNS</text>
  <rect x="938.785425" y="40" width="301.214575" height="130.204106" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)"/>
  <text x="1089.392713" y="101.550909" text-anchor="middle" font-size="19.303939" fill="var(--danger-accent)" font-family="Arial, sans-serif">Authoritative</text>
  <text x="1089.392713" y="132.32651" text-anchor="middle" font-size="19.303939" fill="var(--danger-accent)" font-family="Arial, sans-serif">DNS</text>
  <line x1="195.465587" y1="105.101979" x2="253.765182" y2="105.101979" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="224.615385" y="93.265323" text-anchor="middle" font-size="15.014065" fill="var(--text-muted)" font-family="Arial, sans-serif">1</text>
  <line x1="423.805668" y1="90.897844" x2="482.105263" y2="90.897844" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <text x="452.955466" y="79.061188" text-anchor="middle" font-size="15.014065" fill="var(--primary-accent)" font-family="Arial, sans-serif">2</text>
  <line x1="482.105263" y1="120.489707" x2="423.805668" y2="120.489707" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow-primary)"/>
  <line x1="423.805668" y1="264.897947" x2="710.445344" y2="264.897947" stroke="var(--info-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="566.639676" y="250.693812" text-anchor="middle" font-size="15.014065" fill="var(--info-accent)" font-family="Arial, sans-serif">3. Query TLD server</text>
  <line x1="710.445344" y1="300.408064" x2="423.805668" y2="300.408064" stroke="var(--info-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)"/>
  <line x1="423.805668" y1="383.265396" x2="938.785425" y2="383.265396" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="681.295443" y="369.061261" text-anchor="middle" font-size="15.014065" fill="var(--ok-accent)" font-family="Arial, sans-serif">4. Query authoritative server</text>
  <line x1="938.785425" y1="418.775513" x2="423.805668" y2="418.775513" stroke="var(--ok-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)"/>
  <text x="681.295443" y="454.285777" text-anchor="middle" font-size="15.014065" fill="var(--ok-accent)" font-family="Arial, sans-serif">5. Return IP address</text>
  <line x1="253.765182" y1="513.469355" x2="195.465587" y2="513.469355" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)"/>
  <text x="224.615385" y="499.265367" text-anchor="middle" font-size="15.014065" fill="var(--text-muted)" font-family="Arial, sans-serif">6</text>
  <text x="642.42915" y="620" text-anchor="middle" font-size="19.303939" fill="var(--text-muted)" font-family="Arial, sans-serif">Iterative DNS resolution with caching at resolver</text>
</svg>

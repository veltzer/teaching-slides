<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="17.7778" y="88.8889" width="142.2222" height="97.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="88.8889" y="144" text-anchor="middle" font-size="17.7778" font-weight="bold" fill="var(--bg)">Client</text>
  <rect x="213.3333" y="88.8889" width="155.5556" height="97.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="290.6667" y="135.1111" text-anchor="middle" font-size="16" fill="var(--info-accent)">Local</text>
  <text x="290.6667" y="158.2222" text-anchor="middle" font-size="16" fill="var(--info-accent)">Resolver</text>
  <rect x="422.2222" y="88.8889" width="155.5556" height="97.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="499.5556" y="135.1111" text-anchor="middle" font-size="16" fill="var(--warn-accent)">Root</text>
  <text x="499.5556" y="158.2222" text-anchor="middle" font-size="16" fill="var(--warn-accent)">DNS</text>
  <rect x="631.1111" y="88.8889" width="155.5556" height="97.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="708.4444" y="135.1111" text-anchor="middle" font-size="16" fill="var(--ok-accent)">TLD</text>
  <text x="708.4444" y="158.2222" text-anchor="middle" font-size="16" fill="var(--ok-accent)">DNS</text>
  <rect x="840" y="88.8889" width="275.5556" height="97.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="977.7778" y="135.1111" text-anchor="middle" font-size="16" fill="var(--danger-accent)">Authoritative</text>
  <text x="977.7778" y="158.2222" text-anchor="middle" font-size="16" fill="var(--danger-accent)">DNS</text>
  <line x1="160" y1="137.7778" x2="213.3333" y2="137.7778" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="186.6667" y="128.8889" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">1</text>
  <line x1="368.8889" y1="127.1111" x2="422.2222" y2="127.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="395.5556" y="118.2222" text-anchor="middle" font-size="12.4444" fill="var(--primary-accent)">2</text>
  <line x1="422.2222" y1="149.3333" x2="368.8889" y2="149.3333" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow-primary)" />
  <line x1="368.8889" y1="257.7778" x2="631.1111" y2="257.7778" stroke="var(--info-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="499.5556" y="247.1111" text-anchor="middle" font-size="12.4444" fill="var(--info-accent)">3. Query TLD server</text>
  <line x1="631.1111" y1="284.4444" x2="368.8889" y2="284.4444" stroke="var(--info-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)" />
  <line x1="368.8889" y1="346.6667" x2="840" y2="346.6667" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="604.4444" y="336" text-anchor="middle" font-size="12.4444" fill="var(--ok-accent)">4. Query authoritative server</text>
  <line x1="840" y1="373.3333" x2="368.8889" y2="373.3333" stroke="var(--ok-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)" />
  <text x="604.4444" y="400" text-anchor="middle" font-size="12.4444" fill="var(--ok-accent)">5. Return IP address</text>
  <line x1="213.3333" y1="444.4444" x2="160" y2="444.4444" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)" />
  <text x="186.6667" y="433.7778" text-anchor="middle" font-size="12.4444" fill="var(--text-muted)">6</text>
  <text x="568.8889" y="524.4444" text-anchor="middle" font-size="16" fill="var(--text-muted)">Iterative DNS resolution with caching at resolver</text>
</svg>
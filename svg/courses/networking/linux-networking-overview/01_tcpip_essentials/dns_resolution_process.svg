<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="155.465587" height="130.204106" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)" />
  <text x="117.732794" y="113.387713" text-anchor="middle" font-size="21.448876" font-weight="bold" fill="var(--bg)">Client</text>
  <rect x="253.765182" y="40" width="170.040486" height="130.204106" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)" />
  <text x="338.299595" y="101.550909" text-anchor="middle" font-size="19.303939" fill="var(--info-accent)">Local</text>
  <text x="338.299595" y="132.32651" text-anchor="middle" font-size="19.303939" fill="var(--info-accent)">Resolver</text>
  <rect x="482.105263" y="40" width="170.040486" height="130.204106" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)" />
  <text x="566.639676" y="101.550909" text-anchor="middle" font-size="19.303939" fill="var(--warn-accent)">Root</text>
  <text x="566.639676" y="132.32651" text-anchor="middle" font-size="19.303939" fill="var(--warn-accent)">DNS</text>
  <rect x="710.445344" y="40" width="170.040486" height="130.204106" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)" />
  <text x="794.979653" y="101.550909" text-anchor="middle" font-size="19.303939" fill="var(--ok-accent)">TLD</text>
  <text x="794.979653" y="132.32651" text-anchor="middle" font-size="19.303939" fill="var(--ok-accent)">DNS</text>
  <rect x="938.785425" y="40" width="301.214575" height="130.204106" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.40442" filter="url(#shadow)" />
  <text x="1089.392713" y="101.550909" text-anchor="middle" font-size="19.303939" fill="var(--danger-accent)">Authoritative</text>
  <text x="1089.392713" y="132.32651" text-anchor="middle" font-size="19.303939" fill="var(--danger-accent)">DNS</text>
  <line x1="195.465587" y1="105.101979" x2="253.765182" y2="105.101979" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="224.615385" y="93.265323" text-anchor="middle" font-size="15.014065" fill="var(--text-muted)">1</text>
  <line x1="423.805668" y1="90.897844" x2="482.105263" y2="90.897844" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="452.955466" y="79.061188" text-anchor="middle" font-size="15.014065" fill="var(--primary-accent)">2</text>
  <line x1="482.105263" y1="120.489707" x2="423.805668" y2="120.489707" stroke="var(--primary-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow-primary)" />
  <line x1="423.805668" y1="264.897947" x2="710.445344" y2="264.897947" stroke="var(--info-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="566.639676" y="250.693812" text-anchor="middle" font-size="15.014065" fill="var(--info-accent)">3. Query TLD server</text>
  <line x1="710.445344" y1="300.408064" x2="423.805668" y2="300.408064" stroke="var(--info-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)" />
  <line x1="423.805668" y1="383.265396" x2="938.785425" y2="383.265396" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="681.295443" y="369.061261" text-anchor="middle" font-size="15.014065" fill="var(--ok-accent)">4. Query authoritative server</text>
  <line x1="938.785425" y1="418.775513" x2="423.805668" y2="418.775513" stroke="var(--ok-border)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)" />
  <text x="681.295443" y="454.285777" text-anchor="middle" font-size="15.014065" fill="var(--ok-accent)">5. Return IP address</text>
  <line x1="253.765182" y1="513.469355" x2="195.465587" y2="513.469355" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="5.3333 4.4444" marker-end="url(#arrow)" />
  <text x="224.615385" y="499.265367" text-anchor="middle" font-size="15.014065" fill="var(--text-muted)">6</text>
  <text x="642.42915" y="620" text-anchor="middle" font-size="19.303939" fill="var(--text-muted)">Iterative DNS resolution with caching at resolver</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Clients box -->
  <rect x="64" y="144" width="277" height="440" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="64" y="144" width="277" height="56" fill="url(#grad-accent)" rx="10"/>
  <rect x="64" y="188" width="277" height="12" fill="url(#grad-accent)"/>
  <text x="202" y="181" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Clients</text>
  <text x="202" y="262" text-anchor="middle" font-size="20" fill="#333333">Web Browser</text>
  <text x="202" y="314" text-anchor="middle" font-size="20" fill="#333333">Email Client</text>
  <text x="202" y="366" text-anchor="middle" font-size="20" fill="#333333">FTP Client</text>
  <text x="202" y="418" text-anchor="middle" font-size="20" fill="#333333">SSH Client</text>
  <!-- Network box -->
  <rect x="512" y="198" width="256" height="330" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="512" y="198" width="256" height="52" fill="url(#grad-surface)" rx="10" stroke="#f57c00" stroke-width="3"/>
  <rect x="512" y="238" width="256" height="12" fill="#f2f2f2"/>
  <text x="640" y="235" text-anchor="middle" font-size="22" font-weight="bold" fill="#e65100">Network</text>
  <text x="640" y="300" text-anchor="middle" font-size="20" fill="#555555">TCP/IP</text>
  <text x="640" y="350" text-anchor="middle" font-size="20" fill="#555555">Protocols</text>
  <text x="640" y="400" text-anchor="middle" font-size="20" fill="#555555">Ports</text>
  <!-- Servers box -->
  <rect x="938" y="144" width="278" height="440" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <rect x="938" y="144" width="278" height="56" fill="url(#grad-accent)" rx="10"/>
  <rect x="938" y="188" width="278" height="12" fill="url(#grad-accent)"/>
  <text x="1077" y="181" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Servers</text>
  <text x="1077" y="262" text-anchor="middle" font-size="20" fill="#333333">Apache/Nginx</text>
  <text x="1077" y="314" text-anchor="middle" font-size="20" fill="#333333">Postfix/SMTP</text>
  <text x="1077" y="366" text-anchor="middle" font-size="20" fill="#333333">vsftpd/FTP</text>
  <text x="1077" y="418" text-anchor="middle" font-size="20" fill="#333333">OpenSSH</text>
  <!-- Arrows: Client -> Network -->
  <line x1="341" y1="318" x2="512" y2="318" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="427" y="307" text-anchor="middle" font-size="16" fill="#1565c0">Request</text>
  <!-- Arrows: Network -> Client -->
  <line x1="512" y1="390" x2="341" y2="390" stroke="#555555" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
  <text x="427" y="412" text-anchor="middle" font-size="16" fill="#555555">Response</text>
  <!-- Arrows: Network -> Server -->
  <line x1="768" y1="318" x2="938" y2="318" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <!-- Arrows: Server -> Network -->
  <line x1="938" y1="390" x2="768" y2="390" stroke="#555555" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
</svg>

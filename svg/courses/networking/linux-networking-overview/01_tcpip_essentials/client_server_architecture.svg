<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="56.8889" y="128" width="246.2222" height="391.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="56.8889" y="128" width="246.2222" height="49.7778" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="56.8889" y="167.1111" width="246.2222" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="179.5556" y="160.8889" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Clients</text>
  <text x="179.5556" y="232.8889" text-anchor="middle" font-size="17.7778" fill="var(--text)">Web Browser</text>
  <text x="179.5556" y="279.1111" text-anchor="middle" font-size="17.7778" fill="var(--text)">Email Client</text>
  <text x="179.5556" y="325.3333" text-anchor="middle" font-size="17.7778" fill="var(--text)">FTP Client</text>
  <text x="179.5556" y="371.5556" text-anchor="middle" font-size="17.7778" fill="var(--text)">SSH Client</text>
  <rect x="455.1111" y="176" width="227.5556" height="293.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="455.1111" y="176" width="227.5556" height="46.2222" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <rect x="455.1111" y="211.5556" width="227.5556" height="10.6667" fill="var(--surface)" rx="6"/>
  <text x="568.8889" y="208.8889" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--warn-accent)">Network</text>
  <text x="568.8889" y="266.6667" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">TCP/IP</text>
  <text x="568.8889" y="311.1111" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">Protocols</text>
  <text x="568.8889" y="355.5556" text-anchor="middle" font-size="17.7778" fill="var(--text-muted)">Ports</text>
  <rect x="833.7778" y="128" width="247.1111" height="391.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="833.7778" y="128" width="247.1111" height="49.7778" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="833.7778" y="167.1111" width="247.1111" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="957.3333" y="160.8889" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--bg)">Servers</text>
  <text x="957.3333" y="232.8889" text-anchor="middle" font-size="17.7778" fill="var(--text)">Apache/Nginx</text>
  <text x="957.3333" y="279.1111" text-anchor="middle" font-size="17.7778" fill="var(--text)">Postfix/SMTP</text>
  <text x="957.3333" y="325.3333" text-anchor="middle" font-size="17.7778" fill="var(--text)">vsftpd/FTP</text>
  <text x="957.3333" y="371.5556" text-anchor="middle" font-size="17.7778" fill="var(--text)">OpenSSH</text>
  <line x1="303.1111" y1="282.6667" x2="455.1111" y2="282.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="379.5556" y="272.8889" text-anchor="middle" font-size="14.2222" fill="var(--primary-accent)">Request</text>
  <line x1="455.1111" y1="346.6667" x2="303.1111" y2="346.6667" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" marker-end="url(#arrow)" />
  <text x="379.5556" y="366.2222" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Response</text>
  <line x1="682.6667" y1="282.6667" x2="833.7778" y2="282.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="833.7778" y1="346.6667" x2="682.6667" y2="346.6667" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" marker-end="url(#arrow)" />
</svg>
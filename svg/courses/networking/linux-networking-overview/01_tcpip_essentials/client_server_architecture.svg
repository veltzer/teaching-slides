<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="100" y="156" width="259.6875" height="354.4444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="100" y="156" width="259.6875" height="45.1111" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="100" y="191.4444" width="259.6875" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="229.375" y="185.8056" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Clients</text>
  <text x="229.375" y="251.0556" text-anchor="middle" font-size="17.3806" fill="var(--text)">Web Browser</text>
  <text x="229.375" y="292.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">Email Client</text>
  <text x="229.375" y="334.8333" text-anchor="middle" font-size="17.3806" fill="var(--text)">FTP Client</text>
  <text x="229.375" y="376.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">SSH Client</text>
  <rect x="520" y="199.5" width="240" height="265.8333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="520" y="199.5" width="240" height="41.8889" fill="var(--surface)" rx="6" stroke="var(--border)" stroke-width="1" />
  <rect x="520" y="231.7223" width="240" height="9.6667" fill="var(--surface)" rx="6"/>
  <text x="640" y="229.3056" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--warn-accent)">Network</text>
  <text x="640" y="281.6667" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">TCP/IP</text>
  <text x="640" y="321.9444" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">Protocols</text>
  <text x="640" y="362.2223" text-anchor="middle" font-size="17.3806" fill="var(--text-muted)">Ports</text>
  <rect x="919.375" y="156" width="260.625" height="354.4444" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="919.375" y="156" width="260.625" height="45.1111" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="919.375" y="191.4444" width="260.625" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1049.6874" y="185.8056" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--bg)">Servers</text>
  <text x="1049.6874" y="251.0556" text-anchor="middle" font-size="17.3806" fill="var(--text)">Apache/Nginx</text>
  <text x="1049.6874" y="292.9444" text-anchor="middle" font-size="17.3806" fill="var(--text)">Postfix/SMTP</text>
  <text x="1049.6874" y="334.8333" text-anchor="middle" font-size="17.3806" fill="var(--text)">vsftpd/FTP</text>
  <text x="1049.6874" y="376.7223" text-anchor="middle" font-size="17.3806" fill="var(--text)">OpenSSH</text>
  <line x1="359.6875" y1="296.1667" x2="520" y2="296.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="440.3125" y="287.3056" text-anchor="middle" font-size="13.9044" fill="var(--primary-accent)">Request</text>
  <line x1="520" y1="354.1667" x2="359.6875" y2="354.1667" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" marker-end="url(#arrow)" />
  <text x="440.3125" y="371.8889" text-anchor="middle" font-size="13.9044" fill="var(--text-muted)">Response</text>
  <line x1="760" y1="296.1667" x2="919.375" y2="296.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <line x1="919.375" y1="354.1667" x2="760" y2="354.1667" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="288.541667" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.090399" filter="url(#shadow)"/>
  <rect x="40" y="40" width="288.541667" height="73.818173" fill="url(#grad-primary)" rx="8.090399" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="97.999935" width="288.541667" height="15.818238" fill="url(#grad-primary)" rx="8.090399" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="183.75" y="88.772806" text-anchor="middle" font-size="25.779517" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Clients</text>
  <text x="183.75" y="195.545547" text-anchor="middle" font-size="23.435998" fill="var(--text)" font-family="Arial, sans-serif">Web Browser</text>
  <text x="183.75" y="264.090864" text-anchor="middle" font-size="23.435998" fill="var(--text)" font-family="Arial, sans-serif">Email Client</text>
  <text x="183.75" y="332.636346" text-anchor="middle" font-size="23.435998" fill="var(--text)" font-family="Arial, sans-serif">FTP Client</text>
  <text x="183.75" y="401.181991" text-anchor="middle" font-size="23.435998" fill="var(--text)" font-family="Arial, sans-serif">SSH Client</text>
  <rect x="506.666667" y="111.181827" width="266.666667" height="435" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.090399" filter="url(#shadow)"/>
  <rect x="506.666667" y="111.181827" width="266.666667" height="68.545481" fill="var(--surface)" rx="8.090399" stroke="var(--border)" stroke-width="1"/>
  <rect x="506.666667" y="163.909234" width="266.666667" height="15.818238" fill="var(--surface)" rx="8.090399"/>
  <text x="640" y="159.954633" text-anchor="middle" font-size="25.779517" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Network</text>
  <text x="640" y="245.636444" text-anchor="middle" font-size="23.435998" fill="var(--text-muted)" font-family="Arial, sans-serif">TCP/IP</text>
  <text x="640" y="311.545416" text-anchor="middle" font-size="23.435998" fill="var(--text-muted)" font-family="Arial, sans-serif">Protocols</text>
  <text x="640" y="377.454715" text-anchor="middle" font-size="23.435998" fill="var(--text-muted)" font-family="Arial, sans-serif">Ports</text>
  <rect x="950.416667" y="40" width="289.583333" height="580" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.090399" filter="url(#shadow)"/>
  <rect x="950.416667" y="40" width="289.583333" height="73.818173" fill="url(#grad-primary)" rx="8.090399" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950.416667" y="97.999935" width="289.583333" height="15.818238" fill="url(#grad-primary)" rx="8.090399" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.208222" y="88.772806" text-anchor="middle" font-size="25.779517" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Servers</text>
  <text x="1095.208222" y="195.545547" text-anchor="middle" font-size="23.435998" fill="var(--text)" font-family="Arial, sans-serif">Apache/Nginx</text>
  <text x="1095.208222" y="264.090864" text-anchor="middle" font-size="23.435998" fill="var(--text)" font-family="Arial, sans-serif">Postfix/SMTP</text>
  <text x="1095.208222" y="332.636346" text-anchor="middle" font-size="23.435998" fill="var(--text)" font-family="Arial, sans-serif">vsftpd/FTP</text>
  <text x="1095.208222" y="401.181991" text-anchor="middle" font-size="23.435998" fill="var(--text)" font-family="Arial, sans-serif">OpenSSH</text>
  <line x1="328.541667" y1="269.36372" x2="506.666667" y2="269.36372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="418.125" y="254.863736" text-anchor="middle" font-size="18.74869" fill="var(--primary-accent)" font-family="Arial, sans-serif">Request</text>
  <line x1="506.666667" y1="364.272822" x2="328.541667" y2="364.272822" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" marker-end="url(#arrow)"/>
  <text x="418.125" y="393.27279" text-anchor="middle" font-size="18.74869" fill="var(--text-muted)" font-family="Arial, sans-serif">Response</text>
  <line x1="773.333333" y1="269.36372" x2="950.416667" y2="269.36372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="950.416667" y1="364.272822" x2="773.333333" y2="364.272822" stroke="var(--text-muted)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" marker-end="url(#arrow)"/>
</svg>

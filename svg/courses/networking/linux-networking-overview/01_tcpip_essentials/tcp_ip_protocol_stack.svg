<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="261.235521" y="40" text-anchor="middle" font-size="23.63665" font-weight="bold" fill="var(--primary-accent)">TCP/IP Model</text>
  <text x="904.092664" y="40" text-anchor="middle" font-size="23.63665" font-weight="bold" fill="var(--primary-accent)">OSI Model</text>
  <rect x="40" y="67.903831" width="440.15444" height="117.59454" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)" />
  <text x="260.07722" y="135.670048" text-anchor="middle" font-size="22.56229" fill="var(--danger-accent)">Application</text>
  <rect x="40" y="201.443276" width="440.15444" height="117.59454" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)" />
  <text x="260.07722" y="269.209493" text-anchor="middle" font-size="22.56229" fill="var(--warn-accent)">Transport</text>
  <rect x="40" y="334.982721" width="440.15444" height="117.59454" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)" />
  <text x="260.07722" y="402.749186" text-anchor="middle" font-size="22.56229" fill="var(--primary-accent)">Internet</text>
  <rect x="40" y="468.52229" width="440.15444" height="117.59454" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)" />
  <text x="260.07722" y="536.28863" text-anchor="middle" font-size="22.56229" fill="var(--ok-accent)">Network Access</text>
  <rect x="626.100386" y="67.903831" width="416.988417" height="73.74568" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.417902" />
  <text x="834.594595" y="112.749186" text-anchor="middle" font-size="20.413448" fill="var(--danger-accent)">Application</text>
  <rect x="626.100386" y="147.628851" width="416.988417" height="73.74568" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.417902" />
  <text x="834.594595" y="192.474205" text-anchor="middle" font-size="20.413448" fill="var(--danger-accent)">Presentation</text>
  <rect x="626.100386" y="227.35387" width="416.988417" height="73.74568" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.417902" />
  <text x="834.594595" y="272.199225" text-anchor="middle" font-size="20.413448" fill="var(--danger-accent)">Session</text>
  <rect x="626.100386" y="307.079014" width="416.988417" height="73.74568" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.417902" />
  <text x="834.594595" y="351.924368" text-anchor="middle" font-size="20.413448" fill="var(--warn-accent)">Transport</text>
  <rect x="626.100386" y="386.804033" width="416.988417" height="73.74568" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.417902" />
  <text x="834.594595" y="431.649388" text-anchor="middle" font-size="20.413448" fill="var(--primary-accent)">Network</text>
  <rect x="626.100386" y="466.529053" width="416.988417" height="73.74568" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.417902" />
  <text x="834.594595" y="511.374407" text-anchor="middle" font-size="20.413448" fill="var(--ok-accent)">Data Link</text>
  <rect x="626.100386" y="546.25432" width="416.988417" height="73.74568" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.417902" />
  <text x="834.594595" y="591.099674" text-anchor="middle" font-size="20.413448" fill="var(--ok-accent)">Physical</text>
  <line x1="480.15444" y1="126.700977" x2="626.100386" y2="126.700977" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <line x1="480.15444" y1="260.240422" x2="626.100386" y2="343.951792" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <line x1="480.15444" y1="393.780115" x2="626.100386" y2="423.676935" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <line x1="480.15444" y1="527.31956" x2="626.100386" y2="546.25432" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <text x="1240" y="112.749186" font-size="19.339088" fill="var(--text-faint)">Layer 7</text>
  <text x="1240" y="351.924368" font-size="19.339088" fill="var(--text-faint)">Layer 4</text>
  <text x="1240" y="431.649388" font-size="19.339088" fill="var(--text-faint)">Layer 3</text>
  <text x="1240" y="591.099674" font-size="19.339088" fill="var(--text-faint)">Layer 1</text>
</svg>
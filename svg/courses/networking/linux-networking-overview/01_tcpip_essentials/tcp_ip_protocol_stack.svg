  <text x="260.07722" y="269.209493" text-anchor="middle" font-size="22.56229" fill="var(--warn-accent)" font-family="Arial, sans-serif">Transport</text>
  <rect x="40" y="334.982721" width="440.15444" height="117.59454" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)"/>
  <text x="260.07722" y="402.749186" text-anchor="middle" font-size="22.56229" fill="var(--primary-accent)" font-family="Arial, sans-serif">Internet</text>
  <rect x="40" y="468.52229" width="440.15444" height="117.59454" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)"/>
  <text x="260.07722" y="536.28863" text-anchor="middle" font-size="22.56229" fill="var(--ok-accent)" font-family="Arial, sans-serif">Network Access</text>

  <rect x="40" y="67.903831" width="440.15444" height="117.59454" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)"/>
  <text x="260.07722" y="135.670048" text-anchor="middle" font-size="22.56229" fill="var(--danger-accent)" font-family="Arial, sans-serif">Application</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="279.0625" y="98" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">TCP/IP Model</text>
  <text x="799.375" y="98" text-anchor="middle" font-size="19.1186" font-weight="bold" fill="var(--primary-accent)">OSI Model</text>
  <rect x="100" y="120.5556" width="356.25" height="95.0556" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="278.125" y="175.3333" text-anchor="middle" font-size="18.2496" fill="var(--danger-accent)">Application</text>
  <rect x="100" y="228.5" width="356.25" height="95.0556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="278.125" y="283.2777" text-anchor="middle" font-size="18.2496" fill="var(--warn-accent)">Transport</text>
  <rect x="100" y="336.4444" width="356.25" height="95.0556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="278.125" y="391.2223" text-anchor="middle" font-size="18.2496" fill="var(--primary-accent)">Internet</text>
  <rect x="100" y="444.3889" width="356.25" height="95.0556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="278.125" y="499.1667" text-anchor="middle" font-size="18.2496" fill="var(--ok-accent)">Network Access</text>
  <rect x="574.375" y="120.5556" width="337.5" height="59.6111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="743.125" y="156.8056" text-anchor="middle" font-size="16.5115" fill="var(--danger-accent)">Application</text>
  <rect x="574.375" y="185" width="337.5" height="59.6111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="743.125" y="221.25" text-anchor="middle" font-size="16.5115" fill="var(--danger-accent)">Presentation</text>
  <rect x="574.375" y="249.4444" width="337.5" height="59.6111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="743.125" y="285.6944" text-anchor="middle" font-size="16.5115" fill="var(--danger-accent)">Session</text>
  <rect x="574.375" y="313.8889" width="337.5" height="59.6111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="743.125" y="350.1389" text-anchor="middle" font-size="16.5115" fill="var(--warn-accent)">Transport</text>
  <rect x="574.375" y="378.3333" width="337.5" height="59.6111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="743.125" y="414.5833" text-anchor="middle" font-size="16.5115" fill="var(--primary-accent)">Network</text>
  <rect x="574.375" y="442.7777" width="337.5" height="59.6111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="743.125" y="479.0277" text-anchor="middle" font-size="16.5115" fill="var(--ok-accent)">Data Link</text>
  <rect x="574.375" y="507.2223" width="337.5" height="59.6111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="743.125" y="543.4723" text-anchor="middle" font-size="16.5115" fill="var(--ok-accent)">Physical</text>
  <line x1="456.25" y1="168.0833" x2="574.375" y2="168.0833" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <line x1="456.25" y1="276.0277" x2="574.375" y2="343.6944" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <line x1="456.25" y1="383.9723" x2="574.375" y2="408.1389" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <line x1="456.25" y1="491.9167" x2="574.375" y2="507.2223" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <text x="1071.25" y="156.8056" font-size="15.6425" fill="var(--text-faint)">Layer 7</text>
  <text x="1071.25" y="350.1389" font-size="15.6425" fill="var(--text-faint)">Layer 4</text>
  <text x="1071.25" y="414.5833" font-size="15.6425" fill="var(--text-faint)">Layer 3</text>
  <text x="1071.25" y="543.4723" font-size="15.6425" fill="var(--text-faint)">Layer 1</text>
</svg>
  <text x="834.594595" y="112.749186" text-anchor="middle" font-size="20.413448" fill="var(--danger-accent)" font-family="Arial, sans-serif">Application</text>
  <rect x="626.100386" y="147.628851" width="416.988417" height="73.74568" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)"/>
  <text x="834.594595" y="192.474205" text-anchor="middle" font-size="20.413448" fill="var(--danger-accent)" font-family="Arial, sans-serif">Presentation</text>
  <rect x="626.100386" y="227.35387" width="416.988417" height="73.74568" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)"/>
  <text x="834.594595" y="272.199225" text-anchor="middle" font-size="20.413448" fill="var(--danger-accent)" font-family="Arial, sans-serif">Session</text>
  <rect x="626.100386" y="307.079014" width="416.988417" height="73.74568" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)"/>
  <text x="834.594595" y="351.924368" text-anchor="middle" font-size="20.413448" fill="var(--warn-accent)" font-family="Arial, sans-serif">Transport</text>
  <rect x="626.100386" y="386.804033" width="416.988417" height="73.74568" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)"/>
  <text x="834.594595" y="431.649388" text-anchor="middle" font-size="20.413448" fill="var(--primary-accent)" font-family="Arial, sans-serif">Network</text>
  <rect x="626.100386" y="466.529053" width="416.988417" height="73.74568" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.417902" filter="url(#shadow)"/>

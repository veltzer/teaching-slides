<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="226.6667" y="64" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">TCP/IP Model</text>
  <text x="720" y="64" text-anchor="middle" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">OSI Model</text>
  <rect x="56.8889" y="88.8889" width="337.7778" height="104.8889" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="225.7778" y="149.3333" text-anchor="middle" font-size="18.6667" fill="var(--danger-accent)">Application</text>
  <rect x="56.8889" y="208" width="337.7778" height="104.8889" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="225.7778" y="268.4444" text-anchor="middle" font-size="18.6667" fill="var(--warn-accent)">Transport</text>
  <rect x="56.8889" y="327.1111" width="337.7778" height="104.8889" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="225.7778" y="387.5556" text-anchor="middle" font-size="18.6667" fill="var(--primary-accent)">Internet</text>
  <rect x="56.8889" y="446.2222" width="337.7778" height="104.8889" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="225.7778" y="506.6667" text-anchor="middle" font-size="18.6667" fill="var(--ok-accent)">Network Access</text>
  <rect x="506.6667" y="88.8889" width="320" height="65.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="666.6667" y="128.8889" text-anchor="middle" font-size="16.8889" fill="var(--danger-accent)">Application</text>
  <rect x="506.6667" y="160" width="320" height="65.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="666.6667" y="200" text-anchor="middle" font-size="16.8889" fill="var(--danger-accent)">Presentation</text>
  <rect x="506.6667" y="231.1111" width="320" height="65.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="666.6667" y="271.1111" text-anchor="middle" font-size="16.8889" fill="var(--danger-accent)">Session</text>
  <rect x="506.6667" y="302.2222" width="320" height="65.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="666.6667" y="342.2222" text-anchor="middle" font-size="16.8889" fill="var(--warn-accent)">Transport</text>
  <rect x="506.6667" y="373.3333" width="320" height="65.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="666.6667" y="413.3333" text-anchor="middle" font-size="16.8889" fill="var(--primary-accent)">Network</text>
  <rect x="506.6667" y="444.4444" width="320" height="65.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="666.6667" y="484.4444" text-anchor="middle" font-size="16.8889" fill="var(--ok-accent)">Data Link</text>
  <rect x="506.6667" y="515.5556" width="320" height="65.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="666.6667" y="555.5556" text-anchor="middle" font-size="16.8889" fill="var(--ok-accent)">Physical</text>
  <line x1="394.6667" y1="141.3333" x2="506.6667" y2="141.3333" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <line x1="394.6667" y1="260.4444" x2="506.6667" y2="335.1111" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <line x1="394.6667" y1="379.5556" x2="506.6667" y2="406.2222" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <line x1="394.6667" y1="498.6667" x2="506.6667" y2="515.5556" stroke="var(--border)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444" />
  <text x="977.7778" y="128.8889" font-size="16" fill="var(--text-faint)">Layer 7</text>
  <text x="977.7778" y="342.2222" font-size="16" fill="var(--text-faint)">Layer 4</text>
  <text x="977.7778" y="413.3333" font-size="16" fill="var(--text-faint)">Layer 3</text>
  <text x="977.7778" y="555.5556" font-size="16" fill="var(--text-faint)">Layer 1</text>
</svg>
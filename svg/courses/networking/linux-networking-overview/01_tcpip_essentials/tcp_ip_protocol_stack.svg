<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Column headers -->
  <text x="255" y="72" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">TCP/IP Model</text>
  <text x="810" y="72" text-anchor="middle" font-size="22" font-weight="bold" fill="#1565c0">OSI Model</text>
  <!-- TCP/IP layers -->
  <rect x="64" y="100" width="380" height="118" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="254" y="168" text-anchor="middle" font-size="21" fill="#b71c1c">Application</text>
  <rect x="64" y="234" width="380" height="118" fill="#fff8e1" stroke="#f57c00" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="254" y="302" text-anchor="middle" font-size="21" fill="#e65100">Transport</text>
  <rect x="64" y="368" width="380" height="118" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="254" y="436" text-anchor="middle" font-size="21" fill="#0d47a1">Internet</text>
  <rect x="64" y="502" width="380" height="118" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="254" y="570" text-anchor="middle" font-size="21" fill="#1b5e20">Network Access</text>
  <!-- OSI layers -->
  <rect x="570" y="100" width="360" height="74" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="8"/>
  <text x="750" y="145" text-anchor="middle" font-size="19" fill="#b71c1c">Application</text>
  <rect x="570" y="180" width="360" height="74" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="8"/>
  <text x="750" y="225" text-anchor="middle" font-size="19" fill="#b71c1c">Presentation</text>
  <rect x="570" y="260" width="360" height="74" fill="#ffebee" stroke="#c62828" stroke-width="2" rx="8"/>
  <text x="750" y="305" text-anchor="middle" font-size="19" fill="#b71c1c">Session</text>
  <rect x="570" y="340" width="360" height="74" fill="#fff8e1" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="750" y="385" text-anchor="middle" font-size="19" fill="#e65100">Transport</text>
  <rect x="570" y="420" width="360" height="74" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>
  <text x="750" y="465" text-anchor="middle" font-size="19" fill="#0d47a1">Network</text>
  <rect x="570" y="500" width="360" height="74" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="750" y="545" text-anchor="middle" font-size="19" fill="#1b5e20">Data Link</text>
  <rect x="570" y="580" width="360" height="74" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="750" y="625" text-anchor="middle" font-size="19" fill="#1b5e20">Physical</text>
  <!-- Mapping lines -->
  <line x1="444" y1="159" x2="570" y2="159" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="8,5"/>
  <line x1="444" y1="293" x2="570" y2="377" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="8,5"/>
  <line x1="444" y1="427" x2="570" y2="457" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="8,5"/>
  <line x1="444" y1="561" x2="570" y2="580" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="8,5"/>
  <!-- Layer numbers -->
  <text x="1100" y="145" font-size="18" fill="#888888">Layer 7</text>
  <text x="1100" y="385" font-size="18" fill="#888888">Layer 4</text>
  <text x="1100" y="465" font-size="18" fill="#888888">Layer 3</text>
  <text x="1100" y="625" font-size="18" fill="#888888">Layer 1</text>
</svg>

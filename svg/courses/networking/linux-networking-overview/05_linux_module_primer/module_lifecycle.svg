<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="215.617505" width="213.376835" height="213.744955" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)" />
  <text x="146.688418" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--primary-accent)">insmod /</text>
  <text x="146.688418" y="333.466184" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--primary-accent)">modprobe</text>
  <text x="146.688418" y="391.235009" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)">Load .ko</text>
  <rect x="288.613377" y="215.617505" width="213.376835" height="213.744955" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)" />
  <text x="395.30169" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--ok-accent)">module_init()</text>
  <text x="395.30169" y="365.816852" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)">Alloc resources</text>
  <rect x="537.226754" y="215.617505" width="213.376835" height="213.744955" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)" />
  <text x="643.915171" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--info-accent)">Running</text>
  <text x="643.915171" y="365.816852" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)">Active in kernel</text>
  <rect x="785.840131" y="215.617505" width="213.376835" height="213.744955" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)" />
  <text x="892.528548" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--warn-accent)">module_exit()</text>
  <text x="892.528548" y="365.816852" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)">Free resources</text>
  <rect x="1034.453507" y="215.617505" width="205.546493" height="213.744955" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)" />
  <text x="1137.226754" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--danger-accent)">rmmod</text>
  <text x="1137.226754" y="365.816852" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)">Unload</text>
  <line x1="253.376835" y1="323.067775" x2="288.613377" y2="323.067775" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="501.990212" y1="323.067775" x2="537.226754" y2="323.067775" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="750.603589" y1="323.067775" x2="785.840131" y2="323.067775" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="999.216966" y1="323.067775" x2="1034.453507" y2="323.067775" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="646.85155" y="40" text-anchor="middle" font-size="27.649085" font-weight="bold" fill="var(--text)">Kernel Module Lifecycle</text>
  <text x="646.85155" y="620" text-anchor="middle" font-size="19.141693" fill="var(--text-muted)">lsmod shows loaded modules | modinfo shows module metadata</text>
</svg>
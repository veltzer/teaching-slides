<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="215.617505" width="213.376835" height="213.744955" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)"/>
  <text x="146.688418" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">insmod /</text>
  <text x="146.688418" y="333.466184" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">modprobe</text>
  <text x="146.688418" y="391.235009" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)" font-family="Arial, sans-serif">Load .ko</text>
  <rect x="288.613377" y="215.617505" width="213.376835" height="213.744955" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)"/>
  <text x="395.30169" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">module_init()</text>
  <text x="395.30169" y="365.816852" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)" font-family="Arial, sans-serif">Alloc resources</text>
  <rect x="537.226754" y="215.617505" width="213.376835" height="213.744955" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)"/>
  <text x="643.915171" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Running</text>
  <text x="643.915171" y="365.816852" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)" font-family="Arial, sans-serif">Active in kernel</text>
  <rect x="785.840131" y="215.617505" width="213.376835" height="213.744955" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)"/>
  <text x="892.528548" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">module_exit()</text>
  <text x="892.528548" y="365.816852" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)" font-family="Arial, sans-serif">Free resources</text>
  <rect x="1034.453507" y="215.617505" width="205.546493" height="213.744955" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.342187" filter="url(#shadow)"/>
  <text x="1137.226754" y="294.183291" text-anchor="middle" font-size="21.268602" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">rmmod</text>
  <text x="1137.226754" y="365.816852" text-anchor="middle" font-size="18.0783" fill="var(--text-muted)" font-family="Arial, sans-serif">Unload</text>
  <line x1="253.376835" y1="323.067775" x2="288.613377" y2="323.067775" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="501.990212" y1="323.067775" x2="537.226754" y2="323.067775" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="750.603589" y1="323.067775" x2="785.840131" y2="323.067775" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="999.216966" y1="323.067775" x2="1034.453507" y2="323.067775" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="646.85155" y="40" text-anchor="middle" font-size="27.649085" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Kernel Module Lifecycle</text>
  <text x="646.85155" y="620" text-anchor="middle" font-size="19.141693" fill="var(--text-muted)" font-family="Arial, sans-serif">lsmod shows loaded modules | modinfo shows module metadata</text>
</svg>

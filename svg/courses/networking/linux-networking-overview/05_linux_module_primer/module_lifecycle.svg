<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="233.3333" width="204.375" height="149.0277" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="160.9375" y="288.1111" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">insmod /</text>
  <text x="160.9375" y="315.5" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--primary-accent)">modprobe</text>
  <text x="160.9375" y="355.7777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Load .ko</text>
  <rect x="296.875" y="233.3333" width="204.375" height="149.0277" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="399.0624" y="288.1111" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--ok-accent)">module_init()</text>
  <text x="399.0624" y="338.0556" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Alloc resources</text>
  <rect x="535" y="233.3333" width="204.375" height="149.0277" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="637.1875" y="288.1111" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--info-accent)">Running</text>
  <text x="637.1875" y="338.0556" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Active in kernel</text>
  <rect x="773.125" y="233.3333" width="204.375" height="149.0277" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="875.3125" y="288.1111" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--warn-accent)">module_exit()</text>
  <text x="875.3125" y="338.0556" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Free resources</text>
  <rect x="1011.25" y="233.3333" width="196.875" height="149.0277" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1109.6875" y="288.1111" text-anchor="middle" font-size="17.3806" font-weight="bold" fill="var(--danger-accent)">rmmod</text>
  <text x="1109.6875" y="338.0556" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Unload</text>
  <line x1="263.125" y1="308.25" x2="296.875" y2="308.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="501.25" y1="308.25" x2="535" y2="308.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="739.375" y1="308.25" x2="773.125" y2="308.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="977.5" y1="308.25" x2="1011.25" y2="308.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="110.8889" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--text)">Kernel Module Lifecycle</text>
  <text x="640" y="515.2777" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">lsmod shows loaded modules | modinfo shows module metadata</text>
</svg>
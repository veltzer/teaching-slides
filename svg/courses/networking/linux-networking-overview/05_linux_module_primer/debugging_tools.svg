<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="269.430052" height="246.666585" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)" />
  <text x="174.715026" y="130.666886" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--primary-accent)">dmesg</text>
  <text x="174.715026" y="213.333495" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)">Kernel ring buffer</text>
  <rect x="346.735641" y="40" width="269.430052" height="246.666585" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)" />
  <text x="481.450777" y="130.666886" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--info-accent)">printk / pr_*</text>
  <text x="481.450777" y="213.333495" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)">Kernel logging</text>
  <rect x="653.471503" y="40" width="269.430052" height="246.666585" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)" />
  <text x="788.186528" y="130.666886" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--ok-accent)">ftrace</text>
  <text x="788.186528" y="213.333495" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)">Function tracer</text>
  <rect x="960.207254" y="40" width="279.792746" height="246.666585" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)" />
  <text x="1100.103627" y="130.666886" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--warn-accent)">kgdb / kdb</text>
  <text x="1100.103627" y="213.333495" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)">Kernel debugger</text>
  <rect x="40" y="373.333415" width="269.430052" height="246.666585" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)" />
  <text x="174.715026" y="464.000136" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--danger-accent)">strace</text>
  <text x="174.715026" y="546.66691" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)">Syscall tracing</text>
  <rect x="346.735641" y="373.333415" width="269.430052" height="246.666585" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)" />
  <text x="481.450777" y="464.000136" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--warn-accent)">modprobe -v</text>
  <text x="481.450777" y="546.66691" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)">Verbose load</text>
  <rect x="653.471503" y="373.333415" width="269.430052" height="246.666585" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)" />
  <text x="788.186528" y="464.000136" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--primary-accent)">objdump</text>
  <text x="788.186528" y="546.66691" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)">Disassemble .ko</text>
  <rect x="960.207254" y="373.333415" width="279.792746" height="246.666585" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)" />
  <text x="1100.103627" y="464.000136" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--info-accent)">dynamic debug</text>
  <text x="1100.103627" y="546.66691" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)">pr_debug toggle</text>
</svg>
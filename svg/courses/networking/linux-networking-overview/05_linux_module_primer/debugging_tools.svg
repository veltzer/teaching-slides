<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="269.430052" height="246.666585" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)"/>
  <text x="174.715026" y="130.666886" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">dmesg</text>
  <text x="174.715026" y="213.333495" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)" font-family="Arial, sans-serif">Kernel ring buffer</text>
  <rect x="346.735641" y="40" width="269.430052" height="246.666585" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)"/>
  <text x="481.450777" y="130.666886" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">printk / pr_*</text>
  <text x="481.450777" y="213.333495" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)" font-family="Arial, sans-serif">Kernel logging</text>
  <rect x="653.471503" y="40" width="269.430052" height="246.666585" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)"/>
  <text x="788.186528" y="130.666886" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ftrace</text>
  <text x="788.186528" y="213.333495" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)" font-family="Arial, sans-serif">Function tracer</text>
  <rect x="960.207254" y="40" width="279.792746" height="246.666585" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)"/>
  <text x="1100.103627" y="130.666886" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">kgdb / kdb</text>
  <text x="1100.103627" y="213.333495" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)" font-family="Arial, sans-serif">Kernel debugger</text>
  <rect x="40" y="373.333415" width="269.430052" height="246.666585" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)"/>
  <text x="174.715026" y="464.000136" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">strace</text>
  <text x="174.715026" y="546.66691" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)" font-family="Arial, sans-serif">Syscall tracing</text>
  <rect x="346.735641" y="373.333415" width="269.430052" height="246.666585" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)"/>
  <text x="481.450777" y="464.000136" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">modprobe -v</text>
  <text x="481.450777" y="546.66691" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)" font-family="Arial, sans-serif">Verbose load</text>
  <rect x="653.471503" y="373.333415" width="269.430052" height="246.666585" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)"/>
  <text x="788.186528" y="464.000136" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">objdump</text>
  <text x="788.186528" y="546.66691" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)" font-family="Arial, sans-serif">Disassemble .ko</text>
  <rect x="960.207254" y="373.333415" width="279.792746" height="246.666585" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="8.115656" filter="url(#shadow)"/>
  <text x="1100.103627" y="464.000136" text-anchor="middle" font-size="24.684579" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">dynamic debug</text>
  <text x="1100.103627" y="546.66691" text-anchor="middle" font-size="19.982773" fill="var(--text-muted)" font-family="Arial, sans-serif">pr_debug toggle</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="238.410596" height="202.325578" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)"/>
  <text x="159.205298" y="123.627855" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">kmalloc()</text>
  <text x="159.205298" y="196.465082" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)" font-family="Arial, sans-serif">Allocate Memory</text>
  <rect x="355.89404" y="40" width="238.410596" height="202.325578" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)"/>
  <text x="475.099338" y="123.627855" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Use Resource</text>
  <text x="475.099338" y="196.465082" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)" font-family="Arial, sans-serif">Read/Write ops</text>
  <rect x="671.788079" y="40" width="238.410596" height="202.325578" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)"/>
  <text x="790.993377" y="123.627855" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">kfree()</text>
  <text x="790.993377" y="196.465082" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)" font-family="Arial, sans-serif">Free Memory</text>
  <rect x="40" y="417.674422" width="238.410596" height="202.325578" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)"/>
  <text x="159.205298" y="501.302444" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">request_irq()</text>
  <text x="159.205298" y="574.139672" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)" font-family="Arial, sans-serif">Register IRQ</text>
  <rect x="355.89404" y="417.674422" width="238.410596" height="202.325578" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)"/>
  <text x="475.099338" y="501.302444" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Handle IRQs</text>
  <text x="475.099338" y="574.139672" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)" font-family="Arial, sans-serif">Interrupt work</text>
  <rect x="671.788079" y="417.674422" width="238.410596" height="202.325578" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)"/>
  <text x="790.993377" y="501.302444" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">free_irq()</text>
  <text x="790.993377" y="574.139672" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)" font-family="Arial, sans-serif">Release IRQ</text>
  <line x1="278.410596" y1="141.162872" x2="355.89404" y2="141.162872" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="594.304636" y1="141.162872" x2="671.788079" y2="141.162872" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="278.410596" y1="518.837128" x2="355.89404" y2="518.837128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="594.304636" y1="518.837128" x2="671.788079" y2="518.837128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="991.655629" y="120.930198" width="248.344371" height="269.767492" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.991989" />
  <text x="1115.827815" y="201.860562" text-anchor="middle" font-size="25.465938" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Init / Exit</text>
  <text x="1115.827815" y="277.395279" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)" font-family="Arial, sans-serif">Acquire in init</text>
  <text x="1115.827815" y="325.953431" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)" font-family="Arial, sans-serif">Release in exit</text>
  <text x="1115.827815" y="374.511583" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)" font-family="Arial, sans-serif">Reverse order</text>
</svg>
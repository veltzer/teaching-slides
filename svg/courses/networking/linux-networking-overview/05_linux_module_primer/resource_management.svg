<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Memory row -->
  <rect x="42" y="100" width="240" height="150" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="162" y="162" text-anchor="middle" font-size="21" font-weight="bold" fill="#0d47a1">kmalloc()</text>
  <text x="162" y="216" text-anchor="middle" font-size="17" fill="#555555">Allocate Memory</text>
  <rect x="360" y="100" width="240" height="150" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="480" y="162" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b5e20">Use Resource</text>
  <text x="480" y="216" text-anchor="middle" font-size="17" fill="#555555">Read/Write ops</text>
  <rect x="678" y="100" width="240" height="150" fill="#ffebee" stroke="#c62828" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="798" y="162" text-anchor="middle" font-size="21" font-weight="bold" fill="#b71c1c">kfree()</text>
  <text x="798" y="216" text-anchor="middle" font-size="17" fill="#555555">Free Memory</text>
  <!-- IRQ row -->
  <rect x="42" y="380" width="240" height="150" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="162" y="442" text-anchor="middle" font-size="21" font-weight="bold" fill="#e65100">request_irq()</text>
  <text x="162" y="496" text-anchor="middle" font-size="17" fill="#555555">Register IRQ</text>
  <rect x="360" y="380" width="240" height="150" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="480" y="442" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b5e20">Handle IRQs</text>
  <text x="480" y="496" text-anchor="middle" font-size="17" fill="#555555">Interrupt work</text>
  <rect x="678" y="380" width="240" height="150" fill="#ffebee" stroke="#c62828" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="798" y="442" text-anchor="middle" font-size="21" font-weight="bold" fill="#b71c1c">free_irq()</text>
  <text x="798" y="496" text-anchor="middle" font-size="17" fill="#555555">Release IRQ</text>
  <!-- Arrows -->
  <line x1="282" y1="175" x2="360" y2="175" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="175" x2="678" y2="175" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="282" y1="455" x2="360" y2="455" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="455" x2="678" y2="455" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Note -->
  <rect x="1000" y="160" width="250" height="200" fill="url(#grad-surface)" stroke="#aaaaaa" stroke-width="1.5" rx="8"/>
  <text x="1125" y="220" text-anchor="middle" font-size="22" fill="#333333" font-weight="bold">Init / Exit</text>
  <text x="1125" y="276" text-anchor="middle" font-size="17" fill="#777777">Acquire in init</text>
  <text x="1125" y="312" text-anchor="middle" font-size="17" fill="#777777">Release in exit</text>
  <text x="1125" y="348" text-anchor="middle" font-size="17" fill="#777777">Reverse order</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="37.3333" y="88.8889" width="213.3333" height="133.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="144" y="144" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--primary-accent)">kmalloc()</text>
  <text x="144" y="192" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Allocate Memory</text>
  <rect x="320" y="88.8889" width="213.3333" height="133.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="426.6667" y="144" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--ok-accent)">Use Resource</text>
  <text x="426.6667" y="192" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Read/Write ops</text>
  <rect x="602.6667" y="88.8889" width="213.3333" height="133.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="709.3333" y="144" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--danger-accent)">kfree()</text>
  <text x="709.3333" y="192" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Free Memory</text>
  <rect x="37.3333" y="337.7778" width="213.3333" height="133.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="144" y="392.8889" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--warn-accent)">request_irq()</text>
  <text x="144" y="440.8889" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Register IRQ</text>
  <rect x="320" y="337.7778" width="213.3333" height="133.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="426.6667" y="392.8889" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--ok-accent)">Handle IRQs</text>
  <text x="426.6667" y="440.8889" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Interrupt work</text>
  <rect x="602.6667" y="337.7778" width="213.3333" height="133.3333" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="709.3333" y="392.8889" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--danger-accent)">free_irq()</text>
  <text x="709.3333" y="440.8889" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Release IRQ</text>
  <line x1="250.6667" y1="155.5556" x2="320" y2="155.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="533.3333" y1="155.5556" x2="602.6667" y2="155.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="250.6667" y1="404.4444" x2="320" y2="404.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="533.3333" y1="404.4444" x2="602.6667" y2="404.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="888.8889" y="142.2222" width="222.2222" height="177.7778" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6" />
  <text x="1000" y="195.5556" text-anchor="middle" font-size="19.5556" fill="var(--text)" font-weight="bold">Init / Exit</text>
  <text x="1000" y="245.3333" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Acquire in init</text>
  <text x="1000" y="277.3333" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Release in exit</text>
  <text x="1000" y="309.3333" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Reverse order</text>
</svg>
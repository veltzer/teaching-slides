<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="238.410596" height="202.325578" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)" />
  <text x="159.205298" y="123.627855" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--primary-accent)">kmalloc()</text>
  <text x="159.205298" y="196.465082" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)">Allocate Memory</text>
  <rect x="355.89404" y="40" width="238.410596" height="202.325578" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)" />
  <text x="475.099338" y="123.627855" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--ok-accent)">Use Resource</text>
  <text x="475.099338" y="196.465082" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)">Read/Write ops</text>
  <rect x="671.788079" y="40" width="238.410596" height="202.325578" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)" />
  <text x="790.993377" y="123.627855" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--danger-accent)">kfree()</text>
  <text x="790.993377" y="196.465082" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)">Free Memory</text>
  <rect x="40" y="417.674422" width="238.410596" height="202.325578" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)" />
  <text x="159.205298" y="501.302444" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--warn-accent)">request_irq()</text>
  <text x="159.205298" y="574.139672" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)">Register IRQ</text>
  <rect x="355.89404" y="417.674422" width="238.410596" height="202.325578" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)" />
  <text x="475.099338" y="501.302444" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--ok-accent)">Handle IRQs</text>
  <text x="475.099338" y="574.139672" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)">Interrupt work</text>
  <rect x="671.788079" y="417.674422" width="238.410596" height="202.325578" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.991989" filter="url(#shadow)" />
  <text x="790.993377" y="501.302444" text-anchor="middle" font-size="24.308433" font-weight="bold" fill="var(--danger-accent)">free_irq()</text>
  <text x="790.993377" y="574.139672" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)">Release IRQ</text>
  <line x1="278.410596" y1="141.162872" x2="355.89404" y2="141.162872" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="594.304636" y1="141.162872" x2="671.788079" y2="141.162872" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="278.410596" y1="518.837128" x2="355.89404" y2="518.837128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="594.304636" y1="518.837128" x2="671.788079" y2="518.837128" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="991.655629" y="120.930198" width="248.344371" height="269.767492" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="7.991989" />
  <text x="1115.827815" y="201.860562" text-anchor="middle" font-size="25.465938" fill="var(--text)" font-weight="bold">Init / Exit</text>
  <text x="1115.827815" y="277.395279" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)">Acquire in init</text>
  <text x="1115.827815" y="325.953431" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)">Release in exit</text>
  <text x="1115.827815" y="374.511583" text-anchor="middle" font-size="19.678274" fill="var(--text-muted)">Reverse order</text>
</svg>
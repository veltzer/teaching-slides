<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="539.619772" y="40" width="365.01889" height="118.367389" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)" />
  <text x="722.129278" y="114.571414" text-anchor="middle" font-size="34.859378" font-weight="bold" fill="var(--bg)">ip</text>
  <rect x="40" y="241.224532" width="223.574144" height="118.367389" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)" />
  <text x="151.787072" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)">ip addr</text>
  <rect x="284.106464" y="241.224532" width="223.574144" height="118.367389" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)" />
  <text x="395.893536" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)">ip link</text>
  <rect x="528.212928" y="241.224532" width="223.574144" height="118.367389" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)" />
  <text x="640" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)">ip route</text>
  <rect x="772.319392" y="241.224532" width="223.574144" height="118.367389" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)" />
  <text x="884.106464" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)">ip neigh</text>
  <rect x="1016.425856" y="241.224532" width="223.574144" height="118.367389" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)" />
  <text x="1128.212806" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)">ip netns</text>
  <line x1="722.129278" y1="158.367389" x2="151.787072" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="722.129278" y1="158.367389" x2="395.893536" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="722.129278" y1="158.367389" x2="640" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="722.129278" y1="158.367389" x2="884.106464" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="722.129278" y1="158.367389" x2="1128.212806" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333" />
  <text x="151.787072" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">show/add/del</text>
  <text x="151.787072" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">IP addresses</text>
  <text x="395.893536" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">set up/down</text>
  <text x="395.893536" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">MTU, flags</text>
  <text x="640" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">show/add/del</text>
  <text x="640" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">routing table</text>
  <text x="884.106464" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">ARP/NDP</text>
  <text x="884.106464" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">neighbors</text>
  <text x="1128.212806" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">network</text>
  <text x="1128.212806" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)">namespaces</text>
  <text x="722.129278" y="620" text-anchor="middle" font-size="20.915654" fill="var(--text-muted)">Replaces: ifconfig, route, arp, netstat</text>
</svg>
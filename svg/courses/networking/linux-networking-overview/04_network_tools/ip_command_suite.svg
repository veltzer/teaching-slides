<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="539.619772" y="40" width="365.01889" height="118.367389" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)"/>
  <text x="722.129278" y="114.571414" text-anchor="middle" font-size="34.859378" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">ip</text>
  <rect x="40" y="241.224532" width="223.574144" height="118.367389" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)"/>
  <text x="151.787072" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)" font-family="Arial, sans-serif">ip addr</text>
  <rect x="284.106464" y="241.224532" width="223.574144" height="118.367389" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)"/>
  <text x="395.893536" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)" font-family="Arial, sans-serif">ip link</text>
  <rect x="528.212928" y="241.224532" width="223.574144" height="118.367389" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)"/>
  <text x="640" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)" font-family="Arial, sans-serif">ip route</text>
  <rect x="772.319392" y="241.224532" width="223.574144" height="118.367389" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)"/>
  <text x="884.106464" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)" font-family="Arial, sans-serif">ip neigh</text>
  <rect x="1016.425856" y="241.224532" width="223.574144" height="118.367389" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.022626" filter="url(#shadow)"/>
  <text x="1128.212806" y="309.877547" text-anchor="middle" font-size="22.077597" fill="var(--primary-accent)" font-family="Arial, sans-serif">ip netns</text>
  <line x1="722.129278" y1="158.367389" x2="151.787072" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <line x1="722.129278" y1="158.367389" x2="395.893536" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <line x1="722.129278" y1="158.367389" x2="640" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <line x1="722.129278" y1="158.367389" x2="884.106464" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <line x1="722.129278" y1="158.367389" x2="1128.212806" y2="241.224532" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <text x="151.787072" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">show/add/del</text>
  <text x="151.787072" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">IP addresses</text>
  <text x="395.893536" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">set up/down</text>
  <text x="395.893536" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">MTU, flags</text>
  <text x="640" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">show/add/del</text>
  <text x="640" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">routing table</text>
  <text x="884.106464" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">ARP/NDP</text>
  <text x="884.106464" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">neighbors</text>
  <text x="1128.212806" y="411.673478" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">network</text>
  <text x="1128.212806" y="442.448917" text-anchor="middle" font-size="18.591633" fill="var(--text-muted)" font-family="Arial, sans-serif">namespaces</text>
  <text x="722.129278" y="620" text-anchor="middle" font-size="20.915654" fill="var(--text-muted)" font-family="Arial, sans-serif">Replaces: ifconfig, route, arp, netstat</text>
</svg>

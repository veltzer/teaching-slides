<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="218.729097" height="186.731692" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)" />
  <text x="149.364548" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--primary-accent)">ping</text>
  <text x="149.364548" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)">connectivity</text>
  <rect x="298.862876" y="40" width="218.729097" height="186.731692" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)" />
  <text x="408.227425" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--info-accent)">traceroute</text>
  <text x="408.227425" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)">path analysis</text>
  <rect x="557.725753" y="40" width="218.729097" height="186.731692" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)" />
  <text x="667.090301" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--warn-accent)">nmap</text>
  <text x="667.090301" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)">port scanning</text>
  <rect x="816.588522" y="40" width="218.729097" height="186.731692" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)" />
  <text x="925.953177" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--ok-accent)">tcpdump</text>
  <text x="925.953177" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)">packet capture</text>
  <rect x="1075.451505" y="40" width="164.548495" height="186.731692" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)" />
  <text x="1157.725753" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--danger-accent)">ss</text>
  <text x="1157.725753" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)">socket info</text>
  <line x1="258.729097" y1="133.365934" x2="298.862876" y2="133.365934" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="517.591866" y1="133.365934" x2="557.725753" y2="133.365934" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="776.454849" y1="133.365934" x2="816.588522" y2="133.365934" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="1035.317726" y1="133.365934" x2="1075.451505" y2="133.365934" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="126.287625" y="345.561048" width="1027.424749" height="164.097522" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.225552" filter="url(#shadow)" />
  <text x="640" y="447.414731" text-anchor="middle" font-size="25.018836" fill="var(--text)">L3 reachable? --&gt; Route OK? --&gt; Port open? --&gt; Traffic OK? --&gt; Sockets OK?</text>
  <text x="640" y="620" text-anchor="middle" font-size="21.444698" fill="var(--text-muted)">Systematic approach: test layer by layer, bottom to top</text>
</svg>
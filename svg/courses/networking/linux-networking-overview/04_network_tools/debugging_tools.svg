<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="218.729097" height="186.731692" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)"/>
  <text x="149.364548" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">ping</text>
  <text x="149.364548" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)" font-family="Arial, sans-serif">connectivity</text>
  <rect x="298.862876" y="40" width="218.729097" height="186.731692" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)"/>
  <text x="408.227425" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">traceroute</text>
  <text x="408.227425" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)" font-family="Arial, sans-serif">path analysis</text>
  <rect x="557.725753" y="40" width="218.729097" height="186.731692" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)"/>
  <text x="667.090301" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">nmap</text>
  <text x="667.090301" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)" font-family="Arial, sans-serif">port scanning</text>
  <rect x="816.588522" y="40" width="218.729097" height="186.731692" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)"/>
  <text x="925.953177" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">tcpdump</text>
  <text x="925.953177" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)" font-family="Arial, sans-serif">packet capture</text>
  <rect x="1075.451505" y="40" width="164.548495" height="186.731692" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="8.225552" filter="url(#shadow)"/>
  <text x="1157.725753" y="113.560837" text-anchor="middle" font-size="22.636032" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">ss</text>
  <text x="1157.725753" y="181.46335" text-anchor="middle" font-size="20.253364" fill="var(--text-muted)" font-family="Arial, sans-serif">socket info</text>
  <line x1="258.729097" y1="133.365934" x2="298.862876" y2="133.365934" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="517.591866" y1="133.365934" x2="557.725753" y2="133.365934" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="776.454849" y1="133.365934" x2="816.588522" y2="133.365934" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="1035.317726" y1="133.365934" x2="1075.451505" y2="133.365934" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="126.287625" y="345.561048" width="1027.424749" height="164.097522" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="8.225552"/>
  <text x="640" y="447.414731" text-anchor="middle" font-size="25.018836" fill="var(--text)" font-family="Arial, sans-serif">L3 reachable? --&gt; Route OK? --&gt; Port open? --&gt; Traffic OK? --&gt; Sockets OK?</text>
  <text x="640" y="620" text-anchor="middle" font-size="21.444698" fill="var(--text-muted)" font-family="Arial, sans-serif">Systematic approach: test layer by layer, bottom to top</text>
</svg>

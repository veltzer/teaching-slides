<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Three column boxes -->
  <rect x="60" y="100" width="345" height="260" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="60" y="100" width="345" height="52" fill="url(#grad-accent)" rx="10"/>
  <rect x="60" y="140" width="345" height="12" fill="url(#grad-accent)"/>
  <text x="232" y="136" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">User Space</text>
  <text x="232" y="208" text-anchor="middle" font-size="18" fill="#555555">iptables / nftables</text>
  <text x="232" y="252" text-anchor="middle" font-size="18" fill="#555555">libnetfilter_queue</text>
  <text x="232" y="296" text-anchor="middle" font-size="18" fill="#555555">conntrack CLI</text>
  <rect x="467" y="100" width="345" height="260" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="467" y="100" width="345" height="52" fill="url(#grad-accent)" rx="10"/>
  <rect x="467" y="140" width="345" height="12" fill="url(#grad-accent)"/>
  <text x="639" y="136" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">Netfilter Hooks</text>
  <text x="639" y="208" text-anchor="middle" font-size="18" fill="#555555">PRE/POST ROUTING</text>
  <text x="639" y="252" text-anchor="middle" font-size="18" fill="#555555">INPUT / OUTPUT</text>
  <text x="639" y="296" text-anchor="middle" font-size="18" fill="#555555">FORWARD</text>
  <rect x="874" y="100" width="345" height="260" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="874" y="100" width="345" height="52" fill="url(#grad-accent)" rx="10"/>
  <rect x="874" y="140" width="345" height="12" fill="url(#grad-accent)"/>
  <text x="1046" y="136" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">Tables</text>
  <text x="1046" y="208" text-anchor="middle" font-size="18" fill="#555555">filter (default)</text>
  <text x="1046" y="252" text-anchor="middle" font-size="18" fill="#555555">nat / mangle</text>
  <text x="1046" y="296" text-anchor="middle" font-size="18" fill="#555555">raw / security</text>
  <!-- Arrows -->
  <line x1="405" y1="228" x2="467" y2="228" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="812" y1="228" x2="874" y2="228" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Info box -->
  <rect x="60" y="448" width="1160" height="152" fill="#fff8e1" stroke="#f57c00" stroke-width="1.5" rx="10" stroke-dasharray="10,6" filter="url(#shadow)"/>
  <text x="640" y="516" text-anchor="middle" font-size="21" fill="#333333">Each hook point invokes registered callback functions (nf_hook_ops)</text>
  <text x="640" y="564" text-anchor="middle" font-size="18" fill="#777777">Verdicts: NF_ACCEPT | NF_DROP | NF_QUEUE | NF_STOLEN | NF_REPEAT</text>
</svg>

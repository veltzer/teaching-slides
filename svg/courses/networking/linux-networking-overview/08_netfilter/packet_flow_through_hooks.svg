<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="88.3333" text-anchor="middle" font-size="20.8566" font-weight="bold" fill="var(--text)">Packet Flow Through Netfilter Hooks</text>
  <rect x="58.75" y="246.2223" width="133.125" height="95.0556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="125.3125" y="302.6111" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--primary-accent)">NIC In</text>
  <rect x="227.5" y="246.2223" width="163.125" height="95.0556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="309.0625" y="288.1111" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--warn-accent)">PRE-</text>
  <text x="309.0625" y="320.3333" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--warn-accent)">ROUTING</text>
  <rect x="426.25" y="147.9444" width="123.75" height="80.5556" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="488.125" y="196.2777" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--info-accent)">Routing</text>
  <rect x="426.25" y="371.8889" width="142.5" height="80.5556" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="497.5" y="420.2223" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--danger-accent)">FORWARD</text>
  <rect x="585.625" y="246.2223" width="121.875" height="95.0556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="646.5625" y="302.6111" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--ok-accent)">INPUT</text>
  <rect x="741.25" y="246.2223" width="121.875" height="95.0556" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="802.1875" y="302.6111" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--info-accent)">Local</text>
  <rect x="898.75" y="246.2223" width="121.875" height="95.0556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="959.6875" y="302.6111" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">OUTPUT</text>
  <rect x="898.75" y="371.8889" width="163.125" height="80.5556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="980.3125" y="412.1667" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--warn-accent)">POSTROUTING</text>
  <rect x="1101.25" y="246.2223" width="114.375" height="95.0556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1158.4374" y="302.6111" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--primary-accent)">NIC Out</text>
  <line x1="191.875" y1="293.75" x2="227.5" y2="293.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="390.6249" y1="276.8333" x2="426.25" y2="202.7223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="488.125" y1="228.5" x2="585.625" y2="281.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="488.125" y1="228.5" x2="490" y2="371.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="707.5" y1="293.75" x2="741.25" y2="293.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="863.1249" y1="293.75" x2="898.75" y2="293.75" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="568.75" y1="412.1667" x2="898.75" y2="412.1667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1020.625" y1="293.75" x2="1020.625" y2="371.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1061.875" y1="412.1667" x2="1101.25" y2="313.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="545.8889" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">5 hook points intercept packets at different stages of processing</text>
</svg>
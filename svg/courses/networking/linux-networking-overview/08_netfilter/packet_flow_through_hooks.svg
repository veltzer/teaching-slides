<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="642.917342" y="40" text-anchor="middle" font-size="23.915693" font-weight="bold" fill="var(--text)">Packet Flow Through Netfilter Hooks</text>
  <rect x="40" y="240.140966" width="138.08752" height="120.493002" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.880036" filter="url(#shadow)" />
  <text x="109.04376" y="311.61972" text-anchor="middle" font-size="18.933286" font-weight="bold" fill="var(--primary-accent)">NIC In</text>
  <rect x="215.040519" y="240.140966" width="169.205835" height="120.493002" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.880036" filter="url(#shadow)" />
  <text x="299.643436" y="293.23944" text-anchor="middle" font-size="16.940369" font-weight="bold" fill="var(--warn-accent)">PRE-</text>
  <text x="299.643436" y="334.084478" text-anchor="middle" font-size="16.940369" font-weight="bold" fill="var(--warn-accent)">ROUTING</text>
  <rect x="421.199352" y="115.563359" width="128.363047" height="102.112722" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.880036" filter="url(#shadow)" />
  <text x="485.380875" y="176.830916" text-anchor="middle" font-size="16.940369" font-weight="bold" fill="var(--info-accent)">Routing</text>
  <rect x="421.199352" y="399.436641" width="147.811994" height="102.112722" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6.880036" filter="url(#shadow)" />
  <text x="495.105348" y="460.704325" text-anchor="middle" font-size="16.940369" font-weight="bold" fill="var(--danger-accent)">FORWARD</text>
  <rect x="586.515397" y="240.140966" width="126.418152" height="120.493002" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6.880036" filter="url(#shadow)" />
  <text x="649.724473" y="311.61972" text-anchor="middle" font-size="16.940369" font-weight="bold" fill="var(--ok-accent)">INPUT</text>
  <rect x="747.941653" y="240.140966" width="126.418152" height="120.493002" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6.880036" filter="url(#shadow)" />
  <text x="811.150729" y="311.61972" text-anchor="middle" font-size="16.940369" font-weight="bold" fill="var(--info-accent)">Local</text>
  <rect x="911.312804" y="240.140966" width="126.418152" height="120.493002" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.880036" filter="url(#shadow)" />
  <text x="974.52188" y="311.61972" text-anchor="middle" font-size="16.940369" font-weight="bold" fill="var(--primary-accent)">OUTPUT</text>
  <rect x="911.312804" y="399.436641" width="169.205835" height="102.112722" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6.880036" filter="url(#shadow)" />
  <text x="995.915721" y="450.493002" text-anchor="middle" font-size="16.940369" font-weight="bold" fill="var(--warn-accent)">POSTROUTING</text>
  <rect x="1121.361426" y="240.140966" width="118.638574" height="120.493002" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6.880036" filter="url(#shadow)" />
  <text x="1180.680609" y="311.61972" text-anchor="middle" font-size="16.940369" font-weight="bold" fill="var(--primary-accent)">NIC Out</text>
  <line x1="178.08752" y1="300.387341" x2="215.040519" y2="300.387341" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="384.24625" y1="278.943639" x2="421.199352" y2="185.000127" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="485.380875" y1="217.676081" x2="586.515397" y2="285.070483" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="485.380875" y1="217.676081" x2="487.32577" y2="399.436641" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="712.933549" y1="300.387341" x2="747.941653" y2="300.387341" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="874.359702" y1="300.387341" x2="911.312804" y2="300.387341" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="569.011345" y1="450.493002" x2="911.312804" y2="450.493002" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1037.730956" y1="300.387341" x2="1037.730956" y2="399.436641" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1080.518639" y1="450.493002" x2="1121.361426" y2="325.915522" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="642.917342" y="620" text-anchor="middle" font-size="17.936827" fill="var(--text-muted)">5 hook points intercept packets at different stages of processing</text>
</svg>
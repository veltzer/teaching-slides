<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="60" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">Packet Flow Through Netfilter Hooks</text>
  <!-- NIC In -->
  <rect x="20" y="256" width="142" height="118" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="91" y="326" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d47a1">NIC In</text>
  <!-- PREROUTING -->
  <rect x="200" y="256" width="174" height="118" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="287" y="308" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">PRE-</text>
  <text x="287" y="348" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">ROUTING</text>
  <!-- Routing (top) -->
  <rect x="412" y="134" width="132" height="100" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="478" y="194" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a148c">Routing</text>
  <!-- FORWARD (bottom) -->
  <rect x="412" y="412" width="152" height="100" fill="#ffebee" stroke="#c62828" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="488" y="472" text-anchor="middle" font-size="17" font-weight="bold" fill="#b71c1c">FORWARD</text>
  <!-- INPUT -->
  <rect x="582" y="256" width="130" height="118" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="647" y="326" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b5e20">INPUT</text>
  <!-- Local -->
  <rect x="748" y="256" width="130" height="118" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="813" y="326" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a148c">Local</text>
  <!-- OUTPUT -->
  <rect x="916" y="256" width="130" height="118" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="981" y="326" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d47a1">OUTPUT</text>
  <!-- POSTROUTING -->
  <rect x="916" y="412" width="174" height="100" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="1003" y="462" text-anchor="middle" font-size="17" font-weight="bold" fill="#e65100">POSTROUTING</text>
  <!-- NIC Out -->
  <rect x="1132" y="256" width="122" height="118" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="1193" y="326" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d47a1">NIC Out</text>
  <!-- Arrows -->
  <line x1="162" y1="315" x2="200" y2="315" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="374" y1="294" x2="412" y2="202" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="478" y1="234" x2="582" y2="300" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="478" y1="234" x2="480" y2="412" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="712" y1="315" x2="748" y2="315" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="878" y1="315" x2="916" y2="315" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="564" y1="462" x2="916" y2="462" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1046" y1="315" x2="1046" y2="412" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1090" y1="462" x2="1132" y2="340" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="640" y="628" text-anchor="middle" font-size="18" fill="#777777">5 hook points intercept packets at different stages of processing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="183.239023867816" width="138.08752" height="138.542555159073" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.377367105323" filter="url(#shadow)"/>
  <text x="109.04376" y="265.425118117064" text-anchor="middle" font-size="20.301899776698" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">NIC In</text>
  <rect x="215.040519" y="183.239023867816" width="169.205835" height="138.542555159073" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.377367105323" filter="url(#shadow)"/>
  <text x="299.643436" y="244.291517713123" text-anchor="middle" font-size="18.164922540033" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">PRE-</text>
  <text x="299.643436" y="291.255041205462" text-anchor="middle" font-size="18.164922540033" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">ROUTING</text>
  <rect x="421.199352" y="40" width="128.363047" height="117.408954755132" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.377367105323" filter="url(#shadow)"/>
  <text x="485.380875" y="110.445285238508" text-anchor="middle" font-size="18.164922540033" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Routing</text>
  <rect x="421.199352" y="366.396796302511" width="147.811994" height="117.408954755132" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.377367105323" filter="url(#shadow)"/>
  <text x="495.105348" y="436.842227565305" text-anchor="middle" font-size="18.164922540033" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">FORWARD</text>
  <rect x="586.515397" y="183.239023867816" width="126.418152" height="138.542555159073" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.377367105323" filter="url(#shadow)"/>
  <text x="649.724473" y="265.425118117064" text-anchor="middle" font-size="18.164922540033" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">INPUT</text>
  <rect x="747.941653" y="183.239023867816" width="126.418152" height="138.542555159073" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.377367105323" filter="url(#shadow)"/>
  <text x="811.150729" y="265.425118117064" text-anchor="middle" font-size="18.164922540033" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Local</text>
  <rect x="911.312804" y="183.239023867816" width="126.418152" height="138.542555159073" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.377367105323" filter="url(#shadow)"/>
  <text x="974.52188" y="265.425118117064" text-anchor="middle" font-size="18.164922540033" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">OUTPUT</text>
  <rect x="911.312804" y="366.396796302511" width="169.205835" height="117.408954755132" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.377367105323" filter="url(#shadow)"/>
  <text x="995.915721" y="425.101273680077" text-anchor="middle" font-size="18.164922540033" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">POSTROUTING</text>
  <rect x="1121.361426" y="183.239023867816" width="118.638574" height="138.542555159073" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.377367105323" filter="url(#shadow)"/>
  <text x="1180.680609" y="265.425118117064" text-anchor="middle" font-size="18.164922540033" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">NIC Out</text>
  <line x1="178.08752" y1="252.510156572865" x2="215.040519" y2="252.510156572865" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="384.24625" y1="227.854241143438" x2="421.199352" y2="119.838223805792" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485.380875" y1="157.408954755132" x2="586.515397" y2="234.89887119441" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485.380875" y1="157.408954755132" x2="487.32577" y2="366.396796302511" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="712.933549" y1="252.510156572865" x2="747.941653" y2="252.510156572865" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="874.359702" y1="252.510156572865" x2="911.312804" y2="252.510156572865" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="569.011345" y1="425.101273680077" x2="911.312804" y2="425.101273680077" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1037.730956" y1="252.510156572865" x2="1037.730956" y2="366.396796302511" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080.518639" y1="425.101273680077" x2="1121.361426" y2="281.862395836547" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="642.917342" y="620" text-anchor="middle" font-size="19.233410622223" fill="var(--text-muted)" font-family="Arial, sans-serif">5 hook points intercept packets at different stages of processing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="640" y="94.7777" text-anchor="middle" font-size="22.5947" font-weight="bold" fill="var(--text)">sk_buff Memory Layout</text>
  <rect x="139.375" y="136.6667" width="1001.2499" height="111.1667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="640" y="202.7223" text-anchor="middle" font-size="18.2496" fill="var(--text-muted)">Linear data buffer</text>
  <line x1="199.375" y1="136.6667" x2="199.375" y2="247.8333" stroke="var(--danger-border)" stroke-width="2" />
  <text x="199.375" y="286.5" text-anchor="middle" font-size="16.5115" fill="var(--danger-accent)" font-weight="bold">head</text>
  <line x1="379.375" y1="136.6667" x2="379.375" y2="247.8333" stroke="var(--primary-border)" stroke-width="2" />
  <text x="379.375" y="286.5" text-anchor="middle" font-size="16.5115" fill="var(--primary-accent)" font-weight="bold">data</text>
  <line x1="899.6875" y1="136.6667" x2="899.6875" y2="247.8333" stroke="var(--ok-border)" stroke-width="2" />
  <text x="899.6875" y="286.5" text-anchor="middle" font-size="16.5115" fill="var(--ok-accent)" font-weight="bold">tail</text>
  <line x1="1079.6875" y1="136.6667" x2="1079.6875" y2="247.8333" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1079.6875" y="286.5" text-anchor="middle" font-size="16.5115" fill="var(--warn-accent)" font-weight="bold">end</text>
  <rect x="199.375" y="156" width="180" height="72.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="289.3749" y="199.5" text-anchor="middle" font-size="16.5115" fill="var(--warn-accent)">headroom</text>
  <rect x="379.375" y="156" width="520.3125" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="639.0625" y="199.5" text-anchor="middle" font-size="18.2496" font-weight="bold" fill="var(--ok-accent)">Packet Data (len)</text>
  <rect x="899.6875" y="156" width="180" height="72.5" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="989.6874" y="199.5" text-anchor="middle" font-size="16.5115" fill="var(--info-accent)">tailroom</text>
  <text x="289.3749" y="378.3333" text-anchor="middle" font-size="16.5115" fill="var(--text)">skb_push()</text>
  <line x1="289.3749" y1="394.4444" x2="289.3749" y2="458.8889" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="289.3749" y="492.7223" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Add to head</text>
  <text x="640" y="378.3333" text-anchor="middle" font-size="16.5115" fill="var(--text)">skb_pull()</text>
  <line x1="640" y1="394.4444" x2="640" y2="458.8889" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="640" y="492.7223" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Remove from head</text>
  <text x="989.6874" y="378.3333" text-anchor="middle" font-size="16.5115" fill="var(--text)">skb_put()</text>
  <line x1="989.6874" y1="394.4444" x2="989.6874" y2="458.8889" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="989.6874" y="492.7223" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Add to tail</text>
</svg>
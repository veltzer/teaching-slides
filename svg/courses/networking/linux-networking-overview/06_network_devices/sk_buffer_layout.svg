<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="68" text-anchor="middle" font-size="26" font-weight="bold" fill="#333333">sk_buff Memory Layout</text>
  <!-- Main buffer bar -->
  <rect x="106" y="120" width="1068" height="138" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="6" filter="url(#shadow)"/>
  <text x="640" y="202" text-anchor="middle" font-size="21" fill="#777777">Linear data buffer</text>
  <!-- Boundary markers -->
  <line x1="170" y1="120" x2="170" y2="258" stroke="#c62828" stroke-width="3"/>
  <text x="170" y="306" text-anchor="middle" font-size="19" fill="#c62828" font-weight="bold">head</text>
  <line x1="362" y1="120" x2="362" y2="258" stroke="#1565c0" stroke-width="3"/>
  <text x="362" y="306" text-anchor="middle" font-size="19" fill="#1565c0" font-weight="bold">data</text>
  <line x1="917" y1="120" x2="917" y2="258" stroke="#2e7d32" stroke-width="3"/>
  <text x="917" y="306" text-anchor="middle" font-size="19" fill="#2e7d32" font-weight="bold">tail</text>
  <line x1="1109" y1="120" x2="1109" y2="258" stroke="#e65100" stroke-width="3"/>
  <text x="1109" y="306" text-anchor="middle" font-size="19" fill="#e65100" font-weight="bold">end</text>
  <!-- Segments -->
  <rect x="170" y="144" width="192" height="90" fill="#fff8e1" stroke="#f57c00" stroke-width="1.5" rx="4"/>
  <text x="266" y="198" text-anchor="middle" font-size="19" fill="#e65100">headroom</text>
  <rect x="362" y="144" width="555" height="90" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
  <text x="639" y="198" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b5e20">Packet Data (len)</text>
  <rect x="917" y="144" width="192" height="90" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" rx="4"/>
  <text x="1013" y="198" text-anchor="middle" font-size="19" fill="#4a148c">tailroom</text>
  <!-- Operation labels + arrows -->
  <text x="266" y="420" text-anchor="middle" font-size="19" fill="#333333">skb_push()</text>
  <line x1="266" y1="440" x2="266" y2="520" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="266" y="562" text-anchor="middle" font-size="17" fill="#777777">Add to head</text>
  <text x="640" y="420" text-anchor="middle" font-size="19" fill="#333333">skb_pull()</text>
  <line x1="640" y1="440" x2="640" y2="520" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="562" text-anchor="middle" font-size="17" fill="#777777">Remove from head</text>
  <text x="1013" y="420" text-anchor="middle" font-size="19" fill="#333333">skb_put()</text>
  <line x1="1013" y1="440" x2="1013" y2="520" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1013" y="562" text-anchor="middle" font-size="17" fill="#777777">Add to tail</text>
</svg>

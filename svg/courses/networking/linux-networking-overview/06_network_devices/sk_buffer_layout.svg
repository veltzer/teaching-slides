<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="568.8889" y="60.4444" text-anchor="middle" font-size="23.1111" font-weight="bold" fill="var(--text)">sk_buff Memory Layout</text>
  <rect x="94.2222" y="106.6667" width="949.3333" height="122.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="568.8889" y="179.5556" text-anchor="middle" font-size="18.6667" fill="var(--text-muted)">Linear data buffer</text>
  <line x1="151.1111" y1="106.6667" x2="151.1111" y2="229.3333" stroke="var(--danger-border)" stroke-width="2" />
  <text x="151.1111" y="272" text-anchor="middle" font-size="16.8889" fill="var(--danger-accent)" font-weight="bold">head</text>
  <line x1="321.7778" y1="106.6667" x2="321.7778" y2="229.3333" stroke="var(--primary-border)" stroke-width="2" />
  <text x="321.7778" y="272" text-anchor="middle" font-size="16.8889" fill="var(--primary-accent)" font-weight="bold">data</text>
  <line x1="815.1111" y1="106.6667" x2="815.1111" y2="229.3333" stroke="var(--ok-border)" stroke-width="2" />
  <text x="815.1111" y="272" text-anchor="middle" font-size="16.8889" fill="var(--ok-accent)" font-weight="bold">tail</text>
  <line x1="985.7778" y1="106.6667" x2="985.7778" y2="229.3333" stroke="var(--warn-border)" stroke-width="2" />
  <text x="985.7778" y="272" text-anchor="middle" font-size="16.8889" fill="var(--warn-accent)" font-weight="bold">end</text>
  <rect x="151.1111" y="128" width="170.6667" height="80" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="236.4444" y="176" text-anchor="middle" font-size="16.8889" fill="var(--warn-accent)">headroom</text>
  <rect x="321.7778" y="128" width="493.3333" height="80" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="568" y="176" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--ok-accent)">Packet Data (len)</text>
  <rect x="815.1111" y="128" width="170.6667" height="80" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="900.4444" y="176" text-anchor="middle" font-size="16.8889" fill="var(--info-accent)">tailroom</text>
  <text x="236.4444" y="373.3333" text-anchor="middle" font-size="16.8889" fill="var(--text)">skb_push()</text>
  <line x1="236.4444" y1="391.1111" x2="236.4444" y2="462.2222" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="236.4444" y="499.5556" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Add to head</text>
  <text x="568.8889" y="373.3333" text-anchor="middle" font-size="16.8889" fill="var(--text)">skb_pull()</text>
  <line x1="568.8889" y1="391.1111" x2="568.8889" y2="462.2222" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="568.8889" y="499.5556" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Remove from head</text>
  <text x="900.4444" y="373.3333" text-anchor="middle" font-size="16.8889" fill="var(--text)">skb_put()</text>
  <line x1="900.4444" y1="391.1111" x2="900.4444" y2="462.2222" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="900.4444" y="499.5556" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Add to tail</text>
</svg>
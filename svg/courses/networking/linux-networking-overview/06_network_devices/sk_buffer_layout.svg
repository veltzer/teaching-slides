<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="640.00006" y="40" text-anchor="middle" font-size="29.862671" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">sk_buff Memory Layout</text>
  <rect x="40" y="101.05277" width="1200" height="162.024277" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.930002" filter="url(#shadow)"/>
  <text x="640.00006" y="197.3281" text-anchor="middle" font-size="24.119895" fill="var(--text-muted)" font-family="Arial, sans-serif">Linear data buffer</text>
  <line x1="111.91012" y1="101.05277" x2="111.91012" y2="263.076901" stroke="var(--danger-border)" stroke-width="2" />
  <text x="111.91012" y="319.433203" text-anchor="middle" font-size="21.822706" fill="var(--danger-accent)" font-weight="bold" font-family="Arial, sans-serif">head</text>
  <line x1="327.640478" y1="101.05277" x2="327.640478" y2="263.076901" stroke="var(--primary-border)" stroke-width="2" />
  <text x="327.640478" y="319.433203" text-anchor="middle" font-size="21.822706" fill="var(--primary-accent)" font-weight="bold" font-family="Arial, sans-serif">data</text>
  <line x1="951.236046" y1="101.05277" x2="951.236046" y2="263.076901" stroke="var(--ok-border)" stroke-width="2" />
  <text x="951.236046" y="319.433203" text-anchor="middle" font-size="21.822706" fill="var(--ok-accent)" font-weight="bold" font-family="Arial, sans-serif">tail</text>
  <line x1="1166.966405" y1="101.05277" x2="1166.966405" y2="263.076901" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1166.966405" y="319.433203" text-anchor="middle" font-size="21.822706" fill="var(--warn-accent)" font-weight="bold" font-family="Arial, sans-serif">end</text>
  <rect x="111.91012" y="129.230848" width="215.730359" height="105.667975" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.930002" filter="url(#shadow)"/>
  <text x="219.775179" y="192.631633" text-anchor="middle" font-size="21.822706" fill="var(--warn-accent)" font-family="Arial, sans-serif">headroom</text>
  <rect x="327.640478" y="129.230848" width="623.595568" height="105.667975" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.930002" filter="url(#shadow)"/>
  <text x="638.876464" y="192.631633" text-anchor="middle" font-size="24.119895" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Packet Data (len)</text>
  <rect x="951.236046" y="129.230848" width="215.730359" height="105.667975" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.930002" filter="url(#shadow)"/>
  <text x="1059.101106" y="192.631633" text-anchor="middle" font-size="21.822706" fill="var(--info-accent)" font-family="Arial, sans-serif">tailroom</text>
  <text x="219.775179" y="453.279255" text-anchor="middle" font-size="21.822706" fill="var(--text)" font-family="Arial, sans-serif">skb_push()</text>
  <line x1="219.775179" y1="476.761011" x2="219.775179" y2="570.688181" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="219.775179" y="620" text-anchor="middle" font-size="19.525648" fill="var(--text-muted)" font-family="Arial, sans-serif">Add to head</text>
  <text x="640.00006" y="453.279255" text-anchor="middle" font-size="21.822706" fill="var(--text)" font-family="Arial, sans-serif">skb_pull()</text>
  <line x1="640.00006" y1="476.761011" x2="640.00006" y2="570.688181" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="640.00006" y="620" text-anchor="middle" font-size="19.525648" fill="var(--text-muted)" font-family="Arial, sans-serif">Remove from head</text>
  <text x="1059.101106" y="453.279255" text-anchor="middle" font-size="21.822706" fill="var(--text)" font-family="Arial, sans-serif">skb_put()</text>
  <line x1="1059.101106" y1="476.761011" x2="1059.101106" y2="570.688181" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="1059.101106" y="620" text-anchor="middle" font-size="19.525648" fill="var(--text-muted)" font-family="Arial, sans-serif">Add to tail</text>
</svg>
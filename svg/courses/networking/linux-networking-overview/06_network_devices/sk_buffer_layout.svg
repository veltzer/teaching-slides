<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640.00006" y="40" text-anchor="middle" font-size="29.862671" font-weight="bold" fill="var(--text)">sk_buff Memory Layout</text>
  <rect x="40" y="101.05277" width="1200" height="162.024277" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.930002" filter="url(#shadow)" />
  <text x="640.00006" y="197.3281" text-anchor="middle" font-size="24.119895" fill="var(--text-muted)">Linear data buffer</text>
  <line x1="111.91012" y1="101.05277" x2="111.91012" y2="263.076901" stroke="var(--danger-border)" stroke-width="2" />
  <text x="111.91012" y="319.433203" text-anchor="middle" font-size="21.822706" fill="var(--danger-accent)" font-weight="bold">head</text>
  <line x1="327.640478" y1="101.05277" x2="327.640478" y2="263.076901" stroke="var(--primary-border)" stroke-width="2" />
  <text x="327.640478" y="319.433203" text-anchor="middle" font-size="21.822706" fill="var(--primary-accent)" font-weight="bold">data</text>
  <line x1="951.236046" y1="101.05277" x2="951.236046" y2="263.076901" stroke="var(--ok-border)" stroke-width="2" />
  <text x="951.236046" y="319.433203" text-anchor="middle" font-size="21.822706" fill="var(--ok-accent)" font-weight="bold">tail</text>
  <line x1="1166.966405" y1="101.05277" x2="1166.966405" y2="263.076901" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1166.966405" y="319.433203" text-anchor="middle" font-size="21.822706" fill="var(--warn-accent)" font-weight="bold">end</text>
  <rect x="111.91012" y="129.230848" width="215.730359" height="105.667975" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.930002" filter="url(#shadow)"/>
  <text x="219.775179" y="192.631633" text-anchor="middle" font-size="21.822706" fill="var(--warn-accent)">headroom</text>
  <rect x="327.640478" y="129.230848" width="623.595568" height="105.667975" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.930002" filter="url(#shadow)"/>
  <text x="638.876464" y="192.631633" text-anchor="middle" font-size="24.119895" font-weight="bold" fill="var(--ok-accent)">Packet Data (len)</text>
  <rect x="951.236046" y="129.230848" width="215.730359" height="105.667975" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.930002" filter="url(#shadow)"/>
  <text x="1059.101106" y="192.631633" text-anchor="middle" font-size="21.822706" fill="var(--info-accent)">tailroom</text>
  <text x="219.775179" y="453.279255" text-anchor="middle" font-size="21.822706" fill="var(--text)">skb_push()</text>
  <line x1="219.775179" y1="476.761011" x2="219.775179" y2="570.688181" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="219.775179" y="620" text-anchor="middle" font-size="19.525648" fill="var(--text-muted)">Add to head</text>
  <text x="640.00006" y="453.279255" text-anchor="middle" font-size="21.822706" fill="var(--text)">skb_pull()</text>
  <line x1="640.00006" y1="476.761011" x2="640.00006" y2="570.688181" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="640.00006" y="620" text-anchor="middle" font-size="19.525648" fill="var(--text-muted)">Remove from head</text>
  <text x="1059.101106" y="453.279255" text-anchor="middle" font-size="21.822706" fill="var(--text)">skb_put()</text>
  <line x1="1059.101106" y1="476.761011" x2="1059.101106" y2="570.688181" stroke="var(--text)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="1059.101106" y="620" text-anchor="middle" font-size="19.525648" fill="var(--text-muted)">Add to tail</text>
</svg>
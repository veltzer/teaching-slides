<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="68" text-anchor="middle" font-size="26" font-weight="bold" fill="#333333">Interrupt Mitigation: IRQ to NAPI Polling</text>
  <!-- Pipeline boxes -->
  <rect x="60" y="130" width="218" height="168" fill="#ffebee" stroke="#c62828" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="169" y="198" text-anchor="middle" font-size="21" font-weight="bold" fill="#b71c1c">HW IRQ</text>
  <text x="169" y="256" text-anchor="middle" font-size="17" fill="#777777">Packet arrives</text>
  <rect x="344" y="130" width="218" height="168" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="453" y="198" text-anchor="middle" font-size="21" font-weight="bold" fill="#e65100">Disable IRQ</text>
  <text x="453" y="256" text-anchor="middle" font-size="17" fill="#777777">Stop interrupts</text>
  <rect x="628" y="130" width="218" height="168" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="737" y="190" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b5e20">NAPI Poll</text>
  <text x="737" y="240" text-anchor="middle" font-size="17" fill="#777777">napi_schedule()</text>
  <text x="737" y="278" text-anchor="middle" font-size="17" fill="#777777">batch process</text>
  <rect x="912" y="130" width="218" height="168" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="1021" y="198" text-anchor="middle" font-size="21" font-weight="bold" fill="#0d47a1">Re-enable IRQ</text>
  <text x="1021" y="256" text-anchor="middle" font-size="17" fill="#777777">napi_complete()</text>
  <!-- Arrows -->
  <line x1="278" y1="214" x2="344" y2="214" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="562" y1="214" x2="628" y2="214" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="846" y1="214" x2="912" y2="214" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Benefit box -->
  <rect x="213" y="386" width="854" height="185" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" rx="10" stroke-dasharray="10,6" filter="url(#shadow)"/>
  <text x="640" y="460" text-anchor="middle" font-size="21" fill="#333333">Benefit: Process multiple packets per interrupt (budget)</text>
  <text x="640" y="524" text-anchor="middle" font-size="17" fill="#777777">Reduces CPU overhead from per-packet interrupt handling</text>
</svg>

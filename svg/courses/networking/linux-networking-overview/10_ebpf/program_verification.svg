<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Four pipeline boxes -->
  <rect x="42" y="136" width="260" height="185" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="172" y="206" text-anchor="middle" font-size="21" font-weight="bold" fill="#0d47a1">BPF Bytecode</text>
  <text x="172" y="264" text-anchor="middle" font-size="17" fill="#777777">ELF .o file</text>
  <rect x="358" y="136" width="260" height="185" fill="#ffebee" stroke="#c62828" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="488" y="206" text-anchor="middle" font-size="21" font-weight="bold" fill="#c62828">Verifier</text>
  <text x="488" y="264" text-anchor="middle" font-size="17" fill="#777777">DAG analysis</text>
  <rect x="674" y="136" width="260" height="185" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="804" y="206" text-anchor="middle" font-size="21" font-weight="bold" fill="#e65100">JIT Compiler</text>
  <text x="804" y="264" text-anchor="middle" font-size="17" fill="#777777">Native x86/ARM</text>
  <rect x="990" y="136" width="248" height="185" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="1114" y="206" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b5e20">Execute</text>
  <text x="1114" y="264" text-anchor="middle" font-size="17" fill="#777777">At hook point</text>
  <!-- Arrows -->
  <line x1="302" y1="228" x2="358" y2="228" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="618" y1="228" x2="674" y2="228" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="934" y1="228" x2="990" y2="228" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- Verifier details box -->
  <rect x="256" y="406" width="768" height="218" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" rx="10" stroke-dasharray="10,6" filter="url(#shadow)"/>
  <text x="640" y="474" text-anchor="middle" font-size="21" fill="#333333" font-weight="bold">Verifier Checks:</text>
  <text x="640" y="532" text-anchor="middle" font-size="17" fill="#777777">No loops | Bounded execution | Valid memory access</text>
  <text x="640" y="582" text-anchor="middle" font-size="17" fill="#777777">No null pointer deref | Proper map access | Stack bounds</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="260.869588" height="219.876941" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.539577" filter="url(#shadow)" />
  <text x="170.434794" y="123.196593" text-anchor="middle" font-size="22.932379" font-weight="bold" fill="var(--primary-accent)">BPF Bytecode</text>
  <text x="170.434794" y="192.131135" text-anchor="middle" font-size="18.564325" fill="var(--text-muted)">ELF .o file</text>
  <rect x="357.056884" y="40" width="260.869588" height="219.876941" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.539577" filter="url(#shadow)" />
  <text x="487.491679" y="123.196593" text-anchor="middle" font-size="22.932379" font-weight="bold" fill="var(--danger-accent)">Verifier</text>
  <text x="487.491679" y="192.131135" text-anchor="middle" font-size="18.564325" fill="var(--text-muted)">DAG analysis</text>
  <rect x="674.113769" y="40" width="260.869588" height="219.876941" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.539577" filter="url(#shadow)" />
  <text x="804.548563" y="123.196593" text-anchor="middle" font-size="22.932379" font-weight="bold" fill="var(--warn-accent)">JIT Compiler</text>
  <text x="804.548563" y="192.131135" text-anchor="middle" font-size="18.564325" fill="var(--text-muted)">Native x86/ARM</text>
  <rect x="991.170653" y="40" width="248.829347" height="219.876941" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.539577" filter="url(#shadow)" />
  <text x="1115.58538" y="123.196593" text-anchor="middle" font-size="22.932379" font-weight="bold" fill="var(--ok-accent)">Execute</text>
  <text x="1115.58538" y="192.131135" text-anchor="middle" font-size="18.564325" fill="var(--text-muted)">At hook point</text>
  <line x1="300.869481" y1="149.344249" x2="357.056884" y2="149.344249" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="617.926473" y1="149.344249" x2="674.113769" y2="149.344249" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="934.983357" y1="149.344249" x2="991.170653" y2="149.344249" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="254.715738" y="360.901648" width="770.568631" height="259.098352" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.539577" stroke-dasharray="8.8889 5.3333" filter="url(#shadow)" />
  <text x="640.000054" y="441.721208" text-anchor="middle" font-size="22.932379" fill="var(--text)" font-weight="bold">Verifier Checks:</text>
  <text x="640.000054" y="510.655751" text-anchor="middle" font-size="18.564325" fill="var(--text-muted)">No loops | Bounded execution | Valid memory access</text>
  <text x="640.000054" y="570.081867" text-anchor="middle" font-size="18.564325" fill="var(--text-muted)">No null pointer deref | Proper map access | Stack bounds</text>
</svg>
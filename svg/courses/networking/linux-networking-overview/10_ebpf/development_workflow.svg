<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="213.685078" height="221.573038" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.83993" filter="url(#shadow)" />
  <text x="146.842539" y="131.235843" text-anchor="middle" font-size="21.574832" font-weight="bold" fill="var(--primary-accent)">Write C code</text>
  <text x="146.842539" y="212.044949" text-anchor="middle" font-size="18.168253" fill="var(--text-muted)">SEC("xdp")</text>
  <rect x="299.192086" y="40" width="213.685078" height="221.573038" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.83993" filter="url(#shadow)" />
  <text x="406.034625" y="131.235843" text-anchor="middle" font-size="21.574832" font-weight="bold" fill="var(--warn-accent)">Compile</text>
  <text x="406.034625" y="212.044949" text-anchor="middle" font-size="18.168253" fill="var(--text-muted)">clang -target bpf</text>
  <rect x="558.384066" y="40" width="213.685078" height="221.573038" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.83993" filter="url(#shadow)" />
  <text x="665.226605" y="131.235843" text-anchor="middle" font-size="21.574832" font-weight="bold" fill="var(--danger-accent)">Load + Verify</text>
  <text x="665.226605" y="212.044949" text-anchor="middle" font-size="18.168253" fill="var(--text-muted)">bpf() syscall</text>
  <rect x="817.576152" y="40" width="213.685078" height="221.573038" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.83993" filter="url(#shadow)" />
  <text x="924.418691" y="131.235843" text-anchor="middle" font-size="21.574832" font-weight="bold" fill="var(--ok-accent)">Attach</text>
  <text x="924.418691" y="212.044949" text-anchor="middle" font-size="18.168253" fill="var(--text-muted)">ip link / bpftool</text>
  <rect x="1076.768343" y="40" width="163.231657" height="221.573038" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.83993" filter="url(#shadow)" />
  <text x="1157.88953" y="131.235843" text-anchor="middle" font-size="21.574832" font-weight="bold" fill="var(--info-accent)">Monitor</text>
  <text x="1157.88953" y="212.044949" text-anchor="middle" font-size="18.168253" fill="var(--text-muted)">trace_pipe</text>
  <line x1="253.685078" y1="150.786356" x2="299.192086" y2="150.786356" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="512.877164" y1="150.786356" x2="558.384066" y2="150.786356" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="772.069144" y1="150.786356" x2="817.576152" y2="150.786356" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1031.26123" y1="150.786356" x2="1076.768343" y2="150.786356" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="136.949711" y="378.876448" width="1013.025556" height="241.123552" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.83993" stroke-dasharray="8.8889 5.3333" filter="url(#shadow)" />
  <text x="643.46249" y="472.719176" text-anchor="middle" font-size="23.845929" fill="var(--text)" font-weight="bold">Key Tools: bpftool, bpftrace, libbpf, BCC toolkit</text>
  <text x="643.46249" y="566.561906" text-anchor="middle" font-size="18.168253" fill="var(--text-muted)">Debug: bpf_trace_printk() | cat /sys/kernel/debug/tracing/trace_pipe</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="115.5556" width="192" height="151.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="122.6667" y="177.7778" text-anchor="middle" font-size="16.8889" font-weight="bold" fill="var(--primary-accent)">Write C code</text>
  <text x="122.6667" y="232.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">SEC("xdp")</text>
  <rect x="259.5556" y="115.5556" width="192" height="151.1111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="355.5556" y="177.7778" text-anchor="middle" font-size="16.8889" font-weight="bold" fill="var(--warn-accent)">Compile</text>
  <text x="355.5556" y="232.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">clang -target bpf</text>
  <rect x="492.4444" y="115.5556" width="192" height="151.1111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="588.4444" y="177.7778" text-anchor="middle" font-size="16.8889" font-weight="bold" fill="var(--danger-accent)">Load + Verify</text>
  <text x="588.4444" y="232.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">bpf() syscall</text>
  <rect x="725.3333" y="115.5556" width="192" height="151.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="821.3333" y="177.7778" text-anchor="middle" font-size="16.8889" font-weight="bold" fill="var(--ok-accent)">Attach</text>
  <text x="821.3333" y="232.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">ip link / bpftool</text>
  <rect x="958.2222" y="115.5556" width="146.6667" height="151.1111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1031.1111" y="177.7778" text-anchor="middle" font-size="16.8889" font-weight="bold" fill="var(--info-accent)">Monitor</text>
  <text x="1031.1111" y="232.8889" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">trace_pipe</text>
  <line x1="218.6667" y1="191.1111" x2="259.5556" y2="191.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="451.5556" y1="191.1111" x2="492.4444" y2="191.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="684.4444" y1="191.1111" x2="725.3333" y2="191.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="917.3333" y1="191.1111" x2="958.2222" y2="191.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="113.7778" y="346.6667" width="910.2222" height="164.4444" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" stroke-dasharray="8.8889 5.3333" filter="url(#shadow)" />
  <text x="568.8889" y="410.6667" text-anchor="middle" font-size="18.6667" fill="var(--text)" font-weight="bold">Key Tools: bpftool, bpftrace, libbpf, BCC toolkit</text>
  <text x="568.8889" y="474.6667" text-anchor="middle" font-size="14.2222" fill="var(--text-muted)">Debug: bpf_trace_printk() | cat /sys/kernel/debug/tracing/trace_pipe</text>
</svg>
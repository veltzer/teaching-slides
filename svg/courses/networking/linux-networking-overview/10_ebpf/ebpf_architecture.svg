<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="37.3333" y="88.8889" width="515.5556" height="229.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="37.3333" y="88.8889" width="515.5556" height="46.2222" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="37.3333" y="124.4444" width="515.5556" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="295.1111" y="120.8889" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--bg)">User Space</text>
  <rect x="65.7778" y="165.3333" width="152.8889" height="122.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="142.2222" y="218.6667" text-anchor="middle" font-size="16" fill="var(--warn-accent)">clang/LLVM</text>
  <text x="142.2222" y="259.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)">Compile</text>
  <rect x="241.7778" y="165.3333" width="135.1111" height="122.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="309.3333" y="218.6667" text-anchor="middle" font-size="16" fill="var(--warn-accent)">bpf()</text>
  <text x="309.3333" y="259.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)">syscall</text>
  <rect x="391.1111" y="165.3333" width="135.1111" height="122.6667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="458.6667" y="218.6667" text-anchor="middle" font-size="16" fill="var(--warn-accent)">libbpf</text>
  <text x="458.6667" y="259.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)">loader</text>
  <rect x="584.8889" y="88.8889" width="515.5556" height="229.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="584.8889" y="88.8889" width="515.5556" height="46.2222" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="584.8889" y="124.4444" width="515.5556" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="842.6667" y="120.8889" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--bg)">Kernel Space</text>
  <rect x="613.3333" y="165.3333" width="135.1111" height="122.6667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="680.8889" y="218.6667" text-anchor="middle" font-size="16" fill="var(--danger-accent)">Verifier</text>
  <text x="680.8889" y="259.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)">Safety</text>
  <rect x="768" y="165.3333" width="135.1111" height="122.6667" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="835.5556" y="218.6667" text-anchor="middle" font-size="16" fill="var(--info-accent)">JIT</text>
  <text x="835.5556" y="259.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)">Compile</text>
  <rect x="920.8889" y="165.3333" width="144" height="122.6667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="992.8889" y="218.6667" text-anchor="middle" font-size="16" fill="var(--primary-accent)">Attach</text>
  <text x="992.8889" y="259.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-muted)">Hook point</text>
  <line x1="218.6667" y1="226.6667" x2="241.7778" y2="226.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="376.8889" y1="226.6667" x2="391.1111" y2="226.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="526.2222" y1="226.6667" x2="613.3333" y2="226.6667" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="748.4444" y1="226.6667" x2="768" y2="226.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="903.1111" y1="226.6667" x2="920.8889" y2="226.6667" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="37.3333" y="391.1111" width="1063.1111" height="164.4444" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" fill-opacity="0.25" />
  <text x="227.5556" y="449.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">XDP (NIC driver)</text>
  <text x="492.4444" y="449.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">tc (traffic control)</text>
  <text x="758.2222" y="449.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">kprobes (tracing)</text>
  <text x="1004.4444" y="449.7778" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--text)">LSM (security)</text>
  <text x="568.8889" y="520.8889" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Available kernel hook points for eBPF program attachment</text>
</svg>
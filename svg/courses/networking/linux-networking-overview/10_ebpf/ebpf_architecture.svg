<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="581.939799" height="285.028638" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)" />
  <rect x="40" y="40" width="581.939799" height="57.447657" fill="var(--primary-fill)" rx="7.269044" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="40" y="84.190326" width="581.939799" height="13.257194" fill="var(--primary-fill)" rx="7.269044" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="330.9699" y="79.771444" text-anchor="middle" font-size="22.109526" font-weight="bold" fill="var(--bg)">User Space</text>
  <rect x="72.107023" y="135.009455" width="172.575251" height="152.457249" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.269044" />
  <text x="158.394649" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--warn-accent)">clang/LLVM</text>
  <text x="158.394649" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)">Compile</text>
  <rect x="270.769231" y="135.009455" width="152.508361" height="152.457249" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.269044" />
  <text x="347.023411" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--warn-accent)">bpf()</text>
  <text x="347.023411" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)">syscall</text>
  <rect x="439.331104" y="135.009455" width="152.508361" height="152.457249" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.269044" />
  <text x="515.585284" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--warn-accent)">libbpf</text>
  <text x="515.585284" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)">loader</text>
  <rect x="658.060201" y="40" width="581.939799" height="285.028638" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)" />
  <rect x="658.060201" y="40" width="581.939799" height="57.447657" fill="var(--primary-fill)" rx="7.269044" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="658.060201" y="84.190326" width="581.939799" height="13.257194" fill="var(--primary-fill)" rx="7.269044" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="949.0301" y="79.771444" text-anchor="middle" font-size="22.109526" font-weight="bold" fill="var(--bg)">Kernel Space</text>
  <rect x="690.167224" y="135.009455" width="152.508361" height="152.457249" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.269044" />
  <text x="766.421405" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--danger-accent)">Verifier</text>
  <text x="766.421405" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)">Safety</text>
  <rect x="864.749164" y="135.009455" width="152.508361" height="152.457249" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.269044" />
  <text x="941.003344" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--info-accent)">JIT</text>
  <text x="941.003344" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)">Compile</text>
  <rect x="1037.324415" y="135.009455" width="162.541806" height="152.457249" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.269044" />
  <text x="1118.595318" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--primary-accent)">Attach</text>
  <text x="1118.595318" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)">Hook point</text>
  <line x1="244.682274" y1="211.238147" x2="270.769231" y2="211.238147" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="423.277592" y1="211.238147" x2="439.331104" y2="211.238147" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="591.839465" y1="211.238147" x2="690.167224" y2="211.238147" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="842.675478" y1="211.238147" x2="864.749164" y2="211.238147" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1017.257525" y1="211.238147" x2="1037.324415" y2="211.238147" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="415.619074" width="1200" height="204.380926" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.269044" fill-opacity="0.25" />
  <text x="254.715719" y="488.533434" text-anchor="middle" font-size="18.951005" font-weight="bold" fill="var(--text)">XDP (NIC driver)</text>
  <text x="553.712268" y="488.533434" text-anchor="middle" font-size="18.951005" font-weight="bold" fill="var(--text)">tc (traffic control)</text>
  <text x="853.712375" y="488.533434" text-anchor="middle" font-size="18.951005" font-weight="bold" fill="var(--text)">kprobes (tracing)</text>
  <text x="1131.638689" y="488.533434" text-anchor="middle" font-size="18.951005" font-weight="bold" fill="var(--text)">LSM (security)</text>
  <text x="640" y="576.914497" text-anchor="middle" font-size="17.898205" fill="var(--text-muted)">Available kernel hook points for eBPF program attachment</text>
</svg>
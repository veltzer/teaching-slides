<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="79.375" y="120.5556" width="543.75" height="207.8333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="79.375" y="120.5556" width="543.75" height="41.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="79.375" y="152.7777" width="543.75" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="351.25" y="149.5556" text-anchor="middle" font-size="18.2496" font-weight="bold" fill="var(--bg)">User Space</text>
  <rect x="109.375" y="189.8333" width="161.25" height="111.1667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="190" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--warn-accent)">clang/LLVM</text>
  <text x="190" y="275.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">Compile</text>
  <rect x="295" y="189.8333" width="142.5" height="111.1667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="366.25" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--warn-accent)">bpf()</text>
  <text x="366.25" y="275.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">syscall</text>
  <rect x="452.5" y="189.8333" width="142.5" height="111.1667" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="523.75" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--warn-accent)">libbpf</text>
  <text x="523.75" y="275.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">loader</text>
  <rect x="656.875" y="120.5556" width="543.75" height="207.8333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="656.875" y="120.5556" width="543.75" height="41.8889" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="656.875" y="152.7777" width="543.75" height="9.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="928.75" y="149.5556" text-anchor="middle" font-size="18.2496" font-weight="bold" fill="var(--bg)">Kernel Space</text>
  <rect x="686.875" y="189.8333" width="142.5" height="111.1667" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" />
  <text x="758.125" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--danger-accent)">Verifier</text>
  <text x="758.125" y="275.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">Safety</text>
  <rect x="850" y="189.8333" width="142.5" height="111.1667" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" />
  <text x="921.25" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--info-accent)">JIT</text>
  <text x="921.25" y="275.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">Compile</text>
  <rect x="1011.25" y="189.8333" width="151.875" height="111.1667" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" />
  <text x="1087.1875" y="238.1667" text-anchor="middle" font-size="15.6425" fill="var(--primary-accent)">Attach</text>
  <text x="1087.1875" y="275.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-muted)">Hook point</text>
  <line x1="270.625" y1="245.4167" x2="295" y2="245.4167" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="437.5" y1="245.4167" x2="452.5" y2="245.4167" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="595" y1="245.4167" x2="686.875" y2="245.4167" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="829.3749" y1="245.4167" x2="850" y2="245.4167" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="992.5" y1="245.4167" x2="1011.25" y2="245.4167" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="79.375" y="394.4444" width="1121.25" height="149.0277" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" fill-opacity="0.25" />
  <text x="280" y="447.6111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--text)">XDP (NIC driver)</text>
  <text x="559.3749" y="447.6111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--text)">tc (traffic control)</text>
  <text x="839.6875" y="447.6111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--text)">kprobes (tracing)</text>
  <text x="1099.3749" y="447.6111" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--text)">LSM (security)</text>
  <text x="640" y="512.0556" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Available kernel hook points for eBPF program attachment</text>
</svg>
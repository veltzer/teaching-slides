<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="581.939799" height="285.028638" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)"/>
  <rect x="40" y="40" width="581.939799" height="57.447657" fill="url(#grad-primary)" rx="7.269044" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="84.190326" width="581.939799" height="13.257194" fill="url(#grad-primary)" rx="7.269044" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330.9699" y="79.771444" text-anchor="middle" font-size="22.109526" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">User Space</text>
  <rect x="72.107023" y="135.009455" width="172.575251" height="152.457249" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)"/>
  <text x="158.394649" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--warn-accent)" font-family="Arial, sans-serif">clang/LLVM</text>
  <text x="158.394649" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)" font-family="Arial, sans-serif">Compile</text>
  <rect x="270.769231" y="135.009455" width="152.508361" height="152.457249" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)"/>
  <text x="347.023411" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--warn-accent)" font-family="Arial, sans-serif">bpf()</text>
  <text x="347.023411" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)" font-family="Arial, sans-serif">syscall</text>
  <rect x="439.331104" y="135.009455" width="152.508361" height="152.457249" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)"/>
  <text x="515.585284" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--warn-accent)" font-family="Arial, sans-serif">libbpf</text>
  <text x="515.585284" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)" font-family="Arial, sans-serif">loader</text>
  <rect x="658.060201" y="40" width="581.939799" height="285.028638" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)"/>
  <rect x="658.060201" y="40" width="581.939799" height="57.447657" fill="url(#grad-primary)" rx="7.269044" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="658.060201" y="84.190326" width="581.939799" height="13.257194" fill="url(#grad-primary)" rx="7.269044" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="949.0301" y="79.771444" text-anchor="middle" font-size="22.109526" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Kernel Space</text>
  <rect x="690.167224" y="135.009455" width="152.508361" height="152.457249" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)"/>
  <text x="766.421405" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--danger-accent)" font-family="Arial, sans-serif">Verifier</text>
  <text x="766.421405" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)" font-family="Arial, sans-serif">Safety</text>
  <rect x="864.749164" y="135.009455" width="152.508361" height="152.457249" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)"/>
  <text x="941.003344" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--info-accent)" font-family="Arial, sans-serif">JIT</text>
  <text x="941.003344" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)" font-family="Arial, sans-serif">Compile</text>
  <rect x="1037.324415" y="135.009455" width="162.541806" height="152.457249" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.269044" filter="url(#shadow)"/>
  <text x="1118.595318" y="201.295286" text-anchor="middle" font-size="18.951005" fill="var(--primary-accent)" font-family="Arial, sans-serif">Attach</text>
  <text x="1118.595318" y="252.114415" text-anchor="middle" font-size="15.792484" fill="var(--text-muted)" font-family="Arial, sans-serif">Hook point</text>
  <line x1="244.682274" y1="211.238147" x2="270.769231" y2="211.238147" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="423.277592" y1="211.238147" x2="439.331104" y2="211.238147" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="591.839465" y1="211.238147" x2="690.167224" y2="211.238147" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="842.675478" y1="211.238147" x2="864.749164" y2="211.238147" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1017.257525" y1="211.238147" x2="1037.324415" y2="211.238147" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="415.619074" width="1200" height="204.380926" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.269044" fill-opacity="0.25" filter="url(#shadow)"/>
  <text x="254.715719" y="488.533434" text-anchor="middle" font-size="18.951005" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">XDP (NIC driver)</text>
  <text x="553.712268" y="488.533434" text-anchor="middle" font-size="18.951005" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">tc (traffic control)</text>
  <text x="853.712375" y="488.533434" text-anchor="middle" font-size="18.951005" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">kprobes (tracing)</text>
  <text x="1131.638689" y="488.533434" text-anchor="middle" font-size="18.951005" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">LSM (security)</text>
  <text x="640" y="576.914497" text-anchor="middle" font-size="17.898205" fill="var(--text-muted)" font-family="Arial, sans-serif">Available kernel hook points for eBPF program attachment</text>
</svg>
  <ns0:text x="200" y="229.3333" text-anchor="middle" font-size="16" fill="#555555">to eBPF bytecode</ns0:text>
  <ns0:rect x="408.8889" y="88.8889" width="325.3333" height="213.3333" fill="#fff8e1" stroke="#f57c00" stroke-width="2.6667" rx="8.8889" filter="url(#shadow)" />

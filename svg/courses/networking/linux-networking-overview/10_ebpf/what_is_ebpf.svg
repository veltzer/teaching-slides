  <ns0:text x="571.5556" y="229.3333" text-anchor="middle" font-size="16" fill="#555555">Native compilation</ns0:text>
  <ns0:rect x="780.4444" y="88.8889" width="325.3333" height="213.3333" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.6667" rx="8.8889" filter="url(#shadow)" />
  <ns0:rect x="780.4444" y="88.8889" width="325.3333" height="46.2222" fill="url(#grad-primary)" rx="8.8889" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="365.391047" height="253.090897" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.08417" filter="url(#shadow)"/>
  <rect x="40" y="40" width="365.391047" height="54.836385" fill="url(#grad-primary)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="82.181663" width="365.391047" height="12.654591" fill="url(#grad-primary)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.695524" y="77.963641" text-anchor="middle" font-size="21.54721" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">User Space</text>
  <text x="222.695524" y="158.108946" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)" font-family="Arial, sans-serif">C program compiled</text>
  <text x="222.695524" y="206.618101" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)" font-family="Arial, sans-serif">to eBPF bytecode</text>
  <rect x="457.30453" y="40" width="365.391047" height="253.090897" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.08417" filter="url(#shadow)"/>
  <rect x="457.30453" y="40" width="365.391047" height="54.836385" fill="url(#grad-primary)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="457.30453" y="82.181663" width="365.391047" height="12.654591" fill="url(#grad-primary)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="77.963641" text-anchor="middle" font-size="21.54721" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Verifier + JIT</text>
  <text x="640.000053" y="158.108946" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)" font-family="Arial, sans-serif">Safety checks</text>
  <text x="640.000053" y="206.618101" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)" font-family="Arial, sans-serif">Native compilation</text>
  <rect x="874.608953" y="40" width="365.391047" height="253.090897" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.08417" filter="url(#shadow)"/>
  <rect x="874.608953" y="40" width="365.391047" height="54.836385" fill="url(#grad-primary)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="874.608953" y="82.181663" width="365.391047" height="12.654591" fill="url(#grad-primary)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.304583" y="77.963641" text-anchor="middle" font-size="21.54721" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Kernel Hooks</text>
  <text x="1057.304583" y="158.108946" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)" font-family="Arial, sans-serif">XDP, tc, kprobes</text>
  <text x="1057.304583" y="206.618101" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)" font-family="Arial, sans-serif">tracepoints, LSM</text>
  <line x1="405.391047" y1="166.545514" x2="457.30453" y2="166.545514" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="822.695577" y1="166.545514" x2="874.608953" y2="166.545514" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="359.467582" y="379.563563" width="557.071597" height="177.163615" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.08417" filter="url(#shadow)"/>
  <text x="638.003381" y="451.272822" text-anchor="middle" font-size="21.54721" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">eBPF Maps (shared data)</text>
  <text x="638.003381" y="512.436307" text-anchor="middle" font-size="17.442997" fill="var(--text-muted)" font-family="Arial, sans-serif">Hash, Array, Ring Buffer, Per-CPU</text>
  <line x1="222.695524" y1="293.090897" x2="222.695524" y2="467.090963" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <line x1="222.695524" y1="467.090963" x2="359.467582" y2="467.090963" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <line x1="1057.304583" y1="293.090897" x2="1057.304583" y2="467.090963" stroke="var(--text-faint)" stroke-width="1.3333"/>
  <line x1="1057.304583" y1="467.090963" x2="916.539179" y2="467.090963" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)"/>
  <text x="637.005045" y="620" text-anchor="middle" font-size="17.442997" fill="var(--text-muted)" font-family="Arial, sans-serif">Maps enable data sharing between user space and kernel eBPF programs</text>
</svg>

  <ns0:text x="943.1111" y="188.4444" text-anchor="middle" font-size="16" fill="#555555">XDP, tc, kprobes</ns0:text>
  <ns0:text x="943.1111" y="229.3333" text-anchor="middle" font-size="16" fill="#555555">tracepoints, LSM</ns0:text>

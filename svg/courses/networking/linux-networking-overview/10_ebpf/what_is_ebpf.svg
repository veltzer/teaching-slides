  <ns0:text x="569.7778" y="435.5556" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="#4a148c">eBPF Maps (shared data)</ns0:text>
  <ns0:text x="569.7778" y="487.1111" text-anchor="middle" font-size="15.1111" fill="#777777">Hash, Array, Ring Buffer, Per-CPU</ns0:text>

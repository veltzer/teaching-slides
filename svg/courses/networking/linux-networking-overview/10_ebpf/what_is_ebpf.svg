<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">eBPF: Safe Kernel Programmability</text>
  <rect x="42.6667" y="108" width="362.6667" height="252" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="224" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">User Space</text>
  <text x="224" y="241.2" text-anchor="middle" font-size="21.3333" fill="#666">C program compiled</text>
  <text x="224" y="295.2" text-anchor="middle" font-size="21.3333" fill="#666">to eBPF bytecode</text>
  <rect x="458.6667" y="108" width="362.6667" height="252" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Verifier + JIT</text>
  <text x="640" y="241.2" text-anchor="middle" font-size="21.3333" fill="#666">Safety checks</text>
  <text x="640" y="295.2" text-anchor="middle" font-size="21.3333" fill="#666">Native compilation</text>
  <rect x="874.6667" y="108" width="362.6667" height="252" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1056" y="180" text-anchor="middle" font-size="23.4667" font-weight="bold">Kernel Hooks</text>
  <text x="1056" y="241.2" text-anchor="middle" font-size="21.3333" fill="#666">XDP, tc, kprobes</text>
  <text x="1056" y="295.2" text-anchor="middle" font-size="21.3333" fill="#666">tracepoints, LSM</text>
  <line x1="405.3333" y1="234" x2="458.6667" y2="234" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd0_09_ebpf)" />
  <line x1="821.3333" y1="234" x2="874.6667" y2="234" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd0_09_ebpf)" />
  <rect x="362.6667" y="432" width="554.6667" height="180" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="640" y="504" text-anchor="middle" font-size="23.4667" font-weight="bold">eBPF Maps (shared data)</text>
  <text x="640" y="565.2" text-anchor="middle" font-size="21.3333" fill="#666">Hash, Array, Ring Buffer, Per-CPU</text>
  <line x1="224" y1="360" x2="224" y2="522" stroke="#333" stroke-width="3.2" />
  <line x1="224" y1="522" x2="362.6667" y2="522" stroke="#333" stroke-width="3.2" marker-end="url(#arrowd0_09_ebpf)" />
  <line x1="1056" y1="360" x2="1056" y2="522" stroke="#333" stroke-width="3.2" />
  <line x1="1056" y1="522" x2="917.3333" y2="522" stroke="#333" stroke-width="3.2" marker-end="url(#arrowd0_09_ebpf)" />
  <text x="640" y="691.2" text-anchor="middle" font-size="21.3333" fill="#666">Maps enable data sharing between user space and kernel eBPF programs</text>
  <defs>
    <marker id="arrowd0_09_ebpf" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
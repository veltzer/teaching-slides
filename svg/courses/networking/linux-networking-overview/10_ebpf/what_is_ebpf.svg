<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="37.3333" y="88.8889" width="325.3333" height="213.3333" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="37.3333" y="88.8889" width="325.3333" height="46.2222" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="37.3333" y="124.4444" width="325.3333" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="200" y="120.8889" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--bg)">User Space</text>
  <text x="200" y="188.4444" text-anchor="middle" font-size="16" fill="var(--text-muted)">C program compiled</text>
  <text x="200" y="229.3333" text-anchor="middle" font-size="16" fill="var(--text-muted)">to eBPF bytecode</text>
  <rect x="408.8889" y="88.8889" width="325.3333" height="213.3333" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="408.8889" y="88.8889" width="325.3333" height="46.2222" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="408.8889" y="124.4444" width="325.3333" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="571.5556" y="120.8889" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--bg)">Verifier + JIT</text>
  <text x="571.5556" y="188.4444" text-anchor="middle" font-size="16" fill="var(--text-muted)">Safety checks</text>
  <text x="571.5556" y="229.3333" text-anchor="middle" font-size="16" fill="var(--text-muted)">Native compilation</text>
  <rect x="780.4444" y="88.8889" width="325.3333" height="213.3333" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="780.4444" y="88.8889" width="325.3333" height="46.2222" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="780.4444" y="124.4444" width="325.3333" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="943.1111" y="120.8889" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--bg)">Kernel Hooks</text>
  <text x="943.1111" y="188.4444" text-anchor="middle" font-size="16" fill="var(--text-muted)">XDP, tc, kprobes</text>
  <text x="943.1111" y="229.3333" text-anchor="middle" font-size="16" fill="var(--text-muted)">tracepoints, LSM</text>
  <line x1="362.6667" y1="195.5556" x2="408.8889" y2="195.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="734.2222" y1="195.5556" x2="780.4444" y2="195.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="321.7778" y="375.1111" width="496" height="149.3333" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="569.7778" y="435.5556" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--info-accent)">eBPF Maps (shared data)</text>
  <text x="569.7778" y="487.1111" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Hash, Array, Ring Buffer, Per-CPU</text>
  <line x1="200" y1="302.2222" x2="200" y2="448.8889" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="200" y1="448.8889" x2="321.7778" y2="448.8889" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="943.1111" y1="302.2222" x2="943.1111" y2="448.8889" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="943.1111" y1="448.8889" x2="817.7778" y2="448.8889" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="568.8889" y="577.7778" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Maps enable data sharing between user space and kernel eBPF programs</text>
</svg>
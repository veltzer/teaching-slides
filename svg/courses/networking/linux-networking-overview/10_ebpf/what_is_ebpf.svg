<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="365.391047" height="253.090897" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.08417" filter="url(#shadow)" />
  <rect x="40" y="40" width="365.391047" height="54.836385" fill="var(--primary-fill)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="82.181663" width="365.391047" height="12.654591" fill="var(--primary-fill)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="222.695524" y="77.963641" text-anchor="middle" font-size="21.54721" font-weight="bold" fill="var(--bg)">User Space</text>
  <text x="222.695524" y="158.108946" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)">C program compiled</text>
  <text x="222.695524" y="206.618101" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)">to eBPF bytecode</text>
  <rect x="457.30453" y="40" width="365.391047" height="253.090897" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.08417" filter="url(#shadow)" />
  <rect x="457.30453" y="40" width="365.391047" height="54.836385" fill="var(--primary-fill)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="457.30453" y="82.181663" width="365.391047" height="12.654591" fill="var(--primary-fill)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000053" y="77.963641" text-anchor="middle" font-size="21.54721" font-weight="bold" fill="var(--bg)">Verifier + JIT</text>
  <text x="640.000053" y="158.108946" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)">Safety checks</text>
  <text x="640.000053" y="206.618101" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)">Native compilation</text>
  <rect x="874.608953" y="40" width="365.391047" height="253.090897" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.08417" filter="url(#shadow)" />
  <rect x="874.608953" y="40" width="365.391047" height="54.836385" fill="var(--primary-fill)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="874.608953" y="82.181663" width="365.391047" height="12.654591" fill="var(--primary-fill)" rx="7.08417" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1057.304583" y="77.963641" text-anchor="middle" font-size="21.54721" font-weight="bold" fill="var(--bg)">Kernel Hooks</text>
  <text x="1057.304583" y="158.108946" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)">XDP, tc, kprobes</text>
  <text x="1057.304583" y="206.618101" text-anchor="middle" font-size="18.469021" fill="var(--text-muted)">tracepoints, LSM</text>
  <line x1="405.391047" y1="166.545514" x2="457.30453" y2="166.545514" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="822.695577" y1="166.545514" x2="874.608953" y2="166.545514" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="359.467582" y="379.563563" width="557.071597" height="177.163615" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.08417" filter="url(#shadow)" />
  <text x="638.003381" y="451.272822" text-anchor="middle" font-size="21.54721" font-weight="bold" fill="var(--info-accent)">eBPF Maps (shared data)</text>
  <text x="638.003381" y="512.436307" text-anchor="middle" font-size="17.442997" fill="var(--text-muted)">Hash, Array, Ring Buffer, Per-CPU</text>
  <line x1="222.695524" y1="293.090897" x2="222.695524" y2="467.090963" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="222.695524" y1="467.090963" x2="359.467582" y2="467.090963" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <line x1="1057.304583" y1="293.090897" x2="1057.304583" y2="467.090963" stroke="var(--text-faint)" stroke-width="1.3333" />
  <line x1="1057.304583" y1="467.090963" x2="916.539179" y2="467.090963" stroke="var(--text-faint)" stroke-width="1.3333" marker-end="url(#arrow)" />
  <text x="637.005045" y="620" text-anchor="middle" font-size="17.442997" fill="var(--text-muted)">Maps enable data sharing between user space and kernel eBPF programs</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="289.655172" height="580" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)" />
  <rect x="40" y="40" width="289.655172" height="56.330934" fill="var(--primary-fill)" rx="7.172261" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="83.812905" width="289.655172" height="12.518028" fill="var(--primary-fill)" rx="7.172261" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="78.597049" text-anchor="middle" font-size="21.815149" font-weight="bold" fill="var(--bg)">Server</text>
  <rect x="71.034483" y="113.021466" width="227.586207" height="73.021595" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.172261" />
  <text x="184.827586" y="156.834371" text-anchor="middle" font-size="19.737465" fill="var(--text)">socket()</text>
  <rect x="71.034483" y="198.56109" width="227.586207" height="73.021595" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.172261" />
  <text x="184.827586" y="242.373995" text-anchor="middle" font-size="19.737465" fill="var(--text)">bind()</text>
  <rect x="71.034483" y="284.100713" width="227.586207" height="73.021595" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.172261" />
  <text x="184.827586" y="327.913619" text-anchor="middle" font-size="19.737465" fill="var(--text)">listen()</text>
  <rect x="71.034483" y="369.640208" width="227.586207" height="73.021595" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <text x="184.827586" y="413.453113" text-anchor="middle" font-size="19.737465" fill="var(--warn-accent)">accept()</text>
  <rect x="71.034483" y="457.266018" width="227.586207" height="73.021595" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <text x="184.827586" y="501.079053" text-anchor="middle" font-size="19.737465" fill="var(--ok-accent)">recv() / send()</text>
  <rect x="950.344828" y="40" width="289.655172" height="580" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)" />
  <rect x="950.344828" y="40" width="289.655172" height="56.330934" fill="var(--primary-fill)" rx="7.172261" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950.344828" y="83.812905" width="289.655172" height="12.518028" fill="var(--primary-fill)" rx="7.172261" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="78.597049" text-anchor="middle" font-size="21.815149" font-weight="bold" fill="var(--bg)">Client</text>
  <rect x="981.37931" y="113.021466" width="227.586207" height="73.021595" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.172261" />
  <text x="1095.172414" y="156.834371" text-anchor="middle" font-size="19.737465" fill="var(--text)">socket()</text>
  <rect x="981.37931" y="284.100713" width="227.586207" height="73.021595" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <text x="1095.172414" y="327.913619" text-anchor="middle" font-size="19.737465" fill="var(--warn-accent)">connect()</text>
  <rect x="981.37931" y="457.266018" width="227.586207" height="73.021595" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <text x="1095.172414" y="501.079053" text-anchor="middle" font-size="19.737465" fill="var(--ok-accent)">send() / recv()</text>
  <line x1="981.37931" y1="342.517964" x2="298.62069" y2="410.323574" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" marker-end="url(#arrow)" />
  <text x="640" y="357.122179" text-anchor="middle" font-size="18.698682" fill="var(--text-muted)">3-way handshake</text>
  <line x1="298.62069" y1="493.77701" x2="981.37931" y2="493.77701" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="981.37931" y1="512.553988" x2="298.62069" y2="512.553988" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="640" y="482.302075" text-anchor="middle" font-size="17.6599" fill="var(--ok-accent)">data exchange</text>
</svg>
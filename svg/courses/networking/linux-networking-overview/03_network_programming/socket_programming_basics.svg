<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="88.8889" width="248.8889" height="494.2222" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="53.3333" y="88.8889" width="248.8889" height="48" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="53.3333" y="126.2222" width="248.8889" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="177.7778" y="121.7778" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--bg)">Server</text>
  <rect x="80" y="151.1111" width="195.5556" height="62.2222" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="6" />
  <text x="177.7778" y="188.4444" text-anchor="middle" font-size="16.8889" fill="var(--text)">socket()</text>
  <rect x="80" y="224" width="195.5556" height="62.2222" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="6" />
  <text x="177.7778" y="261.3333" text-anchor="middle" font-size="16.8889" fill="var(--text)">bind()</text>
  <rect x="80" y="296.8889" width="195.5556" height="62.2222" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="6" />
  <text x="177.7778" y="334.2222" text-anchor="middle" font-size="16.8889" fill="var(--text)">listen()</text>
  <rect x="80" y="369.7778" width="195.5556" height="62.2222" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="177.7778" y="407.1111" text-anchor="middle" font-size="16.8889" fill="var(--warn-accent)">accept()</text>
  <rect x="80" y="444.4444" width="195.5556" height="62.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="177.7778" y="481.7778" text-anchor="middle" font-size="16.8889" fill="var(--ok-accent)">recv() / send()</text>
  <rect x="835.5556" y="88.8889" width="248.8889" height="494.2222" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <rect x="835.5556" y="88.8889" width="248.8889" height="48" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="835.5556" y="126.2222" width="248.8889" height="10.6667" fill="var(--primary-fill)" rx="6" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="960" y="121.7778" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--bg)">Client</text>
  <rect x="862.2222" y="151.1111" width="195.5556" height="62.2222" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="6" />
  <text x="960" y="188.4444" text-anchor="middle" font-size="16.8889" fill="var(--text)">socket()</text>
  <rect x="862.2222" y="296.8889" width="195.5556" height="62.2222" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" />
  <text x="960" y="334.2222" text-anchor="middle" font-size="16.8889" fill="var(--warn-accent)">connect()</text>
  <rect x="862.2222" y="444.4444" width="195.5556" height="62.2222" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" />
  <text x="960" y="481.7778" text-anchor="middle" font-size="16.8889" fill="var(--ok-accent)">send() / recv()</text>
  <line x1="862.2222" y1="346.6667" x2="275.5556" y2="404.4444" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" marker-end="url(#arrow)" />
  <text x="568.8889" y="359.1111" text-anchor="middle" font-size="16" fill="var(--text-muted)">3-way handshake</text>
  <line x1="275.5556" y1="475.5556" x2="862.2222" y2="475.5556" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="862.2222" y1="491.5556" x2="275.5556" y2="491.5556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="568.8889" y="465.7778" text-anchor="middle" font-size="15.1111" fill="var(--ok-accent)">data exchange</text>
</svg>
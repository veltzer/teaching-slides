<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="289.655172" height="580" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <rect x="40" y="40" width="289.655172" height="56.330934" fill="url(#grad-primary)" rx="7.172261" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="83.812905" width="289.655172" height="12.518028" fill="url(#grad-primary)" rx="7.172261" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="78.597049" text-anchor="middle" font-size="21.815149" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Server</text>
  <rect x="71.034483" y="113.021466" width="227.586207" height="73.021595" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.172261"/>
  <text x="184.827586" y="156.834371" text-anchor="middle" font-size="19.737465" fill="var(--text)" font-family="Arial, sans-serif">socket()</text>
  <rect x="71.034483" y="198.56109" width="227.586207" height="73.021595" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.172261"/>
  <text x="184.827586" y="242.373995" text-anchor="middle" font-size="19.737465" fill="var(--text)" font-family="Arial, sans-serif">bind()</text>
  <rect x="71.034483" y="284.100713" width="227.586207" height="73.021595" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.172261"/>
  <text x="184.827586" y="327.913619" text-anchor="middle" font-size="19.737465" fill="var(--text)" font-family="Arial, sans-serif">listen()</text>
  <rect x="71.034483" y="369.640208" width="227.586207" height="73.021595" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <text x="184.827586" y="413.453113" text-anchor="middle" font-size="19.737465" fill="var(--warn-accent)" font-family="Arial, sans-serif">accept()</text>
  <rect x="71.034483" y="457.266018" width="227.586207" height="73.021595" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <text x="184.827586" y="501.079053" text-anchor="middle" font-size="19.737465" fill="var(--ok-accent)" font-family="Arial, sans-serif">recv() / send()</text>
  <rect x="950.344828" y="40" width="289.655172" height="580" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <rect x="950.344828" y="40" width="289.655172" height="56.330934" fill="url(#grad-primary)" rx="7.172261" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950.344828" y="83.812905" width="289.655172" height="12.518028" fill="url(#grad-primary)" rx="7.172261" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="78.597049" text-anchor="middle" font-size="21.815149" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Client</text>
  <rect x="981.37931" y="113.021466" width="227.586207" height="73.021595" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.172261"/>
  <text x="1095.172414" y="156.834371" text-anchor="middle" font-size="19.737465" fill="var(--text)" font-family="Arial, sans-serif">socket()</text>
  <rect x="981.37931" y="284.100713" width="227.586207" height="73.021595" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <text x="1095.172414" y="327.913619" text-anchor="middle" font-size="19.737465" fill="var(--warn-accent)" font-family="Arial, sans-serif">connect()</text>
  <rect x="981.37931" y="457.266018" width="227.586207" height="73.021595" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.172261" filter="url(#shadow)"/>
  <text x="1095.172414" y="501.079053" text-anchor="middle" font-size="19.737465" fill="var(--ok-accent)" font-family="Arial, sans-serif">send() / recv()</text>
  <line x1="981.37931" y1="342.517964" x2="298.62069" y2="410.323574" stroke="var(--text-faint)" stroke-width="1.7778" stroke-dasharray="7.1111 4.4444" marker-end="url(#arrow)"/>
  <text x="640" y="357.122179" text-anchor="middle" font-size="18.698682" fill="var(--text-muted)" font-family="Arial, sans-serif">3-way handshake</text>
  <line x1="298.62069" y1="493.77701" x2="981.37931" y2="493.77701" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="981.37931" y1="512.553988" x2="298.62069" y2="512.553988" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <text x="640" y="482.302075" text-anchor="middle" font-size="17.6599" fill="var(--ok-accent)" font-family="Arial, sans-serif">data exchange</text>
</svg>

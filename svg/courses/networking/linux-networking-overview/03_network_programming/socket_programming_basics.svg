  <text x="95" y="145" text-anchor="middle" font-size="10">accept()</text>
  <rect x="45" y="155" width="100" height="22" fill="#e8f5e9" stroke="#333" stroke-width="1" rx="2"/>
  <text x="95" y="170" text-anchor="middle" font-size="10">recv() / send()</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="289.655172" height="569.2592" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)" />
  <rect x="40" y="40" width="289.655172" height="58" fill="var(--primary-fill)" rx="7.277741" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="85.111067" width="289.655172" height="12.888933" fill="var(--primary-fill)" rx="7.277741" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="79.740667" text-anchor="middle" font-size="22.135978" font-weight="bold" fill="var(--bg)">Server</text>
  <rect x="71.034483" y="115.185067" width="227.586207" height="75.1852" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.277741" />
  <text x="184.827586" y="160.296133" text-anchor="middle" font-size="20.027737" fill="var(--text)">socket(DGRAM)</text>
  <rect x="71.034483" y="203.2592" width="227.586207" height="75.1852" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.277741" />
  <text x="184.827586" y="248.370267" text-anchor="middle" font-size="20.027737" fill="var(--text)">bind()</text>
  <rect x="71.034483" y="334.296133" width="227.586207" height="75.1852" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <text x="184.827586" y="379.407333" text-anchor="middle" font-size="20.027737" fill="var(--ok-accent)">recvfrom()</text>
  <rect x="71.034483" y="433.111067" width="227.586207" height="75.1852" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <text x="184.827586" y="478.222267" text-anchor="middle" font-size="20.027737" fill="var(--warn-accent)">sendto()</text>
  <rect x="950.344828" y="40" width="289.655172" height="569.2592" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)" />
  <rect x="950.344828" y="40" width="289.655172" height="58" fill="var(--primary-fill)" rx="7.277741" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950.344828" y="85.111067" width="289.655172" height="12.888933" fill="var(--primary-fill)" rx="7.277741" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="79.740667" text-anchor="middle" font-size="22.135978" font-weight="bold" fill="var(--bg)">Client</text>
  <rect x="981.37931" y="115.185067" width="227.586207" height="75.1852" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.277741" />
  <text x="1095.172414" y="160.296133" text-anchor="middle" font-size="20.027737" fill="var(--text)">socket(DGRAM)</text>
  <rect x="981.37931" y="334.296133" width="227.586207" height="75.1852" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <text x="1095.172414" y="379.407333" text-anchor="middle" font-size="20.027737" fill="var(--warn-accent)">sendto()</text>
  <rect x="981.37931" y="433.111067" width="227.586207" height="75.1852" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <text x="1095.172414" y="478.222267" text-anchor="middle" font-size="20.027737" fill="var(--ok-accent)">recvfrom()</text>
  <line x1="981.37931" y1="371.888933" x2="298.62069" y2="371.888933" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="640" y="357.925867" text-anchor="middle" font-size="18.973678" fill="var(--text-muted)">datagram (no connection)</text>
  <line x1="298.62069" y1="470.7036" x2="981.37931" y2="470.7036" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="640" y="455.666667" text-anchor="middle" font-size="18.973678" fill="var(--text-muted)">reply datagram</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.919618" fill="var(--text-faint)">No connect/listen/accept needed</text>
</svg>
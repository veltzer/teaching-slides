<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="289.655172" height="569.2592" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <rect x="40" y="40" width="289.655172" height="58" fill="url(#grad-primary)" rx="7.277741" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="85.111067" width="289.655172" height="12.888933" fill="url(#grad-primary)" rx="7.277741" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586" y="79.740667" text-anchor="middle" font-size="22.135978" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Server</text>
  <rect x="71.034483" y="115.185067" width="227.586207" height="75.1852" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.277741" />
  <text x="184.827586" y="160.296133" text-anchor="middle" font-size="20.027737" fill="var(--text)" font-family="Arial, sans-serif">socket(DGRAM)</text>
  <rect x="71.034483" y="203.2592" width="227.586207" height="75.1852" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.277741" />
  <text x="184.827586" y="248.370267" text-anchor="middle" font-size="20.027737" fill="var(--text)" font-family="Arial, sans-serif">bind()</text>
  <rect x="71.034483" y="334.296133" width="227.586207" height="75.1852" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <text x="184.827586" y="379.407333" text-anchor="middle" font-size="20.027737" fill="var(--ok-accent)" font-family="Arial, sans-serif">recvfrom()</text>
  <rect x="71.034483" y="433.111067" width="227.586207" height="75.1852" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <text x="184.827586" y="478.222267" text-anchor="middle" font-size="20.027737" fill="var(--warn-accent)" font-family="Arial, sans-serif">sendto()</text>
  <rect x="950.344828" y="40" width="289.655172" height="569.2592" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <rect x="950.344828" y="40" width="289.655172" height="58" fill="url(#grad-primary)" rx="7.277741" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="950.344828" y="85.111067" width="289.655172" height="12.888933" fill="url(#grad-primary)" rx="7.277741" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172414" y="79.740667" text-anchor="middle" font-size="22.135978" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Client</text>
  <rect x="981.37931" y="115.185067" width="227.586207" height="75.1852" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.277741" />
  <text x="1095.172414" y="160.296133" text-anchor="middle" font-size="20.027737" fill="var(--text)" font-family="Arial, sans-serif">socket(DGRAM)</text>
  <rect x="981.37931" y="334.296133" width="227.586207" height="75.1852" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <text x="1095.172414" y="379.407333" text-anchor="middle" font-size="20.027737" fill="var(--warn-accent)" font-family="Arial, sans-serif">sendto()</text>
  <rect x="981.37931" y="433.111067" width="227.586207" height="75.1852" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.277741" filter="url(#shadow)"/>
  <text x="1095.172414" y="478.222267" text-anchor="middle" font-size="20.027737" fill="var(--ok-accent)" font-family="Arial, sans-serif">recvfrom()</text>
  <line x1="981.37931" y1="371.888933" x2="298.62069" y2="371.888933" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="640" y="357.925867" text-anchor="middle" font-size="18.973678" fill="var(--text-muted)" font-family="Arial, sans-serif">datagram (no connection)</text>
  <line x1="298.62069" y1="470.7036" x2="981.37931" y2="470.7036" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="640" y="455.666667" text-anchor="middle" font-size="18.973678" fill="var(--text-muted)" font-family="Arial, sans-serif">reply datagram</text>
  <text x="640" y="620" text-anchor="middle" font-size="17.919618" fill="var(--text-faint)" font-family="Arial, sans-serif">No connect/listen/accept needed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="640" y="68" text-anchor="middle" font-size="26" font-weight="bold" fill="#333333">Firewall: Network Boundary Protection</text>
  <!-- Trusted box -->
  <rect x="60" y="170" width="260" height="340" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="60" y="170" width="260" height="54" fill="url(#grad-accent)" rx="10"/>
  <rect x="60" y="212" width="260" height="12" fill="url(#grad-accent)"/>
  <text x="190" y="207" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Trusted</text>
  <text x="190" y="298" text-anchor="middle" font-size="18" fill="#555555">Internal LAN</text>
  <text x="190" y="342" text-anchor="middle" font-size="18" fill="#555555">192.168.x.x</text>
  <!-- Firewall box -->
  <rect x="490" y="138" width="300" height="406" fill="#ffebee" stroke="#c62828" stroke-width="5" rx="10" filter="url(#shadow)"/>
  <text x="640" y="218" text-anchor="middle" font-size="24" font-weight="bold" fill="#c62828">FIREWALL</text>
  <text x="640" y="292" text-anchor="middle" font-size="19" fill="#333333">Rule Matching</text>
  <text x="640" y="344" text-anchor="middle" font-size="19" fill="#333333">ACCEPT / DROP</text>
  <text x="640" y="396" text-anchor="middle" font-size="19" fill="#333333">Stateful Inspect</text>
  <text x="640" y="448" text-anchor="middle" font-size="19" fill="#333333">NAT / Logging</text>
  <!-- Untrusted box -->
  <rect x="960" y="170" width="260" height="340" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="960" y="170" width="260" height="54" fill="url(#grad-accent)" rx="10"/>
  <rect x="960" y="212" width="260" height="12" fill="url(#grad-accent)"/>
  <text x="1090" y="207" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Untrusted</text>
  <text x="1090" y="298" text-anchor="middle" font-size="18" fill="#555555">Internet</text>
  <text x="1090" y="342" text-anchor="middle" font-size="18" fill="#555555">Public network</text>
  <!-- Arrows -->
  <line x1="320" y1="340" x2="490" y2="340" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="790" y1="340" x2="960" y2="340" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
</svg>

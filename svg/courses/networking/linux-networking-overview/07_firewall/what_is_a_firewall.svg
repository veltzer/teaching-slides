<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="85.714141357189" width="268.965542" height="485.714239273981" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.393256036721" filter="url(#shadow)"/>
  <rect x="40" y="85.714141357189" width="268.965542" height="77.142847070492" fill="url(#grad-primary)" rx="8.393256036721" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="145.714074772153" width="268.965542" height="17.142913655527" fill="url(#grad-primary)" rx="8.393256036721" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.482771" y="138.571356364003" text-anchor="middle" font-size="26.744549764822" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Trusted</text>
  <text x="174.482771" y="268.571417268894" text-anchor="middle" font-size="21.881917937013" fill="var(--text-muted)" font-family="Arial, sans-serif">Internal LAN</text>
  <text x="174.482771" y="331.428472281611" text-anchor="middle" font-size="21.881917937013" fill="var(--text-muted)" font-family="Arial, sans-serif">192.168.x.x</text>
  <rect x="484.827627" y="40" width="310.344856" height="580" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="8.393256036721" filter="url(#shadow)"/>
  <text x="640.000055" y="154.285620117182" text-anchor="middle" font-size="29.17579638076" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">FIREWALL</text>
  <text x="640.000055" y="260.000048958396" text-anchor="middle" font-size="23.097540703591" fill="var(--text)" font-family="Arial, sans-serif">Rule Matching</text>
  <text x="640.000055" y="334.285595051777" text-anchor="middle" font-size="23.097540703591" fill="var(--text)" font-family="Arial, sans-serif">ACCEPT / DROP</text>
  <text x="640.000055" y="408.571319352102" text-anchor="middle" font-size="23.097540703591" fill="var(--text)" font-family="Arial, sans-serif">Stateful Inspect</text>
  <text x="640.000055" y="482.857043652428" text-anchor="middle" font-size="23.097540703591" fill="var(--text)" font-family="Arial, sans-serif">NAT / Logging</text>
  <rect x="971.034458" y="85.714141357189" width="268.965542" height="485.714239273981" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.393256036721" filter="url(#shadow)"/>
  <rect x="971.034458" y="85.714141357189" width="268.965542" height="77.142847070492" fill="url(#grad-primary)" rx="8.393256036721" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="971.034458" y="145.714074772153" width="268.965542" height="17.142913655527" fill="url(#grad-primary)" rx="8.393256036721" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.517339" y="138.571356364003" text-anchor="middle" font-size="26.744549764822" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Untrusted</text>
  <text x="1105.517339" y="268.571417268894" text-anchor="middle" font-size="21.881917937013" fill="var(--text-muted)" font-family="Arial, sans-serif">Internet</text>
  <text x="1105.517339" y="331.428472281611" text-anchor="middle" font-size="21.881917937013" fill="var(--text-muted)" font-family="Arial, sans-serif">Public network</text>
  <line x1="308.965432" y1="328.571349511445" x2="484.827627" y2="328.571349511445" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="795.172483" y1="328.571349511445" x2="971.034458" y2="328.571349511445" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
</svg>

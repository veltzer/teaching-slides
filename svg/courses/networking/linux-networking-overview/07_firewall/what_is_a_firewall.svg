<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="640.000055" y="40" text-anchor="middle" font-size="29.190751" font-weight="bold" fill="var(--text)">Firewall: Network Boundary Protection</text>
  <rect x="40" y="164.285714" width="268.965542" height="414.285563" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.751575" filter="url(#shadow)" />
  <rect x="40" y="164.285714" width="268.965542" height="65.798293" fill="var(--primary-fill)" rx="7.751575" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="215.462114" width="268.965542" height="14.621893" fill="var(--primary-fill)" rx="7.751575" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.482771" y="209.369797" text-anchor="middle" font-size="24.699876" font-weight="bold" fill="var(--bg)">Trusted</text>
  <text x="174.482771" y="320.252172" text-anchor="middle" font-size="20.209002" fill="var(--text-muted)">Internal LAN</text>
  <text x="174.482771" y="373.865528" text-anchor="middle" font-size="20.209002" fill="var(--text-muted)">192.168.x.x</text>
  <rect x="484.827627" y="125.294251" width="310.344856" height="494.705749" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.751575" filter="url(#shadow)" />
  <text x="640.000055" y="222.773136" text-anchor="middle" font-size="26.945249" font-weight="bold" fill="var(--danger-accent)">FIREWALL</text>
  <text x="640.000055" y="312.941301" text-anchor="middle" font-size="21.331688" fill="var(--text)">Rule Matching</text>
  <text x="640.000055" y="376.302485" text-anchor="middle" font-size="21.331688" fill="var(--text)">ACCEPT / DROP</text>
  <text x="640.000055" y="439.663821" text-anchor="middle" font-size="21.331688" fill="var(--text)">Stateful Inspect</text>
  <text x="640.000055" y="503.025157" text-anchor="middle" font-size="21.331688" fill="var(--text)">NAT / Logging</text>
  <rect x="971.034458" y="164.285714" width="268.965542" height="414.285563" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.751575" filter="url(#shadow)" />
  <rect x="971.034458" y="164.285714" width="268.965542" height="65.798293" fill="var(--primary-fill)" rx="7.751575" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="971.034458" y="215.462114" width="268.965542" height="14.621893" fill="var(--primary-fill)" rx="7.751575" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.517339" y="209.369797" text-anchor="middle" font-size="24.699876" font-weight="bold" fill="var(--bg)">Untrusted</text>
  <text x="1105.517339" y="320.252172" text-anchor="middle" font-size="20.209002" fill="var(--text-muted)">Internet</text>
  <text x="1105.517339" y="373.865528" text-anchor="middle" font-size="20.209002" fill="var(--text-muted)">Public network</text>
  <line x1="308.965432" y1="371.428571" x2="484.827627" y2="371.428571" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="795.172483" y1="371.428571" x2="971.034458" y2="371.428571" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <text x="40" y="99.793901" text-anchor="middle" font-family="sans-serif" font-size="13.940907" fill="var(--text-faint)">L7 App</text>
  <text x="40" y="239.312591" text-anchor="middle" font-family="sans-serif" font-size="13.940907" fill="var(--text-faint)">L4 Transport</text>
  <text x="40" y="378.831777" text-anchor="middle" font-family="sans-serif" font-size="13.940907" fill="var(--text-faint)">L3 Network</text>
  <line x1="73.83084" y1="59.931259" x2="73.83084" y2="548.247541" stroke="var(--border)" stroke-width="1.3333" />
  <text x="81.2499" y="302.6111" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)" transform="rotate(-90 44 326)">OSI Layer</text>
  <rect x="85.771242" y="319.037876" width="338.308292" height="219.244098" rx="6.875231" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="254.925441" y="356.90728" text-anchor="middle" font-family="sans-serif" font-size="17.924301" font-weight="bold" fill="var(--text)">Packet Filtering</text>
  <text x="254.925441" y="378.831777" text-anchor="middle" font-family="sans-serif" font-size="13.940907" fill="var(--text-muted)">Layer 3/4 only</text>
  <line x1="85.771242" y1="390.790458" x2="424.079534" y2="390.790458" stroke="var(--border)" stroke-width="0.8889" />
  <text x="105.671736" y="414.708068" font-family="sans-serif" font-size="13.940907" fill="var(--text-muted)">Inspects: src/dst IP, port, protocol</text>
  <text x="105.671736" y="436.632317" font-family="sans-serif" font-size="13.940907" fill="var(--text-muted)">Stateless — each packet independent</text>
  <text x="105.671736" y="458.556813" font-family="sans-serif" font-size="13.940907" fill="var(--text-muted)">Fast — minimal CPU overhead</text>
  <text x="105.671736" y="482.4743" font-family="monospace" font-size="13.30277" fill="var(--primary-accent)">iptables -A INPUT -p tcp --dport 22</text>
  <text x="105.671736" y="502.405559" font-family="sans-serif" font-size="13.30277" fill="var(--text-faint)">No payload inspection · blind to attacks</text>
  <text x="105.671736" y="522.336818" font-family="sans-serif" font-size="13.30277" fill="var(--text-faint)">within allowed ports</text>
  <rect x="463.880628" y="179.518938" width="338.308292" height="358.762912" rx="6.875231" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="633.034721" y="217.388466" text-anchor="middle" font-family="sans-serif" font-size="17.924301" font-weight="bold" fill="var(--text)">Stateful Inspection</text>
  <text x="633.034721" y="239.312591" text-anchor="middle" font-family="sans-serif" font-size="13.940907" fill="var(--primary-accent)">Layer 3/4 + connection state</text>
  <line x1="463.880628" y1="251.27152" x2="802.189026" y2="251.27152" stroke="var(--border)" stroke-width="0.8889" />
  <text x="483.78091" y="275.188883" font-family="sans-serif" font-size="13.940907" fill="var(--text-muted)">Tracks connection state table</text>
  <text x="483.78091" y="297.113503" font-family="sans-serif" font-size="13.940907" fill="var(--text-muted)">NEW → ESTABLISHED → RELATED</text>
  <text x="483.78091" y="319.037876" font-family="sans-serif" font-size="13.940907" fill="var(--text-muted)">Allows return traffic automatically</text>
  <text x="483.78091" y="342.955485" font-family="monospace" font-size="13.30277" fill="var(--primary-accent)">-m conntrack --ctstate ESTABLISHED</text>
  <text x="483.78091" y="368.865962" font-family="sans-serif" font-size="13.940907" fill="var(--text-muted)">Blocks spoofed packets + port scans</text>
  <text x="483.78091" y="392.783448" font-family="sans-serif" font-size="13.940907" fill="var(--text-muted)">More CPU than packet filter</text>
  <text x="483.78091" y="416.701058" font-family="sans-serif" font-size="13.30277" fill="var(--text-faint)">Still blind to payload content</text>
  <text x="483.78091" y="440.618668" font-family="sans-serif" font-size="13.30277" fill="var(--text-faint)">Used by: nftables, iptables conntrack</text>
  <text x="483.78091" y="468.522505" font-family="sans-serif" font-size="13.30277" fill="var(--text-faint)">Most common type for host firewalls</text>
  <text x="483.78091" y="488.45364" font-family="sans-serif" font-size="13.30277" fill="var(--text-faint)">Used by: nftables, iptables conntrack</text>
  <text x="483.78091" y="512.37125" font-family="sans-serif" font-size="13.30277" fill="var(--primary-accent)">✓ Default recommendation</text>
  <rect x="841.989908" y="40" width="398.00988" height="498.281726" rx="6.875231" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1040.994742" y="77.869405" text-anchor="middle" font-family="sans-serif" font-size="17.924301" font-weight="bold" fill="var(--bg)">Application Layer</text>
  <text x="1040.994742" y="99.793901" text-anchor="middle" font-family="sans-serif" font-size="13.940907" fill="var(--primary-accent)">Layer 7 deep inspection</text>
  <line x1="841.989908" y1="111.752459" x2="1240" y2="111.752459" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="861.890402" y="135.670069" font-family="sans-serif" font-size="13.940907" fill="var(--bg)">Reads HTTP/DNS/TLS payload</text>
  <text x="861.890402" y="157.594565" font-family="sans-serif" font-size="13.940907" fill="var(--bg)">URL filtering, content inspection</text>
  <text x="861.890402" y="179.518938" font-family="sans-serif" font-size="13.940907" fill="var(--bg)">Block by hostname, not just IP</text>
  <text x="861.890402" y="203.436424" font-family="sans-serif" font-size="13.940907" fill="var(--bg)">SSL/TLS termination + inspection</text>
  <text x="861.890402" y="227.35391" font-family="monospace" font-size="13.30277" fill="var(--primary-accent)">WAF, squid proxy, nfqueue</text>
  <text x="861.890402" y="253.264757" font-family="sans-serif" font-size="13.940907" fill="var(--primary-accent)">Can detect SQL injection, XSS</text>
  <text x="861.890402" y="277.182244" font-family="sans-serif" font-size="13.940907" fill="var(--primary-accent)">in HTTP traffic</text>
  <text x="861.890402" y="301.09973" font-family="sans-serif" font-size="13.940907" fill="var(--primary-accent)">Much higher CPU overhead</text>
  <text x="861.890402" y="325.01734" font-family="sans-serif" font-size="13.940907" fill="var(--primary-accent)">Can break TLS cert pinning</text>
  <text x="861.890402" y="352.920929" font-family="sans-serif" font-size="13.30277" fill="var(--primary-accent)">Used by: AWS WAF, nginx WAF,</text>
  <text x="861.890402" y="372.852312" font-family="sans-serif" font-size="13.30277" fill="var(--primary-accent)">ModSecurity, Cloudflare</text>
  <text x="861.890402" y="402.749263" font-family="sans-serif" font-size="13.30277" fill="var(--primary-accent)">✓ Best for web-facing services</text>
  <rect x="85.771242" y="578.144368" width="1154.228758" height="41.855632" rx="6.875231" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="662.885568" y="604.054968" text-anchor="middle" font-family="sans-serif" font-size="15.932546" fill="var(--primary-accent)">Linux stack: <tspan font-family="monospace">iptables/nftables</tspan> (L3/4) → <tspan font-family="monospace">conntrack</tspan> (stateful) → <tspan font-family="monospace">nfqueue + userspace</tspan> (L7)</text>
</svg>
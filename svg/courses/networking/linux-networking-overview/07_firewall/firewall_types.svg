<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="380" height="530.285714285714" rx="10.510765456245" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="89.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--warn-text)">Packet Filter</text>
  <text x="230" y="117.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Layer 3/4</text>
  <text x="70" y="172.571428571429" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">IP, port, protocol</text>
  <text x="70" y="205.714285714286" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Stateless</text>
  <text x="70" y="238.857142857143" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--warn-text)">Fast, low CPU</text>
  <text x="70" y="288.571428571428" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--warn-text)">iptables -A INPUT</text>
  <text x="70" y="343.809523809524" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--warn-text)">No payload view</text>

  <rect x="450" y="40" width="380" height="530.285714285714" rx="10.510765456245" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="89.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--ok-text)">Stateful</text>
  <text x="640" y="117.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">L3/4 + conn state</text>
  <text x="480" y="172.571428571429" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Conn state table</text>
  <text x="480" y="205.714285714286" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">NEW, ESTABLISHED</text>
  <text x="480" y="238.857142857143" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--ok-text)">Auto return traffic</text>
  <text x="480" y="288.571428571428" font-family="Courier New, monospace" font-size="13.663995093118" fill="var(--ok-text)">--ctstate ESTABLISHED</text>
  <text x="480" y="338.285714285715" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--ok-text)">Blocks spoofed packets</text>
  <text x="480" y="371.428571428572" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--ok-text)">nftables / conntrack</text>
  <text x="480" y="415.619047619048" font-family="Arial, sans-serif" font-size="13.663995093118" font-weight="bold" fill="var(--ok-text)">Default choice</text>

  <rect x="860" y="40" width="380" height="530.285714285714" rx="10.510765456245" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="89.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.02153091249" font-weight="bold" fill="var(--primary-text)">Application</text>
  <text x="1050" y="117.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">Layer 7</text>
  <text x="880" y="172.571428571429" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">Reads HTTP/DNS/TLS</text>
  <text x="880" y="205.714285714286" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">URL filtering</text>
  <text x="880" y="238.857142857143" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">Hostname blocks</text>
  <text x="880" y="272" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--primary-text)">TLS inspection</text>
  <text x="880" y="321.714285714286" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--primary-text)">Detects SQLi, XSS</text>
  <text x="880" y="354.857142857143" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--primary-text)">Higher CPU</text>
  <text x="880" y="399.047619047619" font-family="Arial, sans-serif" font-size="13.663995093118" fill="var(--primary-text)">WAF, ModSecurity</text>
  <text x="880" y="443.238095238096" font-family="Arial, sans-serif" font-size="13.663995093118" font-weight="bold" fill="var(--primary-text)">Best for web</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.715071638743" fill="var(--text-muted)">Linux: iptables then conntrack then nfqueue</text>
</svg>

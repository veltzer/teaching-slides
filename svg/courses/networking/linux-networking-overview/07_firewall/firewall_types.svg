<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <text x="39.1111" y="106.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">L7 App</text>
  <text x="39.1111" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">L4 Transport</text>
  <text x="39.1111" y="355.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-faint)">L3 Network</text>
  <line x1="69.3333" y1="71.1111" x2="69.3333" y2="506.6667" stroke="var(--border)" stroke-width="1.3333" />
  <text x="39.1111" y="289.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)" transform="rotate(-90 44 326)">OSI Layer</text>
  <rect x="80" y="302.2222" width="302.2222" height="195.5556" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="231.1111" y="336" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Packet Filtering</text>
  <text x="231.1111" y="355.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Layer 3/4 only</text>
  <line x1="80" y1="366.2222" x2="382.2222" y2="366.2222" stroke="var(--border)" stroke-width="0.8889" />
  <text x="97.7778" y="387.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Inspects: src/dst IP, port, protocol</text>
  <text x="97.7778" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Stateless — each packet independent</text>
  <text x="97.7778" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Fast — minimal CPU overhead</text>
  <text x="97.7778" y="448" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">iptables -A INPUT -p tcp --dport 22</text>
  <text x="97.7778" y="465.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">No payload inspection · blind to attacks</text>
  <text x="97.7778" y="483.5556" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">within allowed ports</text>
  <rect x="417.7778" y="177.7778" width="302.2222" height="320" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="568.8889" y="211.5556" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Stateful Inspection</text>
  <text x="568.8889" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">Layer 3/4 + connection state</text>
  <line x1="417.7778" y1="241.7778" x2="720" y2="241.7778" stroke="var(--border)" stroke-width="0.8889" />
  <text x="435.5556" y="263.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Tracks connection state table</text>
  <text x="435.5556" y="282.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">NEW → ESTABLISHED → RELATED</text>
  <text x="435.5556" y="302.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Allows return traffic automatically</text>
  <text x="435.5556" y="323.5556" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">-m conntrack --ctstate ESTABLISHED</text>
  <text x="435.5556" y="346.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Blocks spoofed packets + port scans</text>
  <text x="435.5556" y="368" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">More CPU than packet filter</text>
  <text x="435.5556" y="389.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Still blind to payload content</text>
  <text x="435.5556" y="410.6667" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Used by: nftables, iptables conntrack</text>
  <text x="435.5556" y="435.5556" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Most common type for host firewalls</text>
  <text x="435.5556" y="453.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-faint)">Used by: nftables, iptables conntrack</text>
  <text x="435.5556" y="474.6667" font-family="sans-serif" font-size="11.5556" fill="var(--primary-accent)">✓ Default recommendation</text>
  <rect x="755.5556" y="53.3333" width="355.5556" height="444.4444" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="933.3333" y="87.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Application Layer</text>
  <text x="933.3333" y="106.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">Layer 7 deep inspection</text>
  <line x1="755.5556" y1="117.3333" x2="1111.1111" y2="117.3333" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="773.3333" y="138.6667" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">Reads HTTP/DNS/TLS payload</text>
  <text x="773.3333" y="158.2222" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">URL filtering, content inspection</text>
  <text x="773.3333" y="177.7778" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">Block by hostname, not just IP</text>
  <text x="773.3333" y="199.1111" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">SSL/TLS termination + inspection</text>
  <text x="773.3333" y="220.4444" font-family="monospace" font-size="11.5556" fill="var(--primary-accent)">WAF, squid proxy, nfqueue</text>
  <text x="773.3333" y="243.5556" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">Can detect SQL injection, XSS</text>
  <text x="773.3333" y="264.8889" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">in HTTP traffic</text>
  <text x="773.3333" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">Much higher CPU overhead</text>
  <text x="773.3333" y="307.5556" font-family="sans-serif" font-size="12.4444" fill="var(--primary-accent)">Can break TLS cert pinning</text>
  <text x="773.3333" y="332.4444" font-family="sans-serif" font-size="11.5556" fill="var(--primary-accent)">Used by: AWS WAF, nginx WAF,</text>
  <text x="773.3333" y="350.2222" font-family="sans-serif" font-size="11.5556" fill="var(--primary-accent)">ModSecurity, Cloudflare</text>
  <text x="773.3333" y="376.8889" font-family="sans-serif" font-size="11.5556" fill="var(--primary-accent)">✓ Best for web-facing services</text>
  <rect x="80" y="533.3333" width="1031.1111" height="37.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="595.5556" y="556.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-accent)">Linux stack: <tspan font-family="monospace">iptables/nftables</tspan> (L3/4) → <tspan font-family="monospace">conntrack</tspan> (stateful) → <tspan font-family="monospace">nfqueue + userspace</tspan> (L7)</text>
</svg>
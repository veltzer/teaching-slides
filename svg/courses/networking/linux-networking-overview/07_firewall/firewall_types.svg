<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <text x="81.2499" y="136.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-faint)">L7 App</text>
  <text x="81.2499" y="249.4443" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-faint)">L4 Transport</text>
  <text x="81.2499" y="362.2223" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-faint)">L3 Network</text>
  <line x1="113.1249" y1="104.4444" x2="113.1249" y2="499.1667" stroke="var(--border)" stroke-width="1.3333" />
  <text x="81.2499" y="302.6111" text-anchor="middle" font-family="sans-serif" font-size="11.6093" fill="var(--text-muted)" transform="rotate(-90 44 326)">OSI Layer</text>
  <rect x="124.375" y="313.8889" width="318.7499" height="177.2223" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="283.75" y="344.5" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Packet Filtering</text>
  <text x="283.75" y="362.2223" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Layer 3/4 only</text>
  <line x1="124.375" y1="371.8889" x2="443.1249" y2="371.8889" stroke="var(--border)" stroke-width="0.8889" />
  <text x="143.125" y="391.2223" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Inspects: src/dst IP, port, protocol</text>
  <text x="143.125" y="408.9444" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Stateless — each packet independent</text>
  <text x="143.125" y="426.6667" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Fast — minimal CPU overhead</text>
  <text x="143.125" y="446" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">iptables -A INPUT -p tcp --dport 22</text>
  <text x="143.125" y="462.1111" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">No payload inspection · blind to attacks</text>
  <text x="143.125" y="478.2222" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">within allowed ports</text>
  <rect x="480.625" y="201.1111" width="318.7499" height="290" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="639.9999" y="231.7223" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--text)">Stateful Inspection</text>
  <text x="639.9999" y="249.4443" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--primary-accent)">Layer 3/4 + connection state</text>
  <line x1="480.625" y1="259.1111" x2="799.375" y2="259.1111" stroke="var(--border)" stroke-width="0.8889" />
  <text x="499.3748" y="278.4443" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Tracks connection state table</text>
  <text x="499.3748" y="296.1667" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">NEW → ESTABLISHED → RELATED</text>
  <text x="499.3748" y="313.8889" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Allows return traffic automatically</text>
  <text x="499.3748" y="333.2223" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">-m conntrack --ctstate ESTABLISHED</text>
  <text x="499.3748" y="354.1666" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">Blocks spoofed packets + port scans</text>
  <text x="499.3748" y="373.4999" font-family="sans-serif" font-size="12.1662" fill="var(--text-muted)">More CPU than packet filter</text>
  <text x="499.3748" y="392.8333" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">Still blind to payload content</text>
  <text x="499.3748" y="412.1667" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">Used by: nftables, iptables conntrack</text>
  <text x="499.3748" y="434.7223" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">Most common type for host firewalls</text>
  <text x="499.3748" y="450.8333" font-family="sans-serif" font-size="11.6093" fill="var(--text-faint)">Used by: nftables, iptables conntrack</text>
  <text x="499.3748" y="470.1667" font-family="sans-serif" font-size="11.6093" fill="var(--primary-accent)">✓ Default recommendation</text>
  <rect x="836.8749" y="88.3333" width="375" height="402.7777" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1024.3748" y="118.9444" text-anchor="middle" font-family="sans-serif" font-size="15.6425" font-weight="bold" fill="var(--bg)">Application Layer</text>
  <text x="1024.3748" y="136.6667" text-anchor="middle" font-family="sans-serif" font-size="12.1662" fill="var(--primary-accent)">Layer 7 deep inspection</text>
  <line x1="836.8749" y1="146.3332" x2="1211.8751" y2="146.3332" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="855.6249" y="165.6666" font-family="sans-serif" font-size="12.1662" fill="var(--bg)">Reads HTTP/DNS/TLS payload</text>
  <text x="855.6249" y="183.3889" font-family="sans-serif" font-size="12.1662" fill="var(--bg)">URL filtering, content inspection</text>
  <text x="855.6249" y="201.1111" font-family="sans-serif" font-size="12.1662" fill="var(--bg)">Block by hostname, not just IP</text>
  <text x="855.6249" y="220.4444" font-family="sans-serif" font-size="12.1662" fill="var(--bg)">SSL/TLS termination + inspection</text>
  <text x="855.6249" y="239.7777" font-family="monospace" font-size="11.6093" fill="var(--primary-accent)">WAF, squid proxy, nfqueue</text>
  <text x="855.6249" y="260.7223" font-family="sans-serif" font-size="12.1662" fill="var(--primary-accent)">Can detect SQL injection, XSS</text>
  <text x="855.6249" y="280.0556" font-family="sans-serif" font-size="12.1662" fill="var(--primary-accent)">in HTTP traffic</text>
  <text x="855.6249" y="299.3889" font-family="sans-serif" font-size="12.1662" fill="var(--primary-accent)">Much higher CPU overhead</text>
  <text x="855.6249" y="318.7223" font-family="sans-serif" font-size="12.1662" fill="var(--primary-accent)">Can break TLS cert pinning</text>
  <text x="855.6249" y="341.2777" font-family="sans-serif" font-size="11.6093" fill="var(--primary-accent)">Used by: AWS WAF, nginx WAF,</text>
  <text x="855.6249" y="357.3889" font-family="sans-serif" font-size="11.6093" fill="var(--primary-accent)">ModSecurity, Cloudflare</text>
  <text x="855.6249" y="381.5556" font-family="sans-serif" font-size="11.6093" fill="var(--primary-accent)">✓ Best for web-facing services</text>
  <rect x="124.375" y="523.3333" width="1087.5001" height="33.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="668.125" y="544.2777" text-anchor="middle" font-family="sans-serif" font-size="13.9043" fill="var(--primary-accent)">Linux stack: <tspan font-family="monospace">iptables/nftables</tspan> (L3/4) → <tspan font-family="monospace">conntrack</tspan> (stateful) → <tspan font-family="monospace">nfqueue + userspace</tspan> (L7)</text>
</svg>
<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <ns0:defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:text x="39.1111" y="106.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">L7 App</ns0:text>
  <ns0:text x="39.1111" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">L4 Transport</ns0:text>
  <ns0:text x="39.1111" y="355.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-disabled)">L3 Network</ns0:text>
  <ns0:line x1="69.3333" y1="71.1111" x2="69.3333" y2="506.6667" stroke="var(--border)" stroke-width="1.3333" />
  <ns0:text x="39.1111" y="289.7778" text-anchor="middle" font-family="sans-serif" font-size="11.5556" fill="var(--text-muted)" transform="rotate(-90 44 326)">OSI Layer</ns0:text>
  <ns0:rect x="80" y="302.2222" width="302.2222" height="195.5556" rx="7.1111" fill="url(#grad-surface)" stroke="var(--border)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="231.1111" y="336" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Packet Filtering</ns0:text>
  <ns0:text x="231.1111" y="355.5556" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Layer 3/4 only</ns0:text>
  <ns0:line x1="80" y1="366.2222" x2="382.2222" y2="366.2222" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="97.7778" y="387.5556" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Inspects: src/dst IP, port, protocol</ns0:text>
  <ns0:text x="97.7778" y="407.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Stateless — each packet independent</ns0:text>
  <ns0:text x="97.7778" y="426.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Fast — minimal CPU overhead</ns0:text>
  <ns0:text x="97.7778" y="448" font-family="monospace" font-size="11.5556" fill="var(--primary-dk)">iptables -A INPUT -p tcp --dport 22</ns0:text>
  <ns0:text x="97.7778" y="465.7778" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">No payload inspection · blind to attacks</ns0:text>
  <ns0:text x="97.7778" y="483.5556" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">within allowed ports</ns0:text>
  <ns0:rect x="417.7778" y="177.7778" width="302.2222" height="320" rx="7.1111" fill="url(#grad-surface)" stroke="var(--primary-dk)" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="568.8889" y="211.5556" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Stateful Inspection</ns0:text>
  <ns0:text x="568.8889" y="231.1111" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-dk)">Layer 3/4 + connection state</ns0:text>
  <ns0:line x1="417.7778" y1="241.7778" x2="720" y2="241.7778" stroke="var(--border)" stroke-width="0.8889" />
  <ns0:text x="435.5556" y="263.1111" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Tracks connection state table</ns0:text>
  <ns0:text x="435.5556" y="282.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">NEW → ESTABLISHED → RELATED</ns0:text>
  <ns0:text x="435.5556" y="302.2222" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Allows return traffic automatically</ns0:text>
  <ns0:text x="435.5556" y="323.5556" font-family="monospace" font-size="11.5556" fill="var(--primary-dk)">-m conntrack --ctstate ESTABLISHED</ns0:text>
  <ns0:text x="435.5556" y="346.6667" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">Blocks spoofed packets + port scans</ns0:text>
  <ns0:text x="435.5556" y="368" font-family="sans-serif" font-size="12.4444" fill="var(--text-muted)">More CPU than packet filter</ns0:text>
  <ns0:text x="435.5556" y="389.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Still blind to payload content</ns0:text>
  <ns0:text x="435.5556" y="410.6667" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Used by: nftables, iptables conntrack</ns0:text>
  <ns0:text x="435.5556" y="435.5556" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Most common type for host firewalls</ns0:text>
  <ns0:text x="435.5556" y="453.3333" font-family="sans-serif" font-size="11.5556" fill="var(--text-disabled)">Used by: nftables, iptables conntrack</ns0:text>
  <ns0:text x="435.5556" y="474.6667" font-family="sans-serif" font-size="11.5556" fill="var(--primary-dk)">✓ Default recommendation</ns0:text>
  <ns0:rect x="755.5556" y="53.3333" width="355.5556" height="444.4444" rx="7.1111" fill="url(#grad-primary)" filter="url(#shadow)" />
  <ns0:text x="933.3333" y="87.1111" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="var(--bg)">Application Layer</ns0:text>
  <ns0:text x="933.3333" y="106.6667" text-anchor="middle" font-family="sans-serif" font-size="12.4444" fill="var(--primary-lt)">Layer 7 deep inspection</ns0:text>
  <ns0:line x1="755.5556" y1="117.3333" x2="1111.1111" y2="117.3333" stroke="var(--primary-deep)" stroke-width="0.8889" />
  <ns0:text x="773.3333" y="138.6667" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">Reads HTTP/DNS/TLS payload</ns0:text>
  <ns0:text x="773.3333" y="158.2222" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">URL filtering, content inspection</ns0:text>
  <ns0:text x="773.3333" y="177.7778" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">Block by hostname, not just IP</ns0:text>
  <ns0:text x="773.3333" y="199.1111" font-family="sans-serif" font-size="12.4444" fill="var(--bg)">SSL/TLS termination + inspection</ns0:text>
  <ns0:text x="773.3333" y="220.4444" font-family="monospace" font-size="11.5556" fill="var(--primary-tint)">WAF, squid proxy, nfqueue</ns0:text>
  <ns0:text x="773.3333" y="243.5556" font-family="sans-serif" font-size="12.4444" fill="var(--primary-lt)">Can detect SQL injection, XSS</ns0:text>
  <ns0:text x="773.3333" y="264.8889" font-family="sans-serif" font-size="12.4444" fill="var(--primary-lt)">in HTTP traffic</ns0:text>
  <ns0:text x="773.3333" y="286.2222" font-family="sans-serif" font-size="12.4444" fill="var(--primary-lt)">Much higher CPU overhead</ns0:text>
  <ns0:text x="773.3333" y="307.5556" font-family="sans-serif" font-size="12.4444" fill="var(--primary-lt)">Can break TLS cert pinning</ns0:text>
  <ns0:text x="773.3333" y="332.4444" font-family="sans-serif" font-size="11.5556" fill="var(--primary-tint)">Used by: AWS WAF, nginx WAF,</ns0:text>
  <ns0:text x="773.3333" y="350.2222" font-family="sans-serif" font-size="11.5556" fill="var(--primary-tint)">ModSecurity, Cloudflare</ns0:text>
  <ns0:text x="773.3333" y="376.8889" font-family="sans-serif" font-size="11.5556" fill="var(--primary-tint)">✓ Best for web-facing services</ns0:text>
  <ns0:rect x="80" y="533.3333" width="1031.1111" height="37.3333" rx="5.3333" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <ns0:text x="595.5556" y="556.4444" text-anchor="middle" font-family="sans-serif" font-size="14.2222" fill="var(--primary-dk)">Linux stack: <ns0:tspan font-family="monospace">iptables/nftables</ns0:tspan> (L3/4) → <ns0:tspan font-family="monospace">conntrack</ns0:tspan> (stateful) → <ns0:tspan font-family="monospace">nfqueue + userspace</ns0:tspan> (L7)</ns0:text>
</ns0:svg>
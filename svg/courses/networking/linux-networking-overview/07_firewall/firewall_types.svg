<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.534586728656" font-weight="bold" fill="var(--text)">Firewall Types</text>

  <rect x="40" y="71.351351351351" width="380" height="501.621621621622" rx="10.222744470273" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="118.378378378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--warn-text)">Packet Filter</text>
  <text x="230" y="144.504504504504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Layer 3/4</text>
  <text x="70" y="196.756756756757" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">IP, port, protocol</text>
  <text x="70" y="228.108108108108" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Stateless</text>
  <text x="70" y="259.459459459459" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--warn-text)">Fast, low CPU</text>
  <text x="70" y="306.486486486486" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--warn-text)">iptables -A INPUT</text>
  <text x="70" y="358.738738738739" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--warn-text)">No payload view</text>

  <rect x="450" y="71.351351351351" width="380" height="501.621621621622" rx="10.222744470273" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="118.378378378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--ok-text)">Stateful</text>
  <text x="640" y="144.504504504504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">L3/4 + conn state</text>
  <text x="480" y="196.756756756757" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Conn state table</text>
  <text x="480" y="228.108108108108" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">NEW, ESTABLISHED</text>
  <text x="480" y="259.459459459459" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--ok-text)">Auto return traffic</text>
  <text x="480" y="306.486486486486" font-family="Courier New, monospace" font-size="13.289567811355" fill="var(--ok-text)">--ctstate ESTABLISHED</text>
  <text x="480" y="353.513513513514" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">Blocks spoofed packets</text>
  <text x="480" y="384.864864864865" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--ok-text)">nftables / conntrack</text>
  <text x="480" y="426.666666666667" font-family="Arial, sans-serif" font-size="13.289567811355" font-weight="bold" fill="var(--ok-text)">Default choice</text>

  <rect x="860" y="71.351351351351" width="380" height="501.621621621622" rx="10.222744470273" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="118.378378378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.445488940547" font-weight="bold" fill="var(--primary-text)">Application</text>
  <text x="1050" y="144.504504504504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Layer 7</text>
  <text x="880" y="196.756756756757" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Reads HTTP/DNS/TLS</text>
  <text x="880" y="228.108108108108" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">URL filtering</text>
  <text x="880" y="259.459459459459" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">Hostname blocks</text>
  <text x="880" y="290.810810810811" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--primary-text)">TLS inspection</text>
  <text x="880" y="337.837837837838" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">Detects SQLi, XSS</text>
  <text x="880" y="369.189189189189" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">Higher CPU</text>
  <text x="880" y="410.990990990991" font-family="Arial, sans-serif" font-size="13.289567811355" fill="var(--primary-text)">WAF, ModSecurity</text>
  <text x="880" y="452.792792792793" font-family="Arial, sans-serif" font-size="13.289567811355" font-weight="bold" fill="var(--primary-text)">Best for web</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.311842258383" fill="var(--text-muted)">Linux: iptables then conntrack then nfqueue</text>
</svg>

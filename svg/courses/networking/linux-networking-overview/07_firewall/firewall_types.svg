<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <text x="40" y="99.793901" text-anchor="middle" font-size="13.940907" fill="var(--text-faint)" font-family="Arial, sans-serif">L7 App</text>
  <text x="40" y="239.312591" text-anchor="middle" font-size="13.940907" fill="var(--text-faint)" font-family="Arial, sans-serif">L4 Transport</text>
  <text x="40" y="378.831777" text-anchor="middle" font-size="13.940907" fill="var(--text-faint)" font-family="Arial, sans-serif">L3 Network</text>
  <line x1="73.83084" y1="59.931259" x2="73.83084" y2="548.247541" stroke="var(--border)" stroke-width="1.3333" />
  <text x="81.2499" y="302.6111" text-anchor="middle" font-size="11.6093" fill="var(--text-muted)" transform="rotate(-90 44 326)" font-family="Arial, sans-serif">OSI Layer</text>
  <rect x="85.771242" y="319.037876" width="338.308292" height="219.244098" rx="6.875231" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="254.925441" y="356.90728" text-anchor="middle" font-size="17.924301" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Packet Filtering</text>
  <text x="254.925441" y="378.831777" text-anchor="middle" font-size="13.940907" fill="var(--text-muted)" font-family="Arial, sans-serif">Layer 3/4 only</text>
  <line x1="85.771242" y1="390.790458" x2="424.079534" y2="390.790458" stroke="var(--border)" stroke-width="0.8889" />
  <text x="105.671736" y="414.708068" font-size="13.940907" fill="var(--text-muted)" font-family="Arial, sans-serif">Inspects: src/dst IP, port, protocol</text>
  <text x="105.671736" y="436.632317" font-size="13.940907" fill="var(--text-muted)" font-family="Arial, sans-serif">Stateless — each packet independent</text>
  <text x="105.671736" y="458.556813" font-size="13.940907" fill="var(--text-muted)" font-family="Arial, sans-serif">Fast — minimal CPU overhead</text>
  <text x="105.671736" y="482.4743" font-size="13.30277" fill="var(--primary-accent)" font-family="Courier New, monospace">iptables -A INPUT -p tcp --dport 22</text>
  <text x="105.671736" y="502.405559" font-size="13.30277" fill="var(--text-faint)" font-family="Arial, sans-serif">No payload inspection · blind to attacks</text>
  <text x="105.671736" y="522.336818" font-size="13.30277" fill="var(--text-faint)" font-family="Arial, sans-serif">within allowed ports</text>
  <rect x="463.880628" y="179.518938" width="338.308292" height="358.762912" rx="6.875231" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="633.034721" y="217.388466" text-anchor="middle" font-size="17.924301" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">Stateful Inspection</text>
  <text x="633.034721" y="239.312591" text-anchor="middle" font-size="13.940907" fill="var(--primary-accent)" font-family="Arial, sans-serif">Layer 3/4 + connection state</text>
  <line x1="463.880628" y1="251.27152" x2="802.189026" y2="251.27152" stroke="var(--border)" stroke-width="0.8889" />
  <text x="483.78091" y="275.188883" font-size="13.940907" fill="var(--text-muted)" font-family="Arial, sans-serif">Tracks connection state table</text>
  <text x="483.78091" y="297.113503" font-size="13.940907" fill="var(--text-muted)" font-family="Arial, sans-serif">NEW → ESTABLISHED → RELATED</text>
  <text x="483.78091" y="319.037876" font-size="13.940907" fill="var(--text-muted)" font-family="Arial, sans-serif">Allows return traffic automatically</text>
  <text x="483.78091" y="342.955485" font-size="13.30277" fill="var(--primary-accent)" font-family="Courier New, monospace">-m conntrack --ctstate ESTABLISHED</text>
  <text x="483.78091" y="368.865962" font-size="13.940907" fill="var(--text-muted)" font-family="Arial, sans-serif">Blocks spoofed packets + port scans</text>
  <text x="483.78091" y="392.783448" font-size="13.940907" fill="var(--text-muted)" font-family="Arial, sans-serif">More CPU than packet filter</text>
  <text x="483.78091" y="416.701058" font-size="13.30277" fill="var(--text-faint)" font-family="Arial, sans-serif">Still blind to payload content</text>
  <text x="483.78091" y="440.618668" font-size="13.30277" fill="var(--text-faint)" font-family="Arial, sans-serif">Used by: nftables, iptables conntrack</text>
  <text x="483.78091" y="468.522505" font-size="13.30277" fill="var(--text-faint)" font-family="Arial, sans-serif">Most common type for host firewalls</text>
  <text x="483.78091" y="488.45364" font-size="13.30277" fill="var(--text-faint)" font-family="Arial, sans-serif">Used by: nftables, iptables conntrack</text>
  <text x="483.78091" y="512.37125" font-size="13.30277" fill="var(--primary-accent)" font-family="Arial, sans-serif">✓ Default recommendation</text>
  <rect x="841.989908" y="40" width="398.00988" height="498.281726" rx="6.875231" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040.994742" y="77.869405" text-anchor="middle" font-size="17.924301" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Application Layer</text>
  <text x="1040.994742" y="99.793901" text-anchor="middle" font-size="13.940907" fill="var(--primary-accent)" font-family="Arial, sans-serif">Layer 7 deep inspection</text>
  <line x1="841.989908" y1="111.752459" x2="1240" y2="111.752459" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="861.890402" y="135.670069" font-size="13.940907" fill="var(--bg)" font-family="Arial, sans-serif">Reads HTTP/DNS/TLS payload</text>
  <text x="861.890402" y="157.594565" font-size="13.940907" fill="var(--bg)" font-family="Arial, sans-serif">URL filtering, content inspection</text>
  <text x="861.890402" y="179.518938" font-size="13.940907" fill="var(--bg)" font-family="Arial, sans-serif">Block by hostname, not just IP</text>
  <text x="861.890402" y="203.436424" font-size="13.940907" fill="var(--bg)" font-family="Arial, sans-serif">SSL/TLS termination + inspection</text>
  <text x="861.890402" y="227.35391" font-size="13.30277" fill="var(--primary-accent)" font-family="Courier New, monospace">WAF, squid proxy, nfqueue</text>
  <text x="861.890402" y="253.264757" font-size="13.940907" fill="var(--primary-accent)" font-family="Arial, sans-serif">Can detect SQL injection, XSS</text>
  <text x="861.890402" y="277.182244" font-size="13.940907" fill="var(--primary-accent)" font-family="Arial, sans-serif">in HTTP traffic</text>
  <text x="861.890402" y="301.09973" font-size="13.940907" fill="var(--primary-accent)" font-family="Arial, sans-serif">Much higher CPU overhead</text>
  <text x="861.890402" y="325.01734" font-size="13.940907" fill="var(--primary-accent)" font-family="Arial, sans-serif">Can break TLS cert pinning</text>
  <text x="861.890402" y="352.920929" font-size="13.30277" fill="var(--primary-accent)" font-family="Arial, sans-serif">Used by: AWS WAF, nginx WAF,</text>
  <text x="861.890402" y="372.852312" font-size="13.30277" fill="var(--primary-accent)" font-family="Arial, sans-serif">ModSecurity, Cloudflare</text>
  <text x="861.890402" y="402.749263" font-size="13.30277" fill="var(--primary-accent)" font-family="Arial, sans-serif">✓ Best for web-facing services</text>
  <rect x="85.771242" y="578.144368" width="1154.228758" height="41.855632" rx="6.875231" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="662.885568" y="604.054968" text-anchor="middle" font-size="15.932546" fill="var(--primary-accent)" font-family="Arial, sans-serif">Linux stack: <tspan font-family="Courier New, monospace" fill="var(--text)">iptables/nftables</tspan> (L3/4) → <tspan font-family="Courier New, monospace" fill="var(--text)">conntrack</tspan> (stateful) → <tspan font-family="Courier New, monospace" fill="var(--text)">nfqueue + userspace</tspan> (L7)</text>
</svg>
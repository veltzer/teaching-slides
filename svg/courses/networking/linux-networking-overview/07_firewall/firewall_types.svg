<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1087.5767" height="474.8286" fill="var(--bg)" rx="5.7089" x="152.4233" y="145.1714"/>
  <text x="189.8087" y="224.3095" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-faint)">L7 App</text>
  <text x="189.8087" y="316.6372" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-faint)">L4 Transport</text>
  <text x="189.8087" y="408.9651" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-faint)">L3 Network</text>
  <line x1="218.6974" y1="197.9301" x2="218.6974" y2="521.0774" stroke="var(--border)" stroke-width="1.3333" />
  <text x="189.8087" y="360.1632" text-anchor="middle" font-family="sans-serif" font-size="10" fill="var(--text-muted)" transform="rotate(-90 44 326)">OSI Layer</text>
  <rect x="228.8935" y="369.396" width="288.8875" height="145.0866" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="373.3373" y="394.4564" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">Packet Filtering</text>
  <text x="373.3373" y="408.9651" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Layer 3/4 only</text>
  <line x1="228.8935" y1="416.8789" x2="517.781" y2="416.8789" stroke="var(--border)" stroke-width="0.8889" />
  <text x="245.8869" y="432.7066" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Inspects: src/dst IP, port, protocol</text>
  <text x="245.8869" y="447.2151" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Stateless — each packet independent</text>
  <text x="245.8869" y="461.7238" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Fast — minimal CPU overhead</text>
  <text x="245.8869" y="477.5514" font-family="monospace" font-size="10" fill="var(--primary-accent)">iptables -A INPUT -p tcp --dport 22</text>
  <text x="245.8869" y="490.7411" font-family="sans-serif" font-size="10" fill="var(--text-faint)">No payload inspection · blind to attacks</text>
  <text x="245.8869" y="503.9308" font-family="sans-serif" font-size="10" fill="var(--text-faint)">within allowed ports</text>
  <rect x="551.7679" y="277.0682" width="288.8875" height="237.4143" rx="5.7089" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="696.2116" y="302.1287" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--text)">Stateful Inspection</text>
  <text x="696.2116" y="316.6372" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--primary-accent)">Layer 3/4 + connection state</text>
  <line x1="551.7679" y1="324.5511" x2="840.6554" y2="324.5511" stroke="var(--border)" stroke-width="0.8889" />
  <text x="568.7611" y="340.3786" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Tracks connection state table</text>
  <text x="568.7611" y="354.8874" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">NEW → ESTABLISHED → RELATED</text>
  <text x="568.7611" y="369.396" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Allows return traffic automatically</text>
  <text x="568.7611" y="385.2237" font-family="monospace" font-size="10" fill="var(--primary-accent)">-m conntrack --ctstate ESTABLISHED</text>
  <text x="568.7611" y="402.3702" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">Blocks spoofed packets + port scans</text>
  <text x="568.7611" y="418.1978" font-family="sans-serif" font-size="10.4797" fill="var(--text-muted)">More CPU than packet filter</text>
  <text x="568.7611" y="434.0254" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Still blind to payload content</text>
  <text x="568.7611" y="449.8531" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Used by: nftables, iptables conntrack</text>
  <text x="568.7611" y="468.3187" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Most common type for host firewalls</text>
  <text x="568.7611" y="481.5083" font-family="sans-serif" font-size="10" fill="var(--text-faint)">Used by: nftables, iptables conntrack</text>
  <text x="568.7611" y="497.336" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">✓ Default recommendation</text>
  <rect x="874.6421" y="184.7404" width="339.8677" height="329.742" rx="5.7089" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1044.5759" y="209.8008" text-anchor="middle" font-family="sans-serif" font-size="13.4741" font-weight="bold" fill="var(--bg)">Application Layer</text>
  <text x="1044.5759" y="224.3095" text-anchor="middle" font-family="sans-serif" font-size="10.4797" fill="var(--primary-accent)">Layer 7 deep inspection</text>
  <line x1="874.6421" y1="232.2232" x2="1214.51" y2="232.2232" stroke="var(--primary-border)" stroke-width="0.8889" />
  <text x="891.6355" y="248.0509" font-family="sans-serif" font-size="10.4797" fill="var(--bg)">Reads HTTP/DNS/TLS payload</text>
  <text x="891.6355" y="262.5596" font-family="sans-serif" font-size="10.4797" fill="var(--bg)">URL filtering, content inspection</text>
  <text x="891.6355" y="277.0682" font-family="sans-serif" font-size="10.4797" fill="var(--bg)">Block by hostname, not just IP</text>
  <text x="891.6355" y="292.8958" font-family="sans-serif" font-size="10.4797" fill="var(--bg)">SSL/TLS termination + inspection</text>
  <text x="891.6355" y="308.7234" font-family="monospace" font-size="10" fill="var(--primary-accent)">WAF, squid proxy, nfqueue</text>
  <text x="891.6355" y="325.8701" font-family="sans-serif" font-size="10.4797" fill="var(--primary-accent)">Can detect SQL injection, XSS</text>
  <text x="891.6355" y="341.6977" font-family="sans-serif" font-size="10.4797" fill="var(--primary-accent)">in HTTP traffic</text>
  <text x="891.6355" y="357.5253" font-family="sans-serif" font-size="10.4797" fill="var(--primary-accent)">Much higher CPU overhead</text>
  <text x="891.6355" y="373.353" font-family="sans-serif" font-size="10.4797" fill="var(--primary-accent)">Can break TLS cert pinning</text>
  <text x="891.6355" y="391.8184" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">Used by: AWS WAF, nginx WAF,</text>
  <text x="891.6355" y="405.0082" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">ModSecurity, Cloudflare</text>
  <text x="891.6355" y="424.7927" font-family="sans-serif" font-size="10" fill="var(--primary-accent)">✓ Best for web-facing services</text>
  <rect x="228.8935" y="540.8619" width="985.6165" height="27.6983" rx="5.7089" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="721.7017" y="558.0084" text-anchor="middle" font-family="sans-serif" font-size="11.9769" fill="var(--primary-accent)">Linux stack: <tspan font-family="monospace">iptables/nftables</tspan> (L3/4) → <tspan font-family="monospace">conntrack</tspan> (stateful) → <tspan font-family="monospace">nfqueue + userspace</tspan> (L7)</text>
</svg>
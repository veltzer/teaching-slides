<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <text x="640" y="64.8" text-anchor="middle" font-size="27.7333" font-weight="bold" fill="#333">Rule Maintenance Workflow</text>
  <rect x="42.6667" y="126" width="234.6667" height="180" fill="#e3f2fd" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="160" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">Edit Rules</text>
  <text x="160" y="259.2" text-anchor="middle" font-size="21.3333" fill="#666">iptables -A/-D</text>
  <rect x="352" y="126" width="234.6667" height="180" fill="#fff3e0" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="469.3333" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">Test Rules</text>
  <text x="469.3333" y="259.2" text-anchor="middle" font-size="21.3333" fill="#666">iptables -L -v -n</text>
  <rect x="661.3333" y="126" width="234.6667" height="180" fill="#e8f5e9" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="778.6667" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">Save Rules</text>
  <text x="778.6667" y="259.2" text-anchor="middle" font-size="21.3333" fill="#666">iptables-save</text>
  <rect x="970.6667" y="126" width="256" height="180" fill="#f3e5f5" stroke="#333" stroke-width="4.2667" rx="10.6667" />
  <text x="1098.6667" y="198" text-anchor="middle" font-size="23.4667" font-weight="bold">Persist Config</text>
  <text x="1098.6667" y="259.2" text-anchor="middle" font-size="21.3333" fill="#666">iptables-restore</text>
  <line x1="277.3333" y1="216" x2="352" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd3_06_firewall)" />
  <line x1="586.6667" y1="216" x2="661.3333" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd3_06_firewall)" />
  <line x1="896" y1="216" x2="970.6667" y2="216" stroke="#333" stroke-width="4.2667" marker-end="url(#arrowd3_06_firewall)" />
  <rect x="170.6667" y="432" width="938.6667" height="198" fill="#ffebee" stroke="#c62828" stroke-width="2.1333" rx="10.6667" stroke-dasharray="10.6667 6.4" />
  <text x="640" y="511.2" text-anchor="middle" font-size="23.4667" fill="#333" font-weight="bold">Audit Cycle: Review logs, remove stale rules, update for new services</text>
  <text x="640" y="576" text-anchor="middle" font-size="21.3333" fill="#666">Keep backup: iptables-save &gt; /etc/iptables/rules.v4.bak before changes</text>
  <defs>
    <marker id="arrowd3_06_firewall" markerWidth="21.3333" markerHeight="36" refX="19.2" refY="10.8" orient="auto">
      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
</svg>
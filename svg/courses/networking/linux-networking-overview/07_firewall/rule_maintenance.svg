<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="244.067819" height="218.6253" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.895749" filter="url(#shadow)"/>
  <text x="162.033909" y="127.450024" text-anchor="middle" font-size="24.015709" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">Edit Rules</text>
  <text x="162.033909" y="204.611866" text-anchor="middle" font-size="19.441307" fill="var(--text-muted)" font-family="Arial, sans-serif">iptables -A/-D</text>
  <rect x="351.186469" y="40" width="244.067819" height="218.6253" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.895749" filter="url(#shadow)"/>
  <text x="473.220378" y="127.450024" text-anchor="middle" font-size="24.015709" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">Test Rules</text>
  <text x="473.220378" y="204.611866" text-anchor="middle" font-size="19.441307" fill="var(--text-muted)" font-family="Arial, sans-serif">iptables -L -v -n</text>
  <rect x="662.372938" y="40" width="244.067819" height="218.6253" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.895749" filter="url(#shadow)"/>
  <text x="784.406847" y="127.450024" text-anchor="middle" font-size="24.015709" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">Save Rules</text>
  <text x="784.406847" y="204.611866" text-anchor="middle" font-size="19.441307" fill="var(--text-muted)" font-family="Arial, sans-serif">iptables-save</text>
  <rect x="973.559298" y="40" width="266.440702" height="218.6253" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.895749" filter="url(#shadow)"/>
  <text x="1106.779757" y="127.450024" text-anchor="middle" font-size="24.015709" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">Persist Config</text>
  <text x="1106.779757" y="204.611866" text-anchor="middle" font-size="19.441307" fill="var(--text-muted)" font-family="Arial, sans-serif">iptables-restore</text>
  <line x1="284.067819" y1="149.31265" x2="351.186469" y2="149.31265" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="595.254287" y1="149.31265" x2="662.372938" y2="149.31265" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="906.440756" y1="149.31265" x2="973.559298" y2="149.31265" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170.169503" y="382.08428" width="955.93229" height="237.91572" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.895749" stroke-dasharray="8.8889 5.3333" filter="url(#shadow)"/>
  <text x="648.135648" y="479.822805" text-anchor="middle" font-size="24.015709" fill="var(--text)" font-weight="bold" font-family="Arial, sans-serif">Audit Cycle: Review logs, remove stale rules, update for new services</text>
  <text x="648.135648" y="572.417079" text-anchor="middle" font-size="19.441307" fill="var(--text-muted)" font-family="Arial, sans-serif">Keep backup: iptables-save &gt; /etc/iptables/rules.v4.bak before changes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="37.3333" y="106.6667" width="213.3333" height="151.1111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="144" y="167.1111" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--primary-accent)">Edit Rules</text>
  <text x="144" y="220.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">iptables -A/-D</text>
  <rect x="309.3333" y="106.6667" width="213.3333" height="151.1111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="416" y="167.1111" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--warn-accent)">Test Rules</text>
  <text x="416" y="220.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">iptables -L -v -n</text>
  <rect x="581.3333" y="106.6667" width="213.3333" height="151.1111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="688" y="167.1111" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--ok-accent)">Save Rules</text>
  <text x="688" y="220.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">iptables-save</text>
  <rect x="853.3333" y="106.6667" width="232.8889" height="151.1111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="969.7778" y="167.1111" text-anchor="middle" font-size="18.6667" font-weight="bold" fill="var(--info-accent)">Persist Config</text>
  <text x="969.7778" y="220.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">iptables-restore</text>
  <line x1="250.6667" y1="182.2222" x2="309.3333" y2="182.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="522.6667" y1="182.2222" x2="581.3333" y2="182.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="794.6667" y1="182.2222" x2="853.3333" y2="182.2222" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="151.1111" y="343.1111" width="835.5556" height="164.4444" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" stroke-dasharray="8.8889 5.3333" filter="url(#shadow)" />
  <text x="568.8889" y="410.6667" text-anchor="middle" font-size="18.6667" fill="var(--text)" font-weight="bold">Audit Cycle: Review logs, remove stale rules, update for new services</text>
  <text x="568.8889" y="474.6667" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Keep backup: iptables-save &gt; /etc/iptables/rules.v4.bak before changes</text>
</svg>
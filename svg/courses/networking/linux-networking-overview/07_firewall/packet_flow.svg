<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="211.759749" width="147.096774" height="168.025791" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.577374" filter="url(#shadow)" />
  <text x="113.548387" y="306.351857" text-anchor="middle" font-size="20.852302" font-weight="bold" fill="var(--primary-accent)">Incoming</text>
  <rect x="245.16129" y="40" width="189.677419" height="146.867056" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.577374" filter="url(#shadow)" />
  <text x="340" y="129.613755" text-anchor="middle" font-size="20.852302" font-weight="bold" fill="var(--warn-accent)">PREROUTING</text>
  <rect x="245.16129" y="278.970065" width="189.677419" height="146.867056" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.577374" filter="url(#shadow)" />
  <text x="340" y="368.58382" text-anchor="middle" font-size="20.852302" font-weight="bold" fill="var(--ok-accent)">INPUT</text>
  <rect x="539.354735" y="278.970065" width="189.677419" height="146.867056" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.577374" filter="url(#shadow)" />
  <text x="634.193548" y="368.58382" text-anchor="middle" font-size="18.65739" font-weight="bold" fill="var(--info-accent)">Local Process</text>
  <rect x="539.354735" y="40" width="189.677419" height="146.867056" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.577374" filter="url(#shadow)" />
  <text x="634.193548" y="129.613755" text-anchor="middle" font-size="20.852302" font-weight="bold" fill="var(--danger-accent)">FORWARD</text>
  <rect x="833.548387" y="278.970065" width="189.677419" height="146.867056" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.577374" filter="url(#shadow)" />
  <text x="928.387097" y="368.58382" text-anchor="middle" font-size="20.852302" font-weight="bold" fill="var(--primary-accent)">OUTPUT</text>
  <rect x="833.548387" y="40" width="189.677419" height="146.867056" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.577374" filter="url(#shadow)" />
  <text x="928.387097" y="107.210316" text-anchor="middle" font-size="20.852302" font-weight="bold" fill="var(--warn-accent)">POST-</text>
  <text x="928.387097" y="159.484955" text-anchor="middle" font-size="20.852302" font-weight="bold" fill="var(--warn-accent)">ROUTING</text>
  <rect x="1092.903226" y="211.759749" width="147.096774" height="168.025791" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.577374" filter="url(#shadow)" />
  <text x="1166.45151" y="306.351857" text-anchor="middle" font-size="20.852302" font-weight="bold" fill="var(--primary-accent)">Outgoing</text>
  <line x1="187.096774" y1="295.150138" x2="245.16129" y2="114.678078" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="434.838606" y1="114.678078" x2="539.354735" y2="114.678078" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="340" y1="186.866902" x2="340" y2="278.970065" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="434.838606" y1="352.403439" x2="539.354735" y2="352.403439" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="729.032258" y1="352.403439" x2="833.548387" y2="352.403439" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="729.032258" y1="114.678078" x2="833.548387" y2="114.678078" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1023.225806" y1="114.678078" x2="1092.903226" y2="259.055726" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="928.387097" y1="278.970065" x2="928.387097" y2="186.866902" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="565.236107" text-anchor="middle" font-size="19.754846" fill="var(--text-muted)">Routing decision determines INPUT (local) vs FORWARD (transit)</text>
  <text x="640" y="620" text-anchor="middle" font-size="19.754846" fill="var(--text-muted)">OUTPUT chain handles locally-generated packets</text>
</svg>
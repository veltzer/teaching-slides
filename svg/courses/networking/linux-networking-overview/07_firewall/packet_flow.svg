<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="58.75" y="246.2223" width="142.5" height="108.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="130" y="307.4444" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--primary-accent)">Incoming</text>
  <rect x="257.5" y="135.0556" width="183.75" height="95.0556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="349.375" y="193.0556" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--warn-accent)">PREROUTING</text>
  <rect x="257.5" y="289.7223" width="183.75" height="95.0556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="349.375" y="347.7223" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--ok-accent)">INPUT</text>
  <rect x="542.4999" y="289.7223" width="183.75" height="95.0556" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="634.375" y="347.7223" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--info-accent)">Local Process</text>
  <rect x="542.4999" y="135.0556" width="183.75" height="95.0556" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="634.375" y="193.0556" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--danger-accent)">FORWARD</text>
  <rect x="827.5" y="289.7223" width="183.75" height="95.0556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="919.375" y="347.7223" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--primary-accent)">OUTPUT</text>
  <rect x="827.5" y="135.0556" width="183.75" height="95.0556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="919.375" y="178.5556" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--warn-accent)">POST-</text>
  <text x="919.375" y="212.3889" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--warn-accent)">ROUTING</text>
  <rect x="1078.75" y="246.2223" width="142.5" height="108.75" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1149.9999" y="307.4444" text-anchor="middle" font-size="16.5115" font-weight="bold" fill="var(--primary-accent)">Outgoing</text>
  <line x1="201.25" y1="300.1944" x2="257.5" y2="183.3889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="441.2499" y1="183.3889" x2="542.4999" y2="183.3889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="349.375" y1="230.1111" x2="349.375" y2="289.7223" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="441.2499" y1="337.25" x2="542.4999" y2="337.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="726.25" y1="337.25" x2="827.5" y2="337.25" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="726.25" y1="183.3889" x2="827.5" y2="183.3889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1011.25" y1="183.3889" x2="1078.75" y2="276.8333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="919.375" y1="289.7223" x2="919.375" y2="230.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="475" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">Routing decision determines INPUT (local) vs FORWARD (transit)</text>
  <text x="640" y="510.4444" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">OUTPUT chain handles locally-generated packets</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Incoming box -->
  <rect x="20" y="256" width="152" height="135" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="96" y="332" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d47a1">Incoming</text>
  <!-- PREROUTING -->
  <rect x="232" y="118" width="196" height="118" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="330" y="190" text-anchor="middle" font-size="19" font-weight="bold" fill="#e65100">PREROUTING</text>
  <!-- INPUT -->
  <rect x="232" y="310" width="196" height="118" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="330" y="382" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b5e20">INPUT</text>
  <!-- Local Process -->
  <rect x="536" y="310" width="196" height="118" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="634" y="382" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a148c">Local Process</text>
  <!-- FORWARD -->
  <rect x="536" y="118" width="196" height="118" fill="#ffebee" stroke="#c62828" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="634" y="190" text-anchor="middle" font-size="19" font-weight="bold" fill="#b71c1c">FORWARD</text>
  <!-- OUTPUT -->
  <rect x="840" y="310" width="196" height="118" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="938" y="382" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d47a1">OUTPUT</text>
  <!-- POSTROUTING -->
  <rect x="840" y="118" width="196" height="118" fill="#fff8e1" stroke="#f57c00" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="938" y="172" text-anchor="middle" font-size="19" font-weight="bold" fill="#e65100">POST-</text>
  <text x="938" y="214" text-anchor="middle" font-size="19" font-weight="bold" fill="#e65100">ROUTING</text>
  <!-- Outgoing -->
  <rect x="1108" y="256" width="152" height="135" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <text x="1184" y="332" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d47a1">Outgoing</text>
  <!-- Arrows -->
  <line x1="172" y1="323" x2="232" y2="178" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="428" y1="178" x2="536" y2="178" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="236" x2="330" y2="310" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="428" y1="369" x2="536" y2="369" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="732" y1="369" x2="840" y2="369" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="732" y1="178" x2="840" y2="178" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1036" y1="178" x2="1108" y2="294" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="938" y1="310" x2="938" y2="236" stroke="#555555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Labels -->
  <text x="640" y="540" text-anchor="middle" font-size="18" fill="#777777">Routing decision determines INPUT (local) vs FORWARD (transit)</text>
  <text x="640" y="584" text-anchor="middle" font-size="18" fill="#777777">OUTPUT chain handles locally-generated packets</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="247.848537" height="187.647121" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)"/>
  <text x="163.924269" y="100.274452" text-anchor="middle" font-size="20.59063" fill="var(--primary-accent)" font-family="Arial, sans-serif">ndo_open()</text>
  <text x="163.924269" y="151.450927" text-anchor="middle" font-size="20.59063" fill="var(--text-muted)" font-family="Arial, sans-serif">ndo_stop()</text>
  <rect x="343.614458" y="40" width="268.502582" height="187.647121" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)"/>
  <text x="477.865749" y="100.274452" text-anchor="middle" font-size="20.59063" fill="var(--warn-accent)" font-family="Arial, sans-serif">ndo_start_xmit()</text>
  <text x="477.865749" y="151.450927" text-anchor="middle" font-size="18.423261" fill="var(--text-muted)" font-family="Arial, sans-serif">TX path</text>
  <rect x="667.88296" y="40" width="268.502582" height="187.647121" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)"/>
  <text x="802.134251" y="100.274452" text-anchor="middle" font-size="20.59063" fill="var(--ok-accent)" font-family="Arial, sans-serif">netif_rx()</text>
  <text x="802.134251" y="151.450927" text-anchor="middle" font-size="18.423261" fill="var(--text-muted)" font-family="Arial, sans-serif">RX path / NAPI</text>
  <rect x="992.151463" y="40" width="247.848537" height="187.647121" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)"/>
  <text x="1116.075731" y="100.274452" text-anchor="middle" font-size="20.59063" fill="var(--info-accent)" font-family="Arial, sans-serif">ndo_get_stats()</text>
  <text x="1116.075731" y="151.450927" text-anchor="middle" font-size="18.423261" fill="var(--text-muted)" font-family="Arial, sans-serif">ndo_do_ioctl()</text>
  <line x1="287.848537" y1="133.254831" x2="343.614458" y2="133.254831" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="612.11704" y1="133.254831" x2="667.88296" y2="133.254831" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="936.385542" y1="133.254831" x2="992.151463" y2="133.254831" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="242.409639" y="358.43132" width="793.115318" height="147.843259" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)"/>
  <text x="638.967298" y="447.137162" text-anchor="middle" font-size="23.841808" fill="var(--danger-accent)" font-family="Arial, sans-serif">struct net_device_ops (function pointers)</text>
  <line x1="638.967298" y1="227.647121" x2="638.967298" y2="358.43132" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="638.967298" y="620" text-anchor="middle" font-size="19.506945" fill="var(--text-muted)" font-family="Arial, sans-serif">Registered via register_netdev() during driver init</text>
</svg>

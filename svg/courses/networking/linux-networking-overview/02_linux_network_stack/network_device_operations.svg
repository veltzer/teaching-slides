<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="247.848537" height="187.647121" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)" />
  <text x="163.924269" y="100.274452" text-anchor="middle" font-size="20.59063" fill="var(--primary-accent)">ndo_open()</text>
  <text x="163.924269" y="151.450927" text-anchor="middle" font-size="20.59063" fill="var(--text-muted)">ndo_stop()</text>
  <rect x="343.614458" y="40" width="268.502582" height="187.647121" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)" />
  <text x="477.865749" y="100.274452" text-anchor="middle" font-size="20.59063" fill="var(--warn-accent)">ndo_start_xmit()</text>
  <text x="477.865749" y="151.450927" text-anchor="middle" font-size="18.423261" fill="var(--text-muted)">TX path</text>
  <rect x="667.88296" y="40" width="268.502582" height="187.647121" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)" />
  <text x="802.134251" y="100.274452" text-anchor="middle" font-size="20.59063" fill="var(--ok-accent)">netif_rx()</text>
  <text x="802.134251" y="151.450927" text-anchor="middle" font-size="18.423261" fill="var(--text-muted)">RX path / NAPI</text>
  <rect x="992.151463" y="40" width="247.848537" height="187.647121" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)" />
  <text x="1116.075731" y="100.274452" text-anchor="middle" font-size="20.59063" fill="var(--info-accent)">ndo_get_stats()</text>
  <text x="1116.075731" y="151.450927" text-anchor="middle" font-size="18.423261" fill="var(--text-muted)">ndo_do_ioctl()</text>
  <line x1="287.848537" y1="133.254831" x2="343.614458" y2="133.254831" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="612.11704" y1="133.254831" x2="667.88296" y2="133.254831" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="936.385542" y1="133.254831" x2="992.151463" y2="133.254831" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="242.409639" y="358.43132" width="793.115318" height="147.843259" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.482287" filter="url(#shadow)" />
  <text x="638.967298" y="447.137162" text-anchor="middle" font-size="23.841808" fill="var(--danger-accent)">struct net_device_ops (function pointers)</text>
  <line x1="638.967298" y1="227.647121" x2="638.967298" y2="358.43132" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="638.967298" y="620" text-anchor="middle" font-size="19.506945" fill="var(--text-muted)">Registered via register_netdev() during driver init</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="232.330383" y="40" width="1007.669617" height="101.045349" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.538867" filter="url(#shadow)"/>
  <text x="736.165192" y="100.627134" text-anchor="middle" font-size="24.022096" fill="var(--info-accent)" font-family="Arial, sans-serif">User Space: Applications (socket API)</text>
  <line x1="40" y1="154.181335" x2="228.79056" y2="154.181335" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="7.1111 4.4444"/>
  <text x="132.035398" y="146.097517" text-anchor="middle" font-size="19.654453" fill="var(--text-faint)" font-family="Arial, sans-serif">User</text>
  <rect x="232.330383" y="167.31707" width="1007.669617" height="101.045349" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.538867" filter="url(#shadow)"/>
  <text x="736.165192" y="227.944205" text-anchor="middle" font-size="24.022096" fill="var(--primary-accent)" font-family="Arial, sans-serif">Socket Layer: struct socket, proto_ops</text>
  <rect x="232.330383" y="284.529681" width="1007.669617" height="101.045349" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.538867" filter="url(#shadow)"/>
  <text x="736.165192" y="345.15694" text-anchor="middle" font-size="24.022096" fill="var(--warn-accent)" font-family="Arial, sans-serif">Transport: TCP / UDP (struct sock)</text>
  <rect x="232.330383" y="401.742166" width="1007.669617" height="101.045349" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.538867" filter="url(#shadow)"/>
  <text x="736.165192" y="462.369425" text-anchor="middle" font-size="24.022096" fill="var(--ok-accent)" font-family="Arial, sans-serif">Network: IP routing, netfilter hooks</text>
  <rect x="232.330383" y="518.954651" width="1007.669617" height="101.045349" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.538867" filter="url(#shadow)"/>
  <text x="736.165192" y="579.58191" text-anchor="middle" font-size="24.022096" fill="var(--danger-accent)" font-family="Arial, sans-serif">Device/Link: net_device, drivers, NIC</text>
  <text x="132.035398" y="369.407769" text-anchor="middle" font-size="19.654453" fill="var(--text-faint)" font-family="Arial, sans-serif">Kernel</text>
</svg>

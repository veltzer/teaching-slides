<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="96.25" y="120.5556" width="243.75" height="146.6111" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="218.125" y="173.7223" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--ok-accent)">alloc_skb()</text>
  <text x="218.125" y="210.7777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Allocate buffer</text>
  <text x="218.125" y="246.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-faint)">head, data, tail, end</text>
  <rect x="377.5" y="120.5556" width="225" height="146.6111" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="490" y="173.7223" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--primary-accent)">skb_reserve()</text>
  <text x="490" y="210.7777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Reserve headroom</text>
  <text x="490" y="246.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-faint)">for L2/L3 headers</text>
  <rect x="640" y="120.5556" width="225" height="146.6111" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="752.5" y="173.7223" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--warn-accent)">skb_put()</text>
  <text x="752.5" y="210.7777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Add data at tail</text>
  <text x="752.5" y="246.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-faint)">payload grows down</text>
  <rect x="902.5" y="120.5556" width="225" height="146.6111" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="1014.9999" y="173.7223" text-anchor="middle" font-size="15.6425" font-weight="bold" fill="var(--info-accent)">skb_push()</text>
  <text x="1014.9999" y="210.7777" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Add header at head</text>
  <text x="1014.9999" y="246.2223" text-anchor="middle" font-size="13.0354" fill="var(--text-faint)">prepend headers</text>
  <line x1="339.9999" y1="193.0556" x2="377.5" y2="193.0556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="602.5" y1="193.0556" x2="640" y2="193.0556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="865" y1="193.0556" x2="902.5" y2="193.0556" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="139.375" y="354.1667" width="1001.2499" height="88.6111" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="213.4374" y="406.5277" font-size="14.7735" fill="var(--text-faint)">head</text>
  <rect x="280" y="362.2223" width="120" height="72.5" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="339.9999" y="404.1111" text-anchor="middle" font-size="14.7735" fill="var(--primary-accent)">headroom</text>
  <rect x="400" y="362.2223" width="80.625" height="72.5" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="440.3125" y="404.1111" text-anchor="middle" font-size="14.7735" fill="var(--ok-accent)">L2</text>
  <rect x="480.625" y="362.2223" width="80.625" height="72.5" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="520.9375" y="404.1111" text-anchor="middle" font-size="14.7735" fill="var(--warn-accent)">L3</text>
  <rect x="561.25" y="362.2223" width="80.625" height="72.5" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="601.5624" y="404.1111" text-anchor="middle" font-size="14.7735" fill="var(--info-accent)">L4</text>
  <rect x="641.875" y="362.2223" width="360" height="72.5" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="6"/>
  <text x="821.8749" y="404.1111" text-anchor="middle" font-size="14.7735" fill="var(--text-muted)">Payload Data</text>
  <text x="1061.875" y="406.5277" font-size="14.7735" fill="var(--text-faint)">tail/end</text>
  <text x="640" y="513.6667" text-anchor="middle" font-size="15.6425" fill="var(--text-muted)">sk_buff manages packet data through all protocol layers</text>
</svg>
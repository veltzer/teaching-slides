<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="53.3333" y="88.8889" width="231.1111" height="161.7778" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="168.8889" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-accent)">alloc_skb()</text>
  <text x="168.8889" y="188.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Allocate buffer</text>
  <text x="168.8889" y="227.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-faint)">head, data, tail, end</text>
  <rect x="320" y="88.8889" width="213.3333" height="161.7778" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="426.6667" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-accent)">skb_reserve()</text>
  <text x="426.6667" y="188.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Reserve headroom</text>
  <text x="426.6667" y="227.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-faint)">for L2/L3 headers</text>
  <rect x="568.8889" y="88.8889" width="213.3333" height="161.7778" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="675.5556" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-accent)">skb_put()</text>
  <text x="675.5556" y="188.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Add data at tail</text>
  <text x="675.5556" y="227.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-faint)">payload grows down</text>
  <rect x="817.7778" y="88.8889" width="213.3333" height="161.7778" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="924.4444" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--info-accent)">skb_push()</text>
  <text x="924.4444" y="188.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Add header at head</text>
  <text x="924.4444" y="227.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-faint)">prepend headers</text>
  <line x1="284.4444" y1="168.8889" x2="320" y2="168.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="533.3333" y1="168.8889" x2="568.8889" y2="168.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="782.2222" y1="168.8889" x2="817.7778" y2="168.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="94.2222" y="346.6667" width="949.3333" height="97.7778" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="164.4444" y="404.4444" font-size="15.1111" fill="var(--text-faint)">head</text>
  <rect x="227.5556" y="355.5556" width="113.7778" height="80" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="284.4444" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--primary-accent)">headroom</text>
  <rect x="341.3333" y="355.5556" width="76.4444" height="80" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="379.5556" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--ok-accent)">L2</text>
  <rect x="417.7778" y="355.5556" width="76.4444" height="80" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="456" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--warn-accent)">L3</text>
  <rect x="494.2222" y="355.5556" width="76.4444" height="80" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6"/>
  <text x="532.4444" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--info-accent)">L4</text>
  <rect x="570.6667" y="355.5556" width="341.3333" height="80" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="6"/>
  <text x="741.3333" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Payload Data</text>
  <text x="968.8889" y="404.4444" font-size="15.1111" fill="var(--text-faint)">tail/end</text>
  <text x="568.8889" y="522.6667" text-anchor="middle" font-size="16" fill="var(--text-muted)">sk_buff manages packet data through all protocol layers</text>
</svg>
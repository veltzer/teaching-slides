      <path d="M 0 0 L 0 21.6 L 19.2 10.8 z" fill="#333" />
    </marker>
  </defs>
  <text x="640" y="57.6" text-anchor="middle" font-size="25.6" font-weight="bold">sk_buff Data Flow</text>
  <rect x="64" y="108" width="256" height="198" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="192" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">alloc_skb()</text>
  <text x="192" y="234" text-anchor="middle" font-size="21.3333">Allocate buffer</text>
  <text x="192" y="280.8" text-anchor="middle" font-size="21.3333" fill="#666">head, data, tail, end</text>
  <rect x="362.6667" y="108" width="234.6667" height="198" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="480" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">skb_reserve()</text>
  <text x="480" y="234" text-anchor="middle" font-size="21.3333">Reserve headroom</text>
  <text x="480" y="280.8" text-anchor="middle" font-size="21.3333" fill="#666">for L2/L3 headers</text>
  <rect x="640" y="108" width="234.6667" height="198" fill="#fff3e0" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="757.3333" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">skb_put()</text>
  <text x="757.3333" y="234" text-anchor="middle" font-size="21.3333">Add data at tail</text>
  <text x="757.3333" y="280.8" text-anchor="middle" font-size="21.3333" fill="#666">payload grows down</text>
  <rect x="917.3333" y="108" width="234.6667" height="198" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="1034.6667" y="180" text-anchor="middle" font-size="21.3333" font-weight="bold">skb_push()</text>
  <text x="1034.6667" y="234" text-anchor="middle" font-size="21.3333">Add header at head</text>
  <text x="1034.6667" y="280.8" text-anchor="middle" font-size="21.3333" fill="#666">prepend headers</text>
  <line x1="320" y1="205.2" x2="362.6667" y2="205.2" stroke="#333" stroke-width="2.1333" marker-end="url(#arrowd3_01_linux_network_stack)" />

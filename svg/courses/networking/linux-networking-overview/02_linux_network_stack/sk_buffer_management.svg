  <line x1="874.6667" y1="205.2" x2="917.3333" y2="205.2" stroke="#333" stroke-width="2.1333" marker-end="url(#arrowd3_01_linux_network_stack)" />
  <rect x="106.6667" y="396" width="1066.6667" height="126" fill="#ffebee" stroke="#333" stroke-width="2.1333" rx="6.4" />
  <text x="181.3333" y="468" font-size="21.3333" fill="#666">head</text>
  <rect x="256" y="406.8" width="128" height="100.8" fill="#e3f2fd" stroke="#333" stroke-width="2.1333" />
  <text x="320" y="471.6" text-anchor="middle" font-size="21.3333">headroom</text>
  <rect x="384" y="406.8" width="85.3333" height="100.8" fill="#e8f5e9" stroke="#333" stroke-width="2.1333" />
  <text x="426.6667" y="471.6" text-anchor="middle" font-size="21.3333">L2</text>
  <rect x="469.3333" y="406.8" width="85.3333" height="100.8" fill="#fff3e0" stroke="#333" stroke-width="2.1333" />
  <text x="512" y="471.6" text-anchor="middle" font-size="21.3333">L3</text>
  <rect x="554.6667" y="406.8" width="85.3333" height="100.8" fill="#f3e5f5" stroke="#333" stroke-width="2.1333" />
  <text x="597.3333" y="471.6" text-anchor="middle" font-size="21.3333">L4</text>
  <rect x="640" y="406.8" width="384" height="100.8" fill="#fff" stroke="#333" stroke-width="2.1333" />
  <text x="832" y="471.6" text-anchor="middle" font-size="21.3333">Payload Data</text>
  <text x="1088" y="468" font-size="21.3333" fill="#666">tail/end</text>
  <text x="640" y="604.8" text-anchor="middle" font-size="21.3333" fill="#666">sk_buff manages packet data through all protocol layers</text>
</svg>
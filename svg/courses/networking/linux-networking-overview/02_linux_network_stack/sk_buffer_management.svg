      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="var(--bg)" />
  <ns0:rect x="53.3333" y="88.8889" width="231.1111" height="161.7778" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.7778" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="168.8889" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--ok-deep)">alloc_skb()</ns0:text>
  <ns0:text x="168.8889" y="188.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Allocate buffer</ns0:text>
  <ns0:text x="168.8889" y="227.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-faint)">head, data, tail, end</ns0:text>
  <ns0:rect x="320" y="88.8889" width="213.3333" height="161.7778" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.7778" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="426.6667" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-deep)">skb_reserve()</ns0:text>
  <ns0:text x="426.6667" y="188.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Reserve headroom</ns0:text>
  <ns0:text x="426.6667" y="227.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-faint)">for L2/L3 headers</ns0:text>
  <ns0:rect x="568.8889" y="88.8889" width="213.3333" height="161.7778" fill="var(--warn-pale3)" stroke="var(--warn-mid)" stroke-width="1.7778" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="675.5556" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-dk)">skb_put()</ns0:text>
  <ns0:text x="675.5556" y="188.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Add data at tail</ns0:text>
  <ns0:text x="675.5556" y="227.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-faint)">payload grows down</ns0:text>
  <ns0:rect x="817.7778" y="88.8889" width="213.3333" height="161.7778" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="1.7778" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--info-deep)">skb_push()</ns0:text>
  <ns0:text x="924.4444" y="188.4444" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Add header at head</ns0:text>
  <ns0:text x="924.4444" y="227.5556" text-anchor="middle" font-size="13.3333" fill="var(--text-faint)">prepend headers</ns0:text>
  <ns0:line x1="284.4444" y1="168.8889" x2="320" y2="168.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="533.3333" y1="168.8889" x2="568.8889" y2="168.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="782.2222" y1="168.8889" x2="817.7778" y2="168.8889" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="94.2222" y="346.6667" width="949.3333" height="97.7778" fill="var(--danger-pale)" stroke="var(--danger-dk)" stroke-width="1.7778" rx="5.3333" filter="url(#shadow)" />
  <ns0:text x="164.4444" y="404.4444" font-size="15.1111" fill="var(--text-faint)">head</ns0:text>
  <ns0:rect x="227.5556" y="355.5556" width="113.7778" height="80" fill="var(--primary-pale)" stroke="var(--primary-dk)" stroke-width="1.3333" />
  <ns0:text x="284.4444" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--primary-deep)">headroom</ns0:text>
  <ns0:rect x="341.3333" y="355.5556" width="76.4444" height="80" fill="var(--ok-pale)" stroke="var(--ok-dk)" stroke-width="1.3333" />
  <ns0:text x="379.5556" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--ok-deep)">L2</ns0:text>
  <ns0:rect x="417.7778" y="355.5556" width="76.4444" height="80" fill="var(--warn-pale3)" stroke="var(--warn-mid)" stroke-width="1.3333" />
  <ns0:text x="456" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--warn-dk)">L3</ns0:text>
  <ns0:rect x="494.2222" y="355.5556" width="76.4444" height="80" fill="var(--info-pale)" stroke="var(--info-mid)" stroke-width="1.3333" />
  <ns0:text x="532.4444" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--info-deep)">L4</ns0:text>
  <ns0:rect x="570.6667" y="355.5556" width="341.3333" height="80" fill="var(--bg)" stroke="var(--text-placeholder)" stroke-width="1.3333" />
  <ns0:text x="741.3333" y="401.7778" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Payload Data</ns0:text>
  <ns0:text x="968.8889" y="404.4444" font-size="15.1111" fill="var(--text-faint)">tail/end</ns0:text>
  <ns0:text x="568.8889" y="522.6667" text-anchor="middle" font-size="16" fill="var(--text-lighter)">sk_buff manages packet data through all protocol layers</ns0:text>
</ns0:svg>
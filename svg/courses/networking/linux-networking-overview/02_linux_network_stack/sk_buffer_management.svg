<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <ns0:defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <ns0:linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <ns0:stop offset="0%" stop-color="#1e88e5" />
      <ns0:stop offset="100%" stop-color="#1565c0" />
    </ns0:linearGradient>
    <ns0:marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <ns0:path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </ns0:marker>
  </ns0:defs>
  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="53.3333" y="88.8889" width="231.1111" height="161.7778" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="168.8889" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">alloc_skb()</ns0:text>
  <ns0:text x="168.8889" y="188.4444" text-anchor="middle" font-size="15.1111" fill="#555555">Allocate buffer</ns0:text>
  <ns0:text x="168.8889" y="227.5556" text-anchor="middle" font-size="13.3333" fill="#888888">head, data, tail, end</ns0:text>
  <ns0:rect x="320" y="88.8889" width="213.3333" height="161.7778" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="426.6667" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">skb_reserve()</ns0:text>
  <ns0:text x="426.6667" y="188.4444" text-anchor="middle" font-size="15.1111" fill="#555555">Reserve headroom</ns0:text>
  <ns0:text x="426.6667" y="227.5556" text-anchor="middle" font-size="13.3333" fill="#888888">for L2/L3 headers</ns0:text>
  <ns0:rect x="568.8889" y="88.8889" width="213.3333" height="161.7778" fill="#fff8e1" stroke="#f57c00" stroke-width="1.7778" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="675.5556" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">skb_put()</ns0:text>
  <ns0:text x="675.5556" y="188.4444" text-anchor="middle" font-size="15.1111" fill="#555555">Add data at tail</ns0:text>
  <ns0:text x="675.5556" y="227.5556" text-anchor="middle" font-size="13.3333" fill="#888888">payload grows down</ns0:text>
  <ns0:rect x="817.7778" y="88.8889" width="213.3333" height="161.7778" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.7778" rx="7.1111" filter="url(#shadow)" />
  <ns0:text x="924.4444" y="147.5556" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a148c">skb_push()</ns0:text>
  <ns0:text x="924.4444" y="188.4444" text-anchor="middle" font-size="15.1111" fill="#555555">Add header at head</ns0:text>
  <ns0:text x="924.4444" y="227.5556" text-anchor="middle" font-size="13.3333" fill="#888888">prepend headers</ns0:text>
  <ns0:line x1="284.4444" y1="168.8889" x2="320" y2="168.8889" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="533.3333" y1="168.8889" x2="568.8889" y2="168.8889" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:line x1="782.2222" y1="168.8889" x2="817.7778" y2="168.8889" stroke="#555555" stroke-width="1.7778" marker-end="url(#arrow)" />
  <ns0:rect x="94.2222" y="346.6667" width="949.3333" height="97.7778" fill="#ffebee" stroke="#c62828" stroke-width="1.7778" rx="5.3333" filter="url(#shadow)" />
  <ns0:text x="164.4444" y="404.4444" font-size="15.1111" fill="#888888">head</ns0:text>
  <ns0:rect x="227.5556" y="355.5556" width="113.7778" height="80" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3333" />
  <ns0:text x="284.4444" y="401.7778" text-anchor="middle" font-size="15.1111" fill="#0d47a1">headroom</ns0:text>
  <ns0:rect x="341.3333" y="355.5556" width="76.4444" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3333" />
  <ns0:text x="379.5556" y="401.7778" text-anchor="middle" font-size="15.1111" fill="#1b5e20">L2</ns0:text>
  <ns0:rect x="417.7778" y="355.5556" width="76.4444" height="80" fill="#fff8e1" stroke="#f57c00" stroke-width="1.3333" />
  <ns0:text x="456" y="401.7778" text-anchor="middle" font-size="15.1111" fill="#e65100">L3</ns0:text>
  <ns0:rect x="494.2222" y="355.5556" width="76.4444" height="80" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.3333" />
  <ns0:text x="532.4444" y="401.7778" text-anchor="middle" font-size="15.1111" fill="#4a148c">L4</ns0:text>
  <ns0:rect x="570.6667" y="355.5556" width="341.3333" height="80" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3333" />
  <ns0:text x="741.3333" y="401.7778" text-anchor="middle" font-size="15.1111" fill="#555555">Payload Data</ns0:text>
  <ns0:text x="968.8889" y="404.4444" font-size="15.1111" fill="#888888">tail/end</ns0:text>
  <ns0:text x="568.8889" y="522.6667" text-anchor="middle" font-size="16" fill="#777777">sk_buff manages packet data through all protocol layers</ns0:text>
</ns0:svg>
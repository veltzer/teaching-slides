<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="280.07184" height="216.311465" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)"/>
  <text x="180.03592" y="118.442674" text-anchor="middle" font-size="20.366899" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">alloc_skb()</text>
  <text x="180.03592" y="173.114578" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)" font-family="Arial, sans-serif">Allocate buffer</text>
  <text x="180.03592" y="225.40989" text-anchor="middle" font-size="16.972394" fill="var(--text-faint)" font-family="Arial, sans-serif">head, data, tail, end</text>
  <rect x="363.159816" y="40" width="258.527852" height="216.311465" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)"/>
  <text x="492.423742" y="118.442674" text-anchor="middle" font-size="20.366899" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">skb_reserve()</text>
  <text x="492.423742" y="173.114578" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)" font-family="Arial, sans-serif">Reserve headroom</text>
  <text x="492.423742" y="225.40989" text-anchor="middle" font-size="16.972394" fill="var(--text-faint)" font-family="Arial, sans-serif">for L2/L3 headers</text>
  <rect x="664.775643" y="40" width="258.527852" height="216.311465" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)"/>
  <text x="794.03957" y="118.442674" text-anchor="middle" font-size="20.366899" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">skb_put()</text>
  <text x="794.03957" y="173.114578" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)" font-family="Arial, sans-serif">Add data at tail</text>
  <text x="794.03957" y="225.40989" text-anchor="middle" font-size="16.972394" fill="var(--text-faint)" font-family="Arial, sans-serif">payload grows down</text>
  <rect x="966.391471" y="40" width="258.527852" height="216.311465" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)"/>
  <text x="1095.655282" y="118.442674" text-anchor="middle" font-size="20.366899" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">skb_push()</text>
  <text x="1095.655282" y="173.114578" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)" font-family="Arial, sans-serif">Add header at head</text>
  <text x="1095.655282" y="225.40989" text-anchor="middle" font-size="16.972394" fill="var(--text-faint)" font-family="Arial, sans-serif">prepend headers</text>
  <line x1="320.071725" y1="146.967216" x2="363.159816" y2="146.967216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="621.687668" y1="146.967216" x2="664.775643" y2="146.967216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="923.303496" y1="146.967216" x2="966.391471" y2="146.967216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="89.551172" y="384.672124" width="1150.448828" height="130.737692" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)"/>
  <text x="174.649808" y="461.926061" font-size="19.235441" fill="var(--text-faint)" font-family="Arial, sans-serif">head</text>
  <rect x="251.131079" y="396.557436" width="137.881521" height="106.967216" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)"/>
  <text x="320.071725" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--primary-accent)" font-family="Arial, sans-serif">headroom</text>
  <rect x="389.012601" y="396.557436" width="92.639147" height="106.967216" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)"/>
  <text x="435.332174" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--ok-accent)" font-family="Arial, sans-serif">L2</text>
  <rect x="481.651748" y="396.557436" width="92.639147" height="106.967216" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)"/>
  <text x="527.971321" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--warn-accent)" font-family="Arial, sans-serif">L3</text>
  <rect x="574.290895" y="396.557436" width="92.639147" height="106.967216" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)"/>
  <text x="620.610354" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--info-accent)" font-family="Arial, sans-serif">L4</text>
  <rect x="666.930042" y="396.557436" width="413.644564" height="106.967216" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.81214"/>
  <text x="873.752209" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)" font-family="Arial, sans-serif">Payload Data</text>
  <text x="1149.515367" y="461.926061" font-size="19.235441" fill="var(--text-faint)" font-family="Arial, sans-serif">tail/end</text>
  <text x="664.775643" y="620" text-anchor="middle" font-size="20.366899" fill="var(--text-muted)" font-family="Arial, sans-serif">sk_buff manages packet data through all protocol layers</text>
</svg>

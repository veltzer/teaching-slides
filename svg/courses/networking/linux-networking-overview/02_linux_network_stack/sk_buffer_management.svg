<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="280.07184" height="216.311465" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)" />
  <text x="180.03592" y="118.442674" text-anchor="middle" font-size="20.366899" font-weight="bold" fill="var(--ok-accent)">alloc_skb()</text>
  <text x="180.03592" y="173.114578" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)">Allocate buffer</text>
  <text x="180.03592" y="225.40989" text-anchor="middle" font-size="16.972394" fill="var(--text-faint)">head, data, tail, end</text>
  <rect x="363.159816" y="40" width="258.527852" height="216.311465" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)" />
  <text x="492.423742" y="118.442674" text-anchor="middle" font-size="20.366899" font-weight="bold" fill="var(--primary-accent)">skb_reserve()</text>
  <text x="492.423742" y="173.114578" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)">Reserve headroom</text>
  <text x="492.423742" y="225.40989" text-anchor="middle" font-size="16.972394" fill="var(--text-faint)">for L2/L3 headers</text>
  <rect x="664.775643" y="40" width="258.527852" height="216.311465" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)" />
  <text x="794.03957" y="118.442674" text-anchor="middle" font-size="20.366899" font-weight="bold" fill="var(--warn-accent)">skb_put()</text>
  <text x="794.03957" y="173.114578" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)">Add data at tail</text>
  <text x="794.03957" y="225.40989" text-anchor="middle" font-size="16.972394" fill="var(--text-faint)">payload grows down</text>
  <rect x="966.391471" y="40" width="258.527852" height="216.311465" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)" />
  <text x="1095.655282" y="118.442674" text-anchor="middle" font-size="20.366899" font-weight="bold" fill="var(--info-accent)">skb_push()</text>
  <text x="1095.655282" y="173.114578" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)">Add header at head</text>
  <text x="1095.655282" y="225.40989" text-anchor="middle" font-size="16.972394" fill="var(--text-faint)">prepend headers</text>
  <line x1="320.071725" y1="146.967216" x2="363.159816" y2="146.967216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="621.687668" y1="146.967216" x2="664.775643" y2="146.967216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="923.303496" y1="146.967216" x2="966.391471" y2="146.967216" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="89.551172" y="384.672124" width="1150.448828" height="130.737692" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="7.81214" filter="url(#shadow)" />
  <text x="174.649808" y="461.926061" font-size="19.235441" fill="var(--text-faint)">head</text>
  <rect x="251.131079" y="396.557436" width="137.881521" height="106.967216" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.81214"/>
  <text x="320.071725" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--primary-accent)">headroom</text>
  <rect x="389.012601" y="396.557436" width="92.639147" height="106.967216" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.81214"/>
  <text x="435.332174" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--ok-accent)">L2</text>
  <rect x="481.651748" y="396.557436" width="92.639147" height="106.967216" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.81214"/>
  <text x="527.971321" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--warn-accent)">L3</text>
  <rect x="574.290895" y="396.557436" width="92.639147" height="106.967216" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.81214"/>
  <text x="620.610354" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--info-accent)">L4</text>
  <rect x="666.930042" y="396.557436" width="413.644564" height="106.967216" fill="var(--bg)" stroke="var(--text-faint)" stroke-width="1.3333" rx="7.81214"/>
  <text x="873.752209" y="458.360586" text-anchor="middle" font-size="19.235441" fill="var(--text-muted)">Payload Data</text>
  <text x="1149.515367" y="461.926061" font-size="19.235441" fill="var(--text-faint)">tail/end</text>
  <text x="664.775643" y="620" text-anchor="middle" font-size="20.366899" fill="var(--text-muted)">sk_buff manages packet data through all protocol layers</text>
</svg>
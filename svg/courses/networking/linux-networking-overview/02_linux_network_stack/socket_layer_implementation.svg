<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="357.204487" height="223.93825" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.433887" filter="url(#shadow)"/>
  <text x="218.084556" y="104.941927" text-anchor="middle" font-size="22.610909" font-weight="bold" fill="var(--info-accent)" font-family="Arial, sans-serif">struct socket</text>
  <text x="218.084556" y="163.166031" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)" font-family="Arial, sans-serif">state, type, ops</text>
  <text x="218.084556" y="216.911122" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)" font-family="Arial, sans-serif">file, sk, proto</text>
  <rect x="461.397757" y="40" width="357.204487" height="223.93825" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.433887" filter="url(#shadow)"/>
  <text x="639.482312" y="104.941927" text-anchor="middle" font-size="22.610909" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">struct sock (sk)</text>
  <text x="639.482312" y="163.166031" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)" font-family="Arial, sans-serif">protocol state</text>
  <text x="639.482312" y="216.911122" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)" font-family="Arial, sans-serif">buffers, timers</text>
  <rect x="882.795513" y="40" width="357.204487" height="223.93825" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.433887" filter="url(#shadow)"/>
  <text x="1060.880069" y="104.941927" text-anchor="middle" font-size="22.610909" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">proto_ops</text>
  <text x="1060.880069" y="163.166031" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)" font-family="Arial, sans-serif">bind, connect</text>
  <text x="1060.880069" y="216.911122" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)" font-family="Arial, sans-serif">sendmsg, recvmsg</text>
  <line x1="397.204487" y1="151.969056" x2="461.397757" y2="151.969056" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="818.602243" y1="151.969056" x2="882.795513" y2="151.969056" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="241.898188" y="364.71047" width="797.238889" height="129.884132" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.433887" filter="url(#shadow)"/>
  <text x="640.517688" y="443.088878" text-anchor="middle" font-size="21.534235" fill="var(--ok-accent)" font-family="Arial, sans-serif">sys_socket() / sys_bind() / sys_connect() / sys_sendmsg()</text>
  <line x1="640.517688" y1="263.93825" x2="640.517688" y2="364.71047" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="640.517688" y="571.853257" text-anchor="middle" font-size="19.380762" fill="var(--text-muted)" font-family="Arial, sans-serif">System calls map to socket-&gt;ops-&gt;method()</text>
  <text x="640.517688" y="620" text-anchor="middle" font-size="19.380762" fill="var(--text-muted)" font-family="Arial, sans-serif">BSD socket layer provides uniform interface</text>
</svg>

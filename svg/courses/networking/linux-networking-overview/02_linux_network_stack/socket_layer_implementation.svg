<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="357.204487" height="223.93825" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.433887" filter="url(#shadow)" />
  <text x="218.084556" y="104.941927" text-anchor="middle" font-size="22.610909" font-weight="bold" fill="var(--info-accent)">struct socket</text>
  <text x="218.084556" y="163.166031" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)">state, type, ops</text>
  <text x="218.084556" y="216.911122" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)">file, sk, proto</text>
  <rect x="461.397757" y="40" width="357.204487" height="223.93825" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.433887" filter="url(#shadow)" />
  <text x="639.482312" y="104.941927" text-anchor="middle" font-size="22.610909" font-weight="bold" fill="var(--primary-accent)">struct sock (sk)</text>
  <text x="639.482312" y="163.166031" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)">protocol state</text>
  <text x="639.482312" y="216.911122" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)">buffers, timers</text>
  <rect x="882.795513" y="40" width="357.204487" height="223.93825" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.433887" filter="url(#shadow)" />
  <text x="1060.880069" y="104.941927" text-anchor="middle" font-size="22.610909" font-weight="bold" fill="var(--warn-accent)">proto_ops</text>
  <text x="1060.880069" y="163.166031" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)">bind, connect</text>
  <text x="1060.880069" y="216.911122" text-anchor="middle" font-size="20.457436" fill="var(--text-muted)">sendmsg, recvmsg</text>
  <line x1="397.204487" y1="151.969056" x2="461.397757" y2="151.969056" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="818.602243" y1="151.969056" x2="882.795513" y2="151.969056" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="241.898188" y="364.71047" width="797.238889" height="129.884132" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.433887" filter="url(#shadow)" />
  <text x="640.517688" y="443.088878" text-anchor="middle" font-size="21.534235" fill="var(--ok-accent)">sys_socket() / sys_bind() / sys_connect() / sys_sendmsg()</text>
  <line x1="640.517688" y1="263.93825" x2="640.517688" y2="364.71047" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="640.517688" y="571.853257" text-anchor="middle" font-size="19.380762" fill="var(--text-muted)">System calls map to socket-&gt;ops-&gt;method()</text>
  <text x="640.517688" y="620" text-anchor="middle" font-size="19.380762" fill="var(--text-muted)">BSD socket layer provides uniform interface</text>
</svg>
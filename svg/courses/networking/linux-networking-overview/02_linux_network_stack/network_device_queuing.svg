<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="250.871103" height="170.588202" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)" />
  <text x="165.435552" y="110.509747" text-anchor="middle" font-size="20.715803" fill="var(--info-accent)">Transport Layer</text>
  <text x="165.435552" y="162.823539" text-anchor="middle" font-size="18.535258" fill="var(--text-muted)">(TCP/UDP)</text>
  <rect x="349.407583" y="40" width="271.777029" height="170.588202" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)" />
  <text x="485.296209" y="110.509747" text-anchor="middle" font-size="20.715803" fill="var(--primary-accent)">Queueing Disc</text>
  <text x="485.296209" y="162.823539" text-anchor="middle" font-size="18.535258" fill="var(--text-muted)">(qdisc)</text>
  <rect x="679.721314" y="40" width="250.871103" height="170.588202" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)" />
  <text x="805.156866" y="110.509747" text-anchor="middle" font-size="20.715803" fill="var(--warn-accent)">dev_queue_xmit</text>
  <text x="805.156866" y="162.823539" text-anchor="middle" font-size="18.535258" fill="var(--text-muted)">TX queue</text>
  <rect x="989.128897" y="40" width="250.871103" height="170.588202" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)" />
  <text x="1114.56456" y="110.509747" text-anchor="middle" font-size="20.715803" fill="var(--ok-accent)">NIC Driver</text>
  <text x="1114.56456" y="162.823539" text-anchor="middle" font-size="18.535258" fill="var(--text-muted)">hard_start_xmit</text>
  <line x1="290.871103" y1="125.294172" x2="349.407583" y2="125.294172" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="621.184723" y1="125.294172" x2="679.721314" y2="125.294172" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="930.592417" y1="125.294172" x2="989.128897" y2="125.294172" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <rect x="215.609772" y="324.313623" width="224.738697" height="130.78434" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="327.456473" y="403.921488" text-anchor="middle" font-size="20.715803" fill="var(--primary-accent)">pfifo_fast</text>
  <rect x="481.114912" y="324.313623" width="177.700365" height="130.78434" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="569.965206" y="403.921488" text-anchor="middle" font-size="20.715803" fill="var(--warn-accent)">HTB</text>
  <rect x="704.808424" y="324.313623" width="177.700365" height="130.78434" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="793.658607" y="403.921488" text-anchor="middle" font-size="20.715803" fill="var(--ok-accent)">SFQ</text>
  <rect x="928.501825" y="324.313623" width="177.700365" height="130.78434" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="1017.351896" y="403.921488" text-anchor="middle" font-size="20.715803" fill="var(--info-accent)">TBF</text>
  <text x="665.087166" y="529.019522" text-anchor="middle" font-size="22.896473" fill="var(--text-muted)">Common Queue Disciplines</text>
  <text x="665.087166" y="620" text-anchor="middle" font-size="19.62553" fill="var(--text-muted)">tc qdisc add dev eth0 root [discipline] [params]</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="250.871103" height="170.588202" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="165.435552" y="110.509747" text-anchor="middle" font-size="20.715803" fill="var(--info-accent)" font-family="Arial, sans-serif">Transport Layer</text>
  <text x="165.435552" y="162.823539" text-anchor="middle" font-size="18.535258" fill="var(--text-muted)" font-family="Arial, sans-serif">(TCP/UDP)</text>
  <rect x="349.407583" y="40" width="271.777029" height="170.588202" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="485.296209" y="110.509747" text-anchor="middle" font-size="20.715803" fill="var(--primary-accent)" font-family="Arial, sans-serif">Queueing Disc</text>
  <text x="485.296209" y="162.823539" text-anchor="middle" font-size="18.535258" fill="var(--text-muted)" font-family="Arial, sans-serif">(qdisc)</text>
  <rect x="679.721314" y="40" width="250.871103" height="170.588202" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="805.156866" y="110.509747" text-anchor="middle" font-size="20.715803" fill="var(--warn-accent)" font-family="Arial, sans-serif">dev_queue_xmit</text>
  <text x="805.156866" y="162.823539" text-anchor="middle" font-size="18.535258" fill="var(--text-muted)" font-family="Arial, sans-serif">TX queue</text>
  <rect x="989.128897" y="40" width="250.871103" height="170.588202" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="1114.56456" y="110.509747" text-anchor="middle" font-size="20.715803" fill="var(--ok-accent)" font-family="Arial, sans-serif">NIC Driver</text>
  <text x="1114.56456" y="162.823539" text-anchor="middle" font-size="18.535258" fill="var(--text-muted)" font-family="Arial, sans-serif">hard_start_xmit</text>
  <line x1="290.871103" y1="125.294172" x2="349.407583" y2="125.294172" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="621.184723" y1="125.294172" x2="679.721314" y2="125.294172" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="930.592417" y1="125.294172" x2="989.128897" y2="125.294172" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <rect x="215.609772" y="324.313623" width="224.738697" height="130.78434" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="327.456473" y="403.921488" text-anchor="middle" font-size="20.715803" fill="var(--primary-accent)" font-family="Arial, sans-serif">pfifo_fast</text>
  <rect x="481.114912" y="324.313623" width="177.700365" height="130.78434" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="569.965206" y="403.921488" text-anchor="middle" font-size="20.715803" fill="var(--warn-accent)" font-family="Arial, sans-serif">HTB</text>
  <rect x="704.808424" y="324.313623" width="177.700365" height="130.78434" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="793.658607" y="403.921488" text-anchor="middle" font-size="20.715803" fill="var(--ok-accent)" font-family="Arial, sans-serif">SFQ</text>
  <rect x="928.501825" y="324.313623" width="177.700365" height="130.78434" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.527773" filter="url(#shadow)"/>
  <text x="1017.351896" y="403.921488" text-anchor="middle" font-size="20.715803" fill="var(--info-accent)" font-family="Arial, sans-serif">TBF</text>
  <text x="665.087166" y="529.019522" text-anchor="middle" font-size="22.896473" fill="var(--text-muted)" font-family="Arial, sans-serif">Common Queue Disciplines</text>
  <text x="665.087166" y="620" text-anchor="middle" font-size="19.62553" fill="var(--text-muted)" font-family="Arial, sans-serif">tc qdisc add dev eth0 root [discipline] [params]</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="533.333333" height="278.400006" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="7.589467" filter="url(#shadow)"/>
  <rect x="40" y="40" width="533.333333" height="62.640012" fill="url(#grad-primary)" rx="7.589467" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="88.719961" width="533.333333" height="13.920051" fill="url(#grad-primary)" rx="7.589467" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.666556" y="82.919928" text-anchor="middle" font-size="24.183331" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">User Space</text>
  <text x="306.666556" y="167.600009" text-anchor="middle" font-size="20.885581" fill="var(--text)" font-family="Arial, sans-serif">ip, iproute2, NetworkManager</text>
  <text x="306.666556" y="223.279923" text-anchor="middle" font-size="20.885581" fill="var(--text)" font-family="Arial, sans-serif">socket(AF_NETLINK, ...)</text>
  <rect x="706.666667" y="40" width="533.333333" height="278.400006" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="7.589467" filter="url(#shadow)"/>
  <rect x="706.666667" y="40" width="533.333333" height="62.640012" fill="url(#grad-primary)" rx="7.589467" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="706.666667" y="88.719961" width="533.333333" height="13.920051" fill="url(#grad-primary)" rx="7.589467" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="973.333222" y="82.919928" text-anchor="middle" font-size="24.183331" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Kernel Space</text>
  <text x="973.333222" y="167.600009" text-anchor="middle" font-size="20.885581" fill="var(--text)" font-family="Arial, sans-serif">NETLINK_ROUTE, NETLINK_XFRM</text>
  <text x="973.333222" y="223.279923" text-anchor="middle" font-size="20.885581" fill="var(--text)" font-family="Arial, sans-serif">NETLINK_NETFILTER, NETLINK_GENERIC</text>
  <line x1="573.333333" y1="138.599843" x2="706.666667" y2="138.599843" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="124.679936" text-anchor="middle" font-size="18.687165" fill="var(--text-muted)" font-family="Arial, sans-serif">send</text>
  <line x1="706.666667" y1="213.999986" x2="573.333333" y2="213.999986" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="204.719904" text-anchor="middle" font-size="18.687165" fill="var(--text-muted)" font-family="Arial, sans-serif">recv</text>
  <rect x="150.416667" y="399.599893" width="979.166667" height="127.600009" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="7.589467" filter="url(#shadow)"/>
  <text x="640" y="475.000036" text-anchor="middle" font-size="23.084123" fill="var(--ok-accent)" font-family="Arial, sans-serif">Asynchronous, multicast-capable, bidirectional IPC</text>
  <text x="640" y="620" text-anchor="middle" font-size="19.786373" fill="var(--text-muted)" font-family="Arial, sans-serif">Replaces ioctl() for modern network configuration</text>
</svg>
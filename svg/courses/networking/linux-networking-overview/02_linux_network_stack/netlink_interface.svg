<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="533.333333" height="278.400006" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="7.589467" filter="url(#shadow)" />
  <rect x="40" y="40" width="533.333333" height="62.640012" fill="var(--primary-fill)" rx="7.589467" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="88.719961" width="533.333333" height="13.920051" fill="var(--primary-fill)" rx="7.589467" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="306.666556" y="82.919928" text-anchor="middle" font-size="24.183331" font-weight="bold" fill="var(--bg)">User Space</text>
  <text x="306.666556" y="167.600009" text-anchor="middle" font-size="20.885581" fill="var(--text)">ip, iproute2, NetworkManager</text>
  <text x="306.666556" y="223.279923" text-anchor="middle" font-size="20.885581" fill="var(--text)">socket(AF_NETLINK, ...)</text>
  <rect x="706.666667" y="40" width="533.333333" height="278.400006" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="7.589467" filter="url(#shadow)" />
  <rect x="706.666667" y="40" width="533.333333" height="62.640012" fill="var(--primary-fill)" rx="7.589467" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="706.666667" y="88.719961" width="533.333333" height="13.920051" fill="var(--primary-fill)" rx="7.589467" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="973.333222" y="82.919928" text-anchor="middle" font-size="24.183331" font-weight="bold" fill="var(--bg)">Kernel Space</text>
  <text x="973.333222" y="167.600009" text-anchor="middle" font-size="20.885581" fill="var(--text)">NETLINK_ROUTE, NETLINK_XFRM</text>
  <text x="973.333222" y="223.279923" text-anchor="middle" font-size="20.885581" fill="var(--text)">NETLINK_NETFILTER, NETLINK_GENERIC</text>
  <line x1="573.333333" y1="138.599843" x2="706.666667" y2="138.599843" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)" />
  <text x="640" y="124.679936" text-anchor="middle" font-size="18.687165" fill="var(--text-muted)">send</text>
  <line x1="706.666667" y1="213.999986" x2="573.333333" y2="213.999986" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="204.719904" text-anchor="middle" font-size="18.687165" fill="var(--text-muted)">recv</text>
  <rect x="150.416667" y="399.599893" width="979.166667" height="127.600009" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="7.589467" filter="url(#shadow)" />
  <text x="640" y="475.000036" text-anchor="middle" font-size="23.084123" fill="var(--ok-accent)">Asynchronous, multicast-capable, bidirectional IPC</text>
  <text x="640" y="620" text-anchor="middle" font-size="19.786373" fill="var(--text-muted)">Replaces ioctl() for modern network configuration</text>
</svg>
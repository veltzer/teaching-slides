<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- User Space box -->
  <rect x="64" y="100" width="512" height="240" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="64" y="100" width="512" height="54" fill="url(#grad-accent)" rx="10"/>
  <rect x="64" y="142" width="512" height="12" fill="url(#grad-accent)"/>
  <text x="320" y="137" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">User Space</text>
  <text x="320" y="210" text-anchor="middle" font-size="19" fill="#333333">ip, iproute2, NetworkManager</text>
  <text x="320" y="258" text-anchor="middle" font-size="19" fill="#333333">socket(AF_NETLINK, ...)</text>
  <!-- Kernel Space box -->
  <rect x="704" y="100" width="512" height="240" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" rx="10" filter="url(#shadow)"/>
  <rect x="704" y="100" width="512" height="54" fill="url(#grad-accent)" rx="10"/>
  <rect x="704" y="142" width="512" height="12" fill="url(#grad-accent)"/>
  <text x="960" y="137" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Kernel Space</text>
  <text x="960" y="210" text-anchor="middle" font-size="19" fill="#333333">NETLINK_ROUTE, NETLINK_XFRM</text>
  <text x="960" y="258" text-anchor="middle" font-size="19" fill="#333333">NETLINK_NETFILTER, NETLINK_GENERIC</text>
  <!-- Arrows -->
  <line x1="576" y1="185" x2="704" y2="185" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="640" y="173" text-anchor="middle" font-size="17" fill="#555555">send</text>
  <line x1="704" y1="250" x2="576" y2="250" stroke="#555555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="242" text-anchor="middle" font-size="17" fill="#555555">recv</text>
  <!-- Info box -->
  <rect x="170" y="410" width="940" height="110" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8" filter="url(#shadow)"/>
  <text x="640" y="475" text-anchor="middle" font-size="21" fill="#1b5e20">Asynchronous, multicast-capable, bidirectional IPC</text>
  <text x="640" y="600" text-anchor="middle" font-size="18" fill="#777777">Replaces ioctl() for modern network configuration</text>
</svg>

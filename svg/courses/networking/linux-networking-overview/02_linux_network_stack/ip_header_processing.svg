<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="253.358925" height="155.464051" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)"/>
  <text x="166.679463" y="102.185442" text-anchor="middle" font-size="22.29734" fill="var(--ok-accent)" font-family="Arial, sans-serif">NIC Driver</text>
  <text x="166.679463" y="154.804087" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)" font-family="Arial, sans-serif">netif_rx()</text>
  <rect x="355.547025" y="40" width="253.358925" height="155.464051" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)"/>
  <text x="482.226488" y="102.185442" text-anchor="middle" font-size="22.29734" fill="var(--primary-accent)" font-family="Arial, sans-serif">ip_rcv()</text>
  <text x="482.226488" y="154.804087" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)" font-family="Arial, sans-serif">validate header</text>
  <rect x="671.093927" y="40" width="253.358925" height="155.464051" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)"/>
  <text x="797.773512" y="102.185442" text-anchor="middle" font-size="22.29734" fill="var(--warn-accent)" font-family="Arial, sans-serif">ip_route_input</text>
  <text x="797.773512" y="154.804087" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)" font-family="Arial, sans-serif">routing decision</text>
  <rect x="986.641075" y="40" width="253.358925" height="155.464051" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)"/>
  <text x="1113.320537" y="102.185442" text-anchor="middle" font-size="22.29734" fill="var(--danger-accent)" font-family="Arial, sans-serif">ip_forward()</text>
  <text x="1113.320537" y="154.804087" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)" font-family="Arial, sans-serif">forward pkt</text>
  <rect x="355.547025" y="350.927804" width="253.358925" height="155.464051" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)"/>
  <text x="482.226488" y="413.113395" text-anchor="middle" font-size="22.29734" fill="var(--info-accent)" font-family="Arial, sans-serif">ip_local_deliver</text>
  <text x="482.226488" y="465.731892" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)" font-family="Arial, sans-serif">to transport</text>
  <rect x="986.641075" y="350.927804" width="253.358925" height="155.464051" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)"/>
  <text x="1113.320537" y="413.113395" text-anchor="middle" font-size="22.29734" fill="var(--ok-accent)" font-family="Arial, sans-serif">ip_output()</text>
  <text x="1113.320537" y="465.731892" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)" font-family="Arial, sans-serif">send to NIC</text>
  <line x1="293.358925" y1="117.731951" x2="355.547025" y2="117.731951" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="608.905827" y1="117.731951" x2="671.093927" y2="117.731951" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <line x1="924.452975" y1="117.731951" x2="986.641075" y2="117.731951" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="956.698656" y="99.793706" font-size="17.60317" fill="var(--danger-accent)" font-family="Arial, sans-serif">fwd</text>
  <line x1="797.773512" y1="195.463754" x2="482.226488" y2="350.927804" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)"/>
  <text x="601.996161" y="273.195853" font-size="17.60317" fill="var(--primary-accent)" font-family="Arial, sans-serif">local</text>
  <line x1="1113.320537" y1="195.463754" x2="1113.320537" y2="350.927804" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="728.675624" y="620" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)" font-family="Arial, sans-serif">Netfilter hooks called at PRE_ROUTING, FORWARD, LOCAL_IN, POST_ROUTING</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect x="40" y="40" width="253.358925" height="155.464051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)" />
  <text x="166.679463" y="102.185442" text-anchor="middle" font-size="22.29734" fill="var(--ok-accent)">NIC Driver</text>
  <text x="166.679463" y="154.804087" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)">netif_rx()</text>
  <rect x="355.547025" y="40" width="253.358925" height="155.464051" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)" />
  <text x="482.226488" y="102.185442" text-anchor="middle" font-size="22.29734" fill="var(--primary-accent)">ip_rcv()</text>
  <text x="482.226488" y="154.804087" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)">validate header</text>
  <rect x="671.093927" y="40" width="253.358925" height="155.464051" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)" />
  <text x="797.773512" y="102.185442" text-anchor="middle" font-size="22.29734" fill="var(--warn-accent)">ip_route_input</text>
  <text x="797.773512" y="154.804087" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)">routing decision</text>
  <rect x="986.641075" y="40" width="253.358925" height="155.464051" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)" />
  <text x="1113.320537" y="102.185442" text-anchor="middle" font-size="22.29734" fill="var(--danger-accent)">ip_forward()</text>
  <text x="1113.320537" y="154.804087" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)">forward pkt</text>
  <rect x="355.547025" y="350.927804" width="253.358925" height="155.464051" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)" />
  <text x="482.226488" y="413.113395" text-anchor="middle" font-size="22.29734" fill="var(--info-accent)">ip_local_deliver</text>
  <text x="482.226488" y="465.731892" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)">to transport</text>
  <rect x="986.641075" y="350.927804" width="253.358925" height="155.464051" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="8.102476" filter="url(#shadow)" />
  <text x="1113.320537" y="413.113395" text-anchor="middle" font-size="22.29734" fill="var(--ok-accent)">ip_output()</text>
  <text x="1113.320537" y="465.731892" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)">send to NIC</text>
  <line x1="293.358925" y1="117.731951" x2="355.547025" y2="117.731951" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="608.905827" y1="117.731951" x2="671.093927" y2="117.731951" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="924.452975" y1="117.731951" x2="986.641075" y2="117.731951" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="956.698656" y="99.793706" font-size="17.60317" fill="var(--danger-accent)">fwd</text>
  <line x1="797.773512" y1="195.463754" x2="482.226488" y2="350.927804" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="601.996161" y="273.195853" font-size="17.60317" fill="var(--primary-accent)">local</text>
  <line x1="1113.320537" y1="195.463754" x2="1113.320537" y2="350.927804" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="728.675624" y="620" text-anchor="middle" font-size="19.950323" fill="var(--text-muted)">Netfilter hooks called at PRE_ROUTING, FORWARD, LOCAL_IN, POST_ROUTING</text>
</svg>
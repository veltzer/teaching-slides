<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="37.3333" y="88.8889" width="195.5556" height="115.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="135.1111" y="135.1111" text-anchor="middle" font-size="16.8889" fill="var(--ok-accent)">NIC Driver</text>
  <text x="135.1111" y="174.2222" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">netif_rx()</text>
  <rect x="280.8889" y="88.8889" width="195.5556" height="115.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="378.6667" y="135.1111" text-anchor="middle" font-size="16.8889" fill="var(--primary-accent)">ip_rcv()</text>
  <text x="378.6667" y="174.2222" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">validate header</text>
  <rect x="524.4444" y="88.8889" width="195.5556" height="115.5556" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="622.2222" y="135.1111" text-anchor="middle" font-size="16.8889" fill="var(--warn-accent)">ip_route_input</text>
  <text x="622.2222" y="174.2222" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">routing decision</text>
  <rect x="768" y="88.8889" width="195.5556" height="115.5556" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="865.7778" y="135.1111" text-anchor="middle" font-size="16.8889" fill="var(--danger-accent)">ip_forward()</text>
  <text x="865.7778" y="174.2222" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">forward pkt</text>
  <rect x="280.8889" y="320" width="195.5556" height="115.5556" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="378.6667" y="366.2222" text-anchor="middle" font-size="16.8889" fill="var(--info-accent)">ip_local_deliver</text>
  <text x="378.6667" y="405.3333" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">to transport</text>
  <rect x="768" y="320" width="195.5556" height="115.5556" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6" filter="url(#shadow)" />
  <text x="865.7778" y="366.2222" text-anchor="middle" font-size="16.8889" fill="var(--ok-accent)">ip_output()</text>
  <text x="865.7778" y="405.3333" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">send to NIC</text>
  <line x1="232.8889" y1="146.6667" x2="280.8889" y2="146.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="476.4444" y1="146.6667" x2="524.4444" y2="146.6667" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <line x1="720" y1="146.6667" x2="768" y2="146.6667" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="744.8889" y="133.3333" font-size="13.3333" fill="var(--danger-accent)">fwd</text>
  <line x1="622.2222" y1="204.4444" x2="378.6667" y2="320" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow-primary)" />
  <text x="471.1111" y="262.2222" font-size="13.3333" fill="var(--primary-accent)">local</text>
  <line x1="865.7778" y1="204.4444" x2="865.7778" y2="320" stroke="var(--text-muted)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="568.8889" y="520" text-anchor="middle" font-size="15.1111" fill="var(--text-muted)">Netfilter hooks called at PRE_ROUTING, FORWARD, LOCAL_IN, POST_ROUTING</text>
</svg>
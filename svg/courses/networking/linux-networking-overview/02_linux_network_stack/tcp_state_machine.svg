<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="467.5556" y="12.4444" width="177.7778" height="46.2222" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2.2222" />
  <text x="556.4444" y="41.7778" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--text)">CLOSED</text>
  <line x1="506.6667" y1="58.6667" x2="254.2222" y2="104.8889" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="353.7778" y="72.8889" font-size="11.5556" fill="var(--primary-accent)">passive open</text>
  <rect x="151.1111" y="104.8889" width="177.7778" height="46.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="240" y="134.2222" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">LISTEN</text>
  <line x1="607.1111" y1="58.6667" x2="860.4444" y2="104.8889" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="759.1111" y="72.8889" font-size="11.5556" fill="var(--ok-accent)">active open / SYN</text>
  <rect x="784" y="104.8889" width="177.7778" height="46.2222" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="872.8889" y="134.2222" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--ok-accent)">SYN_SENT</text>
  <line x1="240" y1="151.1111" x2="240" y2="215.1111" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="264.8889" y="191.1111" font-size="11.5556" fill="var(--text-faint)">SYN / SYN+ACK</text>
  <rect x="151.1111" y="215.1111" width="177.7778" height="46.2222" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="240" y="244.4444" text-anchor="middle" font-size="14.2222" font-weight="bold" fill="var(--primary-accent)">SYN_RCVD</text>
  <line x1="328.8889" y1="244.4444" x2="467.5556" y2="316.4444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="366.2222" y="293.3333" font-size="11.5556" fill="var(--text-faint)">ACK</text>
  <line x1="872.8889" y1="151.1111" x2="645.3333" y2="316.4444" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="784" y="244.4444" font-size="11.5556" fill="var(--text-faint)">SYN+ACK / ACK</text>
  <rect x="467.5556" y="304" width="202.6667" height="51.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="568.8889" y="336.8889" text-anchor="middle" font-size="15.1111" font-weight="bold" fill="var(--ok-accent)">ESTABLISHED</text>
  <line x1="506.6667" y1="355.5556" x2="254.2222" y2="412.4444" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="353.7778" y="375.1111" font-size="11.5556" fill="var(--danger-accent)">close / FIN</text>
  <rect x="151.1111" y="412.4444" width="177.7778" height="46.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="240" y="441.7778" text-anchor="middle" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">FIN_WAIT_1</text>
  <line x1="632.8889" y1="355.5556" x2="860.4444" y2="412.4444" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="771.5556" y="375.1111" font-size="11.5556" fill="var(--text-faint)">FIN / ACK</text>
  <rect x="784" y="412.4444" width="177.7778" height="46.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="872.8889" y="441.7778" text-anchor="middle" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">CLOSE_WAIT</text>
  <line x1="240" y1="458.6667" x2="240" y2="508.4444" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="264.8889" y="490.6667" font-size="11.5556" fill="var(--text-faint)">ACK</text>
  <rect x="151.1111" y="508.4444" width="177.7778" height="46.2222" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="240" y="537.7778" text-anchor="middle" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">FIN_WAIT_2</text>
  <line x1="872.8889" y1="458.6667" x2="872.8889" y2="508.4444" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="897.7778" y="490.6667" font-size="11.5556" fill="var(--text-faint)">close / FIN</text>
  <rect x="784" y="508.4444" width="177.7778" height="46.2222" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="872.8889" y="537.7778" text-anchor="middle" font-size="12.4444" font-weight="bold" fill="var(--danger-accent)">LAST_ACK</text>
  <line x1="328.8889" y1="537.7778" x2="467.5556" y2="576" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="378.6667" y="572.4444" font-size="11.5556" fill="var(--text-faint)">FIN / ACK</text>
  <line x1="784" y1="537.7778" x2="645.3333" y2="576" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="784" y="572.4444" font-size="11.5556" fill="var(--text-faint)">ACK</text>
  <rect x="467.5556" y="563.5556" width="177.7778" height="46.2222" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2.2222" />
  <text x="556.4444" y="592.8889" text-anchor="middle" font-size="12.4444" font-weight="bold" fill="var(--text)">TIME_WAIT</text>
</svg>
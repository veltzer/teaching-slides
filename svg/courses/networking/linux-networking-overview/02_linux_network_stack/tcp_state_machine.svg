<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1200" height="580" fill="var(--bg)" rx="6" x="40" y="40"/>
  <rect x="533.125" y="51.2777" width="187.5" height="41.8889" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2.2222" />
  <text x="626.8749" y="77.8611" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--text)">CLOSED</text>
  <line x1="574.375" y1="93.1667" x2="308.125" y2="135.0556" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="413.125" y="106.0556" font-size="11.2974" fill="var(--primary-accent)">passive open</text>
  <rect x="199.375" y="135.0556" width="187.5" height="41.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="293.125" y="161.6389" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">LISTEN</text>
  <line x1="680.3125" y1="93.1667" x2="947.4999" y2="135.0556" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="840.625" y="106.0556" font-size="11.2974" fill="var(--ok-accent)">active open / SYN</text>
  <rect x="866.875" y="135.0556" width="187.5" height="41.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="960.625" y="161.6389" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--ok-accent)">SYN_SENT</text>
  <line x1="293.125" y1="176.9444" x2="293.125" y2="234.9444" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="319.375" y="213.1944" font-size="11.2974" fill="var(--text-faint)">SYN / SYN+ACK</text>
  <rect x="199.375" y="234.9444" width="187.5" height="41.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="293.125" y="261.5277" text-anchor="middle" font-size="13.9044" font-weight="bold" fill="var(--primary-accent)">SYN_RCVD</text>
  <line x1="386.875" y1="261.5277" x2="533.125" y2="326.7777" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="426.25" y="305.8333" font-size="11.2974" fill="var(--text-faint)">ACK</text>
  <line x1="960.625" y1="176.9444" x2="720.625" y2="326.7777" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="866.875" y="261.5277" font-size="11.2974" fill="var(--text-faint)">SYN+ACK / ACK</text>
  <rect x="533.125" y="315.5" width="213.75" height="46.7223" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640" y="345.3056" text-anchor="middle" font-size="14.7735" font-weight="bold" fill="var(--ok-accent)">ESTABLISHED</text>
  <line x1="574.375" y1="362.2223" x2="308.125" y2="413.7777" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="413.125" y="379.9444" font-size="11.2974" fill="var(--danger-accent)">close / FIN</text>
  <rect x="199.375" y="413.7777" width="187.5" height="41.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="293.125" y="440.3611" text-anchor="middle" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">FIN_WAIT_1</text>
  <line x1="707.5" y1="362.2223" x2="947.4999" y2="413.7777" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="853.75" y="379.9444" font-size="11.2974" fill="var(--text-faint)">FIN / ACK</text>
  <rect x="866.875" y="413.7777" width="187.5" height="41.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="960.625" y="440.3611" text-anchor="middle" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">CLOSE_WAIT</text>
  <line x1="293.125" y1="455.6667" x2="293.125" y2="500.7777" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="319.375" y="484.6667" font-size="11.2974" fill="var(--text-faint)">ACK</text>
  <rect x="199.375" y="500.7777" width="187.5" height="41.8889" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="293.125" y="527.3611" text-anchor="middle" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">FIN_WAIT_2</text>
  <line x1="960.625" y1="455.6667" x2="960.625" y2="500.7777" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="986.875" y="484.6667" font-size="11.2974" fill="var(--text-faint)">close / FIN</text>
  <rect x="866.875" y="500.7777" width="187.5" height="41.8889" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="960.625" y="527.3611" text-anchor="middle" font-size="12.1663" font-weight="bold" fill="var(--danger-accent)">LAST_ACK</text>
  <line x1="386.875" y1="527.3611" x2="533.125" y2="562" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="439.375" y="558.7777" font-size="11.2974" fill="var(--text-faint)">FIN / ACK</text>
  <line x1="866.875" y1="527.3611" x2="720.625" y2="562" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)" />
  <text x="866.875" y="558.7777" font-size="11.2974" fill="var(--text-faint)">ACK</text>
  <rect x="533.125" y="550.7223" width="187.5" height="41.8889" rx="6" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2.2222" />
  <text x="626.8749" y="577.3056" text-anchor="middle" font-size="12.1663" font-weight="bold" fill="var(--text)">TIME_WAIT</text>
</svg>
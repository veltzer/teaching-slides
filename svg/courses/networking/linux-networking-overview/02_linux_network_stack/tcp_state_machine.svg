<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="508.421053" y="40" width="263.157895" height="44.88095" rx="7.357671" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2.2222"/>
  <text x="639.99986" y="68.482206" text-anchor="middle" font-size="17.050667" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">CLOSED</text>
  <line x1="566.315789" y1="84.881058" x2="192.631579" y2="129.762008" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="340" y="98.690589" font-size="13.853759" fill="var(--primary-accent)" font-family="Arial, sans-serif">passive open</text>
  <rect x="40" y="129.762008" width="263.157895" height="44.88095" rx="7.357671" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.578947" y="158.244106" text-anchor="middle" font-size="17.050667" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">LISTEN</text>
  <line x1="715" y1="84.881058" x2="1089.99986" y2="129.762008" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="940" y="98.690589" font-size="13.853759" fill="var(--ok-accent)" font-family="Arial, sans-serif">active open / SYN</text>
  <rect x="976.842105" y="129.762008" width="263.157895" height="44.88095" rx="7.357671" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.421053" y="158.244106" text-anchor="middle" font-size="17.050667" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">SYN_SENT</text>
  <line x1="171.578947" y1="174.642851" x2="171.578947" y2="236.785689" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="208.421053" y="213.482125" font-size="13.853759" fill="var(--text-faint)" font-family="Arial, sans-serif">SYN / SYN+ACK</text>
  <rect x="40" y="236.785689" width="263.157895" height="44.88095" rx="7.357671" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.578947" y="265.267788" text-anchor="middle" font-size="17.050667" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">SYN_RCVD</text>
  <line x1="303.157895" y1="265.267788" x2="508.421053" y2="335.178481" stroke="var(--primary-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="358.421053" y="312.738059" font-size="13.853759" fill="var(--text-faint)" font-family="Arial, sans-serif">ACK</text>
  <line x1="1108.421053" y1="174.642851" x2="771.578947" y2="335.178481" stroke="var(--ok-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="976.842105" y="265.267788" font-size="13.853759" fill="var(--text-faint)" font-family="Arial, sans-serif">SYN+ACK / ACK</text>
  <rect x="508.421053" y="323.095234" width="300" height="50.059592" rx="7.357671" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="658.421053" y="355.029796" text-anchor="middle" font-size="18.116425" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">ESTABLISHED</text>
  <line x1="566.315789" y1="373.154826" x2="192.631579" y2="428.392738" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="340" y="392.142784" font-size="13.853759" fill="var(--danger-accent)" font-family="Arial, sans-serif">close / FIN</text>
  <rect x="40" y="428.392738" width="263.157895" height="44.88095" rx="7.357671" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.578947" y="456.874943" text-anchor="middle" font-size="14.919272" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">FIN_WAIT_1</text>
  <line x1="753.157895" y1="373.154826" x2="1089.99986" y2="428.392738" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="958.421053" y="392.142784" font-size="13.853759" fill="var(--text-faint)" font-family="Arial, sans-serif">FIN / ACK</text>
  <rect x="976.842105" y="428.392738" width="263.157895" height="44.88095" rx="7.357671" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.421053" y="456.874943" text-anchor="middle" font-size="14.919272" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">CLOSE_WAIT</text>
  <line x1="171.578947" y1="473.273795" x2="171.578947" y2="521.606995" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="208.421053" y="504.345214" font-size="13.853759" fill="var(--text-faint)" font-family="Arial, sans-serif">ACK</text>
  <rect x="40" y="521.606995" width="263.157895" height="44.88095" rx="7.357671" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.578947" y="550.0892" text-anchor="middle" font-size="14.919272" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">FIN_WAIT_2</text>
  <line x1="1108.421053" y1="473.273795" x2="1108.421053" y2="521.606995" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="1145.263158" y="504.345214" font-size="13.853759" fill="var(--text-faint)" font-family="Arial, sans-serif">close / FIN</text>
  <rect x="976.842105" y="521.606995" width="263.157895" height="44.88095" rx="7.357671" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.421053" y="550.0892" text-anchor="middle" font-size="14.919272" font-weight="bold" fill="var(--danger-accent)" font-family="Arial, sans-serif">LAST_ACK</text>
  <line x1="303.157895" y1="550.0892" x2="508.421053" y2="587.202296" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="376.842105" y="583.749833" font-size="13.853759" fill="var(--text-faint)" font-family="Arial, sans-serif">FIN / ACK</text>
  <line x1="976.842105" y1="550.0892" x2="771.578947" y2="587.202296" stroke="var(--danger-border)" stroke-width="1.7778" marker-end="url(#arrow)"/>
  <text x="976.842105" y="583.749833" font-size="13.853759" fill="var(--text-faint)" font-family="Arial, sans-serif">ACK</text>
  <rect x="508.421053" y="575.11905" width="263.157895" height="44.88095" rx="7.357671" fill="var(--border)" stroke="var(--text-muted)" stroke-width="2.2222"/>
  <text x="639.99986" y="603.601148" text-anchor="middle" font-size="14.919272" font-weight="bold" fill="var(--text)" font-family="Arial, sans-serif">TIME_WAIT</text>
</svg>

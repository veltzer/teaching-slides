<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Resolver Chain &amp; N+1 Problem</text>

  <rect x="40" y="87.889908256881" width="558.620689655172" height="532.110091743119" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="319.310344827586" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--danger-text)">N+1 trap</text>
  <rect x="60.689655172414" y="151.743119266055" width="517.241379310345" height="191.559633027523" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="81.379310344828" y="178.348623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">query { posts { author { name } } }</text>
  <text x="81.379310344828" y="210.275229357798" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">posts -&gt; SELECT * FROM posts (1)</text>
  <text x="81.379310344828" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">post1.author -&gt; SELECT user (2)</text>
  <text x="81.379310344828" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">post2.author -&gt; SELECT user (3)</text>
  <text x="81.379310344828" y="290.091743119266" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">post3.author -&gt; SELECT user (4)</text>
  <text x="81.379310344828" y="322.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-fill)">100 posts = 101 queries</text>

  <text x="60.689655172414" y="391.192660550459" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--danger-text)">Why it happens</text>
  <text x="60.689655172414" y="423.119266055046" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Each resolver runs independently</text>
  <text x="60.689655172414" y="449.724770642202" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">No batching by default</text>
  <text x="60.689655172414" y="476.330275229358" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">Nested = multiplied</text>
  <text x="60.689655172414" y="524.220183486239" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--danger-text)">DB melts under load</text>

  <rect x="640" y="87.889908256881" width="600" height="532.110091743119" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--ok-text)">DataLoader fix</text>
  <rect x="660.689655172414" y="151.743119266055" width="558.620689655172" height="191.559633027523" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="681.379310344828" y="178.348623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">authorLoader = new DataLoader(</text>
  <text x="681.379310344828" y="204.954128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">  ids =&gt; loadUsers(ids)</text>
  <text x="681.379310344828" y="231.559633027523" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">)</text>
  <text x="681.379310344828" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">// in resolver:</text>
  <text x="681.379310344828" y="290.091743119266" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">author: post =&gt;</text>
  <text x="681.379310344828" y="316.697247706422" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">  authorLoader.load(post.user_id)</text>

  <text x="660.689655172414" y="385.871559633028" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">How it works</text>
  <text x="660.689655172414" y="417.798165137615" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Collects keys per request tick</text>
  <text x="660.689655172414" y="444.403669724771" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Issues one batch query</text>
  <text x="660.689655172414" y="471.009174311927" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Returns results in order</text>
  <text x="660.689655172414" y="497.614678899083" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Caches within request scope</text>
  <text x="660.689655172414" y="540.183486238532" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--ok-text)">100 posts -&gt; 2 queries</text>
</svg>

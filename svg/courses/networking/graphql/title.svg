<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)"><metadata><type>title</type></metadata><defs><style id="palette-vars">:root, svg { --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0; --text: #212121; --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e; --black: #000000; --primary-fill: #2196f3; --primary-border: #1565c0; --primary-text: #ffffff; --primary-accent: #0d47a1; --ok-fill: #4caf50; --ok-border: #2e7d32; --ok-text: #ffffff; --ok-accent: #1b5e20; --warn-fill: #ff9800; --warn-border: #e65100; --warn-text: #ffffff; --warn-accent: #bf360c; --danger-fill: #e74c3c; --danger-border: #c62828; --danger-text: #ffffff; --danger-accent: #b71c1c; --info-fill: #9c27b0; --info-border: #6a1b9a; --info-text: #ffffff; --info-accent: #4a148c; }</style></defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">GraphQL</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">A query language for your API</text>
<g font-family="Arial, sans-serif" text-anchor="middle" transform="translate(29,22)">
  <rect x="100" y="215" width="270" height="235" rx="8" fill="none" stroke="var(--info-fill)" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="18" text-anchor="start">
    <text x="125" y="250" fill="var(--info-fill)">query {</text>
    <text x="147" y="277" fill="var(--surface)">user(id: 7) {</text>
    <text x="169" y="304" fill="var(--surface)">name</text>
    <text x="169" y="331" fill="var(--surface)">posts {</text>
    <text x="191" y="358" fill="var(--surface)">title</text>
    <text x="169" y="385" fill="var(--surface)">}</text>
    <text x="147" y="412" fill="var(--surface)">}</text>
    <text x="125" y="439" fill="var(--info-fill)">}</text>
  </g>
  <line x1="370" y1="332" x2="458" y2="332" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="-10,-7 10,0 -10,7" fill="var(--text-muted)" transform="translate(462,332)"/>
  <text x="418" y="320" font-size="15" fill="var(--text-faint)">POST</text>
  <rect x="472" y="262" width="300" height="140" rx="10" fill="var(--primary-accent)"/>
  <text x="622" y="294" font-size="20" font-weight="bold" fill="var(--primary-text)">GraphQL Server</text>
  <rect x="488" y="312" width="128" height="40" rx="20" fill="var(--primary-fill)"/>
  <text x="552" y="338" font-size="17" fill="var(--primary-text)">Schema</text>
  <rect x="628" y="312" width="128" height="40" rx="20" fill="var(--primary-fill)"/>
  <text x="692" y="338" font-size="17" fill="var(--primary-text)">Resolvers</text>
  <text x="622" y="383" font-size="15" fill="var(--primary-text)">one endpoint: /graphql</text>
  <line x1="772" y1="332" x2="878" y2="257" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="-10,-7 10,0 -10,7" fill="var(--text-muted)" transform="translate(882,254) rotate(-35)"/>
  <line x1="772" y1="332" x2="876" y2="332" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="-10,-7 10,0 -10,7" fill="var(--text-muted)" transform="translate(880,332)"/>
  <line x1="772" y1="332" x2="878" y2="407" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="-10,-7 10,0 -10,7" fill="var(--text-muted)" transform="translate(882,410) rotate(35)"/>
  <rect x="892" y="229" width="230" height="50" rx="8" fill="var(--ok-fill)"/>
  <text x="1007" y="260" font-size="18" fill="var(--ok-text)">Database</text>
  <rect x="892" y="307" width="230" height="50" rx="8" fill="var(--warn-fill)"/>
  <text x="1007" y="338" font-size="18" fill="var(--warn-text)">REST API</text>
  <rect x="892" y="385" width="230" height="50" rx="8" fill="var(--danger-fill)"/>
  <text x="1007" y="416" font-size="18" fill="var(--danger-text)">Microservice</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">schema &#8226; resolvers &#8226; mutations &#8226; subscriptions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--code-text)">Network Security</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="300" y="196" width="680" height="268" rx="18" fill="none" stroke="var(--danger-fill)" stroke-width="3"/>
  <text x="640" y="222" font-size="17" fill="var(--danger-fill)">Perimeter</text>
  <rect x="360" y="234" width="560" height="216" rx="16" fill="none" stroke="var(--warn-fill)" stroke-width="3"/>
  <text x="640" y="260" font-size="17" fill="var(--warn-fill)">Network</text>
  <rect x="420" y="272" width="440" height="164" rx="14" fill="none" stroke="var(--info-fill)" stroke-width="3"/>
  <text x="640" y="298" font-size="17" fill="var(--info-fill)">Host</text>
  <rect x="480" y="310" width="320" height="112" rx="12" fill="none" stroke="var(--primary-fill)" stroke-width="3"/>
  <text x="640" y="336" font-size="17" fill="var(--primary-fill)">Application</text>
  <rect x="560" y="350" width="160" height="52" rx="26" fill="var(--ok-fill)"/>
  <text x="640" y="383" font-size="19" fill="var(--ok-text)">Data</text>
  <rect x="90" y="312" width="140" height="48" rx="10" fill="var(--danger-accent)"/>
  <text x="160" y="343" font-size="18" fill="var(--danger-text)">Internet</text>
  <line x1="230" y1="336" x2="286" y2="336" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="298,336 286,329 286,343" fill="var(--text-muted)"/>
  <line x1="980" y1="336" x2="1040" y2="336" stroke="var(--text-muted)" stroke-width="3" stroke-dasharray="7,5"/>
  <text x="1010" y="322" font-size="15" fill="var(--text-faint)">logs</text>
  <rect x="1050" y="312" width="140" height="48" rx="10" fill="var(--info-accent)"/>
  <text x="1120" y="343" font-size="18" fill="var(--info-text)">SIEM</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">threat model • segmentation • TLS &amp; certificates • identity • detection • zero trust</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

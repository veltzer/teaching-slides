<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">TLS Handshake</text>

  <rect x="40" y="102.142857142857" width="214.285714285714" height="82.857142857143" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857142857" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--primary-text)">Client</text>
  <text x="147.142857142857" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">browser / app</text>

  <rect x="1025.714285714286" y="102.142857142857" width="214.285714285714" height="82.857142857143" rx="10.534200859823" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.857142857143" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.961561547682" font-weight="bold" fill="var(--primary-text)">Server</text>
  <text x="1132.857142857143" y="169.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--primary-text)">holds private key</text>

  <path d="M 254.285714285714 226.428571428571 L 1025.714285714286 226.428571428571" fill="none" stroke="var(--info-accent)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="640" y="216.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--info-accent)">1. ClientHello</text>
  <text x="640" y="241.964285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--text-muted)">supported ciphers, random</text>

  <path d="M 1025.714285714286 278.214285714286 L 254.285714285714 278.214285714286" fill="none" stroke="var(--info-accent)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="640" y="267.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--info-accent)">2. ServerHello + Certificate</text>
  <text x="640" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--text-muted)">picked cipher, public key, chain</text>

  <path d="M 254.285714285714 330 L 1025.714285714286 330" fill="none" stroke="var(--warn-accent)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="640" y="319.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--warn-accent)">3. ClientKeyExchange</text>
  <text x="640" y="345.535714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--text-muted)">verifies cert, generates premaster, encrypts with public key</text>

  <path d="M 254.285714285714 381.785714285714 L 1025.714285714286 381.785714285714" fill="none" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <path d="M 1025.714285714286 407.678571428571 L 254.285714285714 407.678571428571" fill="none" stroke="var(--ok-accent)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="640" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">4. Both derive shared session key</text>
  <text x="640" y="423.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">5. Encrypted payload</text>

  <rect x="40" y="464.642857142857" width="578.571428571429" height="155.357142857143" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.285714285714" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Why it works</text>
  <text x="61.428571428571" y="524.714285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Asymmetric for handshake (slow)</text>
  <text x="61.428571428571" y="549.571428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Symmetric for bulk (fast)</text>
  <text x="61.428571428571" y="576.5" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">CA chain prevents impersonation</text>
  <text x="61.428571428571" y="604.464285714286" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">TLS 1.3 cuts to 1 round-trip</text>

  <rect x="661.428571428571" y="464.642857142857" width="578.571428571429" height="155.357142857143" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.714285714286" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Common failures</text>
  <text x="682.857142857143" y="524.714285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-accent)">Expired certificate</text>
  <text x="682.857142857143" y="549.571428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-accent)">Self-signed in production</text>
  <text x="682.857142857143" y="576.5" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-accent)">Hostname mismatch</text>
  <text x="682.857142857143" y="604.464285714286" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">Automate renewal</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="645.128205128205" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.545274338165" font-weight="bold" fill="var(--text)">Encapsulation: Headers Wrap Each Layer</text>

  <rect x="50.25641025641" y="111.132075471698" width="1189.74358974359" height="87.547169811321" rx="6.356601770346" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="645.128205128205" y="149.433962264151" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.069805311037" font-weight="bold" fill="var(--info-text)">Application data: GET /index.html</text>
  <text x="645.128205128205" y="180.075471698113" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637169083" fill="var(--info-text)">your message</text>

  <rect x="91.282051282051" y="220.566037735849" width="123.076923076923" height="87.547169811321" rx="6.356601770346" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="152.820512820513" y="264.339622641509" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637169083" font-weight="bold" fill="var(--primary-text)">TCP hdr</text>
  <text x="152.820512820513" y="286.22641509434" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.653769912301" fill="var(--primary-text)">20 bytes</text>

  <rect x="214.358974358974" y="220.566037735849" width="1025.641025641026" height="87.547169811321" rx="6.356601770346" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="727.179487179487" y="269.811320754717" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--info-text)">Application data</text>

  <rect x="50.25641025641" y="330" width="123.076923076923" height="87.547169811321" rx="6.356601770346" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.794871794872" y="373.77358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637169083" font-weight="bold" fill="var(--warn-text)">IP hdr</text>
  <text x="111.794871794872" y="395.660377358491" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.653769912301" fill="var(--warn-text)">20 bytes</text>

  <rect x="173.333333333333" y="330" width="123.076923076923" height="87.547169811321" rx="6.356601770346" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.871794871795" y="373.77358490566" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637169083" font-weight="bold" fill="var(--primary-text)">TCP hdr</text>

  <rect x="296.410256410256" y="330" width="943.589743589744" height="87.547169811321" rx="6.356601770346" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="768.205128205128" y="379.245283018868" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--info-text)">Application data</text>

  <rect x="50.25641025641" y="439.433962264151" width="123.076923076923" height="87.547169811321" rx="6.356601770346" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="111.794871794872" y="483.207547169811" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637169083" font-weight="bold" fill="var(--ok-text)">Eth hdr</text>
  <text x="111.794871794872" y="505.094339622641" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.653769912301" fill="var(--ok-text)">14 bytes</text>

  <rect x="173.333333333333" y="439.433962264151" width="123.076923076923" height="87.547169811321" rx="6.356601770346" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="234.871794871795" y="488.679245283019" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637169083" font-weight="bold" fill="var(--warn-text)">IP hdr</text>

  <rect x="296.410256410256" y="439.433962264151" width="123.076923076923" height="87.547169811321" rx="6.356601770346" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="357.948717948718" y="488.679245283019" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637169083" font-weight="bold" fill="var(--primary-text)">TCP hdr</text>

  <rect x="419.487179487179" y="439.433962264151" width="738.461538461538" height="87.547169811321" rx="6.356601770346" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="788.717948717949" y="488.679245283019" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.832070797474" fill="var(--info-text)">Application data</text>

  <rect x="1157.948717948718" y="439.433962264151" width="82.051282051282" height="87.547169811321" rx="6.356601770346" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1198.974358974359" y="488.679245283019" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.713203540692" font-weight="bold" fill="var(--ok-text)">FCS</text>

  <text x="40" y="269.811320754717" text-anchor="end" font-family="Arial, sans-serif" font-size="14.832070797474" font-weight="bold" fill="var(--text-muted)">L4</text>
  <text x="40" y="379.245283018868" text-anchor="end" font-family="Arial, sans-serif" font-size="14.832070797474" font-weight="bold" fill="var(--text-muted)">L3</text>
  <text x="40" y="488.679245283019" text-anchor="end" font-family="Arial, sans-serif" font-size="14.832070797474" font-weight="bold" fill="var(--text-muted)">L2</text>

  <text x="645.128205128205" y="587.169811320755" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.832070797474" font-weight="bold" fill="var(--text)">each layer adds its header; receiver strips them in reverse</text>
  <text x="645.128205128205" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.772637169083" font-style="italic" fill="var(--text-muted)">final wire format: Ethernet frame around IP packet around TCP segment around app data</text>
</svg>

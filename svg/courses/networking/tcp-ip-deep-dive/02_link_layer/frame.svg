<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.565178609681" font-weight="bold" fill="var(--text)">Ethernet Frame Anatomy</text>

  <rect x="40" y="106.725663716814" width="162.71186440678" height="102.654867256637" rx="6.130425833003" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.35593220339" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--warn-text)">Preamble</text>
  <text x="121.35593220339" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.260851666007" fill="var(--warn-text)">7 bytes</text>
  <text x="121.35593220339" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.239114027173" fill="var(--warn-text)">sync</text>

  <rect x="223.050847457627" y="106.725663716814" width="183.050847457627" height="102.654867256637" rx="6.130425833003" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="314.576271186441" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--primary-text)">Dst MAC</text>
  <text x="314.576271186441" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.260851666007" fill="var(--primary-text)">6 bytes</text>
  <text x="314.576271186441" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.239114027173" fill="var(--primary-text)">recipient</text>

  <rect x="426.440677966102" y="106.725663716814" width="183.050847457627" height="102.654867256637" rx="6.130425833003" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="517.966101694915" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--primary-text)">Src MAC</text>
  <text x="517.966101694915" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.260851666007" fill="var(--primary-text)">6 bytes</text>
  <text x="517.966101694915" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.239114027173" fill="var(--primary-text)">sender</text>

  <rect x="629.830508474576" y="106.725663716814" width="142.372881355932" height="102.654867256637" rx="6.130425833003" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="701.016949152542" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--info-text)">EtherType</text>
  <text x="701.016949152542" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.260851666007" fill="var(--info-text)">2 bytes</text>
  <text x="701.016949152542" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.239114027173" fill="var(--info-text)">0x0800 = IPv4</text>

  <rect x="792.542372881356" y="106.725663716814" width="325.423728813559" height="102.654867256637" rx="6.130425833003" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955.254237288136" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--ok-text)">Payload</text>
  <text x="955.254237288136" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.260851666007" fill="var(--ok-text)">46-1500 bytes (MTU)</text>
  <text x="955.254237288136" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.239114027173" fill="var(--ok-text)">IP packet inside</text>

  <rect x="1138.305084745763" y="106.725663716814" width="101.694915254237" height="102.654867256637" rx="6.130425833003" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1189.152542372881" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--warn-text)">FCS</text>
  <text x="1189.152542372881" y="168.318584070796" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.260851666007" fill="var(--warn-text)">4 bytes</text>
  <text x="1189.152542372881" y="188.849557522124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.239114027173" fill="var(--warn-text)">CRC-32</text>

  <rect x="40" y="260.70796460177" width="1200" height="102.654867256637" rx="6.130425833003" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="629.830508474576" y="291.504424778761" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--surface)">EtherType examples</text>
  <text x="60.338983050847" y="320.247787610619" font-family="Courier New, monospace" font-size="13.282589304841" fill="var(--surface)">0x0800 → IPv4    0x86DD → IPv6    0x0806 → ARP    0x8100 → 802.1Q VLAN tag</text>
  <text x="60.338983050847" y="347.964601769912" font-family="Arial, sans-serif" font-size="12.260851666007" fill="var(--text-faint)">tells receiver how to parse payload</text>

  <rect x="40" y="394.159292035398" width="1200" height="225.840707964602" rx="6.130425833003" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.830508474576" y="430.088495575221" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.39127749901" font-weight="bold" fill="var(--text)">MAC address structure</text>

  <text x="60.338983050847" y="466.017699115044" font-family="Courier New, monospace" font-size="14.304326943675" fill="var(--text)">aa:bb:cc:11:22:33</text>
  <text x="263.728813559322" y="466.017699115044" font-family="Arial, sans-serif" font-size="13.282589304841" fill="var(--text-muted)">first 3 bytes = OUI</text>
  <text x="263.728813559322" y="491.681415929204" font-family="Arial, sans-serif" font-size="13.282589304841" fill="var(--text-muted)">last 3 = vendor-assigned</text>

  <text x="60.338983050847" y="532.743362831858" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--text)">Special MACs</text>
  <text x="60.338983050847" y="558.407079646018" font-family="Arial, sans-serif" font-size="13.282589304841" fill="var(--text)">- ff:ff:ff:ff:ff:ff = broadcast</text>
  <text x="60.338983050847" y="580.991150442478" font-family="Arial, sans-serif" font-size="13.282589304841" fill="var(--text)">- 01:00:5e:* = multicast</text>
  <text x="60.338983050847" y="603.575221238938" font-family="Arial, sans-serif" font-size="13.282589304841" font-style="italic" fill="var(--ok-accent)">switches forward by dst, learn src</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Private and Reserved IPv4 Ranges</text>
  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">10.0.0.0/8</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Largest private block</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">16.7M addresses</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Used by big companies</text>
  <text x="60" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">VPCs default here</text>
  <text x="60" y="285" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">RFC 1918 class A</text>
  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">172.16.0.0/12</text>
  <text x="365" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Mid-size private block</text>
  <text x="365" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">1M addresses</text>
  <text x="365" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Often docker bridges</text>
  <text x="365" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">172.16 to 172.31</text>
  <text x="365" y="285" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">RFC 1918 class B</text>
  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">192.168.0.0/16</text>
  <text x="670" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Small private block</text>
  <text x="670" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">65k addresses</text>
  <text x="670" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Home and SOHO routers</text>
  <text x="670" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Easy to remember</text>
  <text x="670" y="285" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--ok-text)">RFC 1918 class C</text>
  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Reserved</text>
  <text x="975" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">127.0.0.0/8 loopback</text>
  <text x="975" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">169.254.0.0/16 link-local</text>
  <text x="975" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">100.64.0.0/10 carrier NAT</text>
  <text x="975" y="245" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">224.0.0.0/4 multicast</text>
  <text x="975" y="285" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Special meaning</text>
</svg>

  <text x="162.033898305085" y="389.026548672566" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.347802221342" font-weight="bold" fill="var(--ok-text)">Server</text>
  <text x="162.033898305085" y="417.769911504425" text-anchor="middle" font-family="Courier New, monospace" font-size="13.282589304841" fill="var(--ok-text)">10.0.0.7:8443</text>

  <rect x="416.271186440678" y="209.380530973451" width="284.745762711864" height="123.185840707965" rx="6.130425833003" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="558.64406779661" y="250.442477876106" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.39127749901" font-weight="bold" fill="var(--warn-text)">NAT Router</text>
  <text x="558.64406779661" y="281.238938053097" text-anchor="middle" font-family="Courier New, monospace" font-size="13.282589304841" fill="var(--warn-text)">private: 10.0.0.1</text>
  <text x="558.64406779661" y="306.902654867257" text-anchor="middle" font-family="Courier New, monospace" font-size="13.282589304841" fill="var(--warn-text)">public: 198.51.100.5</text>


  <text x="1026.440677966102" y="250.442477876106" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.39127749901" font-weight="bold" fill="var(--primary-text)">Internet</text>
  <text x="1026.440677966102" y="281.238938053097" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.282589304841" fill="var(--primary-text)">sees only 198.51.100.5</text>

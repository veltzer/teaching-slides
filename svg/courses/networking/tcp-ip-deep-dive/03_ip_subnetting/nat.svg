  <text x="162.033898305085" y="265.840707964602" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.347802221342" font-weight="bold" fill="var(--ok-text)">Phone</text>
  <text x="162.033898305085" y="294.58407079646" text-anchor="middle" font-family="Courier New, monospace" font-size="13.282589304841" fill="var(--ok-text)">10.0.0.6:48765</text>


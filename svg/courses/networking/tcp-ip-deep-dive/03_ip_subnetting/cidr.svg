<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.565178609681" font-weight="bold" fill="var(--text)">CIDR: 192.168.1.0/24</text>

  <rect x="40" y="106.725663716814" width="813.559322033898" height="102.654867256637" rx="6.130425833003" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="446.779661016949" y="147.787610619469" text-anchor="middle" font-family="Courier New, monospace" font-size="22.478228054346" font-weight="bold" fill="var(--primary-text)">11000000.10101000.00000001 . 00000000</text>
  <text x="446.779661016949" y="183.716814159292" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.304326943675" fill="var(--primary-text)">192     . 168    . 1     .     0</text>

  <rect x="40" y="229.911504424779" width="610.169491525424" height="61.592920353982" rx="6.130425833003" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="345.084745762712" y="268.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.347802221342" font-weight="bold" fill="var(--warn-text)">network: 24 bits = /24</text>

  <rect x="650.169491525424" y="229.911504424779" width="203.389830508475" height="61.592920353982" rx="6.130425833003" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="751.864406779661" y="268.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.347802221342" font-weight="bold" fill="var(--ok-text)">host: 8 bits</text>

  <rect x="40" y="322.300884955752" width="1200" height="297.699115044248" rx="6.130425833003" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.830508474576" y="358.230088495575" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.39127749901" font-weight="bold" fill="var(--text)">Address breakdown</text>

  <text x="60.338983050847" y="394.159292035398" font-family="Arial, sans-serif" font-size="14.304326943675" fill="var(--text)">- network address (host bits all 0):</text>
  <text x="528.135593220339" y="394.159292035398" font-family="Courier New, monospace" font-size="14.304326943675" fill="var(--text)">192.168.1.0</text>
  <text x="60.338983050847" y="424.955752212389" font-family="Arial, sans-serif" font-size="14.304326943675" fill="var(--text)">- broadcast (host bits all 1):</text>
  <text x="528.135593220339" y="424.955752212389" font-family="Courier New, monospace" font-size="14.304326943675" fill="var(--text)">192.168.1.255</text>
  <text x="60.338983050847" y="455.752212389381" font-family="Arial, sans-serif" font-size="14.304326943675" fill="var(--text)">- usable host range:</text>
  <text x="528.135593220339" y="455.752212389381" font-family="Courier New, monospace" font-size="14.304326943675" fill="var(--text)">192.168.1.1 — 192.168.1.254</text>
  <text x="60.338983050847" y="486.548672566372" font-family="Arial, sans-serif" font-size="14.304326943675" fill="var(--text)">- total addresses:</text>
  <text x="528.135593220339" y="486.548672566372" font-family="Courier New, monospace" font-size="14.304326943675" fill="var(--text)">2^8 = 256</text>
  <text x="60.338983050847" y="517.345132743363" font-family="Arial, sans-serif" font-size="14.304326943675" fill="var(--text)">- usable hosts:</text>
  <text x="528.135593220339" y="517.345132743363" font-family="Courier New, monospace" font-size="14.304326943675" fill="var(--text)">256 - 2 = 254</text>

  <text x="60.338983050847" y="563.53982300885" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--text-muted)">Common CIDR sizes:</text>
  <text x="60.338983050847" y="589.203539823009" font-family="Courier New, monospace" font-size="13.282589304841" fill="var(--text)">/30 = 4 addr · /29 = 8 · /28 = 16 · /24 = 256 · /23 = 512 · /16 = 65k · /8 = 16M</text>
</svg>

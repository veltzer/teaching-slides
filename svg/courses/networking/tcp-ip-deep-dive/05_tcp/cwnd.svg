<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">TCP Congestion Window (cwnd) Over Time</text>

  <rect x="60.689655172414" y="87.027027027027" width="1179.310344827586" height="418.018018018018" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>

  <line x1="102.068965517241" y1="463.243243243243" x2="1198.620689655173" y2="463.243243243243" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="102.068965517241" y1="107.927927927928" x2="102.068965517241" y2="463.243243243243" stroke="var(--text-muted)" stroke-width="2"/>

  <text x="40" y="280.36036036036" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--text-muted)">cwnd</text>
  <text x="640" y="494.594594594595" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--text-muted)">time (RTTs)</text>

  <path d="M 102.068965517241 452.792792792793 L 184.827586206897 421.441441441441 L 267.586206896552 358.738738738739 L 350.344827586207 264.684684684685 L 433.103448275862 191.531531531532 L 433.103448275862 191.531531531532" stroke="var(--ok-border)" stroke-width="3" fill="none"/>
  <text x="267.586206896552" y="170.630630630631" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--ok-accent)">slow start</text>
  <text x="267.586206896552" y="191.531531531532" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.437255388021" fill="var(--ok-accent)">cwnd doubles per RTT</text>

  <path d="M 433.103448275862 191.531531531532 L 495.172413793103 170.630630630631 L 577.931034482759 149.72972972973 L 660.689655172414 128.828828828829 L 722.758620689655 118.378378378378" stroke="var(--warn-border)" stroke-width="3" fill="none"/>
  <text x="598.620689655172" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.556506857481" font-weight="bold" fill="var(--warn-accent)">congestion avoidance</text>
  <text x="598.620689655172" y="123.603603603604" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.437255388021" fill="var(--warn-accent)">linear (+1 per RTT)</text>

  <line x1="722.758620689655" y1="113.153153153153" x2="722.758620689655" y2="463.243243243243" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="722.758620689655" y="102.702702702703" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--danger-accent)">packet loss!</text>

  <path d="M 722.758620689655 118.378378378378 L 743.448275862069 275.135135135135" stroke="var(--danger-border)" stroke-width="3" fill="none"/>
  <text x="805.51724137931" y="264.684684684685" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--danger-accent)">cwnd halved</text>

  <path d="M 743.448275862069 275.135135135135 L 826.206896551724 243.783783783784 L 908.965517241379 212.432432432432 L 991.724137931035 186.306306306306 L 1074.48275862069 170.630630630631 L 1157.241379310345 160.18018018018" stroke="var(--ok-border)" stroke-width="3" fill="none"/>
  <text x="960.689655172414" y="170.630630630631" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" font-weight="bold" fill="var(--ok-accent)">recover (linear growth)</text>

  <text x="640" y="562.522522522523" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--text)">TCP Reno classic shape; Cubic and BBR differ in details</text>
  <text x="640" y="593.873873873874" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text-muted)">- slow start: exponential probing for bandwidth</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text-muted)">- avoidance: linear; back off on loss; recover</text>
</svg>

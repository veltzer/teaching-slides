<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.037743528509" font-weight="bold" fill="var(--text)">TCP Connection Close (Four-Way)</text>

  <rect x="40" y="87.027027027027" width="327.272727272727" height="83.603603603604" rx="7.162556198887" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="203.636363636364" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.48766859666" font-weight="bold" fill="var(--primary-text)">Client</text>

  <rect x="912.727272727273" y="87.027027027027" width="327.272727272727" height="83.603603603604" rx="7.162556198887" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1076.363636363636" y="134.054054054054" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.48766859666" font-weight="bold" fill="var(--ok-text)">Server</text>

  <line x1="203.636363636364" y1="170.630630630631" x2="203.636363636364" y2="609.54954954955" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="1076.363636363636" y1="170.630630630631" x2="1076.363636363636" y2="609.54954954955" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 4"/>

  <path d="M 203.636363636364 212.432432432432 L 1076.363636363636 233.333333333333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="217.272727272727" y="201.981981981982" font-family="Arial, sans-serif" font-size="16.712631130736" font-weight="bold" fill="var(--text)">1. FIN</text>
  <text x="217.272727272727" y="233.333333333333" font-family="Arial, sans-serif" font-size="13.131353031292" fill="var(--text-muted)">"I'm done sending"</text>

  <path d="M 1076.363636363636 285.585585585586 L 203.636363636364 306.486486486487" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="721.818181818182" y="275.135135135135" font-family="Arial, sans-serif" font-size="16.712631130736" font-weight="bold" fill="var(--text)">2. ACK</text>
  <text x="626.363636363636" y="306.486486486487" font-family="Arial, sans-serif" font-size="13.131353031292" fill="var(--text-muted)">"acknowledged; I'll finish my data"</text>

  <path d="M 1076.363636363636 379.63963963964 L 203.636363636364 400.540540540541" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="721.818181818182" y="369.189189189189" font-family="Arial, sans-serif" font-size="16.712631130736" font-weight="bold" fill="var(--text)">3. FIN</text>
  <text x="653.636363636364" y="400.540540540541" font-family="Arial, sans-serif" font-size="13.131353031292" fill="var(--text-muted)">"I'm done too"</text>

  <path d="M 203.636363636364 452.792792792793 L 1076.363636363636 473.693693693694" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="217.272727272727" y="442.342342342342" font-family="Arial, sans-serif" font-size="16.712631130736" font-weight="bold" fill="var(--text)">4. ACK</text>
  <text x="217.272727272727" y="473.693693693694" font-family="Arial, sans-serif" font-size="13.131353031292" fill="var(--text-muted)">"final ack"</text>

  <rect x="40" y="515.495495495495" width="1200" height="104.504504504504" rx="7.162556198887" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="546.846846846847" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.100149863698" font-weight="bold" fill="var(--text)">After step 4: TIME-WAIT (~60s) then CLOSED</text>
  <text x="67.272727272727" y="576.108108108108" font-family="Arial, sans-serif" font-size="15.518871764255" fill="var(--text)">- TIME-WAIT catches stragglers; prevents reuse with stale segments</text>
  <text x="67.272727272727" y="602.234234234234" font-family="Arial, sans-serif" font-size="15.518871764255" font-style="italic" fill="var(--text-muted)">RST is an alternative: abrupt close, no FIN handshake</text>
</svg>

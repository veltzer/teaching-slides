<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="620" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.342871951533" font-weight="bold" fill="var(--text)">BGP: AS Path Across the Internet</text>

  <rect x="40" y="147.787610619469" width="180" height="102.654867256637" rx="6.079124296508" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="183.716814159292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--primary-text)">AS 64500</text>
  <text x="130" y="209.380530973451" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--primary-text)">your ISP</text>
  <text x="130" y="235.044247787611" text-anchor="middle" font-family="Courier New, monospace" font-size="11.145061210264" fill="var(--primary-text)">203.0.113.0/24</text>

  <rect x="300" y="147.787610619469" width="180" height="102.654867256637" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="183.716814159292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--warn-text)">AS 174</text>
  <text x="390" y="209.380530973451" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--warn-text)">Cogent</text>

  <rect x="560" y="147.787610619469" width="180" height="102.654867256637" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="183.716814159292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--warn-text)">AS 1299</text>
  <text x="650" y="209.380530973451" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--warn-text)">Telia</text>

  <rect x="820" y="147.787610619469" width="180" height="102.654867256637" rx="6.079124296508" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="183.716814159292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--warn-text)">AS 6939</text>
  <text x="910" y="209.380530973451" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--warn-text)">HE</text>

  <rect x="1080" y="147.787610619469" width="160" height="102.654867256637" rx="6.079124296508" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1160" y="183.716814159292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--ok-text)">AS 15169</text>
  <text x="1160" y="209.380530973451" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--ok-text)">Google</text>

  <path d="M 220 199.115044247788 L 300 199.115044247788" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 480 199.115044247788 L 560 199.115044247788" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 740 199.115044247788 L 820 199.115044247788" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1000 199.115044247788 L 1080 199.115044247788" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="312.035398230089" width="1200" height="102.654867256637" rx="6.079124296508" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="620" y="347.964601769912" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--surface)">BGP advertisement seen at AS 64500</text>
  <text x="60" y="378.761061946903" font-family="Courier New, monospace" font-size="14.184623358518" fill="var(--surface)">prefix: 8.8.8.0/24    AS_PATH: 64500 → 174 → 1299 → 6939 → 15169</text>
  <text x="60" y="400.318584070796" font-family="Courier New, monospace" font-size="13.171435975767" fill="var(--text-faint)">each AS prepends itself to the path before re-advertising</text>

  <rect x="40" y="455.752212389381" width="1180" height="164.247787610619" rx="6.079124296508" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="620" y="491.681415929204" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.21099812402" font-weight="bold" fill="var(--text)">BGP path selection (simplified)</text>
  <text x="60" y="522.477876106195" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--text)">- highest local preference (your policy)</text>
  <text x="60" y="548.141592920354" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--text)">- shortest AS path</text>
  <text x="60" y="573.805309734513" font-family="Arial, sans-serif" font-size="13.171435975767" fill="var(--text)">- origin, MED, eBGP/iBGP, IGP cost...</text>
  <text x="60" y="602.548672566372" font-family="Arial, sans-serif" font-size="13.171435975767" font-style="italic" fill="var(--ok-accent)">policy-driven, not just shortest distance — that's BGP</text>
</svg>

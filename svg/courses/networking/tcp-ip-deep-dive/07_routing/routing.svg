<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.565178609681" font-weight="bold" fill="var(--text)">Routing Decision: Longest Prefix Match</text>

  <rect x="40" y="86.194690265487" width="203.389830508475" height="102.654867256637" rx="6.130425833003" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="141.694915254237" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.347802221342" font-weight="bold" fill="var(--primary-text)">Host</text>
  <text x="141.694915254237" y="152.920353982301" text-anchor="middle" font-family="Courier New, monospace" font-size="13.282589304841" fill="var(--primary-text)">10.0.0.5</text>
  <text x="141.694915254237" y="176.530973451327" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.239114027173" fill="var(--primary-text)">→ 8.8.8.8</text>

  <rect x="365.423728813559" y="86.194690265487" width="203.389830508475" height="102.654867256637" rx="6.130425833003" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="467.118644067797" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.347802221342" font-weight="bold" fill="var(--warn-text)">Router</text>
  <text x="467.118644067797" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.260851666007" fill="var(--warn-text)">looks up 8.8.8.8</text>

  <path d="M 243.389830508475 137.522123893805 L 365.423728813559 137.522123893805" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="690.847457627119" y="86.194690265487" width="528.813559322034" height="102.654867256637" rx="6.130425833003" fill="var(--code-bg)" stroke="var(--border)" stroke-width="2"/>
  <text x="701.016949152542" y="111.858407079646" font-family="Arial, sans-serif" font-size="13.282589304841" font-weight="bold" fill="var(--surface)">Routing table (most-specific wins)</text>
  <text x="711.186440677966" y="135.469026548673" font-family="Courier New, monospace" font-size="12.260851666007" fill="var(--surface)">10.0.0.0/8       eth0    direct</text>
  <text x="711.186440677966" y="154.973451327434" font-family="Courier New, monospace" font-size="12.260851666007" fill="var(--surface)">192.168.0.0/16   eth1    via 10.0.0.1</text>
  <text x="711.186440677966" y="174.477876106195" font-family="Courier New, monospace" font-size="12.260851666007" fill="var(--surface)">0.0.0.0/0        eth2    via 198.51.100.1   ← default</text>

  <rect x="40" y="229.911504424779" width="1200" height="184.778761061947" rx="6.130425833003" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.830508474576" y="265.840707964602" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.39127749901" font-weight="bold" fill="var(--text)">For destination 8.8.8.8 the router checks each route</text>

  <text x="60.338983050847" y="301.769911504425" font-family="Arial, sans-serif" font-size="14.304326943675" fill="var(--text)">- 10.0.0.0/8 — does 8.8.8.8 match? no, 8 ≠ 10 in the high octet</text>
  <text x="60.338983050847" y="327.433628318584" font-family="Arial, sans-serif" font-size="14.304326943675" fill="var(--text)">- 192.168.0.0/16 — does 8.8.8.8 match? no, 8 ≠ 192</text>
  <text x="60.338983050847" y="353.097345132743" font-family="Arial, sans-serif" font-size="14.304326943675" fill="var(--text)">- 0.0.0.0/0 — matches everything else (default)</text>
  <text x="60.338983050847" y="389.026548672566" font-family="Arial, sans-serif" font-size="14.304326943675" font-weight="bold" fill="var(--ok-accent)">→ forward to 198.51.100.1 via eth2</text>

  <rect x="40" y="445.486725663717" width="1200" height="174.513274336283" rx="6.130425833003" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.830508474576" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.347802221342" font-weight="bold" fill="var(--ok-text)">Key principles</text>
  <text x="60.338983050847" y="512.212389380531" font-family="Arial, sans-serif" font-size="13.282589304841" fill="var(--ok-text)">- each router decides next hop independently</text>
  <text x="60.338983050847" y="537.87610619469" font-family="Arial, sans-serif" font-size="13.282589304841" fill="var(--ok-text)">- longest prefix match: most-specific route wins</text>
  <text x="60.338983050847" y="563.53982300885" font-family="Arial, sans-serif" font-size="13.282589304841" fill="var(--ok-text)">- routes come from: static config, IGP (OSPF), BGP</text>
  <text x="60.338983050847" y="594.336283185841" font-family="Arial, sans-serif" font-size="13.282589304841" font-style="italic" fill="var(--ok-text)">Linux: ip route show; Cisco: show ip route</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="109.3" width="269.0" height="242.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.5" y="220.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Internal host</text>
  <text x="174.5" y="263.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">origin 10.1.20.50</text>
  <rect x="484.8" y="40.0" width="310.3" height="380.9" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="179.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">NAT object</text>
  <text x="640.0" y="222.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">10.1.20.50</text>
  <text x="640.0" y="263.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">maps to</text>
  <text x="640.0" y="305.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">10.1.10.50</text>
  <rect x="971.0" y="109.3" width="269.0" height="242.4" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5" y="220.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">External client</text>
  <text x="1105.5" y="263.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">any address</text>
  <line x1="971.0" y1="161.2" x2="795.2" y2="161.2" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="883.1" y="147.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">inbound: dst 10.1.10.50</text>
  <line x1="484.8" y1="161.2" x2="309.0" y2="161.2" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="396.9" y="147.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">dst 10.1.20.50</text>
  <line x1="309.0" y1="299.7" x2="484.8" y2="299.7" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="396.9" y="348.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">outbound: src 10.1.20.50</text>
  <line x1="795.2" y1="299.7" x2="971.0" y2="299.7" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="883.1" y="348.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">src 10.1.10.50</text>
  <text x="640.0" y="559.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">one address for one address, both directions</text>
  <text x="640.0" y="620.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">no virtual server, no pool, no load balancing</text>
</svg>

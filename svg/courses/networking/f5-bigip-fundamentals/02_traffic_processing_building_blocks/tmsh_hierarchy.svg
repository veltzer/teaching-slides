  <rect x="380.0" y="450.0" width="210.0" height="60.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="485.0" y="485.8" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="var(--text)">route</text>

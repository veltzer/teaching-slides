<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="254.8" width="260.0" height="128.9" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.0" y="313.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Pool</text>
  <text x="170.0" y="339.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">min active = 2</text>
  <rect x="440.0" y="40.0" width="340.0" height="268.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="610.0" y="77.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">priority 10: preferred</text>
  <rect x="470.0" y="104.4" width="130.0" height="85.9" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="535.0" y="141.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">web1</text>
  <text x="535.0" y="167.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">up</text>
  <rect x="620.0" y="104.4" width="130.0" height="85.9" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="685.0" y="141.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">web2</text>
  <text x="685.0" y="167.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">down</text>
  <text x="610.0" y="260.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">only 1 member available</text>
  <rect x="440.0" y="351.5" width="340.0" height="268.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="610.0" y="389.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">priority 5: backup</text>
  <rect x="470.0" y="415.9" width="130.0" height="85.9" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="535.0" y="452.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">web3</text>
  <text x="535.0" y="479.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">activated</text>
  <text x="610.0" y="571.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">used while preferred &lt; 2</text>
  <line x1="300.0" y1="297.8" x2="440.0" y2="174.3" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="300.0" y="227.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">first choice</text>
  <line x1="300.0" y1="340.7" x2="440.0" y2="485.7" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="310.0" y="424.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">spill over</text>
  <rect x="900.0" y="190.4" width="340.0" height="257.8" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.0" y="287.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Rule</text>
  <text x="1070.0" y="314.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">highest priority first</text>
  <text x="1070.0" y="339.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">add lower groups</text>
  <text x="1070.0" y="365.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">until min active met</text>
</svg>

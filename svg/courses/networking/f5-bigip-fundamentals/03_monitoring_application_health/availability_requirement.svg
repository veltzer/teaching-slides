<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="560.0" height="110.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320.0" y="89.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Availability requirement: All</text>
  <text x="320.0" y="114.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">every monitor must pass</text>
  <rect x="680.0" y="40.0" width="560.0" height="110.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960.0" y="89.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Availability requirement: At Least 2</text>
  <text x="960.0" y="114.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">two of three monitors must pass</text>
  <rect x="40.0" y="200.0" width="360.0" height="80.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0" y="245.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--ok-text)">icmp pass</text>
  <line x1="400.0" y1="240.0" x2="460.0" y2="340.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40.0" y="300.0" width="360.0" height="80.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0" y="345.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--ok-text)">http pass</text>
  <line x1="400.0" y1="340.0" x2="460.0" y2="340.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40.0" y="400.0" width="360.0" height="80.0" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220.0" y="445.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--danger-text)">http_login fail</text>
  <line x1="400.0" y1="440.0" x2="460.0" y2="340.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680.0" y="200.0" width="360.0" height="80.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.0" y="245.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--ok-text)">icmp pass</text>
  <line x1="1040.0" y1="240.0" x2="1100.0" y2="340.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680.0" y="300.0" width="360.0" height="80.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.0" y="345.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--ok-text)">http pass</text>
  <line x1="1040.0" y1="340.0" x2="1100.0" y2="340.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="680.0" y="400.0" width="360.0" height="80.0" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="860.0" y="445.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--danger-text)">http_login fail</text>
  <line x1="1040.0" y1="440.0" x2="1100.0" y2="340.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="460.0" y="300.0" width="140.0" height="80.0" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530.0" y="346.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">DOWN</text>
  <rect x="1100.0" y="300.0" width="140.0" height="80.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1170.0" y="346.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">UP</text>
  <rect x="40.0" y="540.0" width="1200.0" height="80.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="585.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">same three results, different verdict: choose the rule deliberately</text>
</svg>

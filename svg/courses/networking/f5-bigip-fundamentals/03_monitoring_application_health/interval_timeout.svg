<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <line x1="49.9" y1="232.4" x2="1240.0" y2="232.4" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="40.0" y="138.9" width="138.8" height="80.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="109.4" y="185.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">reply</text>
  <line x1="109.4" y1="219.1" x2="109.4" y2="245.8" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="238.3" y="138.9" width="138.8" height="80.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="307.8" y="185.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">reply</text>
  <line x1="307.8" y1="219.1" x2="307.8" y2="245.8" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="436.7" y="138.9" width="138.8" height="80.2" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="506.1" y="185.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">no reply</text>
  <line x1="506.1" y1="219.1" x2="506.1" y2="245.8" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="635.0" y="138.9" width="138.8" height="80.2" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="704.5" y="185.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">no reply</text>
  <line x1="704.5" y1="219.1" x2="704.5" y2="245.8" stroke="var(--text-muted)" stroke-width="2"/>
  <rect x="833.4" y="138.9" width="138.8" height="80.2" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="902.8" y="185.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">no reply</text>
  <line x1="902.8" y1="219.1" x2="902.8" y2="245.8" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="109.4" y1="299.3" x2="307.8" y2="299.3" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="208.6" y="334.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">interval 5s</text>
  <line x1="307.8" y1="58.7" x2="942.5" y2="58.7" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="625.1" y="40.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">timeout 16s since last good reply</text>
  <line x1="307.8" y1="45.3" x2="307.8" y2="138.9" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="942.5" y1="45.3" x2="942.5" y2="132.2" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="942.5" y1="225.8" x2="942.5" y2="259.2" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="1041.7" y="138.9" width="198.3" height="80.2" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1140.8" y="185.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">marked down</text>
  <line x1="972.2" y1="179.0" x2="1041.7" y2="179.0" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <rect x="49.9" y="432.9" width="376.9" height="187.1" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="238.3" y="502.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Member up</text>
  <text x="238.3" y="536.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">green circle</text>
  <text x="238.3" y="568.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">receives new connections</text>
  <rect x="863.1" y="432.9" width="376.9" height="187.1" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1051.6" y="502.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Member down</text>
  <text x="1051.6" y="536.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">red diamond</text>
  <text x="1051.6" y="568.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--danger-text)">no new connections</text>
  <line x1="426.8" y1="526.5" x2="863.1" y2="526.5" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="645.0" y="510.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">timeout expires</text>
</svg>

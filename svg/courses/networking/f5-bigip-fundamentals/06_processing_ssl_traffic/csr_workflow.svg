<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="240.0" width="200.0" height="180.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0" y="312.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Create key + CSR</text>
  <text x="140.0" y="336.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">on BIG-IP</text>
  <text x="140.0" y="359.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">key never leaves</text>
  <rect x="290.0" y="240.0" width="200.0" height="180.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390.0" y="312.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--info-text)">Send CSR to CA</text>
  <text x="390.0" y="336.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">public key</text>
  <text x="390.0" y="359.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">subject, SAN</text>
  <line x1="240.0" y1="330.0" x2="290.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540.0" y="240.0" width="200.0" height="180.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="312.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">CA signs</text>
  <text x="640.0" y="336.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">returns certificate</text>
  <text x="640.0" y="359.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">plus intermediates</text>
  <line x1="490.0" y1="330.0" x2="540.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="790.0" y="240.0" width="200.0" height="180.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="890.0" y="312.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Import certificate</text>
  <text x="890.0" y="336.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">matches the key</text>
  <text x="890.0" y="359.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">same object name</text>
  <line x1="740.0" y1="330.0" x2="790.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1040.0" y="240.0" width="200.0" height="180.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140.0" y="312.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">Use in profile</text>
  <text x="1140.0" y="336.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">client SSL</text>
  <text x="1140.0" y="359.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">cert + key + chain</text>
  <line x1="990.0" y1="330.0" x2="1040.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40.0" y="40.0" width="1200.0" height="90.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="90.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">System &gt; Certificate Management &gt; Traffic Certificate Management &gt; SSL Certificate List</text>
  <rect x="40.0" y="520.0" width="1200.0" height="100.0" rx="6" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="563.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">tmsh create sys crypto key app.example.com gen-csr</text>
  <text x="640.0" y="587.1" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="var(--bg)">country US common-name app.example.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="179.2" width="200.0" height="185.6" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0" y="265.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="140.0" y="294.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">browser</text>
  <rect x="440.0" y="40.0" width="400.0" height="464.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="98.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Virtual server</text>
  <rect x="470.0" y="144.4" width="160.0" height="255.2" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="550.0" y="252.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--primary-text)">Client SSL</text>
  <text x="550.0" y="278.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">decrypts</text>
  <text x="550.0" y="304.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">from client</text>
  <rect x="650.0" y="144.4" width="160.0" height="255.2" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="730.0" y="252.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--warn-text)">Server SSL</text>
  <text x="730.0" y="278.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">encrypts</text>
  <text x="730.0" y="304.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">to server</text>
  <rect x="1040.0" y="179.2" width="200.0" height="185.6" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140.0" y="265.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Server</text>
  <text x="1140.0" y="294.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">pool member</text>
  <line x1="240.0" y1="272.0" x2="470.0" y2="272.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="355.0" y="262.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">TLS 1</text>
  <line x1="810.0" y1="272.0" x2="1040.0" y2="272.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="925.0" y="262.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">TLS 2</text>
  <text x="640.0" y="457.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">cleartext HTTP in TMM</text>
  <text x="140.0" y="596.8" text-anchor="start" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">client side: BIG-IP is the TLS server</text>
  <text x="1240.0" y="596.8" text-anchor="end" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">server side: BIG-IP is the TLS client</text>
  <line x1="40.0" y1="620.0" x2="1240.0" y2="620.0" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6"/>
</svg>

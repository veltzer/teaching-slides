<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="40.0" y="40.0" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">SSL offload</text>
  <rect x="40.0" y="61.9" width="200.0" height="120.4" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0" y="115.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="140.0" y="143.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">browser</text>
  <rect x="520.0" y="61.9" width="280.0" height="120.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="115.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">BIG-IP</text>
  <text x="660.0" y="143.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">decrypt, inspect</text>
  <rect x="1040.0" y="61.9" width="200.0" height="120.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1140.0" y="115.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Server</text>
  <text x="1140.0" y="143.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">pool member</text>
  <line x1="240.0" y1="122.1" x2="520.0" y2="122.1" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380.0" y="113.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">HTTPS</text>
  <line x1="800.0" y1="122.1" x2="1040.0" y2="122.1" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920.0" y="113.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">HTTP</text>
  <text x="40.0" y="258.9" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">SSL re-encryption</text>
  <rect x="40.0" y="280.8" width="200.0" height="120.4" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0" y="334.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="140.0" y="361.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">browser</text>
  <rect x="520.0" y="280.8" width="280.0" height="120.4" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="334.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">BIG-IP</text>
  <text x="660.0" y="361.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">decrypt, inspect, encrypt</text>
  <rect x="1040.0" y="280.8" width="200.0" height="120.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1140.0" y="334.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Server</text>
  <text x="1140.0" y="361.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">pool member</text>
  <line x1="240.0" y1="340.9" x2="520.0" y2="340.9" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380.0" y="332.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">HTTPS</text>
  <line x1="800.0" y1="340.9" x2="1040.0" y2="340.9" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920.0" y="332.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">HTTPS</text>
  <text x="40.0" y="477.7" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">SSL pass-through</text>
  <rect x="40.0" y="499.6" width="200.0" height="120.4" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0" y="553.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="140.0" y="580.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">browser</text>
  <rect x="520.0" y="499.6" width="280.0" height="120.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.0" y="553.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">BIG-IP</text>
  <text x="660.0" y="580.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">no keys, no inspection</text>
  <rect x="1040.0" y="499.6" width="200.0" height="120.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1140.0" y="553.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Server</text>
  <text x="1140.0" y="580.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">pool member</text>
  <line x1="240.0" y1="559.8" x2="520.0" y2="559.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380.0" y="551.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">HTTPS</text>
  <line x1="800.0" y1="559.8" x2="1040.0" y2="559.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920.0" y="551.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">HTTPS</text>
</svg>

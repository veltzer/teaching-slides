<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="270.0" height="160.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.0" y="114.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Management IP</text>
  <text x="175.0" y="139.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">console config</text>
  <line x1="310.0" y1="120.0" x2="350.0" y2="120.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350.0" y="40.0" width="270.0" height="160.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.0" y="114.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">License</text>
  <text x="485.0" y="139.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">registration key</text>
  <line x1="620.0" y1="120.0" x2="660.0" y2="120.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660.0" y="40.0" width="270.0" height="160.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.0" y="114.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Provisioning</text>
  <text x="795.0" y="139.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">LTM nominal</text>
  <line x1="930.0" y1="120.0" x2="970.0" y2="120.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="970.0" y="40.0" width="270.0" height="160.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.0" y="114.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Device certificate</text>
  <text x="1105.0" y="139.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">self-signed or CA</text>
  <rect x="40.0" y="360.0" width="270.0" height="160.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="175.0" y="434.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Platform</text>
  <text x="175.0" y="459.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">hostname, root, admin</text>
  <line x1="310.0" y1="440.0" x2="350.0" y2="440.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350.0" y="360.0" width="270.0" height="160.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="485.0" y="434.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Network</text>
  <text x="485.0" y="459.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">VLANs, self IPs</text>
  <line x1="620.0" y1="440.0" x2="660.0" y2="440.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660.0" y="360.0" width="270.0" height="160.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795.0" y="434.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">NTP and DNS</text>
  <text x="795.0" y="459.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">time and names</text>
  <line x1="930.0" y1="440.0" x2="970.0" y2="440.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="970.0" y="360.0" width="270.0" height="160.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.0" y="434.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Archive</text>
  <text x="1105.0" y="459.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">save a UCS</text>
  <line x1="1105.0" y1="200.0" x2="1105.0" y2="280.0" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="1105.0" y1="280.0" x2="175.0" y2="280.0" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="175.0" y1="280.0" x2="175.0" y2="360.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640.0" y="620.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">GUI Setup Utility walks these in order; tmsh does the same</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="260.0" height="110.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.0" y="89.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="170.0" y="114.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">10.1.10.50</text>
  <rect x="40.0" y="250.0" width="260.0" height="110.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="170.0" y="299.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Admin PC</text>
  <text x="170.0" y="324.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">192.168.1.10</text>
  <rect x="450.0" y="120.0" width="380.0" height="330.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="241.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">bigip1</text>
  <text x="640.0" y="266.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">mgmt 192.168.1.245</text>
  <text x="640.0" y="291.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">external self 10.1.10.245</text>
  <text x="640.0" y="316.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">internal self 10.1.20.245</text>
  <text x="640.0" y="341.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--primary-text)">HA self 10.1.30.245</text>
  <rect x="980.0" y="60.0" width="260.0" height="110.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.0" y="109.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">web1</text>
  <text x="1110.0" y="134.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">10.1.20.11</text>
  <rect x="980.0" y="210.0" width="260.0" height="110.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.0" y="259.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">web2</text>
  <text x="1110.0" y="284.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">10.1.20.12</text>
  <rect x="980.0" y="360.0" width="260.0" height="110.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.0" y="409.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">web3</text>
  <text x="1110.0" y="434.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">10.1.20.13</text>
  <line x1="300.0" y1="95.0" x2="450.0" y2="180.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="345.0" y="115.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">external VLAN 10.1.10.0/24</text>
  <line x1="300.0" y1="305.0" x2="450.0" y2="300.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375.0" y="320.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">mgmt 192.168.1.0/24</text>
  <line x1="830.0" y1="280.0" x2="980.0" y2="115.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="830.0" y1="280.0" x2="980.0" y2="265.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="830.0" y1="280.0" x2="980.0" y2="415.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="905.0" y="450.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">internal VLAN</text>
  <text x="905.0" y="472.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">10.1.20.0/24</text>
  <rect x="450.0" y="520.0" width="380.0" height="100.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="564.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">bigip2 (day 3)</text>
  <text x="640.0" y="589.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">HA VLAN 10.1.30.0/24</text>
  <line x1="640.0" y1="450.0" x2="640.0" y2="520.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="652.0" y="477.0" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">HA</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="167.6" width="220.0" height="162.4" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150.0" y="242.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="150.0" y="271.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">10.1.10.50</text>
  <rect x="450.0" y="40.0" width="380.0" height="417.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="214.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">BIG-IP full proxy</text>
  <text x="640.0" y="243.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">client-side profiles</text>
  <text x="640.0" y="271.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">inspect / rewrite</text>
  <text x="640.0" y="298.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">server-side profiles</text>
  <rect x="1020.0" y="63.2" width="220.0" height="139.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130.0" y="126.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Server 1</text>
  <text x="1130.0" y="155.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">10.1.20.11:80</text>
  <rect x="1020.0" y="295.2" width="220.0" height="139.2" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130.0" y="358.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Server 2</text>
  <text x="1130.0" y="387.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">10.1.20.12:80</text>
  <line x1="260.0" y1="248.8" x2="450.0" y2="248.8" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="355.0" y="239.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">TCP connection 1</text>
  <line x1="830.0" y1="248.8" x2="1020.0" y2="132.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="925.0" y="174.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">TCP connection 2</text>
  <line x1="830.0" y1="248.8" x2="1020.0" y2="364.8" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="150.0" y="550.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">client side</text>
  <text x="1130.0" y="550.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text-muted)">server side</text>
  <text x="640.0" y="550.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">two independent connections, two TCP stacks</text>
  <line x1="40.0" y1="620.0" x2="1240.0" y2="620.0" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="8 6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="227.6" height="113.9" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.8" y="91.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">client 1</text>
  <text x="153.8" y="116.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">request</text>
  <line x1="267.6" y1="97.0" x2="495.2" y2="319.6" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="40.0" y="195.4" width="227.6" height="113.9" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.8" y="246.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">client 2</text>
  <text x="153.8" y="272.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">request</text>
  <line x1="267.6" y1="252.3" x2="495.2" y2="319.6" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="40.0" y="350.7" width="227.6" height="113.9" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.8" y="401.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">client 3</text>
  <text x="153.8" y="427.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">request</text>
  <line x1="267.6" y1="407.7" x2="495.2" y2="319.6" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="40.0" y="506.1" width="227.6" height="113.9" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.8" y="557.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">client 4</text>
  <text x="153.8" y="582.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">request</text>
  <line x1="267.6" y1="563.0" x2="495.2" y2="319.6" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <rect x="495.2" y="205.7" width="310.3" height="227.9" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="650.3" y="289.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">BIG-IP</text>
  <text x="650.3" y="314.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">OneConnect</text>
  <text x="650.3" y="339.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">source mask</text>
  <text x="650.3" y="364.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">0.0.0.0</text>
  <rect x="971.0" y="122.9" width="269.0" height="124.3" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5" y="179.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">server A</text>
  <text x="1105.5" y="204.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">1 idle-reused conn</text>
  <rect x="971.0" y="392.1" width="269.0" height="124.3" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5" y="448.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">server B</text>
  <text x="1105.5" y="474.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">1 idle-reused conn</text>
  <line x1="805.5" y1="288.6" x2="971.0" y2="185.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="888.3" y="228.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">reused</text>
  <line x1="805.5" y1="350.7" x2="971.0" y2="454.3" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="888.3" y="394.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">reused</text>
  <rect x="495.2" y="495.7" width="310.3" height="103.6" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="650.3" y="540.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">4 client conns</text>
  <text x="650.3" y="565.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">2 server conns</text>
</svg>

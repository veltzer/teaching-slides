<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="372.4" height="580.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="226.2" y="298.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Mobile / WAN client</text>
  <text x="226.2" y="324.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">high latency</text>
  <text x="226.2" y="350.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">packet loss</text>
  <text x="226.2" y="376.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">small windows</text>
  <rect x="453.8" y="40.0" width="331.0" height="580.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="619.3" y="311.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">BIG-IP</text>
  <text x="619.3" y="337.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">buffers the gap</text>
  <text x="619.3" y="363.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">between the sides</text>
  <rect x="826.2" y="40.0" width="413.8" height="580.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.1" y="298.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Server LAN</text>
  <text x="1033.1" y="324.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">sub-ms latency</text>
  <text x="1033.1" y="350.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">no loss</text>
  <text x="1033.1" y="376.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">fast ACKs</text>
  <rect x="71.0" y="426.7" width="310.3" height="150.4" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="226.2" y="483.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">tcp-mobile-optimized</text>
  <text x="226.2" y="507.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">larger send buffer</text>
  <text x="226.2" y="531.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">loss-tolerant congestion</text>
  <rect x="857.2" y="426.7" width="351.7" height="150.4" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="1033.1" y="483.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">tcp-lan-optimized</text>
  <text x="1033.1" y="507.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">quick ACK</text>
  <text x="1033.1" y="531.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text)">small buffers, fast response</text>
  <line x1="412.4" y1="319.3" x2="453.8" y2="319.3" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <line x1="784.8" y1="319.3" x2="826.2" y2="319.3" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
</svg>

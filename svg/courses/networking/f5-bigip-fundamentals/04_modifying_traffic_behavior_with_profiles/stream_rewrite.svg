<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="138.7" width="289.7" height="246.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.8" y="240.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Server</text>
  <text x="184.8" y="270.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">href=</text>
  <text x="184.8" y="300.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">http://app.lab</text>
  <rect x="453.8" y="40.0" width="351.7" height="444.3" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.7" y="196.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Stream profile</text>
  <text x="629.7" y="226.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">source</text>
  <text x="629.7" y="256.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">http://app.lab</text>
  <text x="629.7" y="285.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)"></text>
  <text x="629.7" y="315.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">target</text>
  <text x="629.7" y="345.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">https://app.example.com</text>
  <rect x="929.7" y="138.7" width="310.3" height="246.8" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1084.8" y="240.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="1084.8" y="270.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">href=</text>
  <text x="1084.8" y="300.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">https://app.example.com</text>
  <line x1="329.7" y1="262.1" x2="453.8" y2="262.1" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="391.7" y="252.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">response body</text>
  <line x1="805.5" y1="262.1" x2="929.7" y2="262.1" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="867.6" y="252.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">rewritten</text>
  <rect x="453.8" y="533.6" width="351.7" height="86.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.7" y="583.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">needs HTTP profile; disable compression</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="218.5" width="206.9" height="178.5" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4" y="301.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="143.4" y="329.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">browser</text>
  <rect x="453.8" y="40.0" width="413.8" height="580.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="660.7" y="95.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">BIG-IP virtual server</text>
  <rect x="1012.4" y="218.5" width="227.6" height="178.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.2" y="301.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Pool member</text>
  <text x="1126.2" y="329.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">web server</text>
  <rect x="484.8" y="129.2" width="165.5" height="78.1" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="567.6" y="175.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">client side</text>
  <rect x="671.0" y="129.2" width="165.5" height="78.1" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="753.8" y="175.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">server side</text>
  <rect x="484.8" y="240.8" width="165.5" height="66.9" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="567.6" y="279.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">TCP client</text>
  <rect x="671.0" y="240.8" width="165.5" height="66.9" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="753.8" y="279.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">TCP server</text>
  <rect x="484.8" y="330.0" width="165.5" height="66.9" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="567.6" y="369.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Client SSL</text>
  <rect x="671.0" y="330.0" width="165.5" height="66.9" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="753.8" y="369.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Server SSL</text>
  <rect x="484.8" y="419.2" width="165.5" height="66.9" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="567.6" y="458.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">HTTP / HTTP/2</text>
  <rect x="671.0" y="419.2" width="165.5" height="66.9" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="753.8" y="458.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">OneConnect</text>
  <rect x="484.8" y="508.5" width="165.5" height="66.9" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="567.6" y="547.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Compression</text>
  <rect x="671.0" y="508.5" width="165.5" height="66.9" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="753.8" y="547.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Stream</text>
  <line x1="246.9" y1="285.4" x2="484.8" y2="274.2" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="365.9" y="270.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">connection 1</text>
  <line x1="836.6" y1="274.2" x2="1012.4" y2="285.4" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="924.5" y="270.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">connection 2</text>
  <text x="143.4" y="463.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">tuned for clients</text>
  <text x="1126.2" y="463.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">tuned for servers</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="272.0" width="227.6" height="116.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.8" y="323.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Response</text>
  <text x="153.8" y="352.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">from server</text>
  <rect x="329.7" y="40.0" width="269.0" height="127.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.1" y="97.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Accept-Encoding?</text>
  <text x="464.1" y="126.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">client sends gzip</text>
  <rect x="329.7" y="272.0" width="269.0" height="116.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.1" y="323.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Content-Type?</text>
  <text x="464.1" y="352.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">in include list</text>
  <rect x="329.7" y="492.4" width="269.0" height="127.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="464.1" y="549.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Size?</text>
  <text x="464.1" y="578.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">above minimum</text>
  <rect x="722.8" y="492.4" width="248.3" height="127.6" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="846.9" y="549.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Compress</text>
  <text x="846.9" y="578.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">gzip / deflate</text>
  <rect x="1012.4" y="40.0" width="227.6" height="127.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.2" y="97.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Send as-is</text>
  <text x="1126.2" y="126.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">no match</text>
  <line x1="267.6" y1="330.0" x2="329.7" y2="103.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="464.1" y1="167.6" x2="464.1" y2="272.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="489.0" y="226.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <line x1="464.1" y1="388.0" x2="464.1" y2="492.4" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="489.0" y="447.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <line x1="598.6" y1="556.2" x2="722.8" y2="556.2" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="660.7" y="546.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">yes</text>
  <line x1="598.6" y1="103.8" x2="1012.4" y2="103.8" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="805.5" y="94.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">no</text>
  <line x1="598.6" y1="306.8" x2="1074.5" y2="167.6" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-warn)"/>
  <text x="836.6" y="232.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">no</text>
  <line x1="598.6" y1="527.2" x2="1177.9" y2="167.6" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-warn)"/>
  <text x="950.3" y="382.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">no</text>
  <rect x="1012.4" y="492.4" width="227.6" height="127.6" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1126.2" y="548.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">Vary header</text>
  <text x="1126.2" y="576.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">added on reply</text>
</svg>

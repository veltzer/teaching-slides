<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="185.0" width="269.0" height="265.8" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.5" y="296.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Browser</text>
  <text x="174.5" y="326.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">one TCP connection</text>
  <text x="174.5" y="355.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">many streams</text>
  <rect x="474.5" y="112.5" width="310.3" height="410.8" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.7" y="253.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">BIG-IP</text>
  <text x="629.7" y="283.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">HTTP/2 profile</text>
  <text x="629.7" y="312.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">client side</text>
  <text x="629.7" y="341.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)"></text>
  <text x="629.7" y="370.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">HTTP profile</text>
  <text x="629.7" y="399.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">server side</text>
  <rect x="950.3" y="40.0" width="289.7" height="145.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.2" y="105.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">server 1</text>
  <text x="1095.2" y="135.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">HTTP/1.1</text>
  <line x1="784.8" y1="317.9" x2="950.3" y2="112.5" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="950.3" y="257.5" width="289.7" height="145.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.2" y="323.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">server 2</text>
  <text x="1095.2" y="353.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">HTTP/1.1</text>
  <line x1="784.8" y1="317.9" x2="950.3" y2="330.0" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <rect x="950.3" y="475.0" width="289.7" height="145.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.2" y="540.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">server 3</text>
  <text x="1095.2" y="570.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">HTTP/1.1</text>
  <line x1="784.8" y1="317.9" x2="950.3" y2="547.5" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <line x1="309.0" y1="245.4" x2="474.5" y2="245.4" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="391.7" y="235.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">stream 1</text>
  <line x1="309.0" y1="317.9" x2="474.5" y2="317.9" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="391.7" y="308.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">stream 3</text>
  <line x1="309.0" y1="390.4" x2="474.5" y2="390.4" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="391.7" y="380.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">stream 5</text>
</svg>

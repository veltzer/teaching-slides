<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="241.7" width="227.6" height="176.5" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.8" y="322.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="153.8" y="354.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">GET /logo.png</text>
  <rect x="412.4" y="40.0" width="372.4" height="580.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.6" y="103.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Web acceleration</text>
  <text x="598.6" y="140.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">RAM cache</text>
  <rect x="453.8" y="216.5" width="289.7" height="113.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.6" y="265.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">hit</text>
  <text x="598.6" y="296.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">serve from cache</text>
  <rect x="453.8" y="418.3" width="289.7" height="113.5" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.6" y="467.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--warn-text)">miss</text>
  <text x="598.6" y="497.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">fetch, store, serve</text>
  <rect x="971.0" y="342.6" width="269.0" height="277.4" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5" y="459.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Server</text>
  <text x="1105.5" y="490.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">only on miss</text>
  <text x="1105.5" y="520.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">or expiry</text>
  <line x1="267.6" y1="304.8" x2="453.8" y2="273.3" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="360.7" y="278.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">request</text>
  <line x1="453.8" y1="292.2" x2="267.6" y2="367.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="360.7" y="360.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">fast reply</text>
  <line x1="743.4" y1="475.0" x2="971.0" y2="475.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="857.2" y="464.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">fetch</text>
  <rect x="971.0" y="40.0" width="269.0" height="201.7" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1105.5" y="132.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">honors Cache-Control</text>
  <text x="1105.5" y="162.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">max age, URI lists</text>
</svg>

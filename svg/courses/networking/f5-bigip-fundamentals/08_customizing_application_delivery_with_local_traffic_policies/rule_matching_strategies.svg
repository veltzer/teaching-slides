<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="474.5" y="40.0" width="310.3" height="72.5" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.7" y="70.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">HTTP request</text>
  <text x="629.7" y="96.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">GET /api/v1/users</text>
  <text x="309.0" y="174.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">first-match</text>
  <rect x="40.0" y="205.7" width="537.9" height="103.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="309.0" y="239.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">rule 1</text>
  <text x="309.0" y="264.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">if path starts /api</text>
  <text x="309.0" y="289.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">then pool api_pool</text>
  <rect x="40.0" y="340.4" width="537.9" height="103.6" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="309.0" y="373.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">rule 2</text>
  <text x="309.0" y="399.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">if path starts /img</text>
  <text x="309.0" y="424.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">then pool img_pool</text>
  <rect x="40.0" y="475.0" width="537.9" height="103.6" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="309.0" y="508.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">rule 3</text>
  <text x="309.0" y="534.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">if any request</text>
  <text x="309.0" y="559.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">then insert header</text>
  <line x1="577.9" y1="112.5" x2="309.0" y2="148.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="971.0" y="174.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">all-match</text>
  <rect x="702.1" y="205.7" width="537.9" height="103.6" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.0" y="239.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">rule 1</text>
  <text x="971.0" y="264.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">if path starts /api</text>
  <text x="971.0" y="289.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">then pool api_pool</text>
  <rect x="702.1" y="340.4" width="537.9" height="103.6" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="971.0" y="373.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">rule 2</text>
  <text x="971.0" y="399.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">if path starts /img</text>
  <text x="971.0" y="424.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">then pool img_pool</text>
  <rect x="702.1" y="475.0" width="537.9" height="103.6" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.0" y="508.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">rule 3</text>
  <text x="971.0" y="534.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">if any request</text>
  <text x="971.0" y="559.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">then insert header</text>
  <line x1="681.4" y1="112.5" x2="971.0" y2="148.8" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="309.0" y="620.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">stops after rule 1</text>
  <text x="971.0" y="620.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">runs rule 1 and rule 3</text>
</svg>

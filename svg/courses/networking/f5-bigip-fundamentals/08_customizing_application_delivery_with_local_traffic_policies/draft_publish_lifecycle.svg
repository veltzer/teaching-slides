<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="264.4" height="290.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.2" y="142.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Draft</text>
  <text x="172.2" y="177.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">Drafts/my_policy</text>
  <text x="172.2" y="212.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">editable</text>
  <text x="172.2" y="247.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">not attachable</text>
  <rect x="507.8" y="40.0" width="264.4" height="290.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0" y="142.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Published</text>
  <text x="640.0" y="177.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">/Common/my_policy</text>
  <text x="640.0" y="212.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">read only</text>
  <text x="640.0" y="247.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">attachable</text>
  <rect x="975.6" y="40.0" width="264.4" height="290.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1107.8" y="142.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Virtual server</text>
  <text x="1107.8" y="177.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">vs_web</text>
  <text x="1107.8" y="212.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">policies</text>
  <text x="1107.8" y="247.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">my_policy</text>
  <line x1="304.4" y1="141.5" x2="507.8" y2="141.5" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="406.1" y="129.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">publish</text>
  <line x1="507.8" y1="243.0" x2="304.4" y2="243.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="406.1" y="280.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">create draft</text>
  <line x1="772.2" y1="185.0" x2="975.6" y2="185.0" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <text x="873.9" y="173.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">attach</text>
  <rect x="40.0" y="460.5" width="1200.0" height="159.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="530.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">edit in a draft, publish to replace: virtual servers pick up the new version at once</text>
  <text x="640.0" y="565.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">only published policies can be attached to a virtual server</text>
</svg>

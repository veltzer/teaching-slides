<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="230.0" width="200.0" height="120.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140.0" y="284.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Clients</text>
  <text x="140.0" y="309.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">www.example.com</text>
  <rect x="340.0" y="190.0" width="300.0" height="200.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490.0" y="260.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">vs_web</text>
  <text x="490.0" y="285.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">policy</text>
  <text x="490.0" y="309.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">uri_routing</text>
  <text x="490.0" y="333.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">10.1.10.100:80</text>
  <rect x="900.0" y="40.0" width="340.0" height="160.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.0" y="114.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">api_pool</text>
  <text x="1070.0" y="139.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">10.1.20.11:8080</text>
  <line x1="640.0" y1="290.0" x2="900.0" y2="120.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770.0" y="195.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">/api/*</text>
  <rect x="900.0" y="250.0" width="340.0" height="160.0" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1070.0" y="324.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">static_pool</text>
  <text x="1070.0" y="349.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">10.1.20.12:80</text>
  <line x1="640.0" y1="290.0" x2="900.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770.0" y="300.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">/static/*</text>
  <rect x="900.0" y="460.0" width="340.0" height="160.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1070.0" y="534.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">web_pool</text>
  <text x="1070.0" y="559.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">10.1.20.13:80</text>
  <line x1="640.0" y1="290.0" x2="900.0" y2="540.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710.0" y="439.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">everything else</text>
  <line x1="240.0" y1="290.0" x2="340.0" y2="290.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
</svg>

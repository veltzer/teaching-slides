<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2196f3"/><stop offset="100%" stop-color="#1565c0"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4caf50"/><stop offset="100%" stop-color="#2e7d32"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9c27b0"/><stop offset="100%" stop-color="#6a1b9a"/></linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">F5 BIG-IP LTM Fundamentals</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Setup, load balancing, monitors, profiles, persistence, SSL, SNAT, policies, HA</text>

  <rect x="120" y="320" width="200" height="90" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="220" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Clients</text>
  <text x="220" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">HTTPS</text>

  <rect x="430" y="240" width="420" height="250" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">BIG-IP virtual server</text>
  <text x="640" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">client SSL and HTTP profiles</text>
  <text x="640" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">cookie persistence</text>
  <text x="640" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">SNAT automap</text>
  <text x="640" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">local traffic policy</text>
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">pool with health monitor</text>

  <rect x="960" y="250" width="200" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">web server 1</text>

  <rect x="960" y="335" width="200" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">web server 2</text>

  <rect x="960" y="420" width="200" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1060" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">web server 3</text>

  <line x1="320" y1="365" x2="430" y2="365" stroke="var(--surface)" stroke-width="2"/>
  <line x1="850" y1="365" x2="960" y2="280" stroke="var(--surface)" stroke-width="2"/>
  <line x1="850" y1="365" x2="960" y2="365" stroke="var(--surface)" stroke-width="2"/>
  <line x1="850" y1="365" x2="960" y2="450" stroke="var(--surface)" stroke-width="2"/>

  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-faint)">build, tune and protect the path from client to server</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">three days, hands on, two lab BIG-IP systems per student</text>
</svg>

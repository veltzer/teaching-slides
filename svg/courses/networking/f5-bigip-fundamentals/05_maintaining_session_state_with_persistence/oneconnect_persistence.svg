<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="218.5" width="206.9" height="178.5" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.4" y="288.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="143.4" y="315.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">one TCP</text>
  <text x="143.4" y="342.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">connection</text>
  <rect x="433.1" y="129.2" width="331.0" height="356.9" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="598.6" y="274.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">BIG-IP</text>
  <text x="598.6" y="302.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">HTTP profile</text>
  <text x="598.6" y="329.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">cookie persistence</text>
  <text x="598.6" y="355.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">OneConnect</text>
  <rect x="971.0" y="40.0" width="269.0" height="133.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5" y="100.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">web1</text>
  <text x="1105.5" y="128.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">user A requests</text>
  <rect x="971.0" y="463.8" width="269.0" height="133.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5" y="524.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">web2</text>
  <text x="1105.5" y="552.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">user B requests</text>
  <line x1="246.9" y1="274.2" x2="433.1" y2="274.2" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340.0" y="265.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">req: user A</text>
  <line x1="246.9" y1="341.2" x2="433.1" y2="341.2" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340.0" y="367.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">req: user B</text>
  <line x1="764.1" y1="240.8" x2="971.0" y2="106.9" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="857.2" y="164.9" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">each request</text>
  <line x1="764.1" y1="374.6" x2="971.0" y2="530.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="877.9" y="443.8" text-anchor="start" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">decided again</text>
  <text x="598.6" y="620.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">without OneConnect: only the first request is load balanced</text>
</svg>

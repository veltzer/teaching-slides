<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="540.0" height="120.0" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310.0" y="94.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">traffic-group-1</text>
  <text x="310.0" y="118.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">VS 10.1.10.100  floating 10.1.20.240</text>
  <rect x="700.0" y="40.0" width="540.0" height="120.0" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970.0" y="94.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">traffic-group-2</text>
  <text x="970.0" y="118.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">VS 10.1.10.200  floating 10.1.20.241</text>
  <rect x="40.0" y="300.0" width="540.0" height="200.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="310.0" y="382.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">bigip1</text>
  <text x="310.0" y="407.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">traffic-group-1: ACTIVE</text>
  <text x="310.0" y="431.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">traffic-group-2: standby</text>
  <rect x="700.0" y="300.0" width="540.0" height="200.0" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="970.0" y="382.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">bigip2</text>
  <text x="970.0" y="407.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">traffic-group-1: standby</text>
  <text x="970.0" y="431.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">traffic-group-2: ACTIVE</text>
  <line x1="310.0" y1="160.0" x2="310.0" y2="300.0" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow-info)"/>
  <text x="350.0" y="222.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">active</text>
  <line x1="970.0" y1="160.0" x2="970.0" y2="300.0" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow-warn)"/>
  <text x="1010.0" y="222.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">active</text>
  <line x1="500.0" y1="160.0" x2="800.0" y2="300.0" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-info)"/>
  <line x1="780.0" y1="160.0" x2="480.0" y2="300.0" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-warn)"/>
  <rect x="40.0" y="560.0" width="1200.0" height="60.0" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640.0" y="598.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text)">each device must be able to carry both groups alone when its peer fails</text>
</svg>

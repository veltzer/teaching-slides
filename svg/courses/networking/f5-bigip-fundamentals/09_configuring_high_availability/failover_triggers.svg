<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="340.0" height="113.9" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="91.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Peer heartbeat lost</text>
  <text x="210.0" y="116.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">network failover, UDP 1026</text>
  <rect x="40.0" y="195.4" width="340.0" height="113.9" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="247.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">HA group score drops</text>
  <text x="210.0" y="271.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">trunk members, pool members</text>
  <rect x="40.0" y="350.7" width="340.0" height="113.9" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="402.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">VLAN fail-safe</text>
  <text x="210.0" y="427.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">no traffic seen on VLAN</text>
  <rect x="40.0" y="506.1" width="340.0" height="113.9" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="210.0" y="557.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Daemon / system fail</text>
  <text x="210.0" y="582.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-text)">tmm, mcpd, bigd heartbeat</text>
  <rect x="520.0" y="236.8" width="300.0" height="186.4" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670.0" y="324.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Failover decision</text>
  <text x="670.0" y="349.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">per traffic group</text>
  <line x1="380.0" y1="97.0" x2="520.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380.0" y1="252.3" x2="520.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380.0" y1="407.7" x2="520.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380.0" y1="563.0" x2="520.0" y2="330.0" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="940.0" y="133.2" width="300.0" height="124.3" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1090.0" y="189.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">bigip1</text>
  <text x="1090.0" y="215.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text)">goes standby</text>
  <rect x="940.0" y="402.5" width="300.0" height="124.3" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.0" y="447.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">bigip2</text>
  <text x="1090.0" y="472.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">goes active</text>
  <text x="1090.0" y="496.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">sends gratuitous ARP</text>
  <line x1="820.0" y1="309.3" x2="940.0" y2="195.4" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820.0" y1="350.7" x2="940.0" y2="464.6" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40.0" y="40.0" width="300.0" height="165.7" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0" y="104.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Admin edits</text>
  <text x="190.0" y="130.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">on bigip1</text>
  <text x="190.0" y="155.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">pool, virtual, profile</text>
  <rect x="470.0" y="40.0" width="330.0" height="165.7" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.0" y="104.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Changes Pending</text>
  <text x="635.0" y="130.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">bigip1 is newer</text>
  <text x="635.0" y="155.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--warn-text)">commit id advances</text>
  <rect x="940.0" y="40.0" width="300.0" height="165.7" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090.0" y="104.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">In Sync</text>
  <text x="1090.0" y="130.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">all members</text>
  <text x="1090.0" y="155.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">same commit id</text>
  <line x1="340.0" y1="122.9" x2="470.0" y2="122.9" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800.0" y1="122.9" x2="940.0" y2="122.9" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="870.0" y="110.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">sync</text>
  <rect x="40.0" y="319.6" width="520.0" height="300.4" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="300.0" y="437.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Sync Device to Group</text>
  <text x="300.0" y="464.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text)">push bigip1 config</text>
  <text x="300.0" y="490.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text)">to every member</text>
  <text x="300.0" y="515.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text)">the usual choice</text>
  <rect x="720.0" y="319.6" width="520.0" height="300.4" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980.0" y="437.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--danger-text)">Sync Group to Device</text>
  <text x="980.0" y="464.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-text)">pull peer config</text>
  <text x="980.0" y="490.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-text)">overwrites local edits</text>
  <text x="980.0" y="515.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--danger-text)">use with care</text>
  <line x1="560.0" y1="205.7" x2="300.0" y2="319.6" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710.0" y1="205.7" x2="980.0" y2="319.6" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-danger)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.245046200557" font-weight="bold" fill="var(--text)">Multi-Region Failover Modes</text>

  <text x="308.965517241379" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--text-muted)">Active-Passive</text>
  <text x="971.034482758621" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.889318714684" font-weight="bold" fill="var(--text-muted)">Active-Active</text>
  <line x1="640" y1="82.181818181818" x2="640" y2="609.454545454545" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="40" y="145.454545454545" width="248.275862068966" height="126.545454545455" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="164.137931034483" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--ok-text)">Region A — primary</text>
  <text x="164.137931034483" y="208.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">100% traffic</text>
  <text x="164.137931034483" y="235.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">writes &amp; reads</text>

  <rect x="329.655172413793" y="145.454545454545" width="248.275862068966" height="126.545454545455" rx="10.444659357342" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="453.793103448276" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--warn-text)">Region B — standby</text>
  <text x="453.793103448276" y="208.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">replicating async</text>
  <text x="453.793103448276" y="235.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">read-only or idle</text>

  <path d="M 288.275862068966 208.727272727273 L 329.655172413793 208.727272727273" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="308.965517241379" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">replication</text>

  <rect x="40" y="345.818181818182" width="537.931034482759" height="63.272727272727" rx="8.355727485873" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="308.965517241379" y="382.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.666989036013" font-weight="bold" fill="var(--danger-text)">Failover: promote B, redirect DNS</text>

  <text x="308.965517241379" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" font-weight="bold" fill="var(--text)">Trade-offs</text>
  <text x="60.689655172414" y="477.636363636364" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-accent)">+ cheaper (B at low capacity)</text>
  <text x="60.689655172414" y="501.890909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-accent)">+ simple consistency</text>
  <text x="60.689655172414" y="530.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-accent)">- minutes of downtime</text>
  <text x="60.689655172414" y="554.618181818182" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-accent)">- async = data loss window</text>

  <rect x="702.068965517241" y="145.454545454545" width="248.275862068966" height="126.545454545455" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="826.206896551724" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--ok-text)">Region A</text>
  <text x="826.206896551724" y="208.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">50% traffic</text>
  <text x="826.206896551724" y="235.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">writes &amp; reads</text>

  <rect x="991.724137931035" y="145.454545454545" width="248.275862068966" height="126.545454545455" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1115.862068965517" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--ok-text)">Region B</text>
  <text x="1115.862068965517" y="208.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">50% traffic</text>
  <text x="1115.862068965517" y="235.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-text)">writes &amp; reads</text>

  <path d="M 950.344827586207 187.636363636364 L 991.724137931035 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 991.724137931035 229.818181818182 L 950.344827586207 229.818181818182" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="971.034482758621" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">bidirectional</text>

  <rect x="702.068965517241" y="345.818181818182" width="537.931034482759" height="63.272727272727" rx="8.355727485873" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="382.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.666989036013" font-weight="bold" fill="var(--danger-text)">Failover: drain failed region from LB</text>

  <text x="971.034482758621" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" font-weight="bold" fill="var(--text)">Trade-offs</text>
  <text x="722.758620689655" y="477.636363636364" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-accent)">+ near-zero downtime</text>
  <text x="722.758620689655" y="501.890909090909" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-accent)">+ load distributed normally</text>
  <text x="722.758620689655" y="530.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-accent)">- 2x infrastructure cost</text>
  <text x="722.758620689655" y="554.618181818182" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-accent)">- conflict resolution required</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">Pick by tier: tier-1 revenue gets active-active, internal tools get active-passive</text>
</svg>

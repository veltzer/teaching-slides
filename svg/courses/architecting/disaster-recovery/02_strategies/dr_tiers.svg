<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="650.909090909091" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.996147664006" font-weight="bold" fill="var(--text)">DR Strategy Tiers: Cost vs Recovery Time</text>

  <line x1="61.818181818182" y1="511.864406779661" x2="1240" y2="511.864406779661" stroke="var(--text)" stroke-width="2"/>
  <line x1="61.818181818182" y1="511.864406779661" x2="61.818181818182" y2="98.983050847458" stroke="var(--text)" stroke-width="2"/>
  <text x="650.909090909091" y="551.186440677966" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" font-weight="bold" fill="var(--text)">Recovery Time Objective (RTO)</text>
  <text x="40" y="89.152542372881" text-anchor="end" font-family="Arial, sans-serif" font-size="15.533650534289" font-weight="bold" fill="var(--text)">Cost</text>

  <text x="214.545454545455" y="531.525423728814" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--text-muted)">days</text>
  <text x="476.363636363636" y="531.525423728814" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--text-muted)">hours</text>
  <text x="738.181818181818" y="531.525423728814" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--text-muted)">minutes</text>
  <text x="1000" y="531.525423728814" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--text-muted)">seconds</text>
  <text x="1196.363636363636" y="531.525423728814" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--text-muted)">zero</text>

  <rect x="127.272727272727" y="423.389830508475" width="218.181818181818" height="78.64406779661" rx="10.355767022859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="236.363636363636" y="452.881355932203" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227236575" font-weight="bold" fill="var(--info-text)">Backup &amp; Restore</text>
  <text x="236.363636363636" y="474.508474576271" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--info-text)">snapshots offsite</text>
  <text x="236.363636363636" y="492.203389830509" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--info-text)">rebuild on event</text>

  <rect x="389.090909090909" y="344.745762711864" width="218.181818181818" height="78.64406779661" rx="10.355767022859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="498.181818181818" y="374.237288135593" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227236575" font-weight="bold" fill="var(--info-text)">Pilot Light</text>
  <text x="498.181818181818" y="395.864406779661" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--info-text)">data replicated</text>
  <text x="498.181818181818" y="413.559322033898" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--info-text)">scale up on event</text>

  <rect x="650.909090909091" y="256.271186440678" width="218.181818181818" height="78.64406779661" rx="10.355767022859" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="285.762711864407" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227236575" font-weight="bold" fill="var(--warn-text)">Warm Standby</text>
  <text x="760" y="307.389830508475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--warn-text)">small replica live</text>
  <text x="760" y="325.084745762712" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--warn-text)">promote &amp; scale</text>

  <rect x="912.727272727273" y="157.966101694915" width="218.181818181818" height="78.64406779661" rx="10.355767022859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1021.818181818182" y="187.457627118644" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227236575" font-weight="bold" fill="var(--primary-text)">Active-Active</text>
  <text x="1021.818181818182" y="209.084745762712" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--primary-text)">full capacity</text>
  <text x="1021.818181818182" y="226.779661016949" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--primary-text)">multi-region live</text>

  <path d="M 345.454545454545 452.881355932203 L 389.090909090909 393.898305084746" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 607.272727272727 384.067796610169 L 650.909090909091 315.254237288136" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 869.090909090909 295.593220338983 L 912.727272727273 207.118644067797" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-dasharray="4 4"/>

  <text x="650.909090909091" y="600.338983050847" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.533650534289" font-weight="bold" fill="var(--text)">Choose tier per service: critical revenue gets the active-active treatment</text>
  <text x="650.909090909091" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--text-muted)">Most organizations mix multiple tiers across their portfolio</text>
</svg>

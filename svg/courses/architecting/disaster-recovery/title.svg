<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Disaster Recovery</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="250" y="200" width="300" height="80" rx="10" fill="var(--primary-fill)"/>
  <text x="400" y="236" font-size="20" font-weight="bold" fill="var(--primary-text)">Primary Region</text>
  <text x="400" y="262" font-size="16" fill="var(--primary-text)">active</text>
  <rect x="730" y="200" width="300" height="80" rx="10" fill="var(--ok-fill)"/>
  <text x="880" y="236" font-size="20" font-weight="bold" fill="var(--ok-text)">Standby Region</text>
  <text x="880" y="262" font-size="16" fill="var(--ok-text)">passive</text>
  <line x1="560" y1="240" x2="708" y2="240" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="720,240 704,232 704,248" fill="var(--text-muted)"/>
  <text x="640" y="228" font-size="15" fill="var(--text-faint)">replication</text>
  <line x1="200" y1="400" x2="1068" y2="400" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="1080,400 1064,392 1064,408" fill="var(--text-muted)"/>
  <text x="1080" y="430" font-size="15" fill="var(--text-faint)">time</text>
  <line x1="400" y1="350" x2="590" y2="350" stroke="var(--warn-fill)" stroke-width="3"/>
  <line x1="400" y1="340" x2="400" y2="360" stroke="var(--warn-fill)" stroke-width="3"/>
  <line x1="590" y1="340" x2="590" y2="360" stroke="var(--warn-fill)" stroke-width="3"/>
  <rect x="455" y="333" width="80" height="34" rx="17" fill="var(--warn-fill)"/>
  <text x="495" y="356" font-size="18" font-weight="bold" fill="var(--warn-text)">RPO</text>
  <line x1="610" y1="350" x2="900" y2="350" stroke="var(--info-fill)" stroke-width="3"/>
  <line x1="610" y1="340" x2="610" y2="360" stroke="var(--info-fill)" stroke-width="3"/>
  <line x1="900" y1="340" x2="900" y2="360" stroke="var(--info-fill)" stroke-width="3"/>
  <rect x="715" y="333" width="80" height="34" rx="17" fill="var(--info-fill)"/>
  <text x="755" y="356" font-size="18" font-weight="bold" fill="var(--info-text)">RTO</text>
  <circle cx="400" cy="400" r="12" fill="var(--primary-fill)"/>
  <text x="400" y="440" font-size="16" fill="var(--text-faint)">last backup</text>
  <circle cx="600" cy="400" r="16" fill="var(--danger-fill)"/>
  <text x="600" y="440" font-size="16" fill="var(--danger-fill)">disaster</text>
  <circle cx="900" cy="400" r="12" fill="var(--ok-fill)"/>
  <text x="900" y="440" font-size="16" fill="var(--text-faint)">service restored</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">RPO &amp; RTO • DR strategies • backups &amp; restore • multi-region • drills &amp; runbooks</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="634.871794871795" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.119799174491" font-weight="bold" fill="var(--text)">DR Drill Levels: Cheap to Real</text>

  <rect x="40" y="103.272727272727" width="287.179487179487" height="232" rx="10.399928276604" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="183.589743589744" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.719870897887" font-weight="bold" fill="var(--info-text)">Walkthrough</text>
  <text x="183.589743589744" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--info-text)">read the runbook</text>
  <text x="183.589743589744" y="206.618181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--info-text)">no systems touched</text>
  <text x="183.589743589744" y="230.872727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--info-text)">find gaps fast</text>
  <text x="183.589743589744" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--info-text)">Cost: 1 hour</text>
  <text x="183.589743589744" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--info-text)">Risk: zero</text>
  <text x="183.589743589744" y="322.618181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--info-text)">Cadence: monthly</text>

  <rect x="357.948717948718" y="103.272727272727" width="287.179487179487" height="232" rx="10.399928276604" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="501.538461538461" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.719870897887" font-weight="bold" fill="var(--warn-text)">Tabletop</text>
  <text x="501.538461538461" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--warn-text)">scenario discussion</text>
  <text x="501.538461538461" y="206.618181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--warn-text)">roles played</text>
  <text x="501.538461538461" y="230.872727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--warn-text)">decisions out loud</text>
  <text x="501.538461538461" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--warn-text)">Cost: 2 hours</text>
  <text x="501.538461538461" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--warn-text)">Risk: zero</text>
  <text x="501.538461538461" y="322.618181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--warn-text)">Cadence: quarterly</text>

  <rect x="675.897435897436" y="103.272727272727" width="287.179487179487" height="232" rx="10.399928276604" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="819.487179487179" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.719870897887" font-weight="bold" fill="var(--primary-text)">Failover Drill</text>
  <text x="819.487179487179" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--primary-text)">real failover</text>
  <text x="819.487179487179" y="206.618181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--primary-text)">in lower env</text>
  <text x="819.487179487179" y="230.872727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--primary-text)">measure RTO/RPO</text>
  <text x="819.487179487179" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--primary-text)">Cost: half day</text>
  <text x="819.487179487179" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--primary-text)">Risk: low</text>
  <text x="819.487179487179" y="322.618181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--primary-text)">Cadence: quarterly</text>

  <rect x="993.846153846154" y="103.272727272727" width="246.153846153846" height="232" rx="10.399928276604" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.923076923077" y="145.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.719870897887" font-weight="bold" fill="var(--danger-text)">Full Failover</text>
  <text x="1116.923076923077" y="182.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--danger-text)">prod traffic moves</text>
  <text x="1116.923076923077" y="206.618181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--danger-text)">validate steady</text>
  <text x="1116.923076923077" y="230.872727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--danger-text)">fail back later</text>
  <text x="1116.923076923077" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--danger-text)">Cost: full day</text>
  <text x="1116.923076923077" y="298.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--danger-text)">Risk: real</text>
  <text x="1116.923076923077" y="322.618181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.519906759585" font-weight="bold" fill="var(--danger-text)">Cadence: yearly</text>

  <line x1="40" y1="419.636363636364" x2="1240" y2="419.636363636364" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="451.272727272727" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--text-muted)">cheap, frequent</text>
  <text x="1240" y="451.272727272727" text-anchor="end" font-family="Arial, sans-serif" font-size="13.519906759585" fill="var(--text-muted)">expensive, rare</text>

  <rect x="40" y="493.454545454545" width="1200" height="126.545454545455" rx="10.399928276604" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="634.871794871795" y="525.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.639885242566" font-weight="bold" fill="var(--text)">Untested DR is theoretical DR</text>
  <text x="634.871794871795" y="554.618181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.559899587246" fill="var(--text-muted)">Configurations drift, people forget, tools change</text>
  <text x="634.871794871795" y="579.927272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.559899587246" fill="var(--text-muted)">Each level catches different failure modes</text>
  <text x="634.871794871795" y="605.236363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.559899587246" fill="var(--text-muted)">Run all four — none replaces the others</text>
</svg>

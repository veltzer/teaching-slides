<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.514591494905" font-weight="bold" fill="var(--text)">RPO and RTO: The Two Targets</text>

  <line x1="40" y1="520" x2="1240" y2="520" stroke="var(--text)" stroke-width="2"/>
  <line x1="40" y1="520" x2="40" y2="100" stroke="var(--text)" stroke-width="2"/>
  <text x="640" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--text)">time after disaster →</text>

  <line x1="640" y1="520" x2="640" y2="100" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--danger-accent)">disaster moment</text>

  <rect x="351.111111111111" y="220" width="266.666666666667" height="120" rx="10.540925533895" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.444444444444" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--warn-text)">RPO</text>
  <text x="484.444444444444" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--warn-text)">Recovery Point</text>
  <text x="484.444444444444" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--warn-text)">acceptable</text>
  <text x="484.444444444444" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--warn-text)">data loss</text>

  <rect x="706.666666666667" y="220" width="266.666666666667" height="120" rx="10.540925533895" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--primary-text)">RTO</text>
  <text x="840" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--primary-text)">Recovery Time</text>
  <text x="840" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--primary-text)">acceptable</text>
  <text x="840" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--primary-text)">downtime</text>

  <path d="M 351.111111111111 390 L 640 390" fill="none" stroke="var(--warn-accent)" stroke-width="3" marker-start="url(#arrow-warn)" marker-end="url(#arrow-warn)"/>
  <text x="484.444444444444" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--warn-accent)">last backup → disaster</text>

  <path d="M 640 440 L 973.333333333333 440" fill="none" stroke="var(--primary-accent)" stroke-width="3" marker-start="url(#arrow-primary)" marker-end="url(#arrow-primary)"/>
  <text x="817.777777777778" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--primary-accent)">disaster → service back</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-muted)">Both drive cost: lower RPO needs more backups; lower RTO needs warmer standby</text>
</svg>

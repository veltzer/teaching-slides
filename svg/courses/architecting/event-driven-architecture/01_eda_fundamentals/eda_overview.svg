<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.156114329089" font-weight="bold" fill="var(--text)">Event-Driven vs Request-Driven</text>

  <text x="308.965517241379" y="103.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800386843215" font-weight="bold" fill="var(--text-muted)">Request-Driven</text>

  <rect x="40" y="145.454545454545" width="165.51724137931" height="84.363636363636" rx="41.778637429367" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.758620689655" y="195.018181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--primary-text)">A</text>

  <rect x="246.896551724138" y="145.454545454545" width="165.51724137931" height="84.363636363636" rx="41.778637429367" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="195.018181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--primary-text)">B</text>

  <rect x="453.793103448276" y="145.454545454545" width="165.51724137931" height="84.363636363636" rx="41.778637429367" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="536.551724137931" y="195.018181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--primary-text)">C</text>

  <path d="M 205.51724137931 187.636363636364 L 246.896551724138 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 412.413793103448 187.636363636364 L 453.793103448276 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="60.689655172414" y="272" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">A calls B calls C — synchronous chain</text>
  <text x="60.689655172414" y="298.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-accent)">B down → A fails</text>

  <line x1="640" y1="82.181818181818" x2="640" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="971.034482758621" y="103.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800386843215" font-weight="bold" fill="var(--text-muted)">Event-Driven</text>

  <rect x="702.068965517241" y="145.454545454545" width="165.51724137931" height="84.363636363636" rx="41.778637429367" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.827586206897" y="195.018181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--primary-text)">Producer</text>

  <rect x="908.965517241379" y="145.454545454545" width="124.137931034483" height="84.363636363636" rx="6.266795614405" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="195.018181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--warn-text)">Broker</text>

  <rect x="1074.48275862069" y="82.181818181818" width="165.51724137931" height="63.272727272727" rx="41.778637429367" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="119.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">Consumer 1</text>

  <rect x="1074.48275862069" y="166.545454545455" width="165.51724137931" height="63.272727272727" rx="41.778637429367" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="203.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">Consumer 2</text>

  <rect x="1074.48275862069" y="250.909090909091" width="165.51724137931" height="63.272727272727" rx="41.778637429367" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="287.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">Consumer 3</text>

  <path d="M 867.586206896552 187.636363636364 L 908.965517241379 187.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1033.103448275862 187.636363636364 L 1074.48275862069 113.818181818182" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1033.103448275862 187.636363636364 L 1074.48275862069 198.181818181818" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1033.103448275862 187.636363636364 L 1074.48275862069 282.545454545455" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="702.068965517241" y="366.909090909091" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">producer fires and forgets — consumers react independently</text>
  <text x="702.068965517241" y="393.272727272727" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-accent)">consumer down → broker buffers, no producer impact</text>

  <!-- bottom comparison -->
  <rect x="40" y="440.727272727273" width="579.310344827586" height="179.272727272727" rx="6.266795614405" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.655172413793" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--text)">Request: tight coupling</text>
  <text x="60.689655172414" y="504" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">- caller knows callee location</text>
  <text x="60.689655172414" y="530.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">- caller waits for callee</text>
  <text x="60.689655172414" y="556.727272727273" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">- failures cascade</text>
  <text x="60.689655172414" y="588.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--ok-accent)">+ simple, easy to reason about</text>

  <rect x="660.689655172414" y="440.727272727273" width="579.310344827586" height="179.272727272727" rx="6.266795614405" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.344827586207" y="472.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.711454971747" font-weight="bold" fill="var(--text)">Event: loose coupling</text>
  <text x="681.379310344828" y="504" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">- producer doesn't know consumers</text>
  <text x="681.379310344828" y="530.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">- async, eventual consistency</text>
  <text x="681.379310344828" y="556.727272727273" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--text-muted)">- broker absorbs downtime</text>
  <text x="681.379310344828" y="588.363636363636" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--danger-accent)">- harder to debug end-to-end</text>
</svg>

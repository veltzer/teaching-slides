<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.033512735322" font-weight="bold" fill="var(--text)">Kafka: Topics, Partitions, Consumer Groups</text>

  <!-- Producer -->
  <rect x="40" y="128.828828828829" width="165.51724137931" height="83.603603603604" rx="41.590019592803" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.758620689655" y="176.900900900901" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--primary-text)">Producer</text>

  <!-- Topic with partitions -->
  <rect x="308.965517241379" y="87.027027027027" width="517.241379310345" height="188.108108108108" rx="6.23850293892" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="567.586206896552" y="118.378378378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--warn-text)">topic: orders (3 partitions)</text>

  <!-- Partition 0 -->
  <rect x="329.655172413793" y="139.279279279279" width="475.862068965517" height="36.576576576577" rx="4.15900195928" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="345.172413793103" y="163.315315315315" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--surface)">P0:</text>
  <text x="386.551724137931" y="163.315315315315" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--surface)">[evt0][evt1][evt2][evt3][evt4]</text>

  <rect x="329.655172413793" y="186.306306306306" width="475.862068965517" height="36.576576576577" rx="4.15900195928" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="345.172413793103" y="210.342342342342" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--surface)">P1:</text>
  <text x="386.551724137931" y="210.342342342342" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--surface)">[evt0][evt1][evt2][evt3]</text>

  <rect x="329.655172413793" y="233.333333333333" width="475.862068965517" height="36.576576576577" rx="4.15900195928" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="345.172413793103" y="257.369369369369" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--surface)">P2:</text>
  <text x="386.551724137931" y="257.369369369369" font-family="Courier New, monospace" font-size="12.477005877841" fill="var(--surface)">[evt0][evt1][evt2]</text>

  <path d="M 205.51724137931 170.630630630631 L 308.965517241379 165.405405405405" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 205.51724137931 170.630630630631 L 308.965517241379 207.207207207207" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 205.51724137931 170.630630630631 L 308.965517241379 249.009009009009" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="60.689655172414" y="275.135135135135" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--text-muted)">key chooses partition</text>

  <!-- Consumer group A -->
  <rect x="908.965517241379" y="87.027027027027" width="289.655172413793" height="188.108108108108" rx="6.23850293892" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.793103448276" y="118.378378378378" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.596257347301" font-weight="bold" fill="var(--ok-text)">Group: orders-processor</text>

  <rect x="929.655172413793" y="139.279279279279" width="248.275862068966" height="36.576576576577" rx="4.15900195928" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1053.793103448276" y="162.27027027027" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--text)">consumer-1 ← P0</text>

  <rect x="929.655172413793" y="186.306306306306" width="248.275862068966" height="36.576576576577" rx="4.15900195928" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1053.793103448276" y="209.297297297297" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--text)">consumer-2 ← P1</text>

  <rect x="929.655172413793" y="233.333333333333" width="248.275862068966" height="36.576576576577" rx="4.15900195928" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1053.793103448276" y="256.324324324324" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--text)">consumer-3 ← P2</text>

  <path d="M 805.51724137931 158.09009009009 L 929.655172413793 158.09009009009" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 805.51724137931 205.117117117117 L 929.655172413793 205.117117117117" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 805.51724137931 252.144144144144 L 929.655172413793 252.144144144144" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Group B (different) -->
  <rect x="908.965517241379" y="316.936936936937" width="289.655172413793" height="125.405405405405" rx="6.23850293892" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1053.793103448276" y="348.288288288288" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.596257347301" font-weight="bold" fill="var(--info-text)">Group: analytics</text>

  <rect x="929.655172413793" y="369.189189189189" width="248.275862068966" height="52.252252252252" rx="4.15900195928" fill="var(--surface)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="1053.793103448276" y="395.315315315315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.477005877841" fill="var(--text)">consumer-1 ← P0+P1+P2</text>
  <text x="1053.793103448276" y="413.081081081081" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.437255388021" fill="var(--text-muted)">independent offsets</text>

  <path d="M 826.206896551724 264.684684684685 Q 877.931034482759 316.936936936937 929.655172413793 379.63963963964" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom explanation -->
  <rect x="40" y="473.693693693694" width="1200" height="146.306306306306" rx="6.23850293892" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="502.954954954955" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.636007837121" font-weight="bold" fill="var(--text)">Key concepts</text>
  <text x="60.689655172414" y="534.306306306306" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- partition = ordered log; ordering guaranteed within, not across</text>
  <text x="60.689655172414" y="559.387387387387" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- consumer group = cooperating consumers; each partition assigned to one</text>
  <text x="60.689655172414" y="584.468468468468" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- different groups consume independently — pub-sub at the group level</text>
  <text x="60.689655172414" y="607.459459459459" font-family="Arial, sans-serif" font-size="13.516756367661" fill="var(--text)">- partition count caps concurrency for one group</text>
</svg>

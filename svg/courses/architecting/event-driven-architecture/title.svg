<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Event-Driven Architecture</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <text x="190" y="225" font-size="16" fill="var(--text-faint)">producers</text>
  <text x="1090" y="225" font-size="16" fill="var(--text-faint)">consumers</text>
  <rect x="90" y="245" width="200" height="50" rx="8" fill="var(--primary-fill)"/>
  <text x="190" y="276" font-size="18" fill="var(--primary-text)">Orders</text>
  <rect x="90" y="375" width="200" height="50" rx="8" fill="var(--primary-fill)"/>
  <text x="190" y="406" font-size="18" fill="var(--primary-text)">Payments</text>
  <rect x="990" y="245" width="200" height="50" rx="8" fill="var(--ok-fill)"/>
  <text x="1090" y="276" font-size="18" fill="var(--ok-text)">Inventory</text>
  <rect x="990" y="375" width="200" height="50" rx="8" fill="var(--ok-fill)"/>
  <text x="1090" y="406" font-size="18" fill="var(--ok-text)">Analytics</text>
  <line x1="290" y1="270" x2="398" y2="312" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="-10,-7 10,0 -10,7" fill="var(--text-muted)" transform="translate(400,313) rotate(21)"/>
  <line x1="290" y1="400" x2="398" y2="358" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="-10,-7 10,0 -10,7" fill="var(--text-muted)" transform="translate(400,357) rotate(-21)"/>
  <line x1="880" y1="312" x2="978" y2="274" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="-10,-7 10,0 -10,7" fill="var(--text-muted)" transform="translate(980,273) rotate(-21)"/>
  <line x1="880" y1="358" x2="978" y2="396" stroke="var(--text-muted)" stroke-width="2"/>
  <polygon points="-10,-7 10,0 -10,7" fill="var(--text-muted)" transform="translate(980,397) rotate(21)"/>
  <rect x="410" y="250" width="470" height="170" rx="10" fill="none" stroke="var(--warn-fill)" stroke-width="3"/>
  <text x="645" y="282" font-size="18" font-weight="bold" fill="var(--warn-fill)">Broker</text>
  <text x="645" y="400" font-size="15" fill="var(--text-faint)">topic: orders — append-only log</text>
  <rect x="430" y="305" width="100" height="56" rx="4" fill="var(--warn-accent)"/>
  <text x="480" y="339" font-size="16" fill="var(--warn-text)">Placed</text>
  <rect x="538" y="305" width="100" height="56" rx="4" fill="var(--warn-accent)"/>
  <text x="588" y="339" font-size="16" fill="var(--warn-text)">Paid</text>
  <rect x="646" y="305" width="100" height="56" rx="4" fill="var(--warn-border)"/>
  <text x="696" y="339" font-size="16" fill="var(--warn-text)">Packed</text>
  <rect x="754" y="305" width="106" height="56" rx="4" fill="var(--warn-fill)"/>
  <text x="807" y="339" font-size="16" fill="var(--warn-text)">Shipped</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">message brokers • event sourcing &amp; CQRS • delivery semantics • sagas • schema evolution • microservices</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

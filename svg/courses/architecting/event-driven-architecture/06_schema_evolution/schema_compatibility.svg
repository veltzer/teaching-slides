<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.793210076336" font-weight="bold" fill="var(--text)">Schema Compatibility Modes</text>

  <!-- Backward -->
  <rect x="40" y="106.725663716814" width="382.758620689655" height="246.371681415929" rx="6.183048479155" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.610161597182" font-weight="bold" fill="var(--ok-text)">Backward</text>
  <text x="231.379310344828" y="173.451327433628" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">new reads old data</text>
  <text x="60.689655172414" y="207.327433628319" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--ok-text)">v1: {id, name}</text>
  <text x="60.689655172414" y="229.911504424779" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--ok-text)">v2: {id, name, email?}</text>
  <text x="60.689655172414" y="265.840707964602" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--ok-text)">- add optional ✓</text>
  <text x="60.689655172414" y="288.424778761062" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--ok-text)">- remove required ✗</text>
  <text x="60.689655172414" y="327.433628318584" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--ok-text)">producer upgrades first</text>

  <!-- Forward -->
  <rect x="448.620689655172" y="106.725663716814" width="382.758620689655" height="246.371681415929" rx="6.183048479155" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.610161597182" font-weight="bold" fill="var(--warn-text)">Forward</text>
  <text x="640" y="173.451327433628" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">old reads new data</text>
  <text x="469.310344827586" y="207.327433628319" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--warn-text)">v1: {id, name}</text>
  <text x="469.310344827586" y="229.911504424779" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--warn-text)">v2: {id, name, email?}</text>
  <text x="469.310344827586" y="265.840707964602" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--warn-text)">- add field ✓</text>
  <text x="469.310344827586" y="288.424778761062" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--warn-text)">- remove field ✗</text>
  <text x="469.310344827586" y="327.433628318584" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--warn-text)">consumer upgrades first</text>

  <!-- Full -->
  <rect x="857.241379310345" y="106.725663716814" width="382.758620689655" height="246.371681415929" rx="6.183048479155" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="142.654867256637" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.610161597182" font-weight="bold" fill="var(--primary-text)">Full</text>
  <text x="1048.620689655173" y="173.451327433628" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--primary-text)">old↔new both directions</text>
  <text x="877.931034482759" y="207.327433628319" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--primary-text)">no removed fields</text>
  <text x="877.931034482759" y="229.911504424779" font-family="Courier New, monospace" font-size="12.366096958309" fill="var(--primary-text)">no renamed fields</text>
  <text x="877.931034482759" y="265.840707964602" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--primary-text)">- optional + defaults</text>
  <text x="877.931034482759" y="288.424778761062" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--primary-text)">- strictest</text>
  <text x="877.931034482759" y="327.433628318584" font-family="Arial, sans-serif" font-size="12.366096958309" font-style="italic" fill="var(--primary-text)">public events</text>

  <!-- Bottom: rename strategy -->
  <text x="640" y="404.424778761062" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--text-muted)">Rename: deprecate, add</text>

  <rect x="40" y="435.221238938053" width="1200" height="184.778761061947" rx="6.183048479155" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60.689655172414" y="471.150442477876" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--text)">Step 1:</text>
  <text x="143.448275862069" y="471.150442477876" font-family="Courier New, monospace" font-size="13.396605038168" fill="var(--text)">v1: { id, name }</text>

  <text x="60.689655172414" y="507.079646017699" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--text)">Step 2:</text>
  <text x="143.448275862069" y="507.079646017699" font-family="Courier New, monospace" font-size="13.396605038168" fill="var(--text)">v2: { id, name, full_name }   // both</text>

  <text x="60.689655172414" y="543.008849557522" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--text)">Step 3:</text>
  <text x="143.448275862069" y="543.008849557522" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--text)">consumers migrate to full_name</text>

  <text x="60.689655172414" y="578.938053097345" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--text)">Step 4:</text>
  <text x="143.448275862069" y="578.938053097345" font-family="Courier New, monospace" font-size="13.396605038168" fill="var(--text)">v3: { id, full_name }   // drop old</text>

  <text x="60.689655172414" y="609.734513274336" font-family="Arial, sans-serif" font-size="13.396605038168" font-style="italic" fill="var(--danger-accent)">deprecation: months</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- LEFT: Choreography -->
  <text x="308.965517241379" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.772163458298" font-weight="bold" fill="var(--text)">Choreography</text>
  <text x="308.965517241379" y="65.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">each service reacts</text>

  <rect x="40" y="122.857142857143" width="186.206896551724" height="72.5" rx="10.350983390135" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="164.285714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.526475085203" font-weight="bold" fill="var(--primary-text)">Sales</text>
  <text x="133.103448275862" y="182.928571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386081729149" fill="var(--primary-text)">OrderPlaced</text>

  <rect x="40" y="236.785714285714" width="186.206896551724" height="72.5" rx="10.350983390135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="278.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.526475085203" font-weight="bold" fill="var(--ok-text)">Inventory</text>
  <text x="133.103448275862" y="296.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386081729149" fill="var(--ok-text)">reacts</text>

  <rect x="40" y="350.714285714286" width="186.206896551724" height="72.5" rx="10.350983390135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="392.142857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.526475085203" font-weight="bold" fill="var(--ok-text)">Payment</text>
  <text x="133.103448275862" y="410.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386081729149" fill="var(--ok-text)">reacts</text>

  <rect x="40" y="464.642857142857" width="186.206896551724" height="72.5" rx="10.350983390135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="506.071428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.526475085203" font-weight="bold" fill="var(--ok-text)">Shipping</text>
  <text x="133.103448275862" y="524.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.386081729149" fill="var(--ok-text)">reacts</text>

  <!-- Event bus -->
  <rect x="371.034482758621" y="236.785714285714" width="124.137931034483" height="186.428571428571" rx="10.350983390135" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="433.103448275862" y="335.178571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.526475085203" fill="var(--text)">events</text>

  <path d="M 226.206896551724 159.107142857143 L 371.034482758621 262.678571428571" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 371.034482758621 288.571428571429 L 226.206896551724 273.035714285714" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 371.034482758621 350.714285714286 L 226.206896551724 386.964285714286" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 371.034482758621 402.5 L 226.206896551724 500.892857142857" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vertical divider -->
  <line x1="640" y1="81.428571428571" x2="640" y2="578.571428571429" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- RIGHT: Orchestration -->
  <text x="971.034482758621" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.772163458298" font-weight="bold" fill="var(--text)">Orchestration</text>
  <text x="971.034482758621" y="65.892857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">a process manager directs</text>

  <rect x="867.586206896552" y="257.5" width="206.896551724138" height="82.857142857143" rx="10.350983390135" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.59667176323" font-weight="bold" fill="var(--warn-text)">Order Saga</text>
  <text x="971.034482758621" y="319.642857142857" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.421180068162" fill="var(--warn-text)">explicit workflow</text>

  <rect x="702.068965517241" y="122.857142857143" width="165.51724137931" height="62.142857142857" rx="10.350983390135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.827586206897" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--ok-text)">Inventory</text>

  <rect x="1074.48275862069" y="122.857142857143" width="165.51724137931" height="62.142857142857" rx="10.350983390135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--ok-text)">Payment</text>

  <rect x="702.068965517241" y="423.214285714286" width="165.51724137931" height="62.142857142857" rx="10.350983390135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.827586206897" y="459.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--ok-text)">Shipping</text>

  <rect x="1074.48275862069" y="423.214285714286" width="165.51724137931" height="62.142857142857" rx="10.350983390135" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="459.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" font-weight="bold" fill="var(--ok-text)">Email</text>

  <path d="M 888.275862068966 257.5 L 805.51724137931 185" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1053.793103448276 257.5 L 1136.551724137931 185" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 888.275862068966 340.357142857143 L 805.51724137931 423.214285714286" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1053.793103448276 340.357142857143 L 1136.551724137931 423.214285714286" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <text x="308.965517241379" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">Workflow is implicit; debug by tracing events</text>
  <text x="971.034482758621" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--text-muted)">Workflow is explicit; saga state is visible</text>
</svg>

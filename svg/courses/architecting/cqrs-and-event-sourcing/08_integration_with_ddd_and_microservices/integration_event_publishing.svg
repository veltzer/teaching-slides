<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.560726067143" font-weight="bold" fill="var(--text)">Integration Event Publishing Pipeline</text>

  <!-- Internal stream -->
  <rect x="40" y="129.230769230769" width="244.067796610169" height="111.538461538462" rx="14.910423539167" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="162.033898305085" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.300605055953" font-weight="bold" fill="var(--info-text)">Internal Stream</text>
  <text x="162.033898305085" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--info-text)">domain events</text>
  <text x="162.033898305085" y="224.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--info-text)">(many, fine-grained)</text>

  <!-- Publisher subscriber -->
  <rect x="365.423728813559" y="129.230769230769" width="244.067796610169" height="111.538461538462" rx="14.910423539167" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.457627118644" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.300605055953" font-weight="bold" fill="var(--primary-text)">Publisher</text>
  <text x="487.457627118644" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--primary-text)">decides what to publish</text>
  <text x="487.457627118644" y="224.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--primary-text)">maps domain → integration</text>

  <!-- Broker -->
  <rect x="690.847457627119" y="129.230769230769" width="244.067796610169" height="111.538461538462" rx="14.910423539167" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812.881355932203" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.300605055953" font-weight="bold" fill="var(--warn-text)">Broker</text>
  <text x="812.881355932203" y="201.730769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--warn-text)">Kafka / EventBridge</text>
  <text x="812.881355932203" y="224.038461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--warn-text)">/ NATS</text>

  <!-- Consumers -->
  <rect x="1016.271186440678" y="62.307692307692" width="203.389830508475" height="66.923076923077" rx="14.910423539167" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117.966101694915" y="101.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.040484044762" fill="var(--ok-text)">Billing</text>

  <rect x="1016.271186440678" y="151.538461538462" width="203.389830508475" height="66.923076923077" rx="14.910423539167" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117.966101694915" y="190.576923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.040484044762" fill="var(--ok-text)">Shipping</text>

  <rect x="1016.271186440678" y="240.769230769231" width="203.389830508475" height="66.923076923077" rx="14.910423539167" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117.966101694915" y="279.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.040484044762" fill="var(--ok-text)">Inventory</text>

  <!-- Arrows -->
  <path d="M 284.067796610169 185 L 365.423728813559 185" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 609.491525423729 185 L 690.847457627119 185" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 934.915254237288 173.846153846154 L 1016.271186440678 95.769230769231" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 934.915254237288 185 L 1016.271186440678 185" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 934.915254237288 196.153846153846 L 1016.271186440678 274.230769230769" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <rect x="40" y="374.615384615385" width="1200" height="245.384615384615" rx="14.910423539167" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="629.830508474576" y="419.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.300605055953" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="80.677966101695" y="463.846153846154" font-family="Arial, sans-serif" font-size="17.040484044762" fill="var(--text-muted)">Publisher is its own subscriber on the internal log; runs idempotently</text>
  <text x="80.677966101695" y="497.307692307692" font-family="Arial, sans-serif" font-size="17.040484044762" fill="var(--text-muted)">Not every domain event becomes an integration event</text>
  <text x="80.677966101695" y="530.769230769231" font-family="Arial, sans-serif" font-size="17.040484044762" fill="var(--text-muted)">Coarser, public schemas registered separately</text>
  <text x="80.677966101695" y="564.230769230769" font-family="Arial, sans-serif" font-size="17.040484044762" fill="var(--text-muted)">Failure to publish is recoverable: replay from the internal log</text>
  <text x="629.830508474576" y="603.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.910423539167" font-style="italic" fill="var(--text-faint)">Related to the Outbox pattern: durable in own store first, then publish</text>
</svg>

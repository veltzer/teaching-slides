<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.143167905923" font-weight="bold" fill="var(--text)">Given - When - Then</text>

  <!-- Given -->
  <rect x="40" y="135.670103092784" width="351.724137931035" height="382.680412371134" rx="15.571583952961" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="215.862068965517" y="183.505154639175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.469631926082" font-weight="bold" fill="var(--info-text)">Given</text>
  <text x="215.862068965517" y="213.40206185567" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.571583952961" fill="var(--info-text)">past events</text>

  <rect x="81.379310344828" y="255.257731958763" width="268.965517241379" height="47.835051546392" rx="6.673535979841" fill="var(--code-bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="215.862068965517" y="287.546391752577" text-anchor="middle" font-family="Courier New, monospace" font-size="14.459327956321" fill="var(--info-text)">OrderCreated</text>

  <rect x="81.379310344828" y="315.051546391753" width="268.965517241379" height="47.835051546392" rx="6.673535979841" fill="var(--code-bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="215.862068965517" y="347.340206185567" text-anchor="middle" font-family="Courier New, monospace" font-size="14.459327956321" fill="var(--info-text)">LineItemAdded</text>

  <rect x="81.379310344828" y="374.845360824742" width="268.965517241379" height="47.835051546392" rx="6.673535979841" fill="var(--code-bg)" stroke="var(--info-border)" stroke-width="1"/>
  <text x="215.862068965517" y="407.134020618557" text-anchor="middle" font-family="Courier New, monospace" font-size="14.459327956321" fill="var(--info-text)">DiscountApplied</text>

  <text x="215.862068965517" y="482.474226804124" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.571583952961" font-style="italic" fill="var(--info-text)">history rebuilds aggregate</text>

  <!-- When -->
  <rect x="464.137931034483" y="135.670103092784" width="351.724137931035" height="382.680412371134" rx="15.571583952961" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="183.505154639175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.469631926082" font-weight="bold" fill="var(--primary-text)">When</text>
  <text x="640" y="213.40206185567" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.571583952961" fill="var(--primary-text)">a command is dispatched</text>

  <rect x="505.51724137931" y="279.175257731959" width="268.965517241379" height="95.670103092784" rx="6.673535979841" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="640" y="321.030927835052" text-anchor="middle" font-family="Courier New, monospace" font-size="15.571583952961" fill="var(--primary-text)">PlaceOrder(</text>
  <text x="640" y="344.948453608247" text-anchor="middle" font-family="Courier New, monospace" font-size="15.571583952961" fill="var(--primary-text)">  order_id="42"</text>
  <text x="640" y="368.865979381443" text-anchor="middle" font-family="Courier New, monospace" font-size="15.571583952961" fill="var(--primary-text)">)</text>

  <text x="640" y="446.59793814433" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.571583952961" font-style="italic" fill="var(--primary-text)">decide() runs against history</text>

  <!-- Then -->
  <rect x="888.275862068966" y="135.670103092784" width="351.724137931035" height="382.680412371134" rx="15.571583952961" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1064.137931034483" y="183.505154639175" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.469631926082" font-weight="bold" fill="var(--ok-text)">Then</text>
  <text x="1064.137931034483" y="213.40206185567" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.571583952961" fill="var(--ok-text)">expected outcome</text>

  <rect x="929.655172413793" y="255.257731958763" width="268.965517241379" height="47.835051546392" rx="6.673535979841" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1064.137931034483" y="287.546391752577" text-anchor="middle" font-family="Courier New, monospace" font-size="14.459327956321" fill="var(--ok-text)">OrderPlaced</text>

  <text x="1064.137931034483" y="350.927835051546" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.571583952961" fill="var(--ok-text)">— or —</text>

  <rect x="929.655172413793" y="374.845360824742" width="268.965517241379" height="47.835051546392" rx="6.673535979841" fill="var(--code-bg)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="1064.137931034483" y="407.134020618557" text-anchor="middle" font-family="Courier New, monospace" font-size="14.459327956321" fill="var(--ok-text)">OrderAlreadyPlaced</text>

  <text x="1064.137931034483" y="482.474226804124" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.571583952961" font-style="italic" fill="var(--ok-text)">events emitted, or exception</text>

  <!-- Arrows -->
  <path d="M 391.724137931034 327.010309278351 L 464.137931034483 327.010309278351" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 815.862068965517 327.010309278351 L 888.275862068966 327.010309278351" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <text x="640" y="590.103092783505" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.796095946242" fill="var(--text-muted)">A pure function: (history, command) → events_or_exception</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.571583952961" font-style="italic" fill="var(--text-faint)">No I/O, no clocks, no globals — fast and deterministic</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="650.526315789474" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.171225388512" font-weight="bold" fill="var(--text)">Replay Scenario Tests</text>

  <!-- Three scenarios: each row is a scenario -->
  <text x="145.263157894737" y="147.628865979381" font-family="Arial, sans-serif" font-size="17.951523316008" font-weight="bold" fill="var(--text)">Scenario 1: place + ship</text>

  <rect x="40" y="171.546391752577" width="168.421052631579" height="59.79381443299" rx="8.975761658004" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124.210526315789" y="207.422680412371" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.585612694256" fill="var(--info-text)">OrderPlaced</text>

  <rect x="229.473684210526" y="171.546391752577" width="168.421052631579" height="59.79381443299" rx="8.975761658004" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313.684210526316" y="207.422680412371" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.585612694256" fill="var(--info-text)">ItemShipped</text>

  <rect x="503.157894736842" y="171.546391752577" width="252.631578947368" height="59.79381443299" rx="8.975761658004" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.473684210526" y="207.422680412371" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.707582901507" fill="var(--primary-text)">Projection</text>

  <rect x="840" y="171.546391752577" width="400" height="59.79381443299" rx="8.975761658004" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="207.422680412371" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.585612694256" fill="var(--ok-text)">status="shipped", total=N</text>

  <path d="M 397.894736842105 201.443298969072 L 503.157894736842 201.443298969072" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 755.789473684211 201.443298969072 L 840 201.443298969072" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Scenario 2: cancel after place -->
  <text x="145.263157894737" y="291.134020618557" font-family="Arial, sans-serif" font-size="17.951523316008" font-weight="bold" fill="var(--text)">Scenario 2: cancel</text>

  <rect x="40" y="315.051546391753" width="168.421052631579" height="59.79381443299" rx="8.975761658004" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124.210526315789" y="350.927835051546" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.585612694256" fill="var(--info-text)">OrderPlaced</text>

  <rect x="229.473684210526" y="315.051546391753" width="168.421052631579" height="59.79381443299" rx="8.975761658004" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313.684210526316" y="350.927835051546" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.585612694256" fill="var(--info-text)">OrderCancelled</text>

  <rect x="503.157894736842" y="315.051546391753" width="252.631578947368" height="59.79381443299" rx="8.975761658004" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.473684210526" y="350.927835051546" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.707582901507" fill="var(--primary-text)">Projection</text>

  <rect x="840" y="315.051546391753" width="400" height="59.79381443299" rx="8.975761658004" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="350.927835051546" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.585612694256" fill="var(--ok-text)">status="cancelled"</text>

  <path d="M 397.894736842105 344.948453608247 L 503.157894736842 344.948453608247" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 755.789473684211 344.948453608247 L 840 344.948453608247" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Scenario 3: idempotent retry -->
  <text x="145.263157894737" y="434.639175257732" font-family="Arial, sans-serif" font-size="17.951523316008" font-weight="bold" fill="var(--text)">Scenario 3: duplicate event</text>

  <rect x="40" y="458.556701030928" width="168.421052631579" height="59.79381443299" rx="8.975761658004" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124.210526315789" y="494.432989690722" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.585612694256" fill="var(--info-text)">OrderPlaced</text>

  <rect x="229.473684210526" y="458.556701030928" width="168.421052631579" height="59.79381443299" rx="8.975761658004" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)" opacity="0.7"/>
  <text x="313.684210526316" y="488.453608247423" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.463642487006" fill="var(--info-text)">OrderPlaced</text>
  <text x="313.684210526316" y="508.783505154639" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.341672279755" font-style="italic" fill="var(--info-text)">(redelivered)</text>

  <rect x="503.157894736842" y="458.556701030928" width="252.631578947368" height="59.79381443299" rx="8.975761658004" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.473684210526" y="494.432989690722" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.707582901507" fill="var(--primary-text)">Projection</text>

  <rect x="840" y="458.556701030928" width="400" height="59.79381443299" rx="8.975761658004" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="494.432989690722" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.585612694256" fill="var(--ok-text)">single row, status="placed"</text>

  <path d="M 397.894736842105 488.453608247423 L 503.157894736842 488.453608247423" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 755.789473684211 488.453608247423 L 840 488.453608247423" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <text x="650.526315789474" y="590.103092783505" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.951523316008" fill="var(--text-muted)">Each scenario is a list of events and an expected read model state</text>
  <text x="650.526315789474" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.707582901507" font-style="italic" fill="var(--text-faint)">In-memory DB keeps these tests fast — milliseconds, not seconds</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.928480087538" font-weight="bold" fill="var(--text)">Consumer-Driven Contracts</text>

  <!-- Consumer -->
  <rect x="40" y="129.230769230769" width="289.655172413793" height="133.846153846154" rx="15.038412354828" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.631790843301" font-weight="bold" fill="var(--ok-text)">Consumer</text>
  <text x="184.827586206897" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--ok-text)">e.g. Billing service</text>
  <text x="184.827586206897" y="235.192307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--ok-text)">declares expectations</text>

  <!-- Pact file -->
  <rect x="495.172413793103" y="129.230769230769" width="289.655172413793" height="133.846153846154" rx="15.038412354828" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.631790843301" font-weight="bold" fill="var(--warn-text)">Pact File</text>
  <text x="640" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--warn-text)">"OrderPlaced must have</text>
  <text x="640" y="231.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--warn-text)">order_id and customer_id"</text>

  <!-- Producer -->
  <rect x="950.344827586207" y="129.230769230769" width="289.655172413793" height="133.846153846154" rx="15.038412354828" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172413793103" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.631790843301" font-weight="bold" fill="var(--primary-text)">Producer</text>
  <text x="1095.172413793103" y="207.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--primary-text)">e.g. Sales service</text>
  <text x="1095.172413793103" y="235.192307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--primary-text)">verifies all pacts on CI</text>

  <!-- Arrows -->
  <path d="M 329.655172413793 196.153846153846 L 495.172413793103 196.153846153846" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="412.413793103448" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" font-style="italic" fill="var(--text-muted)">writes</text>

  <path d="M 784.827586206897 196.153846153846 L 950.344827586207 196.153846153846" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="867.586206896552" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.964240043769" font-style="italic" fill="var(--text-muted)">verifies</text>

  <!-- Bottom: result -->
  <rect x="40" y="374.615384615385" width="1200" height="245.384615384615" rx="15.038412354828" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="419.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.483446221183" font-weight="bold" fill="var(--text)">What this gives you</text>
  <text x="81.379310344828" y="463.846153846154" font-family="Arial, sans-serif" font-size="17.186756976946" fill="var(--text-muted)">Producer's CI fails when an integration event change breaks any consumer</text>
  <text x="81.379310344828" y="497.307692307692" font-family="Arial, sans-serif" font-size="17.186756976946" fill="var(--text-muted)">Adding fields is always safe; removing or renaming requires consumer agreement</text>
  <text x="81.379310344828" y="530.769230769231" font-family="Arial, sans-serif" font-size="17.186756976946" fill="var(--text-muted)">Each consumer documents what it actually depends on (not the full schema)</text>
  <text x="81.379310344828" y="564.230769230769" font-family="Arial, sans-serif" font-size="17.186756976946" fill="var(--text-muted)">Tools: Pact, Spring Cloud Contract, Schema Registry contracts</text>
  <text x="640" y="603.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.038412354828" font-style="italic" fill="var(--text-faint)">Catches breaking changes at build time, not in production</text>
</svg>

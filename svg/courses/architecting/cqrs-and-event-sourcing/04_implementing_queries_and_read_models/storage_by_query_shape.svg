<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.198779106895" font-weight="bold" fill="var(--text)">Pick Storage By What the Query Looks Like</text>

  <!-- Relational -->
  <rect x="40" y="94.716981132075" width="280" height="240.754716981132" rx="14.645496442174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014351551988" font-weight="bold" fill="var(--primary-text)">Relational</text>
  <text x="180" y="176.792452830189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">When you need:</text>
  <text x="180" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">joins, sorts, ranges</text>
  <text x="180" y="231.509433962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">strong transactions</text>
  <text x="180" y="258.867924528302" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--primary-text)">mature operations</text>
  <text x="180" y="302.641509433962" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-style="italic" fill="var(--primary-text)">Postgres, MySQL</text>

  <!-- Document -->
  <rect x="340" y="94.716981132075" width="280" height="240.754716981132" rx="14.645496442174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014351551988" font-weight="bold" fill="var(--ok-text)">Document</text>
  <text x="480" y="176.792452830189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">When you need:</text>
  <text x="480" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">one query = one doc</text>
  <text x="480" y="231.509433962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">flexible per-record shape</text>
  <text x="480" y="258.867924528302" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--ok-text)">key-based access</text>
  <text x="480" y="302.641509433962" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-style="italic" fill="var(--ok-text)">DynamoDB, MongoDB</text>

  <!-- Search -->
  <rect x="640" y="94.716981132075" width="280" height="240.754716981132" rx="14.645496442174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014351551988" font-weight="bold" fill="var(--info-text)">Search</text>
  <text x="780" y="176.792452830189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">When you need:</text>
  <text x="780" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">full-text, fuzzy match</text>
  <text x="780" y="231.509433962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">faceted filters</text>
  <text x="780" y="258.867924528302" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--info-text)">ranked results</text>
  <text x="780" y="302.641509433962" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-style="italic" fill="var(--info-text)">Elasticsearch, OpenSearch</text>

  <!-- Cache -->
  <rect x="940" y="94.716981132075" width="280" height="240.754716981132" rx="14.645496442174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="138.490566037736" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.014351551988" font-weight="bold" fill="var(--warn-text)">Cache</text>
  <text x="1080" y="176.792452830189" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">When you need:</text>
  <text x="1080" y="204.150943396226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">very hot, simple reads</text>
  <text x="1080" y="231.509433962264" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">latency in microseconds</text>
  <text x="1080" y="258.867924528302" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" fill="var(--warn-text)">tolerate short staleness</text>
  <text x="1080" y="302.641509433962" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.645496442174" font-style="italic" fill="var(--warn-text)">Redis, Memcached</text>

  <!-- Caption box -->
  <rect x="40" y="401.132075471698" width="1200" height="218.867924528302" rx="14.645496442174" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">Mix and match by query</text>
  <text x="640" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Postgres + Redis cache</text>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">DynamoDB + Elasticsearch</text>
  <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="var(--text-faint)">each read model is replaceable</text>
</svg>

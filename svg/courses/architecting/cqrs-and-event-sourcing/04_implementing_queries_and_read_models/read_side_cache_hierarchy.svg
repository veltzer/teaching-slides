<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.459060435492" font-weight="bold" fill="var(--text)">Read Side: Cache → Read Model → Replay</text>

  <!-- Query -->
  <rect x="40" y="129.230769230769" width="200" height="89.230769230769" rx="14.785647926803" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--primary-text)">Query</text>
  <text x="140" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--primary-text)">GetOrderSummary</text>

  <!-- Cache -->
  <rect x="320" y="129.230769230769" width="220" height="89.230769230769" rx="14.785647926803" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--warn-text)">Cache</text>
  <text x="430" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--warn-text)">Redis, microseconds</text>

  <!-- Read model -->
  <rect x="620" y="129.230769230769" width="220" height="89.230769230769" rx="14.785647926803" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--ok-text)">Read Model</text>
  <text x="730" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--ok-text)">Postgres, milliseconds</text>

  <!-- Event store -->
  <rect x="920" y="129.230769230769" width="280" height="89.230769230769" rx="14.785647926803" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--info-text)">Event Store (replay)</text>
  <text x="1060" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" fill="var(--info-text)">slow, always fresh</text>

  <!-- Arrows -->
  <path d="M 240 173.846153846154 L 320 173.846153846154" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 540 173.846153846154 L 620 173.846153846154" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 840 173.846153846154 L 920 173.846153846154" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Labels above arrows -->
  <text x="280" y="151.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" font-style="italic" fill="var(--text-muted)">try cache</text>
  <text x="580" y="151.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" font-style="italic" fill="var(--text-muted)">on miss</text>
  <text x="880" y="151.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.729530217746" font-style="italic" fill="var(--text-muted)">if no read model</text>

  <!-- Update path -->
  <text x="640" y="318.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--text)">How updates flow back</text>

  <rect x="920" y="363.461538461538" width="280" height="89.230769230769" rx="14.785647926803" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--info-text)">New event appended</text>

  <rect x="620" y="363.461538461538" width="220" height="89.230769230769" rx="14.785647926803" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--ok-text)">Projection updates</text>

  <rect x="320" y="363.461538461538" width="220" height="89.230769230769" rx="14.785647926803" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="402.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.122354181148" font-weight="bold" fill="var(--warn-text)">Cache invalidated</text>

  <path d="M 920 408.076923076923 L 840 408.076923076923" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 620 408.076923076923 L 540 408.076923076923" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <rect x="40" y="508.461538461539" width="1200" height="111.538461538462" rx="14.785647926803" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="550.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--text)">Each layer trades freshness for speed. Most reads stop at the cache.</text>
  <text x="640" y="580.961538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--text)">Replay is for emergencies and for rebuilding the read model from scratch.</text>
  <text x="640" y="606.615384615385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.785647926803" font-style="italic" fill="var(--text-faint)">Invalidation can be event-driven, TTL, or version-keyed</text>
</svg>

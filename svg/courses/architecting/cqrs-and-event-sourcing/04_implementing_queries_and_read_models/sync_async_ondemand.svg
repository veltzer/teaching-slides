<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Inline -->
  <text x="220" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.550679233678" font-weight="bold" fill="var(--text)">Inline</text>
  <rect x="40" y="80.46511627907" width="360" height="161.860465116279" rx="16.259523148704" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="134.418604651163" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582312169948" fill="var(--primary-text)">append events</text>
  <text x="220" y="168.139534883721" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582312169948" fill="var(--primary-text)">+ update read model</text>
  <text x="220" y="201.860465116279" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582312169948" font-weight="bold" fill="var(--primary-text)">in one transaction</text>

  <text x="220" y="296.279069767442" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.420917659326" font-weight="bold" fill="var(--ok-accent)">Pros</text>
  <text x="220" y="327.302325581395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">strong consistency</text>
  <text x="220" y="354.279069767442" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">simple to reason about</text>
  <text x="220" y="381.255813953488" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">no projection lag</text>

  <text x="220" y="437.906976744186" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.420917659326" font-weight="bold" fill="var(--danger-accent)">Cons</text>
  <text x="220" y="468.93023255814" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">limits storage choice</text>
  <text x="220" y="495.906976744186" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">slows the write path</text>

  <text x="220" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" font-style="italic" fill="var(--text-faint)">Use when consistency is strict</text>

  <!-- Asynchronous -->
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.550679233678" font-weight="bold" fill="var(--text)">Asynchronous</text>
  <rect x="460" y="80.46511627907" width="360" height="161.860465116279" rx="16.259523148704" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="134.418604651163" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582312169948" fill="var(--ok-text)">append events</text>
  <text x="640" y="168.139534883721" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582312169948" fill="var(--ok-text)">subscriber tails the log</text>
  <text x="640" y="201.860465116279" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582312169948" font-weight="bold" fill="var(--ok-text)">projection lags slightly</text>

  <text x="640" y="296.279069767442" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.420917659326" font-weight="bold" fill="var(--ok-accent)">Pros</text>
  <text x="640" y="327.302325581395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">independent scaling</text>
  <text x="640" y="354.279069767442" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">read store choice is free</text>
  <text x="640" y="381.255813953488" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">rebuilds and new models cheap</text>

  <text x="640" y="437.906976744186" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.420917659326" font-weight="bold" fill="var(--danger-accent)">Cons</text>
  <text x="640" y="468.93023255814" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">eventual consistency</text>
  <text x="640" y="495.906976744186" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">checkpoint &amp; idempotency</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" font-style="italic" fill="var(--text-faint)">Default for most systems</text>

  <!-- On-demand -->
  <text x="1060" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.550679233678" font-weight="bold" fill="var(--text)">On-Demand</text>
  <rect x="880" y="80.46511627907" width="360" height="161.860465116279" rx="16.259523148704" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1060" y="134.418604651163" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582312169948" fill="var(--warn-text)">no read store</text>
  <text x="1060" y="168.139534883721" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582312169948" fill="var(--warn-text)">replay at query time</text>
  <text x="1060" y="201.860465116279" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.582312169948" font-weight="bold" fill="var(--warn-text)">always fresh</text>

  <text x="1060" y="296.279069767442" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.420917659326" font-weight="bold" fill="var(--ok-accent)">Pros</text>
  <text x="1060" y="327.302325581395" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">simplest to start</text>
  <text x="1060" y="354.279069767442" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">no projection to maintain</text>
  <text x="1060" y="381.255813953488" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">always reflects latest events</text>

  <text x="1060" y="437.906976744186" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.420917659326" font-weight="bold" fill="var(--danger-accent)">Cons</text>
  <text x="1060" y="468.93023255814" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">slow for large streams</text>
  <text x="1060" y="495.906976744186" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" fill="var(--text-muted)">no joins or full-text</text>

  <text x="1060" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.098128638083" font-style="italic" fill="var(--text-faint)">Single-aggregate detail views</text>
</svg>

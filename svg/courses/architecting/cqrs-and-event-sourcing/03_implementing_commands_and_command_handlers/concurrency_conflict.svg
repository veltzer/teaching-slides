<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.627639077094" font-weight="bold" fill="var(--text)">Two Clients, One Aggregate</text>

  <!-- Client A -->
  <text x="147.142857142857" y="98.532110091743" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.356365897578" font-weight="bold" fill="var(--text)">Client A</text>
  <rect x="40" y="119.816513761468" width="214.285714285714" height="63.853211009174" rx="10.678182948789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857142857" y="160.256880733945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--primary-text)">load: version=4</text>

  <rect x="40" y="204.954128440367" width="214.285714285714" height="63.853211009174" rx="10.678182948789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857142857" y="245.394495412844" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--primary-text)">decide → events</text>

  <rect x="40" y="290.091743119266" width="214.285714285714" height="63.853211009174" rx="10.678182948789" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857142857" y="330.532110091743" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--ok-text)">append (expected=4) ✓</text>

  <!-- Aggregate state -->
  <text x="640" y="98.532110091743" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.356365897578" font-weight="bold" fill="var(--text)">order-42 stream</text>
  <rect x="532.857142857143" y="119.816513761468" width="214.285714285714" height="85.137614678899" rx="10.678182948789" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="151.743119266055" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--text)">version: 4</text>
  <text x="640" y="178.348623853211" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" font-style="italic" fill="var(--text-muted)">(both clients see this)</text>

  <rect x="532.857142857143" y="226.238532110092" width="214.285714285714" height="85.137614678899" rx="10.678182948789" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="258.165137614679" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--text)">version: 5</text>
  <text x="640" y="284.770642201835" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" font-style="italic" fill="var(--text-muted)">(after A's append)</text>

  <!-- Client B -->
  <text x="1132.857142857143" y="98.532110091743" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.356365897578" font-weight="bold" fill="var(--text)">Client B</text>
  <rect x="1025.714285714286" y="119.816513761468" width="214.285714285714" height="63.853211009174" rx="10.678182948789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.857142857143" y="160.256880733945" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--primary-text)">load: version=4</text>

  <rect x="1025.714285714286" y="204.954128440367" width="214.285714285714" height="63.853211009174" rx="10.678182948789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.857142857143" y="245.394495412844" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--primary-text)">decide → events</text>

  <rect x="1025.714285714286" y="290.091743119266" width="214.285714285714" height="63.853211009174" rx="10.678182948789" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.857142857143" y="330.532110091743" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--danger-text)">append (expected=4) ✗</text>

  <!-- Conflict result -->
  <rect x="1025.714285714286" y="375.229357798165" width="214.285714285714" height="63.853211009174" rx="10.678182948789" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.857142857143" y="415.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" font-weight="bold" fill="var(--danger-text)">ConcurrencyConflict</text>

  <!-- Resolution -->
  <rect x="1025.714285714286" y="460.366972477064" width="214.285714285714" height="63.853211009174" rx="10.678182948789" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132.857142857143" y="494.422018348624" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.949456128305" fill="var(--primary-text)">reload: version=5</text>
  <text x="1132.857142857143" y="516.770642201835" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.881637833426" fill="var(--primary-text)">retry decide+append</text>

  <text x="640" y="593.394495412844" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.152911012942" font-style="italic" fill="var(--text-muted)">Optimistic concurrency: detect conflict at append, retry by reloading</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.017274423184" font-style="italic" fill="var(--text-faint)">B may now make a different decision based on A's events</text>
</svg>

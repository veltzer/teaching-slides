<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Top: synchronous -->
  <text x="120" y="40" font-family="Arial, sans-serif" font-size="25.848791074246" font-weight="bold" fill="var(--text)">Synchronous</text>
  <text x="320" y="40" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--text-muted)">— caller waits for the full result</text>

  <rect x="120" y="74.8" width="160" height="69.6" rx="15.078461459977" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="116.56" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--primary-text)">Caller</text>

  <rect x="380" y="74.8" width="160" height="69.6" rx="15.078461459977" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="116.56" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--primary-text)">API</text>

  <rect x="640" y="74.8" width="160" height="69.6" rx="15.078461459977" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="116.56" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--primary-text)">Handler</text>

  <rect x="900" y="74.8" width="160" height="69.6" rx="15.078461459977" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="116.56" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--primary-text)">Store</text>

  <path d="M 280 109.6 L 380 109.6" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 540 109.6 L 640 109.6" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 800 109.6 L 900 109.6" fill="none" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 980 190.8 L 200 190.8" fill="none" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="176.88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" font-style="italic" fill="var(--ok-accent)">200 OK with the result</text>

  <text x="200" y="260.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--text-muted)">Latency = sum of every step</text>
  <text x="900" y="260.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" fill="var(--text-muted)">Easy to reason about, easy to retry</text>

  <!-- Divider -->
  <line x1="40" y1="330" x2="1240" y2="330" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Bottom: asynchronous -->
  <text x="120" y="388" font-family="Arial, sans-serif" font-size="25.848791074246" font-weight="bold" fill="var(--text)">Asynchronous</text>
  <text x="335" y="388" font-family="Arial, sans-serif" font-size="17.23252738283" fill="var(--text-muted)">— caller gets ack, polls or subscribes for the result</text>

  <rect x="120" y="422.8" width="160" height="69.6" rx="15.078461459977" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="464.56" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--warn-text)">Caller</text>

  <rect x="380" y="422.8" width="160" height="69.6" rx="15.078461459977" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="460" y="464.56" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--warn-text)">API</text>

  <rect x="640" y="422.8" width="160" height="69.6" rx="15.078461459977" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="720" y="464.56" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--warn-text)">Queue</text>

  <rect x="900" y="422.8" width="160" height="69.6" rx="15.078461459977" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="464.56" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.386593305684" font-weight="bold" fill="var(--warn-text)">Worker</text>

  <path d="M 280 457.6 L 380 457.6" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 540 457.6 L 640 457.6" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 800 457.6 L 900 457.6" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 460 492.4 L 200 538.8" fill="none" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" font-style="italic" fill="var(--ok-accent)">202 Accepted (correlation id)</text>

  <path d="M 980 504 Q 1200 620 200 620" fill="none" stroke="var(--info-border)" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="640" y="614.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.155494421404" font-style="italic" fill="var(--info-accent)">later: webhook / poll / push</text>
</svg>

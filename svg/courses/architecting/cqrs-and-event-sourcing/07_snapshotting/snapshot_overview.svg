<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.726960052005" font-weight="bold" fill="var(--text)">Snapshot Cuts the Replay Cost</text>

  <!-- Top: full replay (no snapshot) -->
  <text x="100" y="142.352941176471" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--text)">Without snapshot</text>

  <rect x="60" y="176.470588235294" width="60" height="45.490196078431" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="90" y="204.901960784314" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v1</text>
  <rect x="130" y="176.470588235294" width="60" height="45.490196078431" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="160" y="204.901960784314" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v2</text>
  <rect x="200" y="176.470588235294" width="60" height="45.490196078431" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="230" y="204.901960784314" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v3</text>
  <rect x="270" y="176.470588235294" width="60" height="45.490196078431" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="300" y="204.901960784314" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v4</text>
  <text x="365" y="204.901960784314" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">...</text>
  <rect x="400" y="176.470588235294" width="60" height="45.490196078431" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="430" y="204.901960784314" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v98</text>
  <rect x="470" y="176.470588235294" width="60" height="45.490196078431" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="500" y="204.901960784314" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v99</text>
  <rect x="540" y="176.470588235294" width="60" height="45.490196078431" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="570" y="204.901960784314" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v100</text>

  <text x="900" y="204.901960784314" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--text-muted)">apply 100 events</text>

  <!-- Divider -->
  <line x1="40" y1="278.823529411765" x2="1240" y2="278.823529411765" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Bottom: with snapshot -->
  <text x="100" y="335.686274509804" font-family="Arial, sans-serif" font-size="19.195587728311" font-weight="bold" fill="var(--text)">With snapshot at v90</text>

  <rect x="60" y="381.176470588235" width="430" height="56.862745098039" rx="6.39852924277" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" opacity="0.4"/>
  <text x="275" y="416.43137254902" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">events v1..v90 (skipped)</text>

  <rect x="500" y="369.803921568627" width="80" height="79.607843137255" rx="6.39852924277" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="540" y="403.921568627451" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.929901566464" font-weight="bold" fill="var(--warn-text)">snap</text>
  <text x="540" y="426.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.863480026003" fill="var(--warn-text)">v=90</text>

  <rect x="600" y="381.176470588235" width="60" height="56.862745098039" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="630" y="413.019607843137" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v91</text>
  <rect x="670" y="381.176470588235" width="60" height="56.862745098039" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="700" y="413.019607843137" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v92</text>
  <text x="765" y="413.019607843137" font-family="Arial, sans-serif" font-size="14.929901566464" fill="var(--text-muted)">...</text>
  <rect x="800" y="381.176470588235" width="60" height="56.862745098039" rx="6.39852924277" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="830" y="413.019607843137" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.730636945079" fill="var(--info-text)">v100</text>

  <text x="1000" y="413.019607843137" font-family="Arial, sans-serif" font-size="17.062744647388" fill="var(--ok-accent)">apply 10 events</text>

  <!-- Result -->
  <rect x="60" y="506.274509803922" width="1180" height="113.725490196078" rx="14.929901566464" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" opacity="0.85"/>
  <text x="640" y="546.078431372549" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.328430809235" font-weight="bold" fill="var(--ok-text)">Same result. 10x fewer apply calls.</text>
  <text x="640" y="580.196078431372" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.996323106926" fill="var(--ok-text)">Snapshot is just a cached starting point. The events remain the source of truth.</text>
</svg>

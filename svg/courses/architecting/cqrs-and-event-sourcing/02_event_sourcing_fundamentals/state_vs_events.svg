<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- LEFT: state-based -->
  <text x="320" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.459060435492" font-weight="bold" fill="var(--text)">State-Based</text>
  <text x="320" y="71.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--text-muted)">Save current value; overwrite on change</text>

  <rect x="40" y="129.230769230769" width="560" height="312.307692307692" rx="14.785647926803" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599262" font-weight="bold" fill="var(--primary-text)">orders table</text>
  <text x="80" y="229.615384615385" font-family="Courier New, monospace" font-size="21.122354181148" fill="var(--primary-text)">order_id  |  total  |  status</text>
  <text x="80" y="274.230769230769" font-family="Courier New, monospace" font-size="21.122354181148" fill="var(--primary-text)">    1042  |   95.0  |  placed</text>
  <text x="80" y="341.153846153846" text-anchor="start" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--primary-text)">Tells you what is true now.</text>
  <text x="80" y="374.615384615385" text-anchor="start" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--primary-text)">Says nothing about how it</text>
  <text x="80" y="402.5" text-anchor="start" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--primary-text)">got that way.</text>

  <text x="320" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--text-muted)">UPDATE orders SET total = 95 WHERE id = 1042;</text>
  <text x="320" y="502.884615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.841765635861" font-style="italic" fill="var(--text-faint)">previous value is gone</text>

  <!-- Vertical divider -->
  <line x1="640" y1="129.230769230769" x2="640" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- RIGHT: event-sourced -->
  <text x="960" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.459060435492" font-weight="bold" fill="var(--text)">Event-Sourced</text>
  <text x="960" y="71.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.897883344918" fill="var(--text-muted)">Append events; never overwrite</text>

  <rect x="680" y="129.230769230769" width="560" height="423.846153846154" rx="14.785647926803" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.234589599262" font-weight="bold" fill="var(--info-text)">order:1042 stream</text>
  <text x="720" y="218.461538461538" font-family="Courier New, monospace" font-size="16.897883344918" fill="var(--info-text)">v1: OrderCreated(total=0)</text>
  <text x="720" y="251.923076923077" font-family="Courier New, monospace" font-size="16.897883344918" fill="var(--info-text)">v2: LineItemAdded(price=50)</text>
  <text x="720" y="285.384615384615" font-family="Courier New, monospace" font-size="16.897883344918" fill="var(--info-text)">v3: LineItemAdded(price=50)</text>
  <text x="720" y="318.846153846154" font-family="Courier New, monospace" font-size="16.897883344918" fill="var(--info-text)">v4: DiscountApplied(amount=5)</text>
  <text x="720" y="352.307692307692" font-family="Courier New, monospace" font-size="16.897883344918" fill="var(--info-text)">v5: OrderPlaced()</text>

  <text x="720" y="408.076923076923" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">Replay produces total=95.</text>
  <text x="720" y="435.961538461538" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">History is preserved by</text>
  <text x="720" y="463.846153846154" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">construction.</text>
  <text x="720" y="508.461538461539" font-family="Arial, sans-serif" font-size="15.841765635861" fill="var(--info-text)">Audit and replay are free.</text>
</svg>

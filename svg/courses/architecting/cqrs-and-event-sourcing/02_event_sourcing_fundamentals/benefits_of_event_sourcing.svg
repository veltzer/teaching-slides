<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Center: event log -->
  <rect x="505.51724137931" y="247.142857142857" width="268.965517241379" height="165.714285714286" rx="14.491376746189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="304.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.772163458298" font-weight="bold" fill="var(--info-text)">Event Log</text>
  <text x="640" y="340.357142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" fill="var(--info-text)">Immutable, ordered,</text>
  <text x="640" y="366.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.561573424217" fill="var(--info-text)">append-only</text>

  <!-- Top-left: audit -->
  <rect x="40" y="40" width="289.655172413793" height="134.642857142857" rx="14.491376746189" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="81.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.701966780271" font-weight="bold" fill="var(--primary-text)">Audit Log</text>
  <text x="184.827586206897" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--primary-text)">Every change recorded</text>
  <text x="184.827586206897" y="133.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--primary-text)">with who, when, and why</text>
  <text x="184.827586206897" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--primary-text)">Compliance for free</text>

  <path d="M 329.655172413793 107.321428571429 L 505.51724137931 257.5" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Top-right: temporal -->
  <rect x="950.344827586207" y="40" width="289.655172413793" height="134.642857142857" rx="14.491376746189" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172413793103" y="81.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.701966780271" font-weight="bold" fill="var(--ok-text)">Temporal Queries</text>
  <text x="1095.172413793103" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--ok-text)">"What did this look like</text>
  <text x="1095.172413793103" y="133.214285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--ok-text)">on March 5th?"</text>
  <text x="1095.172413793103" y="159.107142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--ok-text)">Replay to a point in time</text>

  <path d="M 950.344827586207 107.321428571429 L 774.48275862069 257.5" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom-left: debugging -->
  <rect x="40" y="485.357142857143" width="289.655172413793" height="134.642857142857" rx="14.491376746189" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="526.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.701966780271" font-weight="bold" fill="var(--warn-text)">Debugging</text>
  <text x="184.827586206897" y="557.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--warn-text)">Reproduce production</text>
  <text x="184.827586206897" y="578.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--warn-text)">bugs by replaying</text>
  <text x="184.827586206897" y="604.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--warn-text)">the same events</text>

  <path d="M 329.655172413793 552.678571428571 L 505.51724137931 402.5" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom-right: new read models -->
  <rect x="950.344827586207" y="485.357142857143" width="289.655172413793" height="134.642857142857" rx="14.491376746189" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1095.172413793103" y="526.785714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.701966780271" font-weight="bold" fill="var(--info-text)">New Read Models</text>
  <text x="1095.172413793103" y="557.857142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--info-text)">A new dashboard? Just</text>
  <text x="1095.172413793103" y="578.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--info-text)">project the events into</text>
  <text x="1095.172413793103" y="604.464285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.491376746189" fill="var(--info-text)">a new shape</text>

  <path d="M 950.344827586207 552.678571428571 L 774.48275862069 402.5" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

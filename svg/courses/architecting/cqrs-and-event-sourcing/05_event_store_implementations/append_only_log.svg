<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.366980831389" font-weight="bold" fill="var(--text)">Append-Only Log</text>

  <!-- Log slots -->
  <rect x="40" y="188.085106382979" width="162.71186440678" height="123.404255319149" rx="11.202493154068" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.35593220339" y="237.446808510638" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.404986308135" font-weight="bold" fill="var(--info-text)">v1</text>
  <text x="121.35593220339" y="274.468085106383" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.683490415695" fill="var(--info-text)">OrderCreated</text>

  <rect x="223.050847457627" y="188.085106382979" width="162.71186440678" height="123.404255319149" rx="11.202493154068" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.406779661017" y="237.446808510638" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.404986308135" font-weight="bold" fill="var(--info-text)">v2</text>
  <text x="304.406779661017" y="274.468085106383" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.683490415695" fill="var(--info-text)">LineItemAdded</text>

  <rect x="406.101694915254" y="188.085106382979" width="162.71186440678" height="123.404255319149" rx="11.202493154068" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.457627118644" y="237.446808510638" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.404986308135" font-weight="bold" fill="var(--info-text)">v3</text>
  <text x="487.457627118644" y="274.468085106383" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.683490415695" fill="var(--info-text)">PaymentCaptured</text>

  <rect x="589.152542372881" y="188.085106382979" width="162.71186440678" height="123.404255319149" rx="11.202493154068" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="670.508474576271" y="237.446808510638" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.404986308135" font-weight="bold" fill="var(--info-text)">v4</text>
  <text x="670.508474576271" y="274.468085106383" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.683490415695" fill="var(--info-text)">ItemShipped</text>

  <rect x="772.203389830509" y="188.085106382979" width="162.71186440678" height="123.404255319149" rx="11.202493154068" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="853.559322033898" y="237.446808510638" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.404986308135" font-weight="bold" fill="var(--info-text)">v5</text>
  <text x="853.559322033898" y="274.468085106383" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.683490415695" fill="var(--info-text)">OrderDelivered</text>

  <!-- Empty slot at end -->
  <rect x="955.254237288136" y="188.085106382979" width="162.71186440678" height="123.404255319149" rx="11.202493154068" fill="var(--surface)" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="1036.610169491525" y="237.446808510638" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.404986308135" font-weight="bold" fill="var(--text-muted)">v6</text>
  <text x="1036.610169491525" y="274.468085106383" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.683490415695" font-style="italic" fill="var(--text-faint)">next append</text>

  <!-- Append arrow -->
  <rect x="1158.64406779661" y="212.765957446808" width="81.35593220339" height="74.042553191489" rx="11.202493154068" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1199.322033898305" y="259.659574468085" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.923989046508" font-weight="bold" fill="var(--primary-text)">writer</text>
  <path d="M 1158.64406779661 249.787234042553 L 1117.966101694915 249.787234042553" fill="none" stroke="var(--primary-border)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Time axis -->
  <line x1="40" y1="373.191489361702" x2="1117.966101694915" y2="373.191489361702" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="410.212765957447" font-family="Arial, sans-serif" font-size="15.683490415695" fill="var(--text-muted)">time</text>

  <!-- Rules -->
  <text x="629.830508474576" y="496.595744680851" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.404986308135" font-weight="bold" fill="var(--text)">Rules</text>
  <text x="629.830508474576" y="545.957446808511" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.044238361915" fill="var(--text-muted)">Writers only append. Readers read any prefix.</text>
  <text x="629.830508474576" y="582.978723404255" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.044238361915" fill="var(--text-muted)">Versions are dense and monotonic per stream.</text>
  <text x="629.830508474576" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.044238361915" fill="var(--text-muted)">Once written, an entry is immutable.</text>
</svg>

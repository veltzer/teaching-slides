<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="flat">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="var(--primary-border)"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg)"/>
      <stop offset="100%" stop-color="var(--surface)"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="var(--ok-border)"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="var(--warn-border)"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="var(--danger-border)"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="var(--info-border)"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.068883707497" font-weight="bold" fill="var(--text)">Three Event Stores</text>

  <!-- Postgres -->
  <rect x="40" y="88.333333333333" width="393.103448275862" height="459.166666666667" rx="15.652475842499" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="236.551724137931" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.596747752498" font-weight="bold" fill="var(--primary-text)">Postgres</text>
  <text x="60.689655172414" y="185" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--primary-text)">Append: SQL INSERT</text>
  <text x="60.689655172414" y="215.208333333333" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--primary-text)">Concurrency: unique index</text>
  <text x="60.689655172414" y="245.416666666667" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--primary-text)">Subscriptions: poll or LISTEN</text>
  <text x="60.689655172414" y="275.625" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--primary-text)">Setup cost: low</text>
  <text x="60.689655172414" y="305.833333333333" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--primary-text)">Throughput: medium</text>
  <text x="60.689655172414" y="354.166666666667" font-family="Arial, sans-serif" font-size="15.652475842499" font-style="italic" fill="var(--primary-text)">Best for:</text>
  <text x="60.689655172414" y="384.375" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--primary-text)">starter systems</text>
  <text x="60.689655172414" y="414.583333333333" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--primary-text)">teams with SQL skills</text>

  <!-- EventStoreDB -->
  <rect x="443.448275862069" y="88.333333333333" width="393.103448275862" height="459.166666666667" rx="15.652475842499" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.596747752498" font-weight="bold" fill="var(--info-text)">EventStoreDB</text>
  <text x="464.137931034483" y="185" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--info-text)">Append: native protocol</text>
  <text x="464.137931034483" y="215.208333333333" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--info-text)">Concurrency: ExpectedRevision</text>
  <text x="464.137931034483" y="245.416666666667" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--info-text)">Subscriptions: built in</text>
  <text x="464.137931034483" y="275.625" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--info-text)">Setup cost: medium</text>
  <text x="464.137931034483" y="305.833333333333" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--info-text)">Throughput: high</text>
  <text x="464.137931034483" y="354.166666666667" font-family="Arial, sans-serif" font-size="15.652475842499" font-style="italic" fill="var(--info-text)">Best for:</text>
  <text x="464.137931034483" y="384.375" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--info-text)">heavy projection workloads</text>
  <text x="464.137931034483" y="414.583333333333" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--info-text)">native streaming primitives</text>

  <!-- Kafka -->
  <rect x="846.896551724138" y="88.333333333333" width="393.103448275862" height="459.166666666667" rx="15.652475842499" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="1043.448275862069" y="136.666666666667" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.596747752498" font-weight="bold" fill="var(--ok-text)">Apache Kafka</text>
  <text x="867.586206896552" y="185" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--ok-text)">Append: produce to partition</text>
  <text x="867.586206896552" y="215.208333333333" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--ok-text)">Concurrency: app-level</text>
  <text x="867.586206896552" y="245.416666666667" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--ok-text)">Subscriptions: consumer groups</text>
  <text x="867.586206896552" y="275.625" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--ok-text)">Setup cost: high</text>
  <text x="867.586206896552" y="305.833333333333" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--ok-text)">Throughput: very high</text>
  <text x="867.586206896552" y="354.166666666667" font-family="Arial, sans-serif" font-size="15.652475842499" font-style="italic" fill="var(--ok-text)">Best for:</text>
  <text x="867.586206896552" y="384.375" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--ok-text)">cross-service integration log</text>
  <text x="867.586206896552" y="414.583333333333" font-family="Arial, sans-serif" font-size="15.652475842499" fill="var(--ok-text)">scale beyond one DB node</text>

  <!-- Bottom note -->
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.888543819998" font-style="italic" fill="var(--text-muted)">Start with Postgres. Move when you actually need to.</text>
</svg>

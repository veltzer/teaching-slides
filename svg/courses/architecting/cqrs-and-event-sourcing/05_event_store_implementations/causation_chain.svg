<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.690786572738" font-weight="bold" fill="var(--text)">Correlation and Causation</text>

  <!-- User command -->
  <rect x="40" y="129.230769230769" width="244.067796610169" height="111.538461538462" rx="14.910423539167" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="162.033898305085" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.170544550357" font-weight="bold" fill="var(--primary-text)">PlaceOrder</text>
  <text x="162.033898305085" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--primary-text)">cmd_id = abc</text>
  <text x="162.033898305085" y="218.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--primary-text)">correlation = X</text>

  <!-- Event 1 -->
  <rect x="365.423728813559" y="129.230769230769" width="244.067796610169" height="111.538461538462" rx="14.910423539167" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.457627118644" y="168.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.170544550357" font-weight="bold" fill="var(--info-text)">OrderPlaced</text>
  <text x="487.457627118644" y="196.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--info-text)">id = 1, causation = abc</text>
  <text x="487.457627118644" y="218.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--info-text)">correlation = X</text>

  <path d="M 284.067796610169 185 L 365.423728813559 185" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event 2 (subscriber-emitted) -->
  <rect x="690.847457627119" y="62.307692307692" width="244.067796610169" height="111.538461538462" rx="14.910423539167" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812.881355932203" y="101.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.170544550357" font-weight="bold" fill="var(--info-text)">PaymentCharged</text>
  <text x="812.881355932203" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--info-text)">id = 2, causation = 1</text>
  <text x="812.881355932203" y="151.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--info-text)">correlation = X</text>

  <path d="M 609.491525423729 168.269230769231 L 690.847457627119 112.5" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="690.847457627119" y="196.153846153846" width="244.067796610169" height="111.538461538462" rx="14.910423539167" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="812.881355932203" y="235.192307692308" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.170544550357" font-weight="bold" fill="var(--info-text)">EmailSent</text>
  <text x="812.881355932203" y="263.076923076923" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--info-text)">id = 3, causation = 1</text>
  <text x="812.881355932203" y="285.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--info-text)">correlation = X</text>

  <path d="M 609.491525423729 207.307692307692 L 690.847457627119 246.346153846154" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event 3: caused by event 2 -->
  <rect x="1016.271186440678" y="62.307692307692" width="223.728813559322" height="111.538461538462" rx="14.910423539167" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.135593220339" y="101.346153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.10551429756" font-weight="bold" fill="var(--ok-text)">RewardsCredited</text>
  <text x="1128.135593220339" y="129.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--ok-text)">id = 4, causation = 2</text>
  <text x="1128.135593220339" y="151.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.845393286369" fill="var(--ok-text)">correlation = X</text>

  <path d="M 934.915254237288 112.5 L 1016.271186440678 112.5" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bottom: caption -->
  <rect x="40" y="374.615384615385" width="1200" height="245.384615384615" rx="14.910423539167" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="629.830508474576" y="424.807692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.300605055953" font-weight="bold" fill="var(--text)">Two debugging questions, two answers</text>
  <text x="80.677966101695" y="480.576923076923" font-family="Arial, sans-serif" font-size="18.10551429756" fill="var(--text)">"What happened in this checkout?" — filter by correlation_id = X</text>
  <text x="80.677966101695" y="519.615384615385" font-family="Arial, sans-serif" font-size="18.10551429756" fill="var(--text)">"What triggered RewardsCredited?" — follow causation chain back: 4 → 2 → 1 → cmd abc</text>
  <text x="629.830508474576" y="580.961538461539" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.975453791964" font-style="italic" fill="var(--text-faint)">Cheap to add at write time. Painful to add later.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.082913354969" font-weight="bold" fill="var(--text)">Two streams, one projection</text>

  <!-- Two source streams -->
  <text x="80.677966101695" y="115.185185185185" font-family="Arial, sans-serif" font-size="16.721942236646" font-weight="bold" fill="var(--text)">order-42</text>
  <rect x="40" y="136.666666666667" width="162.71186440678" height="64.444444444444" rx="8.360971118323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.35593220339" y="174.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">OrderPlaced</text>

  <rect x="223.050847457627" y="136.666666666667" width="162.71186440678" height="64.444444444444" rx="8.360971118323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="304.406779661017" y="174.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">ItemShipped</text>

  <text x="80.677966101695" y="265.555555555556" font-family="Arial, sans-serif" font-size="16.721942236646" font-weight="bold" fill="var(--text)">payment-99</text>
  <rect x="40" y="287.037037037037" width="162.71186440678" height="64.444444444444" rx="8.360971118323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="121.35593220339" y="324.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">PaymentCharged</text>

  <!-- Projection -->
  <rect x="487.457627118644" y="179.62962962963" width="223.728813559322" height="107.407407407407" rx="14.631699457065" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="599.322033898305" y="222.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.902427795807" font-weight="bold" fill="var(--warn-text)">Projection</text>
  <text x="599.322033898305" y="254.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--warn-text)">tails the global log</text>

  <path d="M 385.762711864407 168.888888888889 L 487.457627118644 201.111111111111" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 202.71186440678 319.259259259259 L 487.457627118644 265.555555555556" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Two possible delivery orders -->
  <text x="975.593220338983" y="115.185185185185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--text)">Two valid orderings</text>

  <rect x="792.542372881356" y="147.407407407407" width="162.71186440678" height="53.703703703704" rx="8.360971118323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="873.898305084746" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">OrderPlaced</text>
  <rect x="792.542372881356" y="211.851851851852" width="162.71186440678" height="53.703703703704" rx="8.360971118323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="873.898305084746" y="244.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">PaymentCharged</text>
  <rect x="792.542372881356" y="276.296296296296" width="162.71186440678" height="53.703703703704" rx="8.360971118323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="873.898305084746" y="308.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">ItemShipped</text>

  <rect x="1016.271186440678" y="147.407407407407" width="203.389830508475" height="53.703703703704" rx="8.360971118323" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117.966101694915" y="179.62962962963" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--ok-text)">PaymentCharged</text>
  <rect x="1016.271186440678" y="211.851851851852" width="203.389830508475" height="53.703703703704" rx="8.360971118323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117.966101694915" y="244.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">OrderPlaced</text>
  <rect x="1016.271186440678" y="276.296296296296" width="203.389830508475" height="53.703703703704" rx="8.360971118323" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1117.966101694915" y="308.518518518519" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.586578067275" fill="var(--primary-text)">ItemShipped</text>

  <text x="873.898305084746" y="362.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.631699457065" font-style="italic" fill="var(--text-faint)">strict per stream</text>
  <text x="1117.966101694915" y="362.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.631699457065" font-style="italic" fill="var(--text-faint)">interleaved</text>

  <!-- Caption -->
  <rect x="40" y="437.407407407408" width="1200" height="182.592592592593" rx="14.631699457065" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="629.830508474576" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.812185016227" font-weight="bold" fill="var(--text)">Strategies for cross-stream projections</text>
  <text x="80.677966101695" y="512.592592592593" font-family="Arial, sans-serif" font-size="15.676820846856" fill="var(--text-muted)">Idempotent + commutative — counters and sets don't care about order</text>
  <text x="80.677966101695" y="539.444444444444" font-family="Arial, sans-serif" font-size="15.676820846856" fill="var(--text-muted)">Tombstone by event_id — drop duplicates</text>
  <text x="80.677966101695" y="566.296296296296" font-family="Arial, sans-serif" font-size="15.676820846856" fill="var(--text-muted)">Buffer + sort by causation_id when ordering matters</text>
  <text x="80.677966101695" y="593.148148148148" font-family="Arial, sans-serif" font-size="15.676820846856" fill="var(--text-muted)">Stream-keyed projection — only one stream per partition</text>
</svg>

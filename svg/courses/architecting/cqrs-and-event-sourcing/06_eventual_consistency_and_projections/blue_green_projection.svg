<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.924994259434" font-weight="bold" fill="var(--text)">Blue-Green Projection</text>

  <!-- Event log -->
  <rect x="40" y="134.909090909091" width="244.067796610169" height="337.454545454545" rx="14.498073832003" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="162.033898305085" y="177.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.782687450291" font-weight="bold" fill="var(--info-text)">Event Log</text>
  <text x="162.033898305085" y="219.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--info-text)">single source</text>
  <text x="162.033898305085" y="245.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--info-text)">unchanged during</text>
  <text x="162.033898305085" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--info-text)">the migration</text>

  <!-- Blue (old) -->
  <rect x="416.271186440678" y="92.727272727273" width="386.440677966102" height="168.727272727273" rx="14.498073832003" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.491525423729" y="134.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.782687450291" font-weight="bold" fill="var(--primary-text)">Blue (old)</text>
  <text x="609.491525423729" y="171.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--primary-text)">live; serving reads</text>
  <text x="609.491525423729" y="198.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--primary-text)">current schema v1</text>
  <text x="609.491525423729" y="229.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--primary-text)">reads still hit here</text>

  <!-- Green (new) -->
  <rect x="416.271186440678" y="303.636363636364" width="386.440677966102" height="168.727272727273" rx="14.498073832003" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="609.491525423729" y="345.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.782687450291" font-weight="bold" fill="var(--ok-text)">Green (new)</text>
  <text x="609.491525423729" y="382.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--ok-text)">catching up from 0</text>
  <text x="609.491525423729" y="409.090909090909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--ok-text)">new schema v2</text>
  <text x="609.491525423729" y="440.727272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--ok-text)">no reads yet</text>

  <path d="M 284.067796610169 198.181818181818 L 416.271186440678 177.090909090909" fill="none" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 284.067796610169 366.909090909091 L 416.271186440678 388" fill="none" stroke="var(--info-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Switch -->
  <rect x="894.237288135593" y="198.181818181818" width="244.067796610169" height="168.727272727273" rx="14.498073832003" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1016.271186440678" y="240.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.782687450291" font-weight="bold" fill="var(--info-text)">Reads</text>
  <text x="1016.271186440678" y="277.272727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--info-text)">configurable</text>
  <text x="1016.271186440678" y="303.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--info-text)">"blue" until ready,</text>
  <text x="1016.271186440678" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--info-text)">then "green"</text>

  <path d="M 802.71186440678 177.090909090909 Q 863.728813559322 219.272727272727 894.237288135593 261.454545454545" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 802.71186440678 388 Q 863.728813559322 345.818181818182 894.237288135593 303.636363636364" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <rect x="40" y="514.545454545455" width="1200" height="105.454545454545" rx="14.498073832003" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="629.830508474576" y="551.454545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.604803938861" fill="var(--text)">Both projections subscribe to the same log. Reads point to one at a time.</text>
  <text x="629.830508474576" y="577.818181818182" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.604803938861" fill="var(--text)">Switch when green has caught up. Drop blue after a stability window.</text>
  <text x="629.830508474576" y="604.181818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" font-style="italic" fill="var(--text-faint)">Zero-downtime read model migration</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Inline -->
  <text x="205.51724137931" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.344466747589" font-weight="bold" fill="var(--text)">Inline</text>
  <rect x="40" y="87.34693877551" width="331.034482758621" height="449.795918367347" rx="15.49193338483" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="205.51724137931" y="146.530612244898" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.70506672552" fill="var(--primary-text)">single transaction</text>
  <text x="205.51724137931" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--primary-text)">append event +</text>
  <text x="205.51724137931" y="235.30612244898" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--primary-text)">update read model</text>
  <text x="205.51724137931" y="312.244897959184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.70506672552" font-weight="bold" fill="var(--primary-text)">lag = 0</text>
  <text x="205.51724137931" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--primary-text)">strong consistency</text>
  <text x="205.51724137931" y="401.020408163265" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--primary-text)">write path slowed</text>
  <text x="205.51724137931" y="430.612244897959" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--primary-text)">read store coupled</text>
  <text x="205.51724137931" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.385366714485" font-style="italic" fill="var(--primary-text)">Use sparingly</text>

  <!-- Async -->
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.344466747589" font-weight="bold" fill="var(--text)">Asynchronous</text>
  <rect x="474.48275862069" y="87.34693877551" width="331.034482758621" height="449.795918367347" rx="15.49193338483" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="146.530612244898" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.70506672552" fill="var(--ok-text)">subscriber tails log</text>
  <text x="640" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--ok-text)">append event,</text>
  <text x="640" y="235.30612244898" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--ok-text)">project later</text>
  <text x="640" y="312.244897959184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.70506672552" font-weight="bold" fill="var(--ok-text)">lag = milliseconds</text>
  <text x="640" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--ok-text)">independent scaling</text>
  <text x="640" y="401.020408163265" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--ok-text)">multiple read models</text>
  <text x="640" y="430.612244897959" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--ok-text)">eventual consistency</text>
  <text x="640" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.385366714485" font-style="italic" fill="var(--ok-text)">The default</text>

  <!-- Catch-up -->
  <text x="1074.48275862069" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.344466747589" font-weight="bold" fill="var(--text)">Catch-up</text>
  <rect x="908.965517241379" y="87.34693877551" width="331.034482758621" height="449.795918367347" rx="15.49193338483" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="146.530612244898" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.70506672552" fill="var(--warn-text)">processes history</text>
  <text x="1074.48275862069" y="205.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--warn-text)">starts at position 0,</text>
  <text x="1074.48275862069" y="235.30612244898" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--warn-text)">advances to live</text>
  <text x="1074.48275862069" y="312.244897959184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.70506672552" font-weight="bold" fill="var(--warn-text)">lag = catching up</text>
  <text x="1074.48275862069" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--warn-text)">used for new models</text>
  <text x="1074.48275862069" y="401.020408163265" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--warn-text)">used for rebuilds</text>
  <text x="1074.48275862069" y="430.612244897959" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.49193338483" fill="var(--warn-text)">same code as async</text>
  <text x="1074.48275862069" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.385366714485" font-style="italic" fill="var(--warn-text)">The rebuild path</text>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.598500055175" font-style="italic" fill="var(--text-muted)">Most systems use Asynchronous for live and Catch-up for new models / rebuilds</text>
</svg>

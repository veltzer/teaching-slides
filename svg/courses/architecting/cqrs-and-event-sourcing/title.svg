<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <!-- Canonical title and subtitle -->
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">CQRS and Event Sourcing</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Patterns for scalable, auditable distributed systems</text>

  <!-- Command side (left) -->
  <rect x="160" y="350" width="240" height="100" rx="14" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" opacity="0.9"/>
  <text x="280" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">Commands</text>
  <text x="280" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">place_order, ship_item</text>

  <!-- Event log (center) -->
  <rect x="520" y="350" width="240" height="100" rx="14" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" opacity="0.9"/>
  <text x="640" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--info-text)">Event Log</text>
  <text x="640" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--info-text)">OrderPlaced, ItemShipped</text>

  <!-- Query side (right) -->
  <rect x="880" y="350" width="240" height="100" rx="14" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" opacity="0.9"/>
  <text x="1000" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--ok-text)">Queries</text>
  <text x="1000" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--ok-text)">order_summary, history</text>

  <!-- Arrows -->
  <path d="M 400 400 L 520 400" fill="none" stroke="var(--text-faint)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 760 400 L 880 400" fill="none" stroke="var(--text-faint)" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Bottom captions -->
  <text x="280" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Write side</text>
  <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Append-only history</text>
  <text x="1000" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--text-muted)">Read side</text>
</svg>

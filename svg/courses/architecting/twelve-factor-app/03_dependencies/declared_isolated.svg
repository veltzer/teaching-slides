<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Dependencies: Declared and Isolated</text>

  <rect x="40" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--danger-text)">Bad: relies on system</text>
  <rect x="60.689655172414" y="151.743119266055" width="537.931034482759" height="212.844036697248" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="81.379310344828" y="183.669724770642" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">README:</text>
  <text x="81.379310344828" y="210.275229357798" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">"install Python 2.7"</text>
  <text x="81.379310344828" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">"apt-get install libxml2"</text>
  <text x="81.379310344828" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">"pip install whatever"</text>
  <text x="81.379310344828" y="306.05504587156" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">$ python app.py</text>
  <text x="81.379310344828" y="337.981651376147" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-fill)"># works on Alice's laptop only</text>

  <text x="60.689655172414" y="401.834862385321" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--danger-text)">Problems</text>
  <text x="60.689655172414" y="433.761467889908" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- "Works on my machine"</text>
  <text x="60.689655172414" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Hidden version drift</text>
  <text x="60.689655172414" y="486.97247706422" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- New dev = day of setup</text>

  <rect x="660.689655172414" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--ok-text)">Good: declared + isolated</text>
  <rect x="681.379310344828" y="151.743119266055" width="537.931034482759" height="212.844036697248" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="702.068965517241" y="183.669724770642" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">requirements.txt</text>
  <text x="702.068965517241" y="210.275229357798" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">flask==2.3.0</text>
  <text x="702.068965517241" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">requests==2.31.0</text>
  <text x="702.068965517241" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">$ python -m venv .venv</text>
  <text x="702.068965517241" y="306.05504587156" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">$ pip install -r requirements.txt</text>
  <text x="702.068965517241" y="337.981651376147" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-fill)"># works the same everywhere</text>

  <text x="681.379310344828" y="401.834862385321" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">Wins</text>
  <text x="681.379310344828" y="433.761467889908" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Reproducible builds</text>
  <text x="681.379310344828" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Pinned versions</text>
  <text x="681.379310344828" y="486.97247706422" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- New dev = minutes</text>
  <text x="681.379310344828" y="513.577981651376" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Containers natural</text>
</svg>

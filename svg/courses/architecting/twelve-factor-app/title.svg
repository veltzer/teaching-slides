<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">The Twelve-Factor App</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Methodology for cloud-native software</text>

  <!-- 12 numbered cells in a 4x3 grid -->
  <g>
    <rect x="160" y="260" width="200" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="260" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">1. Codebase</text>
    <rect x="380" y="260" width="200" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="480" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">2. Dependencies</text>
    <rect x="600" y="260" width="200" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="700" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">3. Config</text>
    <rect x="820" y="260" width="240" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="940" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">4. Backing Services</text>

    <rect x="160" y="340" width="200" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="260" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">5. Build/Run</text>
    <rect x="380" y="340" width="200" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="480" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">6. Processes</text>
    <rect x="600" y="340" width="200" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="700" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">7. Port Binding</text>
    <rect x="820" y="340" width="240" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="940" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">8. Concurrency</text>

    <rect x="160" y="420" width="200" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="260" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">9. Disposability</text>
    <rect x="380" y="420" width="200" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="480" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">10. Dev/Prod</text>
    <rect x="600" y="420" width="200" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="700" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">11. Logs</text>
    <rect x="820" y="420" width="240" height="60" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
    <text x="940" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="var(--primary-text)">12. Admin Tasks</text>
  </g>

  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="var(--text-faint)">From the original 12factor.net by Heroku, plus modern extensions</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Tactical Building Blocks</text>
  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Entity</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Has identity</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Mutable over time</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Order, User</text>
  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Value object</text>
  <text x="365" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">No identity</text>
  <text x="365" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Immutable, equal-by-value</text>
  <text x="365" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Money, Address</text>
  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Aggregate</text>
  <text x="670" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Cluster with one root</text>
  <text x="670" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Consistency boundary</text>
  <text x="670" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Order + line items</text>
  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Repository</text>
  <text x="975" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Persistence interface</text>
  <text x="975" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Load + save aggregates</text>
  <text x="975" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">DB hidden behind</text>
</svg>

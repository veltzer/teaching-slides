<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Three Kinds of Subdomain</text>
  <rect x="40" y="80" width="395" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Core</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Where you compete</text>
  <text x="60" y="195" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Strategic differentiator</text>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Best engineers go here</text>
  <text x="60" y="265" font-family="Arial, sans-serif" font-size="15" fill="var(--ok-text)">Custom built</text>
  <text x="60" y="320" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--ok-text)">Examples:</text>
  <text x="60" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Recommendation engine</text>
  <text x="60" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Pricing optimisation</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Logistics routing</text>
  <text x="60" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Invest the deepest</text>
  <rect x="445" y="80" width="395" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Supporting</text>
  <text x="465" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Necessary, not unique</text>
  <text x="465" y="195" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Custom but generic</text>
  <text x="465" y="230" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Junior engineers fine</text>
  <text x="465" y="265" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Build or contract out</text>
  <text x="465" y="320" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--primary-text)">Examples:</text>
  <text x="465" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Order tracking</text>
  <text x="465" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Internal admin tools</text>
  <text x="465" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Reporting wrappers</text>
  <text x="465" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Invest the middle</text>
  <rect x="850" y="80" width="390" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Generic</text>
  <text x="870" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Off the shelf works</text>
  <text x="870" y="195" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">No competitive edge</text>
  <text x="870" y="230" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Pay vendor, integrate</text>
  <text x="870" y="265" font-family="Arial, sans-serif" font-size="15" fill="var(--warn-text)">Never build from scratch</text>
  <text x="870" y="320" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="var(--warn-text)">Examples:</text>
  <text x="870" y="350" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Authentication</text>
  <text x="870" y="380" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Email sending</text>
  <text x="870" y="410" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Payment processing</text>
  <text x="870" y="465" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Invest the least</text>
</svg>

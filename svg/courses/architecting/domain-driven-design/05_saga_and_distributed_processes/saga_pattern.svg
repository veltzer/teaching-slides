<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Saga: Long-Running Transactions</text>
  <rect x="40" y="80" width="585" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--info-text)">Choreography</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Each service reacts to events</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">No central coordinator</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="15" fill="var(--info-text)">Loosely coupled</text>
  <text x="60" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--info-text)">Pros and cons</text>
  <text x="60" y="300" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">+ Simple, no extra component</text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">- Hard to trace</text>
  <text x="60" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">- Cyclic dependencies easy</text>
  <text x="60" y="420" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Good for short, linear flows</text>
  <rect x="640" y="80" width="600" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Orchestration</text>
  <text x="660" y="160" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">A central coordinator drives steps</text>
  <text x="660" y="190" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Holds saga state explicitly</text>
  <text x="660" y="220" font-family="Arial, sans-serif" font-size="15" fill="var(--primary-text)">Issues compensations on failure</text>
  <text x="660" y="270" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-text)">Pros and cons</text>
  <text x="660" y="300" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">+ Clear, debuggable</text>
  <text x="660" y="330" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">- Coordinator becomes critical</text>
  <text x="660" y="360" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">- More plumbing to deploy</text>
  <text x="660" y="420" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Good for complex, long flows</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Sync vs Async Communication</text>

  <rect x="40" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--primary-text)">Synchronous (REST / gRPC)</text>

  <rect x="81.379310344828" y="162.385321100917" width="165.51724137931" height="63.853211009174" rx="6.295476751044" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="164.137931034483" y="199.633027522936" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--info-text)">Service A</text>
  <rect x="412.413793103448" y="162.385321100917" width="165.51724137931" height="63.853211009174" rx="6.295476751044" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="495.172413793103" y="199.633027522936" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--info-text)">Service B</text>

  <path d="M 246.896551724138 194.311926605505 L 412.413793103448 194.311926605505" stroke="var(--primary-text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="329.655172413793" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--primary-text)">request</text>

  <path d="M 412.413793103448 236.880733944954 L 246.896551724138 236.880733944954" stroke="var(--primary-text)" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="329.655172413793" y="258.165137614679" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--primary-text)">response</text>

  <text x="60.689655172414" y="322.018348623853" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--primary-text)">A waits for B</text>

  <text x="60.689655172414" y="369.908256880734" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">+ Easy to reason about</text>
  <text x="60.689655172414" y="396.51376146789" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">+ Errors propagate naturally</text>
  <text x="60.689655172414" y="439.082568807339" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Latency stacks</text>
  <text x="60.689655172414" y="465.688073394495" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- B down cascades</text>
  <text x="60.689655172414" y="492.293577981651" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Tight coupling</text>

  <text x="60.689655172414" y="550.825688073395" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--primary-text)">Use when:</text>
  <text x="60.689655172414" y="577.431192660551" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Caller needs the answer to continue</text>
  <text x="60.689655172414" y="598.715596330275" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Read paths, queries</text>

  <rect x="660.689655172414" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--ok-text)">Asynchronous (events / queue)</text>

  <rect x="702.068965517241" y="162.385321100917" width="144.827586206897" height="63.853211009174" rx="6.295476751044" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="774.48275862069" y="199.633027522936" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--info-text)">Service A</text>

  <rect x="877.931034482759" y="162.385321100917" width="144.827586206897" height="63.853211009174" rx="6.295476751044" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="950.344827586207" y="199.633027522936" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--warn-text)">Broker</text>

  <rect x="1053.793103448276" y="162.385321100917" width="144.827586206897" height="63.853211009174" rx="6.295476751044" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="1126.206896551724" y="199.633027522936" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--info-text)">Service B</text>

  <path d="M 846.896551724138 194.311926605505 L 877.931034482759 194.311926605505" stroke="var(--ok-text)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1022.758620689655 194.311926605505 L 1053.793103448276 194.311926605505" stroke="var(--ok-text)" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="950.344827586207" y="263.48623853211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--ok-text)">A publishes; B consumes when ready</text>

  <text x="681.379310344828" y="322.018348623853" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--ok-text)">A doesn't wait</text>

  <text x="681.379310344828" y="369.908256880734" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">+ Loose coupling</text>
  <text x="681.379310344828" y="396.51376146789" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">+ B down does not stop A</text>
  <text x="681.379310344828" y="423.119266055046" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">+ Easy fanout (multi consumer)</text>
  <text x="681.379310344828" y="465.688073394495" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Eventual consistency</text>
  <text x="681.379310344828" y="492.293577981651" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Harder to debug, trace</text>

  <text x="681.379310344828" y="550.825688073395" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--ok-text)">Use when:</text>
  <text x="681.379310344828" y="577.431192660551" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Notify, integrate, cross-team</text>
  <text x="681.379310344828" y="598.715596330275" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Side effects, write paths</text>
</svg>

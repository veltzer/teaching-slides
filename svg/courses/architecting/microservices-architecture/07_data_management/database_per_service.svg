<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.854226236055" font-weight="bold" fill="var(--text)">Database-per-Service</text>

  <rect x="60.689655172414" y="86.194690265487" width="248.275862068966" height="102.654867256637" rx="8.244064638873" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--info-text)">users-svc</text>
  <text x="184.827586206897" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">Postgres</text>
  <text x="184.827586206897" y="173.451327433628" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--info-text)">profile data</text>

  <rect x="371.034482758621" y="86.194690265487" width="248.275862068966" height="102.654867256637" rx="8.244064638873" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="495.172413793103" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--ok-text)">orders-svc</text>
  <text x="495.172413793103" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--ok-text)">MySQL</text>
  <text x="495.172413793103" y="173.451327433628" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--ok-text)">orders + items</text>

  <rect x="681.379310344828" y="86.194690265487" width="248.275862068966" height="102.654867256637" rx="8.244064638873" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="805.51724137931" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--warn-text)">catalog-svc</text>
  <text x="805.51724137931" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--warn-text)">MongoDB</text>
  <text x="805.51724137931" y="173.451327433628" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--warn-text)">products docs</text>

  <rect x="991.724137931035" y="86.194690265487" width="227.586206896552" height="102.654867256637" rx="8.244064638873" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.51724137931" y="122.12389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.488129277745" font-weight="bold" fill="var(--primary-text)">analytics-svc</text>
  <text x="1105.51724137931" y="152.920353982301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--primary-text)">ClickHouse</text>
  <text x="1105.51724137931" y="173.451327433628" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.366096958309" fill="var(--primary-text)">events</text>

  <rect x="40" y="229.911504424779" width="382.758620689655" height="184.778761061947" rx="10.305080798591" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="265.840707964602" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--ok-text)">Wins</text>
  <text x="60.689655172414" y="296.637168141593" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- Loose coupling</text>
  <text x="60.689655172414" y="322.300884955752" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- Right tool per service</text>
  <text x="60.689655172414" y="347.964601769912" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- Schema evolves freely</text>
  <text x="60.689655172414" y="373.628318584071" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--ok-text)">- Independent scaling</text>

  <rect x="448.620689655172" y="229.911504424779" width="382.758620689655" height="184.778761061947" rx="10.305080798591" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="265.840707964602" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--warn-text)">Trade-offs</text>
  <text x="469.310344827586" y="296.637168141593" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">- No cross-service joins</text>
  <text x="469.310344827586" y="322.300884955752" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">- Distributed transactions</text>
  <text x="469.310344827586" y="347.964601769912" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">- Data duplication</text>
  <text x="469.310344827586" y="373.628318584071" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--warn-text)">- Eventual consistency</text>

  <rect x="857.241379310345" y="229.911504424779" width="382.758620689655" height="184.778761061947" rx="10.305080798591" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="265.840707964602" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--info-text)">Patterns</text>
  <text x="877.931034482759" y="296.637168141593" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">- Saga (workflows)</text>
  <text x="877.931034482759" y="322.300884955752" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">- Outbox (events)</text>
  <text x="877.931034482759" y="347.964601769912" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">- CDC (sync read views)</text>
  <text x="877.931034482759" y="373.628318584071" font-family="Arial, sans-serif" font-size="13.396605038168" fill="var(--info-text)">- API composition</text>

  <rect x="40" y="445.486725663717" width="1200" height="174.513274336283" rx="10.305080798591" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="481.41592920354" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.549145437464" font-weight="bold" fill="var(--text)">Anti-pattern: shared database</text>
  <text x="640" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text-muted)">Multiple services hitting one schema = tight coupling at the data layer</text>
  <text x="640" y="543.008849557522" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" fill="var(--text-muted)">Migrations require coordination. Performance fights leak across.</text>
  <text x="640" y="578.938053097345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.427113118027" font-weight="bold" fill="var(--text)">If services share a DB, they're not really separate services</text>
</svg>

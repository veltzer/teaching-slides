<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="619.310344827586" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.514591494905" font-weight="bold" fill="var(--text)">Queue vs Topic</text>

  <line x1="619.310344827586" y1="82.962962962963" x2="619.310344827586" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="288.275862068966" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--text-muted)">Queue (point-to-point)</text>
  <text x="950.344827586207" y="104.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.081851067789" font-weight="bold" fill="var(--text-muted)">Topic (publish-subscribe)</text>

  <rect x="40" y="147.407407407407" width="165.51724137931" height="64.444444444444" rx="8.432740427116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="122.758620689655" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--primary-text)">Producer</text>

  <rect x="246.896551724138" y="168.888888888889" width="186.206896551724" height="85.925925925926" rx="8.432740427116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="206.481481481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--warn-text)">Queue</text>
  <text x="340" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--warn-text)">[m1, m2, m3]</text>

  <rect x="474.48275862069" y="104.444444444444" width="103.448275862069" height="42.962962962963" rx="6.324555320337" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.206896551724" y="131.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" font-weight="bold" fill="var(--ok-text)">Worker A</text>

  <rect x="474.48275862069" y="190.37037037037" width="103.448275862069" height="42.962962962963" rx="6.324555320337" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.206896551724" y="217.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" font-weight="bold" fill="var(--ok-text)">Worker B</text>

  <rect x="474.48275862069" y="276.296296296296" width="103.448275862069" height="42.962962962963" rx="6.324555320337" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.206896551724" y="303.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" font-weight="bold" fill="var(--ok-text)">Worker C</text>

  <path d="M 205.51724137931 206.481481481481 L 246.896551724138 206.481481481481" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 433.103448275862 211.851851851852 L 474.48275862069 125.925925925926" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 433.103448275862 211.851851851852 L 474.48275862069 211.851851851852" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 433.103448275862 211.851851851852 L 474.48275862069 297.777777777778" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="288.275862068966" y="367.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" font-weight="bold" fill="var(--text)">Each message → exactly one worker</text>
  <text x="288.275862068966" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">Load balanced</text>
  <text x="288.275862068966" y="418.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">Acknowledge, broker removes</text>
  <text x="288.275862068966" y="441.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">Workers scale horizontally</text>

  <rect x="681.379310344828" y="147.407407407407" width="165.51724137931" height="64.444444444444" rx="8.432740427116" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="764.137931034483" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--primary-text)">Producer</text>

  <rect x="888.275862068966" y="168.888888888889" width="186.206896551724" height="85.925925925926" rx="8.432740427116" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="981.379310344828" y="206.481481481481" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.811388300842" font-weight="bold" fill="var(--warn-text)">Topic</text>
  <text x="981.379310344828" y="233.333333333333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--warn-text)">[m1, m2, m3]</text>

  <rect x="1115.862068965517" y="104.444444444444" width="124.137931034483" height="42.962962962963" rx="6.324555320337" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1177.931034482759" y="131.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" font-weight="bold" fill="var(--ok-text)">Sub A</text>

  <rect x="1115.862068965517" y="190.37037037037" width="124.137931034483" height="42.962962962963" rx="6.324555320337" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1177.931034482759" y="217.222222222222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" font-weight="bold" fill="var(--ok-text)">Sub B</text>

  <rect x="1115.862068965517" y="276.296296296296" width="124.137931034483" height="42.962962962963" rx="6.324555320337" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1177.931034482759" y="303.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" font-weight="bold" fill="var(--ok-text)">Sub C</text>

  <path d="M 846.896551724138 206.481481481481 L 888.275862068966 206.481481481481" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1074.48275862069 211.851851851852 L 1115.862068965517 125.925925925926" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1074.48275862069 211.851851851852 L 1115.862068965517 211.851851851852" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1074.48275862069 211.851851851852 L 1115.862068965517 297.777777777778" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="950.344827586207" y="367.592592592593" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" font-weight="bold" fill="var(--text)">Each message → every subscriber</text>
  <text x="950.344827586207" y="394.444444444444" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">Independent processing</text>
  <text x="950.344827586207" y="418.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">Add subscribers anytime</text>
  <text x="950.344827586207" y="441.703703703704" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.703203194063" fill="var(--text-muted)">Each subscriber tracks position</text>

  <rect x="40" y="501.851851851852" width="1158.620689655173" height="107.407407407407" rx="8.432740427116" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="619.310344827586" y="534.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.865480854231" font-weight="bold" fill="var(--text)">Modern brokers offer both shapes</text>
  <text x="619.310344827586" y="564.148148148148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-muted)">Topics with consumer groups give per-group queue semantics on top of pub/sub</text>
  <text x="619.310344827586" y="589.925925925926" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.757295747452" fill="var(--text-muted)">Pick by consumer fan-out: one or many?</text>
</svg>

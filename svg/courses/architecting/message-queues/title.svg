  <rect x="360" y="290" width="500" height="60" rx="8" fill="none" stroke="var(--text-faint)" stroke-width="3"/>
  <rect x="380" y="300" width="60" height="40" rx="5" fill="var(--info-fill)"/>
  <rect x="458" y="300" width="60" height="40" rx="5" fill="var(--info-fill)"/>
  <rect x="536" y="300" width="60" height="40" rx="5" fill="var(--info-fill)"/>
  <rect x="614" y="300" width="60" height="40" rx="5" fill="var(--info-fill)"/>
  <rect x="692" y="300" width="60" height="40" rx="5" fill="var(--info-fill)"/>
  <rect x="770" y="300" width="60" height="40" rx="5" fill="var(--info-accent)"/>
  <line x1="860" y1="320" x2="900" y2="320" stroke="var(--text-muted)" stroke-width="3"/>
  <polyline points="900,320 950,245 988,245" fill="none" stroke="var(--text-muted)" stroke-width="3"/>
  <polyline points="900,320 988,320" fill="none" stroke="var(--text-muted)" stroke-width="3"/>
  <polyline points="900,320 950,395 988,395" fill="none" stroke="var(--text-muted)" stroke-width="3"/>
  <polygon points="1000,245 988,238 988,252" fill="var(--text-muted)"/>
  <polygon points="1000,320 988,313 988,327" fill="var(--text-muted)"/>
  <polygon points="1000,395 988,388 988,402" fill="var(--text-muted)"/>
  <rect x="1000" y="220" width="170" height="50" rx="10" fill="var(--ok-fill)"/>
  <text x="1085" y="252" font-size="19" fill="var(--ok-text)">Consumer</text>
  <rect x="1000" y="295" width="170" height="50" rx="10" fill="var(--ok-fill)"/>
  <text x="1085" y="327" font-size="19" fill="var(--ok-text)">Consumer</text>
  <rect x="1000" y="370" width="170" height="50" rx="10" fill="var(--ok-fill)"/>
  <text x="1085" y="402" font-size="19" fill="var(--ok-text)">Consumer</text>
  <line x1="610" y1="350" x2="610" y2="406" stroke="var(--danger-fill)" stroke-width="3" stroke-dasharray="8,6"/>
  <polygon points="610,418 603,406 617,406" fill="var(--danger-fill)"/>
  <rect x="510" y="420" width="200" height="46" rx="10" fill="var(--danger-fill)"/>
  <text x="610" y="450" font-size="18" fill="var(--danger-text)">Dead-Letter Queue</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">patterns • delivery guarantees • routing • partitions • backpressure • operations</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

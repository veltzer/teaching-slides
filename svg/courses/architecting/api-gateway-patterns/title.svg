<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>title</type></metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0; --text: #212121;
        --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e; --black: #000000;
        --primary-fill: #2196f3; --primary-border: #1565c0; --primary-text: #ffffff; --primary-accent: #0d47a1;
        --ok-fill: #4caf50; --ok-border: #2e7d32; --ok-text: #ffffff; --ok-accent: #1b5e20;
        --warn-fill: #ff9800; --warn-border: #e65100; --warn-text: #ffffff; --warn-accent: #bf360c;
        --danger-fill: #e74c3c; --danger-border: #c62828; --danger-text: #ffffff; --danger-accent: #b71c1c;
        --info-fill: #9c27b0; --info-border: #6a1b9a; --info-text: #ffffff; --info-accent: #4a148c;
      }
    </style>
  </defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">API Gateway Patterns</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Routing, auth, throttling, observability</text>
  <rect x="200" y="320" width="180" height="60" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" rx="6"/>
  <text x="290" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Clients</text>
  <rect x="540" y="320" width="200" height="60" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" rx="6"/>
  <text x="640" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Gateway</text>
  <rect x="900" y="280" width="200" height="40" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1000" y="305" text-anchor="middle" font-size="14" fill="var(--ok-text)" font-family="Arial, sans-serif">Service A</text>
  <rect x="900" y="330" width="200" height="40" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1000" y="355" text-anchor="middle" font-size="14" fill="var(--ok-text)" font-family="Arial, sans-serif">Service B</text>
  <rect x="900" y="380" width="200" height="40" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" rx="6"/>
  <text x="1000" y="405" text-anchor="middle" font-size="14" fill="var(--ok-text)" font-family="Arial, sans-serif">Service C</text>
  <line x1="380" y1="350" x2="540" y2="350" stroke="var(--surface)" stroke-width="2"/>
  <line x1="740" y1="350" x2="900" y2="350" stroke="var(--surface)" stroke-width="2"/>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">Kong &#8226; AWS API Gateway &#8226; Envoy &#8226; Tyk</text>
</svg>

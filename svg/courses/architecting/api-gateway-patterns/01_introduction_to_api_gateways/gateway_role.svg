<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.478667152074" font-weight="bold" fill="var(--text)">API Gateway: One Door In</text>

  <rect x="40" y="110" width="186.206896551724" height="100" rx="8.13676204345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--info-text)">Web app</text>
  <text x="133.103448275862" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--info-text)">browser</text>

  <rect x="40" y="250" width="186.206896551724" height="100" rx="8.13676204345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--info-text)">Mobile app</text>
  <text x="133.103448275862" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--info-text)">iOS / Android</text>

  <rect x="40" y="390" width="186.206896551724" height="100" rx="8.13676204345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--info-text)">Partner API</text>
  <text x="133.103448275862" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--info-text)">B2B clients</text>

  <path d="M 226.206896551724 160 L 402.068965517241 240" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 226.206896551724 300 L 402.068965517241 300" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 226.206896551724 440 L 402.068965517241 360" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="412.413793103448" y="230" width="289.655172413793" height="160" rx="14.239333576037" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="557.241379310345" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.341905108624" font-weight="bold" fill="var(--primary-text)">API Gateway</text>
  <text x="557.241379310345" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">- TLS termination</text>
  <text x="557.241379310345" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">- Auth / rate limit</text>
  <text x="557.241379310345" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">- Routing / aggregation</text>
  <text x="557.241379310345" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">- Logging / metrics</text>

  <path d="M 702.068965517241 270 L 857.241379310345 170" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 702.068965517241 310 L 857.241379310345 310" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 702.068965517241 350 L 857.241379310345 450" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="867.586206896552" y="130" width="331.034482758621" height="100" rx="8.13676204345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.103448275862" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--ok-text)">Users service</text>
  <text x="1033.103448275862" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--ok-text)">/users/*</text>

  <rect x="867.586206896552" y="260" width="331.034482758621" height="100" rx="8.13676204345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.103448275862" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--ok-text)">Orders service</text>
  <text x="1033.103448275862" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--ok-text)">/orders/*</text>

  <rect x="867.586206896552" y="390" width="331.034482758621" height="100" rx="8.13676204345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.103448275862" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--ok-text)">Inventory service</text>
  <text x="1033.103448275862" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--ok-text)">/inventory/*</text>

  <rect x="40" y="540" width="1200" height="80" rx="8.13676204345" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--warn-text)">Cross-cutting concerns live in one place</text>
  <text x="640" y="598" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--warn-text)">Each service can focus on business logic; gateway handles auth, rate limit, transforms</text>
</svg>

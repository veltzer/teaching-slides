<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Token Bucket Rate Limiting</text>

  <rect x="184.827586206897" y="87.889908256881" width="331.034482758621" height="276.697247706422" rx="14.689445752436" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="350.344827586207" y="130.45871559633" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--primary-text)">Bucket (capacity 100)</text>

  <rect x="226.206896551724" y="151.743119266055" width="41.379310344828" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="277.931034482759" y="151.743119266055" width="41.379310344828" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="329.655172413793" y="151.743119266055" width="41.379310344828" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="381.379310344828" y="151.743119266055" width="41.379310344828" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="433.103448275862" y="151.743119266055" width="41.379310344828" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="226.206896551724" y="204.954128440367" width="41.379310344828" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="277.931034482759" y="204.954128440367" width="41.379310344828" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="329.655172413793" y="204.954128440367" width="41.379310344828" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>

  <text x="350.344827586207" y="290.091743119266" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--primary-text)">Refills at 10 tokens/second</text>
  <text x="350.344827586207" y="316.697247706422" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--primary-text)">Each request consumes 1 token</text>
  <text x="350.344827586207" y="343.302752293578" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--primary-text)">Empty bucket -&gt; reject</text>

  <path d="M 536.551724137931 236.880733944954 L 660.689655172414 236.880733944954" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="598.620689655172" y="220.917431192661" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--text-muted)">request</text>

  <rect x="681.379310344828" y="173.02752293578" width="289.655172413793" height="127.706422018349" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="826.206896551724" y="215.596330275229" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--info-text)">Gateway</text>
  <text x="826.206896551724" y="247.522935779817" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--info-text)">tokens &gt; 0?</text>
  <text x="826.206896551724" y="274.128440366972" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--info-text)">consume + forward</text>

  <path d="M 991.724137931035 215.596330275229 L 1115.862068965517 173.02752293578" stroke="var(--ok-text)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="1053.793103448276" y="162.385321100917" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" font-weight="bold" fill="var(--ok-fill)">200 OK</text>

  <path d="M 991.724137931035 268.807339449541 L 1115.862068965517 311.376146788991" stroke="var(--danger-text)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <text x="1053.793103448276" y="337.981651376147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" font-weight="bold" fill="var(--danger-fill)">429 Too Many</text>

  <rect x="40" y="407.155963302752" width="382.758620689655" height="212.844036697248" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--ok-text)">Token bucket wins</text>
  <text x="60.689655172414" y="476.330275229358" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Allows short bursts</text>
  <text x="60.689655172414" y="502.935779816514" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Smooth average rate</text>
  <text x="60.689655172414" y="529.54128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Simple to reason about</text>
  <text x="60.689655172414" y="556.146788990826" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Per-key (user, IP, plan)</text>

  <rect x="448.620689655172" y="407.155963302752" width="382.758620689655" height="212.844036697248" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--warn-text)">Compare</text>
  <text x="469.310344827586" y="476.330275229358" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Fixed window: bursty boundary</text>
  <text x="469.310344827586" y="502.935779816514" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Sliding window: smoother</text>
  <text x="469.310344827586" y="529.54128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Leaky bucket: hard cap</text>
  <text x="469.310344827586" y="556.146788990826" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">- Token bucket: bursts OK</text>

  <rect x="857.241379310345" y="407.155963302752" width="382.758620689655" height="212.844036697248" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1048.620689655173" y="444.403669724771" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">Tell the client</text>
  <text x="877.931034482759" y="476.330275229358" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">X-RateLimit-Limit: 100</text>
  <text x="877.931034482759" y="502.935779816514" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">X-RateLimit-Remaining: 7</text>
  <text x="877.931034482759" y="529.54128440367" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">Retry-After: 30</text>
  <text x="877.931034482759" y="572.110091743119" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--text-muted)">Otherwise client retries blindly</text>
</svg>

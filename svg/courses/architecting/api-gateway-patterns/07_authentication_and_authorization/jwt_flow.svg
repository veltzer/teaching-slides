<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.478667152074" font-weight="bold" fill="var(--text)">Auth at the Gateway</text>

  <rect x="40" y="100" width="206.896551724138" height="100" rx="8.13676204345" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--info-text)">Client</text>
  <text x="143.448275862069" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--info-text)">Bearer JWT</text>
  <text x="143.448275862069" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--info-text)">in header</text>

  <path d="M 248.965517241379 150 L 383.448275862069 230" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="391.724137931034" y="200" width="289.655172413793" height="200" rx="14.239333576037" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="3" filter="url(#shadow)"/>
  <text x="536.551724137931" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.307714597762" font-weight="bold" fill="var(--primary-text)">Gateway</text>
  <text x="536.551724137931" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">- Verify JWT signature</text>
  <text x="536.551724137931" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">- Check expiry</text>
  <text x="536.551724137931" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">- Resolve user, scopes</text>
  <text x="536.551724137931" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">- Inject x-user-id header</text>
  <text x="536.551724137931" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">- Reject 401 if invalid</text>

  <path d="M 536.551724137931 80 L 536.551724137931 200" stroke="var(--text)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="552.068965517241" y="105" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--text-muted)">JWKS keys</text>

  <rect x="371.034482758621" y="40" width="331.034482758621" height="50" rx="6.102571532587" fill="url(#grad-warn)" filter="url(#shadow)"/>
  <text x="536.551724137931" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.239333576037" font-weight="bold" fill="var(--warn-text)">Auth provider (Auth0, Cognito, ...)</text>

  <path d="M 683.448275862069 280 L 838.620689655172 220" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 683.448275862069 310 L 838.620689655172 310" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 683.448275862069 340 L 838.620689655172 400" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="846.896551724138" y="180" width="331.034482758621" height="80" rx="8.13676204345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.413793103448" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--ok-text)">users svc</text>
  <text x="1012.413793103448" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--ok-text)">trusts gateway</text>

  <rect x="846.896551724138" y="270" width="331.034482758621" height="80" rx="8.13676204345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.413793103448" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--ok-text)">orders svc</text>
  <text x="1012.413793103448" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--ok-text)">no JWT parsing</text>

  <rect x="846.896551724138" y="360" width="331.034482758621" height="80" rx="8.13676204345" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.413793103448" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--ok-text)">billing svc</text>
  <text x="1012.413793103448" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.205143065175" fill="var(--ok-text)">reads x-user-id</text>

  <rect x="40" y="490" width="1200" height="130" rx="10.170952554312" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.273524086899" font-weight="bold" fill="var(--text)">Why centralize auth at the gateway</text>
  <text x="640" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--text-muted)">Each service doesn't reimplement auth. Internal traffic stays simple.</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--text-muted)">But: services must trust the gateway, and the gateway becomes critical infra.</text>
  <text x="640" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" font-style="italic" fill="var(--text-muted)">For zero-trust: re-verify at each service, cheaply (cached JWKS)</text>
</svg>

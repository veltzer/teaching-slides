<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.444476641212" font-weight="bold" fill="var(--text)">Order Saga (Orchestration)</text>

  <!-- Center: orchestrator -->
  <rect x="495.172413793103" y="260" width="289.655172413793" height="120" rx="14.239333576037" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.376095619487" font-weight="bold" fill="var(--warn-text)">Order Saga</text>
  <text x="640" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.256428831468" fill="var(--warn-text)">orchestrator</text>
  <text x="640" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--warn-text)">tracks state &amp; transitions</text>

  <!-- Participants around -->
  <rect x="40" y="140" width="206.896551724138" height="80" rx="14.239333576037" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.307714597762" font-weight="bold" fill="var(--primary-text)">Inventory</text>
  <text x="143.448275862069" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">reserve / release</text>

  <rect x="1033.103448275862" y="140" width="206.896551724138" height="80" rx="14.239333576037" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724137931" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.307714597762" font-weight="bold" fill="var(--primary-text)">Payment</text>
  <text x="1136.551724137931" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">capture / refund</text>

  <rect x="40" y="420" width="206.896551724138" height="80" rx="14.239333576037" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.448275862069" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.307714597762" font-weight="bold" fill="var(--primary-text)">Shipping</text>
  <text x="143.448275862069" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">schedule / cancel</text>

  <rect x="1033.103448275862" y="420" width="206.896551724138" height="80" rx="14.239333576037" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1136.551724137931" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.307714597762" font-weight="bold" fill="var(--primary-text)">Email</text>
  <text x="1136.551724137931" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" fill="var(--primary-text)">notify</text>

  <!-- Orchestrator commands them -->
  <path d="M 495.172413793103 280 L 246.896551724138 190" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 784.827586206897 280 L 1033.103448275862 190" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 495.172413793103 360 L 246.896551724138 450" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 784.827586206897 360 L 1033.103448275862 450" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <rect x="40" y="560" width="1200" height="60" rx="14.239333576037" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.256428831468" fill="var(--text)">Orchestrator owns the saga and commands each participant. Result events drive the state machine.</text>
  <text x="640" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.222238320606" font-style="italic" fill="var(--text-muted)">Operators have a single place to query saga status</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- TOP: synchronous -->
  <text x="100" y="40" font-family="Arial, sans-serif" font-size="23.814094799322" font-weight="bold" fill="var(--text)">Synchronous</text>
  <text x="320" y="40" font-family="Arial, sans-serif" font-size="15.154423963205" fill="var(--text-muted)">orchestrator blocks while participant runs</text>

  <rect x="60" y="86.868686868687" width="200" height="93.737373737374" rx="15.154423963205" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="133.737373737374" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.484259381264" font-weight="bold" fill="var(--primary-text)">Orchestrator</text>
  <text x="160" y="159.515151515152" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07196510869" fill="var(--primary-text)">waits for response</text>

  <rect x="540" y="86.868686868687" width="200" height="93.737373737374" rx="15.154423963205" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="133.737373737374" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.484259381264" font-weight="bold" fill="var(--warn-text)">Participant</text>
  <text x="640" y="159.515151515152" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07196510869" fill="var(--warn-text)">does the work</text>

  <path d="M 260 122.020202020202 L 540 122.020202020202" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="107.959595959596" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.154423963205" font-style="italic" fill="var(--text-muted)">HTTP / gRPC call</text>

  <path d="M 540 157.171717171717 L 260 157.171717171717" fill="none" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="180.606060606061" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.154423963205" font-style="italic" fill="var(--ok-accent)">200 OK</text>

  <text x="400" y="250.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07196510869" fill="var(--text-muted)">Simple. But the orchestrator's thread is held until the participant returns.</text>

  <!-- Divider -->
  <line x1="40" y1="321.212121212121" x2="1240" y2="321.212121212121" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- BOTTOM: async -->
  <text x="100" y="385.656565656566" font-family="Arial, sans-serif" font-size="23.814094799322" font-weight="bold" fill="var(--text)">Asynchronous</text>
  <text x="335" y="385.656565656566" font-family="Arial, sans-serif" font-size="15.154423963205" fill="var(--text-muted)">orchestrator emits a command event, awaits the result event</text>

  <rect x="60" y="426.666666666667" width="200" height="93.737373737374" rx="15.154423963205" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="479.393939393939" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.484259381264" font-weight="bold" fill="var(--primary-text)">Orchestrator</text>

  <rect x="500" y="426.666666666667" width="200" height="93.737373737374" rx="15.154423963205" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="479.393939393939" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.484259381264" font-weight="bold" fill="var(--info-text)">Broker</text>

  <rect x="940" y="426.666666666667" width="200" height="93.737373737374" rx="15.154423963205" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1040" y="479.393939393939" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.484259381264" font-weight="bold" fill="var(--warn-text)">Participant</text>

  <path d="M 260 461.818181818182 L 500 461.818181818182" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="447.757575757576" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07196510869" font-style="italic" fill="var(--text-muted)">CommandEvent</text>

  <path d="M 700 461.818181818182 L 940 461.818181818182" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 940 496.969696969697 L 700 496.969696969697" fill="none" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="520.40404040404" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07196510869" font-style="italic" fill="var(--ok-accent)">ResultEvent</text>

  <path d="M 500 496.969696969697 L 260 496.969696969697" fill="none" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.07196510869" fill="var(--text-muted)">Orchestrator and participant are decoupled in time. Default for production sagas.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.928480087538" font-weight="bold" fill="var(--text)">Workflow Engines</text>

  <!-- Temporal -->
  <rect x="40" y="129.230769230769" width="289.655172413793" height="223.076923076923" rx="15.038412354828" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.631790843301" font-weight="bold" fill="var(--primary-text)">Temporal</text>
  <text x="60.689655172414" y="218.461538461538" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--primary-text)">Workflows in code</text>
  <text x="60.689655172414" y="246.346153846154" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--primary-text)">Strong durability guarantees</text>
  <text x="60.689655172414" y="274.230769230769" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--primary-text)">Long-running workflows</text>
  <text x="60.689655172414" y="302.115384615385" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--primary-text)">Polyglot SDKs</text>
  <text x="60.689655172414" y="330" font-family="Arial, sans-serif" font-size="13.964240043769" font-style="italic" fill="var(--primary-text)">most popular today</text>

  <!-- Conductor -->
  <rect x="371.034482758621" y="129.230769230769" width="289.655172413793" height="223.076923076923" rx="15.038412354828" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="515.862068965517" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.631790843301" font-weight="bold" fill="var(--ok-text)">Conductor</text>
  <text x="391.724137931034" y="218.461538461538" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--ok-text)">JSON-defined workflows</text>
  <text x="391.724137931034" y="246.346153846154" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--ok-text)">Built by Netflix</text>
  <text x="391.724137931034" y="274.230769230769" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--ok-text)">Visual workflow editor</text>
  <text x="391.724137931034" y="302.115384615385" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--ok-text)">Java/Spring core</text>
  <text x="391.724137931034" y="330" font-family="Arial, sans-serif" font-size="13.964240043769" font-style="italic" fill="var(--ok-text)">good for ops-heavy teams</text>

  <!-- Camunda -->
  <rect x="702.068965517241" y="129.230769230769" width="289.655172413793" height="223.076923076923" rx="15.038412354828" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="846.896551724138" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.631790843301" font-weight="bold" fill="var(--warn-text)">Camunda</text>
  <text x="722.758620689655" y="218.461538461538" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--warn-text)">BPMN diagrams as code</text>
  <text x="722.758620689655" y="246.346153846154" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--warn-text)">Enterprise-friendly</text>
  <text x="722.758620689655" y="274.230769230769" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--warn-text)">Strong process modeling</text>
  <text x="722.758620689655" y="302.115384615385" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--warn-text)">Java first; SDKs available</text>
  <text x="722.758620689655" y="330" font-family="Arial, sans-serif" font-size="13.964240043769" font-style="italic" fill="var(--warn-text)">good for BA-driven work</text>

  <!-- Step Functions -->
  <rect x="1012.413793103448" y="129.230769230769" width="227.586206896552" height="223.076923076923" rx="15.038412354828" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.206896551724" y="173.846153846154" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.483446221183" font-weight="bold" fill="var(--info-text)">Step Functions</text>
  <text x="1033.103448275862" y="218.461538461538" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--info-text)">AWS-native</text>
  <text x="1033.103448275862" y="246.346153846154" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--info-text)">Serverless</text>
  <text x="1033.103448275862" y="274.230769230769" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--info-text)">JSON state language</text>
  <text x="1033.103448275862" y="302.115384615385" font-family="Arial, sans-serif" font-size="15.038412354828" fill="var(--info-text)">Tight AWS coupling</text>
  <text x="1033.103448275862" y="330" font-family="Arial, sans-serif" font-size="13.964240043769" font-style="italic" fill="var(--info-text)">all-AWS shops</text>

  <!-- Bottom comparison -->
  <rect x="40" y="430.384615384615" width="1200" height="189.615384615385" rx="15.038412354828" fill="var(--surface)" stroke="var(--border)" stroke-width="2"/>
  <text x="640" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.483446221183" font-weight="bold" fill="var(--text)">Common factors</text>
  <text x="81.379310344828" y="519.615384615385" font-family="Arial, sans-serif" font-size="17.186756976946" fill="var(--text-muted)">All persist workflow state and survive crashes / restarts</text>
  <text x="81.379310344828" y="553.076923076923" font-family="Arial, sans-serif" font-size="17.186756976946" fill="var(--text-muted)">All provide timers, retries, and visibility primitives</text>
  <text x="81.379310344828" y="586.538461538462" font-family="Arial, sans-serif" font-size="17.186756976946" fill="var(--text-muted)">All add operational complexity — pick when sagas are central to your domain</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="618.571428571429" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.236456474754" font-weight="bold" fill="var(--text)">Reactive Compensation Through Events</text>

  <!-- Services as columns -->
  <text x="125.714285714286" y="106.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--text)">Sales</text>
  <line x1="125.714285714286" y1="123.653846153846" x2="125.714285714286" y2="620" stroke="var(--border)" stroke-width="2"/>

  <text x="468.571428571429" y="106.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--text)">Inventory</text>
  <line x1="468.571428571429" y1="123.653846153846" x2="468.571428571429" y2="620" stroke="var(--border)" stroke-width="2"/>

  <text x="811.428571428571" y="106.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--text)">Payment</text>
  <line x1="811.428571428571" y1="123.653846153846" x2="811.428571428571" y2="620" stroke="var(--border)" stroke-width="2"/>

  <text x="1154.285714285714" y="106.923076923077" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.677342356065" font-weight="bold" fill="var(--text)">Email</text>
  <line x1="1154.285714285714" y1="123.653846153846" x2="1154.285714285714" y2="620" stroke="var(--border)" stroke-width="2"/>

  <!-- Forward events -->
  <rect x="40" y="151.538461538462" width="171.428571428571" height="44.615384615385" rx="6.559114118688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="125.714285714286" y="180.538461538462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--ok-text)">OrderPlaced</text>
  <path d="M 211.428571428571 173.846153846154 L 382.857142857143 218.461538461538" fill="none" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="382.857142857143" y="218.461538461538" width="171.428571428571" height="44.615384615385" rx="6.559114118688" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="468.571428571429" y="247.461538461538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--ok-text)">InventoryReserved</text>
  <path d="M 554.285714285714 240.769230769231 L 725.714285714286 285.384615384615" fill="none" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="725.714285714286" y="285.384615384615" width="171.428571428571" height="44.615384615385" rx="6.559114118688" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="811.428571428571" y="314.384615384615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--danger-text)">PaymentFailed</text>

  <!-- Compensation arrow back to Sales -->
  <path d="M 725.714285714286 307.692307692308 L 211.428571428571 352.307692307692" fill="none" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="352.307692307692" width="171.428571428571" height="44.615384615385" rx="6.559114118688" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="125.714285714286" y="381.307692307692" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--danger-text)">OrderCancelled</text>
  <path d="M 211.428571428571 374.615384615385 L 382.857142857143 419.230769230769" fill="none" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="382.857142857143" y="419.230769230769" width="171.428571428571" height="44.615384615385" rx="6.559114118688" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="468.571428571429" y="448.230769230769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--danger-text)">InventoryReleased</text>

  <!-- Email reacts -->
  <path d="M 211.428571428571 374.615384615385 L 1068.571428571429 486.153846153846" fill="none" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3 3"/>
  <rect x="1068.571428571429" y="486.153846153846" width="171.428571428571" height="44.615384615385" rx="6.559114118688" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1154.285714285714" y="515.153846153846" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.211413923825" fill="var(--danger-text)">ApologySent</text>

  <text x="618.571428571429" y="603.269230769231" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.304599610273" font-style="italic" fill="var(--text-muted)">Each service reacts to events; failure is just another event that drives compensations</text>
</svg>

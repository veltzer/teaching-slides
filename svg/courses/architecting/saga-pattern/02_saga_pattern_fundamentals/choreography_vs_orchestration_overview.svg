<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- LEFT: choreography -->
  <text x="308.965517241379" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--text)">Choreography</text>
  <text x="308.965517241379" y="66.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">events drive the next step</text>

  <rect x="40" y="124.363636363636" width="186.206896551724" height="63.272727272727" rx="10.444659357342" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="164.436363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.666989036013" fill="var(--primary-text)">Sales</text>

  <rect x="40" y="250.909090909091" width="186.206896551724" height="63.272727272727" rx="10.444659357342" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="290.981818181818" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.666989036013" fill="var(--primary-text)">Inventory</text>

  <rect x="40" y="377.454545454545" width="186.206896551724" height="63.272727272727" rx="10.444659357342" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="417.527272727273" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.666989036013" fill="var(--primary-text)">Payment</text>

  <rect x="40" y="504" width="186.206896551724" height="63.272727272727" rx="10.444659357342" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="133.103448275862" y="544.072727272727" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.666989036013" fill="var(--primary-text)">Shipping</text>

  <!-- Event arrows between participants -->
  <path d="M 133.103448275862 187.636363636364 L 133.103448275862 250.909090909091" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 133.103448275862 314.181818181818 L 133.103448275862 377.454545454545" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 133.103448275862 440.727272727273 L 133.103448275862 504" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="267.586206896552" y="224.545454545455" font-family="Arial, sans-serif" font-size="13.578057164544" font-style="italic" fill="var(--text-muted)">OrderPlaced</text>
  <text x="267.586206896552" y="351.090909090909" font-family="Arial, sans-serif" font-size="13.578057164544" font-style="italic" fill="var(--text-muted)">InventoryReserved</text>
  <text x="267.586206896552" y="477.636363636364" font-family="Arial, sans-serif" font-size="13.578057164544" font-style="italic" fill="var(--text-muted)">PaymentCaptured</text>

  <text x="308.965517241379" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" font-style="italic" fill="var(--text-faint)">No central authority</text>

  <!-- Vertical divider -->
  <line x1="640" y1="82.181818181818" x2="640" y2="588.363636363636" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- RIGHT: orchestration -->
  <text x="971.034482758621" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.978250586152" font-weight="bold" fill="var(--text)">Orchestration</text>
  <text x="971.034482758621" y="66.363636363636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--text-muted)">an orchestrator commands each step</text>

  <rect x="867.586206896552" y="240.363636363636" width="206.896551724138" height="105.454545454545" rx="14.622523100279" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="971.034482758621" y="282.545454545455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.800386843215" font-weight="bold" fill="var(--warn-text)">Order Saga</text>
  <text x="971.034482758621" y="308.909090909091" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">orchestrator</text>
  <text x="971.034482758621" y="331.054545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" fill="var(--warn-text)">(state machine)</text>

  <rect x="702.068965517241" y="124.363636363636" width="165.51724137931" height="63.272727272727" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.827586206897" y="164.436363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">Inventory</text>
  <rect x="1074.48275862069" y="124.363636363636" width="165.51724137931" height="63.272727272727" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="164.436363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">Payment</text>
  <rect x="702.068965517241" y="430.181818181818" width="165.51724137931" height="63.272727272727" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.827586206897" y="470.254545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">Shipping</text>
  <rect x="1074.48275862069" y="430.181818181818" width="165.51724137931" height="63.272727272727" rx="10.444659357342" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1157.241379310345" y="470.254545454545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.622523100279" fill="var(--ok-text)">Email</text>

  <path d="M 888.275862068966 261.454545454545 L 805.51724137931 187.636363636364" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1053.793103448276 261.454545454545 L 1136.551724137931 187.636363636364" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 888.275862068966 335.272727272727 L 805.51724137931 430.181818181818" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1053.793103448276 335.272727272727 L 1136.551724137931 430.181818181818" fill="none" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="971.034482758621" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.578057164544" font-style="italic" fill="var(--text-faint)">Orchestrator owns the state</text>
</svg>

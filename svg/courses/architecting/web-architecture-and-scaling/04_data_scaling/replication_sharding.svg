<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.473684210526" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.77236574717" font-weight="bold" fill="var(--text)">Replication vs Sharding</text>

  <text x="292.631578947368" y="99.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.265975533693" font-weight="bold" fill="var(--text-muted)">Replication (scale reads)</text>
  <text x="966.315789473684" y="99.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.265975533693" font-weight="bold" fill="var(--text-muted)">Sharding (scale writes)</text>
  <line x1="629.473684210526" y1="82.962962962963" x2="629.473684210526" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="166.315789473684" y="147.407407407407" width="252.631578947368" height="85.925925925926" rx="10.632987766846" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="292.631578947368" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.012780426954" font-weight="bold" fill="var(--primary-text)">Primary</text>
  <text x="292.631578947368" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--primary-text)">all writes</text>

  <rect x="40" y="319.259259259259" width="168.421052631579" height="85.925925925926" rx="10.632987766846" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="124.210526315789" y="356.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--ok-text)">Replica 1</text>
  <text x="124.210526315789" y="381.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--ok-text)">reads</text>

  <rect x="229.473684210526" y="319.259259259259" width="168.421052631579" height="85.925925925926" rx="10.632987766846" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313.684210526316" y="356.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--ok-text)">Replica 2</text>
  <text x="313.684210526316" y="381.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--ok-text)">reads</text>

  <rect x="418.947368421053" y="319.259259259259" width="168.421052631579" height="85.925925925926" rx="10.632987766846" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="503.157894736842" y="356.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--ok-text)">Replica 3</text>
  <text x="503.157894736842" y="381.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--ok-text)">reads</text>

  <path d="M 250.526315789474 233.333333333333 L 124.210526315789 319.259259259259" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 292.631578947368 233.333333333333 L 313.684210526316 319.259259259259" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 334.736842105263 233.333333333333 L 503.157894736842 319.259259259259" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="292.631578947368" y="458.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="40" y="488.962962962963" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--ok-accent)">+ scales reads linearly</text>
  <text x="40" y="512.592592592593" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--ok-accent)">+ HA via failover</text>
  <text x="40" y="539.444444444444" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--danger-accent)">- writes still single-node</text>
  <text x="40" y="564.148148148148" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--danger-accent)">- replica lag = stale reads</text>
  <text x="40" y="589.925925925926" font-family="Arial, sans-serif" font-size="13.8228840969" font-weight="bold" fill="var(--text)">Use: read-heavy workloads</text>

  <rect x="692.631578947368" y="147.407407407407" width="168.421052631579" height="85.925925925926" rx="10.632987766846" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="776.842105263158" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--warn-text)">Shard A</text>
  <text x="776.842105263158" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--warn-text)">users a-h</text>

  <rect x="882.105263157895" y="147.407407407407" width="168.421052631579" height="85.925925925926" rx="10.632987766846" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.315789473684" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--warn-text)">Shard B</text>
  <text x="966.315789473684" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--warn-text)">users i-q</text>

  <rect x="1071.578947368421" y="147.407407407407" width="168.421052631579" height="85.925925925926" rx="10.632987766846" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155.789473684211" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--warn-text)">Shard C</text>
  <text x="1155.789473684211" y="211.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.759585320216" fill="var(--warn-text)">users r-z</text>

  <rect x="692.631578947368" y="319.259259259259" width="547.368421052632" height="64.444444444444" rx="8.506390213477" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="966.315789473684" y="356.851851851852" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--info-text)">Routing layer (hash or range on shard key)</text>

  <path d="M 776.842105263158 233.333333333333 L 776.842105263158 319.259259259259" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 966.315789473684 233.333333333333 L 966.315789473684 319.259259259259" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1155.789473684211 233.333333333333 L 1155.789473684211 319.259259259259" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="966.315789473684" y="458.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.886182873585" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="692.631578947368" y="488.962962962963" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--ok-accent)">+ scales writes linearly</text>
  <text x="692.631578947368" y="512.592592592593" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--ok-accent)">+ scales storage</text>
  <text x="692.631578947368" y="539.444444444444" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--danger-accent)">- cross-shard queries hard</text>
  <text x="692.631578947368" y="564.148148148148" font-family="Arial, sans-serif" font-size="13.8228840969" fill="var(--danger-accent)">- resharding is painful</text>
  <text x="692.631578947368" y="589.925925925926" font-family="Arial, sans-serif" font-size="13.8228840969" font-weight="bold" fill="var(--text)">Use: write-heavy at scale</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Circuit Breaker State Machine</text>

  <rect x="147.142857142857" y="185" width="257.142857142857" height="165.714285714286" rx="14.747881203753" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="275.714285714286" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--ok-text)">CLOSED</text>
  <text x="275.714285714286" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-text)">requests flow</text>
  <text x="275.714285714286" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--ok-text)">count failures</text>
  <text x="275.714285714286" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">healthy state</text>

  <rect x="511.428571428571" y="185" width="257.142857142857" height="165.714285714286" rx="14.747881203753" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--danger-text)">OPEN</text>
  <text x="640" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-text)">reject all calls</text>
  <text x="640" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--danger-text)">return error fast</text>
  <text x="640" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-text)">protects downstream</text>

  <rect x="875.714285714286" y="185" width="257.142857142857" height="165.714285714286" rx="14.747881203753" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1004.285714285714" y="226.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--warn-text)">HALF-OPEN</text>
  <text x="1004.285714285714" y="262.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--warn-text)">trial request</text>
  <text x="1004.285714285714" y="286.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" fill="var(--warn-text)">probe recovery</text>
  <text x="1004.285714285714" y="324.821428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--warn-text)">testing the waters</text>

  <path d="M 404.285714285714 247.142857142857 L 511.428571428571 247.142857142857" fill="none" stroke="var(--danger-accent)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <text x="457.857142857143" y="231.607142857143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" font-weight="bold" fill="var(--danger-accent)">N failures</text>

  <path d="M 768.571428571429 267.857142857143 L 875.714285714286 267.857142857143" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="822.142857142857" y="252.321428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.641041031788" fill="var(--text-muted)">timeout elapsed</text>

  <path d="M 1004.285714285714 350.714285714286 Q 1004.285714285714 423.214285714286 275.714285714286 350.714285714286" fill="none" stroke="var(--ok-accent)" stroke-width="3" marker-end="url(#arrow-ok)"/>
  <text x="640" y="418.035714285714" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-accent)">trial succeeded → close</text>

  <path d="M 1004.285714285714 185 Q 704.285714285714 81.428571428571 640 185" fill="none" stroke="var(--danger-accent)" stroke-width="3" marker-end="url(#arrow-danger)"/>
  <text x="811.428571428571" y="117.678571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--danger-accent)">trial failed → re-open</text>

  <rect x="40" y="464.642857142857" width="578.571428571429" height="155.357142857143" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="329.285714285714" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Tuning</text>
  <text x="61.428571428571" y="524.714285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">failure threshold: 5 errors / 10 calls</text>
  <text x="61.428571428571" y="549.571428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">open timeout: 30 seconds</text>
  <text x="61.428571428571" y="574.428571428572" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">half-open: allow 1 trial</text>
  <text x="61.428571428571" y="599.285714285714" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">tune to downstream's recovery time</text>

  <rect x="661.428571428571" y="464.642857142857" width="578.571428571429" height="155.357142857143" rx="10.534200859823" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="950.714285714286" y="495.714285714286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.854721375717" font-weight="bold" fill="var(--text)">Why it works</text>
  <text x="682.857142857143" y="524.714285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Fails fast — no thread waiting</text>
  <text x="682.857142857143" y="549.571428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Sheds load from sick downstream</text>
  <text x="682.857142857143" y="574.428571428572" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Auto-recovers without human</text>
  <text x="682.857142857143" y="599.285714285714" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--ok-accent)">Pair with fallback for graceful UX</text>
</svg>

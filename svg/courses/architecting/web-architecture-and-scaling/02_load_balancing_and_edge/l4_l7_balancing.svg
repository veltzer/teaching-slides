<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.03701420285" font-weight="bold" fill="var(--text)">L4 vs L7 Load Balancing</text>

  <text x="297.142857142857" y="99.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.455010144893" font-weight="bold" fill="var(--text-muted)">L4 (transport)</text>
  <text x="982.857142857143" y="99.074074074074" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.455010144893" font-weight="bold" fill="var(--text-muted)">L7 (application)</text>
  <line x1="640" y1="82.962962962963" x2="640" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="40" y="147.407407407407" width="214.285714285714" height="64.444444444444" rx="8.582004057957" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.142857142857" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.09125760867" font-weight="bold" fill="var(--primary-text)">Client</text>

  <rect x="40" y="254.814814814815" width="514.285714285714" height="85.925925925926" rx="10.727505072446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.142857142857" y="292.407407407407" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--warn-text)">L4 LB</text>
  <text x="297.142857142857" y="319.259259259259" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--warn-text)">sees TCP packets, IPs, ports</text>

  <rect x="40" y="372.962962962963" width="160.714285714286" height="64.444444444444" rx="8.582004057957" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="120.357142857143" y="410.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.018507101425" font-weight="bold" fill="var(--info-text)">Backend 1</text>
  <rect x="216.785714285714" y="372.962962962963" width="160.714285714286" height="64.444444444444" rx="8.582004057957" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="297.142857142857" y="410.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.018507101425" font-weight="bold" fill="var(--info-text)">Backend 2</text>
  <rect x="393.571428571429" y="372.962962962963" width="160.714285714286" height="64.444444444444" rx="8.582004057957" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="473.928571428571" y="410.555555555556" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.018507101425" font-weight="bold" fill="var(--info-text)">Backend 3</text>

  <path d="M 147.142857142857 211.851851851852 L 190 254.814814814815" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 297.142857142857 340.740740740741 L 297.142857142857 372.962962962963" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 222.142857142857 340.740740740741 L 120.357142857143 372.962962962963" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 372.142857142857 340.740740740741 L 473.928571428571 372.962962962963" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="297.142857142857" y="485.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.018507101425" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="40" y="512.592592592593" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-accent)">+ very fast, low CPU</text>
  <text x="40" y="539.444444444444" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-accent)">+ protocol-agnostic</text>
  <text x="40" y="571.666666666667" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--danger-accent)">- can't route by URL or header</text>
  <text x="40" y="598.518518518519" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--danger-accent)">- can't terminate TLS</text>

  <rect x="725.714285714286" y="147.407407407407" width="214.285714285714" height="64.444444444444" rx="8.582004057957" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="832.857142857143" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.09125760867" font-weight="bold" fill="var(--primary-text)">Client</text>

  <rect x="725.714285714286" y="254.814814814815" width="514.285714285714" height="85.925925925926" rx="10.727505072446" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857142857143" y="287.037037037037" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.164008115914" font-weight="bold" fill="var(--warn-text)">L7 LB / API gateway</text>
  <text x="982.857142857143" y="313.888888888889" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--warn-text)">parses HTTP, sees URL, headers, cookies</text>

  <rect x="725.714285714286" y="372.962962962963" width="160.714285714286" height="64.444444444444" rx="8.582004057957" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="806.071428571429" y="399.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" font-weight="bold" fill="var(--info-text)">/api/*</text>
  <text x="806.071428571429" y="421.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.800255579691" fill="var(--info-text)">api pool</text>
  <rect x="902.5" y="372.962962962963" width="160.714285714286" height="64.444444444444" rx="8.582004057957" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="982.857142857143" y="399.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" font-weight="bold" fill="var(--info-text)">/static/*</text>
  <text x="982.857142857143" y="421.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.800255579691" fill="var(--info-text)">cache</text>
  <rect x="1079.285714285714" y="372.962962962963" width="160.714285714286" height="64.444444444444" rx="8.582004057957" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1159.642857142857" y="399.814814814815" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.94575659418" font-weight="bold" fill="var(--info-text)">/admin/*</text>
  <text x="1159.642857142857" y="421.296296296296" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.800255579691" fill="var(--info-text)">admin pool</text>

  <path d="M 832.857142857143 211.851851851852 L 875.714285714286 254.814814814815" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 897.142857142857 340.740740740741 L 806.071428571429 372.962962962963" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 982.857142857143 340.740740740741 L 982.857142857143 372.962962962963" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1068.571428571428 340.740740740741 L 1159.642857142857 372.962962962963" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="982.857142857143" y="485.740740740741" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.018507101425" font-weight="bold" fill="var(--text)">Properties</text>
  <text x="725.714285714286" y="512.592592592593" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-accent)">+ smart routing rules</text>
  <text x="725.714285714286" y="539.444444444444" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--ok-accent)">+ TLS, auth, rate limit</text>
  <text x="725.714285714286" y="571.666666666667" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--danger-accent)">- more CPU per request</text>
  <text x="725.714285714286" y="598.518518518519" font-family="Arial, sans-serif" font-size="13.94575659418" fill="var(--danger-accent)">- HTTP only</text>
</svg>

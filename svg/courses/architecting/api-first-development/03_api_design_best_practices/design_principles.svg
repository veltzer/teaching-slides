<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">API Design Principles</text>
  <rect x="40" y="80" width="290" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Consistency</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Same shape, same names</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Predictable everywhere</text>
  <text x="60" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Beats clever variation</text>
  <rect x="345" y="80" width="290" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Discoverability</text>
  <text x="365" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Names tell purpose</text>
  <text x="365" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Examples in spec</text>
  <text x="365" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Hyperlinks where useful</text>
  <rect x="650" y="80" width="290" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Robustness</text>
  <text x="670" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Lenient on input</text>
  <text x="670" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Strict on output</text>
  <text x="670" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Postel's law applies</text>
  <rect x="955" y="80" width="285" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Evolvability</text>
  <text x="975" y="155" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Add fields, never remove</text>
  <text x="975" y="185" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Version when forced</text>
  <text x="975" y="215" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Deprecate, then sunset</text>
</svg>

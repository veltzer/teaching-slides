<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Layers of API Documentation</text>
  <rect x="40" y="80" width="382" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Reference</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Generated from spec</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Every endpoint, model</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Always up to date</text>
  <rect x="448" y="80" width="382" height="540" rx="10" fill="url(#grad-primary)" stroke="url(#grad-primary)" stroke-width="0"/>
  <rect x="448" y="80" width="382" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Guides</text>
  <text x="468" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">"How to do X"</text>
  <text x="468" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Auth, pagination, errors</text>
  <text x="468" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Hand-written, versioned</text>
  <rect x="856" y="80" width="382" height="540" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Examples</text>
  <text x="876" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Quickstart in 5 minutes</text>
  <text x="876" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Curl + SDK each</text>
  <text x="876" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">Tested in CI</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.727393858384" font-weight="bold" fill="var(--text)">API-First Workflow</text>

  <rect x="40" y="90.877192982456" width="1200" height="101.754385964912" rx="10.259783520852" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.519567041703" font-weight="bold" fill="var(--danger-text)">Code-first (traditional)</text>
  <text x="640" y="157.017543859649" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.363696929192" fill="var(--danger-text)">Build server -&gt; generate docs from code -&gt; consumers find issues at integration</text>
  <text x="640" y="180.421052631579" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--danger-text)">Late discovery, contract drift</text>

  <rect x="40" y="233.333333333333" width="1200" height="122.105263157895" rx="10.259783520852" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="274.035087719298" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.519567041703" font-weight="bold" fill="var(--ok-text)">API-first</text>

  <rect x="60.689655172414" y="289.298245614035" width="206.896551724138" height="50.877192982456" rx="6.155870112511" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="164.137931034483" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.363696929192" font-weight="bold" fill="var(--text)">1. OpenAPI spec</text>
  <path d="M 269.655172413793 314.736842105263 L 311.034482758621 314.736842105263" stroke="var(--ok-text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="317.241379310345" y="289.298245614035" width="206.896551724138" height="50.877192982456" rx="6.155870112511" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="420.689655172414" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.363696929192" font-weight="bold" fill="var(--text)">2. Review with team</text>
  <path d="M 526.206896551724 314.736842105263 L 567.586206896552 314.736842105263" stroke="var(--ok-text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="573.793103448276" y="289.298245614035" width="206.896551724138" height="50.877192982456" rx="6.155870112511" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="677.241379310345" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.363696929192" font-weight="bold" fill="var(--text)">3. Generate stubs</text>
  <path d="M 782.758620689655 314.736842105263 L 824.137931034483 314.736842105263" stroke="var(--ok-text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="830.344827586207" y="289.298245614035" width="206.896551724138" height="50.877192982456" rx="6.155870112511" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="933.793103448276" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.363696929192" font-weight="bold" fill="var(--text)">4. Mock + impl parallel</text>
  <path d="M 1039.310344827586 314.736842105263 L 1080.689655172414 314.736842105263" stroke="var(--ok-text)" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1086.896551724138" y="289.298245614035" width="134.48275862069" height="50.877192982456" rx="6.155870112511" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1154.137931034483" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.363696929192" font-weight="bold" fill="var(--text)">5. Ship</text>

  <rect x="40" y="396.140350877193" width="382.758620689655" height="223.859649122807" rx="10.259783520852" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="431.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.467610337533" font-weight="bold" fill="var(--primary-text)">Wins</text>
  <text x="60.689655172414" y="462.280701754386" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--primary-text)">- Contract reviewed early</text>
  <text x="60.689655172414" y="487.719298245614" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--primary-text)">- Server + client in parallel</text>
  <text x="60.689655172414" y="513.157894736842" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--primary-text)">- Auto-generated SDKs</text>
  <text x="60.689655172414" y="538.59649122807" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--primary-text)">- Docs always in sync</text>
  <text x="60.689655172414" y="564.035087719298" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--primary-text)">- Mock servers for testing</text>

  <rect x="448.620689655172" y="396.140350877193" width="382.758620689655" height="223.859649122807" rx="10.259783520852" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="431.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.467610337533" font-weight="bold" fill="var(--info-text)">Tools</text>
  <text x="469.310344827586" y="462.280701754386" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--info-text)">- OpenAPI / Swagger</text>
  <text x="469.310344827586" y="487.719298245614" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--info-text)">- Stoplight, Postman</text>
  <text x="469.310344827586" y="513.157894736842" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--info-text)">- openapi-generator</text>
  <text x="469.310344827586" y="538.59649122807" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--info-text)">- Prism (mock server)</text>
  <text x="469.310344827586" y="564.035087719298" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--info-text)">- Spectral (linter)</text>

  <rect x="857.241379310345" y="396.140350877193" width="382.758620689655" height="223.859649122807" rx="10.259783520852" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="431.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.467610337533" font-weight="bold" fill="var(--warn-text)">Watch out</text>
  <text x="877.931034482759" y="462.280701754386" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--warn-text)">- Spec drift from impl</text>
  <text x="877.931034482759" y="487.719298245614" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--warn-text)">- Verbose YAML</text>
  <text x="877.931034482759" y="513.157894736842" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--warn-text)">- Tooling integration</text>
  <text x="877.931034482759" y="538.59649122807" font-family="Arial, sans-serif" font-size="13.337718577107" fill="var(--warn-text)">- Tests must check spec</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs/>

  <text x="640" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">OpenAPI 3.x Document Structure</text>

  <rect x="60" y="100" width="560" height="500" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="80" y="130" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">openapi: 3.1.0</text>
  <text x="80" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-fill)">info:</text>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">title: Pet Store API</text>
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">version: 1.0.0</text>
  <text x="80" y="230" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--primary-fill)">servers:</text>
  <text x="100" y="250" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- url: https://api.example.com</text>
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--ok-fill)">paths:</text>
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">/pets:</text>
  <text x="120" y="320" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">get:</text>
  <text x="140" y="340" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">summary: List pets</text>
  <text x="140" y="360" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">responses:</text>
  <text x="160" y="380" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">'200':</text>
  <text x="180" y="400" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">$ref: '#/components/...</text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--warn-fill)">components:</text>
  <text x="100" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">schemas:</text>
  <text x="120" y="470" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Pet:</text>
  <text x="140" y="490" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">type: object</text>
  <text x="140" y="510" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">properties: ...</text>
  <text x="80" y="545" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="var(--info-fill)">security:</text>
  <text x="100" y="565" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">- bearerAuth: []</text>

  <rect x="660" y="100" width="560" height="240" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-text)">Reusability via $ref</text>
  <text x="680" y="170" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Define once in components</text>
  <text x="680" y="195" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Reference everywhere</text>
  <text x="680" y="240" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">- Schemas (data shapes)</text>
  <text x="680" y="265" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">- Parameters (common query/path)</text>
  <text x="680" y="290" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">- Responses (error envelope)</text>
  <text x="680" y="315" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">- Security schemes</text>

  <rect x="660" y="380" width="560" height="220" rx="10" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-text)">From spec, you get</text>
  <text x="680" y="450" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Mock server (Prism)</text>
  <text x="680" y="475" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Client SDKs (openapi-generator)</text>
  <text x="680" y="500" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Server stubs</text>
  <text x="680" y="525" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Interactive docs (Swagger UI)</text>
  <text x="680" y="555" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">- Contract tests</text>
  <text x="680" y="580" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="var(--ok-text)">Single source of truth</text>
</svg>

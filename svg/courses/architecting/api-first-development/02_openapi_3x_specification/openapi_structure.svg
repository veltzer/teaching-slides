<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">OpenAPI 3.x Document Structure</text>

  <rect x="40" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="60.689655172414" y="119.816513761468" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">openapi: 3.1.0</text>
  <text x="60.689655172414" y="151.743119266055" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--primary-fill)">info:</text>
  <text x="81.379310344828" y="173.02752293578" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">title: Pet Store API</text>
  <text x="81.379310344828" y="194.311926605505" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">version: 1.0.0</text>
  <text x="60.689655172414" y="226.238532110092" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--primary-fill)">servers:</text>
  <text x="81.379310344828" y="247.522935779817" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- url: https://api.example.com</text>
  <text x="60.689655172414" y="279.449541284404" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--ok-fill)">paths:</text>
  <text x="81.379310344828" y="300.733944954128" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">/pets:</text>
  <text x="102.068965517241" y="322.018348623853" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">get:</text>
  <text x="122.758620689655" y="343.302752293578" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">summary: List pets</text>
  <text x="122.758620689655" y="364.587155963303" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">responses:</text>
  <text x="143.448275862069" y="385.871559633028" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">'200':</text>
  <text x="164.137931034483" y="407.155963302752" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">$ref: '#/components/...</text>
  <text x="60.689655172414" y="439.082568807339" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--warn-fill)">components:</text>
  <text x="81.379310344828" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">schemas:</text>
  <text x="102.068965517241" y="481.651376146789" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">Pet:</text>
  <text x="122.758620689655" y="502.935779816514" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">type: object</text>
  <text x="122.758620689655" y="524.220183486239" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">properties: ...</text>
  <text x="60.689655172414" y="561.467889908257" font-family="Arial, sans-serif" font-size="13.640199627262" font-weight="bold" fill="var(--info-fill)">security:</text>
  <text x="81.379310344828" y="582.752293577982" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--text)">- bearerAuth: []</text>

  <rect x="660.689655172414" y="87.889908256881" width="579.310344827586" height="255.412844036697" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--primary-text)">Reusability via $ref</text>
  <text x="681.379310344828" y="162.385321100917" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Define once in components</text>
  <text x="681.379310344828" y="188.990825688073" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Reference everywhere</text>
  <text x="681.379310344828" y="236.880733944954" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Schemas (data shapes)</text>
  <text x="681.379310344828" y="263.48623853211" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Parameters (common query/path)</text>
  <text x="681.379310344828" y="290.091743119266" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Responses (error envelope)</text>
  <text x="681.379310344828" y="316.697247706422" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">- Security schemes</text>

  <rect x="660.689655172414" y="385.871559633028" width="579.310344827586" height="234.128440366972" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="423.119266055046" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--ok-text)">From spec, you get</text>
  <text x="681.379310344828" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Mock server (Prism)</text>
  <text x="681.379310344828" y="486.97247706422" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Client SDKs (openapi-generator)</text>
  <text x="681.379310344828" y="513.577981651376" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Server stubs</text>
  <text x="681.379310344828" y="540.183486238532" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Interactive docs (Swagger UI)</text>
  <text x="681.379310344828" y="572.110091743119" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Contract tests</text>
  <text x="681.379310344828" y="598.715596330275" font-family="Arial, sans-serif" font-size="12.590953502088" font-style="italic" fill="var(--ok-text)">Single source of truth</text>
</svg>

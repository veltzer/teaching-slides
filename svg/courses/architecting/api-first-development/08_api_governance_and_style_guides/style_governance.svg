<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <metadata><type>regular</type></metadata>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="var(--text)">Governance Without Bottlenecks</text>
  <rect x="40" y="80" width="382" height="540" rx="10" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Style guide</text>
  <text x="60" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Naming conventions</text>
  <text x="60" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Error format</text>
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">Pagination shape</text>
  <text x="60" y="280" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--info-text)">Decisions, not aesthetics</text>
  <rect x="448" y="80" width="382" height="540" rx="10" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Linters</text>
  <text x="468" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Spectral, Vacuum</text>
  <text x="468" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Run in CI on every spec</text>
  <text x="468" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">Block PR on violation</text>
  <text x="468" y="280" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--primary-text)">Robots enforce, humans review</text>
  <rect x="856" y="80" width="382" height="540" rx="10" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1047" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Review board</text>
  <text x="876" y="160" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">For new public APIs</text>
  <text x="876" y="190" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Cross-team architects</text>
  <text x="876" y="220" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">Scheduled, time-boxed</text>
  <text x="876" y="280" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--warn-text)">Don't gate every change</text>
</svg>

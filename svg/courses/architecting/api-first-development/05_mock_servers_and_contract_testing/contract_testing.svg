<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.520241619536" font-weight="bold" fill="var(--text)">Consumer-Driven Contract Testing</text>

  <rect x="60.689655172414" y="114.653465346535" width="248.275862068966" height="137.821782178218" rx="10.900086292691" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.827586206897" y="154.851485148515" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.440138068306" font-weight="bold" fill="var(--info-text)">Consumer</text>
  <text x="184.827586206897" y="183.564356435644" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--info-text)">writes test against</text>
  <text x="184.827586206897" y="206.534653465347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--info-text)">a mock provider</text>
  <text x="184.827586206897" y="235.247524752475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.08010355123" font-style="italic" fill="var(--info-text)">declares expectations</text>

  <path d="M 311.034482758621 183.564356435644 L 476.551724137931 183.564356435644" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="391.724137931034" y="172.079207920792" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.170112180499" font-weight="bold" fill="var(--text-muted)">contract.json</text>

  <rect x="484.827586206897" y="114.653465346535" width="289.655172413793" height="137.821782178218" rx="10.900086292691" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.655172413793" y="154.851485148515" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.440138068306" font-weight="bold" fill="var(--primary-text)">Pact Broker</text>
  <text x="629.655172413793" y="183.564356435644" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--primary-text)">stores contracts</text>
  <text x="629.655172413793" y="206.534653465347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--primary-text)">+ verification status</text>

  <path d="M 776.551724137931 183.564356435644 L 942.068965517241 183.564356435644" stroke="var(--text)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="857.241379310345" y="172.079207920792" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.170112180499" font-weight="bold" fill="var(--text-muted)">verify</text>

  <rect x="950.344827586207" y="114.653465346535" width="248.275862068966" height="137.821782178218" rx="10.900086292691" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.48275862069" y="154.851485148515" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.440138068306" font-weight="bold" fill="var(--ok-text)">Provider</text>
  <text x="1074.48275862069" y="183.564356435644" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--ok-text)">replays contract</text>
  <text x="1074.48275862069" y="206.534653465347" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--ok-text)">against real impl</text>
  <text x="1074.48275862069" y="235.247524752475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.08010355123" font-style="italic" fill="var(--ok-text)">pass / fail = report</text>

  <rect x="40" y="298.415841584158" width="382.758620689655" height="321.584158415842" rx="10.900086292691" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="338.613861386139" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.620155326845" font-weight="bold" fill="var(--warn-text)">Why not E2E only?</text>
  <text x="60.689655172414" y="378.811881188119" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--warn-text)">- Slow, brittle</text>
  <text x="60.689655172414" y="407.524752475248" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--warn-text)">- All teams in one env</text>
  <text x="60.689655172414" y="436.237623762376" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--warn-text)">- Hard to diagnose</text>
  <text x="60.689655172414" y="487.920792079208" font-family="Arial, sans-serif" font-size="14.170112180499" font-weight="bold" fill="var(--warn-text)">Contracts run in unit tests</text>
  <text x="60.689655172414" y="522.376237623762" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--warn-text)">Fast and isolated</text>
  <text x="60.689655172414" y="579.80198019802" font-family="Arial, sans-serif" font-size="13.08010355123" font-style="italic" fill="var(--warn-text)">Each side tested separately</text>

  <rect x="448.620689655172" y="298.415841584158" width="791.379310344828" height="321.584158415842" rx="10.900086292691" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="844.827586206897" y="338.613861386139" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.620155326845" font-weight="bold" fill="var(--text)">Mock servers (development)</text>
  <text x="469.310344827586" y="378.811881188119" font-family="Arial, sans-serif" font-size="15.260120809768" font-weight="bold" fill="var(--text)">Prism (Stoplight)</text>
  <text x="660.689655172414" y="378.811881188119" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--text-muted)">runs OpenAPI spec as fake server</text>
  <text x="469.310344827586" y="419.009900990099" font-family="Arial, sans-serif" font-size="15.260120809768" font-weight="bold" fill="var(--text)">WireMock</text>
  <text x="660.689655172414" y="419.009900990099" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--text-muted)">scenario-based stubs</text>
  <text x="469.310344827586" y="459.207920792079" font-family="Arial, sans-serif" font-size="15.260120809768" font-weight="bold" fill="var(--text)">Postman mock</text>
  <text x="660.689655172414" y="459.207920792079" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--text-muted)">collection-driven</text>
  <text x="469.310344827586" y="522.376237623762" font-family="Arial, sans-serif" font-size="14.170112180499" font-weight="bold" fill="var(--text)">Mock unblocks frontend</text>
  <text x="469.310344827586" y="551.089108910891" font-family="Arial, sans-serif" font-size="14.170112180499" fill="var(--text-muted)">Contract verifies backend</text>
  <text x="469.310344827586" y="591.287128712871" font-family="Arial, sans-serif" font-size="14.170112180499" font-style="italic" fill="var(--text-muted)">Use both</text>
</svg>

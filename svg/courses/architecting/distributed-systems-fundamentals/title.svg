<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata><type>title</type></metadata>
  <defs><style id="palette-vars">:root, svg { --bg: #ffffff; --surface: #f5f5f5; --border: #e0e0e0; --text: #212121; --text-muted: #555555; --text-faint: #888888; --code-bg: #1a1a2e; --black: #000000; --primary-fill: #2196f3; --primary-border: #1565c0; --primary-text: #ffffff; --primary-accent: #0d47a1; --ok-fill: #4caf50; --ok-border: #2e7d32; --ok-text: #ffffff; --ok-accent: #1b5e20; --warn-fill: #ff9800; --warn-border: #e65100; --warn-text: #ffffff; --warn-accent: #bf360c; --danger-fill: #e74c3c; --danger-border: #c62828; --danger-text: #ffffff; --danger-accent: #b71c1c; --info-fill: #9c27b0; --info-border: #6a1b9a; --info-text: #ffffff; --info-accent: #4a148c; }</style></defs>
  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Distributed Systems Fundamentals</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">CAP, consensus, clocks, replication</text>
  <ellipse cx="400" cy="380" rx="60" ry="60" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="400" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Node A</text>
  <ellipse cx="640" cy="320" rx="60" ry="60" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Node B</text>
  <ellipse cx="880" cy="380" rx="60" ry="60" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="880" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Node C</text>
  <ellipse cx="640" cy="480" rx="60" ry="60" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="640" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--info-text)" font-family="Arial, sans-serif">Node D</text>
  <line x1="460" y1="380" x2="580" y2="320" stroke="var(--surface)" stroke-width="2"/>
  <line x1="700" y1="320" x2="820" y2="380" stroke="var(--surface)" stroke-width="2"/>
  <line x1="460" y1="380" x2="820" y2="380" stroke="var(--surface)" stroke-width="2"/>
  <line x1="640" y1="380" x2="640" y2="420" stroke="var(--surface)" stroke-width="2"/>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">CAP &#8226; consistency &#8226; consensus &#8226; CRDTs &#8226; partitioning &#8226; replication &#8226; failures</text>

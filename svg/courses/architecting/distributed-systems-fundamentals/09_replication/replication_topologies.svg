<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Replication Topologies</text>

  <rect x="40" y="87.889908256881" width="382.758620689655" height="297.981651376147" rx="10.49246125174" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="231.379310344828" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--primary-text)">Single leader</text>
  <rect x="184.827586206897" y="151.743119266055" width="93.103448275862" height="53.211009174312" rx="6.295476751044" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="231.379310344828" y="183.669724770642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">Leader</text>
  <path d="M 231.379310344828 210.275229357798 L 133.103448275862 268.807339449541" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 231.379310344828 210.275229357798 L 231.379310344828 268.807339449541" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 231.379310344828 210.275229357798 L 329.655172413793 268.807339449541" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="102.068965517241" y="279.449541284404" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="200.344827586207" y="279.449541284404" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="298.620689655172" y="279.449541284404" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="60.689655172414" y="353.94495412844" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--primary-text)">Writes go to leader only</text>

  <rect x="448.620689655172" y="87.889908256881" width="382.758620689655" height="297.981651376147" rx="10.49246125174" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--warn-text)">Multi-leader</text>
  <rect x="484.827586206897" y="173.02752293578" width="82.758620689655" height="53.211009174312" rx="6.295476751044" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="526.206896551724" y="204.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">Leader A</text>
  <rect x="712.413793103448" y="173.02752293578" width="82.758620689655" height="53.211009174312" rx="6.295476751044" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="753.793103448276" y="204.954128440367" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.590953502088" fill="var(--ok-text)">Leader B</text>
  <path d="M 567.586206896552 194.311926605505 L 712.413793103448 194.311926605505" stroke="var(--text)" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M 526.206896551724 226.238532110092 L 526.206896551724 279.449541284404" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 753.793103448276 226.238532110092 L 753.793103448276 279.449541284404" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="495.172413793103" y="290.091743119266" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-info)" filter="url(#shadow)"/>
  <rect x="722.758620689655" y="290.091743119266" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-info)" filter="url(#shadow)"/>
  <text x="469.310344827586" y="359.266055045872" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--warn-text)">Multi-region writes; conflicts</text>

  <rect x="857.241379310345" y="87.889908256881" width="382.758620689655" height="297.981651376147" rx="10.49246125174" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1048.620689655173" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--info-text)">Leaderless</text>
  <rect x="908.965517241379" y="173.02752293578" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="1017.586206896552" y="173.02752293578" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="1126.206896551724" y="173.02752293578" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="908.965517241379" y="268.807339449541" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="1017.586206896552" y="268.807339449541" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <rect x="1126.206896551724" y="268.807339449541" width="62.068965517241" height="42.56880733945" rx="4.196984500696" fill="url(#grad-ok)" filter="url(#shadow)"/>
  <text x="877.931034482759" y="359.266055045872" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--info-text)">Quorum reads/writes (Cassandra)</text>

  <rect x="40" y="428.440366972477" width="1200" height="191.559633027523" rx="10.49246125174" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="465.688073394495" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.886430253132" font-weight="bold" fill="var(--text)">Sync vs async replication</text>
  <text x="60.689655172414" y="502.935779816514" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">Sync: leader waits for follower ack -&gt; durable, slow</text>
  <text x="60.689655172414" y="534.862385321101" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">Async: leader replies before replication -&gt; fast, can lose data on crash</text>
  <text x="60.689655172414" y="572.110091743119" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--text)">Quorum (W+R&gt;N) gives consistency without sync to all</text>
  <text x="60.689655172414" y="604.036697247706" font-family="Arial, sans-serif" font-size="13.640199627262" font-style="italic" fill="var(--text-muted)">Postgres synchronous_standby_names; MySQL semi-sync</text>
</svg>

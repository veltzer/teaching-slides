<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.364960155869" font-weight="bold" fill="var(--text)">The Strangler Pattern Over Time</text>

  <text x="190" y="101.592920353982" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.877474385916" font-weight="bold" fill="var(--text-muted)">Phase 1: Wrap</text>
  <text x="640" y="101.592920353982" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.877474385916" font-weight="bold" fill="var(--text-muted)">Phase 2: Carve</text>
  <text x="1090" y="101.592920353982" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.877474385916" font-weight="bold" fill="var(--text-muted)">Phase 3: Retire</text>

  <rect x="40" y="142.654867256637" width="300" height="61.592920353982" rx="8.389988615962" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="178.58407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.779977231925" font-weight="bold" fill="var(--warn-text)">Router</text>

  <rect x="40" y="245.309734513274" width="300" height="225.840707964602" rx="8.389988615962" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="368.495575221239" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.974971539906" font-weight="bold" fill="var(--info-text)">Legacy</text>

  <path d="M 190 204.247787610619 L 190 245.309734513274" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="490" y="142.654867256637" width="300" height="61.592920353982" rx="8.389988615962" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="178.58407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.779977231925" font-weight="bold" fill="var(--warn-text)">Router</text>

  <rect x="490" y="245.309734513274" width="144.642857142857" height="225.840707964602" rx="8.389988615962" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="561.785714285714" y="368.495575221239" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.779977231925" font-weight="bold" fill="var(--info-text)">Legacy</text>

  <rect x="645.357142857143" y="245.309734513274" width="144.642857142857" height="225.840707964602" rx="8.389988615962" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="717.142857142857" y="368.495575221239" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.779977231925" font-weight="bold" fill="var(--ok-text)">New</text>

  <path d="M 561.785714285714 204.247787610619 L 561.785714285714 245.309734513274" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 717.142857142857 204.247787610619 L 717.142857142857 245.309734513274" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="940" y="142.654867256637" width="300" height="61.592920353982" rx="8.389988615962" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="178.58407079646" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.779977231925" font-weight="bold" fill="var(--warn-text)">Router</text>

  <rect x="940" y="245.309734513274" width="300" height="225.840707964602" rx="8.389988615962" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="368.495575221239" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.974971539906" font-weight="bold" fill="var(--ok-text)">New</text>

  <path d="M 1090 204.247787610619 L 1090 245.309734513274" fill="none" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="190" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--text-muted)">All traffic via router</text>
  <text x="190" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--text-muted)">No internal change yet</text>

  <text x="640" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--text-muted)">Slice carved out</text>
  <text x="640" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--text-muted)">Per-feature routing</text>

  <text x="1090" y="512.212389380531" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--text-muted)">Legacy decommissioned</text>
  <text x="1090" y="532.743362831858" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--text-muted)">Router still in place</text>

  <rect x="40" y="578.938053097345" width="1200" height="41.061946902655" rx="6.292491461972" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="604.601769911504" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.682480077934" fill="var(--text-muted)">Long timeline by design — each carve is small, reviewable, reversible</text>
</svg>

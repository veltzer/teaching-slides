<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.495762407505" font-weight="bold" fill="var(--text)">Two-Speed Team Structure</text>

  <rect x="40" y="102.142857142857" width="578.571428571429" height="435" rx="10.534200859823" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.285714285714" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--info-text)">Caretaker team</text>
  <text x="329.285714285714" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.801301289735" fill="var(--info-text)">keeps legacy alive</text>

  <text x="61.428571428571" y="226.428571428571" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">Cadence</text>
  <text x="61.428571428571" y="252.321428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">slow, careful releases</text>
  <text x="61.428571428571" y="273.035714285714" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">stability over features</text>

  <text x="61.428571428571" y="309.285714285714" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">Work</text>
  <text x="61.428571428571" y="335.178571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">bug fixes, security patches</text>
  <text x="61.428571428571" y="355.892857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">compliance updates</text>
  <text x="61.428571428571" y="376.607142857143" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">incident response</text>

  <text x="61.428571428571" y="412.857142857143" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--info-text)">Skills</text>
  <text x="61.428571428571" y="438.75" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">deep legacy knowledge</text>
  <text x="61.428571428571" y="459.464285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--info-text)">production debugging</text>
  <text x="61.428571428571" y="490.535714285714" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--danger-accent)">risk: career stagnation</text>

  <rect x="661.428571428571" y="102.142857142857" width="578.571428571429" height="435" rx="10.534200859823" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.714285714286" y="143.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.068401719647" font-weight="bold" fill="var(--ok-text)">Builder team</text>
  <text x="950.714285714286" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.801301289735" fill="var(--ok-text)">delivers the new</text>

  <text x="682.857142857143" y="226.428571428571" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-text)">Cadence</text>
  <text x="682.857142857143" y="252.321428571429" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">fast, modern CI/CD</text>
  <text x="682.857142857143" y="273.035714285714" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">features over polish</text>

  <text x="682.857142857143" y="309.285714285714" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-text)">Work</text>
  <text x="682.857142857143" y="335.178571428571" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">new architecture</text>
  <text x="682.857142857143" y="355.892857142857" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">strangler carving</text>
  <text x="682.857142857143" y="376.607142857143" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">migration tooling</text>

  <text x="682.857142857143" y="412.857142857143" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--ok-text)">Skills</text>
  <text x="682.857142857143" y="438.75" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">modern stack</text>
  <text x="682.857142857143" y="459.464285714286" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--ok-text)">cloud-native patterns</text>
  <text x="682.857142857143" y="490.535714285714" font-family="Arial, sans-serif" font-size="13.69446111777" font-weight="bold" fill="var(--danger-accent)">risk: ignore legacy reality</text>

  <path d="M 618.571428571429 319.642857142857 L 661.428571428571 319.642857142857" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 661.428571428571 340.357142857143 L 618.571428571429 340.357142857143" fill="none" stroke="var(--text-muted)" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="640" y="371.428571428571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">rotate</text>

  <rect x="40" y="557.857142857143" width="1200" height="62.142857142857" rx="8.427360687859" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="583.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.747881203753" font-weight="bold" fill="var(--text)">Rotate engineers between teams to share knowledge</text>
  <text x="640" y="607.571428571429" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.69446111777" fill="var(--text-muted)">Same people splitting focus does both jobs poorly</text>
</svg>

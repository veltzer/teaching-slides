<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars" data-theme="intro">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --code-text: #f5f5f5;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--text-muted)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--primary-border)"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--ok-border)"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--warn-border)"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--danger-border)"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--info-border)"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="var(--bg)"/>
    </marker>
  </defs>
<rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>
<text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Legacy Modernization</text>
<text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">Mark Veltzer</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="550" y="196" width="180" height="50" rx="10" fill="var(--warn-fill)"/>
  <text x="640" y="228" font-size="20" fill="var(--warn-text)">Router</text>
  <line x1="640" y1="246" x2="640" y2="264" stroke="var(--text-faint)" stroke-width="3"/>
  <line x1="380" y1="264" x2="900" y2="264" stroke="var(--text-faint)" stroke-width="3"/>
  <line x1="380" y1="264" x2="380" y2="280" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="372,278 380,290 388,278" fill="var(--text-faint)"/>
  <line x1="900" y1="264" x2="900" y2="280" stroke="var(--text-faint)" stroke-width="3"/>
  <polygon points="892,278 900,290 908,278" fill="var(--text-faint)"/>
  <rect x="200" y="292" width="360" height="170" rx="12" fill="none" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="380" y="322" font-size="18" font-weight="bold" fill="var(--danger-fill)">Legacy</text>
  <rect x="230" y="338" width="300" height="46" rx="8" fill="var(--danger-fill)"/>
  <text x="380" y="368" font-size="18" fill="var(--danger-text)">Billing</text>
  <rect x="230" y="398" width="300" height="46" rx="8" fill="var(--danger-fill)"/>
  <text x="380" y="428" font-size="18" fill="var(--danger-text)">Reports</text>
  <rect x="720" y="292" width="360" height="170" rx="12" fill="none" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="900" y="322" font-size="18" font-weight="bold" fill="var(--ok-fill)">Modern</text>
  <rect x="750" y="338" width="300" height="46" rx="8" fill="var(--ok-fill)"/>
  <text x="900" y="368" font-size="18" fill="var(--ok-text)">Orders</text>
  <rect x="750" y="398" width="300" height="46" rx="8" fill="var(--ok-fill)"/>
  <text x="900" y="428" font-size="18" fill="var(--ok-text)">Users</text>
  <line x1="572" y1="390" x2="696" y2="390" stroke="var(--text-faint)" stroke-width="3" stroke-dasharray="8 5"/>
  <polygon points="694,382 708,390 694,398" fill="var(--text-faint)"/>
  <text x="640" y="374" font-size="16" fill="var(--text-faint)">strangle</text>
  <text x="640" y="505" font-size="16" fill="var(--text-faint)">modernization strategies • strangler fig • data migration • dual write • cutover • sunset planning</text>
</g>
<text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-faint)">mark.veltzer@gmail.com</text>
</svg>

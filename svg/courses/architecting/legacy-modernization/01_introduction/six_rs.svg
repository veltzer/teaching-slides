<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="629.830508474576" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.996147664006" font-weight="bold" fill="var(--text)">The Six R's of Modernization</text>

  <rect x="40" y="103.272727272727" width="386.440677966102" height="105.454545454545" rx="10.355767022859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80.677966101695" y="140.181818181818" font-family="Arial, sans-serif" font-size="18.640380641147" font-weight="bold" fill="var(--info-text)">1. Encapsulate</text>
  <text x="80.677966101695" y="166.545454545455" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--info-text)">wrap with API, no internal change</text>
  <text x="80.677966101695" y="192.909090909091" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--info-text)">cost: low | risk: low | upside: low</text>

  <rect x="446.779661016949" y="103.272727272727" width="386.440677966102" height="105.454545454545" rx="10.355767022859" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.457627118644" y="140.181818181818" font-family="Arial, sans-serif" font-size="18.640380641147" font-weight="bold" fill="var(--info-text)">2. Rehost</text>
  <text x="487.457627118644" y="166.545454545455" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--info-text)">lift &amp; shift to new infra</text>
  <text x="487.457627118644" y="192.909090909091" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--info-text)">cost: low-med | risk: low | upside: low-med</text>

  <rect x="853.559322033898" y="103.272727272727" width="386.440677966102" height="105.454545454545" rx="10.355767022859" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="894.237288135593" y="140.181818181818" font-family="Arial, sans-serif" font-size="18.640380641147" font-weight="bold" fill="var(--warn-text)">3. Replatform</text>
  <text x="894.237288135593" y="166.545454545455" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--warn-text)">minor changes for new platform</text>
  <text x="894.237288135593" y="192.909090909091" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--warn-text)">cost: med | risk: med | upside: med</text>

  <rect x="40" y="229.818181818182" width="386.440677966102" height="105.454545454545" rx="10.355767022859" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="80.677966101695" y="266.727272727273" font-family="Arial, sans-serif" font-size="18.640380641147" font-weight="bold" fill="var(--warn-text)">4. Refactor</text>
  <text x="80.677966101695" y="293.090909090909" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--warn-text)">internal restructure, same behavior</text>
  <text x="80.677966101695" y="319.454545454545" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--warn-text)">cost: med-high | risk: med | upside: high</text>

  <rect x="446.779661016949" y="229.818181818182" width="386.440677966102" height="105.454545454545" rx="10.355767022859" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="487.457627118644" y="266.727272727273" font-family="Arial, sans-serif" font-size="18.640380641147" font-weight="bold" fill="var(--primary-text)">5. Rearchitect</text>
  <text x="487.457627118644" y="293.090909090909" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--primary-text)">restructure for new properties</text>
  <text x="487.457627118644" y="319.454545454545" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--primary-text)">cost: high | risk: high | upside: high</text>

  <rect x="853.559322033898" y="229.818181818182" width="386.440677966102" height="105.454545454545" rx="10.355767022859" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="894.237288135593" y="266.727272727273" font-family="Arial, sans-serif" font-size="18.640380641147" font-weight="bold" fill="var(--danger-text)">6. Replace</text>
  <text x="894.237288135593" y="293.090909090909" font-family="Arial, sans-serif" font-size="13.462497129717" fill="var(--danger-text)">buy or use SaaS instead</text>
  <text x="894.237288135593" y="319.454545454545" font-family="Arial, sans-serif" font-size="12.426920427431" fill="var(--danger-text)">cost: varies | risk: data migration | upside: high</text>

  <line x1="40" y1="430.181818181818" x2="1229.830508474576" y2="430.181818181818" stroke="var(--text)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="40" y="461.818181818182" font-family="Arial, sans-serif" font-size="14.498073832003" font-weight="bold" fill="var(--text-muted)">less change</text>
  <text x="1229.830508474576" y="461.818181818182" text-anchor="end" font-family="Arial, sans-serif" font-size="14.498073832003" font-weight="bold" fill="var(--text-muted)">more change</text>

  <rect x="40" y="504" width="1189.830508474576" height="116" rx="10.355767022859" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="629.830508474576" y="535.636363636364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.569227236575" font-weight="bold" fill="var(--text)">Pick per component, not per portfolio</text>
  <text x="629.830508474576" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.498073832003" fill="var(--text-muted)">Strategic value drives investment</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.227078547234" font-weight="bold" fill="var(--text)">Golden Signals</text>

  <rect x="60" y="90.877192982456" width="280" height="223.859649122807" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143386121" font-weight="bold" fill="var(--primary-text)">Latency</text>
  <text x="200" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">request time</text>
  <text x="80" y="187.543859649123" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">- p50, p95, p99</text>
  <text x="80" y="212.982456140351" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">- ok vs err</text>
  <text x="80" y="238.421052631579" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--primary-text)">- queueing too</text>
  <text x="200" y="284.210526315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--primary-text)">slow = degraded</text>

  <rect x="360" y="90.877192982456" width="280" height="223.859649122807" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143386121" font-weight="bold" fill="var(--ok-text)">Traffic</text>
  <text x="500" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">demand</text>
  <text x="380" y="187.543859649123" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">- requests/sec</text>
  <text x="380" y="212.982456140351" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">- bytes/sec</text>
  <text x="380" y="238.421052631579" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">- sessions</text>
  <text x="500" y="284.210526315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--ok-text)">spike/drop = signal</text>

  <rect x="660" y="90.877192982456" width="280" height="223.859649122807" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143386121" font-weight="bold" fill="var(--danger-text)">Errors</text>
  <text x="800" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">failed requests</text>
  <text x="680" y="187.543859649123" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">- 5xx, timeouts</text>
  <text x="680" y="212.982456140351" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">- semantic errors</text>
  <text x="680" y="238.421052631579" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">- ratio, not count</text>
  <text x="800" y="284.210526315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--danger-text)">drives SLO</text>

  <rect x="960" y="90.877192982456" width="280" height="223.859649122807" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.192143386121" font-weight="bold" fill="var(--warn-text)">Saturation</text>
  <text x="1100" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">how full</text>
  <text x="980" y="187.543859649123" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">- CPU, memory, IO</text>
  <text x="980" y="212.982456140351" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">- queue depth</text>
  <text x="980" y="238.421052631579" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">- conns in use</text>
  <text x="1100" y="284.210526315789" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--warn-text)">predicts failure</text>

  <rect x="40" y="345.263157894737" width="1200" height="274.736842105263" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="380.877192982456" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--text)">Symptoms vs causes</text>
  <text x="60" y="416.491228070175" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">- alert on user pain (5xx, p95), not infra (CPU)</text>
  <text x="60" y="447.017543859649" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">- too many causes; few symptoms</text>
  <text x="60" y="477.543859649123" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">- on-call follows symptom; runbook leads to root cause</text>
  <text x="60" y="518.245614035088" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" fill="var(--text)">Each alert:</text>
  <text x="60" y="548.771929824561" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">- runbook link, user-facing description, dashboard</text>
  <text x="60" y="584.385964912281" font-family="Arial, sans-serif" font-size="14.122273063895" font-style="italic" fill="var(--ok-accent)">no action = no page</text>
</svg>

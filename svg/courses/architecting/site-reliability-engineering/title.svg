<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>title</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2196f3"/><stop offset="100%" stop-color="#1565c0"/></linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4caf50"/><stop offset="100%" stop-color="#2e7d32"/></linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff9800"/><stop offset="100%" stop-color="#e65100"/></linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9c27b0"/><stop offset="100%" stop-color="#6a1b9a"/></linearGradient>
  </defs>

  <rect width="1200" height="580" fill="var(--code-bg)" rx="6" x="40" y="40"/>

  <text x="640" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="bold" fill="var(--surface)">Site Reliability Engineering</text>
  <text x="640" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="var(--text-faint)">SLOs, error budgets, toil, on-call, postmortems</text>

  <rect x="120" y="240" width="240" height="180" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="240" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--ok-text)">Measure</text>
  <text x="240" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">SLIs, SLOs</text>
  <text x="240" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">golden signals</text>

  <rect x="400" y="240" width="240" height="180" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="520" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--warn-text)">Budget</text>
  <text x="520" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">error budgets</text>
  <text x="520" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">policy</text>

  <rect x="680" y="240" width="240" height="180" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="800" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-text)">Reduce</text>
  <text x="800" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">toil &lt; 50%</text>
  <text x="800" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">automate</text>

  <rect x="960" y="240" width="200" height="180" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1060" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--info-text)">Learn</text>
  <text x="1060" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">postmortems</text>
  <text x="1060" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--info-text)">blameless</text>

  <text x="640" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="var(--surface)">reliability is a feature you can measure</text>
  <text x="640" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="var(--text-faint)">100% is the wrong target — error budgets buy velocity</text>
</svg>

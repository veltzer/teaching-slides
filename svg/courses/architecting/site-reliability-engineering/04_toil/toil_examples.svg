<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.227078547234" font-weight="bold" fill="var(--text)">Toil vs Engineering</text>

  <rect x="40" y="90.877192982456" width="585" height="295.087719298246" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="332" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--danger-text)">Toil</text>
  <text x="332" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">manual, repetitive</text>
  <text x="60" y="187.543859649123" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--danger-text)">- manual deploys</text>
  <text x="60" y="215.017543859649" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--danger-text)">- manual cred rotation</text>
  <text x="60" y="242.491228070175" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--danger-text)">- nightly pod restart</text>
  <text x="60" y="269.964912280702" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--danger-text)">- same alert triage</text>
  <text x="60" y="297.438596491228" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--danger-text)">- access approvals</text>
  <text x="60" y="324.912280701754" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--danger-text)">- copying configs by hand</text>
  <text x="60" y="365.614035087719" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--danger-text)">scales linearly</text>

  <rect x="655" y="90.877192982456" width="585" height="295.087719298246" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="947" y="126.491228070175" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.174675805565" font-weight="bold" fill="var(--ok-text)">Engineering</text>
  <text x="947" y="151.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">durable value</text>
  <text x="675" y="187.543859649123" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">- deploy pipeline</text>
  <text x="675" y="215.017543859649" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">- secret rotation</text>
  <text x="675" y="242.491228070175" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">- fix flaky pods</text>
  <text x="675" y="269.964912280702" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">- tuning the alert away</text>
  <text x="675" y="297.438596491228" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">- self-service portal</text>
  <text x="675" y="324.912280701754" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">- IaC env parity</text>
  <text x="675" y="365.614035087719" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--ok-text)">build once, benefits forever</text>

  <rect x="40" y="416.491228070175" width="1200" height="203.508771929825" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="452.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--text)">The compounding effect</text>
  <text x="60" y="487.719298245614" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">- today's eng kills tomorrow's toil</text>
  <text x="60" y="518.245614035088" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">- frees more time for engineering</text>
  <text x="60" y="548.771929824561" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--text)">- without investment, toil grows until burnout</text>
  <text x="60" y="594.561403508772" font-family="Arial, sans-serif" font-size="14.122273063895" font-weight="bold" font-style="italic" fill="var(--ok-accent)">cap toil at 50%</text>
</svg>

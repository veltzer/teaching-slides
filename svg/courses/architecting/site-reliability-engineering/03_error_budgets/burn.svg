<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.227078547234" font-weight="bold" fill="var(--text)">Error Budget Burn over 28 Days</text>

  <line x1="100" y1="314.736842105263" x2="1180" y2="314.736842105263" stroke="var(--text-muted)" stroke-width="2"/>
  <line x1="100" y1="90.877192982456" x2="100" y2="314.736842105263" stroke="var(--text-muted)" stroke-width="2"/>

  <text x="80" y="106.140350877193" text-anchor="end" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">100%</text>
  <text x="80" y="212.982456140351" text-anchor="end" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">50%</text>
  <text x="80" y="319.824561403509" text-anchor="end" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">0</text>

  <text x="100" y="340.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">d0</text>
  <text x="640" y="340.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">d14</text>
  <text x="1180" y="340.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--text-muted)">d28</text>

  <line x1="100" y1="101.052631578947" x2="1180" y2="314.736842105263" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="950" y="218.070175438596" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-accent)">1× burn (sustainable)</text>

  <path d="M 100 101.052631578947 L 240 95.964912280702 L 380 90.877192982456 L 520 121.40350877193 L 660 187.543859649123 L 800 253.684210526316 L 940 299.473684210526 L 1080 314.736842105263 L 1180 314.736842105263" stroke="var(--danger-border)" stroke-width="3" fill="none"/>
  <text x="710" y="172.280701754386" font-family="Arial, sans-serif" font-size="13.113539273617" font-weight="bold" fill="var(--danger-accent)">actual: bad incident, fast burn</text>

  <line x1="660" y1="90.877192982456" x2="660" y2="314.736842105263" stroke="var(--warn-border)" stroke-width="1" stroke-dasharray="2 4"/>
  <text x="660" y="85.789473684211" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" fill="var(--warn-accent)">budget exhausted — freeze</text>

  <rect x="40" y="380.877192982456" width="380" height="106.842105263158" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="230" y="411.40350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--ok-text)">Healthy</text>
  <text x="60" y="441.929824561404" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">- burn rate ~1×</text>
  <text x="60" y="465.333333333333" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--ok-text)">- shipping continues</text>

  <rect x="450" y="380.877192982456" width="380" height="106.842105263158" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="411.40350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--warn-text)">Burning fast</text>
  <text x="470" y="441.929824561404" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">- burn rate 5-10×</text>
  <text x="470" y="465.333333333333" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--warn-text)">- alert on-call, investigate</text>

  <rect x="860" y="380.877192982456" width="380" height="106.842105263158" rx="8.069870322226" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1050" y="411.40350877193" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--danger-text)">Exhausted</text>
  <text x="880" y="441.929824561404" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">- freeze feature deploys</text>
  <text x="880" y="465.333333333333" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--danger-text)">- reliability work only</text>

  <rect x="40" y="508.070175438597" width="1200" height="111.929824561404" rx="8.069870322226" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="538.59649122807" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.139740644452" font-weight="bold" fill="var(--text)">Multi-window, multi-burn-rate alerting</text>
  <text x="60" y="569.122807017544" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">- short window catches fast outages; long window catches slow degradation</text>
  <text x="60" y="594.561403508772" font-family="Arial, sans-serif" font-size="13.113539273617" font-style="italic" fill="var(--ok-accent)">page when both windows show high burn — fewer false alarms</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <defs/>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.378891504872" font-weight="bold" fill="var(--text)">Structured Error Responses</text>

  <rect x="40" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="329.655172413793" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--danger-text)">Bad</text>
  <rect x="60.689655172414" y="151.743119266055" width="537.931034482759" height="63.853211009174" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="81.379310344828" y="188.990825688073" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">200 OK   {"error": "failed"}</text>
  <rect x="60.689655172414" y="236.880733944954" width="537.931034482759" height="63.853211009174" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="81.379310344828" y="274.128440366972" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">500   "Internal error"</text>
  <text x="60.689655172414" y="348.623853211009" font-family="Arial, sans-serif" font-size="14.689445752436" font-weight="bold" fill="var(--danger-text)">Issues:</text>
  <text x="60.689655172414" y="380.550458715596" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Status code lies (200 on error)</text>
  <text x="60.689655172414" y="407.155963302752" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- No error code to branch on</text>
  <text x="60.689655172414" y="433.761467889908" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- Plain text not parseable</text>
  <text x="60.689655172414" y="460.366972477064" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--danger-text)">- No correlation id</text>

  <rect x="660.689655172414" y="87.889908256881" width="579.310344827586" height="532.110091743119" rx="10.49246125174" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="950.344827586207" y="125.137614678899" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.98492250348" font-weight="bold" fill="var(--ok-text)">Good (RFC 7807)</text>
  <rect x="681.379310344828" y="151.743119266055" width="537.931034482759" height="234.128440366972" rx="6.295476751044" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="702.068965517241" y="183.669724770642" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">HTTP/1.1 422 Unprocessable</text>
  <text x="702.068965517241" y="210.275229357798" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">Content-Type: application/problem+json</text>
  <text x="702.068965517241" y="242.201834862385" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">{</text>
  <text x="722.758620689655" y="268.807339449541" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">"type": "/errors/invalid-email",</text>
  <text x="722.758620689655" y="295.412844036697" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">"title": "Invalid email",</text>
  <text x="722.758620689655" y="322.018348623853" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">"detail": "missing @ sign",</text>
  <text x="722.758620689655" y="348.623853211009" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">"trace_id": "abc123"</text>
  <text x="702.068965517241" y="375.229357798165" font-family="Arial, sans-serif" font-size="14.689445752436" fill="var(--text)">}</text>
  <text x="681.379310344828" y="428.440366972477" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Right status code (4xx vs 5xx)</text>
  <text x="681.379310344828" y="455.045871559633" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Stable type for branching</text>
  <text x="681.379310344828" y="481.651376146789" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Human + machine readable</text>
  <text x="681.379310344828" y="508.256880733945" font-family="Arial, sans-serif" font-size="13.640199627262" fill="var(--ok-text)">- Trace id for debugging</text>
</svg>

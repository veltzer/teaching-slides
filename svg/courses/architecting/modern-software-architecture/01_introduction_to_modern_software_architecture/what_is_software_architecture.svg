<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Central concept -->
  <ellipse cx="640" cy="108.9109" rx="235.7143" ry="68.9109" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="3"/>
  <text x="640" y="103.1683" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.186" font-weight="bold" fill="var(--primary-accent)">Software</text>
  <text x="640" y="131.8812" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.186" font-weight="bold" fill="var(--primary-accent)">Architecture</text>

  <!-- Four pillars radiating out -->
  <!-- Components -->
  <line x1="468.5714" y1="154.8515" x2="190" y2="304.1584" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="40" y="269.703" width="300" height="91.8812" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="309.901" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8581" font-weight="bold" fill="var(--ok-accent)">Components</text>
  <text x="190" y="338.6139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4209" fill="var(--text-muted)">Services, modules, layers</text>

  <!-- Relationships -->
  <line x1="811.4286" y1="154.8515" x2="1090" y2="304.1584" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="940" y="269.703" width="300" height="91.8812" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="309.901" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8581" font-weight="bold" fill="var(--warn-accent)">Relationships</text>
  <text x="1090" y="338.6139" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4209" fill="var(--text-muted)">How components interact</text>

  <!-- Constraints -->
  <line x1="511.4286" y1="177.8218" x2="340" y2="453.4653" stroke="var(--danger-border)" stroke-width="2"/>
  <rect x="168.5714" y="419.0099" width="300" height="91.8812" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="318.5714" y="459.2079" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8581" font-weight="bold" fill="var(--danger-accent)">Constraints</text>
  <text x="318.5714" y="487.9208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4209" fill="var(--text-muted)">Technology, budget, compliance</text>

  <!-- Quality Attributes -->
  <line x1="768.5714" y1="177.8218" x2="940" y2="453.4653" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="790" y="419.0099" width="300" height="91.8812" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="459.2079" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8581" font-weight="bold" fill="var(--primary-accent)">Quality Attributes</text>
  <text x="940" y="487.9208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4209" fill="var(--text-muted)">Performance, security, scalability</text>

  <!-- Bottom label -->
  <rect x="318.5714" y="568.3168" width="642.8571" height="51.6832" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="602.7723" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7488" fill="var(--text)">Guides technical decisions and balances competing concerns</text>
</svg>
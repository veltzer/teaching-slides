<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="653.9535" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.0187" font-weight="bold" fill="var(--text)">Categories of Architectural Drivers</text>
  <rect x="495.8139" y="84.6155" width="316.279" height="100.3847" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="653.9535" y="147.077" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.0173" font-weight="bold">Architectural Drivers</text>
  <line x1="560.9302" y1="185" x2="226.0466" y2="296.5385" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="616.7442" y1="185" x2="542.3256" y2="296.5385" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="691.1628" y1="185" x2="784.1861" y2="296.5385" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="746.9768" y1="185" x2="1081.8604" y2="296.5385" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="58.6046" y="307.6923" width="316.279" height="100.3847" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="216.7442" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.0173" font-weight="bold">Functional Req.</text>
  <text x="216.7442" y="392.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0147" fill="var(--text-muted)">(Features)</text>
  <rect x="393.4884" y="307.6923" width="316.279" height="100.3847" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="551.628" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.0173" font-weight="bold">Quality Attributes</text>
  <text x="551.628" y="392.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0147" fill="var(--text-muted)">(Performance, etc.)</text>
  <rect x="728.3721" y="307.6923" width="241.8605" height="100.3847" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="849.3023" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.0173" font-weight="bold">Constraints</text>
  <text x="849.3023" y="392.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0147" fill="var(--text-muted)">(Fixed boundaries)</text>
  <rect x="988.8373" y="307.6923" width="241.8605" height="100.3847" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1109.7674" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.0173" font-weight="bold">Principles</text>
  <text x="1109.7674" y="392.4615" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0147" fill="var(--text-muted)">(Guiding rules)</text>
  <line x1="216.7442" y1="408.0769" x2="216.7442" y2="519.6153" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="551.628" y1="408.0769" x2="551.628" y2="519.6153" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="849.3023" y1="408.0769" x2="849.3023" y2="519.6153" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1109.7674" y1="408.0769" x2="1109.7674" y2="519.6153" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="530.7692" width="353.4884" height="89.2308" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="216.7442" y="586.5384" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0161" fill="var(--text-muted)">What the system does</text>
  <rect x="384.186" y="530.7692" width="353.4884" height="89.2308" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="560.9302" y="586.5384" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0161" fill="var(--text-muted)">How well it does it</text>
  <rect x="756.2791" y="530.7692" width="204.6512" height="89.2308" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="858.6047" y="586.5384" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0161" fill="var(--text-muted)">Fixed boundaries</text>
  <rect x="998.1395" y="530.7692" width="241.8605" height="89.2308" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1119.0698" y="586.5384" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0161" fill="var(--text-muted)">Guiding rules</text>
</svg>
  <line x1="676.5714" y1="170.5263" x2="768" y2="265.2632" stroke="var(--primary-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="731.4286" y1="170.5263" x2="1060.5714" y2="265.2632" stroke="var(--primary-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <rect x="54.8571" y="274.7368" width="310.8571" height="85.2632" rx="9.1429" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.6571" />

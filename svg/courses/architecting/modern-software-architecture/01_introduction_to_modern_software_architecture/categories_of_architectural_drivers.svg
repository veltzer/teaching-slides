  <text x="210.2857" y="346.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1143" fill="var(--text-muted)">(Features)</text>
  <rect x="384" y="274.7368" width="310.8571" height="85.2632" rx="9.1429" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.6571" />
  <text x="539.4286" y="318.3158" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7714" font-weight="bold">Quality Attributes</text>
  <text x="539.4286" y="346.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1143" fill="var(--text-muted)">(Performance, etc.)</text>
  <rect x="713.1429" y="274.7368" width="237.7143" height="85.2632" rx="9.1429" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.6571" />
  <text x="832" y="318.3158" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7714" font-weight="bold">Constraints</text>

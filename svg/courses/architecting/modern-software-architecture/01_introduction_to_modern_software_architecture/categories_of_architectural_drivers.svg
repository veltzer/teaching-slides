<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="495.8139" y="40" width="316.279" height="108.750115104191" rx="6.244998671351" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="653.9535" y="107.666639583327" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.079667322023" font-weight="bold" fill="var(--primary-text)">Architectural Drivers</text>
  <line x1="560.9302" y1="148.749898437478" x2="226.0466" y2="269.583299479159" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="616.7442" y1="148.749898437478" x2="542.3256" y2="269.583299479159" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="691.1628" y1="148.749898437478" x2="784.1861" y2="269.583299479159" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="746.9768" y1="148.749898437478" x2="1081.8604" y2="269.583299479159" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="58.6046" y="281.666585416649" width="316.279" height="108.750115104191" rx="6.244998671351" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="216.7442" y="337.249939062487" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.079667322023" font-weight="bold" fill="var(--ok-text)">Functional Req.</text>
  <text x="216.7442" y="373.499905208313" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.913628708365" fill="var(--text-muted)">(Features)</text>
  <rect x="393.4884" y="281.666585416649" width="316.279" height="108.750115104191" rx="6.244998671351" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="551.628" y="337.249939062487" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.079667322023" font-weight="bold" fill="var(--warn-text)">Quality Attributes</text>
  <text x="551.628" y="373.499905208313" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.913628708365" fill="var(--text-muted)">(Performance, etc.)</text>
  <rect x="728.3721" y="281.666585416649" width="241.8605" height="108.750115104191" rx="6.244998671351" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="849.3023" y="337.249939062487" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.079667322023" font-weight="bold" fill="var(--danger-text)">Constraints</text>
  <text x="849.3023" y="373.499905208313" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.913628708365" fill="var(--text-muted)">(Fixed boundaries)</text>
  <rect x="988.8373" y="281.666585416649" width="241.8605" height="108.750115104191" rx="6.244998671351" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.7674" y="337.249939062487" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.079667322023" font-weight="bold" fill="var(--primary-text)">Principles</text>
  <text x="1109.7674" y="373.499905208313" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.913628708365" fill="var(--text-muted)">(Guiding rules)</text>
  <line x1="216.7442" y1="390.416592187484" x2="216.7442" y2="511.249884895809" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="551.628" y1="390.416592187484" x2="551.628" y2="511.249884895809" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="849.3023" y1="390.416592187484" x2="849.3023" y2="511.249884895809" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1109.7674" y1="390.416592187484" x2="1109.7674" y2="511.249884895809" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="523.333279166655" width="353.4884" height="96.666720833345" rx="6.244998671351" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="216.7442" y="583.749925520817" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.996752098505" fill="var(--text-muted)">What the system does</text>
  <rect x="384.186" y="523.333279166655" width="353.4884" height="96.666720833345" rx="6.244998671351" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="560.9302" y="583.749925520817" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.996752098505" fill="var(--text-muted)">How well it does it</text>
  <rect x="756.2791" y="523.333279166655" width="204.6512" height="96.666720833345" rx="6.244998671351" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="858.6047" y="583.749925520817" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.996752098505" fill="var(--text-muted)">Fixed boundaries</text>
  <rect x="998.1395" y="523.333279166655" width="241.8605" height="96.666720833345" rx="6.244998671351" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1119.0698" y="583.749925520817" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.996752098505" fill="var(--text-muted)">Guiding rules</text>
</svg>

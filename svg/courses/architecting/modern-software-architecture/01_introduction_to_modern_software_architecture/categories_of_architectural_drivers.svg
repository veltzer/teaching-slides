    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="18.2857" markerHeight="13.2632" refX="18.2857" refY="6.6316" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="47.3684" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="var(--text-dark)">Categories of Architectural Drivers</text>
  <rect x="484.5714" y="85.2632" width="310.8571" height="85.2632" rx="9.1429" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.6571" />
  <text x="640" y="138.3158" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7714" font-weight="bold">Architectural Drivers</text>
  <line x1="548.5714" y1="170.5263" x2="219.4286" y2="265.2632" stroke="var(--primary-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />

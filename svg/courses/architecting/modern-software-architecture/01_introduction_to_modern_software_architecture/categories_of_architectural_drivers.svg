  <rect x="36.5714" y="464.2105" width="347.4286" height="75.7895" rx="9.1429" fill="var(--surface-dark)" stroke="var(--text-faintest)" stroke-width="1.8286" />
  <text x="210.2857" y="511.5789" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">What the system does</text>
  <rect x="374.8571" y="464.2105" width="347.4286" height="75.7895" rx="9.1429" fill="var(--surface-dark)" stroke="var(--text-faintest)" stroke-width="1.8286" />
  <text x="548.5714" y="511.5789" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">How well it does it</text>
  <rect x="740.5714" y="464.2105" width="201.1429" height="75.7895" rx="9.1429" fill="var(--surface-dark)" stroke="var(--text-faintest)" stroke-width="1.8286" />
  <text x="841.1429" y="511.5789" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">Fixed boundaries</text>
  <rect x="978.2857" y="464.2105" width="237.7143" height="75.7895" rx="9.1429" fill="var(--surface-dark)" stroke="var(--text-faintest)" stroke-width="1.8286" />
  <text x="1097.1429" y="511.5789" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" fill="var(--text-muted)">Guiding rules</text>
</svg>
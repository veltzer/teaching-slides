  <text x="1088" y="318.3158" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7714" font-weight="bold">Principles</text>
  <text x="1088" y="346.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1143" fill="var(--text-muted)">(Guiding rules)</text>
  <line x1="210.2857" y1="360" x2="210.2857" y2="454.7368" stroke="var(--ok-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="539.4286" y1="360" x2="539.4286" y2="454.7368" stroke="var(--warn-yellow)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="832" y1="360" x2="832" y2="454.7368" stroke="var(--danger-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />

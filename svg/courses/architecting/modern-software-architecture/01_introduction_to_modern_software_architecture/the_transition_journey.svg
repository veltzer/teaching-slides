<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="683.9025" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7347" font-weight="bold" fill="var(--text)">The Transition Journey</text>
  <rect x="40" y="205.7143" width="190.2439" height="414.2857" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135.122" y="454.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold" fill="var(--danger-text)">Monolith</text>
  <line x1="230.2439" y1="412.8571" x2="266.8293" y2="412.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="274.1464" y="205.7143" width="204.878" height="414.2857" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="376.5854" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold" fill="var(--warn-text)">Modular</text>
  <text x="376.5854" y="520.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold" fill="var(--warn-text)">Monolith</text>
  <line x1="479.0244" y1="412.8571" x2="515.6097" y2="412.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="522.9269" y="205.7143" width="204.878" height="414.2857" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="625.3659" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold" fill="var(--primary-text)">Service-Oriented</text>
  <text x="625.3659" y="520.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold" fill="var(--primary-text)">Architecture</text>
  <line x1="727.8049" y1="412.8571" x2="764.3903" y2="412.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="771.7073" y="205.7143" width="204.878" height="414.2857" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="874.1464" y="454.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold" fill="var(--ok-text)">Microservices</text>
  <line x1="976.5854" y1="412.8571" x2="1013.1708" y2="412.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1020.4878" y="205.7143" width="219.5122" height="414.2857" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130.244" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold" fill="var(--ok-text)">Serverless /</text>
  <text x="1130.244" y="520.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold" fill="var(--ok-text)">Mesh</text>
</svg>

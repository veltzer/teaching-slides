<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,60 4.9778,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="683.9025" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7347" font-weight="bold" fill="var(--text)">The Transition Journey</text>
  <rect x="40" y="205.7143" width="190.2439" height="414.2857" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="135.122" y="454.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold">Monolith</text>
  <line x1="230.2439" y1="412.8571" x2="266.8293" y2="412.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="274.1464" y="205.7143" width="204.878" height="414.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="376.5854" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold">Modular</text>
  <text x="376.5854" y="520.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold">Monolith</text>
  <line x1="479.0244" y1="412.8571" x2="515.6097" y2="412.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="522.9269" y="205.7143" width="204.878" height="414.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="625.3659" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold">Service-Oriented</text>
  <text x="625.3659" y="520.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold">Architecture</text>
  <line x1="727.8049" y1="412.8571" x2="764.3903" y2="412.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="771.7073" y="205.7143" width="204.878" height="414.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="874.1464" y="454.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold">Microservices</text>
  <line x1="976.5854" y1="412.8571" x2="1013.1708" y2="412.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1020.4878" y="205.7143" width="219.5122" height="414.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1130.244" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold">Serverless /</text>
  <text x="1130.244" y="520.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3441" font-weight="bold">Mesh</text>
</svg>
  <rect x="290" y="45" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">API Gateway</text>
  <!-- Services -->
  <line x1="320" y1="90" x2="110" y2="155" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="90" x2="290" y2="155" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="90" x2="460" y2="155" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="90" x2="630" y2="155" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>

  <text x="465" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Inventory Service</text>
  <rect x="570" y="160" width="150" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>

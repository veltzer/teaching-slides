<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6076" font-weight="bold" fill="var(--text)">Microservices Architecture</text>
  <rect x="492.1739" y="80.5794" width="278.2609" height="91.3037" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.3044" y="137.3906" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7786" font-weight="bold">API Gateway</text>
  <line x1="544.3478" y1="171.8831" x2="179.1304" y2="303.7661" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="596.5217" y1="171.8831" x2="492.1739" y2="303.7661" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="666.087" y1="171.8831" x2="787.8261" y2="303.7661" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="718.2609" y1="171.8831" x2="1083.4783" y2="303.7661" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="313.911" width="260.8696" height="91.3037" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4348" y="370.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9494" font-weight="bold">Order Service</text>
  <rect x="353.0435" y="313.911" width="260.8696" height="91.3037" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.4783" y="370.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9494" font-weight="bold">Payment Service</text>
  <rect x="666.087" y="313.911" width="260.8696" height="91.3037" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.5217" y="370.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9494" font-weight="bold">Inventory Service</text>
  <rect x="979.1304" y="313.911" width="260.8696" height="91.3037" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1109.5652" y="370.7222" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9494" font-weight="bold">User Service</text>
  <line x1="170.4348" y1="405.2147" x2="170.4348" y2="526.9529" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="483.4783" y1="405.2147" x2="483.4783" y2="526.9529" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="796.5217" y1="405.2147" x2="796.5217" y2="526.9529" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1109.5652" y1="405.2147" x2="1109.5652" y2="526.9529" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <ellipse cx="170.4348" cy="577.6771" rx="104.3478" ry="42.3229" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="170.4348" y="587.822" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1203">Orders DB</text>
  <ellipse cx="483.4783" cy="577.6771" rx="104.3478" ry="42.3229" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="483.4783" y="587.822" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1203">Payments DB</text>
  <ellipse cx="796.5217" cy="577.6771" rx="104.3478" ry="42.3229" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="796.5217" y="587.822" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1203">Inventory DB</text>
  <ellipse cx="1109.5652" cy="577.6771" rx="104.3478" ry="42.3229" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.4133" />
  <text x="1109.5652" y="587.822" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1203">Users DB</text>
</svg>
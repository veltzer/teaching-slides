<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Outer monolith container -->
  <rect x="140" y="30" width="1000" height="440" rx="16" fill="var(--surface-light)" stroke="var(--primary)" stroke-width="3"/>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-dk)">Single Deployable Unit</text>

  <!-- Module A: User Management -->
  <rect x="180" y="100" width="280" height="200" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="2"/>
  <text x="320" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-dk)">User Module</text>
  <rect x="200" y="145" width="240" height="35" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Public Interface (API)</text>
  <rect x="200" y="190" width="110" height="30" rx="4" fill="var(--primary-tint)" stroke="var(--primary-bright)" stroke-width="1"/>
  <text x="255" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-dk)">Services</text>
  <rect x="330" y="190" width="110" height="30" rx="4" fill="var(--primary-tint)" stroke="var(--primary-bright)" stroke-width="1"/>
  <text x="385" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-dk)">Repos</text>
  <rect x="200" y="240" width="240" height="40" rx="5" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">User Schema</text>

  <!-- Module B: Order Management -->
  <rect x="500" y="100" width="280" height="200" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="2"/>
  <text x="640" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-dk)">Order Module</text>
  <rect x="520" y="145" width="240" height="35" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Public Interface (API)</text>
  <rect x="520" y="190" width="110" height="30" rx="4" fill="var(--ok-tint)" stroke="var(--ok)" stroke-width="1"/>
  <text x="575" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">Services</text>
  <rect x="650" y="190" width="110" height="30" rx="4" fill="var(--ok-tint)" stroke="var(--ok)" stroke-width="1"/>
  <text x="705" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-dk)">Repos</text>
  <rect x="520" y="240" width="240" height="40" rx="5" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Order Schema</text>

  <!-- Module C: Payment -->
  <rect x="820" y="100" width="280" height="200" rx="10" fill="var(--warn-pale)" stroke="var(--warn)" stroke-width="2"/>
  <text x="960" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-dk)">Payment Module</text>
  <rect x="840" y="145" width="240" height="35" rx="5" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="960" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Public Interface (API)</text>
  <rect x="840" y="190" width="110" height="30" rx="4" fill="var(--warn-tint)" stroke="var(--warn)" stroke-width="1"/>
  <text x="895" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-dk)">Services</text>
  <rect x="970" y="190" width="110" height="30" rx="4" fill="var(--warn-tint)" stroke="var(--warn)" stroke-width="1"/>
  <text x="1025" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-dk)">Repos</text>
  <rect x="840" y="240" width="240" height="40" rx="5" fill="var(--surface-alt)" stroke="var(--border)" stroke-width="1"/>
  <text x="960" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Payment Schema</text>

  <!-- Interface arrows between modules -->
  <line x1="460" y1="162" x2="520" y2="162" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="515,158 515,166 525,162" fill="var(--text-faint)"/>
  <line x1="780" y1="162" x2="840" y2="162" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="835,158 835,166 845,162" fill="var(--text-faint)"/>

  <!-- Shared Database -->
  <rect x="340" y="350" width="600" height="90" rx="12" fill="var(--surface-alt)" stroke="var(--border-strong)" stroke-width="2"/>
  <text x="640" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Shared Database</text>
  <text x="640" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Separate schemas per module | Same physical database</text>
  <!-- DB connections -->
  <line x1="320" y1="300" x2="460" y2="350" stroke="var(--border-strong)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="640" y1="300" x2="640" y2="350" stroke="var(--border-strong)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="960" y1="300" x2="820" y2="350" stroke="var(--border-strong)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Key benefits at bottom -->
  <rect x="140" y="510" width="480" height="110" rx="10" fill="var(--ok-pale)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="380" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-dk)">Benefits</text>
  <text x="170" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Clear module boundaries via interfaces</text>
  <text x="170" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Easy to extract into microservices later</text>

  <rect x="660" y="510" width="480" height="110" rx="10" fill="var(--primary-pale)" stroke="var(--primary)" stroke-width="1.5"/>
  <text x="900" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-dk)">Key Rule</text>
  <text x="690" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Modules communicate only through</text>
  <text x="690" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">public interfaces, never direct access</text>
</svg>
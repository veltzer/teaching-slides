<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Outer monolith container -->
  <rect x="40" y="40" width="1200" height="432.5424" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="79.322" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8947" font-weight="bold" fill="var(--primary-accent)">Single Deployable Unit</text>

  <!-- Module A: User Management -->
  <rect x="88" y="108.8136" width="336" height="196.6102" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="256" y="138.3051" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378" font-weight="bold" fill="var(--primary-accent)">User Module</text>
  <rect x="112" y="153.0508" width="288" height="34.4068" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="256" y="175.661" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0335" fill="var(--text-muted)">Public Interface (API)</text>
  <rect x="112" y="197.2881" width="132" height="29.4915" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="178" y="216.9492" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9473" fill="var(--primary-accent)">Services</text>
  <rect x="268" y="197.2881" width="132" height="29.4915" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="334" y="216.9492" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9473" fill="var(--primary-accent)">Repos</text>
  <rect x="112" y="246.4407" width="288" height="39.322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="256" y="271.0169" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0335" fill="var(--text-muted)">User Schema</text>

  <!-- Module B: Order Management -->
  <rect x="472" y="108.8136" width="336" height="196.6102" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="138.3051" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378" font-weight="bold" fill="var(--ok-accent)">Order Module</text>
  <rect x="496" y="153.0508" width="288" height="34.4068" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="175.661" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0335" fill="var(--text-muted)">Public Interface (API)</text>
  <rect x="496" y="197.2881" width="132" height="29.4915" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="562" y="216.9492" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9473" fill="var(--ok-accent)">Services</text>
  <rect x="652" y="197.2881" width="132" height="29.4915" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="718" y="216.9492" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9473" fill="var(--ok-accent)">Repos</text>
  <rect x="496" y="246.4407" width="288" height="39.322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="271.0169" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0335" fill="var(--text-muted)">Order Schema</text>

  <!-- Module C: Payment -->
  <rect x="856" y="108.8136" width="336" height="196.6102" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1024" y="138.3051" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378" font-weight="bold" fill="var(--warn-accent)">Payment Module</text>
  <rect x="880" y="153.0508" width="288" height="34.4068" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="1024" y="175.661" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0335" fill="var(--text-muted)">Public Interface (API)</text>
  <rect x="880" y="197.2881" width="132" height="29.4915" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="946" y="216.9492" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9473" fill="var(--warn-accent)">Services</text>
  <rect x="1036" y="197.2881" width="132" height="29.4915" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1102" y="216.9492" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.9473" fill="var(--warn-accent)">Repos</text>
  <rect x="880" y="246.4407" width="288" height="39.322" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1024" y="271.0169" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.0335" fill="var(--text-muted)">Payment Schema</text>

  <!-- Interface arrows between modules -->
  <line x1="424" y1="169.7627" x2="496" y2="169.7627" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="490,165.8305 490,173.6949 502,169.7627" fill="var(--text-faint)"/>
  <line x1="808" y1="169.7627" x2="880" y2="169.7627" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="874,165.8305 874,173.6949 886,169.7627" fill="var(--text-faint)"/>

  <!-- Shared Database -->
  <rect x="280" y="354.5763" width="720" height="88.4746" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="388.9831" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.378" font-weight="bold" fill="var(--text)">Shared Database</text>
  <text x="640" y="418.4746" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.1196" fill="var(--text-muted)">Separate schemas per module | Same physical database</text>
  <!-- DB connections -->
  <line x1="256" y1="305.4237" x2="424" y2="354.5763" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="640" y1="305.4237" x2="640" y2="354.5763" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1024" y1="305.4237" x2="856" y2="354.5763" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Key benefits at bottom -->
  <rect x="40" y="511.8644" width="576" height="108.1356" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="328" y="541.3559" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2918" font-weight="bold" fill="var(--ok-accent)">Benefits</text>
  <text x="76" y="570.8475" font-family="Arial, sans-serif" font-size="14.1196" fill="var(--text)">Clear module boundaries via interfaces</text>
  <text x="76" y="595.4237" font-family="Arial, sans-serif" font-size="14.1196" fill="var(--text)">Easy to extract into microservices later</text>

  <rect x="664" y="511.8644" width="576" height="108.1356" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="541.3559" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2918" font-weight="bold" fill="var(--primary-accent)">Key Rule</text>
  <text x="700" y="570.8475" font-family="Arial, sans-serif" font-size="14.1196" fill="var(--text)">Modules communicate only through</text>
  <text x="700" y="595.4237" font-family="Arial, sans-serif" font-size="14.1196" fill="var(--text)">public interfaces, never direct access</text>
</svg>
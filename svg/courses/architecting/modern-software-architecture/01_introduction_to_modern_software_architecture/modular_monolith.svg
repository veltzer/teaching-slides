<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Outer monolith container -->
  <rect x="140" y="30" width="1000" height="440" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-accent)">Single Deployable Unit</text>

  <!-- Module A: User Management -->
  <rect x="180" y="100" width="280" height="200" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="320" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">User Module</text>
  <rect x="200" y="145" width="240" height="35" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Public Interface (API)</text>
  <rect x="200" y="190" width="110" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="255" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Services</text>
  <rect x="330" y="190" width="110" height="30" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="385" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Repos</text>
  <rect x="200" y="240" width="240" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="320" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">User Schema</text>

  <!-- Module B: Order Management -->
  <rect x="500" y="100" width="280" height="200" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Order Module</text>
  <rect x="520" y="145" width="240" height="35" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Public Interface (API)</text>
  <rect x="520" y="190" width="110" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="575" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">Services</text>
  <rect x="650" y="190" width="110" height="30" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="705" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--ok-accent)">Repos</text>
  <rect x="520" y="240" width="240" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Order Schema</text>

  <!-- Module C: Payment -->
  <rect x="820" y="100" width="280" height="200" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="960" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">Payment Module</text>
  <rect x="840" y="145" width="240" height="35" rx="6" fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>
  <text x="960" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Public Interface (API)</text>
  <rect x="840" y="190" width="110" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="895" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">Services</text>
  <rect x="970" y="190" width="110" height="30" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1025" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--warn-accent)">Repos</text>
  <rect x="840" y="240" width="240" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="960" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Payment Schema</text>

  <!-- Interface arrows between modules -->
  <line x1="460" y1="162" x2="520" y2="162" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="515,158 515,166 525,162" fill="var(--text-faint)"/>
  <line x1="780" y1="162" x2="840" y2="162" stroke="var(--text-faint)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="835,158 835,166 845,162" fill="var(--text-faint)"/>

  <!-- Shared Database -->
  <rect x="340" y="350" width="600" height="90" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--text)">Shared Database</text>
  <text x="640" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Separate schemas per module | Same physical database</text>
  <!-- DB connections -->
  <line x1="320" y1="300" x2="460" y2="350" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="640" y1="300" x2="640" y2="350" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="960" y1="300" x2="820" y2="350" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Key benefits at bottom -->
  <rect x="140" y="510" width="480" height="110" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="380" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Benefits</text>
  <text x="170" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Clear module boundaries via interfaces</text>
  <text x="170" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Easy to extract into microservices later</text>

  <rect x="660" y="510" width="480" height="110" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="900" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">Key Rule</text>
  <text x="690" y="570" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Modules communicate only through</text>
  <text x="690" y="595" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">public interfaces, never direct access</text>
</svg>
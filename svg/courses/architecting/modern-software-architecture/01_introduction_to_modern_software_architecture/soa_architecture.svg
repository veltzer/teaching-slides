<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- ESB (Enterprise Service Bus) - central bar -->
  <rect x="84.4444" y="267.8571" width="1111.1111" height="72.5" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="311.3571" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.455" font-weight="bold" fill="var(--primary-accent)">Enterprise Service Bus (ESB)</text>

  <!-- Consumer applications on top -->
  <rect x="40" y="40" width="222.2222" height="82.8571" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.1111" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0913" font-weight="bold" fill="var(--ok-accent)">Web Portal</text>
  <text x="151.1111" y="100.0714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.873" fill="var(--text-muted)">Consumer</text>
  <line x1="151.1111" y1="122.8571" x2="151.1111" y2="267.8571" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="145.5556,262.6786 156.6667,262.6786 151.1111,273.0357" fill="var(--ok-fill)"/>

  <rect x="351.1111" y="40" width="222.2222" height="82.8571" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.2222" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0913" font-weight="bold" fill="var(--ok-accent)">Mobile App</text>
  <text x="462.2222" y="100.0714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.873" fill="var(--text-muted)">Consumer</text>
  <line x1="462.2222" y1="122.8571" x2="462.2222" y2="267.8571" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="456.6667,262.6786 467.7778,262.6786 462.2222,273.0357" fill="var(--ok-fill)"/>

  <rect x="706.6667" y="40" width="222.2222" height="82.8571" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.7778" y="76.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0913" font-weight="bold" fill="var(--ok-accent)">Partner API</text>
  <text x="817.7778" y="100.0714" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.873" fill="var(--text-muted)">Consumer</text>
  <line x1="817.7778" y1="122.8571" x2="817.7778" y2="267.8571" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="812.2222,262.6786 823.3333,262.6786 817.7778,273.0357" fill="var(--ok-fill)"/>

  <!-- ESB capabilities labels -->
  <text x="206.6667" y="247.1429" font-family="Arial, sans-serif" font-size="11.8003" fill="var(--primary-accent)">Routing</text>
  <text x="428.8889" y="247.1429" font-family="Arial, sans-serif" font-size="11.8003" fill="var(--primary-accent)">Transformation</text>
  <text x="684.4444" y="247.1429" font-family="Arial, sans-serif" font-size="11.8003" fill="var(--primary-accent)">Orchestration</text>
  <text x="928.8889" y="247.1429" font-family="Arial, sans-serif" font-size="11.8003" fill="var(--primary-accent)">Security</text>

  <!-- Services below ESB -->
  <rect x="40" y="412.8571" width="222.2222" height="82.8571" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.1111" y="449.1071" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0185" font-weight="bold" fill="var(--warn-accent)">Customer</text>
  <text x="151.1111" y="472.9286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0185" font-weight="bold" fill="var(--warn-accent)">Service</text>
  <line x1="151.1111" y1="340.3571" x2="151.1111" y2="412.8571" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="145.5556,407.6786 156.6667,407.6786 151.1111,418.0357" fill="var(--warn-fill)"/>

  <rect x="351.1111" y="412.8571" width="222.2222" height="82.8571" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="462.2222" y="449.1071" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0185" font-weight="bold" fill="var(--warn-accent)">Order</text>
  <text x="462.2222" y="472.9286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0185" font-weight="bold" fill="var(--warn-accent)">Service</text>
  <line x1="462.2222" y1="340.3571" x2="462.2222" y2="412.8571" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="456.6667,407.6786 467.7778,407.6786 462.2222,418.0357" fill="var(--warn-fill)"/>

  <rect x="706.6667" y="412.8571" width="222.2222" height="82.8571" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.7778" y="449.1071" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0185" font-weight="bold" fill="var(--warn-accent)">Inventory</text>
  <text x="817.7778" y="472.9286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0185" font-weight="bold" fill="var(--warn-accent)">Service</text>
  <line x1="817.7778" y1="340.3571" x2="817.7778" y2="412.8571" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="812.2222,407.6786 823.3333,407.6786 817.7778,418.0357" fill="var(--warn-fill)"/>

  <rect x="1017.7778" y="412.8571" width="222.2222" height="82.8571" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1128.8889" y="449.1071" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0185" font-weight="bold" fill="var(--warn-accent)">Payment</text>
  <text x="1128.8889" y="472.9286" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0185" font-weight="bold" fill="var(--warn-accent)">Service</text>
  <line x1="1128.8889" y1="340.3571" x2="1128.8889" y2="412.8571" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="1123.3333,407.6786 1134.4444,407.6786 1128.8889,418.0357" fill="var(--warn-fill)"/>

  <!-- Protocol labels -->
  <text x="95.5556" y="386.9643" font-family="Arial, sans-serif" font-size="11.8003" fill="var(--text-faint)">SOAP/WSDL</text>
  <text x="406.6667" y="386.9643" font-family="Arial, sans-serif" font-size="11.8003" fill="var(--text-faint)">SOAP/WSDL</text>
  <text x="762.2222" y="386.9643" font-family="Arial, sans-serif" font-size="11.8003" fill="var(--text-faint)">SOAP/WSDL</text>
  <text x="1073.3333" y="386.9643" font-family="Arial, sans-serif" font-size="11.8003" fill="var(--text-faint)">SOAP/WSDL</text>

  <!-- Key characteristics -->
  <rect x="84.4444" y="547.5" width="1111.1111" height="72.5" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="306.6667" y="578.5714" font-family="Arial, sans-serif" font-size="13.9458" fill="var(--text)">Coarse-grained services</text>
  <text x="306.6667" y="599.2857" font-family="Arial, sans-serif" font-size="13.9458" fill="var(--text-muted)">shared schemas and contracts</text>
  <text x="751.1111" y="578.5714" font-family="Arial, sans-serif" font-size="13.9458" fill="var(--text)">Centralized governance via ESB</text>
  <text x="751.1111" y="599.2857" font-family="Arial, sans-serif" font-size="13.9458" fill="var(--text-muted)">heavyweight protocols (WS-*)</text>
</svg>

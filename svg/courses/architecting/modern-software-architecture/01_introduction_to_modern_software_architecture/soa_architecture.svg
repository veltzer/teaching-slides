<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- ESB (Enterprise Service Bus) - central bar -->
  <rect x="140" y="280" width="1000" height="70" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--primary-accent)">Enterprise Service Bus (ESB)</text>

  <!-- Consumer applications on top -->
  <rect x="100" y="60" width="200" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Web Portal</text>
  <text x="200" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Consumer</text>
  <line x1="200" y1="140" x2="200" y2="280" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="195,275 205,275 200,285" fill="var(--ok-fill)"/>

  <rect x="380" y="60" width="200" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="480" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Mobile App</text>
  <text x="480" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Consumer</text>
  <line x1="480" y1="140" x2="480" y2="280" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="475,275 485,275 480,285" fill="var(--ok-fill)"/>

  <rect x="700" y="60" width="200" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="800" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--ok-accent)">Partner API</text>
  <text x="800" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Consumer</text>
  <line x1="800" y1="140" x2="800" y2="280" stroke="var(--ok-border)" stroke-width="2"/>
  <polygon points="795,275 805,275 800,285" fill="var(--ok-fill)"/>

  <!-- ESB capabilities labels -->
  <text x="250" y="260" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Routing</text>
  <text x="450" y="260" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Transformation</text>
  <text x="680" y="260" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Orchestration</text>
  <text x="900" y="260" font-family="Arial, sans-serif" font-size="11" fill="var(--primary-accent)">Security</text>

  <!-- Services below ESB -->
  <rect x="100" y="420" width="200" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="200" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Customer</text>
  <text x="200" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Service</text>
  <line x1="200" y1="350" x2="200" y2="420" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="195,415 205,415 200,425" fill="var(--warn-fill)"/>

  <rect x="380" y="420" width="200" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="480" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Order</text>
  <text x="480" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Service</text>
  <line x1="480" y1="350" x2="480" y2="420" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="475,415 485,415 480,425" fill="var(--warn-fill)"/>

  <rect x="700" y="420" width="200" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="800" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Inventory</text>
  <text x="800" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Service</text>
  <line x1="800" y1="350" x2="800" y2="420" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="795,415 805,415 800,425" fill="var(--warn-fill)"/>

  <rect x="980" y="420" width="200" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1080" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Payment</text>
  <text x="1080" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-accent)">Service</text>
  <line x1="1080" y1="350" x2="1080" y2="420" stroke="var(--warn-border)" stroke-width="2"/>
  <polygon points="1075,415 1085,415 1080,425" fill="var(--warn-fill)"/>

  <!-- Protocol labels -->
  <text x="150" y="395" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">SOAP/WSDL</text>
  <text x="430" y="395" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">SOAP/WSDL</text>
  <text x="750" y="395" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">SOAP/WSDL</text>
  <text x="1030" y="395" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">SOAP/WSDL</text>

  <!-- Key characteristics -->
  <rect x="140" y="550" width="1000" height="70" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="340" y="580" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Coarse-grained services</text>
  <text x="340" y="600" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">shared schemas and contracts</text>
  <text x="740" y="580" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Centralized governance via ESB</text>
  <text x="740" y="600" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">heavyweight protocols (WS-*)</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,60 5.2093,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="187.1642" width="181.1321" height="432.8358" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130.566" y="446.8657" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046" font-weight="bold">Present</text>
  <text x="130.566" y="576.7164" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046">Architecture</text>
  <line x1="221.1321" y1="403.5821" x2="251.3208" y2="403.5821" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="258.868" y="187.1642" width="166.0377" height="432.8358" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="341.8868" y="446.8657" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046" font-weight="bold">Identify</text>
  <text x="341.8868" y="576.7164" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046">Scenarios</text>
  <line x1="424.9057" y1="403.5821" x2="455.0943" y2="403.5821" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="462.6415" y="187.1642" width="166.0377" height="432.8358" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="545.6604" y="446.8657" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046" font-weight="bold">Analyze</text>
  <text x="545.6604" y="576.7164" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046">Decisions</text>
  <line x1="628.6792" y1="403.5821" x2="658.868" y2="403.5821" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="666.4151" y="187.1642" width="166.0377" height="432.8358" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="749.434" y="446.8657" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046" font-weight="bold">Identify</text>
  <text x="749.434" y="576.7164" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046">Trade-Offs</text>
  <line x1="832.4529" y1="403.5821" x2="862.6415" y2="403.5821" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="870.1887" y="187.1642" width="166.0377" height="432.8358" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="953.2075" y="446.8657" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046" font-weight="bold">Document</text>
  <text x="953.2075" y="576.7164" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046">Risks</text>
  <line x1="1036.2264" y1="403.5821" x2="1066.4151" y2="403.5821" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1073.9623" y="187.1642" width="166.0377" height="432.8358" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1156.9812" y="446.8657" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046" font-weight="bold">Produce</text>
  <text x="1156.9812" y="576.7164" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6046">Report</text>
  <text x="673.9623" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.2053" font-weight="bold" fill="var(--text)">ATAM Process Overview</text>
</svg>
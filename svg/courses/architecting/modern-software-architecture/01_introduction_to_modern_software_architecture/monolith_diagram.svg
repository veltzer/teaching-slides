<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="200" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Monolith Architecture</text>
  <!-- Monolith boundary -->
  <rect x="60" y="45" width="280" height="230" rx="8" fill="none" stroke="#4a90e2" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="200" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4a90e2">Monolith</text>
  <!-- UI -->
  <rect x="100" y="80" width="200" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">User Interface</text>
  <line x1="200" y1="125" x2="200" y2="150" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Business Logic -->
  <rect x="100" y="155" width="200" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="200" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Business Logic</text>
  <line x1="200" y1="200" x2="200" y2="225" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- DAL -->
  <rect x="100" y="230" width="200" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Data Access Layer</text>
  <!-- Arrow to DB -->
  <line x1="200" y1="280" x2="200" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Database -->
  <ellipse cx="200" cy="345" rx="70" ry="25" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="200" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Single Database</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.2431" font-weight="bold" fill="var(--text)">Conway's Law Illustrated</text>
  <rect x="40" y="89.3617" width="556.5217" height="419.5745" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.24 5.12"/>
  <text x="318.2609" y="138.7234" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2258" font-weight="bold" fill="var(--primary-accent)">Organization</text>
  <rect x="83.4783" y="175.7447" width="191.3043" height="98.7234" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.1304" y="237.4468" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2258" fill="var(--primary-text)">Team A</text>
  <rect x="83.4783" y="323.8298" width="191.3043" height="98.7234" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="179.1304" y="385.5319" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2258" fill="var(--primary-text)">Team B</text>
  <rect x="361.7391" y="323.8298" width="191.3043" height="98.7234" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="457.3913" y="385.5319" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2258" fill="var(--primary-text)">Team C</text>
  <line x1="179.1304" y1="274.4681" x2="179.1304" y2="323.8298" stroke="var(--text-faint)" stroke-width="2"/>
  <line x1="274.7826" y1="373.1915" x2="361.7391" y2="373.1915" stroke="var(--text-faint)" stroke-width="2"/>
  <rect x="683.4783" y="89.3617" width="556.5217" height="419.5745" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.24 5.12"/>
  <text x="961.7391" y="138.7234" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2258" font-weight="bold" fill="var(--ok-accent)">System</text>
  <rect x="726.9565" y="175.7447" width="191.3043" height="98.7234" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="822.6087" y="237.4468" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2258" fill="var(--ok-text)">Service A</text>
  <rect x="726.9565" y="323.8298" width="191.3043" height="98.7234" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="822.6087" y="385.5319" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2258" fill="var(--ok-text)">Service B</text>
  <rect x="1005.2174" y="323.8298" width="191.3043" height="98.7234" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1100.8696" y="385.5319" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.2258" fill="var(--ok-text)">Service C</text>
  <line x1="822.6087" y1="274.4681" x2="822.6087" y2="311.4894" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="848.6957" y="304.0851" font-family="Arial, sans-serif" font-size="20.1737" fill="var(--ok-accent)">API</text>
  <line x1="918.2609" y1="373.1915" x2="996.5218" y2="373.1915" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="958.2609" y="360.8511" font-family="Arial, sans-serif" font-size="20.1737" fill="var(--ok-accent)">API</text>
  <line x1="179.1304" y1="237.4468" x2="726.9565" y2="225.1064" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.5333 5.12"/>
  <text x="440" y="200.4255" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1737" fill="var(--text-faint)">Owns</text>
  <line x1="179.1304" y1="385.5319" x2="726.9565" y2="373.1915" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.5333 5.12"/>
  <text x="440" y="353.4468" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1737" fill="var(--text-faint)">Owns</text>
  <line x1="457.3913" y1="385.5319" x2="1005.2174" y2="373.1915" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.5333 5.12"/>
  <text x="718.2609" y="410.2128" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1737" fill="var(--text-faint)">Owns</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.2084" fill="var(--text-muted)" font-style="italic">"Organizations design systems that mirror their communication structure."</text>
</svg>

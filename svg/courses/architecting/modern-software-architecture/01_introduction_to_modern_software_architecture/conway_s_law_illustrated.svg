<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8933" font-weight="bold" fill="var(--text)">Conway's Law Illustrated</text>
  <rect x="51.2" y="81" width="546.1333" height="306" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.24 5.12" />
  <text x="324.2667" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold" fill="var(--primary-accent)">Organization</text>
  <rect x="93.8667" y="144" width="187.7333" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="187.7333" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867">Team A</text>
  <rect x="93.8667" y="252" width="187.7333" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="187.7333" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867">Team B</text>
  <rect x="366.9333" y="252" width="187.7333" height="72" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="460.8" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867">Team C</text>
  <line x1="187.7333" y1="216" x2="187.7333" y2="252" stroke="var(--text-faint)" stroke-width="2" />
  <line x1="281.6" y1="288" x2="366.9333" y2="288" stroke="var(--text-faint)" stroke-width="2" />
  <rect x="682.6667" y="81" width="546.1333" height="306" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="10.24 5.12" />
  <text x="955.7333" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold" fill="var(--ok-accent)">System</text>
  <rect x="725.3333" y="144" width="187.7333" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="819.2" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867">Service A</text>
  <rect x="725.3333" y="252" width="187.7333" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="819.2" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867">Service B</text>
  <rect x="998.4" y="252" width="187.7333" height="72" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1092.2667" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867">Service C</text>
  <line x1="819.2" y1="216" x2="819.2" y2="243" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="844.8" y="237.6" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--ok-accent)">API</text>
  <line x1="913.0667" y1="288" x2="989.8667" y2="288" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="952.32" y="279" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--ok-accent)">API</text>
  <line x1="187.7333" y1="189" x2="725.3333" y2="180" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.5333 5.12" />
  <text x="443.7333" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--text-faint)">Owns</text>
  <line x1="187.7333" y1="297" x2="725.3333" y2="288" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.5333 5.12" />
  <text x="443.7333" y="273.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--text-faint)">Owns</text>
  <line x1="460.8" y1="297" x2="998.4" y2="288" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="8.5333 5.12" />
  <text x="716.8" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--text-faint)">Owns</text>
  <text x="640" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48" fill="var(--text-muted)" font-style="italic">"Organizations design systems that mirror their communication structure."</text>
</svg>
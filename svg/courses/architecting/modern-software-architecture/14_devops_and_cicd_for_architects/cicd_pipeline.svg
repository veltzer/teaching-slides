  <text x="135" y="74.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--primary-text)">1. Code</text>
  <text x="135" y="110.467289719626" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">git push</text>
  <text x="135" y="137.570093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Pull Request</text>
  <text x="135" y="164.672897196262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Review</text>
  <text x="135" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764596" font-style="italic" fill="var(--primary-text)">GitHub / GitLab</text>

  <rect x="245" y="40" width="190" height="184.299065420561" rx="8.32965650973" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="74.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--primary-text)">2. Build</text>
  <text x="340" y="110.467289719626" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Compile</text>
  <text x="340" y="137.570093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Docker image</text>
  <text x="340" y="164.672897196262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--primary-text)">Artifact</text>
  <text x="340" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764596" font-style="italic" fill="var(--primary-text)">Actions / Jenkins</text>

  <rect x="450" y="40" width="190" height="184.299065420561" rx="8.32965650973" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="545" y="74.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--ok-text)">3. Test</text>
  <text x="545" y="110.467289719626" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Unit + integ</text>
  <text x="545" y="137.570093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Coverage gate</text>
  <text x="545" y="164.672897196262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Contract tests</text>
  <text x="545" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764596" font-style="italic" fill="var(--ok-text)">JUnit / Pytest</text>

  <rect x="655" y="40" width="190" height="184.299065420561" rx="8.32965650973" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="74.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--warn-text)">4. Security</text>
  <text x="750" y="110.467289719626" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">SAST</text>
  <text x="750" y="137.570093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Deps + images</text>
  <text x="750" y="164.672897196262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--warn-text)">Secrets scan</text>
  <text x="750" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764596" font-style="italic" fill="var(--warn-text)">Snyk / Trivy</text>

  <rect x="860" y="40" width="190" height="184.299065420561" rx="8.32965650973" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="74.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--info-text)">5. Staging</text>
  <text x="955" y="110.467289719626" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">Deploy staging</text>
  <text x="955" y="137.570093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">E2E tests</text>
  <text x="955" y="164.672897196262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--info-text)">Approval</text>
  <text x="955" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764596" font-style="italic" fill="var(--info-text)">K8s / ECS</text>

  <rect x="1065" y="40" width="175" height="184.299065420561" rx="8.32965650973" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1152" y="74.691588785047" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--ok-text)">6. Prod</text>
  <text x="1152" y="110.467289719626" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Blue/Green</text>
  <text x="1152" y="137.570093457944" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Canary</text>
  <text x="1152" y="164.672897196262" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" fill="var(--ok-text)">Auto rollback</text>
  <text x="1152" y="202.616822429907" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.494484764596" font-style="italic" fill="var(--ok-text)">ArgoCD</text>

  <path d="M 1152 229.719626168225 Q 1152 289.345794392524 640 311.028037383178 Q 150 332.710280373831 140 235.140186915888" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="640" y="300.186915887851" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.576898892028" font-style="italic" fill="var(--text-muted)">Feedback: metrics, alerts, logs</text>

  <rect x="40" y="354.392523364486" width="580" height="37.943925233645" rx="6.247242382297" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="379.327102803739" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" font-weight="bold" fill="var(--primary-text)">CI: stages 1-4</text>

  <rect x="640" y="354.392523364486" width="600" height="37.943925233645" rx="6.247242382297" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="379.327102803739" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" font-weight="bold" fill="var(--ok-text)">CD: stages 5-6</text>

  <text x="640" y="430.280373831776" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.741727146893" font-weight="bold" fill="var(--text)">Architectural Implications</text>

  <rect x="40" y="446.542056074766" width="390" height="173.457943925234" rx="8.32965650973" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="235" y="473.644859813084" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" font-weight="bold" fill="var(--primary-accent)">Deployability</text>
  <text x="60" y="506.168224299065" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">Independent deploys</text>
  <text x="60" y="533.271028037383" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">Feature flags</text>
  <text x="60" y="560.373831775701" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">Back-compat DB</text>

  <rect x="445" y="446.542056074766" width="390" height="173.457943925234" rx="8.32965650973" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="640" y="473.644859813084" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" font-weight="bold" fill="var(--ok-accent)">Test Strategy</text>
  <text x="465" y="506.168224299065" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">Pyramid</text>
  <text x="465" y="533.271028037383" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">Contract tests</text>
  <text x="465" y="560.373831775701" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">Chaos in staging</text>

  <rect x="850" y="446.542056074766" width="390" height="173.457943925234" rx="8.32965650973" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="1045" y="473.644859813084" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.618105955745" font-weight="bold" fill="var(--warn-accent)">DevSecOps</text>
  <text x="870" y="506.168224299065" font-family="Arial, sans-serif" font-size="13.535691828312" fill="var(--text)">Shift-left scans</text>

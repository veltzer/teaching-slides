<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="543.9999" height="580" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5556"/>
  <text x="312" y="77.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.055" fill="var(--danger-accent)" font-weight="bold">Virtual Machines</text>
  <rect x="88.0001" y="489.0323" width="448" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312" y="535.8064" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471" fill="var(--primary-text)">Hardware</text>
  <rect x="88.0001" y="395.4839" width="448" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312" y="442.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471" font-weight="bold" fill="var(--warn-text)">Hypervisor</text>
  <rect x="88.0001" y="208.3871" width="208" height="159.0323" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.0001" y="273.871" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432" fill="var(--danger-text)">Guest OS</text>
  <text x="192.0001" y="311.2903" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432" fill="var(--danger-text)">+ App 1</text>
  <text x="192.0001" y="189.6774" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0392" fill="var(--text-faint)">VM</text>
  <rect x="328" y="208.3871" width="208" height="159.0323" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432" y="273.871" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432" fill="var(--danger-text)">Guest OS</text>
  <text x="432" y="311.2903" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432" fill="var(--danger-text)">+ App 2</text>
  <text x="432" y="189.6774" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0392" fill="var(--text-faint)">VM</text>
  <rect x="664" y="40" width="576" height="580" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5556"/>
  <text x="952" y="77.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.055" fill="var(--ok-accent)" font-weight="bold">Containers</text>
  <rect x="712.0001" y="489.0323" width="480" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="535.8064" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471" fill="var(--primary-text)">Hardware</text>
  <rect x="712.0001" y="395.4839" width="480" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="442.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471" fill="var(--primary-text)">Host OS</text>
  <rect x="712.0001" y="301.9355" width="480" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="348.7096" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471" font-weight="bold" fill="var(--warn-text)">Container Runtime</text>
  <rect x="712.0001" y="152.2581" width="144" height="121.6129" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.0001" y="221.4839" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432" fill="var(--ok-text)">App 1</text>
  <rect x="880" y="152.2581" width="144" height="121.6129" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="221.4839" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432" fill="var(--ok-text)">App 2</text>
  <rect x="1048" y="152.2581" width="144" height="121.6129" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="221.4839" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432" fill="var(--ok-text)">App 3</text>
</svg>

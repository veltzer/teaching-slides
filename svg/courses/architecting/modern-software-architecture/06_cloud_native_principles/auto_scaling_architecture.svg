<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="17.0667" markerHeight="12.6" refX="17.0667" refY="6.3" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="477.8667" y="36" width="307.2" height="81" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="631.4667" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Metrics Collector</text>
  <rect x="477.8667" y="198" width="307.2" height="81" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="631.4667" y="248.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Auto Scaler</text>
  <line x1="631.4667" y1="117" x2="631.4667" y2="198" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrow)" />
  <text x="750.9333" y="144" font-family="Arial, sans-serif" font-size="18.7733" fill="#dc3545">CPU &gt; 70%: Scale Out</text>
  <text x="750.9333" y="172.8" font-family="Arial, sans-serif" font-size="18.7733" fill="#28a745">CPU &lt; 30%: Scale In</text>
  <rect x="409.6" y="360" width="443.7333" height="81" rx="8.5333" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.4133" />
  <text x="631.4667" y="410.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Instance Group</text>
  <line x1="631.4667" y1="279" x2="631.4667" y2="360" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrow)" />
  <rect x="204.8" y="540" width="238.9333" height="81" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="324.2667" y="590.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Instance 1</text>
  <rect x="512" y="540" width="238.9333" height="81" rx="8.5333" fill="#d4edda" stroke="#28a745" stroke-width="3.4133" />
  <text x="631.4667" y="590.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Instance 2</text>
  <rect x="819.2" y="540" width="238.9333" height="81" rx="8.5333" fill="#fff3cd" stroke="#ffc107" stroke-width="3.4133" />
  <text x="938.6667" y="590.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Instance 3 (New)</text>
  <line x1="529.0667" y1="441" x2="324.2667" y2="540" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrow)" />
  <line x1="631.4667" y1="441" x2="631.4667" y2="540" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrow)" />
  <line x1="733.8667" y1="441" x2="938.6667" y2="540" stroke="#4a90e2" stroke-width="3.4133" marker-end="url(#arrow)" />
</svg>
<svg viewBox="0 0 750 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Metrics Collector -->
  <rect x="280" y="20" width="180" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Metrics Collector</text>
  <!-- Auto Scaler -->
  <rect x="280" y="110" width="180" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="370" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Auto Scaler</text>
  <!-- Scale out arrow -->
  <line x1="370" y1="65" x2="370" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="440" y="80" font-family="Arial, sans-serif" font-size="11" fill="#dc3545">CPU &gt; 70%: Scale Out</text>
  <text x="440" y="96" font-family="Arial, sans-serif" font-size="11" fill="#28a745">CPU &lt; 30%: Scale In</text>
  <!-- Instance Group -->
  <rect x="240" y="200" width="260" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Instance Group</text>
  <line x1="370" y1="155" x2="370" y2="200" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Instances -->
  <rect x="120" y="300" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="190" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Instance 1</text>
  <rect x="300" y="300" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="370" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Instance 2</text>
  <rect x="480" y="300" width="140" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="550" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Instance 3 (New)</text>
  <line x1="310" y1="245" x2="190" y2="300" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="245" x2="370" y2="300" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="245" x2="550" y2="300" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>

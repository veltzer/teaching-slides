<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="424.0001" y="40" width="432" height="80.3077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="89.9692" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.1975" font-weight="bold">Metrics Collector</text>
  <rect x="424.0001" y="200.6154" width="432" height="80.3077" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="250.5846" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.1975" font-weight="bold">Auto Scaler</text>
  <line x1="640.0001" y1="120.3077" x2="640.0001" y2="200.6154" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="808" y="147.0769" font-family="Arial, sans-serif" font-size="22.1671" fill="var(--danger-accent)">CPU &gt; 70%: Scale Out</text>
  <text x="808" y="175.6308" font-family="Arial, sans-serif" font-size="22.1671" fill="var(--ok-accent)">CPU &lt; 30%: Scale In</text>
  <rect x="328" y="361.2308" width="624" height="80.3077" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="411.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.1975" font-weight="bold">Instance Group</text>
  <line x1="640.0001" y1="280.9231" x2="640.0001" y2="361.2308" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="539.6923" width="336" height="80.3077" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="208.0001" y="589.6615" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.1823">Instance 1</text>
  <rect x="472" y="539.6923" width="336" height="80.3077" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="640.0001" y="589.6615" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.1823">Instance 2</text>
  <rect x="904" y="539.6923" width="336" height="80.3077" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1072.0001" y="589.6615" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.1823">Instance 3 (New)</text>
  <line x1="496.0001" y1="441.5385" x2="208.0001" y2="539.6923" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="441.5385" x2="640.0001" y2="539.6923" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="784.0001" y1="441.5385" x2="1072.0001" y2="539.6923" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="43.7607" y="164.1026" width="189.6296" height="73.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="138.5755" y="210.0513" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963" font-weight="bold">Load Balancer</text>
  <rect x="306.3248" y="24.6154" width="335.4986" height="278.9744" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.2934" />
  <text x="474.0741" y="57.4359" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043" fill="var(--primary-accent)" font-weight="bold">Web Processes</text>
  <rect x="335.4986" y="73.8462" width="131.2821" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="401.1396" y="109.9487" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043">Web 1</text>
  <rect x="335.4986" y="147.6923" width="131.2821" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="401.1396" y="183.7949" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043">Web 2</text>
  <rect x="335.4986" y="221.5385" width="131.2821" height="57.4359" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="401.1396" y="257.641" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043">Web 3</text>
  <rect x="306.3248" y="344.6154" width="335.4986" height="196.9231" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.2934" />
  <text x="474.0741" y="377.4359" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043" fill="var(--warn-accent)" font-weight="bold">Worker Processes</text>
  <rect x="335.4986" y="393.8462" width="131.2821" height="57.4359" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="401.1396" y="429.9487" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043">Worker 1</text>
  <rect x="481.3675" y="393.8462" width="131.2821" height="57.4359" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="547.0085" y="429.9487" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043">Worker 2</text>
  <rect x="306.3248" y="574.359" width="335.4986" height="65.641" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.2934" />
  <text x="379.2593" y="615.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043" fill="var(--danger-accent)" font-weight="bold">Clock:</text>
  <rect x="452.1937" y="582.5641" width="160.4558" height="49.2308" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="532.4217" y="615.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5043">Scheduler</text>
  <rect x="743.9316" y="377.4359" width="189.6296" height="73.8462" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="838.7464" y="423.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.963">Message Queue</text>
  <line x1="233.3903" y1="180.5128" x2="332.5812" y2="101.7436" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="233.3903" y1="200.2051" x2="332.5812" y2="175.5897" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="233.3903" y1="221.5385" x2="332.5812" y2="249.4359" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="743.9316" y1="413.5385" x2="615.567" y2="421.7436" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="743.9316" y1="413.5385" x2="469.698" y2="421.7436" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="171.4667" width="255.7377" height="69.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.8688" y="214.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3792" font-weight="bold" fill="var(--primary-text)">Load Balancer</text>
  <rect x="394.0984" y="40" width="452.4591" height="262.9334" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.2934"/>
  <text x="620.3279" y="70.9333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--primary-accent)" font-weight="bold">Web Processes</text>
  <rect x="433.4427" y="86.4" width="177.0493" height="54.1333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="521.9672" y="120.4266" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--ok-text)">Web 1</text>
  <rect x="433.4427" y="156" width="177.0493" height="54.1333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="521.9672" y="190.0267" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--ok-text)">Web 2</text>
  <rect x="433.4427" y="225.6" width="177.0493" height="54.1333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="521.9672" y="259.6266" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--ok-text)">Web 3</text>
  <rect x="394.0984" y="341.6" width="452.4591" height="185.6" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.2934"/>
  <text x="620.3279" y="372.5333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--warn-accent)" font-weight="bold">Worker Processes</text>
  <rect x="433.4427" y="388" width="177.0493" height="54.1333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="521.9672" y="422.0266" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--warn-text)">Worker 1</text>
  <rect x="630.1639" y="388" width="177.0493" height="54.1333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="718.6885" y="422.0266" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--warn-text)">Worker 2</text>
  <rect x="394.0984" y="558.1334" width="452.4591" height="61.8666" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.2934"/>
  <text x="492.4591" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--danger-accent)" font-weight="bold">Clock:</text>
  <rect x="590.8197" y="565.8667" width="216.3934" height="46.4" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="699.0165" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--danger-text)">Scheduler</text>
  <rect x="984.2623" y="372.5333" width="255.7377" height="69.6" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.1312" y="415.84" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3792" fill="var(--warn-text)">Message Queue</text>
  <line x1="295.7377" y1="186.9333" x2="429.5082" y2="112.6933" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="295.7377" y1="205.4933" x2="429.5082" y2="182.2933" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="295.7377" y1="225.6" x2="429.5082" y2="251.8933" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="984.2623" y1="406.56" x2="811.1476" y2="414.2933" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="984.2623" y1="406.56" x2="614.4262" y2="414.2933" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

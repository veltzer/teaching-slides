<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="171.4667" width="255.7377" height="69.6" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="167.8688" y="214.7733" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3792" font-weight="bold">Load Balancer</text>
  <rect x="394.0984" y="40" width="452.4591" height="262.9334" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.2934" />
  <text x="620.3279" y="70.9333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--primary-accent)" font-weight="bold">Web Processes</text>
  <rect x="433.4427" y="86.4" width="177.0493" height="54.1333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="521.9672" y="120.4266" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347">Web 1</text>
  <rect x="433.4427" y="156" width="177.0493" height="54.1333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="521.9672" y="190.0267" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347">Web 2</text>
  <rect x="433.4427" y="225.6" width="177.0493" height="54.1333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="521.9672" y="259.6266" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347">Web 3</text>
  <rect x="394.0984" y="341.6" width="452.4591" height="185.6" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.2934" />
  <text x="620.3279" y="372.5333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--warn-accent)" font-weight="bold">Worker Processes</text>
  <rect x="433.4427" y="388" width="177.0493" height="54.1333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="521.9672" y="422.0266" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347">Worker 1</text>
  <rect x="630.1639" y="388" width="177.0493" height="54.1333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="718.6885" y="422.0266" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347">Worker 2</text>
  <rect x="394.0984" y="558.1334" width="452.4591" height="61.8666" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.2934" />
  <text x="492.4591" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347" fill="var(--danger-accent)" font-weight="bold">Clock:</text>
  <rect x="590.8197" y="565.8667" width="216.3934" height="46.4" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="699.0165" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7347">Scheduler</text>
  <rect x="984.2623" y="372.5333" width="255.7377" height="69.6" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1112.1312" y="415.84" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3792">Message Queue</text>
  <line x1="295.7377" y1="186.9333" x2="429.5082" y2="112.6933" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="295.7377" y1="205.4933" x2="429.5082" y2="182.2933" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="295.7377" y1="225.6" x2="429.5082" y2="251.8933" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="984.2623" y1="406.56" x2="811.1476" y2="414.2933" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="984.2623" y1="406.56" x2="614.4262" y2="414.2933" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Client -->
  <rect x="310" y="20" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Client</text>
  <!-- Load Balancer -->
  <rect x="290" y="100" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="370" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Load Balancer</text>
  <!-- Instances -->
  <rect x="80" y="190" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="145" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Instance 1</text>
  <rect x="300" y="190" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="365" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Instance 2</text>
  <rect x="530" y="190" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="595" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Instance 3</text>
  <!-- Shared stores -->
  <rect x="180" y="300" width="160" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="260" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Redis Session Store</text>
  <rect x="410" y="300" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="490" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Database</text>
  <!-- Arrows -->
  <line x1="370" y1="60" x2="370" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="330" y1="140" x2="160" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="140" x2="365" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="140" x2="580" y2="190" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Instance to stores -->
  <line x1="145" y1="230" x2="220" y2="300" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="365" y1="230" x2="270" y2="300" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="595" y1="230" x2="300" y2="300" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="145" y1="230" x2="440" y2="300" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="365" y1="230" x2="480" y2="300" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="595" y1="230" x2="530" y2="300" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Label -->
  <text x="370" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">All instances share external state stores - no local session data</text>
</svg>

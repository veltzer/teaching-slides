<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="515.8621" y="40" width="248.2758" height="65.3521" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="80.8451" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6841" font-weight="bold">Client</text>
  <rect x="474.4828" y="170.7043" width="331.0345" height="65.3521" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="211.5493" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6841">Load Balancer</text>
  <rect x="40" y="317.7465" width="268.9656" height="65.3521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.4828" y="358.5915" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391">Instance 1</text>
  <rect x="495.1725" y="317.7465" width="268.9656" height="65.3521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.6551" y="358.5915" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391">Instance 2</text>
  <rect x="971.0344" y="317.7465" width="268.9656" height="65.3521" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5172" y="358.5915" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391">Instance 3</text>
  <rect x="246.8966" y="497.4649" width="331.0345" height="73.5211" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="412.4138" y="543.2113" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391">Redis Session Store</text>
  <rect x="722.7586" y="497.4649" width="331.0345" height="73.5211" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.2759" y="543.2113" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391">Database</text>
  <line x1="640.0001" y1="105.3521" x2="640.0001" y2="170.7043" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="557.2414" y1="236.0564" x2="205.5173" y2="317.7465" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="236.0564" x2="629.6551" y2="317.7465" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="722.7586" y1="236.0564" x2="1074.4828" y2="317.7465" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="174.4828" y1="383.0987" x2="329.6553" y2="497.4649" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="629.6551" y1="383.0987" x2="433.1034" y2="497.4649" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1105.5172" y1="383.0987" x2="495.1725" y2="497.4649" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="174.4828" y1="383.0987" x2="784.8275" y2="497.4649" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="629.6551" y1="383.0987" x2="867.5862" y2="497.4649" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1105.5172" y1="383.0987" x2="971.0344" y2="497.4649" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640.0001" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1941" fill="var(--text-muted)">All instances share external state stores - no local session data</text>
</svg>
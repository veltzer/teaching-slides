<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="515.8621" y="40" width="248.2758" height="65.3521" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="80.8451" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6841" font-weight="bold" fill="var(--primary-text)">Client</text>
  <rect x="474.4828" y="170.7043" width="331.0345" height="65.3521" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.0001" y="211.5493" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6841" fill="var(--warn-text)">Load Balancer</text>
  <rect x="40" y="317.7465" width="268.9656" height="65.3521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="174.4828" y="358.5915" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391" fill="var(--ok-text)">Instance 1</text>
  <rect x="495.1725" y="317.7465" width="268.9656" height="65.3521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="629.6551" y="358.5915" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391" fill="var(--ok-text)">Instance 2</text>
  <rect x="971.0344" y="317.7465" width="268.9656" height="65.3521" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1105.5172" y="358.5915" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391" fill="var(--ok-text)">Instance 3</text>
  <rect x="246.8966" y="497.4649" width="331.0345" height="73.5211" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="412.4138" y="543.2113" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391" fill="var(--danger-text)">Redis Session Store</text>
  <rect x="722.7586" y="497.4649" width="331.0345" height="73.5211" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="888.2759" y="543.2113" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9391" fill="var(--primary-text)">Database</text>
  <line x1="640.0001" y1="105.3521" x2="640.0001" y2="170.7043" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="557.2414" y1="236.0564" x2="205.5173" y2="317.7465" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640.0001" y1="236.0564" x2="629.6551" y2="317.7465" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="722.7586" y1="236.0564" x2="1074.4828" y2="317.7465" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="174.4828" y1="383.0987" x2="329.6553" y2="497.4649" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="629.6551" y1="383.0987" x2="433.1034" y2="497.4649" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1105.5172" y1="383.0987" x2="495.1725" y2="497.4649" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="174.4828" y1="383.0987" x2="784.8275" y2="497.4649" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="629.6551" y1="383.0987" x2="867.5862" y2="497.4649" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1105.5172" y1="383.0987" x2="971.0344" y2="497.4649" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640.0001" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1941" fill="var(--text-muted)">All instances share external state stores - no local session data</text>
</svg>

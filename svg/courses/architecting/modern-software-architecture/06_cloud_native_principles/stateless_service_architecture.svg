<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="476.5519" y="34.1333" width="184.4717" height="68.2667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="568.7878" y="76.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9845" font-weight="bold">Client</text>
  <rect x="445.8066" y="170.6667" width="245.9623" height="68.2667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="568.7878" y="213.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9845">Load Balancer</text>
  <rect x="122.9811" y="324.2667" width="199.8444" height="68.2667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="222.9033" y="366.9333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4472">Instance 1</text>
  <rect x="461.1793" y="324.2667" width="199.8444" height="68.2667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="561.1014" y="366.9333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4472">Instance 2</text>
  <rect x="814.75" y="324.2667" width="199.8444" height="68.2667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="914.6722" y="366.9333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4472">Instance 3</text>
  <rect x="276.7076" y="512.0001" width="245.9623" height="76.8" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="399.6887" y="559.7867" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4472">Redis Session Store</text>
  <rect x="630.2783" y="512.0001" width="245.9623" height="76.8" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="753.2595" y="559.7867" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4472">Database</text>
  <line x1="568.7878" y1="102.4" x2="568.7878" y2="170.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="507.2972" y1="238.9334" x2="245.9623" y2="324.2667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="568.7878" y1="238.9334" x2="561.1014" y2="324.2667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="630.2783" y1="238.9334" x2="891.6133" y2="324.2667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="222.9033" y1="392.5334" x2="338.1982" y2="512.0001" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="561.1014" y1="392.5334" x2="415.0613" y2="512.0001" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="914.6722" y1="392.5334" x2="461.1793" y2="512.0001" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="222.9033" y1="392.5334" x2="676.3962" y2="512.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="561.1014" y1="392.5334" x2="737.8868" y2="512.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="914.6722" y1="392.5334" x2="814.75" y2="512.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="568.7878" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9099" fill="var(--text-muted)">All instances share external state stores - no local session data</text>
</svg>
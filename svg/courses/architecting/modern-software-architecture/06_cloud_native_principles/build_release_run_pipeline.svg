<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,28.8 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="130.625" width="213.6986" height="163.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="232.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532">Source Code</text>
  <rect x="352.3288" y="130.625" width="213.6986" height="163.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="459.1781" y="232.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532">Build Artifact</text>
  <rect x="352.3288" y="456.875" width="213.6986" height="163.125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="459.1781" y="558.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532">Config</text>
  <rect x="681.0959" y="275.625" width="213.6986" height="163.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.9452" y="377.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532" font-weight="bold">Release</text>
  <rect x="1009.863" y="275.625" width="230.137" height="163.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9315" y="377.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532">Running Process</text>
  <line x1="253.6986" y1="210.375" x2="352.3288" y2="210.375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="303.0137" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-muted)">Build</text>
  <line x1="566.0274" y1="210.375" x2="681.0959" y2="319.125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="566.0274" y1="536.625" x2="681.0959" y2="391.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="894.7945" y1="355.375" x2="1009.863" y2="355.375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="952.3288" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-muted)">Run</text>
  <text x="146.8493" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-faint)">Stage 1</text>
  <text x="787.9452" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-faint)">Stage 2</text>
  <text x="1124.9315" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-faint)">Stage 3</text>
</svg>
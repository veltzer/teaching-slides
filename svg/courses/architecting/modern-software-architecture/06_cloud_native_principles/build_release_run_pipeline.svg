<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="130.625" width="213.6986" height="163.125" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="232.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532" fill="var(--primary-text)">Source Code</text>
  <rect x="352.3288" y="130.625" width="213.6986" height="163.125" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="459.1781" y="232.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532" fill="var(--ok-text)">Build Artifact</text>
  <rect x="352.3288" y="456.875" width="213.6986" height="163.125" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="459.1781" y="558.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532" fill="var(--warn-text)">Config</text>
  <rect x="681.0959" y="275.625" width="213.6986" height="163.125" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.9452" y="377.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532" font-weight="bold" fill="var(--primary-text)">Release</text>
  <rect x="1009.863" y="275.625" width="230.137" height="163.125" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9315" y="377.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.6532" fill="var(--ok-text)">Running Process</text>
  <line x1="253.6986" y1="210.375" x2="352.3288" y2="210.375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="303.0137" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-muted)">Build</text>
  <line x1="566.0274" y1="210.375" x2="681.0959" y2="319.125" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="566.0274" y1="536.625" x2="681.0959" y2="391.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="894.7945" y1="355.375" x2="1009.863" y2="355.375" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="952.3288" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-muted)">Run</text>
  <text x="146.8493" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-faint)">Stage 1</text>
  <text x="787.9452" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-faint)">Stage 2</text>
  <text x="1124.9315" y="203.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.0143" fill="var(--text-faint)">Stage 3</text>
</svg>

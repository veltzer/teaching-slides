<svg viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Source Code -->
  <rect x="30" y="80" width="130" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="95" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Source Code</text>
  <!-- Build Artifact -->
  <rect x="220" y="80" width="130" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="285" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Build Artifact</text>
  <!-- Config -->
  <rect x="220" y="170" width="130" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="285" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Config</text>
  <!-- Release -->
  <rect x="420" y="120" width="130" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="485" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Release</text>
  <!-- Running Process -->
  <rect x="620" y="120" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="690" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Running Process</text>
  <!-- Arrows -->
  <line x1="160" y1="102" x2="220" y2="102" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="190" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Build</text>
  <line x1="350" y1="102" x2="420" y2="132" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="192" x2="420" y2="152" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="142" x2="620" y2="142" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="585" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Run</text>
  <!-- Stage labels -->
  <text x="95" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999">Stage 1</text>
  <text x="485" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999">Stage 2</text>
  <text x="690" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999">Stage 3</text>
</svg>

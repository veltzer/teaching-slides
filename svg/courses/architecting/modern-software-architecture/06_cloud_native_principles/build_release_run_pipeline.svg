  <rect x="672" y="345.6" width="208" height="129.6" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="776" y="426.24" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Release</text>
  <rect x="992" y="345.6" width="224" height="129.6" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="1104" y="426.24" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8">Running Process</text>
  <line x1="256" y1="293.76" x2="352" y2="293.76" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="304" y="273.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#666">Build</text>
  <line x1="560" y1="293.76" x2="672" y2="380.16" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="560" y1="552.96" x2="672" y2="437.76" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="880" y1="408.96" x2="992" y2="408.96" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="936" y="388.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#666">Run</text>
  <text x="152" y="158.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#999">Stage 1</text>
  <text x="776" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#999">Stage 2</text>
  <text x="1104" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#999">Stage 3</text>

  <text x="115" y="156.8056" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">One repo, many deploys</text>
  <rect x="81.25" y="164.8611" width="250.3125" height="27.3889" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="115" y="176.9444" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">II. Dependencies</text>
  <text x="115" y="189.0277" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Explicitly declare &amp; isolate deps</text>
  <rect x="81.25" y="197.0833" width="250.3125" height="27.3889" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="115" y="209.1667" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--primary-accent)">III. Config</text>
  <text x="115" y="221.25" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Store config in environment</text>

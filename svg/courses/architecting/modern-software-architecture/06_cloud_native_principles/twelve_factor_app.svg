  <rect x="363.4375" y="100.4167" width="276.5625" height="25.7777" rx="6" fill="var(--ok-accent)" />
  <rect x="363.4375" y="116.5277" width="276.5625" height="9.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="501.25" y="118.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--bg)">Services &amp; Build</text>
  <rect x="376.5625" y="132.6389" width="250.3125" height="27.3889" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="410.3125" y="144.7223" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">IV. Backing Services</text>
  <text x="410.3125" y="156.8056" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Treat as attached resources</text>
  <rect x="376.5625" y="164.8611" width="250.3125" height="27.3889" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="410.3125" y="176.9444" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--ok-accent)">V. Build, Release, Run</text>

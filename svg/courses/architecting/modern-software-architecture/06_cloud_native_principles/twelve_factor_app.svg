<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>


  <rect x="40" y="40" width="289.830508474576" height="259.029126213592" rx="8.561502515622" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="184.406779661017" y="73.78640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.193192845696" font-weight="bold" fill="var(--primary-text)">Code + Config</text>
  <text x="65.423728813559" y="118.834951456311" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--primary-text)">I. Codebase</text>
  <text x="65.423728813559" y="141.359223300971" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--primary-text)">One repo, many deploys</text>
  <text x="65.423728813559" y="180.776699029126" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--primary-text)">II. Dependencies</text>
  <text x="65.423728813559" y="203.300970873787" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--primary-text)">Declare and isolate</text>
  <text x="65.423728813559" y="242.718446601942" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--primary-text)">III. Config</text>
  <text x="65.423728813559" y="265.242718446602" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--primary-text)">In environment vars</text>

  <rect x="340" y="40" width="289.830508474576" height="259.029126213592" rx="8.561502515622" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="484.406779661017" y="73.78640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.193192845696" font-weight="bold" fill="var(--ok-text)">Services + Build</text>
  <text x="365.423728813559" y="118.834951456311" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--ok-text)">IV. Backing Services</text>
  <text x="365.423728813559" y="141.359223300971" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--ok-text)">Attached resources</text>
  <text x="365.423728813559" y="180.776699029126" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--ok-text)">V. Build/Release/Run</text>
  <text x="365.423728813559" y="203.300970873787" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--ok-text)">Strict separation</text>
  <text x="365.423728813559" y="242.718446601942" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--ok-text)">VI. Processes</text>
  <text x="365.423728813559" y="265.242718446602" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--ok-text)">Stateless</text>

  <rect x="640" y="40" width="289.830508474576" height="259.029126213592" rx="8.561502515622" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.406779661017" y="73.78640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.193192845696" font-weight="bold" fill="var(--warn-text)">Runtime + Scale</text>
  <text x="665.423728813559" y="118.834951456311" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--warn-text)">VII. Port Binding</text>
  <text x="665.423728813559" y="141.359223300971" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--warn-text)">Self-contained</text>
  <text x="665.423728813559" y="180.776699029126" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--warn-text)">VIII. Concurrency</text>
  <text x="665.423728813559" y="203.300970873787" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--warn-text)">Scale horizontally</text>
  <text x="665.423728813559" y="242.718446601942" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--warn-text)">IX. Disposability</text>
  <text x="665.423728813559" y="265.242718446602" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--warn-text)">Fast start/stop</text>

  <rect x="940" y="40" width="300" height="259.029126213592" rx="8.561502515622" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1089.491525423729" y="73.78640776699" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.193192845696" font-weight="bold" fill="var(--info-text)">Operations</text>
  <text x="965.423728813559" y="118.834951456311" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--info-text)">X. Dev/Prod Parity</text>
  <text x="965.423728813559" y="141.359223300971" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--info-text)">Keep environments close</text>
  <text x="965.423728813559" y="180.776699029126" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--info-text)">XI. Logs</text>
  <text x="965.423728813559" y="203.300970873787" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--info-text)">Event streams</text>
  <text x="965.423728813559" y="242.718446601942" font-family="Arial, sans-serif" font-size="14.982629402338" font-weight="bold" fill="var(--info-text)">XII. Admin</text>
  <text x="965.423728813559" y="265.242718446602" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--info-text)">One-off processes</text>

  <rect x="40" y="332.815533980582" width="1200" height="287.184466019418" rx="8.561502515622" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="372.233009708738" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.263380660149" font-weight="bold" fill="var(--text)">Lifecycle Flow</text>

  <rect x="70.508474576271" y="400.388349514564" width="172.881355932203" height="101.35922330097" rx="6.421126886717" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="156.949152542373" y="434.174757281554" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.052817216791" font-weight="bold" fill="var(--primary-text)">Develop</text>
  <text x="156.949152542373" y="467.961165048544" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--primary-text)">I, II, III</text>

  <rect x="263.728813559322" y="400.388349514564" width="172.881355932203" height="101.35922330097" rx="6.421126886717" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="350.169491525424" y="434.174757281554" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.052817216791" font-weight="bold" fill="var(--ok-text)">Build</text>
  <text x="350.169491525424" y="467.961165048544" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--ok-text)">IV, V</text>

  <rect x="456.949152542373" y="400.388349514564" width="172.881355932203" height="101.35922330097" rx="6.421126886717" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="543.389830508475" y="434.174757281554" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.052817216791" font-weight="bold" fill="var(--warn-text)">Deploy</text>
  <text x="543.389830508475" y="467.961165048544" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--warn-text)">VII, X</text>

  <rect x="650.169491525424" y="400.388349514564" width="172.881355932203" height="101.35922330097" rx="6.421126886717" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="736.610169491525" y="434.174757281554" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.052817216791" font-weight="bold" fill="var(--info-text)">Run</text>
  <text x="736.610169491525" y="467.961165048544" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--info-text)">VI, VIII, IX</text>

  <rect x="843.389830508475" y="400.388349514564" width="172.881355932203" height="101.35922330097" rx="6.421126886717" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="929.830508474576" y="434.174757281554" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.052817216791" font-weight="bold" fill="var(--danger-text)">Observe</text>
  <text x="929.830508474576" y="467.961165048544" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.912441587886" fill="var(--danger-text)">XI, XII</text>

  <line x1="243.389830508475" y1="451.067961165048" x2="261.694915254237" y2="451.067961165048" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="436.610169491525" y1="451.067961165048" x2="454.915254237288" y2="451.067961165048" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="629.830508474576" y1="451.067961165048" x2="648.135593220339" y2="451.067961165048" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="823.050847457627" y1="451.067961165048" x2="841.35593220339" y2="451.067961165048" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="640" y="569.320388349514" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.982629402338" fill="var(--text-muted)">Portable, scalable, deploy-anywhere</text>
</svg>

  <rect x="586.6667" y="66.6667" width="262.2222" height="28.4444" rx="6" fill="var(--warn-accent)" />
  <rect x="586.6667" y="84.4444" width="262.2222" height="10.6667" fill="var(--warn-accent)" rx="6"/>
  <text x="717.3333" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)">Runtime &amp; Scaling</text>
  <rect x="599.1111" y="102.2222" width="237.3333" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="631.1111" y="115.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-accent)">VII. Port Binding</text>
  <text x="631.1111" y="128.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Export services via port binding</text>
  <rect x="599.1111" y="137.7778" width="237.3333" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="631.1111" y="151.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-accent)">VIII. Concurrency</text>
  <text x="631.1111" y="164.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Scale out via process model</text>
  <rect x="599.1111" y="173.3333" width="237.3333" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="631.1111" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--warn-accent)">IX. Disposability</text>

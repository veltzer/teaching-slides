  <text x="640" y="72.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.3806" font-weight="bold" fill="var(--bg)">The 12-Factor App — Four Groups of Best Practices</text>
  <rect x="68.125" y="100.4167" width="276.5625" height="140.9723" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="68.125" y="100.4167" width="276.5625" height="25.7777" rx="6" fill="var(--primary-accent)" />
  <rect x="68.125" y="116.5277" width="276.5625" height="9.6667" fill="var(--primary-accent)" rx="6"/>
  <text x="205.9375" y="118.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--bg)">Code &amp; Source Control</text>
  <rect x="81.25" y="132.6389" width="250.3125" height="27.3889" rx="6" fill="var(--bg)" filter="url(#shadow)" />

  <text x="988.4444" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)">Operations</text>
  <rect x="879.1111" y="102.2222" width="219.5556" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="911.1111" y="115.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--info-accent)">X. Dev/Prod Parity</text>
  <text x="911.1111" y="128.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Keep dev, staging, prod similar</text>
  <rect x="879.1111" y="137.7778" width="219.5556" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="911.1111" y="151.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--info-accent)">XI. Logs</text>
  <text x="911.1111" y="164.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Treat logs as event streams</text>
  <rect x="879.1111" y="173.3333" width="219.5556" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="911.1111" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--info-accent)">XII. Admin Processes</text>

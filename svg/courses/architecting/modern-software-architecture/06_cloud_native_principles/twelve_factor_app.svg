  <text x="1000.9375" y="144.7223" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--info-accent)">X. Dev/Prod Parity</text>
  <text x="1000.9375" y="156.8056" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Keep dev, staging, prod similar</text>

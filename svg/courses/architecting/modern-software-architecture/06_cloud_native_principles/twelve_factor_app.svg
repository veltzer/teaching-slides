  <text x="568.8889" y="386.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text-muted)">Goal: portable, scalable, deployable-anywhere applications — cloud, on-prem, or hybrid</text>

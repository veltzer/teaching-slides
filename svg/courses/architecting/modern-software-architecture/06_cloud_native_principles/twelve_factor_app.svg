  <text x="804.262362" y="134.113112" text-anchor="middle" font-size="14.52486" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Runtime &amp; Scaling</text>
  <rect x="673.442678" y="152.716963" width="262.622974" height="37.207566" rx="7.16316" fill="var(--bg)" />
  <text x="708.852517" y="169.132149" font-size="13.487515" font-weight="bold" fill="var(--warn-accent)" font-family="Arial, sans-serif">VII. Port Binding</text>

  <ns0:text x="680" y="297.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#6a1b9a">Run</ns0:text>
  <ns0:text x="680" y="312.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#212121">VI. Processes</ns0:text>
  <ns0:text x="680" y="326.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#212121">VIII. Concurrency</ns0:text>
  <ns0:text x="680" y="339.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#212121">IX. Disposability</ns0:text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="1200" height="48.150888" rx="7.16316" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640.000052" y="70.641573" text-anchor="middle" font-size="20.750004" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">The 12-Factor App — Four Groups of Best Practices</text>
  <rect x="40" y="108.943403" width="290.16396" height="191.50956" rx="7.16316" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="108.943403" width="290.16396" height="35.018766" rx="7.16316" fill="var(--primary-accent)" />
  <rect x="40" y="130.830047" width="290.16396" height="13.132122" fill="var(--primary-accent)" rx="7.16316"/>
  <text x="184.590177" y="134.113112" text-anchor="middle" font-size="14.52486" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Code &amp; Source Control</text>
  <rect x="53.770493" y="152.716963" width="262.622974" height="37.207566" rx="7.16316" fill="var(--bg)" />
  <text x="89.180332" y="169.132149" font-size="13.487515" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">I. Codebase</text>
  <text x="89.180332" y="185.5472" font-size="11.938601" fill="var(--text-muted)" font-family="Arial, sans-serif">One repo, many deploys</text>
  <rect x="53.770493" y="196.490522" width="262.622974" height="37.207566" rx="7.16316" fill="var(--bg)" />
  <text x="89.180332" y="212.905573" font-size="13.487515" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">II. Dependencies</text>
  <text x="89.180332" y="229.320623" font-size="11.938601" fill="var(--text-muted)" font-family="Arial, sans-serif">Explicitly declare &amp; isolate deps</text>
  <rect x="53.770493" y="240.264081" width="262.622974" height="37.207566" rx="7.16316" fill="var(--bg)" />
  <text x="89.180332" y="256.679268" font-size="13.487515" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">III. Config</text>
  <text x="89.180332" y="273.094319" font-size="11.938601" fill="var(--text-muted)" font-family="Arial, sans-serif">Store config in environment</text>
  <rect x="349.836093" y="108.943403" width="290.16396" height="191.50956" rx="7.16316" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="349.836093" y="108.943403" width="290.16396" height="35.018766" rx="7.16316" fill="var(--ok-accent)" />
  <rect x="349.836093" y="130.830047" width="290.16396" height="13.132122" fill="var(--ok-accent)" rx="7.16316"/>
  <text x="494.426269" y="134.113112" text-anchor="middle" font-size="14.52486" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Services &amp; Build</text>
  <rect x="363.606586" y="152.716963" width="262.622974" height="37.207566" rx="7.16316" fill="var(--bg)" />
  <text x="399.016425" y="169.132149" font-size="13.487515" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">IV. Backing Services</text>
  <text x="399.016425" y="185.5472" font-size="11.938601" fill="var(--text-muted)" font-family="Arial, sans-serif">Treat as attached resources</text>
  <rect x="363.606586" y="196.490522" width="262.622974" height="37.207566" rx="7.16316" fill="var(--bg)" />
  <text x="399.016425" y="212.905573" font-size="13.487515" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">V. Build, Release, Run</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <rect x="26.6667" y="10.6667" width="1084.4444" height="39.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="35.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">The 12-Factor App — Four Groups of Best Practices</text>
  <rect x="26.6667" y="66.6667" width="262.2222" height="155.5556" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="26.6667" y="66.6667" width="262.2222" height="28.4444" rx="6" fill="var(--primary-accent)" />
  <rect x="26.6667" y="84.4444" width="262.2222" height="10.6667" fill="var(--primary-accent)" rx="6"/>
  <text x="157.3333" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)">Code &amp; Source Control</text>
  <rect x="39.1111" y="102.2222" width="237.3333" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="71.1111" y="115.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)">I. Codebase</text>
  <text x="71.1111" y="128.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">One repo, many deploys</text>
  <rect x="39.1111" y="137.7778" width="237.3333" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="71.1111" y="151.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)">II. Dependencies</text>
  <text x="71.1111" y="164.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Explicitly declare &amp; isolate deps</text>
  <rect x="39.1111" y="173.3333" width="237.3333" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="71.1111" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--primary-accent)">III. Config</text>
  <text x="71.1111" y="200" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Store config in environment</text>
  <rect x="306.6667" y="66.6667" width="262.2222" height="155.5556" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <rect x="306.6667" y="66.6667" width="262.2222" height="28.4444" rx="6" fill="var(--ok-accent)" />
  <rect x="306.6667" y="84.4444" width="262.2222" height="10.6667" fill="var(--ok-accent)" rx="6"/>
  <text x="437.3333" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="var(--bg)">Services &amp; Build</text>
  <rect x="319.1111" y="102.2222" width="237.3333" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="351.1111" y="115.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">IV. Backing Services</text>
  <text x="351.1111" y="128.8889" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Treat as attached resources</text>
  <rect x="319.1111" y="137.7778" width="237.3333" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="351.1111" y="151.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">V. Build, Release, Run</text>
  <text x="351.1111" y="164.4444" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Strict stage separation</text>
  <rect x="319.1111" y="173.3333" width="237.3333" height="30.2222" rx="6" fill="var(--bg)" filter="url(#shadow)" />
  <text x="351.1111" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="var(--ok-accent)">VI. Processes</text>
  <text x="351.1111" y="200" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Execute as stateless processes</text>

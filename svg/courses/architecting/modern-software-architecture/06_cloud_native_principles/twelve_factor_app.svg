  <text x="705.625" y="144.7223" font-family="Arial,sans-serif" font-size="11.2974" font-weight="bold" fill="var(--warn-accent)">VII. Port Binding</text>
  <text x="705.625" y="156.8056" font-family="Arial,sans-serif" font-size="10" fill="var(--text-muted)">Export services via port binding</text>

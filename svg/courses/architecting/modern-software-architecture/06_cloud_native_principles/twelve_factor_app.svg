  <rect x="363.606586" y="240.264081" width="262.622974" height="37.207566" rx="7.16316" fill="var(--bg)" />
  <text x="399.016425" y="256.679268" font-size="13.487515" font-weight="bold" fill="var(--ok-accent)" font-family="Arial, sans-serif">VI. Processes</text>
  <text x="399.016425" y="273.094319" font-size="11.938601" fill="var(--text-muted)" font-family="Arial, sans-serif">Execute as stateless processes</text>

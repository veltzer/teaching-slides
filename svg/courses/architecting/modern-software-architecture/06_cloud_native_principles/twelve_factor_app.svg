  <ns0:text x="568.8889" y="35.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">The 12-Factor App — Four Groups of Best Practices</ns0:text>
  <ns0:rect x="26.6667" y="66.6667" width="262.2222" height="155.5556" rx="7.1111" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.7778" />
  <ns0:rect x="26.6667" y="66.6667" width="262.2222" height="28.4444" rx="7.1111" fill="#1565c0" />
  <ns0:rect x="26.6667" y="84.4444" width="262.2222" height="10.6667" fill="#1565c0" />
  <ns0:text x="157.3333" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#ffffff">Code &amp; Source Control</ns0:text>
  <ns0:rect x="39.1111" y="102.2222" width="237.3333" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="71.1111" y="115.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">I. Codebase</ns0:text>
  <ns0:text x="71.1111" y="128.8889" font-family="Arial,sans-serif" font-size="10" fill="#555555">One repo, many deploys</ns0:text>
  <ns0:rect x="39.1111" y="137.7778" width="237.3333" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="71.1111" y="151.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">II. Dependencies</ns0:text>
  <ns0:text x="71.1111" y="164.4444" font-family="Arial,sans-serif" font-size="10" fill="#555555">Explicitly declare &amp; isolate deps</ns0:text>
  <ns0:rect x="39.1111" y="173.3333" width="237.3333" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="71.1111" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#1565c0">III. Config</ns0:text>
  <ns0:text x="71.1111" y="200" font-family="Arial,sans-serif" font-size="10" fill="#555555">Store config in environment</ns0:text>
  <ns0:rect x="306.6667" y="66.6667" width="262.2222" height="155.5556" rx="7.1111" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.7778" />
  <ns0:rect x="306.6667" y="66.6667" width="262.2222" height="28.4444" rx="7.1111" fill="#2e7d32" />
  <ns0:rect x="306.6667" y="84.4444" width="262.2222" height="10.6667" fill="#2e7d32" />
  <ns0:text x="437.3333" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#ffffff">Services &amp; Build</ns0:text>
  <ns0:rect x="319.1111" y="102.2222" width="237.3333" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="351.1111" y="115.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">IV. Backing Services</ns0:text>
  <ns0:text x="351.1111" y="128.8889" font-family="Arial,sans-serif" font-size="10" fill="#555555">Treat as attached resources</ns0:text>
  <ns0:rect x="319.1111" y="137.7778" width="237.3333" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="351.1111" y="151.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">V. Build, Release, Run</ns0:text>
  <ns0:text x="351.1111" y="164.4444" font-family="Arial,sans-serif" font-size="10" fill="#555555">Strict stage separation</ns0:text>
  <ns0:rect x="319.1111" y="173.3333" width="237.3333" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="351.1111" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#2e7d32">VI. Processes</ns0:text>
  <ns0:text x="351.1111" y="200" font-family="Arial,sans-serif" font-size="10" fill="#555555">Execute as stateless processes</ns0:text>
  <ns0:rect x="586.6667" y="66.6667" width="262.2222" height="155.5556" rx="7.1111" fill="#fff3e0" stroke="#e65100" stroke-width="1.7778" />
  <ns0:rect x="586.6667" y="66.6667" width="262.2222" height="28.4444" rx="7.1111" fill="#e65100" />
  <ns0:rect x="586.6667" y="84.4444" width="262.2222" height="10.6667" fill="#e65100" />
  <ns0:text x="717.3333" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#ffffff">Runtime &amp; Scaling</ns0:text>
  <ns0:rect x="599.1111" y="102.2222" width="237.3333" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="631.1111" y="115.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#e65100">VII. Port Binding</ns0:text>
  <ns0:text x="631.1111" y="128.8889" font-family="Arial,sans-serif" font-size="10" fill="#555555">Export services via port binding</ns0:text>
  <ns0:rect x="599.1111" y="137.7778" width="237.3333" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="631.1111" y="151.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#e65100">VIII. Concurrency</ns0:text>
  <ns0:text x="631.1111" y="164.4444" font-family="Arial,sans-serif" font-size="10" fill="#555555">Scale out via process model</ns0:text>
  <ns0:rect x="599.1111" y="173.3333" width="237.3333" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="631.1111" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#e65100">IX. Disposability</ns0:text>
  <ns0:text x="631.1111" y="200" font-family="Arial,sans-serif" font-size="10" fill="#555555">Fast startup, graceful shutdown</ns0:text>
  <ns0:rect x="866.6667" y="66.6667" width="244.4444" height="155.5556" rx="7.1111" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.7778" />

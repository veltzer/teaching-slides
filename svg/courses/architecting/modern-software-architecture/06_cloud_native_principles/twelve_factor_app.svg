  <ns0:rect x="866.6667" y="84.4444" width="244.4444" height="10.6667" fill="#6a1b9a" />
  <ns0:text x="988.4444" y="87.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#ffffff">Operations</ns0:text>
  <ns0:rect x="879.1111" y="102.2222" width="219.5556" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="911.1111" y="115.5556" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#6a1b9a">X. Dev/Prod Parity</ns0:text>
  <ns0:text x="911.1111" y="128.8889" font-family="Arial,sans-serif" font-size="10" fill="#555555">Keep dev, staging, prod similar</ns0:text>
  <ns0:rect x="879.1111" y="137.7778" width="219.5556" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="911.1111" y="151.1111" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#6a1b9a">XI. Logs</ns0:text>
  <ns0:text x="911.1111" y="164.4444" font-family="Arial,sans-serif" font-size="10" fill="#555555">Treat logs as event streams</ns0:text>
  <ns0:rect x="879.1111" y="173.3333" width="219.5556" height="30.2222" rx="4.4444" fill="#ffffff" filter="url(#shadow)" />
  <ns0:text x="911.1111" y="186.6667" font-family="Arial,sans-serif" font-size="11.5556" font-weight="bold" fill="#6a1b9a">XII. Admin Processes</ns0:text>
  <ns0:text x="911.1111" y="200" font-family="Arial,sans-serif" font-size="10" fill="#555555">Run admin tasks as one-off processes</ns0:text>

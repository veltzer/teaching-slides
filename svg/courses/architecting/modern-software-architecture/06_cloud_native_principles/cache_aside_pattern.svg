<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.9733,0" fill="#dc3545" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <rect x="127.4311" y="32" width="159.2889" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="207.0756" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7076" font-weight="bold">App</text>
  <rect x="493.7956" y="32" width="159.2889" height="64" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="573.44" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7076" font-weight="bold">Cache</text>
  <rect x="860.16" y="32" width="159.2889" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="939.8044" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.7076" font-weight="bold">Database</text>
  <line x1="207.0756" y1="96" x2="207.0756" y2="640" stroke="var(--text-faint)" stroke-width="1.5929" stroke-dasharray="6.3716" />
  <line x1="573.44" y1="96" x2="573.44" y2="640" stroke="var(--text-faint)" stroke-width="1.5929" stroke-dasharray="6.3716" />
  <line x1="939.8044" y1="96" x2="939.8044" y2="640" stroke="var(--text-faint)" stroke-width="1.5929" stroke-dasharray="6.3716" />
  <line x1="215.04" y1="144" x2="565.4756" y2="144" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="390.2577" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5217">1. Get(key)</text>
  <line x1="565.4756" y1="192" x2="215.04" y2="192" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.9644" marker-end="url(#arrow-danger)" />
  <text x="390.2577" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5217" fill="var(--danger-accent)">2. Cache Miss</text>
  <line x1="215.04" y1="256" x2="931.84" y2="256" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="573.44" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5217">3. Query</text>
  <line x1="931.84" y1="304" x2="215.04" y2="304" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.9644" marker-end="url(#arrow-ok)" />
  <text x="573.44" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5217" fill="var(--ok-accent)">4. Data</text>
  <line x1="215.04" y1="368" x2="565.4756" y2="368" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="390.2577" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5217">5. Set(key, data)</text>
  <rect x="95.5733" y="432" width="1019.4489" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="605.2977" y="459.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5217" fill="var(--text-muted)">Next Request</text>
  <line x1="215.04" y1="512" x2="565.4756" y2="512" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="390.2577" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5217">6. Get(key)</text>
  <line x1="565.4756" y1="560" x2="215.04" y2="560" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.9644" marker-end="url(#arrow-ok)" />
  <text x="390.2577" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5217" fill="var(--ok-accent)">7. Cache Hit - Return Data</text>
</svg>
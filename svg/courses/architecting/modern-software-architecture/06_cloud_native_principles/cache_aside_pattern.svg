<svg viewBox="0 0 750 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Participants -->
  <rect x="80" y="20" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="130" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">App</text>
  <rect x="310" y="20" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Cache</text>
  <rect x="540" y="20" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="590" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Database</text>
  <!-- Lifelines -->
  <line x1="130" y1="60" x2="130" y2="400" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
  <line x1="360" y1="60" x2="360" y2="400" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
  <line x1="590" y1="60" x2="590" y2="400" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
  <!-- Step 1: Get(key) -->
  <line x1="135" y1="90" x2="355" y2="90" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="245" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">1. Get(key)</text>
  <!-- Step 2: Cache Miss -->
  <line x1="355" y1="120" x2="135" y2="120" stroke="#dc3545" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrowred)"/>
  <text x="245" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc3545">2. Cache Miss</text>
  <!-- Step 3: Query DB -->
  <line x1="135" y1="160" x2="585" y2="160" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">3. Query</text>
  <!-- Step 4: Data returned -->
  <line x1="585" y1="190" x2="135" y2="190" stroke="#28a745" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrowgreen)"/>
  <text x="360" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">4. Data</text>
  <!-- Step 5: Set cache -->
  <line x1="135" y1="230" x2="355" y2="230" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="245" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">5. Set(key, data)</text>
  <!-- Separator -->
  <rect x="60" y="270" width="640" height="25" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="380" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Next Request</text>
  <!-- Step 6: Get(key) again -->
  <line x1="135" y1="320" x2="355" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="245" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">6. Get(key)</text>
  <!-- Step 7: Cache Hit -->
  <line x1="355" y1="350" x2="135" y2="350" stroke="#28a745" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrowgreen)"/>
  <text x="245" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">7. Cache Hit - Return Data</text>
</svg>

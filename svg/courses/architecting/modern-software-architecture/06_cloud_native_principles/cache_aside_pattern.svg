<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="77.5" y="40" width="187.5" height="61.0526" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.2501" y="78.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9432" font-weight="bold" fill="var(--primary-text)">App</text>
  <rect x="508.7501" y="40" width="187.5" height="61.0526" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="602.5" y="78.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9432" font-weight="bold" fill="var(--warn-text)">Cache</text>
  <rect x="940" y="40" width="187.5" height="61.0526" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1033.75" y="78.1579" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9432" font-weight="bold" fill="var(--ok-text)">Database</text>
  <line x1="171.2501" y1="101.0526" x2="171.2501" y2="620" stroke="var(--text-faint)" stroke-width="1.5929" stroke-dasharray="6.3716"/>
  <line x1="602.5" y1="101.0526" x2="602.5" y2="620" stroke="var(--text-faint)" stroke-width="1.5929" stroke-dasharray="6.3716"/>
  <line x1="1033.75" y1="101.0526" x2="1033.75" y2="620" stroke="var(--text-faint)" stroke-width="1.5929" stroke-dasharray="6.3716"/>
  <line x1="180.625" y1="146.8421" x2="593.1251" y2="146.8421" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386.8749" y="139.2105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5672" fill="var(--text)">1. Get(key)</text>
  <line x1="593.1251" y1="192.6316" x2="180.625" y2="192.6316" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="7.9644" marker-end="url(#arrow-danger)"/>
  <text x="386.8749" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5672" fill="var(--danger-accent)">2. Cache Miss</text>
  <line x1="180.625" y1="253.6842" x2="1024.375" y2="253.6842" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="602.5" y="246.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5672" fill="var(--text)">3. Query</text>
  <line x1="1024.375" y1="299.4737" x2="180.625" y2="299.4737" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.9644" marker-end="url(#arrow-ok)"/>
  <text x="602.5" y="291.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5672" fill="var(--ok-accent)">4. Data</text>
  <line x1="180.625" y1="360.5263" x2="593.1251" y2="360.5263" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386.8749" y="352.8947" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5672" fill="var(--text)">5. Set(key, data)</text>
  <rect x="40" y="421.5789" width="1200" height="38.1579" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="639.9999" y="447.5263" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5672" fill="var(--text-muted)">Next Request</text>
  <line x1="180.625" y1="497.8947" x2="593.1251" y2="497.8947" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="386.8749" y="490.2632" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5672" fill="var(--text)">6. Get(key)</text>
  <line x1="593.1251" y1="543.6842" x2="180.625" y2="543.6842" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.9644" marker-end="url(#arrow-ok)"/>
  <text x="386.8749" y="536.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5672" fill="var(--ok-accent)">7. Cache Hit - Return Data</text>
</svg>

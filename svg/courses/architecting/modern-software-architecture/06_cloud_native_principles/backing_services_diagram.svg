<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="483.8356" y="249.1803" width="295.8904" height="95.0819" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.7808" y="306.2295" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.8297" font-weight="bold" fill="var(--primary-text)">Application</text>
  <rect x="40" y="40" width="230.137" height="85.5738" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.0685" y="93.2458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7112" fill="var(--ok-text)">PostgreSQL</text>
  <rect x="40" y="287.2131" width="230.137" height="85.5738" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.0685" y="340.459" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7112" fill="var(--danger-text)">Redis Cache</text>
  <rect x="40" y="534.4262" width="230.137" height="85.5738" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="155.0685" y="587.6721" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7112" fill="var(--warn-text)">RabbitMQ</text>
  <rect x="1009.863" y="40" width="230.137" height="85.5738" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9315" y="93.2458" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7112" fill="var(--ok-text)">SMTP Service</text>
  <rect x="1009.863" y="534.4262" width="230.137" height="85.5738" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9315" y="587.6721" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7112" fill="var(--warn-text)">Object Storage</text>
  <line x1="483.8356" y1="277.7049" x2="270.137" y2="97.0491" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="483.8356" y1="296.7212" x2="270.137" y2="325.2459" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="483.8356" y1="334.7541" x2="270.137" y2="572.4591" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="779.726" y1="277.7049" x2="1009.863" y2="97.0491" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="779.726" y1="334.7541" x2="1009.863" y2="572.4591" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="631.7808" y="420.3279" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.152" fill="var(--text-muted)">All backing services attached as resources via config</text>
</svg>

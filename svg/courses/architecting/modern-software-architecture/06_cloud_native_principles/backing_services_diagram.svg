<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Application -->
  <rect x="300" y="130" width="180" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="390" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Application</text>
  <!-- Backing Services -->
  <rect x="30" y="20" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="100" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">PostgreSQL</text>
  <rect x="30" y="150" width="140" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="100" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Redis Cache</text>
  <rect x="30" y="280" width="140" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="100" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">RabbitMQ</text>
  <rect x="620" y="20" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="690" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">SMTP Service</text>
  <rect x="620" y="280" width="140" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="690" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Object Storage</text>
  <!-- Arrows -->
  <line x1="300" y1="145" x2="170" y2="50" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="155" x2="170" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="175" x2="170" y2="300" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="145" x2="620" y2="50" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="175" x2="620" y2="300" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Label -->
  <text x="390" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">All backing services attached as resources via config</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- kubectl user -->
  <rect x="20" y="260" width="110" height="60" rx="8" fill="#f2f2f2" stroke="#555555" stroke-width="2" filter="url(#shadow)"/>
  <text x="75" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121">kubectl</text>
  <text x="75" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">operator</text>
  <line x1="130" y1="290" x2="168" y2="290" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Control Plane -->
  <rect x="170" y="30" width="700" height="340" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="170" y="30" width="700" height="40" rx="10" fill="url(#grad-accent)"/>
  <rect x="170" y="58" width="700" height="12" fill="url(#grad-accent)"/>
  <text x="520" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Control Plane</text>
  <!-- API Server -->
  <rect x="190" y="85" width="200" height="80" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">API Server</text>
  <text x="290" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">REST API front door</text>
  <text x="290" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Authentication &amp; Authz</text>
  <!-- etcd -->
  <rect x="420" y="85" width="200" height="80" rx="8" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#f57f17">etcd</text>
  <text x="520" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Distributed key-value</text>
  <text x="520" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Cluster state store</text>
  <!-- Scheduler -->
  <rect x="190" y="185" width="200" height="80" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Scheduler</text>
  <text x="290" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Assigns pods to nodes</text>
  <text x="290" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Resource-aware placement</text>
  <!-- Controller Manager -->
  <rect x="420" y="185" width="200" height="80" rx="8" fill="#ffffff" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="520" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1565c0">Controller Manager</text>
  <text x="520" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Reconciliation loops</text>
  <text x="520" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Desired vs actual state</text>
  <!-- Cloud Controller -->
  <rect x="650" y="85" width="200" height="80" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#6a1b9a">Cloud Controller</text>
  <text x="750" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Manages cloud resources</text>
  <text x="750" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">LB, storage, nodes</text>
  <!-- Internal arrows -->
  <line x1="390" y1="125" x2="418" y2="125" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="290" y1="165" x2="290" y2="183" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="520" y1="165" x2="520" y2="183" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- kubectl arrow into API server -->
  <line x1="130" y1="285" x2="188" y2="130" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- Control Plane → Worker Nodes arrows -->
  <line x1="520" y1="370" x2="355" y2="415" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="520" y1="370" x2="800" y2="415" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <line x1="520" y1="370" x2="1110" y2="415" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <!-- Worker Node 1 -->
  <rect x="170" y="415" width="360" height="265" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="170" y="415" width="360" height="36" rx="10" fill="#2e7d32"/>
  <rect x="170" y="440" width="360" height="11" fill="#2e7d32"/>
  <text x="350" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Worker Node 1</text>
  <rect x="185" y="462" width="155" height="50" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="262" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121">kubelet</text>
  <text x="262" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Node agent</text>
  <rect x="352" y="462" width="155" height="50" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="429" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121">kube-proxy</text>
  <text x="429" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Network proxy</text>
  <rect x="185" y="524" width="140" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="255" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#212121">Pod A</text>
  <text x="255" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Container(s)</text>
  <rect x="340" y="524" width="140" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="410" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#212121">Pod B</text>
  <text x="410" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Container(s)</text>
  <rect x="185" y="594" width="295" height="28" rx="4" fill="#c8e6c9"/>
  <text x="332" y="613" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Container Runtime (containerd)</text>
  <!-- Worker Node 2 -->
  <rect x="615" y="415" width="360" height="265" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="615" y="415" width="360" height="36" rx="10" fill="#2e7d32"/>
  <rect x="615" y="440" width="360" height="11" fill="#2e7d32"/>
  <text x="795" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Worker Node 2</text>
  <rect x="630" y="462" width="155" height="50" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="707" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121">kubelet</text>
  <text x="707" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Node agent</text>
  <rect x="798" y="462" width="155" height="50" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="875" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121">kube-proxy</text>
  <text x="875" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Network proxy</text>
  <rect x="630" y="524" width="140" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="700" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#212121">Pod C</text>
  <text x="700" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Container(s)</text>
  <rect x="785" y="524" width="140" height="55" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="855" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#212121">Pod D</text>
  <text x="855" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Container(s)</text>
  <rect x="630" y="594" width="295" height="28" rx="4" fill="#c8e6c9"/>
  <text x="777" y="613" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Container Runtime (containerd)</text>
  <!-- Worker Node 3 (abbreviated) -->
  <rect x="1000" y="415" width="240" height="265" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1000" y="415" width="240" height="36" rx="10" fill="#2e7d32"/>
  <rect x="1000" y="440" width="240" height="11" fill="#2e7d32"/>
  <text x="1120" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Worker Node N</text>
  <text x="1120" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#2e7d32">…</text>
  <text x="1120" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">Scales horizontally</text>
  <text x="1120" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">to N nodes</text>
</svg>

  <text x="716.8001" y="411.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4604">kubelet</text>
  <rect x="815.1844" y="376" width="140.549" height="56" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="885.459" y="411.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4604">kube-proxy</text>
  <rect x="660.5805" y="480" width="140.549" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />

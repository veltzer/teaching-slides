  <text x="721.4815" y="130.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8022">Controller Manager</text>
  <rect x="899.2592" y="92.7273" width="162.963" height="60.2597" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="980.7408" y="130.3896" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8022">etcd</text>
  <line x1="291.8518" y1="122.8571" x2="348.1482" y2="122.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="291.8518" y1="122.8571" x2="600" y2="122.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="291.8518" y1="122.8571" x2="896.2963" y2="122.8571" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="318.7013" width="577.7777" height="301.2987" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.0274" />
  <text x="328.8889" y="348.8313" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2024" fill="var(--ok-accent)" font-weight="bold">Worker Node 1</text>
  <rect x="69.6296" y="371.4286" width="148.1481" height="52.7273" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="143.7037" y="404.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4021">kubelet</text>
  <rect x="247.4075" y="371.4286" width="148.1481" height="52.7273" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="321.4815" y="404.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4021">kube-proxy</text>

  <text x="780.7408" y="507.0131" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8022">Pod C</text>
  <rect x="899.2592" y="469.3506" width="148.1481" height="60.2597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="973.3333" y="507.0131" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8022">Pod D</text>
  <line x1="158.5185" y1="152.987" x2="143.7037" y2="371.4286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="217.7777" y1="152.987" x2="765.9259" y2="371.4286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
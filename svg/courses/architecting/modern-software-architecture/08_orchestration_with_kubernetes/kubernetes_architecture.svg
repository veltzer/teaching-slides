  <line x1="267.0431" y1="112" x2="559.3852" y2="112" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="267.0431" y1="112" x2="840.4832" y2="112" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="28.1098" y="320" width="548.1412" height="320" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.0274" />
  <text x="302.1804" y="352.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2714" fill="var(--ok-accent)" font-weight="bold">Worker Node 1</text>

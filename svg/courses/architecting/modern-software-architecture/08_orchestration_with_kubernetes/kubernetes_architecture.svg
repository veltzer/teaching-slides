  <text x="158.5185" y="507.0131" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8022">Pod A</text>
  <rect x="277.037" y="469.3506" width="148.1481" height="60.2597" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="351.111" y="507.0131" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8022">Pod B</text>
  <rect x="662.2222" y="318.7013" width="577.7777" height="301.2987" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.0274" />
  <text x="951.1111" y="348.8313" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2024" fill="var(--ok-accent)" font-weight="bold">Worker Node 2</text>
  <rect x="691.8519" y="371.4286" width="148.1481" height="52.7273" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>

  <text x="323.2627" y="520.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659">Pod B</text>
  <rect x="618.4157" y="320" width="548.1412" height="320" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.0274" />

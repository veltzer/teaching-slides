<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="46.6667" y="40" width="248.8889" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="171.1111" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Pod Crashes</text>
  <rect x="435.5556" y="40" width="248.8889" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="560" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">kubelet detects</text>
  <rect x="824.4445" y="40" width="311.1111" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="980" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Restart Container</text>
  <line x1="295.5556" y1="80" x2="432.4445" y2="80" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="684.4445" y1="80" x2="821.3334" y2="80" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="46.6667" y="170" width="248.8889" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="171.1111" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Node Fails</text>
  <rect x="435.5556" y="170" width="248.8889" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="560" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Controller detects</text>
  <rect x="824.4445" y="170" width="311.1111" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="980" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Reschedule Pods</text>
  <line x1="295.5556" y1="210" x2="432.4445" y2="210" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="684.4445" y1="210" x2="821.3334" y2="210" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="46.6667" y="300" width="248.8889" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="171.1111" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Liveness Probe Fails</text>
  <rect x="435.5556" y="300" width="248.8889" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="560" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">kubelet</text>
  <rect x="824.4445" y="300" width="311.1111" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="980" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Restart Container</text>
  <line x1="295.5556" y1="340" x2="432.4445" y2="340" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="684.4445" y1="340" x2="821.3334" y2="340" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="46.6667" y="430" width="248.8889" height="80" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="171.1111" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Readiness Probe Fails</text>
  <rect x="435.5556" y="430" width="248.8889" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="560" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">kube-proxy</text>
  <rect x="824.4445" y="430" width="311.1111" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="980" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Remove from Service</text>
  <line x1="295.5556" y1="470" x2="432.4445" y2="470" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="684.4445" y1="470" x2="821.3334" y2="470" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="46.6667" y="560" width="248.8889" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="171.1111" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Replica Count</text>
  <rect x="435.5556" y="560" width="248.8889" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="560" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Controller</text>
  <rect x="824.4445" y="560" width="311.1111" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="980" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.6667">Create/Delete Pods</text>
  <line x1="295.5556" y1="600.0001" x2="432.4445" y2="600.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="684.4445" y1="600.0001" x2="821.3334" y2="600.0001" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Row 1: Pod Crashes -->
  <rect x="30" y="20" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="110" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Pod Crashes</text>
  <rect x="280" y="20" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">kubelet detects</text>
  <rect x="530" y="20" width="200" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Restart Container</text>
  <line x1="190" y1="40" x2="278" y2="40" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="40" x2="528" y2="40" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Row 2: Node Fails -->
  <rect x="30" y="85" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="110" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Node Fails</text>
  <rect x="280" y="85" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Controller detects</text>
  <rect x="530" y="85" width="200" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Reschedule Pods</text>
  <line x1="190" y1="105" x2="278" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="105" x2="528" y2="105" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Row 3: Liveness Probe -->
  <rect x="30" y="150" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="110" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Liveness Probe Fails</text>
  <rect x="280" y="150" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">kubelet</text>
  <rect x="530" y="150" width="200" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Restart Container</text>
  <line x1="190" y1="170" x2="278" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="170" x2="528" y2="170" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Row 4: Readiness Probe -->
  <rect x="30" y="215" width="160" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="110" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Readiness Probe Fails</text>
  <rect x="280" y="215" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">kube-proxy</text>
  <rect x="530" y="215" width="200" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="630" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Remove from Service</text>
  <line x1="190" y1="235" x2="278" y2="235" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="235" x2="528" y2="235" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Row 5: Replica Count -->
  <rect x="30" y="280" width="160" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Replica Count</text>
  <rect x="280" y="280" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="360" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Controller</text>
  <rect x="530" y="280" width="200" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Create/Delete Pods</text>
  <line x1="190" y1="300" x2="278" y2="300" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="300" x2="528" y2="300" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="274.2857" height="77.3333" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.1428" y="88.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--danger-text)">Pod Crashes</text>
  <rect x="468.5714" y="40" width="274.2857" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7142" y="88.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--warn-text)">kubelet detects</text>
  <rect x="897.1429" y="40" width="342.8571" height="77.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5714" y="88.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--ok-text)">Restart Container</text>
  <line x1="314.2857" y1="78.6667" x2="465.1429" y2="78.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="742.8572" y1="78.6667" x2="893.7143" y2="78.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="165.6667" width="274.2857" height="77.3333" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.1428" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--danger-text)">Node Fails</text>
  <rect x="468.5714" y="165.6667" width="274.2857" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7142" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--warn-text)">Controller detects</text>
  <rect x="897.1429" y="165.6667" width="342.8571" height="77.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5714" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--ok-text)">Reschedule Pods</text>
  <line x1="314.2857" y1="204.3333" x2="465.1429" y2="204.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="742.8572" y1="204.3333" x2="893.7143" y2="204.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="291.3333" width="274.2857" height="77.3333" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.1428" y="339.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--danger-text)">Liveness Probe Fails</text>
  <rect x="468.5714" y="291.3333" width="274.2857" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7142" y="339.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--warn-text)">kubelet</text>
  <rect x="897.1429" y="291.3333" width="342.8571" height="77.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5714" y="339.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--ok-text)">Restart Container</text>
  <line x1="314.2857" y1="330" x2="465.1429" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="742.8572" y1="330" x2="893.7143" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="417" width="274.2857" height="77.3333" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.1428" y="465.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--danger-text)">Readiness Probe Fails</text>
  <rect x="468.5714" y="417" width="274.2857" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7142" y="465.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--warn-text)">kube-proxy</text>
  <rect x="897.1429" y="417" width="342.8571" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5714" y="465.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--warn-text)">Remove from Service</text>
  <line x1="314.2857" y1="455.6667" x2="465.1429" y2="455.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="742.8572" y1="455.6667" x2="893.7143" y2="455.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="542.6667" width="274.2857" height="77.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="177.1428" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--primary-text)">Replica Count</text>
  <rect x="468.5714" y="542.6667" width="274.2857" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="605.7142" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--warn-text)">Controller</text>
  <rect x="897.1429" y="542.6667" width="342.8571" height="77.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1068.5714" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2666" fill="var(--ok-text)">Create/Delete Pods</text>
  <line x1="314.2857" y1="581.3334" x2="465.1429" y2="581.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="742.8572" y1="581.3334" x2="893.7143" y2="581.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
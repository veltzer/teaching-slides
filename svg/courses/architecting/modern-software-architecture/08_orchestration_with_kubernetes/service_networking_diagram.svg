<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="54.8571" y="270" width="237.7143" height="101.25" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="173.7143" y="330.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold">Client Pod</text>
  <rect x="457.1429" y="247.5" width="329.1429" height="123.75" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="621.7143" y="299.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold">Service: web-service</text>
  <text x="621.7143" y="344.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1143" fill="var(--text-muted)">ClusterIP:80</text>
  <rect x="969.1429" y="90" width="237.7143" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1088" y="146.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429">Pod 1:8080</text>
  <rect x="969.1429" y="270" width="237.7143" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1088" y="326.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429">Pod 2:8080</text>
  <rect x="969.1429" y="450" width="237.7143" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1088" y="506.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429">Pod 3:8080</text>
  <line x1="292.5714" y1="319.5" x2="453.4857" y2="308.25" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="373.0286" y="292.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2857" fill="var(--text-muted)">web-service:80</text>
  <line x1="786.2857" y1="281.25" x2="965.4857" y2="135" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="786.2857" y1="308.25" x2="965.4857" y2="315" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="786.2857" y1="337.5" x2="965.4857" y2="495" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="877.7143" y="236.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2857" fill="var(--text-muted)">Round Robin</text>
</svg>
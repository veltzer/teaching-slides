<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Client Pod -->
  <rect x="30" y="120" width="130" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="95" y="147" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Client Pod</text>
  <!-- Service -->
  <rect x="250" y="110" width="180" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="340" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Service: web-service</text>
  <text x="340" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">ClusterIP:80</text>
  <!-- Pods -->
  <rect x="530" y="40" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="595" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Pod 1:8080</text>
  <rect x="530" y="120" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="595" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Pod 2:8080</text>
  <rect x="530" y="200" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="595" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Pod 3:8080</text>
  <!-- Arrows -->
  <line x1="160" y1="142" x2="248" y2="137" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="204" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">web-service:80</text>
  <line x1="430" y1="125" x2="528" y2="60" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="137" x2="528" y2="140" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="430" y1="150" x2="528" y2="220" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="480" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Round Robin</text>
</svg>

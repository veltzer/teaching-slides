  <text x="259.5999" y="110.5455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.278">v1</text>
  <text x="136.2899" y="223.0303" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.576" font-weight="bold">Step 2</text>
  <rect x="38.94" y="242.4242" width="77.8799" height="67.8788" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="77.8799" y="285.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.278">v1</text>
  <rect x="129.7999" y="242.4242" width="77.8799" height="67.8788" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="168.7399" y="285.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.278">v1</text>
  <rect x="220.6599" y="242.4242" width="77.8799" height="67.8788" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="259.5999" y="285.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.278" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <text x="136.2899" y="397.5758" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.576" font-weight="bold">Step 3</text>
  <rect x="38.94" y="416.9697" width="77.8799" height="67.8788" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="77.8799" y="459.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.278">v1</text>
  <rect x="129.7999" y="416.9697" width="77.8799" height="67.8788" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="168.7399" y="459.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.278" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <rect x="220.6599" y="416.9697" width="77.8799" height="67.8788" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="259.5999" y="459.6364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.278" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <text x="136.2899" y="562.4242" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.576" font-weight="bold">Step 4</text>
  <rect x="38.94" y="572.1212" width="77.8799" height="67.8788" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="77.8799" y="614.7879" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.278" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <rect x="129.7999" y="572.1212" width="77.8799" height="67.8788" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="168.7399" y="614.7879" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.278" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <rect x="220.6599" y="572.1212" width="77.8799" height="67.8788" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />

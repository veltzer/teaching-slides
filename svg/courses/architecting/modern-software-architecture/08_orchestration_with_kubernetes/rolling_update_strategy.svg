  <line x1="168.7399" y1="139.6364" x2="168.7399" y2="217.2121" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="168.7399" y1="314.1818" x2="168.7399" y2="391.7576" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="168.7399" y1="488.7273" x2="168.7399" y2="566.303" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="415.3599" y="96.9697" width="623.0398" height="426.6667" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="726.8798" y="155.1515" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.874" font-weight="bold">Rolling Update Strategy</text>
  <text x="441.3199" y="223.0303" font-family="Arial, sans-serif" font-size="15.576" fill="var(--text)">1. All pods running v1</text>
  <text x="441.3199" y="281.2121" font-family="Arial, sans-serif" font-size="15.576" fill="var(--text)">2. Replace one pod with v2, keep serving traffic</text>
  <text x="441.3199" y="339.3939" font-family="Arial, sans-serif" font-size="15.576" fill="var(--text)">3. Replace second pod with v2</text>
  <text x="441.3199" y="397.5758" font-family="Arial, sans-serif" font-size="15.576" fill="var(--text)">4. All pods now running v2 - zero downtime</text>
  <text x="441.3199" y="475.1515" font-family="Arial, sans-serif" font-size="14.278" fill="var(--text-muted)">maxUnavailable and maxSurge control the pace</text>
</svg>
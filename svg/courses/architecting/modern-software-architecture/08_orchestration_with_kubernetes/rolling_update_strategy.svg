<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="156.883" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9003" font-weight="bold">Step 1</text>
  <rect x="40" y="59.0165" width="93.5064" height="66.5574" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="86.7531" y="100.8525" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492">v1</text>
  <rect x="149.0908" y="59.0165" width="93.5064" height="66.5574" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="195.8441" y="100.8525" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492">v1</text>
  <rect x="258.1818" y="59.0165" width="93.5064" height="66.5574" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="304.935" y="100.8525" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492">v1</text>
  <text x="156.883" y="211.1476" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9003" font-weight="bold">Step 2</text>
  <rect x="40" y="230.1639" width="93.5064" height="66.5574" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="86.7531" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492">v1</text>
  <rect x="149.0908" y="230.1639" width="93.5064" height="66.5574" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="195.8441" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492">v1</text>
  <rect x="258.1818" y="230.1639" width="93.5064" height="66.5574" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="304.935" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <text x="156.883" y="382.2951" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9003" font-weight="bold">Step 3</text>
  <rect x="40" y="401.3115" width="93.5064" height="66.5574" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="86.7531" y="443.1476" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492">v1</text>
  <rect x="149.0908" y="401.3115" width="93.5064" height="66.5574" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="195.8441" y="443.1476" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <rect x="258.1818" y="401.3115" width="93.5064" height="66.5574" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="304.935" y="443.1476" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <text x="156.883" y="543.9344" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9003" font-weight="bold">Step 4</text>
  <rect x="40" y="553.4426" width="93.5064" height="66.5574" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="86.7531" y="595.2787" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <rect x="149.0908" y="553.4426" width="93.5064" height="66.5574" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="195.8441" y="595.2787" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <rect x="258.1818" y="553.4426" width="93.5064" height="66.5574" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="304.935" y="595.2787" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.492" fill="var(--ok-accent)" font-weight="bold">v2</text>
  <line x1="195.8441" y1="129.3771" x2="195.8441" y2="205.4426" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="195.8441" y1="300.5246" x2="195.8441" y2="376.5902" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="195.8441" y1="471.6722" x2="195.8441" y2="547.7377" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="491.9481" y="87.541" width="748.0519" height="418.3607" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <text x="865.974" y="144.5902" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.3087" font-weight="bold">Rolling Update Strategy</text>
  <text x="523.1169" y="211.1476" font-family="Arial, sans-serif" font-size="16.9003" fill="var(--text)">1. All pods running v1</text>
  <text x="523.1169" y="268.1967" font-family="Arial, sans-serif" font-size="16.9003" fill="var(--text)">2. Replace one pod with v2, keep serving traffic</text>
  <text x="523.1169" y="325.2459" font-family="Arial, sans-serif" font-size="16.9003" fill="var(--text)">3. Replace second pod with v2</text>
  <text x="523.1169" y="382.2951" font-family="Arial, sans-serif" font-size="16.9003" fill="var(--text)">4. All pods now running v2 - zero downtime</text>
  <text x="523.1169" y="458.3607" font-family="Arial, sans-serif" font-size="15.492" fill="var(--text-muted)">maxUnavailable and maxSurge control the pace</text>
</svg>
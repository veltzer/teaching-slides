<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="370.3703" height="580" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.3012" />
  <text x="225.1852" y="95.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7202" fill="var(--primary-accent)" font-weight="bold">Sidecar Pattern</text>
  <rect x="77.0371" y="140.3846" width="177.7778" height="100.3846" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.926" y="200.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2801">Main Container</text>
  <rect x="77.0371" y="296.5385" width="177.7778" height="100.3846" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="165.926" y="356.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2801">Log Collector</text>
  <line x1="165.926" y1="240.7692" x2="165.926" y2="296.5385" stroke="var(--text-faint)" stroke-width="2" />
  <text x="225.1852" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4001" fill="var(--text-muted)">Extends main container</text>
  <text x="225.1852" y="508.4616" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4001" fill="var(--text-muted)">with logging/monitoring</text>
  <rect x="454.8149" y="40" width="370.3703" height="580" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.3012" />
  <text x="640.0001" y="95.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7202" fill="var(--warn-accent)" font-weight="bold">Ambassador Pattern</text>
  <rect x="491.8519" y="140.3846" width="177.7778" height="100.3846" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.7408" y="200.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2801">Main Container</text>
  <rect x="491.8519" y="296.5385" width="177.7778" height="100.3846" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="580.7408" y="356.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2801">Proxy Container</text>
  <line x1="580.7408" y1="240.7692" x2="580.7408" y2="296.5385" stroke="var(--text-faint)" stroke-width="2" />
  <text x="640.0001" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4001" fill="var(--text-muted)">Proxies network traffic</text>
  <text x="640.0001" y="508.4616" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4001" fill="var(--text-muted)">to external services</text>
  <rect x="869.6297" y="40" width="370.3703" height="580" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.3012" />
  <text x="1054.8148" y="95.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7202" fill="var(--ok-accent)" font-weight="bold">Init Container</text>
  <rect x="906.6667" y="140.3846" width="177.7778" height="100.3846" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5556" y="200.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2801">Init Container</text>
  <rect x="906.6667" y="341.1538" width="177.7778" height="100.3846" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="995.5556" y="401.3846" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2801">Main Container</text>
  <line x1="995.5556" y1="240.7692" x2="995.5556" y2="336.6923" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1032.5926" y="296.5385" font-family="Arial, sans-serif" font-size="14.4001" fill="var(--text-muted)">Runs first</text>
  <text x="1054.8148" y="519.6154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4001" fill="var(--text-muted)">Prepares environment</text>
  <text x="1054.8148" y="553.0769" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4001" fill="var(--text-muted)">before main starts</text>
</svg>
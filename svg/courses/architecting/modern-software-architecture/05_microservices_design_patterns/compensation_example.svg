<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,36 5.2706,0" fill="#28a745" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,36 5.2706,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="80" y="106.875" width="209.0667" height="160.65" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="184.5334" y="206.835" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.92" font-weight="bold">Create Order</text>
  <rect x="363.7334" y="106.875" width="224.0001" height="160.65" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="475.7335" y="206.835" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.92" font-weight="bold">Process Payment</text>
  <rect x="662.4" y="106.875" width="209.0667" height="160.65" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="766.9334" y="206.835" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.92" font-weight="bold">Reserve Stock</text>
  <rect x="916.2667" y="106.875" width="209.0667" height="160.65" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1020.8" y="206.835" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.92" font-weight="bold">Refund Payment</text>
  <rect x="916.2667" y="392.475" width="209.0667" height="160.65" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1020.8" y="492.435" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.92" font-weight="bold">Cancel Order</text>
  <line x1="289.0668" y1="185.415" x2="360.7467" y2="185.415" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="324.9068" y="160.425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9333" fill="var(--ok-accent)">Success</text>
  <line x1="587.7333" y1="185.415" x2="659.4134" y2="185.415" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="623.5733" y="160.425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9333" fill="var(--ok-accent)">Success</text>
  <line x1="871.4667" y1="185.415" x2="913.28" y2="185.415" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="892.3734" y="160.425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9333" fill="var(--danger-accent)" font-weight="bold">FAIL</text>
  <line x1="1020.8" y1="267.5249" x2="1020.8" y2="385.335" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="1200" y="321.0749" font-family="Arial, sans-serif" font-size="14.9333" fill="var(--danger-accent)">Compensation</text>
</svg>
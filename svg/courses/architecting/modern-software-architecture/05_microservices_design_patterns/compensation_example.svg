<svg viewBox="0 0 850 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <!-- Create Order -->
  <rect x="20" y="60" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="90" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Create Order</text>
  <!-- Process Payment -->
  <rect x="210" y="60" width="150" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="285" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Process Payment</text>
  <!-- Reserve Stock -->
  <rect x="410" y="60" width="140" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="480" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Reserve Stock</text>
  <!-- Refund Payment -->
  <rect x="580" y="60" width="140" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="650" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Refund Payment</text>
  <!-- Cancel Order -->
  <rect x="580" y="140" width="140" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="650" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Cancel Order</text>
  <!-- Success arrows -->
  <line x1="160" y1="82" x2="208" y2="82" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="184" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Success</text>
  <line x1="360" y1="82" x2="408" y2="82" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="384" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Success</text>
  <!-- Failure arrow -->
  <line x1="550" y1="82" x2="578" y2="82" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="564" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc3545" font-weight="bold">FAIL</text>
  <!-- Compensation arrow -->
  <line x1="650" y1="105" x2="650" y2="138" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowred)"/>
  <!-- Label: Compensation -->
  <text x="770" y="120" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">Compensation</text>
</svg>

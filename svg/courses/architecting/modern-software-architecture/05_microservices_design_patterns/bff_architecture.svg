  <text x="133.5215" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659" font-weight="bold">Mobile Application</text>
  <rect x="28.1098" y="368" width="210.8236" height="64" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="133.5215" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659" font-weight="bold">IoT Device</text>
  <rect x="379.4823" y="48" width="182.7137" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="470.8392" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659" font-weight="bold">Web BFF</text>
  <rect x="379.4823" y="208" width="182.7137" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="470.8392" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659" font-weight="bold">Mobile BFF</text>
  <rect x="379.4823" y="368" width="182.7137" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="470.8392" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659" font-weight="bold">IoT BFF</text>
  <rect x="744.9097" y="48" width="224.8784" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="857.349" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659">User Service</text>
  <rect x="744.9097" y="176" width="224.8784" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="857.349" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659">Order Service</text>
  <rect x="744.9097" y="304" width="252.9882" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="871.4039" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659">Notification Service</text>
  <rect x="744.9097" y="432" width="238.9333" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="864.3764" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8659">Telemetry Service</text>
  <line x1="238.9333" y1="80" x2="376.6714" y2="80" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="238.9333" y1="240" x2="376.6714" y2="240" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="238.9333" y1="400" x2="376.6714" y2="400" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="562.196" y1="72" x2="742.0988" y2="72" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="562.196" y1="88" x2="742.0988" y2="200" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="562.196" y1="224" x2="742.0988" y2="88" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="562.196" y1="256" x2="742.0988" y2="328" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="562.196" y1="408" x2="742.0988" y2="456" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="597.3333" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.4604" fill="var(--text-faint)">Each client type gets a tailored Backend-for-Frontend</text>
</svg>
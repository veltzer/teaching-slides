<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="260.8697" height="62.7027" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4347" y="79.1892" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" font-weight="bold" fill="var(--warn-text)">Web Application</text>
  <rect x="40" y="196.7568" width="260.8697" height="62.7027" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4347" y="235.9459" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" font-weight="bold" fill="var(--warn-text)">Mobile Application</text>
  <rect x="40" y="353.5135" width="260.8697" height="62.7027" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="170.4347" y="392.7027" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" font-weight="bold" fill="var(--warn-text)">IoT Device</text>
  <rect x="474.7826" y="40" width="226.087" height="62.7027" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.8261" y="79.1892" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" font-weight="bold" fill="var(--primary-text)">Web BFF</text>
  <rect x="474.7826" y="196.7568" width="226.087" height="62.7027" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.8261" y="235.9459" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" font-weight="bold" fill="var(--primary-text)">Mobile BFF</text>
  <rect x="474.7826" y="353.5135" width="226.087" height="62.7027" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="587.8261" y="392.7027" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" font-weight="bold" fill="var(--primary-text)">IoT BFF</text>
  <rect x="926.9565" y="40" width="278.2609" height="62.7027" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1066.0871" y="79.1892" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" fill="var(--ok-text)">User Service</text>
  <rect x="926.9565" y="165.4054" width="278.2609" height="62.7027" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1066.0871" y="204.5946" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" fill="var(--ok-text)">Order Service</text>
  <rect x="926.9565" y="290.8108" width="313.0435" height="62.7027" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1083.4784" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" fill="var(--ok-text)">Notification Service</text>
  <rect x="926.9565" y="416.2162" width="295.6522" height="62.7027" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1074.7827" y="455.4054" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5701" fill="var(--ok-text)">Telemetry Service</text>
  <line x1="300.8696" y1="71.3514" x2="471.3044" y2="71.3514" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="300.8696" y1="228.1081" x2="471.3044" y2="228.1081" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="300.8696" y1="384.8649" x2="471.3044" y2="384.8649" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="700.8696" y1="63.5135" x2="923.4784" y2="63.5135" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="700.8696" y1="79.1892" x2="923.4784" y2="188.9189" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="700.8696" y1="212.4324" x2="923.4784" y2="79.1892" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="700.8696" y1="243.7838" x2="923.4784" y2="314.3243" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="700.8696" y1="392.7027" x2="923.4784" y2="439.7297" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="744.3479" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0226" fill="var(--text-faint)">Each client type gets a tailored Backend-for-Frontend</text>
</svg>
<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Clients -->
  <rect x="20" y="30" width="150" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="95" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Web Application</text>
  <rect x="20" y="130" width="150" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="95" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Mobile Application</text>
  <rect x="20" y="230" width="150" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="95" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">IoT Device</text>
  <!-- BFFs -->
  <rect x="270" y="30" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="335" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Web BFF</text>
  <rect x="270" y="130" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="335" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Mobile BFF</text>
  <rect x="270" y="230" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="335" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">IoT BFF</text>
  <!-- Services -->
  <rect x="530" y="30" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">User Service</text>
  <rect x="530" y="110" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Order Service</text>
  <rect x="530" y="190" width="180" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="620" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Notification Service</text>
  <rect x="530" y="270" width="170" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="615" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Telemetry Service</text>
  <!-- Client -> BFF arrows -->
  <line x1="170" y1="50" x2="268" y2="50" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="150" x2="268" y2="150" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="250" x2="268" y2="250" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Web BFF -> User Service, Order Service -->
  <line x1="400" y1="45" x2="528" y2="45" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="55" x2="528" y2="125" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Mobile BFF -> User Service, Notification Service -->
  <line x1="400" y1="140" x2="528" y2="55" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="160" x2="528" y2="205" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- IoT BFF -> Telemetry Service -->
  <line x1="400" y1="255" x2="528" y2="285" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Note -->
  <text x="425" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Each client type gets a tailored Backend-for-Frontend</text>
</svg>

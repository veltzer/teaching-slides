<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="565.7144" y="40" width="411.4286" height="95.0819" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="771.4287" y="97.0492" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.7014" font-weight="bold" fill="var(--primary-text)">Router / Proxy</text>
  <rect x="40" y="287.2131" width="411.4286" height="114.0983" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="245.7143" y="334.7541" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.7014" font-weight="bold" fill="var(--danger-text)">Monolith</text>
  <text x="245.7143" y="372.7869" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--danger-accent)">(legacy)</text>
  <rect x="634.2858" y="249.1804" width="365.7143" height="85.5738" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.1429" y="302.4262" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7441" font-weight="bold" fill="var(--ok-text)">New Service A</text>
  <rect x="634.2858" y="382.2951" width="365.7143" height="85.5738" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.1429" y="435.541" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7441" font-weight="bold" fill="var(--ok-text)">New Service B</text>
  <rect x="634.2858" y="534.4262" width="365.7143" height="85.5738" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="10.24 5.12" filter="url(#shadow)"/>
  <text x="817.1429" y="587.6721" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7441" font-weight="bold" fill="var(--warn-text)">Future Service C</text>
  <line x1="680" y1="135.082" x2="314.2857" y2="283.4099" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="817.1429" y1="135.082" x2="817.1429" y2="245.377" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840.0001" y1="135.082" x2="840.0001" y2="378.4918" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="337.1429" y1="401.3114" x2="629.7143" y2="562.9508" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.24 6.8267" marker-end="url(#arrow)"/>
  <text x="428.5715" y="515.4098" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--text-faint)">Migrate Feature C</text>
  <rect x="1182.8572" y="249.1804" width="34.2857" height="28.5246" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="273.9017" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--text-muted)">Legacy (to retire)</text>
  <rect x="1182.8572" y="296.7213" width="34.2857" height="28.5246" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="321.4426" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--text-muted)">Migrated services</text>
  <rect x="1182.8572" y="344.2623" width="34.2857" height="28.5246" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="368.9836" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--text-muted)">Planned migration</text>
</svg>

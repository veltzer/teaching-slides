<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#999" />
    </marker>
  </defs>
  <rect x="565.7144" y="40" width="411.4286" height="95.0819" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="771.4287" y="97.0492" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.7014" font-weight="bold">Router / Proxy</text>
  <rect x="40" y="287.2131" width="411.4286" height="114.0983" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="245.7143" y="334.7541" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.7014" font-weight="bold">Monolith</text>
  <text x="245.7143" y="372.7869" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--danger-accent)">(legacy)</text>
  <rect x="634.2858" y="249.1804" width="365.7143" height="85.5738" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.1429" y="302.4262" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7441" font-weight="bold">New Service A</text>
  <rect x="634.2858" y="382.2951" width="365.7143" height="85.5738" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="817.1429" y="435.541" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7441" font-weight="bold">New Service B</text>
  <rect x="634.2858" y="534.4262" width="365.7143" height="85.5738" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="10.24 5.12" filter="url(#shadow)"/>
  <text x="817.1429" y="587.6721" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7441" font-weight="bold">Future Service C</text>
  <line x1="680" y1="135.082" x2="314.2857" y2="283.4099" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="817.1429" y1="135.082" x2="817.1429" y2="245.377" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="840.0001" y1="135.082" x2="840.0001" y2="378.4918" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="337.1429" y1="401.3114" x2="629.7143" y2="562.9508" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.24 6.8267" marker-end="url(#arrow)" />
  <text x="428.5715" y="515.4098" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--text-faint)">Migrate Feature C</text>
  <rect x="1182.8572" y="249.1804" width="34.2857" height="28.5246" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="273.9017" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--text-muted)">Legacy (to retire)</text>
  <rect x="1182.8572" y="296.7213" width="34.2857" height="28.5246" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="321.4426" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--text-muted)">Migrated services</text>
  <rect x="1182.8572" y="344.2623" width="34.2857" height="28.5246" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1240" y="368.9836" font-family="Arial, sans-serif" font-size="19.7868" fill="var(--text-muted)">Planned migration</text>
</svg>
<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Client -->
  <rect x="290" y="20" width="120" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="350" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Client</text>
  <!-- Command Service -->
  <rect x="80" y="130" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="160" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Command Service</text>
  <!-- Query Service -->
  <rect x="460" y="130" width="160" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="540" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Query Service</text>
  <!-- Write Database -->
  <rect x="80" y="250" width="160" height="50" rx="8" fill="#f0f0f0" stroke="#666" stroke-width="2"/>
  <text x="160" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Write Database</text>
  <text x="160" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(source of truth)</text>
  <!-- Read Database -->
  <rect x="460" y="250" width="160" height="50" rx="8" fill="#f0f0f0" stroke="#666" stroke-width="2"/>
  <text x="540" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Read Database</text>
  <text x="540" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">(optimized for reads)</text>
  <!-- Client -> Command Service -->
  <line x1="310" y1="65" x2="200" y2="128" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="230" y="90" font-family="Arial, sans-serif" font-size="11" fill="#4a90e2">Commands</text>
  <!-- Client -> Query Service -->
  <line x1="390" y1="65" x2="510" y2="128" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="470" y="90" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Queries</text>
  <!-- Command Service -> Write DB -->
  <line x1="160" y1="175" x2="160" y2="248" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Write DB -> Read DB (Sync/Events) -->
  <line x1="240" y1="275" x2="458" y2="275" stroke="#999" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="350" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#999">Sync / Events</text>
  <!-- Query Service -> Read DB -->
  <line x1="540" y1="175" x2="540" y2="248" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="506.6666" y="40" width="266.6666" height="93.2143" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="639.9999" y="98.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4711" font-weight="bold" fill="var(--warn-text)">Client</text>
  <rect x="40" y="267.8572" width="355.5556" height="93.2143" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="217.7778" y="325.8572" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4711" font-weight="bold" fill="var(--primary-text)">Command Service</text>
  <rect x="884.4444" y="267.8572" width="355.5556" height="93.2143" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062.2222" y="325.8572" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4711" font-weight="bold" fill="var(--ok-text)">Query Service</text>
  <rect x="40" y="516.4286" width="355.5556" height="103.5714" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="217.7778" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4349" font-weight="bold" fill="var(--text)">Write Database</text>
  <text x="217.7778" y="599.2858" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3624" fill="var(--text-muted)">(source of truth)</text>
  <rect x="884.4444" y="516.4286" width="355.5556" height="103.5714" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1062.2222" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4349" font-weight="bold" fill="var(--text)">Read Database</text>
  <text x="1062.2222" y="599.2858" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3624" fill="var(--text-muted)">(optimized for reads)</text>
  <line x1="551.1111" y1="133.2143" x2="306.6666" y2="263.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="373.3333" y="185" font-family="Arial, sans-serif" font-size="22.3986" fill="var(--primary-accent)">Commands</text>
  <line x1="728.8889" y1="133.2143" x2="995.5555" y2="263.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="906.6666" y="185" font-family="Arial, sans-serif" font-size="22.3986" fill="var(--ok-accent)">Queries</text>
  <line x1="217.7778" y1="361.0714" x2="217.7778" y2="512.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="395.5556" y1="568.2143" x2="879.9999" y2="568.2143" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.24 5.12" marker-end="url(#arrow)" />
  <text x="639.9999" y="553.7144" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3986" fill="var(--text-faint)">Sync / Events</text>
  <line x1="1062.2222" y1="361.0714" x2="1062.2222" y2="512.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="506.6666" y="40" width="266.6666" height="93.2143" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="639.9999" y="98.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4711" font-weight="bold">Client</text>
  <rect x="40" y="267.8572" width="355.5556" height="93.2143" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="217.7778" y="325.8572" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4711" font-weight="bold">Command Service</text>
  <rect x="884.4444" y="267.8572" width="355.5556" height="93.2143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1062.2222" y="325.8572" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4711" font-weight="bold">Query Service</text>
  <rect x="40" y="516.4286" width="355.5556" height="103.5714" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="217.7778" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4349" font-weight="bold">Write Database</text>
  <text x="217.7778" y="599.2858" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3624" fill="var(--text-muted)">(source of truth)</text>
  <rect x="884.4444" y="516.4286" width="355.5556" height="103.5714" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1062.2222" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.4349" font-weight="bold">Read Database</text>
  <text x="1062.2222" y="599.2858" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3624" fill="var(--text-muted)">(optimized for reads)</text>
  <line x1="551.1111" y1="133.2143" x2="306.6666" y2="263.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="373.3333" y="185" font-family="Arial, sans-serif" font-size="22.3986" fill="var(--primary-accent)">Commands</text>
  <line x1="728.8889" y1="133.2143" x2="995.5555" y2="263.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="906.6666" y="185" font-family="Arial, sans-serif" font-size="22.3986" fill="var(--ok-accent)">Queries</text>
  <line x1="217.7778" y1="361.0714" x2="217.7778" y2="512.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="395.5556" y1="568.2143" x2="879.9999" y2="568.2143" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="10.24 5.12" marker-end="url(#arrow)" />
  <text x="639.9999" y="553.7144" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3986" fill="var(--text-faint)">Sync / Events</text>
  <line x1="1062.2222" y1="361.0714" x2="1062.2222" y2="512.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
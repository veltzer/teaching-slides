<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="597.3333" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9067" font-weight="bold" fill="var(--primary-accent)">Saga: Orchestration Pattern</text>
  <rect x="74.6667" y="72" width="179.2" height="64" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="164.2667" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.92" font-weight="bold">Orchestrator</text>
  <rect x="403.2" y="72" width="149.3333" height="64" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="477.8667" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.92" font-weight="bold">Order</text>
  <rect x="701.8667" y="72" width="149.3333" height="64" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="776.5333" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.92" font-weight="bold">Payment</text>
  <rect x="970.6666" y="72" width="149.3333" height="64" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1045.3333" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.92" font-weight="bold">Inventory</text>
  <line x1="164.2667" y1="136" x2="164.2667" y2="640" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="7.4667 7.4667" />
  <line x1="477.8667" y1="136" x2="477.8667" y2="640" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="7.4667 7.4667" />
  <line x1="776.5333" y1="136" x2="776.5333" y2="640" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="7.4667 7.4667" />
  <line x1="1045.3333" y1="136" x2="1045.3333" y2="640" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="7.4667 7.4667" />
  <line x1="164.2667" y1="192" x2="474.88" y2="192" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="319.5733" y="180.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4267">Create Order</text>
   Orchestrator: Order Created --&gt;
  <line x1="477.8667" y1="256" x2="167.2533" y2="256" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <text x="319.5733" y="244.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4267" fill="var(--ok-accent)">Order Created</text>
  <line x1="164.2667" y1="336" x2="773.5467" y2="336" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="468.9067" y="324.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4267">Process Payment</text>
   Orchestrator: Payment OK --&gt;
  <line x1="776.5333" y1="400" x2="167.2533" y2="400" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <text x="468.9067" y="388.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4267" fill="var(--ok-accent)">Payment OK</text>
  <line x1="164.2667" y1="480" x2="1042.3466" y2="480" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="597.3333" y="468.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4267">Reserve Stock</text>
   Orchestrator: Stock Reserved --&gt;
  <line x1="1045.3333" y1="543.9999" x2="167.2533" y2="543.9999" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)" />
  <text x="597.3333" y="532.7999" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.4267" fill="var(--ok-accent)">Stock Reserved</text>
</svg>
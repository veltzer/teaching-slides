<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="205.7143" height="65.352143919855" rx="6.16669820126" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.8572" y="80.845103154134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.401768659109" font-weight="bold" fill="var(--danger-text)">Orchestrator</text>
  <rect x="417.1429" y="40" width="171.4286" height="65.352143919855" rx="6.16669820126" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="502.8572" y="80.845103154134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.401768659109" font-weight="bold" fill="var(--primary-text)">Order</text>
  <rect x="760.0001" y="40" width="171.4286" height="65.352143919855" rx="6.16669820126" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.7143" y="80.845103154134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.401768659109" font-weight="bold" fill="var(--ok-text)">Payment</text>
  <rect x="1068.5714" y="40" width="171.4286" height="65.352143919855" rx="6.16669820126" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1154.2858" y="80.845103154134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.401768659109" font-weight="bold" fill="var(--warn-text)">Inventory</text>
  <line x1="142.8572" y1="105.352143919855" x2="142.8572" y2="620" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="7.4667 7.4667"/>
  <line x1="502.8572" y1="105.352143919855" x2="502.8572" y2="620" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="7.4667 7.4667"/>
  <line x1="845.7143" y1="105.352143919855" x2="845.7143" y2="620" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="7.4667 7.4667"/>
  <line x1="1154.2858" y1="105.352143919855" x2="1154.2858" y2="620" stroke="var(--text-faint)" stroke-width="1.4933" stroke-dasharray="7.4667 7.4667"/>
  <line x1="142.8572" y1="162.535203828606" x2="499.4286" y2="162.535203828606" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="321.1428" y="151.098655227134" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.784963169042" fill="var(--text)">Create Order</text>
   Orchestrator: Order Created --&gt;
  <line x1="502.8572" y1="227.887347748461" x2="146.2857" y2="227.887347748461" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)"/>
  <text x="321.1428" y="216.450693513192" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.784963169042" fill="var(--ok-accent)">Order Created</text>
  <line x1="142.8572" y1="309.577448422933" x2="842.2858" y2="309.577448422933" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492.5715" y="298.140899821461" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.784963169042" fill="var(--text)">Process Payment</text>
   Orchestrator: Payment OK --&gt;
  <line x1="845.7143" y1="374.929592342788" x2="146.2857" y2="374.929592342788" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)"/>
  <text x="492.5715" y="363.49293810752" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.784963169042" fill="var(--ok-accent)">Payment OK</text>
  <line x1="142.8572" y1="456.61969301726" x2="1150.8572" y2="456.61969301726" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="445.183144415788" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.784963169042" fill="var(--text)">Reserve Stock</text>
   Orchestrator: Stock Reserved --&gt;
  <line x1="1154.2858" y1="521.971731303319" x2="146.2857" y2="521.971731303319" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.96 4.48" marker-end="url(#arrow)"/>
  <text x="640" y="510.53507706805" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.784963169042" fill="var(--ok-accent)">Stock Reserved</text>
</svg>

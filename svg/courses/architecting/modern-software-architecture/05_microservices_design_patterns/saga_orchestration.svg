<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a90e2">Saga: Orchestration Pattern</text>
  <!-- Participant headers -->
  <rect x="50" y="45" width="120" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="110" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Orchestrator</text>
  <rect x="270" y="45" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="320" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Order</text>
  <rect x="470" y="45" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="520" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Payment</text>
  <rect x="650" y="45" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="700" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Inventory</text>
  <!-- Lifelines -->
  <line x1="110" y1="85" x2="110" y2="400" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="320" y1="85" x2="320" y2="400" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="520" y1="85" x2="520" y2="400" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="700" y1="85" x2="700" y2="400" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <!-- Msg 1: Orchestrator -> Order: Create Order -->
  <line x1="110" y1="120" x2="318" y2="120" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="214" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Create Order</text>
  <!-- Msg 2: Order --> Orchestrator: Order Created -->
  <line x1="320" y1="160" x2="112" y2="160" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="214" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Order Created</text>
  <!-- Msg 3: Orchestrator -> Payment: Process Payment -->
  <line x1="110" y1="210" x2="518" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="314" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Process Payment</text>
  <!-- Msg 4: Payment --> Orchestrator: Payment OK -->
  <line x1="520" y1="250" x2="112" y2="250" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="314" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Payment OK</text>
  <!-- Msg 5: Orchestrator -> Inventory: Reserve Stock -->
  <line x1="110" y1="300" x2="698" y2="300" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Reserve Stock</text>
  <!-- Msg 6: Inventory --> Orchestrator: Stock Reserved -->
  <line x1="700" y1="340" x2="112" y2="340" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="400" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Stock Reserved</text>
</svg>

  <text x="474.3529" y="248.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0706" font-weight="bold">Data Patterns</text>
  <rect x="662.5882" y="205.7143" width="286.1176" height="68.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="805.6471" y="248.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0706" font-weight="bold">Communication Patterns</text>
  <rect x="1024" y="205.7143" width="225.8824" height="68.5714" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1136.9412" y="248.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0706" font-weight="bold">Transaction Patterns</text>
  <line x1="542.1176" y1="111.4286" x2="210.8235" y2="202.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="602.3529" y1="111.4286" x2="474.3529" y2="202.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="677.6471" y1="111.4286" x2="805.6471" y2="202.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="737.8824" y1="111.4286" x2="1099.2941" y2="202.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="15.0588" y="360" width="210.8235" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="120.4706" y="397.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">API Gateway</text>
  <rect x="15.0588" y="445.7143" width="210.8235" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="120.4706" y="483.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Backend for Frontend</text>
  <rect x="15.0588" y="531.4286" width="210.8235" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="120.4706" y="569.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Service Discovery</text>
  <line x1="165.6471" y1="274.2857" x2="135.5294" y2="356.5714" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="165.6471" y1="274.2857" x2="128" y2="442.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="165.6471" y1="274.2857" x2="120.4706" y2="528" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="316.2353" y="360" width="240.9412" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="436.7059" y="397.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Database per Service</text>
  <rect x="316.2353" y="445.7143" width="240.9412" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="436.7059" y="483.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">CQRS</text>
  <rect x="316.2353" y="531.4286" width="240.9412" height="60" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="436.7059" y="569.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Event Sourcing</text>
  <line x1="474.3529" y1="274.2857" x2="451.7647" y2="356.5714" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="474.3529" y1="274.2857" x2="444.2353" y2="442.2857" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />

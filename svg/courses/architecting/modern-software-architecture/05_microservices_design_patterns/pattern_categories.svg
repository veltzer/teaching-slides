<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="479.0244" y="40" width="336.5853" height="80.3077" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="647.3171" y="89.9692" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.205" font-weight="bold" fill="var(--primary-text)">Microservices Patterns</text>
  <rect x="69.2683" y="218.4616" width="234.1464" height="71.3846" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="186.3415" y="263.0769" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1757" font-weight="bold" fill="var(--ok-text)">Routing Patterns</text>
  <rect x="376.5854" y="218.4616" width="219.5122" height="71.3846" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="486.3414" y="263.0769" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1757" font-weight="bold" fill="var(--warn-text)">Data Patterns</text>
  <rect x="669.2682" y="218.4616" width="278.0487" height="71.3846" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808.2927" y="263.0769" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1757" font-weight="bold" fill="var(--primary-text)">Communication Patterns</text>
  <rect x="1020.4878" y="218.4616" width="219.5122" height="71.3846" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130.2439" y="263.0769" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1757" font-weight="bold" fill="var(--danger-text)">Transaction Patterns</text>
  <line x1="552.1951" y1="120.3077" x2="230.2439" y2="214.8923" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610.7317" y1="120.3077" x2="486.3414" y2="214.8923" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="683.9025" y1="120.3077" x2="808.2927" y2="214.8923" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="742.4391" y1="120.3077" x2="1093.6585" y2="214.8923" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="379.0769" width="204.878" height="62.4615" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.4391" y="418.3385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6611" fill="var(--ok-text)">API Gateway</text>
  <rect x="40" y="468.3077" width="204.878" height="62.4615" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.4391" y="507.5692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6611" fill="var(--ok-text)">Backend for Frontend</text>
  <rect x="40" y="557.5385" width="204.878" height="62.4615" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="142.4391" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6611" fill="var(--ok-text)">Service Discovery</text>
  <line x1="186.3415" y1="289.8461" x2="157.0732" y2="375.5077" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="186.3415" y1="289.8461" x2="149.7561" y2="464.7384" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="186.3415" y1="289.8461" x2="142.4391" y2="553.9692" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="332.6829" y="379.0769" width="234.1464" height="62.4615" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="449.7561" y="418.3385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6611" fill="var(--warn-text)">Database per Service</text>
  <rect x="332.6829" y="468.3077" width="234.1464" height="62.4615" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="449.7561" y="507.5692" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6611" fill="var(--warn-text)">CQRS</text>
  <rect x="332.6829" y="557.5385" width="234.1464" height="62.4615" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="449.7561" y="596.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6611" fill="var(--warn-text)">Event Sourcing</text>
  <line x1="486.3414" y1="289.8461" x2="464.3902" y2="375.5077" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="486.3414" y1="289.8461" x2="457.0732" y2="464.7384" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="486.3414" y1="289.8461" x2="449.7561" y2="553.9692" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1020.4878" y="379.0769" width="175.6098" height="62.4615" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.2926" y="418.3385" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6611" fill="var(--danger-text)">Saga</text>
  <line x1="1130.2439" y1="289.8461" x2="1115.6098" y2="375.5077" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

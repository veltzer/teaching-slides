  <text x="1114.3529" y="397.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Saga</text>
  <line x1="1136.9412" y1="274.2857" x2="1121.8824" y2="356.5714" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
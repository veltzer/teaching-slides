<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Root -->
  <rect x="310" y="20" width="230" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="425" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Microservices Patterns</text>
  <!-- Category: Routing -->
  <rect x="30" y="120" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Routing Patterns</text>
  <!-- Category: Data -->
  <rect x="240" y="120" width="150" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="315" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Data Patterns</text>
  <!-- Category: Communication -->
  <rect x="440" y="120" width="190" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="535" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Communication Patterns</text>
  <!-- Category: Transaction -->
  <rect x="680" y="120" width="150" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="755" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Transaction Patterns</text>
  <!-- Arrows from root -->
  <line x1="360" y1="65" x2="140" y2="118" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="65" x2="315" y2="118" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="65" x2="535" y2="118" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="65" x2="730" y2="118" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Routing children -->
  <rect x="10" y="210" width="140" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="80" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">API Gateway</text>
  <rect x="10" y="260" width="140" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="80" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Backend for Frontend</text>
  <rect x="10" y="310" width="140" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="80" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Service Discovery</text>
  <line x1="110" y1="160" x2="90" y2="208" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="110" y1="160" x2="85" y2="258" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="110" y1="160" x2="80" y2="308" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Data children -->
  <rect x="210" y="210" width="160" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="290" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Database per Service</text>
  <rect x="210" y="260" width="160" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="290" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">CQRS</text>
  <rect x="210" y="310" width="160" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="290" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Event Sourcing</text>
  <line x1="315" y1="160" x2="300" y2="208" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="315" y1="160" x2="295" y2="258" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="315" y1="160" x2="290" y2="308" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Transaction children -->
  <rect x="680" y="210" width="120" height="35" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/>
  <text x="740" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Saga</text>
  <line x1="755" y1="160" x2="745" y2="208" stroke="#dc3545" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="637.4396" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1644" font-weight="bold" fill="var(--primary-accent)">Saga: Choreography Pattern</text>
  <rect x="40" y="69.3671" width="170.6971" height="58.7342" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.3485" y="106.076" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9981" font-weight="bold" fill="var(--primary-text)">Order</text>
  <rect x="381.3941" y="69.3671" width="170.6971" height="58.7342" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.7426" y="106.076" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9981" font-weight="bold" fill="var(--ok-text)">Payment</text>
  <rect x="722.7881" y="69.3671" width="170.6971" height="58.7342" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808.1366" y="106.076" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9981" font-weight="bold" fill="var(--warn-text)">Inventory</text>
  <rect x="1064.1822" y="69.3671" width="170.6971" height="58.7342" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.5307" y="106.076" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9981" font-weight="bold" fill="var(--primary-text)">Shipping</text>
  <line x1="125.3485" y1="128.1013" x2="125.3485" y2="620" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619"/>
  <line x1="466.7426" y1="128.1013" x2="466.7426" y2="620" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619"/>
  <line x1="808.1366" y1="128.1013" x2="808.1366" y2="620" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619"/>
  <line x1="1149.5307" y1="128.1013" x2="1149.5307" y2="620" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619"/>
  <rect x="139.0042" y="164.8101" width="76.8136" height="44.0506" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <line x1="125.3485" y1="176.557" x2="139.0042" y2="176.557" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="139.0042" y1="208.8608" x2="125.3485" y2="208.8608" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="253.3713" y="194.1772" font-family="Arial, sans-serif" font-size="15.8317" fill="var(--text)">Create Order</text>
  <line x1="125.3485" y1="245.5697" x2="463.3286" y2="245.5697" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296.0455" y="235.2912" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4149" fill="var(--text)">OrderCreated</text>
  <rect x="480.3983" y="274.9368" width="76.8136" height="44.0506" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <line x1="466.7426" y1="286.6835" x2="480.3983" y2="286.6835" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="480.3983" y1="318.9873" x2="466.7426" y2="318.9873" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="603.3001" y="304.3039" font-family="Arial, sans-serif" font-size="15.8317" fill="var(--text)">Process Payment</text>
  <line x1="466.7426" y1="355.6962" x2="804.7226" y2="355.6962" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="637.4396" y="345.4177" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4149" fill="var(--ok-accent)">PaymentCompleted</text>
  <rect x="821.7923" y="385.0633" width="76.8136" height="44.0506" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <line x1="808.1366" y1="396.8102" x2="821.7923" y2="396.8102" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="821.7923" y1="429.114" x2="808.1366" y2="429.114" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="941.2803" y="414.4304" font-family="Arial, sans-serif" font-size="15.8317" fill="var(--text)">Reserve Stock</text>
  <line x1="808.1366" y1="465.8228" x2="1146.1167" y2="465.8228" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="978.8336" y="455.5443" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4149" fill="var(--text)">StockReserved</text>
  <rect x="1163.1864" y="495.1899" width="76.8136" height="44.0506" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <line x1="1149.5307" y1="506.9367" x2="1163.1864" y2="506.9367" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1163.1864" y1="539.2405" x2="1149.5307" y2="539.2405" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1115.3913" y="583.2912" font-family="Arial, sans-serif" font-size="15.8317" fill="var(--text)">Schedule Delivery</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="170.6971" height="61.866691946667" rx="6.157921791039" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.3485" y="78.666708800001" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.498135663056" font-weight="bold" fill="var(--primary-text)">Order</text>
  <rect x="381.3941" y="40" width="170.6971" height="61.866691946667" rx="6.157921791039" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.7426" y="78.666708800001" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.498135663056" font-weight="bold" fill="var(--ok-text)">Payment</text>
  <rect x="722.7881" y="40" width="170.6971" height="61.866691946667" rx="6.157921791039" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="808.1366" y="78.666708800001" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.498135663056" font-weight="bold" fill="var(--warn-text)">Inventory</text>
  <rect x="1064.1822" y="40" width="170.6971" height="61.866691946667" rx="6.157921791039" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1149.5307" y="78.666708800001" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.498135663056" font-weight="bold" fill="var(--primary-text)">Shipping</text>
  <line x1="125.3485" y1="101.866691946667" x2="125.3485" y2="620" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619"/>
  <line x1="466.7426" y1="101.866691946667" x2="466.7426" y2="620" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619"/>
  <line x1="808.1366" y1="101.866691946667" x2="808.1366" y2="620" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619"/>
  <line x1="1149.5307" y1="101.866691946667" x2="1149.5307" y2="620" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619"/>
  <rect x="139.0042" y="140.533295413333" width="76.8136" height="46.399966293333" rx="6.157921791039" fill="none" stroke="var(--border)" stroke-width="1"/>
  <line x1="125.3485" y1="152.906697002667" x2="139.0042" y2="152.906697002667" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="139.0042" y1="186.933367040001" x2="125.3485" y2="186.933367040001" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="253.3713" y="171.466641386666" font-family="Arial, sans-serif" font-size="16.248395069865" fill="var(--text)">Create Order</text>
  <line x1="125.3485" y1="225.600075840002" x2="463.3286" y2="225.600075840002" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296.0455" y="214.773388949335" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.873265366461" fill="var(--text)">OrderCreated</text>
  <rect x="480.3983" y="256.533421813335" width="76.8136" height="46.399966293333" rx="6.157921791039" fill="none" stroke="var(--border)" stroke-width="1"/>
  <line x1="466.7426" y1="268.906612735999" x2="480.3983" y2="268.906612735999" stroke="var(--ok-border)" stroke-width="2"/>
  <line x1="480.3983" y1="302.933282773332" x2="466.7426" y2="302.933282773332" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="603.3001" y="287.466767786669" font-family="Arial, sans-serif" font-size="16.248395069865" fill="var(--text)">Process Payment</text>
  <line x1="466.7426" y1="341.599991573333" x2="804.7226" y2="341.599991573333" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="637.4396" y="330.773304682666" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.873265366461" fill="var(--ok-accent)">PaymentCompleted</text>
  <rect x="821.7923" y="372.533337546667" width="76.8136" height="46.399966293333" rx="6.157921791039" fill="none" stroke="var(--border)" stroke-width="1"/>
  <line x1="808.1366" y1="384.906739136001" x2="821.7923" y2="384.906739136001" stroke="var(--warn-border)" stroke-width="2"/>
  <line x1="821.7923" y1="418.933409173335" x2="808.1366" y2="418.933409173335" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="941.2803" y="403.46668352" font-family="Arial, sans-serif" font-size="16.248395069865" fill="var(--text)">Reserve Stock</text>
  <line x1="808.1366" y1="457.60001264" x2="1146.1167" y2="457.60001264" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="978.8336" y="446.773325749333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.873265366461" fill="var(--text)">StockReserved</text>
  <rect x="1163.1864" y="488.533358613334" width="76.8136" height="46.399966293333" rx="6.157921791039" fill="none" stroke="var(--border)" stroke-width="1"/>
  <line x1="1149.5307" y1="500.906654869333" x2="1163.1864" y2="500.906654869333" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1163.1864" y1="534.933324906666" x2="1149.5307" y2="534.933324906666" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1115.3913" y="581.333396533335" font-family="Arial, sans-serif" font-size="16.248395069865" fill="var(--text)">Schedule Delivery</text>
</svg>

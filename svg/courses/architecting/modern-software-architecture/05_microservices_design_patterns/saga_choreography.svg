<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="609.5238" y="38.0952" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3333" font-weight="bold" fill="var(--primary-accent)">Saga: Choreography Pattern</text>
  <rect x="76.1905" y="68.5714" width="152.381" height="60.9524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="152.381" y="106.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2857" font-weight="bold">Order</text>
  <rect x="380.9524" y="68.5714" width="152.381" height="60.9524" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="457.1429" y="106.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2857" font-weight="bold">Payment</text>
  <rect x="685.7143" y="68.5714" width="152.381" height="60.9524" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="761.9048" y="106.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2857" font-weight="bold">Inventory</text>
  <rect x="990.4762" y="68.5714" width="152.381" height="60.9524" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1066.6667" y="106.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2857" font-weight="bold">Shipping</text>
  <line x1="152.381" y1="129.5238" x2="152.381" y2="640" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619" />
  <line x1="457.1429" y1="129.5238" x2="457.1429" y2="640" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619" />
  <line x1="761.9048" y1="129.5238" x2="761.9048" y2="640" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619" />
  <line x1="1066.6667" y1="129.5238" x2="1066.6667" y2="640" stroke="var(--text-faint)" stroke-width="1.5238" stroke-dasharray="7.619 7.619" />
  <rect x="164.5714" y="167.619" width="68.5714" height="45.7143" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <line x1="152.381" y1="179.8095" x2="164.5714" y2="179.8095" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="164.5714" y1="213.3333" x2="152.381" y2="213.3333" stroke="var(--primary-border)" stroke-width="2" />
  <text x="266.6667" y="198.0952" font-family="Arial, sans-serif" font-size="15.2381" fill="var(--text)">Create Order</text>
  <line x1="152.381" y1="251.4286" x2="454.0952" y2="251.4286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="304.7619" y="240.7619" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7619">OrderCreated</text>
  <rect x="469.3333" y="281.9048" width="68.5714" height="45.7143" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <line x1="457.1429" y1="294.0952" x2="469.3333" y2="294.0952" stroke="var(--ok-border)" stroke-width="2" />
  <line x1="469.3333" y1="327.619" x2="457.1429" y2="327.619" stroke="var(--ok-border)" stroke-width="2" />
  <text x="579.0476" y="312.381" font-family="Arial, sans-serif" font-size="15.2381" fill="var(--text)">Process Payment</text>
  <line x1="457.1429" y1="365.7143" x2="758.8571" y2="365.7143" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="609.5238" y="355.0476" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7619" fill="var(--ok-accent)">PaymentCompleted</text>
  <rect x="774.0952" y="396.1905" width="68.5714" height="45.7143" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <line x1="761.9048" y1="408.381" x2="774.0952" y2="408.381" stroke="var(--warn-border)" stroke-width="2" />
  <line x1="774.0952" y1="441.9048" x2="761.9048" y2="441.9048" stroke="var(--warn-border)" stroke-width="2" />
  <text x="880.7619" y="426.6667" font-family="Arial, sans-serif" font-size="15.2381" fill="var(--text)">Reserve Stock</text>
  <line x1="761.9048" y1="480" x2="1063.619" y2="480" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="914.2857" y="469.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7619">StockReserved</text>
  <rect x="1078.8571" y="510.4762" width="68.5714" height="45.7143" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <line x1="1066.6667" y1="522.6667" x2="1078.8571" y2="522.6667" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1078.8571" y1="556.1905" x2="1066.6667" y2="556.1905" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1036.1905" y="601.9048" font-family="Arial, sans-serif" font-size="15.2381" fill="var(--text)">Schedule Delivery</text>
</svg>
<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a90e2">Saga: Choreography Pattern</text>
  <!-- Participant headers -->
  <rect x="50" y="45" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="100" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Order</text>
  <rect x="250" y="45" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="300" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Payment</text>
  <rect x="450" y="45" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="500" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Inventory</text>
  <rect x="650" y="45" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="700" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Shipping</text>
  <!-- Lifelines -->
  <line x1="100" y1="85" x2="100" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="300" y1="85" x2="300" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="85" x2="500" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="700" y1="85" x2="700" y2="420" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <!-- Self: Create Order -->
  <rect x="108" y="110" width="45" height="30" rx="3" fill="none" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="100" y1="118" x2="108" y2="118" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="108" y1="140" x2="100" y2="140" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="175" y="130" font-family="Arial, sans-serif" font-size="10" fill="#333">Create Order</text>
  <!-- Order -> Payment: OrderCreated -->
  <line x1="100" y1="165" x2="298" y2="165" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="200" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">OrderCreated</text>
  <!-- Self: Process Payment -->
  <rect x="308" y="185" width="45" height="30" rx="3" fill="none" stroke="#28a745" stroke-width="1.5"/>
  <line x1="300" y1="193" x2="308" y2="193" stroke="#28a745" stroke-width="1.5"/>
  <line x1="308" y1="215" x2="300" y2="215" stroke="#28a745" stroke-width="1.5"/>
  <text x="380" y="205" font-family="Arial, sans-serif" font-size="10" fill="#333">Process Payment</text>
  <!-- Payment -> Inventory: PaymentCompleted -->
  <line x1="300" y1="240" x2="498" y2="240" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">PaymentCompleted</text>
  <!-- Self: Reserve Stock -->
  <rect x="508" y="260" width="45" height="30" rx="3" fill="none" stroke="#ffc107" stroke-width="1.5"/>
  <line x1="500" y1="268" x2="508" y2="268" stroke="#ffc107" stroke-width="1.5"/>
  <line x1="508" y1="290" x2="500" y2="290" stroke="#ffc107" stroke-width="1.5"/>
  <text x="578" y="280" font-family="Arial, sans-serif" font-size="10" fill="#333">Reserve Stock</text>
  <!-- Inventory -> Shipping: StockReserved -->
  <line x1="500" y1="315" x2="698" y2="315" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="600" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">StockReserved</text>
  <!-- Self: Schedule Delivery -->
  <rect x="708" y="335" width="45" height="30" rx="3" fill="none" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="700" y1="343" x2="708" y2="343" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="708" y1="365" x2="700" y2="365" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="680" y="395" font-family="Arial, sans-serif" font-size="10" fill="#333">Schedule Delivery</text>
</svg>

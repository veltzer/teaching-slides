<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,16.7442 5.6,0" fill="#28a745" />
    </marker>
  </defs>
  <rect x="40" y="40" width="171.4286" height="59.4872" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.7142" y="77.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" font-weight="bold">Client</text>
  <rect x="365.7143" y="40" width="222.8572" height="59.4872" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="477.1428" y="77.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" font-weight="bold">Load Balancer</text>
  <rect x="742.8571" y="40" width="171.4286" height="59.4872" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="828.5715" y="77.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" font-weight="bold">Registry</text>
  <rect x="1068.5714" y="40" width="171.4286" height="59.4872" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1154.2858" y="77.1795" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7298" font-weight="bold">Service</text>
  <line x1="125.7142" y1="99.4872" x2="125.7142" y2="620" stroke="var(--text-faint)" stroke-width="1.4916" stroke-dasharray="7.458 7.458" />
  <line x1="477.1428" y1="99.4872" x2="477.1428" y2="620" stroke="var(--text-faint)" stroke-width="1.4916" stroke-dasharray="7.458 7.458" />
  <line x1="828.5715" y1="99.4872" x2="828.5715" y2="620" stroke="var(--text-faint)" stroke-width="1.4916" stroke-dasharray="7.458 7.458" />
  <line x1="1154.2858" y1="99.4872" x2="1154.2858" y2="620" stroke="var(--text-faint)" stroke-width="1.4916" stroke-dasharray="7.458 7.458" />
  <line x1="125.7142" y1="158.9744" x2="473.7143" y2="158.9744" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="300.5714" y="148.5641" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169">Request for Service X</text>
  <line x1="477.1428" y1="233.3334" x2="825.1429" y2="233.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="652" y="222.9232" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169">Lookup Service X</text>
   LB: instances --&gt;
  <line x1="828.5715" y1="292.8205" x2="480.5714" y2="292.8205" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9496 4.4748" marker-end="url(#arrow)" />
  <text x="652" y="282.4102" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169" fill="var(--ok-accent)">[instances]</text>
  <line x1="477.1428" y1="367.1795" x2="1150.8572" y2="367.1795" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="811.4286" y="356.7692" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169">Forward request</text>
   LB: Response --&gt;
  <line x1="1154.2858" y1="441.5384" x2="480.5714" y2="441.5384" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9496 4.4748" marker-end="url(#arrow)" />
  <text x="811.4286" y="431.1282" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169" fill="var(--ok-accent)">Response</text>
   Client: Response --&gt;
  <line x1="477.1428" y1="515.8974" x2="129.1428" y2="515.8974" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.9496 4.4748" marker-end="url(#arrow)" />
  <text x="300.5714" y="505.4872" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.169" fill="var(--ok-accent)">Response</text>
</svg>
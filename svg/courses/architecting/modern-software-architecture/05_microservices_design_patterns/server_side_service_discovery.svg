<svg viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Participant headers -->
  <rect x="40" y="20" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="90" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Client</text>
  <rect x="230" y="20" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="295" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Load Balancer</text>
  <rect x="450" y="20" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="500" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Registry</text>
  <rect x="640" y="20" width="100" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="690" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Service</text>
  <!-- Lifelines -->
  <line x1="90" y1="60" x2="90" y2="410" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="295" y1="60" x2="295" y2="410" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="500" y1="60" x2="500" y2="410" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="690" y1="60" x2="690" y2="410" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <!-- Msg 1: Client -> LB: Request -->
  <line x1="90" y1="100" x2="293" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="192" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Request for Service X</text>
  <!-- Msg 2: LB -> Registry: Lookup -->
  <line x1="295" y1="150" x2="498" y2="150" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="397" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Lookup Service X</text>
  <!-- Msg 3: Registry --> LB: instances -->
  <line x1="500" y1="190" x2="297" y2="190" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="397" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">[instances]</text>
  <!-- Msg 4: LB -> Service: Forward -->
  <line x1="295" y1="240" x2="688" y2="240" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="490" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Forward request</text>
  <!-- Msg 5: Service --> LB: Response -->
  <line x1="690" y1="290" x2="297" y2="290" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="490" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Response</text>
  <!-- Msg 6: LB --> Client: Response -->
  <line x1="295" y1="340" x2="92" y2="340" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="192" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Response</text>
</svg>

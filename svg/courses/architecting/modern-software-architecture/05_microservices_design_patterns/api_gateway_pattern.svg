<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Clients column -->
  <text x="130" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#212121">Clients</text>
  <rect x="40" y="65" width="180" height="52" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#212121">Web Browser</text>
  <rect x="40" y="135" width="180" height="52" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#212121">Mobile App</text>
  <rect x="40" y="205" width="180" height="52" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#212121">3rd Party API</text>
  <rect x="40" y="275" width="180" height="52" rx="8" fill="url(#grad-surface)" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#212121">IoT Device</text>
  <!-- Arrows: clients → gateway -->
  <line x1="220" y1="91" x2="370" y2="230" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="220" y1="161" x2="370" y2="240" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="220" y1="231" x2="370" y2="250" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="220" y1="301" x2="370" y2="260" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <!-- API Gateway box -->
  <rect x="370" y="150" width="240" height="220" rx="10" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="490" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#ffffff">API Gateway</text>
  <rect x="390" y="192" width="200" height="28" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  <text x="490" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#ffffff">Authentication / AuthZ</text>
  <rect x="390" y="226" width="200" height="28" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  <text x="490" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#ffffff">Rate Limiting</text>
  <rect x="390" y="260" width="200" height="28" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  <text x="490" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#ffffff">SSL Termination</text>
  <rect x="390" y="294" width="200" height="28" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  <text x="490" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#ffffff">Request Routing</text>
  <rect x="390" y="328" width="200" height="28" rx="5" fill="#ffffff" fill-opacity="0.2"/>
  <text x="490" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#ffffff">Logging / Tracing</text>
  <!-- Services column -->
  <text x="900" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#212121">Backend Services</text>
  <!-- Auth Service -->
  <rect x="750" y="65" width="180" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#212121">Auth Service</text>
  <text x="840" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">JWT / OAuth2</text>
  <!-- Products Service -->
  <rect x="750" y="175" width="180" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#212121">Products</text>
  <text x="840" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Catalog, Search</text>
  <!-- Orders Service -->
  <rect x="750" y="285" width="180" height="80" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#212121">Orders</text>
  <text x="840" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Cart, Checkout</text>
  <!-- Payments Service -->
  <rect x="750" y="395" width="180" height="80" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" filter="url(#shadow)"/>
  <text x="840" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#212121">Payments</text>
  <text x="840" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Stripe, PayPal</text>
  <!-- Arrows: gateway → services -->
  <line x1="612" y1="200" x2="748" y2="105" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="612" y1="230" x2="748" y2="215" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="612" y1="260" x2="748" y2="325" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="612" y1="280" x2="748" y2="435" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Each service has its own DB -->
  <rect x="960" y="75" width="120" height="40" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="1020" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Auth DB</text>
  <rect x="960" y="185" width="120" height="40" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="1020" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Products DB</text>
  <rect x="960" y="295" width="120" height="40" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="1020" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Orders DB</text>
  <rect x="960" y="405" width="120" height="40" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
  <text x="1020" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Payments DB</text>
  <!-- DB arrows -->
  <line x1="930" y1="105" x2="958" y2="95" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="215" x2="958" y2="205" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="325" x2="958" y2="315" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="435" x2="958" y2="425" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Internet / firewall zone label -->
  <rect x="230" y="330" width="130" height="36" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="295" y="353" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#c62828">Internet Zone</text>
  <rect x="620" y="330" width="130" height="36" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="685" y="353" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#2e7d32">Internal Zone</text>
  <!-- Bottom summary -->
  <rect x="40" y="520" width="1200" height="100" rx="8" fill="#f2f2f2"/>
  <text x="640" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">API Gateway Benefits</text>
  <text x="160" y="573" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Single entry point</text>
  <text x="380" y="573" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Cross-cutting concerns</text>
  <text x="620" y="573" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Client simplification</text>
  <text x="860" y="573" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Protocol translation</text>
  <text x="1080" y="573" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Security boundary</text>
  <text x="160" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">for all clients</text>
  <text x="380" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">auth, rate-limit, log</text>
  <text x="620" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">hides topology</text>
  <text x="860" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">REST↔gRPC</text>
  <text x="1080" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">perimeter defense</text>
  <!-- Tools row -->
  <rect x="40" y="630" width="1200" height="36" rx="6" fill="#e3f2fd"/>
  <text x="640" y="654" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#1565c0">Tools: Kong · AWS API Gateway · NGINX · Traefik · Azure API Management · Envoy</text>
</svg>

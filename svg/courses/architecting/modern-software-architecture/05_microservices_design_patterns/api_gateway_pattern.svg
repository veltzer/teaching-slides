  <line x1="246.25" y1="169.6944" x2="386.875" y2="233.3333" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />
  <line x1="246.25" y1="226.0833" x2="386.875" y2="241.3889" stroke="var(--primary-border)" stroke-width="1.3333" marker-end="url(#arrow-primary)" />

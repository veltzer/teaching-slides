  <text x="640" y="479.0277" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.0354" font-weight="bold" fill="var(--primary-accent)">API Gateway Benefits</text>
  <text x="190" y="501.5833" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Single entry point</text>
  <text x="396.25" y="501.5833" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Cross-cutting concerns</text>

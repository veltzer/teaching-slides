<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <rect x="94.8148" y="26.6667" width="158.0247" height="53.3333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="173.8271" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3333" font-weight="bold">Client</text>
  <rect x="426.6667" y="26.6667" width="158.0247" height="53.3333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="505.679" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3333" font-weight="bold">Service</text>
  <rect x="790.1234" y="26.6667" width="189.6296" height="53.3333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="884.9382" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3333" font-weight="bold">Event Store</text>
  <line x1="173.8271" y1="80" x2="173.8271" y2="640" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="6.6667 6.6667" />
  <line x1="505.679" y1="80" x2="505.679" y2="640" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="6.6667 6.6667" />
  <line x1="884.9382" y1="80" x2="884.9382" y2="640" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="6.6667 6.6667" />
  <line x1="173.8271" y1="133.3333" x2="502.5185" y2="133.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="338.1729" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6667">Place Order</text>
  <line x1="505.679" y1="173.3333" x2="881.7778" y2="173.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="695.3086" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6667">Append OrderCreated</text>
  <line x1="173.8271" y1="240" x2="502.5185" y2="240" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="338.1729" y="230.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6667">Add Item</text>
  <line x1="505.679" y1="280" x2="881.7778" y2="280" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="695.3086" y="270.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6667">Append ItemAdded</text>
  <line x1="173.8271" y1="360" x2="502.5185" y2="360" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="338.1729" y="350.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6667">Get Order</text>
  <line x1="505.679" y1="400" x2="881.7778" y2="400" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="695.3086" y="390.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6667">Read Events</text>
   Service: events list --&gt;
  <line x1="884.9382" y1="453.3333" x2="508.8395" y2="453.3333" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)" />
  <text x="695.3086" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6667" fill="var(--ok-accent)">[OrderCreated, ItemAdded]</text>
  <rect x="521.4815" y="493.3333" width="79.0123" height="46.6667" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <line x1="505.679" y1="506.6667" x2="521.4815" y2="506.6667" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="521.4815" y1="540" x2="505.679" y2="540" stroke="var(--primary-border)" stroke-width="2" />
  <text x="663.7037" y="524" font-family="Arial, sans-serif" font-size="13.3333" fill="var(--text)">Replay to build state</text>
   Client: Current State --&gt;
  <line x1="505.679" y1="586.6667" x2="176.9877" y2="586.6667" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)" />
  <text x="338.1729" y="577.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6667" fill="var(--ok-accent)">Current Order State</text>
</svg>
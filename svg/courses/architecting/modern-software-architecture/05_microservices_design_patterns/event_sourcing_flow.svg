<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="40" width="214.2857" height="50.4348" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="147.1428" y="71.5217" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold" fill="var(--warn-text)">Client</text>
  <rect x="490.0001" y="40" width="214.2857" height="50.4348" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="597.1429" y="71.5217" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold" fill="var(--primary-text)">Service</text>
  <rect x="982.8572" y="40" width="257.1428" height="50.4348" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1111.4286" y="71.5217" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold" fill="var(--ok-text)">Event Store</text>
  <line x1="147.1428" y1="90.4348" x2="147.1428" y2="620" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="6.6667 6.6667" />
  <line x1="597.1429" y1="90.4348" x2="597.1429" y2="620" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="6.6667 6.6667" />
  <line x1="1111.4286" y1="90.4348" x2="1111.4286" y2="620" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="6.6667 6.6667" />
  <line x1="147.1428" y1="140.8695" x2="592.8572" y2="140.8695" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370.0001" y="132.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--text)">Place Order</text>
  <line x1="597.1429" y1="178.6956" x2="1107.143" y2="178.6956" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="854.2857" y="169.8695" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--text)">Append OrderCreated</text>
  <line x1="147.1428" y1="241.7391" x2="592.8572" y2="241.7391" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370.0001" y="232.9131" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--text)">Add Item</text>
  <line x1="597.1429" y1="279.5652" x2="1107.143" y2="279.5652" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="854.2857" y="270.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--text)">Append ItemAdded</text>
  <line x1="147.1428" y1="355.2174" x2="592.8572" y2="355.2174" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370.0001" y="346.3913" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--text)">Get Order</text>
  <line x1="597.1429" y1="393.0435" x2="1107.143" y2="393.0435" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="854.2857" y="384.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--text)">Read Events</text>
   Service: events list --&gt;
  <line x1="1111.4286" y1="443.4782" x2="601.4286" y2="443.4782" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)" />
  <text x="854.2857" y="434.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--ok-accent)">[OrderCreated, ItemAdded]</text>
  <rect x="618.5715" y="481.3043" width="107.1428" height="44.1305" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <line x1="597.1429" y1="493.9131" x2="618.5715" y2="493.9131" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="618.5715" y1="525.4348" x2="597.1429" y2="525.4348" stroke="var(--primary-border)" stroke-width="2" />
  <text x="811.4286" y="510.3043" font-family="Arial, sans-serif" font-size="15.0986" fill="var(--text)">Replay to build state</text>
   Client: Current State --&gt;
  <line x1="597.1429" y1="569.5652" x2="151.4287" y2="569.5652" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)" />
  <text x="370.0001" y="560.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--ok-accent)">Current Order State</text>
</svg>
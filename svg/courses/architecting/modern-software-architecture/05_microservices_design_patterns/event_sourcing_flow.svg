<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,14.4 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <rect x="40" y="40" width="214.2857" height="50.4348" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="147.1428" y="71.5217" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold">Client</text>
  <rect x="490.0001" y="40" width="214.2857" height="50.4348" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="597.1429" y="71.5217" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold">Service</text>
  <rect x="982.8572" y="40" width="257.1428" height="50.4348" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1111.4286" y="71.5217" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold">Event Store</text>
  <line x1="147.1428" y1="90.4348" x2="147.1428" y2="620" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="6.6667 6.6667" />
  <line x1="597.1429" y1="90.4348" x2="597.1429" y2="620" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="6.6667 6.6667" />
  <line x1="1111.4286" y1="90.4348" x2="1111.4286" y2="620" stroke="var(--text-faint)" stroke-width="1.3333" stroke-dasharray="6.6667 6.6667" />
  <line x1="147.1428" y1="140.8695" x2="592.8572" y2="140.8695" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370.0001" y="132.0435" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086">Place Order</text>
  <line x1="597.1429" y1="178.6956" x2="1107.143" y2="178.6956" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="854.2857" y="169.8695" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086">Append OrderCreated</text>
  <line x1="147.1428" y1="241.7391" x2="592.8572" y2="241.7391" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370.0001" y="232.9131" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086">Add Item</text>
  <line x1="597.1429" y1="279.5652" x2="1107.143" y2="279.5652" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="854.2857" y="270.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086">Append ItemAdded</text>
  <line x1="147.1428" y1="355.2174" x2="592.8572" y2="355.2174" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="370.0001" y="346.3913" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086">Get Order</text>
  <line x1="597.1429" y1="393.0435" x2="1107.143" y2="393.0435" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="854.2857" y="384.2174" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086">Read Events</text>
   Service: events list --&gt;
  <line x1="1111.4286" y1="443.4782" x2="601.4286" y2="443.4782" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)" />
  <text x="854.2857" y="434.6522" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--ok-accent)">[OrderCreated, ItemAdded]</text>
  <rect x="618.5715" y="481.3043" width="107.1428" height="44.1305" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <line x1="597.1429" y1="493.9131" x2="618.5715" y2="493.9131" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="618.5715" y1="525.4348" x2="597.1429" y2="525.4348" stroke="var(--primary-border)" stroke-width="2" />
  <text x="811.4286" y="510.3043" font-family="Arial, sans-serif" font-size="15.0986" fill="var(--text)">Replay to build state</text>
   Client: Current State --&gt;
  <line x1="597.1429" y1="569.5652" x2="151.4287" y2="569.5652" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#arrow)" />
  <text x="370.0001" y="560.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6086" fill="var(--ok-accent)">Current Order State</text>
</svg>
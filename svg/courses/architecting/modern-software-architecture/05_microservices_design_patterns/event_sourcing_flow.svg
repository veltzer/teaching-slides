<svg viewBox="0 0 750 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Participant headers -->
  <rect x="60" y="20" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="110" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Client</text>
  <rect x="270" y="20" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="320" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Service</text>
  <rect x="500" y="20" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="560" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Event Store</text>
  <!-- Lifelines -->
  <line x1="110" y1="60" x2="110" y2="480" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="320" y1="60" x2="320" y2="480" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="560" y1="60" x2="560" y2="480" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <!-- Msg 1: Client -> Service: Place Order -->
  <line x1="110" y1="100" x2="318" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="214" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Place Order</text>
  <!-- Msg 2: Service -> Event Store: Append OrderCreated -->
  <line x1="320" y1="130" x2="558" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="440" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Append OrderCreated</text>
  <!-- Msg 3: Client -> Service: Add Item -->
  <line x1="110" y1="180" x2="318" y2="180" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="214" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Add Item</text>
  <!-- Msg 4: Service -> Event Store: Append ItemAdded -->
  <line x1="320" y1="210" x2="558" y2="210" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="440" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Append ItemAdded</text>
  <!-- Msg 5: Client -> Service: Get Order -->
  <line x1="110" y1="270" x2="318" y2="270" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="214" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Get Order</text>
  <!-- Msg 6: Service -> Event Store: Read Events -->
  <line x1="320" y1="300" x2="558" y2="300" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="440" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Read Events</text>
  <!-- Msg 7: Event Store --> Service: events list -->
  <line x1="560" y1="340" x2="322" y2="340" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="440" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">[OrderCreated, ItemAdded]</text>
  <!-- Msg 8: Service self: Replay -->
  <rect x="330" y="370" width="50" height="35" rx="3" fill="none" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="320" y1="380" x2="330" y2="380" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="330" y1="405" x2="320" y2="405" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="420" y="393" font-family="Arial, sans-serif" font-size="10" fill="#333">Replay to build state</text>
  <!-- Msg 9: Service --> Client: Current State -->
  <line x1="320" y1="440" x2="112" y2="440" stroke="#28a745" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="214" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Current Order State</text>
</svg>

  <line x1="801.1111" y1="120" x2="801.1111" y2="640" stroke="var(--text-faintest)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778" />
  <line x1="1081.1111" y1="120" x2="1081.1111" y2="640" stroke="var(--text-faintest)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778" />

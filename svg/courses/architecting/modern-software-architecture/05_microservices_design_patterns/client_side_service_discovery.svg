<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#28a745" />
    </marker>
  </defs>
  <rect x="93.3333" y="40" width="155.5556" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="171.1111" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2222" font-weight="bold">Client</text>
  <rect x="388.8889" y="40" width="171.1111" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="474.4445" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2222" font-weight="bold">Registry</text>
  <rect x="715.5556" y="40" width="171.1111" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="801.1111" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2222" font-weight="bold">Service A</text>
  <rect x="995.5556" y="40" width="171.1111" height="80" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1081.1111" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2222" font-weight="bold">Service B</text>
  <line x1="171.1111" y1="120" x2="171.1111" y2="640" stroke="var(--text-faint)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778" />
  <line x1="474.4445" y1="120" x2="474.4445" y2="640" stroke="var(--text-faint)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778" />
  <line x1="801.1111" y1="120" x2="801.1111" y2="640" stroke="var(--text-faint)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778" />
  <line x1="1081.1111" y1="120" x2="1081.1111" y2="640" stroke="var(--text-faint)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778" />
  <line x1="171.1111" y1="220" x2="471.3333" y2="220" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="322" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1111" fill="var(--text)">Query for Service X</text>
   Client: instances --&gt;
  <line x1="474.4445" y1="320" x2="174.2222" y2="320" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.3333 4.6667" marker-end="url(#arrow)" />
  <text x="322" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1111" fill="var(--text)">[Service A:8080, Service B:8081]</text>
  <line x1="171.1111" y1="440" x2="798" y2="440" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="482.2222" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1111" fill="var(--ok-accent)" font-weight="bold">Direct request (client-side load balancing)</text>
</svg>
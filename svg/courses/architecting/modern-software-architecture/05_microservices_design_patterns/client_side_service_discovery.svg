<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Participant headers -->
  <rect x="60" y="20" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="110" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Client</text>
  <rect x="250" y="20" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="305" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Registry</text>
  <rect x="460" y="20" width="110" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="515" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Service A</text>
  <rect x="640" y="20" width="110" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="695" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Service B</text>
  <!-- Lifelines -->
  <line x1="110" y1="60" x2="110" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="305" y1="60" x2="305" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="515" y1="60" x2="515" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="695" y1="60" x2="695" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <!-- Message 1: Client -> Registry: Query for Service X -->
  <line x1="110" y1="110" x2="303" y2="110" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="207" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">Query for Service X</text>
  <!-- Message 2: Registry --> Client: instances -->
  <line x1="305" y1="160" x2="112" y2="160" stroke="#4a90e2" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <text x="207" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">[Service A:8080, Service B:8081]</text>
  <!-- Message 3: Client -> Service A: Direct request -->
  <line x1="110" y1="220" x2="513" y2="220" stroke="#28a745" stroke-width="2" marker-end="url(#arrowdash)"/>
  <text x="310" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745" font-weight="bold">Direct request (client-side load balancing)</text>
</svg>

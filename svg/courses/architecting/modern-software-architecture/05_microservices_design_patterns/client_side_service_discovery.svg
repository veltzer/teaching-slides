<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="173.9131" height="77.3333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="126.9565" y="88.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0228" font-weight="bold" fill="var(--warn-text)">Client</text>
  <rect x="370.4348" y="40" width="191.3043" height="77.3333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="466.087" y="88.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0228" font-weight="bold" fill="var(--primary-text)">Registry</text>
  <rect x="735.6522" y="40" width="191.3043" height="77.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="831.3043" y="88.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0228" font-weight="bold" fill="var(--ok-text)">Service A</text>
  <rect x="1048.6957" y="40" width="191.3043" height="77.3333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1144.3478" y="88.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0228" font-weight="bold" fill="var(--ok-text)">Service B</text>
  <line x1="126.9565" y1="117.3333" x2="126.9565" y2="620" stroke="var(--text-faint)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778"/>
  <line x1="466.087" y1="117.3333" x2="466.087" y2="620" stroke="var(--text-faint)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778"/>
  <line x1="831.3043" y1="117.3333" x2="831.3043" y2="620" stroke="var(--text-faint)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778"/>
  <line x1="1144.3478" y1="117.3333" x2="1144.3478" y2="620" stroke="var(--text-faint)" stroke-width="1.5556" stroke-dasharray="7.7778 7.7778"/>
  <line x1="126.9565" y1="214" x2="462.6087" y2="214" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295.6522" y="200.4667" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7885" fill="var(--text)">Query for Service X</text>
   Client: instances --&gt;
  <line x1="466.087" y1="310.6667" x2="130.4348" y2="310.6667" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="9.3333 4.6667" marker-end="url(#arrow)"/>
  <text x="295.6522" y="297.1333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7885" fill="var(--text)">[Service A:8080, Service B:8081]</text>
  <line x1="126.9565" y1="426.6667" x2="827.8261" y2="426.6667" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="474.7826" y="413.1333" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7885" fill="var(--ok-accent)" font-weight="bold">Direct request (client-side load balancing)</text>
</svg>

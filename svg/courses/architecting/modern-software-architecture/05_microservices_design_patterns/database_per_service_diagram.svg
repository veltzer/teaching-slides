<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="263.0137" height="96.6666" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.5068" y="100.1481" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5443" font-weight="bold" fill="var(--primary-text)">Order Service</text>
  <rect x="483.8356" y="40" width="279.4521" height="96.6666" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="623.5616" y="100.1481" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5443" font-weight="bold" fill="var(--ok-text)">Product Service</text>
  <rect x="944.1096" y="40" width="295.8904" height="96.6666" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.0548" y="100.1481" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.5443" font-weight="bold" fill="var(--warn-text)">Analytics Service</text>
  <rect x="40" y="297.7778" width="263.0137" height="118.1482" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="171.5068" y="347.1851" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.887" font-weight="bold" fill="var(--text)">Orders DB</text>
  <text x="171.5068" y="383.7037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5725" fill="var(--text-muted)">PostgreSQL</text>
  <rect x="483.8356" y="297.7778" width="279.4521" height="118.1482" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="623.5616" y="347.1851" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.887" font-weight="bold" fill="var(--text)">Products DB</text>
  <text x="623.5616" y="383.7037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5725" fill="var(--text-muted)">MongoDB</text>
  <rect x="944.1096" y="297.7778" width="295.8904" height="118.1482" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1092.0548" y="347.1851" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.887" font-weight="bold" fill="var(--text)">Analytics DB</text>
  <text x="1092.0548" y="383.7037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5725" fill="var(--text-muted)">ClickHouse</text>
  <line x1="171.5068" y1="136.6666" x2="171.5068" y2="293.4815" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="623.5616" y1="136.6666" x2="623.5616" y2="293.4815" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1092.0548" y1="136.6666" x2="1092.0548" y2="293.4815" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="303.0137" y1="72.2223" x2="480.5479" y2="72.2223" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="9.6 4.8" marker-end="url(#arrow)"/>
  <text x="393.4247" y="57.1852" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5725" fill="var(--text-faint)">API Call</text>
  <line x1="303.0137" y1="108.7408" x2="940.8219" y2="108.7408" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="9.6 4.8" marker-end="url(#arrow)"/>
  <text x="631.7808" y="151.7037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5725" fill="var(--text-faint)">Event</text>
  <text x="631.7808" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2298" fill="var(--text-faint)">Each service owns its database -- polyglot persistence</text>
</svg>

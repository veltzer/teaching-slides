<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <!-- Order Service -->
  <rect x="40" y="40" width="160" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Order Service</text>
  <!-- Product Service -->
  <rect x="310" y="40" width="170" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="395" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Product Service</text>
  <!-- Analytics Service -->
  <rect x="590" y="40" width="180" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="680" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Analytics Service</text>
  <!-- Orders DB -->
  <rect x="40" y="160" width="160" height="55" rx="8" fill="#f0f0f0" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Orders DB</text>
  <text x="120" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">PostgreSQL</text>
  <!-- Products DB -->
  <rect x="310" y="160" width="170" height="55" rx="8" fill="#f0f0f0" stroke="#28a745" stroke-width="2"/>
  <text x="395" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Products DB</text>
  <text x="395" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">MongoDB</text>
  <!-- Analytics DB -->
  <rect x="590" y="160" width="180" height="55" rx="8" fill="#f0f0f0" stroke="#ffc107" stroke-width="2"/>
  <text x="680" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Analytics DB</text>
  <text x="680" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">ClickHouse</text>
  <!-- Service -> DB arrows -->
  <line x1="120" y1="85" x2="120" y2="158" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="395" y1="85" x2="395" y2="158" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="85" x2="680" y2="158" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Cross-service communication -->
  <line x1="200" y1="55" x2="308" y2="55" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="255" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">API Call</text>
  <line x1="200" y1="72" x2="588" y2="72" stroke="#999" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowdash)"/>
  <text x="400" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">Event</text>
  <!-- Note -->
  <text x="400" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Each service owns its database -- polyglot persistence</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowdash" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#999" />
    </marker>
  </defs>
  <rect x="64" y="82.2857" width="256" height="92.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="192" y="139.8857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Order Service</text>
  <rect x="496" y="82.2857" width="272" height="92.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="632" y="139.8857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Product Service</text>
  <rect x="944" y="82.2857" width="288" height="92.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1088" y="139.8857" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Analytics Service</text>
  <rect x="64" y="329.1429" width="256" height="113.1429" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="192" y="376.4571" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Orders DB</text>
  <text x="192" y="411.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">PostgreSQL</text>
  <rect x="496" y="329.1429" width="272" height="113.1429" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="632" y="376.4571" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Products DB</text>
  <text x="632" y="411.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">MongoDB</text>
  <rect x="944" y="329.1429" width="288" height="113.1429" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1088" y="376.4571" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2" font-weight="bold">Analytics DB</text>
  <text x="1088" y="411.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">ClickHouse</text>
  <line x1="192" y1="174.8571" x2="192" y2="325.0286" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="632" y1="174.8571" x2="632" y2="325.0286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1088" y1="174.8571" x2="1088" y2="325.0286" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="320" y1="113.1429" x2="492.8" y2="113.1429" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="9.6 4.8" marker-end="url(#arrow)" />
  <text x="408" y="98.7429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">API Call</text>
  <line x1="320" y1="148.1143" x2="940.8" y2="148.1143" stroke="var(--text-faint)" stroke-width="2" stroke-dasharray="9.6 4.8" marker-end="url(#arrow)" />
  <text x="640" y="189.2571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-faint)">Event</text>
  <text x="640" y="637.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--text-faint)">Each service owns its database -- polyglot persistence</text>
</svg>
<svg viewBox="0 0 850 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Command side label -->
  <rect x="20" y="10" width="380" height="370" rx="8" fill="#f8f9fa" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="210" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4a90e2">Command Side</text>
  <!-- Query side label -->
  <rect x="450" y="10" width="380" height="370" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="640" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">Query Side</text>
  <!-- Command -->
  <rect x="60" y="60" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="125" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Command</text>
  <!-- Command Handler -->
  <rect x="60" y="150" width="160" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Command Handler</text>
  <!-- Event Store -->
  <rect x="60" y="250" width="160" height="50" rx="8" fill="#f0f0f0" stroke="#666" stroke-width="2"/>
  <text x="140" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Event Store</text>
  <!-- Event Projector -->
  <rect x="310" y="250" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="390" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Event Projector</text>
  <!-- Read Model DB -->
  <rect x="560" y="250" width="160" height="50" rx="8" fill="#f0f0f0" stroke="#666" stroke-width="2"/>
  <text x="640" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Read Model DB</text>
  <!-- Query -->
  <rect x="560" y="60" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="625" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Query</text>
  <!-- Query Handler -->
  <rect x="560" y="150" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="640" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Query Handler</text>
  <!-- Arrows -->
  <line x1="125" y1="100" x2="135" y2="148" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="190" x2="140" y2="248" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="220" y1="275" x2="308" y2="275" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="264" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">Publish Events</text>
  <line x1="470" y1="275" x2="558" y2="275" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="625" y1="100" x2="635" y2="148" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="190" x2="640" y2="248" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>

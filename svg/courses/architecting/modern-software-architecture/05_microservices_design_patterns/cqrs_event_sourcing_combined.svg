<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="562.9629" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.4541 4.227" />
  <text x="321.4815" y="79.1892" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1203" font-weight="bold" fill="var(--primary-accent)">Command Side</text>
  <rect x="677.0371" y="40" width="562.9629" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.4541 4.227" />
  <text x="958.5185" y="79.1892" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1203" font-weight="bold" fill="var(--ok-accent)">Query Side</text>
  <rect x="99.2592" y="118.3784" width="192.5925" height="62.7027" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="195.5556" y="157.5676" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7264" font-weight="bold">Command</text>
  <rect x="99.2592" y="259.4595" width="237.0371" height="62.7027" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="217.7778" y="298.6486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7264">Command Handler</text>
  <rect x="99.2592" y="416.2162" width="237.0371" height="78.3784" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="217.7778" y="463.2432" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7264" font-weight="bold">Event Store</text>
  <rect x="469.6296" y="416.2162" width="237.0371" height="78.3784" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="588.1481" y="463.2432" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7264">Event Projector</text>
  <rect x="840" y="416.2162" width="237.0371" height="78.3784" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="958.5185" y="463.2432" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7264" font-weight="bold">Read Model DB</text>
  <rect x="840" y="118.3784" width="192.5925" height="62.7027" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="936.2963" y="157.5676" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7264" font-weight="bold">Query</text>
  <rect x="840" y="259.4595" width="237.0371" height="62.7027" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="958.5185" y="298.6486" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7264">Query Handler</text>
  <line x1="195.5556" y1="181.0811" x2="210.3704" y2="256.3244" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="217.7778" y1="322.1622" x2="217.7778" y2="413.0811" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="336.2963" y1="455.4054" x2="466.6668" y2="455.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="401.4814" y="444.4324" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.9386" fill="var(--text-muted)">Publish Events</text>
  <line x1="706.6667" y1="455.4054" x2="837.037" y2="455.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="936.2963" y1="181.0811" x2="951.1111" y2="256.3244" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="958.5185" y1="322.1622" x2="958.5185" y2="413.0811" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="86.4" width="213.6986" height="92.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="144.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" font-weight="bold">Web App</text>
  <rect x="40" y="272" width="213.6986" height="92.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" font-weight="bold">Mobile App</text>
  <rect x="40" y="457.6" width="213.6986" height="92.8" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="515.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" font-weight="bold">Third Party</text>
  <rect x="467.3973" y="132.8" width="295.8904" height="417.6" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.3425" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4589" font-weight="bold" fill="var(--primary-accent)">API</text>
  <text x="615.3425" y="353.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4589" font-weight="bold" fill="var(--primary-accent)">Gateway</text>
  <rect x="976.9863" y="40" width="263.0137" height="92.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.4932" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942">User Service</text>
  <rect x="976.9863" y="202.4" width="263.0137" height="92.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.4932" y="260.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942">Order Service</text>
  <rect x="976.9863" y="364.8" width="263.0137" height="92.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.4932" y="422.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942">Product Service</text>
  <rect x="976.9863" y="527.2" width="263.0137" height="92.8" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.4932" y="585.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942">Payment Service</text>
  <line x1="253.6986" y1="132.8" x2="464.1096" y2="272" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="253.6986" y1="318.4" x2="464.1096" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="253.6986" y1="504" x2="464.1096" y2="399.6" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="763.2877" y1="260.4" x2="973.6986" y2="86.4" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="763.2877" y1="306.8" x2="973.6986" y2="248.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="763.2877" y1="353.2" x2="973.6986" y2="411.2" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="763.2877" y1="399.6" x2="973.6986" y2="573.6" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
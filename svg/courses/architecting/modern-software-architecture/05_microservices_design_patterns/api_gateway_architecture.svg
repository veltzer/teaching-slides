<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Clients -->
  <rect x="30" y="40" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="95" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Web App</text>
  <rect x="30" y="120" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="95" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Mobile App</text>
  <rect x="30" y="200" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="95" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Third Party</text>
  <!-- API Gateway -->
  <rect x="290" y="60" width="180" height="180" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3"/>
  <text x="380" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a90e2">API</text>
  <text x="380" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a90e2">Gateway</text>
  <!-- Services -->
  <rect x="600" y="20" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="680" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">User Service</text>
  <rect x="600" y="90" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="680" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Order Service</text>
  <rect x="600" y="160" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="680" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Product Service</text>
  <rect x="600" y="230" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="680" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Payment Service</text>
  <!-- Arrows: Clients -> Gateway -->
  <line x1="160" y1="60" x2="288" y2="120" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="160" y1="140" x2="288" y2="145" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="160" y1="220" x2="288" y2="175" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Arrows: Gateway -> Services -->
  <line x1="470" y1="115" x2="598" y2="40" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="135" x2="598" y2="110" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="155" x2="598" y2="180" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="175" x2="598" y2="250" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="86.4" width="213.6986" height="92.8" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="144.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" font-weight="bold" fill="var(--warn-text)">Web App</text>
  <rect x="40" y="272" width="213.6986" height="92.8" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" font-weight="bold" fill="var(--warn-text)">Mobile App</text>
  <rect x="40" y="457.6" width="213.6986" height="92.8" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="146.8493" y="515.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" font-weight="bold" fill="var(--warn-text)">Third Party</text>
  <rect x="467.3973" y="132.8" width="295.8904" height="417.6" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="615.3425" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4589" font-weight="bold" fill="var(--primary-accent)">API</text>
  <text x="615.3425" y="353.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="29.4589" font-weight="bold" fill="var(--primary-accent)">Gateway</text>
  <rect x="976.9863" y="40" width="263.0137" height="92.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.4932" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" fill="var(--ok-text)">User Service</text>
  <rect x="976.9863" y="202.4" width="263.0137" height="92.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.4932" y="260.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" fill="var(--ok-text)">Order Service</text>
  <rect x="976.9863" y="364.8" width="263.0137" height="92.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.4932" y="422.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" fill="var(--ok-text)">Product Service</text>
  <rect x="976.9863" y="527.2" width="263.0137" height="92.8" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1108.4932" y="585.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0942" fill="var(--ok-text)">Payment Service</text>
  <line x1="253.6986" y1="132.8" x2="464.1096" y2="272" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="253.6986" y1="318.4" x2="464.1096" y2="330" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="253.6986" y1="504" x2="464.1096" y2="399.6" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="763.2877" y1="260.4" x2="973.6986" y2="86.4" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="763.2877" y1="306.8" x2="973.6986" y2="248.8" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="763.2877" y1="353.2" x2="973.6986" y2="411.2" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="763.2877" y1="399.6" x2="973.6986" y2="573.6" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

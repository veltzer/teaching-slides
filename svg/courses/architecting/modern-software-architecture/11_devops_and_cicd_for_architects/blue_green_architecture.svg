<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="437.2636" y="37.6471" width="281.098" height="94.1176" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="577.8126" y="79.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" font-weight="bold">Load Balancer /</text>
  <text x="577.8126" y="109.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399" font-weight="bold">Router</text>
  <rect x="124.9324" y="244.7059" width="343.5643" height="112.9412" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="296.7146" y="291.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3016" font-weight="bold" fill="var(--primary-accent)">Blue Environment</text>
  <text x="296.7146" y="329.4118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399">v1.0 (Current)</text>
  <rect x="687.1285" y="244.7059" width="343.5643" height="112.9412" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="858.9107" y="291.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3016" font-weight="bold" fill="var(--ok-accent)">Green Environment</text>
  <text x="858.9107" y="329.4118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399">v1.1 (New)</text>
  <rect x="437.2636" y="489.4117" width="281.098" height="94.1176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="577.8126" y="545.8823" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.7399">Shared Database</text>
  <line x1="515.3464" y1="131.7647" x2="327.9477" y2="240.9412" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="374.7974" y="178.8235" font-family="Arial, sans-serif" font-size="17.1782" fill="var(--primary-accent)" font-weight="bold">100% Traffic</text>
  <line x1="655.8954" y1="131.7647" x2="827.6775" y2="240.9412" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.8082" marker-end="url(#arrow)" />
  <text x="796.4444" y="178.8235" font-family="Arial, sans-serif" font-size="17.1782" fill="var(--ok-accent)">Switch</text>
  <line x1="296.7146" y1="357.647" x2="499.7298" y2="485.6471" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="858.9107" y1="357.647" x2="655.8954" y2="485.6471" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="577.8126" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.1782" fill="var(--text-muted)">Instant rollback by switching traffic back to Blue</text>
</svg>
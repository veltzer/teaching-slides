<svg viewBox="0 0 750 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Load Balancer -->
  <rect x="280" y="20" width="180" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="370" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Load Balancer /</text>
  <text x="370" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Router</text>
  <!-- Blue Environment -->
  <rect x="80" y="130" width="220" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="190" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4a90e2">Blue Environment</text>
  <text x="190" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">v1.0 (Current)</text>
  <!-- Green Environment -->
  <rect x="440" y="130" width="220" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="550" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745">Green Environment</text>
  <text x="550" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">v1.1 (New)</text>
  <!-- Database -->
  <rect x="280" y="260" width="180" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Shared Database</text>
  <!-- Active traffic -->
  <line x1="330" y1="70" x2="210" y2="128" stroke="#4a90e2" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="240" y="95" font-family="Arial, sans-serif" font-size="11" fill="#4a90e2" font-weight="bold">100% Traffic</text>
  <!-- Switch arrow (dashed) -->
  <line x1="420" y1="70" x2="530" y2="128" stroke="#28a745" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrowhead)"/>
  <text x="510" y="95" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Switch</text>
  <!-- Both connect to DB -->
  <line x1="190" y1="190" x2="320" y2="258" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="190" x2="420" y2="258" stroke="#999" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Explanation -->
  <text x="370" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Instant rollback by switching traffic back to Blue</text>
</svg>

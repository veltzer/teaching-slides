<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="453.7931" y="40" width="372.4137" height="90.625" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="79.8749" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166" font-weight="bold" fill="var(--warn-text)">Load Balancer /</text>
  <text x="640" y="108.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166" font-weight="bold" fill="var(--warn-text)">Router</text>
  <rect x="40" y="239.375" width="455.1724" height="108.75" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="267.5863" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9299" font-weight="bold" fill="var(--primary-accent)">Blue Environment</text>
  <text x="267.5863" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166" fill="var(--primary-text)">v1.0 (Current)</text>
  <rect x="784.8276" y="239.375" width="455.1724" height="108.75" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1012.4139" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9299" font-weight="bold" fill="var(--ok-accent)">Green Environment</text>
  <text x="1012.4139" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166" fill="var(--ok-text)">v1.1 (New)</text>
  <rect x="453.7931" y="474.9999" width="372.4137" height="90.625" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="529.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166" fill="var(--primary-text)">Shared Database</text>
  <line x1="557.2414" y1="130.625" x2="308.9656" y2="235.75" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="371.0346" y="175.9374" font-family="Arial, sans-serif" font-size="19.4022" fill="var(--primary-accent)" font-weight="bold">100% Traffic</text>
  <line x1="743.4483" y1="130.625" x2="971.0344" y2="235.75" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.8082" marker-end="url(#arrow)"/>
  <text x="929.6551" y="175.9374" font-family="Arial, sans-serif" font-size="19.4022" fill="var(--ok-accent)">Switch</text>
  <line x1="267.5863" y1="348.1249" x2="536.5517" y2="471.375" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1012.4139" y1="348.1249" x2="743.4483" y2="471.375" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4022" fill="var(--text-muted)">Instant rollback by switching traffic back to Blue</text>
</svg>

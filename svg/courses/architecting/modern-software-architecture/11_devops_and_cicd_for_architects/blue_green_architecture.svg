<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="453.7931" y="40" width="372.4137" height="90.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="79.8749" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166" font-weight="bold">Load Balancer /</text>
  <text x="640" y="108.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166" font-weight="bold">Router</text>
  <rect x="40" y="239.375" width="455.1724" height="108.75" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="267.5863" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9299" font-weight="bold" fill="var(--primary-accent)">Blue Environment</text>
  <text x="267.5863" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166">v1.0 (Current)</text>
  <rect x="784.8276" y="239.375" width="455.1724" height="108.75" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1012.4139" y="284.6875" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.9299" font-weight="bold" fill="var(--ok-accent)">Green Environment</text>
  <text x="1012.4139" y="320.9375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166">v1.1 (New)</text>
  <rect x="453.7931" y="474.9999" width="372.4137" height="90.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="529.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.166">Shared Database</text>
  <line x1="557.2414" y1="130.625" x2="308.9656" y2="235.75" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="371.0346" y="175.9374" font-family="Arial, sans-serif" font-size="19.4022" fill="var(--primary-accent)" font-weight="bold">100% Traffic</text>
  <line x1="743.4483" y1="130.625" x2="971.0344" y2="235.75" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.8082" marker-end="url(#arrow)" />
  <text x="929.6551" y="175.9374" font-family="Arial, sans-serif" font-size="19.4022" fill="var(--ok-accent)">Switch</text>
  <line x1="267.5863" y1="348.1249" x2="536.5517" y2="471.375" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1012.4139" y1="348.1249" x2="743.4483" y2="471.375" stroke="var(--text-faint)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4022" fill="var(--text-muted)">Instant rollback by switching traffic back to Blue</text>
</svg>
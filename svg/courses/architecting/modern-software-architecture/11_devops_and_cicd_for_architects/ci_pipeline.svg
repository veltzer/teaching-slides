<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="166" height="180" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="123" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Code Push</text>
  <text x="123" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">git push / PR</text>

  <rect x="230" y="40" width="166" height="180" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="313" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--warn-text)">Lint</text>
  <text x="313" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--warn-text)">style checks</text>

  <rect x="420" y="40" width="166" height="180" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="503" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--primary-text)">Build</text>
  <text x="503" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">compile / package</text>

  <rect x="610" y="40" width="166" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="693" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Unit Tests</text>
  <text x="693" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">fast, isolated</text>

  <rect x="800" y="40" width="200" height="180" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--ok-text)">Integration</text>
  <text x="900" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--ok-text)">cross-component</text>

  <rect x="1024" y="40" width="216" height="180" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1132" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--danger-text)">Security Scan</text>
  <text x="1132" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--danger-text)">SAST / deps</text>

  <line x1="206" y1="130" x2="228" y2="130" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="396" y1="130" x2="418" y2="130" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="586" y1="130" x2="608" y2="130" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="776" y1="130" x2="798" y2="130" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>
  <line x1="1000" y1="130" x2="1022" y2="130" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="40" y="260" width="1200" height="140" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="var(--primary-text)">Publish Artifact</text>
  <text x="640" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--primary-text)">versioned image / package pushed to registry, ready for CD</text>
  <text x="640" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--primary-text)">tag = git SHA, signed, scanned, immutable</text>

  <rect x="40" y="430" width="390" height="190" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="235" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Fail fast</text>
  <text x="235" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Lint before build.</text>
  <text x="235" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Unit before integration.</text>
  <text x="235" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Cheap stages first.</text>
  <text x="235" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Stop on first failure.</text>

  <rect x="445" y="430" width="390" height="190" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Parallelize</text>
  <text x="640" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Lint, unit, scan run</text>
  <text x="640" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">concurrently when</text>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">independent.</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Target under 10 minutes.</text>

  <rect x="850" y="430" width="390" height="190" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1045" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--text)">Reproducible</text>
  <text x="1045" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Pinned deps, locked</text>
  <text x="1045" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">toolchains, hermetic</text>
  <text x="1045" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">builds.</text>
  <text x="1045" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="var(--text-muted)">Same input, same output.</text>
</svg>

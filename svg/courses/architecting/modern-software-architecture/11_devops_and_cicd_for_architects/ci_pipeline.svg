<svg viewBox="0 0 850 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Pipeline steps -->
  <rect x="15" y="70" width="100" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="65" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Code Push</text>
  <rect x="140" y="70" width="100" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="190" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Lint / Format</text>
  <rect x="265" y="70" width="100" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="315" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Build</text>
  <rect x="390" y="70" width="100" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="440" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Unit Tests</text>
  <rect x="515" y="70" width="110" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="570" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Integration Tests</text>
  <rect x="650" y="70" width="100" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="700" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Security Scan</text>
  <rect x="775" y="70" width="60" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="805" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Publish</text>
  <text x="805" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Artifact</text>
  <!-- Arrows -->
  <line x1="115" y1="92" x2="138" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="240" y1="92" x2="263" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="365" y1="92" x2="388" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="92" x2="513" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="625" y1="92" x2="648" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="750" y1="92" x2="773" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- CI label -->
  <text x="425" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4a90e2" font-weight="bold">CI Pipeline</text>
  <line x1="15" y1="55" x2="835" y2="55" stroke="#4a90e2" stroke-width="1" stroke-dasharray="4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,36 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="295.0152" width="146.3414" height="157.4314" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="113.1708" y="389.4741" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0976">Code Push</text>
  <rect x="222.9268" y="295.0152" width="146.3414" height="157.4314" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="296.0975" y="389.4741" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0976">Lint / Format</text>
  <rect x="405.8536" y="295.0152" width="146.3414" height="157.4314" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="479.0244" y="389.4741" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0976">Build</text>
  <rect x="588.7805" y="295.0152" width="146.3414" height="157.4314" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="661.9512" y="389.4741" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0976">Unit Tests</text>
  <rect x="771.7073" y="295.0152" width="160.9756" height="157.4314" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="852.1951" y="389.4741" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0976">Integration Tests</text>
  <rect x="969.2682" y="295.0152" width="146.3414" height="157.4314" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1042.439" y="389.4741" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0976">Security Scan</text>
  <rect x="1152.1951" y="295.0152" width="87.8048" height="157.4314" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1196.0975" y="364.9848" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6341">Publish</text>
  <text x="1196.0975" y="413.9634" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6341">Artifact</text>
  <line x1="186.3415" y1="371.9817" x2="220.0001" y2="371.9817" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="369.2683" y1="371.9817" x2="402.9269" y2="371.9817" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="552.1952" y1="371.9817" x2="585.8537" y2="371.9817" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="735.122" y1="371.9817" x2="768.7804" y2="371.9817" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="932.6829" y1="371.9817" x2="966.3415" y2="371.9817" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1115.6098" y1="371.9817" x2="1149.2683" y2="371.9817" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="207.5534" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4878" fill="var(--primary-accent)" font-weight="bold">CI Pipeline</text>
  <line x1="40" y1="242.5381" x2="1240" y2="242.5381" stroke="var(--primary-border)" stroke-width="1.5059" stroke-dasharray="6.0235" />
</svg>
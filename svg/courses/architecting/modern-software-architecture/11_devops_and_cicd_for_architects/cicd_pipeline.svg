<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="30" y="14" width="1220" height="46" rx="8" fill="url(#grad-accent)"/>
  <text x="640" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">CI/CD Pipeline — Code to Production</text>
  <!-- Pipeline stage boxes, y=85, each 160 wide, gap 12 -->
  <!-- Stage 1: Code -->
  <rect x="30" y="85" width="160" height="200" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="85" width="160" height="40" rx="8" fill="#1565c0"/>
  <rect x="30" y="113" width="160" height="12" fill="#1565c0"/>
  <text x="110" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">1. Code</text>
  <text x="110" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">git push</text>
  <text x="110" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Pull Request</text>
  <text x="110" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Code Review</text>
  <text x="110" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Branch policy</text>
  <rect x="45" y="240" width="130" height="30" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="110" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">GitHub / GitLab</text>
  <!-- Arrow -->
  <line x1="190" y1="185" x2="202" y2="185" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Stage 2: Build -->
  <rect x="202" y="85" width="160" height="200" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="202" y="85" width="160" height="40" rx="8" fill="#1565c0"/>
  <rect x="202" y="113" width="160" height="12" fill="#1565c0"/>
  <text x="282" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">2. Build</text>
  <text x="282" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Compile</text>
  <text x="282" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Docker image build</text>
  <text x="282" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Artifact creation</text>
  <text x="282" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Versioning</text>
  <rect x="217" y="240" width="130" height="30" rx="4" fill="#ffffff" stroke="#1565c0" stroke-width="1"/>
  <text x="282" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">GitHub Actions / Jenkins</text>
  <!-- Gate 1 -->
  <polygon points="363,175 376,162 389,175 376,188" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5"/>
  <text x="376" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">GATE</text>
  <!-- Stage 3: Test -->
  <rect x="390" y="85" width="160" height="200" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="390" y="85" width="160" height="40" rx="8" fill="#2e7d32"/>
  <rect x="390" y="113" width="160" height="12" fill="#2e7d32"/>
  <text x="470" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">3. Test</text>
  <text x="470" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Unit tests</text>
  <text x="470" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Integration tests</text>
  <text x="470" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Coverage gate</text>
  <text x="470" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Contract tests</text>
  <rect x="405" y="240" width="130" height="30" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="470" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">JUnit / Pytest / Jest</text>
  <!-- Gate 2 -->
  <polygon points="550,175 563,162 576,175 563,188" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5"/>
  <text x="563" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">GATE</text>
  <!-- Stage 4: Security Scan -->
  <rect x="577" y="85" width="160" height="200" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>
  <rect x="577" y="85" width="160" height="40" rx="8" fill="#e65100"/>
  <rect x="577" y="113" width="160" height="12" fill="#e65100"/>
  <text x="657" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4. Security</text>
  <text x="657" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">SAST analysis</text>
  <text x="657" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Dependency scan</text>
  <text x="657" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Container scan</text>
  <text x="657" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Secret detection</text>
  <rect x="592" y="240" width="130" height="30" rx="4" fill="#ffffff" stroke="#e65100" stroke-width="1"/>
  <text x="657" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Snyk / Trivy / SonarQube</text>
  <!-- Gate 3 -->
  <polygon points="737,175 750,162 763,175 750,188" fill="#2e7d32" stroke="#ffffff" stroke-width="1.5"/>
  <text x="750" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">GATE</text>
  <!-- Stage 5: Staging -->
  <rect x="764" y="85" width="160" height="200" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="764" y="85" width="160" height="40" rx="8" fill="#6a1b9a"/>
  <rect x="764" y="113" width="160" height="12" fill="#6a1b9a"/>
  <text x="844" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">5. Staging</text>
  <text x="844" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Deploy to staging</text>
  <text x="844" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">E2E / smoke tests</text>
  <text x="844" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Perf regression</text>
  <text x="844" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Manual approval?</text>
  <rect x="779" y="240" width="130" height="30" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="1"/>
  <text x="844" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Kubernetes / ECS</text>
  <!-- Gate 4 (approval) -->
  <polygon points="924,175 937,162 950,175 937,188" fill="#f9a825" stroke="#ffffff" stroke-width="1.5"/>
  <text x="937" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#f57f17">APPROVE</text>
  <!-- Stage 6: Production -->
  <rect x="952" y="85" width="160" height="200" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="952" y="85" width="160" height="40" rx="8" fill="#2e7d32"/>
  <rect x="952" y="113" width="160" height="12" fill="#2e7d32"/>
  <text x="1032" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">6. Production</text>
  <text x="1032" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Blue/Green deploy</text>
  <text x="1032" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Canary rollout</text>
  <text x="1032" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Feature flags</text>
  <text x="1032" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Auto rollback</text>
  <rect x="967" y="240" width="130" height="30" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="1032" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">k8s / Spinnaker / ArgoCD</text>
  <!-- Feedback arrow bottom -->
  <path d="M1032,285 Q1032,330 640,340 Q250,350 110,285" fill="none" stroke="#555555" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <text x="640" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">Feedback loop — metrics, alerts, logs flow back to developers</text>
  <!-- Monitoring box at right -->
  <rect x="1140" y="85" width="110" height="200" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2" filter="url(#shadow)"/>
  <text x="1195" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#c62828">Monitor</text>
  <text x="1195" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#212121">Prometheus</text>
  <text x="1195" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#212121">Grafana</text>
  <text x="1195" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#212121">PagerDuty</text>
  <text x="1195" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#212121">Alerts</text>
  <line x1="1112" y1="185" x2="1138" y2="185" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- CI vs CD labels -->
  <rect x="30" y="390" width="530" height="40" rx="6" fill="#e3f2fd"/>
  <text x="295" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Continuous Integration (CI): Stages 1–4</text>
  <rect x="577" y="390" width="660" height="40" rx="6" fill="#e8f5e9"/>
  <text x="907" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2e7d32">Continuous Delivery / Deployment (CD): Stages 5–6</text>
  <!-- Principles -->
  <rect x="30" y="448" width="1220" height="170" rx="8" fill="#f2f2f2"/>
  <text x="640" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#212121">Architectural Implications</text>
  <rect x="50" y="482" width="360" height="120" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="230" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Design for Deployability</text>
  <text x="70" y="526" font-family="Arial,sans-serif" font-size="12" fill="#212121">Services must be independently deployable</text>
  <text x="70" y="546" font-family="Arial,sans-serif" font-size="12" fill="#212121">Feature flags decouple deploy from release</text>
  <text x="70" y="566" font-family="Arial,sans-serif" font-size="12" fill="#212121">Database migrations must be backward compat</text>
  <rect x="460" y="482" width="360" height="120" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="640" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">Test Strategy</text>
  <text x="480" y="526" font-family="Arial,sans-serif" font-size="12" fill="#212121">Fast unit tests → slow E2E tests pyramid</text>
  <text x="480" y="546" font-family="Arial,sans-serif" font-size="12" fill="#212121">Contract tests prevent integration drift</text>
  <text x="480" y="566" font-family="Arial,sans-serif" font-size="12" fill="#212121">Chaos engineering in staging</text>
  <rect x="870" y="482" width="360" height="120" rx="6" fill="#ffffff" stroke="#e65100" stroke-width="1.5"/>
  <text x="1050" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e65100">Security (DevSecOps)</text>
  <text x="890" y="526" font-family="Arial,sans-serif" font-size="12" fill="#212121">Shift-left security scanning</text>
  <text x="890" y="546" font-family="Arial,sans-serif" font-size="12" fill="#212121">SBOM — Software Bill of Materials</text>
  <text x="890" y="566" font-family="Arial,sans-serif" font-size="12" fill="#212121">Signed images &amp; supply chain integrity</text>
</svg>

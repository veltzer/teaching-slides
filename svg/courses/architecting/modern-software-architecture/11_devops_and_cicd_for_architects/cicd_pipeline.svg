<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.209610966678" font-weight="bold" fill="var(--text)">CI/CD Pipeline</text>

  <rect x="40" y="75.614035087719" width="190" height="172.982456140351" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="108.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--primary-text)">1. Code</text>
  <text x="135" y="141.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">git push</text>
  <text x="135" y="167.19298245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">Pull Request</text>
  <text x="135" y="192.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">Review</text>
  <text x="135" y="228.245614035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-style="italic" fill="var(--primary-text)">GitHub / GitLab</text>

  <rect x="245" y="75.614035087719" width="190" height="172.982456140351" rx="8.069870322226" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="108.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--primary-text)">2. Build</text>
  <text x="340" y="141.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">Compile</text>
  <text x="340" y="167.19298245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">Docker image</text>
  <text x="340" y="192.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--primary-text)">Artifact</text>
  <text x="340" y="228.245614035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-style="italic" fill="var(--primary-text)">Actions / Jenkins</text>

  <rect x="450" y="75.614035087719" width="190" height="172.982456140351" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="545" y="108.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--ok-text)">3. Test</text>
  <text x="545" y="141.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Unit + integ</text>
  <text x="545" y="167.19298245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Coverage gate</text>
  <text x="545" y="192.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Contract tests</text>
  <text x="545" y="228.245614035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-style="italic" fill="var(--ok-text)">JUnit / Pytest</text>

  <rect x="655" y="75.614035087719" width="190" height="172.982456140351" rx="8.069870322226" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="108.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--warn-text)">4. Security</text>
  <text x="750" y="141.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--warn-text)">SAST</text>
  <text x="750" y="167.19298245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--warn-text)">Deps + images</text>
  <text x="750" y="192.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--warn-text)">Secrets scan</text>
  <text x="750" y="228.245614035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-style="italic" fill="var(--warn-text)">Snyk / Trivy</text>

  <rect x="860" y="75.614035087719" width="190" height="172.982456140351" rx="8.069870322226" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="955" y="108.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--info-text)">5. Staging</text>
  <text x="955" y="141.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--info-text)">Deploy staging</text>
  <text x="955" y="167.19298245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--info-text)">E2E tests</text>
  <text x="955" y="192.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--info-text)">Approval</text>
  <text x="955" y="228.245614035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-style="italic" fill="var(--info-text)">K8s / ECS</text>

  <rect x="1065" y="75.614035087719" width="175" height="172.982456140351" rx="8.069870322226" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1152" y="108.175438596491" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--ok-text)">6. Prod</text>
  <text x="1152" y="141.754385964912" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Blue/Green</text>
  <text x="1152" y="167.19298245614" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Canary</text>
  <text x="1152" y="192.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" fill="var(--ok-text)">Auto rollback</text>
  <text x="1152" y="228.245614035088" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.104805483339" font-style="italic" fill="var(--ok-text)">ArgoCD</text>

  <path d="M 1152 253.684210526316 Q 1152 309.649122807018 640 330 Q 150 350.350877192982 140 258.771929824561" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="640" y="319.824561403509" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.122273063895" font-style="italic" fill="var(--text-muted)">Feedback: metrics, alerts, logs</text>

  <rect x="40" y="370.701754385965" width="580" height="35.614035087719" rx="6.052402741669" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="394.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--primary-text)">CI: stages 1-4</text>

  <rect x="640" y="370.701754385965" width="600" height="35.614035087719" rx="6.052402741669" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="940" y="394.105263157895" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--ok-text)">CD: stages 5-6</text>

  <text x="640" y="441.929824561404" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.157208225008" font-weight="bold" fill="var(--text)">Architectural Implications</text>

  <rect x="40" y="457.19298245614" width="390" height="162.80701754386" rx="8.069870322226" fill="var(--surface)" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="235" y="482.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--primary-accent)">Deployability</text>
  <text x="60" y="513.157894736842" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">Independent deploys</text>
  <text x="60" y="538.59649122807" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">Feature flags</text>
  <text x="60" y="564.035087719298" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">Back-compat DB</text>

  <rect x="445" y="457.19298245614" width="390" height="162.80701754386" rx="8.069870322226" fill="var(--surface)" stroke="var(--ok-border)" stroke-width="1"/>
  <text x="640" y="482.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--ok-accent)">Test Strategy</text>
  <text x="465" y="513.157894736842" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">Pyramid</text>
  <text x="465" y="538.59649122807" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">Contract tests</text>
  <text x="465" y="564.035087719298" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">Chaos in staging</text>

  <rect x="850" y="457.19298245614" width="390" height="162.80701754386" rx="8.069870322226" fill="var(--surface)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="1045" y="482.631578947368" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.131006854174" font-weight="bold" fill="var(--warn-accent)">DevSecOps</text>
  <text x="870" y="513.157894736842" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">Shift-left scans</text>
  <text x="870" y="538.59649122807" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">SBOM</text>
  <text x="870" y="564.035087719298" font-family="Arial, sans-serif" font-size="13.113539273617" fill="var(--text)">Signed images</text>
</svg>

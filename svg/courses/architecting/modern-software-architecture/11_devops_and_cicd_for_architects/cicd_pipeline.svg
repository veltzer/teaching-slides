  <text x="402.3085" y="335.2277" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Contract tests prevent integration drift</text>
  <text x="402.3085" y="343.8397" font-family="Arial,sans-serif" font-size="10" fill="var(--text)">Chaos engineering in staging</text>

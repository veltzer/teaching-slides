  <ns0:text x="142.6357" y="312.5581" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1565c0">Design for Deployability</ns0:text>
  <ns0:text x="43.4109" y="326.2016" font-family="Arial,sans-serif" font-size="10" fill="#212121">Services must be independently deployable</ns0:text>
  <ns0:text x="43.4109" y="338.6047" font-family="Arial,sans-serif" font-size="10" fill="#212121">Feature flags decouple deploy from release</ns0:text>
  <ns0:text x="43.4109" y="351.0078" font-family="Arial,sans-serif" font-size="10" fill="#212121">Database migrations must be backward compat</ns0:text>
  <ns0:rect x="285.2713" y="298.9147" width="223.2558" height="74.4186" rx="3.7209" fill="#ffffff" stroke="#2e7d32" stroke-width="0.9302" />
  <ns0:text x="396.8992" y="312.5581" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">Test Strategy</ns0:text>
  <ns0:text x="297.6744" y="326.2016" font-family="Arial,sans-serif" font-size="10" fill="#212121">Fast unit tests → slow E2E tests pyramid</ns0:text>
  <ns0:text x="297.6744" y="338.6047" font-family="Arial,sans-serif" font-size="10" fill="#212121">Contract tests prevent integration drift</ns0:text>
  <ns0:text x="297.6744" y="351.0078" font-family="Arial,sans-serif" font-size="10" fill="#212121">Chaos engineering in staging</ns0:text>

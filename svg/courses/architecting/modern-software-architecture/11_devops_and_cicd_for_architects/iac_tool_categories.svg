  <rect x="15" y="300" width="150" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="90" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">CloudFormation</text>
  <!-- Tools under Configuration -->

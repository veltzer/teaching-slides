  <line x1="644.0816" y1="122.8572" x2="652.2449" y2="220.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="750.2041" y1="122.8572" x2="1060.4082" y2="220.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />

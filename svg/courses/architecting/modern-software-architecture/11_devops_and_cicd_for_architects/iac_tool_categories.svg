<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="456.3265" y="40" width="375.5102" height="82.8572" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="644.0816" y="91.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0104" font-weight="bold" fill="var(--primary-text)">Infrastructure as Code</text>
  <rect x="80.8163" y="224.127" width="261.2245" height="73.6508" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="211.4286" y="270.1588" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4383" font-weight="bold" fill="var(--ok-text)">Provisioning</text>
  <rect x="521.6327" y="224.127" width="261.2245" height="73.6508" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="652.2449" y="270.1588" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4383" font-weight="bold" fill="var(--warn-text)">Configuration</text>
  <rect x="962.449" y="224.127" width="261.2245" height="73.6508" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1093.0613" y="270.1588" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.4383" font-weight="bold" fill="var(--primary-text)">Orchestration</text>
  <rect x="40" y="371.4286" width="244.898" height="64.4445" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="162.4489" y="411.9365" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2939" fill="var(--ok-text)">Terraform / OpenTofu</text>
  <rect x="40" y="463.492" width="244.898" height="64.4445" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="162.4489" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2939" fill="var(--ok-text)">Pulumi</text>
  <rect x="40" y="555.5555" width="244.898" height="64.4445" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="162.4489" y="596.0635" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2939" fill="var(--ok-text)">CloudFormation</text>
  <rect x="513.4694" y="371.4286" width="244.898" height="64.4445" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.9184" y="411.9365" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2939" fill="var(--warn-text)">Ansible</text>
  <rect x="513.4694" y="463.492" width="244.898" height="64.4445" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="635.9184" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2939" fill="var(--warn-text)">Chef / Puppet</text>
  <rect x="962.449" y="371.4286" width="277.551" height="64.4445" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1101.2246" y="411.9365" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2939" fill="var(--primary-text)">Kubernetes Manifests</text>
  <rect x="962.449" y="463.492" width="277.551" height="64.4445" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1101.2246" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2939" fill="var(--primary-text)">Helm Charts</text>

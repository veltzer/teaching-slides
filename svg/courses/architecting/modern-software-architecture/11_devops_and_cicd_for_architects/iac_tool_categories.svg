  <line x1="120" y1="160" x2="95" y2="248" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="120" y1="160" x2="95" y2="298" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="160" x2="385" y2="198" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="580" y="250" width="170" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="665" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Helm Charts</text>
  <!-- Arrows from root to categories -->

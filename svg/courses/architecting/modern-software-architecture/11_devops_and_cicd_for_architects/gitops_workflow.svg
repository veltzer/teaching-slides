<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Developer -->
  <rect x="30" y="100" width="120" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Developer</text>
  <!-- Git Repository -->
  <rect x="230" y="100" width="150" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="305" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Git Repository</text>
  <!-- GitOps Agent -->
  <rect x="470" y="100" width="130" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="535" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">GitOps Agent</text>
  <!-- Kubernetes -->
  <rect x="680" y="100" width="100" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="730" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Kubernetes</text>
  <text x="730" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Cluster</text>
  <!-- Arrows -->
  <line x1="150" y1="122" x2="228" y2="122" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="189" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">PR</text>
  <line x1="380" y1="115" x2="468" y2="115" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="424" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Webhook</text>
  <line x1="600" y1="115" x2="678" y2="115" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="639" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Reconcile</text>
  <!-- Feedback loops -->
  <path d="M 730,145 L 730,200 L 535,200 L 535,147" fill="none" stroke="#28a745" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <text x="632" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Status</text>
  <path d="M 470,135 L 470,180 L 305,180 L 305,147" fill="none" stroke="#28a745" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <text x="387" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Sync Status</text>
  <!-- Label -->
  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Git is the single source of truth for desired cluster state</text>
</svg>

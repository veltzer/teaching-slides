<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="26.3014" y="140.9002" width="105.2055" height="63.4051" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="78.9041" y="178.9432" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5205" font-weight="bold">Developer</text>
  <rect x="201.6438" y="140.9002" width="131.5068" height="63.4051" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="267.3973" y="178.9432" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5205" font-weight="bold">Git Repository</text>
  <rect x="412.0548" y="140.9002" width="113.9726" height="63.4051" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="469.0411" y="178.9432" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5205" font-weight="bold">GitOps Agent</text>
  <rect x="596.1644" y="140.9002" width="87.6712" height="63.4051" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="169.0802" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Kubernetes</text>
  <text x="640" y="190.2153" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Cluster</text>
  <line x1="131.5068" y1="171.8982" x2="199.8904" y2="171.8982" stroke="var(--primary-border)" stroke-width="1.7534" marker-end="url(#arrow)" />
  <text x="165.6986" y="162.0352" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">PR</text>
  <line x1="333.1507" y1="162.0352" x2="410.3014" y2="162.0352" stroke="var(--primary-border)" stroke-width="1.7534" marker-end="url(#arrow)" />
  <text x="371.726" y="152.1722" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Webhook</text>
  <line x1="526.0274" y1="162.0352" x2="594.411" y2="162.0352" stroke="var(--primary-border)" stroke-width="1.7534" marker-end="url(#arrow)" />
  <text x="560.2192" y="152.1722" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Reconcile</text>
  <path d="M 640 204.3053 L 640 281.8004 L 469.0411 281.8004 L 469.0411 207.1233" fill="none" stroke="var(--ok-border)" stroke-width="1.3151" stroke-dasharray="3.5068" marker-end="url(#arrow)" />
  <text x="554.0822" y="302.9354" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Status</text>
  <path d="M 412.0548 190.2153 L 412.0548 253.6203 L 267.3973 253.6203 L 267.3973 207.1233" fill="none" stroke="var(--ok-border)" stroke-width="1.3151" stroke-dasharray="3.5068" marker-end="url(#arrow)" />
  <text x="339.2877" y="274.7554" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Sync Status</text>
  <text x="350.6849" y="366.3405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Git is the single source of truth for desired cluster state</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="192" height="163.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="135.9999" y="137.8748" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7963" font-weight="bold">Developer</text>
  <rect x="360" y="40" width="239.9999" height="163.125" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="480" y="137.8748" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7963" font-weight="bold">Git Repository</text>
  <rect x="744" y="40" width="208" height="163.125" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="848" y="137.8748" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7963" font-weight="bold">GitOps Agent</text>
  <rect x="1080" y="40" width="160" height="163.125" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1160.0001" y="112.4998" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" font-weight="bold">Kubernetes</text>
  <text x="1160.0001" y="166.8752" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682">Cluster</text>
  <line x1="232" y1="119.7499" x2="356.8001" y2="119.7499" stroke="var(--primary-border)" stroke-width="0.5671" marker-end="url(#arrow)" />
  <text x="294.3999" y="94.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--text-muted)">PR</text>
  <line x1="600.0001" y1="94.3749" x2="740.8" y2="94.3749" stroke="var(--primary-border)" stroke-width="0.5671" marker-end="url(#arrow)" />
  <text x="670.4" y="68.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--text-muted)">Webhook</text>
  <line x1="952.0001" y1="94.3749" x2="1076.8002" y2="94.3749" stroke="var(--primary-border)" stroke-width="0.5671" marker-end="url(#arrow)" />
  <text x="1014.4001" y="68.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--text-muted)">Reconcile</text>
  <path d="M 1160.0001 203.125 L 1160.0001 402.5001 L 848 402.5001 L 848 210.3751" fill="none" stroke="var(--ok-border)" stroke-width="0.4253" stroke-dasharray="1.1343" marker-end="url(#arrow)" />
  <text x="1003.2002" y="456.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--ok-accent)">Status</text>
  <path d="M 744 166.8752 L 744 330 L 480 330 L 480 210.3751" fill="none" stroke="var(--ok-border)" stroke-width="0.4253" stroke-dasharray="1.1343" marker-end="url(#arrow)" />
  <text x="611.2" y="384.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--ok-accent)">Sync Status</text>
  <text x="632.0001" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3682" fill="var(--text-muted)">Git is the single source of truth for desired cluster state</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="80" y="138" width="179.2" height="108" rx="10.22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="169.5999" y="202.7999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9199" font-weight="bold">Developer</text>
  <rect x="378.6666" y="138" width="223.9999" height="108" rx="10.22" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="490.6667" y="202.7999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9199" font-weight="bold">Git Repository</text>
  <rect x="737.0667" y="138" width="194.1333" height="108" rx="10.22" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="834.1333" y="202.7999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9199" font-weight="bold">GitOps Agent</text>
  <rect x="1050.6667" y="138" width="149.3333" height="108" rx="10.22" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1125.3334" y="185.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0333" font-weight="bold">Kubernetes</text>
  <text x="1125.3334" y="222.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0333">Cluster</text>
  <line x1="259.1999" y1="190.7999" x2="375.68" y2="190.7999" stroke="var(--primary-border)" stroke-width="1.7534" marker-end="url(#arrow)" />
  <text x="317.4399" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0333" fill="var(--text-muted)">PR</text>
  <line x1="602.6667" y1="174" x2="734.08" y2="174" stroke="var(--primary-border)" stroke-width="1.7534" marker-end="url(#arrow)" />
  <text x="668.3733" y="157.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0333" fill="var(--text-muted)">Webhook</text>
  <line x1="931.2" y1="174" x2="1047.6801" y2="174" stroke="var(--primary-border)" stroke-width="1.7534" marker-end="url(#arrow)" />
  <text x="989.4401" y="157.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0333" fill="var(--text-muted)">Reconcile</text>
  <path d="M 1125.3334 246 L 1125.3334 378 L 834.1333 378 L 834.1333 250.8" fill="none" stroke="var(--ok-border)" stroke-width="1.3151" stroke-dasharray="3.5068" marker-end="url(#arrow)" />
  <text x="978.9867" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0333" fill="var(--ok-accent)">Status</text>
  <path d="M 737.0667 222.0001 L 737.0667 329.9999 L 490.6667 329.9999 L 490.6667 250.8" fill="none" stroke="var(--ok-border)" stroke-width="1.3151" stroke-dasharray="3.5068" marker-end="url(#arrow)" />
  <text x="613.12" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0333" fill="var(--ok-accent)">Sync Status</text>
  <text x="632.5333" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0333" fill="var(--text-muted)">Git is the single source of truth for desired cluster state</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="45.4976" y="78.4834" width="101.9147" height="61.4218" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.1374" />
  <text x="96.4549" y="115.3364" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1914" font-weight="bold">Developer</text>
  <rect x="215.3554" y="78.4834" width="127.3933" height="61.4218" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1374" />
  <text x="279.0521" y="115.3364" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1914" font-weight="bold">Git Repository</text>
  <rect x="419.1848" y="78.4834" width="110.4076" height="61.4218" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.1374" />
  <text x="474.3886" y="115.3364" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.1914" font-weight="bold">GitOps Agent</text>
  <rect x="597.5355" y="78.4834" width="84.9289" height="61.4218" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.1374" />
  <text x="640" y="105.7819" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">Kubernetes</text>
  <text x="640" y="126.256" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Cluster</text>
  <line x1="147.4123" y1="108.5118" x2="213.6569" y2="108.5118" stroke="var(--primary-border)" stroke-width="0.5671" marker-end="url(#arrow)" />
  <text x="180.5345" y="98.9573" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">PR</text>
  <line x1="342.7488" y1="98.9573" x2="417.4862" y2="98.9573" stroke="var(--primary-border)" stroke-width="0.5671" marker-end="url(#arrow)" />
  <text x="380.1175" y="89.4028" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Webhook</text>
  <line x1="529.5924" y1="98.9573" x2="595.837" y2="98.9573" stroke="var(--primary-border)" stroke-width="0.5671" marker-end="url(#arrow)" />
  <text x="562.7147" y="89.4028" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Reconcile</text>
  <path d="M 640 139.9052 L 640 214.9763 L 474.3886 214.9763 L 474.3886 142.6351" fill="none" stroke="var(--ok-border)" stroke-width="0.4253" stroke-dasharray="1.1343" marker-end="url(#arrow)" />
  <text x="556.7697" y="235.4502" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Status</text>
  <path d="M 419.1848 126.256 L 419.1848 187.6777 L 279.0521 187.6777 L 279.0521 142.6351" fill="none" stroke="var(--ok-border)" stroke-width="0.4253" stroke-dasharray="1.1343" marker-end="url(#arrow)" />
  <text x="348.6938" y="208.1516" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Sync Status</text>
  <text x="359.7346" y="296.872" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--text-muted)">Git is the single source of truth for desired cluster state</text>
</svg>
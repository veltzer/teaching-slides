<svg viewBox="0 0 750 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Central -->
  <rect x="260" y="20" width="220" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Deployment Strategies</text>
  <!-- Strategy boxes -->
  <rect x="30" y="120" width="130" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="95" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Recreate</text>
  <text x="95" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Downtime</text>
  <rect x="190" y="120" width="130" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="255" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Rolling Update</text>
  <text x="255" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Zero downtime</text>
  <rect x="350" y="120" width="130" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="415" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Blue/Green</text>
  <text x="415" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Instant switch</text>
  <rect x="510" y="120" width="110" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="565" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Canary</text>
  <text x="565" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Gradual rollout</text>
  <rect x="650" y="120" width="80" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="690" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">A/B</text>
  <text x="690" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Testing</text>
  <!-- Arrows -->
  <line x1="300" y1="70" x2="110" y2="118" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="330" y1="70" x2="260" y2="118" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="70" x2="415" y2="118" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="70" x2="560" y2="118" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="70" x2="685" y2="118" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="1200" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="90" text-anchor="middle" font-size="30" font-weight="bold" fill="var(--primary-text)">Deployment Strategies</text>
  <text x="640" y="130" text-anchor="middle" font-size="18" fill="var(--primary-text)">Trade downtime, risk, and cost</text>

  <line x1="640" y1="160" x2="640" y2="215" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="220" width="230" height="400" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="155" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--danger-text)">Recreate</text>
  <text x="155" y="350" text-anchor="middle" font-size="16" fill="var(--danger-text)">Stop old</text>
  <text x="155" y="380" text-anchor="middle" font-size="16" fill="var(--danger-text)">Start new</text>
  <text x="155" y="440" text-anchor="middle" font-size="16" fill="var(--danger-text)">Downtime</text>
  <text x="155" y="500" text-anchor="middle" font-size="16" fill="var(--danger-text)">Simplest</text>
  <text x="155" y="560" text-anchor="middle" font-size="16" fill="var(--danger-text)">Batch jobs</text>

  <rect x="280" y="220" width="230" height="400" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="395" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)">Rolling</text>
  <text x="395" y="350" text-anchor="middle" font-size="16" fill="var(--ok-text)">Update</text>
  <text x="395" y="380" text-anchor="middle" font-size="16" fill="var(--ok-text)">pods in waves</text>
  <text x="395" y="440" text-anchor="middle" font-size="16" fill="var(--ok-text)">Zero downtime</text>
  <text x="395" y="500" text-anchor="middle" font-size="16" fill="var(--ok-text)">Mixed versions</text>
  <text x="395" y="560" text-anchor="middle" font-size="16" fill="var(--ok-text)">K8s default</text>

  <rect x="520" y="220" width="230" height="400" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="635" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--ok-text)">Blue/Green</text>
  <text x="635" y="350" text-anchor="middle" font-size="16" fill="var(--ok-text)">Two stacks</text>
  <text x="635" y="380" text-anchor="middle" font-size="16" fill="var(--ok-text)">switch router</text>
  <text x="635" y="440" text-anchor="middle" font-size="16" fill="var(--ok-text)">Instant swap</text>
  <text x="635" y="500" text-anchor="middle" font-size="16" fill="var(--ok-text)">2x capacity</text>
  <text x="635" y="560" text-anchor="middle" font-size="16" fill="var(--ok-text)">Easy rollback</text>

  <rect x="760" y="220" width="230" height="400" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="875" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--warn-text)">Canary</text>
  <text x="875" y="350" text-anchor="middle" font-size="16" fill="var(--warn-text)">1% → 10%</text>
  <text x="875" y="380" text-anchor="middle" font-size="16" fill="var(--warn-text)">→ 50% → 100%</text>
  <text x="875" y="440" text-anchor="middle" font-size="16" fill="var(--warn-text)">Limit blast</text>
  <text x="875" y="500" text-anchor="middle" font-size="16" fill="var(--warn-text)">Watch metrics</text>
  <text x="875" y="560" text-anchor="middle" font-size="16" fill="var(--warn-text)">Auto-rollback</text>

  <rect x="1000" y="220" width="240" height="400" rx="6" fill="var(--info-fill)" stroke="var(--info-border)" stroke-width="2"/>
  <text x="1120" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="var(--info-text)">A/B Test</text>
  <text x="1120" y="350" text-anchor="middle" font-size="16" fill="var(--info-text)">Route by user</text>
  <text x="1120" y="380" text-anchor="middle" font-size="16" fill="var(--info-text)">compare KPI</text>
  <text x="1120" y="440" text-anchor="middle" font-size="16" fill="var(--info-text)">Product intent</text>
  <text x="1120" y="500" text-anchor="middle" font-size="16" fill="var(--info-text)">not infra</text>
  <text x="1120" y="560" text-anchor="middle" font-size="16" fill="var(--info-text)">Measure lift</text>
</svg>

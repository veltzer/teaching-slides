<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="434.0299" y="40" width="286.5672" height="81.5625" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="577.3133" y="90.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6568" font-weight="bold" fill="var(--warn-text)">Load Balancer</text>
  <rect x="40" y="221.2499" width="358.2089" height="90.625" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="219.1044" y="261.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0678" font-weight="bold" fill="var(--primary-text)">Stable - v1.0</text>
  <text x="219.1044" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4789" fill="var(--text-muted)">95% Traffic</text>
  <rect x="756.4179" y="221.2499" width="358.2089" height="90.625" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935.5224" y="261.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0678" font-weight="bold" fill="var(--ok-text)">Canary - v1.1</text>
  <text x="935.5224" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4789" fill="var(--text-muted)">5% Traffic</text>
  <rect x="702.6865" y="402.4999" width="286.5672" height="81.5625" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="845.9701" y="451.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0678" fill="var(--warn-text)">Monitor Metrics</text>
  <rect x="434.0299" y="547.5" width="322.3881" height="72.5" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="595.2239" y="592.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4789" fill="var(--ok-text)">Increase: 25%, 50%, 100%</text>
  <rect x="1007.1642" y="547.5" width="232.8358" height="72.5" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1123.5821" y="592.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0678" fill="var(--danger-text)">Rollback</text>
  <line x1="505.6717" y1="121.5624" x2="272.8358" y2="217.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="648.9551" y1="121.5624" x2="881.791" y2="217.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="935.5224" y1="311.875" x2="872.8358" y2="398.8749" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="774.3283" y1="484.0625" x2="631.0447" y2="543.875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)"/>
  <text x="675.8208" y="511.25" font-family="Arial, sans-serif" font-size="15.8898" fill="var(--ok-accent)">Healthy</text>
  <line x1="917.6119" y1="484.0625" x2="1087.7611" y2="543.875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)"/>
  <text x="1042.985" y="511.25" font-family="Arial, sans-serif" font-size="15.8898" fill="var(--danger-accent)">Unhealthy</text>
</svg>

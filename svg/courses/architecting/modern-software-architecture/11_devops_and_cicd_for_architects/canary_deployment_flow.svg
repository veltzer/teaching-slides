<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="434.0299" y="40" width="286.5672" height="81.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="577.3133" y="90.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.6568" font-weight="bold">Load Balancer</text>
  <rect x="40" y="221.2499" width="358.2089" height="90.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="219.1044" y="261.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0678" font-weight="bold">Stable - v1.0</text>
  <text x="219.1044" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4789" fill="var(--text-muted)">95% Traffic</text>
  <rect x="756.4179" y="221.2499" width="358.2089" height="90.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="935.5224" y="261.125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0678" font-weight="bold">Canary - v1.1</text>
  <text x="935.5224" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4789" fill="var(--text-muted)">5% Traffic</text>
  <rect x="702.6865" y="402.4999" width="286.5672" height="81.5625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="845.9701" y="451.4375" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0678">Monitor Metrics</text>
  <rect x="434.0299" y="547.5" width="322.3881" height="72.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="595.2239" y="592.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4789">Increase: 25%, 50%, 100%</text>
  <rect x="1007.1642" y="547.5" width="232.8358" height="72.5" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1123.5821" y="592.8125" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0678">Rollback</text>
  <line x1="505.6717" y1="121.5624" x2="272.8358" y2="217.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="648.9551" y1="121.5624" x2="881.791" y2="217.625" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="935.5224" y1="311.875" x2="872.8358" y2="398.8749" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="774.3283" y1="484.0625" x2="631.0447" y2="543.875" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="675.8208" y="511.25" font-family="Arial, sans-serif" font-size="15.8898" fill="var(--ok-accent)">Healthy</text>
  <line x1="917.6119" y1="484.0625" x2="1087.7611" y2="543.875" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="1042.985" y="511.25" font-family="Arial, sans-serif" font-size="15.8898" fill="var(--danger-accent)">Unhealthy</text>
</svg>
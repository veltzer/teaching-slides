<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <!-- Load Balancer -->
  <rect x="300" y="20" width="160" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="380" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Load Balancer</text>
  <!-- Stable -->
  <rect x="80" y="120" width="200" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="180" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Stable - v1.0</text>
  <text x="180" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">95% Traffic</text>
  <!-- Canary -->
  <rect x="480" y="120" width="200" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="580" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Canary - v1.1</text>
  <text x="580" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">5% Traffic</text>
  <!-- Monitor -->
  <rect x="450" y="220" width="160" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="530" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Monitor Metrics</text>
  <!-- Healthy path -->
  <rect x="300" y="300" width="180" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="390" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Increase: 25%, 50%, 100%</text>
  <!-- Unhealthy path -->
  <rect x="620" y="300" width="130" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="685" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Rollback</text>
  <!-- Arrows -->
  <line x1="340" y1="65" x2="210" y2="118" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="65" x2="550" y2="118" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="170" x2="545" y2="218" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="265" x2="410" y2="298" stroke="#28a745" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <text x="435" y="280" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Healthy</text>
  <line x1="570" y1="265" x2="665" y2="298" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="640" y="280" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">Unhealthy</text>
</svg>

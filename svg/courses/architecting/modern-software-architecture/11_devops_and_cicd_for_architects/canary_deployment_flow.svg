<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#28a745" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="439.2157" y="37.6471" width="234.2484" height="84.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="556.3398" y="90.353" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0327" font-weight="bold">Load Balancer</text>
  <rect x="117.1242" y="225.8823" width="292.8104" height="94.1176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="263.5294" y="267.2941" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5686" font-weight="bold">Stable - v1.0</text>
  <text x="263.5294" y="301.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1046" fill="var(--text-muted)">95% Traffic</text>
  <rect x="702.7451" y="225.8823" width="292.8104" height="94.1176" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="849.1503" y="267.2941" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5686" font-weight="bold">Canary - v1.1</text>
  <text x="849.1503" y="301.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1046" fill="var(--text-muted)">5% Traffic</text>
  <rect x="658.8235" y="414.1176" width="234.2484" height="84.7059" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="775.9477" y="464.9412" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5686">Monitor Metrics</text>
  <rect x="439.2157" y="564.7059" width="263.5294" height="75.2941" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="570.9804" y="611.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1046">Increase: 25%, 50%, 100%</text>
  <rect x="907.7124" y="564.7059" width="190.3268" height="75.2941" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1002.8758" y="611.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5686">Rollback</text>
  <line x1="497.7778" y1="122.3529" x2="307.451" y2="222.1177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="614.9019" y1="122.3529" x2="805.2287" y2="222.1177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="849.1503" y1="320" x2="797.9085" y2="410.3529" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="717.3856" y1="498.8235" x2="600.2614" y2="560.9412" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow-ok)" />
  <text x="636.8627" y="527.0588" font-family="Arial, sans-serif" font-size="14.6405" fill="var(--ok-accent)">Healthy</text>
  <line x1="834.5098" y1="498.8235" x2="973.5947" y2="560.9412" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="936.9934" y="527.0588" font-family="Arial, sans-serif" font-size="14.6405" fill="var(--danger-accent)">Unhealthy</text>
</svg>
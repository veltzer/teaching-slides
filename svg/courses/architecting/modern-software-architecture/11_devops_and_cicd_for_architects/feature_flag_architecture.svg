<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="50.5679" y="260.7407" width="252.8395" height="118.5185" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="176.9877" y="331.8519" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9128" font-weight="bold">Application</text>
  <rect x="455.1111" y="260.7407" width="303.4074" height="118.5185" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="606.8148" y="312.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2272" font-weight="bold">Feature Flag Service</text>
  <text x="606.8148" y="355.5556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.856" fill="var(--text-muted)">Enabled for 10% users</text>
  <rect x="927.0782" y="94.8148" width="269.6955" height="118.5185" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1061.9259" y="146.963" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2272" font-weight="bold">New Code Path</text>
  <text x="1061.9259" y="189.6296" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.856" fill="var(--ok-accent)">Feature ON</text>
  <rect x="927.0782" y="402.963" width="269.6955" height="118.5185" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1061.9259" y="455.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.2272">Old Code Path</text>
  <text x="1061.9259" y="493.037" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.856" fill="var(--text-muted)">Feature OFF</text>
  <line x1="303.4074" y1="308.1481" x2="451.74" y2="308.1481" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="377.5736" y="289.1852" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.856" fill="var(--text-muted)">Check Flag</text>
  <line x1="606.8148" y1="260.7407" x2="606.8148" y2="189.6296" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.7424" />
  <line x1="303.4074" y1="284.4444" x2="923.707" y2="154.0741" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="589.9588" y="184.8889" font-family="Arial, sans-serif" font-size="16.856" fill="var(--ok-accent)">10%</text>
  <line x1="303.4074" y1="355.5556" x2="923.707" y2="462.2222" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="589.9588" y="450.3704" font-family="Arial, sans-serif" font-size="16.856" fill="var(--primary-accent)">90%</text>
  <text x="632.0988" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5415" fill="var(--text-muted)">Decouple deployment from feature release using feature flags</text>
</svg>
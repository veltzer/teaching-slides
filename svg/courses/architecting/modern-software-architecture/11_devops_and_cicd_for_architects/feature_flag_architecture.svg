<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="40" y="216.5217" width="264.7059" height="126.0869" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="172.353" y="292.174" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.1259" font-weight="bold" fill="var(--primary-text)">Application</text>
  <rect x="463.5294" y="216.5217" width="317.647" height="126.0869" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="622.3529" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.347" font-weight="bold" fill="var(--warn-text)">Feature Flag Service</text>
  <text x="622.3529" y="317.3914" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7892" fill="var(--text-muted)">Enabled for 10% users</text>
  <rect x="957.647" y="40" width="282.353" height="126.0869" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.8235" y="95.4783" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.347" font-weight="bold" fill="var(--ok-text)">New Code Path</text>
  <text x="1098.8235" y="140.8695" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7892" fill="var(--ok-accent)">Feature ON</text>
  <rect x="957.647" y="367.8261" width="282.353" height="126.0869" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1098.8235" y="423.3043" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.347" fill="var(--primary-text)">Old Code Path</text>
  <text x="1098.8235" y="463.6521" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7892" fill="var(--text-muted)">Feature OFF</text>
  <line x1="304.7059" y1="266.9565" x2="460.0001" y2="266.9565" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="382.3529" y="246.7826" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.7892" fill="var(--text-muted)">Check Flag</text>
  <line x1="622.3529" y1="216.5217" x2="622.3529" y2="140.8695" stroke="var(--warn-border)" stroke-width="2" stroke-dasharray="6.7424" />
  <line x1="304.7059" y1="241.7391" x2="954.1176" y2="103.0435" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="604.7058" y="135.8261" font-family="Arial, sans-serif" font-size="17.7892" fill="var(--ok-accent)">10%</text>
  <line x1="304.7059" y1="317.3914" x2="954.1176" y2="430.8695" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="604.7058" y="418.2609" font-family="Arial, sans-serif" font-size="17.7892" fill="var(--primary-accent)">90%</text>
  <text x="648.8235" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.568" fill="var(--text-muted)">Decouple deployment from feature release using feature flags</text>
</svg>
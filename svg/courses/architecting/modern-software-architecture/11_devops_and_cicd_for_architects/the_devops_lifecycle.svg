<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#666" />
    </marker>
  </defs>
  <text x="640" y="51.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="var(--text)">The DevOps Lifecycle</text>
  <rect x="128" y="123.4286" width="176" height="92.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="216" y="178.9714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Plan</text>
  <line x1="304" y1="168.6857" x2="352" y2="168.6857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="368" y="123.4286" width="176" height="92.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="456" y="178.9714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Code</text>
  <line x1="544" y1="168.6857" x2="592" y2="168.6857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="608" y="123.4286" width="176" height="92.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="696" y="178.9714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Build</text>
  <line x1="784" y1="168.6857" x2="832" y2="168.6857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="848" y="123.4286" width="176" height="92.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="936" y="178.9714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Test</text>
  <line x1="936" y1="216" x2="936" y2="370.2857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="848" y="390.8571" width="176" height="92.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="936" y="446.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Release</text>
  <line x1="848" y1="436.1143" x2="800" y2="436.1143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="608" y="390.8571" width="176" height="92.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="696" y="446.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Deploy</text>
  <line x1="608" y1="436.1143" x2="560" y2="436.1143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="368" y="390.8571" width="176" height="92.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="456" y="446.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Operate</text>
  <line x1="368" y1="436.1143" x2="320" y2="436.1143" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="128" y="390.8571" width="176" height="92.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="216" y="446.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Monitor</text>
  <line x1="216" y1="390.8571" x2="216" y2="226.2857" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="560" y="113.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--primary-accent)">Development</text>
  <text x="560" y="514.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--ok-accent)">Operations</text>
  <text x="96" y="318.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="var(--warn-accent)" transform="rotate(-90,60,155)">Feedback</text>
</svg>
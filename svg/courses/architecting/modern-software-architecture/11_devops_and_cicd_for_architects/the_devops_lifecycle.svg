<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#666" />
    </marker>
  </defs>
  <text x="743.4483" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="30.5505" font-weight="bold" fill="var(--text)">The DevOps Lifecycle</text>
  <rect x="81.3793" y="130.2222" width="227.5862" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="195.1724" y="199.8221" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4771" font-weight="bold">Plan</text>
  <line x1="308.9656" y1="186.9333" x2="371.0344" y2="186.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="391.7242" y="130.2222" width="227.5862" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="505.5172" y="199.8221" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4771" font-weight="bold">Code</text>
  <line x1="619.3103" y1="186.9333" x2="681.3793" y2="186.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="702.069" y="130.2222" width="227.5862" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="815.8621" y="199.8221" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4771" font-weight="bold">Build</text>
  <line x1="929.6551" y1="186.9333" x2="991.7242" y2="186.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1012.4138" y="130.2222" width="227.5862" height="116" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1126.2069" y="199.8221" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4771" font-weight="bold">Test</text>
  <line x1="1126.2069" y1="246.2222" x2="1126.2069" y2="439.5555" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1012.4138" y="465.3333" width="227.5862" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1126.2069" y="534.9334" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4771" font-weight="bold">Release</text>
  <line x1="1012.4138" y1="522.0445" x2="950.3449" y2="522.0445" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="702.069" y="465.3333" width="227.5862" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="815.8621" y="534.9334" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4771" font-weight="bold">Deploy</text>
  <line x1="702.069" y1="522.0445" x2="640" y2="522.0445" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="391.7242" y="465.3333" width="227.5862" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="505.5172" y="534.9334" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4771" font-weight="bold">Operate</text>
  <line x1="391.7242" y1="522.0445" x2="329.6551" y2="522.0445" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="81.3793" y="465.3333" width="227.5862" height="116" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="195.1724" y="534.9334" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4771" font-weight="bold">Monitor</text>
  <line x1="195.1724" y1="465.3333" x2="195.1724" y2="259.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="117.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4036" fill="var(--primary-accent)">Development</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4036" fill="var(--ok-accent)">Operations</text>
  <text x="40" y="375.111" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4036" fill="var(--warn-accent)" transform="rotate(-90,60,155)">Feedback</text>
</svg>
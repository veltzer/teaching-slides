<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="725.7143" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31.0913" font-weight="bold" fill="var(--text)">The DevOps Lifecycle</text>
  <rect x="40" y="130.2222" width="235.7143" height="116" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="157.8571" y="199.8221" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9458" font-weight="bold" fill="var(--primary-text)">Plan</text>
  <line x1="275.7144" y1="186.9333" x2="339.9999" y2="186.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="361.4286" y="130.2222" width="235.7143" height="116" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.2857" y="199.8221" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9458" font-weight="bold" fill="var(--primary-text)">Code</text>
  <line x1="597.1428" y1="186.9333" x2="661.4286" y2="186.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="682.8572" y="130.2222" width="235.7143" height="116" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.7143" y="199.8221" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9458" font-weight="bold" fill="var(--primary-text)">Build</text>
  <line x1="918.5714" y1="186.9333" x2="982.8572" y2="186.9333" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1004.2857" y="130.2222" width="235.7143" height="116" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.1429" y="199.8221" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9458" font-weight="bold" fill="var(--primary-text)">Test</text>
  <line x1="1122.1429" y1="246.2222" x2="1122.1429" y2="439.5555" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1004.2857" y="465.3333" width="235.7143" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1122.1429" y="534.9334" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9458" font-weight="bold" fill="var(--ok-text)">Release</text>
  <line x1="1004.2857" y1="522.0445" x2="940.0001" y2="522.0445" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="682.8572" y="465.3333" width="235.7143" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800.7143" y="534.9334" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9458" font-weight="bold" fill="var(--ok-text)">Deploy</text>
  <line x1="682.8572" y1="522.0445" x2="618.5714" y2="522.0445" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="361.4286" y="465.3333" width="235.7143" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="479.2857" y="534.9334" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9458" font-weight="bold" fill="var(--ok-text)">Operate</text>
  <line x1="361.4286" y1="522.0445" x2="297.1428" y2="522.0445" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="465.3333" width="235.7143" height="116" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="157.8571" y="534.9334" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.9458" font-weight="bold" fill="var(--warn-text)">Monitor</text>
  <line x1="157.8571" y1="465.3333" x2="157.8571" y2="259.1111" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618.5714" y="117.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.8002" fill="var(--primary-accent)">Development</text>
  <text x="618.5714" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.8002" fill="var(--ok-accent)">Operations</text>
  <text x="40" y="375.111" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4036" fill="var(--warn-accent)" transform="rotate(-90,60,155)">Feedback</text>
</svg>

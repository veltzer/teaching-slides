<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <text x="400" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">The DevOps Lifecycle</text>
  <!-- Top row: Dev -->
  <rect x="80" y="60" width="110" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="135" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Plan</text>
  <line x1="190" y1="82" x2="220" y2="82" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="230" y="60" width="110" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="285" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Code</text>
  <line x1="340" y1="82" x2="370" y2="82" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="380" y="60" width="110" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="435" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Build</text>
  <line x1="490" y1="82" x2="520" y2="82" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="530" y="60" width="110" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="585" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Test</text>
  <!-- Right connector down -->
  <line x1="585" y1="105" x2="585" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Bottom row: Ops (right to left) -->
  <rect x="530" y="190" width="110" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="585" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Release</text>
  <line x1="530" y1="212" x2="500" y2="212" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="380" y="190" width="110" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="435" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Deploy</text>
  <line x1="380" y1="212" x2="350" y2="212" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="230" y="190" width="110" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="285" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Operate</text>
  <line x1="230" y1="212" x2="200" y2="212" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="80" y="190" width="110" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="135" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Monitor</text>
  <!-- Left connector up (loop back) -->
  <line x1="135" y1="190" x2="135" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Labels -->
  <text x="350" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a90e2">Development</text>
  <text x="350" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">Operations</text>
  <text x="60" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffc107" transform="rotate(-90,60,155)">Feedback</text>
</svg>

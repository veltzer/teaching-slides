<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#666" />
    </marker>
  </defs>
  <text x="726.4198" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.9259" font-weight="bold" fill="var(--text)">The DevOps Lifecycle</text>
  <rect x="173.3333" y="157.7778" width="190.1235" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="268.395" y="217.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4691" font-weight="bold">Plan</text>
  <line x1="363.4568" y1="206.6666" x2="415.3086" y2="206.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="432.5926" y="157.7778" width="190.1235" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="527.6543" y="217.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4691" font-weight="bold">Code</text>
  <line x1="622.716" y1="206.6666" x2="674.5679" y2="206.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="691.8519" y="157.7778" width="190.1235" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="786.9136" y="217.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4691" font-weight="bold">Build</text>
  <line x1="881.9753" y1="206.6666" x2="933.8272" y2="206.6666" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="951.1111" y="157.7778" width="190.1235" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1046.1729" y="217.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4691" font-weight="bold">Test</text>
  <line x1="1046.1729" y1="257.7778" x2="1046.1729" y2="424.4444" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="951.1111" y="446.6666" width="190.1235" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1046.1729" y="506.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4691" font-weight="bold">Release</text>
  <line x1="951.1111" y1="495.5556" x2="899.2593" y2="495.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="691.8519" y="446.6666" width="190.1235" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="786.9136" y="506.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4691" font-weight="bold">Deploy</text>
  <line x1="691.8519" y1="495.5556" x2="640" y2="495.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="432.5926" y="446.6666" width="190.1235" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="527.6543" y="506.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4691" font-weight="bold">Operate</text>
  <line x1="432.5926" y1="495.5556" x2="380.7407" y2="495.5556" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="173.3333" y="446.6666" width="190.1235" height="100" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="268.395" y="506.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4691" font-weight="bold">Monitor</text>
  <line x1="268.395" y1="446.6666" x2="268.395" y2="268.8889" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="640" y="146.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0123" fill="var(--primary-accent)">Development</text>
  <text x="640" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0123" fill="var(--ok-accent)">Operations</text>
  <text x="138.7654" y="368.8888" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0123" fill="var(--warn-accent)" transform="rotate(-90,60,155)">Feedback</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="30.0247" y="26.6667" width="525.4321" height="266.6666" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5062" />
  <text x="292.7407" y="62.2222" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0148" fill="var(--primary-accent)" font-weight="bold">Per Service</text>
  <rect x="60.0494" y="88.8888" width="165.1358" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="142.6173" y="133.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5136">Source Code</text>
  <rect x="60.0494" y="195.5556" width="165.1358" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="142.6173" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5136">CI Pipeline</text>
  <rect x="285.2346" y="195.5556" width="195.1605" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="382.8148" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5136">Container Image</text>
  <line x1="142.6173" y1="160" x2="142.6173" y2="192" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="225.1852" y1="231.1111" x2="282.2321" y2="231.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="645.5308" y="195.5556" width="180.1481" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="735.6049" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0148" font-weight="bold">Registry</text>
  <line x1="480.395" y1="231.1111" x2="642.5284" y2="231.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="570.4691" y="337.7778" width="600.4938" height="302.2222" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5062" />
  <text x="870.716" y="373.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0148" fill="var(--ok-accent)" font-weight="bold">Shared CD Pipeline</text>
  <rect x="600.4938" y="400" width="180.1481" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="690.5679" y="444.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5136">Dev Cluster</text>
  <rect x="600.4938" y="515.5555" width="180.1481" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="690.5679" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5136">Staging Cluster</text>
  <rect x="930.7654" y="515.5555" width="210.1728" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1035.8518" y="554.6666" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5136" font-weight="bold">Production</text>
  <line x1="735.6049" y1="266.6666" x2="690.5679" y2="396.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="690.5679" y1="471.1111" x2="690.5679" y2="512" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="713.0864" y="497.7777" font-family="Arial, sans-serif" font-size="15.0123" fill="var(--text-muted)">Promote</text>
  <line x1="780.6419" y1="551.1111" x2="927.7629" y2="551.1111" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="854.2024" y="538.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0123" fill="var(--text-muted)">Approve</text>
</svg>
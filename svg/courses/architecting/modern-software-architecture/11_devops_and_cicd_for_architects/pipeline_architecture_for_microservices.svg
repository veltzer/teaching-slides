<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="552.6316" height="252.1739" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5062" />
  <text x="316.3158" y="73.6231" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9661" fill="var(--primary-accent)" font-weight="bold">Per Service</text>
  <rect x="71.579" y="98.8405" width="173.6842" height="67.2464" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="158.4211" y="140.8696" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.469">Source Code</text>
  <rect x="71.579" y="199.7102" width="173.6842" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="158.4211" y="241.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.469">CI Pipeline</text>
  <rect x="308.4211" y="199.7102" width="205.2632" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="411.0526" y="241.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.469">Container Image</text>
  <line x1="158.4211" y1="166.0869" x2="158.4211" y2="196.3478" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="245.2632" y1="233.3333" x2="305.2632" y2="233.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="687.3684" y="199.7102" width="189.4736" height="67.2464" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="782.1053" y="241.7391" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9661" font-weight="bold">Registry</text>
  <line x1="513.6842" y1="233.3333" x2="684.2106" y2="233.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="608.421" y="334.2029" width="631.579" height="285.7971" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5062" />
  <text x="924.2105" y="367.826" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.9661" fill="var(--ok-accent)" font-weight="bold">Shared CD Pipeline</text>
  <rect x="640" y="393.0435" width="189.4736" height="67.2464" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="734.7369" y="435.0724" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.469">Dev Cluster</text>
  <rect x="640" y="502.3188" width="189.4736" height="67.2464" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="734.7369" y="544.3478" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.469">Staging Cluster</text>
  <rect x="987.3684" y="502.3188" width="221.0526" height="67.2464" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1097.8947" y="539.3043" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.469" font-weight="bold">Production</text>
  <line x1="782.1053" y1="266.9564" x2="734.7369" y2="389.6811" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="734.7369" y1="460.2898" x2="734.7369" y2="498.9565" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="758.4211" y="485.5072" font-family="Arial, sans-serif" font-size="14.9717" fill="var(--text-muted)">Promote</text>
  <line x1="829.4736" y1="535.942" x2="984.2105" y2="535.942" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="906.8421" y="524.1739" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.9717" fill="var(--text-muted)">Approve</text>
</svg>
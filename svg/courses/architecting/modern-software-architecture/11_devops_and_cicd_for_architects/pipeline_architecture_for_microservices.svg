<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Per Service section -->
  <rect x="20" y="15" width="350" height="150" rx="5" fill="none" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="195" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a90e2" font-weight="bold">Per Service</text>
  <rect x="40" y="50" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="95" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Source Code</text>
  <rect x="40" y="110" width="110" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="95" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">CI Pipeline</text>
  <rect x="190" y="110" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="255" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Container Image</text>
  <!-- Arrows in per-service -->
  <line x1="95" y1="90" x2="95" y2="108" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="150" y1="130" x2="188" y2="130" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Registry -->
  <rect x="430" y="110" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="490" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Registry</text>
  <line x1="320" y1="130" x2="428" y2="130" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Shared section -->
  <rect x="380" y="190" width="400" height="170" rx="5" fill="none" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="580" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#28a745" font-weight="bold">Shared CD Pipeline</text>
  <rect x="400" y="225" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="460" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Dev Cluster</text>
  <rect x="400" y="290" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="460" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Staging Cluster</text>
  <rect x="620" y="290" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="690" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Production</text>
  <!-- Arrows in shared -->
  <line x1="490" y1="150" x2="460" y2="223" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="265" x2="460" y2="288" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="475" y="280" font-family="Arial, sans-serif" font-size="10" fill="#666">Promote</text>
  <line x1="520" y1="310" x2="618" y2="310" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="569" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Approve</text>
</svg>

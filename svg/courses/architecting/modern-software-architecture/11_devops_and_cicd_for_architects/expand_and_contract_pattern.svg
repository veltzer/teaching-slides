<svg viewBox="0 0 850 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Steps -->
  <rect x="15" y="60" width="135" height="55" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="82" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Step 1</text>
  <text x="82" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Add new column</text>
  <rect x="180" y="60" width="135" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="247" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Step 2</text>
  <text x="247" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">App writes to both</text>
  <rect x="345" y="60" width="135" height="55" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="412" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Step 3</text>
  <text x="412" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Migrate data</text>
  <rect x="510" y="60" width="135" height="55" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="577" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Step 4</text>
  <text x="577" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">App reads from new</text>
  <rect x="675" y="60" width="145" height="55" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="747" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Step 5</text>
  <text x="747" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Drop old column</text>
  <!-- Arrows -->
  <line x1="150" y1="87" x2="178" y2="87" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="315" y1="87" x2="343" y2="87" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="87" x2="508" y2="87" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="645" y1="87" x2="673" y2="87" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Labels -->
  <text x="165" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745" font-weight="bold">Expand</text>
  <line x1="15" y1="48" x2="340" y2="48" stroke="#28a745" stroke-width="1" stroke-dasharray="3"/>
  <text x="660" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc3545" font-weight="bold">Contract</text>
  <line x1="510" y1="48" x2="820" y2="48" stroke="#dc3545" stroke-width="1" stroke-dasharray="3"/>
  <text x="425" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Zero-downtime database schema migration pattern</text>
</svg>

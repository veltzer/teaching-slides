<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,36 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="22.5882" y="216" width="203.2941" height="198" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="123.4824" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 1</text>
  <text x="123.4824" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">Add new column</text>
  <rect x="271.0588" y="216" width="203.2941" height="198" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="371.9529" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 2</text>
  <text x="371.9529" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">App writes to both</text>
  <rect x="519.5294" y="216" width="203.2941" height="198" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="620.4235" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 3</text>
  <text x="620.4235" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">Migrate data</text>
  <rect x="768" y="216" width="203.2941" height="198" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="868.8941" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 4</text>
  <text x="868.8941" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">App reads from new</text>
  <rect x="1016.4706" y="216" width="218.3529" height="198" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1124.8941" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 5</text>
  <text x="1124.8941" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">Drop old column</text>
  <line x1="225.8824" y1="313.2" x2="268.0471" y2="313.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="474.3529" y1="313.2" x2="516.5176" y2="313.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="722.8235" y1="313.2" x2="764.9882" y2="313.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="971.2941" y1="313.2" x2="1013.4588" y2="313.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="248.4706" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--ok-accent)" font-weight="bold">Expand</text>
  <line x1="22.5882" y1="172.8" x2="512" y2="172.8" stroke="var(--ok-border)" stroke-width="1.5059" stroke-dasharray="4.5176" />
  <text x="993.8824" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--danger-accent)" font-weight="bold">Contract</text>
  <line x1="768" y1="172.8" x2="1234.8235" y2="172.8" stroke="var(--danger-border)" stroke-width="1.5059" stroke-dasharray="4.5176" />
  <text x="640" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--text-muted)">Zero-downtime database schema migration pattern</text>
</svg>
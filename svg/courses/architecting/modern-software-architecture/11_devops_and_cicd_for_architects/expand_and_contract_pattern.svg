    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="15.0588" markerHeight="25.2" refX="15.0588" refY="12.6" orient="auto">
      <polygon points="0,36 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="22.5882" y="216" width="203.2941" height="198" rx="7.5294" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.0118" />
  <text x="123.4824" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 1</text>
  <text x="123.4824" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">Add new column</text>
  <rect x="271.0588" y="216" width="203.2941" height="198" rx="7.5294" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.0118" />
  <text x="371.9529" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 2</text>
  <text x="371.9529" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">App writes to both</text>
  <rect x="519.5294" y="216" width="203.2941" height="198" rx="7.5294" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.0118" />
  <text x="620.4235" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 3</text>
  <text x="620.4235" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">Migrate data</text>
  <rect x="768" y="216" width="203.2941" height="198" rx="7.5294" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.0118" />
  <text x="868.8941" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 4</text>
  <text x="868.8941" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">App reads from new</text>
  <rect x="1016.4706" y="216" width="218.3529" height="198" rx="7.5294" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.0118" />
  <text x="1124.8941" y="295.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Step 5</text>
  <text x="1124.8941" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588">Drop old column</text>
  <line x1="225.8824" y1="313.2" x2="268.0471" y2="313.2" stroke="var(--primary-bright)" stroke-width="3.0118" marker-end="url(#arrow)" />
  <line x1="474.3529" y1="313.2" x2="516.5176" y2="313.2" stroke="var(--primary-bright)" stroke-width="3.0118" marker-end="url(#arrow)" />
  <line x1="722.8235" y1="313.2" x2="764.9882" y2="313.2" stroke="var(--primary-bright)" stroke-width="3.0118" marker-end="url(#arrow)" />
  <line x1="971.2941" y1="313.2" x2="1013.4588" y2="313.2" stroke="var(--primary-bright)" stroke-width="3.0118" marker-end="url(#arrow)" />
  <text x="248.4706" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--ok-bright)" font-weight="bold">Expand</text>
  <line x1="22.5882" y1="172.8" x2="512" y2="172.8" stroke="var(--ok-bright)" stroke-width="1.5059" stroke-dasharray="4.5176" />
  <text x="993.8824" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--danger-bright)" font-weight="bold">Contract</text>
  <line x1="768" y1="172.8" x2="1234.8235" y2="172.8" stroke="var(--danger-bright)" stroke-width="1.5059" stroke-dasharray="4.5176" />
  <text x="640" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--text-mid)">Zero-downtime database schema migration pattern</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,36 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="136.6667" width="201.2422" height="265.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="139.8759" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold">Step 1</text>
  <text x="139.8759" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604">Add new column</text>
  <rect x="285.9627" y="136.6667" width="201.2422" height="265.8333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="385.8385" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold">Step 2</text>
  <text x="385.8385" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604">App writes to both</text>
  <rect x="531.9255" y="136.6667" width="201.2422" height="265.8333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="631.8012" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold">Step 3</text>
  <text x="631.8012" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604">Migrate data</text>
  <rect x="777.8882" y="136.6667" width="201.2422" height="265.8333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="877.764" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold">Step 4</text>
  <text x="877.764" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604">App reads from new</text>
  <rect x="1023.851" y="136.6667" width="216.149" height="265.8333" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="1131.1801" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold">Step 5</text>
  <text x="1131.1801" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604">Drop old column</text>
  <line x1="241.2423" y1="267.1667" x2="282.9814" y2="267.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="487.205" y1="267.1667" x2="528.9441" y2="267.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="733.1677" y1="267.1667" x2="774.9068" y2="267.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="979.1304" y1="267.1667" x2="1020.8696" y2="267.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="263.6025" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" fill="var(--ok-accent)" font-weight="bold">Expand</text>
  <line x1="40" y1="78.6667" x2="524.4721" y2="78.6667" stroke="var(--ok-border)" stroke-width="1.5059" stroke-dasharray="4.5176" />
  <text x="1001.4908" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" fill="var(--danger-accent)" font-weight="bold">Contract</text>
  <line x1="777.8882" y1="78.6667" x2="1240" y2="78.6667" stroke="var(--danger-border)" stroke-width="1.5059" stroke-dasharray="4.5176" />
  <text x="651.1802" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" fill="var(--text-muted)">Zero-downtime database schema migration pattern</text>
</svg>
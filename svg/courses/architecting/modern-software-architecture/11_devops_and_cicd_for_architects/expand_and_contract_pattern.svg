<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="136.6667" width="201.2422" height="265.8333" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="139.8759" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold" fill="var(--primary-text)">Step 1</text>
  <text x="139.8759" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604" fill="var(--primary-text)">Add new column</text>
  <rect x="285.9627" y="136.6667" width="201.2422" height="265.8333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="385.8385" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold" fill="var(--ok-text)">Step 2</text>
  <text x="385.8385" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604" fill="var(--ok-text)">App writes to both</text>
  <rect x="531.9255" y="136.6667" width="201.2422" height="265.8333" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="631.8012" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold" fill="var(--warn-text)">Step 3</text>
  <text x="631.8012" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604" fill="var(--warn-text)">Migrate data</text>
  <rect x="777.8882" y="136.6667" width="201.2422" height="265.8333" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="877.764" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold" fill="var(--ok-text)">Step 4</text>
  <text x="877.764" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604" fill="var(--ok-text)">App reads from new</text>
  <rect x="1023.851" y="136.6667" width="216.149" height="265.8333" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1131.1801" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" font-weight="bold" fill="var(--danger-text)">Step 5</text>
  <text x="1131.1801" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3604" fill="var(--danger-text)">Drop old column</text>
  <line x1="241.2423" y1="267.1667" x2="282.9814" y2="267.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="487.205" y1="267.1667" x2="528.9441" y2="267.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="733.1677" y1="267.1667" x2="774.9068" y2="267.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="979.1304" y1="267.1667" x2="1020.8696" y2="267.1667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="263.6025" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" fill="var(--ok-accent)" font-weight="bold">Expand</text>
  <line x1="40" y1="78.6667" x2="524.4721" y2="78.6667" stroke="var(--ok-border)" stroke-width="1.5059" stroke-dasharray="4.5176"/>
  <text x="1001.4908" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" fill="var(--danger-accent)" font-weight="bold">Contract</text>
  <line x1="777.8882" y1="78.6667" x2="1240" y2="78.6667" stroke="var(--danger-border)" stroke-width="1.5059" stroke-dasharray="4.5176"/>
  <text x="651.1802" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.0965" fill="var(--text-muted)">Zero-downtime database schema migration pattern</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="30.1176" y="38.5714" width="1219.7647" height="257.1429" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5294" />
  <text x="632.4706" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5765" fill="var(--primary-accent)" font-weight="bold">Continuous Delivery</text>
  <rect x="60.2353" y="128.5714" width="150.5882" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="135.5294" y="185.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Build</text>
  <rect x="256" y="128.5714" width="150.5882" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="331.2941" y="185.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Test</text>
  <rect x="451.7647" y="128.5714" width="150.5882" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="527.0588" y="185.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Stage</text>
  <rect x="662.5882" y="128.5714" width="210.8235" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="768" y="185.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Manual Approval</text>
  <rect x="933.6471" y="128.5714" width="180.7059" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1024" y="185.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Production</text>
  <line x1="210.8235" y1="172.2857" x2="252.9882" y2="172.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="406.5882" y1="172.2857" x2="448.7529" y2="172.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="602.3529" y1="172.2857" x2="659.5765" y2="172.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="873.4118" y1="172.2857" x2="930.6353" y2="172.2857" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="30.1176" y="372.8571" width="1219.7647" height="257.1429" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5294" />
  <text x="632.4706" y="424.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5765" fill="var(--ok-accent)" font-weight="bold">Continuous Deployment</text>
  <rect x="60.2353" y="462.8571" width="150.5882" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="135.5294" y="519.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Build</text>
  <rect x="301.1765" y="462.8571" width="150.5882" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="376.4706" y="519.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Test</text>
  <rect x="542.1176" y="462.8571" width="150.5882" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="617.4118" y="519.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Stage</text>
  <rect x="798.1176" y="462.8571" width="301.1765" height="90" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="948.7059" y="519.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Auto Deploy to Prod</text>
  <line x1="210.8235" y1="506.5714" x2="298.1647" y2="506.5714" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="451.7647" y1="506.5714" x2="539.1059" y2="506.5714" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="692.7059" y1="506.5714" x2="795.1059" y2="506.5714" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
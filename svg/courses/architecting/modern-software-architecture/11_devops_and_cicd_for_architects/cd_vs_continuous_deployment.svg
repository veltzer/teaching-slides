<svg viewBox="0 0 850 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Continuous Delivery -->
  <rect x="20" y="15" width="810" height="100" rx="5" fill="none" stroke="#4a90e2" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="420" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4a90e2" font-weight="bold">Continuous Delivery</text>
  <rect x="40" y="50" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Build</text>
  <rect x="170" y="50" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="220" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Test</text>
  <rect x="300" y="50" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Stage</text>
  <rect x="440" y="50" width="140" height="35" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="510" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Manual Approval</text>
  <rect x="620" y="50" width="120" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="680" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Production</text>
  <line x1="140" y1="67" x2="168" y2="67" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="67" x2="298" y2="67" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="67" x2="438" y2="67" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="67" x2="618" y2="67" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Continuous Deployment -->
  <rect x="20" y="145" width="810" height="100" rx="5" fill="none" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="420" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#28a745" font-weight="bold">Continuous Deployment</text>
  <rect x="40" y="180" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="90" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Build</text>
  <rect x="200" y="180" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="250" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Test</text>
  <rect x="360" y="180" width="100" height="35" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="410" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Stage</text>
  <rect x="530" y="180" width="200" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Auto Deploy to Prod</text>
  <line x1="140" y1="197" x2="198" y2="197" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="197" x2="358" y2="197" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="197" x2="528" y2="197" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>

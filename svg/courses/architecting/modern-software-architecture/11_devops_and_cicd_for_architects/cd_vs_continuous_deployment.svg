<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="1200" height="252.1739" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5294" />
  <text x="632.5927" y="90.4348" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2287" fill="var(--primary-accent)" font-weight="bold">Continuous Delivery</text>
  <rect x="69.6297" y="128.2609" width="148.1481" height="88.2609" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.7037" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704">Build</text>
  <rect x="262.2223" y="128.2609" width="148.1481" height="88.2609" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="336.2963" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704">Test</text>
  <rect x="454.8149" y="128.2609" width="148.1481" height="88.2609" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="528.8889" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704">Stage</text>
  <rect x="662.2222" y="128.2609" width="207.4074" height="88.2609" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="765.926" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" font-weight="bold">Manual Approval</text>
  <rect x="928.889" y="128.2609" width="177.7778" height="88.2609" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1017.7778" y="183.7392" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704">Production</text>
  <line x1="217.7778" y1="171.1304" x2="259.2593" y2="171.1304" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="410.3704" y1="171.1304" x2="451.8519" y2="171.1304" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="602.963" y1="171.1304" x2="659.2593" y2="171.1304" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="869.6297" y1="171.1304" x2="925.926" y2="171.1304" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="367.8261" width="1200" height="252.1739" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5294" />
  <text x="632.5927" y="418.2609" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2287" fill="var(--ok-accent)" font-weight="bold">Continuous Deployment</text>
  <rect x="69.6297" y="456.0869" width="148.1481" height="88.2609" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="143.7037" y="511.5653" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704">Build</text>
  <rect x="306.6667" y="456.0869" width="148.1481" height="88.2609" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="380.7408" y="511.5653" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704">Test</text>
  <rect x="543.7037" y="456.0869" width="148.1481" height="88.2609" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="617.7779" y="511.5653" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704">Stage</text>
  <rect x="795.5556" y="456.0869" width="296.2963" height="88.2609" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="943.7038" y="511.5653" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2704" font-weight="bold">Auto Deploy to Prod</text>
  <line x1="217.7778" y1="498.9565" x2="303.7037" y2="498.9565" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="454.8149" y1="498.9565" x2="540.7408" y2="498.9565" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="691.8519" y1="498.9565" x2="792.5927" y2="498.9565" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a20"/>
      <stop offset="100%" style="stop-color:#1a1a38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Microservices hexagon cluster -->
  <polygon points="300,100 340,80 380,100 380,140 340,160 300,140" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.7"/>
  <polygon points="390,100 430,80 470,100 470,140 430,160 390,140" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.7"/>
  <polygon points="345,160 385,140 425,160 425,200 385,220 345,200" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.7"/>
  <!-- Service labels inside hexagons -->
  <circle cx="340" cy="120" r="12" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="430" cy="120" r="12" fill="#14b8a6" opacity="0.3"/>
  <circle cx="385" cy="180" r="12" fill="#0ea5e9" opacity="0.3"/>
  <!-- Connection mesh lines -->
  <line x1="340" y1="120" x2="430" y2="120" stroke="#14b8a6" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
  <line x1="340" y1="120" x2="385" y2="180" stroke="#0ea5e9" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
  <line x1="430" y1="120" x2="385" y2="180" stroke="#14b8a6" stroke-width="1" opacity="0.4" stroke-dasharray="4,4"/>
  <!-- API Gateway bar -->
  <rect x="260" y="250" width="280" height="25" rx="5" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" opacity="0.7"/>
  <text x="355" y="268" font-family="monospace" font-size="11" fill="#0ea5e9" opacity="0.8">API</text>
  <!-- Cloud-native container icons -->
  <rect x="140" y="130" width="50" height="40" rx="3" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
  <rect x="148" y="138" width="34" height="8" rx="2" fill="#14b8a6" opacity="0.3"/>
  <rect x="148" y="152" width="34" height="8" rx="2" fill="#0ea5e9" opacity="0.3"/>
  <rect x="610" y="130" width="50" height="40" rx="3" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.5"/>
  <rect x="618" y="138" width="34" height="8" rx="2" fill="#14b8a6" opacity="0.3"/>
  <rect x="618" y="152" width="34" height="8" rx="2" fill="#0ea5e9" opacity="0.3"/>
  <!-- Event bus / message queue -->
  <line x1="200" y1="320" x2="600" y2="320" stroke="#14b8a6" stroke-width="1.5" opacity="0.4"/>
  <circle cx="280" cy="320" r="5" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="400" cy="320" r="5" fill="#14b8a6" opacity="0.5"/>
  <circle cx="520" cy="320" r="5" fill="#0ea5e9" opacity="0.5"/>
  <!-- Arrows from gateway down -->
  <line x1="340" y1="275" x2="300" y2="315" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="275" x2="400" y2="315" stroke="#14b8a6" stroke-width="1" opacity="0.3"/>
  <line x1="460" y1="275" x2="500" y2="315" stroke="#0ea5e9" stroke-width="1" opacity="0.3"/>
  <!-- Distributed nodes -->
  <circle cx="100" cy="60" r="2" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="700" cy="70" r="3" fill="#14b8a6" opacity="0.3"/>
  <circle cx="90" cy="360" r="2" fill="#14b8a6" opacity="0.3"/>
  <circle cx="710" cy="360" r="2" fill="#0ea5e9" opacity="0.3"/>
  <!-- Bottom accent -->
  <rect x="250" y="375" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.6"/>
</svg>

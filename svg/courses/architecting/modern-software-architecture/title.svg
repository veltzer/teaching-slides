  <rect x="867.5556" y="208" width="71.1111" height="64" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <rect x="878.9333" y="220.8" width="48.3556" height="12.8" rx="6" fill="var(--ok-fill)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="878.9333" y="243.2" width="48.3556" height="12.8" rx="6" fill="var(--primary-fill)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="284.4444" y1="512" x2="853.3333" y2="512" stroke="var(--ok-border)" stroke-width="2" opacity="0.4" />
  <circle cx="398.2222" cy="512" r="7.1111" fill="var(--primary-fill)" opacity="0.5" />
  <circle cx="568.8889" cy="512" r="7.1111" fill="var(--ok-fill)" opacity="0.5" />
  <circle cx="739.5556" cy="512" r="7.1111" fill="var(--primary-fill)" opacity="0.5" />
  <line x1="483.5556" y1="440" x2="426.6667" y2="504" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.3" />
  <line x1="568.8889" y1="440" x2="568.8889" y2="504" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3" />
  <line x1="654.2222" y1="440" x2="711.1111" y2="504" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.3" />
  <circle cx="142.2222" cy="96" r="2.8444" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="995.5556" cy="112" r="4.2667" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="128" cy="576" r="2.8444" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="1009.7778" cy="576" r="2.8444" fill="var(--primary-fill)" opacity="0.3" />
  <rect x="355.5556" y="600" width="426.6667" height="4.8" rx="6" fill="url(#accent)" opacity="0.6" />
</svg>
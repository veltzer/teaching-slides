<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="bg" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#1a1a2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="160%" y2="180%">
      <stop offset="0%" style="stop-color:#2196f3" />
      <stop offset="100%" style="stop-color:#2ecc71" />
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)" rx="6" x="40" y="40"/>
  <polygon points="490,185 550,156 609.9999,185 609.9999,243 550,272 490,243" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.7" />
  <polygon points="625,185 685,156 744.9999,185 744.9999,243 685,272 625,243" fill="none" stroke="var(--ok-border)" stroke-width="2.8444" opacity="0.7" />
  <polygon points="557.5,272 617.5,243 677.4999,272 677.4999,330 617.5,359 557.5,330" fill="none" stroke="var(--primary-border)" stroke-width="2.8444" opacity="0.7" />
  <circle cx="550" cy="214" r="16.6854" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="685" cy="214" r="16.6854" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="617.5" cy="301" r="16.6854" fill="var(--primary-fill)" opacity="0.3" />
  <line x1="550" y1="214" x2="685" y2="214" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.4" stroke-dasharray="5.6889 5.6889" />
  <line x1="550" y1="214" x2="617.5" y2="301" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.4" stroke-dasharray="5.6889 5.6889" />
  <line x1="685" y1="214" x2="617.5" y2="301" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.4" stroke-dasharray="5.6889 5.6889" />
  <rect x="430" y="402.5" width="420" height="36.25" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" opacity="0.7" />
  <text x="572.5" y="428.6" font-size="15.2948" fill="var(--primary-accent)" opacity="0.8" font-family="Courier New, monospace">API</text>
  <rect x="250" y="228.5" width="75" height="58" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <rect x="262" y="240.1" width="51" height="11.6" rx="6" fill="url(#grad-ok)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="262" y="260.4" width="51" height="11.6" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="955" y="228.5" width="75" height="58" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <rect x="966.9999" y="240.1" width="51" height="11.6" rx="6" fill="url(#grad-ok)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="966.9999" y="260.4" width="51" height="11.6" rx="6" fill="url(#grad-primary)" opacity="0.3" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <line x1="339.9999" y1="504" x2="939.9999" y2="504" stroke="var(--ok-border)" stroke-width="2" opacity="0.4" />
  <circle cx="460" cy="504" r="6.9522" fill="var(--primary-fill)" opacity="0.5" />
  <circle cx="640" cy="504" r="6.9522" fill="var(--ok-fill)" opacity="0.5" />
  <circle cx="820" cy="504" r="6.9522" fill="var(--primary-fill)" opacity="0.5" />
  <line x1="550" y1="438.75" x2="490" y2="496.75" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.3" />
  <line x1="640" y1="438.75" x2="640" y2="496.75" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.3" />
  <line x1="730" y1="438.75" x2="790" y2="496.75" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.3" />
  <circle cx="190" cy="127" r="2.7808" fill="var(--primary-fill)" opacity="0.3" />
  <circle cx="1090" cy="141.5" r="4.1714" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="175" cy="562" r="2.7808" fill="var(--ok-fill)" opacity="0.3" />
  <circle cx="1105" cy="562" r="2.7808" fill="var(--primary-fill)" opacity="0.3" />
  <rect x="415" y="583.75" width="450" height="4.35" rx="6" fill="url(#accent)" opacity="0.6" />
</svg>
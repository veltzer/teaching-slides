  <line x1="483.5556" y1="192" x2="547.5556" y2="288" stroke="var(--primary-border)" stroke-width="1.4222" opacity="0.4" stroke-dasharray="5.6889 5.6889" />
  <line x1="611.5556" y1="192" x2="547.5556" y2="288" stroke="var(--ok-border)" stroke-width="1.4222" opacity="0.4" stroke-dasharray="5.6889 5.6889" />
  <rect x="369.7778" y="400" width="398.2222" height="40" rx="6" fill="var(--code-bg)" stroke="var(--primary-border)" stroke-width="2.1333" opacity="0.7" />
  <text x="504.8889" y="428.8" font-family="monospace" font-size="15.6444" fill="var(--primary-accent)" opacity="0.8">API</text>
  <rect x="199.1111" y="208" width="71.1111" height="64" rx="6" fill="none" stroke="var(--border)" stroke-width="1" opacity="0.5" />
  <rect x="210.4889" y="220.8" width="48.3556" height="12.8" rx="6" fill="var(--ok-fill)" opacity="0.3" stroke="var(--ok-border)" stroke-width="2"/>

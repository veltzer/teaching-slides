<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="169.8176" y="28.6567" width="849.088" height="324.7762" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="8.4909" />
  <text x="594.3616" y="66.8657" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0763" fill="var(--primary-accent)" font-weight="bold">Bridge Network</text>
  <rect x="220.7629" y="95.5224" width="203.7811" height="76.4179" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="322.6535" y="143.2836" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3782">Container 1</text>
  <rect x="492.471" y="95.5224" width="203.7811" height="76.4179" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="594.3616" y="143.2836" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3782">Container 2</text>
  <rect x="764.1791" y="95.5224" width="203.7811" height="76.4179" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="866.0697" y="143.2836" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3782">Container 3</text>
  <rect x="339.6352" y="248.3583" width="509.4528" height="66.8657" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="594.3616" y="290.3881" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3782" font-weight="bold">Bridge (docker0)</text>
  <line x1="322.6535" y1="171.9404" x2="475.4893" y2="248.3583" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="594.3616" y1="171.9404" x2="594.3616" y2="248.3583" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="866.0697" y1="171.9404" x2="713.2339" y2="248.3583" stroke="var(--primary-border)" stroke-width="2" />
  <rect x="339.6352" y="420.2985" width="509.4528" height="76.4179" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="594.3616" y="468.0597" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3782">Host Network Interface</text>
  <line x1="594.3616" y1="315.2239" x2="594.3616" y2="420.2985" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="339.6352" y="563.5821" width="509.4528" height="76.4179" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="594.3616" y="611.3433" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3782">External Network</text>
  <line x1="594.3616" y1="496.7164" x2="594.3616" y2="563.5821" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
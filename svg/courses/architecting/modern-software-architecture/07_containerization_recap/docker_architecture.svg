<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="48" y="265.2632" width="208" height="85.2632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="152" y="316.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Docker CLI</text>
  <rect x="400" y="265.2632" width="256" height="85.2632" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="528" y="316.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Docker Daemon</text>
  <line x1="256" y1="306.9474" x2="396.8" y2="306.9474" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="326.4" y="293.6842" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">REST API</text>
  <rect x="784" y="56.8421" width="208" height="75.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="888" y="104.2105" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Image Builder</text>
  <rect x="784" y="189.4737" width="224" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="896" y="236.8421" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Container Runtime</text>
  <rect x="784" y="322.1053" width="208" height="75.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="888" y="369.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Networking</text>
  <rect x="784" y="454.7368" width="208" height="75.7895" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="888" y="502.1053" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Volumes</text>
  <line x1="656" y1="284.2105" x2="780.8" y2="104.2105" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="656" y1="293.6842" x2="780.8" y2="227.3684" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="656" y1="312.6316" x2="780.8" y2="360" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="656" y1="331.5789" x2="780.8" y2="492.6316" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1072" y="161.0526" width="160" height="66.3158" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1152" y="202.7368" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Container 1</text>
  <rect x="1072" y="246.3158" width="160" height="66.3158" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1152" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Container 2</text>
  <line x1="1008" y1="217.8947" x2="1068.8" y2="193.2632" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1008" y1="236.8421" x2="1068.8" y2="274.7368" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1056" y="37.8947" width="176" height="75.7895" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1144" y="85.2632" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Registry</text>
  <line x1="992" y1="79.5789" x2="1052.8" y2="75.7895" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1024" y="60.6316" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Pull/Push</text>
</svg>
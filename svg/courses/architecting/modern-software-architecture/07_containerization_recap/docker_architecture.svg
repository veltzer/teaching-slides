<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="307.6924" width="210.8108" height="100.3847" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145.4054" y="367.9232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7212" font-weight="bold" fill="var(--primary-text)">Docker CLI</text>
  <rect x="396.7568" y="307.6924" width="259.4595" height="100.3847" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="526.4865" y="367.9232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7212" font-weight="bold" fill="var(--warn-text)">Docker Daemon</text>
  <line x1="250.8108" y1="356.7693" x2="393.5135" y2="356.7693" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="322.1622" y="341.1539" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4778" fill="var(--text-muted)">REST API</text>
  <rect x="785.9459" y="62.3077" width="210.8108" height="89.2308" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="891.3514" y="118.0769" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9734" fill="var(--primary-text)">Image Builder</text>
  <rect x="785.9459" y="218.4616" width="227.027" height="89.2308" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="899.4595" y="274.2308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9734" fill="var(--ok-text)">Container Runtime</text>
  <rect x="785.9459" y="374.6155" width="210.8108" height="89.2308" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="891.3514" y="430.3847" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9734" fill="var(--primary-text)">Networking</text>
  <rect x="785.9459" y="530.7692" width="210.8108" height="89.2308" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="891.3514" y="586.5385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9734" fill="var(--primary-text)">Volumes</text>
  <line x1="656.2162" y1="330" x2="782.7027" y2="118.0769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656.2162" y1="341.1539" x2="782.7027" y2="263.0769" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656.2162" y1="363.4616" x2="782.7027" y2="419.2308" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="656.2162" y1="385.7692" x2="782.7027" y2="575.3847" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1077.8378" y="185" width="162.1622" height="78.0769" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1158.9189" y="234.0769" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2256" fill="var(--ok-text)">Container 1</text>
  <rect x="1077.8378" y="285.3847" width="162.1622" height="78.0769" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1158.9189" y="334.4616" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2256" fill="var(--ok-text)">Container 2</text>
  <line x1="1012.973" y1="251.9231" x2="1074.5946" y2="222.9232" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1012.973" y1="274.2308" x2="1074.5946" y2="318.8461" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1061.6216" y="40" width="178.3784" height="89.2308" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1150.8108" y="95.7693" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.9734" fill="var(--warn-text)">Registry</text>
  <line x1="996.7568" y1="89.0769" x2="1058.3784" y2="84.6155" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1029.1892" y="66.7693" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4778" fill="var(--text-muted)">Pull/Push</text>
</svg>

<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Docker CLI -->
  <rect x="30" y="140" width="130" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="95" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Docker CLI</text>
  <!-- Docker Daemon -->
  <rect x="250" y="140" width="160" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="330" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Docker Daemon</text>
  <!-- REST API arrow -->
  <line x1="160" y1="162" x2="248" y2="162" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="204" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">REST API</text>
  <!-- Components -->
  <rect x="490" y="30" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="555" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Image Builder</text>
  <rect x="490" y="100" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="560" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Container Runtime</text>
  <rect x="490" y="170" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="555" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Networking</text>
  <rect x="490" y="240" width="130" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="555" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Volumes</text>
  <!-- Daemon to components -->
  <line x1="410" y1="150" x2="488" y2="55" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="155" x2="488" y2="120" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="165" x2="488" y2="190" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="175" x2="488" y2="260" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Containers -->
  <rect x="670" y="85" width="100" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="720" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Container 1</text>
  <rect x="670" y="130" width="100" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="720" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Container 2</text>
  <line x1="630" y1="115" x2="668" y2="102" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="125" x2="668" y2="145" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Registry -->
  <rect x="660" y="20" width="110" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="715" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Registry</text>
  <line x1="620" y1="42" x2="658" y2="40" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="640" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Pull/Push</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="325" y="40" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--primary-accent)">CI</text>
  <line x1="40" y1="61.886792" x2="820" y2="61.886792" stroke="var(--primary-border)" stroke-width="2" stroke-dasharray="6"/>

  <text x="1050" y="40" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--ok-accent)">CD</text>
  <line x1="850" y1="61.886792" x2="1240" y2="61.886792" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="6"/>

  <rect x="40" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--primary-text)">Code Push</text>
  <text x="130" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--primary-text)">git commit</text>
  <text x="130" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--primary-text)">triggers pipeline</text>

  <rect x="240" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--primary-text)">Build Image</text>
  <text x="330" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--primary-text)">docker build</text>
  <text x="330" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--primary-text)">tag with SHA</text>

  <rect x="440" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--warn-text)">Run Tests</text>
  <text x="530" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--warn-text)">unit and integration</text>
  <text x="530" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--warn-text)">in container</text>

  <rect x="640" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--danger-text)">Security Scan</text>
  <text x="730" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--danger-text)">CVE scan layers</text>
  <text x="730" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--danger-text)">block on critical</text>

  <rect x="840" y="116.603774" width="180" height="503.396226" rx="6.276641" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="930" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--ok-text)">Push Registry</text>
  <text x="930" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--ok-text)">sign image</text>
  <text x="930" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--ok-text)">push to registry</text>

  <rect x="1040" y="116.603774" width="200" height="503.396226" rx="6.276641" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="357.358491" text-anchor="middle" font-size="23.014352" font-weight="bold" fill="var(--ok-text)">Deploy</text>
  <text x="1140" y="412.075472" text-anchor="middle" font-size="14.645496" fill="var(--ok-text)">rollout to k8s</text>
  <text x="1140" y="444.90566" text-anchor="middle" font-size="14.645496" fill="var(--ok-text)">canary, then full</text>

  <line x1="220" y1="368.301887" x2="240" y2="368.301887" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="368.301887" x2="440" y2="368.301887" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="368.301887" x2="640" y2="368.301887" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="368.301887" x2="840" y2="368.301887" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1020" y1="368.301887" x2="1040" y2="368.301887" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

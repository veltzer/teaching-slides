<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,36 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="294.9999" width="160.9756" height="157.5001" rx="6.0013" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="120.4879" y="389.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5648">Code Push</text>
  <rect x="244.8781" y="294.9999" width="160.9756" height="157.5001" rx="6.0013" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="325.3659" y="389.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5648">Build Image</text>
  <rect x="449.7561" y="294.9999" width="160.9756" height="157.5001" rx="6.0013" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="530.2439" y="389.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5648">Run Tests</text>
  <rect x="654.6341" y="294.9999" width="175.6098" height="157.5001" rx="6.0013" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="742.4391" y="389.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5648">Security Scan</text>
  <rect x="874.1464" y="294.9999" width="160.9756" height="157.5001" rx="6.0013" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="954.6341" y="389.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5648">Push Registry</text>
  <rect x="1079.0244" y="294.9999" width="160.9756" height="157.5001" rx="6.0013" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1159.5121" y="389.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5648">Deploy</text>
  <line x1="200.9756" y1="372" x2="241.9512" y2="372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="405.8536" y1="372" x2="446.8293" y2="372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="610.7318" y1="372" x2="651.7074" y2="372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="830.2439" y1="372" x2="871.2195" y2="372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1035.1219" y1="372" x2="1076.0976" y2="372" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="325.3659" y="207.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1011" fill="var(--primary-accent)" font-weight="bold">CI</text>
  <line x1="244.8781" y1="224.9999" x2="830.2439" y2="224.9999" stroke="var(--primary-border)" stroke-width="1.5059" stroke-dasharray="4.5176" />
  <text x="1057.0732" y="207.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.1011" fill="var(--ok-accent)" font-weight="bold">CD</text>
  <line x1="874.1464" y1="224.9999" x2="1240" y2="224.9999" stroke="var(--ok-border)" stroke-width="1.5059" stroke-dasharray="4.5176" />
</svg>
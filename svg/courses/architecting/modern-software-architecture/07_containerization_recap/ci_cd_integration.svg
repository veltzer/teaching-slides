<svg viewBox="0 0 850 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Pipeline steps -->
  <rect x="20" y="70" width="110" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="75" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Code Push</text>
  <rect x="160" y="70" width="110" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="215" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Build Image</text>
  <rect x="300" y="70" width="110" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="355" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Run Tests</text>
  <rect x="440" y="70" width="120" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="500" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Security Scan</text>
  <rect x="590" y="70" width="110" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="645" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Push Registry</text>
  <rect x="730" y="70" width="110" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="785" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Deploy</text>
  <!-- Arrows -->
  <line x1="130" y1="92" x2="158" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="270" y1="92" x2="298" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="92" x2="438" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="560" y1="92" x2="588" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="92" x2="728" y2="92" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Labels -->
  <text x="215" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4a90e2" font-weight="bold">CI</text>
  <line x1="160" y1="50" x2="560" y2="50" stroke="#4a90e2" stroke-width="1" stroke-dasharray="3"/>
  <text x="715" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745" font-weight="bold">CD</text>
  <line x1="590" y1="50" x2="840" y2="50" stroke="#28a745" stroke-width="1" stroke-dasharray="3"/>
</svg>

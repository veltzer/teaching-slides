<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Divider -->
  <line x1="640" y1="30" x2="640" y2="650" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- === LEFT: Virtual Machines === -->
  <text x="320" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#212121">Virtual Machine Stack</text>
  <!-- Three VMs side by side -->
  <!-- VM 1 -->
  <rect x="50" y="68" width="175" height="370" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="68" width="175" height="30" rx="6" fill="#f9a825"/>
  <rect x="50" y="86" width="175" height="12" fill="#f9a825"/>
  <text x="137" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">VM 1</text>
  <rect x="62" y="107" width="151" height="30" rx="4" fill="#e3f2fd"/>
  <text x="137" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App A</text>
  <rect x="62" y="143" width="151" height="30" rx="4" fill="#bbdefb"/>
  <text x="137" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App Libraries</text>
  <rect x="62" y="179" width="151" height="44" rx="4" fill="#90caf9"/>
  <text x="137" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Guest OS</text>
  <text x="137" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Linux/Windows</text>
  <rect x="62" y="229" width="151" height="44" rx="4" fill="#64b5f6"/>
  <text x="137" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Virtual Hardware</text>
  <text x="137" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">vCPU, vRAM, vDisk</text>
  <!-- VM 2 -->
  <rect x="238" y="68" width="175" height="370" rx="6" fill="#fff9c4" stroke="#f9a825" stroke-width="2" filter="url(#shadow)"/>
  <rect x="238" y="68" width="175" height="30" rx="6" fill="#f9a825"/>
  <rect x="238" y="86" width="175" height="12" fill="#f9a825"/>
  <text x="325" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">VM 2</text>
  <rect x="250" y="107" width="151" height="30" rx="4" fill="#e8f5e9"/>
  <text x="325" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App B</text>
  <rect x="250" y="143" width="151" height="30" rx="4" fill="#c8e6c9"/>
  <text x="325" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App Libraries</text>
  <rect x="250" y="179" width="151" height="44" rx="4" fill="#a5d6a7"/>
  <text x="325" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Guest OS</text>
  <text x="325" y="213" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">Linux/Windows</text>
  <rect x="250" y="229" width="151" height="44" rx="4" fill="#81c784"/>
  <text x="325" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Virtual Hardware</text>
  <text x="325" y="263" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">vCPU, vRAM, vDisk</text>
  <!-- Hypervisor -->
  <rect x="50" y="448" width="363" height="44" rx="6" fill="#ff7043" filter="url(#shadow)"/>
  <text x="231" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Hypervisor (VMware / KVM / Hyper-V)</text>
  <!-- Host OS -->
  <rect x="50" y="500" width="363" height="44" rx="6" fill="#bf360c"/>
  <text x="231" y="528" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Host OS (Linux / Windows)</text>
  <!-- Physical Hardware -->
  <rect x="50" y="552" width="363" height="44" rx="6" fill="#4e342e"/>
  <text x="231" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Physical Hardware</text>
  <!-- VM labels -->
  <text x="231" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">Each VM: full OS copy (~GBs, minutes to start)</text>
  <!-- === RIGHT: Containers === -->
  <text x="960" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#212121">Container Stack</text>
  <!-- Three containers -->
  <!-- Container 1 -->
  <rect x="660" y="68" width="175" height="230" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="68" width="175" height="30" rx="6" fill="#1565c0"/>
  <rect x="660" y="86" width="175" height="12" fill="#1565c0"/>
  <text x="747" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Container A</text>
  <rect x="672" y="107" width="151" height="30" rx="4" fill="#e3f2fd"/>
  <text x="747" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App A</text>
  <rect x="672" y="143" width="151" height="30" rx="4" fill="#bbdefb"/>
  <text x="747" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App Libraries</text>
  <rect x="672" y="179" width="151" height="30" rx="4" fill="#90caf9"/>
  <text x="747" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Container Image</text>
  <text x="747" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">No OS copy needed</text>
  <!-- Container 2 -->
  <rect x="848" y="68" width="175" height="230" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" filter="url(#shadow)"/>
  <rect x="848" y="68" width="175" height="30" rx="6" fill="#2e7d32"/>
  <rect x="848" y="86" width="175" height="12" fill="#2e7d32"/>
  <text x="935" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Container B</text>
  <rect x="860" y="107" width="151" height="30" rx="4" fill="#e8f5e9"/>
  <text x="935" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App B</text>
  <rect x="860" y="143" width="151" height="30" rx="4" fill="#c8e6c9"/>
  <text x="935" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App Libraries</text>
  <rect x="860" y="179" width="151" height="30" rx="4" fill="#a5d6a7"/>
  <text x="935" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Container Image</text>
  <text x="935" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">No OS copy needed</text>
  <!-- Container 3 -->
  <rect x="1036" y="68" width="175" height="230" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1036" y="68" width="175" height="30" rx="6" fill="#e65100"/>
  <rect x="1036" y="86" width="175" height="12" fill="#e65100"/>
  <text x="1123" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Container C</text>
  <rect x="1048" y="107" width="151" height="30" rx="4" fill="#fff3e0"/>
  <text x="1123" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App C</text>
  <rect x="1048" y="143" width="151" height="30" rx="4" fill="#ffe0b2"/>
  <text x="1123" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">App Libraries</text>
  <rect x="1048" y="179" width="151" height="30" rx="4" fill="#ffcc80"/>
  <text x="1123" y="199" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#212121">Container Image</text>
  <text x="1123" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#555555">No OS copy needed</text>
  <!-- Container Runtime -->
  <rect x="660" y="308" width="551" height="44" rx="6" fill="#1565c0" filter="url(#shadow)"/>
  <text x="935" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Container Runtime (Docker / containerd)</text>
  <!-- Shared Host OS -->
  <rect x="660" y="360" width="551" height="44" rx="6" fill="#1e88e5"/>
  <text x="935" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Host OS Kernel (shared)</text>
  <!-- Physical Hardware -->
  <rect x="660" y="412" width="551" height="44" rx="6" fill="#0d47a1"/>
  <text x="935" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Physical Hardware</text>
  <text x="935" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#555555">Each container: MBs, starts in milliseconds</text>
  <!-- Comparison table -->
  <rect x="30" y="510" width="1220" height="105" rx="8" fill="#f2f2f2"/>
  <text x="640" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#212121">Comparison</text>
  <text x="120" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121">Aspect</text>
  <text x="385" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#f9a825">Virtual Machine</text>
  <text x="700" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Container</text>
  <text x="120" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Startup time</text>
  <text x="385" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Minutes</text>
  <text x="700" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Milliseconds</text>
  <text x="950" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121">Aspect</text>
  <text x="1150" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#212121">Difference</text>
  <text x="950" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Image size</text>
  <text x="1150" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">GBs vs MBs</text>
  <text x="120" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Isolation</text>
  <text x="385" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Full hardware isolation</text>
  <text x="700" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">OS-level isolation</text>
  <text x="950" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Density</text>
  <text x="1150" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">10s vs 100s per host</text>
</svg>

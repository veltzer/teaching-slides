<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <line x1="640" y1="40" x2="640" y2="620" stroke="var(--border)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- VM Stack -->
  <text x="310" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Virtual Machines</text>

  <rect x="60" y="85" width="170" height="300" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">VM 1</text>
  <text x="145" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">App A</text>
  <text x="145" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Libraries</text>
  <text x="145" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Guest OS</text>
  <text x="145" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Virtual HW</text>

  <rect x="245" y="85" width="170" height="300" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="330" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">VM 2</text>
  <text x="330" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">App B</text>
  <text x="330" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Libraries</text>
  <text x="330" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Guest OS</text>
  <text x="330" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Virtual HW</text>

  <rect x="60" y="400" width="355" height="40" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="237" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--danger-text)">Hypervisor</text>

  <rect x="60" y="450" width="355" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="237" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Host OS</text>

  <rect x="60" y="500" width="355" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="237" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Physical Hardware</text>

  <text x="237" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-muted)">GBs; minutes to start</text>

  <!-- Container Stack -->
  <text x="955" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="var(--text)">Containers</text>

  <rect x="665" y="85" width="170" height="200" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="750" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Container A</text>
  <text x="750" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">App A</text>
  <text x="750" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Libraries</text>
  <text x="750" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-text)">Image layers</text>

  <rect x="850" y="85" width="170" height="200" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--ok-text)">Container B</text>
  <text x="935" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">App B</text>
  <text x="935" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Libraries</text>
  <text x="935" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-text)">Image layers</text>

  <rect x="1035" y="85" width="170" height="200" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--warn-text)">Container C</text>
  <text x="1120" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">App C</text>
  <text x="1120" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Libraries</text>
  <text x="1120" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-text)">Image layers</text>

  <rect x="665" y="300" width="540" height="40" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--primary-text)">Container Runtime</text>

  <rect x="665" y="350" width="540" height="40" rx="6" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="935" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--info-text)">Host OS Kernel (shared)</text>

  <rect x="665" y="400" width="540" height="40" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="935" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Physical Hardware</text>

  <text x="935" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="var(--text-muted)">MBs; starts in milliseconds</text>

  <!-- Comparison -->
  <rect x="40" y="545" width="1200" height="75" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">VM: minutes, full isolation, GBs • Container: ms, shared kernel, MBs</text>
  <text x="640" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Density: tens vs hundreds per host</text>
</svg>

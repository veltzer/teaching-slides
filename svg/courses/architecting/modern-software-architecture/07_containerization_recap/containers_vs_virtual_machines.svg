<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="40" y="40" width="543.9999" height="580" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5556" />
  <text x="312" y="77.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.055" fill="var(--danger-accent)" font-weight="bold">Virtual Machines</text>
  <rect x="88.0001" y="489.0323" width="448" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312" y="535.8064" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471">Hardware</text>
  <rect x="88.0001" y="395.4839" width="448" height="74.8387" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="312" y="442.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471" font-weight="bold">Hypervisor</text>
  <rect x="88.0001" y="208.3871" width="208" height="159.0323" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="192.0001" y="273.871" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432">Guest OS</text>
  <text x="192.0001" y="311.2903" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432">+ App 1</text>
  <text x="192.0001" y="189.6774" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0392" fill="var(--text-faint)">VM</text>
  <rect x="328" y="208.3871" width="208" height="159.0323" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="432" y="273.871" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432">Guest OS</text>
  <text x="432" y="311.2903" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432">+ App 2</text>
  <text x="432" y="189.6774" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0392" fill="var(--text-faint)">VM</text>
  <rect x="664" y="40" width="576" height="580" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5556" />
  <text x="952" y="77.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.055" fill="var(--ok-accent)" font-weight="bold">Containers</text>
  <rect x="712.0001" y="489.0323" width="480" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="535.8064" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471">Hardware</text>
  <rect x="712.0001" y="395.4839" width="480" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="442.2581" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471">Host OS</text>
  <rect x="712.0001" y="301.9355" width="480" height="74.8387" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="348.7096" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0471" font-weight="bold">Container Runtime</text>
  <rect x="712.0001" y="152.2581" width="144" height="121.6129" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="784.0001" y="221.4839" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432">App 1</text>
  <rect x="880" y="152.2581" width="144" height="121.6129" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="952" y="221.4839" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432">App 2</text>
  <rect x="1048" y="152.2581" width="144" height="121.6129" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="221.4839" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5432">App 3</text>
</svg>
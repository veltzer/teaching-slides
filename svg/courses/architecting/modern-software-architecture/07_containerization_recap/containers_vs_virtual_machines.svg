<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <rect x="45.3333" y="20" width="513.7777" height="620" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5556" />
  <text x="302.2222" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1556" fill="var(--danger-accent)" font-weight="bold">Virtual Machines</text>
  <rect x="90.6667" y="500" width="423.1111" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="302.2222" y="549.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1333">Hardware</text>
  <rect x="90.6667" y="400" width="423.1111" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="302.2222" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1333" font-weight="bold">Hypervisor</text>
  <rect x="90.6667" y="200" width="196.4444" height="170" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="188.8889" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6222">Guest OS</text>
  <text x="188.8889" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6222">+ App 1</text>
  <text x="188.8889" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1111" fill="var(--text-faint)">VM</text>
  <rect x="317.3333" y="200" width="196.4444" height="170" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="415.5555" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6222">Guest OS</text>
  <text x="415.5555" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6222">+ App 2</text>
  <text x="415.5555" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.1111" fill="var(--text-faint)">VM</text>
  <rect x="634.6666" y="20" width="544" height="620" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="7.5556" />
  <text x="906.6666" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.1556" fill="var(--ok-accent)" font-weight="bold">Containers</text>
  <rect x="680" y="500" width="453.3333" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="906.6666" y="549.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1333">Hardware</text>
  <rect x="680" y="400" width="453.3333" height="80" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="906.6666" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1333">Host OS</text>
  <rect x="680" y="300" width="453.3333" height="80" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="906.6666" y="349.9999" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1333" font-weight="bold">Container Runtime</text>
  <rect x="680" y="140" width="136" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="748" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6222">App 1</text>
  <rect x="838.6666" y="140" width="136" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="906.6666" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6222">App 2</text>
  <rect x="997.3333" y="140" width="136" height="130" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1065.3333" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.6222">App 3</text>
</svg>
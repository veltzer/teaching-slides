<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <!-- VM Side -->
  <rect x="30" y="10" width="340" height="310" rx="5" fill="none" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dc3545" font-weight="bold">Virtual Machines</text>
  <!-- VM stack -->
  <rect x="60" y="250" width="280" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="200" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Hardware</text>
  <rect x="60" y="200" width="280" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="200" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Hypervisor</text>
  <rect x="60" y="100" width="130" height="85" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="125" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Guest OS</text>
  <text x="125" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">+ App 1</text>
  <text x="125" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">VM</text>
  <rect x="210" y="100" width="130" height="85" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="275" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Guest OS</text>
  <text x="275" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">+ App 2</text>
  <text x="275" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">VM</text>
  <!-- Container Side -->
  <rect x="420" y="10" width="360" height="310" rx="5" fill="none" stroke="#28a745" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#28a745" font-weight="bold">Containers</text>
  <rect x="450" y="250" width="300" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="600" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Hardware</text>
  <rect x="450" y="200" width="300" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="600" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Host OS</text>
  <rect x="450" y="150" width="300" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="600" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Container Runtime</text>
  <rect x="450" y="70" width="90" height="65" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="495" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">App 1</text>
  <rect x="555" y="70" width="90" height="65" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="600" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">App 2</text>
  <rect x="660" y="70" width="90" height="65" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="705" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">App 3</text>
</svg>

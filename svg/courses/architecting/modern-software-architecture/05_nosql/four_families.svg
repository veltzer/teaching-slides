<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>

  <rect x="40" y="40" width="589.655172413793" height="279.259259259259" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.324555320337" filter="url(#shadow)"/>
  <text x="334.827586206897" y="88.333333333333" text-anchor="middle" font-size="31.622776601684" font-family="Arial, sans-serif" fill="var(--primary-text)">Key-Value</text>
  <text x="334.827586206897" y="131.296296296296" text-anchor="middle" font-size="21.081851067789" font-family="Arial, sans-serif" fill="var(--primary-text)">opaque value under a key</text>
  <text x="334.827586206897" y="179.62962962963" text-anchor="middle" font-size="23.190036174568" font-family="Courier New, monospace" fill="var(--primary-text)">SET user:42 "Alice"</text>
  <text x="334.827586206897" y="217.222222222222" text-anchor="middle" font-size="23.190036174568" font-family="Courier New, monospace" fill="var(--primary-text)">GET user:42</text>
  <text x="334.827586206897" y="270.925925925926" text-anchor="middle" font-size="23.190036174568" font-family="Arial, sans-serif" fill="var(--primary-text)">Redis, Memcached,</text>
  <text x="334.827586206897" y="297.777777777778" text-anchor="middle" font-size="23.190036174568" font-family="Arial, sans-serif" fill="var(--primary-text)">DynamoDB, etcd</text>

  <rect x="650.344827586207" y="40" width="589.655172413793" height="279.259259259259" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.324555320337" filter="url(#shadow)"/>
  <text x="945.172413793103" y="88.333333333333" text-anchor="middle" font-size="31.622776601684" font-family="Arial, sans-serif" fill="var(--ok-text)">Document</text>
  <text x="945.172413793103" y="131.296296296296" text-anchor="middle" font-size="21.081851067789" font-family="Arial, sans-serif" fill="var(--ok-text)">self-describing JSON/BSON</text>
  <text x="945.172413793103" y="179.62962962963" text-anchor="middle" font-size="21.081851067789" font-family="Courier New, monospace" fill="var(--ok-text)">{ name: "Alice",</text>
  <text x="945.172413793103" y="211.851851851852" text-anchor="middle" font-size="21.081851067789" font-family="Courier New, monospace" fill="var(--ok-text)">  orders: [ ... ] }</text>
  <text x="945.172413793103" y="270.925925925926" text-anchor="middle" font-size="23.190036174568" font-family="Arial, sans-serif" fill="var(--ok-text)">MongoDB, Couchbase,</text>
  <text x="945.172413793103" y="297.777777777778" text-anchor="middle" font-size="23.190036174568" font-family="Arial, sans-serif" fill="var(--ok-text)">Firestore, DocumentDB</text>

  <rect x="40" y="340.740740740741" width="589.655172413793" height="279.259259259259" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.324555320337" filter="url(#shadow)"/>
  <text x="334.827586206897" y="389.074074074074" text-anchor="middle" font-size="31.622776601684" font-family="Arial, sans-serif" fill="var(--warn-text)">Column-Family</text>
  <text x="334.827586206897" y="432.037037037037" text-anchor="middle" font-size="21.081851067789" font-family="Arial, sans-serif" fill="var(--warn-text)">sparse wide rows, columns grouped by family</text>
  <text x="334.827586206897" y="480.37037037037" text-anchor="middle" font-size="21.081851067789" font-family="Courier New, monospace" fill="var(--warn-text)">user42 { profile: ...,</text>
  <text x="334.827586206897" y="512.592592592593" text-anchor="middle" font-size="21.081851067789" font-family="Courier New, monospace" fill="var(--warn-text)">  events: [t1, t2, ...] }</text>
  <text x="334.827586206897" y="571.666666666667" text-anchor="middle" font-size="23.190036174568" font-family="Arial, sans-serif" fill="var(--warn-text)">Cassandra, HBase,</text>
  <text x="334.827586206897" y="598.518518518518" text-anchor="middle" font-size="23.190036174568" font-family="Arial, sans-serif" fill="var(--warn-text)">ScyllaDB, Bigtable</text>

  <rect x="650.344827586207" y="340.740740740741" width="589.655172413793" height="279.259259259259" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.324555320337" filter="url(#shadow)"/>
  <text x="945.172413793103" y="389.074074074074" text-anchor="middle" font-size="31.622776601684" font-family="Arial, sans-serif" fill="var(--info-text)">Graph</text>
  <text x="945.172413793103" y="432.037037037037" text-anchor="middle" font-size="21.081851067789" font-family="Arial, sans-serif" fill="var(--info-text)">nodes + labeled edges, traversal-first</text>
  <text x="945.172413793103" y="480.37037037037" text-anchor="middle" font-size="21.081851067789" font-family="Courier New, monospace" fill="var(--info-text)">(:User)-[:FOLLOWS]-&gt;(:User)</text>
  <text x="945.172413793103" y="512.592592592593" text-anchor="middle" font-size="21.081851067789" font-family="Courier New, monospace" fill="var(--info-text)">(:User)-[:BOUGHT]-&gt;(:Item)</text>
  <text x="945.172413793103" y="571.666666666667" text-anchor="middle" font-size="23.190036174568" font-family="Arial, sans-serif" fill="var(--info-text)">Neo4j, JanusGraph,</text>
  <text x="945.172413793103" y="598.518518518518" text-anchor="middle" font-size="23.190036174568" font-family="Arial, sans-serif" fill="var(--info-text)">Neptune, ArangoDB</text>

  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

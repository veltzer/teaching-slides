<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>

  <text x="640" y="40" text-anchor="middle" font-size="24.410286130349" font-family="Arial, sans-serif" fill="var(--text-muted)">Match the family to the dominant access pattern — not to hype</text>

  <rect x="40" y="80" width="248.275862068966" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.102571532587" filter="url(#shadow)"/>
  <text x="164.137931034483" y="120" text-anchor="middle" font-size="24.410286130349" font-family="Arial, sans-serif" fill="var(--primary-text)">Family</text>
  <rect x="288.275862068966" y="80" width="475.862068965517" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.102571532587" filter="url(#shadow)"/>
  <text x="526.206896551724" y="120" text-anchor="middle" font-size="24.410286130349" font-family="Arial, sans-serif" fill="var(--primary-text)">Pick When</text>
  <rect x="764.137931034483" y="80" width="475.862068965517" height="60" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.102571532587" filter="url(#shadow)"/>
  <text x="1002.068965517241" y="120" text-anchor="middle" font-size="24.410286130349" font-family="Arial, sans-serif" fill="var(--primary-text)">Avoid When</text>

  <rect x="40" y="150" width="248.275862068966" height="110" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.102571532587" filter="url(#shadow)"/>
  <text x="164.137931034483" y="210" text-anchor="middle" font-size="22.376095619487" font-family="Arial, sans-serif" fill="var(--ok-text)">Key-Value</text>
  <rect x="288.275862068966" y="150" width="475.862068965517" height="110" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.102571532587"/>
  <text x="308.965517241379" y="185" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">caches, sessions, rate limits,</text>
  <text x="308.965517241379" y="215" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">leaderboards, counters,</text>
  <text x="308.965517241379" y="245" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">single-key lookups &lt;1ms</text>
  <rect x="764.137931034483" y="150" width="475.862068965517" height="110" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.102571532587"/>
  <text x="784.827586206897" y="185" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">need secondary queries,</text>
  <text x="784.827586206897" y="215" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">aggregations, or range scans</text>
  <text x="784.827586206897" y="245" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">across many keys</text>

  <rect x="40" y="270" width="248.275862068966" height="110" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.102571532587" filter="url(#shadow)"/>
  <text x="164.137931034483" y="330" text-anchor="middle" font-size="22.376095619487" font-family="Arial, sans-serif" fill="var(--info-text)">Document</text>
  <rect x="288.275862068966" y="270" width="475.862068965517" height="110" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.102571532587"/>
  <text x="308.965517241379" y="305" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">aggregate-oriented reads,</text>
  <text x="308.965517241379" y="335" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">flexible / evolving schema,</text>
  <text x="308.965517241379" y="365" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">nested entities fetched together</text>
  <rect x="764.137931034483" y="270" width="475.862068965517" height="110" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.102571532587"/>
  <text x="784.827586206897" y="305" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">many-to-many relationships,</text>
  <text x="784.827586206897" y="335" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">cross-document transactions,</text>
  <text x="784.827586206897" y="365" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">complex joins</text>

  <rect x="40" y="390" width="248.275862068966" height="110" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.102571532587" filter="url(#shadow)"/>
  <text x="164.137931034483" y="435" text-anchor="middle" font-size="20.341905108624" font-family="Arial, sans-serif" fill="var(--warn-text)">Column-Family</text>
  <text x="164.137931034483" y="465" text-anchor="middle" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--warn-text)">(wide-column)</text>
  <rect x="288.275862068966" y="390" width="475.862068965517" height="110" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.102571532587"/>
  <text x="308.965517241379" y="425" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">time-series, event logs,</text>
  <text x="308.965517241379" y="455" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">write-heavy at massive scale,</text>
  <text x="308.965517241379" y="485" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">predictable query-by-key</text>
  <rect x="764.137931034483" y="390" width="475.862068965517" height="110" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.102571532587"/>
  <text x="784.827586206897" y="425" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">ad-hoc queries,</text>
  <text x="784.827586206897" y="455" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">need strong consistency on reads,</text>
  <text x="784.827586206897" y="485" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">small dataset (overkill)</text>

  <rect x="40" y="510" width="248.275862068966" height="110" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.102571532587" filter="url(#shadow)"/>
  <text x="164.137931034483" y="570" text-anchor="middle" font-size="22.376095619487" font-family="Arial, sans-serif" fill="var(--danger-text)">Graph</text>
  <rect x="288.275862068966" y="510" width="475.862068965517" height="110" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.102571532587"/>
  <text x="308.965517241379" y="545" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">social networks, fraud detection,</text>
  <text x="308.965517241379" y="575" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">recommendation engines,</text>
  <text x="308.965517241379" y="605" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">multi-hop traversals</text>
  <rect x="764.137931034483" y="510" width="475.862068965517" height="110" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6.102571532587"/>
  <text x="784.827586206897" y="545" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">flat record storage,</text>
  <text x="784.827586206897" y="575" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">high-volume write throughput,</text>
  <text x="784.827586206897" y="605" font-size="18.307714597762" font-family="Arial, sans-serif" fill="var(--text)">simple key lookups suffice</text>

  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

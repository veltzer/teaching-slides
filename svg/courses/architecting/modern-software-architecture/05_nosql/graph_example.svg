  <rect x="86.153846153846" y="578.571428571429" width="1153.846153846154" height="41.428571428571" fill="var(--code-bg)" stroke="var(--border)" stroke-width="1" rx="6.559114118688"/>
  <text x="663.076923076923" y="607.571428571429" text-anchor="middle" font-size="21.863713728961" font-family="Courier New, monospace" fill="var(--bg)">MATCH (a:User)-[:FOLLOWS]-&gt;(b)-[:BOUGHT]-&gt;(i:Item) WHERE a.name='Alice' RETURN i</text>

  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>

  <text x="706.666666666667" y="40" text-anchor="middle" font-size="29.944870252367" font-family="Arial, sans-serif" fill="var(--text)">Stronger consistency costs more latency and availability</text>

  <rect x="173.333333333333" y="94.716981132075" width="1066.666666666667" height="87.547169811321" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" rx="6.910354673623" filter="url(#shadow)"/>
  <text x="706.666666666667" y="136.301886792453" text-anchor="middle" font-size="29.944870252367" font-family="Arial, sans-serif" fill="var(--primary-text)">Strong / Linearizable</text>
  <text x="706.666666666667" y="169.132075471698" text-anchor="middle" font-size="20.73106402087" font-family="Arial, sans-serif" fill="var(--primary-text)">every read returns the latest committed write — as if one global copy</text>

  <rect x="173.333333333333" y="204.150943396226" width="1066.666666666667" height="87.547169811321" fill="url(#grad-info)" stroke="var(--info-border)" stroke-width="2" rx="6.910354673623" filter="url(#shadow)"/>
  <text x="706.666666666667" y="245.735849056604" text-anchor="middle" font-size="29.944870252367" font-family="Arial, sans-serif" fill="var(--info-text)">Causal</text>
  <text x="706.666666666667" y="278.566037735849" text-anchor="middle" font-size="20.73106402087" font-family="Arial, sans-serif" fill="var(--info-text)">writes causally related to reads are seen in order; independent ones may not be</text>

  <rect x="173.333333333333" y="313.584905660377" width="1066.666666666667" height="87.547169811321" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" rx="6.910354673623" filter="url(#shadow)"/>
  <text x="706.666666666667" y="355.169811320755" text-anchor="middle" font-size="29.944870252367" font-family="Arial, sans-serif" fill="var(--ok-text)">Read-Your-Writes</text>
  <text x="706.666666666667" y="388" text-anchor="middle" font-size="20.73106402087" font-family="Arial, sans-serif" fill="var(--ok-text)">a client always sees its own writes; other clients may not yet</text>

  <rect x="173.333333333333" y="423.018867924528" width="1066.666666666667" height="87.547169811321" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" rx="6.910354673623" filter="url(#shadow)"/>
  <text x="706.666666666667" y="464.603773584906" text-anchor="middle" font-size="29.944870252367" font-family="Arial, sans-serif" fill="var(--warn-text)">Monotonic Reads</text>
  <text x="706.666666666667" y="497.433962264151" text-anchor="middle" font-size="20.73106402087" font-family="Arial, sans-serif" fill="var(--warn-text)">successive reads never go backward in time</text>

  <rect x="173.333333333333" y="532.452830188679" width="1066.666666666667" height="87.547169811321" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" rx="6.910354673623" filter="url(#shadow)"/>
  <text x="706.666666666667" y="574.037735849057" text-anchor="middle" font-size="29.944870252367" font-family="Arial, sans-serif" fill="var(--danger-text)">Eventual</text>
  <text x="706.666666666667" y="606.867924528302" text-anchor="middle" font-size="20.73106402087" font-family="Arial, sans-serif" fill="var(--danger-text)">all replicas converge if writes stop — no ordering guarantees meanwhile</text>

  <text x="40" y="138.490566037736" text-anchor="middle" font-size="23.034515578744" font-family="Arial, sans-serif" fill="var(--text-muted)">Strong</text>
  <text x="40" y="587.169811320755" text-anchor="middle" font-size="23.034515578744" font-family="Arial, sans-serif" fill="var(--text-muted)">Weak</text>
  <line x1="40" y1="149.433962264151" x2="40" y2="576.22641509434" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
</svg>

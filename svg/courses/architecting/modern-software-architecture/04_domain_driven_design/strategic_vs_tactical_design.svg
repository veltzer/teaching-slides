<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <rect x="483.8356" y="40" width="328.7671" height="76.7648" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.2192" y="87.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6491" font-weight="bold" fill="var(--primary-text)">Domain-Driven Design</text>
  <rect x="155.0685" y="193.5294" width="295.8904" height="76.7648" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="303.0137" y="241.2941" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0313" font-weight="bold" fill="var(--ok-text)">Strategic Design</text>
  <rect x="845.4795" y="193.5294" width="295.8904" height="76.7648" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="993.4247" y="241.2941" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0313" font-weight="bold" fill="var(--warn-text)">Tactical Design</text>
  <line x1="566.0274" y1="116.7648" x2="368.7671" y2="190.1177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="730.411" y1="116.7648" x2="927.6712" y2="190.1177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="347.0588" width="263.0137" height="68.2353" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.5068" y="389.7059" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135" fill="var(--ok-text)">Bounded Contexts</text>
  <rect x="40" y="449.4118" width="263.0137" height="68.2353" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.5068" y="492.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135" fill="var(--ok-text)">Ubiquitous Language</text>
  <rect x="40" y="551.7647" width="263.0137" height="68.2353" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="171.5068" y="594.4118" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135" fill="var(--ok-text)">Context Mapping</text>
  <line x1="303.0137" y1="270.2942" x2="220.8219" y2="343.6471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="303.0137" y1="270.2942" x2="204.3836" y2="446" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="303.0137" y1="270.2942" x2="187.9452" y2="548.353" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="763.2877" y="347.0588" width="213.6986" height="68.2353" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870.137" y="389.7059" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135" fill="var(--warn-text)">Entities</text>
  <rect x="1009.863" y="347.0588" width="230.137" height="68.2353" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9315" y="389.7059" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135" fill="var(--warn-text)">Value Objects</text>
  <rect x="763.2877" y="483.5295" width="213.6986" height="68.2353" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870.137" y="526.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135" fill="var(--warn-text)">Aggregates</text>
  <rect x="1009.863" y="483.5295" width="230.137" height="68.2353" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1124.9315" y="526.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135" fill="var(--warn-text)">Services</text>
  <line x1="944.1096" y1="270.2942" x2="878.3562" y2="343.6471" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1026.3014" y1="270.2942" x2="1108.4932" y2="343.6471" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="944.1096" y1="270.2942" x2="878.3562" y2="480.1177" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1026.3014" y1="270.2942" x2="1108.4932" y2="480.1177" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
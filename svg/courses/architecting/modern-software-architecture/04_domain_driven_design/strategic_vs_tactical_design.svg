<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- DDD Root -->
  <rect x="300" y="20" width="200" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Domain-Driven Design</text>
  <!-- Strategic Design -->
  <rect x="100" y="110" width="180" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="190" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Strategic Design</text>
  <!-- Tactical Design -->
  <rect x="520" y="110" width="180" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="610" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Tactical Design</text>
  <!-- Arrows from DDD -->
  <line x1="350" y1="65" x2="230" y2="108" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="65" x2="570" y2="108" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Strategic children -->
  <rect x="30" y="200" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="110" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Bounded Contexts</text>
  <rect x="30" y="260" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="110" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Ubiquitous Language</text>
  <rect x="30" y="320" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="110" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Context Mapping</text>
  <!-- Arrows from Strategic -->
  <line x1="190" y1="155" x2="140" y2="198" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="155" x2="130" y2="258" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="155" x2="120" y2="318" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Tactical children -->
  <rect x="470" y="200" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="535" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Entities</text>
  <rect x="620" y="200" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="690" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Value Objects</text>
  <rect x="470" y="280" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="535" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Aggregates</text>
  <rect x="620" y="280" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="690" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Services</text>
  <!-- Arrows from Tactical -->
  <line x1="580" y1="155" x2="540" y2="198" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="155" x2="680" y2="198" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="155" x2="540" y2="278" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="155" x2="680" y2="278" stroke="#ffc107" stroke-width="1.5" marker-end="url(#arrowhead)"/>
</svg>

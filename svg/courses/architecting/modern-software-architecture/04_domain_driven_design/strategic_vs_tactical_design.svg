<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="483.8356" y="40" width="328.7671" height="76.7648" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="648.2192" y="87.7647" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6491" font-weight="bold">Domain-Driven Design</text>
  <rect x="155.0685" y="193.5294" width="295.8904" height="76.7648" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="303.0137" y="241.2941" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0313" font-weight="bold">Strategic Design</text>
  <rect x="845.4795" y="193.5294" width="295.8904" height="76.7648" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="993.4247" y="241.2941" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0313" font-weight="bold">Tactical Design</text>
  <line x1="566.0274" y1="116.7648" x2="368.7671" y2="190.1177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="730.411" y1="116.7648" x2="927.6712" y2="190.1177" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="347.0588" width="263.0137" height="68.2353" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="171.5068" y="389.7059" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135">Bounded Contexts</text>
  <rect x="40" y="449.4118" width="263.0137" height="68.2353" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="171.5068" y="492.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135">Ubiquitous Language</text>
  <rect x="40" y="551.7647" width="263.0137" height="68.2353" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="171.5068" y="594.4118" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135">Context Mapping</text>
  <line x1="303.0137" y1="270.2942" x2="220.8219" y2="343.6471" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="303.0137" y1="270.2942" x2="204.3836" y2="446" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="303.0137" y1="270.2942" x2="187.9452" y2="548.353" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="763.2877" y="347.0588" width="213.6986" height="68.2353" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="870.137" y="389.7059" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135">Entities</text>
  <rect x="1009.863" y="347.0588" width="230.137" height="68.2353" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1124.9315" y="389.7059" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135">Value Objects</text>
  <rect x="763.2877" y="483.5295" width="213.6986" height="68.2353" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="870.137" y="526.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135">Aggregates</text>
  <rect x="1009.863" y="483.5295" width="230.137" height="68.2353" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1124.9315" y="526.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4135">Services</text>
  <line x1="944.1096" y1="270.2942" x2="878.3562" y2="343.6471" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1026.3014" y1="270.2942" x2="1108.4932" y2="343.6471" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="944.1096" y1="270.2942" x2="878.3562" y2="480.1177" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1026.3014" y1="270.2942" x2="1108.4932" y2="480.1177" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
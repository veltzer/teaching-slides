<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,17.1429 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="480" y="34.2857" width="320" height="77.1429" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="82.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4" font-weight="bold">Domain-Driven Design</text>
  <rect x="160" y="188.5714" width="288" height="77.1429" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="304" y="236.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Strategic Design</text>
  <rect x="832" y="188.5714" width="288" height="77.1429" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="976" y="236.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Tactical Design</text>
  <line x1="560" y1="111.4286" x2="368" y2="185.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="720" y1="111.4286" x2="912" y2="185.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="48" y="342.8571" width="256" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="176" y="385.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Bounded Contexts</text>
  <rect x="48" y="445.7143" width="256" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="176" y="488.5714" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Ubiquitous Language</text>
  <rect x="48" y="548.5714" width="256" height="68.5714" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="176" y="591.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Context Mapping</text>
  <line x1="304" y1="265.7143" x2="224" y2="339.4286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="304" y1="265.7143" x2="208" y2="442.2857" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="304" y1="265.7143" x2="192" y2="545.1429" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="752" y="342.8571" width="208" height="68.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="856" y="385.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Entities</text>
  <rect x="992" y="342.8571" width="224" height="68.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1104" y="385.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Value Objects</text>
  <rect x="752" y="480" width="208" height="68.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="856" y="522.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Aggregates</text>
  <rect x="992" y="480" width="224" height="68.5714" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1104" y="522.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Services</text>
  <line x1="928" y1="265.7143" x2="864" y2="339.4286" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1008" y1="265.7143" x2="1088" y2="339.4286" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="928" y1="265.7143" x2="864" y2="476.5714" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1008" y1="265.7143" x2="1088" y2="476.5714" stroke="var(--warn-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
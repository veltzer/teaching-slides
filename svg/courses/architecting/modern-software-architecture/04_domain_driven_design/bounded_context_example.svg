<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="370.3704" height="543.7501" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="225.1851" y="94.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold" fill="var(--primary-accent)">Sales Context</text>
  <rect x="69.6297" y="130.625" width="311.1111" height="90.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.1851" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold">Customer</text>
  <text x="225.1851" y="199.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">name, email, loyalty tier</text>
  <rect x="69.6297" y="257.5" width="311.1111" height="90.625" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.1851" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold">Order</text>
  <text x="225.1851" y="326.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">items, discounts, total</text>
  <rect x="454.8148" y="40" width="370.3704" height="543.7501" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640" y="94.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold" fill="var(--ok-accent)">Shipping Context</text>
  <rect x="484.4445" y="130.625" width="311.1111" height="90.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold">Customer</text>
  <text x="640" y="199.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">name, shipping address</text>
  <rect x="484.4445" y="257.5" width="311.1111" height="90.625" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold">Shipment</text>
  <text x="640" y="326.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">tracking, carrier, delivery date</text>
  <rect x="869.6296" y="40" width="370.3704" height="543.7501" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1054.8149" y="94.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold" fill="var(--warn-accent)">Billing Context</text>
  <rect x="899.2592" y="130.625" width="311.1111" height="90.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.8149" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold">Customer</text>
  <text x="1054.8149" y="199.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">name, payment method</text>
  <rect x="899.2592" y="257.5" width="311.1111" height="90.625" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.8149" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold">Invoice</text>
  <text x="1054.8149" y="326.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">charges, tax, due date</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.422" fill="var(--text-faint)">Same "Customer" concept has different meaning in each context</text>
</svg>
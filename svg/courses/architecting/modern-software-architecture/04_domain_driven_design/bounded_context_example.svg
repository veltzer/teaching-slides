<svg viewBox="0 0 850 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Sales Context -->
  <rect x="20" y="20" width="250" height="300" rx="8" fill="#f0f7ff" stroke="#4a90e2" stroke-width="2"/>
  <text x="145" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a90e2">Sales Context</text>
  <rect x="40" y="70" width="210" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="145" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Customer</text>
  <text x="145" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">name, email, loyalty tier</text>
  <rect x="40" y="140" width="210" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="145" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Order</text>
  <text x="145" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">items, discounts, total</text>
  <!-- Shipping Context -->
  <rect x="300" y="20" width="250" height="300" rx="8" fill="#f0fff0" stroke="#28a745" stroke-width="2"/>
  <text x="425" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#28a745">Shipping Context</text>
  <rect x="320" y="70" width="210" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="425" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Customer</text>
  <text x="425" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">name, shipping address</text>
  <rect x="320" y="140" width="210" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="425" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Shipment</text>
  <text x="425" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">tracking, carrier, delivery date</text>
  <!-- Billing Context -->
  <rect x="580" y="20" width="250" height="300" rx="8" fill="#fffff0" stroke="#ffc107" stroke-width="2"/>
  <text x="705" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e0a800">Billing Context</text>
  <rect x="600" y="70" width="210" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="705" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Customer</text>
  <text x="705" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">name, payment method</text>
  <rect x="600" y="140" width="210" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="705" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Invoice</text>
  <text x="705" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">charges, tax, due date</text>
  <!-- Note -->
  <text x="425" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Same "Customer" concept has different meaning in each context</text>
</svg>

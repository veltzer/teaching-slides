<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="370.3704" height="543.7501" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="225.1851" y="94.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold" fill="var(--primary-accent)">Sales Context</text>
  <rect x="69.6297" y="130.625" width="311.1111" height="90.625" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.1851" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold" fill="var(--primary-text)">Customer</text>
  <text x="225.1851" y="199.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">name, email, loyalty tier</text>
  <rect x="69.6297" y="257.5" width="311.1111" height="90.625" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="225.1851" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold" fill="var(--primary-text)">Order</text>
  <text x="225.1851" y="326.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">items, discounts, total</text>
  <rect x="454.8148" y="40" width="370.3704" height="543.7501" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="94.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold" fill="var(--ok-accent)">Shipping Context</text>
  <rect x="484.4445" y="130.625" width="311.1111" height="90.625" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold" fill="var(--ok-text)">Customer</text>
  <text x="640" y="199.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">name, shipping address</text>
  <rect x="484.4445" y="257.5" width="311.1111" height="90.625" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold" fill="var(--ok-text)">Shipment</text>
  <text x="640" y="326.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">tracking, carrier, delivery date</text>
  <rect x="869.6296" y="40" width="370.3704" height="543.7501" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1054.8149" y="94.3749" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6282" font-weight="bold" fill="var(--warn-accent)">Billing Context</text>
  <rect x="899.2592" y="130.625" width="311.1111" height="90.625" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.8149" y="166.875" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold" fill="var(--warn-text)">Customer</text>
  <text x="1054.8149" y="199.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">name, payment method</text>
  <rect x="899.2592" y="257.5" width="311.1111" height="90.625" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1054.8149" y="293.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8241" font-weight="bold" fill="var(--warn-text)">Invoice</text>
  <text x="1054.8149" y="326.375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.0201" fill="var(--text-muted)">charges, tax, due date</text>
  <text x="640" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.422" fill="var(--text-faint)">Same "Customer" concept has different meaning in each context</text>
</svg>

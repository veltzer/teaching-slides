<svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Step 1 -->
  <rect x="20" y="50" width="140" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 1</text>
  <text x="90" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Identify Domain</text>
  <text x="90" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Events</text>
  <!-- Arrow 1->2 -->
  <line x1="160" y1="80" x2="188" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Step 2 -->
  <rect x="200" y="50" width="140" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="270" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 2</text>
  <text x="270" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Find Commands</text>
  <!-- Arrow 2->3 -->
  <line x1="340" y1="80" x2="368" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Step 3 -->
  <rect x="380" y="50" width="140" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="450" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 3</text>
  <text x="450" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Identify Aggregates</text>
  <!-- Arrow 3->4 -->
  <line x1="520" y1="80" x2="548" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Step 4 -->
  <rect x="560" y="50" width="140" height="60" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="630" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 4</text>
  <text x="630" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Define Bounded</text>
  <text x="630" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Contexts</text>
  <!-- Arrow 4->5 -->
  <line x1="700" y1="80" x2="728" y2="80" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Step 5 -->
  <rect x="740" y="50" width="140" height="60" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="810" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Step 5</text>
  <text x="810" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Map Context</text>
  <text x="810" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Relationships</text>
</svg>

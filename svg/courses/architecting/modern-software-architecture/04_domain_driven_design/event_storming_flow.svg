<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="220" height="580" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Step 1</text>
  <text x="150" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">Identify</text>
  <text x="150" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">Domain</text>
  <text x="150" y="371.428571" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">Events</text>

  <rect x="280" y="40" width="220" height="580" rx="6.106203" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--warn-text)" font-family="Arial, sans-serif">Step 2</text>
  <text x="390" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">Find</text>
  <text x="390" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)" font-family="Arial, sans-serif">Commands</text>

  <rect x="520" y="40" width="220" height="580" rx="6.106203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Step 3</text>
  <text x="630" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)" font-family="Arial, sans-serif">Identify</text>
  <text x="630" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)" font-family="Arial, sans-serif">Aggregates</text>

  <rect x="760" y="40" width="220" height="580" rx="6.106203" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--primary-text)" font-family="Arial, sans-serif">Step 4</text>
  <text x="870" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)" font-family="Arial, sans-serif">Define</text>
  <text x="870" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)" font-family="Arial, sans-serif">Bounded</text>
  <text x="870" y="371.428571" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)" font-family="Arial, sans-serif">Contexts</text>

  <rect x="1000" y="40" width="240" height="580" rx="6.106203" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--ok-text)" font-family="Arial, sans-serif">Step 5</text>
  <text x="1120" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--ok-text)" font-family="Arial, sans-serif">Map Context</text>
  <text x="1120" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--ok-text)" font-family="Arial, sans-serif">Relationships</text>

  <line x1="260" y1="330" x2="280" y2="330" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="500" y1="330" x2="520" y2="330" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="740" y1="330" x2="760" y2="330" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="980" y1="330" x2="1000" y2="330" stroke="var(--primary-accent)" stroke-width="5" marker-end="url(#arrow)"/>
</svg>

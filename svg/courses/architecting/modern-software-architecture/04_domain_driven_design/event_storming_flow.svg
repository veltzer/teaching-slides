<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/></filter>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="220" height="580" rx="6.106203" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--warn-text)">Step 1</text>
  <text x="150" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">Identify</text>
  <text x="150" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">Domain</text>
  <text x="150" y="371.428571" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">Events</text>

  <rect x="280" y="40" width="220" height="580" rx="6.106203" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--warn-text)">Step 2</text>
  <text x="390" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">Find</text>
  <text x="390" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--warn-text)">Commands</text>

  <rect x="520" y="40" width="220" height="580" rx="6.106203" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--primary-text)">Step 3</text>
  <text x="630" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)">Identify</text>
  <text x="630" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)">Aggregates</text>

  <rect x="760" y="40" width="220" height="580" rx="6.106203" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="870" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--primary-text)">Step 4</text>
  <text x="870" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)">Define</text>
  <text x="870" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)">Bounded</text>
  <text x="870" y="371.428571" text-anchor="middle" font-size="18.318609" fill="var(--primary-text)">Contexts</text>

  <rect x="1000" y="40" width="240" height="580" rx="6.106203" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1120" y="91.785714" text-anchor="middle" font-size="22.389411" font-weight="bold" fill="var(--ok-text)">Step 5</text>
  <text x="1120" y="309.285714" text-anchor="middle" font-size="18.318609" fill="var(--ok-text)">Map Context</text>
  <text x="1120" y="340.357143" text-anchor="middle" font-size="18.318609" fill="var(--ok-text)">Relationships</text>

  <line x1="260" y1="330" x2="280" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="330" x2="520" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="330" x2="760" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="330" x2="1000" y2="330" stroke="var(--text-muted)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,40 4.9778,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="212.5" width="195.3488" height="235" rx="5.9941" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="137.6745" y="310.4167" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7277" font-weight="bold">Step 1</text>
  <text x="137.6745" y="388.7501" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3336">Identify Domain</text>
  <text x="137.6745" y="439.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3336">Events</text>
  <line x1="235.3489" y1="330" x2="274.4187" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="291.1628" y="212.5" width="195.3488" height="235" rx="5.9941" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="388.8373" y="310.4167" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7277" font-weight="bold">Step 2</text>
  <text x="388.8373" y="388.7501" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3336">Find Commands</text>
  <line x1="486.5117" y1="330" x2="525.5815" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="542.3256" y="212.5" width="195.3488" height="235" rx="5.9941" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640" y="310.4167" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7277" font-weight="bold">Step 3</text>
  <text x="640" y="388.7501" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3336">Identify Aggregates</text>
  <line x1="737.6745" y1="330" x2="776.7443" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="793.4884" y="212.5" width="195.3488" height="235" rx="5.9941" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="891.1628" y="310.4167" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7277" font-weight="bold">Step 4</text>
  <text x="891.1628" y="388.7501" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3336">Define Bounded</text>
  <text x="891.1628" y="439.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3336">Contexts</text>
  <line x1="988.8373" y1="330" x2="1027.9071" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1044.6512" y="212.5" width="195.3488" height="235" rx="5.9941" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1142.3256" y="310.4167" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7277" font-weight="bold">Step 5</text>
  <text x="1142.3256" y="388.7501" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3336">Map Context</text>
  <text x="1142.3256" y="439.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3336">Relationships</text>
</svg>
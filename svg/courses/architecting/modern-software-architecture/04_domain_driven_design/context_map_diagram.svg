<svg viewBox="0 0 850 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Sales Context -->
  <rect x="30" y="120" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="110" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Sales Context</text>
  <!-- Shipping Context -->
  <rect x="330" y="50" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="410" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Shipping Context</text>
  <!-- Billing Context -->
  <rect x="330" y="190" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="410" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Billing Context</text>
  <!-- External Payment Provider -->
  <rect x="610" y="190" width="200" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="710" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">External Payment Provider</text>
  <!-- External Carrier API -->
  <rect x="610" y="50" width="200" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="710" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">External Carrier API</text>
  <!-- Arrow: Sales -> Shipping (Customer-Supplier) -->
  <line x1="190" y1="130" x2="328" y2="82" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="240" y="95" font-family="Arial, sans-serif" font-size="11" fill="#555">Customer-Supplier</text>
  <!-- Arrow: Sales -> Billing (Published Language) -->
  <line x1="190" y1="160" x2="328" y2="208" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="230" y="200" font-family="Arial, sans-serif" font-size="11" fill="#555">Published Language</text>
  <!-- Arrow: External Payment -> Billing (ACL) -->
  <line x1="610" y1="215" x2="492" y2="215" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="548" y="208" font-family="Arial, sans-serif" font-size="11" fill="#dc3545" font-weight="bold">ACL</text>
  <!-- Arrow: Shipping -> External Carrier (Conformist) -->
  <line x1="490" y1="75" x2="608" y2="75" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="548" y="65" font-family="Arial, sans-serif" font-size="11" fill="#555">Conformist</text>
</svg>

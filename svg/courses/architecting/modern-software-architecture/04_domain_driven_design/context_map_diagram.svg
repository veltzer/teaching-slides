<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="45.1765" y="288" width="240.9412" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="165.6471" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5765" font-weight="bold">Sales Context</text>
  <rect x="496.9412" y="120" width="240.9412" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="617.4118" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5765" font-weight="bold">Shipping Context</text>
  <rect x="496.9412" y="456" width="240.9412" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="617.4118" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.5765" font-weight="bold">Billing Context</text>
  <rect x="918.5882" y="456" width="301.1765" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1069.1765" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0706">External Payment Provider</text>
  <rect x="918.5882" y="120" width="301.1765" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1069.1765" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.0706">External Carrier API</text>
  <line x1="286.1176" y1="312" x2="493.9294" y2="196.8" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="361.4118" y="228" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--text-muted)">Customer-Supplier</text>
  <line x1="286.1176" y1="384" x2="493.9294" y2="499.2" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="346.3529" y="480" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--text-muted)">Published Language</text>
  <line x1="918.5882" y1="516" x2="740.8941" y2="516" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="825.2235" y="499.2" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--danger-accent)" font-weight="bold">ACL</text>
  <line x1="737.8824" y1="180" x2="915.5765" y2="180" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="825.2235" y="156" font-family="Arial, sans-serif" font-size="16.5647" fill="var(--text-muted)">Conformist</text>
</svg>
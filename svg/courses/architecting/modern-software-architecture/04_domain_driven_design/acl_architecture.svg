<svg viewBox="0 0 850 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- External Context -->
  <rect x="30" y="120" width="160" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="110" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">External Context</text>
  <!-- Anti-Corruption Layer subgraph -->
  <rect x="270" y="30" width="300" height="260" rx="8" fill="#f0f7ff" stroke="#4a90e2" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="420" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a90e2">Anti-Corruption Layer</text>
  <!-- Translator -->
  <rect x="310" y="80" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Translator</text>
  <!-- Adapter -->
  <rect x="310" y="140" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Adapter</text>
  <!-- Facade -->
  <rect x="310" y="200" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Facade</text>
  <!-- Internal Context -->
  <rect x="660" y="120" width="160" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="740" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Internal Context</text>
  <!-- Arrow: External -> ACL -->
  <line x1="190" y1="145" x2="268" y2="145" stroke="#ffc107" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="225" y="137" font-family="Arial, sans-serif" font-size="10" fill="#555">Foreign Model</text>
  <!-- Arrow: ACL -> Internal -->
  <line x1="570" y1="145" x2="658" y2="145" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="608" y="137" font-family="Arial, sans-serif" font-size="10" fill="#555">Domain Model</text>
</svg>

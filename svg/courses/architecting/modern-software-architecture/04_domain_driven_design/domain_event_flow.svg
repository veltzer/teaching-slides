<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 L3,6 Z" fill="#243b59"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="170.2128" height="66.2857" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="125.1064" y="81.4285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5846" font-weight="bold" fill="var(--primary-text)">Order</text>
  <rect x="363.4042" y="40" width="170.2128" height="66.2857" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="448.5107" y="81.4285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5846" font-weight="bold" fill="var(--primary-text)">EventBus</text>
  <rect x="686.8086" y="40" width="170.2128" height="66.2857" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="771.9149" y="81.4285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5846" font-weight="bold" fill="var(--primary-text)">Inventory</text>
  <rect x="1010.2128" y="40" width="187.234" height="66.2857" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1103.8299" y="81.4285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5846" font-weight="bold" fill="var(--primary-text)">Notification</text>
  <line x1="125.1064" y1="106.2857" x2="125.1064" y2="620" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877"/>
  <line x1="448.5107" y1="106.2857" x2="448.5107" y2="620" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877"/>
  <line x1="771.9149" y1="106.2857" x2="771.9149" y2="620" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877"/>
  <line x1="1103.8299" y1="106.2857" x2="1103.8299" y2="620" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877"/>
  <line x1="125.1064" y1="172.5715" x2="445.1064" y2="172.5715" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285.1064" y="160.9715" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4178" fill="var(--text)">OrderPlaced</text>
  <line x1="448.5107" y1="238.8572" x2="768.5107" y2="238.8572" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="608.5106" y="227.2572" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4178" fill="var(--text)">OrderPlaced</text>
  <line x1="448.5107" y1="305.1429" x2="1100.4256" y2="305.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="771.9149" y="293.5428" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4178" fill="var(--text)">OrderPlaced</text>
  <line x1="771.9149" y1="388" x2="451.9149" y2="388" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="608.5106" y="376.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4178" fill="var(--ok-accent)">StockReserved</text>
  <rect x="1120.8511" y="454.2857" width="119.1489" height="82.8572" rx="6" fill="none" stroke="var(--border)" stroke-width="1"/>
  <line x1="1103.8299" y1="470.8571" x2="1120.8511" y2="470.8571" stroke="var(--primary-border)" stroke-width="2"/>
  <line x1="1120.8511" y1="537.1428" x2="1103.8299" y2="537.1428" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="959.149" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8344" fill="var(--text)">Send confirmation email</text>
</svg>

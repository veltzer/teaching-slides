<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Participant headers -->
  <rect x="80" y="20" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="130" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Order</text>
  <rect x="270" y="20" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="320" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">EventBus</text>
  <rect x="460" y="20" width="100" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="510" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Inventory</text>
  <rect x="650" y="20" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="705" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Notification</text>
  <!-- Lifelines -->
  <line x1="130" y1="60" x2="130" y2="370" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="320" y1="60" x2="320" y2="370" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="510" y1="60" x2="510" y2="370" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="705" y1="60" x2="705" y2="370" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <!-- Message 1: Order -> EventBus: OrderPlaced -->
  <line x1="130" y1="100" x2="318" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="224" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">OrderPlaced</text>
  <!-- Message 2: EventBus -> Inventory: OrderPlaced -->
  <line x1="320" y1="140" x2="508" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="414" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">OrderPlaced</text>
  <!-- Message 3: EventBus -> Notification: OrderPlaced -->
  <line x1="320" y1="180" x2="703" y2="180" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="510" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#333">OrderPlaced</text>
  <!-- Message 4: Inventory -> EventBus: StockReserved -->
  <line x1="510" y1="230" x2="322" y2="230" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="414" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745">StockReserved</text>
  <!-- Message 5: Notification self: Send confirmation email -->
  <rect x="715" y="270" width="70" height="50" rx="3" fill="none" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="705" y1="280" x2="715" y2="280" stroke="#4a90e2" stroke-width="2"/>
  <line x1="715" y1="320" x2="705" y2="320" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="620" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Send confirmation email</text>
</svg>

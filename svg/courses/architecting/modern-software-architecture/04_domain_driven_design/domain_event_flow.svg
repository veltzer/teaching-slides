<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="123.003" y="34.5946" width="153.7538" height="69.1892" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="199.8799" y="77.8378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.988" font-weight="bold">Order</text>
  <rect x="415.1351" y="34.5946" width="153.7538" height="69.1892" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="492.012" y="77.8378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.988" font-weight="bold">EventBus</text>
  <rect x="707.2673" y="34.5946" width="153.7538" height="69.1892" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="784.1441" y="77.8378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.988" font-weight="bold">Inventory</text>
  <rect x="999.3994" y="34.5946" width="169.1291" height="69.1892" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1083.964" y="77.8378" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.988" font-weight="bold">Notification</text>
  <line x1="199.8799" y1="103.7838" x2="199.8799" y2="640" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877" />
  <line x1="492.012" y1="103.7838" x2="492.012" y2="640" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877" />
  <line x1="784.1441" y1="103.7838" x2="784.1441" y2="640" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877" />
  <line x1="1083.964" y1="103.7838" x2="1083.964" y2="640" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877" />
  <line x1="199.8799" y1="172.973" x2="488.9369" y2="172.973" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="344.4084" y="160.8649" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9129" fill="var(--text)">OrderPlaced</text>
  <line x1="492.012" y1="242.1622" x2="781.0691" y2="242.1622" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="636.5405" y="230.0541" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9129" fill="var(--text)">OrderPlaced</text>
  <line x1="492.012" y1="311.3514" x2="1080.8889" y2="311.3514" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="784.1441" y="299.2432" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9129" fill="var(--text)">OrderPlaced</text>
  <line x1="784.1441" y1="397.8378" x2="495.0871" y2="397.8378" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="636.5405" y="385.7297" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9129" fill="var(--ok-accent)">StockReserved</text>
  <rect x="1099.3393" y="467.027" width="107.6276" height="86.4865" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <line x1="1083.964" y1="484.3243" x2="1099.3393" y2="484.3243" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1099.3393" y1="553.5135" x2="1083.964" y2="553.5135" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="953.2733" y="518.9189" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.3754" fill="var(--text)">Send confirmation email</text>
</svg>
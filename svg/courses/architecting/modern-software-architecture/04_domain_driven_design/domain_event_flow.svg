<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="170.2128" height="66.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="125.1064" y="81.4285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5846" font-weight="bold">Order</text>
  <rect x="363.4042" y="40" width="170.2128" height="66.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="448.5107" y="81.4285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5846" font-weight="bold">EventBus</text>
  <rect x="686.8086" y="40" width="170.2128" height="66.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="771.9149" y="81.4285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5846" font-weight="bold">Inventory</text>
  <rect x="1010.2128" y="40" width="187.234" height="66.2857" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1103.8299" y="81.4285" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.5846" font-weight="bold">Notification</text>
  <line x1="125.1064" y1="106.2857" x2="125.1064" y2="620" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877" />
  <line x1="448.5107" y1="106.2857" x2="448.5107" y2="620" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877" />
  <line x1="771.9149" y1="106.2857" x2="771.9149" y2="620" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877" />
  <line x1="1103.8299" y1="106.2857" x2="1103.8299" y2="620" stroke="var(--text-faint)" stroke-width="1.5375" stroke-dasharray="7.6877 7.6877" />
  <line x1="125.1064" y1="172.5715" x2="445.1064" y2="172.5715" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="285.1064" y="160.9715" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4178" fill="var(--text)">OrderPlaced</text>
  <line x1="448.5107" y1="238.8572" x2="768.5107" y2="238.8572" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="608.5106" y="227.2572" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4178" fill="var(--text)">OrderPlaced</text>
  <line x1="448.5107" y1="305.1429" x2="1100.4256" y2="305.1429" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="771.9149" y="293.5428" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4178" fill="var(--text)">OrderPlaced</text>
  <line x1="771.9149" y1="388" x2="451.9149" y2="388" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="608.5106" y="376.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4178" fill="var(--ok-accent)">StockReserved</text>
  <rect x="1120.8511" y="454.2857" width="119.1489" height="82.8572" rx="6" fill="none" stroke="var(--border)" stroke-width="1" />
  <line x1="1103.8299" y1="470.8571" x2="1120.8511" y2="470.8571" stroke="var(--primary-border)" stroke-width="2" />
  <line x1="1120.8511" y1="537.1428" x2="1103.8299" y2="537.1428" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="959.149" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8344" fill="var(--text)">Send confirmation email</text>
</svg>
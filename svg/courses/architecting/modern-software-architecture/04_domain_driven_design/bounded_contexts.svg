<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- Header -->
  <rect x="30" y="18" width="1220" height="44" rx="8" fill="url(#grad-accent)"/>
  <text x="640" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Domain-Driven Design — Bounded Context Map</text>
  <!-- Order Context -->
  <rect x="50" y="85" width="270" height="260" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="50" y="85" width="270" height="40" rx="10" fill="#1565c0"/>
  <rect x="50" y="113" width="270" height="12" fill="#1565c0"/>
  <text x="185" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Order Context</text>
  <text x="80" y="150" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Aggregates:</text>
  <rect x="80" y="158" width="210" height="26" rx="4" fill="#ffffff" stroke="#90caf9" stroke-width="1.5"/>
  <text x="185" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Order (root)</text>
  <rect x="80" y="190" width="210" height="26" rx="4" fill="#ffffff" stroke="#90caf9" stroke-width="1.5"/>
  <text x="185" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">OrderLineItem</text>
  <rect x="80" y="222" width="210" height="26" rx="4" fill="#ffffff" stroke="#90caf9" stroke-width="1.5"/>
  <text x="185" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Customer (ref)</text>
  <text x="80" y="270" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Events:</text>
  <text x="80" y="290" font-family="Arial,sans-serif" font-size="13" fill="#555555">OrderPlaced, OrderCancelled</text>
  <text x="80" y="312" font-family="Arial,sans-serif" font-size="13" fill="#555555">Language: "order", "basket"</text>
  <!-- Inventory Context -->
  <rect x="390" y="85" width="270" height="260" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="390" y="85" width="270" height="40" rx="10" fill="#2e7d32"/>
  <rect x="390" y="113" width="270" height="12" fill="#2e7d32"/>
  <text x="525" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Inventory Context</text>
  <text x="420" y="150" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Aggregates:</text>
  <rect x="420" y="158" width="210" height="26" rx="4" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="525" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Product (root)</text>
  <rect x="420" y="190" width="210" height="26" rx="4" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="525" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">StockLevel</text>
  <rect x="420" y="222" width="210" height="26" rx="4" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="525" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Warehouse</text>
  <text x="420" y="270" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Events:</text>
  <text x="420" y="290" font-family="Arial,sans-serif" font-size="13" fill="#555555">StockReserved, StockDepleted</text>
  <text x="420" y="312" font-family="Arial,sans-serif" font-size="13" fill="#555555">Language: "product", "SKU", "bin"</text>
  <!-- Payment Context -->
  <rect x="730" y="85" width="270" height="260" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="730" y="85" width="270" height="40" rx="10" fill="#e65100"/>
  <rect x="730" y="113" width="270" height="12" fill="#e65100"/>
  <text x="865" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Payment Context</text>
  <text x="760" y="150" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Aggregates:</text>
  <rect x="760" y="158" width="210" height="26" rx="4" fill="#ffffff" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="865" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Payment (root)</text>
  <rect x="760" y="190" width="210" height="26" rx="4" fill="#ffffff" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="865" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Invoice</text>
  <rect x="760" y="222" width="210" height="26" rx="4" fill="#ffffff" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="865" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Refund</text>
  <text x="760" y="270" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Events:</text>
  <text x="760" y="290" font-family="Arial,sans-serif" font-size="13" fill="#555555">PaymentAuthorised, RefundIssued</text>
  <text x="760" y="312" font-family="Arial,sans-serif" font-size="13" fill="#555555">Language: "charge", "invoice"</text>
  <!-- Shipping Context -->
  <rect x="1060" y="85" width="185" height="260" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="1060" y="85" width="185" height="40" rx="10" fill="#6a1b9a"/>
  <rect x="1060" y="113" width="185" height="12" fill="#6a1b9a"/>
  <text x="1152" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Shipping</text>
  <text x="1080" y="150" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Aggregates:</text>
  <rect x="1075" y="158" width="150" height="26" rx="4" fill="#ffffff" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="1150" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Shipment</text>
  <rect x="1075" y="190" width="150" height="26" rx="4" fill="#ffffff" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="1150" y="208" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Carrier</text>
  <rect x="1075" y="222" width="150" height="26" rx="4" fill="#ffffff" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="1150" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Tracking</text>
  <text x="1080" y="270" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Events:</text>
  <text x="1080" y="290" font-family="Arial,sans-serif" font-size="12" fill="#555555">Dispatched, Delivered</text>
  <text x="1080" y="312" font-family="Arial,sans-serif" font-size="11" fill="#555555">Language: "parcel"</text>
  <!-- Context Map relationships -->
  <!-- Order → Inventory (Customer/Supplier) -->
  <line x1="320" y1="220" x2="388" y2="220" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <rect x="323" y="200" width="62" height="18" rx="3" fill="#ffffff"/>
  <text x="354" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1565c0">C/S</text>
  <!-- Inventory → Payment (conformist) -->
  <line x1="660" y1="220" x2="728" y2="220" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="663" y="200" width="62" height="18" rx="3" fill="#ffffff"/>
  <text x="694" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">Conform</text>
  <!-- Payment → Shipping -->
  <line x1="1000" y1="220" x2="1058" y2="220" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1003" y="200" width="52" height="18" rx="3" fill="#ffffff"/>
  <text x="1029" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e65100">ACL</text>
  <!-- Order → Shipping (dashed) -->
  <path d="M185,345 L185,430 L1152,430 L1152,348" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="640" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">Order → Shipping: Published Language (order ID)</text>
  <!-- Legend -->
  <rect x="50" y="480" width="1195" height="80" rx="8" fill="#f2f2f2"/>
  <text x="640" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#212121">Context Map Legend</text>
  <line x1="80" y1="525" x2="140" y2="525" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="145" y="529" font-family="Arial,sans-serif" font-size="12" fill="#212121">Customer/Supplier (C/S)</text>
  <line x1="340" y1="525" x2="400" y2="525" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="405" y="529" font-family="Arial,sans-serif" font-size="12" fill="#212121">Conformist</text>
  <line x1="560" y1="525" x2="620" y2="525" stroke="#e65100" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="529" font-family="Arial,sans-serif" font-size="12" fill="#212121">Anti-Corruption Layer (ACL)</text>
  <line x1="850" y1="525" x2="910" y2="525" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="915" y="529" font-family="Arial,sans-serif" font-size="12" fill="#212121">Published Language</text>
  <!-- Bottom note -->
  <text x="640" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#555555">Each context owns its data, its language, and its model — translation happens at boundaries</text>
</svg>

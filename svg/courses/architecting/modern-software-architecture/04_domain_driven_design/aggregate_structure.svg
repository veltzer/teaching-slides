<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="348.5714" y="40" width="891.4286" height="580" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="13.6533 6.8267" />
  <text x="794.2858" y="92.3872" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7959" font-weight="bold" fill="var(--primary-accent)">Order Aggregate</text>
  <rect x="605.7143" y="133.5484" width="377.1429" height="84.1936" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="794.2858" y="185.9355" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0963" font-weight="bold">Order (Aggregate Root)</text>
  <rect x="400" y="320.6452" width="222.8572" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="511.4286" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3965">LineItem 1</text>
  <rect x="674.2857" y="320.6452" width="222.8572" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="785.7143" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3965">LineItem 2</text>
  <rect x="400" y="470.3226" width="257.1428" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="528.5714" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3965">Shipping Address</text>
  <rect x="725.7143" y="470.3226" width="257.1428" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="854.2857" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3965">Payment Method</text>
  <line x1="708.5714" y1="217.7419" x2="554.2857" y2="316.9033" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="828.5714" y1="217.7419" x2="777.1429" y2="316.9033" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="708.5714" y1="217.7419" x2="554.2857" y2="466.5807" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="828.5714" y1="217.7419" x2="845.7143" y2="466.5807" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="189.6775" width="188.5714" height="84.1936" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="134.2857" y="242.0645" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.0963" font-weight="bold">Client</text>
  <line x1="228.5715" y1="223.3548" x2="602.2857" y2="174.7097" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="400" y="180.3226" font-family="Arial, sans-serif" font-size="16.9971" fill="var(--ok-accent)">Access via Root</text>
  <line x1="177.1429" y1="273.871" x2="434.2858" y2="335.613" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.5333 6.8267" marker-end="url(#arrow-danger)" />
  <text x="228.5715" y="339.3549" font-family="Arial, sans-serif" font-size="16.9971" fill="var(--danger-accent)">Cannot access directly</text>
</svg>
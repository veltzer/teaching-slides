<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <!-- Order Aggregate boundary -->
  <rect x="200" y="20" width="520" height="310" rx="10" fill="#f8f9fa" stroke="#4a90e2" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="460" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a90e2">Order Aggregate</text>
  <!-- Aggregate Root -->
  <rect x="350" y="70" width="220" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="460" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Order (Aggregate Root)</text>
  <!-- Children -->
  <rect x="230" y="170" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="295" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">LineItem 1</text>
  <rect x="390" y="170" width="130" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="455" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">LineItem 2</text>
  <rect x="230" y="250" width="150" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="305" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Shipping Address</text>
  <rect x="420" y="250" width="150" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1.5"/>
  <text x="495" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Payment Method</text>
  <!-- Arrows from root to children -->
  <line x1="410" y1="115" x2="320" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="115" x2="450" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="115" x2="320" y2="248" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="480" y1="115" x2="490" y2="248" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Client -->
  <rect x="20" y="100" width="110" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="75" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Client</text>
  <!-- Arrow: Client -> Aggregate Root (Access via) -->
  <line x1="130" y1="118" x2="348" y2="92" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="230" y="95" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Access via Root</text>
  <!-- Dashed red arrow: Client cannot access directly -->
  <line x1="100" y1="145" x2="250" y2="178" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowred)"/>
  <text x="130" y="180" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">Cannot access directly</text>
</svg>

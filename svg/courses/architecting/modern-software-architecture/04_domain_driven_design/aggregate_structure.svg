<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#dc3545" />
    </marker>
  </defs>
  <rect x="341.3333" y="37.8947" width="887.4667" height="587.3684" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="13.6533 6.8267" />
  <text x="785.0667" y="90.9474" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.8933" font-weight="bold" fill="var(--primary-accent)">Order Aggregate</text>
  <rect x="597.3333" y="132.6316" width="375.4667" height="85.2632" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="785.0667" y="185.6842" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Order (Aggregate Root)</text>
  <rect x="392.5333" y="322.1053" width="221.8667" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="503.4667" y="369.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">LineItem 1</text>
  <rect x="665.6" y="322.1053" width="221.8667" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="776.5333" y="369.4737" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">LineItem 2</text>
  <rect x="392.5333" y="473.6842" width="256" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="520.5333" y="521.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Shipping Address</text>
  <rect x="716.8" y="473.6842" width="256" height="75.7895" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="844.8" y="521.0526" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.48">Payment Method</text>
  <line x1="699.7333" y1="217.8947" x2="546.1333" y2="318.3158" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="819.2" y1="217.8947" x2="768" y2="318.3158" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="699.7333" y1="217.8947" x2="546.1333" y2="469.8947" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="819.2" y1="217.8947" x2="836.2667" y2="469.8947" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="34.1333" y="189.4737" width="187.7333" height="85.2632" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="128" y="242.5263" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.1867" font-weight="bold">Client</text>
  <line x1="221.8667" y1="223.5789" x2="593.92" y2="174.3158" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="392.5333" y="180" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--ok-accent)">Access via Root</text>
  <line x1="170.6667" y1="274.7368" x2="426.6667" y2="337.2632" stroke="var(--danger-border)" stroke-width="2" stroke-dasharray="8.5333 6.8267" marker-end="url(#arrow-danger)" />
  <text x="221.8667" y="341.0526" font-family="Arial, sans-serif" font-size="17.0667" fill="var(--danger-accent)">Cannot access directly</text>
</svg>
  <text x="468.9489" y="268.1081" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4505">Subdomain: Payments</text>
  <rect x="645.7658" y="224.8649" width="261.3814" height="69.1892" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="776.4565" y="268.1081" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4505">Subdomain: Inventory</text>
  <rect x="953.2733" y="224.8649" width="246.006" height="69.1892" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="1076.2763" y="268.1081" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4505">Subdomain: Shipping</text>
  <line x1="522.7628" y1="112.4324" x2="215.2553" y2="221.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="584.2643" y1="112.4324" x2="468.9489" y2="221.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="645.7658" y1="112.4324" x2="776.4565" y2="221.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="707.2673" y1="112.4324" x2="1045.5255" y2="221.4054" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="46.1261" y="432.4324" width="246.006" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="169.1291" y="475.6757" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4505">Order Service</text>
  <rect x="338.2583" y="432.4324" width="261.3814" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="468.9489" y="475.6757" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4505">Payment Service</text>
  <rect x="645.7658" y="432.4324" width="261.3814" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="776.4565" y="475.6757" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4505">Inventory Service</text>
  <rect x="953.2733" y="432.4324" width="246.006" height="69.1892" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1076.2763" y="475.6757" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4505">Shipping Service</text>
  <line x1="169.1291" y1="294.0541" x2="169.1291" y2="428.973" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="468.9489" y1="294.0541" x2="468.9489" y2="428.973" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="776.4565" y1="294.0541" x2="776.4565" y2="428.973" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1076.2763" y1="294.0541" x2="1076.2763" y2="428.973" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="615.015" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.9129" fill="var(--text-faint)">Domain decomposition drives microservice boundaries</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="472" y="40" width="320" height="74.5714" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4927" font-weight="bold" fill="var(--primary-text)">Business Domain</text>
  <rect x="40" y="222.2857" width="256" height="66.2857" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168" y="263.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224" fill="var(--warn-text)">Subdomain: Orders</text>
  <rect x="344.0001" y="222.2857" width="272" height="66.2857" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="263.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224" fill="var(--warn-text)">Subdomain: Payments</text>
  <rect x="664" y="222.2857" width="272" height="66.2857" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="263.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224" fill="var(--warn-text)">Subdomain: Inventory</text>
  <rect x="984" y="222.2857" width="256" height="66.2857" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="263.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224" fill="var(--warn-text)">Subdomain: Shipping</text>
  <line x1="536" y1="114.5714" x2="216.0001" y2="218.9714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="114.5714" x2="480" y2="218.9714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="664" y1="114.5714" x2="800" y2="218.9714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="728" y1="114.5714" x2="1080" y2="218.9714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="421.1428" width="256" height="66.2857" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168" y="462.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224" fill="var(--ok-text)">Order Service</text>
  <rect x="344.0001" y="421.1428" width="272" height="66.2857" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="462.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224" fill="var(--ok-text)">Payment Service</text>
  <rect x="664" y="421.1428" width="272" height="66.2857" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="462.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224" fill="var(--ok-text)">Inventory Service</text>
  <rect x="984" y="421.1428" width="256" height="66.2857" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="462.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224" fill="var(--ok-text)">Shipping Service</text>
  <line x1="168" y1="288.5715" x2="168" y2="417.8286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="288.5715" x2="480" y2="417.8286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="288.5715" x2="800" y2="417.8286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1112" y1="288.5715" x2="1112" y2="417.8286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="632" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8871" fill="var(--text-faint)">Domain decomposition drives microservice boundaries</text>
</svg>

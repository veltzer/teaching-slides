<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="472" y="40" width="320" height="74.5714" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="632" y="86.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4927" font-weight="bold">Business Domain</text>
  <rect x="40" y="222.2857" width="256" height="66.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168" y="263.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224">Subdomain: Orders</text>
  <rect x="344.0001" y="222.2857" width="272" height="66.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="263.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224">Subdomain: Payments</text>
  <rect x="664" y="222.2857" width="272" height="66.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="263.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224">Subdomain: Inventory</text>
  <rect x="984" y="222.2857" width="256" height="66.2857" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="263.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224">Subdomain: Shipping</text>
  <line x1="536" y1="114.5714" x2="216.0001" y2="218.9714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="600" y1="114.5714" x2="480" y2="218.9714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="664" y1="114.5714" x2="800" y2="218.9714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="728" y1="114.5714" x2="1080" y2="218.9714" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="421.1428" width="256" height="66.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="168" y="462.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224">Order Service</text>
  <rect x="344.0001" y="421.1428" width="272" height="66.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="462.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224">Payment Service</text>
  <rect x="664" y="421.1428" width="272" height="66.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="462.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224">Inventory Service</text>
  <rect x="984" y="421.1428" width="256" height="66.2857" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112" y="462.5715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4224">Shipping Service</text>
  <line x1="168" y1="288.5715" x2="168" y2="417.8286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="480" y1="288.5715" x2="480" y2="417.8286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="800" y1="288.5715" x2="800" y2="417.8286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1112" y1="288.5715" x2="1112" y2="417.8286" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="632" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8871" fill="var(--text-faint)">Domain decomposition drives microservice boundaries</text>
</svg>
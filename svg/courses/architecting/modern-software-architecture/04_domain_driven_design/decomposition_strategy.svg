<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Business Domain -->
  <rect x="300" y="20" width="200" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Business Domain</text>
  <!-- Subdomains row -->
  <rect x="30" y="130" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="110" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Subdomain: Orders</text>
  <rect x="220" y="130" width="170" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="305" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Subdomain: Payments</text>
  <rect x="420" y="130" width="170" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="505" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Subdomain: Inventory</text>
  <rect x="620" y="130" width="160" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="700" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Subdomain: Shipping</text>
  <!-- Arrows from BD to subdomains -->
  <line x1="340" y1="65" x2="140" y2="128" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="65" x2="305" y2="128" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="65" x2="505" y2="128" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="65" x2="680" y2="128" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Microservices row -->
  <rect x="30" y="250" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="110" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Order Service</text>
  <rect x="220" y="250" width="170" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="305" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Payment Service</text>
  <rect x="420" y="250" width="170" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="505" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Inventory Service</text>
  <rect x="620" y="250" width="160" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="700" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Shipping Service</text>
  <!-- Arrows from subdomains to services -->
  <line x1="110" y1="170" x2="110" y2="248" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="305" y1="170" x2="305" y2="248" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="505" y1="170" x2="505" y2="248" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="170" x2="700" y2="248" stroke="#28a745" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Labels -->
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">Domain decomposition drives microservice boundaries</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <rect width="1137.7778" height="640" fill="var(--bg)" rx="6"/>
  <polygon points="568.8889,71.1111 177.7778,515.5556 960,515.5556" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" />
  <rect x="480" y="26.6667" width="177.7778" height="39.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="568.8889" y="51.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Consistency</text>
  <rect x="53.3333" y="520.8889" width="177.7778" height="39.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="142.2222" y="545.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Availability</text>
  <rect x="862.2222" y="520.8889" width="204.4444" height="39.1111" rx="6" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="964.4444" y="545.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="var(--bg)">Partition Tolerance</text>
  <text x="315.5556" y="257.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">CP</text>
  <text x="315.5556" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Consistent +</text>
  <text x="315.5556" y="295.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Partition Tolerant</text>
  <text x="817.7778" y="257.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">AP</text>
  <text x="817.7778" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Available +</text>
  <text x="817.7778" y="295.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Partition Tolerant</text>
  <text x="568.8889" y="462.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="var(--primary-accent)">CA</text>
  <text x="568.8889" y="484.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Consistent + Available</text>
  <text x="568.8889" y="499.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="var(--text-muted)">(Not realistic in distributed systems)</text>
  <rect x="44.4444" y="142.2222" width="115.5556" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="102.2222" y="162.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">MongoDB</text>
  <rect x="44.4444" y="181.3333" width="115.5556" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="102.2222" y="201.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">HBase</text>
  <rect x="44.4444" y="220.4444" width="115.5556" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="102.2222" y="240.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Zookeeper</text>
  <rect x="968.8889" y="142.2222" width="124.4444" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1031.1111" y="162.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">Cassandra</text>
  <rect x="968.8889" y="181.3333" width="124.4444" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1031.1111" y="201.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">CouchDB</text>
  <rect x="968.8889" y="220.4444" width="124.4444" height="32" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1031.1111" y="240.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="var(--text)">DynamoDB</text>
  <line x1="161.7778" y1="177.7778" x2="248.8889" y2="266.6667" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" />
  <line x1="968.8889" y1="177.7778" x2="880" y2="266.6667" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" />
  <text x="568.8889" y="593.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="var(--text-muted)">In a partition, you must choose: sacrifice Consistency (AP) or Availability (CP)</text>
</svg>
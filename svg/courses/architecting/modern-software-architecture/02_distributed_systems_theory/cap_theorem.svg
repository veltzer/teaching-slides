<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <polygon points="640,85.454462 192.542373,540.000093 1087.457627,540.000093" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667"/>
  <rect x="538.305085" y="40" width="203.389831" height="39.999953" rx="6.638518" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="65.454598" text-anchor="middle" font-size="19.230239" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Consistency</text>
  <rect x="50.169492" y="545.454602" width="203.389831" height="39.999953" rx="6.638518" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="151.864407" y="570.909087" text-anchor="middle" font-size="19.230239" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Availability</text>
  <rect x="975.59322" y="545.454602" width="233.898197" height="39.999953" rx="6.638518" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.542264" y="570.909087" text-anchor="middle" font-size="19.230239" font-weight="bold" fill="var(--bg)" font-family="Arial, sans-serif">Partition Tolerance</text>
  <text x="350.169492" y="276.363607" text-anchor="middle" font-size="21.153196" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">CP</text>
  <text x="350.169492" y="299.090894" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">Consistent +</text>
  <text x="350.169492" y="314.545391" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">Partition Tolerant</text>
  <text x="924.745763" y="276.363607" text-anchor="middle" font-size="21.153196" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">AP</text>
  <text x="924.745763" y="299.090894" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">Available +</text>
  <text x="924.745763" y="314.545391" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">Partition Tolerant</text>
  <text x="640" y="485.454559" text-anchor="middle" font-size="21.153196" font-weight="bold" fill="var(--primary-accent)" font-family="Arial, sans-serif">CA</text>
  <text x="640" y="508.181733" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">Consistent + Available</text>
  <text x="640" y="523.636456" text-anchor="middle" font-size="11.538187" fill="var(--text-muted)" font-family="Arial, sans-serif">(Not realistic in distributed systems)</text>
  <rect x="40" y="158.181803" width="132.20339" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="106.101695" y="179.090921" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">MongoDB</text>
  <rect x="40" y="198.181757" width="132.20339" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="106.101695" y="219.090874" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">HBase</text>
  <rect x="40" y="238.18171" width="132.20339" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="106.101695" y="259.090941" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">Zookeeper</text>
  <rect x="1097.627119" y="158.181803" width="142.372881" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1168.813559" y="179.090921" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">Cassandra</text>
  <rect x="1097.627119" y="198.181757" width="142.372881" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1168.813559" y="219.090874" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">CouchDB</text>
  <rect x="1097.627119" y="238.18171" width="142.372881" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1168.813559" y="259.090941" text-anchor="middle" font-size="12.499666" fill="var(--text)" font-family="Arial, sans-serif">DynamoDB</text>
  <line x1="174.237288" y1="194.545418" x2="273.898305" y2="285.454567" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667"/>
  <line x1="1097.627119" y1="194.545418" x2="995.932203" y2="285.454567" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667"/>
  <text x="640" y="620" text-anchor="middle" font-size="13.461034" fill="var(--text-muted)" font-family="Arial, sans-serif">In a partition, you must choose: sacrifice Consistency (AP) or Availability (CP)</text>
</svg>

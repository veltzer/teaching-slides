<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <!-- CAP Triangle -->
  <!-- Triangle: top=640,80  bottom-left=200,580  bottom-right=1080,580 -->
  <polygon points="640,80 200,580 1080,580" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <!-- Vertex labels -->
  <rect x="540" y="30" width="200" height="44" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="640" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Consistency</text>
  <rect x="60" y="586" width="200" height="44" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="160" y="614" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Availability</text>
  <rect x="970" y="586" width="230" height="44" rx="8" fill="url(#grad-accent)" filter="url(#shadow)"/>
  <text x="1085" y="614" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Partition Tolerance</text>
  <!-- Zone labels inside triangle -->
  <!-- CP zone (top-left side) -->
  <text x="355" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1565c0">CP</text>
  <text x="355" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Consistent +</text>
  <text x="355" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Partition Tolerant</text>
  <!-- AP zone (top-right side) -->
  <text x="920" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1565c0">AP</text>
  <text x="920" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Available +</text>
  <text x="920" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Partition Tolerant</text>
  <!-- CA zone (bottom) -->
  <text x="640" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1565c0">CA</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Consistent + Available</text>
  <text x="640" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555555">(Not realistic in distributed systems)</text>
  <!-- Example DB boxes outside triangle -->
  <!-- CP examples -->
  <rect x="50" y="160" width="130" height="36" rx="6" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">MongoDB</text>
  <rect x="50" y="204" width="130" height="36" rx="6" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">HBase</text>
  <rect x="50" y="248" width="130" height="36" rx="6" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Zookeeper</text>
  <!-- AP examples -->
  <rect x="1090" y="160" width="140" height="36" rx="6" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1160" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">Cassandra</text>
  <rect x="1090" y="204" width="140" height="36" rx="6" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1160" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">CouchDB</text>
  <rect x="1090" y="248" width="140" height="36" rx="6" fill="#f2f2f2" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1160" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#212121">DynamoDB</text>
  <!-- Connector lines -->
  <line x1="182" y1="200" x2="280" y2="300" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="1090" y1="200" x2="990" y2="300" stroke="#555555" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Bottom note -->
  <text x="640" y="668" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#555555">In a partition, you must choose: sacrifice Consistency (AP) or Availability (CP)</text>
</svg>

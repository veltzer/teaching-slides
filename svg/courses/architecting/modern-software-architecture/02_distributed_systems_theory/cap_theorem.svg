<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <linearGradient id="grad-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
  </defs>
  <polygon points="640,85.454462 192.542373,540.000093 1087.457627,540.000093" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2.6667" />
  <rect x="538.305085" y="40" width="203.389831" height="39.999953" rx="6.638518" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="65.454598" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.230239" font-weight="bold" fill="var(--bg)">Consistency</text>
  <rect x="50.169492" y="545.454602" width="203.389831" height="39.999953" rx="6.638518" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="151.864407" y="570.909087" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.230239" font-weight="bold" fill="var(--bg)">Availability</text>
  <rect x="975.59322" y="545.454602" width="233.898197" height="39.999953" rx="6.638518" fill="var(--primary-fill)" filter="url(#shadow)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1092.542264" y="570.909087" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.230239" font-weight="bold" fill="var(--bg)">Partition Tolerance</text>
  <text x="350.169492" y="276.363607" text-anchor="middle" font-family="Arial,sans-serif" font-size="21.153196" font-weight="bold" fill="var(--primary-accent)">CP</text>
  <text x="350.169492" y="299.090894" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">Consistent +</text>
  <text x="350.169492" y="314.545391" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">Partition Tolerant</text>
  <text x="924.745763" y="276.363607" text-anchor="middle" font-family="Arial,sans-serif" font-size="21.153196" font-weight="bold" fill="var(--primary-accent)">AP</text>
  <text x="924.745763" y="299.090894" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">Available +</text>
  <text x="924.745763" y="314.545391" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">Partition Tolerant</text>
  <text x="640" y="485.454559" text-anchor="middle" font-family="Arial,sans-serif" font-size="21.153196" font-weight="bold" fill="var(--primary-accent)">CA</text>
  <text x="640" y="508.181733" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">Consistent + Available</text>
  <text x="640" y="523.636456" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.538187" fill="var(--text-muted)">(Not realistic in distributed systems)</text>
  <rect x="40" y="158.181803" width="132.20339" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="106.101695" y="179.090921" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">MongoDB</text>
  <rect x="40" y="198.181757" width="132.20339" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="106.101695" y="219.090874" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">HBase</text>
  <rect x="40" y="238.18171" width="132.20339" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="106.101695" y="259.090941" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">Zookeeper</text>
  <rect x="1097.627119" y="158.181803" width="142.372881" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1168.813559" y="179.090921" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">Cassandra</text>
  <rect x="1097.627119" y="198.181757" width="142.372881" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1168.813559" y="219.090874" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">CouchDB</text>
  <rect x="1097.627119" y="238.18171" width="142.372881" height="32.727276" rx="6.638518" fill="var(--surface)" stroke="var(--border)" stroke-width="1" filter="url(#shadow)" />
  <text x="1168.813559" y="259.090941" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.499666" fill="var(--text)">DynamoDB</text>
  <line x1="174.237288" y1="194.545418" x2="273.898305" y2="285.454567" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" />
  <line x1="1097.627119" y1="194.545418" x2="995.932203" y2="285.454567" stroke="var(--text-muted)" stroke-width="1.3333" stroke-dasharray="4.4444 2.6667" />
  <text x="640" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="13.461034" fill="var(--text-muted)">In a partition, you must choose: sacrifice Consistency (AP) or Availability (CP)</text>
</svg>
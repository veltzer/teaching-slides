<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- User sees single system -->
  <rect x="440" y="20" width="400" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--ok-accent)">Users see: One System</text>

  <!-- Cloud boundary -->
  <rect x="100" y="130" width="1080" height="350" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="640" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">Reality: Multiple Independent Computers</text>

  <!-- Node A -->
  <rect x="150" y="200" width="200" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">Node A</text>
  <text x="250" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Own CPU, Memory</text>
  <text x="250" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Own Clock</text>
  <rect x="175" y="295" width="150" height="20" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="250" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--primary-accent)">Process A</text>

  <!-- Node B -->
  <rect x="540" y="200" width="200" height="120" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Node B</text>
  <text x="640" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Own CPU, Memory</text>
  <text x="640" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Own Clock</text>
  <rect x="565" y="295" width="150" height="20" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--ok-accent)">Process B</text>

  <!-- Node C -->
  <rect x="930" y="200" width="200" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1030" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">Node C</text>
  <text x="1030" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Own CPU, Memory</text>
  <text x="1030" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Own Clock</text>
  <rect x="955" y="295" width="150" height="20" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1030" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="var(--warn-accent)">Process C</text>

  <!-- Network connections (messages) -->
  <line x1="350" y1="260" x2="540" y2="260" stroke="var(--text-faint)" stroke-width="2"/>
  <text x="445" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">messages</text>
  <line x1="740" y1="260" x2="930" y2="260" stroke="var(--text-faint)" stroke-width="2"/>
  <text x="835" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="var(--text-faint)">messages</text>

  <!-- Network (unreliable) indicator -->
  <rect x="280" y="380" width="720" height="50" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="var(--danger-accent)">Network: Unreliable, adds latency, can partition</text>

  <!-- Bottom: key properties -->
  <rect x="100" y="490" width="340" height="120" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="270" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--primary-accent)">No Shared Memory</text>
  <text x="270" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Nodes cannot read each</text>
  <text x="270" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">other's memory directly</text>

  <rect x="470" y="490" width="340" height="120" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--warn-accent)">No Global Clock</text>
  <text x="640" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Clocks drift independently</text>
  <text x="640" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">on each node</text>

  <rect x="840" y="490" width="340" height="120" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1010" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="var(--danger-accent)">Independent Failures</text>
  <text x="1010" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">Nodes can fail without</text>
  <text x="1010" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">others knowing</text>
</svg>
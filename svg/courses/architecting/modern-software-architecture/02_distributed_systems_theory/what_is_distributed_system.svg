<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- User sees single system -->
  <rect x="417.7778" y="40" width="444.4444" height="58.9831" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="76.3729" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8122" font-weight="bold" fill="var(--ok-accent)">Users see: One System</text>

  <!-- Cloud boundary -->
  <rect x="40" y="148.1356" width="1200" height="344.0678" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="640" y="182.5424" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7219" fill="var(--text-muted)">Reality: Multiple Independent Computers</text>

  <!-- Node A -->
  <rect x="95.5556" y="216.9492" width="222.2222" height="117.9661" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="206.6667" y="256.2712" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7219" font-weight="bold" fill="var(--primary-accent)">Node A</text>
  <text x="206.6667" y="280.8475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--text-muted)">Own CPU, Memory</text>
  <text x="206.6667" y="300.5085" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--text-muted)">Own Clock</text>
  <rect x="123.3333" y="310.339" width="166.6667" height="19.661" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="206.6667" y="325.0847" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.4512" fill="var(--primary-accent)">Process A</text>

  <!-- Node B -->
  <rect x="528.8889" y="216.9492" width="222.2222" height="117.9661" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="256.2712" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7219" font-weight="bold" fill="var(--ok-accent)">Node B</text>
  <text x="640" y="280.8475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--text-muted)">Own CPU, Memory</text>
  <text x="640" y="300.5085" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--text-muted)">Own Clock</text>
  <rect x="556.6667" y="310.339" width="166.6667" height="19.661" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="640" y="325.0847" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.4512" fill="var(--ok-accent)">Process B</text>

  <!-- Node C -->
  <rect x="962.2222" y="216.9492" width="222.2222" height="117.9661" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1073.3333" y="256.2712" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.7219" font-weight="bold" fill="var(--warn-accent)">Node C</text>
  <text x="1073.3333" y="280.8475" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--text-muted)">Own CPU, Memory</text>
  <text x="1073.3333" y="300.5085" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5415" fill="var(--text-muted)">Own Clock</text>
  <rect x="990" y="310.339" width="166.6667" height="19.661" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1073.3333" y="325.0847" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.4512" fill="var(--warn-accent)">Process C</text>

  <!-- Network connections (messages) -->
  <line x1="317.7778" y1="275.9322" x2="528.8889" y2="275.9322" stroke="var(--text-faint)" stroke-width="2"/>
  <text x="423.3333" y="266.1017" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4963" fill="var(--text-faint)">messages</text>
  <line x1="751.1111" y1="275.9322" x2="962.2222" y2="275.9322" stroke="var(--text-faint)" stroke-width="2"/>
  <text x="856.6667" y="266.1017" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.4963" fill="var(--text-faint)">messages</text>

  <!-- Network (unreliable) indicator -->
  <rect x="240" y="393.8983" width="800" height="49.1525" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="640" y="425.3559" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6768" fill="var(--danger-accent)">Network: Unreliable, adds latency, can partition</text>

  <!-- Bottom: key properties -->
  <rect x="40" y="502.0339" width="377.7778" height="117.9661" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="228.8889" y="531.5254" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6768" font-weight="bold" fill="var(--primary-accent)">No Shared Memory</text>
  <text x="228.8889" y="556.1017" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5866" fill="var(--text-muted)">Nodes cannot read each</text>
  <text x="228.8889" y="575.7627" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5866" fill="var(--text-muted)">other's memory directly</text>

  <rect x="451.1111" y="502.0339" width="377.7778" height="117.9661" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="640" y="531.5254" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6768" font-weight="bold" fill="var(--warn-accent)">No Global Clock</text>
  <text x="640" y="556.1017" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5866" fill="var(--text-muted)">Clocks drift independently</text>
  <text x="640" y="575.7627" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5866" fill="var(--text-muted)">on each node</text>

  <rect x="862.2222" y="502.0339" width="377.7778" height="117.9661" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="1051.1111" y="531.5254" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6768" font-weight="bold" fill="var(--danger-accent)">Independent Failures</text>
  <text x="1051.1111" y="556.1017" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5866" fill="var(--text-muted)">Nodes can fail without</text>
  <text x="1051.1111" y="575.7627" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.5866" fill="var(--text-muted)">others knowing</text>
</svg>
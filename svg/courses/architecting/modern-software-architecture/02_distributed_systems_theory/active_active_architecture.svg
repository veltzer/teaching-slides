<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.247" font-weight="bold" fill="var(--text)">Active-Active Architecture</text>
  <rect x="460" y="82.6122" width="360.0001" height="95.8775" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="142.2693" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3008" font-weight="bold">Load Balancer</text>
  <line x1="540" y1="178.4898" x2="200" y2="285.0204" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="178.4898" x2="640" y2="285.0204" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="740" y1="178.4898" x2="1080" y2="285.0204" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="40" y="295.6734" width="320" height="95.8775" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="355.3306" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3546" font-weight="bold">Node 1 - Active</text>
  <rect x="480" y="295.6734" width="320" height="95.8775" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="355.3306" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3546" font-weight="bold">Node 2 - Active</text>
  <rect x="920" y="295.6734" width="320" height="95.8775" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="355.3306" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3546" font-weight="bold">Node 3 - Active</text>
  <line x1="200" y1="391.5509" x2="540" y2="519.3877" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640" y1="391.5509" x2="620" y2="519.3877" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1080" y1="391.5509" x2="700" y2="519.3877" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <ellipse cx="620" cy="572.653" rx="140" ry="47.347" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.6571" />
  <text x="620" y="583.3061" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4084" font-weight="bold">DB Primary</text>
  <line x1="760" y1="572.653" x2="940" y2="572.653" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="850" y="557.7388" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4621" fill="var(--danger-accent)">Replication</text>
  <ellipse cx="1080" cy="572.653" rx="130" ry="47.347" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.6571" />
  <text x="1080" y="583.3061" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4084" font-weight="bold">DB Replica</text>
</svg>
  <text x="640" y="51.4286" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.6" font-weight="bold" fill="var(--text-dark)">Active-Active Architecture</text>
  <rect x="475.4286" y="92.5714" width="329.1429" height="92.5714" rx="9.1429" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="3.6571" />
  <text x="640" y="150.1714" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.7714" font-weight="bold">Load Balancer</text>
  <line x1="548.5714" y1="185.1429" x2="237.7143" y2="288" stroke="var(--primary-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="640" y1="185.1429" x2="640" y2="288" stroke="var(--primary-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="731.4286" y1="185.1429" x2="1042.2857" y2="288" stroke="var(--primary-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <rect x="91.4286" y="298.2857" width="292.5714" height="92.5714" rx="9.1429" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.6571" />
  <text x="237.7143" y="355.8857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold">Node 1 - Active</text>
  <rect x="493.7143" y="298.2857" width="292.5714" height="92.5714" rx="9.1429" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.6571" />
  <text x="640" y="355.8857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold">Node 2 - Active</text>
  <rect x="896" y="298.2857" width="292.5714" height="92.5714" rx="9.1429" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="3.6571" />
  <text x="1042.2857" y="355.8857" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.9429" font-weight="bold">Node 3 - Active</text>
  <line x1="237.7143" y1="390.8571" x2="548.5714" y2="514.2857" stroke="var(--primary-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="640" y1="390.8571" x2="621.7143" y2="514.2857" stroke="var(--primary-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <line x1="1042.2857" y1="390.8571" x2="694.8571" y2="514.2857" stroke="var(--primary-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <ellipse cx="621.7143" cy="565.7143" rx="128" ry="45.7143" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.6571" />
  <text x="621.7143" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1143" font-weight="bold">DB Primary</text>
  <line x1="749.7143" y1="565.7143" x2="914.2857" y2="565.7143" stroke="var(--danger-bright)" stroke-width="3.6571" marker-end="url(#arrow)" />
  <text x="832" y="551.3143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.2857" fill="var(--danger-bright)">Replication</text>
  <ellipse cx="1042.2857" cy="565.7143" rx="118.8571" ry="45.7143" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="3.6571" />
  <text x="1042.2857" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.1143" font-weight="bold">DB Replica</text>

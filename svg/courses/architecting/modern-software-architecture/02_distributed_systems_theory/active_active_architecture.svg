<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="27.247" font-weight="bold" fill="var(--text)">Active-Active Architecture</text>
  <rect x="460" y="82.6122" width="360.0001" height="95.8775" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="142.2693" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3008" font-weight="bold" fill="var(--primary-text)">Load Balancer</text>
  <line x1="540" y1="178.4898" x2="200" y2="285.0204" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="178.4898" x2="640" y2="285.0204" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="178.4898" x2="1080" y2="285.0204" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="295.6734" width="320" height="95.8775" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="355.3306" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3546" font-weight="bold" fill="var(--ok-text)">Node 1 - Active</text>
  <rect x="480" y="295.6734" width="320" height="95.8775" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="355.3306" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3546" font-weight="bold" fill="var(--ok-text)">Node 2 - Active</text>
  <rect x="920" y="295.6734" width="320" height="95.8775" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1080" y="355.3306" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3546" font-weight="bold" fill="var(--ok-text)">Node 3 - Active</text>
  <line x1="200" y1="391.5509" x2="540" y2="519.3877" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="391.5509" x2="620" y2="519.3877" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080" y1="391.5509" x2="700" y2="519.3877" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <ellipse cx="620" cy="572.653" rx="140" ry="47.347" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="3.6571"/>
  <text x="620" y="583.3061" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4084" font-weight="bold" fill="var(--text)">DB Primary</text>
  <line x1="760" y1="572.653" x2="940" y2="572.653" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="557.7388" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.4621" fill="var(--danger-accent)">Replication</text>
  <ellipse cx="1080" cy="572.653" rx="130" ry="47.347" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="3.6571"/>
  <text x="1080" y="583.3061" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4084" font-weight="bold" fill="var(--text)">DB Replica</text>
</svg>

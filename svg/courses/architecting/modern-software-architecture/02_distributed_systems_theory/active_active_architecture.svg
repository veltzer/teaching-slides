<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Active-Active Architecture</text>
  <!-- Load Balancer -->
  <rect x="260" y="45" width="180" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Load Balancer</text>
  <!-- Arrows to nodes -->
  <line x1="300" y1="90" x2="130" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="90" x2="350" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="90" x2="570" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Active nodes -->
  <rect x="50" y="145" width="160" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="130" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Node 1 - Active</text>
  <rect x="270" y="145" width="160" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="350" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Node 2 - Active</text>
  <rect x="490" y="145" width="160" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="570" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Node 3 - Active</text>
  <!-- Arrows to DB Primary -->
  <line x1="130" y1="190" x2="300" y2="250" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="190" x2="340" y2="250" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="190" x2="380" y2="250" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- DB Primary -->
  <ellipse cx="340" cy="275" rx="70" ry="25" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="340" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">DB Primary</text>
  <!-- Replication arrow -->
  <line x1="410" y1="275" x2="500" y2="275" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="455" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">Replication</text>
  <!-- DB Replica -->
  <ellipse cx="570" cy="275" rx="65" ry="25" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="570" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">DB Replica</text>
</svg>

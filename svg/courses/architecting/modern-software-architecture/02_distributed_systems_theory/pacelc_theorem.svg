<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <!-- Title area -->
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3761" font-weight="bold" fill="var(--text)">PACELC: Extension of CAP Theorem</text>

  <!-- Decision tree -->
  <!-- Root: Is there a partition? -->
  <rect x="433.1034" y="70" width="413.7931" height="60" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.3077" font-weight="bold" fill="var(--primary-accent)">Is there a network partition?</text>

  <!-- Yes branch -->
  <line x1="495.1724" y1="130" x2="288.2759" y2="190" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="360.6897" y="155" font-family="Arial, sans-serif" font-size="16.2735" font-weight="bold" fill="var(--danger-accent)">Yes (P)</text>

  <!-- PAC box -->
  <rect x="122.7586" y="190" width="331.0345" height="60" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="288.2759" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2735" font-weight="bold" fill="var(--danger-accent)">Choose: Availability or Consistency</text>

  <!-- PA choice -->
  <line x1="205.5172" y1="250" x2="153.7931" y2="300" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="40" y="300" width="227.5862" height="100" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="153.7931" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2735" font-weight="bold" fill="var(--warn-accent)">PA: Availability</text>
  <text x="153.7931" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2051" fill="var(--text-muted)">Accept stale reads</text>
  <text x="153.7931" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2051" fill="var(--text-muted)">during partition</text>

  <!-- PC choice -->
  <line x1="371.0345" y1="250" x2="422.7586" y2="300" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="308.9655" y="300" width="227.5862" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="422.7586" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2735" font-weight="bold" fill="var(--primary-accent)">PC: Consistency</text>
  <text x="422.7586" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2051" fill="var(--text-muted)">Reject requests to</text>
  <text x="422.7586" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2051" fill="var(--text-muted)">ensure correctness</text>

  <!-- No branch -->
  <line x1="784.8276" y1="130" x2="991.7241" y2="190" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="908.9655" y="155" font-family="Arial, sans-serif" font-size="16.2735" font-weight="bold" fill="var(--ok-accent)">No (E)</text>

  <!-- ELC box -->
  <rect x="826.2069" y="190" width="331.0345" height="60" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="991.7241" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2735" font-weight="bold" fill="var(--ok-accent)">Choose: Latency or Consistency</text>

  <!-- EL choice -->
  <line x1="908.9655" y1="250" x2="857.2414" y2="300" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="743.4483" y="300" width="227.5862" height="100" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="857.2414" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2735" font-weight="bold" fill="var(--ok-accent)">EL: Latency</text>
  <text x="857.2414" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2051" fill="var(--text-muted)">Faster responses</text>
  <text x="857.2414" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2051" fill="var(--text-muted)">eventual consistency</text>

  <!-- EC choice -->
  <line x1="1074.4828" y1="250" x2="1126.2069" y2="300" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1012.4138" y="300" width="227.5862" height="100" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.2069" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.2735" font-weight="bold" fill="var(--primary-accent)">EC: Consistency</text>
  <text x="1126.2069" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2051" fill="var(--text-muted)">Synchronous replication</text>
  <text x="1126.2069" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2051" fill="var(--text-muted)">higher latency</text>

  <!-- Examples table -->
  <rect x="81.3793" y="450" width="1117.2414" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.2906" font-weight="bold" fill="var(--text)">Real-World Examples</text>

  <!-- Headers -->
  <text x="236.5517" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2393" font-weight="bold" fill="var(--text)">System</text>
  <text x="495.1724" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2393" font-weight="bold" fill="var(--text)">During Partition</text>
  <text x="753.7931" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2393" font-weight="bold" fill="var(--text)">Normal Operation</text>
  <text x="1012.4138" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.2393" font-weight="bold" fill="var(--text)">Classification</text>

  <line x1="112.4138" y1="530" x2="1167.5862" y2="530" stroke="var(--border)" stroke-width="1"/>

  <text x="236.5517" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--text)">DynamoDB</text>
  <text x="495.1724" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--warn-accent)">Availability</text>
  <text x="753.7931" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--ok-accent)">Low Latency</text>
  <text x="1012.4138" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--text-muted)">PA/EL</text>

  <text x="236.5517" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--text)">MongoDB</text>
  <text x="495.1724" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--primary-accent)">Consistency</text>
  <text x="753.7931" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--primary-accent)">Consistency</text>
  <text x="1012.4138" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--text-muted)">PC/EC</text>

  <text x="236.5517" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--text)">Cassandra</text>
  <text x="495.1724" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--warn-accent)">Availability</text>
  <text x="753.7931" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--ok-accent)">Low Latency</text>
  <text x="1012.4138" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.2222" fill="var(--text-muted)">PA/EL</text>
</svg>

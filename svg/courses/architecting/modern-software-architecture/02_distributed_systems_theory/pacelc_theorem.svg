<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
</defs>
  <!-- Title area -->
  <text x="640" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="var(--text)">PACELC: Extension of CAP Theorem</text>

  <!-- Decision tree -->
  <!-- Root: Is there a partition? -->
  <rect x="440" y="80" width="400" height="60" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="640" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="var(--primary-accent)">Is there a network partition?</text>

  <!-- Yes branch -->
  <line x1="500" y1="140" x2="300" y2="200" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="370" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)">Yes (P)</text>

  <!-- PAC box -->
  <rect x="140" y="200" width="320" height="60" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2"/>
  <text x="300" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--danger-accent)">Choose: Availability or Consistency</text>

  <!-- PA choice -->
  <line x1="220" y1="260" x2="170" y2="310" stroke="var(--warn-border)" stroke-width="2"/>
  <rect x="60" y="310" width="220" height="100" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="170" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--warn-accent)">PA: Availability</text>
  <text x="170" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Accept stale reads</text>
  <text x="170" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">during partition</text>

  <!-- PC choice -->
  <line x1="380" y1="260" x2="430" y2="310" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="320" y="310" width="220" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="430" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">PC: Consistency</text>
  <text x="430" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Reject requests to</text>
  <text x="430" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">ensure correctness</text>

  <!-- No branch -->
  <line x1="780" y1="140" x2="980" y2="200" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="900" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">No (E)</text>

  <!-- ELC box -->
  <rect x="820" y="200" width="320" height="60" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="980" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">Choose: Latency or Consistency</text>

  <!-- EL choice -->
  <line x1="900" y1="260" x2="850" y2="310" stroke="var(--ok-border)" stroke-width="2"/>
  <rect x="740" y="310" width="220" height="100" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2"/>
  <text x="850" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--ok-accent)">EL: Latency</text>
  <text x="850" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Faster responses</text>
  <text x="850" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">eventual consistency</text>

  <!-- EC choice -->
  <line x1="1060" y1="260" x2="1110" y2="310" stroke="var(--primary-border)" stroke-width="2"/>
  <rect x="1000" y="310" width="220" height="100" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2"/>
  <text x="1110" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="var(--primary-accent)">EC: Consistency</text>
  <text x="1110" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">Synchronous replication</text>
  <text x="1110" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="var(--text-muted)">higher latency</text>

  <!-- Examples table -->
  <rect x="100" y="460" width="1080" height="170" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="640" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="var(--text)">Real-World Examples</text>

  <!-- Headers -->
  <text x="250" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">System</text>
  <text x="500" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">During Partition</text>
  <text x="750" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Normal Operation</text>
  <text x="1000" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="var(--text)">Classification</text>

  <line x1="130" y1="540" x2="1150" y2="540" stroke="var(--border)" stroke-width="1"/>

  <text x="250" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">DynamoDB</text>
  <text x="500" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Availability</text>
  <text x="750" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">Low Latency</text>
  <text x="1000" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">PA/EL</text>

  <text x="250" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">MongoDB</text>
  <text x="500" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Consistency</text>
  <text x="750" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--primary-accent)">Consistency</text>
  <text x="1000" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">PC/EC</text>

  <text x="250" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text)">Cassandra</text>
  <text x="500" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--warn-accent)">Availability</text>
  <text x="750" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--ok-accent)">Low Latency</text>
  <text x="1000" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="var(--text-muted)">PA/EL</text>
</svg>
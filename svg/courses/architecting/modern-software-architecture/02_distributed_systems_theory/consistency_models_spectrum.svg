<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,45 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="662.5" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.5374" font-weight="bold" fill="var(--text)">Consistency Models Spectrum</text>
  <rect x="85" y="141.3592" width="1155" height="45.0485" rx="6" fill="url(#spectrumGrad)" />
  <defs>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="150.5882%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c" />
      <stop offset="100%" style="stop-color:#27ae60" />
    </linearGradient>
  </defs>
  <text x="85" y="310.2913" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8124" fill="var(--danger-accent)" font-weight="bold">Stricter</text>
  <text x="1240" y="310.2913" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8124" fill="var(--ok-accent)" font-weight="bold">More Available</text>
  <rect x="40" y="366.6019" width="210" height="253.3981" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="145" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--bg)">Strong</text>
  <text x="145" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--bg)">Consistency</text>
  <line x1="250.0001" y1="496.1165" x2="280" y2="496.1165" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="287.5" y="366.6019" width="210" height="253.3981" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="392.5" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold">Sequential</text>
  <text x="392.5" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937">Consistency</text>
  <line x1="497.5" y1="496.1165" x2="527.5" y2="496.1165" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="535" y="366.6019" width="210" height="253.3981" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold">Causal</text>
  <text x="640" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937">Consistency</text>
  <line x1="745" y1="496.1165" x2="775" y2="496.1165" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="782.5" y="366.6019" width="210" height="253.3981" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="887.5001" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold">Read-Your-</text>
  <text x="887.5001" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937">Writes</text>
  <line x1="992.5" y1="496.1165" x2="1022.5" y2="496.1165" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1030" y="366.6019" width="210" height="253.3981" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1135" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--bg)">Eventual</text>
  <text x="1135" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--bg)">Consistency</text>
</svg>
<svg viewBox="0 0 850 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <text x="425" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Consistency Models Spectrum</text>
  <!-- Spectrum bar -->
  <rect x="40" y="40" width="770" height="8" rx="4" fill="url(#spectrumGrad)"/>
  <defs>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
  </defs>
  <text x="40" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c" font-weight="bold">Stricter</text>
  <text x="810" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27ae60" font-weight="bold">More Available</text>
  <!-- Boxes -->
  <rect x="10" y="80" width="140" height="45" rx="5" fill="#f8d7da" stroke="#e74c3c" stroke-width="2"/>
  <text x="80" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Strong</text>
  <text x="80" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Consistency</text>
  <line x1="150" y1="103" x2="170" y2="103" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="175" y="80" width="140" height="45" rx="5" fill="#fce4e4" stroke="#c0392b" stroke-width="2"/>
  <text x="245" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Sequential</text>
  <text x="245" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Consistency</text>
  <line x1="315" y1="103" x2="335" y2="103" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="340" y="80" width="140" height="45" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="410" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Causal</text>
  <text x="410" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Consistency</text>
  <line x1="480" y1="103" x2="500" y2="103" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="505" y="80" width="140" height="45" rx="5" fill="#e8f8e8" stroke="#5cb85c" stroke-width="2"/>
  <text x="575" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Read-Your-</text>
  <text x="575" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Writes</text>
  <line x1="645" y1="103" x2="665" y2="103" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="670" y="80" width="140" height="45" rx="5" fill="#d4edda" stroke="#27ae60" stroke-width="2"/>
  <text x="740" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Eventual</text>
  <text x="740" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Consistency</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="662.5" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.5374" font-weight="bold" fill="var(--text)">Consistency Models Spectrum</text>
  <rect x="85" y="141.3592" width="1155" height="45.0485" rx="6" fill="url(#spectrumGrad)" />
  <defs>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="150.5882%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c" />
      <stop offset="100%" style="stop-color:#27ae60" />
    </linearGradient>
  </defs>
  <text x="85" y="310.2913" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8124" fill="var(--danger-accent)" font-weight="bold">Stricter</text>
  <text x="1240" y="310.2913" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8124" fill="var(--ok-accent)" font-weight="bold">More Available</text>
  <rect x="40" y="366.6019" width="210" height="253.3981" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="145" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--bg)">Strong</text>
  <text x="145" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--bg)">Consistency</text>
  <line x1="250.0001" y1="496.1165" x2="280" y2="496.1165" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="287.5" y="366.6019" width="210" height="253.3981" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="392.5" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--danger-text)">Sequential</text>
  <text x="392.5" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" fill="var(--danger-text)">Consistency</text>
  <line x1="497.5" y1="496.1165" x2="527.5" y2="496.1165" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="535" y="366.6019" width="210" height="253.3981" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--warn-text)">Causal</text>
  <text x="640" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" fill="var(--warn-text)">Consistency</text>
  <line x1="745" y1="496.1165" x2="775" y2="496.1165" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="782.5" y="366.6019" width="210" height="253.3981" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="887.5001" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--ok-text)">Read-Your-</text>
  <text x="887.5001" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" fill="var(--ok-text)">Writes</text>
  <line x1="992.5" y1="496.1165" x2="1022.5" y2="496.1165" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="1030" y="366.6019" width="210" height="253.3981" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1135" y="479.2233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--bg)">Eventual</text>
  <text x="1135" y="563.6893" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.4937" font-weight="bold" fill="var(--bg)">Consistency</text>
</svg>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="15.0588" markerHeight="31.5" refX="15.0588" refY="15.75" orient="auto">
      <polygon points="0,45 5.2706,0" fill="#4a90e2" />
    </marker>
  </defs>
  <text x="640" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.0824" font-weight="bold" fill="var(--text-dark)">Consistency Models Spectrum</text>
  <rect x="60.2353" y="180" width="1159.5294" height="36" rx="6.0235" fill="url(#spectrumGrad)" />
  <defs>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="150.5882%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c" />
      <stop offset="100%" style="stop-color:#27ae60" />
    </linearGradient>
  </defs>
  <text x="60.2353" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588" fill="var(--danger-light)" font-weight="bold">Stricter</text>
  <text x="1219.7647" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.0588" fill="var(--ok-soft)" font-weight="bold">More Available</text>
  <rect x="15.0588" y="360" width="210.8235" height="202.5" rx="7.5294" fill="var(--danger-pale2)" stroke="var(--danger-light)" stroke-width="3.0118" />
  <text x="120.4706" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold" fill="var(--bg)">Strong</text>
  <text x="120.4706" y="517.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold" fill="var(--bg)">Consistency</text>
  <line x1="225.8824" y1="463.5" x2="256" y2="463.5" stroke="var(--primary-bright)" stroke-width="3.0118" marker-end="url(#arrow)" />
  <rect x="263.5294" y="360" width="210.8235" height="202.5" rx="7.5294" fill="var(--danger-pale3)" stroke="var(--danger-dk)" stroke-width="3.0118" />
  <text x="368.9412" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Sequential</text>
  <text x="368.9412" y="517.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Consistency</text>
  <line x1="474.3529" y1="463.5" x2="504.4706" y2="463.5" stroke="var(--primary-bright)" stroke-width="3.0118" marker-end="url(#arrow)" />
  <rect x="512" y="360" width="210.8235" height="202.5" rx="7.5294" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="3.0118" />
  <text x="617.4118" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Causal</text>
  <text x="617.4118" y="517.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Consistency</text>
  <line x1="722.8235" y1="463.5" x2="752.9412" y2="463.5" stroke="var(--primary-bright)" stroke-width="3.0118" marker-end="url(#arrow)" />
  <rect x="760.4706" y="360" width="210.8235" height="202.5" rx="7.5294" fill="var(--ok-pale3)" stroke="var(--ok-light)" stroke-width="3.0118" />
  <text x="865.8824" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold">Read-Your-</text>
  <text x="865.8824" y="517.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647">Writes</text>
  <line x1="971.2941" y1="463.5" x2="1001.4118" y2="463.5" stroke="var(--primary-bright)" stroke-width="3.0118" marker-end="url(#arrow)" />
  <rect x="1008.9412" y="360" width="210.8235" height="202.5" rx="7.5294" fill="var(--ok-pale2)" stroke="var(--ok-soft)" stroke-width="3.0118" />
  <text x="1114.3529" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold" fill="var(--bg)">Eventual</text>
  <text x="1114.3529" y="517.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5647" font-weight="bold" fill="var(--bg)">Consistency</text>
</svg>
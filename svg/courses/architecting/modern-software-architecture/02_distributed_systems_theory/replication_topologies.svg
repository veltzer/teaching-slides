<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="527.6597" height="580" rx="6.235382541726" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.8736 4.9368"/>
  <text x="303.8298" y="93.359985744002" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.499130825308" font-weight="bold" fill="var(--primary-accent)">Single Leader</text>
  <rect x="184.6808" y="132.800069119992" width="238.2979" height="104.400023759997" rx="6.235382541726" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="303.8298" y="197.760009503999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.768500400852" font-weight="bold" fill="var(--primary-text)">Primary</text>
  <line x1="244.2554" y1="237.200092879989" x2="167.6596" y2="364.800025919997" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="363.4043" y1="237.200092879989" x2="439.9999" y2="364.800025919997" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="65.5319" y="376.399980560002" width="204.2553" height="92.800069119992" rx="6.235382541726" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="167.6596" y="434.400077759991" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.768500400852" fill="var(--ok-text)">Replica 1</text>
  <rect x="337.8723" y="376.399980560002" width="204.2553" height="92.800069119992" rx="6.235382541726" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="439.9999" y="434.400077759991" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.768500400852" fill="var(--ok-text)">Replica 2</text>
  <rect x="678.2979" y="40" width="561.7021" height="580" rx="6.235382541726" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.8736 4.9368"/>
  <text x="959.1489" y="93.359985744002" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.499130825308" font-weight="bold" fill="var(--ok-accent)">Multi Leader</text>
  <rect x="712.3405" y="132.800069119992" width="221.2767" height="104.400023759997" rx="6.235382541726" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="822.9787" y="197.760009503999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.768500400852" font-weight="bold" fill="var(--primary-text)">Leader 1</text>
  <rect x="1001.7021" y="132.800069119992" width="221.2767" height="104.400023759997" rx="6.235382541726" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.3405" y="197.760009503999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.768500400852" font-weight="bold" fill="var(--primary-text)">Leader 2</text>
  <line x1="933.6171" y1="174.559992224001" x2="993.1915" y2="174.559992224001" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1001.7021" y1="197.760009503999" x2="942.1277" y2="197.760009503999" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="822.9787" y1="237.200092879989" x2="797.4468" y2="364.800025919997" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1112.3405" y1="237.200092879989" x2="1112.3405" y2="364.800025919997" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="703.8298" y="376.399980560002" width="187.234" height="92.800069119992" rx="6.235382541726" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="797.4468" y="434.400077759991" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.768500400852" fill="var(--ok-text)">Replica</text>
  <rect x="1018.7234" y="376.399980560002" width="187.234" height="92.800069119992" rx="6.235382541726" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1112.3405" y="434.400077759991" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.768500400852" fill="var(--ok-text)">Replica</text>
</svg>

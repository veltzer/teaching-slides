<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-left" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <polygon points="0,0 5.9733,22.5" fill="#28a745" />
    </marker>
  </defs>
  <text x="617.0998" y="54.2373" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.0384" font-weight="bold" fill="var(--text)">Replication Topologies</text>
  <rect x="41.14" y="97.6271" width="510.1359" height="542.3729" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.8736 4.9368" />
  <text x="296.2079" y="147.5254" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3928" font-weight="bold" fill="var(--primary-accent)">Single Leader</text>
  <rect x="181.0159" y="184.4068" width="230.3839" height="97.6271" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="296.2079" y="245.1525" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7472" font-weight="bold">Primary</text>
  <line x1="238.612" y1="282.0339" x2="164.56" y2="401.3559" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="353.8039" y1="282.0339" x2="427.8558" y2="401.3559" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="65.824" y="412.2034" width="197.4719" height="86.7797" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="164.56" y="466.4407" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7472">Replica 1</text>
  <rect x="329.1199" y="412.2034" width="197.4719" height="86.7797" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="427.8558" y="466.4407" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7472">Replica 2</text>
  <rect x="658.2398" y="97.6271" width="543.0478" height="542.3729" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.8736 4.9368" />
  <text x="929.7637" y="147.5254" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.3928" font-weight="bold" fill="var(--ok-accent)">Multi Leader</text>
  <rect x="691.1518" y="184.4068" width="213.928" height="97.6271" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="798.1157" y="245.1525" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7472" font-weight="bold">Leader 1</text>
  <rect x="970.9037" y="184.4068" width="213.928" height="97.6271" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1077.8677" y="245.1525" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7472" font-weight="bold">Leader 2</text>
  <line x1="905.0798" y1="223.4576" x2="962.6757" y2="223.4576" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="970.9037" y1="245.1525" x2="913.3077" y2="245.1525" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="798.1157" y1="282.0339" x2="773.4317" y2="401.3559" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1077.8677" y1="282.0339" x2="1077.8677" y2="401.3559" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="682.9238" y="412.2034" width="181.0159" height="86.7797" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="773.4317" y="466.4407" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7472">Replica</text>
  <rect x="987.3597" y="412.2034" width="181.0159" height="86.7797" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1077.8677" y="466.4407" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.7472">Replica</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-left" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <polygon points="0,0 5.9733,22.5" fill="#28a745" />
    </marker>
  </defs>
  <text x="635.7447" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.3152" font-weight="bold" fill="var(--text)">Replication Topologies</text>
  <rect x="40" y="82.9629" width="527.6597" height="537.0371" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.8736 4.9368" />
  <text x="303.8298" y="132.3703" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6498" font-weight="bold" fill="var(--primary-accent)">Single Leader</text>
  <rect x="184.6808" y="168.8889" width="238.2979" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="303.8298" y="229.037" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9845" font-weight="bold">Primary</text>
  <line x1="244.2554" y1="265.5556" x2="167.6596" y2="383.7037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="363.4043" y1="265.5556" x2="439.9999" y2="383.7037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="65.5319" y="394.4444" width="204.2553" height="85.926" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="167.6596" y="448.1482" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9845">Replica 1</text>
  <rect x="337.8723" y="394.4444" width="204.2553" height="85.926" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="439.9999" y="448.1482" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9845">Replica 2</text>
  <rect x="678.2979" y="82.9629" width="561.7021" height="537.0371" rx="6" fill="none" stroke="var(--border)" stroke-width="1" stroke-dasharray="9.8736 4.9368" />
  <text x="959.1489" y="132.3703" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.6498" font-weight="bold" fill="var(--ok-accent)">Multi Leader</text>
  <rect x="712.3405" y="168.8889" width="221.2767" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="822.9787" y="229.037" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9845" font-weight="bold">Leader 1</text>
  <rect x="1001.7021" y="168.8889" width="221.2767" height="96.6667" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1112.3405" y="229.037" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9845" font-weight="bold">Leader 2</text>
  <line x1="933.6171" y1="207.5555" x2="993.1915" y2="207.5555" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1001.7021" y1="229.037" x2="942.1277" y2="229.037" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="822.9787" y1="265.5556" x2="797.4468" y2="383.7037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1112.3405" y1="265.5556" x2="1112.3405" y2="383.7037" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="703.8298" y="394.4444" width="187.234" height="85.926" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="797.4468" y="448.1482" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9845">Replica</text>
  <rect x="1018.7234" y="394.4444" width="187.234" height="85.926" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1112.3405" y="448.1482" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9845">Replica</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="635.817" y="47.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.4327" font-weight="bold" fill="var(--text)">Raft Consensus Overview</text>
  <rect x="490.4874" y="94.1176" width="290.6592" height="94.1176" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="635.817" y="150.5882" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.616" font-weight="bold">Leader</text>
  <rect x="54.4986" y="338.8235" width="254.3268" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="181.662" y="391.5295" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7995">Follower 1</text>
  <rect x="363.324" y="338.8235" width="254.3268" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="490.4874" y="391.5295" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7995">Follower 2</text>
  <rect x="672.1494" y="338.8235" width="254.3268" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="799.3128" y="391.5295" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7995">Follower 3</text>
  <rect x="980.9749" y="338.8235" width="254.3268" height="84.7059" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1108.1383" y="391.5295" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7995">Follower 4</text>
  <line x1="581.3185" y1="188.2353" x2="199.8282" y2="329.4117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="608.5677" y1="188.2353" x2="499.5705" y2="329.4117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="663.0663" y1="188.2353" x2="790.2298" y2="329.4117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="690.3156" y1="188.2353" x2="1089.9721" y2="329.4117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="345.1578" y="254.1177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1662" fill="var(--primary-accent)">AppendEntries</text>
  <text x="944.6424" y="254.1177" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1662" fill="var(--primary-accent)">AppendEntries</text>
  <line x1="163.4958" y1="423.5294" x2="563.1522" y2="527.0588" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <line x1="472.3212" y1="423.5294" x2="599.4846" y2="527.0588" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <line x1="817.479" y1="423.5294" x2="672.1494" y2="527.0588" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <line x1="1126.3044" y1="423.5294" x2="708.4819" y2="527.0588" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <rect x="490.4874" y="517.647" width="290.6592" height="65.8824" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="635.817" y="559.0588" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9828" fill="var(--ok-accent)" font-weight="bold">Acknowledge (ACK)</text>
  <text x="635.817" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9828" fill="var(--text-muted)" font-style="italic">Majority ACKs required for commit</text>
</svg>
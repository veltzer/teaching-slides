<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

  </defs>
  <text x="630.7692" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3573" font-weight="bold" fill="var(--text)">Raft Consensus Overview</text>
  <rect x="483.0769" y="86.0317" width="295.3846" height="92.0634" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7692" y="141.2698" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.546" font-weight="bold" fill="var(--primary-text)">Leader</text>
  <rect x="40" y="325.3968" width="258.4615" height="82.8572" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.2308" y="376.9525" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7348" fill="var(--ok-text)">Follower 1</text>
  <rect x="353.8461" y="325.3968" width="258.4615" height="82.8572" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.0769" y="376.9525" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7348" fill="var(--ok-text)">Follower 2</text>
  <rect x="667.6923" y="325.3968" width="258.4615" height="82.8572" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.923" y="376.9525" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7348" fill="var(--ok-text)">Follower 3</text>
  <rect x="981.5385" y="325.3968" width="258.4615" height="82.8572" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.7692" y="376.9525" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7348" fill="var(--ok-text)">Follower 4</text>
  <line x1="575.3847" y1="178.0953" x2="187.6923" y2="316.1904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="603.0769" y1="178.0953" x2="492.3077" y2="316.1904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="658.4615" y1="178.0953" x2="787.6923" y2="316.1904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="686.1538" y1="178.0953" x2="1092.3077" y2="316.1904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="335.3846" y="242.5397" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1123" fill="var(--primary-accent)">AppendEntries</text>
  <text x="944.6153" y="242.5397" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1123" fill="var(--primary-accent)">AppendEntries</text>
  <line x1="150.7692" y1="408.254" x2="556.923" y2="509.5238" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <line x1="464.6153" y1="408.254" x2="593.8461" y2="509.5238" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <line x1="815.3845" y1="408.254" x2="667.6923" y2="509.5238" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <line x1="1129.2307" y1="408.254" x2="704.6154" y2="509.5238" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <rect x="483.0769" y="500.3174" width="295.3846" height="64.4445" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7692" y="540.8254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9235" fill="var(--ok-accent)" font-weight="bold">Acknowledge (ACK)</text>
  <text x="630.7692" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9235" fill="var(--text-muted)" font-style="italic">Majority ACKs required for commit</text>
</svg>
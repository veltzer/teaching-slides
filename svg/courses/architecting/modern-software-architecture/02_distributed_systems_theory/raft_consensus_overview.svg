<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 6.4,0" fill="#28a745" />
    </marker>
  </defs>
  <text x="630.7692" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="25.3573" font-weight="bold" fill="var(--text)">Raft Consensus Overview</text>
  <rect x="483.0769" y="86.0317" width="295.3846" height="92.0634" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7692" y="141.2698" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.546" font-weight="bold">Leader</text>
  <rect x="40" y="325.3968" width="258.4615" height="82.8572" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="169.2308" y="376.9525" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7348">Follower 1</text>
  <rect x="353.8461" y="325.3968" width="258.4615" height="82.8572" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="483.0769" y="376.9525" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7348">Follower 2</text>
  <rect x="667.6923" y="325.3968" width="258.4615" height="82.8572" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="796.923" y="376.9525" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7348">Follower 3</text>
  <rect x="981.5385" y="325.3968" width="258.4615" height="82.8572" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1110.7692" y="376.9525" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.7348">Follower 4</text>
  <line x1="575.3847" y1="178.0953" x2="187.6923" y2="316.1904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="603.0769" y1="178.0953" x2="492.3077" y2="316.1904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="658.4615" y1="178.0953" x2="787.6923" y2="316.1904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="686.1538" y1="178.0953" x2="1092.3077" y2="316.1904" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="335.3846" y="242.5397" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1123" fill="var(--primary-accent)">AppendEntries</text>
  <text x="944.6153" y="242.5397" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.1123" fill="var(--primary-accent)">AppendEntries</text>
  <line x1="150.7692" y1="408.254" x2="556.923" y2="509.5238" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <line x1="464.6153" y1="408.254" x2="593.8461" y2="509.5238" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <line x1="815.3845" y1="408.254" x2="667.6923" y2="509.5238" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <line x1="1129.2307" y1="408.254" x2="704.6154" y2="509.5238" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="7.2665 3.6332" marker-end="url(#arrow-ok)" />
  <rect x="483.0769" y="500.3174" width="295.3846" height="64.4445" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="630.7692" y="540.8254" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9235" fill="var(--ok-accent)" font-weight="bold">Acknowledge (ACK)</text>
  <text x="630.7692" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9235" fill="var(--text-muted)" font-style="italic">Majority ACKs required for commit</text>
</svg>
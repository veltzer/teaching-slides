<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Raft Consensus Overview</text>
  <!-- Leader -->
  <rect x="270" y="50" width="160" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="350" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Leader</text>
  <!-- Followers -->
  <rect x="30" y="180" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="100" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Follower 1</text>
  <rect x="200" y="180" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="270" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Follower 2</text>
  <rect x="370" y="180" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="440" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Follower 3</text>
  <rect x="540" y="180" width="140" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="610" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Follower 4</text>
  <!-- AppendEntries arrows (down) -->
  <line x1="320" y1="100" x2="110" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="335" y1="100" x2="275" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="365" y1="100" x2="435" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="100" x2="600" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Labels -->
  <text x="190" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4a90e2">AppendEntries</text>
  <text x="520" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4a90e2">AppendEntries</text>
  <!-- Acknowledge arrows (up) -->
  <line x1="90" y1="225" x2="310" y2="280" stroke="#28a745" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead-green)"/>
  <line x1="260" y1="225" x2="330" y2="280" stroke="#28a745" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead-green)"/>
  <line x1="450" y1="225" x2="370" y2="280" stroke="#28a745" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead-green)"/>
  <line x1="620" y1="225" x2="390" y2="280" stroke="#28a745" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead-green)"/>
  <!-- Acknowledge label box -->
  <rect x="270" y="275" width="160" height="35" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="350" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#28a745" font-weight="bold">Acknowledge (ACK)</text>
  <text x="350" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666" font-style="italic">Majority ACKs required for commit</text>
</svg>

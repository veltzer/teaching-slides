<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc3545"/>
    </marker>
  </defs>
  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Active-Passive Architecture</text>
  <!-- Load Balancer -->
  <rect x="240" y="45" width="180" height="45" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="330" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Load Balancer</text>
  <!-- Arrow to active node -->
  <line x1="290" y1="90" x2="180" y2="150" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Active node -->
  <rect x="80" y="155" width="190" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="175" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Node 1 - Active</text>
  <!-- Standby node -->
  <rect x="430" y="155" width="190" height="45" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="525" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Node 2 - Standby</text>
  <!-- Heartbeat -->
  <line x1="270" y1="175" x2="425" y2="175" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="350" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">Heartbeat</text>
  <!-- Failover arrow -->
  <path d="M 525 155 Q 525 110 420 90" fill="none" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead-red)"/>
  <text x="510" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">Failover</text>
  <!-- DB Primary -->
  <line x1="175" y1="200" x2="175" y2="255" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <ellipse cx="175" cy="280" rx="70" ry="25" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="175" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">DB Primary</text>
  <!-- Replication -->
  <line x1="245" y1="280" x2="430" y2="280" stroke="#dc3545" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="340" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc3545">Replication</text>
  <!-- DB Standby -->
  <ellipse cx="500" cy="280" rx="70" ry="25" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="500" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">DB Standby</text>
</svg>

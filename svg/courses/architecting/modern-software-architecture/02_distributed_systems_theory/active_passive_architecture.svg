<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.4607" font-weight="bold" fill="var(--text)">Active-Passive Architecture</text>
  <rect x="395.5554" y="81.8437" width="400.0001" height="94.1483" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="595.5555" y="140.4249" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4277" font-weight="bold" fill="var(--primary-text)">Load Balancer</text>
  <line x1="506.6668" y1="175.992" x2="262.2223" y2="301.5231" stroke="var(--primary-border)" stroke-width="0.9667" marker-end="url(#arrow)"/>
  <rect x="40" y="311.9838" width="422.2222" height="94.1483" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="251.1111" y="370.5652" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3948" font-weight="bold" fill="var(--ok-text)">Node 1 - Active</text>
  <rect x="817.7778" y="311.9838" width="422.2222" height="94.1483" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.8887" y="370.5652" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3948" font-weight="bold" fill="var(--danger-text)">Node 2 - Standby</text>
  <line x1="462.2222" y1="353.8276" x2="806.6666" y2="353.8276" stroke="var(--text-faint)" stroke-width="0.8838" stroke-dasharray="2.9461 1.7676"/>
  <text x="640" y="339.1824" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3292" fill="var(--text-faint)">Heartbeat</text>
  <path d="M 1028.8887 311.9838 Q 1028.8887 217.8354 795.5555 175.992" fill="none" stroke="var(--danger-border)" stroke-width="0.8838" stroke-dasharray="2.9461 1.7676" marker-end="url(#arrow-danger)"/>
  <text x="995.5554" y="228.2967" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3292" fill="var(--danger-accent)">Failover</text>
  <line x1="251.1111" y1="406.1323" x2="251.1111" y2="521.2024" stroke="var(--primary-border)" stroke-width="0.9667" marker-end="url(#arrow)"/>
  <ellipse cx="251.1111" cy="573.5069" rx="155.5555" ry="46.4931" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1784"/>
  <text x="251.1111" y="583.9679" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3619" font-weight="bold" fill="var(--text)">DB Primary</text>
  <line x1="406.6666" y1="573.5069" x2="817.7778" y2="573.5069" stroke="var(--danger-border)" stroke-width="0.9667" marker-end="url(#arrow-danger)"/>
  <text x="617.7779" y="558.8619" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3292" fill="var(--danger-accent)">Replication</text>
  <ellipse cx="973.3331" cy="573.5069" rx="155.5555" ry="46.4931" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1784"/>
  <text x="973.3331" y="583.9679" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3619" font-weight="bold" fill="var(--text)">DB Standby</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.4449" font-weight="bold" fill="var(--text)">Active-Passive Architecture</text>
  <rect x="463.6472" y="116.0722" width="288.5772" height="81.1623" rx="7.8908" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="607.9358" y="166.5732" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8417" font-weight="bold">Load Balancer</text>
  <line x1="543.8076" y1="197.2345" x2="367.4549" y2="305.4509" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="207.1342" y="314.4689" width="304.6093" height="81.1623" rx="7.8908" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="359.4388" y="364.9699" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2385" font-weight="bold">Node 1 - Active</text>
  <rect x="768.2565" y="314.4689" width="304.6093" height="81.1623" rx="7.8908" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="920.5611" y="364.9699" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2385" font-weight="bold">Node 2 - Standby</text>
  <line x1="511.7435" y1="350.5411" x2="760.2405" y2="350.5411" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="6.0953 3.6571" />
  <text x="640" y="337.9158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0321" fill="var(--text-faint)">Heartbeat</text>
  <path d="M 920.5611 314.4689 Q 920.5611 233.3066 752.2244 197.2345" fill="none" stroke="var(--danger-border)" stroke-width="1.8286" stroke-dasharray="6.0953 3.6571" marker-end="url(#arrow-danger)" />
  <text x="896.513" y="242.3247" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0321" fill="var(--danger-accent)">Failover</text>
  <line x1="359.4388" y1="395.6312" x2="359.4388" y2="494.8297" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <ellipse cx="359.4388" cy="539.9198" rx="112.2244" ry="40.0802" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4381" />
  <text x="359.4388" y="548.9378" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6352" font-weight="bold">DB Primary</text>
  <line x1="471.6633" y1="539.9198" x2="768.2565" y2="539.9198" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="623.9679" y="527.2946" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0321" fill="var(--danger-accent)">Replication</text>
  <ellipse cx="880.4809" cy="539.9198" rx="112.2244" ry="40.0802" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.4381" />
  <text x="880.4809" y="548.9378" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6352" font-weight="bold">DB Standby</text>
</svg>
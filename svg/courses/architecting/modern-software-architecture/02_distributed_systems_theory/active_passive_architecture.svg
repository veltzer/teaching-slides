<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="426.6667" y="34.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0667" font-weight="bold" fill="var(--text)">Active-Passive Architecture</text>
  <rect x="292.5714" y="61.7143" width="219.4286" height="61.7143" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="402.2857" y="100.1143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8476" font-weight="bold">Load Balancer</text>
  <line x1="353.5238" y1="123.4286" x2="219.4286" y2="205.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="97.5238" y="212.5714" width="231.6191" height="61.7143" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="213.3333" y="250.9714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6286" font-weight="bold">Node 1 - Active</text>
  <rect x="524.1905" y="212.5714" width="231.6191" height="61.7143" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="640" y="250.9714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6286" font-weight="bold">Node 2 - Standby</text>
  <line x1="329.1429" y1="240" x2="518.0953" y2="240" stroke="var(--text-faint)" stroke-width="1.8286" stroke-dasharray="6.0953 3.6571" />
  <text x="426.6667" y="230.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1905" fill="var(--text-faint)">Heartbeat</text>
  <path d="M 640 212.5714 Q 640 150.8571 512 123.4286" fill="none" stroke="var(--danger-border)" stroke-width="1.8286" stroke-dasharray="6.0953 3.6571" marker-end="url(#arrow-danger)" />
  <text x="621.7143" y="157.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1905" fill="var(--danger-accent)">Failover</text>
  <line x1="213.3333" y1="274.2857" x2="213.3333" y2="349.7143" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <ellipse cx="213.3333" cy="384" rx="85.3333" ry="30.4762" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2.4381" />
  <text x="213.3333" y="390.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.4095" font-weight="bold">DB Primary</text>
  <line x1="298.6667" y1="384" x2="524.1905" y2="384" stroke="var(--danger-border)" stroke-width="2" marker-end="url(#arrow-danger)" />
  <text x="414.4762" y="374.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1905" fill="var(--danger-accent)">Replication</text>
  <ellipse cx="609.5238" cy="384" rx="85.3333" ry="30.4762" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2.4381" />
  <text x="609.5238" y="390.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.4095" font-weight="bold">DB Standby</text>
</svg>
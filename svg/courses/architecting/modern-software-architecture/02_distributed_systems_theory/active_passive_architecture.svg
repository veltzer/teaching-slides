<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --surface-alt: #eeeeee;
        --surface-light: #f9f9f9;
        --surface-dark: #f0f0f0;
        --border: #e0e0e0;
        --border-strong: #bdbdbd;
        --border-faint: #cccccc;
        --border-softer: #dddddd;
        --text: #212121;
        --text-dark: #333333;
        --text-darker: #222222;
        --text-muted: #555555;
        --text-mid: #666666;
        --text-faint: #888888;
        --text-lighter: #777777;
        --text-faintest: #999999;
        --text-disabled: #9e9e9e;
        --text-placeholder: #aaaaaa;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary: #1e88e5;
        --primary-dk: #1565c0;
        --primary-mid: #1976d2;
        --primary-bright: #4a90e2;
        --primary-vivid: #2196f3;
        --primary-soft: #3498db;
        --primary-deep: #0d47a1;
        --primary-deeper: #1a237e;
        --primary-strong: #0277bd;
        --primary-lt: #bbdefb;
        --primary-tint: #90caf9;
        --primary-pale: #e3f2fd;
        --primary-pale2: #e8f4f8;
        --primary-pale3: #e1f5fe;
        --primary-indigo: #3949ab;
        --primary-indigo-dk: #283593;
        --primary-google: #4285f4;
        --ok: #43a047;
        --ok-dk: #2e7d32;
        --ok-mid: #388e3c;
        --ok-light: #4caf50;
        --ok-bright: #28a745;
        --ok-vivid: #2ecc71;
        --ok-soft: #27ae60;
        --ok-google: #34a853;
        --ok-deep: #1b5e20;
        --ok-lt: #c8e6c9;
        --ok-tint: #a5d6a7;
        --ok-pale: #e8f5e9;
        --ok-pale2: #d4edda;
        --ok-pale3: #e8f5e8;
        --warn: #fb8c00;
        --warn-dk: #e65100;
        --warn-mid: #f57c00;
        --warn-amber: #f9a825;
        --warn-yellow: #ffc107;
        --warn-orange: #ff9800;
        --warn-gold: #f39c12;
        --warn-bright: #fbbc04;
        --warn-deep: #ef6c00;
        --warn-lt: #ffe0b2;
        --warn-tint: #ffcc80;
        --warn-pale: #fff3e0;
        --warn-pale2: #fff3cd;
        --warn-pale3: #fff8e1;
        --warn-pale4: #fff9c4;
        --danger: #e53935;
        --danger-dk: #c62828;
        --danger-mid: #d32f2f;
        --danger-light: #e74c3c;
        --danger-vivid: #f44336;
        --danger-bright: #dc3545;
        --danger-google: #ea4335;
        --danger-deep: #b71c1c;
        --danger-deeper: #bf360c;
        --danger-pink: #c2185b;
        --danger-lt: #ffcdd2;
        --danger-pale: #ffebee;
        --danger-pale2: #f8d7da;
        --danger-pale3: #fce4ec;
        --info: #8e24aa;
        --info-dk: #6a1b9a;
        --info-mid: #7b1fa2;
        --info-light: #9c27b0;
        --info-vivid: #673ab7;
        --info-deep: #4a148c;
        --info-soft: #9b59b6;
        --info-lt: #ce93d8;
        --info-tint: #e1bee7;
        --info-pale: #f3e5f5;
        --info-indigo: #3f51b5;
        --info-indigo-lt: #e8eaf6;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="426.6667" y="34.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.0667" font-weight="bold" fill="var(--text-dark)">Active-Passive Architecture</text>
  <rect x="292.5714" y="61.7143" width="219.4286" height="61.7143" rx="6.0953" fill="var(--primary-pale2)" stroke="var(--primary-bright)" stroke-width="2.4381" />
  <text x="402.2857" y="100.1143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.8476" font-weight="bold">Load Balancer</text>
  <line x1="353.5238" y1="123.4286" x2="219.4286" y2="205.7143" stroke="var(--primary-bright)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <rect x="97.5238" y="212.5714" width="231.6191" height="61.7143" rx="6.0953" fill="var(--ok-pale2)" stroke="var(--ok-bright)" stroke-width="2.4381" />
  <text x="213.3333" y="250.9714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6286" font-weight="bold">Node 1 - Active</text>
  <rect x="524.1905" y="212.5714" width="231.6191" height="61.7143" rx="6.0953" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4381" />
  <text x="640" y="250.9714" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.6286" font-weight="bold">Node 2 - Standby</text>
  <line x1="329.1429" y1="240" x2="518.0953" y2="240" stroke="var(--text-faintest)" stroke-width="1.8286" stroke-dasharray="6.0953 3.6571" />
  <text x="426.6667" y="230.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1905" fill="var(--text-faintest)">Heartbeat</text>
  <path d="M 640 212.5714 Q 640 150.8571 512 123.4286" fill="none" stroke="var(--danger-bright)" stroke-width="1.8286" stroke-dasharray="6.0953 3.6571" marker-end="url(#arrow-danger)" />
  <text x="621.7143" y="157.7143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1905" fill="var(--danger-bright)">Failover</text>
  <line x1="213.3333" y1="274.2857" x2="213.3333" y2="349.7143" stroke="var(--primary-bright)" stroke-width="2.4381" marker-end="url(#arrow)" />
  <ellipse cx="213.3333" cy="384" rx="85.3333" ry="30.4762" fill="var(--warn-pale2)" stroke="var(--warn-yellow)" stroke-width="2.4381" />
  <text x="213.3333" y="390.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.4095" font-weight="bold">DB Primary</text>
  <line x1="298.6667" y1="384" x2="524.1905" y2="384" stroke="var(--danger-bright)" stroke-width="2.4381" marker-end="url(#arrow-danger)" />
  <text x="414.4762" y="374.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.1905" fill="var(--danger-bright)">Replication</text>
  <ellipse cx="609.5238" cy="384" rx="85.3333" ry="30.4762" fill="var(--danger-pale2)" stroke="var(--danger-bright)" stroke-width="2.4381" />
  <text x="609.5238" y="390.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.4095" font-weight="bold">DB Standby</text>
</svg>
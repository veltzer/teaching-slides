<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="640" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28.4607" font-weight="bold" fill="var(--text)">Active-Passive Architecture</text>
  <rect x="395.5554" y="81.8437" width="400.0001" height="94.1483" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="595.5555" y="140.4249" text-anchor="middle" font-family="Arial, sans-serif" font-size="26.4277" font-weight="bold">Load Balancer</text>
  <line x1="506.6668" y1="175.992" x2="262.2223" y2="301.5231" stroke="var(--primary-border)" stroke-width="0.9667" marker-end="url(#arrow)" />
  <rect x="40" y="311.9838" width="422.2222" height="94.1483" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="251.1111" y="370.5652" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3948" font-weight="bold">Node 1 - Active</text>
  <rect x="817.7778" y="311.9838" width="422.2222" height="94.1483" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1028.8887" y="370.5652" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.3948" font-weight="bold">Node 2 - Standby</text>
  <line x1="462.2222" y1="353.8276" x2="806.6666" y2="353.8276" stroke="var(--text-faint)" stroke-width="0.8838" stroke-dasharray="2.9461 1.7676" />
  <text x="640" y="339.1824" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3292" fill="var(--text-faint)">Heartbeat</text>
  <path d="M 1028.8887 311.9838 Q 1028.8887 217.8354 795.5555 175.992" fill="none" stroke="var(--danger-border)" stroke-width="0.8838" stroke-dasharray="2.9461 1.7676" marker-end="url(#arrow-danger)" />
  <text x="995.5554" y="228.2967" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3292" fill="var(--danger-accent)">Failover</text>
  <line x1="251.1111" y1="406.1323" x2="251.1111" y2="521.2024" stroke="var(--primary-border)" stroke-width="0.9667" marker-end="url(#arrow)" />
  <ellipse cx="251.1111" cy="573.5069" rx="155.5555" ry="46.4931" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1784" />
  <text x="251.1111" y="583.9679" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3619" font-weight="bold">DB Primary</text>
  <line x1="406.6666" y1="573.5069" x2="817.7778" y2="573.5069" stroke="var(--danger-border)" stroke-width="0.9667" marker-end="url(#arrow-danger)" />
  <text x="617.7779" y="558.8619" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.3292" fill="var(--danger-accent)">Replication</text>
  <ellipse cx="973.3331" cy="573.5069" rx="155.5555" ry="46.4931" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1784" />
  <text x="973.3331" y="583.9679" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.3619" font-weight="bold">DB Standby</text>
</svg>
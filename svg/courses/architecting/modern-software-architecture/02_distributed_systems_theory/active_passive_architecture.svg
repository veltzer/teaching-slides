<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3" />
      <stop offset="100%" stop-color="#1565c0" />
    </linearGradient>
    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f5" />
    </linearGradient>
    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#2e7d32" />
    </linearGradient>
    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c62828" />
    </linearGradient>
    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0" />
      <stop offset="100%" stop-color="#6a1b9a" />
    </linearGradient>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555" />
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0" />
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32" />
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100" />
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828" />
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a" />
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff" />
    </marker>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 6.4,0" fill="#dc3545" />
    </marker>
  </defs>
  <text x="444.946" y="55.6183" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.6043" font-weight="bold" fill="var(--text)">Active-Passive Architecture</text>
  <rect x="322.3405" y="80.6967" width="200.6271" height="56.4263" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="1.3905" />
  <text x="422.6541" y="115.8064" text-anchor="middle" font-family="Arial, sans-serif" font-size="14.4897" font-weight="bold">Load Balancer</text>
  <line x1="378.0704" y1="137.123" x2="255.4649" y2="212.3581" stroke="var(--primary-border)" stroke-width="0.9667" marker-end="url(#arrow)" />
  <rect x="144.0054" y="218.6276" width="211.773" height="56.4263" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="1.3905" />
  <text x="249.8919" y="253.7374" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3751" font-weight="bold">Node 1 - Active</text>
  <rect x="534.1136" y="218.6276" width="211.773" height="56.4263" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.3905" />
  <text x="640" y="253.7374" text-anchor="middle" font-family="Arial, sans-serif" font-size="13.3751" font-weight="bold">Node 2 - Standby</text>
  <line x1="355.7784" y1="243.706" x2="528.5406" y2="243.706" stroke="var(--text-faint)" stroke-width="0.8838" stroke-dasharray="2.9461 1.7676" />
  <text x="444.946" y="234.9286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.146" fill="var(--text-faint)">Heartbeat</text>
  <path d="M 640 218.6276 Q 640 162.2012 522.9676 137.123" fill="none" stroke="var(--danger-border)" stroke-width="0.8838" stroke-dasharray="2.9461 1.7676" marker-end="url(#arrow-danger)" />
  <text x="623.2811" y="168.471" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.146" fill="var(--danger-accent)">Failover</text>
  <line x1="249.8919" y1="275.054" x2="249.8919" y2="344.0195" stroke="var(--primary-border)" stroke-width="0.9667" marker-end="url(#arrow)" />
  <ellipse cx="249.8919" cy="375.3674" rx="78.0216" ry="27.8649" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="1.1784" />
  <text x="249.8919" y="381.637" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2605" font-weight="bold">DB Primary</text>
  <line x1="327.9135" y1="375.3674" x2="534.1136" y2="375.3674" stroke="var(--danger-border)" stroke-width="0.9667" marker-end="url(#arrow-danger)" />
  <text x="433.8001" y="366.5901" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.146" fill="var(--danger-accent)">Replication</text>
  <ellipse cx="612.1351" cy="375.3674" rx="78.0216" ry="27.8649" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="1.1784" />
  <text x="612.1351" y="381.637" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.2605" font-weight="bold">DB Standby</text>
</svg>
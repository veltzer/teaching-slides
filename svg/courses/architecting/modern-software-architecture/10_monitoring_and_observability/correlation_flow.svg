<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="300" height="113.7255" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0001" y="90.0392" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold" fill="var(--danger-text)">Alert</text>
  <text x="190.0001" y="126.4314" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946" fill="var(--danger-text)">High p99 latency</text>
  <rect x="40" y="221.9608" width="300" height="113.7255" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0001" y="272.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold" fill="var(--warn-text)">Dashboard</text>
  <text x="190.0001" y="308.3922" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946" fill="var(--warn-text)">Which endpoint?</text>
  <rect x="40" y="403.9216" width="300" height="113.7255" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0001" y="453.9608" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold" fill="var(--primary-text)">Trace</text>
  <text x="190.0001" y="490.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946" fill="var(--primary-text)">Find slow spans</text>
  <rect x="498.8235" y="221.9608" width="300" height="113.7255" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.8235" y="272.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold" fill="var(--primary-text)">Logs</text>
  <text x="648.8235" y="308.3922" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946" fill="var(--primary-text)">Error details for trace ID</text>
  <rect x="940" y="221.9608" width="300" height="113.7255" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="272.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold" fill="var(--ok-text)">Root Cause</text>
  <text x="1090" y="308.3922" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946" fill="var(--ok-text)">Identified</text>
  <line x1="190.0001" y1="153.7255" x2="190.0001" y2="217.4118" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190.0001" y1="335.6862" x2="190.0001" y2="399.3725" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 190.0001 517.6471 L 190.0001 563.1372 L 648.8235 563.1372 L 648.8235 340.2353" fill="none" stroke="var(--primary-border)" stroke-width="3.1937" marker-end="url(#arrow)"/>
  <line x1="798.8235" y1="278.8235" x2="936.4707" y2="278.8235" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="648.8235" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" fill="var(--text-muted)">Metrics, Traces, and Logs correlate to pinpoint root causes</text>
</svg>

<svg viewBox="0 0 750 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Steps -->
  <rect x="30" y="30" width="170" height="50" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="115" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Alert</text>
  <text x="115" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">High p99 latency</text>
  <rect x="30" y="110" width="170" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="115" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Dashboard</text>
  <text x="115" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Which endpoint?</text>
  <rect x="30" y="190" width="170" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="115" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Trace</text>
  <text x="115" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Find slow spans</text>
  <!-- Continue right -->
  <rect x="290" y="110" width="170" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="375" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Logs</text>
  <text x="375" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Error details for trace ID</text>
  <rect x="540" y="110" width="170" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="625" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Root Cause</text>
  <text x="625" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Identified</text>
  <!-- Arrows -->
  <line x1="115" y1="80" x2="115" y2="108" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="115" y1="160" x2="115" y2="188" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M 115,240 L 115,260 L 375,260 L 375,162" fill="none" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="135" x2="538" y2="135" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Labels -->
  <text x="375" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Metrics, Traces, and Logs correlate to pinpoint root causes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="47.9064" y="67.3684" width="271.4698" height="112.2807" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="183.6414" y="116.7719" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5657" font-weight="bold">Alert</text>
  <text x="183.6414" y="152.7018" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9688">High p99 latency</text>
  <rect x="47.9064" y="247.0175" width="271.4698" height="112.2807" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="183.6414" y="296.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5657" font-weight="bold">Dashboard</text>
  <text x="183.6414" y="332.3509" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9688">Which endpoint?</text>
  <rect x="47.9064" y="426.6667" width="271.4698" height="112.2807" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="183.6414" y="476.0702" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5657" font-weight="bold">Trace</text>
  <text x="183.6414" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9688">Find slow spans</text>
  <rect x="463.0955" y="247.0175" width="271.4698" height="112.2807" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="598.8304" y="296.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5657" font-weight="bold">Logs</text>
  <text x="598.8304" y="332.3509" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9688">Error details for trace ID</text>
  <rect x="862.3158" y="247.0175" width="271.4698" height="112.2807" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="998.0507" y="296.4211" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5657" font-weight="bold">Root Cause</text>
  <text x="998.0507" y="332.3509" text-anchor="middle" font-family="Arial, sans-serif" font-size="15.9688">Identified</text>
  <line x1="183.6414" y1="179.6491" x2="183.6414" y2="242.5263" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="183.6414" y1="359.2982" x2="183.6414" y2="422.1754" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 183.6414 538.9474 L 183.6414 583.8596 L 598.8304 583.8596 L 598.8304 363.7895" fill="none" stroke="var(--primary-border)" stroke-width="3.1937" marker-end="url(#arrow)" />
  <line x1="734.5653" y1="303.1579" x2="859.1221" y2="303.1579" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="598.8304" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.5657" fill="var(--text-muted)">Metrics, Traces, and Logs correlate to pinpoint root causes</text>
</svg>
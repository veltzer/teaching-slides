<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="300" height="113.7255" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0001" y="90.0392" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold">Alert</text>
  <text x="190.0001" y="126.4314" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946">High p99 latency</text>
  <rect x="40" y="221.9608" width="300" height="113.7255" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0001" y="272.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold">Dashboard</text>
  <text x="190.0001" y="308.3922" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946">Which endpoint?</text>
  <rect x="40" y="403.9216" width="300" height="113.7255" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="190.0001" y="453.9608" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold">Trace</text>
  <text x="190.0001" y="490.3529" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946">Find slow spans</text>
  <rect x="498.8235" y="221.9608" width="300" height="113.7255" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.8235" y="272.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold">Logs</text>
  <text x="648.8235" y="308.3922" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946">Error details for trace ID</text>
  <rect x="940" y="221.9608" width="300" height="113.7255" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1090" y="272.0001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" font-weight="bold">Root Cause</text>
  <text x="1090" y="308.3922" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.8946">Identified</text>
  <line x1="190.0001" y1="153.7255" x2="190.0001" y2="217.4118" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="190.0001" y1="335.6862" x2="190.0001" y2="399.3725" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 190.0001 517.6471 L 190.0001 563.1372 L 648.8235 563.1372 L 648.8235 340.2353" fill="none" stroke="var(--primary-border)" stroke-width="3.1937" marker-end="url(#arrow)" />
  <line x1="798.8235" y1="278.8235" x2="936.4707" y2="278.8235" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="648.8235" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.5841" fill="var(--text-muted)">Metrics, Traces, and Logs correlate to pinpoint root causes</text>
</svg>
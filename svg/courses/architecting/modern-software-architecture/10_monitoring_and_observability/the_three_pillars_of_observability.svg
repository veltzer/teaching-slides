<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,24 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="485.7143" y="40" width="308.5714" height="120.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="640.0001" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0296" font-weight="bold">Observability</text>
  <rect x="74.2858" y="305.8333" width="308.5714" height="120.8333" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="228.5715" y="378.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0296" font-weight="bold">Metrics</text>
  <rect x="485.7143" y="305.8333" width="308.5714" height="120.8333" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="640.0001" y="378.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0296" font-weight="bold">Logs</text>
  <rect x="897.1429" y="305.8333" width="308.5714" height="120.8333" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1051.4286" y="378.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.0296" font-weight="bold">Traces</text>
  <rect x="40" y="499.1667" width="377.1429" height="120.8333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="228.5715" y="552.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8804">Quantitative measurements</text>
  <text x="228.5715" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8804">over time</text>
  <rect x="451.4286" y="499.1667" width="377.1429" height="120.8333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="640.0001" y="552.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8804">Discrete events</text>
  <text x="640.0001" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8804">with context</text>
  <rect x="862.8571" y="499.1667" width="377.1429" height="120.8333" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="1051.4286" y="552.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8804">Request flow across</text>
  <text x="1051.4286" y="591" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.8804">services</text>
  <line x1="554.2857" y1="160.8333" x2="280.0001" y2="301" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="160.8333" x2="640.0001" y2="301" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="725.7143" y1="160.8333" x2="1000" y2="301" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="228.5715" y1="426.6667" x2="228.5715" y2="494.3333" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="640.0001" y1="426.6667" x2="640.0001" y2="494.3333" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1051.4286" y1="426.6667" x2="1051.4286" y2="494.3333" stroke="var(--border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
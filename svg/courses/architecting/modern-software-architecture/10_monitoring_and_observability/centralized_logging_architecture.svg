<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="48" y="67.5" width="176" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="123.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Service 1</text>
  <rect x="48" y="225" width="176" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="281.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Service 2</text>
  <rect x="48" y="382.5" width="176" height="90" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="136" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Service 3</text>
  <rect x="336" y="67.5" width="160" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="416" y="123.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Log Agent</text>
  <rect x="336" y="225" width="160" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="416" y="281.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Log Agent</text>
  <rect x="336" y="382.5" width="160" height="90" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="416" y="438.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Log Agent</text>
  <rect x="624" y="202.5" width="224" height="112.5" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="736" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8" font-weight="bold">Log Aggregator</text>
  <rect x="944" y="202.5" width="208" height="112.5" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="1048" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.2">Log Storage</text>
  <rect x="944" y="472.5" width="208" height="101.25" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="1048" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Query /</text>
  <text x="1048" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6">Dashboard</text>
  <line x1="224" y1="112.5" x2="332.8" y2="112.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="224" y1="270" x2="332.8" y2="270" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="224" y1="427.5" x2="332.8" y2="427.5" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="278.4" y="96.75" font-family="Arial, sans-serif" font-size="16" fill="var(--text-muted)">stdout</text>
  <line x1="496" y1="112.5" x2="620.8" y2="236.25" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="496" y1="270" x2="620.8" y2="258.75" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="496" y1="427.5" x2="620.8" y2="281.25" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="848" y1="258.75" x2="940.8" y2="258.75" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1048" y1="315" x2="1048" y2="468" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
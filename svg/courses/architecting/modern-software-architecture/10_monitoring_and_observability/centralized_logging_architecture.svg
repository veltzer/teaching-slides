<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="191.3043" height="103.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135.6522" y="104.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4259">Service 1</text>
  <rect x="40" y="220.4444" width="191.3043" height="103.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135.6522" y="284.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4259">Service 2</text>
  <rect x="40" y="400.8889" width="191.3043" height="103.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135.6522" y="465.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4259">Service 3</text>
  <rect x="353.0435" y="40" width="173.913" height="103.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="104.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404">Log Agent</text>
  <rect x="353.0435" y="220.4444" width="173.913" height="103.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="284.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404">Log Agent</text>
  <rect x="353.0435" y="400.8889" width="173.913" height="103.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="465.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404">Log Agent</text>
  <rect x="666.087" y="194.6667" width="243.4783" height="128.8889" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.8261" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2114" font-weight="bold">Log Aggregator</text>
  <rect x="1013.913" y="194.6667" width="226.087" height="128.8889" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.9565" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4259">Log Storage</text>
  <rect x="1013.913" y="504" width="226.087" height="116" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.9565" y="550.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404">Query /</text>
  <text x="1126.9565" y="591.6444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404">Dashboard</text>
  <line x1="231.3043" y1="91.5556" x2="349.5652" y2="91.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="231.3043" y1="272" x2="349.5652" y2="272" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="231.3043" y1="452.4444" x2="349.5652" y2="452.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="290.4348" y="73.5111" font-family="Arial, sans-serif" font-size="17.8549" fill="var(--text-muted)">stdout</text>
  <line x1="526.9565" y1="91.5556" x2="662.6087" y2="233.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="526.9565" y1="272" x2="662.6087" y2="259.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="526.9565" y1="452.4444" x2="662.6087" y2="284.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="909.5652" y1="259.1111" x2="1010.4348" y2="259.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1126.9565" y1="323.5556" x2="1126.9565" y2="498.8444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
</svg>
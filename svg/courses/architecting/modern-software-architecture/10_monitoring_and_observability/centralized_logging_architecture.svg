<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Services -->
  <rect x="30" y="30" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service 1</text>
  <rect x="30" y="100" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service 2</text>
  <rect x="30" y="170" width="110" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="85" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service 3</text>
  <!-- Log Agents -->
  <rect x="210" y="30" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="260" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Log Agent</text>
  <rect x="210" y="100" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="260" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Log Agent</text>
  <rect x="210" y="170" width="100" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="260" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Log Agent</text>
  <!-- Aggregator -->
  <rect x="390" y="90" width="140" height="50" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="460" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Log Aggregator</text>
  <!-- Storage -->
  <rect x="590" y="90" width="130" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="655" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Log Storage</text>
  <!-- Dashboard -->
  <rect x="590" y="210" width="130" height="45" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="655" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Query /</text>
  <text x="655" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">Dashboard</text>
  <!-- Arrows: services to agents -->
  <line x1="140" y1="50" x2="208" y2="50" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="120" x2="208" y2="120" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="190" x2="208" y2="190" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="174" y="43" font-family="Arial, sans-serif" font-size="9" fill="#666">stdout</text>
  <!-- Agents to aggregator -->
  <line x1="310" y1="50" x2="388" y2="105" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="310" y1="120" x2="388" y2="115" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="310" y1="190" x2="388" y2="125" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Aggregator to storage -->
  <line x1="530" y1="115" x2="588" y2="115" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <!-- Storage to dashboard -->
  <line x1="655" y1="140" x2="655" y2="208" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>

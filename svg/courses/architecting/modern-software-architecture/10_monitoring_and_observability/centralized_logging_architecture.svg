<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <metadata>
    <type>regular</type>
  </metadata>
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="191.3043" height="103.1111" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135.6522" y="104.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4259" fill="var(--primary-text)">Service 1</text>
  <rect x="40" y="220.4444" width="191.3043" height="103.1111" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135.6522" y="284.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4259" fill="var(--primary-text)">Service 2</text>
  <rect x="40" y="400.8889" width="191.3043" height="103.1111" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="135.6522" y="465.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4259" fill="var(--primary-text)">Service 3</text>
  <rect x="353.0435" y="40" width="173.913" height="103.1111" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="104.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404" fill="var(--warn-text)">Log Agent</text>
  <rect x="353.0435" y="220.4444" width="173.913" height="103.1111" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="284.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404" fill="var(--warn-text)">Log Agent</text>
  <rect x="353.0435" y="400.8889" width="173.913" height="103.1111" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="465.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404" fill="var(--warn-text)">Log Agent</text>
  <rect x="666.087" y="194.6667" width="243.4783" height="128.8889" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="787.8261" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="23.2114" font-weight="bold" fill="var(--ok-text)">Log Aggregator</text>
  <rect x="1013.913" y="194.6667" width="226.087" height="128.8889" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.9565" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="21.4259" fill="var(--primary-text)">Log Storage</text>
  <rect x="1013.913" y="504" width="226.087" height="116" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1126.9565" y="550.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404" fill="var(--ok-text)">Query /</text>
  <text x="1126.9565" y="591.6444" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.6404" fill="var(--ok-text)">Dashboard</text>
  <line x1="231.3043" y1="91.5556" x2="349.5652" y2="91.5556" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="231.3043" y1="272" x2="349.5652" y2="272" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="231.3043" y1="452.4444" x2="349.5652" y2="452.4444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290.4348" y="73.5111" font-family="Arial, sans-serif" font-size="17.8549" fill="var(--text-muted)">stdout</text>
  <line x1="526.9565" y1="91.5556" x2="662.6087" y2="233.3333" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="526.9565" y1="272" x2="662.6087" y2="259.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="526.9565" y1="452.4444" x2="662.6087" y2="284.8889" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="909.5652" y1="259.1111" x2="1010.4348" y2="259.1111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1126.9565" y1="323.5556" x2="1126.9565" y2="498.8444" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

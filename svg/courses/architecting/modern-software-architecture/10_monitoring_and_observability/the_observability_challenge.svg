<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="573.3334" y="40" width="266.6667" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="86.7741" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785">Client</text>
  <rect x="573.3334" y="170.9678" width="266.6667" height="74.8387" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="217.7419" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785">API Gateway</text>
  <rect x="211.4286" y="320.6452" width="228.5714" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.7144" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785">Service A</text>
  <rect x="592.3809" y="320.6452" width="228.5714" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785">Service B</text>
  <rect x="592.3809" y="470.3226" width="228.5714" height="74.8387" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785">Service C</text>
  <rect x="992.3809" y="470.3226" width="228.5714" height="74.8387" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6667" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785">Database</text>
  <rect x="40" y="470.3226" width="228.5714" height="74.8387" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="154.2858" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785">Cache</text>
  <rect x="992.3809" y="320.6452" width="247.6191" height="74.8387" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.1905" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785">Message Queue</text>
  <line x1="706.6667" y1="114.8388" x2="706.6667" y2="167.2258" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="630.4762" y1="245.8065" x2="363.8095" y2="316.9032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="706.6667" y1="245.8065" x2="706.6667" y2="316.9032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="325.7144" y1="395.4839" x2="588.5715" y2="489.0322" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="706.6667" y1="395.4839" x2="706.6667" y2="466.5806" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="820.9524" y1="507.742" x2="988.5715" y2="507.742" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="325.7144" y1="395.4839" x2="192.3809" y2="466.5806" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="820.9524" y1="358.0645" x2="988.5715" y2="358.0645" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="744.7619" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--danger-accent)" font-weight="bold">How do you trace a request across all these components?</text>
</svg>
<svg viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Client -->
  <rect x="310" y="20" width="140" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="380" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Client</text>
  <!-- API Gateway -->
  <rect x="310" y="90" width="140" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="380" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">API Gateway</text>
  <!-- Services -->
  <rect x="120" y="170" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="180" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service A</text>
  <rect x="320" y="170" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="380" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service B</text>
  <rect x="320" y="250" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="380" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Service C</text>
  <!-- Data stores -->
  <rect x="530" y="250" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="590" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Database</text>
  <rect x="30" y="250" width="120" height="40" rx="5" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="90" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Cache</text>
  <rect x="530" y="170" width="130" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="595" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Message Queue</text>
  <!-- Arrows -->
  <line x1="380" y1="60" x2="380" y2="88" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="340" y1="130" x2="200" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="130" x2="380" y2="168" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="180" y1="210" x2="318" y2="260" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="210" x2="380" y2="248" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="270" x2="528" y2="270" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="180" y1="210" x2="110" y2="248" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="190" x2="528" y2="190" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- Challenge label -->
  <text x="400" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dc3545" font-weight="bold">How do you trace a request across all these components?</text>
</svg>

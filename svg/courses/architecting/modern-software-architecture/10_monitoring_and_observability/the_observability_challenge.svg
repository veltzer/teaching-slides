<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,20.5714 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="467.6095" y="38.7879" width="211.1785" height="77.5757" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="573.1987" y="87.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Client</text>
  <rect x="467.6095" y="174.5455" width="211.1785" height="77.5757" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="573.1987" y="223.0303" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">API Gateway</text>
  <rect x="181.0101" y="329.697" width="181.0101" height="77.5757" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="271.5152" y="378.1819" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Service A</text>
  <rect x="482.6936" y="329.697" width="181.0101" height="77.5757" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="573.1987" y="378.1819" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Service B</text>
  <rect x="482.6936" y="484.8485" width="181.0101" height="77.5757" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="573.1987" y="533.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Service C</text>
  <rect x="799.4613" y="484.8485" width="181.0101" height="77.5757" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="889.9664" y="533.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Database</text>
  <rect x="45.2525" y="484.8485" width="181.0101" height="77.5757" rx="6" fill="var(--danger-fill)" stroke="var(--danger-border)" stroke-width="2" />
  <text x="135.7576" y="533.3334" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Cache</text>
  <rect x="799.4613" y="329.697" width="196.0943" height="77.5757" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="897.5085" y="378.1819" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101">Message Queue</text>
  <line x1="573.1987" y1="116.3637" x2="573.1987" y2="170.6667" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="512.862" y1="252.1213" x2="301.6835" y2="325.8182" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="573.1987" y1="252.1213" x2="573.1987" y2="325.8182" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="271.5152" y1="407.2728" x2="479.6768" y2="504.2424" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="573.1987" y1="407.2728" x2="573.1987" y2="480.9697" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="663.7037" y1="523.6364" x2="796.4445" y2="523.6364" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="271.5152" y1="407.2728" x2="165.9259" y2="480.9697" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="663.7037" y1="368.4848" x2="796.4445" y2="368.4848" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="603.367" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.101" fill="var(--danger-accent)" font-weight="bold">How do you trace a request across all these components?</text>
</svg>
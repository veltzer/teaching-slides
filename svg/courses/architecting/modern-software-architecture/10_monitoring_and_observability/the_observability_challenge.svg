<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="573.3334" y="40" width="266.6667" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="86.7741" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--primary-text)">Client</text>
  <rect x="573.3334" y="170.9678" width="266.6667" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="217.7419" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--warn-text)">API Gateway</text>
  <rect x="211.4286" y="320.6452" width="228.5714" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="325.7144" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--ok-text)">Service A</text>
  <rect x="592.3809" y="320.6452" width="228.5714" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--ok-text)">Service B</text>
  <rect x="592.3809" y="470.3226" width="228.5714" height="74.8387" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="706.6667" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--ok-text)">Service C</text>
  <rect x="992.3809" y="470.3226" width="228.5714" height="74.8387" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1106.6667" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--primary-text)">Database</text>
  <rect x="40" y="470.3226" width="228.5714" height="74.8387" rx="6" fill="url(#grad-danger)" stroke="var(--danger-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="154.2858" y="517.0968" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--danger-text)">Cache</text>
  <rect x="992.3809" y="320.6452" width="247.6191" height="74.8387" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1116.1905" y="367.4194" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--warn-text)">Message Queue</text>
  <line x1="706.6667" y1="114.8388" x2="706.6667" y2="167.2258" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630.4762" y1="245.8065" x2="363.8095" y2="316.9032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="706.6667" y1="245.8065" x2="706.6667" y2="316.9032" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325.7144" y1="395.4839" x2="588.5715" y2="489.0322" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="706.6667" y1="395.4839" x2="706.6667" y2="466.5806" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820.9524" y1="507.742" x2="988.5715" y2="507.742" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325.7144" y1="395.4839" x2="192.3809" y2="466.5806" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820.9524" y1="358.0645" x2="988.5715" y2="358.0645" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="744.7619" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.9785" fill="var(--danger-accent)" font-weight="bold">How do you trace a request across all these components?</text>
</svg>

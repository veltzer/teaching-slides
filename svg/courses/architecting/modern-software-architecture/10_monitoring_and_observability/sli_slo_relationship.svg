<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>

    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  
    <marker id="arrowhead" markerWidth="16" markerHeight="18" refX="16" refY="9" orient="auto">
      <polygon points="0,25.7143 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="48" y="102.8571" width="320" height="115.7143" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="208" y="149.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" font-weight="bold">SLI: Latency</text>
  <text x="208" y="192.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">p99 = 180ms</text>
  <rect x="48" y="360" width="320" height="115.7143" rx="8" fill="#e8f4f8" stroke="#4a90e2" stroke-width="3.2" />
  <text x="208" y="406.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" font-weight="bold">SLI: Error Rate</text>
  <text x="208" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">= 0.05%</text>
  <rect x="496" y="102.8571" width="320" height="115.7143" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="656" y="149.1429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" font-weight="bold">SLO: Latency</text>
  <text x="656" y="192.8571" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">p99 &lt; 200ms</text>
  <rect x="496" y="360" width="320" height="115.7143" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="3.2" />
  <text x="656" y="406.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" font-weight="bold">SLO: Error Rate</text>
  <text x="656" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">&lt; 0.1%</text>
  <rect x="928" y="231.4286" width="288" height="128.5714" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="3.2" />
  <text x="1072" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" font-weight="bold">SLA</text>
  <text x="1072" y="334.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">99.9% within SLO</text>
  <line x1="368" y1="159.4286" x2="492.8" y2="159.4286" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="368" y1="416.5714" x2="492.8" y2="416.5714" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="816" y1="159.4286" x2="924.8" y2="270" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <line x1="816" y1="416.5714" x2="924.8" y2="321.4286" stroke="#4a90e2" stroke-width="3.2" marker-end="url(#arrow)" />
  <text x="208" y="604.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#4a90e2" font-weight="bold">Measure</text>
  <text x="656" y="604.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#28a745" font-weight="bold">Target</text>
  <text x="1072" y="604.2857" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6" fill="#ffc107" font-weight="bold">Agreement</text>
</svg>
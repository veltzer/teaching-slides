<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,25.7143 5.6,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="40" width="328.7671" height="133.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.3836" y="93.5386" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1863" font-weight="bold">SLI: Latency</text>
  <text x="204.3836" y="144.1026" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4421" fill="var(--text-muted)">p99 = 180ms</text>
  <rect x="40" y="337.4359" width="328.7671" height="133.8462" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="204.3836" y="390.9744" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1863" font-weight="bold">SLI: Error Rate</text>
  <text x="204.3836" y="441.5385" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4421" fill="var(--text-muted)">= 0.05%</text>
  <rect x="500.274" y="40" width="328.7671" height="133.8462" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="664.6575" y="93.5386" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1863" font-weight="bold">SLO: Latency</text>
  <text x="664.6575" y="144.1026" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4421" fill="var(--text-muted)">p99 &lt; 200ms</text>
  <rect x="500.274" y="337.4359" width="328.7671" height="133.8462" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="664.6575" y="390.9744" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1863" font-weight="bold">SLO: Error Rate</text>
  <text x="664.6575" y="441.5385" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4421" fill="var(--text-muted)">&lt; 0.1%</text>
  <rect x="944.1096" y="188.718" width="295.8904" height="148.7179" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1092.0548" y="254.1539" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1863" font-weight="bold">SLA</text>
  <text x="1092.0548" y="307.6923" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.4421" fill="var(--text-muted)">99.9% within SLO</text>
  <line x1="368.7671" y1="105.436" x2="496.9863" y2="105.436" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="368.7671" y1="402.8718" x2="496.9863" y2="402.8718" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="829.0411" y1="105.436" x2="940.8219" y2="233.3334" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="829.0411" y1="402.8718" x2="940.8219" y2="292.8206" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="204.3836" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1863" fill="var(--primary-accent)" font-weight="bold">Measure</text>
  <text x="664.6575" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1863" fill="var(--ok-accent)" font-weight="bold">Target</text>
  <text x="1092.0548" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1863" fill="var(--warn-accent)" font-weight="bold">Agreement</text>
</svg>
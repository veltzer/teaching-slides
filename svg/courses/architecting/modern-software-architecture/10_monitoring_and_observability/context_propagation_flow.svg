<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="background:var(--bg)">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #c4cdd6;
        --border: #6b7280;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000044;
        --black: #000000;
        --primary-fill: #5a7a9c;
        --primary-border: #3d5a7d;
        --primary-text: #ffffff;
        --primary-accent: #243b59;
        --ok-fill: #7a9a6a;
        --ok-border: #5a7a4d;
        --ok-text: #ffffff;
        --ok-accent: #385030;
        --warn-fill: #c8924a;
        --warn-border: #9c6e2e;
        --warn-text: #ffffff;
        --warn-accent: #5a3f12;
        --danger-fill: #a86058;
        --danger-border: #7d3f38;
        --danger-text: #ffffff;
        --danger-accent: #4a1f1a;
        --info-fill: #7c6a8e;
        --info-border: #574a68;
        --info-text: #ffffff;
        --info-accent: #2f253b;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7493b3"/>
      <stop offset="100%" stop-color="#3d5a7d"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4cdd6"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94b384"/>
      <stop offset="100%" stop-color="#5a7a4d"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dba868"/>
      <stop offset="100%" stop-color="#9c6e2e"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bd7d75"/>
      <stop offset="100%" stop-color="#7d3f38"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9384a5"/>
      <stop offset="100%" stop-color="#574a68"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000044"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#3d5a7d"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#5a7a4d"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#9c6e2e"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#7d3f38"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#574a68"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect x="40" y="40" width="236.0655" height="68.2353" rx="6" fill="url(#grad-primary)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="158.0328" y="82.6471" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6018" font-weight="bold" fill="var(--primary-text)">Service A</text>
  <rect x="492.459" y="40" width="236.0655" height="68.2353" rx="6" fill="url(#grad-ok)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="610.4918" y="82.6471" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6018" font-weight="bold" fill="var(--ok-text)">Service B</text>
  <rect x="944.9181" y="40" width="236.0655" height="68.2353" rx="6" fill="url(#grad-warn)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1062.9508" y="82.6471" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.6018" font-weight="bold" fill="var(--warn-text)">Service C</text>
  <line x1="158.0328" y1="108.2354" x2="158.0328" y2="620" stroke="var(--text-faint)" stroke-width="1.6013" stroke-dasharray="6.4053"/>
  <line x1="610.4918" y1="108.2354" x2="610.4918" y2="620" stroke="var(--text-faint)" stroke-width="1.6013" stroke-dasharray="6.4053"/>
  <line x1="1062.9508" y1="108.2354" x2="1062.9508" y2="620" stroke="var(--text-faint)" stroke-width="1.6013" stroke-dasharray="6.4053"/>
  <line x1="167.869" y1="176.4707" x2="600.6557" y2="176.4707" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="384.2624" y="164.5294" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3861" fill="var(--text)">Request + traceparent</text>
  <rect x="433.4427" y="210.5882" width="354.0983" height="59.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="610.4918" y="236.1765" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3861" fill="var(--text)">Extract context,</text>
  <text x="610.4918" y="258.353" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3861" fill="var(--text)">create child span</text>
  <line x1="620.3279" y1="304.4117" x2="1053.1148" y2="304.4117" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="836.7213" y="292.4707" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3861" fill="var(--text)">Request + traceparent</text>
  <rect x="885.9017" y="338.5295" width="354.0983" height="59.7059" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="1062.9508" y="364.1176" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3861" fill="var(--text)">Extract context,</text>
  <text x="1062.9508" y="386.2941" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3861" fill="var(--text)">create child span</text>
  <line x1="1053.1148" y1="449.4118" x2="620.3279" y2="449.4118" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.0066" marker-end="url(#arrow-ok)"/>
  <text x="836.7213" y="437.4705" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3861" fill="var(--ok-accent)">Response</text>
  <line x1="600.6557" y1="517.647" x2="167.869" y2="517.647" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.0066" marker-end="url(#arrow-ok)"/>
  <text x="384.2624" y="505.7059" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.3861" fill="var(--ok-accent)">Response</text>
  <text x="620.3279" y="611.4706" text-anchor="middle" font-family="Arial, sans-serif" font-size="19.1246" fill="var(--text-muted)">Trace context propagated via HTTP headers across service boundaries</text>
</svg>

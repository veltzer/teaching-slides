<svg viewBox="0 0 750 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#28a745"/>
    </marker>
  </defs>
  <!-- Service boxes -->
  <rect x="80" y="20" width="120" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Service A</text>
  <rect x="310" y="20" width="120" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="370" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Service B</text>
  <rect x="540" y="20" width="120" height="40" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="600" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Service C</text>
  <!-- Lifelines -->
  <line x1="140" y1="60" x2="140" y2="360" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
  <line x1="370" y1="60" x2="370" y2="360" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
  <line x1="600" y1="60" x2="600" y2="360" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
  <!-- A to B request -->
  <line x1="145" y1="100" x2="365" y2="100" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="255" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Request + traceparent</text>
  <!-- Note at B -->
  <rect x="280" y="120" width="180" height="35" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="370" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Extract context,</text>
  <text x="370" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">create child span</text>
  <!-- B to C request -->
  <line x1="375" y1="175" x2="595" y2="175" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="485" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Request + traceparent</text>
  <!-- Note at C -->
  <rect x="510" y="195" width="180" height="35" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Extract context,</text>
  <text x="600" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">create child span</text>
  <!-- Responses -->
  <line x1="595" y1="260" x2="375" y2="260" stroke="#28a745" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrowgreen)"/>
  <text x="485" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Response</text>
  <line x1="365" y1="300" x2="145" y2="300" stroke="#28a745" stroke-width="2" stroke-dasharray="5" marker-end="url(#arrowgreen)"/>
  <text x="255" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#28a745">Response</text>
  <!-- Label -->
  <text x="375" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#666">Trace context propagated via HTTP headers across service boundaries</text>
</svg>

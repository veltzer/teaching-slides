<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#4a90e2" />
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,18.9474 5.9733,0" fill="#28a745" />
    </marker>
  </defs>
  <rect x="128.1053" y="35.5555" width="192.158" height="71.1111" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" />
  <text x="224.1843" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8171" font-weight="bold">Service A</text>
  <rect x="496.4082" y="35.5555" width="192.158" height="71.1111" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" />
  <text x="592.4872" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8171" font-weight="bold">Service B</text>
  <rect x="864.7111" y="35.5555" width="192.158" height="71.1111" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" />
  <text x="960.7901" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20.8171" font-weight="bold">Service C</text>
  <line x1="224.1843" y1="106.6667" x2="224.1843" y2="640" stroke="var(--text-faint)" stroke-width="1.6013" stroke-dasharray="6.4053" />
  <line x1="592.4872" y1="106.6667" x2="592.4872" y2="640" stroke="var(--text-faint)" stroke-width="1.6013" stroke-dasharray="6.4053" />
  <line x1="960.7901" y1="106.6667" x2="960.7901" y2="640" stroke="var(--text-faint)" stroke-width="1.6013" stroke-dasharray="6.4053" />
  <line x1="232.191" y1="177.7778" x2="584.4806" y2="177.7778" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="408.3358" y="165.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0132">Request + traceparent</text>
  <rect x="448.3687" y="213.3333" width="288.237" height="62.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="592.4872" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0132">Extract context,</text>
  <text x="592.4872" y="263.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0132">create child span</text>
  <line x1="600.4938" y1="311.111" x2="952.7835" y2="311.111" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="776.6386" y="298.6667" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0132">Request + traceparent</text>
  <rect x="816.6716" y="346.6667" width="288.237" height="62.2222" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
  <text x="960.7901" y="373.3333" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0132">Extract context,</text>
  <text x="960.7901" y="396.4444" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0132">create child span</text>
  <line x1="952.7835" y1="462.2222" x2="600.4938" y2="462.2222" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.0066" marker-end="url(#arrow-ok)" />
  <text x="776.6386" y="449.7777" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0132" fill="var(--ok-accent)">Response</text>
  <line x1="584.4806" y1="533.3333" x2="232.191" y2="533.3333" stroke="var(--ok-border)" stroke-width="2" stroke-dasharray="8.0066" marker-end="url(#arrow-ok)" />
  <text x="408.3358" y="520.8889" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.0132" fill="var(--ok-accent)">Response</text>
  <text x="600.4938" y="631.1111" text-anchor="middle" font-family="Arial, sans-serif" font-size="17.6145" fill="var(--text-muted)">Trace context propagated via HTTP headers across service boundaries</text>
</svg>
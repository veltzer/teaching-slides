<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- palette: resources/palette_diagram.yaml -->
  <defs>
    <style id="palette-vars">
      :root, svg {
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e0e0e0;
        --text: #212121;
        --text-muted: #555555;
        --text-faint: #888888;
        --code-bg: #1a1a2e;
        --shadow: #00000022;
        --black: #000000;
        --primary-fill: #2196f3;
        --primary-border: #1565c0;
        --primary-text: #ffffff;
        --primary-accent: #0d47a1;
        --ok-fill: #4caf50;
        --ok-border: #2e7d32;
        --ok-text: #ffffff;
        --ok-accent: #1b5e20;
        --warn-fill: #ff9800;
        --warn-border: #e65100;
        --warn-text: #ffffff;
        --warn-accent: #bf360c;
        --danger-fill: #e74c3c;
        --danger-border: #c62828;
        --danger-text: #ffffff;
        --danger-accent: #b71c1c;
        --info-fill: #9c27b0;
        --info-border: #6a1b9a;
        --info-text: #ffffff;
        --info-accent: #4a148c;
      }
    </style>
    <!-- Gradients -->
    <linearGradient id="grad-primary" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196f3"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>

    <linearGradient id="grad-surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5"/>
    </linearGradient>

    <linearGradient id="grad-ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>

    <linearGradient id="grad-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>

    <linearGradient id="grad-info" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrow-warn" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#e65100"/>
    </marker>
    <marker id="arrow-danger" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#c62828"/>
    </marker>
    <marker id="arrow-info" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-white" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,2 L9,5 L1,8 Z" fill="#ffffff"/>
    </marker>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,22.5 5.9733,0" fill="#4a90e2" />
    </marker>
  </defs>
  <rect x="40" y="277.2727" width="322.3881" height="131.8182" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="201.194" y="335.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102" font-weight="bold">Application</text>
  <text x="201.194" y="377.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9252" fill="var(--text-muted)">+ OTel SDK</text>
  <rect x="505.6716" y="250.9091" width="286.5672" height="158.1818" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="648.9553" y="322.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="24.6027" font-weight="bold">OTel Collector</text>
  <text x="648.9553" y="374.8182" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9252" fill="var(--text-muted)">Receive, Process, Export</text>
  <rect x="989.2538" y="40" width="250.7462" height="105.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.6269" y="105.9091" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102">Jaeger (Traces)</text>
  <rect x="989.2538" y="198.1818" width="250.7462" height="105.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.6269" y="264.0909" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102">Prometheus</text>
  <rect x="989.2538" y="356.3636" width="250.7462" height="105.4545" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.6269" y="422.2727" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102">Loki (Logs)</text>
  <rect x="989.2538" y="514.5455" width="250.7462" height="105.4545" rx="6" fill="var(--primary-fill)" stroke="var(--primary-border)" stroke-width="2" filter="url(#shadow)"/>
  <text x="1114.6269" y="580.4545" text-anchor="middle" font-family="Arial, sans-serif" font-size="22.7102">Vendor Backend</text>
  <line x1="362.3881" y1="343.1818" x2="502.0896" y2="330" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="432.2388" y="311.5455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18.9252" fill="var(--text-muted)">OTLP</text>
  <line x1="792.2388" y1="290.4545" x2="985.6717" y2="92.7273" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="792.2388" y1="311.5455" x2="985.6717" y2="250.9091" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="792.2388" y1="343.1818" x2="985.6717" y2="409.0909" stroke="var(--ok-border)" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="792.2388" y1="369.5455" x2="985.6717" y2="567.2727" stroke="var(--primary-border)" stroke-width="2" marker-end="url(#arrow)" />
  <text x="899.7015" y="224.5455" font-family="Arial, sans-serif" font-size="18.9252" fill="var(--text-muted)">Export</text>
</svg>
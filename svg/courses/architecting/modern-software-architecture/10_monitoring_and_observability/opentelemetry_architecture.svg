<svg viewBox="0 0 750 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2"/>
    </marker>
  </defs>
  <!-- Application + SDK -->
  <rect x="30" y="120" width="180" height="50" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="120" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Application</text>
  <text x="120" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">+ OTel SDK</text>
  <!-- Collector -->
  <rect x="290" y="110" width="160" height="60" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="370" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold">OTel Collector</text>
  <text x="370" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Receive, Process, Export</text>
  <!-- Backends -->
  <rect x="560" y="30" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Jaeger (Traces)</text>
  <rect x="560" y="90" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Prometheus</text>
  <rect x="560" y="150" width="140" height="40" rx="5" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="630" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Loki (Logs)</text>
  <rect x="560" y="210" width="140" height="40" rx="5" fill="#e8f4f8" stroke="#4a90e2" stroke-width="2"/>
  <text x="630" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">Vendor Backend</text>
  <!-- Arrows -->
  <line x1="210" y1="145" x2="288" y2="140" stroke="#4a90e2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="249" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">OTLP</text>
  <line x1="450" y1="125" x2="558" y2="50" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="133" x2="558" y2="110" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="145" x2="558" y2="170" stroke="#28a745" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="155" x2="558" y2="230" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="510" y="100" font-family="Arial, sans-serif" font-size="9" fill="#666">Export</text>
</svg>

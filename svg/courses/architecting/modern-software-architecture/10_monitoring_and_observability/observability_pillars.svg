  <rect x="483.4374" y="362.2223" width="313.125" height="20.9444" rx="6" fill="var(--bg)" />
  <text x="640" y="376.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Access logs (who, when)</text>

  <text x="1031.8749" y="323.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Gateway → 250ms total</text>
  <rect x="872.4999" y="333.2223" width="206.25" height="17.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="975.625" y="346.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Auth svc → 80ms</text>
  <rect x="872.4999" y="355.7777" width="262.5" height="17.7223" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2"/>
  <text x="1003.75" y="368.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Orders svc → 140ms</text>

  <ns0:rect width="1137.7778" height="640" fill="#ffffff" />
  <ns0:rect x="26.6667" y="12.4444" width="1084.4444" height="40.8889" rx="7.1111" fill="url(#grad-accent)" />
  <ns0:text x="568.8889" y="39.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="17.7778" font-weight="bold" fill="#ffffff">The Three Pillars of Observability</ns0:text>
  <ns0:rect x="35.5556" y="71.1111" width="328.8889" height="426.6667" rx="8.8889" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="35.5556" y="71.1111" width="328.8889" height="44.4444" rx="8.8889" fill="#1565c0" />
  <ns0:rect x="35.5556" y="103.1111" width="328.8889" height="12.4444" fill="#1565c0" />
  <ns0:text x="200" y="103.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="#ffffff">Metrics</ns0:text>
  <ns0:text x="200" y="137.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">What is it?</ns0:text>
  <ns0:text x="200" y="158.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Numeric measurements over time</ns0:text>
  <ns0:text x="200" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Aggregated, time-series data</ns0:text>
  <ns0:text x="200" y="204.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">What it reveals</ns0:text>
  <ns0:text x="200" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Is the system healthy?</ns0:text>
  <ns0:text x="200" y="241.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Where is the bottleneck?</ns0:text>
  <ns0:text x="200" y="259.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Are SLOs being met?</ns0:text>
  <ns0:text x="200" y="288.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Examples</ns0:text>
  <ns0:rect x="51.5556" y="298.6667" width="296.8889" height="23.1111" rx="3.5556" fill="#ffffff" />
  <ns0:text x="200" y="314.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">CPU / Memory / Disk usage</ns0:text>
  <ns0:rect x="51.5556" y="327.1111" width="296.8889" height="23.1111" rx="3.5556" fill="#ffffff" />
  <ns0:text x="200" y="343.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">HTTP request rate &amp; latency</ns0:text>
  <ns0:rect x="51.5556" y="355.5556" width="296.8889" height="23.1111" rx="3.5556" fill="#ffffff" />
  <ns0:text x="200" y="371.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Error rate (4xx / 5xx %)</ns0:text>
  <ns0:rect x="51.5556" y="384" width="296.8889" height="23.1111" rx="3.5556" fill="#ffffff" />
  <ns0:text x="200" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Queue depth, DB connections</ns0:text>
  <ns0:text x="200" y="435.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#1565c0">Tools</ns0:text>
  <ns0:rect x="51.5556" y="444.4444" width="137.7778" height="39.1111" rx="5.3333" fill="#ffffff" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="120" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="#212121">Prometheus</ns0:text>
  <ns0:rect x="200" y="444.4444" width="137.7778" height="39.1111" rx="5.3333" fill="#ffffff" stroke="#1565c0" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="268.4444" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" fill="#212121">Grafana</ns0:text>
  <ns0:rect x="404.4444" y="71.1111" width="328.8889" height="426.6667" rx="8.8889" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="404.4444" y="71.1111" width="328.8889" height="44.4444" rx="8.8889" fill="#2e7d32" />
  <ns0:rect x="404.4444" y="103.1111" width="328.8889" height="12.4444" fill="#2e7d32" />
  <ns0:text x="568.8889" y="103.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="#ffffff">Logs</ns0:text>
  <ns0:text x="568.8889" y="137.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">What is it?</ns0:text>
  <ns0:text x="568.8889" y="158.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Timestamped text/JSON records</ns0:text>
  <ns0:text x="568.8889" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Events as they happen</ns0:text>
  <ns0:text x="568.8889" y="204.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">What it reveals</ns0:text>
  <ns0:text x="568.8889" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">What exactly happened?</ns0:text>
  <ns0:text x="568.8889" y="241.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">What error was thrown?</ns0:text>
  <ns0:text x="568.8889" y="259.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Who did what, when?</ns0:text>
  <ns0:text x="568.8889" y="288.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Examples</ns0:text>
  <ns0:rect x="420.4444" y="298.6667" width="296.8889" height="23.1111" rx="3.5556" fill="#ffffff" />
  <ns0:text x="568.8889" y="314.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Application error stack traces</ns0:text>
  <ns0:rect x="420.4444" y="327.1111" width="296.8889" height="23.1111" rx="3.5556" fill="#ffffff" />
  <ns0:text x="568.8889" y="343.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Audit logs (user actions)</ns0:text>
  <ns0:rect x="420.4444" y="355.5556" width="296.8889" height="23.1111" rx="3.5556" fill="#ffffff" />
  <ns0:text x="568.8889" y="371.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Access logs (who, when)</ns0:text>
  <ns0:rect x="420.4444" y="384" width="296.8889" height="23.1111" rx="3.5556" fill="#ffffff" />
  <ns0:text x="568.8889" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Structured JSON events</ns0:text>
  <ns0:text x="568.8889" y="435.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#2e7d32">Tools</ns0:text>
  <ns0:rect x="420.4444" y="444.4444" width="88.8889" height="39.1111" rx="5.3333" fill="#ffffff" stroke="#2e7d32" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="464.8889" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">ELK Stack</ns0:text>
  <ns0:rect x="518.2222" y="444.4444" width="88.8889" height="39.1111" rx="5.3333" fill="#ffffff" stroke="#2e7d32" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="562.6667" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Loki</ns0:text>
  <ns0:rect x="616" y="444.4444" width="88.8889" height="39.1111" rx="5.3333" fill="#ffffff" stroke="#2e7d32" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="660.4444" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Splunk</ns0:text>
  <ns0:rect x="773.3333" y="71.1111" width="333.3333" height="426.6667" rx="8.8889" fill="#fff3e0" stroke="#e65100" stroke-width="2.2222" filter="url(#shadow)" />
  <ns0:rect x="773.3333" y="71.1111" width="333.3333" height="44.4444" rx="8.8889" fill="#e65100" />
  <ns0:rect x="773.3333" y="103.1111" width="333.3333" height="12.4444" fill="#e65100" />
  <ns0:text x="939.5556" y="103.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.5556" font-weight="bold" fill="#ffffff">Traces</ns0:text>
  <ns0:text x="939.5556" y="137.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100">What is it?</ns0:text>
  <ns0:text x="939.5556" y="158.2222" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">End-to-end request journey</ns0:text>
  <ns0:text x="939.5556" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Spans across services</ns0:text>
  <ns0:text x="939.5556" y="204.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100">What it reveals</ns0:text>
  <ns0:text x="939.5556" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Where was the latency?</ns0:text>
  <ns0:text x="939.5556" y="241.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Which service failed?</ns0:text>
  <ns0:text x="939.5556" y="259.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">How do services interact?</ns0:text>
  <ns0:text x="939.5556" y="288.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100">Examples</ns0:text>
  <ns0:rect x="789.3333" y="298.6667" width="302.2222" height="19.5556" rx="2.6667" fill="#ffcc80" />
  <ns0:text x="940.4444" y="312.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#212121">Gateway → 250ms total</ns0:text>
  <ns0:rect x="789.3333" y="323.5556" width="195.5556" height="19.5556" rx="2.6667" fill="#ffe0b2" />
  <ns0:text x="887.1111" y="337.7778" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#212121">Auth svc → 80ms</ns0:text>
  <ns0:rect x="789.3333" y="348.4444" width="248.8889" height="19.5556" rx="2.6667" fill="#ffb74d" />
  <ns0:text x="913.7778" y="362.6667" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#212121">Orders svc → 140ms</ns0:text>
  <ns0:rect x="789.3333" y="373.3333" width="160" height="19.5556" rx="2.6667" fill="#ff9800" />
  <ns0:text x="869.3333" y="387.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#ffffff">DB query → 100ms</ns0:text>
  <ns0:rect x="789.3333" y="398.2222" width="88.8889" height="19.5556" rx="2.6667" fill="#e65100" />
  <ns0:text x="833.7778" y="412.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ffffff">Cache → 20ms</ns0:text>
  <ns0:text x="939.5556" y="435.5556" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#e65100">Tools</ns0:text>
  <ns0:rect x="789.3333" y="444.4444" width="93.3333" height="39.1111" rx="5.3333" fill="#ffffff" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="835.5556" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Jaeger</ns0:text>
  <ns0:rect x="891.5556" y="444.4444" width="93.3333" height="39.1111" rx="5.3333" fill="#ffffff" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="937.7778" y="469.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#212121">Zipkin</ns0:text>
  <ns0:rect x="993.7778" y="444.4444" width="102.2222" height="39.1111" rx="5.3333" fill="#ffffff" stroke="#e65100" stroke-width="1.3333" filter="url(#shadow)" />
  <ns0:text x="1044.4444" y="461.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#212121">Open</ns0:text>
  <ns0:text x="1044.4444" y="477.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.6667" fill="#212121">Telemetry</ns0:text>
  <ns0:rect x="35.5556" y="517.3333" width="1066.6667" height="44.4444" rx="7.1111" fill="#f2f2f2" />
  <ns0:text x="568.8889" y="535.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.4444" font-weight="bold" fill="#212121">Together: Metrics tell you WHEN, Logs tell you WHAT, Traces tell you WHERE across services</ns0:text>
  <ns0:text x="568.8889" y="552.8889" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5556" fill="#555555">Unified with correlation IDs → OpenTelemetry standard — instrument once, export anywhere</ns0:text>
</ns0:svg>
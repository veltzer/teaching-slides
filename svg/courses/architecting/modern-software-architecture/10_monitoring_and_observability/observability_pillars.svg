  <text x="640" y="133.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">Logs</text>
  <text x="640" y="164.8611" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">What is it?</text>
  <text x="640" y="183.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Timestamped text/JSON records</text>
  <text x="640" y="199.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Events as they happen</text>
  <text x="640" y="225.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">What it reveals</text>
  <text x="640" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">What exactly happened?</text>
  <text x="640" y="259.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">What error was thrown?</text>
  <text x="640" y="275.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Who did what, when?</text>
  <text x="640" y="301.8056" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">Examples</text>

  <rect x="980.3125" y="442.7777" width="98.4375" height="35.4444" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="1029.0625" y="465.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Zipkin</text>
  <rect x="1088.125" y="442.7777" width="107.8125" height="35.4444" rx="6" fill="var(--bg)" stroke="var(--warn-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="1141.5624" y="458.0833" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Open</text>
  <text x="1141.5624" y="472.5833" text-anchor="middle" font-family="Arial,sans-serif" font-size="10.4284" fill="var(--text)">Telemetry</text>
  <rect x="77.5" y="508.8333" width="1125" height="40.2777" rx="6" fill="var(--surface)" />
  <text x="640" y="524.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--text)">Together: Metrics tell you WHEN, Logs tell you WHAT, Traces tell you WHERE across services</text>
  <text x="640" y="541.0556" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text-muted)">Unified with correlation IDs → OpenTelemetry standard — instrument once, export anywhere</text>
</svg>
  <text x="250.9375" y="325.1667" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">CPU / Memory / Disk usage</text>
  <rect x="94.375" y="336.4444" width="313.125" height="20.9444" rx="6" fill="var(--bg)" />
  <text x="250.9375" y="350.9444" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">HTTP request rate &amp; latency</text>
  <rect x="94.375" y="362.2223" width="313.125" height="20.9444" rx="6" fill="var(--bg)" />
  <text x="250.9375" y="376.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Error rate (4xx / 5xx %)</text>
  <rect x="94.375" y="388" width="313.125" height="20.9444" rx="6" fill="var(--bg)" />
  <text x="250.9375" y="402.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Queue depth, DB connections</text>
  <text x="250.9375" y="434.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--primary-accent)">Tools</text>
  <rect x="94.375" y="442.7777" width="145.3125" height="35.4444" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="166.5625" y="465.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--text)">Prometheus</text>
  <rect x="250.9375" y="442.7777" width="145.3125" height="35.4444" rx="6" fill="var(--bg)" stroke="var(--primary-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="323.1249" y="465.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" fill="var(--text)">Grafana</text>
  <rect x="466.5624" y="104.4444" width="346.875" height="386.6667" rx="6" fill="var(--ok-fill)" stroke="var(--ok-border)" stroke-width="2" filter="url(#shadow)" />

  <text x="640" y="402.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Structured JSON events</text>
  <text x="640" y="434.7223" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--ok-accent)">Tools</text>
  <rect x="483.4374" y="442.7777" width="93.75" height="35.4444" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="530.3125" y="465.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">ELK Stack</text>
  <rect x="586.5625" y="442.7777" width="93.75" height="35.4444" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="633.4375" y="465.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Loki</text>
  <rect x="689.6875" y="442.7777" width="93.75" height="35.4444" rx="6" fill="var(--bg)" stroke="var(--ok-border)" stroke-width="1.3333" filter="url(#shadow)" />
  <text x="736.5624" y="465.3333" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Splunk</text>
  <rect x="855.6249" y="104.4444" width="351.5625" height="386.6667" rx="6" fill="var(--warn-fill)" stroke="var(--warn-border)" stroke-width="2" filter="url(#shadow)" />
  <rect x="855.6249" y="104.4444" width="351.5625" height="40.2777" rx="6" fill="var(--warn-accent)" />
  <rect x="855.6249" y="133.4444" width="351.5625" height="11.2777" fill="var(--warn-accent)" rx="6"/>
  <text x="1030.9375" y="133.4444" text-anchor="middle" font-family="Arial,sans-serif" font-size="19.1186" font-weight="bold" fill="var(--bg)">Traces</text>
  <text x="1030.9375" y="164.8611" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">What is it?</text>
  <text x="1030.9375" y="183.3889" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">End-to-end request journey</text>
  <text x="1030.9375" y="199.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Spans across services</text>
  <text x="1030.9375" y="225.2777" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">What it reveals</text>
  <text x="1030.9375" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Where was the latency?</text>
  <text x="1030.9375" y="259.1111" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">Which service failed?</text>
  <text x="1030.9375" y="275.2223" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.2974" fill="var(--text)">How do services interact?</text>
  <text x="1030.9375" y="301.8056" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.1663" font-weight="bold" fill="var(--warn-accent)">Examples</text>
